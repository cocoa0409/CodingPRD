  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: truck_pickup_windows_half_open_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=18]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
          - entities.DonationOffer.fields.pickup_window_start
          - entities.DonationOffer.fields.pickup_window_end
          - state_machines.DonationOffer.TRIAGED_to_PICKUP_SCHEDULED
        distinguishing_aspect: |
          Truck is the contested resource and the interval arithmetic is half-open [start,end)
          with zero buffer: a pickup starting at exactly 12:00:00Z against one ending at exactly
          12:00:00Z is accepted, while a pickup spanning 11:00-13:00Z is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "Truck BOX-10 (capacity 600, crew_minimum 1) with no bed-bug lockout and no runs."
            - "Offer A (one DRESSER, B, 20.0 cf) TRIAGED and already PICKUP_SCHEDULED on BOX-10 for 2026-08-05T10:00:00Z-12:00:00Z."
            - "Offer B (one DRESSER, B, 20.0 cf) TRIAGED with window 2026-08-05T12:00:00Z-14:00:00Z, touching A's end exactly."
            - "Offer C (one DRESSER, B, 20.0 cf) TRIAGED with window 2026-08-05T11:00:00Z-13:00:00Z, genuinely overlapping A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { label: "BOX-10", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Donor A", donor_phone: "555-0301", pickup_county: "CENTRAL", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", items: [ { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 20.0 } ] }
              as: IntakeCoordinator
              captures: { off_a: "$.data.id" }
            - call: "POST /donation-offers/${off_a}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_a}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "POST /donation-offers"
              payload: { donor_name: "Donor B", donor_phone: "555-0302", pickup_county: "CENTRAL", pickup_window_start: "2026-08-05T12:00:00Z", pickup_window_end: "2026-08-05T14:00:00Z", items: [ { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 20.0 } ] }
              as: IntakeCoordinator
              captures: { off_b: "$.data.id" }
            - call: "POST /donation-offers/${off_b}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers"
              payload: { donor_name: "Donor C", donor_phone: "555-0303", pickup_county: "CENTRAL", pickup_window_start: "2026-08-05T11:00:00Z", pickup_window_end: "2026-08-05T13:00:00Z", items: [ { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 20.0 } ] }
              as: IntakeCoordinator
              captures: { off_c: "$.data.id" }
            - call: "POST /donation-offers/${off_c}/triage"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /donation-offers/${off_b}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
              captures: { b_status: "$.data.status" }
            - call: "POST /donation-offers/${off_c}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "${b_status} == PICKUP_SCHEDULED"
            - "DonationOffer.${off_b}.truck_id == ${tr_id}"
            - "${err} == ERR_TRUCK_WINDOW_CONFLICT"
            - "HTTP status of the second trigger call is 409"
            - "DonationOffer.${off_c}.status == TRIAGED"
            - "DonationOffer.${off_c}.truck_id == null"

      - name: volunteer_rest_buffer_closed_interval_sixty_minutes_conflicts
        grounds:
          - validations[priority=19]
          - errors[ERR_VOLUNTEER_WINDOW_CONFLICT]
          - entities.CrewAssignment.fields.volunteer_id
          - entities.DeliveryRun.fields.window_start
          - global_constants.VOLUNTEER_REST_BUFFER_MINUTES
        distinguishing_aspect: |
          Volunteer is the contested resource and the interval arithmetic is closed-interval plus
          a 60-minute rest buffer, which is geometrically different from the truck's half-open
          rule: a gap of exactly 60 minutes still conflicts, and only 61 minutes clears.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "Truck BOX-11 (capacity 600, crew_minimum 1); Volunteer Kai Mensah, county CENTRAL, lift_certified false."
            - "Run R1 on 2026-08-05 with window 09:00:00Z-12:00:00Z already holds an INVITED LIFTER assignment for Kai."
            - "Run R2 on 2026-08-05 with window 13:00:00Z-16:00:00Z starts exactly 60 minutes after R1 ends."
            - "Run R3 on 2026-08-05 with window 13:01:00Z-16:00:00Z starts 61 minutes after R1 ends."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { label: "BOX-11", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /volunteers"
              payload: { name: "Kai Mensah", county: "CENTRAL", lift_certified: false }
              as: PlatformAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T12:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { r1: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T13:00:00Z", window_end: "2026-08-05T16:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { r2: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T13:01:00Z", window_end: "2026-08-05T16:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { r3: "$.data.id" }
            - call: "POST /delivery-runs/${r1}/crew"
              payload: { volunteer_id: "${vol_id}", role_on_crew: "LIFTER" }
              as: DispatchPlanner
              captures: { ca1: "$.data.id" }
          trigger:
            - call: "POST /delivery-runs/${r2}/crew"
              payload: { volunteer_id: "${vol_id}", role_on_crew: "LIFTER" }
              as: DispatchPlanner
              captures: { err: "$.data.error_id" }
            - call: "POST /delivery-runs/${r3}/crew"
              payload: { volunteer_id: "${vol_id}", role_on_crew: "LIFTER" }
              as: DispatchPlanner
              captures: { ca3: "$.data.id", ca3_status: "$.data.status" }
          assert:
            - "${err} == ERR_VOLUNTEER_WINDOW_CONFLICT"
            - "HTTP status of the first trigger call is 409"
            - "HTTP status of the second trigger call is 201"
            - "${ca3_status} == INVITED"
            - "CrewAssignment.${ca1}.status == INVITED"
            - "GET /volunteers/${vol_id}/crew-assignments returns exactly 2 assignments (R1 and R3 only)"
            - "DeliveryRun.${r2}.confirmed_crew_count == 0"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: agency_quota_slots_conserved_across_approve_then_expiry
        grounds:
          - invariants.agency_quota_conservation
          - state_machines.Referral.SUBMITTED_to_APPROVED
          - state_machines.Referral.APPROVED_to_EXPIRED
          - entities.PartnerAgency.fields.quota_used
          - entities.Referral.fields.approved_epoch
        distinguishing_aspect: |
          The conserved quantity is the agency's approval slots: quota_used must equal the count
          of that agency's APPROVED-or-FULFILLED referrals stamped with the current quota_epoch,
          so approving then expiring one referral returns quota_used to exactly 0 with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z, then moved to 2026-09-20T09:00:00Z."
            - "PartnerAgency CENTRAL with quarterly_voucher_quota 3, quota_epoch 1 and quota_used 0."
            - "One Referral SUBMITTED then APPROVED, which lifts quota_used to 1, stamps approved_epoch 1 and expires_at 2026-09-18T09:00:00Z."
            - "No Voucher is ever issued against it, so the run-cycle has only the referral itself to expire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Stonebridge Relief", county: "CENTRAL", quarterly_voucher_quota: 3 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id", quota_at_create: "$.data.quota_used" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { epoch_stamp: "$.data.approved_epoch", expiry: "$.data.expires_at" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: PlatformAdmin
              captures: { quota_after_approve: "$.data.quota_used" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-cycle"
              payload: { advance_quota_epoch: false }
              as: PlatformAdmin
              captures: { expired_refs: "$.data.expired_referral_count", epoch_advanced: "$.data.quota_epoch_advanced" }
          assert:
            - "${quota_at_create} == 0"
            - "${epoch_stamp} == 1"
            - "${expiry} == 2026-09-18T09:00:00.000Z"
            - "${quota_after_approve} == 1"
            - "${expired_refs} == 1"
            - "${epoch_advanced} == false"
            - "Referral.${ref_id}.status == EXPIRED"
            - "PartnerAgency.${ag_id}.quota_used == 0"
            - "PartnerAgency.${ag_id}.quota_epoch == 1"
            - "PartnerAgency.${ag_id}.quarterly_voucher_quota == 3"

      - name: inventory_units_conserved_across_allocate_then_voucher_cancel
        grounds:
          - invariants.inventory_unit_conservation
          - state_machines.InventoryItem.AVAILABLE_to_RESERVED
          - state_machines.InventoryItem.RESERVED_to_AVAILABLE
          - state_machines.Voucher.ALLOCATED_to_CANCELLED
          - entities.VoucherLine.fields.quantity_allocated
        distinguishing_aspect: |
          A different conserved quantity from the agency's approval slots: physical stock units.
          Reserving 2 of 3 BEDs and then cancelling the voucher must return the AVAILABLE BED
          count to exactly 3 and VoucherLine.quantity_allocated to exactly 0, with every released
          unit's reserved_for_voucher_line_id back to null.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "PartnerAgency CENTRAL quota 5; Client household_size 4 county CENTRAL."
            - "Referral APPROVED; Voucher with a single BED line of quantity_requested 2, min_condition B."
            - "One clean donation offer supplies three BEDs (all condition B, 30.0 cf each), so the warehouse holds 3 AVAILABLE BEDs before allocation."
            - "The allocation round reserves 2 of them, leaving 1 AVAILABLE, quantity_allocated 2, line FILLED and the voucher ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Copperfield Mutual Aid", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 2, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /trucks"
              payload: { label: "BOX-12", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Sena Adjei", donor_phone: "555-0244", pickup_county: "CENTRAL", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 30.0 }, { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 30.0 }, { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 30.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { i1: "$.data[0].id", i2: "$.data[1].id", i3: "$.data[2].id" }
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${i1}", graded_condition: "B", live_pest_observed: false }, { item_id: "${i2}", graded_condition: "B", live_pest_observed: false }, { item_id: "${i3}", graded_condition: "B", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
              captures: { alloc_status: "$.data.status", alloc_fill: "$.data.fill_ratio" }
            - call: "GET /vouchers/${v_id}/lines"
              payload: {}
              as: WarehouseLead
              captures: { line_id: "$.data[0].id", line_alloc: "$.data[0].quantity_allocated" }
          trigger:
            - call: "POST /vouchers/${v_id}/cancel"
              payload: { reason: "Household relocated out of the service area" }
              as: CaseManager
              as_user_id: "${ag_id}"
          assert:
            - "${alloc_status} == ALLOCATED"
            - "${alloc_fill} == 1.0"
            - "${line_alloc} == 2"
            - "Voucher.${v_id}.status == CANCELLED"
            - "VoucherLine.${line_id}.quantity_allocated == 0"
            - "VoucherLine.${line_id}.status == CANCELLED"
            - "GET /inventory-items with status=AVAILABLE and category=BED returns exactly 3 items"
            - "GET /inventory-items with status=RESERVED returns exactly 0 items"
            - "GET /inventory-items with reserved_for_voucher_line_id=${line_id} returns exactly 0 items"
