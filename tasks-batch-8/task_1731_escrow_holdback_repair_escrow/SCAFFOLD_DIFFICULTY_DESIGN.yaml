  - rule_id: compensating_invariant
    instances:
      - name: trust_cash_conserved_over_lifecycle
        grounds:
          - calculations.ledger_reconciliation
          - entities.Holdback.fields.trust_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: trust cash. Funding (+230000) is compensated by the draw pay
