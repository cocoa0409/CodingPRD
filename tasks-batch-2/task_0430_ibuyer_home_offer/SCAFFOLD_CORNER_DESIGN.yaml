  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_property_version_on_reissue_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reissue-offer-stale-property]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / reissue_supersede_conserves_single_active_offer_count
          rationale: "The happy-path re-issue with correct expected_property_version is exercised by the named §1.8 instance; the stale-version negative is its direct dual, covered below as a dedicated corner."

      - name: occ_stale_property_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reissue-offer-stale-property]
          - endpoints[POST /properties/{id}/offers]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one successful re-issue bumps Property.version, a second re-issue carrying the pre-bump version (${prop_v} - 1) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Property UNDER_OFFER; one re-issue performed so Property.version advanced; client still holds the pre-bump version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c24@x.com", full_name: "C Twentyfour" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "125 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PricingAnalyst
              captures: { prop_v: $.data.version }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
          trigger:
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: property_version_increments_on_reissue
        claim_type: optimistic_concurrency
        grounds:
          - entities.Property.fields.status
          - endpoints[POST /properties/{id}/offers]
        distinguishing_aspect: "A successful re-issue increments Property.version by exactly 1 (from the value observed before the re-issue)."
        test_recipe:
          setup:
            - "Property UNDER_OFFER with one issued offer; Property.version observed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c25@x.com", full_name: "C Twentyfive" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "126 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PricingAnalyst
              captures: { prop_v: $.data.version }
          trigger:
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
          assert:
            - "Property.${prop_id}.version == ${prop_v} + 1"

      - name: clock_default_makes_offer_unexpired_before_any_set
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Offer.fields.expires_at
        distinguishing_aspect: "With no clock set (default 2026-01-01T00:00:00Z), an offer issued at that default has expires_at 2026-01-06T00:00:00Z and is acceptable; the unset clock is the fixed earliest instant, not wall-clock."
        test_recipe:
          setup:
            - "No /_clock/set_current_utc call made; clock reads default 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c26@x.com", full_name: "C Twentysix" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "127 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
          assert:
            - "Offer.${offer_id}.status == ACCEPTED"
            - "Transaction.${txn_id}.status == PENDING_ASSESSMENT"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: retrade_immediately_reflected_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Transaction.INSPECTION_to_INSPECTION
          - entities.Transaction.fields.final_net_proceeds
        excluded_because:
          difficulty_instance: transitive_cascade / retrade_cascade_depth3_avm_fee_proceeds
          rationale: "Immediate consistency of the retrade cascade's recomputed final_net_proceeds is asserted within the named §1.8 instance's single trigger response."
