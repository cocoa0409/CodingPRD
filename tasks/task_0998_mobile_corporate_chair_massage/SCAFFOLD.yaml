scenario: |
  998. Mobile & Corporate Chair-Massage: event & chairs, therapist scheduling & license,
  per-minute/hour & sign-up sheet, corporate wellness & recurring, travel & setup, waiver,
  invoice, satisfaction

domain_name: mobile-corporate-chair-massage
api_prefix: /chair-massage

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Flat peer entities joined by FKs: Booking references CorporateAccount and
  # WellnessProgram; ChairSlot references Booking and Therapist; SlotClaim
  # references ChairSlot and Waiver; Invoice references Booking; TravelLeg
  # references Therapist and Booking. No nested URL paths.

  state_machine_shape: compound
  # Booking has a posture field (SCHEDULING -> CONFIRMED -> IN_PROGRESS ->
  # COMPLETED, plus CANCELLED branch) AND a parallel billing_status dimension
  # (UNBILLED -> INVOICED -> PAID / DISPUTED) that evolves independently.
  # TherapistLicense has a cyclic SUSPENDED <-> ACTIVE loop driven by
  # compliance review. Invoice has cyclic DISPUTED -> INVOICED -> DISPUTED
  # rounds. ChairSlot posture is derived from its SlotClaims (bubble-up).

  relationship_patterns:
    - one_to_many      # Booking has many ChairSlots; ChairSlot has many SlotClaims
    - many_to_many     # Therapist <-> Booking via ChairSlot assignment junction
    - cross_aggregate  # Invoice aggregates across Booking + ChairSlot + TravelLeg
    - polymorphic      # Booking.booking_kind discriminates EVENT vs RECURRING_OCCURRENCE

  role_model: hierarchical_override
  # Organizer (corporate HR / event planner) owns Bookings.
  # Therapist owns own schedule, licenses, waivers-countersign.
  # PlatformAdmin is superset with override power (force-cancel, license
  # suspension, invoice adjustment).

  consistency_model: immediate
  # All side effects commit atomically within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — DO NOT EDIT)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique region code (e.g. 'SF-BAY', 'NYC-MAN')" }
      - { name: name, type: string, source: input, description: "Human-readable region name" }
      - { name: base_mileage_rate_cents, type: integer, source: input, description: "Per-mile reimbursement in cents for travel within this region", constraints: ">= 0" }
      - { name: travel_included_miles, type: integer, source: input, description: "Miles included at no charge before per-mile billing kicks in", constraints: ">= 0" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Mandatory gap between arrival_time and first chair-slot start (therapist setup)", constraints: ">= 0" }
      - { name: teardown_buffer_minutes, type: integer, source: input, description: "Mandatory gap between last chair-slot end and departure_time", constraints: ">= 0" }
      - { name: is_active, type: boolean, source: input, description: "Inactive regions reject new bookings", default: true }

  - name: CorporateAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; home region for this corporate account" }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the account", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding (unpaid) invoiced balance permitted", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of Invoice.total_cents for invoices of this account in status INVOICED or DISPUTED (excludes PAID and VOID)", default: 0 }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Cumulative sum of Invoice.total_cents ever issued to this account (including PAID)", default: 0 }

  - name: WellnessProgram
    parent: null
    common_fields: true
    fields:
      - { name: corporate_account_id, type: string, source: input, description: "FK -> CorporateAccount.id; owner of this recurring wellness program" }
      - { name: name, type: string, source: input, description: "Program label (e.g. 'Q3 Engineering Wellness')" }
      - { name: cadence, type: enum, source: input, description: "Recurrence cadence", constraints: "WEEKLY | BIWEEKLY | MONTHLY" }
      - { name: chair_count, type: integer, source: input, description: "Chairs requested per occurrence", constraints: ">= 1" }
      - { name: slot_minutes, type: integer, source: input, description: "Per-recipient session length", constraints: ">= 5" }
      - { name: window_start_time, type: string, source: input, description: "Local wall-clock time of day each occurrence starts (HH:MM, 24h)" }
      - { name: window_duration_minutes, type: integer, source: input, description: "Length of the per-occurrence on-site window", constraints: ">= slot_minutes" }
      - { name: recurrence_discount_pct, type: number, source: input, description: "Discount applied to chair-minute subtotal on each recurring occurrence invoice (0.00 - 0.50)", constraints: "0.00 <= x <= 0.50" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: ACTIVE, constraints: "ACTIVE | PAUSED | TERMINATED" }
      - { name: next_occurrence_date, type: string, source: computed, description: "Next calendar date on which an occurrence will be auto-materialized (YYYY-MM-DD); null when PAUSED or TERMINATED" }
      - { name: occurrences_materialized, type: integer, source: computed, description: "Count of Booking rows (booking_kind=RECURRING_OCCURRENCE) already created from this program", default: 0 }

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Therapist legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per therapist" }
      - { name: home_region_id, type: string, source: input, description: "FK -> Region.id; region whose mileage/setup rules apply to this therapist by default" }
      - { name: per_hour_rate_cents, type: integer, source: input, description: "Hourly rate used for payout computation (NOT what the customer pays)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | DEACTIVATED" }
      - { name: max_minutes_per_day, type: integer, source: input, description: "Safety cap on total booked chair-minutes across all bookings on a single calendar date", constraints: ">= 30" }
      - { name: rating_avg_x100, type: integer, source: computed, description: "Rolling average of last 10 submitted SatisfactionSurvey.rating values, multiplied by 100 and rounded half-up; 0 when no surveys", default: 0 }

  - name: TherapistLicense
    parent: null
    common_fields: true
    fields:
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; licensee" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; jurisdiction in which this license is valid" }
      - { name: license_number, type: string, source: input, description: "Government-issued license identifier; unique within (therapist_id, region_id)" }
      - { name: issued_on, type: string, source: input, description: "Issue date (YYYY-MM-DD)" }
      - { name: expires_on, type: string, source: input, description: "Expiry date (YYYY-MM-DD); strictly greater than issued_on" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: suspension_reason, type: string, source: system, description: "Populated when status transitions to SUSPENDED; cleared on reinstatement", default: "" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: corporate_account_id, type: string, source: input, description: "FK -> CorporateAccount.id; the customer being billed" }
      - { name: wellness_program_id, type: string, source: input, description: "FK -> WellnessProgram.id; non-null only for booking_kind=RECURRING_OCCURRENCE", default: null }
      - { name: booking_kind, type: enum, source: input, description: "EVENT for one-off events, RECURRING_OCCURRENCE for materialized wellness occurrences", constraints: "EVENT | RECURRING_OCCURRENCE" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region where service is delivered (drives travel & setup rules)" }
      - { name: site_address, type: string, source: input, description: "Street address of the chair-massage site" }
      - { name: event_date, type: string, source: input, description: "Service date (YYYY-MM-DD)" }
      - { name: window_start_minutes, type: integer, source: input, description: "Minutes since 00:00 local when first chair-slot may start", constraints: "0 <= x < 1440" }
      - { name: window_duration_minutes, type: integer, source: input, description: "Total on-site window in minutes", constraints: ">= 30" }
      - { name: chair_count, type: integer, source: input, description: "Number of chairs requested; determines ChairSlot rows", constraints: ">= 1" }
      - { name: slot_minutes, type: integer, source: input, description: "Per-recipient session length; divides window_duration_minutes exactly", constraints: ">= 5" }
      - { name: per_minute_rate_cents, type: integer, source: input, description: "Customer-facing per-chair-minute price in cents before discounts", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Operational lifecycle (posture)", default: DRAFT, constraints: "DRAFT | SCHEDULING | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Parallel billing dimension; orthogonal to status", default: UNBILLED, constraints: "UNBILLED | INVOICED | PAID | DISPUTED | VOID" }
      - { name: booked_chair_minutes, type: integer, source: computed, description: "Sum of slot_minutes across SlotClaims of ChairSlots of this booking whose status IN {CLAIMED, CHECKED_IN, COMPLETED}", default: 0 }
      - { name: delivered_chair_minutes, type: integer, source: computed, description: "Sum of slot_minutes across SlotClaims of ChairSlots of this booking whose status == COMPLETED", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee assessed on transition to CANCELLED per cancellation_policy calculation", default: 0 }

  - name: ChairSlot
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking this chair serves" }
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; assigned therapist (nullable until assignment)", default: null }
      - { name: chair_index, type: integer, source: input, description: "0-based chair ordinal within the booking", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", default: UNASSIGNED, constraints: "UNASSIGNED | ASSIGNED | EN_ROUTE | ON_SITE | COMPLETED | NO_SHOW | RELEASED" }
      - { name: assigned_at, type: datetime, source: system, description: "Timestamp of last UNASSIGNED -> ASSIGNED transition; null when unassigned" }
      - { name: arrived_at, type: datetime, source: system, description: "Timestamp of EN_ROUTE -> ON_SITE transition", default: null }

  - name: SlotClaim
    parent: null
    common_fields: true
    fields:
      - { name: chair_slot_id, type: string, source: input, description: "FK -> ChairSlot.id; which chair the recipient sits in" }
      - { name: booking_id, type: string, source: computed, description: "FK -> Booking.id; denormalized from chair_slot for direct filtered-list reads" }
      - { name: recipient_name, type: string, source: input, description: "Employee / attendee name" }
      - { name: recipient_email, type: string, source: input, description: "Recipient email; uniqueness enforced per booking (sign-up sheet)" }
      - { name: slot_ordinal, type: integer, source: computed, description: "0-based ordinal of this claim within its chair (chronological order of claims on that chair)" }
      - { name: start_offset_minutes, type: integer, source: computed, description: "Minutes after Booking.window_start_minutes when this session begins; equal to slot_ordinal * Booking.slot_minutes" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", default: CLAIMED, constraints: "CLAIMED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: waiver_id, type: string, source: system, description: "FK -> Waiver.id; waiver captured for this claim; null until waiver signed", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Timestamp of CLAIMED -> CHECKED_IN", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of CHECKED_IN -> COMPLETED", default: null }

  - name: TravelLeg
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking being traveled to" }
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; the traveler" }
      - { name: origin_address, type: string, source: input, description: "Departure address" }
      - { name: distance_miles, type: integer, source: input, description: "One-way miles from origin to site", constraints: ">= 0" }
      - { name: travel_fee_cents, type: integer, source: computed, description: "Customer-billed travel fee for this leg per travel_fee calculation (variant: quoted vs settled)", default: 0 }
      - { name: travel_fee_variant, type: enum, source: system, description: "Which variant produced travel_fee_cents", default: QUOTED, constraints: "QUOTED | SETTLED" }
      - { name: status, type: enum, source: system, description: "Leg lifecycle", default: PLANNED, constraints: "PLANNED | REIMBURSED | WAIVED" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking under which the waiver is signed" }
      - { name: slot_claim_id, type: string, source: input, description: "FK -> SlotClaim.id; the claim this waiver authorizes" }
      - { name: signer_email, type: string, source: input, description: "Must equal the SlotClaim.recipient_email" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of signing (server-stamped at creation)" }
      - { name: signature_payload, type: string, source: input, description: "Opaque client-rendered signature token (non-empty)" }
      - { name: revoked_at, type: datetime, source: system, description: "Timestamp of revocation (null while active)", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking being billed (exactly one non-VOID invoice per booking)" }
      - { name: corporate_account_id, type: string, source: computed, description: "FK -> CorporateAccount.id; denormalized from booking at issuance" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | PAID | DISPUTED | VOID" }
      - { name: chair_minutes_billed, type: integer, source: computed, description: "Chair-minutes on which subtotal is based (variant-driven: booked vs delivered)", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "chair_minutes_billed * per_minute_rate_cents, rounded per invoice_pricing calculation", default: 0 }
      - { name: recurrence_discount_cents, type: integer, source: computed, description: "Discount from WellnessProgram.recurrence_discount_pct (0 for EVENT bookings)", default: 0 }
      - { name: travel_fees_cents, type: integer, source: computed, description: "Sum of TravelLeg.travel_fee_cents over legs of this booking whose status IN {PLANNED, REIMBURSED} (excludes WAIVED)", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Copied from Booking.cancellation_fee_cents when the invoice is for a cancelled booking", default: 0 }
      - { name: satisfaction_credit_cents, type: integer, source: computed, description: "Credit issued due to low satisfaction score per satisfaction_credit calculation", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "max(0, subtotal_cents - recurrence_discount_cents + travel_fees_cents + cancellation_fee_cents - satisfaction_credit_cents)", default: 0 }
      - { name: pricing_variant, type: enum, source: system, description: "Which pricing variant this invoice used", constraints: "PROVISIONAL | FINAL" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of DRAFT -> ISSUED", default: null }
      - { name: dispute_reason, type: string, source: input, description: "Required when transitioning ISSUED -> DISPUTED", default: "" }

  - name: SatisfactionSurvey
    parent: null
    common_fields: false
    fields:
      - { name: slot_claim_id, type: string, source: input, description: "FK -> SlotClaim.id; the session being rated (exactly one survey per claim)" }
      - { name: rating, type: integer, source: input, description: "1..5 stars", constraints: "1 <= x <= 5" }
      - { name: comment, type: string, source: input, description: "Free-text comment", default: "" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped at submission" }

  - name: PayoutLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; payee" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the source booking" }
      - { name: entry_kind, type: enum, source: system, description: "EARNING for completed chair-minutes, TRAVEL_REIMBURSEMENT, ADJUSTMENT for admin corrections", constraints: "EARNING | TRAVEL_REIMBURSEMENT | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed amount (positive owed to therapist, negative clawback); EARNING uses payout_earnings calculation" }
      - { name: posted_at, type: datetime, source: system, description: "Server-stamped at posting" }
      - { name: memo, type: string, source: input, description: "Free-text memo (required for ADJUSTMENT)", default: "" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Booking
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULING
        trigger: "POST /chair-massage/bookings/{id}/open-scheduling"
        actor: Organizer
        preconditions:
          - "Booking.status == DRAFT"
          - "CorporateAccount.status == ACTIVE"
          - "Region.is_active == true for Booking.region_id"
        side_effects:
          - "Materialize chair_count ChairSlot rows (chair_index 0..chair_count-1, status=UNASSIGNED)"
          - "Increments Booking.version by 1"
      - from: SCHEDULING
        to: CONFIRMED
        trigger: "POST /chair-massage/bookings/{id}/confirm"
        actor: Organizer
        preconditions:
          - "Booking.status == SCHEDULING"
          - "Every ChairSlot of this booking has status == ASSIGNED"
          - "For every assigned Therapist on this booking: exists TherapistLicense with therapist_id = therapist AND region_id = Booking.region_id AND status == ACTIVE AND expires_on >= Booking.event_date"
          - "No ChairSlot of any assigned therapist on this booking temporally overlaps another ChairSlot (of any booking) assigned to the same therapist on the same event_date, where overlap includes Region.setup_buffer_minutes before and Region.teardown_buffer_minutes after each booking's window"
        side_effects:
          - "For each assigned therapist on this booking: create TravelLeg(status=PLANNED, travel_fee_variant=QUOTED) if none exists for (booking_id, therapist_id)"
          - "Increments Booking.version by 1"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /chair-massage/bookings/{id}/start-service"
        actor: Organizer
        preconditions:
          - "Booking.status == CONFIRMED"
          - "Current logical date == Booking.event_date"
          - "At least one ChairSlot of this booking has status == ON_SITE"
        side_effects:
          - "Increments Booking.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /chair-massage/bookings/{id}/complete"
        actor: Organizer
        preconditions:
          - "Booking.status == IN_PROGRESS"
          - "Every SlotClaim of this booking has status IN {COMPLETED, NO_SHOW, CANCELLED} (no CLAIMED or CHECKED_IN claims remain)"
        side_effects:
          - "For each TravelLeg of this booking with status == PLANNED: recompute travel_fee_cents under SETTLED variant and set travel_fee_variant=SETTLED"
          - "Post PayoutLedgerEntry(entry_kind=EARNING) for each therapist with COMPLETED SlotClaims on this booking"
          - "Post PayoutLedgerEntry(entry_kind=TRAVEL_REIMBURSEMENT) for each TravelLeg of this booking transitioning to REIMBURSED"
          - "Set each such TravelLeg.status = REIMBURSED"
          - "Increments Booking.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /chair-massage/bookings/{id}/cancel"
        actor: Organizer
        preconditions: ["Booking.status == DRAFT"]
        side_effects:
          - "Booking.cancellation_fee_cents = 0 (DRAFT cancels are free)"
          - "Increments Booking.version by 1"
      - from: SCHEDULING
        to: CANCELLED
        trigger: "POST /chair-massage/bookings/{id}/cancel"
        actor: Organizer
        preconditions: ["Booking.status == SCHEDULING"]
        side_effects:
          - "For each ChairSlot of this booking with status == ASSIGNED: set status = RELEASED"
          - "Booking.cancellation_fee_cents = 0"
          - "Increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /chair-massage/bookings/{id}/cancel"
        actor: Organizer
        preconditions: ["Booking.status == CONFIRMED"]
        side_effects:
          - "For each ChairSlot of this booking with status == ASSIGNED: set status = RELEASED (frees the therapist's calendar)"
          - "Each released ChairSlot's RELEASED transition decrements that therapist's booked-minutes tally for event_date (used by Therapist.max_minutes_per_day check)"
          - "Booking.cancellation_fee_cents computed per cancellation_fee calculation (tiered by hours until event start)"
          - "Each TravelLeg of this booking with status == PLANNED transitions to WAIVED"
          - "When a TravelLeg transitions PLANNED -> WAIVED, its travel_fee_cents is zeroed (which in turn reduces any DRAFT Invoice.travel_fees_cents if one already exists for this booking)"
          - "Increments Booking.version by 1"
    # Parallel billing dimension (independent of `status` above)
    # billing_status is transitioned by Invoice state changes, not by Booking actions:
    #   UNBILLED -> INVOICED   when the first non-VOID Invoice for this booking goes DRAFT -> ISSUED
    #   INVOICED -> PAID       when that Invoice goes ISSUED -> PAID
    #   INVOICED -> DISPUTED   when that Invoice goes ISSUED -> DISPUTED
    #   DISPUTED -> INVOICED   when the dispute is resolved by re-issue (Invoice DISPUTED -> ISSUED via admin)
    #   any     -> VOID        when the Invoice is voided (only permitted for DRAFT or DISPUTED invoices)

  - entity: ChairSlot
    initial_state: UNASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, RELEASED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /chair-massage/chair-slots/{id}/assign"
        actor: Organizer
        preconditions:
          - "ChairSlot.status == UNASSIGNED"
          - "Booking.status == SCHEDULING"
          - "Therapist.status == ACTIVE"
          - "Exists TherapistLicense with therapist_id = candidate AND region_id = Booking.region_id AND status == ACTIVE AND expires_on >= Booking.event_date"
          - "No other ChairSlot assigned to this therapist on any booking with the same event_date has a time window (including setup/teardown buffers) overlapping this booking's window"
          - "Sum of slot_minutes over this therapist's ASSIGNED/EN_ROUTE/ON_SITE ChairSlots on event_date, plus this booking's chair commitment (floor(window_duration_minutes / slot_minutes) * slot_minutes), <= Therapist.max_minutes_per_day"
        side_effects:
          - "ChairSlot.assigned_at = now"
          - "Increments ChairSlot.version by 1"
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /chair-massage/chair-slots/{id}/depart"
        actor: Therapist
        preconditions:
          - "ChairSlot.status == ASSIGNED"
          - "X-User-ID == ChairSlot.therapist_id"
          - "Current logical date == Booking.event_date"
        side_effects: ["Increments ChairSlot.version by 1"]
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /chair-massage/chair-slots/{id}/arrive"
        actor: Therapist
        preconditions:
          - "ChairSlot.status == EN_ROUTE"
          - "X-User-ID == ChairSlot.therapist_id"
        side_effects:
          - "ChairSlot.arrived_at = now"
          - "Increments ChairSlot.version by 1"
      - from: ON_SITE
        to: COMPLETED
        trigger: "system auto-transition when every SlotClaim of this ChairSlot reaches a terminal state AND Booking.status reaches COMPLETED"
        actor: system
        preconditions:
          - "Booking.status transitioned to COMPLETED"
          - "Every SlotClaim of this ChairSlot has status IN {COMPLETED, NO_SHOW, CANCELLED}"
        side_effects:
          - "Increments ChairSlot.version by 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /chair-massage/chair-slots/{id}/release OR cascade from Booking cancel"
        actor: Organizer
        preconditions:
          - "ChairSlot.status == ASSIGNED"
          - "Booking.status IN {SCHEDULING, CONFIRMED}"
        side_effects:
          - "ChairSlot.therapist_id is retained for audit; a new assignment may follow"
          - "Decrements the therapist's booked-minutes tally for event_date"
          - "If a TravelLeg exists for (booking_id, therapist_id) with status == PLANNED and no other ASSIGNED ChairSlot of that therapist remains on this booking, transition that TravelLeg to WAIVED"
          - "Increments ChairSlot.version by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /chair-massage/chair-slots/{id}/mark-no-show"
        actor: Organizer
        preconditions:
          - "ChairSlot.status == ASSIGNED"
          - "Current logical date > Booking.event_date"
        side_effects:
          - "All SlotClaims of this ChairSlot in status CLAIMED transition to NO_SHOW"
          - "Increments ChairSlot.version by 1"

  - entity: SlotClaim
    initial_state: CLAIMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: CLAIMED
        to: CHECKED_IN
        trigger: "POST /chair-massage/slot-claims/{id}/check-in"
        actor: Organizer
        preconditions:
          - "SlotClaim.status == CLAIMED"
          - "Booking.status == IN_PROGRESS"
          - "SlotClaim.waiver_id is not null AND the referenced Waiver has revoked_at == null"
        side_effects:
          - "SlotClaim.checked_in_at = now"
          - "Booking.booked_chair_minutes unchanged (already counted); no-op on aggregates"
          - "Increments SlotClaim.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /chair-massage/slot-claims/{id}/complete"
        actor: Therapist
        preconditions:
          - "SlotClaim.status == CHECKED_IN"
          - "X-User-ID == therapist assigned to the parent ChairSlot"
        side_effects:
          - "SlotClaim.completed_at = now"
          - "Booking.delivered_chair_minutes += Booking.slot_minutes (recomputed as sum over COMPLETED claims)"
          - "Increments SlotClaim.version by 1"
          - "Increments Booking.version by 1 (derived-field mutation)"
      - from: CLAIMED
        to: CANCELLED
        trigger: "POST /chair-massage/slot-claims/{id}/cancel"
        actor: Organizer
        preconditions:
          - "SlotClaim.status == CLAIMED"
          - "Booking.status IN {SCHEDULING, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "Booking.booked_chair_minutes -= Booking.slot_minutes (recomputed)"
          - "Increments SlotClaim.version by 1"
          - "Increments Booking.version by 1 (derived-field mutation)"
      - from: CLAIMED
        to: NO_SHOW
        trigger: "system auto-transition when parent ChairSlot -> NO_SHOW, or POST /chair-massage/slot-claims/{id}/mark-no-show"
        actor: system
        preconditions: ["SlotClaim.status == CLAIMED"]
        side_effects:
          - "Booking.booked_chair_minutes -= Booking.slot_minutes (recomputed; NO_SHOW is excluded)"
          - "Increments SlotClaim.version by 1"
          - "Increments Booking.version by 1 (derived-field mutation)"

  - entity: TherapistLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /chair-massage/therapist-licenses/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["TherapistLicense.status == ACTIVE"]
        side_effects:
          - "suspension_reason recorded"
          - "For every ChairSlot in status ASSIGNED whose therapist holds this license AND whose booking.region_id == this license.region_id AND booking.event_date > this license.expires_on OR (booking.event_date >= current logical date): no automatic unassignment, but further Booking confirmations requiring this license are blocked (see Booking.confirm precondition)"
          - "Increments TherapistLicense.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /chair-massage/therapist-licenses/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "TherapistLicense.status == SUSPENDED"
          - "expires_on >= current logical date"
        side_effects:
          - "suspension_reason cleared"
          - "Increments TherapistLicense.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system auto-transition when current logical date > expires_on"
        actor: system
        preconditions: ["current logical date > expires_on"]
        side_effects: ["Increments TherapistLicense.version by 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system auto-transition when current logical date > expires_on"
        actor: system
        preconditions: ["current logical date > expires_on"]
        side_effects: ["Increments TherapistLicense.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /chair-massage/therapist-licenses/{id}/revoke"
        actor: PlatformAdmin
        preconditions: ["TherapistLicense.status == ACTIVE"]
        side_effects:
          - "For every ChairSlot in status ASSIGNED whose therapist holds this license and whose booking.region_id == this license.region_id and booking.event_date >= current logical date: transition ChairSlot to RELEASED (cascade)"
          - "Each such RELEASED ChairSlot decrements the therapist's booked-minutes tally"
          - "Increments TherapistLicense.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /chair-massage/invoices/{id}/issue"
        actor: PlatformAdmin
        preconditions:
          - "Invoice.status == DRAFT"
          - "Booking.status IN {COMPLETED, CANCELLED}"
          - "No other Invoice for the same booking_id with status IN {DRAFT, ISSUED, DISPUTED}"
          - "Issuing would not push CorporateAccount.outstanding_balance_cents above CorporateAccount.credit_limit_cents (post-issue outstanding = current outstanding + total_cents <= credit_limit_cents)"
        side_effects:
          - "Invoice.issued_at = now"
          - "CorporateAccount.outstanding_balance_cents += Invoice.total_cents"
          - "CorporateAccount.lifetime_billed_cents += Invoice.total_cents"
          - "Booking.billing_status transitions UNBILLED -> INVOICED"
          - "Increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /chair-massage/invoices/{id}/record-payment"
        actor: PlatformAdmin
        preconditions: ["Invoice.status == ISSUED"]
        side_effects:
          - "CorporateAccount.outstanding_balance_cents -= Invoice.total_cents"
          - "Booking.billing_status transitions INVOICED -> PAID"
          - "Increments Invoice.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /chair-massage/invoices/{id}/dispute"
        actor: Organizer
        preconditions:
          - "Invoice.status == ISSUED"
          - "X-User-ID is an Organizer of the CorporateAccount that owns Invoice.booking_id"
          - "dispute_reason non-empty"
        side_effects:
          - "Booking.billing_status transitions INVOICED -> DISPUTED (outstanding_balance unchanged — disputed invoices still count toward credit utilization)"
          - "Increments Invoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /chair-massage/invoices/{id}/resolve-dispute"
        actor: PlatformAdmin
        preconditions: ["Invoice.status == DISPUTED"]
        side_effects:
          - "Invoice totals are NOT recomputed (resolution preserves the disputed numbers; adjustment requires void-and-reissue)"
          - "Booking.billing_status transitions DISPUTED -> INVOICED"
          - "Increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /chair-massage/invoices/{id}/void"
        actor: PlatformAdmin
        preconditions: ["Invoice.status == DRAFT"]
        side_effects:
          - "Booking.billing_status remains UNBILLED"
          - "Increments Invoice.version by 1"
      - from: DISPUTED
        to: VOID
        trigger: "POST /chair-massage/invoices/{id}/void"
        actor: PlatformAdmin
        preconditions: ["Invoice.status == DISPUTED"]
        side_effects:
          - "CorporateAccount.outstanding_balance_cents -= Invoice.total_cents (disputed invoices had been counted)"
          - "Booking.billing_status transitions DISPUTED -> UNBILLED (booking may be re-invoiced)"
          - "Increments Invoice.version by 1"

  - entity: WellnessProgram
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /chair-massage/wellness-programs/{id}/pause"
        actor: Organizer
        preconditions:
          - "WellnessProgram.status == ACTIVE"
          - "X-User-ID is an Organizer of WellnessProgram.corporate_account_id"
        side_effects:
          - "next_occurrence_date set to null"
          - "Increments WellnessProgram.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /chair-massage/wellness-programs/{id}/resume"
        actor: Organizer
        preconditions:
          - "WellnessProgram.status == PAUSED"
          - "X-User-ID is an Organizer of WellnessProgram.corporate_account_id"
        side_effects:
          - "next_occurrence_date recomputed as the smallest date strictly after current logical date matching the cadence"
          - "Increments WellnessProgram.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /chair-massage/wellness-programs/{id}/terminate"
        actor: Organizer
        preconditions: ["WellnessProgram.status == ACTIVE"]
        side_effects:
          - "next_occurrence_date set to null"
          - "Existing Booking rows materialized from this program are NOT cancelled (they live their own lifecycle)"
          - "Increments WellnessProgram.version by 1"
      - from: PAUSED
        to: TERMINATED
        trigger: "POST /chair-massage/wellness-programs/{id}/terminate"
        actor: Organizer
        preconditions: ["WellnessProgram.status == PAUSED"]
        side_effects: ["Increments WellnessProgram.version by 1"]

  - entity: CorporateAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /chair-massage/corporate-accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["CorporateAccount.status == ACTIVE"]
        side_effects:
          - "All WellnessPrograms of this account in status ACTIVE transition to PAUSED"
          - "Increments CorporateAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /chair-massage/corporate-accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["CorporateAccount.status == SUSPENDED"]
        side_effects: ["Increments CorporateAccount.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /chair-massage/corporate-accounts/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "CorporateAccount.status == SUSPENDED"
          - "outstanding_balance_cents == 0"
        side_effects:
          - "All WellnessPrograms of this account in status PAUSED transition to TERMINATED"
          - "Increments CorporateAccount.version by 1"

  - entity: Therapist
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /chair-massage/therapists/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["Therapist.status == ACTIVE"]
        side_effects:
          - "Increments Therapist.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /chair-massage/therapists/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["Therapist.status == ACTIVE not required; from SUSPENDED only"]
        side_effects: ["Increments Therapist.version by 1"]
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /chair-massage/therapists/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "Therapist.status == SUSPENDED"
          - "No ChairSlot with therapist_id == this therapist in status IN {ASSIGNED, EN_ROUTE, ON_SITE}"
        side_effects: ["Increments Therapist.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-confirm-stale-version
    parent_entity: Booking
    write_endpoint: "POST /chair-massage/bookings/{id}/confirm"
    occ_field: "expected_booking_version"
    description: |
      Confirming a Booking whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just assigned or released a ChairSlot (each of which cascades a
      Booking.version bump via side effects) and the confirming client's view
      of which chairs are staffed is therefore stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: slot-claim-stale-chair-version
    parent_entity: ChairSlot
    write_endpoint: "POST /chair-massage/chair-slots/{id}/claims"
    occ_field: "expected_chair_slot_version"
    description: |
      Claiming a slot on a ChairSlot whose version has advanced since the
      client last observed it is rejected. The sign-up sheet is a shared
      surface: another claim, cancellation, or no-show marking on the same
      chair advances ChairSlot.version (via cascade) and renders the current
      writer's view of the next free slot_ordinal stale.
    error_id: ERR_STALE_CHAIR_SLOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_pricing
    trigger: "Invoice creation (POST /chair-massage/bookings/{id}/invoices) AND whenever a source field changes while Invoice.status == DRAFT"
    algorithm: tiered_pricing
    formula: |
      # Mode (c): circular-looking dependency pinned by explicit evaluation order.
      # recurrence_discount depends on the subtotal TIER, which depends on
      # chair_minutes_billed; but the subtotal ALSO feeds the discount. We pin
      # evaluation order so the value is well-defined.
      # Step 1: pick chair_minutes_billed by variant:
      #   PROVISIONAL -> Booking.booked_chair_minutes
      #   FINAL       -> Booking.delivered_chair_minutes
      # Step 2: subtotal_cents = chair_minutes_billed * Booking.per_minute_rate_cents
      #         (NO rounding yet — per-minute rate is integer cents).
      # Step 3: recurrence tier is read off the UNDISCOUNTED subtotal:
      #   tier = STANDARD if booking_kind == EVENT
      #   tier = RECURRING if booking_kind == RECURRING_OCCURRENCE AND WellnessProgram.status != TERMINATED
      # Step 4: recurrence_discount_cents =
      #   0                                              if tier == STANDARD
      #   floor(subtotal_cents * recurrence_discount_pct) if tier == RECURRING
      # Step 5: total_cents = max(0, subtotal_cents - recurrence_discount_cents
      #                            + travel_fees_cents + cancellation_fee_cents
      #                            - satisfaction_credit_cents)
    input_set: "The Booking, its ChairSlots, its SlotClaims (filtered by status per variant), its TravelLegs (status IN {PLANNED, REIMBURSED}), the linked WellnessProgram (if any), and computed satisfaction_credit_cents"
    constants:
      ROUNDING: "floor for discount, half-up for any final cent value"
    precision: "integer cents; discount is floor(product), all other terms exact integer arithmetic"
    variants:
      - name: PROVISIONAL
        when: "Invoice created for a Booking in status CONFIRMED or IN_PROGRESS (allowed for deposit-style pre-billing), or while computing a what-if preview"
        difference: "chair_minutes_billed uses Booking.booked_chair_minutes (CLAIMED + CHECKED_IN + COMPLETED); excludes NO_SHOW and CANCELLED claims"
      - name: FINAL
        when: "Invoice created for a Booking in status COMPLETED or CANCELLED"
        difference: "chair_minutes_billed uses Booking.delivered_chair_minutes (COMPLETED claims only); for a CANCELLED booking this is 0 and cancellation_fee_cents dominates"

  - name: travel_fee
    trigger: "TravelLeg creation (QUOTED variant at Booking.confirm) AND recomputation on Booking.complete (SETTLED variant)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction (tiered rate + free-miles offset).
      # Let m = TravelLeg.distance_miles
      #     f = Region.travel_included_miles
      #     r = Region.base_mileage_rate_cents
      #     s = count of COMPLETED SlotClaims on the booking's chair-slots
      #         assigned to this therapist  (SETTLED only)
      # QUOTED variant:
      #   billable_miles = max(0, m - f)
      #   travel_fee_cents = billable_miles * r
      # SETTLED variant (final, after service delivery):
      #   billable_miles = max(0, m - f)
      #   base = billable_miles * r
      #   high_volume_discount = floor(base * 0.20) if s >= 20 else 0
      #   travel_fee_cents = base - high_volume_discount
      # The two variants produce different numbers for the same distance when
      # the therapist delivered >= 20 sessions on this booking.
    input_set: "TravelLeg + Booking.region + (SETTLED only) count of COMPLETED SlotClaims attributed to this therapist on this booking"
    constants:
      HIGH_VOLUME_SESSION_THRESHOLD: 20
      HIGH_VOLUME_DISCOUNT_PCT: 0.20
    precision: "integer cents; discount is floor"
    variants:
      - name: QUOTED
        when: "TravelLeg created at Booking.confirm; used for Organizer-facing cost preview"
        difference: "No volume discount; pure per-mile overage"
      - name: SETTLED
        when: "Recomputed when Booking transitions IN_PROGRESS -> COMPLETED"
        difference: "Applies 20% discount (floor) to the per-mile overage when therapist completed >= 20 SlotClaims on this booking"

  - name: payout_earnings
    trigger: "Booking IN_PROGRESS -> COMPLETED side effect; one EARNING PayoutLedgerEntry per (therapist, booking) with at least one COMPLETED SlotClaim"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters. The platform pins
      # per-line rounding THEN sum (NOT sum-then-round). Each line is one
      # COMPLETED SlotClaim.
      # For each COMPLETED SlotClaim c of (therapist, booking):
      #   line_cents_c = round_half_up(Booking.slot_minutes *
      #                                 (Therapist.per_hour_rate_cents / 60))
      # earning_cents = sum over c of line_cents_c
      # (Rounding each line before summing can differ by cents from rounding
      #  the aggregate — this is intentional and the implementation MUST pin
      #  per-line rounding.)
    input_set: "All SlotClaims of this booking with status == COMPLETED attributed to this therapist (via parent ChairSlot.therapist_id)"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "per-line round_half_up to integer cents, then integer sum"

  - name: cancellation_fee
    trigger: "Booking -> CANCELLED from CONFIRMED"
    algorithm: threshold
    formula: |
      # Mode (a): tiered rate based on hours remaining until event start,
      # with non-linear interaction across inputs.
      # Let H = (Booking.event_date + Booking.window_start_minutes) - now, in whole hours (floor)
      # Let B = Booking.booked_chair_minutes * Booking.per_minute_rate_cents (the "committed value")
      # fee_cents =
      #   floor(B * 0.50)   if H < 24
      #   floor(B * 0.25)   if 24 <= H < 72
      #   floor(B * 0.10)   if 72 <= H < 168
      #   0                 if H >= 168
      # Boundary precision: H is computed with floor (integer hours); the
      # 24/72/168 thresholds are evaluated against the floored H with
      # strict-less-than on the lower bound and >= on the upper.
    input_set: "Booking, current logical clock, and Region (no region involvement in fee — thresholds are global)"
    constants:
      TIER1_HOURS: 24
      TIER2_HOURS: 72
      TIER3_HOURS: 168
    precision: "integer cents, floor"

  - name: satisfaction_credit
    trigger: "Invoice issuance (DRAFT -> ISSUED) AND when a new SatisfactionSurvey arrives while Invoice.status == DRAFT"
    algorithm: threshold
    formula: |
      # Mode (a) reused with different inputs: credit is tiered on the
      # booking's average satisfaction rating.
      # Let ratings = [s.rating for s in SatisfactionSurvey where s.slot_claim
      #                in SlotClaims of this Booking with status == COMPLETED]
      # If len(ratings) == 0: credit = 0
      # avg_x100 = round_half_up(100 * sum(ratings) / len(ratings))
      # credit =
      #   floor(subtotal_cents * 0.25)   if avg_x100 < 200   (avg < 2.00)
      #   floor(subtotal_cents * 0.10)   if 200 <= avg_x100 < 300
      #   0                              if avg_x100 >= 300
      # Boundary: avg_x100 is computed BEFORE tier selection; the strict <
      # on 200 means avg=1.99 gets 25% credit but avg=2.00 gets only 10%.
    input_set: "SatisfactionSurveys linked to COMPLETED SlotClaims of this booking; subtotal_cents from invoice_pricing"
    constants:
      TIER_LOW_X100: 200
      TIER_MID_X100: 300
    precision: "integer cents, floor"

  - name: next_occurrence_date
    trigger: "WellnessProgram creation, resume (PAUSED -> ACTIVE), and after each auto-materialization"
    algorithm: forward_looking
    formula: |
      # Computes the next calendar date on which an occurrence materializes.
      # WEEKLY:   next = today + ((7 - today.weekday + program_anchor_weekday) % 7 or 7) days
      # BIWEEKLY: same but on a 14-day cycle anchored at program.created_at date
      # MONTHLY:  same calendar day-of-month next month (clamped to last day
      #           of month for short months; e.g. Jan 31 -> Feb 28)
      # Always strictly after current logical date. When current date already
      # matches, advance to next cycle.
    input_set: "WellnessProgram cadence, created_at, current logical clock"
    constants: {}
    precision: "calendar date, no time component"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /chair-massage/therapists and POST /chair-massage/corporate-accounts (bootstrap) and POST /chair-massage/_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "Role in X-User-Role is allowed for the endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path parameters resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "Optimistic-concurrency expected_*_version matches the parent's current version (when endpoint requires it)"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /chair-massage/bookings/{id}/confirm (Booking), POST /chair-massage/chair-slots/{id}/claims (ChairSlot)"
  - priority: 6
    category: business_safety
    check: "Therapist daily-chair-minutes cap: assigning this ChairSlot would not push the therapist's total booked chair-minutes for event_date above Therapist.max_minutes_per_day"
    error_id: ERR_THERAPIST_DAILY_CAP
    http_status: 422
    applies_to: "POST /chair-massage/chair-slots/{id}/assign"
  - priority: 7
    category: business_safety
    check: "Therapist license: candidate holds an ACTIVE license for Booking.region_id with expires_on >= Booking.event_date"
    error_id: ERR_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /chair-massage/chair-slots/{id}/assign, POST /chair-massage/bookings/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "Temporal overlap: candidate therapist has no other ASSIGNED/EN_ROUTE/ON_SITE ChairSlot on the same event_date whose booking window (extended by Region.setup_buffer_minutes before and Region.teardown_buffer_minutes after) overlaps this booking's extended window. Adjacency (end == start after buffers) is permitted (half-open intervals)."
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 422
    applies_to: "POST /chair-massage/chair-slots/{id}/assign, POST /chair-massage/bookings/{id}/confirm"
  - priority: 9
    category: business_temporal
    check: "Sign-up sheet capacity: a new SlotClaim's slot_ordinal = current count of non-CANCELLED claims on the chair; require (slot_ordinal + 1) * Booking.slot_minutes <= Booking.window_duration_minutes"
    error_id: ERR_SIGNUP_SHEET_FULL
    http_status: 422
    applies_to: "POST /chair-massage/chair-slots/{id}/claims"
  - priority: 10
    category: business_referential
    check: "Uniqueness: recipient_email already has a non-CANCELLED SlotClaim on this booking (sign-up sheet prevents duplicate sign-ups)"
    error_id: ERR_DUPLICATE_SIGNUP
    http_status: 422
    applies_to: "POST /chair-massage/chair-slots/{id}/claims"
  - priority: 11
    category: business_referential
    check: "Waiver consistency: SlotClaim.waiver_id must reference a Waiver whose slot_claim_id == this claim AND revoked_at == null before CHECK_IN"
    error_id: ERR_WAIVER_MISSING
    http_status: 422
    applies_to: "POST /chair-massage/slot-claims/{id}/check-in"
  - priority: 12
    category: business_fiscal
    check: "Credit limit: issuing this Invoice would not push CorporateAccount.outstanding_balance_cents above CorporateAccount.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /chair-massage/invoices/{id}/issue"
  - priority: 13
    category: business_fiscal
    check: "Exactly one live invoice per booking: no other Invoice for same booking_id in status IN {DRAFT, ISSUED, DISPUTED}"
    error_id: ERR_LIVE_INVOICE_EXISTS
    http_status: 422
    applies_to: "POST /chair-massage/bookings/{id}/invoices, POST /chair-massage/invoices/{id}/issue"
  - priority: 14
    category: business_referential
    check: "Satisfaction survey uniqueness: at most one SatisfactionSurvey per slot_claim_id"
    error_id: ERR_DUPLICATE_SURVEY
    http_status: 422
    applies_to: "POST /chair-massage/slot-claims/{id}/satisfaction-surveys"
  - priority: 15
    category: business_temporal
    check: "Slot ordinal capacity boundary: window_duration_minutes must be an exact multiple of slot_minutes on Booking creation/update"
    error_id: ERR_WINDOW_NOT_DIVISIBLE
    http_status: 422
    applies_to: "POST /chair-massage/bookings, POST /chair-massage/wellness-programs"
  - priority: 16
    category: business_constraint
    check: "Field shape: enums in allowed set, dates ISO format, integers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

