              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
          trigger:
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 500000000 }
              as: IndependentCertifier
              captures: { err: $.data.error_id }
          assert:
            - "the response is ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "the response is NOT ERR_COMMITMENT_EXCEEDED and NOT HTTP 422, even though the certified cost independently breaches senior_debt_committed_cents"
            - "DrawdownMilestone.${m1_id}.status is still APPROVED"
            - "DrawdownMilestone.${m1_id}.certified_cost_cents is still 120000000 (the rejected body was not written)"
            - "DrawdownMilestone.${m1_id}.equity_portion_cents == 100000000 and debt_portion_cents == 20000000 — the split was not recomputed"
            - "Concession.${csn_id}.equity_drawn_cents == 0 and senior_debt_drawn_cents == 0 and status == FINANCIAL_CLOSE"

      - name: relief_notification_deadline_beats_the_buffered_window_conflict
        pair: "business_temporal (priority 55, ERR_RELIEF_NOTIFICATION_LATE) vs business_constraint (priority 63, ERR_RELIEF_WINDOW_CONFLICT)"
        grounds:
          - validations.priority_55
          - validations.priority_63
          - calculations.contractual_time_windows
        distinguishing_aspect: |
          A different error-category pair from the instance above (temporal vs constraint
          rather than state vs fiscal) on a different entity. The second claim is BOTH
          notified 36 calendar days after its event_start — past the 20-day window — AND
          buffered-overlapping the live first claim of the same claim_type. Priority 55
          fires first, so the caller sees ERR_RELIEF_NOTIFICATION_LATE (422) rather than
          ERR_RELIEF_WINDOW_CONFLICT (409). Fixing only the dates would then expose the
          overlap error, which is what makes the ordering observable rather than incidental.
        test_recipe:
