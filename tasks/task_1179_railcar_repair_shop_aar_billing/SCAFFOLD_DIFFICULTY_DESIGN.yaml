# =============================================================================
# Task 1179: Railcar Repair Shop & AAR Billing — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (Rule 2 carries 3 — one per mode a/b/c).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_pricing_across_rate_windows
        grounds:
          - calculations.estimate_line_pricing
          - calculations.final_brc_line_pricing
          - state_machines.WorkOrder.QA_REVIEW_to_COMPLETED
        distinguishing_aspect: |
          Same repair line, identical hours (2.0): provisional estimate prices labor at the
          estimate-date shop rate (entry effective 2026-05-01: 10000c/h -> 20000c) while the
          final prices the same hours at the completion-date rate (entry effective 2026-07-02:
          11000c/h -> 22000c). Entity domain: RepairLine/BRC money. Distinct from the dwell
          instance, which is on the Railcar hours domain.
        test_recipe:
          setup:
            - "Shop with two non-overlapping price windows for J-BRAKE-BEAM (10000c/h through 2026-06-30, 11000c/h from 2026-07-01)"
            - "Railcar arrived 2026-05-01T08:00:00Z; inspection COMPLETED with one BRAKE_BEAM/WEAR/MAJOR defect"
            - "WorkOrder SHOP with one line J-BRAKE-BEAM, no parts; submitted and owner-authorized; slot reserved; started"
            - "Clock advanced to 2026-07-02T10:00:00Z before completion so finalization resolves the second price window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop A", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
              captures: { l: $.data.id }
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-BRAKE-BEAM", description: "Brake beam renewal", labor_rate_cents_per_hour: 10000, mobile_labor_rate_cents_per_hour: 12000, standard_labor_hours: 2.0, mobile_trip_surcharge_cents: 20000, mobile_eligible: true, effective_from: "2026-01-01", effective_to: "2026-06-30" }
              as: ShopAdmin
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-BRAKE-BEAM", description: "Brake beam renewal H2", labor_rate_cents_per_hour: 11000, mobile_labor_rate_cents_per_hour: 13000, standard_labor_hours: 2.0, mobile_trip_surcharge_cents: 20000, mobile_eligible: true, effective_from: "2026-07-01", effective_to: "2026-12-31" }
              as: ShopAdmin
            - call: "POST /railcars"
              payload: { shop_id: "${s}", reporting_mark: "OWNA", car_number: "1001", owner_id: "${o}", handling_line_id: "${l}", built_date: "2020-01-15" }
              as: YardClerk
              captures: { car: $.data.id, car_v: $.data.version }
            - call: "POST /railcars/${car}/inspections"
              payload: {}
              as: CarInspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-3100", defect_group: "BRAKE_BEAM", cause_code: "WEAR", severity: "MAJOR", location: "B-end" }
              as: CarInspector
              captures: { d1: $.data.id }
            - call: "POST /inspections/${insp}/complete"
              payload: {}
              as: CarInspector
            - call: "POST /work-orders"
              payload: { railcar_id: "${car}", inspection_id: "${insp}", routing: "SHOP", expected_railcar_version: "${car_v}" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d1}", job_code: "J-BRAKE-BEAM" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { rl: $.data.id }
            - call: "POST /shop-slots"
              payload: { shop_id: "${s}", stall_id: "S1", starts_at: "2026-05-02T08:00:00Z", ends_at: "2026-05-02T16:00:00Z" }
              as: ShopAdmin
              captures: { slot: $.data.id }
            - call: "POST /work-orders/${wo}/submit"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo}/authorize"
              payload: { expected_work_order_version: "${wo_v}" }
              as: CarOwnerRep
              as_user_id: "${o}"
            - call: "POST /work-orders/${wo}/assign-slot"
              payload: { slot_id: "${slot}" }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /work-orders/${wo}/start"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:00:00Z" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo}/complete"
              payload: { line_actuals: [{ repair_line_id: "${rl}", actual_labor_hours: 2.0, parts_used: [] }] }
              as: RepairForeman
              as_user_id: "foreman-1"
          trigger:
            - call: "POST /work-orders/${wo}/qa-review"
              payload: { result: "PASS" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "GET /repair-lines/${rl}"
              as: Any
          assert:
            - "RepairLine.${rl}.estimate_labor_cents == 20000 (2.0 standard hours x 10000, entry effective at estimate date 2026-05-01)"
            - "RepairLine.${rl}.final_labor_cents == 22000 (2.0 actual hours x 11000, entry effective at completion date 2026-07-02)"
            - "RepairLine.${rl}.status == FINALIZED"
            - "RepairLine.${rl}.final_total_cents == 22000 and estimate_total_cents == 20000 — identical hours diverge by the rate window crossed mid-repair"

      - name: projected_vs_actual_dwell_charge
        grounds:
          - calculations.dwell_charge
          - entities.Railcar.fields.projected_dwell_charge_cents
          - entities.Railcar.fields.dwell_charge_cents
          - state_machines.Railcar.ARRIVED_to_DEPARTED
        distinguishing_aspect: |
          Railcar dwell domain (not money on a RepairLine): the forward-looking projected
          variant pins 16000c at slot assignment (slot ends 2026-05-04T16:00Z, 80h after arrival,
          32 billable hours x 500c), while the chronological actual variant at depart computes
          40000c (128h actual, 80 billable hours) because the owner picked the car up late and no
          shop delay applies. Same stay, two valid algorithms, different results.
        test_recipe:
          setup:
            - "Shop (dwell_free_hours 48, dwell_rate 500c/h); railcar arrived 2026-05-01T08:00:00Z"
            - "WorkOrder SHOP with one J-INSPECT-MINOR line (0.9 standard hours), authorized, assigned slot 2026-05-04T08:00-16:00Z"
            - "Clock advanced to 2026-05-06T16:00:00Z; work order cancelled before start; car departs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop B", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
              captures: { l: $.data.id }
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-INSPECT-MINOR", description: "Minor inspection labor", labor_rate_cents_per_hour: 3333, mobile_labor_rate_cents_per_hour: 4000, standard_labor_hours: 0.9, mobile_trip_surcharge_cents: 0, mobile_eligible: true, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: ShopAdmin
            - call: "POST /railcars"
              payload: { shop_id: "${s}", reporting_mark: "OWNA", car_number: "2002", owner_id: "${o}", handling_line_id: "${l}", built_date: "2019-06-01" }
              as: YardClerk
              captures: { car: $.data.id, car_v: $.data.version }
            - call: "POST /railcars/${car}/inspections"
              payload: {}
              as: CarInspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-9001", defect_group: "OTHER", cause_code: "WEAR", severity: "MINOR", location: "A-end" }
              as: CarInspector
              captures: { d1: $.data.id }
            - call: "POST /inspections/${insp}/complete"
              payload: {}
              as: CarInspector
            - call: "POST /work-orders"
              payload: { railcar_id: "${car}", inspection_id: "${insp}", routing: "SHOP", expected_railcar_version: "${car_v}" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d1}", job_code: "J-INSPECT-MINOR" }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /shop-slots"
              payload: { shop_id: "${s}", stall_id: "S1", starts_at: "2026-05-04T08:00:00Z", ends_at: "2026-05-04T16:00:00Z" }
              as: ShopAdmin
              captures: { slot: $.data.id }
            - call: "POST /work-orders/${wo}/submit"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo}/authorize"
              payload: { expected_work_order_version: "${wo_v}" }
              as: CarOwnerRep
              as_user_id: "${o}"
            - call: "POST /work-orders/${wo}/assign-slot"
              payload: { slot_id: "${slot}" }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T16:00:00Z" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
          trigger:
            - call: "POST /railcars/${car}/depart"
              payload: {}
              as: YardClerk
            - call: "GET /railcars/${car}/dwell-summary"
              as: Any
          assert:
            - "Railcar.${car}.projected_dwell_charge_cents == 16000 (projection at assign: 80h to slot end - 48 free = 32h x 500c)"
            - "Railcar.${car}.dwell_charge_cents == 40000 (actual: 128h dwell - 48 free - 0 shop delay = 80h x 500c)"
            - "dwell-summary actual_dwell_hours == 128.0 and billable_hours == 80.0"
            - "projected != actual: identical stay priced 16000 forward-looking vs 40000 chronological"

  - rule_id: combinatorial_formula
    instances:
      - name: responsibility_shared_split_precedes_wear_group
        grounds:
          - calculations.responsibility_determination
          - entities.RepairLine.fields.owner_pct
          - state_machines.WorkOrder.DRAFT_to_PENDING_AUTHORIZATION
        distinguishing_aspect: |
          Mode (a) combinatorial: a decision table with >= 3 inputs (cause_code, entry
          shared_split flag, defect_group, interchange timing) and first-match precedence. The
          COUPLER defect would hit rule R4 (wear group -> OWNER 100) but the matched price
          entry's shared_split flag makes R2 fire first -> SHARED 50/50. Pinned order is the
          only thing that makes the result well-defined.
        test_recipe:
          setup:
            - "Price entry J-COUPLER-LUBE with shared_split=true, 6000c/h, 1.0 standard hour"
            - "Defect AAR-5002 group COUPLER (a wear group) cause WEAR"
            - "WorkOrder submitted; responsibility rules evaluated per line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop C", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
              captures: { l: $.data.id }
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-COUPLER-LUBE", description: "Coupler lubrication", labor_rate_cents_per_hour: 6000, mobile_labor_rate_cents_per_hour: 7000, standard_labor_hours: 1.0, mobile_trip_surcharge_cents: 20000, mobile_eligible: true, shared_split: true, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: ShopAdmin
            - call: "POST /railcars"
              payload: { shop_id: "${s}", reporting_mark: "OWNA", car_number: "3003", owner_id: "${o}", handling_line_id: "${l}", built_date: "2018-03-20" }
              as: YardClerk
              captures: { car: $.data.id, car_v: $.data.version }
            - call: "POST /railcars/${car}/inspections"
              payload: {}
              as: CarInspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-5002", defect_group: "COUPLER", cause_code: "WEAR", severity: "MINOR", location: "coupler" }
              as: CarInspector
              captures: { d1: $.data.id }
            - call: "POST /inspections/${insp}/complete"
              payload: {}
              as: CarInspector
            - call: "POST /work-orders"
              payload: { railcar_id: "${car}", inspection_id: "${insp}", routing: "SHOP", expected_railcar_version: "${car_v}" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d1}", job_code: "J-COUPLER-LUBE" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { rl: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/submit"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "GET /repair-lines/${rl}"
              as: Any
            - call: "GET /work-orders/${wo}"
              as: Any
          assert:
            - "RepairLine.${rl}.responsible_party == SHARED and owner_pct == 50 (R2 shared_split beats R4 wear-group OWNER rule)"
            - "RepairLine.${rl}.estimate_total_cents == 6000 (1.0 standard hour x 6000)"
            - "WorkOrder.${wo}.responsible_party == OWNER (owner side sums lines with owner_pct >= 50) and owner_share_pct == 50"
            - "WorkOrder.${wo}.auth_status == PENDING_AUTHORIZATION"

      - name: per_line_rounding_before_sum
        grounds:
          - calculations.brc_total_aggregation
          - calculations.final_brc_line_pricing
          - entities.BillingRepairCard.fields.submitted_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines each produce 0.9h x 3333c/h = 2999.7c labor. The
          pinned order rounds each line first (3000 + 3000 = 6000); sum-then-round would yield
          round(5999.4) = 5999. Asserting submitted_total_cents == 6000 falsifies the
          alternative rounding order.
        test_recipe:
          setup:
            - "Price entry J-INSPECT-MINOR at 3333c/h, 0.9 standard hours, no parts"
            - "Two MINOR/OTHER defects; WorkOrder SHOP with two lines; owner-responsible (R6 default)"
            - "Both lines completed with 0.9 actual hours each; QA passed; BRC drafted and submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop D", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
              captures: { l: $.data.id }
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-INSPECT-MINOR", description: "Minor inspection labor", labor_rate_cents_per_hour: 3333, mobile_labor_rate_cents_per_hour: 4000, standard_labor_hours: 0.9, mobile_trip_surcharge_cents: 0, mobile_eligible: true, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: ShopAdmin
            - call: "POST /railcars"
              payload: { shop_id: "${s}", reporting_mark: "OWNA", car_number: "4004", owner_id: "${o}", handling_line_id: "${l}", built_date: "2021-11-11" }
              as: YardClerk
              captures: { car: $.data.id, car_v: $.data.version }
            - call: "POST /railcars/${car}/inspections"
              payload: {}
              as: CarInspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-9001", defect_group: "OTHER", cause_code: "WEAR", severity: "MINOR", location: "A-end" }
              as: CarInspector
              captures: { d1: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-9002", defect_group: "OTHER", cause_code: "WEAR", severity: "MINOR", location: "B-end" }
              as: CarInspector
              captures: { d2: $.data.id }
            - call: "POST /inspections/${insp}/complete"
              payload: {}
              as: CarInspector
            - call: "POST /work-orders"
              payload: { railcar_id: "${car}", inspection_id: "${insp}", routing: "SHOP", expected_railcar_version: "${car_v}" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d1}", job_code: "J-INSPECT-MINOR" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { rl1: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d2}", job_code: "J-INSPECT-MINOR" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { rl2: $.data.id }
            - call: "POST /shop-slots"
              payload: { shop_id: "${s}", stall_id: "S1", starts_at: "2026-05-02T08:00:00Z", ends_at: "2026-05-02T16:00:00Z" }
              as: ShopAdmin
              captures: { slot: $.data.id }
            - call: "POST /work-orders/${wo}/submit"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo}/authorize"
              payload: { expected_work_order_version: "${wo_v}" }
              as: CarOwnerRep
              as_user_id: "${o}"
            - call: "POST /work-orders/${wo}/assign-slot"
              payload: { slot_id: "${slot}" }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /work-orders/${wo}/start"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /work-orders/${wo}/complete"
              payload: { line_actuals: [{ repair_line_id: "${rl1}", actual_labor_hours: 0.9, parts_used: [] }, { repair_line_id: "${rl2}", actual_labor_hours: 0.9, parts_used: [] }] }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /work-orders/${wo}/qa-review"
              payload: { result: "PASS" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "GET /work-orders/${wo}"
              as: Any
              captures: { wo_v2: $.data.version }
            - call: "POST /billing-repair-cards"
              payload: { work_order_id: "${wo}", expected_work_order_version: "${wo_v2}" }
              as: BillingClerk
              captures: { brc: $.data.id }
          trigger:
            - call: "POST /billing-repair-cards/${brc}/submit"
              payload: {}
              as: BillingClerk
            - call: "GET /billing-repair-cards/${brc}"
              as: Any
          assert:
            - "BillingRepairCard.${brc}.submitted_total_cents == 6000 (per-line round_half_up of 2999.7 -> 3000 each, then summed)"
            - "submitted_total_cents != 5999 — sum-then-round of 5999.4 is the forbidden order"
            - "BillingRepairCard.${brc}.owner_total_cents == 6000 and handling_line_total_cents == 0 (both lines R6 OWNER 100)"
            - "BillingRepairCard.${brc}.net_settled_cents == 6000 and status == SUBMITTED"

      - name: warranty_credit_pinned_evaluation_order
        grounds:
          - calculations.warranty_credit
          - calculations.counter_bill_ceiling
          - state_machines.WarrantyClaim.VALIDATED_to_HONORED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the warranty credit caps at the line's remaining
          value after accepted counter credits, while later counter ceilings are in turn reduced
          by honored warranty credits. Pinned order: final 22500 -> minus accepted counter 2500
          -> minus prior warranty credits 0 -> cap by claimed rework 15000 => credit 15000; the
          line then has only 5000 of counterable remainder, so a 5001c counter is rejected with
          ERR_CREDIT_EXCEEDS_REMAINING while the aggregate 60% cap (13500) still has headroom.
        test_recipe:
          setup:
            - "Hose repair: J-AIR-HOSE at 9000c/h, 1.5 standard hours; one H-100 part at 4500c"
            - "Line finalized at 2.0 actual hours + 1 part => final_total 22500; BRC submitted (owner 100%)"
            - "Counter-bill of 2500 accepted against the single BRC line; BRC accepted (owner balance 20000)"
            - "Warranty claim on the line (failure group AIR_HOSE matches), validated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop E", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
