  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: financial_clearance_cleared_pending_cycle
        grounds:
          - state_machines.FinancialClearance
          - state_machines.FinancialClearance.CLEARED_to_PENDING
        distinguishing_aspect: "FinancialClearance has a true cycle (PENDING -> CLEARED -> PENDING via reopen) on the clearance entity — a second deposit cycle is required after reopen, proving the machine loops rather than terminating at CLEARED."
        test_recipe:
          setup:
            - "Happy-path DESTINATION case through approval and a full 60000 deposit so clearance is CLEARED."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *deposit
          trigger:
            - call: "POST /visit-cases/${case_id}/financial-clearance/reopen"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - call: "GET /visit-cases/${case_id}/financial-clearance"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
          assert:
            - "FinancialClearance.status returns to PENDING after reopen"
            - "FinancialClearance.deposit_paid_cents == 60000 is preserved across the cycle"
            - "a subsequent DEPOSIT of 1 cent flips status back to CLEARED (cycle closes a second time)"

      - name: itinerary_draft_confirmed_locked_with_cancel_branch
        grounds:
          - state_machines.Itinerary
          - state_machines.Itinerary.DRAFT_to_CONFIRMED
          - state_machines.Itinerary.CONFIRMED_to_LOCKED
        distinguishing_aspect: "Itinerary's machine is a fork-join shape on a different entity: DRAFT forks toward CONFIRMED (confirm) or CANCELLED (withdrawal cascade), and CONFIRMED joins into LOCKED only after the VisitCase reaches READY_TO_TRAVEL — an attempt to lock while the case is merely SCHEDULED must fail."
        test_recipe:
          setup:
            - "DESTINATION case with 2 visits held and confirmed, itinerary CONFIRMED (case SCHEDULED); no travel authorization yet."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *slot_c2
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *case_v_after_approve
            - *deposit
            - *case_v_after_deposit
            - &i_hold1
              call: "POST /visit-cases/${case_id}/slot-holds"
