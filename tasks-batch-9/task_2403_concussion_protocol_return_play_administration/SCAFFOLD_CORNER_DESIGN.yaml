              payload: { inc_clinician_id: "${doc_h2_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/sideline-evaluations/${eval_id}/locker-room-exam"
              payload: { inc_clinician_id: "${doc_h_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/sideline-evaluations/${eval_id}/locker-room-exam"
              payload: { inc_clinician_id: "${obs_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "trigger 1: response status 422 with error_id ERR_EXAM_INC_INELIGIBLE"
            - "trigger 2: response status 422 with error_id ERR_EXAM_INC_INELIGIBLE"
            - "after triggers 1 and 2: SidelineEvaluation.${eval_id}.status == SCREENED and exam_started_at == null"
            - "trigger 3: response status 200, status == LOCKER_ROOM_EXAM, inc_clinician_id == ${obs_id}"
            - "trigger 3: exam_started_at == 2026-09-13T18:10:00.000Z and inc_block_ends_at == 2026-09-13T18:40:00.000Z"

      - name: final_clearance_consultant_conflict_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_19
          - errors.ERR_INC_NOT_INDEPENDENT
        distinguishing_aspect: "Priority 19 fires before any stage-completeness check: on a freshly diagnosed case with zero return steps, requesting final clearance from the diagnosing physician or from the observer who attended the locker-room exam returns ERR_INC_NOT_INDEPENDENT rather than ERR_NO_RETURN_STEPS_RECORDED."
