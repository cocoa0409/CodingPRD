              as: LandlordAssetManager
              captures: { pr_id: "$.data.id" }
            - call: "POST /fit-out-projects/${pr_id}/permit-application"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /fit-out-projects/${pr_id}/permit-decision"
              payload: { decision: "ISSUE" }
              as: AHJPermitOfficer
            - call: "POST /hazmat-permits"
              payload: { project_id: "${pr_id}", floor_id: "${f2_id}", hazard_class: "FLAMMABLE_IB", use_condition: "CLOSED_SYSTEM_USE", quantity_gal: 100.00, control_area_index: 1 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { hz_id: "$.data.id" }
