              as: InvestmentCommitteeChair
          assert:
            - "the 9999-bps approval is rejected at HTTP 422 with err_low == ERR_MODEL_WEIGHTS_INVALID"
            - "ModelPortfolio.${model_low_id}.model_status is still DRAFT after the rejection"
            - "after adding a 1-bps line the total is exactly 10000 and the approval succeeds"
            - "ModelPortfolio.${model_low_id}.model_status == APPROVED and approval_round_number == 1"

      - name: valuation_age_271_days_is_rejected_and_270_is_accepted
        claim_type: Priority Ordering
        grounds:
          - validations[priority=41]
          - validations[priority=35]
          - errors[ERR_VALUATION_STALE]
        distinguishing_aspect: "Dual failure where a holding is both too old (271 days) and below its floor: the temporal check at priority 41 outranks the constraint check at priority 35, so ERR_VALUATION_STALE wins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted ALTERNATIVE_ASSETS, one OPEN account, one holding stated at 20000000 with a floor of 30000000 and an as-of date 271 days before the clock."
