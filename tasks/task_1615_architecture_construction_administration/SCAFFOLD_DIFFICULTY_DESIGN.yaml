            - "${err_id} != ERR_VERIFICATION_VISIT_INVALID"
            - "count of PaymentApplications on project ${p_id} == 1 (no new application persisted)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: retainage_tier_boundary_at_exact_halfway
        grounds:
          - calculations.payment_certification
          - entities.PaymentApplication.fields.retainage_work_cents
        distinguishing_aspect: |
          Boundary metric = certified work cents vs the 50% threshold: gross exactly
          5000000 (== threshold) leaves zero cents in the LOW_PCT band (max(0, g -
          threshold) == 0), so retainage is exactly 500000 and current due 4500000 —
          the >= / > split lives on the boundary itself.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project (sum 10000000 -> threshold 5000000), verification visit V1 REPORT_ISSUED."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj B1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 5000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app_id}.gross_work_completed_cents == 5000000"
            - "PaymentApplication.${app_id}.retainage_work_cents == 500000  # exactly threshold: no LOW_PCT portion"
            - "PaymentApplication.${app_id}.certified_current_due_cents == 4500000"

      - name: billing_horizon_grace_boundary_strictly_after
        grounds:
          - calculations.additional_service_billing
          - calculations.ca_posture_derivation
          - errors[ERR_NO_BILLABLE_EXTENSION]
        distinguishing_aspect: |
          Boundary metric = calendar days on the billing horizon (a different metric
          than retainage cents, exercised through invoice creation rather than
          certification): with the clock date exactly equal to horizon_start
          (2026-10-05), the strictly-greater comparison yields 0 billable days and
          ERR_NO_BILLABLE_EXTENSION; one day later yields exactly 1 billable day and
          amount 120000.
        test_recipe:
          setup:
            - "ACTIVE PER_DIEM_PRORATED project (base SCD 2026-09-30, grace 5, excusable 0 -> horizon_start 2026-10-05)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj B2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: FirmAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "first invoice attempt: http 422 and ${err_id} == ERR_NO_BILLABLE_EXTENSION"
            - "CaProject.${p_id}.ca_posture == NORMAL at clock date 2026-10-05 (equality is not extended)"
            - "AdditionalServiceInvoice.${inv_id}.billable_days == 1"
            - "AdditionalServiceInvoice.${inv_id}.amount_cents == 120000"

      - name: submittal_review_due_date_equality
        grounds:
          - calculations.excusable_delay_credit
          - entities.Submittal.fields.credited_delay_days
        distinguishing_aspect: |
          Boundary metric = review timestamp vs due_at (a third metric, through the
          review endpoint): a review landing exactly on the due date credits 0 days,
          while a review one calendar day later credits exactly 1 — pinning the
          date-part comparison and its >= / > edge.
        test_recipe:
          setup:
            - "ACTIVE project, 10-day submittal window."
            - "Submittal S1 received at the 2026-08-01 default clock (due 2026-08-11); S1 reviewed APPROVED at clock 2026-08-11T00:00:00Z (exactly on its due date)."
            - "Submittal S2 received 2026-08-11 (due 2026-08-21); S2 reviewed APPROVED_AS_NOTED at clock 2026-08-22T00:00:00Z (one calendar day past due)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj B3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s1_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/submittals/${s1_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "05 12 00", required_on_site_date: "2026-09-01" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s2_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/submittals/${s2_id}/review"
              payload: { outcome: "APPROVED_AS_NOTED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "Submittal.${s1_id}.credited_delay_days == 0  # reviewed exactly on its due date 2026-08-11"
            - "Submittal.${s2_id}.credited_delay_days == 1  # due 2026-08-21, reviewed 2026-08-22 -> one calendar day late"
            - "CaProject.${p_id}.excusable_delay_days == 1"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payapp_create_requires_verification_visit_report_issued
        grounds:
          - validations[priority=17]
          - state_machines.SiteVisit.PERFORMED_to_REPORT_ISSUED
          - entities.PaymentApplication.fields.verification_visit_id
        distinguishing_aspect: |
          Pair (PaymentApplication -> SiteVisit): creating a payment application
          against a verification visit that is only PERFORMED (no field report yet)
          fails with ERR_VERIFICATION_VISIT_INVALID; once the field report flips the
          visit to REPORT_ISSUED the identical payload succeeds.
