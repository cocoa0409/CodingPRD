          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer Acme, federal agency FED-941 whose jurisdiction_code is US, employee Dana."
            - "A 2022 Q1 register line of 1000000 cents in jurisdiction NJ at workday_ratio_bps 4000 plus a filed return matching the register totals, so reconciliation emits exactly one JURISDICTION_ASSIGNMENT discrepancy and statement_status becomes STMT_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
