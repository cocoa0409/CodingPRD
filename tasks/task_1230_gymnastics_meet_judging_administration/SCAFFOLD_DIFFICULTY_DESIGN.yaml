            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_bl}" }
              as: MeetDirector
              captures: { e_bl: $.data.id }
          trigger:
            - call: "GET /api/v1/athlete-entries/${e_ex}"
              payload: {}
              as: MeetDirector
            - call: "GET /api/v1/athlete-entries/${e_bl}"
              payload: {}
              as: MeetDirector
          assert:
            - "AthleteEntry.${e_ex}.all_around_total == 32.000 AND qualified_for_next_meet == true (>= boundary INCLUSIVE)"
            - "AthleteEntry.${e_bl}.all_around_total == 31.999 AND qualified_for_next_meet == false (strictly below threshold)"
            - "Difference of 0.001 at the boundary produces opposite qualification outcomes"

      - name: inquiry_window_exactly_at_deadline
        grounds:
          - validations[priority=9]
          - entities.Meet.fields.inquiry_window_minutes
          - entities.Score.fields.published_at
        distinguishing_aspect: |
          Metric = time offset (minutes since published_at); boundary =
          inquiry_window_minutes (5). Filing AT exactly published_at + 5min is
          allowed (<=); filing at +5min1s is rejected. Empty-collection edge:
          if no Inquiry exists, the score auto-transitions to FINAL.
        test_recipe:
          setup:
            - "Score published at 2026-05-02T14:30:00.000Z; Meet.inquiry_window_minutes = 5"
            - "Coach attempts inquiry at 2026-05-02T14:35:00.000Z (boundary, allowed) and another at 2026-05-02T14:35:00.001Z (rejected)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Bnd2", sanction_year: 2026, sanction_number: "USAG-2026-7002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", inquiry_window_minutes: 5 }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T14:35:00Z" }
              as: MeetDirector
          assert:
            - "At exactly published_at + 5min (boundary): inquiry allowed (<= comparison)"
            - "At published_at + 5min + 1s: ERR_INQUIRY_WINDOW_EXPIRED"
            - "If no inquiry filed by boundary+1s: score auto-transitions PUBLISHED -> FINAL via system trigger"

  # ==========================================================================
  # Rule 7: cross_entity_state_dependency — 2 instances on different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rotation_open_requires_panel_active
        grounds:
          - state_machines.Rotation.TIMED_WARMUP_HELD_to_OPEN_FOR_SCORING
          - entities.JudgePanel.fields.panel_state
        distinguishing_aspect: |
          Entity pair = Rotation -> JudgePanel. Rotation.OPEN_FOR_SCORING
          requires JudgePanel.panel_state == ACTIVE on the matching
          (session, apparatus). Rotation cannot open for scoring until the
          panel reaches ACTIVE via independent judge-confirmation flow.
        test_recipe:
          setup:
            - "Rotation R TIMED_WARMUP_HELD; JudgePanel JP for same (session, apparatus) still FORMING (not yet ACTIVE)"
            - "Attempt to open scoring: rejected"
            - "Confirm enough PanelAssignments to flip JP to FULL -> ACTIVE; retry succeeds"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "CESD1", sanction_year: 2026, sanction_number: "USAG-2026-8001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/judge-panels"
              payload: { meet_id: "${meet_id}", apparatus: "VAULT" }
              as: MeetReferee
              captures: { jp_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/publish"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T14:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/rotations/${rot_id}/open-scoring"
              payload: {}
              as: MeetDirector
          assert:
            - "Response status == 422 with error_id == ERR_PANEL_UNDERSTAFFED"
            - "JudgePanel.${jp_id}.panel_state == FORMING (not ACTIVE); Rotation.${rot_id}.state unchanged"

      - name: score_publish_requires_rotation_open
        grounds:
          - state_machines.Score.DRAFT_to_PUBLISHED
          - entities.Rotation.fields.state
        distinguishing_aspect: |
          Entity pair = Score -> Rotation. Score.DRAFT -> PUBLISHED requires
          Rotation.state == OPEN_FOR_SCORING. A DRAFT score cannot be
          published while its parent Rotation is PENDING / WARMUP /
          TIMED_WARMUP_HELD / SCORING_CLOSED / FINALIZED.
        test_recipe:
          setup:
            - "Score SC in DRAFT linked to Rotation R in TIMED_WARMUP_HELD (not yet OPEN_FOR_SCORING)"
            - "Attempt publish: rejected with ERR_INVALID_STATE"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "CESD2", sanction_year: 2026, sanction_number: "USAG-2026-8002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A8000001", legal_name: "G", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
              captures: { e_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/publish"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
            - call: "POST /api/v1/judges"
              payload: { usag_judge_number: "J8000001", legal_name: "J", rating: "BREVET", affiliated_gym: "Neutral", availability_start: "2026-05-02T00:00:00Z", availability_end: "2026-05-03T00:00:00Z" }
              as: MeetReferee
              captures: { j_id: $.data.id }
            - call: "POST /api/v1/athlete-entries/${e_id}/scores"
              payload: { rotation_id: "${rot_id}", apparatus: "VAULT", difficulty_score: 5.0, execution_score: 8.0 }
              as: JudgePanelChief
              as_user_id: "${j_id}"
              captures: { sc_id: $.data.id, sc_v: $.data.version }
          trigger:
            - call: "POST /api/v1/scores/${sc_id}/publish"
              payload: { expected_score_version: "${sc_v}" }
              as: JudgePanelChief
              as_user_id: "${j_id}"
          assert:
            - "Response status == 409 with error_id == ERR_INVALID_STATE (Rotation.state != OPEN_FOR_SCORING)"
            - "Score.${sc_id}.score_state remains DRAFT"

  # ==========================================================================
  # Rule 8: resource_temporal_overlap — 2 instances with different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rotation_half_open_interval_no_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_ROTATION_OVERLAP]
        distinguishing_aspect: |
          Resource = Session's rotation schedule. Interval semantics =
          half-open [start, end). Two rotations where first.end ==
          second.start do NOT overlap (adjacent OK). first.end >
          second.start by even 1 minute DOES overlap.
        test_recipe:
          setup:
            - "Session with scheduled_start=14:00; rotation_temporal_layout generated 4 rotations"
            - "R1 [14:00, 14:04), R2 [14:09, 14:21) — 5-min changeover gap ensures no overlap"
            - "Manually creating a rotation that overlaps R1's [start, end) by 1 min is rejected"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "RTO1", sanction_year: 2026, sanction_number: "USAG-2026-9001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/sessions/${sess_id}/rotations"
              payload: {}
              as: MeetDirector
          assert:
            - "All 4 generated rotations have non-overlapping half-open intervals"
            - "Each successive rotation starts at least 5 minutes (CHANGEOVER_GAP_MINUTES) after previous ends"
            - "If a manual rotation create attempted with [14:03, 14:30) overlapping R1 [14:00, 14:04): ERR_ROTATION_OVERLAP"

      - name: warmup_block_closed_interval_shared_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_WARMUP_BLOCK_OVERLAP]
          - calculations.warmup_block_layout
        distinguishing_aspect: |
          Resource = Rotation's warmup window. Interval semantics = CLOSED
          [block_start, block_end] BUT shared boundary timestamps are allowed
          (block A end == block B start is OK). Overlap requires strict
          interior intersection. Different from rotation's half-open rule.
        test_recipe:
          setup:
            - "Rotation.scheduled_start = 14:00; warmup window = [13:00, 14:00]"
            - "Generate warmup blocks for 2 squads (4 athletes each): A=[13:00,13:08], B=[13:08,14:00] (B absorbs remainder)"
            - "Blocks share boundary 13:08 — allowed"
            - "Manually creating a third block [13:05, 13:10] strictly overlaps A's interior — rejected"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "RTO2", sanction_year: 2026, sanction_number: "USAG-2026-9002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/squads"
              payload: { squad_label: "A", starting_apparatus: "VAULT" }
              as: MeetDirector
              captures: { sq_a: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/squads"
              payload: { squad_label: "B", starting_apparatus: "UNEVEN_BARS" }
              as: MeetDirector
              captures: { sq_b: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/rotations/${rot_id}/warmup-blocks/generate"
              payload: {}
              as: MeetDirector
          assert:
            - "Generated blocks: A ends at exactly B's start (shared boundary) — no ERR_WARMUP_BLOCK_OVERLAP"
            - "Block intervals together cover [13:00, 14:00] with no gaps and no strict interior overlap"

  # ==========================================================================
  # Rule 9: compensating_invariant — 2 instances with different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: scratch_conserves_final_score_sum_invariant
        grounds:
          - state_machines.AthleteEntry.COMPETING_to_SCRATCHED
          - calculations.all_around_total
          - entities.Score.fields.score_state
        distinguishing_aspect: |
          Conserved quantity = sum of final_total across all FINAL Score rows
          in a session. Forward action: scratch athlete (DRAFT scores -> VOID).
          Compensating action: scratch BEFORE any publish preserves the
          invariant sum(FINAL scores) — scratched athlete contributes 0.000
          and the sum is unchanged because no FINAL score was ever created.
          Formula: sum_final(scores in session) before scratch ==
          sum_final(scores in session) after scratch.
        test_recipe:
          setup:
            - "Session with 2 athletes; E1 has 1 FINAL score (VT=13.500), 3 DRAFT; E2 has 4 FINAL scores (AA=54.600)"
            - "Pre-scratch invariant: sum of all FINAL final_total = 13.5 + 54.6 = 68.100"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "INV1", sanction_year: 2026, sanction_number: "USAG-2027-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "GET /api/v1/sessions/${sess_id}/live-scores"
              payload: {}
              as: MeetDirector
          assert:
            - "After scratching E1: E1's DRAFT scores -> VOID; sum of FINAL final_total remains 68.100"
            - "VOID scores do not contribute to the invariant sum"
            - "E1.all_around_total stays at whatever partial sum was FINAL before scratch (e.g., 13.500)"

      - name: inquiry_uphold_conserves_deduction_neutrality_invariant
        grounds:
          - state_machines.Inquiry.UNDER_REVIEW_to_UPHELD
          - calculations.provisional_score
          - entities.Score.fields.neutral_deduction
        distinguishing_aspect: |
          Conserved quantity = (difficulty_score + execution_score -
          neutral_deduction) evaluated pre-inquiry vs post-inquiry with
          compensating deltas. If a UPHELD inquiry applies d_score_delta = +X
          AND deduction_delta = -X (a swap), then provisional_total is
          unchanged. Invariant: if d_score_delta + e_score_delta -
          deduction_delta == 0 then provisional_total after == before.
          This pins the accounting identity: total = D + E - ND.
        test_recipe:
          setup:
            - "Score published with D=5.2, E=8.85, ND=0.1 -> provisional_total = 13.950"
            - "Inquiry UPHELD with d_score_delta=+0.3, e_score_delta=0, deduction_delta=+0.3 (compensating: D raised by 0.3 AND deduction added by 0.3 — note deduction_delta range is [-5,0] so we use d=+0.3, e=-0.3 instead)"
            - "Actual invariant case: d_score_delta=+0.3, e_score_delta=-0.3, deduction_delta=0 -> total unchanged"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "INV2", sanction_year: 2026, sanction_number: "USAG-2027-0002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", inquiry_window_minutes: 5 }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "GET /api/v1/meets/${meet_id}"
              payload: {}
              as: MeetDirector
          assert:
            - "Pre-inquiry: provisional_total == 13.950"
            - "Post-inquiry with compensating deltas (d=+0.3, e=-0.3, ded=0): provisional_total == 13.950 (invariant preserved)"
            - "Invariant: (D + d_delta) + (E + e_delta) - (ND + ded_delta) == D + E - ND when d_delta + e_delta - ded_delta == 0"
