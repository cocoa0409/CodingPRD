  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_stop_gated_by_farm_operational_status
        grounds:
          - state_machines.CollectionRoute
          - validations[priority=7]
          - errors[ERR_FARM_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair RouteStop x Farm: adding a stop is rejected with ERR_FARM_NOT_ACTIVE
          while the farm is ONBOARDING and succeeds once the same farm reaches ACTIVE — the
          stop's validity depends on the farm's operational state.
        test_recipe:
          setup:
            - "farm F freshly recruited (ONBOARDING, no audit, no contract)"
            - "route R (2026-09-08, capacity 4) exists"
