    description: "Read the current logical clock"
    roles: [BillingAdmin, PlanAdmin, Member, ClinicStaff]
    code: 200
    input: []
    output: ClockState
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a membership/account they do not own" }
  # existence
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Referenced FK in body (plan_id, clinic_id, to_plan_id, enrolled_pet_id) does not exist" }
  # request validation
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, out-of-range numeric (e.g., billing_anchor_day not in 1..28, weight_kg <= 0)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "MemberAccount.email already exists (case-insensitive)" }
  # membership state
  - { id: ERR_MEMBERSHIP_NOT_PENDING, http: 409, condition: "activate requires status PENDING_PAYMENT" }
  - { id: ERR_NO_ENROLLED_PET, http: 409, condition: "activate requires at least one ENROLLED pet" }
  - { id: ERR_PLAN_RETIRED, http: 409, condition: "activate/plan-change targets a RETIRED plan" }
  - { id: ERR_MEMBERSHIP_NOT_ENROLLED, http: 409, condition: "suspend requires status ENROLLED" }
  - { id: ERR_MEMBERSHIP_NOT_SUSPENDED, http: 409, condition: "resume requires status SUSPENDED" }
  - { id: ERR_MEMBERSHIP_NOT_CANCELLABLE, http: 409, condition: "cancel requires status ENROLLED or SUSPENDED" }
  - { id: ERR_MEMBERSHIP_NOT_CANCEL_PENDING, http: 409, condition: "finalize-cancel requires status CANCEL_PENDING" }
  - { id: ERR_TERM_EXPIRED, http: 409, condition: "resume after the ACTIVE term window has closed" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition not covered by a specific membership/term error" }
  # plan change / occ
  - { id: ERR_INVALID_PLAN_CHANGE, http: 422, condition: "plan-change target equals current plan or target not ACTIVE" }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version does not equal current Membership.version" }
  # visits
  - { id: ERR_PET_NOT_IN_MEMBERSHIP, http: 409, condition: "enrolled_pet_id does not belong to the path membership" }
  - { id: ERR_PET_NOT_ACTIVE, http: 409, condition: "visit pet is not ENROLLED" }
  - { id: ERR_CLINIC_CLOSED, http: 409, condition: "visit clinic is CLOSED" }
  - { id: ERR_VISIT_OUTSIDE_TERM, http: 409, condition: "visit instant falls outside the ACTIVE term [starts_at, ends_at)" }
  - { id: ERR_NO_ACTIVE_TERM, http: 409, condition: "no ACTIVE ContractTerm to debit (membership not ENROLLED)" }
  - { id: ERR_VISIT_NOT_VOIDABLE, http: 409, condition: "void requires visit status COMPLETED" }
  - { id: ERR_TERM_NOT_ACTIVE_FOR_VOID, http: 409, condition: "void requires the owning ContractTerm to be ACTIVE" }
  # billing
  - { id: ERR_NOT_DUE_FOR_BILLING, http: 409, condition: "run-epoch invoked but no membership due (reserved for explicit per-membership billing)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Owns the plan/clinic catalog"
    identity: "opaque"
    exclusive_operations:
      - "POST /wellness/plans"
      - "POST /wellness/plans/{id}/retire"
      - "POST /wellness/plan-services"
      - "POST /wellness/plan-services/{id}/retire"
      - "POST /wellness/clinics"
      - "POST /wellness/clinics/{id}/close"
    shared_operations:
      - "GET catalog/membership/term/visit/billing read endpoints"
      - "POST /wellness/_clock/set_current_utc"

  - name: Member
    description: "Account holder; owns own MemberAccount and Memberships"
    identity: "entity_backed:MemberAccount"
    exclusive_operations:
      - "POST /wellness/member-accounts"
      - "POST /wellness/memberships"
      - "POST /wellness/memberships/{id}/pets"
      - "POST /wellness/memberships/{id}/pets/{petId}/remove"
      - "POST /wellness/memberships/{id}/activate"
      - "POST /wellness/memberships/{id}/suspend"
      - "POST /wellness/memberships/{id}/resume"
      - "POST /wellness/memberships/{id}/plan-change"
      - "POST /wellness/memberships/{id}/cancel"
    shared_operations:
      - "GET own membership/account/term/visit/billing reads"

  - name: ClinicStaff
    description: "Records and voids preventive-service visits"
    identity: "opaque"
    exclusive_operations:
      - "POST /wellness/memberships/{id}/visits"
      - "POST /wellness/visits/{id}/void"
    shared_operations:
      - "GET clinic/plan/membership/pet/visit reads"

  - name: BillingAdmin
    description: "Runs the billing epoch and finalizes cancellations"
    identity: "opaque"
    exclusive_operations:
      - "POST /wellness/_billing/run-epoch"
      - "POST /wellness/memberships/{id}/finalize-cancel"
    shared_operations:
      - "GET membership/term/billing reads"
      - "POST /wellness/_clock/set_current_utc"
