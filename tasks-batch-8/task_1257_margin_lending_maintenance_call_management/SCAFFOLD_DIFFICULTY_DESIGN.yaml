scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: equity_realtime_vs_official_close_diverge_on_same_positions
        grounds:
          - calculations.equity_calculation
          - entities.MarginAccount.fields.equity_realtime_cents
          - entities.MarginAccount.fields.equity_official_cents
        distinguishing_aspect: |
          Position-domain dual variant: identical positions and cash produce
          equity_realtime_cents == 800000 while equity_official_cents == 1000000
          once the REALTIME mark moves and the OFFICIAL_CLOSE mark does not.
        test_recipe:
          setup:
            - "Approved account with cash -1000000 and 200 shares ABC; ABC REALTIME mark 9000 and OFFICIAL_CLOSE mark 10000"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Ada Wong", email: "ada@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 9000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { eq_rt: $.data.equity_realtime_cents, eq_off: $.data.equity_official_cents } }
          assert:
            - "MarginAccount.${acct_id}.equity_realtime_cents == 800000"
            - "MarginAccount.${acct_id}.equity_official_cents == 1000000"
            - "equity_realtime_cents != equity_official_cents for identical positions and cash"

      - name: interest_provisional_vs_posted_diverge_on_midmonth_balance_change
        grounds:
          - calculations.interest_accrual
          - entities.InterestLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Interest-ledger-domain dual variant (different domain from equity):
          the PROVISIONAL forward estimate captured on 2026-05-10 (98177 cents)
          differs from the POSTED chronological sum recorded through 2026-05-31
          (87089 cents) because the debit dropped from 12000000 to 10000000 mid-month.
        test_recipe:
          setup:
            - "Account with debit balance 12000000 cents from 2026-05-01 through 2026-05-10 (5 daily accruals of 3167 posted... 10 days elapsed => 10 accruals of 3167 = 31670 month-to-date)"
            - "Rate tiers effective 2026-01-01..open: tier1 (<2500000) 1200bps, tier2 (2500000..9999999) 1100bps, tier3 (>=10000000) 950bps"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Iris West", email: "iris@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "XYZ", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 9500 }, as: MarginSupervisor, captures: { sec_xyz: $.data.id } }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 1, min_balance_cents: 0, annual_rate_bps: 1200, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 2, min_balance_cents: 2500000, annual_rate_bps: 1100, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 3, min_balance_cents: 10000000, annual_rate_bps: 950, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
