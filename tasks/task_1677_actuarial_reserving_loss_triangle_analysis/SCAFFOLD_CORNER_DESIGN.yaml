              as: ActuarialAnalyst
              captures: { tri: $.data.id }
          trigger:
            - call: "PATCH /actuarial/claims/${cl_c}"
              payload: { catastrophe_event_id: "${ev1}" }
              as: ClaimsExaminer
              captures: { seg_flag: $.data.is_segregated, cat: $.data.catastrophe_event_id }
            - call: "GET /actuarial/triangles/${tri}"
              as: ActuarialAnalyst
              captures: { tri_stale: $.data.is_stale }
          assert:
