          trigger:
            - { call: "POST /sevis/reduced-course-loads", payload: { enrollment_id: "${enr_id}", reason_category: "FINAL_TERM", requested_credits: 3 }, as: DSO, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_RCL_NOT_FINAL_TERM"

      - name: medical_rcl_zero_credits_passes_registration
        claim_type: correct_result
        grounds: [calculations.full_time_requirement, state_machines.ReducedCourseLoad.REQUESTED_to_APPROVED]
        distinguishing_aspect: "MEDICAL branch permits a zero-credit floor: requested_credits 0 is approved, effective_min_credits recomputes to 0, and registration at 0 credits succeeds."
        test_recipe:
