            - call: "POST /weld-seams/${t2s1}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { rA: $.data.id }
          trigger:
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s2}", method: "RT", window_start_utc: "2026-08-11T12:00:00Z", window_end_utc: "2026-08-11T13:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s2}", method: "RT", window_start_utc: "2026-08-11T12:00:01Z", window_end_utc: "2026-08-11T13:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { rB: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s3}", method: "UT", window_start_utc: "2026-08-11T10:30:00Z", window_end_utc: "2026-08-11T10:45:00Z", coverage_pct: 100, technician_stamp: "UT-1" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { rC: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${t2s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { rD: $.data.id }
            - call: "POST /nde-reports/${rA}/void"
              payload: { void_reason: "film fogged in transit" }
              as: AuthorizedInspector
              as_user_id: "ai-2"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { rE: $.data.id }
          assert:
            - "trigger call 1 returns 409 ERR_EXAM_WINDOW_CONFLICT: buffering makes the new window [11:00:00Z, 14:00:00Z] and report ${rA} ends at exactly 11:00:00Z, and the comparison is closed, so touching is a conflict"
            - "after the rejected call WeldSeam.${s2}.status is still WELDED and no NdeReport row exists for ${s2}"
            - "trigger call 2 (start moved one second later, 12:00:01Z) succeeds: NdeReport ${rB}.status == SCHEDULED and WeldSeam.${s2}.status == EXAM_SCHEDULED"
            - "trigger call 3 succeeds even though the UT window 10:30-10:45Z lies wholly inside ${rA}'s RT window: only RT-versus-RT pairs are compared"
            - "trigger call 4 succeeds with the identical window as ${rA}: the exclusion resource is the tank, and ${t2s1} belongs to TK-102"
            - "the void moves ${rA} to VOIDED and returns WeldSeam.${s1} to WELDED, and ShellCourse.${course_id}.status is re-derived to WELDED"
            - "trigger call 6 re-books 10:00-11:00Z on TK-101 and succeeds because ${rA} is VOIDED and ${rB}'s window starts at 12:00:01Z, exactly one second after the buffered end 12:00:00Z of the new window"
            - "GET /nde-reports?weld_seam_id=${s1} lists exactly two rows, ${rA} VOIDED and ${rE} SCHEDULED"

      - name: water_withdrawal_half_open_additive_rate_envelope_per_source
        grounds:
          - calculations.withdrawal_rate_envelope
          - calculations.water_volume_ledger
          - validations.priority_50_ERR_WITHDRAWAL_CAPACITY_CONFLICT
          - state_machines.WaterWithdrawal.RESERVED_to_CANCELLED
          - concurrency_rules.expected_water_source_version
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) with no buffer, so a window that starts
          exactly when another ends is accepted - the opposite decision from the RT rule on
          the same instant relationship. The contended resource is the WATER SOURCE, not the
          tank, the constraint is ADDITIVE (the summed gpm of every overlapping RESERVED
          window against a ceiling, inclusive at the ceiling) rather than pairwise
          exclusive, and cancelling one window frees rate for a window that was refused a
          moment earlier.
        test_recipe:
          setup:
            - "One tank with a DRAFT hydrotest plan against a water source permitting 2000000 gal at max 900 gpm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 350000, disposal_method: "SANITARY_SEWER", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T08:00:00Z", window_end_utc: "2026-08-12T12:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { w1: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T10:00:00Z", window_end_utc: "2026-08-12T14:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { w2: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v3: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T11:00:00Z", window_end_utc: "2026-08-12T11:30:00Z", rate_gpm: 300, reserved_volume_gal: 50000, expected_water_source_version: "${ws_v3}" }
              as: ErectionSuperintendent
              captures: { w3: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v4: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T11:15:00Z", window_end_utc: "2026-08-12T11:20:00Z", rate_gpm: 0.1, reserved_volume_gal: 100, expected_water_source_version: "${ws_v4}" }
              as: ErectionSuperintendent
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T12:00:00Z", window_end_utc: "2026-08-12T13:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v4}" }
              as: ErectionSuperintendent
              captures: { w5: $.data.id }
            - call: "POST /water-withdrawals/${w3}/cancellation"
              payload: { cancellation_reason: "crew reassigned" }
              as: ErectionSuperintendent
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v5: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T11:15:00Z", window_end_utc: "2026-08-12T11:20:00Z", rate_gpm: 0.1, reserved_volume_gal: 100, expected_water_source_version: "${ws_v5}" }
              as: ErectionSuperintendent
              captures: { w4: $.data.id }
          assert:
            - "the setup's third withdrawal ${w3} is accepted at a peak of exactly 300 + 300 + 300 == 900.0 gpm, equal to max_concurrent_rate_gpm: the ceiling is inclusive"
            - "after setup WaterSource.${ws_id}.reserved_volume_gal == 250000.00 and available_volume_gal == 1750000.00"
            - "trigger call 1 returns 409 ERR_WITHDRAWAL_CAPACITY_CONFLICT: the 11:15-11:20Z window overlaps ${w1}, ${w2} and ${w3}, so the peak would be 900.1 gpm - a 0.1 gpm excess is enough"
            - "the refused call leaves WaterSource.${ws_id}.version, reserved_volume_gal and available_volume_gal untouched, and no WaterWithdrawal row is created"
            - "trigger call 2 succeeds: 12:00:00Z is exactly ${w1}'s window_end_utc, and half-open semantics mean no overlap with ${w1}, so the peak is 300 (${w2}) + 300 (new) == 600.0 gpm"
            - "after ${w5} WaterSource.${ws_id}.reserved_volume_gal == 350000.00 and available_volume_gal == 1650000.00"
            - "cancelling ${w3} sets its status CANCELLED with cancellation_reason 'crew reassigned' and returns 50000 gal: reserved_volume_gal == 300000.00, available_volume_gal == 1700000.00"
            - "trigger call 5 replays the byte-identical window and rate that was refused in call 1 and now succeeds, because ${w3} no longer consumes rate: the peak is 300 + 300 + 0.1 == 600.1 gpm"
            - "after ${w4} WaterSource.${ws_id}.reserved_volume_gal == 300100.00 and available_volume_gal == 1699900.00, and permitted_volume_gal == available + reserved + consumed holds"
            - "GET /water-withdrawals?water_source_id=${ws_id}&status=RESERVED lists exactly ${w1}, ${w2}, ${w5} and ${w4}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: steel_mass_conserved_across_allocation_and_release
        grounds:
          - calculations.plate_steel_ledger
          - state_machines.PlateLot.SHIPPED_to_RECEIVED
          - state_machines.PlateLot.RECEIVED_to_QUARANTINED
          - endpoints.POST_plate_lots_allocations
          - endpoints.POST_shell_courses_allocation_release
          - validations.priority_52_ERR_PLATE_WEIGHT_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity: STEEL MASS in pounds, held as the identity
          Tank.steel_received_lb - Tank.steel_allocated_lb == SUM(PlateLot.remaining_weight_lb)
          over two lots and two courses. The compensating write is a manual
          allocation-release, and the wrinkle is that quarantine deliberately does NOT
          decrement received weight: steel that is on site but unusable still counts in the
          conserved total, so the invariant must survive a status change that intuition says
          should remove mass.
        test_recipe:
          setup:
            - "One tank with two SPECIFIED courses and two RECEIVED plate lots: lot A 10 plates at 1250.5 lb, lot B 4 plates at 900.25 lb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c1: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 2, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c2: $.data.id }
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Coatesville", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lotA: $.data.id }
            - call: "POST /plate-lots/${lotA}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotA}/status-transitions"
              payload: { target_status: "SHIPPED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotA}/status-transitions"
              payload: { target_status: "RECEIVED", mtr_number: "MTR-A-1" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Coatesville", heat_number: "H-4472", thickness_in: 0.4375, plate_count: 4, plate_weight_lb: 900.25, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lotB: $.data.id }
            - call: "POST /plate-lots/${lotB}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotB}/status-transitions"
              payload: { target_status: "SHIPPED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotB}/status-transitions"
              payload: { target_status: "RECEIVED", mtr_number: "MTR-B-1" }
              as: ErectionSuperintendent
          trigger:
            - call: "POST /plate-lots/${lotA}/allocations"
              payload: { shell_course_id: "${c1}", allocated_weight_lb: 8000 }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotB}/allocations"
              payload: { shell_course_id: "${c2}", allocated_weight_lb: 3601.00 }
              as: ErectionSuperintendent
            - call: "POST /shell-courses/${c2}/allocation-release"
              payload: { reason: "course 2 re-detailed to a thicker plate" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lotB}/status-transitions"
              payload: { target_status: "QUARANTINED", remarks: "MTR chemistry mismatch" }
              as: ErectionSuperintendent
          assert:
            - "after setup PlateLot.${lotA}: received_weight_lb == 12505.00, allocated_weight_lb == 0.00, remaining_weight_lb == 12505.00; PlateLot.${lotB}: received 3601.00, remaining 3601.00"
            - "after setup Tank.${tank_id}.steel_received_lb == 16106.00 and steel_allocated_lb == 0.00, and the invariant 16106.00 - 0.00 == 12505.00 + 3601.00 holds"
            - "after trigger 1 PlateLot.${lotA}.allocated_weight_lb == 8000.00 and remaining_weight_lb == 4505.00; ShellCourse.${c1}.allocation_status == ALLOCATED with allocated_plate_lot_id == ${lotA}; Tank.steel_allocated_lb == 8000.00 and 16106.00 - 8000.00 == 4505.00 + 3601.00"
            - "trigger 2 allocates exactly PlateLot.${lotB}.remaining_weight_lb and is accepted (the ERR_PLATE_WEIGHT_EXCEEDED bound is inclusive); PlateLot.${lotB}.remaining_weight_lb == 0.00 and Tank.steel_allocated_lb == 11601.00, so 16106.00 - 11601.00 == 4505.00 + 0.00"
            - "trigger 3 restores PlateLot.${lotB} to allocated_weight_lb 0.00 / remaining_weight_lb 3601.00 and ShellCourse.${c2} to allocation_status UNALLOCATED with allocated_plate_lot_id null and allocated_weight_lb 0.00 - byte-identical to the pre-allocation snapshot, with no drift"
            - "after trigger 3 Tank.${tank_id}.steel_allocated_lb == 8000.00 again and steel_received_lb is still 16106.00"
            - "trigger 4 succeeds because PlateLot.${lotB}.allocated_weight_lb is back to 0.00, and after it Tank.${tank_id}.steel_received_lb is STILL 16106.00 - quarantined steel stays in the conserved total, while the lot becomes unallocatable"
            - "a further POST /plate-lots/${lotB}/allocations for ${c2} now returns 409 ERR_ALLOCATION_STATE_INVALID, and the ledger is unchanged by the rejected call"

      - name: water_volume_conserved_across_plan_rejection_cascade
        grounds:
          - calculations.water_volume_ledger
          - calculations.hydrotest_water_and_disposal_cost
          - calculations.hydrotest_permit_surcharge
          - state_machines.HydrotestPlan.DRAFT_to_REJECTED
          - state_machines.WaterWithdrawal.RESERVED_to_CANCELLED_cascade
        distinguishing_aspect: |
          Conserved quantity: PERMITTED WATER VOLUME in gallons, held as
          permitted_volume_gal == available + reserved + consumed on the WaterSource. The
          compensating write is not a manual undo of one row: a single approval REJECT
          cascades into every RESERVED withdrawal of the plan, and the plan's frozen money
          fields must unwind with it (subtotal 1900.50 back to 0.00), so the reversal spans
          a volume ledger and a currency ledger in one request.
        test_recipe:
          setup:
            - "One tank with a DRAFT hydrotest plan and two RESERVED withdrawals of 100000 and 250000 gal against a 2000000 gal permit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 350000, disposal_method: "SANITARY_SEWER", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T08:00:00Z", window_end_utc: "2026-08-12T12:00:00Z", rate_gpm: 400, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { w1: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-13T08:00:00Z", window_end_utc: "2026-08-13T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 250000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { w2: $.data.id }
          trigger:
            - call: "POST /hydrotest-plans/${plan_id}/approval"
              payload: { decision: "REJECT", remarks: "water disposal permit not in hand" }
              as: ProjectEngineer
              as_user_id: "pe-1"
          assert:
            - "before the trigger WaterSource.${ws_id}: reserved_volume_gal == 350000.00, consumed_volume_gal == 0.00, available_volume_gal == 1650000.00, and 2000000 == 1650000 + 350000 + 0"
            - "before the trigger WaterWithdrawal.${w1}.withdrawal_cost_usd == 333.00 and ${w2}.withdrawal_cost_usd == 832.50"
            - "before the trigger HydrotestPlan.${plan_id}: water_cost_usd == 1165.50, disposal_cost_usd == 735.00 (350 kgal at the 1.00 tier), subtotal_usd == 1900.50, permit_surcharge_pct == 0.03, surcharge_usd == 57.02, total_cost_usd == 1957.52"
            - "the trigger returns 200 with HydrotestPlan.${plan_id}.status == REJECTED"
            - "both withdrawals are CANCELLED in the same response with cancellation_reason 'PLAN_REJECTED', in created_at order"
            - "after the trigger WaterSource.${ws_id}: reserved_volume_gal == 0.00, consumed_volume_gal == 0.00, available_volume_gal == 2000000.00 - exactly the pre-reservation values, with no drift"
            - "after the trigger HydrotestPlan.${plan_id}: water_cost_usd == 0.00, disposal_cost_usd == 0.00, subtotal_usd == 0.00, permit_surcharge_pct == 0.00, surcharge_usd == 0.00, total_cost_usd == 0.00 - the CANCELLED rows leave the cost input set entirely"
            - "each cancelled WaterWithdrawal keeps its own withdrawal_cost_usd value on the row (333.00 and 832.50): the reversal is of the aggregate, not of the historical record"
            - "Tank.${tank_id}.active_hydrotest_plan_id is null and a later POST /water-withdrawals against the REJECTED plan is refused, so the released volume cannot be silently re-consumed"

      - name: nonconformance_count_and_reject_rate_reversed_by_nde_void
        grounds:
          - calculations.tank_quality_posture
          - calculations.weld_reject_rate_escalation
          - state_machines.NdeReport.REPORTED_REJECT_to_VOIDED
          - state_machines.HydrotestPlan.SUSPENDED_to_APPROVED
          - state_machines.Tank.construction_phase.SHELL_COMPLETE_to_ERECTION_IN_PROGRESS
        distinguishing_aspect: |
          Conserved quantities: an integer COUNT (Tank.open_nonconformance_count) and the
          4-decimal RATE derived from the examined population, both of which must return to
          their pre-rejection values when the rejection is voided. Two exceptions are
          deliberate and must NOT be compensated: a cancelled WaterWithdrawal is never
          resurrected, and the operator-driven construction_phase is not silently pushed
          back to SHELL_COMPLETE - so the test proves both perfect reversal of the derived
          quantities and the exact boundary of the compensation.
        test_recipe:
          setup:
            - "A tank at SHELL_COMPLETE with three RT-accepted seams, an APPROVED plan and one RESERVED withdrawal; a fourth RT report is then scheduled on seam V3 as a re-examination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V2", length_in: 96, sequence_index: 2 }
              as: ErectionSuperintendent
              captures: { s2: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V3", length_in: 96, sequence_index: 3 }
              as: ErectionSuperintendent
              captures: { s3: $.data.id }
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /weld-seams/${s2}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /weld-seams/${s3}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r1: $.data.id }
            - call: "POST /nde-reports/${r1}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s2}", method: "RT", window_start_utc: "2026-08-12T10:00:00Z", window_end_utc: "2026-08-12T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r2: $.data.id }
            - call: "POST /nde-reports/${r2}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s3}", method: "RT", window_start_utc: "2026-08-13T10:00:00Z", window_end_utc: "2026-08-13T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r3: $.data.id }
            - call: "POST /nde-reports/${r3}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /tanks/${tank_id}/phase-transitions"
              payload: { target_phase: "SHELL_COMPLETE" }
              as: ProjectEngineer
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "SANITARY_SEWER", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/approval"
              payload: { decision: "APPROVE" }
              as: ProjectEngineer
              as_user_id: "pe-1"
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-20T08:00:00Z", window_end_utc: "2026-08-20T18:00:00Z", rate_gpm: 700, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { w1: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s3}", method: "RT", window_start_utc: "2026-08-14T10:00:00Z", window_end_utc: "2026-08-14T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r4: $.data.id }
          trigger:
            - call: "POST /nde-reports/${r4}/result"
              payload: { decision: "REJECT", indication_count: 2, film_count: 4, defect_type: "SLAG_INCLUSION" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports/${r4}/void"
              payload: { void_reason: "radiograph attributed to the wrong seam" }
              as: AuthorizedInspector
              as_user_id: "ai-2"
            - call: "POST /tanks/${tank_id}/phase-transitions"
              payload: { target_phase: "SHELL_COMPLETE" }
              as: ProjectEngineer
          assert:
            - "before the trigger Tank.${tank_id}: open_nonconformance_count == 0, quality_posture == OPEN, weld_reject_rate == 0.0000, required_examination_pct == 10.0, construction_phase == ERECTION_IN_PROGRESS (already reverted by scheduling ${r4} on an accepted seam), and ShellCourse.${course_id}.status == WELDED"
            - "after trigger 1: NdeReport.${r4}.status == REPORTED_REJECT with nonconformance_open true; WeldSeam.${s3}.status == RT_REJECTED with repair_cycle_count 0; Tank.open_nonconformance_count == 1; quality_posture == RESTRICTED"
            - "after trigger 1: weld_reject_rate == 0.2500 (1 reject in 4 reported RT reports) and required_examination_pct == 50.0"
            - "after trigger 1 the cascade suspends the plan: HydrotestPlan.${plan_id}.status == SUSPENDED with state_before_suspension == APPROVED, and WaterWithdrawal.${w1}.status == CANCELLED with cancellation_reason 'PLAN_SUSPENDED', so WaterSource.${ws_id}.reserved_volume_gal == 0.00 and available_volume_gal == 2000000.00"
            - "after trigger 2: NdeReport.${r4}.status == VOIDED with nonconformance_open false and void_reason stored; WeldSeam.${s3}.status == WELDED and repair_cycle_count is STILL 0 - the void is not a repair cycle"
            - "after trigger 2 the count is exactly restored: Tank.open_nonconformance_count == 0 and quality_posture == OPEN"
            - "after trigger 2 the rate is exactly restored: weld_reject_rate == 0.0000 over the 3 remaining reported RT reports and required_examination_pct == 10.0 - the voided report leaves the examined population, it is not counted as an acceptance"
            - "after trigger 2 HydrotestPlan.${plan_id}.status == APPROVED again with state_before_suspension null, and fill_percent_current is still 0.0"
            - "NOT compensated: WaterWithdrawal.${w1} stays CANCELLED and WaterSource.${ws_id}.reserved_volume_gal stays 0.00 - the reservation must be re-created explicitly"
            - "NOT compensated: Tank.${tank_id}.construction_phase is still ERECTION_IN_PROGRESS and ShellCourse.${course_id}.status is WELDED, so trigger 3 returns 409 ERR_PHASE_TRANSITION_INVALID because seam ${s3} is WELDED rather than RT_ACCEPTED"
            - "GET /nde-reports?weld_seam_id=${s3} lists ${r3} REPORTED_ACCEPT and ${r4} VOIDED, and GET /nde-reports?nonconformance_open=true on this tank returns an empty list"
