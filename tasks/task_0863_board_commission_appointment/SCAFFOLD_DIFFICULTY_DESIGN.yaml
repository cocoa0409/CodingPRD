        distinguishing_aspect: "On a re-confirm by the nominator, both a state violation (appointment already CONFIRMED, pri 40, category state) and an SoD violation (voter==nominator, pri 50, category business_constraint) hold; state wins -> ERR_INVALID_STATE."
