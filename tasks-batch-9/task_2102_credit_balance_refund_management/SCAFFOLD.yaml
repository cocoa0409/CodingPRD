# =============================================================================
# task_2102 — Credit Balance & Refund Management (hospital patient accounting)
# Difficulty band: BEYOND Expert (§0.4) — 14 entities, 63 endpoints, 57 errors,
# 8 calculations (3 dual-variant / 3 combinatorial modes), 9 state machines.
# =============================================================================

scenario: |
  Credit Balance & Refund Management (hospital patient accounting): credit balance identification & aging, patient vs payer overpayment determination, refund approval workflow & check issuance, Medicare 60-day repayment rule compliance, unclaimed property escheatment for stale refunds, take-back/offset reconciliation, root-cause analysis of posting errors, audit reporting of credit balance liability

domain_name: credit-balance-refund-management
# Flat peer collections rooted at "/" — every entity is a top-level collection
# addressed by its own id; relationships are expressed by foreign keys in bodies
# and by filtered-list query parameters, never by URL nesting.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: graph
  # graph: OffsetApplication is a junction across TakeBackNotice x PatientAccount
  # x CreditBalance; AccountTransaction.reversal_of_transaction_id and
  # CheckDisbursement.reissue_of_disbursement_id are self-referential edges.
  # URL shape is flat (no nesting) — see api_prefix.

  state_machine_shape: parallel
  # RefundRequest carries two independent state dimensions (approval_state x
  # disbursement_state); CreditBalance, TakeBackNotice and
  # MedicareRepaymentObligation all contain revert cycles; CheckDisbursement
  # is a branching fork-join with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The analyst who prepares a refund may not approve it; an approver may not
  # supply the second approval on a tier-3 request; the disbursement officer
  # who issues checks holds no approval authority; the payer liaison is scoped
  # to its own Payer row.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer display name" }
      - { name: payer_code, type: string, source: input, description: "Short external code", constraints: "globally unique; 2-16 chars" }
      - { name: payer_type, type: enum, source: input, description: "MEDICARE | MEDICAID | COMMERCIAL | TRICARE | SELF_PAY" }
      - { name: take_back_allowed, type: boolean, source: input, default: true, description: "Whether this payer may file take-back/recoupment notices" }
      - { name: refund_remit_days, type: integer, source: input, default: 30, description: "Contractual days the hospital has to remit a payer refund" }

  - name: PatientAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "Hospital account number", constraints: "globally unique" }
      - { name: mrn, type: string, source: input, description: "Medical record number" }
      - { name: patient_name, type: string, source: input, description: "Patient/guarantor name" }
      - { name: guarantor_state_code, type: enum, source: input, description: "CA | TX | NY | FL — guarantor state of record" }
      - { name: primary_payer_id, type: string, source: input, description: "FK -> Payer.id; primary payer of record for the account" }
      - { name: financial_class, type: enum, source: input, description: "INPATIENT | OUTPATIENT | EMERGENCY" }
      - { name: discharge_date, type: datetime, source: input, description: "Discharge timestamp (ISO 8601 UTC)" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "= sum(AccountTransaction.amount_cents) over ALL transactions on this account (reversal rows carry the negation). Negative means the account is in credit." }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "= sum(CreditBalance.credit_amount_cents) over CreditBalance rows on this account whose status IN {IDENTIFIED, UNDER_REVIEW, ATTRIBUTED, REFUND_PENDING} (open credit liability)" }
      - { name: last_activity_at, type: datetime, source: computed, description: "= max(AccountTransaction.posted_at) over transactions on this account where is_reversed == false; null when none" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED | BAD_DEBT" }

  - name: AccountTransaction
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; owning account (taken from the path)" }
      - { name: txn_type, type: enum, source: input, description: "CHARGE | PAYMENT | CONTRACTUAL_ADJUSTMENT | REFUND_DISBURSEMENT | TAKE_BACK_OFFSET | ESCHEAT_REMITTANCE | REVERSAL" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents. CHARGE/REFUND_DISBURSEMENT/TAKE_BACK_OFFSET/ESCHEAT_REMITTANCE are positive; PAYMENT/CONTRACTUAL_ADJUSTMENT are negative; REVERSAL carries the exact negation of its target." }
      - { name: source, type: enum, source: input, description: "PATIENT | PAYER | SYSTEM — who the money came from; drives attribution buckets" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; required when source == PAYER, null otherwise" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant at which the row was written" }
      - { name: effective_at, type: datetime, source: input, description: "Service/effective date; defaults to posted_at when omitted" }
      - { name: reversal_of_transaction_id, type: string, source: system, description: "FK -> AccountTransaction.id; set only on REVERSAL rows, null otherwise" }
      - { name: is_reversed, type: boolean, source: computed, default: false, description: "true when a REVERSAL row exists whose reversal_of_transaction_id == this row's id" }
      - { name: remark, type: string, source: input, description: "Free-text posting note" }

  - name: CreditBalance
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; account carrying the credit" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; copied from PatientAccount.primary_payer_id at identification" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "= -PatientAccount.balance_cents frozen at the identification sweep that created this row; always > 0" }
      - { name: identified_at, type: datetime, source: system, description: "Logical-clock instant of the identification sweep that created this row" }
      - { name: attribution_method, type: enum, source: input, default: null, description: "PROPORTIONAL | REVERSE_CHRONOLOGICAL — chosen at attribute time; null before that" }
      - { name: attribution, type: enum, source: computed, default: null, description: "PATIENT | PAYER | SPLIT | UNDETERMINED — derived by credit_balance_attribution_split" }
      - { name: patient_portion_cents, type: integer, source: computed, default: 0, description: "Patient-owed slice of credit_amount_cents" }
      - { name: payer_portion_cents, type: integer, source: computed, default: 0, description: "Payer-owed slice of credit_amount_cents" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "= sum(CheckDisbursement.gross_amount_cents) over checks on this credit balance whose state IN {ISSUED, CLEARED, STALE, REISSUED, ESCHEATED}" }
      - { name: offset_cents, type: integer, source: computed, default: 0, description: "= sum(OffsetApplication.applied_cents) over rows on this credit balance whose state == APPLIED" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= credit_amount_cents - refunded_cents - offset_cents" }
      - { name: aging_days, type: integer, source: computed, description: "Whole days from identified_at to the logical clock; see credit_balance_aging" }
      - { name: aging_bucket, type: enum, source: computed, description: "D0_30 | D31_60 | D61_90 | D91_180 | OVER_180" }
      - { name: root_cause_confirmed, type: boolean, source: computed, default: false, description: "true when at least one RootCauseFinding on this credit balance has confirmed == true" }
      - { name: status, type: enum, source: system, default: "IDENTIFIED", description: "IDENTIFIED | UNDER_REVIEW | ATTRIBUTED | REFUND_PENDING | REFUNDED | RESOLVED_BY_OFFSET | ESCHEATED | WRITTEN_OFF" }

  - name: RootCauseFinding
    parent: null
    common_fields: true
    fields:
      - { name: credit_balance_id, type: string, source: input, description: "FK -> CreditBalance.id; the credit balance being explained" }
      - { name: cause_code, type: enum, source: input, description: "DUPLICATE_PAYMENT | CONTRACTUAL_UNDER_ADJUSTMENT | WRONG_ACCOUNT_POSTING | COB_PRIMARY_SECONDARY | ESTIMATE_OVERCOLLECTION | RETRO_ELIGIBILITY_CHANGE" }
      - { name: corrective_action, type: enum, source: input, description: "REPOST_TRANSACTION | UPDATE_CONTRACT_TERMS | STAFF_RETRAINING | PAYER_ESCALATION | NONE" }
      - { name: evidence_transaction_ids, type: array, source: input, default: [], description: "AccountTransaction ids cited as evidence for this finding" }
      - { name: narrative, type: string, source: input, description: "Analyst narrative" }
      - { name: analyst_user_id, type: string, source: system, description: "X-User-ID of the CreditAnalyst who filed the finding" }
      - { name: confirmed, type: boolean, source: input, default: false, description: "true once the analyst asserts the cause is proven" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: credit_balance_id, type: string, source: input, description: "FK -> CreditBalance.id; the credit being refunded" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Gross refund amount requested, in cents" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "= requested_amount_cents once approval_state == APPROVED; 0 in every other approval_state" }
      - { name: payee_type, type: enum, source: input, description: "PATIENT | PAYER — which attribution bucket funds this refund" }
      - { name: payee_name, type: string, source: input, description: "Name printed on the check" }
      - { name: payee_address_line, type: string, source: input, description: "Mailing address printed on the check" }
      - { name: payee_state_code, type: enum, source: input, description: "CA | TX | NY | FL — escheat jurisdiction of the payee" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the CreditAnalyst who created the request" }
      - { name: required_approval_tier, type: integer, source: computed, description: "1..3, from refund_approval_tier" }
      - { name: required_approval_count, type: integer, source: computed, description: "2 when required_approval_tier == 3, else 1" }
      - { name: approvals_received, type: integer, source: computed, default: 0, description: "Count of RefundApproval rows on this request with decision == APPROVED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times approval_state has entered RETURNED_FOR_REVISION" }
      - { name: last_decision_user_id, type: string, source: system, description: "X-User-ID of the most recent RefundApprover to decide on this request" }
      - { name: approval_state, type: enum, source: system, default: "DRAFT", description: "Dimension 1 — DRAFT | SUBMITTED | APPROVED | REJECTED | RETURNED_FOR_REVISION | CANCELLED" }
      - { name: disbursement_state, type: enum, source: system, default: "NOT_SCHEDULED", description: "Dimension 2 — NOT_SCHEDULED | BATCHED | ISSUED | CLEARED | REISSUE_PENDING | VOID_CLOSED" }

  - name: RefundApproval
    parent: null
    common_fields: false
    fields:
      - { name: refund_request_id, type: string, source: system, description: "FK -> RefundRequest.id; the request decided on (taken from the path)" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the deciding RefundApprover" }
      - { name: approver_tier, type: integer, source: input, description: "Signing authority the approver claims, 1..3" }
      - { name: decision, type: enum, source: input, description: "APPROVED | REJECTED | RETURNED" }
      - { name: note, type: string, source: input, description: "Decision note" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the decision" }

  - name: RefundBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_number, type: string, source: input, description: "Check-run identifier", constraints: "globally unique" }
      - { name: bank_account_code, type: enum, source: input, description: "OPERATING | TRUST | ESCROW — disbursement channel the run draws on" }
      - { name: cutoff_at, type: datetime, source: input, description: "Inclusive start of the run's occupation window on bank_account_code" }
      - { name: scheduled_run_at, type: datetime, source: input, description: "Exclusive end of the run's occupation window; also the intended issue instant" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Count of CheckDisbursement rows whose refund_batch_id == this batch and state != VOIDED" }
      - { name: total_gross_cents, type: integer, source: computed, default: 0, description: "Sum of gross_amount_cents over the batch's counted checks" }
      - { name: total_fee_cents, type: integer, source: computed, default: 0, description: "Sum of processing_fee_cents over the batch's counted checks" }
      - { name: total_net_cents, type: integer, source: computed, default: 0, description: "Sum of net_check_amount_cents over the batch's counted checks" }
      - { name: state, type: enum, source: system, default: "OPEN", description: "OPEN | LOCKED | ISSUED | CLOSED" }

  - name: CheckDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: refund_request_id, type: string, source: system, description: "FK -> RefundRequest.id; the approved request this check pays" }
      - { name: refund_batch_id, type: string, source: system, description: "FK -> RefundBatch.id; the check run that carries this line" }
      - { name: reissue_of_disbursement_id, type: string, source: system, description: "FK -> CheckDisbursement.id; set when this check replaces a voided or stale predecessor, null otherwise" }
      - { name: check_number, type: string, source: system, description: "Assigned at batch issue; null while the batch is OPEN or LOCKED" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "= RefundRequest.approved_amount_cents frozen when the line was added to the batch" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "From refund_net_disbursement step 2" }
      - { name: net_check_amount_cents, type: integer, source: computed, description: "= gross_amount_cents - processing_fee_cents" }
      - { name: payee_state_code, type: enum, source: computed, description: "Copied from RefundRequest.payee_state_code; the escheat jurisdiction" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the batch was issued; null before that" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock instant the check cleared the bank; null otherwise" }
      - { name: stale_at, type: datetime, source: computed, description: "= issued_at + CHECK_STALE_DAYS; null before issue" }
      - { name: void_reason, type: enum, source: system, default: null, description: "STALE_DATED | WRONG_PAYEE | BATCH_ERROR | PAYER_REQUEST; null unless state == VOIDED" }
      - { name: state, type: enum, source: system, default: "PENDING", description: "PENDING | ISSUED | CLEARED | VOIDED | STALE | REISSUED | ESCHEATED" }

  - name: TakeBackNotice
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; the payer demanding recoupment" }
      - { name: notice_number, type: string, source: input, description: "Payer's notice identifier", constraints: "unique within payer_id" }
      - { name: total_recoup_cents, type: integer, source: input, description: "Total amount the payer intends to recoup, in cents" }
      - { name: admin_fee_cents, type: integer, source: input, default: 0, description: "Administrative fee the payer withholds, prorated across offset lines" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant the notice was recorded" }
      - { name: dispute_deadline_at, type: datetime, source: computed, description: "= received_at + DISPUTE_WINDOW_DAYS" }
      - { name: applied_cents, type: integer, source: computed, default: 0, description: "= sum(OffsetApplication.applied_cents) over rows on this notice whose state == APPLIED" }
      - { name: remaining_unapplied_cents, type: integer, source: computed, description: "= total_recoup_cents - applied_cents" }
      - { name: state, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | PARTIALLY_APPLIED | FULLY_APPLIED | DISPUTED | WITHDRAWN" }

  - name: OffsetApplication
    parent: null
    common_fields: true
    fields:
      - { name: take_back_notice_id, type: string, source: system, description: "FK -> TakeBackNotice.id; the notice being worked down" }
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; account the offset was posted against" }
      - { name: credit_balance_id, type: string, source: system, description: "FK -> CreditBalance.id; the credit consumed by this line" }
      - { name: posted_transaction_id, type: string, source: system, description: "FK -> AccountTransaction.id; the TAKE_BACK_OFFSET posting this line created" }
      - { name: applied_cents, type: integer, source: computed, description: "Cents consumed on this waterfall line" }
      - { name: admin_fee_share_cents, type: integer, source: computed, description: "This line's prorated slice of TakeBackNotice.admin_fee_cents" }
      - { name: sequence, type: integer, source: system, description: "1-based waterfall position within the notice, monotone across calls" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock instant the line was applied" }
      - { name: reversed_at, type: datetime, source: system, description: "Logical-clock instant the line was reversed; null while APPLIED" }
      - { name: state, type: enum, source: system, default: "APPLIED", description: "APPLIED | REVERSED" }

  - name: MedicareRepaymentObligation
    parent: null
    common_fields: true
    fields:
      - { name: credit_balance_id, type: string, source: system, description: "FK -> CreditBalance.id; the identified overpayment" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; the Medicare payer owed repayment" }
      - { name: identified_at, type: datetime, source: system, description: "Copied from CreditBalance.identified_at — the 60-day clock start" }
      - { name: due_at, type: datetime, source: computed, description: "= identified_at + MEDICARE_REPAYMENT_WINDOW_DAYS" }
      - { name: reportable_amount_cents, type: integer, source: computed, description: "= CreditBalance.payer_portion_cents frozen at attribution" }
      - { name: days_elapsed, type: integer, source: computed, description: "Whole days from identified_at to the logical clock" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "= max(0, days_elapsed - MEDICARE_REPAYMENT_WINDOW_DAYS)" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Tiered late assessment; see medicare_repayment_deadline" }
      - { name: report_reference, type: string, source: input, description: "Self-report reference string supplied by the ComplianceOfficer" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant of self-report; null before that" }
      - { name: satisfied_at, type: datetime, source: system, description: "Logical-clock instant repayment completed; null before that" }
      - { name: satisfaction_mode, type: enum, source: system, default: null, description: "REFUND_CHECK | OFFSET | WRITE_OFF; null while unsatisfied" }
      - { name: state, type: enum, source: system, default: "OPEN", description: "OPEN | LATE | REPORTED | REPORTED_LATE | SATISFIED | SATISFIED_LATE | SATISFIED_BY_OFFSET" }

  - name: EscheatmentRecord
    parent: null
    common_fields: true
    fields:
      - { name: check_disbursement_id, type: string, source: input, description: "FK -> CheckDisbursement.id; the stale check whose funds may escheat" }
      - { name: basis, type: enum, source: input, default: "ISSUE_DATE", description: "ISSUE_DATE | LAST_CONTACT — dormancy clock basis" }
      - { name: state_code, type: enum, source: computed, description: "CA | TX | NY | FL — copied from CheckDisbursement.payee_state_code; sets the dormancy period" }
      - { name: dormancy_days, type: integer, source: computed, description: "Statutory dormancy period for state_code" }
      - { name: dormancy_start_at, type: datetime, source: computed, description: "Basis-dependent start of the dormancy clock" }
      - { name: escheat_due_at, type: datetime, source: computed, description: "= dormancy_start_at + dormancy_days" }
      - { name: due_diligence_open_at, type: datetime, source: computed, description: "= escheat_due_at - DUE_DILIGENCE_LEAD_DAYS; earliest instant a due-diligence letter may be sent" }
      - { name: contact_method, type: enum, source: input, default: null, description: "FIRST_CLASS_MAIL | CERTIFIED_MAIL | EMAIL; recorded when due diligence is sent" }
      - { name: due_diligence_sent_at, type: datetime, source: system, description: "Logical-clock instant the letter was sent; null before that" }
      - { name: remitted_amount_cents, type: integer, source: computed, default: 0, description: "= CheckDisbursement.net_check_amount_cents once state == REMITTED, else 0" }
      - { name: claimed_at, type: datetime, source: system, description: "Logical-clock instant the payee claimed the funds; null otherwise" }
      - { name: state, type: enum, source: system, default: "DORMANT", description: "DORMANT | DUE_DILIGENCE_SENT | CLAIMED | REMITTED | EXEMPT" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: report_type, type: enum, source: input, description: "CREDIT_BALANCE_LIABILITY | MEDICARE_CBR | ESCHEAT_HOLDER_REPORT" }
      - { name: scope_code, type: string, source: input, description: "ALL, a Payer.payer_type value, or a state code — the reporting scope" }
      - { name: period_start_at, type: datetime, source: input, description: "Inclusive start of the reporting period (closed interval)" }
      - { name: period_end_at, type: datetime, source: input, description: "Inclusive end of the reporting period (closed interval)" }
      - { name: as_of_at, type: datetime, source: input, description: "Valuation instant used for aging and inclusion filters" }
      - { name: total_liability_cents, type: integer, source: computed, default: 0, description: "Sum of credit_amount_cents over included credit balances" }
      - { name: patient_liability_cents, type: integer, source: computed, default: 0, description: "Sum of patient_portion_cents over included credit balances" }
      - { name: payer_liability_cents, type: integer, source: computed, default: 0, description: "Sum of payer_portion_cents over included credit balances" }
      - { name: medicare_at_risk_cents, type: integer, source: computed, default: 0, description: "Sum of reportable_amount_cents over MedicareRepaymentObligation rows with state IN {OPEN, LATE} and due_at <= as_of_at" }
      - { name: over_180_count, type: integer, source: computed, default: 0, description: "Count of included credit balances whose aging_bucket at as_of_at is OVER_180" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Count of included credit balances" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who generated the report" }
      - { name: state, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PatientAccount
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BAD_DEBT
        trigger: "POST /patient-accounts/{accountId}/status with status=BAD_DEBT"
        actor: SystemAdmin
        preconditions: ["PatientAccount.status == OPEN"]
        side_effects:
          - "Account becomes non-refundable: every subsequent POST /refund-requests naming a CreditBalance on this account fails ERR_ACCOUNT_NOT_REFUNDABLE"
      - from: OPEN
        to: CLOSED
        trigger: "POST /patient-accounts/{accountId}/status with status=CLOSED"
        actor: SystemAdmin
        preconditions: ["PatientAccount.status == OPEN", "PatientAccount.credit_balance_cents == 0"]
        side_effects:
          - "Account becomes non-refundable: every subsequent POST /refund-requests naming a CreditBalance on this account fails ERR_ACCOUNT_NOT_REFUNDABLE"
      - from: BAD_DEBT
        to: OPEN
        trigger: "POST /patient-accounts/{accountId}/status with status=OPEN"
        actor: SystemAdmin
        preconditions: ["PatientAccount.status == BAD_DEBT"]
        side_effects: ["Account is refundable again"]

  - entity: CreditBalance
    initial_state: IDENTIFIED
    terminal_states: [RESOLVED_BY_OFFSET, ESCHEATED, WRITTEN_OFF]
    transitions:
      - from: IDENTIFIED
        to: UNDER_REVIEW
        trigger: "POST /credit-balances/{creditBalanceId}/start-review"
        actor: CreditAnalyst
        preconditions: ["CreditBalance.status == IDENTIFIED"]
        side_effects: ["increments CreditBalance.version by 1"]
      - from: UNDER_REVIEW
        to: ATTRIBUTED
        trigger: "POST /credit-balances/{creditBalanceId}/attribute"
        actor: CreditAnalyst
        preconditions:
          - "CreditBalance.status == UNDER_REVIEW"
          - "attribution_method IN {PROPORTIONAL, REVERSE_CHRONOLOGICAL}"
        side_effects:
          - "runs credit_balance_attribution_split; writes patient_portion_cents, payer_portion_cents, attribution"
          - "increments CreditBalance.version by 1"
          - "when Payer.payer_type == MEDICARE for CreditBalance.payer_id AND payer_portion_cents > 0: creates MedicareRepaymentObligation in state OPEN with identified_at = CreditBalance.identified_at, reportable_amount_cents = payer_portion_cents, due_at = identified_at + 60 days"
      - from: ATTRIBUTED
        to: REFUND_PENDING
        trigger: "POST /refund-requests"
        actor: CreditAnalyst
        preconditions: ["CreditBalance.status == ATTRIBUTED", "CreditBalance.outstanding_cents > 0"]
        side_effects: ["increments CreditBalance.version by 1"]
      - from: REFUND_PENDING
        to: ATTRIBUTED
        trigger: "POST /refund-requests/{refundRequestId}/cancel, or POST /refund-requests/{refundRequestId}/decision with decision=REJECTED"
        actor: CreditAnalyst | RefundApprover
        preconditions: ["No other RefundRequest on this credit balance has approval_state IN {SUBMITTED, APPROVED}"]
        side_effects: ["increments CreditBalance.version by 1"]
        note: "Revert edge — the credit returns to the refundable pool."
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /refund-batches/{batchId}/issue (cascade hop 3)"
        actor: system
        preconditions: ["CreditBalance.outstanding_cents becomes 0 after refunded_cents is recomputed"]
        side_effects:
          - "recomputes refunded_cents and outstanding_cents"
          - "increments CreditBalance.version by 1"
          - "when a MedicareRepaymentObligation exists on this credit balance in state OPEN or REPORTED: it moves to SATISFIED (satisfaction_mode=REFUND_CHECK); when in state LATE or REPORTED_LATE: it moves to SATISFIED_LATE"
      - from: REFUNDED
        to: REFUND_PENDING
        trigger: "POST /check-disbursements/{checkId}/void (cascade hop 3)"
        actor: system
        preconditions: ["The voided check's refund_request_id belongs to a RefundRequest on this credit balance"]
        side_effects:
          - "recomputes refunded_cents (the voided check leaves the ISSUED/CLEARED set) and outstanding_cents"
          - "increments CreditBalance.version by 1"
          - "when a MedicareRepaymentObligation exists on this credit balance in state SATISFIED or SATISFIED_LATE: it reopens (cascade hop 4)"
        note: "Cycle — REFUND_PENDING -> REFUNDED -> REFUND_PENDING."
      - from: ATTRIBUTED
        to: RESOLVED_BY_OFFSET
        trigger: "POST /take-back-notices/{noticeId}/offset-applications (cascade hop 3)"
        actor: system
        preconditions: ["CreditBalance.outstanding_cents becomes 0 after offset_cents is recomputed"]
        side_effects:
          - "recomputes offset_cents and outstanding_cents"
          - "increments CreditBalance.version by 1"
          - "when a MedicareRepaymentObligation exists on this credit balance in state OPEN, LATE or REPORTED: it moves to SATISFIED_BY_OFFSET (cascade hop 4)"
      - from: RESOLVED_BY_OFFSET
        to: ATTRIBUTED
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse"
        actor: CreditAnalyst
        preconditions: ["OffsetApplication.state == APPLIED", "the reversal makes outstanding_cents > 0"]
        side_effects:
          - "recomputes offset_cents and outstanding_cents"
          - "increments CreditBalance.version by 1"
          - "any MedicareRepaymentObligation in state SATISFIED_BY_OFFSET returns to OPEN or LATE depending on the logical clock vs due_at"
        note: "Compensating edge out of a terminal state — offsets are reversible."
      - from: REFUNDED
        to: ESCHEATED
        trigger: "POST /escheatment-records/{escheatmentRecordId}/remit (cascade hop 3)"
        actor: system
        preconditions: ["EscheatmentRecord.state == DUE_DILIGENCE_SENT", "the record's check belongs to a RefundRequest on this credit balance"]
        side_effects:
          - "posts an ESCHEAT_REMITTANCE AccountTransaction of +net_check_amount_cents on the account"
          - "increments CreditBalance.version by 1"
      - from: ATTRIBUTED
        to: WRITTEN_OFF
        trigger: "POST /credit-balances/{creditBalanceId}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "CreditBalance.status == ATTRIBUTED"
          - "CreditBalance.outstanding_cents <= WRITE_OFF_MAX_CENTS"
          - "no MedicareRepaymentObligation on this credit balance is in state OPEN or LATE"
        side_effects:
          - "increments CreditBalance.version by 1"
          - "any MedicareRepaymentObligation in state REPORTED or REPORTED_LATE moves to SATISFIED / SATISFIED_LATE with satisfaction_mode=WRITE_OFF"

  - entity: RefundRequest
    initial_state: "DRAFT (approval_state) x NOT_SCHEDULED (disbursement_state)"
    terminal_states: [REJECTED, CANCELLED, VOID_CLOSED]
    transitions:
      # ---- dimension 1: approval_state ----
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /refund-requests/{refundRequestId}/submit"
        actor: CreditAnalyst
        preconditions: ["approval_state == DRAFT"]
        side_effects: ["re-runs refund_approval_tier; rewrites required_approval_tier and required_approval_count"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /refund-requests/{refundRequestId}/decision with decision=APPROVED"
        actor: RefundApprover
        preconditions:
          - "approval_state == SUBMITTED"
          - "X-User-ID != RefundRequest.prepared_by_user_id"
          - "approver_tier >= required_approval_tier"
          - "approvals_received + 1 >= required_approval_count"
          - "no existing RefundApproval on this request has approver_user_id == X-User-ID"
        side_effects:
          - "creates a RefundApproval row"
          - "sets approved_amount_cents = requested_amount_cents"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /refund-requests/{refundRequestId}/decision with decision=APPROVED on a tier-3 request"
        actor: RefundApprover
        preconditions:
          - "approval_state == SUBMITTED"
          - "required_approval_count == 2 AND approvals_received + 1 < required_approval_count"
          - "X-User-ID != RefundRequest.prepared_by_user_id"
          - "no existing RefundApproval on this request has approver_user_id == X-User-ID"
        side_effects: ["creates a RefundApproval row", "increments approvals_received to 1", "approval_state stays SUBMITTED"]
        note: "Self-loop — the first of two required approvals does not advance the dimension."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /refund-requests/{refundRequestId}/decision with decision=REJECTED"
        actor: RefundApprover
        preconditions: ["approval_state == SUBMITTED", "X-User-ID != RefundRequest.prepared_by_user_id"]
        side_effects:
          - "creates a RefundApproval row"
          - "the owning CreditBalance moves REFUND_PENDING -> ATTRIBUTED"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /refund-requests/{refundRequestId}/decision with decision=RETURNED"
        actor: RefundApprover
        preconditions: ["approval_state == SUBMITTED", "X-User-ID != RefundRequest.prepared_by_user_id"]
        side_effects: ["creates a RefundApproval row", "increments revision_count by 1", "the owning CreditBalance stays REFUND_PENDING"]
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /refund-requests/{refundRequestId}/submit"
        actor: CreditAnalyst
        preconditions: ["approval_state == RETURNED_FOR_REVISION", "revision_count <= MAX_REVISION_ROUNDS"]
        side_effects: ["re-runs refund_approval_tier; rewrites required_approval_tier and required_approval_count"]
        note: "Cycle — SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /refund-requests/{refundRequestId}/cancel"
        actor: CreditAnalyst
        preconditions: ["approval_state IN {DRAFT, RETURNED_FOR_REVISION}"]
        side_effects: ["the owning CreditBalance moves REFUND_PENDING -> ATTRIBUTED"]
      - from: RETURNED_FOR_REVISION
        to: CANCELLED
        trigger: "POST /refund-requests/{refundRequestId}/cancel"
        actor: CreditAnalyst
        preconditions: ["approval_state == RETURNED_FOR_REVISION"]
        side_effects: ["the owning CreditBalance moves REFUND_PENDING -> ATTRIBUTED"]
      # ---- dimension 2: disbursement_state ----
      - from: NOT_SCHEDULED
        to: BATCHED
        trigger: "POST /refund-batches/{batchId}/items"
        actor: DisbursementOfficer
        preconditions:
          - "approval_state == APPROVED"
          - "disbursement_state IN {NOT_SCHEDULED, REISSUE_PENDING}"
          - "RefundBatch.state == OPEN"
        side_effects:
          - "creates a CheckDisbursement in state PENDING"
          - "runs refund_net_disbursement; writes gross_amount_cents, processing_fee_cents, net_check_amount_cents"
          - "recomputes RefundBatch.item_count, total_gross_cents, total_fee_cents, total_net_cents"
      - from: BATCHED
        to: ISSUED
        trigger: "POST /refund-batches/{batchId}/issue"
        actor: DisbursementOfficer
        preconditions: ["disbursement_state == BATCHED", "RefundBatch.state == LOCKED"]
        side_effects:
          - "the line's CheckDisbursement moves PENDING -> ISSUED with check_number, issued_at, stale_at"
          - "posts a REFUND_DISBURSEMENT AccountTransaction of +gross_amount_cents on the credit balance's account"
          - "the owning CreditBalance recomputes refunded_cents (cascade hop 3)"
      - from: ISSUED
        to: CLEARED
        trigger: "POST /check-disbursements/{checkId}/clear"
        actor: DisbursementOfficer
        preconditions: ["disbursement_state == ISSUED", "CheckDisbursement.state == ISSUED"]
        side_effects: ["CheckDisbursement.cleared_at set"]
      - from: ISSUED
        to: REISSUE_PENDING
        trigger: "POST /check-disbursements/{checkId}/void (cascade hop 2)"
        actor: system
        preconditions: ["the voided check's state was ISSUED or STALE"]
        side_effects:
          - "the owning CreditBalance moves REFUNDED -> REFUND_PENDING and refunded_cents is recomputed (cascade hop 3)"
      - from: REISSUE_PENDING
        to: BATCHED
        trigger: "POST /check-disbursements/{checkId}/reissue"
        actor: DisbursementOfficer
        preconditions: ["disbursement_state == REISSUE_PENDING", "target RefundBatch.state == OPEN"]
        side_effects:
          - "creates a replacement CheckDisbursement with reissue_of_disbursement_id set to the voided/stale check"
          - "the predecessor check moves STALE -> REISSUED when it was STALE"
        note: "Cycle — BATCHED -> ISSUED -> REISSUE_PENDING -> BATCHED."
      - from: REISSUE_PENDING
        to: VOID_CLOSED
        trigger: "POST /refund-requests/{refundRequestId}/cancel"
        actor: CreditAnalyst
        preconditions: ["disbursement_state == REISSUE_PENDING", "approval_state == APPROVED"]
        side_effects: ["the owning CreditBalance moves REFUND_PENDING -> ATTRIBUTED"]

  - entity: RefundBatch
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /refund-batches/{batchId}/lock"
        actor: DisbursementOfficer
        preconditions: ["RefundBatch.state == OPEN", "RefundBatch.item_count >= 1", "expected_refund_batch_version == RefundBatch.version"]
        side_effects: ["increments RefundBatch.version by 1", "no further items may be added"]
      - from: LOCKED
        to: OPEN
        trigger: "POST /refund-batches/{batchId}/unlock"
        actor: DisbursementOfficer
        preconditions: ["RefundBatch.state == LOCKED"]
        side_effects: ["increments RefundBatch.version by 1", "items may be added again"]
        note: "Revert edge."
      - from: LOCKED
        to: ISSUED
        trigger: "POST /refund-batches/{batchId}/issue"
        actor: DisbursementOfficer
        preconditions: ["RefundBatch.state == LOCKED", "RefundBatch.item_count >= 1"]
        side_effects:
          - "every PENDING CheckDisbursement in the batch moves to ISSUED with sequential check_number starting at starting_check_number, ordered by CheckDisbursement.created_at ASC (cascade hop 1)"
          - "each issued check drives its RefundRequest BATCHED -> ISSUED (cascade hop 2)"
          - "each RefundRequest transition posts a REFUND_DISBURSEMENT AccountTransaction and drives its CreditBalance REFUND_PENDING -> REFUNDED (cascade hop 3)"
          - "each CreditBalance that reaches REFUNDED drives its MedicareRepaymentObligation OPEN/REPORTED -> SATISFIED or LATE/REPORTED_LATE -> SATISFIED_LATE (cascade hop 4)"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /ops/run-aging-sweep"
        actor: system
        preconditions: ["RefundBatch.state == ISSUED", "no CheckDisbursement in the batch is in state PENDING or ISSUED"]
        side_effects: ["increments RefundBatch.version by 1"]

  - entity: CheckDisbursement
    initial_state: PENDING
    terminal_states: [CLEARED, VOIDED, REISSUED, ESCHEATED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /refund-batches/{batchId}/issue"
        actor: DisbursementOfficer
        preconditions: ["CheckDisbursement.state == PENDING", "RefundBatch.state == LOCKED"]
        side_effects: ["assigns check_number, issued_at = logical clock, stale_at = issued_at + CHECK_STALE_DAYS"]
      - from: ISSUED
        to: CLEARED
        trigger: "POST /check-disbursements/{checkId}/clear"
        actor: DisbursementOfficer
        preconditions: ["CheckDisbursement.state == ISSUED"]
        side_effects: ["sets cleared_at", "RefundRequest.disbursement_state ISSUED -> CLEARED"]
        note: "Branch A of the ISSUED fork — no ledger movement, the credit stays consumed."
      - from: ISSUED
        to: VOIDED
        trigger: "POST /check-disbursements/{checkId}/void"
        actor: DisbursementOfficer
        preconditions: ["CheckDisbursement.state IN {ISSUED, STALE}", "void_reason IN {STALE_DATED, WRONG_PAYEE, BATCH_ERROR, PAYER_REQUEST}"]
        side_effects:
          - "posts a REVERSAL AccountTransaction whose reversal_of_transaction_id is the check's REFUND_DISBURSEMENT posting and whose amount_cents is its exact negation (cascade hop 1)"
          - "the owning RefundRequest moves ISSUED -> REISSUE_PENDING (cascade hop 2)"
          - "that RefundRequest transition drives its CreditBalance REFUNDED -> REFUND_PENDING with refunded_cents recomputed (cascade hop 3)"
          - "that CreditBalance transition reopens any MedicareRepaymentObligation from SATISFIED -> OPEN or SATISFIED_LATE -> LATE with days_elapsed / days_late / penalty_cents recomputed against the logical clock (cascade hop 4)"
        note: "Branch B of the ISSUED fork — full compensation of branch A's ledger effects."
      - from: ISSUED
        to: STALE
        trigger: "POST /ops/run-aging-sweep"
        actor: system
        preconditions: ["CheckDisbursement.state == ISSUED", "logical clock >= stale_at"]
        side_effects: ["no ledger movement; the check becomes escheat-eligible"]
        note: "Branch C of the ISSUED fork — time-driven, no compensation."
      - from: STALE
        to: VOIDED
        trigger: "POST /check-disbursements/{checkId}/void with void_reason=STALE_DATED"
        actor: DisbursementOfficer
        preconditions: ["CheckDisbursement.state == STALE"]
        side_effects: ["same four-hop compensation chain as the ISSUED -> VOIDED edge"]
      - from: STALE
        to: REISSUED
        trigger: "POST /check-disbursements/{checkId}/reissue"
        actor: DisbursementOfficer
        preconditions: ["CheckDisbursement.state == STALE", "target RefundBatch.state == OPEN"]
        side_effects: ["creates a successor CheckDisbursement whose reissue_of_disbursement_id is this check", "RefundRequest.disbursement_state REISSUE_PENDING -> BATCHED"]
      - from: STALE
        to: ESCHEATED
        trigger: "POST /escheatment-records/{escheatmentRecordId}/remit"
        actor: ComplianceOfficer
        preconditions: ["CheckDisbursement.state == STALE", "EscheatmentRecord.state == DUE_DILIGENCE_SENT", "logical clock >= EscheatmentRecord.escheat_due_at"]
        side_effects: ["the owning CreditBalance moves REFUNDED -> ESCHEATED", "an ESCHEAT_REMITTANCE AccountTransaction is posted"]

  - entity: TakeBackNotice
    initial_state: RECEIVED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: PARTIALLY_APPLIED
        trigger: "POST /take-back-notices/{noticeId}/offset-applications"
        actor: CreditAnalyst
        preconditions: ["TakeBackNotice.state IN {RECEIVED, PARTIALLY_APPLIED}", "expected_take_back_notice_version == TakeBackNotice.version", "at least one eligible CreditBalance line exists", "remaining_unapplied_cents after the call > 0"]
        side_effects: ["increments TakeBackNotice.version by 1", "creates OffsetApplication rows per offset_waterfall_allocation"]
      - from: RECEIVED
        to: FULLY_APPLIED
        trigger: "POST /take-back-notices/{noticeId}/offset-applications"
        actor: CreditAnalyst
        preconditions: ["TakeBackNotice.state IN {RECEIVED, PARTIALLY_APPLIED}", "expected_take_back_notice_version == TakeBackNotice.version", "remaining_unapplied_cents after the call == 0"]
        side_effects: ["increments TakeBackNotice.version by 1", "creates OffsetApplication rows per offset_waterfall_allocation"]
      - from: PARTIALLY_APPLIED
        to: FULLY_APPLIED
        trigger: "POST /take-back-notices/{noticeId}/offset-applications"
        actor: CreditAnalyst
        preconditions: ["remaining_unapplied_cents after the call == 0"]
        side_effects: ["increments TakeBackNotice.version by 1"]
      - from: FULLY_APPLIED
        to: PARTIALLY_APPLIED
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse"
        actor: CreditAnalyst
        preconditions: ["OffsetApplication.state == APPLIED", "applied_cents after the reversal > 0"]
        side_effects: ["recomputes applied_cents and remaining_unapplied_cents", "increments TakeBackNotice.version by 1"]
        note: "Cycle — RECEIVED -> PARTIALLY_APPLIED -> FULLY_APPLIED -> PARTIALLY_APPLIED -> RECEIVED."
      - from: PARTIALLY_APPLIED
        to: RECEIVED
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse"
        actor: CreditAnalyst
        preconditions: ["applied_cents after the reversal == 0"]
        side_effects: ["recomputes applied_cents and remaining_unapplied_cents", "increments TakeBackNotice.version by 1"]
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /take-back-notices/{noticeId}/dispute"
        actor: PayerLiaison
        preconditions: ["TakeBackNotice.state IN {RECEIVED, PARTIALLY_APPLIED}", "logical clock <= dispute_deadline_at", "X-User-ID == TakeBackNotice.payer_id"]
        side_effects: ["increments TakeBackNotice.version by 1", "no further offset applications may be created while DISPUTED"]
      - from: DISPUTED
        to: RECEIVED
        trigger: "POST /take-back-notices/{noticeId}/withdraw-dispute"
        actor: PayerLiaison
        preconditions: ["TakeBackNotice.state == DISPUTED", "X-User-ID == TakeBackNotice.payer_id", "applied_cents == 0"]
        side_effects: ["increments TakeBackNotice.version by 1"]
        note: "Cycle back — the dispute is dropped and offsetting may resume."
      - from: DISPUTED
        to: PARTIALLY_APPLIED
        trigger: "POST /take-back-notices/{noticeId}/withdraw-dispute"
        actor: PayerLiaison
        preconditions: ["TakeBackNotice.state == DISPUTED", "X-User-ID == TakeBackNotice.payer_id", "applied_cents > 0"]
        side_effects: ["increments TakeBackNotice.version by 1"]
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /ops/run-aging-sweep"
        actor: system
        preconditions: ["TakeBackNotice.state == DISPUTED", "logical clock > dispute_deadline_at + DISPUTE_RESOLUTION_GRACE_DAYS"]
        side_effects: ["every OffsetApplication on this notice in state APPLIED is reversed, running the offset compensation chain for each"]

  - entity: OffsetApplication
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse"
        actor: CreditAnalyst
        preconditions: ["OffsetApplication.state == APPLIED"]
        side_effects:
          - "posts a REVERSAL AccountTransaction negating the line's TAKE_BACK_OFFSET posting (cascade hop 1)"
          - "the owning CreditBalance recomputes offset_cents and outstanding_cents, and moves RESOLVED_BY_OFFSET -> ATTRIBUTED when outstanding_cents becomes > 0 (cascade hop 2)"
          - "that CreditBalance transition reopens any MedicareRepaymentObligation from SATISFIED_BY_OFFSET -> OPEN or LATE (cascade hop 3)"
          - "the owning TakeBackNotice recomputes applied_cents / remaining_unapplied_cents and steps down its state"

  - entity: MedicareRepaymentObligation
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LATE
        trigger: "POST /ops/run-aging-sweep"
        actor: system
        preconditions: ["state == OPEN", "logical clock > due_at"]
        side_effects: ["recomputes days_elapsed, days_late and penalty_cents"]
      - from: OPEN
        to: REPORTED
        trigger: "POST /medicare-obligations/{obligationId}/report"
        actor: ComplianceOfficer
        preconditions: ["state == OPEN", "days_elapsed <= MEDICARE_REPAYMENT_WINDOW_DAYS"]
        side_effects: ["sets reported_at and report_reference", "penalty_cents stays 0"]
      - from: LATE
        to: REPORTED_LATE
        trigger: "POST /medicare-obligations/{obligationId}/report"
        actor: ComplianceOfficer
        preconditions: ["state == LATE"]
        side_effects: ["sets reported_at and report_reference", "writes penalty_cents from the tiered late assessment"]
      - from: OPEN
        to: SATISFIED
        trigger: "POST /refund-batches/{batchId}/issue (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached REFUNDED", "state IN {OPEN, REPORTED}"]
        side_effects: ["sets satisfied_at and satisfaction_mode = REFUND_CHECK"]
      - from: REPORTED
        to: SATISFIED
        trigger: "POST /refund-batches/{batchId}/issue (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached REFUNDED"]
        side_effects: ["sets satisfied_at and satisfaction_mode = REFUND_CHECK"]
      - from: LATE
        to: SATISFIED_LATE
        trigger: "POST /refund-batches/{batchId}/issue (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached REFUNDED", "state IN {LATE, REPORTED_LATE}"]
        side_effects: ["sets satisfied_at and satisfaction_mode = REFUND_CHECK", "penalty_cents recomputed at satisfaction"]
      - from: REPORTED_LATE
        to: SATISFIED_LATE
        trigger: "POST /refund-batches/{batchId}/issue (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached REFUNDED"]
        side_effects: ["sets satisfied_at and satisfaction_mode = REFUND_CHECK"]
      - from: SATISFIED
        to: OPEN
        trigger: "POST /check-disbursements/{checkId}/void (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance returned to REFUND_PENDING", "logical clock <= due_at"]
        side_effects: ["clears satisfied_at and satisfaction_mode", "recomputes days_elapsed, days_late, penalty_cents"]
        note: "Cycle — OPEN -> SATISFIED -> OPEN."
      - from: SATISFIED
        to: LATE
        trigger: "POST /check-disbursements/{checkId}/void (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance returned to REFUND_PENDING", "logical clock > due_at"]
        side_effects: ["clears satisfied_at and satisfaction_mode", "recomputes days_elapsed, days_late, penalty_cents"]
      - from: SATISFIED_LATE
        to: LATE
        trigger: "POST /check-disbursements/{checkId}/void (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance returned to REFUND_PENDING"]
        side_effects: ["clears satisfied_at and satisfaction_mode", "recomputes penalty_cents"]
      - from: OPEN
        to: SATISFIED_BY_OFFSET
        trigger: "POST /take-back-notices/{noticeId}/offset-applications (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached RESOLVED_BY_OFFSET", "state IN {OPEN, LATE, REPORTED}"]
        side_effects: ["sets satisfied_at and satisfaction_mode = OFFSET"]
      - from: LATE
        to: SATISFIED_BY_OFFSET
        trigger: "POST /take-back-notices/{noticeId}/offset-applications (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached RESOLVED_BY_OFFSET"]
        side_effects: ["sets satisfied_at and satisfaction_mode = OFFSET", "penalty_cents retained"]
      - from: REPORTED
        to: SATISFIED_BY_OFFSET
        trigger: "POST /take-back-notices/{noticeId}/offset-applications (cascade hop 4)"
        actor: system
        preconditions: ["the owning CreditBalance reached RESOLVED_BY_OFFSET"]
        side_effects: ["sets satisfied_at and satisfaction_mode = OFFSET"]
      - from: SATISFIED_BY_OFFSET
        to: OPEN
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse (cascade hop 3)"
        actor: system
        preconditions: ["the owning CreditBalance returned to ATTRIBUTED", "logical clock <= due_at"]
        side_effects: ["clears satisfied_at and satisfaction_mode"]
      - from: SATISFIED_BY_OFFSET
        to: LATE
        trigger: "POST /offset-applications/{offsetApplicationId}/reverse (cascade hop 3)"
        actor: system
        preconditions: ["the owning CreditBalance returned to ATTRIBUTED", "logical clock > due_at"]
        side_effects: ["clears satisfied_at and satisfaction_mode", "recomputes days_late and penalty_cents"]
      - from: REPORTED
        to: SATISFIED
        trigger: "POST /credit-balances/{creditBalanceId}/write-off"
        actor: ComplianceOfficer
        preconditions: ["the owning CreditBalance reached WRITTEN_OFF", "state == REPORTED"]
        side_effects: ["sets satisfied_at and satisfaction_mode = WRITE_OFF"]
      - from: REPORTED_LATE
        to: SATISFIED_LATE
        trigger: "POST /credit-balances/{creditBalanceId}/write-off"
        actor: ComplianceOfficer
        preconditions: ["the owning CreditBalance reached WRITTEN_OFF", "state == REPORTED_LATE"]
        side_effects: ["sets satisfied_at and satisfaction_mode = WRITE_OFF"]

  - entity: EscheatmentRecord
    initial_state: DORMANT
    terminal_states: [REMITTED, CLAIMED, EXEMPT]
    transitions:
      - from: DORMANT
        to: DUE_DILIGENCE_SENT
        trigger: "POST /escheatment-records/{escheatmentRecordId}/due-diligence"
        actor: ComplianceOfficer
        preconditions: ["state == DORMANT", "logical clock >= due_diligence_open_at", "contact_method IN {FIRST_CLASS_MAIL, CERTIFIED_MAIL, EMAIL}"]
        side_effects: ["sets due_diligence_sent_at and contact_method"]
      - from: DUE_DILIGENCE_SENT
        to: REMITTED
        trigger: "POST /escheatment-records/{escheatmentRecordId}/remit"
        actor: ComplianceOfficer
        preconditions: ["state == DUE_DILIGENCE_SENT", "logical clock >= escheat_due_at", "CheckDisbursement.state == STALE"]
        side_effects:
          - "sets remitted_amount_cents = CheckDisbursement.net_check_amount_cents"
          - "the check moves STALE -> ESCHEATED (cascade hop 1)"
          - "that check transition drives the owning CreditBalance REFUNDED -> ESCHEATED and posts an ESCHEAT_REMITTANCE AccountTransaction (cascade hop 2)"
      - from: DUE_DILIGENCE_SENT
        to: CLAIMED
        trigger: "POST /check-disbursements/{checkId}/reissue"
        actor: DisbursementOfficer
        preconditions: ["state == DUE_DILIGENCE_SENT", "the check is being reissued to the payee"]
        side_effects: ["sets claimed_at", "remitted_amount_cents stays 0"]
      - from: DORMANT
        to: EXEMPT
        trigger: "POST /check-disbursements/{checkId}/void"
        actor: DisbursementOfficer
        preconditions: ["state == DORMANT", "the check is voided before dormancy elapses"]
        side_effects: ["the funds return to the credit balance rather than escheating"]

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /compliance-reports/{reportId}/finalize"
        actor: ComplianceOfficer
        preconditions: ["state == DRAFT"]
        side_effects: ["all computed totals are frozen; the report can no longer be regenerated"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: refund-request-create-stale-credit-balance
    parent_entity: CreditBalance
    write_endpoint: "POST /refund-requests"
    occ_field: "expected_credit_balance_version"
    description: |
      Creating a RefundRequest against a CreditBalance whose version has advanced
      since the client last observed it is rejected. A credit balance legitimately
      supports more than one refund request over its life (a rejected request
      returns the credit to ATTRIBUTED and a fresh request may claim it, and offset
      applications shrink outstanding_cents underneath), so the second create is
      not covered by any state precondition — it is the stale-version check that
      stops a writer from carving a refund out of a credit picture that no longer
      exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: offset-apply-stale-notice
    parent_entity: TakeBackNotice
    write_endpoint: "POST /take-back-notices/{noticeId}/offset-applications"
    occ_field: "expected_take_back_notice_version"
    description: |
      Applying offsets against a TakeBackNotice whose version has advanced since
      the client last observed it is rejected. A notice legitimately accepts
      repeated offset calls while it remains RECEIVED or PARTIALLY_APPLIED, so a
      later call sees a valid state and would otherwise succeed against a
      remaining_unapplied_cents the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-lock-stale-version
    parent_entity: RefundBatch
    write_endpoint: "POST /refund-batches/{batchId}/lock"
    occ_field: "expected_refund_batch_version"
    description: |
      Locking a RefundBatch whose version has advanced since the client last
      observed it is rejected. A batch legitimately cycles OPEN -> LOCKED -> OPEN
      via unlock and accumulates items in between, so a lock issued against a
      stale view would freeze a line set the client never inspected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_balance_identification_sweep
    trigger: "POST /credit-balances/identify-sweep"
    algorithm: aggregation
    formula: |
      # Candidate accounts, in this exact order:
      candidates = PatientAccount rows where
                     (account_ids omitted OR id IN account_ids)
                     AND status IN {OPEN, BAD_DEBT}          # CLOSED accounts are skipped
                     AND balance_cents <= -CREDIT_IDENTIFICATION_FLOOR_CENTS
                     AND no existing CreditBalance on the account has
                         status IN {IDENTIFIED, UNDER_REVIEW, ATTRIBUTED, REFUND_PENDING, REFUNDED}
      order candidates by (created_at ASC)                    # deterministic sweep order
      for each candidate a:
          create CreditBalance(
              account_id           = a.id,
              payer_id             = a.primary_payer_id,
              credit_amount_cents  = -a.balance_cents,        # frozen magnitude
              identified_at        = logical_clock_now,
              status               = "IDENTIFIED")
      identified_count      = number of CreditBalance rows created
      credit_balance_ids    = their ids in sweep order
      skipped_account_count = |{accounts named in account_ids that were not candidates}|
                              (0 when account_ids is omitted)
    input_set: "PatientAccount rows with status IN {OPEN, BAD_DEBT} and balance_cents at or below the negative floor, excluding accounts already carrying a non-terminal CreditBalance"
    constants:
      CREDIT_IDENTIFICATION_FLOOR_CENTS: 1
    precision: "whole cents; no rounding"

  - name: credit_balance_attribution_split
    trigger: "POST /credit-balances/{creditBalanceId}/attribute — writes CreditBalance.patient_portion_cents, payer_portion_cents and attribution"
    algorithm: chronological
    formula: |
      cb     = the CreditBalance being attributed
      credit = cb.credit_amount_cents                              # > 0
      payments = AccountTransaction rows where
                    account_id  == cb.account_id
                    AND txn_type == "PAYMENT"
                    AND is_reversed == false
                    AND reversal_of_transaction_id IS NULL         # a REVERSAL row is never a payment
                    AND posted_at <= cb.identified_at              # inclusive upper bound
      magnitude(p) = abs(p.amount_cents)
      total_paid   = sum(magnitude(p) for p in payments)

      if total_paid == 0:
          patient_portion_cents = 0
          payer_portion_cents   = 0
          attribution           = "UNDETERMINED"
      else:
          # --- variant selection on cb.attribution_method ---
          VARIANT PROPORTIONAL:
              patient_paid          = sum(magnitude(p) for p in payments if p.source == "PATIENT")
              patient_portion_cents = round_half_up(credit * patient_paid / total_paid)
              payer_portion_cents   = credit - patient_portion_cents     # remainder absorbs the rounding
          VARIANT REVERSE_CHRONOLOGICAL:
              ordered   = payments sorted by (posted_at DESC, created_at DESC)
              remaining = credit
              patient_portion_cents = 0
              payer_portion_cents   = 0
              for p in ordered:
                  take = min(remaining, magnitude(p))
                  if p.source == "PATIENT": patient_portion_cents += take
                  else:                     payer_portion_cents   += take
                  remaining -= take
                  if remaining == 0: break
          # --- shared classification ---
          if patient_portion_cents > 0 and payer_portion_cents > 0: attribution = "SPLIT"
          elif patient_portion_cents > 0:                           attribution = "PATIENT"
          else:                                                     attribution = "PAYER"
    input_set: "PAYMENT transactions on the credit balance's account that are not reversed, are not themselves REVERSAL rows, and were posted at or before identified_at"
    constants: {}
    precision: "whole cents; round_half_up on the PROPORTIONAL patient slice only, with the payer slice taking the remainder so the two portions always sum to credit_amount_cents"
    variants:
      - name: PROPORTIONAL
        when: "attribution_method == PROPORTIONAL — the credit is spread over every qualifying payment by paid-dollar share"
        difference: "Both buckets receive a slice whenever both sources paid; the patient slice is rounded and the payer slice absorbs the residual cent."
      - name: REVERSE_CHRONOLOGICAL
        when: "attribution_method == REVERSE_CHRONOLOGICAL — the credit is unwound against the most recent payments first"
        difference: "The newest payments are consumed to exhaustion before older ones are touched, so a single late payment large enough to cover the credit takes the whole attribution and the other bucket receives 0."

  - name: credit_balance_aging
    trigger: "Recomputed on every read of a CreditBalance and by POST /ops/run-aging-sweep"
    algorithm: threshold
    formula: |
      aging_days = floor((logical_clock_now - cb.identified_at) / 86400 seconds)
      if aging_days <= 30:   aging_bucket = "D0_30"
      elif aging_days <= 60: aging_bucket = "D31_60"
      elif aging_days <= 90: aging_bucket = "D61_90"
      elif aging_days <= 180:aging_bucket = "D91_180"
      else:                  aging_bucket = "OVER_180"
      # Boundary pinning: exactly 30 whole days is still D0_30; 31 whole days is
      # D31_60. Exactly 180 whole days is still D91_180; 181 is OVER_180.
    input_set: "the single CreditBalance row being read, against the logical clock"
    constants:
      BUCKET_EDGE_1_DAYS: 30
      BUCKET_EDGE_2_DAYS: 60
      BUCKET_EDGE_3_DAYS: 90
      BUCKET_EDGE_4_DAYS: 180
    precision: "whole days, floor"

  - name: medicare_repayment_deadline
    trigger: "MedicareRepaymentObligation creation (cascade of POST /credit-balances/{creditBalanceId}/attribute), POST /medicare-obligations/{obligationId}/report, and POST /ops/run-aging-sweep"
    algorithm: threshold
    formula: |
      due_at       = identified_at + MEDICARE_REPAYMENT_WINDOW_DAYS days
      days_elapsed = floor((logical_clock_now - identified_at) / 86400 seconds)
      on_time      = (days_elapsed <= MEDICARE_REPAYMENT_WINDOW_DAYS)   # day 60 is compliant
      days_late    = max(0, days_elapsed - MEDICARE_REPAYMENT_WINDOW_DAYS)
      if   days_late == 0:  penalty_cents = 0
      elif days_late <= 30: penalty_cents = round_half_up(reportable_amount_cents * LATE_TIER_1_RATE)
      elif days_late <= 90: penalty_cents = round_half_up(reportable_amount_cents * LATE_TIER_2_RATE)
      else:                 penalty_cents = round_half_up(reportable_amount_cents * LATE_TIER_3_RATE)
      # Boundary pinning: days_elapsed == 60 -> on_time, penalty 0, report lands
      # in REPORTED. days_elapsed == 61 -> late, days_late 1, tier 1, report lands
      # in REPORTED_LATE. days_late == 30 is tier 1; days_late == 31 is tier 2.
    input_set: "the single MedicareRepaymentObligation row, against the logical clock; reportable_amount_cents was frozen at attribution"
    constants:
      MEDICARE_REPAYMENT_WINDOW_DAYS: 60
      LATE_TIER_1_RATE: 0.02
      LATE_TIER_2_RATE: 0.05
      LATE_TIER_3_RATE: 0.10
    precision: "whole days floor for the clock; whole cents round_half_up for penalty_cents"

  - name: refund_approval_tier
    trigger: "POST /refund-requests (initial write) and POST /refund-requests/{refundRequestId}/submit (rewrite) — writes required_approval_tier and required_approval_count"
    algorithm: weighted_scoring
    formula: |
      A = RefundRequest.requested_amount_cents
      G = CreditBalance.aging_days evaluated at the moment of this call
      P = RefundRequest.payee_type
      T = Payer.payer_type of CreditBalance.payer_id
      R = CreditBalance.root_cause_confirmed

      base_tier = 1 if A <= TIER_1_MAX_CENTS
                  2 if TIER_1_MAX_CENTS < A <= TIER_2_MAX_CENTS
                  3 if A > TIER_2_MAX_CENTS

      escalations = 0
      escalations += 1 if T IN {MEDICARE, MEDICAID}
      escalations += 1 if G >= AGED_ESCALATION_DAYS
      escalations += 1 if R == false

      de_escalations = 1 if (P == "PATIENT" and A <= SMALL_PATIENT_REFUND_CENTS) else 0

      required_approval_tier  = min(3, max(base_tier, base_tier + escalations - de_escalations))
      required_approval_count = 2 if required_approval_tier == 3 else 1
      # The inner max() is a floor, not a tie-break: de-escalation can never push a
      # request below its amount-derived base tier.
    input_set: "the RefundRequest under write, its CreditBalance (aging_days and root_cause_confirmed at call time) and that credit balance's Payer"
    constants:
      TIER_1_MAX_CENTS: 25000
      TIER_2_MAX_CENTS: 250000
      AGED_ESCALATION_DAYS: 181
      SMALL_PATIENT_REFUND_CENTS: 5000
    precision: "integer tiers 1..3"

  - name: refund_net_disbursement
    trigger: "POST /refund-batches/{batchId}/items — writes CheckDisbursement.gross_amount_cents, processing_fee_cents, net_check_amount_cents"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The fee band looks like it depends on the
      # amount of the check, and the check amount is gross minus the fee — that
      # apparent circularity is resolved by always keying the band on GROSS. Do
      # NOT iterate to a fixed point and do NOT re-band on the net amount.
      # Step 1 — band selection, keyed on gross ONLY:
      gross = RefundRequest.approved_amount_cents
      if   gross <= FEE_BAND_1_MAX_CENTS: fee_bp = 0;   flat_fee_cents = 0
      elif gross <= FEE_BAND_2_MAX_CENTS: fee_bp = 150; flat_fee_cents = 100
      else:                               fee_bp = 75;  flat_fee_cents = 500
      # Step 2 — fee, rounded once then capped (round before cap, never after):
      processing_fee_cents = min(round_half_up(gross * fee_bp / 10000) + flat_fee_cents,
                                 FEE_CAP_CENTS)
      # Step 3 — net:
      net_check_amount_cents = gross - processing_fee_cents
      # Step 4 — floor guard:
      if net_check_amount_cents < MIN_CHECK_CENTS: reject with ERR_NET_BELOW_MIN_CHECK
    input_set: "the single approved RefundRequest being added to the batch"
    constants:
      FEE_BAND_1_MAX_CENTS: 5000
      FEE_BAND_2_MAX_CENTS: 50000
      FEE_CAP_CENTS: 2500
      MIN_CHECK_CENTS: 200
    precision: "whole cents, round_half_up applied once at step 2 before the cap"

  - name: offset_waterfall_allocation
    trigger: "POST /take-back-notices/{noticeId}/offset-applications — creates OffsetApplication rows and their TAKE_BACK_OFFSET postings"
    algorithm: waterfall_allocation
    formula: |
      notice = the TakeBackNotice named in the path
      eligible = CreditBalance rows where
                    account_id IN target_account_ids
                    AND payer_id == notice.payer_id
                    AND status IN {ATTRIBUTED, REFUND_PENDING}     # explicit status filter
                    AND payer_portion_cents > 0
                    AND outstanding_cents > 0
      if eligible is empty: reject with ERR_NO_ELIGIBLE_CREDIT
      ordered = eligible sorted by (identified_at ASC, created_at ASC)   # oldest credit first
      pool    = notice.remaining_unapplied_cents
      lines   = []
      for cb in ordered:
          if pool == 0: break
          capacity = min(cb.payer_portion_cents, cb.outstanding_cents)
          line     = min(pool, capacity)
          if line == 0: continue                                   # no zero-cent rows are written
          lines.append({credit_balance: cb, applied_cents: line})
          pool -= line
      applied_total = sum(l.applied_cents for l in lines)

      # ---- admin-fee proration: ROUND PER LINE, THEN SUM. The residual from the
      # ---- per-line rounding is assigned to the LAST line in waterfall order.
      # ---- (Summing first and rounding once at the end is explicitly wrong here.)
      for l in lines:
          l.admin_fee_share_cents = round_half_up(notice.admin_fee_cents * l.applied_cents / applied_total)
      residual = notice.admin_fee_cents - sum(l.admin_fee_share_cents for l in lines)
      lines[last].admin_fee_share_cents += residual

      for i, l in enumerate(lines):
          sequence = notice's highest existing OffsetApplication.sequence + 1 + i
          post AccountTransaction(txn_type="TAKE_BACK_OFFSET", source="PAYER",
                                  payer_id=notice.payer_id,
                                  amount_cents=+l.applied_cents,
                                  account_id=l.credit_balance.account_id)
          create OffsetApplication(applied_cents=l.applied_cents,
                                   admin_fee_share_cents=l.admin_fee_share_cents,
                                   sequence=sequence, state="APPLIED",
                                   posted_transaction_id = that posting's id)
    input_set: "CreditBalance rows on the named accounts belonging to the notice's payer, in status ATTRIBUTED or REFUND_PENDING with payer_portion_cents > 0 and outstanding_cents > 0"
    constants: {}
    precision: "whole cents; the admin fee is rounded per line with round_half_up and the residual is assigned to the highest-sequence line, so the line shares always sum to admin_fee_cents exactly"

  - name: escheat_dormancy_clock
    trigger: "POST /escheatment-records (creation) and POST /ops/run-aging-sweep — writes state_code, dormancy_days, dormancy_start_at, escheat_due_at, due_diligence_open_at"
    algorithm: decay_function
    formula: |
      chk        = the CheckDisbursement named on the record
      state_code = chk.payee_state_code
      dormancy_days = STATE_DORMANCY_DAYS[state_code]
      # --- variant selection on EscheatmentRecord.basis ---
      VARIANT ISSUE_DATE:
          dormancy_start_at = chk.issued_at
      VARIANT LAST_CONTACT:
          acct = the PatientAccount of the CreditBalance behind chk.refund_request_id
          last_contact_at = max(AccountTransaction.posted_at) over rows where
                              account_id == acct.id AND is_reversed == false
          dormancy_start_at = max(chk.issued_at, last_contact_at)
      escheat_due_at        = dormancy_start_at + dormancy_days days
      due_diligence_open_at = escheat_due_at - DUE_DILIGENCE_LEAD_DAYS days
    input_set: "the named CheckDisbursement plus, for LAST_CONTACT only, every non-reversed AccountTransaction on the payee account"
    constants:
      STATE_DORMANCY_DAYS: { CA: 1095, TX: 1095, NY: 1825, FL: 1825 }
      DUE_DILIGENCE_LEAD_DAYS: 120
    variants:
      - name: ISSUE_DATE
        when: "basis == ISSUE_DATE — the statutory default; the dormancy clock starts the day the check was cut"
        difference: "Account activity after the check was issued is ignored, so the escheat date is the earliest possible one."
      - name: LAST_CONTACT
        when: "basis == LAST_CONTACT — jurisdictions that reset dormancy on owner contact"
        difference: "Any non-reversed posting after the issue date pushes dormancy_start_at forward, producing a strictly later escheat_due_at and due_diligence_open_at for the very same check."

  - name: credit_balance_liability_report
    trigger: "POST /compliance-reports with report_type == CREDIT_BALANCE_LIABILITY — writes the report's computed totals"
    algorithm: aggregation
    formula: |
      as_of = report.as_of_at
      included = CreditBalance rows where
                    identified_at <= as_of                                  # inclusive
                    AND status IN {IDENTIFIED, UNDER_REVIEW, ATTRIBUTED, REFUND_PENDING}
                    AND (report.scope_code == "ALL"
                         OR Payer.payer_type of the row's payer_id == report.scope_code)
      order included by (identified_at ASC, created_at ASC)                  # listing tie-break
      line_count              = |included|
      total_liability_cents   = sum(credit_amount_cents  over included)
      patient_liability_cents = sum(patient_portion_cents over included)
      payer_liability_cents   = sum(payer_portion_cents   over included)
      over_180_count          = |{cb in included : floor((as_of - cb.identified_at)/86400) >= 181}|
      medicare_at_risk_cents  = sum(reportable_amount_cents) over
                                MedicareRepaymentObligation rows whose
                                  state IN {OPEN, LATE} AND due_at <= as_of
                                  AND their CreditBalance is in `included`
      # Aging for over_180_count is evaluated at as_of, NOT at the logical clock.
    input_set: "CreditBalance rows identified at or before as_of_at whose status is one of the four open-liability statuses, filtered by scope_code"
    constants: {}
    precision: "whole cents; no rounding (pure integer sums)"

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in priority order;
# the first failing rule determines the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the path resolves to a stored row, validated left-to-right"
    error_id: "ERR_PAYER_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_CREDIT_BALANCE_NOT_FOUND | ERR_ROOT_CAUSE_FINDING_NOT_FOUND | ERR_REFUND_REQUEST_NOT_FOUND | ERR_REFUND_APPROVAL_NOT_FOUND | ERR_REFUND_BATCH_NOT_FOUND | ERR_CHECK_NOT_FOUND | ERR_TAKE_BACK_NOTICE_NOT_FOUND | ERR_OFFSET_APPLICATION_NOT_FOUND | ERR_MEDICARE_OBLIGATION_NOT_FOUND | ERR_ESCHEATMENT_RECORD_NOT_FOUND | ERR_COMPLIANCE_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row (primary_payer_id, payer_id, credit_balance_id, refund_request_id, check_disbursement_id, target_account_ids members)"
    error_id: "ERR_PAYER_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_CREDIT_BALANCE_NOT_FOUND | ERR_REFUND_REQUEST_NOT_FOUND | ERR_CHECK_NOT_FOUND"
    http_status: 404
    applies_to: "POST /patient-accounts, POST /patient-accounts/{accountId}/transactions, POST /root-cause-findings, POST /refund-requests, POST /refund-batches/{batchId}/items, POST /check-disbursements/{checkId}/reissue, POST /take-back-notices, POST /take-back-notices/{noticeId}/offset-applications, POST /escheatment-records"
  - priority: 5
    category: auth
    check: "When the acting role is PayerLiaison, X-User-ID must equal the payer_id of the TakeBackNotice being written or read-modified"
    error_id: ERR_PAYER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /take-back-notices, POST /take-back-notices/{noticeId}/dispute, POST /take-back-notices/{noticeId}/withdraw-dispute"
  - priority: 6
    category: business_constraint
    check: "Request body carries every required field, enum members are legal, integers are integers, cents fields are non-negative where the field description says so, target_account_ids is a non-empty array, and POST /patient-accounts/{accountId}/transactions carries a txn_type IN {CHARGE, PAYMENT, CONTRACTUAL_ADJUSTMENT} only"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 8
    category: state
    check: "The CreditBalance is in the status the operation requires (start-review: IDENTIFIED; attribute: UNDER_REVIEW; refund-request create: ATTRIBUTED; write-off: ATTRIBUTED)"
    error_id: ERR_CREDIT_BALANCE_INVALID_STATE
    http_status: 409
    applies_to: "POST /credit-balances/{creditBalanceId}/start-review, POST /credit-balances/{creditBalanceId}/attribute, POST /credit-balances/{creditBalanceId}/write-off, POST /refund-requests"
  - priority: 9
    category: state
    check: "The RefundRequest is in the approval_state / disbursement_state the operation requires (submit: DRAFT or RETURNED_FOR_REVISION; decision: SUBMITTED; cancel: DRAFT, RETURNED_FOR_REVISION or REISSUE_PENDING; batch item: approval_state APPROVED and disbursement_state NOT_SCHEDULED or REISSUE_PENDING)"
    error_id: ERR_REFUND_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /refund-requests/{refundRequestId}/submit, POST /refund-requests/{refundRequestId}/decision, POST /refund-requests/{refundRequestId}/cancel, POST /refund-batches/{batchId}/items"
  - priority: 10
    category: state
    check: "The RefundBatch is in the state the operation requires (items: OPEN; lock: OPEN; unlock: LOCKED; issue: LOCKED)"
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /refund-batches/{batchId}/items, POST /refund-batches/{batchId}/lock, POST /refund-batches/{batchId}/unlock, POST /refund-batches/{batchId}/issue, POST /check-disbursements/{checkId}/reissue"
  - priority: 11
    category: state
    check: "The CheckDisbursement is in the state the operation requires (clear: ISSUED; void: ISSUED or STALE; reissue: STALE or a check already VOIDED whose request is REISSUE_PENDING)"
    error_id: ERR_CHECK_INVALID_STATE
    http_status: 409
    applies_to: "POST /check-disbursements/{checkId}/clear, POST /check-disbursements/{checkId}/void, POST /check-disbursements/{checkId}/reissue, POST /escheatment-records"
  - priority: 12
    category: state
    check: "The TakeBackNotice is in the state the operation requires (offset-applications: RECEIVED or PARTIALLY_APPLIED; dispute: RECEIVED or PARTIALLY_APPLIED; withdraw-dispute: DISPUTED); a WITHDRAWN notice accepts nothing"
    error_id: ERR_NOTICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /take-back-notices/{noticeId}/offset-applications, POST /take-back-notices/{noticeId}/dispute, POST /take-back-notices/{noticeId}/withdraw-dispute"
  - priority: 13
    category: state
    check: "The MedicareRepaymentObligation is OPEN or LATE when self-reported; an already REPORTED, REPORTED_LATE or satisfied obligation cannot be reported again"
    error_id: ERR_OBLIGATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /medicare-obligations/{obligationId}/report"
  - priority: 14
    category: state
    check: "The EscheatmentRecord is DORMANT for due-diligence; for remit the record must not already be terminal (CLAIMED, REMITTED or EXEMPT). A DORMANT record hitting remit passes this rule and is caught later at priority 21."
    error_id: ERR_ESCHEATMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /escheatment-records/{escheatmentRecordId}/due-diligence, POST /escheatment-records/{escheatmentRecordId}/remit"
  - priority: 15
    category: state
    check: "The ComplianceReport is DRAFT when finalized"
    error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /compliance-reports/{reportId}/finalize"
  - priority: 16
    category: state
    check: "The target AccountTransaction has is_reversed == false and is not itself a REVERSAL row"
    error_id: ERR_TRANSACTION_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /account-transactions/{transactionId}/reverse"
  - priority: 17
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (CreditBalance on refund-request create, TakeBackNotice on offset apply, RefundBatch on lock)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /refund-requests, POST /take-back-notices/{noticeId}/offset-applications, POST /refund-batches/{batchId}/lock"
  - priority: 18
    category: business_safety
    check: "Segregation of duties — the deciding RefundApprover's X-User-ID differs from RefundRequest.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /refund-requests/{refundRequestId}/decision"
  - priority: 19
    category: business_safety
    check: "No existing RefundApproval on this request already carries the deciding approver's X-User-ID (a tier-3 request needs two distinct approvers)"
    error_id: ERR_DUPLICATE_APPROVER
    http_status: 409
    applies_to: "POST /refund-requests/{refundRequestId}/decision"
  - priority: 20
    category: business_safety
    check: "No MedicareRepaymentObligation on the credit balance is in state OPEN or LATE"
    error_id: ERR_MEDICARE_OBLIGATION_OPEN
    http_status: 409
    applies_to: "POST /credit-balances/{creditBalanceId}/write-off"
  - priority: 21
    category: business_safety
    check: "The EscheatmentRecord has due_diligence_sent_at set (state == DUE_DILIGENCE_SENT) before any remittance"
    error_id: ERR_DUE_DILIGENCE_REQUIRED
    http_status: 409
    applies_to: "POST /escheatment-records/{escheatmentRecordId}/remit"
  - priority: 22
    category: business_temporal
    check: "The logical clock is at or after EscheatmentRecord.escheat_due_at"
    error_id: ERR_DORMANCY_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /escheatment-records/{escheatmentRecordId}/remit"
  - priority: 23
    category: business_temporal
    check: "The logical clock is at or after EscheatmentRecord.due_diligence_open_at"
    error_id: ERR_DUE_DILIGENCE_TOO_EARLY
    http_status: 409
    applies_to: "POST /escheatment-records/{escheatmentRecordId}/due-diligence"
  - priority: 24
    category: business_temporal
    check: "The logical clock is at or before TakeBackNotice.dispute_deadline_at"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /take-back-notices/{noticeId}/dispute"
  - priority: 25
    category: business_temporal
    check: "period_start_at < period_end_at and period_end_at <= as_of_at"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /compliance-reports"
  - priority: 26
    category: business_temporal
    check: "cutoff_at < scheduled_run_at"
    error_id: ERR_INVALID_BATCH_WINDOW
    http_status: 422
    applies_to: "POST /refund-batches"
  - priority: 27
    category: business_constraint
    check: "HALF-OPEN interval semantics. For the same bank_account_code, the new batch's window [cutoff_at, scheduled_run_at) must not intersect any existing batch's window whose state IN {OPEN, LOCKED, ISSUED}. Touching endpoints (new.cutoff_at == existing.scheduled_run_at, or new.scheduled_run_at == existing.cutoff_at) are ALLOWED — zero buffer, adjacency permitted."
    error_id: ERR_BATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /refund-batches"
  - priority: 28
    category: business_constraint
    check: "CLOSED interval semantics with a mandatory buffer. For the same (report_type, scope_code), the new report's closed period [period_start_at, period_end_at] must satisfy period_start_at >= existing.period_end_at + REPORT_PERIOD_BUFFER_DAYS OR period_end_at <= existing.period_start_at - REPORT_PERIOD_BUFFER_DAYS against every existing report in state DRAFT or FINALIZED. Touching endpoints are REJECTED — adjacency is forbidden and a 7-day gap is required. REPORT_PERIOD_BUFFER_DAYS = 7."
    error_id: ERR_REPORT_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /compliance-reports"
  - priority: 29
    category: business_constraint
    check: "payer_code is unique across all Payer rows"
    error_id: ERR_DUPLICATE_PAYER_CODE
    http_status: 409
    applies_to: "POST /payers"
  - priority: 30
    category: business_constraint
    check: "account_number is unique across all PatientAccount rows"
    error_id: ERR_DUPLICATE_ACCOUNT_NUMBER
    http_status: 409
    applies_to: "POST /patient-accounts"
  - priority: 31
    category: business_constraint
    check: "batch_number is unique across all RefundBatch rows"
    error_id: ERR_DUPLICATE_BATCH_NUMBER
    http_status: 409
    applies_to: "POST /refund-batches"
  - priority: 32
    category: business_constraint
    check: "notice_number is unique within payer_id"
    error_id: ERR_DUPLICATE_NOTICE_NUMBER
    http_status: 409
    applies_to: "POST /take-back-notices"
  - priority: 33
    category: business_constraint
    check: "At most one EscheatmentRecord may exist per CheckDisbursement"
    error_id: ERR_ESCHEATMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /escheatment-records"
  - priority: 34
    category: business_referential
    check: "The PatientAccount behind the credit balance has status == OPEN (CLOSED and BAD_DEBT accounts cannot originate refunds)"
    error_id: ERR_ACCOUNT_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /refund-requests"
  - priority: 35
    category: business_referential
    check: "payee_type must name a funded bucket: PATIENT requires CreditBalance.patient_portion_cents > 0, PAYER requires CreditBalance.payer_portion_cents > 0"
    error_id: ERR_PAYEE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /refund-requests"
  - priority: 36
    category: business_referential
    check: "The notice's Payer has take_back_allowed == true"
    error_id: ERR_TAKE_BACK_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /take-back-notices"
  - priority: 37
    category: business_referential
    check: "payer_id is present exactly when source == PAYER, and absent otherwise"
    error_id: ERR_TRANSACTION_PAYER_REQUIRED
    http_status: 422
    applies_to: "POST /patient-accounts/{accountId}/transactions"
  - priority: 38
    category: business_fiscal
    check: "requested_amount_cents >= MIN_REFUND_CENTS (100)"
    error_id: ERR_REFUND_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /refund-requests"
  - priority: 39
    category: business_fiscal
    check: "The credit must still be economically present on the account: PatientAccount.balance_cents < 0 at the moment the refund request is created. A later CHARGE that brings the account back to 0 or above consumes the credit even though the CreditBalance row is still ATTRIBUTED with outstanding_cents > 0."
    error_id: ERR_CREDIT_ALREADY_CONSUMED
    http_status: 409
    applies_to: "POST /refund-requests"
  - priority: 40
    category: business_fiscal
    check: "requested_amount_cents <= min(bucket capacity, outstanding_cents), where bucket capacity is patient_portion_cents for payee_type PATIENT and payer_portion_cents for payee_type PAYER"
    error_id: ERR_REFUND_EXCEEDS_CREDIT
    http_status: 422
    applies_to: "POST /refund-requests"
  - priority: 41
    category: business_fiscal
    check: "approver_tier >= RefundRequest.required_approval_tier"
    error_id: ERR_APPROVAL_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /refund-requests/{refundRequestId}/decision"
  - priority: 42
    category: business_fiscal
    check: "net_check_amount_cents >= MIN_CHECK_CENTS (200) after refund_net_disbursement"
    error_id: ERR_NET_BELOW_MIN_CHECK
    http_status: 422
    applies_to: "POST /refund-batches/{batchId}/items, POST /check-disbursements/{checkId}/reissue"
  - priority: 43
    category: business_fiscal
    check: "RefundBatch.item_count >= 1"
    error_id: ERR_BATCH_EMPTY
    http_status: 409
    applies_to: "POST /refund-batches/{batchId}/lock, POST /refund-batches/{batchId}/issue"
  - priority: 44
    category: business_fiscal
    check: "The offset eligibility filter yields at least one CreditBalance line"
    error_id: ERR_NO_ELIGIBLE_CREDIT
    http_status: 422
    applies_to: "POST /take-back-notices/{noticeId}/offset-applications"
  - priority: 45
    category: business_fiscal
    check: "CreditBalance.outstanding_cents <= WRITE_OFF_MAX_CENTS (1000)"
    error_id: ERR_WRITE_OFF_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-balances/{creditBalanceId}/write-off"
  - priority: 46
    category: business_constraint
    check: "RefundRequest.revision_count <= MAX_REVISION_ROUNDS (2) when re-submitting a returned request"
    error_id: ERR_MAX_REVISIONS_EXCEEDED
    http_status: 409
    applies_to: "POST /refund-requests/{refundRequestId}/submit"
  - priority: 47
    category: business_constraint
    check: "PatientAccount.credit_balance_cents == 0 when moving an account to CLOSED"
    error_id: ERR_ACCOUNT_HAS_OPEN_CREDIT
    http_status: 409
    applies_to: "POST /patient-accounts/{accountId}/status"

# =============================================================================
# Table 5: API Endpoint Table  (flat top-level collections; api_prefix "/")
# =============================================================================
endpoints:
  # ---- logical clock & ops checkpoint -------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock, which stamps every posted_at / identified_at / issued_at / decided_at / applied_at value and drives every aging, dormancy and deadline comparison. The clock's startup default is exactly 2026-08-01T00:00:00Z; before the first call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. The clock may be moved forward or backward."
    roles: [SystemAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["No entity is mutated; all subsequent time-derived computed fields are evaluated against the new instant"]

  - method: POST
    path: "/ops/run-aging-sweep"
    description: "Nightly operations checkpoint. Re-ages credit balances, staled ISSUED checks past stale_at, flips overdue Medicare obligations to LATE, closes fully-settled ISSUED batches, and withdraws disputed notices past the resolution grace window."
    roles: [SystemAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: { staled_check_count: integer, late_obligation_count: integer, closed_batch_count: integer, withdrawn_notice_count: integer }
    side_effects:
      - "CheckDisbursement ISSUED -> STALE for every check whose stale_at <= logical clock"
      - "MedicareRepaymentObligation OPEN -> LATE for every obligation whose due_at < logical clock, recomputing days_late and penalty_cents"
      - "RefundBatch ISSUED -> CLOSED when no PENDING or ISSUED check remains in it"
      - "TakeBackNotice DISPUTED -> WITHDRAWN past dispute_deadline_at + 30 days, reversing every APPLIED OffsetApplication on it"

  # ---- payers --------------------------------------------------------------
  - method: POST
    path: "/payers"
    description: "Register a payer."
    roles: [SystemAdmin]
    code: 201
    input: ["name", "payer_code", "payer_type", "take_back_allowed?", "refund_remit_days?"]
    output: Payer
    side_effects: []
  - method: GET
    path: "/payers"
    description: "List payers."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["payer_type?", "limit?", "offset?"]
    output: Payer[]
    side_effects: []
  - method: GET
    path: "/payers/{payerId}"
    description: "Read one payer."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- patient accounts & ledger ------------------------------------------
  - method: POST
    path: "/patient-accounts"
    description: "Open a patient account."
    roles: [SystemAdmin, CreditAnalyst]
    code: 201
    input: ["account_number", "mrn", "patient_name", "guarantor_state_code", "primary_payer_id", "financial_class", "discharge_date?"]
    output: PatientAccount
    side_effects: ["balance_cents and credit_balance_cents initialised to 0; status = OPEN"]
  - method: GET
    path: "/patient-accounts"
    description: "List patient accounts, filterable by primary payer and status."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["primary_payer_id?", "status?", "limit?", "offset?"]
    output: PatientAccount[]
    side_effects: []
  - method: GET
    path: "/patient-accounts/{accountId}"
    description: "Read one patient account with its recomputed balance_cents, credit_balance_cents and last_activity_at."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: PatientAccount
    side_effects: []
  - method: POST
    path: "/patient-accounts/{accountId}/status"
    description: "Move an account between OPEN, CLOSED and BAD_DEBT."
    roles: [SystemAdmin]
    code: 200
    input: ["status"]
    output: PatientAccount
    side_effects: ["increments PatientAccount.version by 1", "CLOSED and BAD_DEBT accounts stop originating refund requests"]
  - method: POST
    path: "/patient-accounts/{accountId}/transactions"
    description: "Post a ledger transaction against the account. Only CHARGE, PAYMENT and CONTRACTUAL_ADJUSTMENT may be posted through this endpoint; REFUND_DISBURSEMENT, TAKE_BACK_OFFSET, ESCHEAT_REMITTANCE and REVERSAL rows are written only by the system as cascade side effects (REVERSAL additionally by POST /account-transactions/{transactionId}/reverse)."
    roles: [CreditAnalyst, SystemAdmin]
    code: 201
    input: ["txn_type", "amount_cents", "source", "payer_id?", "effective_at?", "remark?"]
    output: AccountTransaction
    side_effects: ["recomputes PatientAccount.balance_cents and last_activity_at", "increments PatientAccount.version by 1"]
  - method: GET
    path: "/account-transactions"
    description: "List ledger transactions, filterable by account, payer, reversal target and type."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["account_id?", "payer_id?", "reversal_of_transaction_id?", "txn_type?", "limit?", "offset?"]
    output: AccountTransaction[]
    side_effects: []
  - method: GET
    path: "/account-transactions/{transactionId}"
    description: "Read one ledger transaction."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: AccountTransaction
    side_effects: []
  - method: POST
    path: "/account-transactions/{transactionId}/reverse"
    description: "Post a REVERSAL row negating an existing transaction."
    roles: [CreditAnalyst]
    code: 201
    input: ["remark?"]
    output: AccountTransaction
    side_effects: ["creates a REVERSAL AccountTransaction with the exact negated amount_cents and reversal_of_transaction_id set", "the target's is_reversed becomes true", "recomputes PatientAccount.balance_cents"]

  # ---- credit balances -----------------------------------------------------
  - method: POST
    path: "/credit-balances/identify-sweep"
    description: "Run the credit balance identification sweep over eligible accounts."
    roles: [CreditAnalyst]
    code: 200
    input: ["account_ids?"]
    output: "{ identified_count: integer, credit_balance_ids: string[], skipped_account_count: integer }"
    side_effects: ["creates CreditBalance rows in status IDENTIFIED per credit_balance_identification_sweep", "recomputes PatientAccount.credit_balance_cents on each swept account"]
  - method: GET
    path: "/credit-balances"
    description: "List credit balances, filterable by account, payer, status and aging bucket."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["account_id?", "payer_id?", "status?", "aging_bucket?", "limit?", "offset?"]
    output: CreditBalance[]
    side_effects: []
  - method: GET
    path: "/credit-balances/{creditBalanceId}"
    description: "Read one credit balance with aging_days / aging_bucket recomputed against the logical clock."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: CreditBalance
    side_effects: []
  - method: POST
    path: "/credit-balances/{creditBalanceId}/start-review"
    description: "Take a newly identified credit balance into review."
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CreditBalance
    side_effects: ["status IDENTIFIED -> UNDER_REVIEW", "increments CreditBalance.version by 1"]
  - method: POST
    path: "/credit-balances/{creditBalanceId}/attribute"
    description: "Determine the patient vs payer split of the overpayment using the chosen method."
    roles: [CreditAnalyst]
    code: 200
    input: ["attribution_method"]
    output: CreditBalance
    side_effects:
      - "runs credit_balance_attribution_split; writes patient_portion_cents, payer_portion_cents, attribution"
      - "status UNDER_REVIEW -> ATTRIBUTED"
      - "increments CreditBalance.version by 1"
      - "creates a MedicareRepaymentObligation in state OPEN when the credit balance's payer is MEDICARE and payer_portion_cents > 0"
  - method: POST
    path: "/credit-balances/{creditBalanceId}/write-off"
    description: "Write off a de-minimis credit balance."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason_code"]
    output: CreditBalance
    side_effects: ["status ATTRIBUTED -> WRITTEN_OFF", "increments CreditBalance.version by 1", "any REPORTED / REPORTED_LATE obligation becomes SATISFIED / SATISFIED_LATE with satisfaction_mode WRITE_OFF"]

  # ---- root cause analysis -------------------------------------------------
  - method: POST
    path: "/root-cause-findings"
    description: "File a posting-error root-cause finding against a credit balance."
    roles: [CreditAnalyst]
    code: 201
    input: ["credit_balance_id", "cause_code", "corrective_action", "narrative", "evidence_transaction_ids?", "confirmed?"]
    output: RootCauseFinding
    side_effects: ["recomputes CreditBalance.root_cause_confirmed", "increments CreditBalance.version by 1"]
  - method: GET
    path: "/root-cause-findings"
    description: "List root-cause findings, filterable by credit balance and cause."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["credit_balance_id?", "cause_code?", "confirmed?", "limit?", "offset?"]
    output: RootCauseFinding[]
    side_effects: []
  - method: GET
    path: "/root-cause-findings/{findingId}"
    description: "Read one root-cause finding."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: RootCauseFinding
    side_effects: []

  # ---- refund requests & approvals ----------------------------------------
  - method: POST
    path: "/refund-requests"
    description: "Prepare a refund request against an attributed credit balance. Guarded by optimistic concurrency on the credit balance."
    roles: [CreditAnalyst]
    code: 201
    input: ["credit_balance_id", "requested_amount_cents", "payee_type", "payee_name", "payee_address_line", "payee_state_code", "expected_credit_balance_version"]
    output: RefundRequest
    side_effects:
      - "runs refund_approval_tier; writes required_approval_tier and required_approval_count"
      - "CreditBalance status ATTRIBUTED -> REFUND_PENDING"
      - "increments CreditBalance.version by 1"
      - "prepared_by_user_id is stamped from X-User-ID"
  - method: GET
    path: "/refund-requests"
    description: "List refund requests, filterable by credit balance and either state dimension."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["credit_balance_id?", "approval_state?", "disbursement_state?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: GET
    path: "/refund-requests/{refundRequestId}"
    description: "Read one refund request."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: POST
    path: "/refund-requests/{refundRequestId}/submit"
    description: "Submit a draft (or returned) refund request for approval."
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["approval_state DRAFT or RETURNED_FOR_REVISION -> SUBMITTED", "re-runs refund_approval_tier"]
  - method: POST
    path: "/refund-requests/{refundRequestId}/decision"
    description: "Approve, reject or return a submitted refund request. Subject to segregation of duties and signing-authority tiers."
    roles: [RefundApprover]
    code: 201
    input: ["decision", "approver_tier", "note?"]
    output: RefundApproval
    side_effects:
      - "creates a RefundApproval row stamped with the approver's X-User-ID"
      - "APPROVED on a single-approval request: approval_state -> APPROVED, approved_amount_cents = requested_amount_cents"
      - "APPROVED as the first of two required approvals: approvals_received -> 1, approval_state stays SUBMITTED"
      - "REJECTED: approval_state -> REJECTED and the CreditBalance returns REFUND_PENDING -> ATTRIBUTED"
      - "RETURNED: approval_state -> RETURNED_FOR_REVISION and revision_count increments"
  - method: POST
    path: "/refund-requests/{refundRequestId}/cancel"
    description: "Withdraw a refund request that has not been paid."
    roles: [CreditAnalyst]
    code: 200
    input: ["reason?"]
    output: RefundRequest
    side_effects: ["approval_state -> CANCELLED (or disbursement_state REISSUE_PENDING -> VOID_CLOSED)", "the CreditBalance returns REFUND_PENDING -> ATTRIBUTED"]
  - method: GET
    path: "/refund-approvals"
    description: "List approval decisions, filterable by request and decision."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["refund_request_id?", "decision?", "limit?", "offset?"]
    output: RefundApproval[]
    side_effects: []
  - method: GET
    path: "/refund-approvals/{approvalId}"
    description: "Read one approval decision."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: RefundApproval
    side_effects: []

  # ---- batches & checks ----------------------------------------------------
  - method: POST
    path: "/refund-batches"
    description: "Open a check run on a disbursement channel for a half-open [cutoff_at, scheduled_run_at) window."
    roles: [DisbursementOfficer]
    code: 201
    input: ["batch_number", "bank_account_code", "cutoff_at", "scheduled_run_at"]
    output: RefundBatch
    side_effects: ["state = OPEN; totals initialised to 0"]
  - method: GET
    path: "/refund-batches"
    description: "List check runs."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["state?", "bank_account_code?", "limit?", "offset?"]
    output: RefundBatch[]
    side_effects: []
  - method: GET
    path: "/refund-batches/{batchId}"
    description: "Read one check run with its recomputed totals."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: RefundBatch
    side_effects: []
  - method: POST
    path: "/refund-batches/{batchId}/items"
    description: "Add an approved refund request to an open check run, minting a PENDING check line."
    roles: [DisbursementOfficer]
    code: 201
    input: ["refund_request_id"]
    output: CheckDisbursement
    side_effects:
      - "runs refund_net_disbursement; writes gross_amount_cents, processing_fee_cents, net_check_amount_cents"
      - "RefundRequest.disbursement_state NOT_SCHEDULED or REISSUE_PENDING -> BATCHED"
      - "recomputes RefundBatch.item_count, total_gross_cents, total_fee_cents, total_net_cents"
      - "increments RefundBatch.version by 1"
  - method: POST
    path: "/refund-batches/{batchId}/lock"
    description: "Freeze a check run's line set ahead of issue. Guarded by optimistic concurrency on the batch."
    roles: [DisbursementOfficer]
    code: 200
    input: ["expected_refund_batch_version"]
    output: RefundBatch
    side_effects: ["state OPEN -> LOCKED", "increments RefundBatch.version by 1"]
  - method: POST
    path: "/refund-batches/{batchId}/unlock"
    description: "Reopen a locked check run so lines can be added or removed."
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: RefundBatch
    side_effects: ["state LOCKED -> OPEN", "increments RefundBatch.version by 1"]
  - method: POST
    path: "/refund-batches/{batchId}/issue"
    description: "Cut checks for every pending line in a locked run. Drives the four-hop issue cascade."
    roles: [DisbursementOfficer]
    code: 200
    input: ["starting_check_number"]
    output: RefundBatch
    side_effects:
      - "state LOCKED -> ISSUED"
      - "every PENDING check moves to ISSUED with a sequential check_number, issued_at and stale_at, ordered by CheckDisbursement.created_at ASC (hop 1)"
      - "each issued check drives its RefundRequest BATCHED -> ISSUED (hop 2)"
      - "each of those posts a REFUND_DISBURSEMENT AccountTransaction of +gross_amount_cents and drives its CreditBalance REFUND_PENDING -> REFUNDED (hop 3)"
      - "each REFUNDED credit balance drives its MedicareRepaymentObligation to SATISFIED / SATISFIED_LATE (hop 4)"
      - "increments RefundBatch.version by 1"
  - method: GET
    path: "/check-disbursements"
    description: "List check lines, filterable by request, batch, reissue predecessor and state."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["refund_request_id?", "refund_batch_id?", "reissue_of_disbursement_id?", "state?", "limit?", "offset?"]
    output: CheckDisbursement[]
    side_effects: []
  - method: GET
    path: "/check-disbursements/{checkId}"
    description: "Read one check line."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: CheckDisbursement
    side_effects: []
  - method: POST
    path: "/check-disbursements/{checkId}/clear"
    description: "Record that an issued check cleared the bank."
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: CheckDisbursement
    side_effects: ["state ISSUED -> CLEARED with cleared_at", "RefundRequest.disbursement_state ISSUED -> CLEARED"]
  - method: POST
    path: "/check-disbursements/{checkId}/void"
    description: "Void an issued or stale check. Drives the four-hop compensation cascade that puts the credit back."
    roles: [DisbursementOfficer]
    code: 200
    input: ["void_reason"]
    output: CheckDisbursement
    side_effects:
      - "state ISSUED or STALE -> VOIDED with void_reason"
      - "posts a REVERSAL AccountTransaction negating the check's REFUND_DISBURSEMENT posting (hop 1)"
      - "RefundRequest.disbursement_state ISSUED -> REISSUE_PENDING (hop 2)"
      - "CreditBalance REFUNDED -> REFUND_PENDING with refunded_cents and outstanding_cents recomputed (hop 3)"
      - "MedicareRepaymentObligation SATISFIED -> OPEN or SATISFIED_LATE -> LATE with days_elapsed / days_late / penalty_cents recomputed (hop 4)"
      - "any DORMANT EscheatmentRecord on this check moves to EXEMPT"
  - method: POST
    path: "/check-disbursements/{checkId}/reissue"
    description: "Cut a replacement line for a stale or voided check into an open run."
    roles: [DisbursementOfficer]
    code: 201
    input: ["refund_batch_id"]
    output: CheckDisbursement
    side_effects:
      - "creates a successor CheckDisbursement with reissue_of_disbursement_id pointing at the predecessor"
      - "the predecessor moves STALE -> REISSUED"
      - "RefundRequest.disbursement_state REISSUE_PENDING -> BATCHED"
      - "any DUE_DILIGENCE_SENT EscheatmentRecord on the predecessor moves to CLAIMED"
      - "increments RefundBatch.version by 1"

  # ---- take-backs & offsets ------------------------------------------------
  - method: POST
    path: "/take-back-notices"
    description: "Record a payer take-back / recoupment notice."
    roles: [PayerLiaison]
    code: 201
    input: ["payer_id", "notice_number", "total_recoup_cents", "admin_fee_cents?"]
    output: TakeBackNotice
    side_effects: ["received_at stamped from the logical clock; dispute_deadline_at = received_at + 45 days", "state = RECEIVED"]
  - method: GET
    path: "/take-back-notices"
    description: "List take-back notices."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["payer_id?", "state?", "limit?", "offset?"]
    output: TakeBackNotice[]
    side_effects: []
  - method: GET
    path: "/take-back-notices/{noticeId}"
    description: "Read one take-back notice with recomputed applied_cents and remaining_unapplied_cents."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: TakeBackNotice
    side_effects: []
  - method: POST
    path: "/take-back-notices/{noticeId}/offset-applications"
    description: "Apply the notice against the named accounts' credit balances using the oldest-credit-first waterfall. Guarded by optimistic concurrency on the notice."
    roles: [CreditAnalyst]
    code: 201
    input: ["target_account_ids", "expected_take_back_notice_version"]
    output: OffsetApplication[]
    side_effects:
      - "runs offset_waterfall_allocation; creates one OffsetApplication per funded line in waterfall order"
      - "posts a TAKE_BACK_OFFSET AccountTransaction of +applied_cents per line (hop 1)"
      - "each posting drives its CreditBalance's offset_cents / outstanding_cents recompute (hop 2)"
      - "a CreditBalance whose outstanding_cents reaches 0 moves ATTRIBUTED -> RESOLVED_BY_OFFSET (hop 3)"
      - "each RESOLVED_BY_OFFSET credit balance drives its MedicareRepaymentObligation to SATISFIED_BY_OFFSET (hop 4)"
      - "increments TakeBackNotice.version by 1; the notice steps to PARTIALLY_APPLIED or FULLY_APPLIED"
  - method: POST
    path: "/take-back-notices/{noticeId}/dispute"
    description: "Payer-side dispute of a take-back notice inside the 45-day window."
    roles: [PayerLiaison]
    code: 200
    input: ["dispute_reason"]
    output: TakeBackNotice
    side_effects: ["state -> DISPUTED", "increments TakeBackNotice.version by 1", "offset applications are blocked while DISPUTED"]
  - method: POST
    path: "/take-back-notices/{noticeId}/withdraw-dispute"
    description: "Payer withdraws its dispute, returning the notice to the applicable state."
    roles: [PayerLiaison]
    code: 200
    input: []
    output: TakeBackNotice
    side_effects: ["state DISPUTED -> RECEIVED (applied_cents == 0) or -> PARTIALLY_APPLIED (applied_cents > 0)", "increments TakeBackNotice.version by 1"]
  - method: GET
    path: "/offset-applications"
    description: "List offset lines, filterable by notice, account, credit balance, posting and state."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["take_back_notice_id?", "account_id?", "credit_balance_id?", "posted_transaction_id?", "state?", "limit?", "offset?"]
    output: OffsetApplication[]
    side_effects: []
  - method: GET
    path: "/offset-applications/{offsetApplicationId}"
    description: "Read one offset line."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: OffsetApplication
    side_effects: []
  - method: POST
    path: "/offset-applications/{offsetApplicationId}/reverse"
    description: "Reverse one applied offset line, unwinding the ledger, credit balance and obligation effects."
    roles: [CreditAnalyst]
    code: 200
    input: ["reason?"]
    output: OffsetApplication
    side_effects:
      - "state APPLIED -> REVERSED with reversed_at"
      - "posts a REVERSAL AccountTransaction negating the line's TAKE_BACK_OFFSET posting (hop 1)"
      - "the CreditBalance recomputes offset_cents / outstanding_cents and moves RESOLVED_BY_OFFSET -> ATTRIBUTED when outstanding_cents becomes > 0 (hop 2)"
      - "that credit balance transition reopens a SATISFIED_BY_OFFSET MedicareRepaymentObligation to OPEN or LATE (hop 3)"
      - "the TakeBackNotice recomputes applied_cents / remaining_unapplied_cents and steps its state down"

  # ---- Medicare 60-day compliance -----------------------------------------
  - method: GET
    path: "/medicare-obligations"
    description: "List Medicare 60-day repayment obligations."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["credit_balance_id?", "payer_id?", "state?", "limit?", "offset?"]
    output: MedicareRepaymentObligation[]
    side_effects: []
  - method: GET
    path: "/medicare-obligations/{obligationId}"
    description: "Read one obligation with days_elapsed / days_late / penalty_cents recomputed against the logical clock."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: MedicareRepaymentObligation
    side_effects: []
  - method: POST
    path: "/medicare-obligations/{obligationId}/report"
    description: "Self-report the overpayment to the Medicare contractor."
    roles: [ComplianceOfficer]
    code: 200
    input: ["report_reference"]
    output: MedicareRepaymentObligation
    side_effects: ["state OPEN -> REPORTED (on time) or LATE -> REPORTED_LATE (with penalty_cents written)", "sets reported_at and report_reference"]

  # ---- escheatment ---------------------------------------------------------
  - method: POST
    path: "/escheatment-records"
    description: "Open an unclaimed-property record against a stale check."
    roles: [ComplianceOfficer]
    code: 201
    input: ["check_disbursement_id", "basis?"]
    output: EscheatmentRecord
    side_effects: ["runs escheat_dormancy_clock; writes state_code, dormancy_days, dormancy_start_at, escheat_due_at, due_diligence_open_at", "state = DORMANT"]
  - method: GET
    path: "/escheatment-records"
    description: "List unclaimed-property records."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["check_disbursement_id?", "state?", "limit?", "offset?"]
    output: EscheatmentRecord[]
    side_effects: []
  - method: GET
    path: "/escheatment-records/{escheatmentRecordId}"
    description: "Read one unclaimed-property record."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: EscheatmentRecord
    side_effects: []
  - method: POST
    path: "/escheatment-records/{escheatmentRecordId}/due-diligence"
    description: "Record the statutory owner-contact letter."
    roles: [ComplianceOfficer]
    code: 200
    input: ["contact_method"]
    output: EscheatmentRecord
    side_effects: ["state DORMANT -> DUE_DILIGENCE_SENT with due_diligence_sent_at and contact_method"]
  - method: POST
    path: "/escheatment-records/{escheatmentRecordId}/remit"
    description: "Remit the unclaimed funds to the state."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EscheatmentRecord
    side_effects:
      - "state DUE_DILIGENCE_SENT -> REMITTED with remitted_amount_cents = the check's net_check_amount_cents"
      - "CheckDisbursement STALE -> ESCHEATED (hop 1)"
      - "CreditBalance REFUNDED -> ESCHEATED and an ESCHEAT_REMITTANCE AccountTransaction is posted (hop 2)"

  # ---- audit reporting -----------------------------------------------------
  - method: POST
    path: "/compliance-reports"
    description: "Generate a credit balance liability, Medicare CBR or escheat holder report for a closed period."
    roles: [ComplianceOfficer]
    code: 201
    input: ["report_type", "scope_code", "period_start_at", "period_end_at", "as_of_at"]
    output: ComplianceReport
    side_effects: ["runs credit_balance_liability_report; writes every computed total", "state = DRAFT"]
  - method: GET
    path: "/compliance-reports"
    description: "List compliance reports."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: ["report_type?", "state?", "limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []
  - method: GET
    path: "/compliance-reports/{reportId}"
    description: "Read one compliance report."
    roles: [CreditAnalyst, RefundApprover, DisbursementOfficer, ComplianceOfficer, PayerLiaison, SystemAdmin]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []
  - method: POST
    path: "/compliance-reports/{reportId}/finalize"
    description: "Freeze a draft report."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["state DRAFT -> FINALIZED"]


# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_PAYER_SCOPE_VIOLATION, http: 403, condition: "A PayerLiaison acts on a TakeBackNotice whose payer_id differs from the caller's X-User-ID" }
  - { id: ERR_APPROVAL_TIER_INSUFFICIENT, http: 403, condition: "approver_tier is below RefundRequest.required_approval_tier" }
  # --- existence ---
  - { id: ERR_PAYER_NOT_FOUND, http: 404, condition: "A payer id in the path or body does not resolve" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "A patient account id in the path or in target_account_ids does not resolve" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "An account transaction id in the path does not resolve" }
  - { id: ERR_CREDIT_BALANCE_NOT_FOUND, http: 404, condition: "A credit balance id in the path or body does not resolve" }
  - { id: ERR_ROOT_CAUSE_FINDING_NOT_FOUND, http: 404, condition: "A root cause finding id in the path does not resolve" }
  - { id: ERR_REFUND_REQUEST_NOT_FOUND, http: 404, condition: "A refund request id in the path or body does not resolve" }
  - { id: ERR_REFUND_APPROVAL_NOT_FOUND, http: 404, condition: "An approval id in the path does not resolve" }
  - { id: ERR_REFUND_BATCH_NOT_FOUND, http: 404, condition: "A refund batch id in the path or body does not resolve" }
  - { id: ERR_CHECK_NOT_FOUND, http: 404, condition: "A check disbursement id in the path or body does not resolve" }
  - { id: ERR_TAKE_BACK_NOTICE_NOT_FOUND, http: 404, condition: "A take-back notice id in the path does not resolve" }
  - { id: ERR_OFFSET_APPLICATION_NOT_FOUND, http: 404, condition: "An offset application id in the path does not resolve" }
  - { id: ERR_MEDICARE_OBLIGATION_NOT_FOUND, http: 404, condition: "A Medicare obligation id in the path does not resolve" }
  - { id: ERR_ESCHEATMENT_RECORD_NOT_FOUND, http: 404, condition: "An escheatment record id in the path does not resolve" }
  - { id: ERR_COMPLIANCE_REPORT_NOT_FOUND, http: 404, condition: "A compliance report id in the path does not resolve" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, illegal enum member, wrong scalar type, or empty target_account_ids array" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1, 100] or offset below 0" }
  # --- state preconditions ---
  - { id: ERR_CREDIT_BALANCE_INVALID_STATE, http: 409, condition: "The credit balance is not in the status the operation requires" }
  - { id: ERR_REFUND_REQUEST_INVALID_STATE, http: 409, condition: "The refund request's approval_state or disbursement_state does not permit the operation" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "The refund batch is not in the state the operation requires" }
  - { id: ERR_CHECK_INVALID_STATE, http: 409, condition: "The check disbursement is not in the state the operation requires" }
  - { id: ERR_NOTICE_INVALID_STATE, http: 409, condition: "The take-back notice is not in the state the operation requires" }
  - { id: ERR_OBLIGATION_INVALID_STATE, http: 409, condition: "The Medicare obligation has already been reported or satisfied" }
  - { id: ERR_ESCHEATMENT_INVALID_STATE, http: 409, condition: "The escheatment record is not DORMANT for due diligence, or is already terminal for remittance" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "The compliance report is already FINALIZED" }
  - { id: ERR_TRANSACTION_ALREADY_REVERSED, http: 409, condition: "The target transaction already carries a reversal, or is itself a REVERSAL row" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_credit_balance_version / expected_take_back_notice_version / expected_refund_batch_version does not equal the parent's current version" }
  # --- safety / compliance ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "The deciding approver's X-User-ID equals RefundRequest.prepared_by_user_id" }
  - { id: ERR_DUPLICATE_APPROVER, http: 409, condition: "The deciding approver already recorded a decision on this refund request" }
  - { id: ERR_MEDICARE_OBLIGATION_OPEN, http: 409, condition: "A write-off was attempted while a Medicare obligation on the credit balance is OPEN or LATE" }
  - { id: ERR_DUE_DILIGENCE_REQUIRED, http: 409, condition: "Remittance was attempted on a record that has no due_diligence_sent_at" }
  - { id: ERR_DUE_DILIGENCE_TOO_EARLY, http: 409, condition: "A due-diligence letter was recorded before due_diligence_open_at" }
  - { id: ERR_DORMANCY_NOT_ELAPSED, http: 409, condition: "Remittance was attempted before escheat_due_at" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "A dispute was filed after dispute_deadline_at" }
  # --- temporal / interval constraints ---
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "period_start_at >= period_end_at, or period_end_at > as_of_at" }
  - { id: ERR_INVALID_BATCH_WINDOW, http: 422, condition: "cutoff_at >= scheduled_run_at" }
  - { id: ERR_BATCH_WINDOW_OVERLAP, http: 409, condition: "The new batch's half-open window intersects an existing OPEN / LOCKED / ISSUED batch on the same bank_account_code (touching endpoints are allowed)" }
  - { id: ERR_REPORT_PERIOD_CONFLICT, http: 409, condition: "The new report's closed period is within 7 days of an existing report with the same report_type and scope_code (touching endpoints are rejected)" }
  # --- uniqueness ---
  - { id: ERR_DUPLICATE_PAYER_CODE, http: 409, condition: "payer_code already exists" }
  - { id: ERR_DUPLICATE_ACCOUNT_NUMBER, http: 409, condition: "account_number already exists" }
  - { id: ERR_DUPLICATE_BATCH_NUMBER, http: 409, condition: "batch_number already exists" }
  - { id: ERR_DUPLICATE_NOTICE_NUMBER, http: 409, condition: "notice_number already exists for this payer" }
  - { id: ERR_ESCHEATMENT_ALREADY_EXISTS, http: 409, condition: "An escheatment record already exists for this check" }
  # --- referential ---
  - { id: ERR_ACCOUNT_NOT_REFUNDABLE, http: 409, condition: "The credit balance's patient account is CLOSED or BAD_DEBT" }
  - { id: ERR_PAYEE_TYPE_MISMATCH, http: 422, condition: "payee_type names a bucket whose portion is 0 on the credit balance" }
  - { id: ERR_TAKE_BACK_NOT_PERMITTED, http: 422, condition: "The notice's payer has take_back_allowed == false" }
  - { id: ERR_TRANSACTION_PAYER_REQUIRED, http: 422, condition: "payer_id is missing while source == PAYER, or supplied while source != PAYER" }
  # --- fiscal ---
  - { id: ERR_REFUND_BELOW_MINIMUM, http: 422, condition: "requested_amount_cents is below MIN_REFUND_CENTS (100)" }
  - { id: ERR_CREDIT_ALREADY_CONSUMED, http: 409, condition: "The credit balance's account is no longer in credit (balance_cents >= 0), typically because a later charge absorbed the overpayment" }
  - { id: ERR_REFUND_EXCEEDS_CREDIT, http: 422, condition: "requested_amount_cents exceeds the payee bucket's capacity or outstanding_cents" }
  - { id: ERR_NET_BELOW_MIN_CHECK, http: 422, condition: "net_check_amount_cents would fall below MIN_CHECK_CENTS (200) after the processing fee; reachable whenever the gross sits between MIN_REFUND_CENTS (100) and 199" }
  - { id: ERR_BATCH_EMPTY, http: 409, condition: "A lock or issue was attempted on a batch with item_count 0" }
  - { id: ERR_NO_ELIGIBLE_CREDIT, http: 422, condition: "The offset eligibility filter matched no credit balance on the named accounts" }
  - { id: ERR_WRITE_OFF_LIMIT_EXCEEDED, http: 422, condition: "outstanding_cents exceeds WRITE_OFF_MAX_CENTS (1000)" }
  - { id: ERR_MAX_REVISIONS_EXCEEDED, http: 409, condition: "A returned refund request has already been revised MAX_REVISION_ROUNDS (2) times" }
  - { id: ERR_ACCOUNT_HAS_OPEN_CREDIT, http: 409, condition: "An account with credit_balance_cents != 0 was moved to CLOSED" }

# =============================================================================
# Table 7: RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: CreditAnalyst
    description: "Patient accounting analyst who identifies credit balances, determines patient vs payer attribution, documents posting-error root causes, prepares refund requests and works payer take-back offsets. Holds no approval or disbursement authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /credit-balances/identify-sweep"
      - "POST /credit-balances/{creditBalanceId}/start-review"
      - "POST /credit-balances/{creditBalanceId}/attribute"
      - "POST /root-cause-findings"
      - "POST /account-transactions/{transactionId}/reverse"
      - "POST /refund-requests"
      - "POST /refund-requests/{refundRequestId}/submit"
      - "POST /refund-requests/{refundRequestId}/cancel"
      - "POST /take-back-notices/{noticeId}/offset-applications"
      - "POST /offset-applications/{offsetApplicationId}/reverse"
    shared_operations:
      - "POST /patient-accounts (with SystemAdmin)"
      - "POST /patient-accounts/{accountId}/transactions (with SystemAdmin)"
      - "every GET read endpoint"

  - name: RefundApprover
    description: "Signing authority who approves, rejects or returns submitted refund requests. May never decide on a request it prepared, and may never supply two of the same request's approvals."
    identity: "opaque"
    exclusive_operations:
      - "POST /refund-requests/{refundRequestId}/decision"
    shared_operations:
      - "every GET read endpoint"

  - name: DisbursementOfficer
    description: "Treasury operator who assembles check runs, locks and issues them, and clears, voids or reissues individual checks. Holds no approval authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /refund-batches"
      - "POST /refund-batches/{batchId}/items"
      - "POST /refund-batches/{batchId}/lock"
      - "POST /refund-batches/{batchId}/unlock"
      - "POST /refund-batches/{batchId}/issue"
      - "POST /check-disbursements/{checkId}/clear"
      - "POST /check-disbursements/{checkId}/void"
      - "POST /check-disbursements/{checkId}/reissue"
    shared_operations:
      - "every GET read endpoint"

  - name: ComplianceOfficer
    description: "Regulatory owner of the Medicare 60-day self-report, de-minimis write-offs, unclaimed-property escheatment and audit reporting of credit balance liability."
    identity: "opaque"
    exclusive_operations:
      - "POST /credit-balances/{creditBalanceId}/write-off"
      - "POST /medicare-obligations/{obligationId}/report"
      - "POST /escheatment-records"
      - "POST /escheatment-records/{escheatmentRecordId}/due-diligence"
      - "POST /escheatment-records/{escheatmentRecordId}/remit"
      - "POST /compliance-reports"
      - "POST /compliance-reports/{reportId}/finalize"
    shared_operations:
      - "POST /ops/run-aging-sweep (with SystemAdmin)"
      - "every GET read endpoint"

  - name: PayerLiaison
    description: "Payer-side representative. X-User-ID is the id of the Payer row the liaison acts for; every take-back notice it records or disputes must carry that same payer_id."
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /take-back-notices"
      - "POST /take-back-notices/{noticeId}/dispute"
      - "POST /take-back-notices/{noticeId}/withdraw-dispute"
    shared_operations:
      - "every GET read endpoint"

  - name: SystemAdmin
    description: "Operational administrator that seeds payers and accounts, moves account status, drives the logical clock and runs the nightly aging checkpoint. Deliberately holds no analyst, approval, disbursement or compliance authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /payers"
      - "POST /patient-accounts/{accountId}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patient-accounts (with CreditAnalyst)"
      - "POST /patient-accounts/{accountId}/transactions (with CreditAnalyst)"
      - "POST /ops/run-aging-sweep (with ComplianceOfficer)"
      - "every GET read endpoint"
