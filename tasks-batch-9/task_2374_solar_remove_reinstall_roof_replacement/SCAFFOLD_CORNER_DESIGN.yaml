        distinguishing_aspect: "Every machine's initial state is asserted on a freshly created row: project INTAKE, circuit ENERGIZED with interlock_verified false, unit ON_ROOF and UNINSPECTED with warranty_variant still null, permit DRAFT with revision_count 0, window SCHEDULED, approval PENDING at round 1. The project used for the entity reads has no approval at all, so its INTAKE is not disturbed by the INTAKE -> APPROVALS_OPEN trigger, which is exercised on a second project."
