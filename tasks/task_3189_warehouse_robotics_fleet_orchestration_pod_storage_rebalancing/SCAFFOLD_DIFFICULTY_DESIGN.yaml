            - "SoftwareRelease.${r1}.status == ROLLED_BACK"
            - "DriveUnit.${du1}.firmware_release_id == ${r2}"
            - "DriveUnit.${du2}.firmware_release_id == ${r2}"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_promote_with_open_exception
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.SoftwareRelease.VALIDATED_to_FLOOR_LIVE
        distinguishing_aspect: |
          Conflict pair (state vs business_safety): a release in DRAFT fails
          state (priority 5) even though the safety interlock (priority 6) is
          also engaged because a FloorException is OPEN. The higher-priority
          state error MUST win.
        test_recipe:
          setup:
            - "Zone Z1. FloorException EX1 kind=BLOCKED_PATH in Z1, still OPEN (safety interlock engaged). SoftwareRelease R1 in DRAFT (never validated)."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "BLOCKED_PATH", zone_id: "${z1}" }
              as: FloorSupervisor
              captures: { ex1: $.data.id }
            - call: "POST /fleet/software-releases"
              payload: { release_code: "9.9.9" }
              as: ReleaseEngineer
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /fleet/software-releases/${r1}/promote"
              payload: {}
              as: FleetAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 5 beats safety priority 6)"
            - "http status == 409"

      - name: safety_vs_referential_on_grant_with_released_permit_prerequisite
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.HumanEntryPermit.REQUESTED_to_ACTIVE
        distinguishing_aspect: |
          Conflict pair (business_safety vs business_referential): a permit
          grant where the underlying exception has already been RESOLVED fails
          safety (priority 6) — but a permit whose exception_id references a
          non-existent FloorException must instead fail referential (priority 7
          surfaces after existence at priority 4 wins). The two error categories
          are distinct and sit at different priorities.
        test_recipe:
          setup:
            - "Zone Z1 max_human_occupancy 1. FloorException EX1 triaged HUMAN and then fully RESOLVED (permit granted and released). HumanEntryPermit HEP2 in REQUESTED referencing the now-RESOLVED EX1."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "BLOCKED_PATH", zone_id: "${z1}" }
              as: FloorSupervisor
              captures: { ex1: $.data.id }
            - call: "POST /fleet/floor-exceptions/${ex1}/triage"
              payload: { branch: "HUMAN" }
              as: FloorSupervisor
            - call: "POST /fleet/human-entry-permits"
              payload: { zone_id: "${z1}", exception_id: "${ex1}", starts_at: "2026-09-01T08:30:00Z", ends_at: "2026-09-01T09:00:00Z" }
              as: FloorSupervisor
              captures: { hep1: $.data.id }
            - call: "POST /fleet/human-entry-permits/${hep1}/grant"
              payload: {}
              as: SafetyOfficer
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/human-entry-permits/${hep1}/release"
              payload: {}
              as: SafetyOfficer
            - call: "POST /fleet/floor-exceptions/${ex1}/resolve"
              payload: { corrective_outcome: "RESTORE" }
              as: FloorSupervisor
            - call: "POST /fleet/human-entry-permits"
              payload: { zone_id: "${z1}", exception_id: "${ex1}", starts_at: "2026-09-01T10:00:00Z", ends_at: "2026-09-01T11:00:00Z" }
              as: FloorSupervisor
              captures: { hep2: $.data.id }
          trigger:
            - call: "POST /fleet/human-entry-permits/${hep2}/grant"
              payload: {}
              as: SafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SAFETY_INTERLOCK"
            - "http status == 422"
            - "HumanEntryPermit.${hep2}.status == REQUESTED"

  - rule_id: boundary_precision_check
