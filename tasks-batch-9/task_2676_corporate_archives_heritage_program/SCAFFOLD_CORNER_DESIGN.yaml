      - name: layers_cascading_side_effects_multi_hop_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.RecordSeries.ACTIVE_to_SUSPENDED
          - state_machines.ConfidentialityScreening.OPEN_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / legal_hold_activation_three_hop_suspension_cascade
          rationale: "That instance already verifies the deepest chain end-to-end (hold -> series -> requests -> screenings) with the untouched-sibling controls, and its two siblings cover the migration and deaccession chains plus ordering sensitivity, so a fourth end-to-end walk here would be pure repetition."

      - name: layers_dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.appraisal_score.variants
          - calculations.confidentiality_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / appraisal_score_screening_vs_final_diverge_on_one_appraisal
          rationale: "Both dual-variant families are already pinned in §1.8 - that instance for appraisal_score and dual_variant_calc / confidentiality_risk_prelim_vs_post_screen_diverge_on_one_request for the risk score - each asserting both variant values and the delta on the same row, which is exactly what this layer claim would assert."

  # ==========================================================================
  # §1.9 Section 9 — Consistency model (immediate)
  # ==========================================================================
  - section: consistency model
    instances:

      - name: consistency_migration_approve_reflects_plan_ledger_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.MigrationJob.PENDING_APPROVAL_to_APPROVED
          - calculations.preservation_budget_conservation
        distinguishing_aspect: "consistency_model is immediate, so the ledger write that approval performs is visible without any settling step: the approve response already shows the job APPROVED, and a read of the parent plan issued immediately afterwards reports budget_committed_cents 10500 with budget_spent_cents still 0 - no lag, no background reconciliation."
        setup_notes: "PAPER at 900 x 10 units gives subtotal 9000 (no volume discount), handling 1500 and no condition surcharge, so committed_cost_cents is exactly 10500."
        test_recipe:
          setup:
            - "ACTIVE plan with budget_cents 500000 and one PENDING_APPROVAL job costing 10500."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "CM-01", retention_years: 64, disposition_action: "REVIEW", legal_citation: "Corp Policy 9.1", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Safety Inspection Records", business_unit: "Operations", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 13, earliest_record_year: 1985, latest_record_year: 2011 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-CM01", temperature_c: 15.0, relative_humidity_pct: 42.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Operations", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 10 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "INSPECTIONS-1985-2011", unit_count: 10, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Inspection records from plant operations.", transfer_instrument_reference: "IT-2026-2933" }
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /preservation-plans"
              payload: { storage_zone_id: "${zone_id}", plan_name: "Inspection Record Digitisation", budget_cents: 500000 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { plan_id: $.data.id, committed_before: $.data.budget_committed_cents }
            - call: "POST /preservation-plans/${plan_id}/activate"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${item_id}", target_format: "PRESERVATION_TIFF", units: 10, window_start: "2026-09-02T00:00:00Z", window_end: "2026-09-12T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { job_id: $.data.id, cost: $.data.committed_cost_cents }
          trigger:
            - call: "POST /migration-jobs/${job_id}/approve"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
              captures: { job_status: $.data.status, approved_by: $.data.approved_by }
          assert:
            - "HTTP status is 200"
            - "${committed_before} == 0"
            - "${cost} == 10500"
            - "${job_status} == APPROVED"
            - "${approved_by} == \"preserv-b\""
            - "PreservationPlan.${plan_id}.budget_committed_cents == 10500"
            - "PreservationPlan.${plan_id}.budget_spent_cents == 0"
            - "PreservationPlan.${plan_id}.status == ACTIVE"
            - "GET /preservation-plans/${plan_id} issued immediately after the trigger returns budget_committed_cents 10500"
