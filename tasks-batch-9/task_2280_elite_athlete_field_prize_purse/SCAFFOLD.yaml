# =============================================================================
# task_2280 — Elite Athlete Field & Prize Purse Administration
# Scaffold seed tables §1.0–§1.7 (single source of truth for PRD / tests / impl)
# =============================================================================

scenario: |
  2280. Elite Athlete Field & Prize Purse Administration (major marathon organizing committee): elite recruitment with agent negotiation on appearance fees, travel and accommodation terms, qualifying standards for elite, sub-elite and wheelchair divisions with time verification, prize purse structure across overall, division, masters and time bonuses with tie handling, pacing arrangements and rules on assistance with disqualification criteria, anti-doping testing coordination with the sanctioning body and athlete availability requirements, elite athlete services including fluid stations, transport and bib assignment, results certification, course record verification and record ratification submission, prize payment with tax withholding for foreign athletes

domain_name: elite-field-purse-admin
api_prefix: ""   # flat top-level collections: /race-editions, /invitations, /prize-awards, ...

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by FK fields carried in request bodies; no nested creation
  # paths. Reverse navigation is provided by sub-resource GET lists on the three
  # hub entities (RaceEdition, Athlete, Invitation) plus filtered list endpoints.

  state_machine_shape: parallel
  # Invitation is cyclic (OFFERED -> COUNTERED -> OFFERED negotiation rounds);
  # RaceResult carries two independent state dimensions (certification_status x
  # record_claim_status) that evolve separately and couple on disqualification;
  # RaceEdition is a linear posture pipeline gating all child operations.

  relationship_patterns:
    - one_to_many          # RaceEdition -> PurseLine / DivisionStandard / Invitation / RaceResult
    - cross_aggregate      # PrizeAward -> RaceResult -> Invitation -> Athlete/RepAgent
    - polymorphic_config   # PurseLine.category selects which place/threshold field is meaningful

  role_model: segregation_of_duties
  # Committee side (ElitesDirector) and athlete side (AthleteAgent) alternate on the
  # negotiation cycle and may never act for each other; prize approval and prize
  # payment must be performed by two different FinanceOfficer user ids.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: RaceEdition
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Marathon edition name" }
      - { name: city, type: string, source: input, description: "Host city" }
      - { name: race_date, type: string, source: input, description: "Race day as ISO 8601 date (YYYY-MM-DD); all windows are measured against 00:00:00Z of this date" }
      - { name: status, type: enum, source: system, description: "PLANNING | FIELD_OPEN | FIELD_LOCKED | RACED | RESULTS_CERTIFIED | PURSE_SETTLED", default: PLANNING, constraints: "set only by §1.2 RaceEdition transitions" }
      - { name: appearance_budget_cents, type: integer, source: input, description: "Total guaranteed appearance/travel/hotel budget in cents", constraints: ">= 0" }
      - { name: appearance_committed_cents, type: integer, source: computed, description: "Read-only: SUM(Invitation.guaranteed_commitment_cents) over invitations of this edition WHERE Invitation.status == ACCEPTED" }
      - { name: appearance_uncommitted_cents, type: integer, source: computed, description: "Read-only: appearance_budget_cents - appearance_committed_cents" }
      - { name: total_purse_cents, type: integer, source: input, description: "Total prize purse in cents (place prizes + bonuses)", constraints: ">= 0" }
      - { name: purse_allocated_cents, type: integer, source: computed, description: "Read-only: SUM(PrizeAward.gross_amount_cents) over awards of this edition WHERE PrizeAward.status IN {COMPUTED, APPROVED, PAID, CLAWBACK_PENDING}" }
      - { name: purse_unallocated_cents, type: integer, source: computed, description: "Read-only: total_purse_cents - purse_allocated_cents" }
      - { name: bonus_pool_cap_cents, type: integer, source: input, description: "Maximum aggregate TIME_BONUS + RECORD_BONUS payable for this edition", constraints: ">= 0" }
      - { name: bonus_pool_consumed_cents, type: integer, source: computed, description: "Read-only: SUM(PrizeAward.gross_amount_cents) WHERE category IN {TIME_BONUS, RECORD_BONUS} AND status IN {COMPUTED, APPROVED, PAID, CLAWBACK_PENDING}" }
      - { name: course_record_male_seconds, type: integer, source: input, description: "Ratified open male course record in whole seconds; null means no record on file", default: null }
      - { name: course_record_female_seconds, type: integer, source: input, description: "Ratified open female course record in whole seconds; null means no record on file", default: null }
      - { name: course_record_wheelchair_male_seconds, type: integer, source: input, description: "Ratified wheelchair male course record in whole seconds", default: null }
      - { name: course_record_wheelchair_female_seconds, type: integer, source: input, description: "Ratified wheelchair female course record in whole seconds", default: null }
      - { name: offer_response_days, type: integer, source: input, description: "Days an offer stays open; response_deadline_at = offer/round timestamp + this many days", default: 14, constraints: "1..60" }
      - { name: max_negotiation_rounds, type: integer, source: input, description: "Maximum rounds per side; total NegotiationRound rows per invitation may not exceed 2 * max_negotiation_rounds", default: 3, constraints: "1..6" }
      - { name: masters_min_age, type: integer, source: input, description: "Minimum age in full years on race_date for masters eligibility", default: 40, constraints: "35..60" }
      - { name: expired_offer_count, type: integer, source: system, description: "Count of invitations auto-expired by run-ops sweeps", default: 0 }

  - name: PurseLine
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; the edition this purse line belongs to" }
      - { name: category, type: enum, source: input, description: "OVERALL | DIVISION | MASTERS | TIME_BONUS | RECORD_BONUS" }
      - { name: division, type: enum, source: input, description: "ELITE | SUB_ELITE | WHEELCHAIR; required for DIVISION, TIME_BONUS and RECORD_BONUS lines, must be null for OVERALL and MASTERS lines", default: null }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: place, type: integer, source: input, description: "Finishing place this line pays; required for OVERALL, DIVISION, MASTERS and must be null for TIME_BONUS / RECORD_BONUS", default: null, constraints: "1..20" }
      - { name: threshold_seconds, type: integer, source: input, description: "Time bonus qualifying threshold in whole seconds; required for TIME_BONUS and must be null for every other category", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Amount paid by this line in cents", constraints: "> 0" }

  - name: DivisionStandard
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; the edition this standard configures" }
      - { name: division, type: enum, source: input, description: "ELITE | SUB_ELITE | WHEELCHAIR" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: max_qualifying_seconds, type: integer, source: input, description: "Slowest verified time that still qualifies for this division (inclusive upper bound)", constraints: "> 0" }
      - { name: window_months, type: integer, source: input, description: "Qualifying performance must fall inside [race_date - window_months, race_date] inclusive", default: 24, constraints: "1..60" }
      - { name: requires_chip_timing, type: boolean, source: input, description: "When true the qualifying PerformanceRecord must have chip_timed == true", default: true }
      - { name: bib_range_start, type: integer, source: input, description: "First bib number of this division's bib pool (inclusive)", constraints: "1..9999" }
      - { name: bib_range_end, type: integer, source: input, description: "Last bib number of this division's bib pool (inclusive); must be >= bib_range_start" }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Athlete full name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-3 nationality code" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: birth_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) used for masters age determination" }
      - { name: tax_residency_country, type: string, source: input, description: "ISO 3166-1 alpha-3 tax residency; defaults to country_code when omitted", default: null }
      - { name: w8ben_on_file, type: boolean, source: input, description: "True when a valid treaty certification form is on file; selects the PER_AWARD withholding variant", default: false }
      - { name: treaty_withholding_bps, type: integer, source: input, description: "Treaty withholding rate in basis points, applied only when w8ben_on_file is true", default: 0, constraints: "0..3000" }
      - { name: whereabouts_filed, type: boolean, source: input, description: "True when the athlete has filed anti-doping whereabouts / availability information", default: false }
      - { name: missed_test_count, type: integer, source: system, description: "Count of DopingTest rows for this athlete that reached MISSED", default: 0 }

  - name: RepAgent
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Representation agency name" }
      - { name: license_code, type: string, source: input, description: "Agent licence code; unique across RepAgent rows" }
      - { name: commission_bps, type: integer, source: input, description: "Agent commission in basis points, recorded for reporting only", default: 1500, constraints: "0..3000" }
      - { name: status, type: enum, source: input, description: "ACTIVE | SUSPENDED; a SUSPENDED agent may not negotiate or respond", default: ACTIVE }

  - name: PerformanceRecord
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; athlete who ran this performance" }
      - { name: race_name, type: string, source: input, description: "Race where the performance was set" }
      - { name: performance_date, type: string, source: input, description: "ISO 8601 date of the performance" }
      - { name: performance_seconds, type: integer, source: input, description: "Claimed finishing time in whole seconds", constraints: "> 0" }
      - { name: division, type: enum, source: input, description: "ELITE | SUB_ELITE | WHEELCHAIR — the division this performance is claimed against" }
      - { name: chip_timed, type: boolean, source: input, description: "True when the performance was chip timed on a certified course", default: false }
      - { name: sanctioning_ref, type: string, source: input, description: "Sanctioning body result reference used during verification" }
      - { name: verification_status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED", default: SUBMITTED }
      - { name: verified_seconds, type: integer, source: system, description: "Official time in whole seconds established by verification; may differ from performance_seconds and is the only value used for qualifying comparisons", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded when verification_status is REJECTED", default: null }

  - name: Invitation
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; edition the athlete is being recruited for" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; invited athlete" }
      - { name: agent_id, type: string, source: input, description: "FK -> RepAgent.id; agent representing the athlete for this invitation" }
      - { name: qualifying_performance_id, type: string, source: input, description: "FK -> PerformanceRecord.id; the verified performance pinned at offer time as the qualifying proof" }
      - { name: division, type: enum, source: input, description: "ELITE | SUB_ELITE | WHEELCHAIR" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN | EXPIRED | BREACHED", default: DRAFT }
      - { name: current_appearance_fee_cents, type: integer, source: system, description: "Appearance fee of the most recent NegotiationRound; null while DRAFT", default: null }
      - { name: current_air_class, type: enum, source: system, description: "ECONOMY | PREMIUM_ECONOMY | BUSINESS — air class of the most recent NegotiationRound", default: null }
      - { name: current_hotel_nights, type: integer, source: system, description: "Hotel nights of the most recent NegotiationRound", default: null }
      - { name: current_ground_transport, type: boolean, source: system, description: "Ground transport flag of the most recent NegotiationRound", default: null }
      - { name: round_count, type: integer, source: computed, description: "Read-only: COUNT(NegotiationRound WHERE invitation_id == this.id)", default: 0 }
      - { name: offer_sent_at, type: datetime, source: system, description: "Logical-clock timestamp when the first offer was sent", default: null }
      - { name: response_deadline_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent round + RaceEdition.offer_response_days days", default: null }
      - { name: guaranteed_commitment_cents, type: integer, source: computed, description: "Read-only: calculations.invitation_package_valuation variant `guaranteed`, frozen at ACCEPT; 0 in every other status", default: 0 }
      - { name: full_exposure_cents, type: integer, source: computed, description: "Read-only: calculations.invitation_package_valuation variant `full_exposure`, stamped on ACCEPTED invitations by the FIELD_OPEN -> FIELD_LOCKED transition", default: 0 }
      - { name: bib_number, type: integer, source: computed, description: "Bib selected by calculations.bib_assignment_selector; null until assign-bib, reset to null when the invitation leaves ACCEPTED", default: null }
      - { name: negotiated_by_user_id, type: string, source: system, description: "X-User-ID of the ElitesDirector who sent the first offer (opaque operator id, not an entity id)", default: null }

  - name: NegotiationRound
    parent: Invitation
    common_fields: false
    fields:
      - { name: invitation_id, type: string, source: input, description: "FK -> Invitation.id; invitation this round belongs to" }
      - { name: round_number, type: integer, source: system, description: "1-based sequence number within the invitation, assigned as Invitation.round_count + 1" }
      - { name: side, type: enum, source: system, description: "COMMITTEE | AGENT — derived from X-User-Role (ElitesDirector => COMMITTEE, AthleteAgent => AGENT)" }
      - { name: appearance_fee_cents, type: integer, source: input, description: "Appearance fee proposed by this round in cents", constraints: ">= 0" }
      - { name: air_class, type: enum, source: input, description: "ECONOMY | PREMIUM_ECONOMY | BUSINESS" }
      - { name: hotel_nights, type: integer, source: input, description: "Hotel nights proposed by this round", constraints: "0..14" }
      - { name: ground_transport, type: boolean, source: input, description: "Whether airport/ground transport is included" }
      - { name: note, type: string, source: input, description: "Free-text negotiation note", default: null }

  - name: PacerAssignment
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; edition being paced" }
      - { name: pacer_license_code, type: string, source: input, description: "Licence code identifying the pacer; the resource key for pacing-range occupation" }
      - { name: pacer_name, type: string, source: input, description: "Pacer display name" }
      - { name: target_pace_seconds_per_km, type: integer, source: input, description: "Target pace in whole seconds per kilometre", constraints: "120..400" }
      - { name: start_km, type: number, source: input, description: "Inclusive start of the paced range in km", constraints: ">= 0" }
      - { name: end_km, type: number, source: input, description: "Exclusive end of the paced range in km; ranges are half-open [start_km, end_km)", constraints: "> start_km (the 32.0 km pacing ceiling is enforced by ERR_PACING_BEYOND_LIMIT, not by schema validation)" }
      - { name: assistance_rule, type: enum, source: input, description: "LEAD_ONLY | FLUIDS_ALLOWED — whether the pacer may hand fluids to the athlete", default: LEAD_ONLY }

  - name: FluidStationSlot
    parent: Invitation
    common_fields: true
    fields:
      - { name: invitation_id, type: string, source: input, description: "FK -> Invitation.id; the accepted invitation these bottles belong to" }
      - { name: station_km, type: number, source: input, description: "Station distance in km; must be one of calculations.fluid_slot_occupancy constant ALLOWED_STATION_KM" }
      - { name: table_position, type: integer, source: input, description: "First table position occupied at this station", constraints: "1..40" }
      - { name: bottle_count, type: integer, source: input, description: "Number of adjacent positions occupied", constraints: "1..3" }
      - { name: occupied_from, type: integer, source: computed, description: "Read-only: table_position" }
      - { name: occupied_to, type: integer, source: computed, description: "Read-only: table_position + bottle_count - 1" }
      - { name: status, type: enum, source: system, description: "RESERVED | RELEASED; set to RELEASED when the owning invitation leaves ACCEPTED", default: RESERVED }

  - name: DopingTest
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; athlete under test" }
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; edition whose testing programme owns this test" }
      - { name: test_type, type: enum, source: input, description: "IN_COMPETITION | OUT_OF_COMPETITION" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the athlete availability window" }
      - { name: window_end_at, type: datetime, source: input, description: "Inclusive end of the athlete availability window; must be > window_start_at" }
      - { name: sample_code, type: string, source: input, description: "Sample code agreed with the sanctioning body; unique across DopingTest rows" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COLLECTED | CLEARED | ADVERSE | MISSED", default: SCHEDULED }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock timestamp of collection", default: null }
      - { name: collected_sample_ref, type: string, source: system, description: "Chain-of-custody reference recorded at collection", default: null }
      - { name: outcome_notes, type: string, source: system, description: "Sanctioning body note recorded on adjudication", default: null }

  - name: RaceResult
    parent: RaceEdition
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: input, description: "FK -> RaceEdition.id; edition raced" }
      - { name: invitation_id, type: string, source: input, description: "FK -> Invitation.id; the ACCEPTED, bibbed invitation this finisher ran under" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; copied from Invitation.athlete_id at creation" }
      - { name: division, type: enum, source: system, description: "ELITE | SUB_ELITE | WHEELCHAIR; copied from Invitation.division at creation" }
      - { name: gun_seconds, type: integer, source: input, description: "Gun-to-finish time in whole seconds", constraints: "> 0" }
      - { name: net_seconds, type: integer, source: input, description: "Chip (net) time in whole seconds; must be <= gun_seconds", constraints: "> 0" }
      - { name: official_seconds, type: integer, source: computed, description: "Read-only: gun_seconds when division IN {ELITE, SUB_ELITE}; net_seconds when division == WHEELCHAIR" }
      - { name: certification_status, type: enum, source: system, description: "PROVISIONAL | CERTIFIED | DISQUALIFIED — dimension 1 of the parallel state machine", default: PROVISIONAL }
      - { name: record_claim_status, type: enum, source: system, description: "NONE | CLAIMED | SUBMITTED | RATIFIED | REJECTED — dimension 2 of the parallel state machine", default: NONE }
      - { name: dq_reason, type: enum, source: system, description: "PACER_BEYOND_RANGE | UNAUTHORIZED_FLUID_HANDOFF | COURSE_CUTTING | ADVERSE_ANALYTICAL_FINDING | MISSED_TEST_THRESHOLD", default: null }
      - { name: place_overall, type: integer, source: computed, description: "Read-only: standard-competition place within (race_edition_id, gender) over CERTIFIED results whose division IN {ELITE, SUB_ELITE}; null for WHEELCHAIR", default: null }
      - { name: place_division, type: integer, source: computed, description: "Read-only: standard-competition place within (race_edition_id, division, gender) over CERTIFIED results", default: null }
      - { name: place_masters, type: integer, source: computed, description: "Read-only: standard-competition place within (race_edition_id, gender) over CERTIFIED results with division == ELITE and is_masters == true; null otherwise", default: null }
      - { name: tie_group_size, type: integer, source: computed, description: "Read-only: count of CERTIFIED results sharing this result's official_seconds inside its place_overall partition (or place_division partition for WHEELCHAIR)", default: 1 }
      - { name: is_masters, type: boolean, source: computed, description: "Read-only: full years from Athlete.birth_date to RaceEdition.race_date >= RaceEdition.masters_min_age", default: false }
      - { name: sanctioning_submission_ref, type: string, source: system, description: "Reference of the record ratification package submitted to the sanctioning body", default: null }

  - name: PrizeAward
    parent: RaceResult
    common_fields: true
    fields:
      - { name: race_edition_id, type: string, source: system, description: "FK -> RaceEdition.id; edition whose purse funds this award" }
      - { name: race_result_id, type: string, source: system, description: "FK -> RaceResult.id; result this award pays" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; payee athlete" }
      - { name: category, type: enum, source: system, description: "OVERALL | DIVISION | MASTERS | TIME_BONUS | RECORD_BONUS" }
      - { name: place, type: integer, source: system, description: "Place paid by this award; null for TIME_BONUS and RECORD_BONUS", default: null }
      - { name: tie_share_count, type: integer, source: system, description: "Number of athletes the pooled place amount was divided between (1 when there was no tie)", default: 1 }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Read-only: output of calculations.prize_award_generation / bonus_determination" }
      - { name: withholding_variant, type: enum, source: computed, description: "NONE | PER_AWARD | AGGREGATED — variant of calculations.withholding_computation applied" }
      - { name: withholding_bps, type: integer, source: computed, description: "Read-only: effective withholding rate in basis points applied to this award" }
      - { name: withholding_cents, type: integer, source: computed, description: "Read-only: amount withheld on this award in cents" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Read-only: gross_amount_cents - withholding_cents" }
      - { name: status, type: enum, source: system, description: "COMPUTED | APPROVED | PAID | VOID | CLAWBACK_PENDING", default: COMPUTED }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the FinanceOfficer who approved (not an entity id)", default: null }
      - { name: paid_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the FinanceOfficer who paid (not an entity id)", default: null }
      - { name: payment_reference, type: string, source: system, description: "Bank/treasury reference recorded at payment", default: null }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: RaceEdition
    initial_state: PLANNING
    terminal_states: [PURSE_SETTLED]
    transitions:
      - from: PLANNING
        to: FIELD_OPEN
        trigger: "POST /race-editions/{id}/open-field"
        actor: ElitesDirector
        preconditions:
          - "at least one DivisionStandard exists with race_edition_id == this edition"
          - "at least one PurseLine exists with race_edition_id == this edition AND category == OVERALL"
        side_effects:
          - "status = FIELD_OPEN; recruitment endpoints (invitations, offers, rounds, respond) become available"
        note: "Configuration is frozen for reads only; further PurseLine / DivisionStandard creation is rejected once status != PLANNING."

      - from: FIELD_OPEN
        to: FIELD_LOCKED
        trigger: "POST /race-editions/{id}/lock-field"
        actor: ElitesDirector
        preconditions:
          - "at least one Invitation with status == ACCEPTED exists for this edition"
          - "SUM over ACCEPTED invitations of calculations.invitation_package_valuation variant `full_exposure` <= appearance_budget_cents + bonus_pool_cap_cents"
        side_effects:
          - "for every Invitation with status == ACCEPTED (ascending created_at): full_exposure_cents = variant `full_exposure` value; invitation.version += 1"
          - "for every Invitation with status IN {DRAFT, OFFERED, COUNTERED} (ascending created_at): status = EXPIRED, response_deadline_at unchanged, expired_offer_count += 1"
          - "status = FIELD_LOCKED"

      - from: FIELD_LOCKED
        to: RACED
        trigger: "POST /race-editions/{id}/mark-raced"
        actor: TechnicalOfficial
        preconditions:
          - "logical clock >= race_date at 00:00:00Z"
        side_effects:
          - "status = RACED; RaceResult creation becomes available"

      - from: RACED
        to: RESULTS_CERTIFIED
        trigger: "POST /race-editions/{id}/certify-results"
        actor: TechnicalOfficial
        preconditions:
          - "no RaceResult of this edition has certification_status == PROVISIONAL"
          - "at least one RaceResult of this edition has certification_status == CERTIFIED"
        side_effects:
          - "runs calculations.place_and_tie_assignment: writes official_seconds-derived place_overall, place_division, place_masters, tie_group_size, is_masters on every CERTIFIED result"
          - "for every CERTIFIED result with division != SUB_ELITE whose official_seconds < the edition course record for its (division-class, gender) key (or whose key record is null): record_claim_status NONE -> CLAIMED"
          - "status = RESULTS_CERTIFIED; compute-awards becomes available"

      - from: RESULTS_CERTIFIED
        to: PURSE_SETTLED
        trigger: "POST /race-editions/{id}/settle-purse"
        actor: FinanceOfficer
        preconditions:
          - "every PrizeAward of this edition has status IN {PAID, VOID, CLAWBACK_PENDING}"
          - "no RaceResult of this edition has record_claim_status == SUBMITTED"
        side_effects:
          - "purse_allocated_cents and purse_unallocated_cents recomputed; status = PURSE_SETTLED (terminal, all mutations rejected afterwards)"

  - entity: Invitation
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN, EXPIRED, BREACHED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /invitations/{id}/offer"
        actor: ElitesDirector
        preconditions:
          - "RaceEdition.status == FIELD_OPEN"
          - "RepAgent.status == ACTIVE for agent_id"
          - "calculations.qualifying_eligibility passes for (qualifying_performance_id, division, athlete)"
        side_effects:
          - "creates NegotiationRound(side = COMMITTEE, round_number = 1) with the posted terms"
          - "current_appearance_fee_cents / current_air_class / current_hotel_nights / current_ground_transport = posted terms"
          - "offer_sent_at = logical clock; response_deadline_at = logical clock + RaceEdition.offer_response_days days"
          - "negotiated_by_user_id = X-User-ID; status = OFFERED"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /invitations/{id}/negotiation-rounds (X-User-Role: AthleteAgent)"
        actor: AthleteAgent
        preconditions:
          - "RaceEdition.status == FIELD_OPEN"
          - "X-User-ID == Invitation.agent_id and RepAgent.status == ACTIVE"
          - "logical clock <= response_deadline_at"
          - "round_count < 2 * RaceEdition.max_negotiation_rounds"
          - "expected_invitation_version == Invitation.version (concurrency_rules.negotiation-round-stale-invitation)"
        side_effects:
          - "creates NegotiationRound(side = AGENT, round_number = round_count + 1); current_* terms replaced by the counter terms"
          - "response_deadline_at = logical clock + RaceEdition.offer_response_days days; Invitation.version += 1"
          - "status = COUNTERED"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /invitations/{id}/negotiation-rounds (X-User-Role: ElitesDirector)"
        actor: ElitesDirector
        preconditions:
          - "RaceEdition.status == FIELD_OPEN"
          - "logical clock <= response_deadline_at"
          - "round_count < 2 * RaceEdition.max_negotiation_rounds"
          - "expected_invitation_version == Invitation.version"
        side_effects:
          - "creates NegotiationRound(side = COMMITTEE, round_number = round_count + 1); current_* terms replaced by the revised terms"
          - "response_deadline_at = logical clock + RaceEdition.offer_response_days days; Invitation.version += 1"
          - "status = OFFERED — the cycle OFFERED -> COUNTERED -> OFFERED may repeat until the round cap is reached"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /invitations/{id}/respond {decision: ACCEPT}"
        actor: AthleteAgent
        preconditions:
          - "RaceEdition.status == FIELD_OPEN"
          - "X-User-ID == Invitation.agent_id and RepAgent.status == ACTIVE"
          - "logical clock <= response_deadline_at"
          - "RaceEdition.appearance_uncommitted_cents >= calculations.invitation_package_valuation variant `guaranteed` for the current terms"
        side_effects:
          - "guaranteed_commitment_cents = variant `guaranteed` value; status = ACCEPTED"
          - "RaceEdition.appearance_committed_cents += guaranteed_commitment_cents; appearance_uncommitted_cents recomputed; RaceEdition.version += 1"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /invitations/{id}/respond {decision: ACCEPT}"
        actor: ElitesDirector
        preconditions:
          - "same preconditions as OFFERED -> ACCEPTED except the actor is the committee (validations priority 8 pins which role may respond from which state)"
        side_effects:
          - "identical to OFFERED -> ACCEPTED"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /invitations/{id}/respond {decision: DECLINE}"
        actor: AthleteAgent
        preconditions: ["logical clock <= response_deadline_at", "X-User-ID == Invitation.agent_id"]
        side_effects: ["status = DECLINED (terminal); no budget movement"]

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /invitations/{id}/respond {decision: DECLINE}"
        actor: ElitesDirector
        preconditions: ["logical clock <= response_deadline_at"]
        side_effects: ["status = DECLINED (terminal); no budget movement"]

      - from: OFFERED
        to: EXPIRED
        trigger: "system: POST /race-editions/{id}/run-ops sweep step 1"
        actor: system
        preconditions: ["logical clock > response_deadline_at"]
        side_effects: ["status = EXPIRED; RaceEdition.expired_offer_count += 1"]

      - from: COUNTERED
        to: EXPIRED
        trigger: "system: POST /race-editions/{id}/run-ops sweep step 1"
        actor: system
        preconditions: ["logical clock > response_deadline_at"]
        side_effects: ["status = EXPIRED; RaceEdition.expired_offer_count += 1"]

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /invitations/{id}/withdraw"
        actor: ElitesDirector
        preconditions:
          - "RaceEdition.status IN {FIELD_OPEN, FIELD_LOCKED}"
          - "no RaceResult exists with invitation_id == this invitation"
        side_effects:
          - "RaceEdition.appearance_committed_cents -= guaranteed_commitment_cents; guaranteed_commitment_cents = 0; RaceEdition.version += 1 (compensating action for INV-1)"
          - "bib_number = null (the bib returns to its division pool)"
          - "every FluidStationSlot with invitation_id == this invitation: status RESERVED -> RELEASED"
          - "status = WITHDRAWN"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /invitations/{id}/withdraw"
        actor: ElitesDirector
        preconditions: ["RaceEdition.status IN {FIELD_OPEN, FIELD_LOCKED}"]
        side_effects: ["status = WITHDRAWN; no budget movement (guaranteed_commitment_cents was already 0)"]

      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /invitations/{id}/withdraw"
        actor: ElitesDirector
        preconditions: ["RaceEdition.status IN {FIELD_OPEN, FIELD_LOCKED}"]
        side_effects: ["status = WITHDRAWN; no budget movement"]

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /invitations/{id}/withdraw"
        actor: ElitesDirector
        preconditions: ["RaceEdition.status IN {FIELD_OPEN, FIELD_LOCKED}"]
        side_effects: ["status = WITHDRAWN; no budget movement"]

      - from: ACCEPTED
        to: BREACHED
        trigger: "system: cascade hop 2 of the disqualification chain (RaceResult -> DISQUALIFIED with a breach dq_reason)"
        actor: system
        preconditions:
          - "the RaceResult referencing this invitation reached certification_status == DISQUALIFIED with dq_reason IN {PACER_BEYOND_RANGE, UNAUTHORIZED_FLUID_HANDOFF, COURSE_CUTTING, ADVERSE_ANALYTICAL_FINDING}"
        side_effects:
          - "status = BREACHED; because the invitation became BREACHED, RaceEdition.appearance_committed_cents -= guaranteed_commitment_cents and guaranteed_commitment_cents = 0 (cascade hop 3)"
          - "bib_number = null; every FluidStationSlot of this invitation: status -> RELEASED"

  - entity: PerformanceRecord
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /performance-records/{id}/verification {decision: VERIFIED, official_seconds: N}"
        actor: TechnicalOfficial
        preconditions: ["official_seconds is present and > 0"]
        side_effects: ["verified_seconds = official_seconds; verification_status = VERIFIED (the claimed performance_seconds is never used for qualifying comparisons)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /performance-records/{id}/verification {decision: REJECTED, rejection_reason: text}"
        actor: TechnicalOfficial
        preconditions: ["rejection_reason is present"]
        side_effects: ["rejection_reason stored; verification_status = REJECTED; the record can never qualify an invitation"]

  - entity: DopingTest
    initial_state: SCHEDULED
    terminal_states: [CLEARED, ADVERSE, MISSED]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /doping-tests/{id}/collect"
        actor: AntiDopingLiaison
        preconditions: ["window_start_at <= logical clock <= window_end_at"]
        side_effects: ["collected_at = logical clock; collected_sample_ref stored; status = COLLECTED"]
      - from: COLLECTED
        to: CLEARED
        trigger: "POST /doping-tests/{id}/adjudicate {outcome: CLEARED}"
        actor: SanctioningBody
        preconditions: ["status == COLLECTED"]
        side_effects: ["status = CLEARED; the athlete becomes eligible for prize approval when test_type == IN_COMPETITION"]
      - from: COLLECTED
        to: ADVERSE
        trigger: "POST /doping-tests/{id}/adjudicate {outcome: ADVERSE}"
        actor: SanctioningBody
        preconditions: ["status == COLLECTED"]
        side_effects:
          - "status = ADVERSE (cascade hop 1)"
          - "because the test is ADVERSE, every RaceResult of the same (athlete_id, race_edition_id) with certification_status IN {PROVISIONAL, CERTIFIED} moves to DISQUALIFIED with dq_reason = ADVERSE_ANALYTICAL_FINDING (cascade hop 2)"
          - "because that result is DISQUALIFIED, its record_claim_status IN {CLAIMED, SUBMITTED} moves to REJECTED and its PrizeAwards cascade per the RaceResult DISQUALIFIED side effects (cascade hops 3 and 4)"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: POST /race-editions/{id}/run-ops sweep step 2"
        actor: system
        preconditions: ["logical clock > window_end_at"]
        side_effects: ["status = MISSED; Athlete.missed_test_count += 1; Athlete.version += 1"]

  - entity: RaceResult
    initial_state: PROVISIONAL
    terminal_states: [DISQUALIFIED]
    transitions:
      # ---- dimension 1: certification_status --------------------------------
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /race-results/{id}/certify"
        actor: TechnicalOfficial
        preconditions:
          - "RaceEdition.status == RACED (cross-entity gate)"
          - "certification_status == PROVISIONAL"
        side_effects: ["certification_status = CERTIFIED; places remain null until the edition certify-results transition runs calculations.place_and_tie_assignment"]
      - from: PROVISIONAL
        to: DISQUALIFIED
        trigger: "POST /race-results/{id}/disqualify {dq_reason}"
        actor: TechnicalOfficial
        preconditions: ["RaceEdition.status IN {RACED, RESULTS_CERTIFIED}"]
        side_effects: ["certification_status = DISQUALIFIED; dq_reason stored; the result is excluded from every calculation input set"]
      - from: CERTIFIED
        to: DISQUALIFIED
        trigger: "POST /race-results/{id}/disqualify {dq_reason} — or system cascade hop 2 from DopingTest ADVERSE"
        actor: TechnicalOfficial | system
        preconditions: ["RaceEdition.status IN {RACED, RESULTS_CERTIFIED}"]
        side_effects:
          - "certification_status = DISQUALIFIED; dq_reason stored; place_overall / place_division / place_masters = null; tie_group_size = 1"
          - "because the result is DISQUALIFIED, record_claim_status IN {CLAIMED, SUBMITTED} -> REJECTED (cross-dimension coupling)"
          - "because the result is DISQUALIFIED, each of its PrizeAwards with status IN {COMPUTED, APPROVED} -> VOID and each with status == PAID -> CLAWBACK_PENDING"
          - "because those awards changed status, RaceEdition.purse_allocated_cents / purse_unallocated_cents / bonus_pool_consumed_cents are recomputed and RaceEdition.version += 1 (VOID leaves the purse, CLAWBACK_PENDING stays inside purse_allocated_cents)"
          - "when dq_reason IN {PACER_BEYOND_RANGE, UNAUTHORIZED_FLUID_HANDOFF, COURSE_CUTTING, ADVERSE_ANALYTICAL_FINDING}, the linked Invitation moves ACCEPTED -> BREACHED and its own side effects run"
          - "surviving results are NOT re-placed here; re-placement happens only on an explicit POST /race-editions/{id}/compute-awards recompute"
      # ---- dimension 2: record_claim_status ---------------------------------
      - from: CLAIMED
        to: SUBMITTED
        trigger: "POST /race-results/{id}/record-submission {sanctioning_submission_ref}"
        actor: TechnicalOfficial
        preconditions:
          - "certification_status == CERTIFIED"
          - "record_claim_status IN {CLAIMED, REJECTED}: NONE means no claim was ever raised and fails at priority 15 with ERR_RECORD_CLAIM_NOT_ELIGIBLE, while SUBMITTED / RATIFIED fail at priority 8 with ERR_INVALID_RECORD_CLAIM_STATE"
          - "division != SUB_ELITE"
        side_effects: ["sanctioning_submission_ref stored; record_claim_status = SUBMITTED; the edition can no longer settle its purse while any claim is SUBMITTED"]
      - from: SUBMITTED
        to: RATIFIED
        trigger: "POST /race-results/{id}/record-decision {decision: RATIFIED}"
        actor: SanctioningBody
        preconditions: ["record_claim_status == SUBMITTED", "certification_status == CERTIFIED"]
        side_effects:
          - "record_claim_status = RATIFIED (cascade hop 1)"
          - "because the claim is RATIFIED, the edition's course record field for this result's (division-class, gender) key = official_seconds and RaceEdition.version += 1 (cascade hop 2)"
          - "because the edition course record changed, every other CERTIFIED result of the edition with record_claim_status == CLAIMED whose official_seconds >= the new record value moves CLAIMED -> REJECTED (cascade hop 3)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /race-results/{id}/record-decision {decision: REJECTED}"
        actor: SanctioningBody
        preconditions: ["record_claim_status == SUBMITTED"]
        side_effects: ["record_claim_status = REJECTED; the course record is unchanged; a corrected package may be re-submitted (REJECTED -> SUBMITTED)"]
      - from: CLAIMED
        to: REJECTED
        trigger: "system: cascade hop 3 of the record ratification chain, or cross-dimension coupling from DISQUALIFIED"
        actor: system
        preconditions: ["record_claim_status == CLAIMED"]
        side_effects: ["record_claim_status = REJECTED"]

  - entity: PrizeAward
    initial_state: COMPUTED
    terminal_states: [VOID, CLAWBACK_PENDING]
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /prize-awards/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "RaceEdition.status == RESULTS_CERTIFIED"
          - "the linked RaceResult has certification_status == CERTIFIED"
          - "a DopingTest exists for (RaceResult.athlete_id, race_edition_id) with test_type == IN_COMPETITION AND status == CLEARED (cross-entity gate)"
        side_effects: ["approved_by_user_id = X-User-ID; status = APPROVED"]
      - from: APPROVED
        to: PAID
        trigger: "POST /prize-awards/{id}/pay {payment_reference}"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID != approved_by_user_id (segregation of duties)"
          - "status == APPROVED"
        side_effects: ["paid_by_user_id = X-User-ID; payment_reference stored; paid_at = logical clock; status = PAID (net_amount_cents is the amount disbursed, withholding_cents is remitted to the tax authority)"]
      - from: COMPUTED
        to: VOID
        trigger: "system: cascade from RaceResult DISQUALIFIED, or supersede by POST /race-editions/{id}/compute-awards recompute"
        actor: system
        preconditions: ["status == COMPUTED"]
        side_effects: ["status = VOID; the award leaves RaceEdition.purse_allocated_cents and its cents return to purse_unallocated_cents"]
      - from: APPROVED
        to: VOID
        trigger: "system: cascade from RaceResult DISQUALIFIED"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["status = VOID; the award leaves RaceEdition.purse_allocated_cents"]
      - from: PAID
        to: CLAWBACK_PENDING
        trigger: "system: cascade from RaceResult DISQUALIFIED"
        actor: system
        preconditions: ["status == PAID"]
        side_effects: ["status = CLAWBACK_PENDING (terminal); the money already left, so the award stays inside RaceEdition.purse_allocated_cents and purse_unallocated_cents does NOT increase"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: negotiation-round-stale-invitation
    parent_entity: Invitation
    write_endpoint: "POST /invitations/{id}/negotiation-rounds"
    occ_field: "expected_invitation_version"
    description: |
      Adding a negotiation round against an Invitation whose version has advanced
      since the client last observed it is rejected. A new round legitimately
      supersedes the previous terms (current_appearance_fee_cents and the travel
      terms are replaced), so a writer holding a stale version would otherwise
      overwrite terms it never saw.
    error_id: ERR_STALE_INVITATION_VERSION
    http_status: 412

  - rule_id: compute-awards-stale-edition
    parent_entity: RaceEdition
    write_endpoint: "POST /race-editions/{id}/compute-awards"
    occ_field: "expected_race_edition_version"
    description: |
      Recomputing the award set against a RaceEdition whose version has advanced
      since the client last observed it is rejected. A recompute legitimately
      supersedes the whole award set (prior COMPUTED awards are voided and
      regenerated), so a stale-version writer would silently discard awards
      generated from newer result data.
    error_id: ERR_STALE_EDITION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: invitation_package_valuation
    trigger: "variant `guaranteed` on POST /invitations/{id}/respond {decision: ACCEPT} (OFFERED|COUNTERED -> ACCEPTED); variant `full_exposure` on POST /race-editions/{id}/lock-field (FIELD_OPEN -> FIELD_LOCKED)"
    algorithm: weighted_scoring
    formula: |
      # inputs are the invitation's current_* terms (the most recent NegotiationRound)
      air_value      = AIR_CLASS_VALUE_CENTS[current_air_class]
      hotel_value    = HOTEL_NIGHTLY_CENTS * min(current_hotel_nights, MAX_HOTEL_NIGHTS)
      ground_value   = GROUND_TRANSPORT_CENTS if current_ground_transport else 0
      guaranteed     = current_appearance_fee_cents + air_value + hotel_value + ground_value

      # bonus exposure, evaluated against this edition's purse configuration
      time_exposure  = max( PurseLine.amount_cents
                            for PurseLine in edition
                            where category == TIME_BONUS
                              and division == invitation.division
                              and gender   == athlete.gender ,
                            default = 0 )
      qual_seconds   = PerformanceRecord(qualifying_performance_id).verified_seconds
      key_record     = edition course record for (record_class(invitation.division), athlete.gender)
      record_threat  = (key_record is null) or (qual_seconds <= key_record)
      record_expo    = RECORD_BONUS PurseLine.amount_cents for (invitation.division, athlete.gender) if record_threat else 0
      full_exposure  = guaranteed + time_exposure + record_expo
      # record_class(ELITE) = record_class(SUB_ELITE) = OPEN ; record_class(WHEELCHAIR) = WHEELCHAIR
    input_set: "The invitation's own current_* terms plus PurseLine rows of the same race_edition_id with status-free config semantics; only invitations with status == ACCEPTED are summed by the lock-field precondition."
    constants:
      AIR_CLASS_VALUE_CENTS: { ECONOMY: 120000, PREMIUM_ECONOMY: 260000, BUSINESS: 540000 }
      HOTEL_NIGHTLY_CENTS: 32000
      GROUND_TRANSPORT_CENTS: 18000
      MAX_HOTEL_NIGHTS: 7
    precision: "integer cents; min() applied to nights before multiplication (never after)"
    variants:
      - name: guaranteed
        when: "ACCEPT — the only value debited against RaceEdition.appearance_budget_cents and stored as Invitation.guaranteed_commitment_cents"
        difference: "Excludes every bonus exposure term; hotel nights above MAX_HOTEL_NIGHTS are dropped."
      - name: full_exposure
        when: "lock-field — the value stored as Invitation.full_exposure_cents and summed for the exposure ceiling check"
        difference: "Adds the largest matching TIME_BONUS line plus the RECORD_BONUS line when the pinned qualifying time is at or under the current course record, so it is strictly greater than `guaranteed` for any athlete with a matching bonus line."

  - name: withholding_computation
    trigger: "POST /race-editions/{id}/compute-awards, immediately after every PrizeAward gross amount is fixed"
    algorithm: tiered_pricing
    formula: |
      # per athlete, over that athlete's freshly generated awards in this edition
      if athlete.tax_residency_country == DOMESTIC_TAX_COUNTRY:
          variant = NONE ; withholding_bps = 0 ; withholding_cents = 0 for every award
      elif athlete.w8ben_on_file:
          variant = PER_AWARD ; rate = athlete.treaty_withholding_bps
          for each award a (ascending category_order, then created_at):
              withholding_cents(a) = 0 if a.gross_amount_cents < DE_MINIMIS_AWARD_CENTS
                                     else round_half_up(a.gross_amount_cents * rate / 10000)
      else:
          variant = AGGREGATED ; rate = STATUTORY_WITHHOLDING_BPS
          aggregate = SUM(a.gross_amount_cents for a in awards)
          if aggregate <= AGGREGATE_DE_MINIMIS_CENTS:
              withholding_cents = 0 for every award
          else:
              total = round_half_up(aggregate * rate / 10000)
              # largest-remainder allocation of `total` pro rata by gross
              exact(a)  = total * a.gross_amount_cents / aggregate
              floor(a)  = int(exact(a))            # truncate toward zero
              leftover  = total - SUM(floor(a))
              order awards by fractional part of exact(a) DESC,
                    then by PrizeAward.created_at ASC
              give +1 cent to the first `leftover` awards in that order
      net_amount_cents = gross_amount_cents - withholding_cents
      withholding_bps  = 0 when variant == NONE else rate
    input_set: "All PrizeAward rows created by this compute-awards run for the athlete (status COMPUTED). VOID awards from a previous run are excluded. category_order = OVERALL < DIVISION < MASTERS < TIME_BONUS < RECORD_BONUS."
    constants:
      DOMESTIC_TAX_COUNTRY: "USA"
      STATUTORY_WITHHOLDING_BPS: 3000
      DE_MINIMIS_AWARD_CENTS: 60000
      AGGREGATE_DE_MINIMIS_CENTS: 150000
    precision: "integer cents, round_half_up on the single rate multiplication; PER_AWARD rounds once per award, AGGREGATED rounds once on the aggregate and then splits by largest remainder"
    variants:
      - name: PER_AWARD
        when: "athlete.w8ben_on_file == true"
        difference: "Each award is tested against DE_MINIMIS_AWARD_CENTS on its own, so small awards escape withholding entirely and the rounding happens once per award."
      - name: AGGREGATED
        when: "athlete.w8ben_on_file == false"
        difference: "The de-minimis test runs on the athlete's aggregate gross and the rounding happens once on the aggregate, so a small award that PER_AWARD exempts is still withheld on — identical grosses at an identical rate produce a different total."

  - name: place_and_tie_assignment
    trigger: "POST /race-editions/{id}/certify-results (RACED -> RESULTS_CERTIFIED)"
    algorithm: chronological
    formula: |
      candidates = RaceResult where race_edition_id == E and certification_status == CERTIFIED
      # partitions
      overall_part(r)  = (E, r.athlete.gender)          for r.division in {ELITE, SUB_ELITE}
      division_part(r) = (E, r.division, r.athlete.gender)
      masters_part(r)  = (E, r.athlete.gender)          for r.division == ELITE and r.is_masters

      age_years(r) = race_date.year - birth_date.year
                     - (1 if (race_date.month, race_date.day) < (birth_date.month, birth_date.day) else 0)
      is_masters(r) = age_years(r) >= edition.masters_min_age        # birthday exactly on race day counts

      # standard competition ranking ("1224"): equal official_seconds share a place
      place(r, part) = 1 + count(x in part where x.official_seconds < r.official_seconds)
      place_overall  = place(r, overall_part)  if r.division in {ELITE, SUB_ELITE} else null
      place_division = place(r, division_part)
      place_masters  = place(r, masters_part)  if (r.division == ELITE and is_masters(r)) else null
      tie_group_size  = count(x in (overall_part if place_overall != null else division_part)
                              where x.official_seconds == r.official_seconds)
    input_set: "Only CERTIFIED results. PROVISIONAL cannot exist at this point (transition precondition) and DISQUALIFIED results are excluded, do not consume a place, and do not enlarge any tie group."
    constants: {}
    precision: "whole seconds; official_seconds is already an integer so ties are exact equality"
    variants: []

  - name: prize_award_generation
    trigger: "POST /race-editions/{id}/compute-awards while RaceEdition.status == RESULTS_CERTIFIED"
    algorithm: waterfall_allocation
    formula: |
      # STEP 0 — supersede: every existing PrizeAward of this edition with
      #          status == COMPUTED becomes VOID; APPROVED / PAID / CLAWBACK_PENDING
      #          awards are left untouched and their cents stay allocated.
      # STEP 1 — re-run place_and_tie_assignment over the current CERTIFIED set.
      # STEP 2..4 — place prizes, in this fixed category order:
      for category in [OVERALL, DIVISION, MASTERS]:
        for each distinct place p occupied in ascending p order:
          tied = CERTIFIED results at place p in that category's partition, count k
          pool = SUM( PurseLine.amount_cents for lines of this category matching the
                      partition (gender, and division for DIVISION) with place in [p, p+k-1] )
                 # missing lines contribute 0
          share     = floor(pool / k)                       # pool FIRST, then divide, then floor
          remainder = pool - share * k                      # 0..k-1 cents
          order tied by RaceResult.created_at ASC
          award(i) = share + (1 if i < remainder else 0)    # one extra cent to the earliest results
          create PrizeAward(category, place = p, tie_share_count = k,
                            gross_amount_cents = award(i)) with status COMPUTED
          # awards with gross_amount_cents == 0 are NOT created
      # STEP 5 — bonuses, per calculations.bonus_determination.
      # STEP 6 — withholding, per calculations.withholding_computation.
      # STEP 7 — RaceEdition.purse_allocated_cents / purse_unallocated_cents /
      #          bonus_pool_consumed_cents recomputed; RaceEdition.version += 1.
    input_set: "CERTIFIED RaceResults of the edition only; MASTERS lines apply solely to results with division == ELITE and is_masters == true; DIVISION lines apply only to the division named on the line; OVERALL lines ignore division and cover ELITE + SUB_ELITE results of the matching gender."
    constants: {}
    precision: "integer cents. Rounding order is pinned: sum the pooled place amounts FIRST, divide by the tie size, floor each share, then distribute the remainder cents one per athlete in ascending RaceResult.created_at order. Rounding each line before pooling is incorrect."
    variants: []

  - name: bonus_determination
    trigger: "STEP 5 of calculations.prize_award_generation"
    algorithm: threshold
    formula: |
      consumed = SUM(gross_amount_cents of surviving TIME_BONUS/RECORD_BONUS awards
                     with status IN {APPROVED, PAID, CLAWBACK_PENDING})   # kept from earlier runs
      for each CERTIFIED result r, in ascending official_seconds,
                                   tie-break ascending RaceResult.created_at:
        time_cand = max( L.amount_cents for L in PurseLines of the edition
                         where L.category == TIME_BONUS
                           and L.division == r.division
                           and L.gender   == r.athlete.gender
                           and r.official_seconds <= L.threshold_seconds ,   # inclusive
                         default = 0 )
        if r.division == WHEELCHAIR:
            time_cand = floor(time_cand * WHEELCHAIR_BONUS_FACTOR_BPS / 10000)
        rec_cand  = RECORD_BONUS PurseLine.amount_cents for (r.division, r.athlete.gender)
                    if r.record_claim_status == RATIFIED else 0
        candidate = max(rec_cand, time_cand)          # a record bonus SUPERSEDES, never adds
        cat       = RECORD_BONUS if (rec_cand > 0 and rec_cand >= time_cand) else TIME_BONUS
        headroom  = max(0, edition.bonus_pool_cap_cents - consumed)
        paid      = min(candidate, headroom)
        if paid > 0:
            create PrizeAward(category = cat, place = null, tie_share_count = 1,
                              gross_amount_cents = paid, status = COMPUTED)
            consumed += paid
        # paid == 0 creates no award at all (exhausted pool or no matching tier)
    input_set: "CERTIFIED results only; TIME_BONUS lines are matched on exact division and gender (no ANY wildcard); RECORD_BONUS requires record_claim_status == RATIFIED at the moment compute-awards runs."
    constants:
      WHEELCHAIR_BONUS_FACTOR_BPS: 7500
    precision: "integer cents; the wheelchair factor floors (never rounds half up); min/max nest as written"
    variants: []

  - name: qualifying_eligibility
    trigger: "POST /invitations/{id}/offer (DRAFT -> OFFERED)"
    algorithm: threshold
    formula: |
      pr = PerformanceRecord(invitation.qualifying_performance_id)
      require pr.athlete_id == invitation.athlete_id            else ERR_PERFORMANCE_DIVISION_MISMATCH
      require pr.division   == invitation.division              else ERR_PERFORMANCE_DIVISION_MISMATCH
      require pr.verification_status == VERIFIED                else ERR_QUALIFYING_STANDARD_NOT_MET
      s = DivisionStandard(race_edition_id, invitation.division, athlete.gender)
      require s exists                                          else ERR_QUALIFYING_STANDARD_MISSING
      require pr.verified_seconds <= s.max_qualifying_seconds    else ERR_QUALIFYING_STANDARD_NOT_MET   # inclusive
      require pr.performance_date >= race_date - s.window_months months (inclusive)
              and pr.performance_date <= race_date              else ERR_QUALIFYING_STANDARD_NOT_MET
      require (not s.requires_chip_timing) or pr.chip_timed      else ERR_QUALIFYING_STANDARD_NOT_MET
    input_set: "Exactly one PerformanceRecord — the one pinned on the invitation. Other faster records of the same athlete are irrelevant."
    constants: {}
    precision: "whole seconds; `<=` at the standard, so a time exactly equal to max_qualifying_seconds qualifies. Month arithmetic clamps to the same day-of-month (2026-11-01 minus 24 months == 2024-11-01, inclusive)."
    variants: []

  - name: doping_availability_compliance
    trigger: "POST /invitations/{id}/assign-bib (bib service gate) and evaluated again by POST /race-editions/{id}/run-ops step 3"
    algorithm: aggregation
    formula: |
      compliant(athlete, edition) =
            athlete.whereabouts_filed == true
        and missed_recent < MISSED_TEST_LIMIT
        and no DopingTest exists with (athlete_id, race_edition_id) and status == ADVERSE
      missed_recent = count( DopingTest where athlete_id == athlete.id
                                         and status == MISSED
                                         and window_end_at >= race_date - MISSED_LOOKBACK_DAYS days )
      # prize approval carries an additional, separate gate:
      approvable(athlete, edition) =
            exists DopingTest with (athlete_id, race_edition_id)
                   and test_type == IN_COMPETITION and status == CLEARED
    input_set: "DopingTest rows of the athlete across all editions for the MISSED count (window_end_at within the lookback), but only rows of THIS edition for the ADVERSE and IN_COMPETITION checks."
    constants:
      MISSED_TEST_LIMIT: 2
      MISSED_LOOKBACK_DAYS: 365
      OOC_CLEARANCE_DAYS: 90
    precision: "integer counts; `>=` at MISSED_TEST_LIMIT means the second missed test is what breaks compliance"
    variants: []

  - name: bib_assignment_selector
    trigger: "POST /invitations/{id}/assign-bib"
    algorithm: waterfall_allocation
    formula: |
      s          = DivisionStandard(invitation.race_edition_id, invitation.division, athlete.gender)
      candidates = [ s.bib_range_start .. s.bib_range_end ]                       # eligibility filter
      taken      = { i.bib_number for i in Invitation
                     where i.race_edition_id == invitation.race_edition_id
                       and i.status == ACCEPTED
                       and i.bib_number is not null }                             # exclusion set
      free       = sorted(candidates - taken)                                     # ranking: bib number ASC
      if free is empty: reject ERR_BIB_POOL_EXHAUSTED                             # empty-pool fallback
      bib_number = free[0]                                                        # no tie possible (integers are distinct)
    input_set: "Invitations of the same race_edition_id only; bibs held by WITHDRAWN / BREACHED / EXPIRED / DECLINED invitations are released and immediately reusable."
    constants: {}
    precision: "integer bib numbers; the selector never consults any random id"
    variants: []

  - name: fluid_slot_occupancy
    trigger: "POST /fluid-station-slots"
    algorithm: interval_merge
    formula: |
      new = [table_position, table_position + bottle_count - 1]        # CLOSED integer interval
      require station_km in ALLOWED_STATION_KM                          else ERR_INVALID_REQUEST
      require table_position + bottle_count - 1 <= MAX_TABLE_POSITION   else ERR_INVALID_REQUEST
      peers = FluidStationSlot f where f.status == RESERVED
                                   and f.station_km == new.station_km
                                   and Invitation(f.invitation_id).race_edition_id
                                       == Invitation(invitation_id).race_edition_id
      conflict(new, f) = NOT ( f.occupied_to + ADJACENCY_BUFFER < new.occupied_from
                               or new.occupied_to + ADJACENCY_BUFFER < f.occupied_from )
      # With ADJACENCY_BUFFER = 1 two reservations must leave at least one FREE
      # position between them: new.occupied_from - f.occupied_to >= 2.
      # positions [3,4] and [5,6] conflict (adjacent, no free position);
      # positions [3,4] and [6,7] do NOT conflict (position 5 stays free).
      if any conflict: reject ERR_FLUID_SLOT_CONFLICT
    input_set: "RESERVED slots at the same station_km whose owning invitation belongs to the same race_edition_id; RELEASED slots never conflict."
    constants:
      ALLOWED_STATION_KM: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0]
      MAX_TABLE_POSITION: 40
      ADJACENCY_BUFFER: 1
    precision: "integer positions; both endpoints inclusive"
    variants: []

  - name: pacing_range_occupancy
    trigger: "POST /pacer-assignments"
    algorithm: interval_merge
    formula: |
      new = [start_km, end_km)                                       # HALF-OPEN interval
      require end_km <= MAX_PACING_KM                                 else ERR_PACING_BEYOND_LIMIT
      peers = PacerAssignment p where p.race_edition_id == new.race_edition_id
                                  and p.pacer_license_code == new.pacer_license_code
      conflict(new, p) = new.start_km < p.end_km and p.start_km < new.end_km
      # no buffer, adjacency is legal: [0, 21.0) and [21.0, 32.0) coexist on one pacer.
      if any conflict: reject ERR_PACING_RANGE_CONFLICT
    input_set: "PacerAssignments of the same (race_edition_id, pacer_license_code); assignments of a different pacer licence never conflict."
    constants:
      MAX_PACING_KM: 32.0
      COURSE_LENGTH_KM: 42.195
    precision: "one decimal place on km; end_km == MAX_PACING_KM is allowed, end_km > MAX_PACING_KM is rejected"
    variants: []

  - name: testing_window_occupancy
    trigger: "POST /doping-tests"
    algorithm: interval_merge
    formula: |
      new = [window_start_at, window_end_at]                          # CLOSED datetime interval
      peers = DopingTest t where t.athlete_id == new.athlete_id
                             and t.status IN {SCHEDULED, COLLECTED}
      overlap(new, t) = new.window_start_at <= t.window_end_at
                    and t.window_start_at <= new.window_end_at        # touching endpoints DO overlap
      if any overlap: reject ERR_TESTING_WINDOW_OVERLAP
      # aggregate capacity, independent of overlap:
      nearby = count( DopingTest t where t.athlete_id == new.athlete_id
                      and t.window_start_at >= new.window_start_at - FREQUENCY_WINDOW_DAYS days
                      and t.window_start_at <= new.window_start_at + FREQUENCY_WINDOW_DAYS days )
      if nearby >= MAX_TESTS_PER_WINDOW: reject ERR_TESTING_FREQUENCY_EXCEEDED
    input_set: "For overlap: only SCHEDULED and COLLECTED tests of the athlete. For the frequency cap: tests of the athlete in EVERY status (CLEARED / ADVERSE / MISSED included), so a completed test still consumes capacity."
    constants:
      MAX_TESTS_PER_WINDOW: 2
      FREQUENCY_WINDOW_DAYS: 7
    precision: "ISO 8601 UTC datetimes with three fractional digits; both interval endpoints inclusive"
    variants: []

  - name: purse_and_budget_ledger
    trigger: "every transition whose side effects list a change to appearance_committed_cents, purse_allocated_cents or bonus_pool_consumed_cents, plus POST /race-editions/{id}/run-ops step 3"
    algorithm: aggregation
    formula: |
      appearance_committed_cents = SUM(i.guaranteed_commitment_cents
                                       for i in Invitation where i.race_edition_id == E
                                                             and i.status == ACCEPTED)
      appearance_uncommitted_cents = appearance_budget_cents - appearance_committed_cents
      purse_allocated_cents = SUM(a.gross_amount_cents
                                  for a in PrizeAward where a.race_edition_id == E
                                    and a.status IN {COMPUTED, APPROVED, PAID, CLAWBACK_PENDING})
      purse_unallocated_cents = total_purse_cents - purse_allocated_cents
      bonus_pool_consumed_cents = SUM(a.gross_amount_cents for those same awards
                                      where a.category IN {TIME_BONUS, RECORD_BONUS})

      # INV-1 (conserved quantity: appearance-fee budget cents)
      appearance_budget_cents == appearance_uncommitted_cents
                                + SUM(guaranteed_commitment_cents over ACCEPTED invitations)
      # INV-2 (conserved quantity: prize purse cents)
      total_purse_cents == purse_unallocated_cents
                           + SUM(gross_amount_cents over awards in
                                 {COMPUTED, APPROVED, PAID, CLAWBACK_PENDING})
    input_set: "Status-filtered as written: WITHDRAWN / BREACHED / EXPIRED / DECLINED invitations contribute 0 to the appearance ledger; VOID awards contribute 0 to the purse ledger; CLAWBACK_PENDING awards still contribute (the cash already left)."
    constants: {}
    precision: "integer cents; both invariants must hold exactly after every forward action and after every compensating action, including tie-remainder cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id referenced by the request resolves, checked path ids left-to-right first, then body FK fields in the order they appear in the endpoint's input list"
    error_id: "ERR_RACE_EDITION_NOT_FOUND | ERR_ATHLETE_NOT_FOUND | ERR_REP_AGENT_NOT_FOUND | ERR_PERFORMANCE_RECORD_NOT_FOUND | ERR_INVITATION_NOT_FOUND | ERR_DOPING_TEST_NOT_FOUND | ERR_RACE_RESULT_NOT_FOUND | ERR_PRIZE_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, integers within their declared constraints, net_seconds <= gun_seconds, window_start_at < window_end_at, start_km < end_km, bib_range_end >= bib_range_start, table_position + bottle_count - 1 <= 40, station_km in ALLOWED_STATION_KM, PurseLine category/place/threshold_seconds/division combination coherent, verification decision VERIFIED requires official_seconds and REJECTED requires rejection_reason, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: auth
    check: "When X-User-Role == AthleteAgent on an invitation-scoped write, X-User-ID must equal Invitation.agent_id"
    error_id: ERR_NOT_INVITATION_AGENT
    http_status: 403
    applies_to: "POST /invitations/{id}/negotiation-rounds, POST /invitations/{id}/respond"

  - priority: 6
    category: state
    check: "The owning RaceEdition is in a status that permits this operation (open-field requires PLANNING; invitations/offers/rounds/respond require FIELD_OPEN; assign-bib, fluid slots, pacer assignments and withdraw require FIELD_OPEN or FIELD_LOCKED; PurseLine and DivisionStandard creation require PLANNING; result creation and certify require RACED; disqualify requires RACED or RESULTS_CERTIFIED; compute-awards, approve and pay require RESULTS_CERTIFIED; every mutation is rejected once PURSE_SETTLED)"
    error_id: ERR_EDITION_STATE_INVALID
    http_status: 409
    applies_to: "all mutating endpoints that reference a RaceEdition directly or transitively"

  - priority: 7
    category: state
    check: "Configuration completeness for PLANNING -> FIELD_OPEN: at least one DivisionStandard and at least one OVERALL PurseLine exist for the edition"
    error_id: ERR_EDITION_CONFIG_INCOMPLETE
    http_status: 422
    applies_to: "POST /race-editions/{id}/open-field"

  - priority: 8
    category: state
    check: "The target entity is in a state that permits the requested transition, per §1.2"
    error_id: "ERR_INVALID_INVITATION_STATE | ERR_INVALID_AWARD_STATE | ERR_INVALID_RECORD_CLAIM_STATE | ERR_INVALID_DOPING_TEST_STATE | ERR_INVALID_PERFORMANCE_STATE | ERR_RESULT_NOT_CERTIFIED | ERR_RESULTS_NOT_ALL_ADJUDICATED | ERR_AWARDS_NOT_ALL_SETTLED"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: auth
    check: "Which role may respond depends on the invitation's state: from OFFERED only AthleteAgent may respond, from COUNTERED only ElitesDirector may respond; the negotiation-rounds endpoint mirrors it (OFFERED accepts only AthleteAgent, COUNTERED accepts only ElitesDirector)"
    error_id: ERR_ROLE_NOT_PERMITTED_FROM_STATE
    http_status: 403
    applies_to: "POST /invitations/{id}/respond, POST /invitations/{id}/negotiation-rounds"

  - priority: 10
    category: business_constraint
    check: "expected_<parent>_version equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_INVITATION_VERSION | ERR_STALE_EDITION_VERSION"
    http_status: 412
    applies_to: "POST /invitations/{id}/negotiation-rounds, POST /race-editions/{id}/compute-awards"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the FinanceOfficer paying an award must not be the FinanceOfficer who approved it (X-User-ID != approved_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prize-awards/{id}/pay"

  - priority: 12
    category: business_safety
    check: "Anti-doping gates: bib assignment requires calculations.doping_availability_compliance to pass; prize approval requires an IN_COMPETITION DopingTest with status CLEARED for the athlete in this edition; a SUSPENDED RepAgent may not negotiate, respond or receive an offer"
    error_id: "ERR_ATHLETE_NOT_DOPING_COMPLIANT | ERR_IN_COMPETITION_TEST_NOT_CLEARED | ERR_AGENT_SUSPENDED"
    http_status: 422
    applies_to: "POST /invitations/{id}/assign-bib, POST /prize-awards/{id}/approve, POST /invitations/{id}/offer, POST /invitations/{id}/negotiation-rounds, POST /invitations/{id}/respond"

  - priority: 13
    category: business_temporal
    check: "Clock-relative windows: a negotiation round or response must arrive at or before Invitation.response_deadline_at; collection must fall inside [window_start_at, window_end_at]; mark-raced requires the clock to have reached race_date 00:00:00Z"
    error_id: "ERR_OFFER_DEADLINE_PASSED | ERR_COLLECTION_WINDOW_INVALID | ERR_RACE_DATE_NOT_REACHED"
    http_status: 422
    applies_to: "POST /invitations/{id}/negotiation-rounds, POST /invitations/{id}/respond, POST /doping-tests/{id}/collect, POST /race-editions/{id}/mark-raced"

  - priority: 14
    category: business_constraint
    check: "Occupancy, capacity and uniqueness: negotiation round cap (round_count < 2 * max_negotiation_rounds); qualifying standard exists and is met; bib pool free and not already assigned; fluid slot buffer; pacing range overlap and 32 km limit; testing window overlap and 7-day frequency cap; one RaceResult per invitation; unique (race_edition_id, category, division, gender, place, threshold_seconds) PurseLine and unique (race_edition_id, division, gender) DivisionStandard; unique RepAgent.license_code and DopingTest.sample_code"
    error_id: "ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_QUALIFYING_STANDARD_MISSING | ERR_QUALIFYING_STANDARD_NOT_MET | ERR_BIB_POOL_EXHAUSTED | ERR_BIB_ALREADY_ASSIGNED | ERR_FLUID_SLOT_CONFLICT | ERR_PACING_RANGE_CONFLICT | ERR_PACING_BEYOND_LIMIT | ERR_TESTING_WINDOW_OVERLAP | ERR_TESTING_FREQUENCY_EXCEEDED | ERR_DUPLICATE_RESULT | ERR_CONFIG_DUPLICATE"
    http_status: "409, except ERR_QUALIFYING_STANDARD_MISSING / ERR_QUALIFYING_STANDARD_NOT_MET / ERR_PACING_BEYOND_LIMIT / ERR_TESTING_FREQUENCY_EXCEEDED which are 422"
    applies_to: "POST /invitations/{id}/negotiation-rounds, POST /invitations/{id}/offer, POST /invitations/{id}/assign-bib, POST /fluid-station-slots, POST /pacer-assignments, POST /doping-tests, POST /race-results, POST /purse-lines, POST /division-standards, POST /rep-agents"

  - priority: 15
    category: business_referential
    check: "Cross-entity coherence: the pinned PerformanceRecord belongs to the invited athlete and to the invitation's division; a record claim may only be submitted for a non SUB_ELITE division whose claim status is CLAIMED or REJECTED; a RaceResult's invitation must belong to the same race_edition_id, be ACCEPTED and carry a bib_number"
    error_id: "ERR_PERFORMANCE_DIVISION_MISMATCH | ERR_RECORD_CLAIM_NOT_ELIGIBLE | ERR_INVITATION_EDITION_MISMATCH"
    http_status: 422
    applies_to: "POST /invitations/{id}/offer, POST /race-results/{id}/record-submission, POST /race-results"

  - priority: 16
    category: business_fiscal
    check: "Money ceilings, checked last: appearance_uncommitted_cents >= the invitation's `guaranteed` valuation on ACCEPT; SUM of `full_exposure` over ACCEPTED invitations <= appearance_budget_cents + bonus_pool_cap_cents on lock-field"
    error_id: "ERR_APPEARANCE_BUDGET_EXCEEDED | ERR_FIELD_LOCK_EXPOSURE_EXCEEDED"
    http_status: 422
    applies_to: "POST /invitations/{id}/respond, POST /race-editions/{id}/lock-field"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- RaceEdition ----------------------------------------------------------
  - method: POST
    path: "/race-editions"
    description: "Create a marathon edition in PLANNING"
    roles: [ElitesDirector]
    code: 201
    input: ["name", "city", "race_date", "appearance_budget_cents", "total_purse_cents", "bonus_pool_cap_cents", "offer_response_days?", "max_negotiation_rounds?", "masters_min_age?", "course_record_male_seconds?", "course_record_female_seconds?", "course_record_wheelchair_male_seconds?", "course_record_wheelchair_female_seconds?"]
    output: RaceEdition
    side_effects: ["status = PLANNING; appearance_committed_cents = 0; purse_allocated_cents = 0; version = 1"]

  - method: GET
    path: "/race-editions/{id}"
    description: "Read one edition including its computed ledger fields"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial, AntiDopingLiaison, SanctioningBody, AthleteAgent]
    code: 200
    input: []
    output: RaceEdition
    side_effects: []

  - method: POST
    path: "/race-editions/{id}/open-field"
    description: "PLANNING -> FIELD_OPEN once purse lines and division standards exist"
    roles: [ElitesDirector]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["status = FIELD_OPEN", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/lock-field"
    description: "FIELD_OPEN -> FIELD_LOCKED; stamps full_exposure_cents on every ACCEPTED invitation and expires all pending ones"
    roles: [ElitesDirector]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["invitation_package_valuation variant `full_exposure` written to each ACCEPTED invitation", "DRAFT/OFFERED/COUNTERED invitations -> EXPIRED with expired_offer_count increments", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/mark-raced"
    description: "FIELD_LOCKED -> RACED once the logical clock reaches race day"
    roles: [TechnicalOfficial]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["status = RACED", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/certify-results"
    description: "RACED -> RESULTS_CERTIFIED; runs place_and_tie_assignment and raises course-record claims"
    roles: [TechnicalOfficial]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["place_overall / place_division / place_masters / tie_group_size / is_masters written on CERTIFIED results", "record_claim_status NONE -> CLAIMED for record-beating non SUB_ELITE results", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/compute-awards"
    description: "Generate the PrizeAward set for a RESULTS_CERTIFIED edition; supersedes prior COMPUTED awards (OCC guarded)"
    roles: [FinanceOfficer]
    code: 200
    input: [expected_race_edition_version]
    output: RaceEdition
    side_effects: ["prior COMPUTED awards -> VOID", "prize_award_generation + bonus_determination + withholding_computation run", "purse_allocated_cents / purse_unallocated_cents / bonus_pool_consumed_cents recomputed", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/settle-purse"
    description: "RESULTS_CERTIFIED -> PURSE_SETTLED once every award is PAID / VOID / CLAWBACK_PENDING and no record claim is SUBMITTED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["status = PURSE_SETTLED (terminal)", "increments RaceEdition.version by 1"]

  - method: POST
    path: "/race-editions/{id}/run-ops"
    description: "Ops-run checkpoint: step 1 expires overdue offers, step 2 marks overdue doping tests MISSED, step 3 recomputes the edition ledger. Each step processes rows in ascending created_at."
    roles: [ElitesDirector]
    code: 200
    input: []
    output: RaceEdition
    side_effects: ["OFFERED/COUNTERED invitations past response_deadline_at -> EXPIRED with expired_offer_count increments", "SCHEDULED doping tests past window_end_at -> MISSED with Athlete.missed_test_count increments", "purse_and_budget_ledger recomputed", "increments RaceEdition.version by 1"]

  - method: GET
    path: "/race-editions/{id}/purse-lines"
    description: "List the purse structure of an edition"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial]
    code: 200
    input: ["category?", "gender?", "limit?", "offset?"]
    output: PurseLine[]
    side_effects: []

  - method: GET
    path: "/race-editions/{id}/division-standards"
    description: "List the qualifying standards and bib pools of an edition"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial, AthleteAgent]
    code: 200
    input: ["division?", "gender?", "limit?", "offset?"]
    output: DivisionStandard[]
    side_effects: []

  - method: GET
    path: "/race-editions/{id}/pacer-assignments"
    description: "List the pacing arrangements of an edition"
    roles: [ElitesDirector, TechnicalOfficial]
    code: 200
    input: ["pacer_license_code?", "limit?", "offset?"]
    output: PacerAssignment[]
    side_effects: []

  # ---- configuration --------------------------------------------------------
  - method: POST
    path: "/purse-lines"
    description: "Add one purse line while the edition is PLANNING"
    roles: [ElitesDirector]
    code: 201
    input: ["race_edition_id", "category", "gender", "amount_cents", "division?", "place?", "threshold_seconds?"]
    output: PurseLine
    side_effects: ["uniqueness on (race_edition_id, category, division, gender, place, threshold_seconds)"]

  - method: POST
    path: "/division-standards"
    description: "Add one division qualifying standard and bib pool while the edition is PLANNING"
    roles: [ElitesDirector]
    code: 201
    input: ["race_edition_id", "division", "gender", "max_qualifying_seconds", "bib_range_start", "bib_range_end", "window_months?", "requires_chip_timing?"]
    output: DivisionStandard
    side_effects: ["uniqueness on (race_edition_id, division, gender)"]

  # ---- Athlete / RepAgent / PerformanceRecord --------------------------------
  - method: POST
    path: "/athletes"
    description: "Register an athlete"
    roles: [ElitesDirector]
    code: 201
    input: ["full_name", "country_code", "gender", "birth_date", "tax_residency_country?", "w8ben_on_file?", "treaty_withholding_bps?", "whereabouts_filed?"]
    output: Athlete
    side_effects: ["tax_residency_country defaults to country_code; missed_test_count = 0"]

  - method: GET
    path: "/athletes/{id}"
    description: "Read one athlete including missed_test_count"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial, AntiDopingLiaison, SanctioningBody]
    code: 200
    input: []
    output: Athlete
    side_effects: []

  - method: PATCH
    path: "/athletes/{id}/tax-profile"
    description: "Update the withholding profile of an athlete"
    roles: [FinanceOfficer]
    code: 200
    input: ["tax_residency_country?", "w8ben_on_file?", "treaty_withholding_bps?"]
    output: Athlete
    side_effects: ["increments Athlete.version by 1; already-computed awards are NOT re-withheld until compute-awards runs again"]

  - method: GET
    path: "/athletes/{id}/performance-records"
    description: "List the qualifying performances submitted for an athlete"
    roles: [ElitesDirector, TechnicalOfficial, AthleteAgent]
    code: 200
    input: ["verification_status?", "division?", "limit?", "offset?"]
    output: PerformanceRecord[]
    side_effects: []

  - method: POST
    path: "/rep-agents"
    description: "Register a representation agent; the returned id is the X-User-ID an AthleteAgent authenticates with"
    roles: [ElitesDirector]
    code: 201
    input: ["agency_name", "license_code", "commission_bps?", "status?"]
    output: RepAgent
    side_effects: ["uniqueness on license_code"]

  - method: POST
    path: "/performance-records"
    description: "Submit a qualifying performance for time verification"
    roles: [AthleteAgent, ElitesDirector]
    code: 201
    input: ["athlete_id", "race_name", "performance_date", "performance_seconds", "division", "sanctioning_ref", "chip_timed?"]
    output: PerformanceRecord
    side_effects: ["verification_status = SUBMITTED; verified_seconds = null"]

  - method: POST
    path: "/performance-records/{id}/verification"
    description: "Verify or reject a submitted performance; verification establishes the official verified_seconds"
    roles: [TechnicalOfficial]
    code: 200
    input: ["decision", "official_seconds?", "rejection_reason?"]
    output: PerformanceRecord
    side_effects: ["verification_status = VERIFIED with verified_seconds = official_seconds, or REJECTED with rejection_reason"]

  # ---- Invitation / negotiation ---------------------------------------------
  - method: POST
    path: "/invitations"
    description: "Create a DRAFT invitation pinning the qualifying performance to be used"
    roles: [ElitesDirector]
    code: 201
    input: [race_edition_id, athlete_id, agent_id, qualifying_performance_id, division]
    output: Invitation
    side_effects: ["status = DRAFT; guaranteed_commitment_cents = 0; round_count = 0"]

  - method: GET
    path: "/invitations/{id}"
    description: "Read one invitation including its negotiation and commitment state"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial, AthleteAgent, AntiDopingLiaison]
    code: 200
    input: []
    output: Invitation
    side_effects: []

  - method: GET
    path: "/invitations"
    description: "Filtered list of invitations (also the reverse-reachability channel for every Invitation FK)"
    roles: [ElitesDirector, FinanceOfficer, TechnicalOfficial, AthleteAgent]
    code: 200
    input: ["race_edition_id?", "athlete_id?", "agent_id?", "qualifying_performance_id?", "status?", "division?", "limit?", "offset?"]
    output: Invitation[]
    side_effects: []

  - method: POST
    path: "/invitations/{id}/offer"
    description: "DRAFT -> OFFERED; checks qualifying_eligibility and opens the response window"
    roles: [ElitesDirector]
    code: 200
    input: ["appearance_fee_cents", "air_class", "hotel_nights", "ground_transport", "note?"]
    output: Invitation
    side_effects: ["creates NegotiationRound round_number 1 side COMMITTEE", "offer_sent_at / response_deadline_at set", "negotiated_by_user_id = X-User-ID", "increments Invitation.version by 1"]

  - method: POST
    path: "/invitations/{id}/negotiation-rounds"
    description: "Append a negotiation round: AthleteAgent counters an OFFERED invitation, ElitesDirector re-offers a COUNTERED one (OCC guarded)"
    roles: [AthleteAgent, ElitesDirector]
    code: 201
    input: ["appearance_fee_cents", "air_class", "hotel_nights", "ground_transport", "expected_invitation_version", "note?"]
    output: NegotiationRound
    side_effects: ["Invitation.current_* terms replaced", "status toggles OFFERED <-> COUNTERED", "response_deadline_at = clock + offer_response_days days", "increments Invitation.version by 1"]

  - method: GET
    path: "/invitations/{id}/negotiation-rounds"
    description: "List the negotiation history of an invitation in ascending round_number"
    roles: [ElitesDirector, AthleteAgent, FinanceOfficer]
    code: 200
    input: ["side?", "limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []

  - method: POST
    path: "/invitations/{id}/respond"
    description: "Accept or decline the current terms; which role may respond depends on the current state"
    roles: [AthleteAgent, ElitesDirector]
    code: 200
    input: [decision]
    output: Invitation
    side_effects: ["ACCEPT: guaranteed_commitment_cents computed and debited from the edition budget, status = ACCEPTED, RaceEdition.version += 1", "DECLINE: status = DECLINED", "increments Invitation.version by 1"]

  - method: POST
    path: "/invitations/{id}/withdraw"
    description: "Withdraw an invitation; from ACCEPTED this is the compensating action that releases the appearance commitment, the bib and the fluid slots"
    roles: [ElitesDirector]
    code: 200
    input: ["reason?"]
    output: Invitation
    side_effects: ["RaceEdition.appearance_committed_cents reduced by guaranteed_commitment_cents and RaceEdition.version += 1", "bib_number = null", "FluidStationSlots -> RELEASED", "increments Invitation.version by 1"]

  - method: POST
    path: "/invitations/{id}/assign-bib"
    description: "Elite service: assign the lowest free bib of the athlete's division pool after the anti-doping availability gate"
    roles: [ElitesDirector]
    code: 200
    input: []
    output: Invitation
    side_effects: ["bib_number = bib_assignment_selector output", "increments Invitation.version by 1"]

  - method: GET
    path: "/invitations/{id}/fluid-station-slots"
    description: "List the fluid station reservations of an invitation"
    roles: [ElitesDirector, TechnicalOfficial, AthleteAgent]
    code: 200
    input: ["status?", "station_km?", "limit?", "offset?"]
    output: FluidStationSlot[]
    side_effects: []

  # ---- elite services -------------------------------------------------------
  - method: POST
    path: "/fluid-station-slots"
    description: "Reserve adjacent table positions for an athlete's bottles at one station"
    roles: [ElitesDirector]
    code: 201
    input: [invitation_id, station_km, table_position, bottle_count]
    output: FluidStationSlot
    side_effects: ["occupied_from / occupied_to computed; fluid_slot_occupancy conflict check against RESERVED peers"]

  - method: POST
    path: "/pacer-assignments"
    description: "Register a pacing arrangement for one licensed pacer over a half-open km range"
    roles: [ElitesDirector]
    code: 201
    input: ["race_edition_id", "pacer_license_code", "pacer_name", "target_pace_seconds_per_km", "start_km", "end_km", "assistance_rule?"]
    output: PacerAssignment
    side_effects: ["pacing_range_occupancy conflict check against the same pacer_license_code in this edition"]

  # ---- anti-doping ----------------------------------------------------------
  - method: POST
    path: "/doping-tests"
    description: "Schedule a test inside an athlete availability window"
    roles: [AntiDopingLiaison]
    code: 201
    input: [athlete_id, race_edition_id, test_type, window_start_at, window_end_at, sample_code]
    output: DopingTest
    side_effects: ["status = SCHEDULED; testing_window_occupancy overlap and frequency checks"]

  - method: GET
    path: "/doping-tests/{id}"
    description: "Read one doping test"
    roles: [AntiDopingLiaison, SanctioningBody, FinanceOfficer, TechnicalOfficial, ElitesDirector]
    code: 200
    input: []
    output: DopingTest
    side_effects: []

  - method: GET
    path: "/doping-tests"
    description: "Filtered list of doping tests (reverse-reachability channel for both DopingTest FKs)"
    roles: [AntiDopingLiaison, SanctioningBody, FinanceOfficer, TechnicalOfficial, ElitesDirector]
    code: 200
    input: ["athlete_id?", "race_edition_id?", "test_type?", "status?", "limit?", "offset?"]
    output: DopingTest[]
    side_effects: []

  - method: POST
    path: "/doping-tests/{id}/collect"
    description: "SCHEDULED -> COLLECTED; only inside the declared availability window"
    roles: [AntiDopingLiaison]
    code: 200
    input: [collected_sample_ref]
    output: DopingTest
    side_effects: ["collected_at = logical clock", "increments DopingTest.version by 1"]

  - method: POST
    path: "/doping-tests/{id}/adjudicate"
    description: "Sanctioning body records the laboratory outcome; ADVERSE starts the disqualification cascade"
    roles: [SanctioningBody]
    code: 200
    input: ["outcome", "outcome_notes?"]
    output: DopingTest
    side_effects: ["CLEARED unlocks prize approval for IN_COMPETITION tests", "ADVERSE disqualifies the athlete's results, rejects their record claims and voids/claws back their awards", "increments DopingTest.version by 1"]

  # ---- results / records ----------------------------------------------------
  - method: POST
    path: "/race-results"
    description: "Enter a finisher's times for a bibbed invitation while the edition is RACED"
    roles: [TechnicalOfficial]
    code: 201
    input: [race_edition_id, invitation_id, gun_seconds, net_seconds]
    output: RaceResult
    side_effects: ["athlete_id and division copied from the invitation", "official_seconds computed from division", "certification_status = PROVISIONAL; record_claim_status = NONE"]

  - method: GET
    path: "/race-results/{id}"
    description: "Read one result including both state dimensions and its computed places"
    roles: [TechnicalOfficial, ElitesDirector, FinanceOfficer, SanctioningBody, AthleteAgent]
    code: 200
    input: []
    output: RaceResult
    side_effects: []

  - method: GET
    path: "/race-results"
    description: "Filtered list of results (reverse-reachability channel for every RaceResult FK)"
    roles: [TechnicalOfficial, ElitesDirector, FinanceOfficer, SanctioningBody, AthleteAgent]
    code: 200
    input: ["race_edition_id?", "athlete_id?", "invitation_id?", "division?", "certification_status?", "record_claim_status?", "limit?", "offset?"]
    output: RaceResult[]
    side_effects: []

  - method: POST
    path: "/race-results/{id}/certify"
    description: "PROVISIONAL -> CERTIFIED (dimension 1)"
    roles: [TechnicalOfficial]
    code: 200
    input: []
    output: RaceResult
    side_effects: ["certification_status = CERTIFIED", "increments RaceResult.version by 1"]

  - method: POST
    path: "/race-results/{id}/disqualify"
    description: "Disqualify a finisher for an assistance, course or anti-doping violation; starts the void/breach cascade"
    roles: [TechnicalOfficial]
    code: 200
    input: [dq_reason]
    output: RaceResult
    side_effects: ["places nulled; record claim REJECTED", "PrizeAwards -> VOID or CLAWBACK_PENDING and the edition ledger recomputed", "linked Invitation ACCEPTED -> BREACHED for breach reasons", "increments RaceResult.version by 1"]

  - method: POST
    path: "/race-results/{id}/record-submission"
    description: "Submit a course-record ratification package to the sanctioning body (dimension 2: CLAIMED|REJECTED -> SUBMITTED)"
    roles: [TechnicalOfficial]
    code: 200
    input: [sanctioning_submission_ref]
    output: RaceResult
    side_effects: ["record_claim_status = SUBMITTED; the edition can no longer settle its purse", "increments RaceResult.version by 1"]

  - method: POST
    path: "/race-results/{id}/record-decision"
    description: "Sanctioning body ratifies or rejects a submitted record claim; ratification updates the course record and rejects weaker claims"
    roles: [SanctioningBody]
    code: 200
    input: ["decision", "decision_note?"]
    output: RaceResult
    side_effects: ["RATIFIED: edition course record for the (division-class, gender) key updated, other CLAIMED results with slower or equal times -> REJECTED", "REJECTED: nothing but this claim changes", "increments RaceResult.version by 1"]

  # ---- prize awards ---------------------------------------------------------
  - method: GET
    path: "/prize-awards/{id}"
    description: "Read one prize award with its gross, withholding and net amounts"
    roles: [FinanceOfficer, ElitesDirector, TechnicalOfficial, AthleteAgent]
    code: 200
    input: []
    output: PrizeAward
    side_effects: []

  - method: GET
    path: "/prize-awards"
    description: "Filtered list of prize awards (reverse-reachability channel for every PrizeAward FK)"
    roles: [FinanceOfficer, ElitesDirector, TechnicalOfficial, AthleteAgent]
    code: 200
    input: ["race_edition_id?", "race_result_id?", "athlete_id?", "category?", "status?", "limit?", "offset?"]
    output: PrizeAward[]
    side_effects: []

  - method: POST
    path: "/prize-awards/{id}/approve"
    description: "COMPUTED -> APPROVED after the in-competition anti-doping clearance"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PrizeAward
    side_effects: ["approved_by_user_id = X-User-ID", "increments PrizeAward.version by 1"]

  - method: POST
    path: "/prize-awards/{id}/pay"
    description: "APPROVED -> PAID by a different FinanceOfficer than the approver"
    roles: [FinanceOfficer]
    code: 200
    input: [payment_reference]
    output: PrizeAward
    side_effects: ["paid_by_user_id = X-User-ID; paid_at = logical clock", "increments PrizeAward.version by 1"]

  # ---- test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server starts at the fixed default 2026-08-01T00:00:00Z and NEVER reads real wall-clock time; every deadline, availability window and race-day check is evaluated against this logical clock."
    roles: [ElitesDirector, TechnicalOfficial, FinanceOfficer, AntiDopingLiaison, SanctioningBody]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["no entity mutation; subsequent requests observe the new logical time"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Role is not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, value outside a declared constraint, incoherent PurseLine category combination, net_seconds > gun_seconds, station_km outside ALLOWED_STATION_KM, table span beyond position 40, or bad pagination arguments" }
  - { id: ERR_RACE_EDITION_NOT_FOUND, http: 404, condition: "race edition id in path or body does not exist" }
  - { id: ERR_ATHLETE_NOT_FOUND, http: 404, condition: "athlete id in path or body does not exist" }
  - { id: ERR_REP_AGENT_NOT_FOUND, http: 404, condition: "agent_id does not exist" }
  - { id: ERR_PERFORMANCE_RECORD_NOT_FOUND, http: 404, condition: "performance record id in path or qualifying_performance_id does not exist" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "invitation id in path or body does not exist" }
  - { id: ERR_DOPING_TEST_NOT_FOUND, http: 404, condition: "doping test id in path does not exist" }
  - { id: ERR_RACE_RESULT_NOT_FOUND, http: 404, condition: "race result id in path does not exist" }
  - { id: ERR_PRIZE_AWARD_NOT_FOUND, http: 404, condition: "prize award id in path does not exist" }
  - { id: ERR_NOT_INVITATION_AGENT, http: 403, condition: "AthleteAgent X-User-ID does not match Invitation.agent_id" }
  - { id: ERR_ROLE_NOT_PERMITTED_FROM_STATE, http: 403, condition: "The acting role is not the side entitled to act from the invitation's current state (AthleteAgent from OFFERED, ElitesDirector from COUNTERED)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The FinanceOfficer paying an award is the same user id that approved it" }
  - { id: ERR_EDITION_STATE_INVALID, http: 409, condition: "The owning RaceEdition's status does not permit this operation" }
  - { id: ERR_EDITION_CONFIG_INCOMPLETE, http: 422, condition: "open-field attempted without at least one DivisionStandard and one OVERALL PurseLine" }
  - { id: ERR_INVALID_INVITATION_STATE, http: 409, condition: "Invitation is not in a state that permits the requested transition" }
  - { id: ERR_INVALID_AWARD_STATE, http: 409, condition: "PrizeAward is not in a state that permits approve or pay" }
  - { id: ERR_INVALID_RECORD_CLAIM_STATE, http: 409, condition: "On record-submission: record_claim_status is already SUBMITTED or RATIFIED (in flight or finally decided). On record-decision: record_claim_status is not SUBMITTED" }
  - { id: ERR_INVALID_DOPING_TEST_STATE, http: 409, condition: "DopingTest is not SCHEDULED for collection or not COLLECTED for adjudication" }
  - { id: ERR_INVALID_PERFORMANCE_STATE, http: 409, condition: "PerformanceRecord is already VERIFIED or REJECTED" }
  - { id: ERR_RESULT_NOT_CERTIFIED, http: 409, condition: "Operation requires the linked RaceResult to be CERTIFIED" }
  - { id: ERR_RESULTS_NOT_ALL_ADJUDICATED, http: 409, condition: "certify-results attempted while a RaceResult is still PROVISIONAL, or with zero CERTIFIED results" }
  - { id: ERR_AWARDS_NOT_ALL_SETTLED, http: 409, condition: "settle-purse attempted while an award is still COMPUTED or APPROVED" }
  - { id: ERR_STALE_INVITATION_VERSION, http: 412, condition: "expected_invitation_version does not match Invitation.version" }
  - { id: ERR_STALE_EDITION_VERSION, http: 412, condition: "expected_race_edition_version does not match RaceEdition.version" }
  - { id: ERR_ATHLETE_NOT_DOPING_COMPLIANT, http: 422, condition: "Whereabouts not filed, MISSED_TEST_LIMIT reached, or an ADVERSE test exists for this edition" }
  - { id: ERR_IN_COMPETITION_TEST_NOT_CLEARED, http: 422, condition: "Award approval attempted without an IN_COMPETITION DopingTest in status CLEARED for the athlete in this edition" }
  - { id: ERR_AGENT_SUSPENDED, http: 422, condition: "The RepAgent on the invitation has status SUSPENDED" }
  - { id: ERR_OFFER_DEADLINE_PASSED, http: 422, condition: "Logical clock is past Invitation.response_deadline_at" }
  - { id: ERR_COLLECTION_WINDOW_INVALID, http: 422, condition: "Collection attempted outside [window_start_at, window_end_at]" }
  - { id: ERR_RACE_DATE_NOT_REACHED, http: 422, condition: "mark-raced attempted before race_date 00:00:00Z on the logical clock" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 409, condition: "round_count already equals 2 * max_negotiation_rounds" }
  - { id: ERR_QUALIFYING_STANDARD_MISSING, http: 422, condition: "No DivisionStandard for (edition, division, athlete gender)" }
  - { id: ERR_QUALIFYING_STANDARD_NOT_MET, http: 422, condition: "Pinned performance is not VERIFIED, is slower than max_qualifying_seconds, falls outside the qualifying window, or lacks required chip timing" }
  - { id: ERR_PERFORMANCE_DIVISION_MISMATCH, http: 422, condition: "The pinned performance belongs to another athlete or another division than the invitation" }
  - { id: ERR_BIB_ALREADY_ASSIGNED, http: 409, condition: "The invitation already holds a bib_number" }
  - { id: ERR_BIB_POOL_EXHAUSTED, http: 409, condition: "Every bib in the division pool is held by an ACCEPTED invitation of this edition" }
  - { id: ERR_FLUID_SLOT_CONFLICT, http: 409, condition: "Requested table positions intersect a RESERVED slot at the same station, or fail to leave ADJACENCY_BUFFER free positions between the two reservations" }
  - { id: ERR_PACING_RANGE_CONFLICT, http: 409, condition: "Half-open km range overlaps another assignment of the same pacer_license_code in this edition" }
  - { id: ERR_PACING_BEYOND_LIMIT, http: 422, condition: "end_km exceeds MAX_PACING_KM (32.0)" }
  - { id: ERR_TESTING_WINDOW_OVERLAP, http: 409, condition: "Closed availability window touches or overlaps another SCHEDULED/COLLECTED window of the same athlete" }
  - { id: ERR_TESTING_FREQUENCY_EXCEEDED, http: 422, condition: "The athlete already has MAX_TESTS_PER_WINDOW tests starting within FREQUENCY_WINDOW_DAYS of the requested start" }
  - { id: ERR_DUPLICATE_RESULT, http: 409, condition: "A RaceResult already exists for this invitation" }
  - { id: ERR_CONFIG_DUPLICATE, http: 409, condition: "Duplicate PurseLine key, DivisionStandard key, RepAgent.license_code or DopingTest.sample_code" }
  - { id: ERR_RECORD_CLAIM_NOT_ELIGIBLE, http: 422, condition: "Record submission attempted for a SUB_ELITE result, or for a claim that was never raised (record_claim_status == NONE); this eligibility clause is checked at priority 15, so the priority 8 state error never shadows it" }
  - { id: ERR_INVITATION_EDITION_MISMATCH, http: 422, condition: "The invitation named on a result belongs to another edition, is not ACCEPTED, or has no bib_number" }
  - { id: ERR_APPEARANCE_BUDGET_EXCEEDED, http: 422, condition: "appearance_uncommitted_cents is below the invitation's `guaranteed` valuation at ACCEPT" }
  - { id: ERR_FIELD_LOCK_EXPOSURE_EXCEEDED, http: 422, condition: "SUM of `full_exposure` over ACCEPTED invitations exceeds appearance_budget_cents + bonus_pool_cap_cents at lock-field" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ElitesDirector
    description: "Organizing committee elite field director: configures the edition, recruits athletes, negotiates from the committee side, runs elite services (bibs, fluid stations, pacers) and the ops sweep"
    identity: opaque
    exclusive_operations:
      - "POST /race-editions, POST /race-editions/{id}/open-field, POST /race-editions/{id}/lock-field, POST /race-editions/{id}/run-ops"
      - "POST /purse-lines, POST /division-standards, POST /athletes, POST /rep-agents"
      - "POST /invitations, POST /invitations/{id}/offer, POST /invitations/{id}/withdraw, POST /invitations/{id}/assign-bib"
      - "POST /fluid-station-slots, POST /pacer-assignments"
    shared_operations:
      - "POST /performance-records (also AthleteAgent)"
      - "POST /invitations/{id}/negotiation-rounds and POST /invitations/{id}/respond (committee side only, from COUNTERED)"
      - "POST /_clock/set_current_utc; all GET reads"

  - name: AthleteAgent
    description: "Licensed representation agent acting for the athlete: submits qualifying performances and negotiates or responds from the athlete side"
    identity: "entity_backed:RepAgent"
    exclusive_operations:
      - "POST /invitations/{id}/negotiation-rounds from OFFERED (counter-offer, side AGENT)"
      - "POST /invitations/{id}/respond from OFFERED (accept or decline on behalf of the athlete)"
    shared_operations:
      - "POST /performance-records (also ElitesDirector)"
      - "GET /invitations, GET /invitations/{id}, GET /invitations/{id}/negotiation-rounds, GET /invitations/{id}/fluid-station-slots, GET /athletes/{id}/performance-records, GET /race-results, GET /prize-awards"

  - name: TechnicalOfficial
    description: "Chief referee / technical delegate: verifies qualifying times, opens the race, enters and certifies results, disqualifies for assistance violations and submits record ratification packages"
    identity: opaque
    exclusive_operations:
      - "POST /performance-records/{id}/verification"
      - "POST /race-editions/{id}/mark-raced, POST /race-editions/{id}/certify-results"
      - "POST /race-results, POST /race-results/{id}/certify, POST /race-results/{id}/disqualify, POST /race-results/{id}/record-submission"
    shared_operations: ["POST /_clock/set_current_utc; all GET reads"]

  - name: AntiDopingLiaison
    description: "Committee anti-doping coordinator: schedules tests inside athlete availability windows and collects samples"
    identity: opaque
    exclusive_operations: ["POST /doping-tests", "POST /doping-tests/{id}/collect"]
    shared_operations: ["POST /_clock/set_current_utc; GET /doping-tests, GET /doping-tests/{id}, GET /athletes/{id}, GET /race-editions/{id}, GET /invitations/{id}"]

  - name: SanctioningBody
    description: "External sanctioning body officer: returns laboratory outcomes and ratifies or rejects course-record claims"
    identity: opaque
    exclusive_operations: ["POST /doping-tests/{id}/adjudicate", "POST /race-results/{id}/record-decision"]
    shared_operations: ["POST /_clock/set_current_utc; GET /doping-tests, GET /doping-tests/{id}, GET /race-results, GET /race-results/{id}, GET /athletes/{id}, GET /race-editions/{id}"]

  - name: FinanceOfficer
    description: "Prize purse and payments officer: maintains withholding profiles, computes the award set, approves and pays prizes and settles the purse. Approval and payment must come from two different FinanceOfficer user ids."
    identity: opaque
    exclusive_operations:
      - "PATCH /athletes/{id}/tax-profile"
      - "POST /race-editions/{id}/compute-awards, POST /race-editions/{id}/settle-purse"
      - "POST /prize-awards/{id}/approve, POST /prize-awards/{id}/pay"
    shared_operations: ["POST /_clock/set_current_utc; all GET reads"]
