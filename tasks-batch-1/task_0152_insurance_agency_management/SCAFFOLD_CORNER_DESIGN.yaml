  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_split_create_stale_policy_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[split-create-stale-policy]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential POST /commission-splits: the first advances Policy.version 1->2; the second carrying expected_policy_version derived from the pre-first version (stale) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["a QUOTED policy at version 1; two producers for two splits"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car OC", naic_code: "23232", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto OC", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Writer OC", npn: "NPN-OC1", default_split_pct: 0.6 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Servicer OC", npn: "NPN-OC2", default_split_pct: 0.4 }
              as: AgencyAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct OC", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${pol_id}", producer_id: "${wp_id}", split_pct: 0.6, role: "WRITING", expected_policy_version: "${pol_v1}" }
              as: Producer
              as_user_id: "${wp_id}"
          trigger:
            - call: "POST /commission-splits"
              payload: { policy_id: "${pol_id}", producer_id: "${sp_id}", split_pct: 0.4, role: "SERVICING", expected_policy_version: "${pol_v1}" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (first split bumped Policy.version to 2; second still sent expected_policy_version of the version-1 view)"

      - name: occ_ledger_post_stale_trust_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[ledger-post-stale-trust]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential POST /trust-accounts/{id}/entries: the first advances TrustAccount.version 1->2; the second carrying the stale version-1 expected value returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["a trust account at version 1"]
          setup_api_calls:
            - call: "POST /trust-accounts"
              payload: { name: "Trust OC", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v1: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 1000000, expected_trustaccount_version: "${trust_v1}" }
              as: TrustAccountant
          trigger:
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "PREMIUM_RECEIPT", amount_cents: 500000, expected_trustaccount_version: "${trust_v1}" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (first entry bumped TrustAccount.version to 2; second still sent version-1 expected value)"

      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - "entities.TrustAccount.fields.version"
          - "endpoints"
        distinguishing_aspect: "Posting two entries each carrying the freshly re-read version succeeds; TrustAccount.version increments by 1 per post (1->2->3)."
        test_recipe:
          setup: ["a trust account at version 1"]
          setup_api_calls:
            - call: "POST /trust-accounts"
              payload: { name: "Trust OK", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v1: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 1000000, expected_trustaccount_version: "${trust_v1}" }
              as: TrustAccountant
            - call: "GET /trust-accounts/${trust_id}"
              payload: {}
              as: TrustAccountant
              captures: { trust_v2: $.data.version }
          trigger:
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "PREMIUM_RECEIPT", amount_cents: 500000, expected_trustaccount_version: "${trust_v2}" }
              as: TrustAccountant
            - call: "GET /trust-accounts/${trust_id}"
              payload: {}
              as: TrustAccountant
              captures: { trust_v3: $.data.version, bal: $.data.balance_cents }
          assert:
            - "TrustAccount.${trust_id}.version == 3 (incremented once per successful post)"
            - "TrustAccount.${trust_id}.balance_cents == 1500000"

      - name: account_count_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Account.fields.active_policy_count"
          - "state_machines.Policy.BOUND_to_ACTIVE"
        distinguishing_aspect: "Account.active_policy_count is 0 before activation and recomputes to 1 after the policy reaches ACTIVE (derived-field reconciliation on child state change)."
        test_recipe:
          setup: ["a compliant producer; an account with one policy bound but not yet active; clock 2026-06-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Car DF", naic_code: "24242", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto DF", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod DF", npn: "NPN-DF1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${wp_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${wp_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct DF", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_v2: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { count_before: $.data.active_policy_count }
          trigger:
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v2}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { count_after: $.data.active_policy_count }
          assert:
            - "Account.${acct_id}.active_policy_count == 0 before activation (BOUND not counted)"
            - "Account.${acct_id}.active_policy_count == 1 after activation"

      - name: cascade_policy_cancel_trust_balance
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Policy.ACTIVE_to_CANCELLED"
          - "entities.TrustAccount.fields.balance_cents"
        excluded_because:
          difficulty_instance: transitive_cascade / policy_cancel_cascade_depth2
          rationale: "The cancel -> ledger entry -> balance recompute cascade is asserted by the named §1.8 instance."

  # =================================================================
  # Consistency Model
  # =================================================================
