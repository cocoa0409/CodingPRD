# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1704: Cleanroom Assembly & Environmental Monitoring
# Enumerative breadth coverage of §1.1–§1.7 claims NOT already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections and claim_type values come
# from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, retrieval, listing, defaults, required
  # fields, type constraints, not-found.
  # ===========================================================================
  - section: entities
    instances:
      - name: create_room_applies_system_defaults
        claim_type: creation
        grounds:
          - "entities.Cleanroom"
        distinguishing_aspect: "POST /cleanroom/rooms with valid input returns 201; system fields certification_status=UNCERTIFIED, environment_posture=IN_CONTROL, status=ACTIVE, version=1 are applied regardless of any client attempt to set them."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_e1: $.data.id }
          assert:
            - "Cleanroom.${room_e1}.certification_status == UNCERTIFIED"
            - "Cleanroom.${room_e1}.environment_posture == IN_CONTROL"
            - "Cleanroom.${room_e1}.status == ACTIVE"
            - "Cleanroom.${room_e1}.version == 1"
            - "Cleanroom.${room_e1}.certified_at == null"

      - name: create_room_rejects_action_limit_not_above_alert
        claim_type: type_constraints
        grounds:
          - "entities.Cleanroom"
          - "validations[priority=9]"
        distinguishing_aspect: "particle_action_limit <= particle_alert_limit violates the structural constraint action_limit > alert_limit; ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E2", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 300000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { err_e2: $.data.error_id }
          assert:
            - "HTTP 400 error_id == ERR_INVALID_REQUEST  (action_limit must be strictly > alert_limit)"

      - name: create_room_rejects_invalid_iso_class_enum
        claim_type: type_constraints
        grounds:
          - "entities.Cleanroom.fields.iso_class"
          - "validations[priority=9]"
        distinguishing_aspect: "iso_class outside {ISO_5, ISO_6, ISO_7, ISO_8} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E3", iso_class: "ISO_4", particle_alert_limit: 1, particle_action_limit: 2, viable_alert_limit: 1, viable_action_limit: 2, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { err_e3: $.data.error_id }
          assert:
            - "HTTP 400 error_id == ERR_INVALID_REQUEST  (ISO_4 not a member of the enum)"

      - name: get_room_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Cleanroom"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /cleanroom/rooms/{uuid-that-does-not-exist} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cleanroom/rooms/00000000-0000-0000-0000-000000000000"
              as: QualityAssurance
              captures: { err_e4: $.data.error_id }
          assert:
            - "HTTP 404 error_id == ERR_NOT_FOUND"

      - name: cleaning_program_default_required_consecutive_passes
        claim_type: defaults
        grounds:
          - "entities.CleaningValidationProgram.fields.required_consecutive_passes"
        distinguishing_aspect: "Omitting required_consecutive_passes applies the default 3."
        test_recipe:
          setup: ["Room CR-E5 exists"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E5", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_e5: $.data.id }
          trigger:
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_e5}", method_code: "MOP-D" }
              as: QualityAssurance
              captures: { prog_e5: $.data.id }
          assert:
            - "CleaningValidationProgram.${prog_e5}.required_consecutive_passes == 3  (default applied)"
            - "CleaningValidationProgram.${prog_e5}.status == DRAFT"
            - "CleaningValidationProgram.${prog_e5}.consecutive_pass_count == 0"

      - name: sample_result_value_negative_rejected
        claim_type: type_constraints
        grounds:
          - "entities.EnvironmentalSample.fields.result_value"
          - "validations[priority=9]"
        distinguishing_aspect: "result_value < 0 violates the >= 0 constraint; ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Room CR-E6 with ACTIVE PARTICLE point SP-E6"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E6", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_e6: $.data.id }
            - call: "POST /cleanroom/rooms/${room_e6}/sampling-points"
              payload: { point_code: "SP-E6", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_e6: $.data.id }
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_e6}", result_value: -1, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { err_e6: $.data.error_id }
          assert:
            - "HTTP 400 error_id == ERR_INVALID_REQUEST  (result_value must be >= 0)"

      - name: audit_window_end_not_after_start_rejected
        claim_type: type_constraints
        grounds:
          - "entities.CustomerAudit"
          - "validations[priority=9]"
        distinguishing_aspect: "window_end <= window_start violates the audit window constraint; ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Room CR-E7 exists"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E7", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_e7: $.data.id }
          trigger:
            - call: "POST /cleanroom/audits"
              payload: { customer_code: "CUST-E7", cleanroom_id: "${room_e7}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: QualityAssurance
              captures: { err_e7: $.data.error_id }
          assert:
            - "HTTP 400 error_id == ERR_INVALID_REQUEST  (window_end must be > window_start)"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, initial states,
  # terminal lockdown, precondition enforcement, side effects.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: entry_exit_happy_path
        claim_type: valid_transition
        grounds:
          - "entities.EntryLog"
        distinguishing_aspect: "Entry then exit sets entered_at on create and exited_at on exit; both timestamps are server-stamped."
        test_recipe:
          setup: ["Room CR-S1 certified + VALIDATED cleaning + posture IN_CONTROL; personnel QUALIFIED"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-S1", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_s1: $.data.id, room_s1_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_s1}", method_code: "MOP-S1", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_s1: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_s1}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_s1}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_s1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_s1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_s1}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_s1_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-S1", full_name: "Ess One", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_s1: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_s1}", cleanroom_id: "${room_s1}" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/entry-logs"
              payload: { personnel_id: "${pers_s1}", cleanroom_id: "${room_s1}" }
              as: ProductionOperator
              as_user_id: "op-s1"
              captures: { entry_s1: $.data.id }
            - call: "POST /cleanroom/entry-logs/${entry_s1}/exit"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s1"
          assert:
            - "EntryLog.${entry_s1}.entered_at != null"
            - "EntryLog.${entry_s1}.exited_at != null after exit call"

      - name: traveler_complete_by_different_user_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AssemblyTraveler"
          - "errors[ERR_TRAVELER_PERFORMER_MISMATCH]"
        distinguishing_aspect: "Completer X-User-ID must equal performed_by_user_id; a different operator completing the step gets ERR_TRAVELER_PERFORMER_MISMATCH (409)."
        test_recipe:
          setup: ["Room CR-S2 certified+cleaning+IN_CONTROL; personnel QUALIFIED; batch B-S2 OPEN with traveler started by op-s2a"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-S2", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_s2: $.data.id, room_s2_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_s2}", method_code: "MOP-S2", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_s2: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_s2}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_s2}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_s2: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_s2}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_s2}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_s2_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-S2", full_name: "Ess Two", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_s2: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_s2}", cleanroom_id: "${room_s2}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_s2}", batch_number: "B-S2", product_code: "PWB-S2" }
              as: ProductionOperator
              as_user_id: "op-s2a"
              captures: { batch_s2: $.data.id }
            - call: "POST /cleanroom/batches/${batch_s2}/travelers"
              payload: { step_sequence: 1, step_description: "Inspect" }
              as: ProductionOperator
              as_user_id: "op-s2a"
              captures: { trav_s2: $.data.id }
            - call: "POST /cleanroom/travelers/${trav_s2}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s2a"
          trigger:
            - call: "POST /cleanroom/travelers/${trav_s2}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s2b"
              captures: { err_s2: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_TRAVELER_PERFORMER_MISMATCH  (op-s2b != performed_by op-s2a)"
            - "AssemblyTraveler.${trav_s2}.status == IN_PROGRESS  (unchanged)"

      - name: traveler_step_order_enforced
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AssemblyTraveler"
          - "errors[ERR_TRAVELER_STEP_ORDER]"
        distinguishing_aspect: "Starting step 2 while step 1 is still PENDING returns ERR_TRAVELER_STEP_ORDER; completing step 1 first then allows step 2."
        test_recipe:
          setup: ["Room CR-S3 certified+cleaning+IN_CONTROL; QUALIFIED personnel; batch B-S3 with travelers seq 1 and 2"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-S3", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_s3: $.data.id, room_s3_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_s3}", method_code: "MOP-S3", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_s3: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_s3}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_s3}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_s3: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_s3}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_s3}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_s3_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-S3", full_name: "Ess Three", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_s3: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_s3}", cleanroom_id: "${room_s3}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_s3}", batch_number: "B-S3", product_code: "PWB-S3" }
              as: ProductionOperator
              as_user_id: "op-s3"
              captures: { batch_s3: $.data.id }
            - call: "POST /cleanroom/batches/${batch_s3}/travelers"
              payload: { step_sequence: 1, step_description: "Step one" }
              as: ProductionOperator
              as_user_id: "op-s3"
              captures: { trav_s3a: $.data.id }
            - call: "POST /cleanroom/batches/${batch_s3}/travelers"
              payload: { step_sequence: 2, step_description: "Step two" }
              as: ProductionOperator
              as_user_id: "op-s3"
              captures: { trav_s3b: $.data.id }
          trigger:
            - call: "POST /cleanroom/travelers/${trav_s3b}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s3"
              captures: { err_s3: $.data.error_id }
            - call: "POST /cleanroom/travelers/${trav_s3a}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s3"
            - call: "POST /cleanroom/travelers/${trav_s3a}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s3"
            - call: "POST /cleanroom/travelers/${trav_s3b}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s3"
          assert:
            - "Starting step 2 first: HTTP 409 error_id == ERR_TRAVELER_STEP_ORDER"
            - "After step 1 COMPLETE, step 2 start succeeds: AssemblyTraveler.${trav_s3b}.status == IN_PROGRESS"

      - name: batch_release_happy_path_and_version_increment
        claim_type: valid_transition
        grounds:
          - "state_machines.AssemblyBatch"
          - "concurrency_rules[batch-release-stale-batch]"
        distinguishing_aspect: "A COMPLETE batch releases to RELEASED with OCC expected_batch_version matching; version increments by exactly 1."
        test_recipe:
          setup: ["Room CR-S4 certified+cleaning+IN_CONTROL; batch B-S4 COMPLETE (one traveler COMPLETE) with releaser != performer"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-S4", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_s4: $.data.id, room_s4_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_s4}", method_code: "MOP-S4", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_s4: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_s4}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_s4}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_s4: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_s4}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_s4}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_s4_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-S4", full_name: "Ess Four", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_s4: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_s4}", cleanroom_id: "${room_s4}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_s4}", batch_number: "B-S4", product_code: "PWB-S4" }
              as: ProductionOperator
              as_user_id: "op-s4"
              captures: { batch_s4: $.data.id }
            - call: "POST /cleanroom/batches/${batch_s4}/travelers"
              payload: { step_sequence: 1, step_description: "Only step" }
              as: ProductionOperator
              as_user_id: "op-s4"
              captures: { trav_s4: $.data.id }
            - call: "POST /cleanroom/travelers/${trav_s4}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s4"
            - call: "POST /cleanroom/travelers/${trav_s4}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s4"
            - call: "GET /cleanroom/batches/${batch_s4}"
              as: QualityAssurance
              captures: { batch_s4_v: $.data.version }
          trigger:
            - call: "POST /cleanroom/batches/${batch_s4}/release"
              payload: { expected_batch_version: "${batch_s4_v}" }
              as: QualityAssurance
              as_user_id: "qa-s4"
          assert:
            - "AssemblyBatch.${batch_s4}.status == COMPLETE before release"
            - "After release: AssemblyBatch.${batch_s4}.status == RELEASED"
            - "AssemblyBatch.${batch_s4}.version == ${batch_s4_v} + 1  (increments by exactly 1)"

      - name: release_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AssemblyBatch"
          - "errors[ERR_BATCH_NOT_COMPLETE]"
        distinguishing_aspect: "A RELEASED batch rejects a second release with ERR_BATCH_NOT_COMPLETE (409); terminal state is locked."
        test_recipe:
          setup: ["Room CR-S5 certified+cleaning+IN_CONTROL; batch B-S5 already RELEASED"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-S5", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_s5: $.data.id, room_s5_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_s5}", method_code: "MOP-S5", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_s5: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_s5}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_s5}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_s5: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_s5}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_s5}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_s5_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-S5", full_name: "Ess Five", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_s5: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_s5}", cleanroom_id: "${room_s5}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_s5}", batch_number: "B-S5", product_code: "PWB-S5" }
              as: ProductionOperator
              as_user_id: "op-s5"
              captures: { batch_s5: $.data.id }
            - call: "POST /cleanroom/batches/${batch_s5}/travelers"
              payload: { step_sequence: 1, step_description: "Only step" }
              as: ProductionOperator
              as_user_id: "op-s5"
              captures: { trav_s5: $.data.id }
            - call: "POST /cleanroom/travelers/${trav_s5}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s5"
            - call: "POST /cleanroom/travelers/${trav_s5}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-s5"
            - call: "GET /cleanroom/batches/${batch_s5}"
              as: QualityAssurance
              captures: { batch_s5_v: $.data.version }
            - call: "POST /cleanroom/batches/${batch_s5}/release"
              payload: { expected_batch_version: "${batch_s5_v}" }
              as: QualityAssurance
              as_user_id: "qa-s5"
            - call: "GET /cleanroom/batches/${batch_s5}"
