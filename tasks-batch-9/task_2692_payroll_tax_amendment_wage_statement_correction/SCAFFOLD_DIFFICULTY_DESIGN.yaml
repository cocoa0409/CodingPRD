            - "AmendedReturn.${ar1_id}.interest_cents == 219"
            - "AmendedReturn.${ar1_id}.penalty_cents == 10500"
            - "while ar1 is PREPARED: CorrectionCase.${case_id}.total_exposure_cents == 210719 (200000 + 219 + 10500)"
            - "AmendedReturn.${ar2_id}.days_late == 6"
            - "AmendedReturn.${ar2_id}.interest_cents == 263"
            - "AmendedReturn.${ar2_id}.penalty_cents == 15000"
            - "AmendedReturn.${ar2_id}.voluntary_reduction_applied == true"
            - "AmendedReturn.${ar2_id}.penalty_cents - AmendedReturn.${ar1_id}.penalty_cents == 4500, the whole step coming from the FTD leg (4000 -> 10000 gross) after the 2500 bps voluntary reduction"
            - "AmendedReturn.${ar1_id}.status == VOID and AmendedReturn.${ar2_id}.status == PREPARED"
            - "CorrectionCase.${case_id}.total_exposure_cents == 215263"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: amended_return_prepare_depends_on_agency_account_coverage
        grounds:
          - validations.priority_51.ERR_AGENCY_ACCOUNT_NOT_ACTIVE
          - state_machines.AgencyAccount.RETRO_PENDING_to_RETRO_ACTIVE
          - entities.AgencyAccount.fields.from_period_ordinal
          - entities.TaxAgency.fields.requires_registration
        distinguishing_aspect: |
          Entity pair AmendedReturn <- AgencyAccount. The AmendedReturn's own DRAFT -> PREPARED
          transition is blocked by the state AND the period coverage of a completely different
          entity: an ACTIVE registration exists for the same (employer, agency) but its period
          ordinals start one quarter after the case, so preparation is refused until a *second*,
          retroactive registration is activated into RETRO_ACTIVE over the case's own quarter.
          Nothing about the AmendedReturn changes between the failing and succeeding call.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "State agency NY-WH with requires_registration true, jurisdiction_code NY, 800 bps STATUTORY_DAILY, penalty_multiplier_bps 10000 and amendment_window_days 1095."
            - "Employer Acme with a 2025 Q1 register line of 1000000 taxable wage / 150000 withheld in jurisdiction NY, and a filed return (original_due_date 2025-04-30) reporting 1000000 / 100000, so the sole variance is WITHHOLDING 50000 and it is categorised."
            - "An ACTIVE AgencyAccount NY-0001 covering 2025 Q2 through 2025 Q4 (from_period_ordinal 8101, to_period_ordinal 8103) — a real registration that simply does not reach back to the case's own quarter, whose ordinal is 8100."
            - "A DRAFT amended return with accrual_through_date 2026-04-30 already exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-WH", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 2, effective_to_tax_year: 2025, effective_to_quarter: 4 }
              as: PlatformAdmin
              captures: { acct1_id: "$.data.id" }
            - call: "POST /agency-accounts/${acct1_id}/activate"
              payload: { account_number: "NY-0001" }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NY" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, form_code: "NY-45X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 100000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "WITHHOLDING" }
              as: PayrollAnalyst
              captures: { d_wh_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_wh_id}/categorize"
              payload: { category: "WITHHOLDING", root_cause_code: "RATE_TABLE_STALE" }
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "NY-45X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver}" }
              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
          trigger:
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 1, effective_to_tax_year: 2025, effective_to_quarter: 1, retroactive: true }
              as: PlatformAdmin
              captures: { acct2_id: "$.data.id" }
            - call: "POST /agency-accounts/${acct2_id}/activate"
              payload: { account_number: "NY-0000" }
              as: PlatformAdmin
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
          assert:
            - "the first prepare returns HTTP 422 with error_id == ERR_AGENCY_ACCOUNT_NOT_ACTIVE"
            - "after the first prepare AmendedReturn.${ar_id}.status is still DRAFT and prepared_by_user_id == null"
            - "after the first prepare CorrectionCase.${case_id}.filing_status is still FILING_PENDING and total_exposure_cents == 0"
            - "the retroactive AgencyAccount is created in registration_status == RETRO_PENDING with from_period_ordinal == 8100 and to_period_ordinal == 8100"
            - "creating it is accepted, not an overlap, because 8100 == 8101 - 1 is adjacent to the existing NY-0001 range"
            - "after activation AgencyAccount.${acct2_id}.registration_status == RETRO_ACTIVE with account_number == NY-0000 and activated_at == 2026-04-30T00:00:00Z"
            - "the second prepare returns HTTP 200 with AmendedReturn.${ar_id}.status == PREPARED"
            - "AmendedReturn.${ar_id}.days_late == 365, interest_cents == 4000, penalty_cents == 9375"
            - "CorrectionCase.${case_id}.filing_status == FILING_IN_PROGRESS and total_exposure_cents == 63375"

      - name: case_close_depends_on_every_remediation_reaching_verified
        grounds:
          - validations.priority_52.ERR_REMEDIATION_NOT_VERIFIED
          - state_machines.ControlRemediation.SUBMITTED_FOR_VERIFICATION_to_VERIFIED
          - state_machines.CorrectionCase.REMEDIATION_PENDING_to_CLOSED
        distinguishing_aspect: |
          A different entity pair — CorrectionCase <- ControlRemediation — and a different shape of
          dependency: the blocker is a CHILD that the system itself created, in a state the closer
          cannot reach directly. The case sits in REMEDIATION_PENDING with everything else settled;
          closing is refused purely because the auto-created remediation is OPEN, and it takes an
          assignment plus an independent verification (a third party's X-User-ID) before the parent
          may become terminal.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "The full 2025 Q1 federal case with three categorised 250000-cent discrepancies, whose amended return has been prepared, signed, submitted and ACCEPTED — so the case is in status REMEDIATION_PENDING, filing_status FILING_COMPLETE, statement_status STMT_NOT_REQUIRED, and the join auto-created exactly one ControlRemediation in status OPEN with owner_user_id null."
            - "No wage repayment exists for the case, so the repayment settlement precondition is already satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
