      - name: weight_mass_supersede_conservation
        grounds:
          - calculations.response_weight
          - entities.WeightSnapshot.fields.weight_mass
          - state_machines.WeightSnapshot.FINALIZED_to_SUPERSEDED
          - state_machines.SurveyWave.WEIGHTED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: normalized weight mass. Re-weighting a WEIGHTED wave
          supersedes the FINALIZED snapshot and reverts the wave to CLOSED, yet the
