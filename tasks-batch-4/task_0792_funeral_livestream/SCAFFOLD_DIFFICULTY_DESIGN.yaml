  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_booking_conflicts_within_turnaround_buffer
        grounds:
          - validations[priority=9]
          - entities.Venue.fields.turnaround_minutes
          - state_machines.VenueBooking.HELD_to_CONFIRMED
        distinguishing_aspect: "Venue interval semantics (buffered): a second booking starting 15 minutes after the first ends is rejected with ERR_VENUE_TIME_CONFLICT because the 30-minute turnaround buffer, applied on both sides, overlaps it — a gap smaller than the buffer collides."
        test_recipe:
          setup:
            - "Venue with turnaround_minutes=30; booking A 10:00-12:00 HELD on order A; a second order B seeks 12:15-13:00 on the same venue."
          setup_api_calls:
