              as: ProgramDirector
              captures: { c_insp54_id: $.data.id }
          trigger:
            - call: "GET /mining/permits/${c_permit54_id}"
              as: Operator
              as_user_id: "${c_op54_id}"
              captures: { c_r_op: $.data.status }
            - call: "GET /mining/permits/${c_permit54_id}"
              as: PermitReviewer
              captures: { c_r_pr: $.data.status }
            - call: "GET /mining/permits/${c_permit54_id}"
