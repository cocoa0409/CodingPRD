        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any endpoint called without X-User-Role / X-User-ID headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["empty DB (headers are the only variable)"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/productions"
              as: StuntCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Request is sent WITHOUT X-User-Role and X-User-ID headers: err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: val_existence_beats_state_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_SEQUENCE_NOT_FOUND]"]
        distinguishing_aspect: "On a STOPPED production, cancelling a non-existent sequence id returns 404 ERR_SEQUENCE_NOT_FOUND — existence (p3) is evaluated before the posture gate (p5)."
        test_recipe:
          setup: ["production activated then stopped"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
