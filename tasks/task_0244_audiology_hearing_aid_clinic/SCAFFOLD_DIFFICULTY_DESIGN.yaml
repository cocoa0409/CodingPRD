  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_trial_requires_finalized_evaluation
        grounds:
          - state_machines.FittingOrder.DRAFT_to_TRIAL
          - state_machines.HearingEvaluation.DRAFT_to_FINALIZED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair FittingOrder->HearingEvaluation: order's DRAFT->TRIAL requires the referenced
          HearingEvaluation.status == FINALIZED; a DRAFT evaluation blocks the trial.
        test_recipe:
          setup:
            - "Clock 2026-03-01. A DRAFT evaluation ptag=50 (NOT finalized). A DRAFT order referencing it."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
