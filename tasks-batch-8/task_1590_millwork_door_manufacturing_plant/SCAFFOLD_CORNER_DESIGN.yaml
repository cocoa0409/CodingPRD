      - name: invalid_window_inputs_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3.4]", "errors[ERR_INVALID_SLOT_HOURS]", "errors[ERR_INVALID_CURE_WINDOW]", "errors[ERR_INVALID_TRIP_DATES]"]
        distinguishing_aspect: "Payload window checks fire at priority 3.4 (before state): slot end_hour <= start_hour, batch cure window < 4 hours, and trip arrival earlier than departure are all 400s — the batch case fires even while the order is still DRAFT (payload beats state)."
        test_recipe:
