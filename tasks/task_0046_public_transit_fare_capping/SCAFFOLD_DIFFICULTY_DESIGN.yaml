  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_week_beats_insufficient_funds_state_vs_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_WEEK_CLOSED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair state (ERR_WEEK_CLOSED, priority 7) vs business_fiscal (ERR_INSUFFICIENT_FUNDS,
          priority 14): a settle against a CLOSED week with an underfunded source returns ERR_WEEK_CLOSED
          (lower priority number wins), never ERR_INSUFFICIENT_FUNDS.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 500, weekly 2500."
            - "Rider R9; FundingSource F9 loaded 100 (below 300)."
            - "FareWeek W1 week_start 2026-06-01 zone ZONE_X; Tap T1 09:00 PENDING; then week CLOSED."
