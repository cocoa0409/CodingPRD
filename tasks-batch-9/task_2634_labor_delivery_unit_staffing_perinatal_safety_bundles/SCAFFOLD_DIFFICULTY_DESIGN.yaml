  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Two DIFFERENT modes of the §0.5 menu:
  #   instance 1 = mode (a) four interacting inputs, nested min/max, not linear
  #   instance 2 = mode (c) circular dependency resolved by a pinned order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: charge_slot_nested_min_max_with_tier_iv_focus_penalty_yields_1_0
        grounds:
          - calculations.staff_capacity_units
          - calculations.care_assignment_unit_debit
          - calculations.encounter_required_coverage_units
          - calculations.unit_posture_derivation
          - entities.StaffMember.fields.capacity_units
          - entities.ShiftAssignment.fields.capacity_units_effective
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.LaborEncounter.fields.magnesium_infusion_active
          - state_machines.SafetyBundleActivation.ACTIVATED_to_STAGE_1_IN_PROGRESS
          - state_machines.LaborEncounter.UNASSIGNED_to_RATIO_COVERED
          - validations[priority=15]
        distinguishing_aspect: |
          MODE (a). staff_capacity_units combines FOUR inputs through a nested
          min and an outer max, so no linear formula reproduces it:
          raw = min(BASE_CAPACITY_UNITS[role_slot], CERT_CAP_UNITS[cert]) then
          capacity = max(0.0, raw - CHARGE admin offset - TIER_IV focus penalty).
          The fixture makes every term bite at once and makes the min the
          BINDING cap: promoting the nurse from BASIC (cap 3.0) to ADVANCED
          (cap 4.0) leaves raw at 3.0 because BASE_CAPACITY_UNITS[CHARGE] is
          3.0 — a linear or additive reading would raise capacity here. At the
          same time her ACTIVE CareAssignment's encounter has just become
          TIER_IV (MAGNESIUM_LOADED sets magnesium_infusion_active), so the
          focus penalty switches on: 3.0 - 1.0 - 1.0 = 1.0. Crucially the
          already-frozen ShiftAssignment.capacity_units_effective must stay
          2.0 (min(3.0, 3.0) - 1.0 - 0.0 at activation, when no TIER_IV
          coverage existed) and must NOT be retro-recomputed to 1.0. The same
          TIER_IV flip re-prices the RATIO_SHARED row from
          round_half_up(1.5*0.5, 1) = 0.8 to 4.0*0.5 = 2.0, landing the shift
          EXACTLY on its 2.0 frozen capacity, which is the inclusive boundary
          of validation 15 and therefore not a breach of the covering shift.
        test_recipe:
          setup: |
            One unit with one LDR bed and one RN whose fetal_monitoring_cert_level
            is BASIC, holding an ACTIVE CHARGE shift activated at
            2026-08-01T08:00:00Z (capacity_units_effective frozen at 2.0). A
            42-week multip with a prior cesarean is admitted, so her baseline
            acuity_tier is TIER_II and, in ANTEPARTUM, required_coverage_units is
            round_half_up(1.5 * 0.5, 1) = 0.8; the CHARGE nurse takes her on a
            RATIO_SHARED CareAssignment priced at 0.8, which fits inside 2.0 and
            leaves the encounter RATIO_COVERED. A SEVERE_HYPERTENSION bundle is
            then activated and its MAGNESIUM_LOADED row (step_sequence 2,
            stage_gate 1 — completable while the activation is still ACTIVATED,
            and no §1.2 precondition orders stage-1 rows among themselves) is
            completed first, which sets magnesium_infusion_active and drives the
            encounter to TIER_IV.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Ellsworth Regional LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Corinne Adeyemi RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_charge}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T07:00:00Z", shift_end_utc: "2026-08-01T17:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_charge: $.data.id }
            - call: POST /shift-assignments/${sh_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { cap_effective_at_activation: $.data.capacity_units_effective }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-CAP-2201", parity: 2, gestational_age_weeks: 42, prior_cesarean: true, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_id: $.data.id, e_v0: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${e_id}", shift_assignment_id: "${sh_charge}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${e_v0}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { ca_id: $.data.id, debit_tier_ii: $.data.acuity_units_consumed }
            - call: GET /staff-members/${s_charge}
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { cap_units_basic_no_focus: $.data.capacity_units }
            - call: POST /bundle-activations
              payload: { encounter_id: "${e_id}", bundle_type: "SEVERE_HYPERTENSION", activation_trigger: "BP_THRESHOLD", systolic_mmhg: 168, diastolic_mmhg: 114 }
              as: BedsideNurse
              as_user_id: "${s_charge}"
              captures: { activation_id: $.data.id }
            - call: GET /bundle-activations/${activation_id}/checklist-items
              payload: { step_code: "MAGNESIUM_LOADED" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { mag_item_id: "$.data[0].id" }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T08:20:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/checklist-items/${mag_item_id}/complete
              payload: { completed_at: "2026-08-01T08:20:00Z", performed_by_staff_id: "${s_charge}" }
              as: BedsideNurse
              as_user_id: "${s_charge}"
          trigger:
            - call: PATCH /staff-members/${s_charge}
              payload: { fetal_monitoring_cert_level: "ADVANCED" }
              as: PerinatalSafetyOfficer
              captures: { cap_units_advanced_with_focus: $.data.capacity_units }
          assert:
            - "StaffMember.${s_charge}.fetal_monitoring_cert_level == ADVANCED"
            - "StaffMember.${s_charge}.capacity_units == 1.0"
            - "ShiftAssignment.${sh_charge}.capacity_units_effective == 2.0"
            - "ShiftAssignment.${sh_charge}.assigned_acuity_load_units == 2.0"
            - "CareAssignment.${ca_id}.acuity_units_consumed == 2.0"
            - "CareAssignment.${ca_id}.status == ACTIVE"
            - "CareAssignment.${ca_id}.coverage_mode == RATIO_SHARED"
            - "LaborEncounter.${e_id}.acuity_tier == TIER_IV"
            - "LaborEncounter.${e_id}.magnesium_infusion_active == true"
            - "LaborEncounter.${e_id}.one_to_one_required == true"
            - "LaborEncounter.${e_id}.required_coverage_units == 4.0"
            - "LaborEncounter.${e_id}.assigned_coverage_units == 2.0"
            - "SafetyBundleActivation.${activation_id}.status == STAGE_1_IN_PROGRESS"
            - "SafetyBundleActivation.${activation_id}.highest_stage_reached == 1"
            - "BundleChecklistItem.${mag_item_id}.status == COMPLETED"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 2.0"
            - "ObstetricUnit.${unit_id}.staffing_posture == RATIO_STRAINED"

      - name: posture_buffer_projection_cycle_pinned_order_freezes_645_beside_675
        grounds:
          - calculations.unit_posture_derivation
          - calculations.induction_capacity_projection
          - calculations.induction_bed_minute_conservation
          - calculations.induction_priority_class
          - calculations.encounter_required_coverage_units
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
          - entities.ObstetricUnit.fields.held_bed_minutes_by_day
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - state_machines.InductionBooking.REQUESTED_to_CAPACITY_HELD
          - state_machines.InductionBooking.CAPACITY_HELD_to_CANCELLED
          - validations[priority=15]
        distinguishing_aspect: |
          MODE (c). These fields form a genuine cycle:
          coverage_deficit_units -> staffing_posture -> turnover_buffer_minutes
          -> projected_occupancy_minutes -> the day's held bed-minutes -> the
          validation-15 capacity test -> whether a hold is bumped -> back to
          staffing_posture. §1.3 breaks the cycle with TWO pinned rules, and this
          instance makes them contradict any other order: (i) inside
          unit_posture_derivation, posture is computed FIRST and
          turnover_buffer_minutes is derived AFTER it (45 only when OPEN, else
          75), and the new buffer never feeds back into posture in the same
          request; (ii) inside induction_capacity_projection,
          projected_occupancy_minutes is FROZEN at hold time as
          expected_labor_minutes + the buffer as it stood then. Booking B1 is
          held while the unit is OPEN, so it freezes at 600 + 45 = 645. An
          uncovered ANTEPARTUM encounter then pushes coverage_deficit_units to
          0.5, flipping posture to RATIO_STRAINED and the buffer to 75, so B2
          freezes at 600 + 75 = 675 on the SAME day. Cancelling B1 must
          decrement held_bed_minutes_by_day by EXACTLY 645, leaving 675 — an
          implementation that recomputes the projection from the CURRENT buffer
          would subtract 675 and leave 645 (or 0 and drift the map), and one
          that lets the fresh 75-minute buffer feed back into the posture branch
          would never freeze 645 at all.
        test_recipe:
          setup: |
            One unit with 3 LDR beds and max_daily_induction_bed_minutes 1400, so
            both holds fit the 2026-08-05 budget (645 + 675 = 1320 <= 1400,
            inclusive) and available_ldr_beds never reaches 0 (which would force
            DIVERT and block the second hold). B1 (POST_DATES_41W, therefore
            MEDICALLY_INDICATED, 600 expected labor minutes) is held on LDR-01
            while the unit is still OPEN. A walk-in encounter with no
            CareAssignment is then admitted: TIER_I in ANTEPARTUM demands
            round_half_up(1.0 * 0.5, 1) = 0.5 units against 0.0 assigned, so
            coverage_deficit_units becomes 0.5, which is > 0.0 but < 4.0 and
            therefore RATIO_STRAINED — the posture tier that still permits a
            MEDICALLY_INDICATED hold. B2 (PREECLAMPSIA, also MEDICALLY_INDICATED,
            600 expected labor minutes) is then held on LDR-02 under the 75-minute
            buffer. Each hold reads a freshly captured unit.version because the
            intervening encounter creation bumps it.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-04T09:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Fairmount Birthing Center LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 1400 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id, posture_at_creation: $.data.staffing_posture }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-03", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_3: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Devon Mbeki RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              captures: { unit_v1: $.data.version, buffer_while_open: $.data.turnover_buffer_minutes }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-B1", gestational_age_weeks: 41, indication_code: "POST_DATES_41W", requested_start_utc: "2026-08-05T08:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              captures: { b1_id: $.data.id, b1_priority: $.data.priority_class }
            - call: POST /induction-bookings/${b1_id}/hold-capacity
              payload: { bed_id: "${bed_ldr_1}", expected_unit_version: "${unit_v1}" }
              as: PatientAccessCoordinator
              captures: { b1_projected: $.data.projected_occupancy_minutes, b1_hold_expires: $.data.hold_expires_at }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-WALKIN-77", parity: 0, gestational_age_weeks: 39, prior_cesarean: false, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_id: $.data.id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              captures: { unit_v2: $.data.version, buffer_while_strained: $.data.turnover_buffer_minutes }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-B2", gestational_age_weeks: 37, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-05T20:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              captures: { b2_id: $.data.id, b2_priority: $.data.priority_class }
            - call: POST /induction-bookings/${b2_id}/hold-capacity
              payload: { bed_id: "${bed_ldr_2}", expected_unit_version: "${unit_v2}" }
              as: PatientAccessCoordinator
              captures: { b2_projected: $.data.projected_occupancy_minutes }
          trigger:
            - call: POST /induction-bookings/${b1_id}/cancel
              payload: {}
              as: PatientAccessCoordinator
              captures: { b1_status_after_cancel: $.data.status }
          assert:
            - "InductionBooking.${b1_id}.projected_occupancy_minutes == 645"
            - "InductionBooking.${b2_id}.projected_occupancy_minutes == 675"
            - "InductionBooking.${b1_id}.priority_class == MEDICALLY_INDICATED"
            - "InductionBooking.${b2_id}.priority_class == MEDICALLY_INDICATED"
            - "InductionBooking.${b1_id}.status == CANCELLED"
            - "InductionBooking.${b1_id}.bed_id == null"
            - "InductionBooking.${b2_id}.status == CAPACITY_HELD"
            - "Bed.${bed_ldr_1}.status == AVAILABLE"
            - "Bed.${bed_ldr_1}.held_booking_id == null"
            - "Bed.${bed_ldr_2}.status == HELD"
            - "Bed.${bed_ldr_2}.held_booking_id == ${b2_id}"
            - "ObstetricUnit.${unit_id}.held_bed_minutes_by_day[2026-08-05] == 675"
            - "ObstetricUnit.${unit_id}.committed_bed_minutes_by_day[2026-08-05] == 0"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.5"
            - "ObstetricUnit.${unit_id}.staffing_posture == RATIO_STRAINED"
            - "ObstetricUnit.${unit_id}.turnover_buffer_minutes == 75"
            - "LaborEncounter.${e_id}.required_coverage_units == 0.5"
            - "LaborEncounter.${e_id}.assigned_coverage_units == 0.0"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # instance 1 = PARALLEL AXES + cycle on LaborEncounter (labor_phase x staffing_state)
  # instance 2 = CYCLE on InductionBooking (REQUESTED -> HELD -> CONFIRMED -> BUMPED -> REQUESTED)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: encounter_staffing_axis_breaches_twice_while_phase_axis_advances_to_active_first_stage
        grounds:
          - state_machines.LaborEncounter.labor_phase
          - state_machines.LaborEncounter.staffing_state
          - state_machines.LaborEncounter.ANTEPARTUM_to_LATENT
          - state_machines.LaborEncounter.LATENT_to_ACTIVE_FIRST_STAGE
          - state_machines.LaborEncounter.RATIO_COVERED_to_COVERAGE_BREACH
          - state_machines.LaborEncounter.COVERAGE_BREACH_to_RATIO_COVERED
          - calculations.care_assignment_unit_debit
          - calculations.encounter_required_coverage_units
          - calculations.acuity_load_conservation
          - concurrency_rules[care-assignment-create-stale-encounter]
        distinguishing_aspect: |
          LaborEncounter declares TWO independent state fields, and each appears
          in the other's preconditions: labor_phase cannot advance unless
          staffing_state is covered, while staffing_state cycles
          RATIO_COVERED -> COVERAGE_BREACH -> RATIO_COVERED an unbounded number of
          times WITHOUT labor_phase moving. This instance breaches and repairs
          axis 2 twice — once in LATENT and once in ACTIVE_FIRST_STAGE — while
          axis 1 walks ANTEPARTUM -> LATENT -> ACTIVE_FIRST_STAGE, and the
          re-pricing of the SAME encounter differs at every stop because the
          phase multiplier changes under it: 1.0*0.5 = 0.5 in ANTEPARTUM,
          1.0*1.0 = 1.0 in LATENT, and 1.5*1.5 = 2.25 -> round_half_up ->
          2.3 in ACTIVE_FIRST_STAGE (where the tier floor rises to TIER_II).
          A single-state-field implementation cannot hold this shape: it either
          refuses the mid-phase release (there is no error for it — the breach is
          RECORDED, not rejected), or it drives the encounter to RELEASED
          instead of COVERAGE_BREACH because it ignores that RELEASED is legal
          only from POSTPARTUM_RECOVERY onward, or it forgets to re-price and
          leaves assigned_coverage_units at 1.0 against a 2.3 requirement.
        test_recipe:
          setup: |
            One unit with two LDR beds, a CHARGE nurse (the on-case identity for
            the fetal assessment) and a BEDSIDE nurse whose ACTIVE shift freezes
            capacity_units_effective at min(4.0, 4.0) - 0.0 - 0.0 = 4.0, so all
            three successive RATIO_SHARED debits fit. One NTSV-eligible encounter
            (parity 0, 39 weeks, singleton, vertex, no prior cesarean) is admitted
            into LDR-01. Each CareAssignment create carries the freshly read
            encounter.version because every release and every advance bumps it,
            which is exactly what concurrency rule
            care-assignment-create-stale-encounter guards.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-10T07:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Copperfield General LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Rosalind Achebe RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Yuki Tanabe RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_bed: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_charge}", role_slot: "CHARGE", shift_start_utc: "2026-08-10T06:00:00Z", shift_end_utc: "2026-08-10T16:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_charge: $.data.id }
            - call: POST /shift-assignments/${sh_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_bed}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-10T06:00:00Z", shift_end_utc: "2026-08-10T16:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_bed: $.data.id }
            - call: POST /shift-assignments/${sh_bed}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { bed_shift_capacity: $.data.capacity_units_effective }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-AXES-3310", parity: 0, gestational_age_weeks: 39, prior_cesarean: false, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
