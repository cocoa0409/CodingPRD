            - "posture_after == AUDIT_HOLD (level 2 — posture recomputed)"
            - "hold_err == ERR_SCHOOL_UNDER_AUDIT_HOLD (level 3 — posture gates mutation)"

      - name: grievance_ocr_escalation_posture_cascade
        grounds:
          - state_machines.Grievance.FORMAL_INVESTIGATION_to_ESCALATED_TO_OCR
