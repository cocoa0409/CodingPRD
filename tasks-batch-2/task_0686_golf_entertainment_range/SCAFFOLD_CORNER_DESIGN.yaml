        distinguishing_aspect: "Confirming with expected_bay_version one behind the bay's current version (after the bay was taken OUT_OF_SERVICE bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Venue+Bay+Member(wallet 50000) with a HOLD reservation; bay version captured at bay create (1). The confirm deliberately carries expected_bay_version one behind the current bay version to provoke the OCC stale-version rejection."]
