# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3038_real_estate_rent_based_franchise_economics
#
# 9 rules x 2 instances = 18 instances. Every instance grounds in §1.1–§1.7 of
# SCAFFOLD.yaml and is reachable from empty-DB via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rent_selected_base_binds_vs_percentage_binds_across_years
        grounds:
          - calculations.escalated_base_rent
          - calculations.selected_rent
          - entities.RentCharge.fields.selected_rent_cents
        distinguishing_aspect: |
          Same sublease, same inputs shape, two years: in year 1 the percentage
          variant binds (32,000,000 > 2,448,000) while in year 2 the base
          variant binds (2,496,960 > 2,400,000) — the greater-of rule picks
          DIFFERENT arms for different billing years on one contract.
        test_recipe:
          setup:
            - "Clock at 2027-04-01T00:00:00Z (default 2026-09-01 moved forward)."
            - "Site S1 FEE_SIMPLE; Operator O1 APPROVED (strong capacity); Store ST1 OPEN with an ACTIVE agreement (occ 60%, roy 4%, ad 2%) and an ACTIVE sublease base 2,400,000, pct 8%, escalation 2% on Apr 1, term 2026-04-01..2031-03-31."
            - "Twelve LOCKED sales reports for Apr 2027..Mar 2028 totalling 400,000,000; twelve LOCKED reports for Apr 2028..Mar 2029 totalling 30,000,000."
          setup_api_calls:
            - call: "POST /franchise-system/_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise-system/sites"
              payload: { site_code: "S1", address: "1 Main St", acquisition_type: "FEE_SIMPLE" }
              as: FranchisorAdmin
              captures: { site1: $.data.id }
            - call: "POST /franchise-system/operators"
              payload: { legal_name: "Op One LLC", fy_net_worth_cents: 400000000, fy_operating_income_cents: 100000000 }
              as: FranchisorAdmin
              captures: { op1: $.data.id }
            - call: "POST /franchise-system/capacity-reviews"
              payload: { operator_id: "${op1}", review_period: "2026" }
              as: FranchiseFinance
              captures: { cr1: $.data.id }
            - call: "POST /franchise-system/capacity-reviews/${cr1}/submit"
              payload: {}
              as: FranchiseFinance
            - call: "POST /franchise-system/operators/${op1}/approve"
              payload: {}
              as: FranchisorAdmin
            - call: "GET /franchise-system/operators/${op1}"
              payload: {}
              as: FranchiseFinance
              captures: { op1_v: $.data.version }
            - call: "POST /franchise-system/stores"
              payload: { store_code: "ST1", site_id: "${site1}", operator_id: "${op1}", expected_operator_version: "${op1_v}" }
              as: FranchisorAdmin
              captures: { st1: $.data.id }
            - call: "POST /franchise-system/agreements"
              payload: { store_id: "${st1}", operator_id: "${op1}", initial_fee_cents: 4500000, royalty_rate: 0.04, ad_fund_rate: 0.02, occupancy_allocation_pct: 0.60, term_years: 5, term_start_date: "2026-04-01" }
              as: FranchisorAdmin
              captures: { ag1: $.data.id }
            - call: "POST /franchise-system/agreements/${ag1}/submit"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise-system/agreements/${ag1}/record-fee-payment"
              payload: { amount_cents: 4500000 }
              as: FranchiseFinance
            - call: "POST /franchise-system/subleases"
              payload: { store_id: "${st1}", operator_id: "${op1}", base_rent_cents: 2400000, pct_rent_rate: 0.08, escalation_rate: 0.02, escalation_month: 4, escalation_day: 1, start_date: "2026-04-01", end_date: "2031-03-31" }
              as: FranchisorAdmin
