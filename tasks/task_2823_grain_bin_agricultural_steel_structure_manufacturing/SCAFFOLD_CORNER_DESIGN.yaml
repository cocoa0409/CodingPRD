              captures: { line_code: $.data.line_code }
          assert:
            - "each of the four GETs returns HTTP 200 with id and created_at present and with NO version key and NO updated_at key"
            - "Jurisdiction.${j_ns_id} exposes exactly code, name, seal_required, min_design_wind_speed_mph, seismic_design_category and permit_review_days beyond the two common fields"
            - "CoatingSpec.${cs_g115_id} additionally exposes the computed corrosion_class == C3, which is written once at create and never recomputed"
            - "§1.5 declares no PATCH, PUT, DELETE or action endpoint for any of these four paths, so the rows cannot be mutated after create"
            - "KitLine is likewise common_fields false and is only reachable as a child collection through GET /dealer-orders/{id}/kit-lines - it has no own create or update endpoint"

