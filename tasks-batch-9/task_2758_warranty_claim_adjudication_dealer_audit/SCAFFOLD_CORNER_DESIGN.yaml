      - name: payment_blocked_by_overdue_parts_return_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority 90].ERR_PARTS_RETURN_OVERDUE
          - validations[priority 40].ERR_CLAIM_NOT_PAYABLE
          - entities.PartsReturnRequest.fields.due_date
        distinguishing_aspect: |
          Payment is legal on 2026-05-01 and illegal on 2026-06-01 with no state change in between - only the
          logical clock crossing due_date. Running the sweep does not unblock payment either: it converts the
          refusal into ERR_CLAIM_NOT_PAYABLE because the claim is now DEBITED.
