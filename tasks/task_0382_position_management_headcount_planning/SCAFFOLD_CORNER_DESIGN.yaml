# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims
# not already probed by §1.8. Walks references/claim-extraction-guide.md
# section-by-section against this scaffold's §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_cost_center_returns_201_with_derived_defaults
        claim_type: Creation
        grounds: [entities.CostCenter, endpoints]
        distinguishing_aspect: "POST /cost-centers with all required fields -> 201; committed_fte=0, committed_cost_cents=0, filled_fte=0, available_budget_cents=annual_budget_cents, posture=OPEN, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
          assert:
            - "response.code == 201"
            - "CostCenter.${cc1}.committed_cost_cents == 0"
            - "CostCenter.${cc1}.available_budget_cents == 100000000"
            - "CostCenter.${cc1}.posture == OPEN"
            - "CostCenter.${cc1}.version == 1"

      - name: entity_position_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Position
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /positions/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /positions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: entity_position_missing_required_fte_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Position.fields.fte
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /positions omitting required fte -> ERR_INVALID_REQUEST (422); no position created."
        test_recipe:
          setup: ["Grade G07 and CC1 exist"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1" }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: entity_position_fte_out_of_range_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Position.fields.fte
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "fte must be in (0,1]; fte=1.5 -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Grade G07 and CC1 exist"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 1.5 }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: entity_position_bad_cost_center_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Position.fields.cost_center_id
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "POST /positions with non-existent cost_center_id FK -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Grade G07 exists; no such cost center"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "00000000-0000-4000-8000-000000000000", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: entity_grade_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Grade]
        distinguishing_aspect: "Grade has common_fields:false — no PATCH/lifecycle endpoint exists and the created entity carries id+created_at but no version."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
          assert:
            - "response.code == 201"
            - "Grade.${g07}.code == G07"
            - "Grade.${g07}.rank == 7"

      - name: entity_position_computed_planned_cost_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Position.fields.planned_cost_cents, calculations.planned_cost_cents]
        distinguishing_aspect: "planned_cost_cents is source:computed; on create it equals round(band_mid*fte)=6000000 regardless of any client-sent value (input ignored)."
        test_recipe:
          setup: ["Grade G07 mid 12000000; CC1 exists"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
          assert:
            - "Position.${p1}.planned_cost_cents == 6000000"
            - "Position.${p1}.actual_cost_cents == 0"
            - "Position.${p1}.span_of_control == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_fund_from_draft_skips_requisition_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Position.REQUISITIONED_to_FUNDED
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=6]"
        distinguishing_aspect: "FUND on a DRAFT position (must be REQUISITIONED) -> ERR_INVALID_STATE (409); lifecycle stays DRAFT."
        test_recipe:
          setup: ["P1 G07 fte 0.5 DRAFT on CC1 (never requisitioned)"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Position.${p1}.lifecycle_status == DRAFT"

      - name: sm_abolished_terminal_lockdown_rejects_requisition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Position.REQUISITIONED_to_ABOLISHED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ABOLISHED is terminal — REQUISITION on an ABOLISHED position -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["P1 G07 DRAFT on CC1, abolished from DRAFT? -> abolish requires REQUISITIONED/FUNDED; requisition then abolish"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "ABOLISH" }
              as: HRDirector
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Position.${p1}.lifecycle_status == ABOLISHED"

      - name: sm_reclass_approve_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ReclassRequest.UNDER_REVIEW_to_APPROVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "approve requires UNDER_REVIEW; approving a SUBMITTED reclass -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["P1 G05 FUNDED on CC1; RR1 to G07 SUBMITTED (never reviewed)"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G05", band_min_cents: 6000000, band_mid_cents: 8000000, band_max_cents: 10000000, rank: 5 }
              as: CompensationAnalyst
              captures: { g05: $.data.id }
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g05}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/reclass-requests"
              payload: { target_grade_id: "${g07}", justification: "promo" }
              as: CompensationAnalyst
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /reclass-requests/${rr1}/approve"
              payload: {}
              as: HRDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ReclassRequest.${rr1}.status == SUBMITTED"

      - name: sm_initial_state_position_draft_vacant
        claim_type: Initial State
        grounds: [state_machines.Position.DRAFT_to_REQUISITIONED, entities.Position.fields.lifecycle_status, entities.Position.fields.occupancy_status]
        distinguishing_aspect: "A freshly created Position starts lifecycle_status=DRAFT and occupancy_status=VACANT."
        test_recipe:
          setup: ["Grade G07 and CC1 exist"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
          assert:
            - "Position.${p1}.lifecycle_status == DRAFT"
            - "Position.${p1}.occupancy_status == VACANT"

      - name: sm_reclass_direction_upgrade_computed
        claim_type: Side Effect Execution
        grounds: [state_machines.ReclassRequest.SUBMITTED_to_UNDER_REVIEW, calculations.reclass_direction, entities.ReclassRequest.fields.direction]
        distinguishing_aspect: "Submitting a reclass from G05 (rank 5) to G07 (rank 7) computes direction=UPGRADE and snapshots from_grade_rank=5, target_grade_rank=7."
        test_recipe:
          setup: ["P1 G05 FUNDED on CC1; submit reclass to G07"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G05", band_min_cents: 6000000, band_mid_cents: 8000000, band_max_cents: 10000000, rank: 5 }
              as: CompensationAnalyst
              captures: { g05: $.data.id }
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g05}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /positions/${p1}/reclass-requests"
              payload: { target_grade_id: "${g07}", justification: "promo" }
              as: CompensationAnalyst
              captures: { rr1: $.data.id }
          assert:
            - "ReclassRequest.${rr1}.direction == UPGRADE"
            - "ReclassRequest.${rr1}.from_grade_rank == 5"
            - "ReclassRequest.${rr1}.target_grade_rank == 7"

      - name: sm_reclass_approve_applies_grade_and_recomputes_budget
        claim_type: Side Effect Execution
        grounds: [state_machines.ReclassRequest.UNDER_REVIEW_to_APPROVED, entities.Position.fields.grade_id, calculations.committed_cost_cents]
        distinguishing_aspect: "Approving an UPGRADE reclass on a FUNDED position swaps grade_id, recomputes planned_cost_cents to 9000000 (G09 mid 18000000 * 0.5), and committed_cost_cents becomes 9000000."
        test_recipe:
          setup: ["P1 G07 fte 0.5 FUNDED on CC1 (committed 6000000); RR1 to G09 UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /grades"
              payload: { code: "G09", band_min_cents: 14000000, band_mid_cents: 18000000, band_max_cents: 22000000, rank: 9 }
              as: CompensationAnalyst
              captures: { g09: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/reclass-requests"
              payload: { target_grade_id: "${g09}", justification: "promo" }
              as: CompensationAnalyst
              captures: { rr1: $.data.id }
            - call: "POST /reclass-requests/${rr1}/review"
              payload: {}
              as: CompensationAnalyst
          trigger:
            - call: "POST /reclass-requests/${rr1}/approve"
              payload: {}
              as: HRDirector
          assert:
            - "ReclassRequest.${rr1}.status == APPROVED"
            - "Position.${p1}.grade_id == ${g09}"
            - "Position.${p1}.planned_cost_cents == 9000000"
            - "CostCenter.${cc1}.committed_cost_cents == 9000000"

      - name: sm_requisition_close_requires_filled_position
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Requisition.APPROVED_to_CLOSED
          - "errors[ERR_POSITION_NOT_FILLED]"
        distinguishing_aspect: "Closing an APPROVED requisition while the position is still VACANT -> ERR_POSITION_NOT_FILLED (409)."
        test_recipe:
          setup: ["P1 G07 FUNDED VACANT on CC1; RQ1 APPROVED on P1"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/requisitions"
              payload: { req_type: "NEW_HIRE", justification: "hire" }
              as: HRBP
              captures: { rq1: $.data.id }
            - call: "POST /requisitions/${rq1}/approve"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /requisitions/${rq1}/close"
              payload: {}
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 409"
            - "response.data.error_id == ERR_POSITION_NOT_FILLED"
            - "Requisition.${rq1}.status == APPROVED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_filled_fte_sum_then_round
        claim_type: Precision
        grounds: [calculations.filled_fte, entities.CostCenter.fields.filled_fte]
        distinguishing_aspect: "Two FILLED positions fte 0.333 and 0.334 sum raw to 0.667 then round to 2dp -> filled_fte=0.67 (sum-then-round, not round-each)."
        test_recipe:
          setup: ["CC1 with P1 fte 0.333 and P2 fte 0.334 both FUNDED and FILLED"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.333 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P2", fte: 0.334 }
              as: HRBP
              captures: { p2: $.data.id }
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "GET /cost-centers/${cc1}"
              payload: {}
              as: FinanceController
              captures: { cc1_v1: $.data.version }
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v1}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E1", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "E2", email: "e2@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e2: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
            - call: "POST /positions/${p2}/incumbents"
              payload: { employee_id: "${e2}", start_date: "2026-01-01" }
              as: HRBP
          trigger:
            - call: "GET /cost-centers/${cc1}"
              payload: {}
              as: FinanceController
          assert:
            - "CostCenter.${cc1}.filled_fte == 0.67"

      - name: calc_posture_halfopen_lower_inclusive_boundary
        claim_type: Constants Applied
        grounds: [calculations.cost_center_posture, entities.CostCenter.fields.posture]
        distinguishing_aspect: "Clock exactly at effective_from (2026-01-01) is INSIDE the half-open window [from,to) -> posture FROZEN."
        test_recipe:
          setup: ["Clock 2026-01-01 exactly. CC1 with FreezeOrder [2026-01-01,2026-04-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /cost-centers/${cc1}/freeze-orders"
