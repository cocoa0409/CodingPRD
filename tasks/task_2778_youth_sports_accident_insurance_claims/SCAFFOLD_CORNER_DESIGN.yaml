              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "GET /sport-classifications/00000000-0000-4000-8000-000000000201"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participants/00000000-0000-4000-8000-000000000202"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000203"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /family-health-plans/00000000-0000-4000-8000-000000000204"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /sanctioned-activities/00000000-0000-4000-8000-000000000205"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /injury-reports/00000000-0000-4000-8000-000000000206"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /provider-bills/00000000-0000-4000-8000-000000000207"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "00000000-0000-4000-8000-000000000208", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404 }
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "00000000-0000-4000-8000-000000000209", first_name: "Sorrel", last_name: "Kaminski", date_of_birth: "2016-06-13", guardian_email: "g51@sbb.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
          assert:
            - "trigger 1 returns HTTP 404 with data.error_id == ERR_SPORT_CLASSIFICATION_NOT_FOUND"
            - "trigger 2 returns HTTP 404 with data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "trigger 3 returns HTTP 404 with data.error_id == ERR_ENROLLMENT_NOT_FOUND"
            - "trigger 4 returns HTTP 404 with data.error_id == ERR_FAMILY_HEALTH_PLAN_NOT_FOUND"
            - "trigger 5 returns HTTP 404 with data.error_id == ERR_SANCTIONED_ACTIVITY_NOT_FOUND"
            - "trigger 6 returns HTTP 404 with data.error_id == ERR_INJURY_REPORT_NOT_FOUND"
            - "trigger 7 returns HTTP 404 with data.error_id == ERR_PROVIDER_BILL_NOT_FOUND"
            - "trigger 8 returns HTTP 404 with data.error_id == ERR_SPORT_CLASSIFICATION_NOT_FOUND: the missing REFERENCED parent is named, not the entity being created, and no LeaguePolicy row is written (GET /league-policies?league_id=${league_id} returns meta.total_count == 0)"
            - "trigger 9 returns HTTP 404 with data.error_id == ERR_LEAGUE_NOT_FOUND for the unknown referenced league (the ownership check at priority 3 does not pre-empt it, because the caller's own league is the one it claims)"
            - "every one of the nine responses carries exactly the declared error envelope keys error_id and message"

      - name: calls_with_a_missing_or_unknown_identity_header_are_rejected_as_unauthenticated
        claim_type: error_envelope
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
        distinguishing_aspect: "Priority 1 outranks everything, including the 404 catalog at priority 5, so an unauthenticated read of a NON-EXISTENT league must still answer 401 and not 404. The two arms of the declared condition are probed separately: no identity headers at all, and an X-User-Role that is not one of the six declared roles. Both are 401, and neither leaks whether the addressed row exists."
        test_recipe:
          setup:
            - "One league exists so that the authenticated control read can succeed."
            - "Trigger 1 omits `as:` entirely: it is issued with NO X-User-Role and NO X-User-ID header."
            - "Trigger 2 sends an empty X-User-Role header; triggers 3 and 4 send the undeclared role name ClaimsSupervisor."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Thornbury Baseball", league_code: "TBB-152", state_code: "IN", governing_body_code: "USYSA", contact_email: "admin@tbb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
          trigger:
            - call: "GET /leagues/${league_id}"
              payload: {}
            - call: "GET /leagues/${league_id}"
              payload: {}
              as: ""
            - call: "GET /leagues/${league_id}"
              payload: {}
              as: "ClaimsSupervisor"
            - call: "GET /leagues/00000000-0000-4000-8000-000000000210"
              payload: {}
              as: "ClaimsSupervisor"
            - call: "GET /leagues/${league_id}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "trigger 1 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "trigger 2 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (empty is treated as missing)"
            - "trigger 3 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, NOT 403 ERR_ROLE_NOT_PERMITTED: an unrecognised role never reaches the priority 2 check"
            - "trigger 4 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, NOT 404: priority 1 runs before the priority 5 not-found catalog"
            - "trigger 5 returns HTTP 200 with data.id == ${league_id}, proving the four refusals were caused by identity alone"
            - "all four refusals carry only the error_id and message envelope keys"

