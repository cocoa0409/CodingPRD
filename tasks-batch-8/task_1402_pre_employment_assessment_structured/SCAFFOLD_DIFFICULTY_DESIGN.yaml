  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: composite_score_renormalization_and_clamp
        grounds:
          - calculations.candidate_composite_score
          - entities.Scorecard.fields.ratings
          - entities.CandidateAssessment.fields.composite_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — partial competency coverage forces
          weight renormalization (COMM-only 0.6933 vs full-coverage 0.7413 at identical raw 72),
          and nested min/max clamps raw 30 below pass_floor 40 to assessment_component 0 (0.6000).
        test_recipe:
          setup:
            - "Cycle ACTIVE (window 2026-08-10..2026-08-20, capacity 8); guide COMM 0.6/5 + ANAL 0.4/5; iv1 CALIBRATED"
            - "cA COMPLETED raw 72, scorecard COMM4+ANAL5; cB COMPLETED raw 72, scorecard COMM4 only; cC COMPLETED raw 30, scorecard COMM5+ANAL5"
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 5 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy One", email: "ivy1@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv1: $.data.id } }
            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g}" }, as: TalentAssessmentAdmin, captures: { cal1: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-A", full_name: "Cand A", email: "ca@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { cA: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-B", full_name: "Cand B", email: "cb@x.com", group_code: "GROUP_B" }, as: HiringManager, as_user_id: hm-1, captures: { cB: $.data.id } }
