# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Comedy Club & Live-Show Venue — 9 rule_ids x >=2 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: minimum_due_pre_vs_post_seating
        grounds:
          - calculations.compute_minimum_due
          - entities.Reservation.fields.minimum_due_cents
          - entities.SeatTable.fields.min_items_per_seat
          - state_machines.SeatTable.AVAILABLE_to_HELD
        distinguishing_aspect: "Same Reservation row: pre_seating_estimate uses VENUE_DEFAULT_MIN_ITEMS=2 (minimum_due_cents==4000 for party 2) but post_seating_final after assign-table uses the table.min_items_per_seat=3 (minimum_due_cents==6000) — the divergence is on the Reservation entity domain."
        test_recipe:
          setup:
            - "Venue OPEN, a DRAFT show with a TABLE section, one TicketTier (no min_items_override) into that section, one table with seats=4 and min_items_per_seat=3, a server assigned to the table, show published ON_SALE, a BOOKED reservation party_size=2."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Chuckle Hut", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Friday Late", starts_at: "2026-04-01T03:00:00Z", ends_at: "2026-04-01T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4, min_items_per_seat: 3 }
              as: FloorManager
              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table Seat", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Dana", max_tables: 4 }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-aa", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id, min_pre: $.data.minimum_due_cents }
          trigger:
            - call: "POST /reservations/${res_id}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v}" }
              as: FloorManager
              captures: { min_post: $.data.minimum_due_cents }
          assert:
            - "Reservation.${res_id}.minimum_due_cents == 4000 immediately after create (pre_seating_estimate)"
            - "Reservation.${res_id}.minimum_due_cents == 6000 after assign-table (post_seating_final)"

      - name: settlement_public_vs_private_buyout
        grounds:
          - calculations.compute_settlement
          - entities.Settlement.fields.gross_ticket_cents
          - entities.Settlement.fields.buyout_cents
          - entities.PrivateEvent.fields.buyout_fee_cents
        distinguishing_aspect: "On the Settlement entity domain: public_show_settlement yields buyout_cents==0 with gross from tickets, while private_buyout_settlement yields buyout_cents==500000 and gross_ticket_cents==0 — the dual variant lives on Settlement, a different entity from compute_minimum_due's Reservation."
        test_recipe:
          setup:
            - "A DRAFT show bought out by a CONFIRMED PrivateEvent (buyout_fee_cents=500000), show ends, settlement opened and finalized; house_fee_pct default 0.20, no SIGNED lineup slots."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Buyout Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Corp Night", starts_at: "2026-04-02T03:00:00Z", ends_at: "2026-04-02T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /private-events"
              payload: { show_id: "${show_id}", client_name: "Acme", buyout_fee_cents: 500000 }
              as: Booker
              captures: { pe_id: $.data.id }
            - call: "POST /private-events/${pe_id}/confirm"
              payload: {}
              as: Booker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T06:00:00Z" }
              as: FloorManager
            - call: "POST /settlements"
              payload: { show_id: "${show_id}" }
              as: FloorManager
              captures: { settle_id: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: {}
              as: FloorManager
              captures: { buyout: $.data.buyout_cents, gt: $.data.gross_ticket_cents, house: $.data.house_cut_cents, net: $.data.net_to_venue_cents }
          assert:
            - "Settlement.${settle_id}.buyout_cents == 500000"
            - "Settlement.${settle_id}.gross_ticket_cents == 0"
            - "Settlement.${settle_id}.house_cut_cents == 100000"
            - "Settlement.${settle_id}.net_to_venue_cents == 400000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: refund_branch_selection_multi_input
        grounds:
          - calculations.compute_refund
          - entities.Reservation.fields.refunded_cents
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - validations[priority=7]
        distinguishing_aspect: "Mode (a): refunded_cents is a non-linear branch over >=3 inputs (settlement_status, triggering action, logical clock vs Show.starts_at - LATE_CANCEL_GRACE_MINUTES, and fee constants) — a late patron cancel of a TICKET_PAID reservation yields max(0, 13500 - 1500)==12000, not the full 13500."
        test_recipe:
          setup:
            - "GA show ON_SALE, GA tier price 4500, a BOOKED reservation party_size=3 collected to TICKET_PAID (ticket_charge_cents=13500); clock set inside the late-cancel window (< 120 min before starts_at)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Late Cancel Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "GA Night", starts_at: "2026-04-03T03:00:00Z", ends_at: "2026-04-03T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 100 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA Adv", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-bb", party_size: 3 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/collect-ticket"
              payload: {}
              as: BoxOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T02:30:00Z" }
              as: FloorManager
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: BoxOffice
              captures: { refunded: $.data.refunded_cents }
          assert:
            - "Reservation.${res_id}.refunded_cents == 12000"
            - "Reservation.${res_id}.booking_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"

      - name: settlement_house_cut_rounding_order
        grounds:
          - calculations.compute_settlement
          - entities.Settlement.fields.house_cut_cents
          - entities.Venue.fields.house_fee_pct
        distinguishing_aspect: "Mode (b): house_cut_cents is round_half_up(0.25 * gross_box_office) computed ONCE on the summed gross (500 -> 125), NOT per-reservation (rhu(0.25*250)+rhu(0.25*250)==126); the pinned total-rounding order makes 125 the only correct value."
        test_recipe:
          setup:
            - "Venue with house_fee_pct=0.25; GA show with two CHECKED_IN reservations each ticket_charge_cents=250 (tier price 250, party 1), both TICKET_PAID, no minimum collected, no SIGNED slots; show ended, settlement opened."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Rounding Venue", settlement_currency: "USD", house_fee_pct: 0.25 }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Round Night", starts_at: "2026-04-04T03:00:00Z", ends_at: "2026-04-04T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 50 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Cheap GA", price_cents: 250 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-c1", party_size: 1 }
              as: BoxOffice
              captures: { r1: $.data.id }
            - call: "POST /reservations/${r1}/collect-ticket"
              payload: {}
              as: BoxOffice
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-c2", party_size: 1 }
              as: BoxOffice
              captures: { r2: $.data.id }
            - call: "POST /reservations/${r2}/collect-ticket"
              payload: {}
              as: BoxOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-04T06:00:00Z" }
              as: FloorManager
            - call: "POST /reservations/${r1}/no-show"
              payload: {}
              as: FloorManager
            - call: "POST /reservations/${r2}/no-show"
              payload: {}
              as: FloorManager
            - call: "POST /settlements"
              payload: { show_id: "${show_id}" }
              as: FloorManager
              captures: { settle_id: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: {}
              as: FloorManager
              captures: { gb_house: $.data.house_cut_cents, gt: $.data.gross_ticket_cents }
          assert:
            - "Settlement.${settle_id}.gross_ticket_cents == 500 (both NO_SHOW reservations retain TICKET_PAID charge 250 each)"
            - "Settlement.${settle_id}.house_cut_cents == 125 (round_half_up(0.25*500) once; per-line would give 126)"
            - "Settlement.${settle_id}.net_to_venue_cents == 375"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_booking_and_settlement_dims
        grounds:
          - state_machines.Reservation.BOOKED_to_SEATED
          - state_machines.Reservation.UNCOLLECTED_to_TICKET_PAID
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.settlement_status
        distinguishing_aspect: "On Reservation: booking_status advances BOOKED->SEATED while settlement_status independently advances UNCOLLECTED->TICKET_PAID; the two dimensions are orthogonal (a SEATED reservation can still be UNCOLLECTED) — parallel state on one entity."
        test_recipe:
          setup:
            - "TABLE show ON_SALE with a table+server; a BOOKED, UNCOLLECTED reservation party_size=2 assigned to the table."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Parallel Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Dim Night", starts_at: "2026-04-05T03:00:00Z", ends_at: "2026-04-05T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4 }
              as: FloorManager
              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Eve" }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-dd", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v}" }
              as: FloorManager
          trigger:
            - call: "POST /reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
              captures: { bk: $.data.booking_status, st: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.booking_status == SEATED"
            - "Reservation.${res_id}.settlement_status == UNCOLLECTED"

      - name: lineup_slot_offer_counter_cycle
        grounds:
          - state_machines.LineupSlot.OFFERED_to_COUNTERED
          - state_machines.LineupSlot.COUNTERED_to_OFFERED
          - entities.LineupSlot.fields.contract_status
          - entities.LineupSlot.fields.counter_rounds
        distinguishing_aspect: "On LineupSlot (a different entity than Reservation): contract_status loops OFFERED->COUNTERED->OFFERED, with counter_rounds incrementing to 1 on the counter — a genuine cycle, not a forward-only pipeline."
        test_recipe:
          setup:
            - "A performer and a DRAFT show with an OFFERED lineup slot at offered_fee_cents=30000."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Lineup Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Open Mic", starts_at: "2026-04-06T03:00:00Z", ends_at: "2026-04-06T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Jo Laughs", email: "jo@x.com", standard_fee_cents: 30000 }
              as: Booker
              captures: { perf_id: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${show_id}", performer_id: "${perf_id}", slot_order: 1, role: "HEADLINER", offered_fee_cents: 30000 }
              as: Booker
              captures: { slot_id: $.data.id }
            - call: "POST /lineup-slots/${slot_id}/counter"
              payload: { counter_fee_cents: 40000 }
              as: Performer
              as_user_id: "${perf_id}"
          trigger:
            - call: "POST /lineup-slots/${slot_id}/revise-offer"
              payload: { new_offered_fee_cents: 35000 }
              as: Booker
              captures: { cs: $.data.contract_status, cr: $.data.counter_rounds, off: $.data.offered_fee_cents }
          assert:
            - "LineupSlot.${slot_id}.contract_status == OFFERED after the revise (cycled back from COUNTERED)"
            - "LineupSlot.${slot_id}.counter_rounds == 1"
            - "LineupSlot.${slot_id}.offered_fee_cents == 35000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: show_cancel_cascade_depth3_to_server
        grounds:
          - state_machines.Show.ON_SALE_to_CANCELLED
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.SeatTable.HELD_to_AVAILABLE
          - entities.Server.fields.assigned_table_count
        distinguishing_aspect: "Depth-3 chain from the Show cancel trigger: Show->CANCELLED causes Reservation->CANCELLED, which itself releases SeatTable HELD->AVAILABLE, which itself recomputes the Server.assigned_table_count — each hop caused by the prior hop, not by the cancel directly."
        test_recipe:
          setup:
            - "TABLE show ON_SALE, table T1 (server Frank, max_tables 4) assigned to a BOOKED reservation party_size=2 (table HELD, server.assigned_table_count==1)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Cascade Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Cascade Night", starts_at: "2026-04-07T03:00:00Z", ends_at: "2026-04-07T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4 }
              as: FloorManager
              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Frank", max_tables: 4 }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-ee", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v}" }
              as: FloorManager
          trigger:
            - call: "POST /venues/${venue_id}/shows/${show_id}/cancel"
              payload: {}
              as: Booker
          assert:
            - "Show.${show_id}.status == CANCELLED"
            - "Reservation.${res_id}.booking_status == CANCELLED"
            - "SeatTable.${table_id}.status == AVAILABLE"
            - "Server.${server_id}.assigned_table_count == 0"

      - name: settlement_finalize_cascade_depth2_to_venue
        grounds:
          - state_machines.Settlement.OPEN_to_FINALIZED
          - state_machines.Show.SETTLING_to_SETTLED
          - entities.Venue.fields.posture
        distinguishing_aspect: "Depth-2 chain from a different trigger (settlement finalize): Settlement->FINALIZED causes Show->SETTLED, which itself causes Venue.posture to recompute back to OPEN (no other show SETTLING) — distinct propagation from the show-cancel chain."
        test_recipe:
          setup:
            - "A GA show that ended, with an OPEN settlement (show SETTLING, Venue.posture RECONCILING), no unmet minimums."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Finalize Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Final Night", starts_at: "2026-04-08T03:00:00Z", ends_at: "2026-04-08T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 100 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T06:00:00Z" }
              as: FloorManager
            - call: "POST /settlements"
              payload: { show_id: "${show_id}" }
              as: FloorManager
              captures: { settle_id: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: {}
              as: FloorManager
          assert:
            - "Settlement.${settle_id}.status == FINALIZED"
            - "Show.${show_id}.status == SETTLED"
            - "Venue.${venue_id}.posture == OPEN"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: role_forbidden_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_ROLE_FORBIDDEN]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "auth vs existence: a Patron (role not permitted to publish) calling publish on a non-existent show fails with ERR_ROLE_FORBIDDEN (priority 2), not ERR_NOT_FOUND (priority 3)."
        test_recipe:
          setup:
            - "A venue exists; the show id in the path does not exist; caller is a Patron, who is never permitted to publish."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Prio Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/shows/00000000-0000-4000-8000-000000000000/publish"
              payload: {}
              as: Patron
              as_user_id: "patron-zz"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROLE_FORBIDDEN"
            - "http status == 403"

      - name: invalid_state_beats_section_sold_out
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SECTION_SOLD_OUT]
        distinguishing_aspect: "state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 14, ERR_SECTION_SOLD_OUT): creating a reservation on a CANCELLED show whose GA section is also over capacity returns ERR_INVALID_STATE because the sellable-show state check fires before the GA capacity check — different error-category pair from role_forbidden_beats_not_found (auth vs existence)."
