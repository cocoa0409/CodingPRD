  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_class_inventory_uses_half_open_overlap_so_touching_spots_are_legal
        grounds:
          - calculations.spot_placement_geometry
          - validations[priority=61]
          - errors[ERR_SPOT_SLOT_COLLISION]
          - entities.ScheduledSpot.fields.start_offset_seconds
        distinguishing_aspect: |
          Interval semantics here are STRICT HALF-OPEN overlap on the RateClass resource: a spot
          starting at 1030 exactly where the incumbent [1000, 1030) ends is accepted, while a spot
          starting one second earlier at 1029 overlaps by one second and is refused with
          ERR_SPOT_SLOT_COLLISION.
        test_recipe:
          setup:
            - "One station and one EARLY_NEWS rate class."
