- rule_id: resource_temporal_overlap
  instances:
  - name: plan_version_half_open_interval_overlap
    grounds:
    - state_machines.PlanVersion.DRAFT_to_ADOPTED
    - validations[priority=15]
    distinguishing_aspect: 'Interval semantics A: half-open [effective_start, effective_end)

      adjacency on the PlanVersion resource — a version starting exactly on

      the prior version''s effective_end is ADJACENT (allowed), while one

      starting a day earlier OVERLAPS (rejected). Touching endpoints are

      legal; interior intersection is not.

      '
    test_recipe:
      setup:
      - Plan with ADOPTED version V1 covering [2026-01-01, 2026-12-31); DRAFT version V2 covering [2027-01-01, 2027-12-31)
        — adjacent at the boundary
      - DRAFT version V3 covering [2026-06-01, 2027-05-31) — interior overlap with V1
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Oscar Corp
          ein: '633456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          emp15_id: $.data.id
      - call: POST /ndt/employers/${emp15_id}/plans
        payload:
          plan_name: Oscar 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          plan15_id: $.data.id
      - call: POST /ndt/plans/${plan15_id}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2027-01-01'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          v15a: $.data.id
      - call: POST /ndt/plan-versions/${v15a}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${plan15_id}/plan-versions
        payload:
          effective_start: '2027-01-01'
          effective_end: '2027-12-31'
          comp_definition: SEC415
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          v15b: $.data.id
      - call: POST /ndt/plans/${plan15_id}/plan-versions
        payload:
          effective_start: '2026-06-01'
          effective_end: '2027-05-31'
          comp_definition: SEC3401
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          v15c: $.data.id
      trigger:
      - call: POST /ndt/plan-versions/${v15b}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-versions/${v15c}/adopt
        payload: {}
        as: PlanAdministrator
        captures:
          err15: $.data.error_id
      assert:
      - 'V2 (adjacent, start == V1.effective_end) adopts successfully -> status ADOPTED (half-open semantics: touching is
        not overlapping)'
      - V3 adoption rejected with error_id == ERR_VERSION_INTERVAL_CONFLICT (interior overlap [2026-06-01, 2027-05-31) vs
        [2026-01-01, 2027-01-01) and vs newly-adopted V2)
  - name: notice_window_30day_aggregate_gap_rule
    grounds:
    - calculations.safe_harbor_notice_window_check
    - validations[priority=14]
    distinguishing_aspect: 'Interval semantics B (different from half-open adjacency): a

      minimum-gap rule — for a mid-year amendment notice, notice_period_end

      must be at least 30 days BEFORE plan-year end (an aggregate buffer

      constraint, not a point-intersection test), and the resource is the

      SafeHarborNotice window rather than the PlanVersion interval.

      '
    test_recipe:
      setup:
      - Plan year 2026 (ends 2026-12-31) in CENSUS_COLLECTING with a PROPOSED election; notice window [2026-11-15, 2026-12-15]
        leaves only 16 days to year-end (< 30)
      - Control notice window [2026-10-15, 2026-11-15] leaves 46 days (>= 30) and distributes fine
