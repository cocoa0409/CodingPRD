              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_id: "$.data.id", capacity_before: "$.data.bed_capacity", available_before: "$.data.available_beds" }
            - call: "POST /clients"
              payload: { client_code: "C-9701", legal_name: "Alina Ford", household_size: 3, minor_children_count: 2, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Wants a room held for Friday for herself and two children." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /screening-requests"
              payload: { client_id: "${client_id}", hotline_call_id: "${call_id}", requested_shelter_id: "${shelter_id}", requested_entry_date: "2026-08-07" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /screening-requests/${sr_id}/decide"
              payload: { decision: "APPROVE", assigned_advocate_id: "${adv_id}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "GET /shelter-units/${unit_id}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_v: "$.data.version" }
            - call: "POST /shelter-admissions"
              payload: { screening_request_id: "${sr_id}", shelter_unit_id: "${unit_id}", entry_date: "2026-08-07", planned_exit_date: "2026-08-12", expected_shelter_unit_version: "${unit_v}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { adm_id: "$.data.id", projected: "$.data.projected_stay_cost_cents" }
            - call: "GET /shelter-units/${unit_id}"
              payload: {}
              as: ShelterManager
