              as_user_id: "u_intake_1"
            - call: "POST /palliative/surrogates"
              payload: { patient_id: "${p_id}", person_user_id: "u_spouse_1", person_name: "Mara Petrov", relationship: "SPOUSE", is_beneficiary: false }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { sur_id: $.data.id }
            - call: "POST /palliative/patients/${p_id}/capacity-determinations"
              payload: { capacity_status: "LACKS_CAPACITY", determination_note: "delirium, unable to state preferences" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "FAMILY", modality: "TELEHEALTH", scheduled_start: "2026-06-03T14:00:00Z", scheduled_end: "2026-06-03T15:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_id: $.data.id }
          trigger:
            - call: "POST /palliative/conferences/${conf_id}/hold"
              payload: { documented_minutes: 40 }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { err_empty: $.data.error_id }
            - call: "POST /palliative/surrogates/${sur_id}/status"
              payload: { target_status: "ACTIVE" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/hold"
              payload: { documented_minutes: 40 }
              as: SocialWorker
              as_user_id: "u_sw_1"
          assert:
            - "${err_empty} == ERR_SURROGATE_HIERARCHY_EMPTY"
            - "HTTP status of the first hold == 422"
            - "CareConference.${conf_id}.status == HELD"
            - "CareConference.${conf_id}.decision_maker_kind == SURROGATE"
            - "CareConference.${conf_id}.consent_recorded == true"
            - "CareConference.${conf_id}.documented_minutes == 40"
            - "SurrogateDesignation.${sur_id}.hierarchy_rank == 2"

  # =========================================================================
  # Rule 7 - cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: care_plan_activation_requires_patient_past_referral
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - state_machines.Patient.REFERRED_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair CarePlan -> Patient: the plan's DRAFT to ACTIVE transition
          is legal only while Patient.program_status is ACTIVE or
          HOSPICE_ELECTED, so the identical activate call fails on a REFERRED
          patient and succeeds after the referral decision moves the patient to
          ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient still in program_status REFERRED with an open Referral in status RECEIVED and triage_score 90."
            - "One CarePlan for that patient in status DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1013", full_name: "Nadia Ilves", date_of_birth: "1950-03-03", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Initial comfort plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err_state: $.data.error_id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "${err_state} == ERR_INVALID_STATE"
            - "HTTP status of the first activate == 409"
            - "Referral.${ref_id}.status == ACCEPTED"
            - "Patient.${p_id}.program_status == ACTIVE"
            - "CarePlan.${cp_id}.status == ACTIVE"
            - "CarePlan.${cp_id}.revision_number == 0"

      - name: hospice_benefit_period_requires_attested_idt_conference
        grounds:
          - calculations.idt_cadence_compliance
          - validations[priority=27]
          - errors[ERR_IDT_CADENCE_LAPSED]
          - state_machines.CareConference.HELD_to_ATTESTED
          - state_machines.HospiceElection.CERTIFIED_to_ELECTED
        distinguishing_aspect: |
          Entity pair HospiceElection -> CareConference, a different pair from
          CarePlan -> Patient: opening a benefit period is legal only when the
          patient has a CareConference of type IDT in status ATTESTED within
          IDT_CADENCE_MAX_DAYS. A conference that is merely HELD with three of
          four disciplines attested does not qualify, and the fourth attestation
          flips the identical periods call from failure to success.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T09:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One IDT CareConference in status HELD with all four disciplines present but only PHYSICIAN, NURSE and SOCIAL_WORKER attested."
            - "One HospiceElection in status CERTIFIED with certification_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1014", full_name: "Omar Delgado", date_of_birth: "1938-01-27", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "IDT", modality: "TELEHEALTH", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/conferences/${conf_id}/hold"
              payload: { documented_minutes: 50, disciplines_present: ["PHYSICIAN", "NURSE", "SOCIAL_WORKER", "CHAPLAIN"] }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "PHYSICIAN", note_text: "prognosis reviewed" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "NURSE", note_text: "symptoms reviewed" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "SOCIAL_WORKER", note_text: "supports reviewed" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/hospice-elections"
              payload: { patient_id: "${p_id}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { he_id: $.data.id }
            - call: "POST /palliative/hospice-elections/${he_id}/certifications"
              payload: { terminal_diagnosis_code: "C50.911" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/hospice-elections/${he_id}/certifications"
              payload: { terminal_diagnosis_code: "C50.911" }
              as: HospiceMedicalDirector
              as_user_id: "u_hospice_md_1"
              captures: { he_v: $.data.version }
          trigger:
            - call: "POST /palliative/hospice-elections/${he_id}/periods"
              payload: { expected_election_version: "${he_v}", period_start: "2026-06-02T00:00:00Z" }
              as: HospiceMedicalDirector
              as_user_id: "u_hospice_md_1"
              captures: { err_cadence: $.data.error_id }
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "CHAPLAIN", note_text: "spiritual care reviewed" }
              as: Chaplain
              as_user_id: "u_chaplain_1"
            - call: "POST /palliative/hospice-elections/${he_id}/periods"
              payload: { expected_election_version: "${he_v}", period_start: "2026-06-02T00:00:00Z" }
              as: HospiceMedicalDirector
              as_user_id: "u_hospice_md_1"
          assert:
            - "${err_cadence} == ERR_IDT_CADENCE_LAPSED"
            - "HTTP status of the first periods call == 422"
            - "CareConference.${conf_id}.status == ATTESTED"
            - "CareConference.${conf_id}.attestation_complete == true"
            - "HospiceElection.${he_id}.status == ELECTED"
            - "HospiceElection.${he_id}.current_period_number == 1"
            - "HospiceElection.${he_id}.current_period_end == 2026-08-31T00:00:00.000Z"
            - "HospiceElection.${he_id}.cumulative_benefit_days == 90"
            - "Patient.${p_id}.program_status == HOSPICE_ELECTED"

  # =========================================================================
  # Rule 8 - resource temporal-overlap conflicts, different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dme_delivery_window_is_half_open_so_touching_windows_are_allowed
        grounds:
          - validations[priority=25]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.DmeOrder.fields.delivery_window_start
          - entities.DmeOrder.fields.delivery_window_end
          - state_machines.DmeOrder.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) with zero buffer, contended
          on the DmeInventoryItem resource. A window starting at the exact
          instant another ends is accepted, while a window overlapping by one
          hour is rejected - adjacency is legal, intersection is not.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One DmeInventoryItem of device_type WHEELCHAIR with total_units 5 and prior_auth_required false."
            - "DmeOrder A SCHEDULED for 2026-06-10T09:00:00Z to 2026-06-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1015", full_name: "Priya Raghavan", date_of_birth: "1947-07-21", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/dme-inventory"
              payload: { device_type: "WHEELCHAIR", total_units: 5, prior_auth_required: false }
              as: ProgramAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 1, delivery_window_start: "2026-06-10T09:00:00Z", delivery_window_end: "2026-06-10T11:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_a_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_a_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 1, delivery_window_start: "2026-06-10T11:00:00Z", delivery_window_end: "2026-06-10T13:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_touch_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_touch_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 1, delivery_window_start: "2026-06-10T10:00:00Z", delivery_window_end: "2026-06-10T12:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_overlap_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_overlap_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "DmeOrder.${dme_touch_id}.status == SCHEDULED"
            - "${err_overlap} == ERR_SCHEDULE_CONFLICT"
            - "HTTP status of the overlapping fulfillment == 409"
            - "DmeOrder.${dme_overlap_id}.status == REQUESTED"
            - "DmeInventoryItem.${inv_id}.available_units == 2"
            - "DmeInventoryItem.${inv_id}.reserved_units == 3"
            - "DmeInventoryItem.${inv_id}.delivered_units == 0"

      - name: conference_buffer_requires_fifteen_minute_gap_on_patient_calendar
        grounds:
          - validations[priority=25]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.CareConference.fields.scheduled_start
          - entities.CareConference.fields.scheduled_end
          - endpoints["POST /palliative/conferences"]
        distinguishing_aspect: |
          Interval semantics: BUFFERED interval requiring a gap of at least
          CONFERENCE_BUFFER_MINUTES, contended on the Patient calendar rather
          than on a DmeInventoryItem. A gap of exactly 15 minutes is accepted
          and a gap of 14 minutes is rejected, so touching windows - which the
          half-open DME rule permits - would be rejected here.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One CareConference in status SCHEDULED for 2026-06-15T09:00:00Z to 2026-06-15T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1016", full_name: "Quinn Baptiste", date_of_birth: "1953-11-30", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "IDT", modality: "TELEHEALTH", scheduled_start: "2026-06-15T09:00:00Z", scheduled_end: "2026-06-15T10:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_1_id: $.data.id }
          trigger:
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "FAMILY", modality: "TELEHEALTH", scheduled_start: "2026-06-15T10:15:00Z", scheduled_end: "2026-06-15T11:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_2_id: $.data.id }
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "FAMILY", modality: "IN_PERSON", scheduled_start: "2026-06-15T11:14:00Z", scheduled_end: "2026-06-15T12:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { err_buffer: $.data.error_id }
          assert:
            - "CareConference.${conf_2_id}.status == SCHEDULED"
            - "CareConference.${conf_2_id}.scheduled_start == 2026-06-15T10:15:00.000Z"
            - "${err_buffer} == ERR_SCHEDULE_CONFLICT"
            - "HTTP status of the 11:14 create == 409"
            - "The patient has exactly 2 CareConference rows"

  # =========================================================================
  # Rule 9 - compensating-action invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dme_reserve_deliver_and_close_conserve_total_units
        grounds:
          - calculations.dme_inventory_ledger
          - entities.DmeInventoryItem.fields.available_units
          - entities.DmeInventoryItem.fields.reserved_units
          - entities.DmeInventoryItem.fields.delivered_units
          - state_machines.DmeOrder.SCHEDULED_to_CLOSED
          - state_machines.DmeOrder.DELIVERED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity number 1: physical equipment units on a
          DmeInventoryItem, pinned as total_units == available_units +
          reserved_units + delivered_units. A reserve compensated by CANCELLED
          and a delivery compensated by RETURNED both return all three counters
          to their starting values with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One DmeInventoryItem of device_type OXYGEN_CONCENTRATOR with total_units 5, available_units 5, reserved_units 0, delivered_units 0 and prior_auth_required false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1017", full_name: "Rosa Lindqvist", date_of_birth: "1942-02-08", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/dme-inventory"
              payload: { device_type: "OXYGEN_CONCENTRATOR", total_units: 5, prior_auth_required: false }
              as: ProgramAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 2, delivery_window_start: "2026-06-05T08:00:00Z", delivery_window_end: "2026-06-05T10:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_x_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_x_id}/close"
              payload: { closed_reason: "CANCELLED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 2, delivery_window_start: "2026-06-06T08:00:00Z", delivery_window_end: "2026-06-06T10:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_y_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_y_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/dme-orders/${dme_y_id}/fulfillment"
              payload: { event: "DELIVERED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/dme-orders/${dme_y_id}/close"
              payload: { closed_reason: "RETURNED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "DmeOrder.${dme_x_id}.status == CLOSED"
            - "DmeOrder.${dme_x_id}.closed_reason == CANCELLED"
            - "DmeOrder.${dme_y_id}.status == CLOSED"
            - "DmeOrder.${dme_y_id}.closed_reason == RETURNED"
            - "DmeInventoryItem.${inv_id}.available_units == 5"
            - "DmeInventoryItem.${inv_id}.reserved_units == 0"
            - "DmeInventoryItem.${inv_id}.delivered_units == 0"
            - "DmeInventoryItem.${inv_id}.total_units == 5"

      - name: claim_submit_then_denial_conserves_patient_acp_minutes
        grounds:
          - calculations.patient_acp_minutes_claimed
          - entities.Patient.fields.acp_minutes_claimed
          - entities.Patient.fields.acp_paid_cents_ytd
          - state_machines.AcpBillingClaim.ATTESTED_to_SUBMITTED
          - state_machines.AcpBillingClaim.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          Conserved quantity number 2: documented advance-care-planning MINUTES
          on the Patient ledger - a time quantity, not physical units. Submission
          adds exactly documented_minutes and denial subtracts exactly the same
          amount, returning acp_minutes_claimed to 0 while acp_paid_cents_ytd
          never moves because no claim reached PAID.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with acp_minutes_claimed 0 and acp_paid_cents_ytd 0."
            - "One AcpBillingClaim of 46 IN_PERSON documented minutes in status DRAFT with no conference_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1018", full_name: "Sami Haddad", date_of_birth: "1936-06-15", jurisdiction_code: "JUR_NOTARY", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/claims"
              payload: { patient_id: "${p_id}", service_date: "2026-06-01T09:00:00Z", documented_minutes: 46, modality: "IN_PERSON" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
              captures: { claim_id: $.data.id }
            - call: "POST /palliative/claims/${claim_id}/attest"
              payload: { attestation_statement: "46 minutes of goals-of-care discussion documented" }
              as: BillingSpecialist
              as_user_id: "u_billing_1"
          trigger:
            - call: "POST /palliative/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              as_user_id: "u_billing_1"
            - call: "POST /palliative/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_reason: "DOCUMENTATION_INSUFFICIENT" }
              as: ProgramAdmin
          assert:
            - "AcpBillingClaim.${claim_id}.billable_units == 2"
            - "AcpBillingClaim.${claim_id}.net_payable_cents == 12880"
            - "AcpBillingClaim.${claim_id}.status == DENIED"
            - "AcpBillingClaim.${claim_id}.denial_reason == DOCUMENTATION_INSUFFICIENT"
            - "AcpBillingClaim.${claim_id}.documentation_attested == false"
            - "Patient.${p_id}.acp_minutes_claimed == 0"
            - "Patient.${p_id}.acp_paid_cents_ytd == 0"
