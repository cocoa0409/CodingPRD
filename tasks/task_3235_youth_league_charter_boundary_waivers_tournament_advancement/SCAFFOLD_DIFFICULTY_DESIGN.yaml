          Entity pair Player -> AllStarRoster (distinct from League ->
          TournamentEntry): a selection can only land while the PLAYER's
          eligibility_status is ELIGIBLE — a registered but never-verified
          (PENDING) player on an otherwise valid OPEN roster is rejected.
        test_recipe:
          setup:
            - "League CHARTERED; clock 2027-02-01; player P1 registered (PENDING, never verified); roster R (MAJOR) OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
