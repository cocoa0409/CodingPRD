  - name: offering_fills_exactly_at_ceiling_then_next_unit_oversubscribes
    grounds:
    - §1.4 priority 14 business_fiscal -> ERR_OVERSUBSCRIPTION (422)
    - §1.1 OfferingDocument.offering_amount_cents 120,000,000 with unit_price_cents 60,000,000
    - §1.2 Production.offering_status -> FULLY_SUBSCRIBED
    distinguishing_aspect: |
      The second accept lands the accepted total on exactly 120,000,000, which must be
      allowed (the ceiling is inclusive) and must flip the offering to FULLY_SUBSCRIBED;
      the third accept, which would reach 180,000,000, must be refused with
      ERR_OVERSUBSCRIPTION. An implementation using a strict less-than comparison rejects
      the second accept at the exact ceiling; one using <= on the post-state without
      re-checking rejects nothing.
    test_recipe:
      setup:
      - |-
