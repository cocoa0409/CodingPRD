      - name: requester_touching_another_filers_request_returns_requester_mismatch
        claim_type: Violation -> Error
        grounds:
          - validations.priority_6
          - errors.ERR_REQUESTER_MISMATCH
          - roles.Requester.shared_operations
        distinguishing_aspect: |
          Ownership is checked at priority 6, so the intruder's payment is refused with
          ERR_REQUESTER_MISMATCH even though the same call would also fail the fee-state
          check at priority 8, and the owner's identical read succeeds.
        test_recipe:
          setup:
            - "Two GENERAL_PUBLIC requesters, A and B; one request filed by A over a 30-minute ROUTINE recording."
            - "No FeeEstimate is issued, so A's request sits in fee_status NOT_ASSESSED, a state from which no payment is legal for anybody."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Filer A", email: "a@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_a_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Filer B", email: "b@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_b_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0660", device_serial: "AXON-0660", officer_badge: "B-1157", recorded_start_at: "2026-07-04T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-04T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${req_a_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0660", requested_date_from: "2026-07-04T00:00:00Z", requested_date_to: "2026-07-05T00:00:00Z", scope_narrative: "Filer A's request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { request_id: $.data.id } }
          trigger:
            - { call: "GET /records/requests/${request_id}", as: Requester, as_user_id: "${req_b_id}", captures: { e_read: $.data.error_id } }
            - { call: "POST /records/requests/${request_id}/payments", payload: { amount_cents: 500, memo: "Paying a stranger's fee" }, as: Requester, as_user_id: "${req_b_id}", captures: { e_pay: $.data.error_id } }
            - { call: "GET /records/requests?requester_id=${req_a_id}", as: Requester, as_user_id: "${req_b_id}", captures: { e_list: $.data.error_id } }
            - { call: "GET /records/requests/${request_id}", as: Requester, as_user_id: "${req_a_id}" }
          assert:
            - "first response: HTTP 403 and ${e_read} == ERR_REQUESTER_MISMATCH"
            - "second response: HTTP 403 and ${e_pay} == ERR_REQUESTER_MISMATCH, not ERR_FEE_STATE_INVALID — priority 6 precedes priority 8"
            - "third response: HTTP 403 and ${e_list} == ERR_REQUESTER_MISMATCH — the list form is narrowed by the same ownership check"
            - "fourth response: HTTP 200 for the owner, with requester_id == ${req_a_id} and fee_status == NOT_ASSESSED"
            - "GET /records/fee-ledger-entries?request_id=${request_id} returns total_count == 0 — the refused payment wrote no row"
      - name: matter_number_is_globally_unique_across_incidents
        claim_type: Violation -> Error
        grounds:
          - validations.priority_17
          - errors.ERR_DUPLICATE_MATTER_NUMBER
          - endpoints."POST /records/litigation-holds"
        distinguishing_aspect: |
          Uniqueness is global rather than per incident, so reusing a matter number for a
          different scope_incident_number is refused and the second incident's recording
          stays SCHEDULED with no partial suspension applied.
        test_recipe:
          setup:
            - "Two recordings on two different incidents, INC-2026-0661 and INC-2026-0662, both SCHEDULED."
            - "One counsel to place holds; the clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Counsel A", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_a_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0661", device_serial: "AXON-0661", officer_badge: "B-1158", recorded_start_at: "2026-07-03T09:00:00Z", duration_ms: 900000, classification: "USE_OF_FORCE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-03T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_one_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0662", device_serial: "AXON-0662", officer_badge: "B-1159", recorded_start_at: "2026-07-03T10:00:00Z", duration_ms: 900000, classification: "USE_OF_FORCE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-03T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_two_id: $.data.id } }
          trigger:
            - { call: "POST /records/litigation-holds", payload: { matter_number: "LIT-2026-0044", scope_incident_number: "INC-2026-0661", hold_type: "CIVIL_RIGHTS_SUIT" }, as: LegalCounsel, as_user_id: "${counsel_a_id}", captures: { hold_one_id: $.data.id } }
            - { call: "POST /records/litigation-holds", payload: { matter_number: "LIT-2026-0044", scope_incident_number: "INC-2026-0662", hold_type: "CIVIL_RIGHTS_SUIT" }, as: LegalCounsel, as_user_id: "${counsel_a_id}", captures: { e_dupe: $.data.error_id } }
          assert:
            - "first response: HTTP 201, LitigationHold.${hold_one_id}.status == ACTIVE, placed_at == 2026-08-01T00:00:00Z and suspended_asset_count == 1"
            - "second response: HTTP 409 and ${e_dupe} == ERR_DUPLICATE_MATTER_NUMBER"
            - "VideoAsset.${asset_one_id}: disposition_state == SUSPENDED, retention_locked == true, suspended_by_hold_id == ${hold_one_id}"
            - "VideoAsset.${asset_two_id}: disposition_state == SCHEDULED, retention_locked == false, suspended_by_hold_id == null — the refused hold suspended nothing"
            - "GET /records/video-assets?suspended_by_hold_id=${hold_one_id} returns total_count == 1, holding only ${asset_one_id}"
      - name: notification_is_a_one_way_step_and_never_reaches_a_not_required_person
        claim_type: Violation -> Error
        grounds:
          - validations.priority_8
          - errors.ERR_NOTIFICATION_STATE_INVALID
          - state_machines.DepictedIndividual.notification_status
        distinguishing_aspect: |
          PENDING -> NOTIFIED is the only entry into the notified state, so a second notice
          to the same person is refused, a notice after they objected is refused, and a
          BYSTANDER who initialised in NOT_REQUIRED can never be notified at all.
        test_recipe:
          setup:
            - "One 30-minute ROUTINE recording of INC-2026-0663 carrying a VICTIM (notification_required true, PENDING) and a BYSTANDER (notification_required false, NOT_REQUIRED)."
            - "The recording is RESPONSIVE on one request, so the victim's objection can name a real responsive record."
            - "The clock stays at 2026-08-01T00:00:00Z, so the victim's ten-day objection window is wide open."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0663", device_serial: "AXON-0663", officer_badge: "B-1160", recorded_start_at: "2026-07-02T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-02T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Victim A", relationship: "VICTIM" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { victim_id: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Bystander A", relationship: "BYSTANDER" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { bystander_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0663", requested_date_from: "2026-07-02T00:00:00Z", requested_date_to: "2026-07-03T00:00:00Z", scope_narrative: "Half an hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single half-hour recording", requested_date_from: "2026-07-02T00:00:00Z", requested_date_to: "2026-07-02T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /records/depicted-individuals/${victim_id}/notification", payload: { notice_method: "FIRST_CLASS_MAIL" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/depicted-individuals/${victim_id}/notification", payload: { notice_method: "EMAIL" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_twice: $.data.error_id } }
            - { call: "POST /records/depicted-individuals/${bystander_id}/notification", payload: { notice_method: "EMAIL" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_not_required: $.data.error_id } }
            - { call: "POST /records/depicted-individuals/${victim_id}/objection", payload: { objection_basis: "VICTIM_STATUS", responsive_record_id: "${rec_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { objection_claim_id: $.data.id } }
            - { call: "POST /records/depicted-individuals/${victim_id}/notification", payload: { notice_method: "PERSONAL_SERVICE" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_after_objection: $.data.error_id } }
          assert:
            - "first response: HTTP 200, DepictedIndividual.${victim_id}.notification_status == NOTIFIED, notified_at == 2026-08-01T00:00:00Z, notice_method == FIRST_CLASS_MAIL and objection_deadline_at == 2026-08-11T00:00:00Z"
            - "second response: HTTP 409 and ${e_twice} == ERR_NOTIFICATION_STATE_INVALID, and notice_method is still FIRST_CLASS_MAIL — the refused call did not overwrite the method"
            - "third response: HTTP 409 and ${e_not_required} == ERR_NOTIFICATION_STATE_INVALID; DepictedIndividual.${bystander_id}.notification_status is still NOT_REQUIRED with notified_at == null"
            - "fourth response: HTTP 201, DepictedIndividual.${victim_id}.notification_status == OBJECTED with objection_basis == VICTIM_STATUS, and ExemptionClaim.${objection_claim_id}.claim_source == DEPICTED_OBJECTION"
            - "fifth response: HTTP 409 and ${e_after_objection} == ERR_NOTIFICATION_STATE_INVALID — OBJECTED has no edge back to NOTIFIED"
            - "PublicRecordsRequest.${req_id}.open_notification_count == 1 — the objecting victim still counts as unresolved"
      - name: a_record_can_only_be_ruled_once
        claim_type: Idempotency
        grounds:
          - validations.priority_8
          - errors.ERR_RECORD_STATE_INVALID
          - state_machines.ResponsiveRecord.inclusion_status
        distinguishing_aspect: |
          CANDIDATE is the only state an inclusion ruling may leave, so repeating the same
          RESPONSIVE ruling and re-ruling the record EXCLUDED are both refused, and the
          request's counters do not move on either refusal.
        test_recipe:
          setup:
            - "One request in SCOPING with a single CANDIDATE record over a 30-minute ROUTINE recording."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0664", device_serial: "AXON-0664", officer_badge: "B-1161", recorded_start_at: "2026-07-01T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-01T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0664", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", scope_narrative: "Half an hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single half-hour recording", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-01T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
          trigger:
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_again: $.data.error_id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "EXCLUDED" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_flip: $.data.error_id } }
          assert:
            - "first response: HTTP 200, ResponsiveRecord.${rec_id}.inclusion_status == RESPONSIVE and PublicRecordsRequest.${req_id}.processing_status == EXEMPTION_REVIEW"
            - "second response: HTTP 409 and ${e_again} == ERR_RECORD_STATE_INVALID — the ruling is not idempotent"
            - "third response: HTTP 409 and ${e_flip} == ERR_RECORD_STATE_INVALID — RESPONSIVE -> EXCLUDED is not a declared edge"
            - "ResponsiveRecord.${rec_id}.inclusion_status is still RESPONSIVE and release_posture == OPEN"
            - "PublicRecordsRequest.${req_id}.responsive_record_count == 1 and VideoAsset.${asset_id}.retention_locked == true"
      - name: appeal_decision_outside_the_appealed_state_is_letter_state_invalid
        claim_type: Violation -> Error
        grounds:
          - validations.priority_8
          - errors.ERR_LETTER_STATE_INVALID
          - validations.priority_10
          - state_machines.DenialLetter.status
        distinguishing_aspect: |
          Only APPEALED admits a decision, so deciding an ISSUED letter and re-deciding an
