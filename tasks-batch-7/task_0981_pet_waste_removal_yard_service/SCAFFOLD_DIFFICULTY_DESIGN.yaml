          assert:
            - "Invoice.${inv_d}.invoice_status == RESOLVED (took FINALIZED->DISPUTED->RESOLVED branch, not PAID)"
            - "Customer.${cu_e}.credit_balance_cents == 1500 (resolution_credit posted)"

  # =========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: vacation_window_applied_depth3_cascade
        grounds:
          - state_machines.VacationWindow.SCHEDULED_to_APPLIED
          - state_machines.Visit.SCHEDULED_to_SKIPPED
          - calculations.vacation_skip_credit
          - calculations.route_load_factor_bp
        distinguishing_aspect: |
          Cascade depth >= 3 originating from VacationWindowApplier:
          VacationWindow SCHEDULED->APPLIED
          -> each covered Visit SCHEDULED->SKIPPED (skip_source=VACATION)
          -> ServiceRoute.committed_visit_count -= 1 AND route_load_factor_bp recomputed
          -> VACATION_CREDIT InvoiceLineItem posted on Invoice (which mutates
             Invoice.subtotal_cents when finalized).
        test_recipe:
          setup:
            - "Subscription sub_f ACTIVE with monthly snapshot 10000c"
            - "Visit v_f SCHEDULED on 2026-05-06, assigned to route rt_f with capacity 5"
            - "route rt_f.committed_visit_count == 1, load_factor_bp == 2000"
            - "OPEN Invoice inv_f covering 2026-05-01..2026-06-01"
            - "VacationWindow vw_f SCHEDULED covering 2026-05-06..2026-05-06"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "F", email: "f@x.com", phone: "+14155550106" }
              as: OperationsManager
              captures: { cu_f: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_f}", address_line1: "5 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_f: $.data.id }
            - call: "POST /api/yards/${y_f}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_f: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_f}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WF", display_name: "WF", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_f: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_f}", yard_id: "${y_f}", plan_id: "${pl_f}" }
              as: Customer
              as_user_id: "${cu_f}"
              captures: { sub_f: $.data.id }
            - call: "POST /api/subscriptions/${sub_f}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_f}"
            - call: "POST /api/technicians"
              payload: { full_name: "TF", employee_code: "T100" }
              as: OperationsManager
              captures: { t_f: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RF", service_date: "2026-05-06T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_f}", max_visit_capacity: 5 }
              as: OperationsManager
              captures: { rt_f: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_f}", scheduled_date: "2026-05-06T00:00:00Z", scheduled_window_start: "2026-05-06T09:00:00Z", scheduled_window_end: "2026-05-06T12:00:00Z", service_route_id: "${rt_f}" }
              as: OperationsManager
              captures: { v_f: $.data.id }
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_f}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_f: $.data.id }
            - call: "POST /api/vacation-windows"
              payload: { subscription_id: "${sub_f}", start_date: "2026-05-06T00:00:00Z", end_date: "2026-05-06T00:00:00Z", skip_reason: "VACATION" }
              as: Customer
              as_user_id: "${cu_f}"
              captures: { vw_f: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:01Z" }
              as: OperationsManager
            - call: "POST /api/_system/vacation-window-applier/run"
              payload: {}
              as: OperationsManager
          assert:
            - "VacationWindow.${vw_f}.window_status == APPLIED"
            - "Visit.${v_f}.status == SKIPPED AND Visit.${v_f}.skip_source == VACATION"
            - "ServiceRoute.${rt_f}.committed_visit_count == 0 (decremented from 1)"
            - "ServiceRoute.${rt_f}.route_load_factor_bp == 0"
            - "Invoice.${inv_f} has a VACATION_CREDIT line with unit_price_cents == -2310 (round_half_up(10000/4.33))"
      - name: subscription_pause_cascade_visit_cancel_depth2
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
