      - name: loan_out_line_paid_gross_no_withholding
        claim_type: variant_selection
        grounds:
          - "calculations.jurisdiction_tax_calculation"
          - "calculations.garnishment_waterfall"
        distinguishing_aspect: "Variant selection by payee_type: a LOAN_OUT engagement's line withholds zero tax and is exempt from garnishment even with an ACTIVE order, while PHW employer contributions still accrue on gross."
        test_recipe:
          setup: ["standard fixture but engagement is LOAN_OUT (Starlight Loans Inc); garnishment order ACTIVE on the performer; TC-A approved; batch closed"]
