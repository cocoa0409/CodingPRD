          - errors[ERR_STARTER_CAPACITY_EXCEEDED]
          - state_machines.RosterSlot.participation_to_RELEASED
        distinguishing_aspect: |
          A different conserved quantity — an integer seat count, not money and not points — and
          a different compensating pair (slot creation against slot release). The sum must equal
          Season.max_starters after every mutation, including the failed fourth insert, and
          releasing a seat must both free capacity and let a replacement student take it. An
          implementation that decrements used without incrementing available, or that recomputes
          available from ACTIVE slots only, breaks the identity while every individual field
          still looks plausible.
