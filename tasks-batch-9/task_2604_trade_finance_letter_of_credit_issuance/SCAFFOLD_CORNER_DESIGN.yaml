      - name: cascading_validation_screening_review_must_resolve_before_conclusion
        claim_type: cascading_validation
        grounds:
          - validations.priority_20_business_safety
          - errors.ERR_SCREENING_REVIEW_PENDING
          - endpoints.POST_/presentations/{id}/conclude-examination
          - endpoints.POST_/screening-checks/{id}/review
        distinguishing_aspect: |
          Submission itself creates the PRESENTED_DOCUMENTS screening, and the two
          high-risk transit legs put it at risk_score 40 / HIT_PENDING_REVIEW -
          not BLOCKED - so the submit succeeds and the drawing is reserved, yet
          the examination cannot be concluded: 409 ERR_SCREENING_REVIEW_PENDING.
          The bar is lifted only by a ComplianceOfficer RELEASE decision, after
          which the very same conclude call returns 200 and COMPLYING. An
          implementation that only inspects BLOCKED lets the conclusion through
          while compliance is still deciding.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, then 2026-09-14T09:00:00Z."
            - "The standard 10000000 SIGHT_PAYMENT credit is ISSUED on a 50000000 facility."
            - "A presentation carries a 4000000 COMMERCIAL_INVOICE whose transit_country_codes are [\"AE\",\"HK\"] plus a matching BILL_OF_LADING, and is submitted."
          setup_api_calls:
