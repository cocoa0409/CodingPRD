          - state_machines.EligibilityTerm.ACTIVE_to_EXPIRED
          - endpoints[POST /mep/eligibility-terms/sweep]
        distinguishing_aspect: "One sweep call processes the whole batch in term_end_on ASC order and applies a per-row decision, not a single uniform action: with the clock at 2029-07-15 the term ending 2029-06-30 goes EXPIRED while the term ending 2029-07-30 goes EXPIRING, so swept_count is 2 but expired_count and expiring_count are each 1 and expired_term_ids holds only the first term."
