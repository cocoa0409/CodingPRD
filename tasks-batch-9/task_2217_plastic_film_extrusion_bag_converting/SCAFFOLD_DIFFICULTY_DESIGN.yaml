          - entities.BlendRecipe.fields.regrind_cap_pct
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (c): the five pinned steps make step 3 read ONLY the step-2 virgin_pcr_pct
          (18.000 -> MID -> 35.0 - 2.0 = 33.000 cap, and 32.000 % regrind is admissible), whereas
          deriving the band from the step-5 nominal_recycled_content_pct (26.000 -> HIGH ->
