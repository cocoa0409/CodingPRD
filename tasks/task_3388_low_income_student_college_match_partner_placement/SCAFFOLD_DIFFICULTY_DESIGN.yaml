  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: suspended_college_skipped_in_match_run
        grounds:
          - calculations.binding_match_assignment
          - state_machines.PartnerCollege.ACTIVE_to_SUSPENDED
          - state_machines.Application.RANKING_LOCKED_to_UNMATCHED
        distinguishing_aspect: |
          Entity pair Application <-> PartnerCollege: the matchability of an
          application depends on the college's status at run time — a college
          SUSPENDED after the ranking was accepted is skipped, so the
          single-list student falls through to REGULAR_POOL instead of matching.
        test_recipe:
          setup:
            - "Cycle A; one college (1 slot); one finalist whose accepted ranking list names only that college; the college is SUSPENDED after the ranking was submitted; clock past ranking_closes_at; cycle advanced to MATCH_RUN."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - call: "POST /colleges/${col}/suspend"
              as: ProgramAdmin
            - *clock_nov
            - *adv
          trigger:
            - call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
              captures: { mc: $.data.matched_count, uc: $.data.unmatched_count }
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { st: $.data.status }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { slots: $.data.slots_committed }
          assert:
            - "run-match succeeds with matched_count == 0 and unmatched_count == 1 (suspension is a skip, not an error)"
            - "Application.${app}.status == REGULAR_POOL (passed through UNMATCHED)"
            - "PartnerCollege.${col}.slots_committed == 0"

      - name: finalize_blocked_until_verification_decided
        grounds:
          - state_machines.AidPackage.PROVISIONAL_to_FINALIZED
          - state_machines.IncomeVerification.PENDING_to_VERIFIED
          - validations[priority=13]
          - errors[ERR_VERIFICATION_REQUIRED]
        distinguishing_aspect: |
          Entity pair AidPackage <-> IncomeVerification (different pair from the
          Application <-> PartnerCollege instance): finalize is gated on the
          verification's outcome — PENDING blocks with ERR_VERIFICATION_REQUIRED
          and the gate opens only when the verification reaches VERIFIED.
        test_recipe:
          setup:
            - "Cycle A with the match run complete; one matched student with a PROVISIONAL package; a counselor-submitted IncomeVerification (6200000/500000/4) still PENDING."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkcns
            - *mkprt
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
            - *mkiv
          trigger:
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { err: $.data.error_id }
            - *decide_verify
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { fin_status: $.data.status, fin_var: $.data.aid_variant, fin_efc: $.data.efc_cents }
          assert:
            - "with the verification PENDING, finalize is rejected with ERR_VERIFICATION_REQUIRED (409) and the package stays PROVISIONAL"
            - "after the partner's VERIFY decision (outcome VERIFIED), the same finalize succeeds: status FINALIZED, aid_variant VERIFIED, efc_cents 453200"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: prep_program_half_open_adjacency_allows_touching_intervals
        grounds:
          - validations[priority=7]
          - errors[ERR_PROGRAM_OVERLAP]
          - entities.PrepProgram
        distinguishing_aspect: |
          Resource: one student's program timeline; semantics: half-open
          [starts_on, ends_on). A program starting exactly when another ends
          (ends_on == starts_on) does NOT conflict, while a truly intersecting
          one does — adjacency is allowed, which the closed-interval companion
          instance forbids.
        test_recipe:
          setup:
            - "One registered student; no cycle needed (prep records are not phase-gated)."
          setup_api_calls:
            - *clock0
            - *mkstu
          trigger:
            - call: "POST /prep-programs"
              payload: { student_id: "${stu}", program_type: "SUMMER", cohort_label: "s-2026", starts_on: "2026-06-01T00:00:00Z", ends_on: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /prep-programs"
              payload: { student_id: "${stu}", program_type: "SCHOLAR", cohort_label: "f-2026", starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { p2: $.data.id }
            - call: "POST /prep-programs"
              payload: { student_id: "${stu}", program_type: "SUMMER", cohort_label: "x-2026", starts_on: "2026-07-15T00:00:00Z", ends_on: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "P1 [06-01, 08-01) is created (201)"
            - "P2 starting exactly at P1's ends_on is also created (201) — half-open adjacency is not an overlap"
            - "P3 [07-15, 08-15) intersects P1 (and P2) and is rejected with ERR_PROGRAM_OVERLAP (409)"

      - name: cycle_window_closed_interval_touching_date_conflicts
        grounds:
          - validations[priority=7]
          - errors[ERR_CYCLE_OVERLAP]
          - entities.MatchCycle
        distinguishing_aspect: |
          Resource: the consortium cycle calendar; semantics: closed-interval —
          two application windows sharing even a single date conflict, so a
          cycle opening on 2026-09-30 (the existing cycle's closing day) is
          rejected while one opening 2026-10-01 is accepted. Different resource
          and different interval semantics from the prep-program instance.
        test_recipe:
          setup:
            - "Cycle A exists with application window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]."
          setup_api_calls:
            - *clock0
            - *mkcycle
          trigger:
            - call: "POST /cycles"
              payload: { name: "Cycle B", app_opens_at: "2026-09-30T00:00:00Z", app_closes_at: "2026-10-30T23:59:59Z", ranking_opens_at: "2026-11-15T00:00:00Z", ranking_closes_at: "2026-11-30T23:59:59Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /cycles"
              payload: { name: "Cycle C", app_opens_at: "2026-10-01T00:00:00Z", app_closes_at: "2026-10-31T23:59:59Z", ranking_opens_at: "2026-11-15T00:00:00Z", ranking_closes_at: "2026-11-30T23:59:59Z" }
              as: ProgramAdmin
              captures: { c3: $.data.id, c3_phase: $.data.phase }
          assert:
            - "Cycle B opening on 2026-09-30 (inside A's closed window) is rejected with ERR_CYCLE_OVERLAP (409)"
            - "Cycle C opening 2026-10-01 is created with phase SETUP — closed-interval conflict needs a shared date, and there is none"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_conservation_across_match_and_release
        grounds:
          - calculations.binding_match_assignment
          - entities.PartnerCollege.fields.slots_committed
          - state_machines.Match.BINDING_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: slot count. For the college,
          match_slots == slots_committed + free_slots at every observation:
          1 == 0 + 1 before the run, 1 == 1 + 0 after the assignment, and
          1 == 0 + 1 again after the release compensates it.
        test_recipe:
          setup:
            - "Cycle A; one college with match_slots 1; two finalists, S1 (academic_index 1142) and S2 (academic_index 1060), each ranking only this college; rankings locked; clock past ranking_closes_at; cycle in MATCH_RUN."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - call: "POST /colleges"
              payload: { name: "One Slot College", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col: $.data.id, sc0: $.data.slots_committed }
            - call: "POST /students"
              payload: { email: "w1@x.com", full_name: "Win One", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu1: $.data.id }
            - call: "POST /students"
              payload: { email: "w2@x.com", full_name: "Win Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu1}"
              captures: { app1: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 375, test_score: 1240 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app1}/submit"
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
            - *adv
            - call: "POST /applications/${app1}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av1: $.data.version }
            - call: "POST /applications/${app2}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av2: $.data.version }
            - *adv
            - *clock_rank
            - call: "POST /applications/${app1}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av1}" }
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /applications/${app2}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av2}" }
              as: Student
              as_user_id: "${stu2}"
            - *clock_nov
            - *adv
          trigger:
            - call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
              captures: { mc: $.data.matched_count }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { sc1: $.data.slots_committed }
            - call: "GET /matches"
              payload: { application_id: "${app1}" }
              as: ProgramAdmin
              captures: { m1: "$.data[0].id" }
            - call: "POST /matches/${m1}/release"
              payload: { reason: "compensation test" }
              as: ProgramAdmin
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { sc2: $.data.slots_committed }
            - call: "GET /applications/${app2}"
              as: ProgramAdmin
              captures: { s2_status: $.data.status }
          assert:
            - "before the run: slots_committed == 0 (sc0), so 1 == 0 committed + 1 free"
            - "after the run: matched_count == 1 and slots_committed == 1 (sc1) — S1 (higher academic_index) took the only slot, so 1 == 1 + 0"
            - "S2 fell through: Application.${app2}.status == REGULAR_POOL"
            - "after the compensating release: slots_committed == 0 (sc2), restoring 1 == 0 + 1 with zero drift"

      - name: full_need_coverage_survives_revise_pair
        grounds:
          - calculations.aid_package_composition
          - state_machines.AidPackage.FINALIZED_to_REVISED
          - entities.AidPackage.fields.grant_cents
        distinguishing_aspect: |
          Conserved quantity: dollar coverage (a different conserved quantity
          from slot count). For a FINALIZED package,
          grant_cents + loan_cents + work_study_cents + efc_cents == coa_cents
          holds after every commit, and a revise up (+100000 coa) compensated by
          a revise back down returns grant_cents to exactly 7246800.
        test_recipe:
          setup:
            - "Cycle A; matched student at a NO_LOAN college (coa 8000000); package FINALIZED under the VERIFIED variant: efc 453200, work_study 300000, loan 0, grant 7246800."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkcns
            - *mkprt
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
            - *mkiv
            - *decide_verify
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /aid-packages/${pkg}/revise"
              payload: { coa_cents: 8100000, expected_aid_package_version: "${pkg_v}" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { rg1: $.data.grant_cents, rv1: $.data.version }
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { pkg_v2: $.data.version }
            - call: "POST /aid-packages/${pkg}/revise"
              payload: { coa_cents: 8000000, expected_aid_package_version: "${pkg_v2}" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { f_grant: $.data.grant_cents, f_loan: $.data.loan_cents, f_work: $.data.work_study_cents, f_efc: $.data.efc_cents, f_coa: $.data.coa_cents, f_status: $.data.status }
          assert:
            - "after the +100000 revise: grant_cents == 7346800 (need 7646800 = 8100000 - 453200; work stays 300000 at cap)"
            - "at that point 7346800 + 0 + 300000 + 453200 == 8100000 == the new coa_cents"
            - "after the compensating revise back to 8000000 and re-finalize: grant_cents == 7246800 exactly (no drift), loan_cents == 0, work_study_cents == 300000, efc_cents == 453200"
            - "final: 7246800 + 0 + 300000 + 453200 == 8000000 == coa_cents and status == FINALIZED"
