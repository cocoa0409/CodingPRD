          Every child aggregate is reachable both under its parent and through a flat filtered list: the
          tower's five sections come back in erosion_priority order for the policy filter, and the same
          application's five attestations and single scan are reachable by application_id, with the flat lists
          agreeing row for row with the nested ones.
        test_recipe:
