            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 30, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          trigger:
            - { call: "POST /api/seasons/${s}/run-ops", payload: {}, as: Owner, captures: { idx: $.data.ops_run_index } }
          assert:
            - "run-ops created an allocation: GET /api/allocations?order_id=${ord} returns 1 row with quantity == 30, status RESERVED"
            - "hop 2-3: WholesaleOrder.${ord}.allocated_qty == 30 and status == ALLOCATED (auto-flip caused by the allocation creation)"
            - "StandBucket H_6_7 reserved_count == 30, standing_count == 300"
            - "Season.${s}.ops_run_index == 1 (${idx} == 1)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_cancelled_order_with_credit_hold_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=15]
        distinguishing_aspect: |
          Category pair state-vs-business_referential: the target order is
          CANCELLED (state, priority 6) AND its buyer is on CREDIT_HOLD
          (referential, priority 15); the higher-priority state error must win.
        test_recipe:
          setup:
            - "Season in BOOKING; buyer on CREDIT_HOLD; order already CANCELLED after a successful submit+cancel"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 100 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
            - { call: "POST /api/wholesale-orders/${ord}/cancel", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
            - { call: "POST /api/buyer-accounts/${buy}/set-standing", payload: { to_standing: "CREDIT_HOLD" }, as: Owner }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "response 409 with error_id == ERR_INVALID_STATE (state priority 6 beats referential priority 15)"
            - "NOT ERR_BUYER_CREDIT_HOLD even though buyer standing is CREDIT_HOLD"
            - "WholesaleOrder.${ord}.status remains CANCELLED"

      - name: ticket_outside_window_and_overcut_temporal_wins
        grounds:
          - validations[priority=9]
          - validations[priority=27]
        distinguishing_aspect: |
          Category pair business_temporal-vs-business_constraint: the ticket's
          work_date is outside the harvest window (temporal, priority 9) AND the
          line cut_count exceeds the allocation remainder (constraint, priority
          27); the temporal error must win. Different category pair than the
          state/referential instance.
        test_recipe:
          setup:
            - "Season in HARVEST (clock 2026-11-05); block HARVESTABLE; crew ACTIVE; allocation with 10 trees remaining"
            - "Ticket arrives with work_date 2026-10-20 (outside 2026-11-01..2026-11-25) and cut_count 999 (> 10 remaining)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 10, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-10-20", hours_worked: 8, lines: [ { allocation_id: "${alc}", cut_count: 999 } ] }, as: CrewLead, as_user_id: "${crw}" }
          assert:
            - "response 422 with error_id == ERR_OUTSIDE_HARVEST_WINDOW (temporal priority 9 beats constraint priority 27)"
            - "NOT ERR_CUT_EXCEEDS_ALLOCATION even though 999 > 10 uncut remainder"
            - "no ticket persisted: GET /api/harvest-tickets?crew_id=${crw} returns total_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: allocate_exactly_available_then_zero_pool
        grounds:
          - calculations.allocation_waterfall
          - entities.StandBucket.fields.available_count
        distinguishing_aspect: |
          Count boundary on the allocate endpoint: requesting exactly the
          available count (70 == 70, <= semantics) succeeds and drains the pool
          to zero; the very next 1-tree request against the now-empty pool fails.
          Metric: tree count.
        test_recipe:
          setup:
            - "Season in BOOKING; lot H_6_7 standing exactly 70; order qty 71 submitted"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 70, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 71, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 70, expected_order_version: "${ov}" }, as: FarmManager, captures: { now70: $.data.allocated_now, ov2: $.data.order_version } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { avail: "$.data[2].available_count" } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 1, expected_order_version: "${ov2}" }, as: FarmManager }
          assert:
            - "boundary accept: first allocate of exactly the available 70 succeeded — ${now70} == 70"
            - "bucket drained to the exact boundary: ${avail} == 0 (available 70 - reserved 70)"
            - "zero-pool reject: trigger returns 422 with error_id == ERR_NO_ELIGIBLE_INVENTORY"
            - "WholesaleOrder.${ord}.status remains SUBMITTED (70 < 71, never fully allocated)"

      - name: ship_at_shipping_window_end_inclusive
        grounds:
          - state_machines.Load.BUILDING_to_SHIPPED
          - validations[priority=10]
        distinguishing_aspect: |
          Time boundary on the ship endpoint (distinct metric from the tree-count
          boundary on allocate): clock exactly equal to shipping_window_end ships
          (inclusive), one second past it fails. Exercised on POST
          /api/loads/{id}/ship, a different endpoint than the allocate boundary.
        test_recipe:
          setup:
            - "Season progressed to SHIPPING; two orders fully cut and loaded onto loadA (8x H_6_7) and loadB (4x H_6_7); both loads BUILDING"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 200, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 8, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { oa: $.data.id } }
            - { call: "POST /api/wholesale-orders/${oa}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { oav: $.data.version } }
            - { call: "POST /api/wholesale-orders/${oa}/allocate", payload: { quantity: 8, expected_order_version: "${oav}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${oa}", payload: {}, as: FarmManager, captures: { ala: "$.data[0].id" } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 4, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ob: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ob}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { obv: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ob}/allocate", payload: { quantity: 4, expected_order_version: "${obv}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ob}", payload: {}, as: FarmManager, captures: { alb: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${ala}", cut_count: 8 } ] }, as: CrewLead, as_user_id: "${crw}" }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-06", hours_worked: 4, lines: [ { allocation_id: "${alb}", cut_count: 4 } ] }, as: CrewLead, as_user_id: "${crw}" }
            - { call: "POST /api/loads", payload: { season_id: "${s}", carrier_name: "Carrier A", capacity_units: 100, pickup_window_start: "2026-11-20T09:00:00Z", pickup_window_end: "2026-11-20T10:00:00Z" }, as: FarmManager, captures: { lda: $.data.id } }
            - { call: "POST /api/loads/${lda}/lines", payload: { allocation_id: "${ala}", quantity: 8 }, as: FarmManager }
            - { call: "POST /api/loads", payload: { season_id: "${s}", carrier_name: "Carrier B", capacity_units: 50, pickup_window_start: "2026-11-21T09:00:00Z", pickup_window_end: "2026-11-21T10:00:00Z" }, as: FarmManager, captures: { ldb: $.data.id } }
            - { call: "POST /api/loads/${ldb}/lines", payload: { allocation_id: "${alb}", quantity: 4 }, as: FarmManager }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "SHIPPING" }, as: Owner }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T23:59:59Z" }, as: Owner }
          trigger:
            - { call: "POST /api/loads/${lda}/ship", payload: {}, as: FarmManager, captures: { lda_st: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T00:00:00Z" }, as: Owner }
            - { call: "POST /api/loads/${ldb}/ship", payload: {}, as: FarmManager }
          assert:
            - "boundary accept: loadA shipped at clock == shipping_window_end exactly; ${lda_st} == SHIPPED"
            - "boundary reject: loadB one second past the end returns 422 with error_id == ERR_OUTSIDE_SHIPPING_WINDOW"
            - "Load.${ldb}.status remains BUILDING"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_gated_by_buyer_standing
        grounds:
          - state_machines.WholesaleOrder.DRAFT_to_SUBMITTED
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair WholesaleOrder -> BuyerAccount: the order's DRAFT->SUBMITTED
          transition is legal only while the related buyer's standing is
          GOOD_STANDING; CREDIT_HOLD blocks it and restoring GOOD_STANDING
          unblocks the very same order.
        test_recipe:
          setup:
            - "Season in BOOKING; buyer placed on CREDIT_HOLD; DRAFT order exists"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/buyer-accounts/${buy}/set-standing", payload: { to_standing: "CREDIT_HOLD" }, as: Owner }
