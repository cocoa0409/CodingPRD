              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "GET /order-lines/${line_id}"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /order-lines/${line_id}"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "trigger 2 returns HTTP 200 and its data block equals trigger 1's data block field for field: id == ${line_id}, order_id == ${order_id}, sku_id == ${sku_id}, ordered_qty == 2"
            - "both bodies carry provisional_line_price_cents == 1400 (2 x 700), final_line_price_cents == null, picked_units == null, line_status == PENDING and substitution_resolution == NOT_REQUIRED"
            - "both bodies carry the same created_at, the same updated_at and version == ${line_v}"
            - "trigger 3, the same read issued by a different role, returns HTTP 200 with an identical data block -- the read is role-agnostic and still side-effect free"
            - "after all three reads GET /order-lines/${line_id} still shows version == ${line_v}, so no GET incremented the version"
            - "trigger 4 shows CustomerOrder.${order_id}.merchandise_subtotal_cents == 1400, confirming the line create -- not the reads -- moved the order's derived total"

  # ===========================================================================
  # The guide's "Initial State" row is discharged inside the entities section
  # above: every `defaults` instance grounds itself in the matching
  # `state_machines.<Entity>.initial_state` and asserts the boot state
  # (GridZone OPERATIONAL, MaintenanceWindow SCHEDULED, CustomerOrder
  # DRAFT/PENDING_AUTH, OrderLine PENDING/NOT_REQUIRED, SlotBooking HELD,
  # DeliveryWave FORMING/OPEN, Tote OPEN, PickTask QUEUED).
  - section: state_machines
    instances:

      - name: booking_confirm_slots_the_order_and_authorizes_the_charge
        claim_type: valid_transition
        grounds:
          - state_machines.SlotBooking[HELD -> CONFIRMED]
          - state_machines.CustomerOrder[DRAFT -> SLOTTED]
          - state_machines.CustomerOrder[PENDING_AUTH -> AUTHORIZED]
          - calculations.slot_capacity_ledger
        distinguishing_aspect: "One confirm call moves three entities at once: the booking HELD -> CONFIRMED, the order's fulfillment dimension DRAFT -> SLOTTED and its billing dimension PENDING_AUTH -> AUTHORIZED with authorized_amount_cents snapshotted at 1999, while the slot ledger shifts 2 units from held to confirmed with available_units unchanged at 8."
        test_recipe:
          setup:
            - "Route R1 (fee 599), AMBIENT SKU at 700 cents, far-future slot (capacity 10, 0 withheld), BASIC customer, order with one 2-unit line, one HELD booking of 2 units."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_id}", units: 2, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "SlotBooking.${booking_id}.status == CONFIRMED"
            - "CustomerOrder.${order_id}.fulfillment_status == SLOTTED"
            - "CustomerOrder.${order_id}.billing_status == AUTHORIZED"
            - "CustomerOrder.${order_id}.authorized_amount_cents == 1999"
            - "CustomerOrder.${order_id}.captured_amount_cents == null"
            - "CustomerOrder.${order_id}.order_total_cents == 1999"
            - "DeliverySlot.${slot_id}.held_units == 0"
            - "DeliverySlot.${slot_id}.confirmed_units == 2"
            - "DeliverySlot.${slot_id}.available_units == 8"

      - name: booking_confirm_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.SlotBooking[HELD -> CONFIRMED]
          - errors.ERR_INVALID_STATE
          - validations[priority=11]
        distinguishing_aspect: "confirm is not idempotent: the second call finds the booking already CONFIRMED and returns ERR_INVALID_STATE (409) without double-charging the order or double-counting slot capacity."
