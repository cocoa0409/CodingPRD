# =============================================================================
# Task 1940 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries a directly executable test_recipe.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: etr_provisional_vs_post_assessment
        grounds:
          - calculations.etr_estimate
          - state_machines.Outage.SUSPECTED_to_CONFIRMED
          - state_machines.DamageAssessment.SUBMITTED_to_ACCEPTED
          - entities.Outage.fields.current_etr
        distinguishing_aspect: |
          Same outage, identical attributes: the provisional variant (customers_affected x cause
          factor) publishes 2026-08-10T07:00:00Z while the post_assessment variant (repair minutes
          x crew factor) publishes 2026-08-10T06:32:00Z — entity domain Outage/ETR, distinct from
          the mutual-aid cost instance below.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z; event ACTIVE; feeder FDR-1; outage confirmed with customers_affected=100, cause_code=TREE (provisional ETR = 120 + round_half_up(100*2*1.5) = 420 min -> 07:00Z); outage version 2"
            - "Damage assessment (repair 241 min, no switching) submitted by crew C-100; clock advanced to 00:30Z"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Alpha", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 100, cause_code: "TREE" }
              as: Dispatcher
              captures: { ot_v: $.data.version, etr0: $.data.current_etr }
            - call: "POST /om/crews"
              payload: { crew_code: "C-100", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_id: $.data.id }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:30:00Z" }, as: EmergencyDirector }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MAJOR", estimated_repair_minutes: 241, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_id}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_id}" }
          trigger:
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "GET /om/outages/${ot_id}"
              payload: {}
              as: Dispatcher
              captures: { etr1: $.data.current_etr }
            - { call: "GET /om/outages/${ot_id}/etr-revisions", payload: {}, as: Dispatcher }
          assert:
            - "Provisional variant: ${etr0} == \"2026-08-10T07:00:00Z\" (120 + round_half_up(min(100,5000)*2*1.5) = 420 min from 00:00Z)"
            - "Post-assessment variant: ${etr1} == \"2026-08-10T06:32:00Z\" (accept at 00:30Z + round_half_up(241*1.5)=362 min, crew_factor 1.5 since no work order has an assignee)"
            - "Variant divergence on identical outage attributes: ${etr1} != ${etr0}"
            - "EtrRevision seq 1 has revision_reason INITIAL and previous_etr null; seq 2 has revision_reason DAMAGE_FOUND, issued_by 'system', previous_etr == \"2026-08-10T07:00:00Z\""

      - name: mutual_aid_full_vs_early_engagement_cost
        grounds:
          - calculations.mutual_aid_engagement_cost
          - state_machines.MutualAidCrew.DEMOBILIZING_to_DEPARTED
          - entities.MutualAidCrew.fields.engagement_cost_cents
        distinguishing_aspect: |
          Identical 4-day committed window, roster 4, daily_rate 50000, per-diem 7500: the
          full_engagement variant settles 320000 cents while the early_release variant settles
          185000 cents (2 actual days + 25% penalty on 2 remaining days' rate only) — entity domain
          MutualAidCrew cost accounting, distinct from the Outage ETR instance above.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; two identical mutual-aid crews (roster 4, daily 50000, per-diem 7500, window 2026-08-10T00:00Z -> 2026-08-14T00:00Z), both arrived at window start (billable_start = window start)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Beta", event_type: "ICE_STORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo A", crew_type: "LINE", roster_size: 4, service_county_code: "C1", daily_rate_cents: 50000, per_diem_cents: 7500, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-14T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mac_a: $.data.id }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo B", crew_type: "LINE", roster_size: 4, service_county_code: "C1", daily_rate_cents: 50000, per_diem_cents: 7500, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-14T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mac_b: $.data.id }
            - { call: "POST /om/mutual-aid-crews/${mac_a}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mac_b}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mac_a}/demobilize", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: EmergencyDirector }
          trigger:
            - call: "POST /om/mutual-aid-crews/${mac_a}/depart"
              payload: { departure_reason: "EARLY_RELEASE" }
              as: MutualAidCoordinator
              captures: { cost_a: $.data.engagement_cost_cents }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: EmergencyDirector }
            - { call: "POST /om/mutual-aid-crews/${mac_b}/demobilize", payload: {}, as: MutualAidCoordinator }
            - call: "POST /om/mutual-aid-crews/${mac_b}/depart"
              payload: { departure_reason: "COMPLETED" }
              as: MutualAidCoordinator
              captures: { cost_b: $.data.engagement_cost_cents }
            - { call: "GET /om/cost-ledger-entries?storm_event_id=${ev_id}", payload: {}, as: MutualAidCoordinator }
          assert:
            - "Early variant: ${cost_a} == 185000 (actual_days ceil(48h/24)=2 x (50000+4*7500)=80000 -> 160000, plus penalty round_half_up(ceil(48h/24)=2 x 50000 x 0.25) = 25000)"
            - "Full variant: ${cost_b} == 320000 (actual_days 4 x 80000, no penalty)"
            - "Variant divergence on identical window/rates: ${cost_a} != ${cost_b}"
            - "Ledger holds LABOR_MUTUAL_AID 160000 and MUTUAL_AID_PENALTY 25000 for crew A, and a single LABOR_MUTUAL_AID 320000 for crew B; penalty posts no per-diem"
            - "StormEvent.${ev_id}.total_mutual_aid_cents == 505000 and total_event_cost_cents == 505000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_ranking
        grounds:
          - calculations.outage_priority_score
          - entities.Outage.fields.priority_score
          - state_machines.PriorityCustomer.REGISTERED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — two state-conditional bonuses gated on
          CERTIFIED priority customers, a min()-capped customer term, a floored age term, and a
          missed-ETR conditional. Scores 10400 vs 600 decide dispatch order.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder FDR-P with a CERTIFIED LIFE_SUPPORT customer; feeder FDR-Q with none"
            - "Outage O1 on FDR-P confirmed 00:00Z with 300 customers (EQUIPMENT); outage O2 on FDR-Q confirmed 00:00Z with 500 customers (EQUIPMENT)"
            - "ASSESSMENT work orders W1 (on O1) and W2 (on O2) both READY; clock advanced to 02:00Z (age 2h -> 100 points each; no ETR missed); LINE crew L-1 AVAILABLE"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Gamma", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-P", county_code: "C1", service_customer_count: 5000 }
              as: EmergencyDirector
              captures: { fd1: $.data.id }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-Q", county_code: "C2", service_customer_count: 5000 }
              as: EmergencyDirector
              captures: { fd2: $.data.id }
            - call: "POST /om/priority-customers"
              payload: { account_ref: "ACCT-LS-1", priority_class: "LIFE_SUPPORT", feeder_id: "${fd1}" }
              as: Dispatcher
              captures: { pc_id: $.data.id }
            - { call: "POST /om/priority-customers/${pc_id}/certify", payload: { certified_through: "2026-08-20T00:00:00Z" }, as: Dispatcher }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd1}" }
              as: Dispatcher
              captures: { o1: $.data.id }
            - { call: "POST /om/outages/${o1}/confirm", payload: { customers_affected: 300, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd2}" }
              as: Dispatcher
              captures: { o2: $.data.id }
            - { call: "POST /om/outages/${o2}/confirm", payload: { customers_affected: 500, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${o1}", work_type: "ASSESSMENT", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { w1: $.data.id }
            - { call: "POST /om/work-orders/${w1}/ready", payload: {}, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${o2}", work_type: "ASSESSMENT", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { w2: $.data.id }
            - { call: "POST /om/work-orders/${w2}/ready", payload: {}, as: Dispatcher }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T02:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/crews"
              payload: { crew_code: "L-1", crew_type: "LINE", home_base: "Depot 9", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - { call: "POST /om/crews/${cr}/start_shift", payload: {}, as: Dispatcher }
          trigger:
            - call: "POST /om/storm-events/${ev_id}/dispatch_next"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { wo_sel: $.data.id }
            - { call: "GET /om/outages/${o1}", payload: {}, as: Dispatcher, captures: { s1: $.data.priority_score } }
            - { call: "GET /om/outages/${o2}", payload: {}, as: Dispatcher, captures: { s2: $.data.priority_score } }
          assert:
            - "${s1} == 10400 (10000 LIFE_SUPPORT + 0 critical + min(300,10000)=300 + floor(2h)*50=100 + 0 missed; provisional ETR 12:00Z not missed at 02:00Z)"
            - "${s2} == 600 (0 + 0 + 500 + 100 + 0)"
            - "Selector picked the higher score: ${wo_sel} == ${w1}"
            - "WorkOrder.${w1}.execution_status == DISPATCHED; Crew.${cr}.crew_status == EN_ROUTE"
            - "WorkOrder.${w2}.execution_status == READY (untouched)"

      - name: lodging_per_share_rounding_residual
        grounds:
          - calculations.lodging_cost_allocation
          - state_machines.LodgingBlock.COMMITTED_to_RELEASED
          - entities.StormEvent.fields.total_lodging_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — tax applied per crew share and rounded
          half-up BEFORE summing, block total rounded separately; shares 26418 + 39627 = 66045 vs
          block total 66046 leaves exactly a 1-cent overhead residual (sum-then-round would leave 0).
          Different mode from the priority_score instance (mode a).
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; lodging block Hotel H: 5 rooms, 12345 cents/night, 1 night window [2026-08-10T00:00Z, 2026-08-11T00:00Z), COMMITTED"
            - "Crew A roster 2 and crew B roster 3, both with committed windows exactly equal to the block window, both AVAILABLE (arrived at window start), both assigned to the block (2+3 = 5 rooms == room_count, equality allowed)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Delta", event_type: "TORNADO" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/lodging-blocks"
              payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 5, nightly_rate_cents: 12345, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { lb: $.data.id }
            - { call: "POST /om/lodging-blocks/${lb}/commit", payload: {}, as: MutualAidCoordinator }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo A", crew_type: "LINE", roster_size: 2, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-11T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { ma: $.data.id }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo B", crew_type: "TREE", roster_size: 3, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-11T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mb: $.data.id }
            - { call: "POST /om/mutual-aid-crews/${ma}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mb}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${ma}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mb}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${ma}/demobilize", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mb}/demobilize", payload: {}, as: MutualAidCoordinator }
          trigger:
            - { call: "POST /om/lodging-blocks/${lb}/release", payload: {}, as: MutualAidCoordinator }
            - { call: "GET /om/cost-ledger-entries?storm_event_id=${ev_id}&entry_type=LODGING", payload: {}, as: MutualAidCoordinator }
            - { call: "GET /om/storm-events/${ev_id}", payload: {}, as: MutualAidCoordinator, captures: { tot_lodg: $.data.total_lodging_cents } }
          assert:
            - "Crew shares posted in assignment created_at order: 26418 == round_half_up(2*1*12345*1.07) for crew A, then 39627 == round_half_up(3*1*12345*1.07) for crew B"
            - "Block total round_half_up(5*1*12345*1.07) == 66046"
            - "Exactly one overhead LODGING entry with amount_cents == 1 (66046 - 66045 rounding residual; per-share-first rounding is the pinned order — sum-then-round would yield residual 0)"
            - "StormEvent.${ev_id}: ${tot_lodg} == 66046"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_parallel_dimensions_reopen_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrderVerification.PENDING_VERIFY_to_VERIFY_FAILED
          - state_machines.WorkOrderVerification.VERIFY_FAILED_to_PENDING_VERIFY
          - entities.WorkOrder.fields.execution_status
          - entities.WorkOrder.fields.verification_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE row: a verification-dimension transition (FAILED) reaches
          across and reopens the execution dimension (COMPLETED -> IN_PROGRESS), then re-completion
          returns verification to PENDING_VERIFY — a cross-dimension cycle, not a linear pipeline.
          Different entity from the DamageAssessment loop below.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {50, EQUIPMENT} (provisional ETR 03:40Z); assessment (repair 60) accepted (ETR 01:30Z, outage v3, ASSESSED)"
            - "REPAIR work order on the outage run to completion by LINE crew L-2: ready -> assign -> arrive -> start (outage WORKING, v4) -> complete at 02:00Z (worked 120 min, labor 18000 cents, crew AVAILABLE)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Epsilon", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 50, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/crews"
              payload: { crew_code: "L-2", crew_type: "LINE", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_l: $.data.id }
            - { call: "POST /om/crews/${cr_l}/start_shift", payload: {}, as: Dispatcher }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 60, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot_id}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/assign", payload: { crew_id: "${cr_l}" }, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/arrive", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "POST /om/work-orders/${wo}/start", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T02:00:00Z" }, as: EmergencyDirector }
            - { call: "POST /om/work-orders/${wo}/complete", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { ot_v_pre: $.data.version } }
          trigger:
            - { call: "POST /om/work-orders/${wo}/verify", payload: { outcome: "FAILED" }, as: Dispatcher }
            - { call: "GET /om/work-orders/${wo}", payload: {}, as: Dispatcher, captures: { ex1: $.data.execution_status, vx1: $.data.verification_status } }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { etr2: $.data.current_etr, ot_v_post: $.data.version } }
            - { call: "POST /om/work-orders/${wo}/complete", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "GET /om/work-orders/${wo}", payload: {}, as: Dispatcher, captures: { ex2: $.data.execution_status, vx2: $.data.verification_status } }
          assert:
            - "After verify FAILED: ${ex1} == IN_PROGRESS AND ${vx1} == VERIFY_FAILED — the verification-dimension transition reopened the execution dimension"
            - "WorkOrder.${wo}.completed_at is null after the reopen"
            - "System EtrRevision with revision_reason == VERIFICATION_FAILED publishes ${etr2} == \"2026-08-10T05:00:00Z\" (verify at 02:00Z + 180 min)"
            - "Outage version advanced by exactly 1 for the whole verify request: ${ot_v_post} == ${ot_v_pre} + 1"
            - "After re-completion: ${ex2} == COMPLETED AND ${vx2} == PENDING_VERIFY — the dimension cycle closed and can verify again"

      - name: damage_assessment_rework_and_supersede
        grounds:
          - state_machines.DamageAssessment.SUBMITTED_to_DRAFT
          - state_machines.DamageAssessment.SUBMITTED_to_ACCEPTED
          - state_machines.DamageAssessment.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: |
          Cyclic machine on DamageAssessment: SUBMITTED -> DRAFT rework loop is traversed, then
          ACCEPTED -> SUPERSEDED fires when a second assessment is accepted on the same outage.
          Different entity and different non-linear shape (cycle + supersede) from WorkOrder's
          parallel dimensions.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {80, VEHICLE} (v2; provisional ETR = 120 + round_half_up(80*2*1.3) = 328 min)"
            - "Assessment DA1 (repair 45) submitted, RETURNED to DRAFT, resubmitted, accepted (ETR -> 01:08Z, outage v3)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Zeta", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 80, cause_code: "VEHICLE" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 45, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da1: $.data.id }
            - { call: "POST /om/damage-assessments/${da1}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da1}/return", payload: {}, as: Dispatcher, captures: { st_ret: $.data.assessment_status } }
            - { call: "POST /om/damage-assessments/${da1}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da1}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { ot_v2: $.data.version, etr_a: $.data.current_etr } }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MAJOR", estimated_repair_minutes: 90, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da2: $.data.id }
            - { call: "POST /om/damage-assessments/${da2}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
          trigger:
            - { call: "POST /om/damage-assessments/${da2}/accept", payload: { expected_outage_version: "${ot_v2}" }, as: Dispatcher }
            - { call: "GET /om/damage-assessments/${da1}", payload: {}, as: Dispatcher, captures: { da1_st: $.data.assessment_status } }
            - { call: "GET /om/damage-assessments/${da2}", payload: {}, as: Dispatcher, captures: { da2_st: $.data.assessment_status } }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { etr_b: $.data.current_etr } }
          assert:
            - "Rework loop traversed: after return, ${st_ret} == DRAFT (SUBMITTED -> DRAFT is legal and resubmission succeeds)"
            - "After second accept: ${da1_st} == SUPERSEDED and ${da2_st} == ACCEPTED (at most one ACCEPTED per outage)"
            - "ETR after DA1 accept: ${etr_a} == \"2026-08-10T01:08:00Z\" (00:00Z + round_half_up(45*1.5)=68 min)"
            - "ETR after DA2 accept: ${etr_b} == \"2026-08-10T02:15:00Z\" (00:00Z + round_half_up(90*1.5)=135 min); revisions seq 2 and seq 3 both DAMAGE_FOUND"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: accept_cascade_supersede_promote_revision_recompute
        grounds:
          - state_machines.DamageAssessment.SUBMITTED_to_ACCEPTED
          - state_machines.Outage.CONFIRMED_to_ASSESSED
          - calculations.etr_estimate
          - calculations.outage_priority_score
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /accept: accept supersedes the prior ACCEPTED assessment
          AND promotes the outage CONFIRMED -> ASSESSED (link 1); the promotion itself creates a
          system EtrRevision (link 2); the revision rewrites outage.current_etr and bumps
          Outage.version (link 3); the new current_etr feeds the priority_score recompute (link 4).
          Each link is caused by the previous link, not by the original request. Different trigger
          from the verify-failed cascade below.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {100, TREE} (v2, ETR1 07:00Z)"
            - "DA1 (repair 100) accepted at 00:10Z -> outage ASSESSED (v3), revision seq 2 publishes 02:40Z (00:10 + round_half_up(100*1.5)=150 min); intermediate state captured"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Eta", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 100, cause_code: "TREE" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:10:00Z" }, as: EmergencyDirector }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MAJOR", estimated_repair_minutes: 100, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da1: $.data.id }
            - { call: "POST /om/damage-assessments/${da1}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da1}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { mid_status: $.data.outage_status, mid_etr: $.data.current_etr, ot_v_mid: $.data.version } }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:30:00Z" }, as: EmergencyDirector }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "CATASTROPHIC", estimated_repair_minutes: 241, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da2: $.data.id }
            - { call: "POST /om/damage-assessments/${da2}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
          trigger:
            - { call: "POST /om/damage-assessments/${da2}/accept", payload: { expected_outage_version: "${ot_v_mid}" }, as: Dispatcher }
            - { call: "GET /om/damage-assessments/${da1}", payload: {}, as: Dispatcher, captures: { da1_st: $.data.assessment_status } }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { fin_etr: $.data.current_etr, fin_v: $.data.version } }
            - { call: "GET /om/outages/${ot_id}/etr-revisions", payload: {}, as: Dispatcher }
          assert:
            - "Link 1 (observed mid-chain): ${mid_status} == ASSESSED — the first accept promoted the outage before any work order existed"
            - "Link 2 (observed mid-chain): ${mid_etr} == \"2026-08-10T02:40:00Z\" — a system EtrRevision seq 2 (DAMAGE_FOUND) was created by the promotion, not by any manual revision call"
            - "Link 3: after second accept ${fin_etr} == \"2026-08-10T06:32:00Z\" and revision seq 3 has previous_etr == \"2026-08-10T02:40:00Z\""
            - "Link 4: ${da1_st} == SUPERSEDED (the second accept's supersede fired), and Outage.version advanced exactly 1 per accept (${ot_v} -> ${ot_v_mid} -> ${fin_v} consecutive integers)"
            - "Revision reasons in seq order: INITIAL, DAMAGE_FOUND, DAMAGE_FOUND"

      - name: verify_failed_cascade_reopen_forces_etr_revision
        grounds:
          - state_machines.WorkOrderVerification.PENDING_VERIFY_to_VERIFY_FAILED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - calculations.etr_revision_constraints
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /verify {FAILED}: verification flip (link 1) reopens
          execution COMPLETED -> IN_PROGRESS (link 2, caused by link 1); the reopen forces a system
          EtrRevision VERIFICATION_FAILED (link 3, caused by link 2) which mutates outage.current_etr
          and Outage.version. Different triggering transition from the accept cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {50, EQUIPMENT}; assessment (repair 60) accepted; REPAIR work order completed at 02:00Z by LINE crew (verification PENDING_VERIFY)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Theta", event_type: "ICE_STORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 50, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/crews"
              payload: { crew_code: "L-2", crew_type: "LINE", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_l: $.data.id }
            - { call: "POST /om/crews/${cr_l}/start_shift", payload: {}, as: Dispatcher }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 60, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot_id}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/assign", payload: { crew_id: "${cr_l}" }, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/arrive", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "POST /om/work-orders/${wo}/start", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T02:00:00Z" }, as: EmergencyDirector }
            - { call: "POST /om/work-orders/${wo}/complete", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l}" }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { ot_v_pre: $.data.version, etr_pre: $.data.current_etr } }
          trigger:
            - { call: "POST /om/work-orders/${wo}/verify", payload: { outcome: "FAILED" }, as: Dispatcher }
            - { call: "GET /om/work-orders/${wo}", payload: {}, as: Dispatcher, captures: { ex: $.data.execution_status, vx: $.data.verification_status } }
            - { call: "GET /om/outages/${ot_id}", payload: {}, as: Dispatcher, captures: { etr_post: $.data.current_etr, ot_v_post: $.data.version } }
            - { call: "GET /om/crews/${cr_l}", payload: {}, as: Dispatcher, captures: { crew_st: $.data.crew_status } }
          assert:
            - "Link 1: ${vx} == VERIFY_FAILED (the direct effect of the trigger)"
            - "Link 2: ${ex} == IN_PROGRESS and completed_at is null — caused by the verification flip, not by any execution-endpoint call"
            - "Link 3: ${etr_post} == \"2026-08-10T05:00:00Z\" from a system revision (VERIFICATION_FAILED, now+180 min); before the trigger ${etr_pre} == \"2026-08-10T01:30:00Z\" (post-assessment 60*1.5=90 min from 00:00Z)"
            - "Outage version: ${ot_v_post} == ${ot_v_pre} + 1 (single increment for the verify request's outage mutation)"
            - "Crew was NOT re-dispatched by the cascade: ${crew_st} == AVAILABLE"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_state_error_beats_switching_safety_error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.WorkOrder.DISPATCHED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_SWITCHING_NOT_EXECUTED]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_safety (p5): a start request on a READY (never
          dispatched) work order whose switching order is merely ISSUED violates both gates; the
          response must be ERR_INVALID_STATE_TRANSITION, not ERR_SWITCHING_NOT_EXECUTED.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {20, EQUIPMENT}; assessment (repair 30) accepted"
            - "Work order requires_switching_order=true, READY (no assignment); switching order created by op-1 and ISSUED but not APPROVED/EXECUTED"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Iota", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 20, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 30, requires_switching: true }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot_id}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: true }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - call: "POST /om/switching-orders"
              payload: { work_order_id: "${wo}", switching_steps: ["Open breaker 12", "Ground feeder"] }
              as: SystemOperator
              as_user_id: "op-1"
              captures: { so: $.data.id }
            - { call: "POST /om/switching-orders/${so}/issue", payload: {}, as: SystemOperator, as_user_id: "op-1" }
          trigger:
            - call: "POST /om/work-orders/${wo}/start"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION — the priority-4 own-state failure (READY, never DISPATCHED) wins"
            - "The priority-5 safety failure is masked: response is NOT ERR_SWITCHING_NOT_EXECUTED even though the switching order is only ISSUED"
            - "WorkOrder.${wo}.execution_status remains READY; SwitchingOrder.${so}.so_status remains ISSUED"

      - name: lodging_temporal_error_beats_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_WINDOW_OUTSIDE_BLOCK]
          - errors[ERR_NO_ROOMS_AVAILABLE]
        distinguishing_aspect: |
          Error-category pair business_temporal (p7) vs business_fiscal (p9): one assign_lodging
          request whose crew window escapes the block window AND whose roster would exceed remaining
          rooms must return ERR_WINDOW_OUTSIDE_BLOCK, not ERR_NO_ROOMS_AVAILABLE. Different category
          pair from the state-vs-safety instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; block rooms=2 window [08-10, 08-13) COMMITTED"
            - "Crew A roster 2 window [08-10, 08-13) AVAILABLE and assigned (rooms_allocated == 2, block full)"
            - "Crew B roster 1 window [08-10, 08-14) AVAILABLE — its window is NOT contained in the block window (08-14 > 08-13) AND no rooms remain (2+1 > 2)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Kappa", event_type: "HURRICANE" }
