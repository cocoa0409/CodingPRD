          rationale: "That §1.8 instance replays the full four-hop cascade and asserts every restored counter."

      - name: worsened_verification_cross_entity_cascade_to_the_practice_posture
        claim_type: Cross-entity
        grounds:
          - state_machines.CallbackTask.REACHED_to_ESCALATED
        excluded_because:
          difficulty_instance: worsened_callback_escalates_variance_and_blocks_the_practices_draft_coverage_window
          rationale: "That §1.8 instance asserts every hop from the callback to the BLOCKED coverage window."

      - name: reopen_compensates_the_completion_side_effects_without_drift
        claim_type: Compensation
        grounds:
          - state_machines.TriageCall.CLOSED_to_DISPOSITIONED
        excluded_because:
          difficulty_instance: complete_reopen_complete_leaves_both_practice_ledgers_without_a_cent_of_drift
          rationale: "That §1.8 instance pins both ledgers before, between and after the compensating pair."

      - name: disposition_parallel_state_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: disposition_advice_and_audit_dimensions_advance_independently_after_override
          rationale: "That §1.8 instance holds OVERRIDDEN on the advice dimension while the audit dimension reaches CONCORDANT_CLOSED."

      - name: guarded_transition_completion_requires_a_completed_warm_transfer
        claim_type: guarded transitions
        grounds:
          - state_machines.TriageCall.DISPOSITIONED_to_CLOSED
        excluded_because:
          difficulty_instance: call_completion_is_gated_on_a_separate_warm_transfer_aggregate_reaching_handoff_complete
          rationale: "That §1.8 instance asserts the guard twice — before any transfer exists and after a rejected one."

  # ==========================================================================
  - section: calculations
    instances:

      - name: after_hours_flag_follows_the_practices_own_weekend_policy_and_the_half_open_office_window
        claim_type: Correct Result
        grounds:
          - calculations.after_hours_determination
          - entities.Practice.fields.weekend_is_after_hours
          - entities.TriageCall.fields.is_after_hours
          - endpoints[POST /triage-calls]
        distinguishing_aspect: "Two practices with identical 13:00-22:00 office hours disagree about the same Saturday 14:30 instant because only one opts into weekend_is_after_hours, and on a Monday the same practice flips from in-hours at 21:59 to after-hours at exactly 22:00 — the window is half-open at the close minute."
        test_recipe:
          setup:
            - "Practice A: weekend_is_after_hours false. Practice B: weekend_is_after_hours true, with two ACTIVE coverage windows so that its after-hours calls can be taken at all."
            - "Windows are created and activated at 2026-07-30T12:00:00Z, before the clock is moved to the instants under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Practice A Weekday Only", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: false }
              as: PlatformAdmin
              captures: { practice_a_id: $.data.id }
            - call: "POST /practices"
              payload: { name: "Practice B Weekend Covered", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true }
              as: PlatformAdmin
              captures: { practice_b_id: $.data.id }
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_b_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-03T00:00:00Z", coverage_kind: "WEEKEND" }
              as: PlatformAdmin
              captures: { window_weekend_id: $.data.id }
            - call: "POST /coverage-windows/${window_weekend_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_b_id}", start_utc: "2026-08-03T22:00:00Z", end_utc: "2026-08-04T02:00:00Z", coverage_kind: "NIGHTS" }
              as: PlatformAdmin
              captures: { window_nights_id: $.data.id }
            - call: "POST /coverage-windows/${window_nights_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_a_id}", caller_name: "Saturday Caller A", caller_phone: "+14155550101", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "saturday, practice a" }
              as: IntakeAgent
              captures: { call_a_saturday_id: $.data.id, flag_a_saturday: $.data.is_after_hours }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_b_id}", caller_name: "Saturday Caller B", caller_phone: "+14155550102", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "saturday, practice b" }
              as: IntakeAgent
              captures: { call_b_saturday_id: $.data.id, flag_b_saturday: $.data.is_after_hours }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T21:59:00Z" }
              as: PlatformAdmin
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_b_id}", caller_name: "Monday Caller Before Close", caller_phone: "+14155550103", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "one minute before close" }
              as: IntakeAgent
              captures: { call_b_before_close_id: $.data.id, flag_b_before_close: $.data.is_after_hours }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T22:00:00Z" }
              as: PlatformAdmin
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_b_id}", caller_name: "Monday Caller At Close", caller_phone: "+14155550104", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "exactly at the close minute" }
              as: IntakeAgent
              captures: { call_b_at_close_id: $.data.id, flag_b_at_close: $.data.is_after_hours }
          assert:
            - "${flag_a_saturday} == false"
            - "${flag_b_saturday} == true"
            - "${flag_b_before_close} == false"
            - "${flag_b_at_close} == true"
            - "TriageCall.${call_a_saturday_id}.status == INTAKE"
            - "TriageCall.${call_b_at_close_id}.status == INTAKE"
            - "CoverageWindow.${window_weekend_id}.status == EXPIRED"
            - "CoverageWindow.${window_nights_id}.status == ACTIVE"

      - name: license_status_is_active_through_the_expiry_date_and_expired_the_next_day
        claim_type: Precision
        grounds:
          - calculations.license_status_derivation
          - entities.NurseLicense.fields.status
          - endpoints[GET /nurses/{id}/licenses]
        distinguishing_aspect: "The comparison is at day granularity and inclusive of the expiry date: a licence expiring 2026-08-03 is still ACTIVE at 23:59:59 on that day and only becomes EXPIRED at 2026-08-04T00:00:00Z, and the status filter follows the derived value rather than a stored column."
        test_recipe:
          setup:
            - "One nurse holding exactly one CA licence that expires on 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: PlatformAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /nurses/${nurse_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2026-08-03" }
              as: PlatformAdmin
              captures: { license_id: $.data.id }
          trigger:
            - call: "GET /nurses/${nurse_id}/licenses"
              as: PlatformAdmin
              captures: { status_midday: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/licenses"
              as: PlatformAdmin
              captures: { status_last_second: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/licenses"
              as: PlatformAdmin
              captures: { status_next_day: "$.data[0].status" }
            - call: "GET /nurses/${nurse_id}/licenses?status=ACTIVE"
              as: PlatformAdmin
              captures: { active_total_next_day: $.total_count }
            - call: "GET /nurses/${nurse_id}/licenses?status=EXPIRED"
              as: PlatformAdmin
              captures: { expired_total_next_day: $.total_count }
          assert:
            - "${status_midday} == ACTIVE"
            - "${status_last_second} == ACTIVE"
            - "${status_next_day} == EXPIRED"
            - "${active_total_next_day} == 0"
            - "${expired_total_next_day} == 1"
            - "NurseLicense.${license_id}.expires_on == 2026-08-03"

      - name: shift_status_is_active_only_on_its_half_open_interval
        claim_type: Correct Result
        grounds:
          - calculations.shift_status_derivation
          - entities.NurseShift.fields.status
          - entities.NurseShift.fields.scheduled_minutes
          - endpoints[GET /nurses/{id}/shifts]
        distinguishing_aspect: "The same stored shift reads SCHEDULED one minute before its start, ACTIVE at its start instant and at 19:59, and ENDED at exactly its 20:00 end instant — a closed-interval implementation reports ACTIVE at the end instant and would keep an off-shift nurse in the assignment selector."
        test_recipe:
          setup:
            - "One nurse with a single 2026-08-03T12:00:00Z-20:00:00Z shift; the clock starts before the shift."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: PlatformAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /nurses/${nurse_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
              captures: { shift_id: $.data.id, minutes: $.data.scheduled_minutes }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:59:00Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/shifts"
              as: ChargeNurse
              as_user_id: "${nurse_id}"
              captures: { status_before: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/shifts"
              as: ChargeNurse
              as_user_id: "${nurse_id}"
              captures: { status_at_start: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T19:59:00Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/shifts"
              as: ChargeNurse
              as_user_id: "${nurse_id}"
              captures: { status_before_end: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "GET /nurses/${nurse_id}/shifts"
              as: ChargeNurse
              as_user_id: "${nurse_id}"
              captures: { status_at_end: "$.data[0].status" }
            - call: "GET /nurses/${nurse_id}/shifts?status=ACTIVE"
              as: ChargeNurse
              as_user_id: "${nurse_id}"
              captures: { active_total_at_end: $.total_count }
          assert:
            - "${minutes} == 480"
            - "${status_before} == SCHEDULED"
            - "${status_at_start} == ACTIVE"
            - "${status_before_end} == ACTIVE"
            - "${status_at_end} == ENDED"
            - "${active_total_at_end} == 0"
            - "NurseShift.${shift_id}.scheduled_minutes == 480"

      - name: overtriage_outcome_scores_three_points_per_ordinal_and_never_escalates
        claim_type: Correct Result
        grounds:
          - calculations.outcome_variance_classification
          - calculations.outcome_variance_classification.constants.OVERTRIAGE_POINTS_PER_ORDINAL
          - entities.ComplianceAuditRecord.fields.variance_class
          - endpoints[POST /dispositions/{id}/audit-records]
          - endpoints[GET /practices/{id}/compliance-summary]
        distinguishing_aspect: "An ED_NOW disposition (ordinal 4) whose patient only needed an OFFICE_VISIT (ordinal 2) is OVERTRIAGE worth abs(-2) * 3 = 6 points, and — unlike UNDERTRIAGE — it leaves the disposition parked at OUTCOME_RECORDED with the practice posture still NORMAL: over-cautious advice is recorded, not escalated."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; practice variance_review_threshold 1 and audit_period_start_utc 2026-08-01T00:00:00Z."
            - "An ED_NOW disposition determined by nurse_a whose HIGH_RISK callback has been verified by nurse_c, so the audit precondition is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
