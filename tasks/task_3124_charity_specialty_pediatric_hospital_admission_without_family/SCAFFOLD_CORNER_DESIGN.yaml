              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid OCC2", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "GET /charity-care/applications/${a1}"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
              captures: { a1_v_fresh: $.data.version }
          trigger:
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "fresh view", expected_application_version: "${a1_v_fresh}" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
          assert:
            - "decide succeeds: PatientApplication.${a1}.status == ACCEPTED"
            - "PatientApplication.${a1}.version == ${a1_v_fresh} + 1"

      - name: scheduled_clock_touch_expires_screenings_past_deadline
        claim_type: scheduled_actions
        grounds:
          - state_machines.OutreachScreening.COMPLETED_to_EXPIRED
          - calculations.screening_conversion_window
        distinguishing_aspect: "Deferred action via the clock: a COMPLETED screening not converted by conversion_deadline flips to EXPIRED on the first clock touch past the deadline — no explicit expire call exists; at exactly the deadline it is still COMPLETED."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1. Clinic CL1 (2026-10-01..2026-10-02; deadline 2026-12-31) CONFIRMED with screening SC1; clock at 2026-10-01, SC1 COMPLETED, no conversion."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton", latitude: 45.67, longitude: -118.79, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-02T00:00:00Z", screening_capacity: 3 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl1: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "Scout Expire", patient_date_of_birth: "2020-01-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-01T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { sc1: $.data.id }
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/outreach-screenings/${sc1}/record-outcome"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
          trigger:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T00:00:00Z" }
              as: NetworkAdmin
            - call: "GET /charity-care/outreach-screenings/${sc1}"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { st_at: $.data.status }
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "GET /charity-care/outreach-screenings/${sc1}"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
          assert:
            - "st_at == COMPLETED   # exactly at the deadline, inclusive — not yet expired"
            - "after the clock passes the deadline: OutreachScreening.${sc1}.status == EXPIRED"

      - name: derived_booked_count_reconciles_across_no_show_and_rebook
        claim_type: derived_field_reconciliation
        grounds:
          - entities.OutreachClinic.fields.booked_screening_count
        distinguishing_aspect: "booked_screening_count tracks the live slot occupancy through the full cycle: 2 after two bookings, 1 after one no-show, 2 after rebook — the denormalized counter equals the true BOOKED+COMPLETED count at every step."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1. Clinic CL1 CONFIRMED (2026-10-01..2026-10-02, capacity 2) with two BOOKED screenings."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton", latitude: 45.67, longitude: -118.79, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-02T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl1: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "Scout A", patient_date_of_birth: "2020-01-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-01T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { sca: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "Scout B", patient_date_of_birth: "2020-02-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-02T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { scb: $.data.id }
          trigger:
            - call: "POST /charity-care/outreach-screenings/${sca}/mark-no-show"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
            - call: "GET /charity-care/outreach-clinics/${cl1}"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cnt_mid: $.data.booked_screening_count }
            - call: "POST /charity-care/outreach-screenings/${sca}/rebook"
              payload: { new_screening_date: "2026-10-02T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
          assert:
            - "after two bookings: OutreachClinic.${cl1}.booked_screening_count == 2"
            - "cnt_mid == 1   # no-show released the slot"
            - "after rebook: OutreachClinic.${cl1}.booked_screening_count == 2"
            - "OutreachScreening.${sca}.status == BOOKED and screening_date == 2026-10-02T00:00:00Z"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: acceptance_side_effects_visible_in_same_request_cycle
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.PatientApplication.PENDING_REVIEW_to_ACCEPTED
        distinguishing_aspect: "Immediate consistency: the decide response itself shows ACCEPTED, and the very next GETs (billing-account sub-resource, care-plan sub-resource, hospital row) all reflect the cascade — no read-your-writes lag anywhere."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, BURN program P2 (staged_care_required true), source RS1; application A1 opened with accept quorum."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "BURN", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: true }
              as: NetworkAdmin
              captures: { p2: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Immediate", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "BURN", referral_source_id: "${rs1}", program_id: "${p2}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
          trigger:
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
              captures: { a1_status: $.data.status }
            - call: "GET /charity-care/applications/${a1}/billing-account"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { ba_n: "$.data[0].id" }
            - call: "GET /charity-care/applications/${a1}/care-plan"
              payload: {}
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { cp_n: "$.data[0].id" }
            - call: "GET /charity-care/hospitals/${h1}"
              payload: {}
              as: NetworkAdmin
              captures: { ytd: $.data.admissions_ytd }
          assert:
            - "a1_status == ACCEPTED (visible in the decide response itself)"
            - "the billing-account GET returns exactly 1 row immediately (BillingAccount.${ba_n}.status == OPEN)"
            - "the care-plan GET returns exactly 1 row immediately (CarePlan.${cp_n}.clinical_status == PLANNING, funding_status == UNFUNDED)"
            - "ytd == 1 (hospital aggregate already reflects the acceptance)"
