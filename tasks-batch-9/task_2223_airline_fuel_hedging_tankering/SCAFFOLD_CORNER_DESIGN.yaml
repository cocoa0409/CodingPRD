      - name: reconcile_with_zero_actual_uplift_returns_422_zero_uplift
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_ZERO_UPLIFT]
          - calculations.tankering_burn_penalty_gallons
          - entities.FlightLeg.fields.actual_uplift_gallons
        distinguishing_aspect: |
          Priority 10 guards reconciliation as well as creation: reporting an actual
          uplift of 0 gallons on an EXECUTED directive is refused 422 rather than
          producing a 0-gallon burn penalty and a reconciled saving of -0.00. The
          weight check at priority 9 passes first (0 <= cap 10600.00), so the error
          can only be ERR_ZERO_UPLIFT, and the origin station's ledger keeps the
          497000 gallons execution left behind.
        test_recipe:
          setup:
            - "Logical clock 2027-02-10; ACTIVE supply contracts at both stations (DFW all-in 2.4700, ORD all-in 3.1000)."
