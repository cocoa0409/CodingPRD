          trigger:
            - call: "POST /fleet/software-releases/${r1}/record-validation"
              payload: { outcome: "PASS" }
              as: FlowController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

  - section: cross_cutting
    instances:
      - name: occ_stale_version_on_sequence
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pick-task-sequence-stale-station]"]
        distinguishing_aspect: "Covered by err_stale_version_triggerable."
        excluded_because:
          difficulty_instance: err_stale_version_triggerable
          rationale: "Already covers OCC stale-version conflict on the same write_endpoint."

      - name: clock_default_is_2026_09_01
        claim_type: scheduled_actions
        grounds: ["endpoints", "entities.CustomerOrder"]
        distinguishing_aspect: "Before any set_current_utc call, the logical clock reads exactly 2026-09-01T00:00:00Z; an order with cutoff_at=2026-09-01T00:00:01Z is NOT missed at server start."
        test_recipe:
          setup: ["empty DB, no clock set; order with cutoff one second past default"]
          setup_api_calls:
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-01T00:00:01Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
          trigger:
            - call: "GET /fleet/customer-orders/${o1}"
              as: FlowController
              captures: { status: $.data.status }
          assert:
            - "CustomerOrder.${o1}.status == RECEIVED (default clock is 2026-09-01T00:00:00Z, strictly less than cutoff_at)"
