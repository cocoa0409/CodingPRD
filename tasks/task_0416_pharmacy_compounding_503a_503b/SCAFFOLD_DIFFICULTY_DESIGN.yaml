# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 0416 — Pharmacy Compounding (503A/503B), Expert tier
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 (verbatim names/ids).
# 9 rule_ids × ≥2 instances → 20 difficulty instances total.
# Formula-derived assert literals were computed by executing the relevant
# §1.3 formulas with their constants (see commit notes).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bud_503a_patient_specific_vs_503b_office_use_window
        grounds:
          - calculations.bud_assignment
          - calculations.bud_assignment.patient_specific_503A
          - calculations.bud_assignment.office_use_503B
          - entities.MasterFormulationRecord.fields.default_bud_days_nonsterile
          - entities.CompoundingBatch.fields.purpose
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
        distinguishing_aspect: |
          Same nonsterile formula (default_bud_days_nonsterile=180) compiled under
          two purposes on two facilities yields different beyond_use_utc: 503A
          PRESCRIPTION keeps the full 180-day window (2026-11-28) while 503B
          OFFICE_USE is held to the 90-day outsourcing cap (2026-08-30) — the
          BUD calc operates on the CompoundingBatch domain via two purpose variants.
        test_recipe:
          setup:
            - "503A facility F_A (registration_type=503A) and 503B facility F_B (503B), both clocks at 2026-06-01T00:00:00.000Z."
            - "Each facility has its own nonsterile MFR (dosage_form=ORAL_LIQUID, default_bud_days_nonsterile=180, theoretical_yield_units=100, anticipatory_max_units=500)."
            - "Each facility has an AVAILABLE ingredient lot expiring far in the future (2030-01-01) charged to a started, compiled batch."
            - "F_A batch is PRESCRIPTION against an ACTIVE prescription; F_B batch is OFFICE_USE."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Pharma A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Outsourcing B", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${fa_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/facilities/${fb_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${fa_id}", name: "Tacrolimus 0.5mg/mL Oral", dosage_form: "ORAL_LIQUID", default_bud_days_nonsterile: 180, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_a_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${fb_id}", name: "Tacrolimus 0.5mg/mL Oral", dosage_form: "ORAL_LIQUID", default_bud_days_nonsterile: 180, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_b_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${fa_id}", component_name: "Tacrolimus", lot_number: "LA-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_a_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${fb_id}", component_name: "Tacrolimus", lot_number: "LB-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_b_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${fa_id}", master_formulation_record_id: "${mfr_a_id}", patient_name: "Jane Roe", prescriber_npi: "1234567890", units_prescribed: 50, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_a_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${fa_id}", master_formulation_record_id: "${mfr_a_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_a_id}" }
              as: CompoundingPharmacist
              captures: { batch_a_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${fb_id}", master_formulation_record_id: "${mfr_b_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_b_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_a_id}", ingredient_lot_id: "${lot_a_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_b_id}", ingredient_lot_id: "${lot_b_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_a_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_b_id}/start"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_a_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
              captures: { batch_a_bud: $.data.assigned_bud_utc }
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_b_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
              captures: { batch_b_bud: $.data.assigned_bud_utc }
          assert:
            - "CompoundingBatch.${batch_a_id}.assigned_bud_utc == 2026-11-28T00:00:00.000Z (503A: current_utc + 180 days, no cap; ingredient floor 2030-01-01 not binding)"
            - "CompoundingBatch.${batch_b_id}.assigned_bud_utc == 2026-08-30T00:00:00.000Z (503B: current_utc + min(180,90)=90 days, ingredient floor not binding)"
            - "FinishedPreparation rows of ${batch_a_id} all have beyond_use_utc == 2026-11-28T00:00:00.000Z"
            - "FinishedPreparation rows of ${batch_b_id} all have beyond_use_utc == 2026-08-30T00:00:00.000Z"

      - name: endotoxin_route_tiered_projection_vs_bud_window
        grounds:
          - calculations.qc_endotoxin_evaluation
          - calculations.bud_assignment
          - entities.QualityControlTest.fields.measured_value
          - entities.MasterFormulationRecord.fields.dosage_form
          - state_machines.QualityControlTest.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          The endotoxin acceptance calc (QualityControlTest domain, route-tiered
          ceiling 175 EU/unit injectable) and the BUD calc (CompoundingBatch domain,
          14-day sterile-aqueous window) are two distinct dual-purpose calculations
          on two different entity domains: endotoxin projection passes at
          measured_value=1.76 (174.944 <= 175) but the same batch's BUD is the
          14-day sterile window, not the nonsterile default — different subjects.
        test_recipe:
          setup:
            - "503B facility, clock 2026-06-01T00:00:00.000Z."
            - "Sterile-aqueous MFR (dosage_form=STERILE_AQUEOUS, is_sterile=true, default_bud_days_nonsterile ignored, theoretical_yield_units=100, anticipatory_max_units=500)."
            - "One AVAILABLE lot (labeled_potency_pct=99.4, expiration 2030-01-01) charged grams_used=10 -> potency_adjusted_grams=9.94, total_active_mg=9940."
            - "OFFICE_USE batch started and compiled (actual_yield_units=100)."
            - "ENDOTOXIN QC test added, begun, IN_PROGRESS."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Sterile B", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Ketamine 10mg/mL Inj", dosage_form: "STERILE_AQUEOUS", default_bud_days_nonsterile: 1, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Ketamine HCl", lot_number: "K-1", labeled_potency_pct: 99.4, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z", endotoxin_eu_per_mg: 0.1 }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
              captures: { bud: $.data.assigned_bud_utc }
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "ENDOTOXIN" }
              as: QualityAssurancePharmacist
              captures: { qc_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
          trigger:
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/record"
              payload: { measured_value: 1.76 }
              as: QualityAssurancePharmacist
              captures: { qc_result: $.data.result }
          assert:
            - "QualityControlTest.${qc_id}.result == PASSED (projected_eu_per_unit = 1.76 * (9940/100) = 174.944 <= 175 injectable limit)"
            - "CompoundingBatch.${batch_id}.assigned_bud_utc == 2026-06-15T00:00:00.000Z (sterile-aqueous 14-day window; ingredient floor 2030 not binding) — distinct domain from the endotoxin projection"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bud_min_of_window_and_ingredient_expiry_floor_mode_a
        grounds:
          - calculations.bud_assignment
          - entities.IngredientLot.fields.expiration_utc
          - entities.CompoundingBatch.fields.assigned_bud_utc
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
        distinguishing_aspect: |
          Mode (a): the BUD formula nests min() over ≥3 inputs with a conditional
          branch on is_sterile/dosage_form selecting the window, then a second min()
          against the earliest charged-lot expiry — the ingredient floor (2026-06-05)
          beats the 14-day sterile window (2026-06-15), so assigned_bud_utc clamps
          to 2026-06-05, a non-linear interaction of window-selection and floor.
        test_recipe:
          setup:
            - "503A facility, clock 2026-06-01T00:00:00.000Z."
            - "Sterile-aqueous MFR (STERILE_AQUEOUS => 14-day window)."
            - "Charged lot expires 2026-06-05 (only 4 days out) so the ingredient-expiry floor binds below the 14-day window."
            - "PRESCRIPTION batch started, ready to compile."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Floor A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Morphine 1mg/mL Inj", dosage_form: "STERILE_AQUEOUS", default_bud_days_nonsterile: 1, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Morphine sulfate", lot_number: "M-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2026-06-05T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Sam Lin", prescriber_npi: "1234567890", units_prescribed: 50, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
              captures: { bud: $.data.assigned_bud_utc }
          assert:
            - "CompoundingBatch.${batch_id}.assigned_bud_utc == 2026-06-05T00:00:00.000Z (min(2026-06-15 window, 2026-06-05 lot expiry) -> ingredient floor wins)"

      - name: yield_variance_round_then_band_compare_mode_b
        grounds:
          - calculations.yield_reconciliation
          - entities.CompoundingBatch.fields.actual_yield_units
          - entities.CompoundingBatch.fields.yield_variance_pct
          - validations[priority=12]
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
        distinguishing_aspect: |
          Mode (b): yield_variance_pct = round(100*(actual-theoretical)/theoretical, 2)
          pins round-then-compare order against the ±5.00 band; at actual=105 the
          rounded variance is exactly +5.00 (accepted, compile succeeds) — the
          rounding step occurs before the band comparison, a different combinatorial
          axis than instance (a)'s nested-min window/floor selection.
        test_recipe:
          setup:
            - "503A facility, clock 2026-06-01T00:00:00.000Z."
            - "Nonsterile MFR theoretical_yield_units=100."
            - "PRESCRIPTION batch started with one charged lot, ready to compile with actual_yield_units=105."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Yield A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Progesterone 100mg Cap", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Progesterone", lot_number: "P-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Lee Park", prescriber_npi: "1234567890", units_prescribed: 50, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 105 }
              as: CompoundingPharmacist
              captures: { variance: $.data.yield_variance_pct, status: $.data.status }
          assert:
            - "CompoundingBatch.${batch_id}.yield_variance_pct == 5.0"
            - "CompoundingBatch.${batch_id}.status == COMPILED (variance exactly +5.00 is within the inclusive ±5.0 band)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_quarantined_reprocess_cycle_back_to_in_process
        grounds:
          - state_machines.CompoundingBatch.QUARANTINED_to_IN_PROCESS
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
          - state_machines.CompoundingBatch.COMPILED_to_QUARANTINED
          - entities.FinishedPreparation.fields.dispense_status
        distinguishing_aspect: |
          CompoundingBatch is branching-with-revert: QUARANTINED -> IN_PROCESS
          (reprocess) loops back, voiding the prior compile's FinishedPreparations
          and clearing compiled_by_user_id — a cycle on the CompoundingBatch entity,
          structurally non-linear, distinct from the Recall cycle entity below.
        test_recipe:
          setup:
            - "503A facility, clock 2026-06-01T00:00:00.000Z."
            - "Nonsterile PRESCRIPTION batch compiled (actual_yield_units=100 => 100 FinishedPreparations minted) then quarantined."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Cycle A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Baclofen 10mg Cap", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Baclofen", lot_number: "B-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Pat Kim", prescriber_npi: "1234567890", units_prescribed: 50, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/reprocess"
              payload: {}
              as: CompoundingPharmacist
              captures: { status: $.data.status }
          assert:
            - "CompoundingBatch.${batch_id}.status == IN_PROCESS (cycle revert from QUARANTINED)"
            - "GET /pharmacy-compounding/finished-preparations?compounding_batch_id=${batch_id} returns total_count == 0 (prior FinishedPreparations voided)"
            - "CompoundingBatch.${batch_id}.compiled_by_user_id is cleared (null) after reprocess"

      - name: recall_in_progress_reopen_cycle_back_to_initiated
        grounds:
          - state_machines.Recall.IN_PROGRESS_to_INITIATED
          - state_machines.Recall.INITIATED_to_IN_PROGRESS
          - entities.Recall.fields.status
        distinguishing_aspect: |
          Recall is a cyclic machine on a different entity than CompoundingBatch:
          INITIATED -> IN_PROGRESS -> INITIATED (reopen) forms a loop, satisfying
          non-linearity on the Recall entity distinct from the batch reprocess cycle.
        test_recipe:
          setup:
            - "503A facility, a RELEASED batch, and a Recall against it advanced to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Recall A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Clonidine 0.1mg Cap", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 10, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Clonidine", lot_number: "C-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Dana Cho", prescriber_npi: "1234567890", units_prescribed: 10, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
