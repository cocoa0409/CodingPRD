              payload: {}
              as: BillingCoordinator
          trigger:
            - call: "GET /iacuc/grants/${grant_id}"
              payload: {}
              as: BillingCoordinator
              captures: { remaining: $.data.budget_remaining_cents }
            - call: "GET /iacuc/grants/${grant_id}/charges"
              payload: {}
              as: BillingCoordinator
          assert:
            - "Grant.budget_remaining_cents == 497375 (500000 - 2625) after posting run X"
            - "Voided run Y created no surviving PerDiemCharge rows (charges list for the grant has exactly the run-X rows)"
            - "Invariant: budget_remaining_cents == budget_total_cents - sum(POSTED charges) == 497375"


      - name: cage_occupancy_conserved_across_transfer
        grounds:
          - calculations.cage_capacity
          - state_machines.Cage
          - entities.Protocol.fields.animals_used_count
        distinguishing_aspect: |
          Conserved population quantity: transferring an animal between two
          cages leaves protocol.animals_used_count and the total ALIVE count
          across both cages unchanged (sum over cages of ALIVE animals is
          invariant under transfer), while a retire/euthanize decrements it —
          a population conservation invariant, different in kind from the fiscal
          budget invariant.
        test_recipe:
          setup:
            - "APPROVED protocol, two compatible cages A (capacity 5) and B (capacity 5)"
            - "2 mice in cage A; transfer 1 to cage B; then retire the one in B"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Pop", email: "pop@uni.edu", department: "Bio" }
              as: IacucAdministrator
