      - name: hoist_and_compliance_dimensions_multiply_and_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Mine.hoist_state.HOIST_AVAILABLE_to_HOIST_DERATED
          - state_machines.Mine.compliance_state.COMPLIANT_to_CITED
          - calculations.mine_effective_hoist_capacity
          - endpoints[GET /salt/mines/{id}/hoist-capacity]
        distinguishing_aspect: |
          The two dimensions are genuinely independent and multiplicative: HOIST_DERATED + CITED
          gives 24000 * 0.55 * 0.80 = 10560.00 (not the weaker single factor 13200.00), and CLEARing
          the citation lifts the mine to 13200.00 while leaving hoist_state at HOIST_DERATED.
        test_recipe:
          setup:
            - "A mine rated 24000 t/day at HOIST_AVAILABLE + COMPLIANT with no runs, so no capacity re-fit cascade can fire."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
          trigger:
            - call: "POST /salt/mines/${mine_id}/hoist-status"
              payload: { hoist_state: "HOIST_DERATED", note: "skip hoist rope inspection derate" }
              as: MinePlanner
              captures: { eff_after_derate: "$.data.effective_hoist_tons_per_day" }
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CITE", note: "roof control citation" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eff_after_cite: "$.data.effective_hoist_tons_per_day" }
            - call: "GET /salt/mines/${mine_id}/hoist-capacity"
              payload: {}
              as: MinePlanner
              captures: { hf: "$.data.hoist_factor", cf: "$.data.compliance_factor", hourly: "$.data.mine_hourly_capacity" }
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CLEAR", note: "citation abated" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eff_after_clear: "$.data.effective_hoist_tons_per_day", hoist_after_clear: "$.data.hoist_state" }
          assert:
            - "${eff_after_derate} == 13200.00 with compliance_state still COMPLIANT"
            - "${eff_after_cite} == 10560.00 (0.55 * 0.80, not 0.55 alone and not 0.80 alone)"
            - "${hf} == 0.55 and ${cf} == 0.80 and ${hourly} == 440.00"
            - "${eff_after_clear} == 13200.00 and ${hoist_after_clear} == HOIST_DERATED"
            - "Mine.${mine_id}.compliance_state == COMPLIANT and last_compliance_action_at == '2026-08-01T00:00:00Z'"

