  - rule_id: boundary_precision_check
    instances:
      - name: medicaid_grant_coverage_exact_equality_admits_delivery
        grounds:
          - calculations.plan_grant_commitment_and_absorption
          - validations.priority_40_grant_coverage
        metric: "grant_eligible_cents vs patient_gross_share_cents (the Medicaid zero-residue equality boundary)"
        endpoint: "POST /deliveries"
        boundary_matrix:
          - { grant_budget_cents: 314, grant_eligible: 314, gross: 313, relation: "eligible > gross", expected: "201, plan_grant_cents 313, patient_payable_cents 0" }
          - { grant_budget_cents: 313, grant_eligible: 313, gross: 313, relation: "eligible == gross", expected: "201, plan_grant_cents 313, patient_payable_cents 0" }
          - { grant_budget_cents: 312, grant_eligible: 312, gross: 313, relation: "eligible < gross", expected: "409 ERR_GRANT_COVERAGE_INSUFFICIENT" }
        distinguishing_aspect: |
          Metric is a money equality on the fiscal ladder, exercised on the creation endpoint; the
          at-boundary case must ADMIT (>= not >), and only one cent below fails.
        test_recipe:
          setup:
            - "MEDICAID plan at 20%; Z1 standard fee lines 705 and 861 give per-line shares 141 and 172, so patient_gross_share_cents is exactly 313."
            - "Three PlanGrants under three separate plans of the same shape funded to 314, 313 and 312 cents, each with a 400-cent cap so the cap never binds."
            - "Three READY orders and one 14:00-16:00Z window of capacity 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /pharmacies"
