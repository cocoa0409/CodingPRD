            - "error_id != ERR_APPROVAL_LIMIT_EXCEEDED (fiscal, priority 11) even though 4000000 exceeds the manager tier"
            - "WriteOffRequest status remains REJECTED"

      - name: appeal_submit_temporal_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair business_temporal x business_constraint: submitting an
          appeal that is both past its filing deadline and missing its required
          attachment returns ERR_TIMELY_FILING_EXPIRED (priority 7), never
          ERR_ATTACHMENT_REQUIREMENT_UNMET (priority 10). Different category pair
          than state x fiscal.
        test_recipe:
          setup:
            - "Payer A with level-1 policy (60d, requires CLINICAL_NOTES); code CO-16"
            - "Denial CLM-901 (denied 250000, remit 2026-08-01 -> deadline 2026-09-30), triaged, assigned; appeal created and letter generated at 2026-08-20 with NO attachments"
            - "Clock advanced to 2026-10-01 (past deadline); the in-flight LETTER_GENERATED appeal shields the denial from the expiry sweep"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
