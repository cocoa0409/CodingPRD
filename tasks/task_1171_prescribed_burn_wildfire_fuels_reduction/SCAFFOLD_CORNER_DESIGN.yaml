# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 1171
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: parcel_creation_computes_hazard_and_system_fields
        claim_type: computed_fields
        grounds:
          - entities.Parcel.fields.hazard_score
          - calculations.hazard_score
        distinguishing_aspect: "Computed hazard_score == 55 (35 BRUSH + 10 MODERATE + 0 non-WUI + 10 drought) and common fields behave (version starts at 1, id/created_at server-stamped)."
        test_recipe:
          setup: ["Association and landowner exist"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
          trigger:
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {hz: $.data.hazard_score, pv: $.data.version} }
          assert:
            - "hz == 55"
            - "pv == 1 and response carries server-stamped id and created_at"

      - name: contractor_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Contractor.fields.no_show_count
          - entities.Contractor.fields.standing
          - entities.Contractor.fields.available_units
        distinguishing_aspect: "New contractor: no_show_count 0, standing GOOD_STANDING, available_units == capacity_units."
        test_recipe:
          setup: ["Association exists"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
          trigger:
            - { call: "POST /contractors", payload: {name: "EngCo", resource_type: "ENGINE", capacity_units: 4, personnel_per_unit: 5, day_rate_cents_per_unit: 100000}, as: AssociationAdmin, captures: {ns: $.data.no_show_count, st: $.data.standing, av: $.data.available_units} }
          assert:
            - "ns == 0 and st == GOOD_STANDING and av == 4"

      - name: burn_plan_create_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.BurnPlan.fields.min_rh_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required prescription field min_rh_pct yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Landowner with parcel exists"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
          trigger:
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_INVALID_REQUEST (min_rh_pct omitted)"

      - name: parcel_create_rejects_unknown_field
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An undeclared payload field on POST /parcels is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Landowner exists"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
          trigger:
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10, hazard_score: 1}, as: Landowner, as_user_id: "${lo}", captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_INVALID_REQUEST (computed/undeclared input field hazard_score rejected)"

      - name: parcel_create_rejects_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Parcel.fields.fuel_model
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "fuel_model outside {GRASS, BRUSH, TIMBER} yields 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Landowner exists"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
          trigger:
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "SWAMP", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_INVALID_ENUM"

      - name: plan_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but absent BurnPlan UUID yields 404 ERR_PLAN_NOT_FOUND inside the error envelope."
        test_recipe:
          setup: ["Association exists (empty of plans)"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
          trigger:
            - { call: "GET /burn-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_PLAN_NOT_FOUND (HTTP 404)"

      - name: weather_observation_is_immutable_event
        claim_type: immutability
        grounds:
          - entities.WeatherObservation
        distinguishing_aspect: "common_fields: false event entity: the stored observation exposes id + created_at but no version/updated_at, and no update endpoint exists in the scaffold."
        test_recipe:
          setup:
            - "Execution SCHEDULED on an approved plan (observations accepted on any non-terminal phase)"
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${plan}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/executions", payload: {scheduled_date: "2026-05-12"}, as: BurnBoss, as_user_id: "${bossA}", captures: {ex: $.data.id} }
          trigger:
            - { call: "POST /executions/${ex}/weather-observations", payload: {observed_at: "2026-04-30T06:00:00Z", wind_mph: 10, fuel_moisture_pct: 12, rh_pct: 40, temp_f: 60, mixing_height_ft: 2000}, as: BurnBoss, as_user_id: "${bossA}", captures: {oid: $.data.id} }
            - { call: "GET /executions/${ex}/weather-observations", payload: {}, as: Any, captures: {first_id: "$.data[0].id"} }
          assert:
            - "first_id == oid and the listed item carries created_at but no version/updated_at keys"

  - section: state_machines
    instances:
      - name: approve_draft_plan_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BurnPlan.SUBMITTED_to_APPROVED
          - errors[ERR_PLAN_NOT_SUBMITTED]
        distinguishing_aspect: "approve from DRAFT (not SUBMITTED) fails with ERR_PLAN_NOT_SUBMITTED; plan stays DRAFT."
        test_recipe:
          setup: ["Plan DRAFT"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
          trigger:
            - { call: "POST /burn-plans/${plan}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_PLAN_NOT_SUBMITTED and BurnPlan.${plan}.status == DRAFT"

      - name: cancelled_plan_submit_rejected_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.BurnPlan.DRAFT_to_CANCELLED
        distinguishing_aspect: "CANCELLED is terminal: submit on a cancelled plan fails with ERR_PLAN_NOT_DRAFT."
        test_recipe:
          setup: ["Plan cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
            - { call: "POST /burn-plans/${plan}/cancel", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {cst: $.data.status} }
          trigger:
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {err: "$.data.error_id"} }
          assert:
            - "cst == CANCELLED and err == ERR_PLAN_NOT_DRAFT"

      - name: permit_issue_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.BurnPermit.UNDER_REVIEW_to_ISSUED
          - errors[ERR_PERMIT_NOT_UNDER_REVIEW]
        distinguishing_aspect: "Second issue on an already ISSUED permit fails with ERR_PERMIT_NOT_UNDER_REVIEW; no duplicate side effects."
        test_recipe:
          setup: ["Permit ISSUED (contingency ACCEPTED, 1/1 notifications)"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${plan}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/contingency-plans", payload: {escape_trigger_points: "flame>4ft", min_holding_personnel: 10, water_supply_description: "tender onsite", evacuation_route_description: "Hwy 9"}, as: BurnBoss, as_user_id: "${bossA}", captures: {cont: $.data.id} }
            - { call: "POST /contingency-plans/${cont}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/permits", payload: {notifications_required: 1}, as: BurnBoss, as_user_id: "${bossA}", captures: {perm: $.data.id} }
            - { call: "POST /permits/${perm}/notifications", payload: {recipient_name: "N1", channel: "MAIL"}, as: BurnBoss, as_user_id: "${bossA}", captures: {n1: $.data.id} }
            - { call: "POST /notifications/${n1}/confirm", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /permits/${perm}/issue", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {p1: $.data.status} }
          trigger:
            - { call: "POST /permits/${perm}/issue", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {err: "$.data.error_id"} }
          assert:
            - "p1 == ISSUED and err == ERR_PERMIT_NOT_UNDER_REVIEW"

      - name: gonogo_fail_answer_stands_down_execution
        claim_type: side_effect_execution
        grounds:
          - state_machines.BurnExecution.BRIEFED_to_STOOD_DOWN
          - entities.GoNoGoChecklist.fields.verdict
        distinguishing_aspect: "A single FAIL answer among six produces verdict NO_GO (not an error), records the checklist with the weather snapshot, and moves the execution to STOOD_DOWN."
        test_recipe:
          setup: ["Burn-ready execution BRIEFED at 2026-05-12T07:30Z with fresh in-prescription observation"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${plan}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {plan_v: $.data.version} }
            - { call: "POST /burn-plans/${plan}/ignition-plans", payload: {expected_burn_plan_version: "${plan_v}", ignition_method: "DRIP_TORCH", test_fire_required: true, steps: [{step_index: 1, zone_label: "north", technique: "strip"}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {ign: $.data.id} }
            - { call: "POST /ignition-plans/${ign}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/contingency-plans", payload: {escape_trigger_points: "flame>4ft", min_holding_personnel: 10, water_supply_description: "tender onsite", evacuation_route_description: "Hwy 9"}, as: BurnBoss, as_user_id: "${bossA}", captures: {cont: $.data.id} }
            - { call: "POST /contingency-plans/${cont}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/permits", payload: {notifications_required: 1}, as: BurnBoss, as_user_id: "${bossA}", captures: {perm: $.data.id} }
            - { call: "POST /permits/${perm}/notifications", payload: {recipient_name: "N1", channel: "MAIL"}, as: BurnBoss, as_user_id: "${bossA}", captures: {n1: $.data.id} }
            - { call: "POST /notifications/${n1}/confirm", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /permits/${perm}/issue", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/smoke-approvals", payload: {requested_burn_date: "2026-05-12", requested_acres: 100}, as: BurnBoss, as_user_id: "${bossA}", captures: {smoke: $.data.id} }
            - { call: "POST /smoke-approvals/${smoke}/decide", payload: {decision: "APPROVED"}, as: AirQualityOfficer }
            - { call: "POST /contractors", payload: {name: "EngCo", resource_type: "ENGINE", capacity_units: 4, personnel_per_unit: 5, day_rate_cents_per_unit: 100000}, as: AssociationAdmin, captures: {cEng: $.data.id} }
            - { call: "POST /contractors", payload: {name: "CrewCo", resource_type: "HAND_CREW", capacity_units: 2, personnel_per_unit: 10, day_rate_cents_per_unit: 80000}, as: AssociationAdmin, captures: {cCrew: $.data.id} }
            - { call: "POST /contractors", payload: {name: "TendCo", resource_type: "WATER_TENDER", capacity_units: 1, personnel_per_unit: 2, day_rate_cents_per_unit: 60000}, as: AssociationAdmin, captures: {cTend: $.data.id} }
            - { call: "POST /burn-plans/${plan}/resource-orders", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {order: $.data.id} }
