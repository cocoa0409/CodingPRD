  - rule_id: non_linear_state_machine
    instances:
      - name: fare_family_review_reject_revision_cycle
        grounds:
          - state_machines.FareFamily.status
          - state_machines.FareFamily.status.IN_REVIEW_to_DRAFT
          - state_machines.FareFamily.status.IN_REVIEW_to_PUBLISHED
          - entities.FareFamily.fields.revision_no
          - entities.FareFamily.fields.reviewer_user_id
          - calculations.fare_family_fee_fingerprint
        cycle_or_branch: |
          DRAFT -> IN_REVIEW -> (REJECT) -> DRAFT -> IN_REVIEW -> (APPROVE) -> PUBLISHED: the
          family re-enters DRAFT, a state it has already occupied, but NOT in its original
          condition - revision_no has advanced to 2 and revision_no is a fingerprint component,
          so the second submit produces a fee_fingerprint that is byte-different from the first
          even though the attribute set is untouched. A naive implementation that treats the
          loop as idempotent leaves revision_no at 1 and re-emits the "|1|" fingerprint.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; four ACTIVE products: BAG_CHECKED_1 3500, SEAT_STANDARD 1900, PRIORITY_BOARDING 1250, WIFI_FULL_FLIGHT 750"
            - "ECONOMY family ECO_BUNDLE (base_fare 12000, bundle 15000) carries all four as INCLUDED quantity 1"
            - "the family has already been submitted once and rejected once by pa-001, so it is back in DRAFT at revision_no 2, then submitted again and sitting in IN_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_board_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "WIFI_FULL_FLIGHT", name: "Full-flight wifi", category: "ONBOARD", list_price_cents: 750, tax_treatment: "EXEMPT", revenue_class: "NON_AIR", revenue_account_code: "4500", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_wifi_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BUNDLE", name: "Economy Bundle", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 15000, refundability: "REFUNDABLE_WITH_FEE", change_fee_cents: 7500, boarding_priority_tier: 3 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bundle_id: $.data.id }
            - call: "POST /fare-families/${f_bundle_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_bundle_id}/attributes"
              payload: { ancillary_product_id: "${p_seat_std_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_bundle_id}/attributes"
              payload: { ancillary_product_id: "${p_board_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_bundle_id}/attributes"
              payload: { ancillary_product_id: "${p_wifi_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_bundle_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { fp_rev1: $.data.fee_fingerprint }
            - call: "POST /fare-families/${f_bundle_id}/review-decision"
