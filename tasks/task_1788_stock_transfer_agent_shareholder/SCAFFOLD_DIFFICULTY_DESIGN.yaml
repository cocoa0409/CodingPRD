scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bond_open_vs_fixed_penalty_divergence
        grounds:
          - calculations.indemnity_bond_premium
          - entities.LostCertificateClaim.fields.bond_variant
          - entities.LostCertificateClaim.fields.loss_report_price_cents
        distinguishing_aspect: |
          Dual-variant pricing on the LostCertificateClaim/Certificate domain (indemnity bond):
          OPEN_PENALTY prices shares at the issuer's price at post-bond time, FIXED_PENALTY at the
          price frozen at FILED — identical 100-share claims yield different bond and premium cents
          once the market price moves 5000 -> 7000 between filing and bonding.
        test_recipe:
          setup:
            - "Issuer ACME price 5000, outstanding 300; account A (CA, CERTIFIED) with position of 300 book shares"
            - "Two 100-share certificates C1, C2 withdrawn from the position; C1 reported lost while price is 5000; price raised to 7000; C2 reported lost"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", cusip: "000000001", ticker: "ACME", shares_outstanding: 300, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Alice Holder", address_line1: "1 Main St", city: "Los Angeles", state_code: "CA", postal_code: "90001", country_code: "US", tax_id: "111-22-3333", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 300 }
              as: AgentAdmin
              captures: { pos: $.data.id }
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 100 }
              as: TransferExaminer
              captures: { cert1: $.data.id }
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 100 }
              as: TransferExaminer
              captures: { cert2: $.data.id }
            - call: "POST /certificates/${cert1}/report-lost"
              payload: { loss_date: "2026-08-05T00:00:00Z" }
              as: TransferExaminer
              as_user_id: "exam_1"
              captures: { claim1: $.data.id }
            - call: "PATCH /issuers/${iss}"
              payload: { current_market_price_cents: 7000 }
              as: IssuerOfficer
              as_user_id: "${iss}"
            - call: "POST /certificates/${cert2}/report-lost"
              payload: { loss_date: "2026-08-06T00:00:00Z" }
              as: TransferExaminer
              as_user_id: "exam_1"
              captures: { claim2: $.data.id }
          trigger:
            - call: "POST /lost-certificate-claims/${claim1}/post-bond"
              payload: { bond_variant: "FIXED_PENALTY", premium_paid_cents: 30000 }
              as: TransferExaminer
            - call: "POST /lost-certificate-claims/${claim2}/post-bond"
              payload: { bond_variant: "OPEN_PENALTY", premium_paid_cents: 42000 }
              as: TransferExaminer
          assert:
            - "LostCertificateClaim.${claim1}.bond_amount_cents == 1000000 (100 shares x 5000 loss-report price x 2)"
            - "LostCertificateClaim.${claim1}.required_premium_cents == 30000 (3% of 1000000, all under tier-1 cap)"
            - "LostCertificateClaim.${claim2}.bond_amount_cents == 1400000 (100 shares x 7000 current price x 2)"
            - "LostCertificateClaim.${claim2}.required_premium_cents == 42000 (3% of 1400000)"
            - "both claims reference certificates with share_quantity == 100, so the 400000-cent bond delta is attributable only to variant x price timing"

      - name: withholding_provisional_vs_final_tin_cure
        grounds:
          - calculations.dividend_withholding
          - entities.DividendPayment.fields.provisional_withholding_cents
          - entities.DividendPayment.fields.withholding_cents
        distinguishing_aspect: |
          Dual-variant withholding on the DividendPayment domain (tax, a different entity domain
          from instance bond_open_vs_fixed_penalty_divergence): the provisional variant uses
          tin_status as of record_date (MISSING -> 24% backup), the final variant uses tin_status
          as of payable_date (CERTIFIED after a W-9 cure -> 0%) — same payment, same gross,
          different withholding cents.
        test_recipe:
          setup:
            - "Issuer outstanding 1000; account with tin_status MISSING holding 1000 shares"
            - "Declaration: record 2026-09-01, payable 2026-09-15, 500 millicents/share"
            - "Record lock at 2026-09-01 accrues the payment with provisional withholding"
            - "Account certifies its TIN between record and payable dates"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Beta Inc", cusip: "000000002", ticker: "BETA", shares_outstanding: 1000, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Bob Uncertified", address_line1: "2 Oak St", city: "Austin", state_code: "TX", postal_code: "73301", country_code: "US", tax_id: "222-33-4444", tin_status: "MISSING" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1000 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-09-01T00:00:00Z", payable_date: "2026-09-15T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgentAdmin
            - call: "PATCH /accounts/${acct}"
              payload: { tin_status: "CERTIFIED" }
              as: AgentAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
              captures: { pay: "$.data[0].id" }
          assert:
            - "DividendPayment.${pay}.gross_cents == 500 (round_half_up(1000 x 500 / 1000))"
            - "DividendPayment.${pay}.provisional_withholding_cents == 120 (24% backup rate on MISSING tin at record date)"
            - "DividendPayment.${pay}.withholding_cents == 0 (final variant sees CERTIFIED at payable date)"
            - "DividendPayment.${pay}.net_cents == 500"
            - "DividendPayment.${pay}.status == DISBURSED"
            - "provisional_withholding_cents (120) != withholding_cents (0) on the same payment row"

  - rule_id: combinatorial_formula
    instances:
      - name: per_payment_rounding_beats_sum_then_round
        grounds:
          - calculations.gross_dividend_accrual
          - entities.DividendDeclaration.fields.total_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: gross is rounded per payment (millicents -> cents, round_half_up)
          then summed; sum-then-round is forbidden. Two 1-share accounts at 667 millicents prove the
          order: pinned per-payment yields total_accrued_cents == 2, sum-then-round would yield 1.
        test_recipe:
          setup:
            - "Issuer outstanding 2; two CERTIFIED US accounts with exactly 1 share each"
            - "Declaration at 667 millicents/share, record 2026-09-01"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Gamma LLC", cusip: "000000003", ticker: "GAMA", shares_outstanding: 2, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Carol One", address_line1: "3 Pine St", city: "Albany", state_code: "NY", postal_code: "12201", country_code: "US", tax_id: "333-44-5555", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Dave Two", address_line1: "4 Elm St", city: "Albany", state_code: "NY", postal_code: "12201", country_code: "US", tax_id: "444-55-6666", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct2: $.data.id }
            - call: "POST /accounts/${acct1}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1 }
              as: AgentAdmin
            - call: "POST /accounts/${acct2}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-09-01T00:00:00Z", payable_date: "2026-09-15T00:00:00Z", amount_per_share_millicents: 667 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-declarations/${decl}"
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
          assert:
            - "each generated DividendPayment.gross_cents == 1 (round_half_up(1 x 667 / 1000) = round_half_up(0.667) = 1)"
            - "DividendDeclaration.${decl}.total_accrued_cents == 2 (sum of per-payment rounded gross)"
            - "total_accrued_cents != 1, which is what the forbidden sum-then-round order would produce (round_half_up(1334/1000) = 1)"
            - "DividendDeclaration.${decl}.total_eligible_shares == 2"

      - name: withholding_tier_branch_matrix
        grounds:
          - calculations.dividend_withholding
          - entities.ShareholderAccount.fields.tin_status
          - entities.ShareholderAccount.fields.treaty_tier
        distinguishing_aspect: |
          Mode (a) combinatorial formula: rate(account) branches on three inputs — tin_status,
          residency, treaty_tier — with tiered NRA rates. A FOREIGN/CERTIFIED/TREATY account pays
          15% while a MISSING account pays 24% on the same declaration, and the branches are
          verified with literal cents on both arms.
        test_recipe:
          setup:
            - "Issuer outstanding 3000; account F: FOREIGN, CERTIFIED, TREATY, 2000 shares; account M: US, MISSING, 1000 shares"
            - "One declaration at 500 millicents/share; both accounts on the same record date"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Delta Co", cusip: "000000004", ticker: "DLTA", shares_outstanding: 3000, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Foreign Treaty", address_line1: "5 Rue de Paix", city: "Paris", state_code: "NY", postal_code: "75002", country_code: "FR", residency: "FOREIGN", tax_id: "FR-123", tin_status: "CERTIFIED", treaty_tier: "TREATY" }
              as: AgentAdmin
              captures: { acct_f: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Mary Missing", address_line1: "6 Birch St", city: "Houston", state_code: "TX", postal_code: "77001", country_code: "US", tax_id: "555-66-7777", tin_status: "MISSING" }
              as: AgentAdmin
              captures: { acct_m: $.data.id }
            - call: "POST /accounts/${acct_f}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 2000 }
              as: AgentAdmin
            - call: "POST /accounts/${acct_m}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1000 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-09-01T00:00:00Z", payable_date: "2026-09-15T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgentAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}&account_id=${acct_f}"
              as: AgentAdmin
              captures: { pay_f: "$.data[0].id" }
            - call: "GET /dividend-payments?declaration_id=${decl}&account_id=${acct_m}"
              as: AgentAdmin
              captures: { pay_m: "$.data[0].id" }
          assert:
            - "DividendPayment.${pay_f}.gross_cents == 1000 (2000 x 500 / 1000)"
            - "DividendPayment.${pay_f}.withholding_cents == 150 (CERTIFIED + FOREIGN + TREATY -> 15% NRA treaty rate)"
            - "DividendPayment.${pay_f}.net_cents == 850"
            - "DividendPayment.${pay_m}.gross_cents == 500"
            - "DividendPayment.${pay_m}.withholding_cents == 120 (MISSING -> 24% backup withholding regardless of residency)"
            - "DividendPayment.${pay_m}.net_cents == 380"
            - "withholding rate differs across the two payments on the same declaration, driven only by (tin_status, residency, treaty_tier)"

      - name: escheatment_valuation_evaluation_order
        grounds:
          - calculations.escheatment_remit_valuation
          - entities.EscheatmentCase.fields.report_price_cents
          - entities.EscheatmentCase.fields.total_remit_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the cash leg (stale dividends) was itself computed from
          the shares being valued, so the valuation MUST freeze the price first, then value shares,
          then sum stale gross, then total. With 10 shares at 6000 cents and one 250-cent stale
          dividend the pinned order yields 60000 + 250 = 60250.
        test_recipe:
          setup:
            - "TX account (3-year dormancy) created at the default clock 2026-08-01, holding 10 shares of a 6000-cent issuer"
            - "Declaration 25000 millicents/share, record 2026-08-02, payable 2026-08-03; payment disbursed (CERTIFIED US -> 0% withholding), never cashed"
            - "Clock at 2029-08-01: payment is stale-dated (disbursed + 180 days passed); sweep marks the account DORMANT and identifies a case"
            - "Notice sent; clock advanced exactly 60 days"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Epsilon Inc", cusip: "000000005", ticker: "EPSI", shares_outstanding: 10, par_value_cents: 1, current_market_price_cents: 6000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Eddie Dormant", address_line1: "7 Cedar St", city: "Dallas", state_code: "TX", postal_code: "75201", country_code: "US", tax_id: "666-77-8888", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 10 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-08-02T00:00:00Z", payable_date: "2026-08-03T00:00:00Z", amount_per_share_millicents: 25000 }
              as: IssuerOfficer
              as_user_id: "${iss}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /escheatment/scan"
              payload: {}
              as: AgentAdmin
            - call: "GET /escheatment-cases?account_id=${acct}"
              as: ComplianceOfficer
              captures: { case: "$.data[0].id" }
            - call: "POST /escheatment-cases/${case}/send-notice"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-30T00:00:00Z" }
              as: AgentAdmin
          trigger:
            - call: "POST /escheatment-cases/${case}/report"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "EscheatmentCase.${case}.report_price_cents == 6000 (frozen at REPORTED, step 1)"
            - "EscheatmentCase.${case}.share_value_cents == 60000 (10 shares x 6000, step 2)"
            - "EscheatmentCase.${case}.cash_value_cents == 250 (single STALE_DATED payment gross = round_half_up(10 x 25000 / 1000), step 3)"
            - "EscheatmentCase.${case}.total_remit_cents == 60250 (step 4 = step 2 + step 3)"
            - "EscheatmentCase.${case}.status == REPORTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_deficiency_cycle_loops
        grounds:
          - state_machines.TransferRequest.DEFICIENT_to_UNDER_REVIEW
          - state_machines.TransferRequest.UNDER_REVIEW_to_DEFICIENT
        distinguishing_aspect: |
          TransferRequest is cyclic: UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW may repeat (a pure
          pipeline could not re-enter UNDER_REVIEW). The test flags and cures twice, proving the
          loop, then proceeds to MEDALLION_VERIFIED; the version counter (6) proves five distinct
          transitions fired.
        test_recipe:
          setup:
            - "Issuer outstanding 500, price 5000; accounts A (500 book shares) and B"
            - "Transfer t of 100 shares A -> B created (transfer_value_cents = 500000)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Zeta Corp", cusip: "000000006", ticker: "ZETA", shares_outstanding: 500, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Frank From", address_line1: "8 Ash St", city: "Sacramento", state_code: "CA", postal_code: "95814", country_code: "US", tax_id: "777-88-9999", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_a: $.data.id, a_v: $.data.version }
            - call: "POST /accounts"
              payload: { holder_name: "Gina To", address_line1: "9 Beech St", city: "Fresno", state_code: "CA", postal_code: "93701", country_code: "US", tax_id: "888-99-0000", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_a}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 500 }
              as: AgentAdmin
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 100, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t: $.data.id }
          trigger:
            - call: "POST /transfer-requests/${t}/flag-deficient"
              payload: { deficiency_reason: "missing medallion guarantee" }
              as: TransferExaminer
              as_user_id: "exam_1"
            - call: "POST /transfer-requests/${t}/cure-deficiency"
              payload: {}
              as: TransferExaminer
            - call: "POST /transfer-requests/${t}/flag-deficient"
              payload: { deficiency_reason: "illegible assignment" }
              as: TransferExaminer
              as_user_id: "exam_2"
            - call: "POST /transfer-requests/${t}/cure-deficiency"
              payload: {}
              as: TransferExaminer
            - call: "POST /transfer-requests/${t}/submit-medallion"
              payload: { medallion_reference: "MED-1", coverage_cents: 500000 }
              as: TransferExaminer
              as_user_id: "exam_2"
            - call: "GET /transfer-requests?from_account_id=${acct_a}"
              as: TransferExaminer
          assert:
            - "TransferRequest.${t}.status == MEDALLION_VERIFIED after two full DEFICIENT -> UNDER_REVIEW loops"
            - "TransferRequest.${t}.version == 6 (create + flag + cure + flag + cure + medallion)"
            - "TransferRequest.${t}.last_examiner_id == \"exam_2\" (last examiner touch wins)"
            - "TransferRequest.${t}.transfer_value_cents == 500000"

      - name: escheatment_case_reactivation_cycle
        grounds:
          - state_machines.EscheatmentCase.REACTIVATED_to_IDENTIFIED
          - state_machines.ShareholderAccount.DORMANT_to_ACTIVE
          - state_machines.ShareholderAccount.ACTIVE_to_DORMANT
        distinguishing_aspect: |
          EscheatmentCase is cyclic on a different entity than TransferRequest: IDENTIFIED ->
          REACTIVATED -> IDENTIFIED as the owner makes contact and then goes dormant again. The
          same case row is re-armed (not duplicated), proving the loop is on one instance.
        test_recipe:
          setup:
            - "CA account created at the default clock 2026-08-01 holding 5 shares (dormancy period 3 years)"
            - "First sweep at exactly 2029-08-01 marks DORMANT and identifies a case; owner contact reactivates"
            - "Second sweep at exactly 2032-08-01 re-dormants the account and re-arms the same case"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Eta Inc", cusip: "000000007", ticker: "ETAI", shares_outstanding: 5, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Hank Cyclic", address_line1: "10 Fig St", city: "San Diego", state_code: "CA", postal_code: "92101", country_code: "US", tax_id: "999-00-1111", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 5 }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /escheatment/scan"
              payload: {}
              as: AgentAdmin
              captures: { scan1: $.data.cases_created }
            - call: "GET /escheatment-cases?account_id=${acct}"
              as: ComplianceOfficer
              captures: { case: "$.data[0].id" }
            - call: "POST /escheatment-cases/${case}/reactivate"
              payload: {}
              as: ServiceAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-08-01T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /escheatment/scan"
              payload: {}
              as: AgentAdmin
            - call: "GET /escheatment-cases?account_id=${acct}"
              as: ComplianceOfficer
            - call: "GET /accounts/${acct}"
              as: AgentAdmin
          assert:
            - "GET /escheatment-cases?account_id=${acct} returns total_count == 1 (the same case re-armed, not a duplicate)"
            - "EscheatmentCase.${case}.status == IDENTIFIED again after being REACTIVATED"
            - "EscheatmentCase.${case}.dormancy_start_date == \"2029-08-01T00:00:00Z\" (refreshed at reactivation contact)"
            - "ShareholderAccount.${acct}.account_status == DORMANT"
            - "ShareholderAccount.${acct}.last_qualifying_contact_date == \"2029-08-01T00:00:00Z\""

  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_cert_position_issuer
        grounds:
          - state_machines.TransferRequest.APPROVED_to_SETTLED
          - state_machines.Certificate.ISSUED_to_CANCELLED
          - entities.Issuer.fields.total_certificated_shares
        distinguishing_aspect: |
          Depth-3 cascade triggered by transfer settle: hop1 cancels the source certificate,
          hop2 debits/credits the two positions (caused by hop1 + settlement), hop3 recomputes the
          issuer's aggregate totals (caused by hop2). Each link is observed on a different entity.
        test_recipe:
          setup:
            - "Issuer outstanding 300, price 5000; account A position 300 book; withdrawal of 200 -> certificate C (book 100, certificated 200); account B"
            - "Certificated transfer of all 200 shares A -> B, medallion-verified and approved"
          setup_api_calls:
            - call: "POST /issuers"
