      - name: run_completion_derates_catalyst_and_reverts_unrelated_approved_run
        grounds:
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - state_machines.CatalystCharge.ACTIVE_to_SPENT
          - state_machines.ReformerTrain.RUNNING_to_DERATED
          - state_machines.ProductionRun.APPROVED_to_PLANNED
          - calculations.catalyst_activity_pct
          - calculations.run_ammonia_unit_cost
        distinguishing_aspect: |
          A different origin and a different mechanism from the outage cascade: here nobody asks for
          an outage — a plain settlement pushes cumulative_operating_hours from 18000 to 18240, which
          drops activity_pct to 54.40, and that arithmetic alone spends the charge, derates the train
          and reverts a second, entirely unrelated APPROVED run to PLANNED. The cascade is triggered
          by a threshold crossing inside a calculation rather than by a declared status transition.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and no hedge lots, so both cost variants price at spot."
            - "One reformer train carrying a catalyst charge with design_life_hours 40000, baseline_operating_hours 18000 and poisoning_index 0.00, i.e. activity_pct exactly 55.00 — eligible, with 240 hours of headroom to spare."
            - "ProductionRun PR-D over 2026-09-01 -> 2026-09-11 (target 100) is APPROVED and STARTED with the clock at 2026-09-01."
            - "ProductionRun PR-E over 2026-10-01 -> 2026-10-10 (target 100) is APPROVED on the same train while PR-D runs."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Medicine Hat Works", site_code: "MHT-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 800 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 18000, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-D", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 100 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_d_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_d_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/production-runs/${run_d_id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-E", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-10T00:00:00Z", target_ammonia_tons: 100 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_e_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_e_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
          trigger:
            - call: "POST /nitrogen-ops/production-runs/${run_d_id}/complete"
              payload: { actual_ammonia_tons: 100, actual_operating_hours: 240 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "ProductionRun.${run_d_id}.status == COMPLETED"
            - "ProductionRun.${run_d_id}.final_unit_cost_usd_per_ton == 181.10"
            - "ProductionRun.${run_d_id}.consumed_gas_mmbtu == 0"
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 18240"
            - "CatalystCharge.${charge_id}.calendar_activity_pct == 54.40"
            - "CatalystCharge.${charge_id}.activity_pct == 54.40"
            - "CatalystCharge.${charge_id}.status == SPENT"
            - "ReformerTrain.${train_id}.status == DERATED"
            - "ReformerTrain.${train_id}.active_charge_id == null"
            - "ProductionRun.${run_e_id}.status == PLANNED"
            - "ProductionRun.${run_e_id}.provisional_unit_cost_usd_per_ton == null"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: run_not_completed_outranks_produced_exceeds_reserved_on_produce
        grounds:
          - validations[priority=9]
          - validations[priority=28]
          - errors[ERR_RUN_NOT_COMPLETED]
          - errors[ERR_PRODUCED_EXCEEDS_RESERVED]
          - state_machines.ProductionOrder.A_RESERVED_to_A_CONSUMED
        distinguishing_aspect: |
          One request violates a `state` rule at priority 9 (the run is still RUNNING, so
          final_unit_cost_usd_per_ton has no settled value) and a `business_fiscal` rule at priority
          28 (produced_tons 2000 exceeds reserved_tons 1000); the response must be
