              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points }
          assert:
            - "HTTP 200"
            - "${dc} == 700"
            - "${dp} == 0.0467"
            - "${pp} == 1"

      - name: violation_points_retailer_site_multiplier_is_one
        claim_type: constants_applied
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "CHANNEL_MULTIPLIERS gives RETAILER_SITE 1.0, so a 12000 listing (pct 0.2000, tier 3 -> base 4) scores exactly 4 points where the same listing on MARKETPLACE would score 6."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product floor 15000; an unmatched RETAILER_SITE listing at 12000."]
