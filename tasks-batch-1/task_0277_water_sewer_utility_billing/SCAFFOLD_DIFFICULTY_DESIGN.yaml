  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: water_tier_ceiling_exact_vs_plus_one
        grounds:
          - calculations.tiered_water_volumetric
          - entities.Bill.fields.water_volumetric_cents
          - entities.RateSchedule.fields.water_tiers
        distinguishing_aspect: |
          Total consumption exactly at tier-1 ceiling (5000 gal) charges water_volumetric_cents=1500
          (all at 300/kgal), while 5001 gal crosses into tier 2 and charges 1501 — the single extra
          gallon is priced at the higher marginal 500/kgal rate. Reachable via POST /bills.
        test_recipe:
          setup:
            - "Two accounts: one with exactly 5000 potable gallons, one with 5001 potable gallons in the cycle."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "Exact", service_address: "12 St" }
              as: BillingClerk
              captures: { acct_e: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "Plus", service_address: "13 St" }
              as: BillingClerk
              captures: { acct_p: $.data.id }
            - call: "POST /accounts/${acct_e}/meters"
              payload: { meter_type: "POTABLE", serial: "PE" }
              as: BillingClerk
              captures: { me: $.data.id }
            - call: "POST /accounts/${acct_p}/meters"
              payload: { meter_type: "POTABLE", serial: "PP" }
              as: BillingClerk
              captures: { mpp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${me}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${me}/reads"
              payload: { reading_gallons: 5000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mpp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mpp}/reads"
              payload: { reading_gallons: 5001, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_e}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill_e: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_p}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill_p: $.data.id }
          assert:
            - "Bill.${bill_e}.water_volumetric_cents == 1500"
            - "Bill.${bill_p}.water_volumetric_cents == 1501"

      - name: arrears_threshold_at_exact_value_allows_shutoff
        grounds:
          - validations[priority=14]
          - entities.RateSchedule.fields.arrears_shutoff_threshold_cents
          - state_machines.Account.PAST_DUE_to_SHUTOFF_PENDING
        distinguishing_aspect: |
          past_due_cents exactly equal to arrears_shutoff_threshold_cents (7500) satisfies the
          >= comparison and permits scheduling, whereas 7499 would be rejected. Different metric
          (currency threshold via POST /shutoff-orders) than the gallon-tier boundary above.
        test_recipe:
          setup:
            - "Account whose past_due is exactly 7500 (threshold). Rate schedule with late_fee_pct=0, arrears threshold 7500; bill amount tuned to 7500 via potable 8000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
