  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_double_booking_half_open
        grounds:
          - validations[priority=10]
          - entities.Shift.fields.start_at
          - entities.Shift.fields.end_at
        distinguishing_aspect: |
          Resource = the VOLUNTEER's time; semantics = half-open intervals
          [start_at, end_at): a 10:00-14:00 signup overlapping an existing 08:00-12:00
          assignment is rejected, while the ADJACENT 12:00-16:00 signup (shared endpoint
          instant) is allowed. Adjacency-is-allowed is the pinned geometric rule.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; volunteer V fully ACTIVE"
            - "Shifts PUBLISHED capacity 5: A 2026-08-10 08:00-12:00, B 2026-08-10 10:00-14:00 (overlaps A), C 2026-08-10 12:00-16:00 (adjacent to A)"
