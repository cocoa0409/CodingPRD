              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p3_id: $.data.id }
            - call: "POST /generated-performances/${p3_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p1_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v0}" }
              as: LicenseeProducer
