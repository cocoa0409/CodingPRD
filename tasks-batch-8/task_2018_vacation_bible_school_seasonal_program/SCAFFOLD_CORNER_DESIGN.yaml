            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
          trigger:
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { e1: $.data.enrolled_count, s1: $.data.open_seats } }
