          assert:
            - "${tgt_state} == EXCLUDED and RulesOfEngagement.${roe_id}.status == SIGNED (exclusion does not freeze the document)"
            - "HTTP 422 with error_id == ERR_TARGET_EXCLUDED — priority 36 wins"
            - "the response error_id is NOT ERR_OUTSIDE_TESTING_WINDOW (priority 58), even though 2026-10-05T00:00:00Z is past window_end 2026-09-30T23:59:59Z"
            - "the response error_id is NOT ERR_TARGET_NOT_AUTHORIZED (priority 37) — an EXCLUDED target reports the exclusion, not a missing authorization"
