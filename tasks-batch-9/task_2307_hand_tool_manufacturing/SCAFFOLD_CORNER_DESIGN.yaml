              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "SERIAL_PATTERN_REVIEW" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { holder: $.data.held_by_user_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Self-clearance attempt" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { e_self_clear: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Independent review complete" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { cleared_status: $.data.status, retained_holder: $.data.held_by_user_id }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v1: $.data.version }
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { e_self_approve: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
              as_user_id: "wa-1"
              captures: { e_admin_approve: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { final_status: $.data.status }
          assert:
            - "holder == 'wa-1' after the hold and WarrantyProgram.${prog_id}.open_hold_count == 1"
            - "wa-1 clearing its own hold returns HTTP 403 with error_id == 'ERR_SEGREGATION_OF_DUTIES'; the claim stays 'FRAUD_HOLD'"
            - "wa-2 clearing it returns HTTP 200 with status 'SUBMITTED', fraud_cleared true, and retained_holder == 'wa-1' (deliberately NOT reset)"
            - "wa-1 approving returns HTTP 403 with error_id == 'ERR_SEGREGATION_OF_DUTIES' — the bar outlives the hold"
            - "The same approve sent as PlatformAdmin but with X-User-ID 'wa-1' also returns HTTP 403 with error_id == 'ERR_SEGREGATION_OF_DUTIES' — the check is on identity, not on role"
            - "wa-2 approving returns HTTP 200 with status 'APPROVED', reserve_charge_cents 681 and WarrantyProgram.${prog_id}.reserve_balance_cents == 4999319"
            - "All three refusals used the SAME expected_program_version token, so none of them incremented the programme version"

  - section: cross_cutting_complexity_layers
    instances:

      - name: lot_release_optimistic_concurrency_on_the_parent_sku
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.lot-release-stale-sku
          - validations[priority=450]
          - errors[ERR_STALE_SKU_VERSION]
        distinguishing_aspect: "The release token is checked against the PARENT SKU's version, not the lot's: a token one behind is 412, the current token gets past 450 and lands on the certification gate instead, and an unrelated PATCH to the SKU invalidates a previously-valid token without touching the lot at all."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU at version 1 and one lot of 500 units, still FORGED / DRAFT / IN_PROCESS."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: ProductionPlanner
              captures: { sku_v: $.data.version }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v} - 1" }
              as: ProductionPlanner
              captures: { e_stale_low: $.data.error_id }
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v} + 1" }
              as: ProductionPlanner
              captures: { e_stale_high: $.data.error_id }
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v}" }
              as: ProductionPlanner
              captures: { e_not_certified: $.data.error_id }
            - call: "PATCH /toolworks/tool-skus/${sku_id}"
              payload: { list_price_cents: 3900 }
              as: ChannelManager
              captures: { sku_v2: $.data.version }
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v}" }
              as: ProductionPlanner
              captures: { e_stale_after_patch: $.data.error_id }
          assert:
            - "A token one below the current version returns HTTP 412 with error_id == 'ERR_STALE_SKU_VERSION'"
            - "A token one above also returns HTTP 412 — the comparison is equality, not 'at least'"
            - "The exactly-current token gets past 450 and returns HTTP 409 with error_id == 'ERR_LOT_NOT_CERTIFIED', which is how we know the OCC gate was satisfied"
            - "sku_v2 == sku_v + 1 after the price PATCH, and the previously-valid token now returns HTTP 412 with error_id == 'ERR_STALE_SKU_VERSION'"
            - "ProductionLot.${lot_id}.version is unchanged by all four refusals and disposition is still 'IN_PROCESS'"

      - name: claim_approval_optimistic_concurrency_on_the_parent_programme
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.claim-approve-stale-program
          - validations[priority=451]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "The programme version is bumped by side effects on OTHER claims as well as by holds on this one, so a token captured before a hold/clear-hold round trip is two versions stale by the time the approval is attempted; 451 sits above every fiscal gate, so a stale token is reported even when the reserve, stock and fraud gates would all have passed."
        test_recipe:
          setup:
            - "One BRANDED LIFETIME SKU with 10 units on hand, one programme (reserve 5000000, threshold 60), one CONSUMER claimant and one SUBMITTED claim with one line (HANDLE 1099 x1)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/tool-skus/${sku_id}/stock-receipts"
              payload: { units_received: 10 }
              as: ChannelManager
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v0: $.data.version }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v0} - 1" }
              as: WarrantyAdministrator
              as_user_id: "wa-9"
              captures: { e_stale_low: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "SPOT_CHECK" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Spot check clean" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { e_stale_after_holds: $.data.error_id }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v1: $.data.version }
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { final_status: $.data.status }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v2: $.data.version, balance: $.data.reserve_balance_cents }
          assert:
            - "The below-current token returns HTTP 412 with error_id == 'ERR_STALE_PROGRAM_VERSION'"
            - "prog_v1 == prog_v0 + 2 — the hold and the clear-hold each incremented the programme version through open_hold_count"
            - "The token captured before the round trip now returns HTTP 412 with error_id == 'ERR_STALE_PROGRAM_VERSION', even though reserve, stock, fraud and line gates would all have passed"
            - "The refreshed token approves: HTTP 200 with status 'APPROVED'"
            - "prog_v2 == prog_v1 + 1 and balance == 4999319 (5000000 - 681)"
            - "WarrantyClaim.${claim_id} was never left in an intermediate state by the two 412s — its version only moved on the hold, the clear-hold and the successful approval"

      - name: brand_risk_derived_fields_reconcile_after_confirm_and_dismiss
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.brand_risk_rollup
          - entities.ToolSku.fields.brand_risk_score
          - entities.ToolSku.fields.confirmed_counterfeit_count
          - entities.ToolSku.fields.warranty_posture
        distinguishing_aspect: "All three denormalised fields are re-derived from the CONFIRMED set on every status change: risk_points are frozen per report at creation from the channel exposure then, an OPEN report contributes nothing until confirmed, a DISMISSED report never contributes, and the posture ladder is re-evaluated after each confirmation rather than only once."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU (CHANNEL_EXPOSURE 1.0), warranty_posture OPEN, brand_risk_score 0."
            - "Four counterfeit reports: three WEAK/10 units (5 points each) and one MODERATE/600 units (35 points)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id, posture0: $.data.warranty_posture, score0: $.data.brand_risk_score }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyBazaar", seller_handle: "s-1", evidence_grade: "WEAK", unit_estimate: 10 }
              as: BrandProtectionAnalyst
              captures: { r1: $.data.id, r1_points: $.data.risk_points, r1_status: $.data.status }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyBazaar", seller_handle: "s-2", evidence_grade: "WEAK", unit_estimate: 10 }
              as: BrandProtectionAnalyst
              captures: { r2: $.data.id }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyBazaar", seller_handle: "s-3", evidence_grade: "WEAK", unit_estimate: 10 }
              as: BrandProtectionAnalyst
              captures: { r3: $.data.id }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "OpenMarket", seller_handle: "s-4", evidence_grade: "MODERATE", unit_estimate: 600 }
              as: ChannelManager
              captures: { r4: $.data.id, r4_points: $.data.risk_points }
          trigger:
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: BrandProtectionAnalyst
              captures: { score_open: $.data.brand_risk_score, posture_open: $.data.warranty_posture, count_open: $.data.confirmed_counterfeit_count }
            - call: "POST /toolworks/counterfeit-reports/${r1}/confirm"
              payload: { confirmation_note: "Authenticated as counterfeit" }
              as: BrandProtectionAnalyst
              captures: { r1_confirmed: $.data.status }
            - call: "POST /toolworks/counterfeit-reports/${r2}/confirm"
              payload: { confirmation_note: "Same mould as s-1" }
              as: BrandProtectionAnalyst
            - call: "POST /toolworks/counterfeit-reports/${r3}/dismiss"
              payload: { dismissal_note: "Genuine unit, mislabelled listing" }
              as: BrandProtectionAnalyst
              captures: { r3_status: $.data.status }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: BrandProtectionAnalyst
              captures: { score_mid: $.data.brand_risk_score, posture_mid: $.data.warranty_posture, count_mid: $.data.confirmed_counterfeit_count }
            - call: "POST /toolworks/counterfeit-reports/${r4}/confirm"
              payload: { confirmation_note: "Bulk seizure at customs" }
              as: BrandProtectionAnalyst
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: BrandProtectionAnalyst
              captures: { score_hi: $.data.brand_risk_score, posture_hi: $.data.warranty_posture, count_hi: $.data.confirmed_counterfeit_count }
          assert:
            - "posture0 == 'OPEN' and score0 == 0 on a freshly created SKU"
            - "r1_points == 5 ((WEAK 5 + low unit_scale 0) * 1.0) and r4_points == 35 ((MODERATE 15 + high unit_scale 20) * 1.0); r1_status == 'OPEN' at creation"
            - "With four OPEN reports: score_open == 0, posture_open == 'OPEN', count_open == 0 — creation alone contributes nothing"
            - "After two confirmations and one dismissal: score_mid == 10, count_mid == 2, posture_mid == 'OPEN' (10 < 40), and r3_status == 'DISMISSED'"
            - "After confirming the MODERATE report: score_hi == 45, count_hi == 3, posture_hi == 'RESTRICTED' (45 >= POSTURE_RESTRICT_AT 40, still below 85)"
            - "GET /toolworks/counterfeit-reports?status=OPEN returns total_count 0 and ?status=CONFIRMED returns total_count 3"

      - name: counterfeit_confirmation_cascade_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / counterfeit_confirm_cascades_to_claim_fraud_hold
          rationale: "The four-link chain from report confirmation through SKU posture to claim hold and fraud rescore is asserted end-to-end there."

      - name: mandatory_failure_cascade_voids_runs_and_releases_campaigns
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / mandatory_test_failure_cascades_to_campaign_release
          rationale: "The ordering-sensitive fan-out to SCHEDULED campaigns and sibling test runs, including specimen return, is asserted there."

      - name: both_hardness_variants_stored_on_every_recompute
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_hardness_pooled_vs_sample_divergence
          rationale: "Both variants being persisted, and only POOLED gating certification, is asserted there."

      - name: fraud_score_variants_stored_on_every_recompute
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / claimant_fraud_intake_vs_adjudication_divergence
          rationale: "INTAKE gating auto-hold while ADJUDICATION gates approval, with the two scores diverging on the same claimant, is asserted there."

      - name: posture_ladder_threshold_triggers_at_its_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / brand_risk_score_exactly_forty_flips_posture_restricted
          rationale: "The cumulative threshold tested at exactly POSTURE_RESTRICT_AT and one point below is asserted there."

  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_mutating_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "No read-after-write delay anywhere: the approve response itself already carries the frozen reserve charge, and a GET on the SKU and the programme issued immediately afterwards returns values identical to what the mutation implied — no field lags by one request."
        test_recipe:
          setup:
            - "One BRANDED LIFETIME SKU with 10 units on hand, one programme (reserve 5000000, threshold 60), one CONSUMER claimant, one SUBMITTED claim with two lines (HANDLE 1099 x1 = 681, PIN 755 x3 = 1404)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/tool-skus/${sku_id}/stock-receipts"
              payload: { units_received: 10 }
              as: ChannelManager
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "PIN", component_list_price_cents: 755, quantity: 3 }
              as: WarrantyAdministrator
              captures: { charge_after_lines: $.data.line_reserve_cents }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { status_in_response: $.data.status, charge_in_response: $.data.reserve_charge_cents, units_in_response: $.data.replacement_unit_count }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { balance_read: $.data.reserve_balance_cents }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { on_hand_read: $.data.units_on_hand, reserved_read: $.data.units_reserved }
          assert:
            - "charge_after_lines == 1404 (round_half_up(755 * 3 * 0.62 * 1.0)) — the line response already carries its own reserve"
            - "status_in_response == 'APPROVED', charge_in_response == 2085 (681 + 1404, per-line rounding then sum) and units_in_response == 4"
            - "balance_read == 4997915 (5000000 - 2085), matching exactly what the approve response implied with no second write"
            - "on_hand_read == 6 and reserved_read == 4 — the inventory ledger is current in the immediately following read"
            - "WarrantyClaim.${claim_id}.line_count == 2 and GET /toolworks/warranty-claims/${claim_id}/lines returns total_count 2"
            - "Every response body follows the §1.0 envelope with data and meta present and no eventual-consistency retry needed anywhere"
