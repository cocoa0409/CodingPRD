  - method: GET
    path: "/impact-program/sales-orders"
    description: "List sales orders with filtering"
    roles: [CustomerService, ImpactAuditor, MarketingManager]
    code: 200
    input: ["status?", "fulfillment_status?", "channel?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  - method: GET
    path: "/impact-program/sales-orders/{order_id}"
    description: "Get one sales order"
    roles: [CustomerService, ImpactAuditor, MarketingManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: POST
    path: "/impact-program/sales-orders/{order_id}/lines"
    description: "Add a line to a sales order; the donation obligation accrues immediately"
    roles: [CustomerService]
    code: 201
    input: [donation_product_line_id, quantity, unit_price_cents, "line_discount_cents?", "gtin?"]
    output: SalesOrderLine
    side_effects:
      - "obligated_units materialized from the DonationProductLine rules"
      - "DonationLiability.provisional_liability_units recomputed"
      - "ImpactSeason.claim_frozen_units_total recomputed"
