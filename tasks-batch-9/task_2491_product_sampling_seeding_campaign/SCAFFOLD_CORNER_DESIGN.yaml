  # ===========================================================================
  # Section 3 of 9 — calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: holdout_staircase_flags_exactly_the_fifth_of_five_enrollments
        claim_type: correct_result
        grounds:
          - calculations.holdout_assignment
          - entities.Enrollment.fields.holdout_flag
          - entities.Campaign.fields.holdout_enrollment_count
        distinguishing_aspect: "The staircase is deterministic, not random: at holdout_pct 0.2 the predicate floor(n * 0.2) > floor((n - 1) * 0.2) is false for n in 1..4 and true only at n == 5, so the fifth screened enrollment is the single holdout and holdout_enrollment_count lands on exactly 1."
