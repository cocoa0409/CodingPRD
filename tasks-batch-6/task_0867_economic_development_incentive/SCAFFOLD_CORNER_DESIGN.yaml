# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Sections/claim_types drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_create_returns_201_with_partition
        claim_type: Creation
        grounds: [entities.IncentiveProgram, endpoints]
        distinguishing_aspect: "POST /incentive-programs -> 201; available_budget_cents initialized to total_budget_cents, committed_cents=0, disbursed_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 500000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
          trigger:
            - call: "GET /incentive-programs/${pg_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "IncentiveProgram.${pg_id}.total_budget_cents == 500000000"
            - "IncentiveProgram.${pg_id}.available_budget_cents == 500000000"
            - "IncentiveProgram.${pg_id}.committed_cents == 0"
            - "IncentiveProgram.${pg_id}.but_for_pass_threshold == 60"

      - name: program_get_unknown_id_returns_404
        claim_type: Not Found
        grounds: [entities.IncentiveProgram, "errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET /incentive-programs/{id} with a non-existent UUID -> ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /incentive-programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROGRAM_NOT_FOUND"
            - "http status == 404"

      - name: application_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Application, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /applications omitting required proposed_jobs -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A GRANT program exists"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 500000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_investment_cents: 150000000 }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: application_default_flags_applied
        claim_type: Defaults
        grounds: [entities.Application.but_for_attested, entities.Application.distress_zone]
        distinguishing_aspect: "Omitting but_for_attested and distress_zone -> both default to false."
        test_recipe:
          setup: ["A GRANT program exists"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 500000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000 }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.but_for_attested == false"
            - "Application.${app_id}.distress_zone == false"
            - "Application.${app_id}.status == DRAFT"

      - name: eligibility_review_is_immutable_record
        claim_type: Immutability
        grounds: [entities.EligibilityReview, entities.EligibilityReview.finding]
        distinguishing_aspect: "EligibilityReview (common_fields:false) carries no version field and has no update/delete endpoint; finding is fixed at creation."
        test_recipe:
          setup: ["An application submitted then start-review creates the EligibilityReview"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 500000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: { notes: "ok" }
              as: ProgramAnalyst
              as_user_id: "analyst-1"
              captures: { review_id: $.data.id }
          trigger:
            - call: "GET /eligibility-reviews/${review_id}"
              payload: {}
              as: ProgramAnalyst
          assert:
            - "EligibilityReview.${review_id}.finding == PASS"
            - "no PUT/PATCH/DELETE endpoint exists for eligibility-reviews (immutable)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: activate_already_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Agreement.EXECUTED_to_ACTIVE, "errors[ERR_AGREEMENT_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE agreement -> ERR_AGREEMENT_INVALID_STATE (409); idempotent second activate rejected."
        test_recipe:
          setup: ["Approved application -> executed -> active agreement"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AGREEMENT_INVALID_STATE"
            - "http status == 409"

      - name: approve_draft_application_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.UNDER_REVIEW_to_APPROVED, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application still in DRAFT (never submitted/reviewed) -> ERR_APPLICATION_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT application"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_INVALID_STATE"
            - "http status == 409"

      - name: accept_already_accepted_report_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ComplianceReport.SUBMITTED_to_ACCEPTED, "errors[ERR_COMPLIANCE_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal for ComplianceReport; a second accept -> ERR_COMPLIANCE_REPORT_INVALID_STATE (409)."
        test_recipe:
          setup: ["Active agreement; one ACCEPTED report"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 80, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
          trigger:
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMPLIANCE_REPORT_INVALID_STATE"
            - "http status == 409"

      - name: pay_calculated_disbursement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Disbursement.APPROVED_to_PAID, "errors[ERR_DISBURSEMENT_INVALID_STATE]"]
        distinguishing_aspect: "Paying a disbursement still in CALCULATED (not APPROVED) -> ERR_DISBURSEMENT_INVALID_STATE (409)."
        test_recipe:
          setup: ["Active agreement; ACCEPTED report; one CALCULATED disbursement (not approved)"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 100, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
            - call: "GET /agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
            - call: "POST /disbursements"
              payload: { agreement_id: "${agr_id}", compliance_report_id: "${rep_id}", expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${disb_id}/pay"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISBURSEMENT_INVALID_STATE"
            - "http status == 409"

      - name: waive_met_covenant_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Covenant.ACTIVE_to_WAIVED, "errors[ERR_COVENANT_INVALID_STATE]"]
        distinguishing_aspect: "Waiving a covenant already in terminal MET -> ERR_COVENANT_INVALID_STATE (409) (only {ACTIVE,BREACHED} are waivable)."
        test_recipe:
          setup: ["Active agreement; JOBS covenant driven to MET by an accepted report actual_jobs=100 (agreement stays ACTIVE via a second unmet covenant)"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_jobs_id: $.data.id }
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "INVESTMENT", target_value: 300000000, measurement_start_date: "2028-01-01T00:00:00.000Z", measurement_end_date: "2028-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_inv_id: $.data.id }
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 100, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
          trigger:
            - call: "POST /covenants/${cov_jobs_id}/waive"
              payload: { reason: "n/a" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COVENANT_INVALID_STATE"
            - "http status == 409"

      - name: recapture_dispute_reopen_cycle
        claim_type: Valid Transition
        grounds: [state_machines.RecaptureAssessment.ASSESSED_to_DISPUTED, state_machines.RecaptureAssessment.DISPUTED_to_ASSESSED]
        distinguishing_aspect: "Cyclic loop on RecaptureAssessment: ASSESSED -> DISPUTED -> (finalize reopen=true) -> ASSESSED returns to a prior state."
        test_recipe:
          setup: ["Defaulted agreement with an ASSESSED recapture assessment"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_id: $.data.id }
            - call: "POST /agreements/${agr_id}/declare-default"
              payload: { severity: "PARTIAL", reason: "no reporting" }
              as: ProgramDirector
            - call: "GET /recapture-assessments?agreement_id=${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ra_id: "$.data[0].id" }
            - call: "POST /recapture-assessments/${ra_id}/dispute"
              payload: { grounds: "force majeure" }
              as: Applicant
              as_user_id: "applicant-1"
          trigger:
            - call: "POST /recapture-assessments/${ra_id}/finalize"
              payload: { reopen: true }
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "RecaptureAssessment.${ra_id}.status == ASSESSED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: grant_award_cap_computed
        claim_type: Computed Fields
        grounds: [calculations.incentive_award_cap, entities.Agreement.max_incentive_cents]
        distinguishing_aspect: "GRANT branch: max_incentive_cents = awarded_jobs(100) * grant_per_job_cents(500000) = 50,000,000."
        test_recipe:
          setup: ["Approved GRANT application; execute agreement awarded_jobs=100"]
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "P", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
