              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct_fi}", identifier: "TR01-B01", application: "BACKBONE", horizontal_length_m: 30.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
