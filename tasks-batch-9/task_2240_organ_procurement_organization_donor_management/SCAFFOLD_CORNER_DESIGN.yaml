      - name: cross_clamp_action_endpoint_drives_its_transition
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /opo/recovery-operations/{id}/cross-clamp"]
          - endpoints["POST /opo/recovery-operations/{id}/cancel"]
          - state_machines.RecoveryOperation.transitions
        excluded_because:
          difficulty_instance: compensating_invariant / recovery_team_or_minutes_ledger_returns_to_zero_on_cancel
          rationale: |
            The §1.8 instance already books, cancels and re-books an operation through the same action
            endpoints, asserting the SCHEDULED/CANCELLED transitions, their preconditions and the exact
            RecoveryTeam ledger deltas; the cross-clamp limb is covered by
            cross_clamp_recovers_the_accepted_organ_and_completes_the_operation in the state_machines
            section above.

  - section: rbac
    instances:
      - name: other_roles_cannot_reach_an_exclusive_operation
        claim_type: denied_operation
        grounds:
          - validations[priority 10]
          - validations[priority 20]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - roles.DonorCoordinator.exclusive_operations
          - roles.MedicalDirector.exclusive_operations
        distinguishing_aspect: |
          The authentication and role gates sit above the existence and shape gates: a SerologyLab
          calling the DonorCoordinator's case-creation endpoint with three non-existent ids still gets
          ERR_FORBIDDEN_ROLE (never ERR_REFERRAL_NOT_FOUND), and a request with no role header gets
          ERR_UNAUTHENTICATED even though the payload is otherwise valid.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-09-09T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: OpoAdmin
          trigger:
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "00000000-0000-0000-0000-000000000001", authorization_id: "00000000-0000-0000-0000-000000000002", donor_code: "D-BAD" }
              as: SerologyLab
              as_user_id: "lab-1"
              captures: { error_role: $.data.error_id }
            - call: "POST /opo/organs/00000000-0000-0000-0000-000000000003/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: DonorCoordinator
              as_user_id: "coord-1"
              captures: { error_role_2: $.data.error_id }
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "ABD-9", specialty: "ABDOMINAL" }
              as: Anonymous
              captures: { error_auth: $.data.error_id }
          assert:
            - "${error_role} == ERR_FORBIDDEN_ROLE with HTTP 403, not ERR_REFERRAL_NOT_FOUND: priority 20 runs before the 32 body-FK family"
            - "${error_role_2} == ERR_FORBIDDEN_ROLE with HTTP 403, not ERR_ORGAN_NOT_FOUND: priority 20 runs before the 30 path family"
            - "${error_auth} == ERR_UNAUTHENTICATED with HTTP 401 (no X-User-Role / X-User-ID headers)"
            - "no DonorCase, Organ or RecoveryTeam row exists after the three refusals"

      - name: admin_role_holds_no_clinical_override
        claim_type: exclusive_operations
        grounds:
          - roles.OpoAdmin.exclusive_operations
          - roles.ReferralCoordinator.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: |
          The role model is segregation_of_duties, not hierarchical_override: OpoAdmin owns the registry
          endpoints outright yet is refused the DonorCoordinator's organ registration, and a
          ReferralCoordinator is refused the admin's hospital registration - neither role subsumes the
          other.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T08:00:00Z."
            - "An AUTHORIZED donor case with no organs yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7701", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: [], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-7701" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-7701" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: OpoAdmin
              as_user_id: "admin-1"
              captures: { error_admin: $.data.error_id }
            - call: "POST /opo/hospital-partners"
              payload: { name: "Second General", hospital_code: "SECOND" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { error_coord: $.data.error_id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: DonorCoordinator
              as_user_id: "coord-2"
