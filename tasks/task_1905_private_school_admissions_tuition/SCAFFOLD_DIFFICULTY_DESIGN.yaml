            - { call: "POST /admissions/aid-applications/${aid}/accept-award", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applications/${app}/issue-contract", payload: {}, as: AdmissionOfficer, captures: { con: $.data.id } }
          assert:
            - "First issue-contract fails: captured error_id == ERR_AID_NOT_FINALIZED (HTTP 409) — award OFFERED is not ACCEPTED"
            - "After accept-award (award_status ACCEPTED, committed 1,820,000), the second issue-contract returns 201"
            - "EnrollmentContract.${con}.award_cents == 1820000 and deposit_amount_cents == 118000"

      - name: evaluation_blocked_until_application_submitted
        grounds:
          - errors[ERR_APPLICATION_NOT_SUBMITTED]
          - validations[priority=7]
          - entities.EntranceEvaluation.fields.application_id
        distinguishing_aspect: |
          Entity pair EntranceEvaluation x Application (distinct from the sibling
          instance's Application x AidApplication pair): evaluation creation is gated on
          the referenced application's state — DRAFT rejects with
          ERR_APPLICATION_NOT_SUBMITTED, SUBMITTED admits.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section, test session; fam-a application created but still DRAFT"
          setup_api_calls:
