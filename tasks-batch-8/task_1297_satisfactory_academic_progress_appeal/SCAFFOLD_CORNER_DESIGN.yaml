            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
          trigger:
            - { call: "POST /sap/notifications/dispatch", as: AidOfficer, captures: { sent0: $.data.sent_count, canc0: $.data.cancelled_count } }
            - { call: "POST /sap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: AidAdministrator }
            - { call: "POST /sap/notifications/dispatch", as: AidOfficer, captures: { sent1: $.data.sent_count } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: AidAdministrator }
            - { call: "POST /sap/notifications/dispatch", as: AidOfficer, captures: { sent2: $.data.sent_count, canc2: $.data.cancelled_count } }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=APPEAL_DEADLINE_REMINDER&status=CANCELLED", as: AidOfficer }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=APPEAL_DEADLINE_REMINDER&status=SENT", as: AidOfficer, captures: { r1_sent_at: "$.data[0].sent_at" } }
          assert:
            - "first dispatch at 2026-08-01: sent_count == 2 (T1 and T2 STANDING_CHANGE notices; reminders not yet due), cancelled_count == 0"
            - "second dispatch at 2026-08-08: sent_count == 1 (first reminder)"
            - "third dispatch at 2026-08-14 after appeal submission: sent_count == 0, cancelled_count == 1 (second reminder obviated by the SUBMITTED appeal)"
            - "reminder rows: exactly one CANCELLED APPEAL_DEADLINE_REMINDER and one SENT (sent_at == 2026-08-08T00:00:00Z)"

      - name: preview_with_no_enrollments_returns_null_metrics
