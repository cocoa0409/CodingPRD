              payload: { unit_id: "${u1}", label: "S1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "M333", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /encounters"
              payload: { mrn: "M334", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e2: $.data.id }
            - call: "POST /encounters/${e2}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e2}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r2: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r2}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "GET /units/${u1}/beds/${b1}"
              payload: {}
              as: BedControlCoordinator
              captures: { b1_now_v: $.data.version }
            - call: "POST /bed-requests/${r2}/confirm"
              payload: { expected_bed_version: "${b1_now_v}" }
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_BED_NOT_AVAILABLE"
            - "BedRequest.${r1}.status == CONFIRMED"
            - "BedRequest.${r2}.status == ASSIGNED"
            - "Bed.${b1}.status == OCCUPIED"

      - name: evstask_single_slot_per_bed
        grounds:
          - validations[priority=18]
          - errors[ERR_EVS_TASK_EXISTS]
          - entities.EvsTask.fields.status
          - state_machines.Bed.OCCUPIED_to_DIRTY
        distinguishing_aspect: |
          Exclusive task-slot semantics on a Bed (DIFFERENT interval geometry than occupancy): a bed
          tolerates at most one non-terminal EvsTask (REQUESTED/ASSIGNED/IN_PROGRESS). After a discharge
          auto-creates one ROUTINE task, a second manual POST /evs-tasks for the same bed collides with the
          live task and is rejected ERR_EVS_TASK_EXISTS. The 'interval' here is the task lifespan, not a
          patient stay, and the resource slot is the cleaning queue, not the physical bed occupancy.
        test_recipe:
          setup:
