        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: prize_pool_conserved_across_recompute
          rationale: "OCC mechanics are exercised in the optimistic_concurrency layer instances below; the error id is shared by both OCC rules and triggered there."

