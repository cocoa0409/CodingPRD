          assert:
            - "First create: HTTP 201, response_type \"entitlement_rule\", data.id non-empty, data.created_at == \"2026-09-01T00:00:00Z\", every submitted numeric echoed unchanged, data.status == \"PUBLISHED\"."
            - "Second create: HTTP 201 with min_gap_minutes 0 and travel_buffer_minutes 0 accepted (the constraint is >= 0, not > 0)."
            - "Read by id: HTTP 200, data.id == ${rule_home_id}, byte-identical field values to the create response."
            - "First list: HTTP 200, data length 2, meta pagination limit 10, offset 0, total_count 2, has_more false."
            - "Filtered list: total_count 1 whose id == ${rule_virtual_id}."
            - "Paginated list: data length 1, total_count 2, has_more false at offset 1 with limit 1 (1 + 1 == 2)."
            - "Retire: HTTP 200, data.status == \"RETIRED\", all nine catalogue numerics unchanged."
            - "Final list: total_count 1 whose id == ${rule_virtual_id} — the retired row is filtered out but still readable by id."

      - name: log_verify_and_report_are_verbs_that_return_the_updated_resource
        claim_type: action_endpoint
