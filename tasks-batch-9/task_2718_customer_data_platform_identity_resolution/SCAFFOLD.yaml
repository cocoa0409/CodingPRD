scenario: "Generate task harder than expert level!  2718. Customer Data Platform & Identity Resolution (retail customer data team): source system ingestion across transactions, loyalty, web, app and support with data quality validation, deterministic and probabilistic identity matching rules with confidence thresholds and household grouping, consent and preference capture with channel-level opt-out enforcement across all activations, suppression list management for privacy requests, do-not-sell elections and legal holds, segment building with governance over sensitive attribute usage, audience activation to advertising and messaging platforms with hashing and match rate monitoring, data retention, deletion propagation and vendor downstream deletion verification, measurement of segment performance and audience overlap"

domain_name: customer-data-platform-identity-resolution
api_prefix: /cdp

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Profiles form a match graph: IdentityLink is a many-to-many junction between two
  # Profiles, Profile.merged_into_profile_id is self-referential, and Household /
  # Segment / Destination cut across the graph without owning it. No URL nesting.

  state_machine_shape: cyclic
  # IngestBatch RECEIVED->QUARANTINED->RECEIVED (requeue loop), Segment
  # PENDING_GOVERNANCE_REVIEW->DRAFT (rejection revert loop), Activation
  # ACTIVE->PAUSED->ACTIVE (resume loop), SourceSystem ACTIVE->QUARANTINED->ACTIVE,
  # VendorDeletionTask DISPATCHED->TIMED_OUT->DISPATCHED. Profile additionally carries
  # two parallel state dimensions (resolution_status x privacy_status) and
  # DeletionRequest is compound over its VendorDeletionTask children.

  relationship_patterns:
    - one_to_many          # SourceSystem -> IngestBatch, DeletionRequest -> VendorDeletionTask
    - many_to_many         # IdentityLink joins two Profiles; Activation joins Segment x Destination
    - self_referential     # Profile.merged_into_profile_id -> Profile.id
    - cross_aggregate      # SuppressionEntry (privacy aggregate) gates Activation (marketing aggregate)

  role_model: segregation_of_duties
  # The user who submits a Segment for governance review MUST NOT be the user who records
  # the governance decision; the PrivacyOfficer who created a LEGAL_HOLD SuppressionEntry
  # MUST NOT be the user who releases it. Enforced on X-User-ID.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities, 57 endpoints, 51 error codes, 51 ordered validations, 12 calculations
  # (4 carrying divergent variants), 12 state machines, 7 roles, 3 OCC rules.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SourceSystem
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable operator-assigned source code, unique across all SourceSystems.
        constraints: "matches ^[A-Z0-9_]{3,20}$; unique"
      - name: display_name
        type: string
        source: input
        description: Human-readable source name.
        constraints: "1..120 chars after trim"
      - name: channel_type
        type: enum
        source: input
        description: Which retail feed this source carries.
        constraints: "one of {TRANSACTIONS, LOYALTY, WEB, APP, SUPPORT}"
      - name: trust_tier
        type: integer
        source: input
        description: Provenance trust ranking; feeds identity match confidence and consent precedence.
        default: 3
        constraints: "integer 1..5 inclusive"
      - name: dq_scoring_mode
        type: enum
        source: input
        description: >-
          Selects which of the three calculations.batch_data_quality_score formula modes scores
          batches from this source.
        default: WEIGHTED_COMPONENTS
        constraints: "one of {UNWEIGHTED_MEAN, WEIGHTED_COMPONENTS, PENALIZED_WEIGHTED}"
      - name: pii_completeness_floor
        type: number
        source: input
        description: Minimum IngestBatch.dq_score required for a batch from this source to reach VALIDATED.
        default: 0.70
        constraints: "0.00..1.00, at most 2 decimals"
      - name: status
        type: enum
        source: system
        description: Source lifecycle state per §1.2 SourceSystem machine.
        default: REGISTERED
        constraints: "one of {REGISTERED, ACTIVE, QUARANTINED}"
      - name: dq_window_start_at
        type: datetime
        source: system
        description: Start of the rolling data-quality window; set to the logical clock at creation and reset on reinstate.
      - name: submitted_record_total
        type: integer
        source: computed
        description: Sum of IngestBatch.record_count over in-window batches (see calculations.source_system_dq_pass_rate).
        default: 0
      - name: valid_record_total
        type: integer
        source: computed
        description: Sum of IngestBatch.valid_record_count over in-window batches.
        default: 0
      - name: dq_pass_rate
        type: number
        source: computed
        description: Rolling validity ratio per calculations.source_system_dq_pass_rate; 1.0 when no in-window batch exists.
        default: 1.0
      - name: quarantine_count
        type: integer
        source: system
        description: Number of times this source has entered QUARANTINED.
        default: 0
      - name: last_reinstated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent reinstate, or null.

  - name: IngestBatch
    parent: null
    common_fields: true
    fields:
      - name: source_system_id
        type: string
        source: input
        description: "FK -> SourceSystem.id; the feed that submitted this batch."
      - name: batch_label
        type: string
        source: input
        description: Operator label for the batch.
        constraints: "1..80 chars after trim"
      - name: records
        type: array
        source: input
        description: >-
          Raw record payloads for this batch. Each element is an object with keys
          external_id (string, required, unique within the batch), email_raw (string|null),
          phone_raw (string|null), loyalty_number (string|null), first_name (string|null),
          last_name (string|null), postal_code (string|null), address_line (string|null),
          event_timestamp (ISO8601 string, required), consent_signals (array of
          {channel, purpose, consent_state} objects, may be empty).
        constraints: "1..200 elements; empty array rejected with ERR_INVALID_REQUEST"
      - name: record_count
        type: integer
        source: computed
        description: len(records) at creation.
      - name: valid_record_count
        type: integer
        source: computed
        description: Count of records whose per-record score >= DQ_RECORD_MIN, set by validate.
        default: 0
      - name: invalid_record_count
        type: integer
        source: computed
        description: record_count - valid_record_count, set by validate.
        default: 0
      - name: dq_score
        type: number
        source: computed
        description: Batch data-quality score per calculations.batch_data_quality_score; null before validate.
      - name: dq_failure_breakdown
        type: object
        source: computed
        description: >-
          Map from identifier component name (email_norm, phone_norm, loyalty_number,
          postal_code, name_pair) to the count of records where that component was present
          but failed its format check. Empty object before validate.
      - name: status
        type: enum
        source: system
        description: Batch lifecycle state per §1.2 IngestBatch machine.
        default: RECEIVED
        constraints: "one of {RECEIVED, VALIDATED, QUARANTINED, PROMOTED, REJECTED}"
      - name: retry_round
        type: integer
        source: system
        description: Number of completed requeue cycles; incremented by requeue.
        default: 0
      - name: rejection_reason
        type: enum
        source: system
        description: Why the batch terminated in REJECTED, or null.
        constraints: "one of {RETRY_LIMIT_REACHED, SOURCE_QUARANTINED} or null"
      - name: validated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent validate, or null.
      - name: promoted_at
        type: datetime
        source: system
        description: Logical-clock instant of promote, or null.
      - name: new_profile_count
        type: integer
        source: computed
        description: Profiles created by this batch's promote.
        default: 0
      - name: matched_deterministic_count
        type: integer
        source: computed
        description: Records that promote attached to an existing Profile via the deterministic key.
        default: 0
      - name: matched_probabilistic_count
        type: integer
        source: computed
        description: Records for which promote created a PROPOSED or auto-CONFIRMED IdentityLink.
        default: 0

  - name: Profile
    parent: null
    common_fields: true
    fields:
      - name: origin_batch_id
        type: string
        source: system
        description: "FK -> IngestBatch.id; the batch whose promote minted this profile."
      - name: primary_source_system_id
        type: string
        source: system
        description: >-
          FK -> SourceSystem.id; the contributing source with the highest trust_tier
          (tie-break: SourceSystem.created_at ASC).
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; null when address_hash is null or the profile is unassigned."
      - name: merged_into_profile_id
        type: string
        source: system
        description: "FK -> Profile.id; the survivor this profile was merged into; null unless resolution_status == MERGED_AWAY."
      - name: email_norm
        type: string
        source: system
        description: Lower-cased trimmed email from the surviving record; null when absent or tombstoned.
      - name: phone_norm
        type: string
        source: system
        description: Digits-only 11-character E.164 US phone without the plus sign; null when absent or tombstoned.
      - name: first_name
        type: string
        source: system
        description: Trimmed given name; null when absent or tombstoned.
      - name: last_name
        type: string
        source: system
        description: Trimmed family name; null when absent or tombstoned.
      - name: postal_code
        type: string
        source: system
        description: Five-digit postal code; null when absent.
      - name: address_hash
        type: string
        source: system
        description: Lower-cased whitespace-collapsed address_line used as the household grouping key; null when absent.
      - name: loyalty_number
        type: string
        source: system
        description: Loyalty membership identifier matching ^LY[0-9]{8}$; null when absent.
      - name: loyalty_tier
        type: enum
        source: system
        description: Loyalty standing derived at promote from the LOYALTY source record's tier signal.
        default: NONE
        constraints: "one of {NONE, SILVER, GOLD, PLATINUM}"
      - name: lifetime_value_cents
        type: integer
        source: computed
        description: Sum of revenue_cents over every attributed conversion recorded against this profile.
        default: 0
      - name: channel_engagement_score
        type: number
        source: computed
        description: len(activatable_channels) / 5 rounded to 2 decimals, round_half_up.
        default: 0.00
      - name: inferred_health_interest
        type: string
        source: system
        description: SENSITIVE attribute inferred from web/app signals; null when absent.
      - name: inferred_ethnicity_affinity
        type: string
        source: system
        description: SENSITIVE attribute inferred from web/app signals; null when absent.
      - name: precise_geolocation_grid
        type: string
        source: system
        description: SENSITIVE attribute (100m grid cell) inferred from app signals; null when absent.
      - name: resolution_status
        type: enum
        source: system
        description: Identity-resolution dimension of the Profile parallel state machine.
        default: UNRESOLVED
        constraints: "one of {UNRESOLVED, RESOLVED, MERGED_AWAY}"
      - name: privacy_status
        type: enum
        source: system
        description: Privacy dimension of the Profile parallel state machine; evolves independently of resolution_status.
        default: NORMAL
        constraints: "one of {NORMAL, SUPPRESSED, DELETION_PENDING, DELETED, LEGAL_HOLD}"
      - name: activatable_channels
        type: array
        source: computed
        description: >-
          Channels resolving to OPT_IN per calculations.effective_channel_consent, sorted
          alphabetically ASC. Empty array when privacy_status != NORMAL.
        default: []
      - name: source_record_count
        type: integer
        source: computed
        description: Raw records contributing to this profile, including records absorbed from merged-away profiles.
        default: 1
      - name: contributing_source_system_codes
        type: array
        source: computed
        description: Distinct SourceSystem.code values that contributed records, sorted alphabetically ASC.
        default: []
      - name: consent_record_count
        type: integer
        source: computed
        description: ConsentRecords whose profile_id equals this profile's id and whose status == ACTIVE.
        default: 0
      - name: last_activity_at
        type: datetime
        source: system
        description: Latest event_timestamp among contributing records; the retention clock anchor.

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: address_hash
        type: string
        source: system
        description: Grouping key shared by all members; minted by promote when the first profile at that address appears.
      - name: sequence_no
        type: integer
        source: system
        description: Overflow index for the address_hash; the first household at an address is 1, the next 2.
        default: 1
      - name: member_count
        type: integer
        source: computed
        description: Count of Profiles whose household_id equals this household's id and whose resolution_status != MERGED_AWAY.
        default: 0
      - name: status
        type: enum
        source: system
        description: DISSOLVED once member_count reaches 0 via merge or deletion cascade.
        default: ACTIVE
        constraints: "one of {ACTIVE, DISSOLVED}"
      - name: dominant_last_name
        type: string
        source: computed
        description: >-
          Most frequent non-null Profile.last_name among members; tie-break alphabetical ASC.
          Null when every member has a null last_name.
      - name: combined_lifetime_value_cents
        type: integer
        source: computed
        description: Sum of member Profile.lifetime_value_cents.
        default: 0

  - name: MatchRule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable rule code, unique across all MatchRules.
        constraints: "matches ^[A-Z0-9_]{3,24}$; unique"
      - name: rule_kind
        type: enum
        source: input
        description: Whether the rule matches on an exact key or on a weighted similarity score.
        constraints: "one of {DETERMINISTIC, PROBABILISTIC}"
      - name: deterministic_key
        type: enum
        source: input
        description: Which identifier the rule matches exactly; required when rule_kind == DETERMINISTIC, must be null otherwise.
        constraints: "one of {EMAIL_NORM, PHONE_NORM, LOYALTY_NUMBER} or null"
      - name: missing_identifier_policy
        type: enum
        source: input
        description: >-
          Selects the calculations.identity_match_confidence variant. STRICT_ZERO scores a
          missing component as 0 over the full weight base; RENORMALIZE divides by the weight
          of present components only.
        default: STRICT_ZERO
        constraints: "one of {STRICT_ZERO, RENORMALIZE}"
      - name: auto_merge_threshold
        type: number
        source: input
        description: Confidence at or above which a newly created IdentityLink is auto-CONFIRMED without steward review.
        default: 0.92
        constraints: "0.0000..1.0000, at most 4 decimals; must be > review_floor"
      - name: review_floor
        type: number
        source: input
        description: Minimum confidence required for an IdentityLink to be created at all.
        default: 0.65
        constraints: "0.0000..1.0000, at most 4 decimals"
      - name: min_precision
        type: number
        source: input
        description: Precision floor; the rule is auto-DISABLED once precision_estimate falls below this value.
        default: 0.60
        constraints: "0.0000..1.0000, at most 4 decimals"
      - name: status
        type: enum
        source: system
        description: DISABLED once precision_estimate < min_precision; disabled rules cannot mint links.
        default: ENABLED
        constraints: "one of {ENABLED, DISABLED}"
      - name: confirmed_count
        type: integer
        source: computed
        description: IdentityLinks minted by this rule that reached CONFIRMED.
        default: 0
      - name: rejected_count
        type: integer
        source: computed
        description: IdentityLinks minted by this rule that reached REJECTED.
        default: 0
      - name: precision_estimate
        type: number
        source: computed
        description: >-
          confirmed_count / (confirmed_count + rejected_count) rounded to 4 decimals,
          round_half_up; exactly 1.0 while the denominator is 0.
        default: 1.0

  - name: IdentityLink
    parent: null
    common_fields: true
    fields:
      - name: left_profile_id
        type: string
        source: input
        description: "FK -> Profile.id; one endpoint of the candidate match pair."
      - name: right_profile_id
        type: string
        source: input
        description: "FK -> Profile.id; the other endpoint of the candidate match pair."
      - name: match_rule_id
        type: string
        source: input
        description: "FK -> MatchRule.id; the rule that produced this candidate."
      - name: survivor_profile_id
        type: string
        source: system
        description: "FK -> Profile.id; the profile retained by the merge; null until status == CONFIRMED."
      - name: evidence
        type: object
        source: input
        description: >-
          Component similarities for the pair, with keys email_similarity, phone_similarity,
          name_similarity, address_similarity. Each value is exactly one of 0.0 (mismatch),
          0.5 (partial) or null (component absent on at least one side); 1.0 means exact.
        constraints: "all four keys required; each value in {0.0, 0.5, 1.0, null}"
      - name: match_method
        type: enum
        source: computed
        description: Copied from MatchRule.rule_kind at creation.
        constraints: "one of {DETERMINISTIC, PROBABILISTIC}"
      - name: confidence
        type: number
        source: computed
        description: Match confidence per calculations.identity_match_confidence.
      - name: status
        type: enum
        source: system
        description: Link lifecycle state per §1.2 IdentityLink machine.
        default: PROPOSED
        constraints: "one of {PROPOSED, CONFIRMED, REJECTED, VOIDED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the IdentitySteward who recorded the decision; null while PROPOSED; the literal "system" for auto-CONFIRMED links.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision, or null.
      - name: void_reason
        type: enum
        source: system
        description: Why the link was voided, or null.
        constraints: "one of {RULE_DISABLED, PROFILE_DELETED, SUPERSEDED} or null"

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; the data subject the election belongs to."
      - name: source_system_id
        type: string
        source: input
        description: "FK -> SourceSystem.id; the capture point; its trust_tier breaks captured_at ties."
      - name: channel
        type: enum
        source: input
        description: Channel the election governs.
        constraints: "one of {EMAIL, SMS, PUSH, DIRECT_MAIL, ADVERTISING}"
      - name: purpose
        type: enum
        source: input
        description: >-
          Processing purpose. Only records with purpose == MARKETING participate in
          calculations.effective_channel_consent; other purposes are stored and ranked within
          their own group but never gate activation.
        constraints: "one of {MARKETING, PERSONALIZATION, MEASUREMENT}"
      - name: consent_state
        type: enum
        source: input
        description: The captured election.
        constraints: "one of {OPT_IN, OPT_OUT}"
      - name: captured_at
        type: datetime
        source: input
        description: When the subject made the election; must be <= the logical clock.
      - name: expires_at
        type: datetime
        source: input
        description: When the election lapses; null means it never lapses. Must be > captured_at when present.
      - name: status
        type: enum
        source: system
        description: ACTIVE until superseded by a higher-precedence sibling, expired by a retention run, or tombstoned by deletion verification.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, EXPIRED, TOMBSTONED}"
      - name: precedence_rank
        type: integer
        source: computed
        description: >-
          1-based rank within the (profile_id, channel, purpose) group over records with
          status == ACTIVE, ordered captured_at DESC, then SourceSystem.trust_tier DESC, then
          ConsentRecord.created_at ASC. Rank 1 is the winner.
        default: 1

  - name: SuppressionEntry
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; the suppressed data subject."
      - name: deletion_request_id
        type: string
        source: system
        description: "FK -> DeletionRequest.id; set only on the PRIVACY_DELETE entry auto-created by a deletion request."
      - name: entry_type
        type: enum
        source: input
        description: >-
          PRIVACY_DELETE and GLOBAL_OPT_OUT and LEGAL_HOLD suppress every channel;
          DO_NOT_SELL suppresses only the ADVERTISING channel.
        constraints: "one of {PRIVACY_DELETE, DO_NOT_SELL, LEGAL_HOLD, GLOBAL_OPT_OUT}"
      - name: reason_code
        type: string
        source: input
        description: Operator reason code recorded on the suppression.
        constraints: "1..40 chars after trim"
      - name: effective_at
        type: datetime
        source: input
        description: Inclusive start of the suppression window.
      - name: expires_at
        type: datetime
        source: input
        description: Exclusive end of the suppression window; null means open-ended. Must be > effective_at when present.
      - name: status
        type: enum
        source: system
        description: ACTIVE until explicitly released or expired by a retention run.
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED, EXPIRED}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PrivacyOfficer who created the entry, or the literal "system" for retention-run and deletion-request entries.
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the releasing PrivacyOfficer, or null.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of the release, or null.

  - name: Segment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Segment display name.
        constraints: "1..120 chars after trim"
      - name: criteria
        type: array
        source: input
        description: >-
          Membership predicates. Each element is an object {attribute, operator, value} where
          attribute is one of {postal_code, loyalty_tier, lifetime_value_cents,
          channel_engagement_score, inferred_health_interest, inferred_ethnicity_affinity,
          precise_geolocation_grid} and operator is one of {EQ, GTE, IN}. A profile is a
          member only when EVERY predicate holds (logical AND).
        constraints: "1..6 elements; IN requires value to be a non-empty array"
      - name: uses_sensitive_attributes
        type: boolean
        source: computed
        description: >-
          True when any criterion attribute is in SENSITIVE_ATTRIBUTES =
          {inferred_health_interest, inferred_ethnicity_affinity, precise_geolocation_grid}.
        default: false
      - name: governance_justification
        type: string
        source: input
        description: Written justification for sensitive-attribute usage; required at submit when uses_sensitive_attributes is true.
        constraints: "null or 10..500 chars after trim"
      - name: governance_valid_days
        type: integer
        source: input
        description: Days an APPROVE decision remains valid; governance_expires_at = approved_at + this many days.
        default: 90
        constraints: "integer 1..365 inclusive"
      - name: status
        type: enum
        source: system
        description: Governance lifecycle state per §1.2 Segment machine.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_GOVERNANCE_REVIEW, APPROVED, GOVERNANCE_EXPIRED, RETIRED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the SegmentAnalyst who last submitted for review; null before the first submit.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the DataGovernanceOfficer who recorded the last decision, or null.
      - name: sensitive_use_approved
        type: boolean
        source: system
        description: Set from the governance decision payload; reset to false on every REJECT and on GOVERNANCE_EXPIRED.
        default: false
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of the APPROVE decision; anchors segment_entry_at in performance attribution. Null unless approved at least once.
      - name: governance_expires_at
        type: datetime
        source: system
        description: approved_at plus governance_valid_days; a retention run past this instant expires the approval.
      - name: rejection_count
        type: integer
        source: system
        description: Number of REJECT decisions recorded against this segment.
        default: 0
      - name: member_count
        type: integer
        source: computed
        description: Count of Profiles satisfying every criterion per calculations.segment_membership_set.
        default: 0
      - name: active_activation_count
        type: integer
        source: computed
        description: Count of Activations on this segment whose status is in {DISPATCHED, ACTIVE, UNDERPERFORMING}.
        default: 0

  - name: Destination
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable destination code, unique across all Destinations.
        constraints: "matches ^[A-Z0-9_]{3,24}$; unique"
      - name: platform_kind
        type: enum
        source: input
        description: Whether the platform is an ad network or a messaging provider.
        constraints: "one of {ADVERTISING, MESSAGING}"
      - name: channel
        type: enum
        source: input
        description: The single channel this destination delivers on; matched against Profile.activatable_channels.
        constraints: "one of {EMAIL, SMS, PUSH, DIRECT_MAIL, ADVERTISING}"
      - name: hashing_algorithm
        type: enum
        source: input
        description: >-
          Identifier hashing contract. SHA256_EMAIL_LOWER requires Profile.email_norm;
          SHA256_PHONE_E164 requires Profile.phone_norm.
        constraints: "one of {SHA256_EMAIL_LOWER, SHA256_PHONE_E164}"
      - name: match_rate_basis
        type: enum
        source: input
        description: Selects the calculations.activation_match_rate variant used for the UNDERPERFORMING threshold.
        default: GROSS
        constraints: "one of {GROSS, NET}"
      - name: min_match_rate
        type: number
        source: input
        description: Effective match rate at or above which a reported activation stays ACTIVE.
        default: 0.70
        constraints: "0.0000..1.0000, at most 4 decimals"
      - name: min_audience_size
        type: integer
        source: input
        description: k-anonymity floor; a dispatch whose audience_size is below this value is rejected.
        default: 50
        constraints: "integer >= 1"
      - name: daily_hash_quota
        type: integer
        source: input
        description: Hashes this destination accepts per UTC calendar day.
        constraints: "integer >= 1"
      - name: remaining_daily_hash_quota
        type: integer
        source: computed
        description: daily_hash_quota minus hashes consumed by non-refunded dispatches; reset by a retention run on the first run of a new UTC day.
      - name: quota_reset_on
        type: string
        source: system
        description: UTC calendar date (YYYY-MM-DD) the current quota window belongs to.
      - name: cooldown_minutes
        type: integer
        source: input
        description: "Buffer of clear time that must separate two DISJOINT activation windows on this destination (see §1.4 priority 46); 0 imposes no separation. Overlapping windows are governed by max_concurrent_activations, not by this field."
        default: 60
        constraints: "integer >= 0"
      - name: max_concurrent_activations
        type: integer
        source: input
        description: Maximum activations on this destination whose windows may cover any single instant.
        default: 2
        constraints: "integer >= 1"
      - name: sensitive_attribute_permitted
        type: boolean
        source: input
        description: Whether segments built on SENSITIVE_ATTRIBUTES may be activated here.
        default: false
      - name: deletion_ack_sla_hours
        type: integer
        source: input
        description: Hours the platform has to acknowledge a vendor deletion task before a retention run times it out.
        default: 72
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: input
        description: INACTIVE destinations reject activation creation and dispatch and are skipped by deletion propagation.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: underperforming_activation_count
        type: integer
        source: computed
        description: Count of Activations on this destination whose status == UNDERPERFORMING.
        default: 0

  - name: Activation
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> Segment.id; the audience source."
      - name: destination_id
        type: string
        source: input
        description: "FK -> Destination.id; the platform receiving hashed identifiers."
      - name: window_start_at
        type: datetime
        source: input
        description: Inclusive start of the delivery window.
      - name: window_end_at
        type: datetime
        source: input
        description: Inclusive end of the delivery window; must be > window_start_at.
      - name: status
        type: enum
        source: system
        description: Activation lifecycle state per §1.2 Activation machine.
        default: DRAFT
        constraints: "one of {DRAFT, DISPATCHED, ACTIVE, UNDERPERFORMING, PAUSED, TERMINATED}"
      - name: candidate_count
        type: integer
        source: computed
        description: Segment members evaluated at dispatch, before channel consent filtering.
        default: 0
      - name: audience_size
        type: integer
        source: computed
        description: Members whose activatable_channels contains the destination channel.
        default: 0
      - name: suppressed_count
        type: integer
        source: computed
        description: candidate_count - audience_size, i.e. members removed by consent or suppression.
        default: 0
      - name: dispatched_hash_count
        type: integer
        source: computed
        description: Hashes actually sent; audience members lacking the destination's required identifier are skipped.
        default: 0
      - name: unusable_hash_count
        type: integer
        source: system
        description: Hashes the platform reported as unusable in the match report.
        default: 0
      - name: vendor_matched_count
        type: integer
        source: system
        description: Hashes the platform reported as matched.
        default: 0
      - name: gross_match_rate
        type: number
        source: computed
        description: GROSS variant of calculations.activation_match_rate; null before the first match report.
      - name: net_match_rate
        type: number
        source: computed
        description: NET variant of calculations.activation_match_rate; null before the first match report.
      - name: effective_match_rate
        type: number
        source: computed
        description: gross_match_rate when Destination.match_rate_basis == GROSS, else net_match_rate; null before the first match report.
      - name: attributed_conversion_count
        type: integer
        source: computed
        description: len(attributed_conversions).
        default: 0
      - name: attributed_conversions
        type: array
        source: system
        description: >-
          Conversions reported by the platform. Each element is an object
          {profile_id, converted_at, revenue_cents}. Appended, never replaced, by match reports.
        default: []
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant of dispatch, or null.
      - name: paused_reason
        type: enum
        source: system
        description: Why the activation left the delivering states, or null.
        constraints: "one of {SEGMENT_RETIRED, GOVERNANCE_EXPIRED, CONSENT_WITHDRAWN, OPERATOR} or null"
      - name: terminated_at
        type: datetime
        source: system
        description: Logical-clock instant of termination, or null.

  - name: DeletionRequest
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; the data subject to erase."
      - name: request_origin
        type: enum
        source: input
        description: Who initiated the erasure.
        constraints: "one of {DATA_SUBJECT, RETENTION, REGULATOR}"
      - name: requester_reference
        type: string
        source: input
        description: External case reference for the privacy request.
        constraints: "1..60 chars after trim"
      - name: status
        type: enum
        source: system
        description: Erasure lifecycle state per §1.2 DeletionRequest machine.
        default: RECEIVED
        constraints: "one of {RECEIVED, BLOCKED_LEGAL_HOLD, PROPAGATING, PARTIALLY_VERIFIED, VERIFIED}"
      - name: total_vendor_task_count
        type: integer
        source: computed
        description: VendorDeletionTasks minted across all propagate calls for this request.
        default: 0
      - name: pending_vendor_task_count
        type: integer
        source: computed
        description: Child tasks whose status is in {PENDING, DISPATCHED}.
        default: 0
      - name: acknowledged_vendor_task_count
        type: integer
        source: computed
        description: Child tasks whose status == ACKNOWLEDGED.
        default: 0
      - name: failed_vendor_task_count
        type: integer
        source: computed
        description: Child tasks whose status == FAILED.
        default: 0
      - name: timed_out_vendor_task_count
        type: integer
        source: computed
        description: Child tasks whose status == TIMED_OUT.
        default: 0
      - name: propagated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent propagate, or null.
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant the request reached VERIFIED, or null.
      - name: blocked_reason
        type: string
        source: system
        description: The reason_code of the blocking LEGAL_HOLD SuppressionEntry, or null.

  - name: VendorDeletionTask
    parent: null
    common_fields: true
    fields:
      - name: deletion_request_id
        type: string
        source: system
        description: "FK -> DeletionRequest.id; the erasure this downstream task belongs to."
      - name: destination_id
        type: string
        source: system
        description: "FK -> Destination.id; the platform that must confirm downstream erasure."
      - name: status
        type: enum
        source: system
        description: Task lifecycle state per §1.2 VendorDeletionTask machine.
        default: PENDING
        constraints: "one of {PENDING, DISPATCHED, ACKNOWLEDGED, FAILED, TIMED_OUT}"
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant the task was handed to the platform, or null.
      - name: ack_deadline_at
        type: datetime
        source: system
        description: dispatched_at plus Destination.deletion_ack_sla_hours; a retention run at or after this instant times the task out.
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant of the platform acknowledgement, or null.
      - name: deletion_evidence_reference
        type: string
        source: system
        description: Evidence reference supplied by the platform, or null.
      - name: acknowledged_record_count
        type: integer
        source: system
        description: Record count the platform claims to have erased, or null.
      - name: attempt_count
        type: integer
        source: system
        description: Number of times this task has been dispatched; starts at 1 and increments on re-dispatch after a timeout.
        default: 1

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SourceSystem
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /cdp/ingest-batches/{batchId}/promote (first successful promote for this source)"
        actor: system
        preconditions:
          - "batch.source_system_id == this source's id"
          - "source.status == REGISTERED"
        side_effects:
          - "sets SourceSystem.status = ACTIVE"
          - "increments SourceSystem.version by 1"
        note: "A source becomes ACTIVE only once real data has flowed through validate and promote."
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /cdp/ingest-batches/{batchId}/validate (auto, when the recomputed dq_pass_rate breaches the floor)"
        actor: system
        preconditions:
          - "recomputed SourceSystem.submitted_record_total >= DQ_MIN_SAMPLE (5) — exactly 5 records IS enough evidence"
          - "recomputed SourceSystem.dq_pass_rate < SourceSystem.pii_completeness_floor (a rate exactly equal to the floor is NOT a breach)"
        side_effects:
          - "sets SourceSystem.status = QUARANTINED and increments quarantine_count by 1"
          - "CASCADE HOP: every IngestBatch of this source whose status == RECEIVED transitions to REJECTED with rejection_reason = SOURCE_QUARANTINED"
          - "increments SourceSystem.version by 1"
      - from: REGISTERED
        to: QUARANTINED
        trigger: "POST /cdp/ingest-batches/{batchId}/validate (auto, same floor breach before the source ever promoted)"
        actor: system
        preconditions:
          - "recomputed SourceSystem.submitted_record_total >= DQ_MIN_SAMPLE (5) — exactly 5 records IS enough evidence"
          - "recomputed SourceSystem.dq_pass_rate < SourceSystem.pii_completeness_floor (a rate exactly equal to the floor is NOT a breach)"
        side_effects:
          - "sets SourceSystem.status = QUARANTINED and increments quarantine_count by 1"
          - "CASCADE HOP: every IngestBatch of this source whose status == RECEIVED transitions to REJECTED with rejection_reason = SOURCE_QUARANTINED"
          - "increments SourceSystem.version by 1"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /cdp/source-systems/{sourceSystemId}/reinstate"
        actor: DataPlatformAdmin
        preconditions:
          - "source.status == QUARANTINED"
        side_effects:
          - "sets SourceSystem.status = ACTIVE and last_reinstated_at = logical clock now"
          - "RESET: sets dq_window_start_at = logical clock now, which empties the in-window batch set, so submitted_record_total = 0, valid_record_total = 0 and dq_pass_rate = 1.0"
          - "increments SourceSystem.version by 1"
        note: "The reinstate resets the data-quality baseline; previously counted batches never re-enter the window."

  - entity: IngestBatch
    initial_state: RECEIVED
    terminal_states: [PROMOTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /cdp/ingest-batches/{batchId}/validate"
        actor: DataEngineer
        preconditions:
          - "batch.status == RECEIVED"
          - "computed dq_score >= SourceSystem.pii_completeness_floor (inclusive at equality)"
        side_effects:
          - "writes dq_score, valid_record_count, invalid_record_count and dq_failure_breakdown per calculations.batch_data_quality_score"
          - "sets status = VALIDATED and validated_at = logical clock now"
          - "recomputes SourceSystem.submitted_record_total, valid_record_total and dq_pass_rate per calculations.source_system_dq_pass_rate"
          - "increments IngestBatch.version by 1"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /cdp/ingest-batches/{batchId}/validate"
        actor: DataEngineer
        preconditions:
          - "batch.status == RECEIVED"
          - "computed dq_score < SourceSystem.pii_completeness_floor"
        side_effects:
          - "writes dq_score, valid_record_count, invalid_record_count and dq_failure_breakdown per calculations.batch_data_quality_score"
          - "sets status = QUARANTINED and validated_at = logical clock now"
          - "CASCADE HOP 1: recomputes SourceSystem.dq_pass_rate; when the floor breach conditions hold the source transitions to QUARANTINED"
          - "CASCADE HOP 2 (caused by hop 1): every sibling IngestBatch of that source in RECEIVED transitions to REJECTED with rejection_reason = SOURCE_QUARANTINED"
          - "increments IngestBatch.version by 1"
      - from: QUARANTINED
        to: RECEIVED
        trigger: "POST /cdp/ingest-batches/{batchId}/requeue"
        actor: DataEngineer
        preconditions:
          - "batch.status == QUARANTINED"
          - "batch.retry_round < MAX_RETRY_ROUNDS (2)"
        side_effects:
          - "increments retry_round by 1"
          - "sets status = RECEIVED and clears dq_score, dq_failure_breakdown, valid_record_count, invalid_record_count and validated_at"
          - "recomputes SourceSystem totals and dq_pass_rate excluding this batch (it is no longer in a counted status)"
          - "increments IngestBatch.version by 1"
        note: "This is the cycle: RECEIVED -> QUARANTINED -> RECEIVED, bounded by MAX_RETRY_ROUNDS."
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /cdp/ingest-batches/{batchId}/requeue (auto, retry budget exhausted)"
        actor: DataEngineer
        preconditions:
          - "batch.status == QUARANTINED"
          - "batch.retry_round >= MAX_RETRY_ROUNDS (2)"
        side_effects:
          - "sets status = REJECTED and rejection_reason = RETRY_LIMIT_REACHED"
          - "increments IngestBatch.version by 1"
        note: >-
          DELIBERATE ERROR-WITH-SIDE-EFFECT (the scaffold's only one, and the only way
          ERR_RETRY_LIMIT_REACHED is reachable): the third requeue of the same batch responds 409
          ERR_RETRY_LIMIT_REACHED per §1.4 priority 49 AND, in that same call, drives the batch
          QUARANTINED -> REJECTED with rejection_reason = RETRY_LIMIT_REACHED. A fourth requeue of
          the now-terminal batch is plain ERR_INVALID_STATE (priority 21).
      - from: RECEIVED
        to: REJECTED
        trigger: "system cascade from SourceSystem ACTIVE_to_QUARANTINED or REGISTERED_to_QUARANTINED"
        actor: system
        preconditions:
          - "batch.status == RECEIVED"
          - "the batch's SourceSystem just transitioned to QUARANTINED"
        side_effects:
          - "sets status = REJECTED and rejection_reason = SOURCE_QUARANTINED"
          - "increments IngestBatch.version by 1"
      - from: VALIDATED
        to: PROMOTED
        trigger: "POST /cdp/ingest-batches/{batchId}/promote"
        actor: DataEngineer
        preconditions:
          - "batch.status == VALIDATED"
          - "SourceSystem.status != QUARANTINED"
          - "the resolution pass consults only MatchRules with status == ENABLED; promote takes no rule argument and succeeds when no rule is ENABLED (every record then mints its own Profile)"
        side_effects:
          - "for every record with per-record score >= DQ_RECORD_MIN, resolves identity per calculations.identity_resolution_pass: deterministic key hit attaches the record to the existing Profile, otherwise a new Profile is minted with resolution_status = RESOLVED"
          - "mints IdentityLink rows for probabilistic candidates whose confidence >= MatchRule.review_floor; links at or above auto_merge_threshold are auto-CONFIRMED (which runs the merge cascade)"
          - "assigns each new Profile with a non-null address_hash to a Household per calculations.household_grouping, creating the Household when none with that address_hash has spare capacity"
          - "materialises ConsentRecords from each record's consent_signals with captured_at = record.event_timestamp and source_system_id = batch.source_system_id, then recomputes each touched Profile.activatable_channels"
          - "writes new_profile_count, matched_deterministic_count and matched_probabilistic_count"
          - "sets status = PROMOTED and promoted_at = logical clock now"
          - "transitions SourceSystem REGISTERED -> ACTIVE when this is the source's first promote"
          - "increments IngestBatch.version by 1"

  - entity: Profile
    initial_state: UNRESOLVED
    terminal_states: [MERGED_AWAY]
    note: >-
      PARALLEL DIMENSIONS. Profile carries two independent state axes on the same row:
      resolution_status (UNRESOLVED -> RESOLVED -> MERGED_AWAY) and privacy_status
      (NORMAL <-> SUPPRESSED, NORMAL <-> LEGAL_HOLD, NORMAL -> DELETION_PENDING -> DELETED).
      A profile may be RESOLVED and LEGAL_HOLD at once; the axes never gate each other's
      transitions, but each axis gates different operations. The initial_state and
      terminal_states above describe the resolution_status axis; privacy_status starts at
      NORMAL and has no terminal state other than DELETED.
    transitions:
      - from: UNRESOLVED
        to: RESOLVED
        trigger: "POST /cdp/ingest-batches/{batchId}/promote (profile minted from a valid record)"
        actor: system
        preconditions:
          - "the record's per-record score >= DQ_RECORD_MIN (0.60)"
        side_effects:
          - "sets resolution_status = RESOLVED, origin_batch_id, primary_source_system_id and source_record_count = 1"
          - "computes activatable_channels, channel_engagement_score and contributing_source_system_codes"
        note: "UNRESOLVED is written and immediately advanced inside the same promote; it is observable only on records whose score is below DQ_RECORD_MIN, which are never minted."
      - from: RESOLVED
        to: MERGED_AWAY
        trigger: "POST /cdp/identity-links/{linkId}/decision with decision == CONFIRM (loser side)"
        actor: IdentitySteward
        preconditions:
          - "profile.resolution_status == RESOLVED"
          - "profile.privacy_status NOT IN {LEGAL_HOLD, DELETION_PENDING, DELETED}"
          - "profile is the non-survivor per calculations.merge_survivorship"
        side_effects:
          - "sets resolution_status = MERGED_AWAY and merged_into_profile_id = survivor id"
          - "re-points every ConsentRecord whose profile_id was the loser to the survivor, preserving captured_at and source_system_id"
          - "adds loser.source_record_count into survivor.source_record_count and unions contributing_source_system_codes"
          - "CASCADE HOP: survivor.activatable_channels is recomputed over the merged consent set, which can drop channels the survivor previously held"
          - "detaches the loser from its Household, decrementing that Household.member_count and recomputing dominant_last_name and combined_lifetime_value_cents"
          - "increments Profile.version by 1 on both loser and survivor"
      - from: NORMAL
        to: SUPPRESSED
        trigger: "POST /cdp/suppression-entries with entry_type IN {PRIVACY_DELETE, DO_NOT_SELL, GLOBAL_OPT_OUT}"
        actor: PrivacyOfficer
        preconditions:
          - "profile.privacy_status == NORMAL"
        side_effects:
          - "sets privacy_status = SUPPRESSED"
          - "recomputes activatable_channels: [] for PRIVACY_DELETE and GLOBAL_OPT_OUT; for DO_NOT_SELL only ADVERTISING is removed"
          - "CASCADE HOP: every Activation in {DISPATCHED, ACTIVE, UNDERPERFORMING} whose segment contains this profile recomputes candidate_count, audience_size and suppressed_count; when audience_size drops to 0 the activation transitions to PAUSED with paused_reason = CONSENT_WITHDRAWN"
          - "increments Profile.version by 1"
        note: "privacy_status axis. DO_NOT_SELL still moves the axis to SUPPRESSED even though only ADVERTISING is masked."
      - from: SUPPRESSED
        to: NORMAL
        trigger: "POST /cdp/suppression-entries/{suppressionId}/release, or POST /cdp/retention-runs step 2 (window expiry)"
        actor: PrivacyOfficer
        preconditions:
          - "no remaining SuppressionEntry for this profile has status == ACTIVE"
        side_effects:
          - "sets privacy_status = NORMAL"
          - "recomputes activatable_channels from the surviving ConsentRecords, restoring the pre-suppression channel set"
          - "increments Profile.version by 1"
      - from: NORMAL
        to: LEGAL_HOLD
        trigger: "POST /cdp/suppression-entries with entry_type == LEGAL_HOLD"
        actor: PrivacyOfficer
        preconditions:
          - "profile.privacy_status IN {NORMAL, SUPPRESSED, DELETION_PENDING}"
        side_effects:
          - "sets privacy_status = LEGAL_HOLD and activatable_channels = [] WHEN the prior privacy_status was NORMAL or SUPPRESSED"
          - "increments Profile.version by 1"
        note: >-
          LEGAL_HOLD outranks SUPPRESSED on the privacy axis; releasing the hold returns the profile
          to SUPPRESSED when another ACTIVE entry remains, else to NORMAL. PRECEDENCE EXCEPTION:
          DELETION_PENDING outranks LEGAL_HOLD, so a LEGAL_HOLD entry created on a DELETION_PENDING
          profile is stored ACTIVE and leaves privacy_status at DELETION_PENDING (activatable_channels
          is already []); the ACTIVE entry still blocks POST /cdp/deletion-requests/{id}/propagate and
          is the only way DeletionRequest.BLOCKED_LEGAL_HOLD is reachable.
      - from: LEGAL_HOLD
        to: NORMAL
        trigger: "POST /cdp/suppression-entries/{suppressionId}/release (LEGAL_HOLD entry), or POST /cdp/retention-runs step 2"
        actor: PrivacyOfficer
        preconditions:
          - "the released entry's entry_type == LEGAL_HOLD"
          - "no remaining SuppressionEntry for this profile has status == ACTIVE"
        side_effects:
          - "sets privacy_status = NORMAL and recomputes activatable_channels"
          - "CASCADE HOP: every DeletionRequest for this profile in BLOCKED_LEGAL_HOLD transitions to RECEIVED and clears blocked_reason"
          - "increments Profile.version by 1"
      - from: NORMAL
        to: DELETION_PENDING
        trigger: "POST /cdp/deletion-requests"
        actor: PrivacyOfficer
        preconditions:
          - "profile.privacy_status IN {NORMAL, SUPPRESSED}"
          - "no DeletionRequest for this profile has status IN {RECEIVED, BLOCKED_LEGAL_HOLD, PROPAGATING, PARTIALLY_VERIFIED}"
        side_effects:
          - "sets privacy_status = DELETION_PENDING and activatable_channels = []"
          - "mints a SuppressionEntry with entry_type = PRIVACY_DELETE, status = ACTIVE, deletion_request_id set, created_by_user_id = \"system\", effective_at = logical clock now and expires_at = null"
          - "CASCADE HOP: Activations in {DISPATCHED, ACTIVE, UNDERPERFORMING} whose segment contained this profile recompute candidate_count, audience_size and suppressed_count, and re-derive gross_match_rate, net_match_rate and effective_match_rate; an activation whose effective_match_rate falls below Destination.min_match_rate transitions ACTIVE -> UNDERPERFORMING"
          - "increments Profile.version by 1"
      - from: DELETION_PENDING
        to: DELETED
        trigger: "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge (auto, when the parent DeletionRequest reaches VERIFIED)"
        actor: system
        preconditions:
          - "the parent DeletionRequest just transitioned to VERIFIED"
        side_effects:
          - "sets privacy_status = DELETED and tombstones PII: email_norm, phone_norm, first_name, last_name, inferred_health_interest, inferred_ethnicity_affinity and precise_geolocation_grid all become null"
          - "sets every ConsentRecord of this profile to status = TOMBSTONED"
          - "CASCADE HOP: every IdentityLink whose left_profile_id or right_profile_id is this profile and whose status == PROPOSED transitions to VOIDED with void_reason = PROFILE_DELETED"
          - "CASCADE HOP: the profile is detached from its Household; that Household.member_count decrements and, when it reaches 0, the Household transitions to DISSOLVED"
          - "increments Profile.version by 1"
        note: "resolution_status is untouched by this transition — the two axes are independent."

  - entity: IdentityLink
    initial_state: PROPOSED
    terminal_states: [REJECTED, VOIDED]
    note: >-
      BRANCHING FORK. From PROPOSED the single trigger POST /cdp/identity-links/{linkId}/decision
      forks on the decision field into two branches with disjoint side-effect sets: CONFIRM runs
      the merge/household/activation cascade, REJECT runs the rule-precision/void cascade.
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /cdp/identity-links with confidence >= MatchRule.auto_merge_threshold (auto at creation)"
        actor: system
        preconditions:
          - "MatchRule.status == ENABLED"
          - "both profiles have resolution_status == RESOLVED and privacy_status NOT IN {LEGAL_HOLD, DELETION_PENDING, DELETED}"
        side_effects:
          - "sets status = CONFIRMED, decided_by_user_id = \"system\", decided_at = logical clock now"
          - "selects survivor_profile_id per calculations.merge_survivorship and runs the Profile RESOLVED_to_MERGED_AWAY cascade on the loser"
          - "increments MatchRule.confirmed_count by 1 and recomputes precision_estimate"
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /cdp/identity-links/{linkId}/decision with decision == CONFIRM"
        actor: IdentitySteward
        preconditions:
          - "link.status == PROPOSED"
          - "both profiles have resolution_status == RESOLVED"
          - "neither profile has privacy_status IN {LEGAL_HOLD, DELETED}"
          - "neither profile has privacy_status == DELETION_PENDING"
        side_effects:
          - "sets status = CONFIRMED, decided_by_user_id = X-User-ID, decided_at = logical clock now"
          - "CASCADE HOP 1: selects survivor_profile_id per calculations.merge_survivorship; the loser Profile transitions RESOLVED -> MERGED_AWAY, its ConsentRecords re-point to the survivor and the survivor's activatable_channels is recomputed over the merged consent set"
          - "CASCADE HOP 2 (caused by hop 1): every Activation in {DISPATCHED, ACTIVE, UNDERPERFORMING} whose Destination.channel is no longer in the survivor's activatable_channels recomputes audience_size and suppressed_count; when audience_size reaches 0 the Activation transitions to PAUSED with paused_reason = CONSENT_WITHDRAWN and its dispatched_hash_count is refunded to Destination.remaining_daily_hash_quota"
          - "CASCADE HOP 3 (caused by hop 2): the paused Activation's Segment.active_activation_count decrements; when it reaches 0 and the logical clock is at or after Segment.governance_expires_at the Segment transitions APPROVED -> GOVERNANCE_EXPIRED and sensitive_use_approved is reset to false"
          - "increments MatchRule.confirmed_count by 1 and recomputes precision_estimate"
          - "increments IdentityLink.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /cdp/identity-links/{linkId}/decision with decision == REJECT"
        actor: IdentitySteward
        preconditions:
          - "link.status == PROPOSED"
        side_effects:
          - "sets status = REJECTED, decided_by_user_id = X-User-ID, decided_at = logical clock now"
          - "CASCADE HOP 1: increments MatchRule.rejected_count by 1 and recomputes MatchRule.precision_estimate"
          - "CASCADE HOP 2 (caused by hop 1): when precision_estimate < MatchRule.min_precision the MatchRule transitions ENABLED -> DISABLED"
          - "CASCADE HOP 3 (caused by hop 2): every other IdentityLink minted by that rule whose status == PROPOSED transitions to VOIDED with void_reason = RULE_DISABLED"
          - "no Profile is mutated on this branch — survivor_profile_id stays null and both profiles keep resolution_status == RESOLVED"
          - "increments IdentityLink.version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "system cascade from MatchRule ENABLED_to_DISABLED or Profile DELETION_PENDING_to_DELETED"
        actor: system
        preconditions:
          - "link.status == PROPOSED"
        side_effects:
          - "sets status = VOIDED and void_reason = RULE_DISABLED or PROFILE_DELETED per the originating cascade"
          - "MatchRule counters are NOT touched — a voided link is neither a confirmation nor a rejection"
          - "increments IdentityLink.version by 1"
      - from: CONFIRMED
        to: VOIDED
        trigger: "system cascade from Profile DELETION_PENDING_to_DELETED (survivor erased)"
        actor: system
        preconditions:
          - "link.status == CONFIRMED"
          - "link.survivor_profile_id references the profile that just reached DELETED"
        side_effects:
          - "sets status = VOIDED and void_reason = PROFILE_DELETED"
          - "the loser profile keeps resolution_status == MERGED_AWAY — voiding the evidence never un-merges an identity"
          - "increments IdentityLink.version by 1"

  - entity: MatchRule
    initial_state: ENABLED
    terminal_states: []
    transitions:
      - from: ENABLED
        to: DISABLED
        trigger: "POST /cdp/identity-links/{linkId}/decision with decision == REJECT (auto, precision floor breach)"
        actor: system
        preconditions:
          - "rule.status == ENABLED"
          - "recomputed precision_estimate < rule.min_precision"
        side_effects:
          - "sets MatchRule.status = DISABLED"
          - "CASCADE HOP: every PROPOSED IdentityLink minted by this rule transitions to VOIDED with void_reason = RULE_DISABLED"
          - "increments MatchRule.version by 1"
        note: "There is no re-enable path; a disabled rule is replaced by creating a new MatchRule with a fresh code."

  - entity: Household
    initial_state: ACTIVE
    terminal_states: [DISSOLVED]
    transitions:
      - from: ACTIVE
        to: DISSOLVED
        trigger: "system cascade from Profile RESOLVED_to_MERGED_AWAY or DELETION_PENDING_to_DELETED (last member detached)"
        actor: system
        preconditions:
          - "household.status == ACTIVE"
          - "recomputed member_count == 0"
        side_effects:
          - "sets Household.status = DISSOLVED, dominant_last_name = null and combined_lifetime_value_cents = 0"
          - "increments Household.version by 1"
        note: "A DISSOLVED household is never reused; POST /cdp/profiles/{profileId}/household-assignment against it is rejected with ERR_INVALID_HOUSEHOLD_STATE."

  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [TOMBSTONED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /cdp/consent-records, or POST /cdp/ingest-batches/{batchId}/promote (consent_signals materialisation)"
        actor: system
        preconditions:
          - "a newly written sibling record in the same (profile_id, channel, purpose) group takes precedence_rank 1"
        side_effects:
          - "sets the displaced record's status = SUPERSEDED and recomputes precedence_rank for every remaining ACTIVE sibling"
          - "increments ConsentRecord.version by 1"
        note: "Only the rank-1 record is ACTIVE; every lower-ranked sibling in the same group is SUPERSEDED."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /cdp/retention-runs step 1"
        actor: system
        preconditions:
          - "record.status == ACTIVE"
          - "record.expires_at is not null and record.expires_at <= logical clock now"
        side_effects:
          - "sets status = EXPIRED"
          - "CASCADE HOP: recomputes the owning Profile.activatable_channels and channel_engagement_score, promoting the next-ranked SUPERSEDED sibling to precedence_rank 1 and status ACTIVE"
          - "increments ConsentRecord.version by 1"
      - from: ACTIVE
        to: TOMBSTONED
        trigger: "system cascade from Profile DELETION_PENDING_to_DELETED"
        actor: system
        preconditions:
          - "the owning Profile just reached privacy_status == DELETED"
        side_effects:
          - "sets status = TOMBSTONED and precedence_rank = 0"
          - "increments ConsentRecord.version by 1"
      - from: SUPERSEDED
        to: TOMBSTONED
        trigger: "system cascade from Profile DELETION_PENDING_to_DELETED"
        actor: system
        preconditions:
          - "the owning Profile just reached privacy_status == DELETED"
        side_effects:
          - "sets status = TOMBSTONED and precedence_rank = 0"
          - "increments ConsentRecord.version by 1"
      - from: EXPIRED
        to: TOMBSTONED
        trigger: "system cascade from Profile DELETION_PENDING_to_DELETED"
        actor: system
        preconditions:
          - "the owning Profile just reached privacy_status == DELETED"
        side_effects:
          - "sets status = TOMBSTONED and precedence_rank = 0"
          - "increments ConsentRecord.version by 1"

  - entity: SuppressionEntry
    initial_state: ACTIVE
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /cdp/suppression-entries/{suppressionId}/release"
        actor: PrivacyOfficer
        preconditions:
          - "entry.status == ACTIVE"
          - "when entry.entry_type == LEGAL_HOLD, X-User-ID != entry.created_by_user_id (segregation of duties)"
          - "when entry.entry_type == PRIVACY_DELETE, entry.deletion_request_id is null (system-minted erasure suppressions are not releasable)"
        side_effects:
          - "sets status = RELEASED, released_by_user_id = X-User-ID and released_at = logical clock now"
          - "CASCADE HOP: the owning Profile.privacy_status is re-derived over the remaining ACTIVE entries (LEGAL_HOLD > DELETION_PENDING > SUPPRESSED > NORMAL) and activatable_channels is recomputed"
          - "CASCADE HOP (LEGAL_HOLD only, caused by the privacy_status change): every DeletionRequest of that profile in BLOCKED_LEGAL_HOLD transitions to RECEIVED"
          - "increments SuppressionEntry.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /cdp/retention-runs step 2"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "entry.expires_at is not null and entry.expires_at <= logical clock now"
        side_effects:
          - "sets status = EXPIRED"
          - "CASCADE HOP: re-derives the owning Profile.privacy_status and activatable_channels exactly as the release path does"
          - "increments SuppressionEntry.version by 1"

  - entity: Segment
    initial_state: DRAFT
    terminal_states: [RETIRED]
    note: >-
      REVERT CYCLE. PENDING_GOVERNANCE_REVIEW -> DRAFT on REJECT, and DRAFT ->
      PENDING_GOVERNANCE_REVIEW on resubmit, so a segment can loop through review any number of
      times; GOVERNANCE_EXPIRED -> PENDING_GOVERNANCE_REVIEW closes a second, longer loop.
    transitions:
      - from: DRAFT
        to: PENDING_GOVERNANCE_REVIEW
        trigger: "POST /cdp/segments/{segmentId}/submit-for-review"
        actor: SegmentAnalyst
        preconditions:
          - "segment.status IN {DRAFT, GOVERNANCE_EXPIRED}"
          - "when segment.uses_sensitive_attributes is true, governance_justification is non-null and >= 10 chars after trim"
        side_effects:
          - "sets status = PENDING_GOVERNANCE_REVIEW and submitted_by_user_id = X-User-ID"
          - "recomputes member_count over the current profile population"
          - "increments Segment.version by 1"
      - from: GOVERNANCE_EXPIRED
        to: PENDING_GOVERNANCE_REVIEW
        trigger: "POST /cdp/segments/{segmentId}/submit-for-review"
        actor: SegmentAnalyst
        preconditions:
          - "segment.status == GOVERNANCE_EXPIRED"
          - "when segment.uses_sensitive_attributes is true, governance_justification is non-null and >= 10 chars after trim"
        side_effects:
          - "sets status = PENDING_GOVERNANCE_REVIEW and submitted_by_user_id = X-User-ID"
          - "increments Segment.version by 1"
      - from: PENDING_GOVERNANCE_REVIEW
        to: APPROVED
        trigger: "POST /cdp/segments/{segmentId}/governance-decision with decision == APPROVE"
        actor: DataGovernanceOfficer
        preconditions:
          - "segment.status == PENDING_GOVERNANCE_REVIEW"
          - "X-User-ID != segment.submitted_by_user_id (segregation of duties)"
          - "when segment.uses_sensitive_attributes is true, the request body sensitive_use_approved is true"
        side_effects:
          - "sets status = APPROVED, decided_by_user_id = X-User-ID, sensitive_use_approved from the body, approved_at = logical clock now and governance_expires_at = approved_at + governance_valid_days days"
          - "increments Segment.version by 1"
        note: "approved_at is the anchor for segment_entry_at in calculations.segment_performance_attribution."
      - from: PENDING_GOVERNANCE_REVIEW
        to: DRAFT
        trigger: "POST /cdp/segments/{segmentId}/governance-decision with decision == REJECT"
        actor: DataGovernanceOfficer
        preconditions:
          - "segment.status == PENDING_GOVERNANCE_REVIEW"
          - "X-User-ID != segment.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "sets status = DRAFT, decided_by_user_id = X-User-ID, sensitive_use_approved = false and increments rejection_count by 1"
          - "clears submitted_by_user_id so the next submit re-arms the segregation check"
          - "approved_at and governance_expires_at are left untouched — a rejection never rewrites approval history"
          - "increments Segment.version by 1"
      - from: APPROVED
        to: GOVERNANCE_EXPIRED
        trigger: "POST /cdp/retention-runs step 4, or the Segment.active_activation_count-reaches-zero cascade from IdentityLink CONFIRM"
        actor: system
        preconditions:
          - "segment.status == APPROVED"
          - "segment.governance_expires_at is not null and governance_expires_at <= logical clock now"
        side_effects:
          - "sets status = GOVERNANCE_EXPIRED and sensitive_use_approved = false"
          - "CASCADE HOP: every Activation of this segment in {DISPATCHED, ACTIVE, UNDERPERFORMING} transitions to PAUSED with paused_reason = GOVERNANCE_EXPIRED and its dispatched_hash_count is refunded to Destination.remaining_daily_hash_quota"
          - "increments Segment.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /cdp/segments/{segmentId}/retire"
        actor: DataGovernanceOfficer
        preconditions:
          - "segment.status IN {DRAFT, APPROVED, GOVERNANCE_EXPIRED}"
        side_effects:
          - "sets status = RETIRED"
          - "CASCADE HOP: every Activation of this segment whose status IN {DRAFT, DISPATCHED, ACTIVE, UNDERPERFORMING, PAUSED} transitions to TERMINATED with paused_reason = SEGMENT_RETIRED and terminated_at = logical clock now; dispatched_hash_count of any activation leaving {DISPATCHED, ACTIVE, UNDERPERFORMING} is refunded to Destination.remaining_daily_hash_quota"
          - "sets active_activation_count = 0"
          - "increments Segment.version by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /cdp/segments/{segmentId}/retire"
        actor: SegmentAnalyst
        preconditions:
          - "segment.status == DRAFT"
        side_effects:
          - "sets status = RETIRED and terminates any DRAFT Activation on this segment"
          - "increments Segment.version by 1"
      - from: GOVERNANCE_EXPIRED
        to: RETIRED
        trigger: "POST /cdp/segments/{segmentId}/retire"
        actor: DataGovernanceOfficer
        preconditions:
          - "segment.status == GOVERNANCE_EXPIRED"
        side_effects:
          - "sets status = RETIRED and terminates every non-TERMINATED Activation on this segment, refunding quota for any that were still delivering"
          - "increments Segment.version by 1"

  - entity: Activation
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /cdp/activations/{activationId}/dispatch"
        actor: SegmentAnalyst
        preconditions:
          - "activation.status == DRAFT"
          - "Segment.status == APPROVED"
          - "logical clock now < Segment.governance_expires_at"
          - "Destination.status == ACTIVE"
          - "when Segment.uses_sensitive_attributes is true: Segment.sensitive_use_approved is true AND Destination.sensitive_attribute_permitted is true"
          - "audience_size >= 1"
          - "audience_size >= Destination.min_audience_size (inclusive at equality)"
          - "dispatched_hash_count <= Destination.remaining_daily_hash_quota (inclusive at equality)"
        side_effects:
          - "writes candidate_count, audience_size, suppressed_count and dispatched_hash_count per calculations.activation_audience_resolution"
          - "sets status = DISPATCHED and dispatched_at = logical clock now"
          - "decrements Destination.remaining_daily_hash_quota by dispatched_hash_count"
          - "increments Segment.active_activation_count by 1"
          - "increments Activation.version by 1 and Destination.version by 1"
      - from: DISPATCHED
        to: ACTIVE
        trigger: "POST /cdp/activations/{activationId}/match-report"
        actor: DestinationPlatform
        preconditions:
          - "activation.status IN {DISPATCHED, ACTIVE, UNDERPERFORMING}"
          - "X-User-ID == activation.destination_id"
          - "effective_match_rate >= Destination.min_match_rate (inclusive at equality)"
        side_effects:
          - "writes vendor_matched_count and unusable_hash_count, then gross_match_rate, net_match_rate and effective_match_rate per calculations.activation_match_rate"
          - "appends the reported attributed_conversions and recomputes attributed_conversion_count"
          - "CASCADE HOP: each referenced Profile.lifetime_value_cents is increased by the reported revenue_cents, and each member Household.combined_lifetime_value_cents is recomputed"
          - "sets status = ACTIVE"
          - "increments Activation.version by 1"
      - from: DISPATCHED
        to: UNDERPERFORMING
        trigger: "POST /cdp/activations/{activationId}/match-report"
        actor: DestinationPlatform
        preconditions:
          - "activation.status IN {DISPATCHED, ACTIVE, UNDERPERFORMING}"
          - "X-User-ID == activation.destination_id"
          - "effective_match_rate < Destination.min_match_rate"
        side_effects:
          - "writes the same match-rate and conversion fields as the ACTIVE branch"
          - "sets status = UNDERPERFORMING"
          - "increments Destination.underperforming_activation_count by 1 and Destination.version by 1"
          - "increments Activation.version by 1"
      - from: ACTIVE
        to: UNDERPERFORMING
        trigger: "POST /cdp/activations/{activationId}/match-report (later report drops below the floor), or the DELETION_PENDING recompute cascade"
        actor: DestinationPlatform
        preconditions:
          - "recomputed effective_match_rate < Destination.min_match_rate"
        side_effects:
          - "sets status = UNDERPERFORMING and increments Destination.underperforming_activation_count by 1"
          - "increments Activation.version by 1"
      - from: UNDERPERFORMING
        to: ACTIVE
        trigger: "POST /cdp/activations/{activationId}/match-report (later report recovers to the floor)"
        actor: DestinationPlatform
        preconditions:
          - "recomputed effective_match_rate >= Destination.min_match_rate"
        side_effects:
          - "sets status = ACTIVE and decrements Destination.underperforming_activation_count by 1"
          - "increments Activation.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /cdp/activations/{activationId}/pause, or system cascade (CONSENT_WITHDRAWN, GOVERNANCE_EXPIRED)"
        actor: SegmentAnalyst
        preconditions:
          - "activation.status IN {DISPATCHED, ACTIVE, UNDERPERFORMING}"
        side_effects:
          - "sets status = PAUSED and paused_reason (OPERATOR for the explicit call, else the cascade reason)"
          - "REFUND: increases Destination.remaining_daily_hash_quota by activation.dispatched_hash_count and increments Destination.version by 1"
          - "decrements Segment.active_activation_count by 1; when the activation was UNDERPERFORMING also decrements Destination.underperforming_activation_count by 1"
          - "increments Activation.version by 1"
      - from: DISPATCHED
        to: PAUSED
        trigger: "POST /cdp/activations/{activationId}/pause, or system cascade (CONSENT_WITHDRAWN, GOVERNANCE_EXPIRED)"
        actor: SegmentAnalyst
        preconditions:
          - "activation.status == DISPATCHED — a delivering activation that has not yet received a match report is pausable"
        side_effects:
          - "identical to the ACTIVE -> PAUSED arm: sets status = PAUSED and paused_reason, REFUNDS dispatched_hash_count to Destination.remaining_daily_hash_quota, decrements Segment.active_activation_count by 1, and increments Activation.version and Destination.version by 1"
          - "Destination.underperforming_activation_count is NOT touched — a DISPATCHED activation was never counted there"
      - from: UNDERPERFORMING
        to: PAUSED
        trigger: "POST /cdp/activations/{activationId}/pause, or system cascade (CONSENT_WITHDRAWN, GOVERNANCE_EXPIRED)"
        actor: SegmentAnalyst
        preconditions:
          - "activation.status == UNDERPERFORMING"
        side_effects:
          - "identical to the ACTIVE -> PAUSED arm, and additionally decrements Destination.underperforming_activation_count by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /cdp/activations/{activationId}/resume"
        actor: SegmentAnalyst
        preconditions:
          - "activation.status == PAUSED"
          - "Segment.status == APPROVED"
          - "Destination.status == ACTIVE"
          - "recomputed dispatched_hash_count <= Destination.remaining_daily_hash_quota"
        side_effects:
          - "recomputes candidate_count, audience_size, suppressed_count and dispatched_hash_count against the current consent state"
          - "RE-CONSUMES: decrements Destination.remaining_daily_hash_quota by the recomputed dispatched_hash_count and increments Destination.version by 1"
          - "sets status = ACTIVE and paused_reason = null"
          - "increments Segment.active_activation_count by 1"
          - "increments Activation.version by 1"
      - from: PAUSED
        to: TERMINATED
        trigger: "POST /cdp/segments/{segmentId}/retire (cascade)"
        actor: system
        preconditions:
          - "the owning Segment just reached RETIRED"
        side_effects:
          - "sets status = TERMINATED, paused_reason = SEGMENT_RETIRED and terminated_at = logical clock now"
          - "no quota refund occurs — a PAUSED activation was already refunded"
          - "increments Activation.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cdp/segments/{segmentId}/retire (cascade)"
        actor: system
        preconditions:
          - "the owning Segment just reached RETIRED"
        side_effects:
          - "sets status = TERMINATED, paused_reason = SEGMENT_RETIRED and terminated_at = logical clock now"
          - "REFUND: increases Destination.remaining_daily_hash_quota by dispatched_hash_count"
          - "decrements Segment.active_activation_count by 1"
          - "increments Activation.version by 1"
      - from: DISPATCHED
        to: TERMINATED
        trigger: "POST /cdp/segments/{segmentId}/retire (cascade)"
        actor: system
        preconditions:
          - "the owning Segment just reached RETIRED"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED arm: status = TERMINATED, paused_reason = SEGMENT_RETIRED, terminated_at = logical clock now, the dispatched_hash_count REFUND, Segment.active_activation_count -1 and the version bumps"
      - from: UNDERPERFORMING
        to: TERMINATED
        trigger: "POST /cdp/segments/{segmentId}/retire (cascade)"
        actor: system
        preconditions:
          - "the owning Segment just reached RETIRED"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED arm, and additionally decrements Destination.underperforming_activation_count by 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /cdp/segments/{segmentId}/retire (cascade)"
        actor: system
        preconditions:
          - "the owning Segment just reached RETIRED"
        side_effects:
          - "sets status = TERMINATED, paused_reason = SEGMENT_RETIRED and terminated_at = logical clock now"
          - "no quota refund and no Segment.active_activation_count change occur — a DRAFT activation never consumed quota and was never counted as active"
          - "increments Activation.version by 1"

  - entity: DeletionRequest
    initial_state: RECEIVED
    terminal_states: [VERIFIED]
    note: >-
      COMPOUND. Status past PROPAGATING is derived from the aggregate state of the
      VendorDeletionTask children: all ACKNOWLEDGED bubbles up to VERIFIED, while a retention
      run that times out the last outstanding task bubbles up to PARTIALLY_VERIFIED.
    transitions:
      - from: RECEIVED
        to: PROPAGATING
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate"
        actor: PrivacyOfficer
        preconditions:
          - "request.status IN {RECEIVED, PARTIALLY_VERIFIED}"
          - "expected_deletion_request_version equals the current DeletionRequest.version"
          - "no SuppressionEntry of the profile has entry_type == LEGAL_HOLD and status == ACTIVE"
          - "at least one Destination has status == ACTIVE and at least one Activation whose status != DRAFT"
        side_effects:
          - "mints one VendorDeletionTask per qualifying Destination, ordered by Destination.created_at ASC, each PENDING then immediately DISPATCHED with dispatched_at = logical clock now and ack_deadline_at = dispatched_at + Destination.deletion_ack_sla_hours hours"
          - "sets status = PROPAGATING, propagated_at = logical clock now and recomputes the five task counters"
          - "increments DeletionRequest.version by 1"
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate (empty downstream set)"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == RECEIVED"
          - "expected_deletion_request_version equals the current DeletionRequest.version"
          - "no SuppressionEntry of the profile has entry_type == LEGAL_HOLD and status == ACTIVE"
          - "zero Destinations qualify (none is ACTIVE with a non-DRAFT Activation)"
        side_effects:
          - "sets total_vendor_task_count = 0, status = VERIFIED and verified_at = logical clock now"
          - "CASCADE HOP: the Profile transitions DELETION_PENDING -> DELETED with the full tombstone/void/household cascade"
          - "increments DeletionRequest.version by 1"
        note: "Empty-set boundary: with nothing downstream to verify, erasure completes in the propagate call itself."
      - from: RECEIVED
        to: BLOCKED_LEGAL_HOLD
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == RECEIVED"
          - "expected_deletion_request_version equals the current DeletionRequest.version"
          - "some SuppressionEntry of the profile has entry_type == LEGAL_HOLD and status == ACTIVE"
        side_effects:
          - "sets status = BLOCKED_LEGAL_HOLD and blocked_reason = that entry's reason_code"
          - "no VendorDeletionTask is minted and the Profile stays DELETION_PENDING"
          - "increments DeletionRequest.version by 1"
          - "the call still answers ERR_LEGAL_HOLD_ACTIVE (409) — the state change is the audit record of the blocked attempt"
      - from: BLOCKED_LEGAL_HOLD
        to: RECEIVED
        trigger: "POST /cdp/suppression-entries/{suppressionId}/release (LEGAL_HOLD entry) cascade"
        actor: system
        preconditions:
          - "no SuppressionEntry of the profile has entry_type == LEGAL_HOLD and status == ACTIVE"
        side_effects:
          - "sets status = RECEIVED and blocked_reason = null"
          - "increments DeletionRequest.version by 1"
      - from: PROPAGATING
        to: VERIFIED
        trigger: "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge (auto bubble-up)"
        actor: system
        preconditions:
          - "request.status IN {PROPAGATING, PARTIALLY_VERIFIED}"
          - "acknowledged_vendor_task_count == total_vendor_task_count"
        side_effects:
          - "sets status = VERIFIED and verified_at = logical clock now"
          - "CASCADE HOP: the Profile transitions DELETION_PENDING -> DELETED, tombstoning PII, TOMBSTONING every ConsentRecord, VOIDING its IdentityLinks and detaching it from its Household"
          - "increments DeletionRequest.version by 1"
      - from: PROPAGATING
        to: PARTIALLY_VERIFIED
        trigger: "POST /cdp/retention-runs step 3 (SLA elapsed)"
        actor: system
        preconditions:
          - "request.status == PROPAGATING"
          - "pending_vendor_task_count == 0 after the run's timeouts"
          - "timed_out_vendor_task_count + failed_vendor_task_count >= 1"
        side_effects:
          - "sets status = PARTIALLY_VERIFIED"
          - "the Profile stays DELETION_PENDING — partial downstream erasure never completes the tombstone"
          - "increments DeletionRequest.version by 1"
      - from: PARTIALLY_VERIFIED
        to: PROPAGATING
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate (retry)"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == PARTIALLY_VERIFIED"
          - "expected_deletion_request_version equals the current DeletionRequest.version"
          - "no SuppressionEntry of the profile has entry_type == LEGAL_HOLD and status == ACTIVE"
        side_effects:
          - "re-dispatches every TIMED_OUT or FAILED child task: status back to DISPATCHED, attempt_count incremented, dispatched_at and ack_deadline_at refreshed"
          - "does NOT mint duplicate tasks for destinations that already ACKNOWLEDGED"
          - "sets status = PROPAGATING and propagated_at = logical clock now"
          - "increments DeletionRequest.version by 1"
      - from: PARTIALLY_VERIFIED
        to: VERIFIED
        trigger: "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge (late acknowledgement of the last outstanding task)"
        actor: system
        preconditions:
          - "acknowledged_vendor_task_count == total_vendor_task_count"
        side_effects:
          - "sets status = VERIFIED, verified_at = logical clock now and runs the Profile DELETED cascade"
          - "increments DeletionRequest.version by 1"

  - entity: VendorDeletionTask
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate (same call that mints the task)"
        actor: system
        preconditions:
          - "the owning DeletionRequest just reached PROPAGATING"
        side_effects:
          - "sets status = DISPATCHED, dispatched_at = logical clock now, ack_deadline_at = dispatched_at + Destination.deletion_ack_sla_hours hours"
          - "increments VendorDeletionTask.version by 1"
      - from: DISPATCHED
        to: ACKNOWLEDGED
        trigger: "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge with outcome == ACKNOWLEDGED"
        actor: DestinationPlatform
        preconditions:
          - "task.status IN {DISPATCHED, TIMED_OUT}"
          - "X-User-ID == task.destination_id"
        side_effects:
          - "sets status = ACKNOWLEDGED, acknowledged_at = logical clock now, deletion_evidence_reference and acknowledged_record_count from the body"
          - "recomputes the parent DeletionRequest counters; when acknowledged_vendor_task_count == total_vendor_task_count the parent bubbles up to VERIFIED"
          - "increments VendorDeletionTask.version by 1"
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge with outcome == FAILED"
        actor: DestinationPlatform
        preconditions:
          - "task.status IN {DISPATCHED, TIMED_OUT}"
          - "X-User-ID == task.destination_id"
        side_effects:
          - "sets status = FAILED and deletion_evidence_reference from the body"
          - "recomputes the parent counters; the parent stays PROPAGATING while any sibling is still PENDING or DISPATCHED"
          - "increments VendorDeletionTask.version by 1"
      - from: DISPATCHED
        to: TIMED_OUT
        trigger: "POST /cdp/retention-runs step 3"
        actor: system
        preconditions:
          - "task.status == DISPATCHED"
          - "task.ack_deadline_at <= logical clock now"
        side_effects:
          - "sets status = TIMED_OUT"
          - "recomputes the parent counters; when no PENDING or DISPATCHED sibling remains the parent bubbles to PARTIALLY_VERIFIED"
          - "increments VendorDeletionTask.version by 1"
      - from: TIMED_OUT
        to: DISPATCHED
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate (retry)"
        actor: system
        preconditions:
          - "task.status IN {TIMED_OUT, FAILED}"
          - "the owning DeletionRequest is transitioning PARTIALLY_VERIFIED -> PROPAGATING"
        side_effects:
          - "sets status = DISPATCHED, increments attempt_count by 1, refreshes dispatched_at and ack_deadline_at"
          - "increments VendorDeletionTask.version by 1"
      - from: FAILED
        to: DISPATCHED
        trigger: "POST /cdp/deletion-requests/{deletionRequestId}/propagate (retry)"
        actor: system
        preconditions:
          - "task.status == FAILED"
          - "the owning DeletionRequest is transitioning PARTIALLY_VERIFIED -> PROPAGATING"
        side_effects:
          - "sets status = DISPATCHED, increments attempt_count by 1, refreshes dispatched_at and ack_deadline_at"
          - "increments VendorDeletionTask.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: consent-capture-stale-profile
    parent_entity: Profile
    write_endpoint: "POST /cdp/consent-records"
    occ_field: "expected_profile_version"
    description: |
      Capturing a ConsentRecord against a Profile whose version has advanced since the client
      last observed it is rejected. A new election legitimately supersedes the incumbent for its
      (profile, channel, purpose) group, so a second capture carrying a stale view of the profile
      would silently displace an election the client never saw. The OCC check turns that into a
      deterministic stale-version rejection.
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412

  - rule_id: activation-create-stale-segment
    parent_entity: Segment
    write_endpoint: "POST /cdp/activations"
    occ_field: "expected_segment_version"
    description: |
      Creating an Activation against a Segment whose version has advanced since the client last
      observed it is rejected. Every activation created on a segment bumps that segment's version
      and its active_activation_count, and a governance decision may have re-scoped the audience in
      between, so an activation built on a stale segment view is refused rather than dispatched
      against criteria the client never read.
    error_id: ERR_STALE_SEGMENT_VERSION
    http_status: 412

  - rule_id: propagate-stale-deletion-request
    parent_entity: DeletionRequest
    write_endpoint: "POST /cdp/deletion-requests/{deletionRequestId}/propagate"
    occ_field: "expected_deletion_request_version"
    description: |
      Propagating a DeletionRequest whose version has advanced since the client last observed it is
      rejected. A retry propagate legitimately supersedes the prior downstream fan-out by
      re-dispatching timed-out tasks, so a caller holding a stale version could re-dispatch a task
      set that has already changed underneath it.
    error_id: ERR_STALE_DELETION_REQUEST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: batch_data_quality_score
    trigger: "POST /cdp/ingest-batches/{batchId}/validate — scores every record in the batch, then the batch"
    algorithm: weighted_scoring
    input_set: >-
      Every element of IngestBatch.records. Five identifier components are scored per record:
      email_norm, phone_norm, loyalty_number, postal_code, name_pair. A component is PASS when
      the raw value is present and matches its format check, FAIL when present but malformed, and
      ABSENT when the raw value is null or blank after trim. Format checks: email_raw matches
      ^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$ (then lower-cased and trimmed to email_norm); phone_raw
      reduces to exactly 11 digits starting with 1 after stripping +, -, ., spaces and parentheses;
      loyalty_number matches ^LY[0-9]{8}$; postal_code matches ^[0-9]{5}$; name_pair is PASS only
      when BOTH first_name and last_name are non-blank after trim.
    formula: |
      COMPONENT_WEIGHTS = { email_norm: 0.30, phone_norm: 0.20, loyalty_number: 0.20,
                            name_pair: 0.15, postal_code: 0.15 }   # sums to exactly 1.00

      # ---- record_score, selected by SourceSystem.dq_scoring_mode (three distinct formulas) ----
      MODE UNWEIGHTED_MEAN:
          record_score = count(components with PASS) / 5
          # every component counts the same; FAIL and ABSENT are indistinguishable

      MODE WEIGHTED_COMPONENTS:
          record_score = SUM over components with PASS of COMPONENT_WEIGHTS[component]
          # weight base is always the full 1.00; FAIL and ABSENT are still indistinguishable

      MODE PENALIZED_WEIGHTED:
          base    = SUM over components with PASS of COMPONENT_WEIGHTS[component]
          penalty = MALFORMED_PENALTY * count(components with FAIL)
          record_score = max(0.00, base - penalty)
          # the ONLY mode that separates FAIL from ABSENT: a malformed value is worse
          # than a missing one, because a malformed value poisons downstream matching

      record_score is rounded to 2 decimals, round_half_up, before comparison and averaging.

      # ---- record classification ----
      record is VALID  when record_score >= DQ_RECORD_MIN      # inclusive at equality
      record is INVALID when record_score <  DQ_RECORD_MIN
      valid_record_count   = count(VALID records)
      invalid_record_count = record_count - valid_record_count

      # ---- batch score ----
      dq_score = SUM(record_score over ALL records) / record_count
                 rounded to 2 decimals, round_half_up
      # ALL records participate, including INVALID ones — dq_score measures the feed, not
      # the survivors.

      dq_failure_breakdown[component] = count(records where that component is FAIL)
      # ABSENT components never appear in the breakdown counts.
    constants:
      MALFORMED_PENALTY: 0.10
      DQ_RECORD_MIN: 0.60
      W_EMAIL_NORM: 0.30
      W_PHONE_NORM: 0.20
      W_LOYALTY_NUMBER: 0.20
      W_NAME_PAIR: 0.15
      W_POSTAL_CODE: 0.15
    precision: "record_score and dq_score: 2 decimal places, round_half_up"
    variants:
      - name: UNWEIGHTED_MEAN
        when: "SourceSystem.dq_scoring_mode == UNWEIGHTED_MEAN"
        difference: >-
          Every component contributes exactly 1/5; the weight table is ignored entirely, so a
          record missing only email scores the same as a record missing only postal_code.
      - name: WEIGHTED_COMPONENTS
        when: "SourceSystem.dq_scoring_mode == WEIGHTED_COMPONENTS (default)"
        difference: >-
          Passing components contribute their COMPONENT_WEIGHTS share over the fixed 1.00 base,
          so email (0.30) is worth twice postal_code (0.15).
      - name: PENALIZED_WEIGHTED
        when: "SourceSystem.dq_scoring_mode == PENALIZED_WEIGHTED"
        difference: >-
          Starts from the WEIGHTED_COMPONENTS base then subtracts MALFORMED_PENALTY per
          present-but-malformed component and floors at 0.00 — the only mode where FAIL and
          ABSENT diverge.
    worked_example: |
      Three records from one source, scored under all three modes:
        R1 email PASS, phone PASS, loyalty PASS, name PASS, postal PASS
        R2 email PASS, phone FAIL, loyalty ABSENT, name PASS, postal PASS
        R3 email ABSENT, phone PASS, loyalty PASS, name PASS, postal ABSENT
      UNWEIGHTED_MEAN     R1 = 5/5 = 1.00, R2 = 3/5 = 0.60, R3 = 3/5 = 0.60
                          dq_score = (1.00 + 0.60 + 0.60) / 3 = 2.20 / 3 = 0.7333 -> 0.73
                          valid_record_count = 3 (0.60 >= 0.60 twice, inclusive)
      WEIGHTED_COMPONENTS R1 = 1.00, R2 = 0.30 + 0.15 + 0.15 = 0.60,
                          R3 = 0.20 + 0.20 + 0.15 = 0.55
                          dq_score = 2.15 / 3 = 0.716666 -> 0.72
                          valid_record_count = 2 (R3 = 0.55 < 0.60)
      PENALIZED_WEIGHTED  R1 = 1.00, R2 = 0.60 - 0.10 = 0.50, R3 = 0.55 (nothing malformed)
                          dq_score = 2.05 / 3 = 0.683333 -> 0.68
                          valid_record_count = 1
      dq_failure_breakdown is { "phone_norm": 1 } in every mode.

  - name: source_system_dq_pass_rate
    trigger: >-
      Recomputed at the end of every POST /cdp/ingest-batches/{batchId}/validate and at
      POST /cdp/source-systems/{sourceSystemId}/reinstate (which resets the window).
    algorithm: aggregation
    input_set: >-
      IngestBatches whose source_system_id is this source, whose status is in
      {VALIDATED, QUARANTINED, PROMOTED, REJECTED} (i.e. validate has run at least once) and
      whose created_at >= SourceSystem.dq_window_start_at. RECEIVED batches that have never been
      validated are excluded.
    formula: |
      submitted_record_total = SUM(IngestBatch.record_count       over in-window batches)
      valid_record_total     = SUM(IngestBatch.valid_record_count over in-window batches)

      if submitted_record_total == 0:
          dq_pass_rate = 1.0000        # a source with no evidence is presumed clean
      else:
          dq_pass_rate = valid_record_total / submitted_record_total
                         rounded to 4 decimals, round_half_up

      # rate_threshold_triggers: the cumulative-evidence gate
      QUARANTINE when submitted_record_total >= DQ_MIN_SAMPLE
                  AND  dq_pass_rate < SourceSystem.pii_completeness_floor
      # both conditions are strict on their own side: exactly DQ_MIN_SAMPLE records IS
      # enough evidence, and a rate exactly equal to the floor is NOT a failure.

      # reinstate resets the window: dq_window_start_at = logical clock now,
      # submitted_record_total = 0, valid_record_total = 0, dq_pass_rate = 1.0000.
      # Batches created before the reset never count again.
    constants:
      DQ_MIN_SAMPLE: 5
    precision: "4 decimal places, round_half_up"

  - name: identity_match_confidence
    trigger: "POST /cdp/identity-links (explicit candidate) and the probabilistic pass of POST /cdp/ingest-batches/{batchId}/promote"
    algorithm: weighted_scoring
    input_set: >-
      The four similarity values on IdentityLink.evidence — email_similarity, phone_similarity,
      name_similarity, address_similarity — each exactly one of 1.0 (exact), 0.5 (partial),
      0.0 (mismatch) or null (component absent on at least one side of the pair).
    formula: |
      CONFIDENCE_WEIGHTS = { email_similarity: 0.40, phone_similarity: 0.25,
                             name_similarity: 0.20, address_similarity: 0.15 }  # sums to 1.00

      present = { c in CONFIDENCE_WEIGHTS : evidence[c] is not null }
      raw     = SUM over c in present of CONFIDENCE_WEIGHTS[c] * evidence[c]

      VARIANT STRICT_ZERO   (MatchRule.missing_identifier_policy == STRICT_ZERO):
          confidence = raw                               # base is the full 1.00
      VARIANT RENORMALIZE   (MatchRule.missing_identifier_policy == RENORMALIZE):
          base = SUM over c in present of CONFIDENCE_WEIGHTS[c]
          confidence = 0.0000 if base == 0 else raw / base

      confidence is rounded to 4 decimals, round_half_up.

      # threshold gates, evaluated against the minting MatchRule
      confidence <  MatchRule.review_floor         -> link is NOT created (ERR_CONFIDENCE_BELOW_FLOOR)
      confidence >= MatchRule.review_floor         -> link created as PROPOSED   (inclusive)
      confidence >= MatchRule.auto_merge_threshold -> link created and immediately
                                                      auto-CONFIRMED with
                                                      decided_by_user_id = "system" (inclusive)
    constants:
      W_EMAIL_SIMILARITY: 0.40
      W_PHONE_SIMILARITY: 0.25
      W_NAME_SIMILARITY: 0.20
      W_ADDRESS_SIMILARITY: 0.15
    precision: "4 decimal places, round_half_up"
    variants:
      - name: STRICT_ZERO
        when: "MatchRule.missing_identifier_policy == STRICT_ZERO (default)"
        difference: >-
          An absent component is scored as a zero contribution over the full 1.00 weight base, so
          a sparse pair can never reach a high confidence no matter how strong its present
          evidence is.
      - name: RENORMALIZE
        when: "MatchRule.missing_identifier_policy == RENORMALIZE"
        difference: >-
          The denominator shrinks to the weight of the components actually present, so a pair
          matching perfectly on the components it has scores 1.0000 even with two components
          missing. Identical evidence therefore yields a different confidence AND a different
          IdentityLink initial state than STRICT_ZERO.
    worked_example: |
      evidence = { email: 1.0, phone: 1.0, name: 1.0, address: null }, rule thresholds
      review_floor 0.65 / auto_merge_threshold 0.92:
        raw  = 0.40*1.0 + 0.25*1.0 + 0.20*1.0 = 0.8500
        STRICT_ZERO  confidence = 0.8500 -> >= 0.65 and < 0.92 -> PROPOSED (steward review)
        RENORMALIZE  base = 0.40 + 0.25 + 0.20 = 0.85
                     confidence = 0.8500 / 0.85 = 1.0000 -> >= 0.92 -> auto-CONFIRMED (merge runs)
      evidence = { email: 1.0, phone: null, name: 1.0, address: 0.5 }:
        raw  = 0.40 + 0.20 + 0.075 = 0.6750
        STRICT_ZERO  confidence = 0.6750 -> PROPOSED
        RENORMALIZE  base = 0.75, confidence = 0.6750 / 0.75 = 0.9000 -> PROPOSED (0.9000 < 0.92)
      evidence = { email: 1.0, phone: 1.0, name: null, address: null } under STRICT_ZERO:
        confidence = 0.6500, exactly review_floor -> link IS created (inclusive boundary)
      evidence = { email: 1.0, phone: 0.5, name: null, address: 0.5 } under STRICT_ZERO:
        confidence = 0.40 + 0.125 + 0.075 = 0.6000 < 0.65 -> ERR_CONFIDENCE_BELOW_FLOOR (422)

  - name: identity_resolution_pass
    trigger: "POST /cdp/ingest-batches/{batchId}/promote"
    algorithm: chronological
    input_set: >-
      The VALID records of the batch only (record_score >= DQ_RECORD_MIN); INVALID records are
      counted in invalid_record_count and dropped. Candidate Profiles are those whose
      resolution_status != MERGED_AWAY and whose privacy_status == NORMAL. MatchRules must have
      status == ENABLED.
    formula: |
      Records are processed in strict order: event_timestamp ASC, then external_id ASC.
      Ties on both are impossible because external_id is unique within a batch.

      PHASE 1 — deterministic attach (per record, in the order above):
        for each MatchRule with rule_kind == DETERMINISTIC and status == ENABLED,
        ordered by MatchRule.created_at ASC:
            key_field = { EMAIL_NORM: email_norm, PHONE_NORM: phone_norm,
                          LOYALTY_NUMBER: loyalty_number }[rule.deterministic_key]
            if the record's normalized key_field is non-null and exactly one candidate Profile
               has the same value -> ATTACH the record to that Profile, increment
               IngestBatch.matched_deterministic_count, stop scanning rules for this record
            if MORE THAN ONE candidate Profile has that value -> skip this rule and continue
               (an ambiguous deterministic key is left to the probabilistic phase)
        if no rule attached the record -> CREATE a new Profile with resolution_status
            UNRESOLVED, privacy_status NORMAL, source_record_count 1, and increment
            IngestBatch.new_profile_count

      ATTACH semantics: the record's non-null identifiers fill only the Profile fields that are
      currently null (first writer per field wins, which is why chronological order matters);
      source_record_count += 1; contributing_source_system_codes gains the source's code;
      last_activity_at = max(last_activity_at, record.event_timestamp);
      loyalty_tier = max by ordinal over {NONE < SILVER < GOLD < PLATINUM}.

      PHASE 2 — probabilistic candidates (after every record of the batch is placed):
        for each Profile created in PHASE 1, ordered by Profile.created_at ASC:
            for each MatchRule with rule_kind == PROBABILISTIC and status == ENABLED,
            ordered by MatchRule.created_at ASC:
                blocking set = candidate Profiles (excluding this one and excluding profiles
                    already linked to it by a PROPOSED or CONFIRMED IdentityLink) that share a
                    non-null postal_code OR a non-null last_name with it
                for each blocked candidate, ordered by Profile.created_at ASC:
                    evidence is derived by exact/partial comparison of the four components
                    confidence = calculations.identity_match_confidence under this rule's variant
                    if confidence >= rule.review_floor:
                        mint IdentityLink(status PROPOSED, match_method PROBABILISTIC)
                        increment IngestBatch.matched_probabilistic_count
                        if confidence >= rule.auto_merge_threshold:
                            immediately CONFIRM the link (runs calculations.merge_survivorship)
                    else: no link is minted and no counter moves

      PHASE 3 — resolution_status settle:
        every Profile touched by this promote that is not MERGED_AWAY and has no PROPOSED link
        outstanding becomes RESOLVED; a Profile with at least one PROPOSED link stays UNRESOLVED.

      PHASE 4 — household grouping runs per calculations.household_grouping for every Profile
        whose address_hash is non-null and whose household_id is still null.
    constants:
      DQ_RECORD_MIN: 0.60
    precision: "counts are exact integers; confidences follow calculations.identity_match_confidence"

  - name: merge_survivorship
    trigger: "POST /cdp/identity-links/{linkId}/decision with decision == CONFIRM, and the auto-CONFIRM path of promote"
    algorithm: projection
    input_set: >-
      The two Profiles named by IdentityLink.left_profile_id and IdentityLink.right_profile_id,
      both of which must have resolution_status != MERGED_AWAY and privacy_status == NORMAL.
    formula: |
      SURVIVOR SELECTION (first discriminator that separates the pair wins):
        1. higher Profile.source_record_count
        2. higher trust_tier of Profile.primary_source_system_id's SourceSystem
        3. earlier Profile.created_at
      The other profile is the LOSER. (Profile.id is never consulted.)

      FIELD-LEVEL SURVIVORSHIP — for email_norm, phone_norm, first_name, last_name,
      postal_code, address_hash, loyalty_number:
        survivor keeps its own value when non-null; adopts the loser's value only when its own
        is null. The loser's value never overwrites a populated survivor field.

      ROLL-UPS on the survivor:
        source_record_count             += loser.source_record_count
        lifetime_value_cents            += loser.lifetime_value_cents      # CONSERVED
        contributing_source_system_codes = sorted(union of both lists)
        last_activity_at                 = max(both last_activity_at)
        loyalty_tier                     = max by ordinal {NONE<SILVER<GOLD<PLATINUM}
        primary_source_system_id         = the contributing source with the highest trust_tier
                                           (tie-break SourceSystem.created_at ASC)
        channel_engagement_score         = recomputed from the survivor's activatable_channels

      LOSER teardown:
        resolution_status      = MERGED_AWAY
        merged_into_profile_id = survivor.id
        household_id           = null (household membership moves to the survivor)
        lifetime_value_cents   = 0        # the value moved, it did not duplicate
        activatable_channels   = []
        every ACTIVE ConsentRecord of the loser is re-parented to the survivor; if the survivor
        already holds an ACTIVE record in the same (channel, purpose) group, the losing group is
        re-ranked by calculations.effective_channel_consent precedence and the non-rank-1
        records become SUPERSEDED.
        every ACTIVE SuppressionEntry of the loser is re-parented to the survivor unchanged.
        every OTHER PROPOSED IdentityLink touching the loser becomes VOIDED with
        void_reason = SUPERSEDED.

      CONSERVED QUANTITY (compensating invariant):
        SUM(lifetime_value_cents) over Profiles with resolution_status != MERGED_AWAY is
        identical before and after every merge; SUM(source_record_count) over the same set is
        identical too. A merge redistributes, it never creates or destroys.
    precision: "integer cents; no rounding occurs during a merge"

  - name: household_grouping
    trigger: >-
      Phase 4 of POST /cdp/ingest-batches/{batchId}/promote, and re-evaluated whenever a merge or
      a deletion changes a Household's membership.
    algorithm: waterfall_allocation
    input_set: >-
      Households whose address_hash equals the profile's address_hash and whose status == ACTIVE,
      ordered by sequence_no ASC. Members counted are Profiles whose household_id equals the
      household's id and whose resolution_status != MERGED_AWAY and privacy_status != DELETED.
    formula: |
      Given a Profile P with non-null address_hash H:
        buckets = ACTIVE Households with address_hash == H, ordered by sequence_no ASC
        for each bucket in order:
            if bucket.member_count < HOUSEHOLD_MAX_MEMBERS:
                P.household_id = bucket.id; stop          # first bucket with room wins
        if no bucket had room:
            mint a new Household with address_hash = H and
            sequence_no = (max sequence_no over ALL Households with address_hash == H,
                           including DISSOLVED ones) + 1
            P.household_id = new household id
      # Overflow is strictly ordered: the 6th profile at an address joins sequence_no 1, the
      # 7th opens sequence_no 2. A member leaving sequence_no 1 (merge or deletion) reopens
      # that slot, so the NEXT arrival fills the gap rather than extending sequence_no 2.

      DERIVED FIELDS, recomputed on every membership change of the household:
        member_count                  = count(members)
        dominant_last_name            = the most frequent non-null member last_name;
                                        tie-break alphabetical ASC; null when every member
                                        last_name is null
        combined_lifetime_value_cents = SUM(member lifetime_value_cents)

      DISSOLUTION: when member_count reaches 0 the Household transitions ACTIVE -> DISSOLVED and
      is never reused as a bucket again.
    constants:
      HOUSEHOLD_MAX_MEMBERS: 6
    precision: "exact integer counts"

  - name: effective_channel_consent
    trigger: >-
      Recomputed whenever a ConsentRecord is captured or changes status, whenever a
      SuppressionEntry is created or released or expires, whenever Profile.privacy_status
      changes, and at every activation dispatch or resume.
    algorithm: projection
    input_set: >-
      For a Profile P, channel C and instant NOW (the logical clock): ConsentRecords with
      profile_id == P.id, channel == C, purpose == MARKETING, status IN {ACTIVE, SUPERSEDED}
      (EXPIRED and TOMBSTONED records never qualify),
      captured_at <= NOW and (expires_at is null OR expires_at > NOW); plus SuppressionEntries
      with profile_id == P.id, status == ACTIVE, effective_at <= NOW and
      (expires_at is null OR expires_at > NOW).
    formula: |
      STEP 1 — hard gates, evaluated in this order; the first gate that fires returns OPT_OUT
      and no election is consulted:
        1a. P.privacy_status != NORMAL                        -> OPT_OUT on every channel
        1b. an in-window ACTIVE SuppressionEntry whose entry_type is in
            {PRIVACY_DELETE, GLOBAL_OPT_OUT, LEGAL_HOLD}      -> OPT_OUT on every channel
        1c. an in-window ACTIVE SuppressionEntry whose entry_type == DO_NOT_SELL
                                                              -> OPT_OUT on ADVERTISING only
                                                                 (other channels fall through)
      # window semantics are half-open: effective_at is INCLUSIVE, expires_at is EXCLUSIVE, so
      # an entry whose expires_at == NOW no longer suppresses.

      STEP 2 — election precedence over the qualifying ConsentRecords, ranked:
        captured_at DESC,
        then SourceSystem.trust_tier DESC (of the record's source_system_id),
        then ConsentRecord.created_at ASC
        precedence_rank 1 is the winner; its consent_state is the election, and that record is the
        only one in the group whose status is ACTIVE. Every other record in the group carries
        precedence_rank 2, 3, ... in that order and status SUPERSEDED.

      STEP 3 — default: when the qualifying set is empty the channel resolves to OPT_OUT.
      Consent is opt-in only; silence never authorises activation.

      RESULT: channel C is activatable for P iff the resolution is OPT_IN.
      Profile.activatable_channels = sorted([C for C in {ADVERTISING, DIRECT_MAIL, EMAIL, PUSH,
      SMS} if resolve(P, C) == OPT_IN]) (alphabetical ASC).
      Profile.channel_engagement_score = len(activatable_channels) / 5 rounded to 2 decimals,
      round_half_up.
    precision: "channel_engagement_score: 2 decimal places, round_half_up"
    worked_example: |
      P has three EMAIL/MARKETING records, all in-window, captured in the order R2, R3, R1:
        R1 OPT_IN  captured_at 2026-08-10T00:00:00Z, source trust_tier 2, created 3rd
        R2 OPT_OUT captured_at 2026-08-12T00:00:00Z, source trust_tier 1, created 1st
        R3 OPT_IN  captured_at 2026-08-12T00:00:00Z, source trust_tier 4, created 2nd
      Ranking: R2 and R3 tie on captured_at, so trust_tier DESC puts R3 (tier 4) at rank 1
      (status ACTIVE), R2 at rank 2 and R1 at rank 3 (both SUPERSEDED). The election is OPT_IN,
      so EMAIL is activatable.
      Adding an ACTIVE DO_NOT_SELL entry does NOT change EMAIL — it only removes ADVERTISING.
      Adding an ACTIVE GLOBAL_OPT_OUT entry removes every channel and
      activatable_channels becomes [] with channel_engagement_score 0.00.

  - name: segment_membership_set
    trigger: >-
      POST /cdp/segments/{segmentId}/submit-for-review, POST /cdp/activations/{activationId}/dispatch,
      POST /cdp/activations/{activationId}/resume, GET /cdp/segments/{segmentId}/overlap and
      GET /cdp/segments/{segmentId}/performance.
    algorithm: constraint_propagation
    input_set: >-
      Profiles with resolution_status != MERGED_AWAY and privacy_status == NORMAL. A MERGED_AWAY
      profile is never a member — its attributes now live on the survivor — and a profile in any
      non-NORMAL privacy_status is excluded regardless of its attributes.
    formula: |
      A Profile P is a member iff EVERY criterion in Segment.criteria holds (logical AND over
      1..6 predicates). Criteria are evaluated left-to-right and short-circuit on the first
      failure. Per-operator semantics against attribute A = P[criterion.attribute]:
        EQ  : A is not null AND A == criterion.value              (string/enum exact, case-sensitive)
        GTE : A is not null AND A >= criterion.value              (numeric; lifetime_value_cents
              and channel_engagement_score only; loyalty_tier uses the ordinal
              NONE=0 < SILVER=1 < GOLD=2 < PLATINUM=3)
        IN  : A is not null AND A is an element of criterion.value (non-empty array)
      A null attribute NEVER satisfies any operator — absence is not a match.

      member_count = |members|
      SENSITIVE_ATTRIBUTES = { inferred_health_interest, inferred_ethnicity_affinity,
                               precise_geolocation_grid }
      uses_sensitive_attributes = any criterion.attribute in SENSITIVE_ATTRIBUTES
      # membership evaluation is identical for sensitive and non-sensitive attributes;
      # governance gates ACTIVATION, never membership.

      PROPAGATION: any change that moves a Profile in or out of the input set (a merge setting
      resolution_status = MERGED_AWAY, a suppression setting privacy_status = SUPPRESSED, a
      conversion raising lifetime_value_cents, a consent change moving
      channel_engagement_score) re-derives member_count for every non-RETIRED Segment whose
      criteria touch the changed attribute, and re-derives Household.member_count where relevant.
      The recompute reaches a fixed point in one pass because criteria never reference another
      segment's membership.
    precision: "exact integer counts"

  - name: activation_audience_resolution
    trigger: "POST /cdp/activations/{activationId}/dispatch and POST /cdp/activations/{activationId}/resume"
    algorithm: waterfall_allocation
    input_set: >-
      calculations.segment_membership_set for the activation's Segment, evaluated against the
      Destination's channel and hashing_algorithm at the instant of the call.
    formula: |
      candidates = calculations.segment_membership_set(activation.segment)
      candidate_count = |candidates|

      audience = [ P in candidates
                   if Destination.channel is an element of P.activatable_channels ]
      audience_size    = |audience|
      suppressed_count = candidate_count - audience_size

      required_identifier = { SHA256_EMAIL_LOWER: email_norm,
                              SHA256_PHONE_E164 : phone_norm }[Destination.hashing_algorithm]
      dispatched_hash_count = count(P in audience where P[required_identifier] is not null)
      # An audience member without the destination's required identifier is silently skipped:
      # it counts toward audience_size (so it satisfies k-anonymity) but produces no hash and
      # consumes no quota. dispatched_hash_count <= audience_size always holds.

      GATES, evaluated in this order after the counts are known:
        audience_size >= 1                                    else ERR_EMPTY_AUDIENCE (422)
        audience_size >= Destination.min_audience_size         else ERR_AUDIENCE_BELOW_K_ANONYMITY (422)
        dispatched_hash_count <= Destination.remaining_daily_hash_quota
                                                               else ERR_HASH_QUOTA_EXCEEDED (409)
      # all three comparisons are inclusive at equality on the passing side.

      QUOTA LEDGER (compensating invariant):
        dispatch / resume : remaining_daily_hash_quota -= dispatched_hash_count
        pause / terminate-from-delivering : remaining_daily_hash_quota += dispatched_hash_count
        INVARIANT: remaining_daily_hash_quota == daily_hash_quota
                   - SUM(dispatched_hash_count over this destination's Activations whose status
                     is in {DISPATCHED, ACTIVE, UNDERPERFORMING})
        holds after every operation, for as long as quota_reset_on is unchanged.
    precision: "exact integer counts"

  - name: activation_match_rate
    trigger: "POST /cdp/activations/{activationId}/match-report"
    algorithm: threshold
    input_set: >-
      Activation.dispatched_hash_count (fixed at dispatch) with vendor_matched_count and
      unusable_hash_count as reported by the destination platform in this call.
    formula: |
      VARIANT GROSS:
          gross_match_rate = 0.0000 if dispatched_hash_count == 0
                             else vendor_matched_count / dispatched_hash_count
      VARIANT NET:
          usable = dispatched_hash_count - unusable_hash_count
          net_match_rate = 0.0000 if usable <= 0 else vendor_matched_count / usable

      Both are rounded to 4 decimals, round_half_up, and both are ALWAYS stored on the
      activation. The one that drives the state machine is selected per destination:
          effective_match_rate = gross_match_rate if Destination.match_rate_basis == GROSS
                                 else net_match_rate

      THRESHOLD:
          effective_match_rate >= Destination.min_match_rate -> ACTIVE          (inclusive)
          effective_match_rate <  Destination.min_match_rate -> UNDERPERFORMING

      REPORT VALIDITY (checked before any rate is computed):
          vendor_matched_count + unusable_hash_count <= dispatched_hash_count
          else ERR_MATCH_REPORT_EXCEEDS_DISPATCH (422)
    precision: "4 decimal places, round_half_up"
    variants:
      - name: GROSS
        when: "Destination.match_rate_basis == GROSS (default)"
        difference: >-
          Divides by everything that was sent, so hashes the platform could not even parse count
          against the marketer. The destination carries no credit for its own data hygiene.
      - name: NET
        when: "Destination.match_rate_basis == NET"
        difference: >-
          Removes unusable_hash_count from the denominator, so the rate measures only the hashes
          the platform could actually evaluate. Identical report data therefore yields a higher
          rate and can land the activation in a DIFFERENT state than GROSS.
    worked_example: |
      dispatched_hash_count = 800, vendor_matched_count = 540, unusable_hash_count = 100,
      Destination.min_match_rate = 0.70:
        gross_match_rate = 540 / 800 = 0.6750
        net_match_rate   = 540 / 700 = 0.7714285... -> 0.7714
        basis GROSS -> effective 0.6750 < 0.70 -> UNDERPERFORMING
        basis NET   -> effective 0.7714 >= 0.70 -> ACTIVE
      A report of vendor_matched_count = 560, unusable_hash_count = 0 gives
      gross = 560/800 = 0.7000 exactly, which is ACTIVE on the inclusive boundary.

  - name: segment_performance_attribution
    trigger: "GET /cdp/segments/{segmentId}/performance"
    algorithm: chronological
    input_set: >-
      Every Activation whose segment_id is this segment and whose status != DRAFT (a DRAFT
      activation has never delivered). Within those, every element of
      Activation.attributed_conversions whose converted_at >= Segment.approved_at. When
      Segment.approved_at is null the input set is empty and every output is zero.
    formula: |
      conversions = [ (c, a) for each qualifying Activation a, each c in a.attributed_conversions
                      if c.converted_at >= a_segment.approved_at ]
      ordered by c.converted_at ASC, then a.created_at ASC, then the element's index within
      a.attributed_conversions ASC.

      VARIANT TOTAL:
          conversion_count         = |conversions|
          attributed_revenue_cents = SUM(c.revenue_cents over conversions)
      VARIANT INCREMENTAL:
          first_touch = the FIRST conversion per distinct c.profile_id in the order above
          conversion_count         = |first_touch|
          attributed_revenue_cents = SUM(c.revenue_cents over first_touch)
      # INCREMENTAL credits a converter once; every repeat purchase inside the window is
      # treated as retained, not incremental, revenue. Because the "first" element is picked in
      # chronological order, the two variants diverge whenever any profile converts twice.

      COMMON OUTPUTS (identical under both variants):
          unique_converter_count = |distinct c.profile_id over conversions|
          member_count           = calculations.segment_membership_set(segment) size at read time

      revenue_per_member_cents = 0 if member_count == 0
                                 else round_half_up(attributed_revenue_cents / member_count)
                                 # integer cents
      # PINNED ROUNDING ORDER (sum-then-divide-then-round-ONCE). The division is applied to the
      # already-summed attributed_revenue_cents and rounded exactly once at the very end. The
      # tempting alternative — round_half_up(c.revenue_cents / member_count) per conversion and
      # then sum those per-conversion shares — is explicitly NOT the rule and yields a different
      # integer: with member_count 3 and three conversions of 100 cents each the pinned order
      # gives round_half_up(300 / 3) = 100 while the per-conversion order gives 33 + 33 + 33 = 99.
      # Implementations must reproduce 100.
    precision: >-
      revenue_per_member_cents: integer cents, round_half_up, rounded exactly once after the
      summation and division (see PINNED ROUNDING ORDER); counts are exact
    variants:
      - name: TOTAL
        when: "the request's attribution_basis query parameter is TOTAL (default)"
        difference: "Counts every attributed conversion, including repeat purchases by the same profile."
      - name: INCREMENTAL
        when: "the request's attribution_basis query parameter is INCREMENTAL"
        difference: >-
          Counts only each profile's chronologically first conversion in the window, so both
          conversion_count and attributed_revenue_cents fall below TOTAL whenever any profile
          converted more than once.
    worked_example: |
      Segment.approved_at = 2026-08-05T00:00:00Z, member_count = 200, one ACTIVE activation with
      attributed_conversions:
        {P1, 2026-08-06T00:00:00Z, 12000}
        {P1, 2026-08-09T00:00:00Z,  8000}
        {P2, 2026-08-07T00:00:00Z,  5000}
        {P3, 2026-08-08T00:00:00Z, 15000}
      TOTAL       conversion_count 4, attributed_revenue_cents 40000,
                  unique_converter_count 3, revenue_per_member_cents 40000/200 = 200
      INCREMENTAL first_touch = P1@08-06 12000, P2 5000, P3 15000
                  conversion_count 3, attributed_revenue_cents 32000,
                  unique_converter_count 3, revenue_per_member_cents 32000/200 = 160

  - name: audience_overlap
    trigger: "GET /cdp/segments/{segmentId}/overlap?other_segment_id={otherId}"
    algorithm: aggregation
    input_set: >-
      calculations.segment_membership_set for both segments, computed at read time. Both segments
      must exist and neither may be RETIRED. The two ids must differ
      (else ERR_OVERLAP_SAME_SEGMENT).
    formula: |
      A = members(this segment); B = members(other segment)
      segment_member_count       = |A|
      other_segment_member_count = |B|
      overlap_count              = |A ∩ B|
      union_count                = |A| + |B| - overlap_count

      jaccard_index         = 0.0000 if union_count == 0
                              else overlap_count / union_count       (4 decimals, round_half_up)
      containment_in_other  = 0.0000 if |A| == 0
                              else overlap_count / |A|               (4 decimals, round_half_up)
      containment_of_other  = 0.0000 if |B| == 0
                              else overlap_count / |B|               (4 decimals, round_half_up)
      # jaccard_index is symmetric; the two containment ratios are not, and swapping the two
      # segment ids swaps them.
    precision: "4 decimal places, round_half_up"
    worked_example: |
      |A| = 120, |B| = 80, overlap_count = 30:
        union_count = 120 + 80 - 30 = 170
        jaccard_index = 30 / 170 = 0.1764705... -> 0.1765
        containment_in_other = 30 / 120 = 0.2500
        containment_of_other = 30 /  80 = 0.3750

# =============================================================================
# §1.4 Validation Rules Table (evaluated in strict priority order; the FIRST
#      violated rule determines the response — lower priority number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-blank."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared §1.7 roles AND that role appears in the endpoint's §1.5 roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: >-
      On POST /cdp/activations/{activationId}/match-report and
      POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge, X-User-ID equals the
      destination_id of the target activation / task. A DestinationPlatform may only report on
      its own deliveries.
    error_id: ERR_DESTINATION_ACTOR_MISMATCH
    http_status: 403
    applies_to: "POST /cdp/activations/{activationId}/match-report, POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge"

  - priority: 4
    category: business_constraint
    check: >-
      Request body shape: every required input field present and non-null, every field the
      declared type, every enum value in its declared set, every numeric value inside its declared
      range and decimal width, every string matching its declared regex and length bounds, every
      array inside its declared cardinality bounds, and every query parameter (limit 1..100,
      offset >= 0, attribution_basis in {TOTAL, INCREMENTAL}) well-formed.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "The SourceSystem named by the path or by source_system_id exists."
    error_id: ERR_SOURCE_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {sourceSystemId} or a source_system_id body field"

  - priority: 6
    category: existence
    check: "The IngestBatch named by {batchId} exists."
    error_id: ERR_INGEST_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {batchId}"

  - priority: 7
    category: existence
    check: "Every Profile named by {profileId}, profile_id, left_profile_id or right_profile_id exists."
    error_id: ERR_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {profileId} or a profile-id body field"

  - priority: 8
    category: existence
    check: "The Household named by {householdId} exists."
    error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    applies_to: "GET /cdp/households/{householdId}, POST /cdp/profiles/{profileId}/household-assignment (the household_id body field)"

  - priority: 9
    category: existence
    check: "The MatchRule named by {matchRuleId} or match_rule_id exists."
    error_id: ERR_MATCH_RULE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {matchRuleId} or match_rule_id"

  - priority: 10
    category: existence
    check: "The IdentityLink named by {linkId} exists."
    error_id: ERR_IDENTITY_LINK_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {linkId}"

  - priority: 11
    category: existence
    check: "The ConsentRecord named by {consentRecordId} exists."
    error_id: ERR_CONSENT_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /cdp/consent-records/{consentRecordId}"

  - priority: 12
    category: existence
    check: "The SuppressionEntry named by {suppressionId} exists."
    error_id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {suppressionId}"

  - priority: 13
    category: existence
    check: "The Segment named by {segmentId}, segment_id or the other_segment_id query parameter exists."
    error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {segmentId}, segment_id or other_segment_id"

  - priority: 14
    category: existence
    check: "The Destination named by {destinationId} or destination_id exists."
    error_id: ERR_DESTINATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {destinationId} or destination_id"

  - priority: 15
    category: existence
    check: "The Activation named by {activationId} exists."
    error_id: ERR_ACTIVATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {activationId}"

  - priority: 16
    category: existence
    check: "The DeletionRequest named by {deletionRequestId} exists."
    error_id: ERR_DELETION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {deletionRequestId}"

  - priority: 17
    category: existence
    check: "The VendorDeletionTask named by {taskId} exists."
    error_id: ERR_VENDOR_TASK_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking {taskId}"

  - priority: 18
    category: business_referential
    check: "expected_profile_version equals the target Profile's current version (§1.2.1 consent-capture-stale-profile)."
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412
    applies_to: "POST /cdp/consent-records"

  - priority: 19
    category: business_referential
    check: "expected_segment_version equals the target Segment's current version (§1.2.1 activation-create-stale-segment)."
    error_id: ERR_STALE_SEGMENT_VERSION
    http_status: 412
    applies_to: "POST /cdp/activations"

  - priority: 20
    category: business_referential
    check: "expected_deletion_request_version equals the target DeletionRequest's current version (§1.2.1 propagate-stale-deletion-request)."
    error_id: ERR_STALE_DELETION_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /cdp/deletion-requests/{deletionRequestId}/propagate"

  - priority: 21
    category: state
    check: >-
      The target entity's status permits the requested transition per its §1.2 machine — including
      terminal-state lockdown (a REJECTED IngestBatch, a RETIRED Segment, a TERMINATED Activation,
      a VERIFIED DeletionRequest and an ACKNOWLEDGED VendorDeletionTask accept nothing) and
      idempotency (a second identical trigger from the new state is rejected, never a silent no-op).
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 22
    category: state
    check: >-
      No Profile referenced as a link endpoint, consent subject, suppression subject, deletion
      subject or segment member has resolution_status == MERGED_AWAY. Writes must target the
      survivor.
    error_id: ERR_PROFILE_MERGED_AWAY
    http_status: 409
    applies_to: "POST /cdp/consent-records, POST /cdp/suppression-entries, POST /cdp/identity-links, POST /cdp/deletion-requests"

  - priority: 23
    category: state
    check: >-
      SourceSystem.status != QUARANTINED when creating an IngestBatch against it, when validating
      one of its batches, when promoting one of its batches and when capturing a ConsentRecord that
      names it. A REGISTERED source may still ingest — it reaches ACTIVE on its first successful
      promote — but a QUARANTINED source accepts nothing until it is reinstated.
    error_id: ERR_SOURCE_SYSTEM_QUARANTINED
    http_status: 409
    applies_to: "POST /cdp/ingest-batches, POST /cdp/ingest-batches/{batchId}/validate, POST /cdp/ingest-batches/{batchId}/promote, POST /cdp/consent-records"

  - priority: 24
    category: state
    check: "MatchRule.status == ENABLED when the rule is named on a link creation or used by a promote pass."
    error_id: ERR_MATCH_RULE_DISABLED
    http_status: 409
    applies_to: "POST /cdp/identity-links"

  - priority: 25
    category: state
    check: "Destination.status == ACTIVE when creating, dispatching or resuming an Activation against it."
    error_id: ERR_DESTINATION_INACTIVE
    http_status: 409
    applies_to: "POST /cdp/activations, POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 26
    category: business_safety
    check: >-
      No Profile referenced by the write has privacy_status == DELETED. A tombstoned subject can
      never acquire new consent, links, suppressions or deletion requests — erasure is final.
    error_id: ERR_PROFILE_DELETED
    http_status: 409
    applies_to: "POST /cdp/consent-records, POST /cdp/identity-links, POST /cdp/identity-links/{linkId}/decision, POST /cdp/deletion-requests, POST /cdp/suppression-entries"

  - priority: 27
    category: business_safety
    check: >-
      No in-window ACTIVE SuppressionEntry of the subject has entry_type == LEGAL_HOLD when
      propagating a DeletionRequest. A legal hold outranks the erasure right; the request is
      recorded as BLOCKED_LEGAL_HOLD and the call fails.
    error_id: ERR_LEGAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /cdp/deletion-requests/{deletionRequestId}/propagate"

  - priority: 28
    category: business_safety
    check: >-
      Segregation of duties on X-User-ID. (a) The user recording a Segment governance decision is
      not the user who submitted it. (b) The PrivacyOfficer releasing a LEGAL_HOLD SuppressionEntry
      is not the user recorded in created_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cdp/segments/{segmentId}/governance-decision, POST /cdp/suppression-entries/{suppressionId}/release"

  - priority: 29
    category: business_safety
    check: >-
      A Segment whose uses_sensitive_attributes is true carries a governance_justification of at
      least 10 characters after trim when submitted for review, and its APPROVE decision carries
      sensitive_use_approved == true.
    error_id: ERR_GOVERNANCE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /cdp/segments/{segmentId}/submit-for-review, POST /cdp/segments/{segmentId}/governance-decision"

  - priority: 30
    category: business_safety
    check: >-
      Segment.status == APPROVED and logical clock now < Segment.governance_expires_at when
      dispatching or resuming an Activation. DRAFT, PENDING_GOVERNANCE_REVIEW, GOVERNANCE_EXPIRED
      and RETIRED audiences may not leave the platform.
    error_id: ERR_GOVERNANCE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 31
    category: business_safety
    check: >-
      When Segment.uses_sensitive_attributes is true, both Segment.sensitive_use_approved and
      Destination.sensitive_attribute_permitted are true.
    error_id: ERR_SENSITIVE_ATTRIBUTE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /cdp/activations, POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 32
    category: business_safety
    check: "audience_size >= 1 at dispatch or resume — an audience emptied by consent or suppression cannot be delivered."
    error_id: ERR_EMPTY_AUDIENCE
    http_status: 422
    applies_to: "POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 33
    category: business_safety
    check: "audience_size >= Destination.min_audience_size (inclusive at equality) — the k-anonymity floor."
    error_id: ERR_AUDIENCE_BELOW_K_ANONYMITY
    http_status: 422
    applies_to: "POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 34
    category: business_constraint
    check: "SourceSystem.code, MatchRule.code and Destination.code are each unique within their entity."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /cdp/source-systems, POST /cdp/match-rules, POST /cdp/destinations"

  - priority: 35
    category: business_constraint
    check: "external_id is unique across the records array of a single IngestBatch."
    error_id: ERR_DUPLICATE_EXTERNAL_ID
    http_status: 422
    applies_to: "POST /cdp/ingest-batches"

  - priority: 36
    category: business_constraint
    check: "MatchRule.auto_merge_threshold > MatchRule.review_floor (strict)."
    error_id: ERR_INVALID_THRESHOLD_ORDER
    http_status: 422
    applies_to: "POST /cdp/match-rules"

  - priority: 37
    category: business_constraint
    check: >-
      deterministic_key is non-null when rule_kind == DETERMINISTIC and null when
      rule_kind == PROBABILISTIC.
    error_id: ERR_DETERMINISTIC_KEY_MISMATCH
    http_status: 422
    applies_to: "POST /cdp/match-rules"

  - priority: 38
    category: business_constraint
    check: "left_profile_id != right_profile_id."
    error_id: ERR_SELF_LINK_FORBIDDEN
    http_status: 422
    applies_to: "POST /cdp/identity-links"

  - priority: 39
    category: business_constraint
    check: >-
      No IdentityLink with status in {PROPOSED, CONFIRMED} already joins the same unordered pair
      of profiles, in either order.
    error_id: ERR_DUPLICATE_IDENTITY_LINK
    http_status: 409
    applies_to: "POST /cdp/identity-links"

  - priority: 40
    category: business_constraint
    check: >-
      The confidence computed by calculations.identity_match_confidence is >=
      MatchRule.review_floor (inclusive at equality).
    error_id: ERR_CONFIDENCE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /cdp/identity-links"

  - priority: 41
    category: business_constraint
    check: "vendor_matched_count + unusable_hash_count <= Activation.dispatched_hash_count."
    error_id: ERR_MATCH_REPORT_EXCEEDS_DISPATCH
    http_status: 422
    applies_to: "POST /cdp/activations/{activationId}/match-report"

  - priority: 42
    category: business_constraint
    check: "other_segment_id differs from {segmentId} on the overlap read."
    error_id: ERR_OVERLAP_SAME_SEGMENT
    http_status: 422
    applies_to: "GET /cdp/segments/{segmentId}/overlap"

  - priority: 43
    category: business_temporal
    check: >-
      Interval ordering: Activation.window_end_at > window_start_at; SuppressionEntry.expires_at >
      effective_at when present; ConsentRecord.expires_at > captured_at when present.
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /cdp/activations, POST /cdp/suppression-entries, POST /cdp/consent-records"

  - priority: 44
    category: business_temporal
    check: "ConsentRecord.captured_at <= the logical clock now — an election cannot be captured in the future."
    error_id: ERR_FUTURE_CAPTURED_AT
    http_status: 422
    applies_to: "POST /cdp/consent-records"

  - priority: 45
    category: business_temporal
    check: >-
      HALF-OPEN OVERLAP on the Profile resource: no existing ACTIVE SuppressionEntry of the SAME
      profile_id and SAME entry_type has a window that overlaps the new one. Windows are
      [effective_at, expires_at) — inclusive start, EXCLUSIVE end — so a new entry whose
      effective_at equals an existing entry's expires_at is accepted (touching, not overlapping),
      and a null expires_at means the window extends forever.
    error_id: ERR_SUPPRESSION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cdp/suppression-entries"

  - priority: 46
    category: business_temporal
    check: >-
      CLOSED-INTERVAL GAP on the Destination resource, judged ONLY between windows that do not
      intersect. Windows are [window_start_at, window_end_at] — BOTH endpoints inclusive — so two
      windows that merely touch at a single instant DO intersect. For every existing
      non-TERMINATED Activation on the same destination whose window is disjoint from the new one,
      the two must be separated by at least Destination.cooldown_minutes of clear time, measured
      end-to-start in both directions and inclusive at equality:
      new.window_start_at >= other.window_end_at + cooldown_minutes OR
      other.window_start_at >= new.window_end_at + cooldown_minutes.
      SCOPE BOUNDARY: intersecting windows are never a cooldown violation — simultaneous coverage
      is governed solely by the concurrency cap at priority 47, which is what makes
      Destination.max_concurrent_activations meaningful. A cooldown_minutes of 0 therefore imposes
      no separation requirement at all.
    error_id: ERR_ACTIVATION_COOLDOWN_VIOLATION
    http_status: 409
    applies_to: "POST /cdp/activations"

  - priority: 47
    category: business_temporal
    check: >-
      Concurrency cap on the Destination resource: no instant may be covered by more than
      Destination.max_concurrent_activations activation windows in {DRAFT, DISPATCHED, ACTIVE,
      UNDERPERFORMING, PAUSED}. Evaluated by sweeping the closed intervals; a window that only
      touches another at an endpoint still counts as covering that instant.
    error_id: ERR_ACTIVATION_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /cdp/activations"

  - priority: 48
    category: business_fiscal
    check: >-
      dispatched_hash_count <= Destination.remaining_daily_hash_quota (inclusive at equality) at
      dispatch and at resume.
    error_id: ERR_HASH_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /cdp/activations/{activationId}/dispatch, POST /cdp/activations/{activationId}/resume"

  - priority: 49
    category: business_fiscal
    check: >-
      IngestBatch.retry_round < MAX_RETRY_ROUNDS (2) when requeuing a QUARANTINED batch; the third
      requeue attempt is refused and the batch is driven to REJECTED with rejection_reason
      RETRY_LIMIT_REACHED.
    error_id: ERR_RETRY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /cdp/ingest-batches/{batchId}/requeue"

  - priority: 50
    category: state
    check: >-
      On POST /cdp/profiles/{profileId}/household-assignment the target Household.status == ACTIVE
      and its address_hash equals the profile's address_hash. A DISSOLVED household is never reused.
    error_id: ERR_INVALID_HOUSEHOLD_STATE
    http_status: 409
    applies_to: "POST /cdp/profiles/{profileId}/household-assignment"

  - priority: 51
    category: business_constraint
    check: >-
      On POST /cdp/profiles/{profileId}/household-assignment the target Household.member_count <
      HOUSEHOLD_MAX_MEMBERS (6) before the assignment.
    error_id: ERR_HOUSEHOLD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cdp/profiles/{profileId}/household-assignment"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- system ---
  - method: POST
    path: "/cdp/_clock/set_current_utc"
    description: >-
      Test-driving endpoint (§1.5 priority-ladder rung 3): sets the server's logical UTC clock to
      an arbitrary instant so that expiry, SLA, cooldown and retention rules are deterministic.
      MANDATORY STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly
      2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time. Every
      "logical clock now" reference in §1.2, §1.3 and §1.4 resolves against this clock.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock is set; no entity is mutated and no version is incremented"]

  - method: POST
    path: "/cdp/retention-runs"
    description: >-
      Runs the four retention/expiry steps in this fixed order against the logical clock now.
      Step 1 expires ConsentRecords whose expires_at <= now (ACTIVE -> EXPIRED) and re-ranks the
      affected (profile, channel, purpose) groups. Step 2 expires SuppressionEntries whose
      expires_at <= now (ACTIVE -> EXPIRED) and lifts Profile.privacy_status back to NORMAL when
      no ACTIVE entry remains. Step 3 times out VendorDeletionTasks whose ack_deadline_at <= now
      (DISPATCHED -> TIMED_OUT) and bubbles their parents to PARTIALLY_VERIFIED. Step 4 expires
      Segment approvals whose governance_expires_at <= now (APPROVED -> GOVERNANCE_EXPIRED) and
      pauses their delivering Activations. It also resets Destination.remaining_daily_hash_quota
      to daily_hash_quota and rewrites quota_reset_on whenever the run's UTC date differs from
      quota_reset_on.
    roles: [DataPlatformAdmin]
    code: 201
    input: []
    output: "{ run_at: string, expired_consent_record_count: integer, expired_suppression_entry_count: integer, timed_out_vendor_task_count: integer, partially_verified_deletion_request_count: integer, governance_expired_segment_count: integer, paused_activation_count: integer, quota_reset_destination_count: integer }"
    side_effects:
      - "ConsentRecord ACTIVE -> EXPIRED and precedence_rank re-derivation (step 1)"
      - "SuppressionEntry ACTIVE -> EXPIRED and Profile SUPPRESSED/LEGAL_HOLD -> NORMAL (step 2)"
      - "VendorDeletionTask DISPATCHED -> TIMED_OUT and DeletionRequest PROPAGATING -> PARTIALLY_VERIFIED (step 3)"
      - "Segment APPROVED -> GOVERNANCE_EXPIRED and Activation -> PAUSED with quota refund (step 4)"
      - "Destination.remaining_daily_hash_quota reset on a new UTC day; increments Destination.version by 1 when reset"
      - "increments the version of every entity it mutates by 1"

  # --------------------------------------------------------- source systems ---
  - method: POST
    path: "/cdp/source-systems"
    description: "Registers a retail feed. Starts REGISTERED with a fresh data-quality window anchored at the logical clock now."
    roles: [DataPlatformAdmin]
    code: 201
    input: ["code", "display_name", "channel_type", "trust_tier?", "dq_scoring_mode?", "pii_completeness_floor?"]
    output: SourceSystem
    side_effects:
      - "sets status = REGISTERED, dq_window_start_at = logical clock now, dq_pass_rate = 1.0, quarantine_count = 0"

  - method: GET
    path: "/cdp/source-systems/{sourceSystemId}"
    description: "Reads one source system including its rolling data-quality totals."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: SourceSystem
    side_effects: []

  - method: GET
    path: "/cdp/source-systems"
    description: "Lists source systems, newest first by created_at DESC."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["status?", "channel_type?", "limit?", "offset?"]
    output: SourceSystem[]
    side_effects: []

  - method: POST
    path: "/cdp/source-systems/{sourceSystemId}/reinstate"
    description: "Lifts a QUARANTINED source back to ACTIVE and resets its data-quality window."
    roles: [DataPlatformAdmin]
    code: 200
    input: []
    output: SourceSystem
    side_effects:
      - "status QUARANTINED -> ACTIVE"
      - "dq_window_start_at = logical clock now, submitted_record_total = 0, valid_record_total = 0, dq_pass_rate = 1.0"
      - "last_reinstated_at = logical clock now"
      - "increments SourceSystem.version by 1"

  # ---------------------------------------------------------- ingest batches ---
  - method: POST
    path: "/cdp/ingest-batches"
    description: "Submits a raw record batch from a source system. Rejected when the source is QUARANTINED."
    roles: [DataEngineer]
    code: 201
    input: [source_system_id, batch_label, records]
    output: IngestBatch
    side_effects:
      - "sets status = RECEIVED, record_count = len(records), retry_round = 0, dq_score = null"

  - method: GET
    path: "/cdp/ingest-batches/{batchId}"
    description: "Reads one batch including its data-quality score, counters and failure breakdown."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: IngestBatch
    side_effects: []

  - method: GET
    path: "/cdp/ingest-batches"
    description: "Lists batches; the source_system_id filter is the reverse traversal of IngestBatch.source_system_id."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["source_system_id?", "status?", "limit?", "offset?"]
    output: IngestBatch[]
    side_effects: []

  - method: POST
    path: "/cdp/ingest-batches/{batchId}/validate"
    description: "Scores every record and the batch per calculations.batch_data_quality_score, then routes the batch to VALIDATED or QUARANTINED."
    roles: [DataEngineer]
    code: 200
    input: []
    output: IngestBatch
    side_effects:
      - "writes dq_score, valid_record_count, invalid_record_count, dq_failure_breakdown, validated_at"
      - "status RECEIVED -> VALIDATED when dq_score >= SourceSystem.pii_completeness_floor, else RECEIVED -> QUARANTINED"
      - "recomputes SourceSystem.submitted_record_total, valid_record_total and dq_pass_rate"
      - "may drive the SourceSystem to QUARANTINED, which cascades every RECEIVED batch of that source to REJECTED"
      - "increments IngestBatch.version and SourceSystem.version by 1"

  - method: POST
    path: "/cdp/ingest-batches/{batchId}/requeue"
    description: "Returns a QUARANTINED batch to RECEIVED for another validation round, or rejects it when the retry budget is spent."
    roles: [DataEngineer]
    code: 200
    input: []
    output: IngestBatch
    side_effects:
      - "when retry_round < 2: status QUARANTINED -> RECEIVED, retry_round += 1, dq_score = null, dq_failure_breakdown = {}"
      - "when retry_round == 2: status QUARANTINED -> REJECTED with rejection_reason = RETRY_LIMIT_REACHED and the call answers ERR_RETRY_LIMIT_REACHED"
      - "increments IngestBatch.version by 1"

  - method: POST
    path: "/cdp/ingest-batches/{batchId}/promote"
    description: >-
      Promotes a VALIDATED batch into the profile graph, running the four phases of
      calculations.identity_resolution_pass and materialising each record's consent_signals into
      ConsentRecords.
    roles: [DataEngineer]
    code: 200
    input: []
    output: IngestBatch
    side_effects:
      - "status VALIDATED -> PROMOTED and promoted_at = logical clock now"
      - "writes new_profile_count, matched_deterministic_count, matched_probabilistic_count"
      - "creates Profiles, attaches records, mints IdentityLinks (auto-CONFIRMING those at or above auto_merge_threshold), assigns Households and materialises ConsentRecords"
      - "drives SourceSystem REGISTERED -> ACTIVE on the first successful promote"
      - "increments IngestBatch.version by 1 and the version of every entity it creates or mutates"

  # ---------------------------------------------------- profiles / households ---
  - method: GET
    path: "/cdp/profiles/{profileId}"
    description: "Reads one resolved profile including its parallel resolution/privacy state, computed rollups and activatable_channels."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: Profile
    side_effects: []

  - method: GET
    path: "/cdp/profiles"
    description: >-
      Lists profiles. The origin_batch_id, primary_source_system_id, household_id and
      merged_into_profile_id filters are the reverse traversals of the four Profile foreign keys.
      Results are ordered created_at ASC then id ASC, which for one promoted batch is the record
      processing order of calculations.identity_resolution_pass.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["origin_batch_id?", "primary_source_system_id?", "household_id?", "merged_into_profile_id?", "resolution_status?", "privacy_status?", "limit?", "offset?"]
    output: Profile[]
    side_effects: []

  - method: GET
    path: "/cdp/profiles/{profileId}/consent-state"
    description: >-
      Computed read: resolves calculations.effective_channel_consent for all five channels at the
      logical clock now and reports, per channel, the resolution and which gate or precedence rank
      produced it.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: "{ profile_id: string, evaluated_at: string, activatable_channels: string[], channel_engagement_score: number, channels: object[] }"
    side_effects: []

  - method: POST
    path: "/cdp/profiles/{profileId}/household-assignment"
    description: >-
      Moves a profile into an explicit household bucket, bypassing the waterfall in
      calculations.household_grouping. Used to reconcile addresses a steward has verified by hand.
    roles: [IdentitySteward]
    code: 200
    input: [household_id]
    output: Profile
    side_effects:
      - "sets Profile.household_id to the target household"
      - "recomputes member_count, dominant_last_name and combined_lifetime_value_cents on both the old and the new household"
      - "dissolves the old household when its member_count reaches 0"
      - "increments Profile.version and each touched Household.version by 1"

  - method: GET
    path: "/cdp/households/{householdId}"
    description: "Reads one household including member_count, dominant_last_name and combined_lifetime_value_cents."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/cdp/households"
    description: "Lists households; the address_hash filter exposes the overflow buckets at one address ordered sequence_no ASC, then created_at ASC then id ASC across addresses."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["address_hash?", "status?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # -------------------------------------------------------------- match rules ---
  - method: POST
    path: "/cdp/match-rules"
    description: "Declares a deterministic or probabilistic matching rule with its confidence thresholds and missing-identifier policy."
    roles: [DataPlatformAdmin]
    code: 201
    input: ["code", "rule_kind", "deterministic_key?", "missing_identifier_policy?", "auto_merge_threshold?", "review_floor?", "min_precision?"]
    output: MatchRule
    side_effects:
      - "sets status = ENABLED, confirmed_count = 0, rejected_count = 0, precision_estimate = 1.0"

  - method: GET
    path: "/cdp/match-rules/{matchRuleId}"
    description: "Reads one match rule including its live precision_estimate."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: MatchRule
    side_effects: []

  - method: GET
    path: "/cdp/match-rules"
    description: "Lists match rules in created_at ASC order — the same order the promote passes scan them in."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["rule_kind?", "status?", "limit?", "offset?"]
    output: MatchRule[]
    side_effects: []

  # ----------------------------------------------------------- identity links ---
  - method: POST
    path: "/cdp/identity-links"
    description: >-
      Proposes a candidate match between two profiles. Computes confidence per
      calculations.identity_match_confidence under the rule's missing_identifier_policy variant,
      refuses the link below review_floor, and auto-CONFIRMS it at or above auto_merge_threshold.
    roles: [IdentitySteward]
    code: 201
    input: [left_profile_id, right_profile_id, match_rule_id, evidence]
    output: IdentityLink
    side_effects:
      - "writes match_method (copied from MatchRule.rule_kind) and confidence"
      - "status = PROPOSED, or CONFIRMED with decided_by_user_id = \"system\" when confidence >= auto_merge_threshold"
      - "on auto-CONFIRM runs calculations.merge_survivorship, sets survivor_profile_id, drives the loser Profile to MERGED_AWAY and increments MatchRule.confirmed_count"

  - method: GET
    path: "/cdp/identity-links/{linkId}"
    description: "Reads one candidate or decided match link including its confidence and survivor."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: IdentityLink
    side_effects: []

  - method: GET
    path: "/cdp/identity-links"
    description: >-
      Lists identity links. The left_profile_id, right_profile_id, match_rule_id and
      survivor_profile_id filters are the reverse traversals of the four IdentityLink foreign keys.
      Results are ordered created_at ASC then id ASC.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["left_profile_id?", "right_profile_id?", "match_rule_id?", "survivor_profile_id?", "status?", "limit?", "offset?"]
    output: IdentityLink[]
    side_effects: []

  - method: POST
    path: "/cdp/identity-links/{linkId}/decision"
    description: >-
      Records a steward decision on a PROPOSED link. CONFIRM merges the pair; REJECT leaves both
      profiles untouched and feeds the rule's precision estimate. The two branches share no side
      effect beyond the link's own status.
    roles: [IdentitySteward]
    code: 200
    input: [decision]
    output: IdentityLink
    side_effects:
      - "CONFIRM: runs calculations.merge_survivorship, drives the loser Profile to MERGED_AWAY, increments MatchRule.confirmed_count, may dissolve a Household, may pause activations whose audience collapsed"
      - "REJECT: increments MatchRule.rejected_count, may DISABLE the rule on a precision breach, which VOIDS that rule's other PROPOSED links"
      - "sets decided_by_user_id = X-User-ID and decided_at = logical clock now"
      - "increments IdentityLink.version by 1"

  # ---------------------------------------------------------- consent records ---
  - method: POST
    path: "/cdp/consent-records"
    description: >-
      Captures a channel-level consent election for a profile. OCC-guarded on the parent Profile's
      version (§1.2.1 consent-capture-stale-profile) because a new election supersedes the
      incumbent in its (profile, channel, purpose) group.
    roles: [PrivacyOfficer]
    code: 201
    input: ["profile_id", "source_system_id", "channel", "purpose", "consent_state", "captured_at", "expires_at?", "expected_profile_version"]
    output: ConsentRecord
    side_effects:
      - "sets status = ACTIVE and re-ranks precedence_rank across the whole (profile_id, channel, purpose) group"
      - "recomputes Profile.activatable_channels, channel_engagement_score and consent_record_count"
      - "when a channel leaves activatable_channels, every delivering Activation whose destination uses that channel is PAUSED with paused_reason = CONSENT_WITHDRAWN and its hash quota is refunded"
      - "increments Profile.version by 1 and ConsentRecord.version by 1"

  - method: GET
    path: "/cdp/consent-records/{consentRecordId}"
    description: "Reads one consent election including its precedence_rank within its group."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/cdp/consent-records"
    description: >-
      Lists consent elections. The profile_id and source_system_id filters are the reverse
      traversals of the two ConsentRecord foreign keys; results are ordered precedence_rank ASC
      within a group.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["profile_id?", "source_system_id?", "channel?", "purpose?", "status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []

  # ------------------------------------------------------- suppression entries ---
  - method: POST
    path: "/cdp/suppression-entries"
    description: >-
      Adds a suppression window for a privacy request, a do-not-sell election, a global opt-out or
      a legal hold. Windows are half-open [effective_at, expires_at).
    roles: [PrivacyOfficer]
    code: 201
    input: ["profile_id", "entry_type", "reason_code", "effective_at", "expires_at?"]
    output: SuppressionEntry
    side_effects:
      - "sets status = ACTIVE and created_by_user_id = X-User-ID"
      - "drives Profile.privacy_status to SUPPRESSED (PRIVACY_DELETE, DO_NOT_SELL, GLOBAL_OPT_OUT) or LEGAL_HOLD (LEGAL_HOLD)"
      - "recomputes Profile.activatable_channels and channel_engagement_score"
      - "pauses every delivering Activation whose audience lost this profile's channel with paused_reason = CONSENT_WITHDRAWN and refunds its hash quota"
      - "increments Profile.version by 1 and SuppressionEntry.version by 1"

  - method: GET
    path: "/cdp/suppression-entries/{suppressionId}"
    description: "Reads one suppression entry including its window and release audit fields."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: SuppressionEntry
    side_effects: []

  - method: GET
    path: "/cdp/suppression-entries"
    description: >-
      Lists suppression entries. The profile_id and deletion_request_id filters are the reverse
      traversals of the two SuppressionEntry foreign keys. Results are ordered created_at ASC then id ASC.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["profile_id?", "deletion_request_id?", "entry_type?", "status?", "limit?", "offset?"]
    output: SuppressionEntry[]
    side_effects: []

  - method: POST
    path: "/cdp/suppression-entries/{suppressionId}/release"
    description: >-
      Releases an ACTIVE suppression. Releasing a LEGAL_HOLD entry requires a different
      PrivacyOfficer than the one who created it (segregation of duties) and unblocks any
      BLOCKED_LEGAL_HOLD deletion request for that subject.
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: SuppressionEntry
    side_effects:
      - "status ACTIVE -> RELEASED, released_by_user_id = X-User-ID, released_at = logical clock now"
      - "lifts Profile.privacy_status back to NORMAL when no other in-window ACTIVE entry remains"
      - "recomputes Profile.activatable_channels and channel_engagement_score"
      - "drives every BLOCKED_LEGAL_HOLD DeletionRequest of that profile back to RECEIVED with blocked_reason = null"
      - "increments SuppressionEntry.version, Profile.version and each unblocked DeletionRequest.version by 1"

  # ------------------------------------------------------------------ segments ---
  - method: POST
    path: "/cdp/segments"
    description: >-
      Creates a segment definition. uses_sensitive_attributes is derived from the criteria at
      creation and is never accepted from the client.
    roles: [SegmentAnalyst]
    code: 201
    input: ["name", "criteria", "governance_justification?", "governance_valid_days?"]
    output: Segment
    side_effects:
      - "computes uses_sensitive_attributes from criteria, sets status = DRAFT, sensitive_use_approved = false, rejection_count = 0"
      - "computes member_count per calculations.segment_membership_set"

  - method: GET
    path: "/cdp/segments/{segmentId}"
    description: "Reads one segment including its governance state, member_count and active_activation_count."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: Segment
    side_effects: []

  - method: GET
    path: "/cdp/segments"
    description: "Lists segments, filterable by governance state and sensitive-attribute usage."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["status?", "uses_sensitive_attributes?", "limit?", "offset?"]
    output: Segment[]
    side_effects: []

  - method: POST
    path: "/cdp/segments/{segmentId}/submit-for-review"
    description: "Submits a DRAFT or GOVERNANCE_EXPIRED segment for governance review and records the submitting user for the segregation-of-duties check."
    roles: [SegmentAnalyst]
    code: 200
    input: []
    output: Segment
    side_effects:
      - "status DRAFT|GOVERNANCE_EXPIRED -> PENDING_GOVERNANCE_REVIEW, submitted_by_user_id = X-User-ID"
      - "recomputes member_count"
      - "increments Segment.version by 1"

  - method: POST
    path: "/cdp/segments/{segmentId}/governance-decision"
    description: >-
      Records the governance officer's APPROVE or REJECT. APPROVE stamps approved_at and
      governance_expires_at; REJECT reverts the segment to DRAFT and clears submitted_by_user_id.
      The deciding user must differ from the submitting user.
    roles: [DataGovernanceOfficer]
    code: 200
    input: ["decision", "sensitive_use_approved?"]
    output: Segment
    side_effects:
      - "APPROVE: status -> APPROVED, approved_at = logical clock now, governance_expires_at = approved_at + governance_valid_days days, sensitive_use_approved from the body"
      - "REJECT: status -> DRAFT, rejection_count += 1, sensitive_use_approved = false, submitted_by_user_id = null"
      - "sets decided_by_user_id = X-User-ID"
      - "increments Segment.version by 1"

  - method: POST
    path: "/cdp/segments/{segmentId}/retire"
    description: "Retires a segment permanently and terminates every one of its activations, refunding hash quota for those still delivering."
    roles: [SegmentAnalyst, DataGovernanceOfficer]
    code: 200
    input: []
    output: Segment
    side_effects:
      - "status -> RETIRED and active_activation_count = 0"
      - "every non-TERMINATED Activation -> TERMINATED with paused_reason = SEGMENT_RETIRED and terminated_at = logical clock now"
      - "refunds dispatched_hash_count to Destination.remaining_daily_hash_quota for each activation that was DISPATCHED, ACTIVE or UNDERPERFORMING"
      - "increments Segment.version, each Activation.version and each touched Destination.version by 1"

  - method: GET
    path: "/cdp/segments/{segmentId}/performance"
    description: >-
      Computed read: calculations.segment_performance_attribution under the requested
      attribution_basis variant (TOTAL default, INCREMENTAL alternative).
    roles: [DataPlatformAdmin, SegmentAnalyst, DataGovernanceOfficer]
    code: 200
    input: ["attribution_basis?"]
    output: "{ segment_id: string, attribution_basis: string, member_count: integer, conversion_count: integer, unique_converter_count: integer, attributed_revenue_cents: integer, revenue_per_member_cents: integer }"
    side_effects: []

  - method: GET
    path: "/cdp/segments/{segmentId}/overlap"
    description: "Computed read: calculations.audience_overlap between this segment and other_segment_id."
    roles: [DataPlatformAdmin, SegmentAnalyst, DataGovernanceOfficer]
    code: 200
    input: [other_segment_id]
    output: "{ segment_id: string, other_segment_id: string, segment_member_count: integer, other_segment_member_count: integer, overlap_count: integer, union_count: integer, jaccard_index: number, containment_in_other: number, containment_of_other: number }"
    side_effects: []

  # -------------------------------------------------------------- destinations ---
  - method: POST
    path: "/cdp/destinations"
    description: >-
      Registers an advertising or messaging platform with its hashing contract, k-anonymity floor,
      match-rate basis and floor, daily hash quota, cooldown, concurrency cap, sensitive-attribute
      permission and deletion acknowledgement SLA.
    roles: [DataPlatformAdmin]
    code: 201
    input: ["code", "platform_kind", "channel", "hashing_algorithm", "daily_hash_quota", "match_rate_basis?", "min_match_rate?", "min_audience_size?", "cooldown_minutes?", "max_concurrent_activations?", "sensitive_attribute_permitted?", "deletion_ack_sla_hours?", "status?"]
    output: Destination
    side_effects:
      - "sets remaining_daily_hash_quota = daily_hash_quota, quota_reset_on = the UTC date of the logical clock now, underperforming_activation_count = 0"

  - method: GET
    path: "/cdp/destinations/{destinationId}"
    description: "Reads one destination including its live remaining_daily_hash_quota and underperforming_activation_count."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: Destination
    side_effects: []

  - method: GET
    path: "/cdp/destinations"
    description: "Lists destinations, ordered created_at ASC — the same order deletion propagation fans out in."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["platform_kind?", "channel?", "status?", "limit?", "offset?"]
    output: Destination[]
    side_effects: []

  # --------------------------------------------------------------- activations ---
  - method: POST
    path: "/cdp/activations"
    description: >-
      Creates a DRAFT activation of a segment on a destination for a delivery window. OCC-guarded
      on the parent Segment's version (§1.2.1 activation-create-stale-segment). Enforces the
      destination's closed-interval cooldown gap and its concurrency cap.
    roles: [SegmentAnalyst]
    code: 201
    input: ["segment_id", "destination_id", "window_start_at", "window_end_at", "expected_segment_version"]
    output: Activation
    side_effects:
      - "sets status = DRAFT with all audience and match-rate fields at their defaults"
      - "increments Segment.version by 1"

  - method: GET
    path: "/cdp/activations/{activationId}"
    description: "Reads one activation including audience counts, both match-rate variants, the effective rate and its attributed conversions."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: Activation
    side_effects: []

  - method: GET
    path: "/cdp/activations"
    description: >-
      Lists activations. The segment_id and destination_id filters are the reverse traversals of
      the two Activation foreign keys. Results are ordered created_at ASC then id ASC.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["segment_id?", "destination_id?", "status?", "limit?", "offset?"]
    output: Activation[]
    side_effects: []

  - method: POST
    path: "/cdp/activations/{activationId}/dispatch"
    description: >-
      Resolves the audience per calculations.activation_audience_resolution, enforces the
      k-anonymity floor and the hash quota, and hands the hashed identifiers to the destination.
    roles: [SegmentAnalyst]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "writes candidate_count, audience_size, suppressed_count, dispatched_hash_count"
      - "status DRAFT -> DISPATCHED and dispatched_at = logical clock now"
      - "decrements Destination.remaining_daily_hash_quota by dispatched_hash_count"
      - "increments Segment.active_activation_count by 1"
      - "increments Activation.version, Destination.version and Segment.version by 1"

  - method: POST
    path: "/cdp/activations/{activationId}/match-report"
    description: >-
      The destination platform reports its match results and any attributed conversions. Computes
      both calculations.activation_match_rate variants, selects the effective one from the
      destination's match_rate_basis and routes the activation to ACTIVE or UNDERPERFORMING.
    roles: [DestinationPlatform]
    code: 200
    input: ["vendor_matched_count", "unusable_hash_count", "attributed_conversions?"]
    output: Activation
    side_effects:
      - "writes vendor_matched_count, unusable_hash_count, gross_match_rate, net_match_rate, effective_match_rate"
      - "appends attributed_conversions and recomputes attributed_conversion_count"
      - "increases each referenced Profile.lifetime_value_cents by the reported revenue_cents and recomputes each Household.combined_lifetime_value_cents"
      - "status -> ACTIVE or UNDERPERFORMING against Destination.min_match_rate, adjusting Destination.underperforming_activation_count"
      - "increments Activation.version, each touched Profile.version, each touched Household.version and Destination.version by 1"

  - method: POST
    path: "/cdp/activations/{activationId}/pause"
    description: "Stops a delivering activation and refunds its hash quota to the destination."
    roles: [SegmentAnalyst]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "status DISPATCHED|ACTIVE|UNDERPERFORMING -> PAUSED with paused_reason = OPERATOR"
      - "refunds dispatched_hash_count to Destination.remaining_daily_hash_quota"
      - "decrements Segment.active_activation_count, and Destination.underperforming_activation_count when it was UNDERPERFORMING"
      - "increments Activation.version, Destination.version and Segment.version by 1"

  - method: POST
    path: "/cdp/activations/{activationId}/resume"
    description: >-
      Re-resolves the audience against the CURRENT consent and suppression state and re-consumes
      hash quota. A resume can fail on k-anonymity or quota even though the original dispatch
      succeeded.
    roles: [SegmentAnalyst]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "recomputes candidate_count, audience_size, suppressed_count, dispatched_hash_count"
      - "status PAUSED -> ACTIVE and paused_reason = null"
      - "decrements Destination.remaining_daily_hash_quota by the recomputed dispatched_hash_count"
      - "increments Segment.active_activation_count by 1"
      - "increments Activation.version, Destination.version and Segment.version by 1"

  # ---------------------------------------------------- deletion / vendor tasks ---
  - method: POST
    path: "/cdp/deletion-requests"
    description: >-
      Records a privacy erasure request, drives the subject to DELETION_PENDING and auto-creates
      the PRIVACY_DELETE suppression entry that keeps the subject out of every audience while the
      erasure is in flight.
    roles: [PrivacyOfficer]
    code: 201
    input: [profile_id, request_origin, requester_reference]
    output: DeletionRequest
    side_effects:
      - "sets status = RECEIVED and all five vendor task counters to 0"
      - "Profile.privacy_status NORMAL -> DELETION_PENDING and activatable_channels = []"
      - "creates a system-owned PRIVACY_DELETE SuppressionEntry whose deletion_request_id is this request"
      - "pauses every delivering Activation whose audience contained the subject with paused_reason = CONSENT_WITHDRAWN and refunds its hash quota"
      - "increments Profile.version by 1"

  - method: GET
    path: "/cdp/deletion-requests/{deletionRequestId}"
    description: "Reads one erasure request including its compound status and the five vendor task counters."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: DeletionRequest
    side_effects: []

  - method: GET
    path: "/cdp/deletion-requests"
    description: "Lists erasure requests; the profile_id filter is the reverse traversal of DeletionRequest.profile_id."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["profile_id?", "status?", "limit?", "offset?"]
    output: DeletionRequest[]
    side_effects: []

  - method: POST
    path: "/cdp/deletion-requests/{deletionRequestId}/propagate"
    description: >-
      Fans the erasure out to every qualifying destination, or re-dispatches the timed-out and
      failed tasks of a PARTIALLY_VERIFIED request. Blocked by an active legal hold. OCC-guarded on
      the request's own version (§1.2.1 propagate-stale-deletion-request).
    roles: [PrivacyOfficer]
    code: 200
    input: [expected_deletion_request_version]
    output: DeletionRequest
    side_effects:
      - "mints one VendorDeletionTask per qualifying Destination in created_at ASC order, each DISPATCHED with ack_deadline_at = now + Destination.deletion_ack_sla_hours hours"
      - "re-dispatches TIMED_OUT and FAILED tasks instead of duplicating them on a retry, incrementing each attempt_count"
      - "status -> PROPAGATING, or VERIFIED when no destination qualifies, or BLOCKED_LEGAL_HOLD when a legal hold is active"
      - "recomputes the five vendor task counters and propagated_at"
      - "increments DeletionRequest.version and each VendorDeletionTask.version by 1"

  - method: GET
    path: "/cdp/vendor-deletion-tasks/{taskId}"
    description: "Reads one downstream deletion task including its SLA deadline, attempt count and acknowledgement evidence."
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: []
    output: VendorDeletionTask
    side_effects: []

  - method: GET
    path: "/cdp/vendor-deletion-tasks"
    description: >-
      Lists downstream deletion tasks. The deletion_request_id and destination_id filters are the
      reverse traversals of the two VendorDeletionTask foreign keys. Results are ordered
      created_at ASC then id ASC, which matches the Destination.created_at ASC minting order.
    roles: [DataPlatformAdmin, DataEngineer, IdentitySteward, PrivacyOfficer, SegmentAnalyst, DataGovernanceOfficer, DestinationPlatform]
    code: 200
    input: ["deletion_request_id?", "destination_id?", "status?", "limit?", "offset?"]
    output: VendorDeletionTask[]
    side_effects: []

  - method: POST
    path: "/cdp/vendor-deletion-tasks/{taskId}/acknowledge"
    description: >-
      The destination platform confirms or reports failure of downstream erasure. outcome is one
      of {ACKNOWLEDGED, FAILED} and any other value is ERR_INVALID_REQUEST. The last outstanding
      acknowledgement bubbles the parent request to VERIFIED, which tombstones the subject.
    roles: [DestinationPlatform]
    code: 200
    input: ["outcome", "deletion_evidence_reference?", "acknowledged_record_count?"]
    output: VendorDeletionTask
    side_effects:
      - "status DISPATCHED|TIMED_OUT -> ACKNOWLEDGED or FAILED, with acknowledged_at, deletion_evidence_reference and acknowledged_record_count"
      - "recomputes the parent DeletionRequest's five counters"
      - "when acknowledged_vendor_task_count == total_vendor_task_count the parent reaches VERIFIED and the Profile is tombstoned: privacy_status -> DELETED, PII nulled, every ConsentRecord -> TOMBSTONED, every IdentityLink -> VOIDED with void_reason = PROFILE_DELETED, household detached and possibly DISSOLVED"
      - "increments VendorDeletionTask.version and DeletionRequest.version by 1, plus the version of every entity the tombstone cascade touches"

# =============================================================================
# §1.6 Error Code Catalog (51 codes; every code maps 1:1 to a §1.4 priority)
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent or blank on any request."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown or is not in the endpoint's declared roles list."
  - id: ERR_DESTINATION_ACTOR_MISMATCH
    http: 403
    condition: "A DestinationPlatform calls match-report or acknowledge for an activation or task belonging to a different destination_id."
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum value, out-of-range number, bad regex, array outside its cardinality bounds, or malformed query parameter."
  # --- existence ---
  - id: ERR_SOURCE_SYSTEM_NOT_FOUND
    http: 404
    condition: "No SourceSystem with the given id."
  - id: ERR_INGEST_BATCH_NOT_FOUND
    http: 404
    condition: "No IngestBatch with the given id."
  - id: ERR_PROFILE_NOT_FOUND
    http: 404
    condition: "No Profile with the given id (path or any profile-id body field)."
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "No Household with the given id."
  - id: ERR_MATCH_RULE_NOT_FOUND
    http: 404
    condition: "No MatchRule with the given id."
  - id: ERR_IDENTITY_LINK_NOT_FOUND
    http: 404
    condition: "No IdentityLink with the given id."
  - id: ERR_CONSENT_RECORD_NOT_FOUND
    http: 404
    condition: "No ConsentRecord with the given id."
  - id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http: 404
    condition: "No SuppressionEntry with the given id."
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "No Segment with the given id (path, segment_id or other_segment_id)."
  - id: ERR_DESTINATION_NOT_FOUND
    http: 404
    condition: "No Destination with the given id."
  - id: ERR_ACTIVATION_NOT_FOUND
    http: 404
    condition: "No Activation with the given id."
  - id: ERR_DELETION_REQUEST_NOT_FOUND
    http: 404
    condition: "No DeletionRequest with the given id."
  - id: ERR_VENDOR_TASK_NOT_FOUND
    http: 404
    condition: "No VendorDeletionTask with the given id."
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PROFILE_VERSION
    http: 412
    condition: "expected_profile_version on consent capture does not equal the Profile's current version."
  - id: ERR_STALE_SEGMENT_VERSION
    http: 412
    condition: "expected_segment_version on activation creation does not equal the Segment's current version."
  - id: ERR_STALE_DELETION_REQUEST_VERSION
    http: 412
    condition: "expected_deletion_request_version on propagate does not equal the DeletionRequest's current version."
  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current status does not permit the requested transition, including terminal-state lockdown and repeated-trigger idempotency."
  - id: ERR_PROFILE_MERGED_AWAY
    http: 409
    condition: "A write targets a Profile whose resolution_status == MERGED_AWAY; the survivor must be used instead."
  - id: ERR_SOURCE_SYSTEM_QUARANTINED
    http: 409
    condition: "Ingest, validate, promote or consent capture references a SourceSystem whose status == QUARANTINED."
  - id: ERR_MATCH_RULE_DISABLED
    http: 409
    condition: "An identity link names a MatchRule whose status == DISABLED."
  - id: ERR_DESTINATION_INACTIVE
    http: 409
    condition: "Activation creation, dispatch or resume references a Destination whose status == INACTIVE."
  - id: ERR_INVALID_HOUSEHOLD_STATE
    http: 409
    condition: "Household assignment targets a DISSOLVED household or one whose address_hash differs from the profile's."
  # --- privacy / compliance safety ---
  - id: ERR_PROFILE_DELETED
    http: 409
    condition: "A write targets a Profile whose privacy_status == DELETED; erasure is final."
  - id: ERR_LEGAL_HOLD_ACTIVE
    http: 409
    condition: "Deletion propagation attempted while an in-window ACTIVE LEGAL_HOLD suppression exists for the subject; the request is recorded as BLOCKED_LEGAL_HOLD."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The same X-User-ID both submitted and decided a segment's governance review, or both created and released a LEGAL_HOLD suppression."
  - id: ERR_GOVERNANCE_JUSTIFICATION_REQUIRED
    http: 422
    condition: "A sensitive-attribute segment is submitted without a >=10-character justification, or approved without sensitive_use_approved == true."
  - id: ERR_GOVERNANCE_NOT_APPROVED
    http: 409
    condition: "Dispatch or resume attempted while the segment is not APPROVED or its governance_expires_at has passed."
  - id: ERR_SENSITIVE_ATTRIBUTE_NOT_PERMITTED
    http: 409
    condition: "A sensitive-attribute segment is activated to a destination whose sensitive_attribute_permitted is false, or before the governance officer set sensitive_use_approved."
  - id: ERR_EMPTY_AUDIENCE
    http: 422
    condition: "audience_size resolved to 0 at dispatch or resume."
  - id: ERR_AUDIENCE_BELOW_K_ANONYMITY
    http: 422
    condition: "audience_size is below Destination.min_audience_size at dispatch or resume."
  # --- business constraints ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A SourceSystem, MatchRule or Destination code already exists."
  - id: ERR_DUPLICATE_EXTERNAL_ID
    http: 422
    condition: "Two records in one ingest batch share an external_id."
  - id: ERR_INVALID_THRESHOLD_ORDER
    http: 422
    condition: "MatchRule auto_merge_threshold is not strictly greater than review_floor."
  - id: ERR_DETERMINISTIC_KEY_MISMATCH
    http: 422
    condition: "deterministic_key is null for a DETERMINISTIC rule or non-null for a PROBABILISTIC one."
  - id: ERR_SELF_LINK_FORBIDDEN
    http: 422
    condition: "left_profile_id equals right_profile_id."
  - id: ERR_DUPLICATE_IDENTITY_LINK
    http: 409
    condition: "A PROPOSED or CONFIRMED link already joins the same unordered profile pair."
  - id: ERR_CONFIDENCE_BELOW_FLOOR
    http: 422
    condition: "Computed match confidence is below the rule's review_floor."
  - id: ERR_MATCH_REPORT_EXCEEDS_DISPATCH
    http: 422
    condition: "vendor_matched_count + unusable_hash_count exceeds Activation.dispatched_hash_count."
  - id: ERR_OVERLAP_SAME_SEGMENT
    http: 422
    condition: "other_segment_id equals the path segment id on the overlap read."
  - id: ERR_HOUSEHOLD_CAPACITY_EXCEEDED
    http: 409
    condition: "Household assignment targets a household already holding HOUSEHOLD_MAX_MEMBERS (6) members."
  # --- temporal ---
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "An interval's end is not strictly after its start (activation window, suppression window, consent expiry)."
  - id: ERR_FUTURE_CAPTURED_AT
    http: 422
    condition: "ConsentRecord.captured_at is after the logical clock now."
  - id: ERR_SUPPRESSION_WINDOW_OVERLAP
    http: 409
    condition: "A new suppression's half-open [effective_at, expires_at) window overlaps an existing ACTIVE entry of the same profile and entry_type."
  - id: ERR_ACTIVATION_COOLDOWN_VIOLATION
    http: 409
    condition: "A new activation window is DISJOINT from an existing non-TERMINATED window on the same destination but separated from it by less than cooldown_minutes of clear time, measured over closed intervals. Intersecting windows are judged by ERR_ACTIVATION_CONCURRENCY_EXCEEDED instead."
  - id: ERR_ACTIVATION_CONCURRENCY_EXCEEDED
    http: 409
    condition: "A new activation window would make more than Destination.max_concurrent_activations windows cover a single instant."
  # --- fiscal / quota ---
  - id: ERR_HASH_QUOTA_EXCEEDED
    http: 409
    condition: "dispatched_hash_count exceeds Destination.remaining_daily_hash_quota at dispatch or resume."
  - id: ERR_RETRY_LIMIT_REACHED
    http: 409
    condition: "A QUARANTINED batch is requeued after its retry budget (MAX_RETRY_ROUNDS = 2) is spent; the batch is driven to REJECTED."

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: DataPlatformAdmin
    description: "Owns the platform's configuration surface — source systems, match rules, destinations and the retention runner."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/source-systems"
      - "POST /cdp/source-systems/{sourceSystemId}/reinstate"
      - "POST /cdp/match-rules"
      - "POST /cdp/destinations"
      - "POST /cdp/retention-runs"
    shared_operations:
      - "every GET endpoint"
      - "POST /cdp/_clock/set_current_utc"
      - "GET /cdp/segments/{segmentId}/performance"
      - "GET /cdp/segments/{segmentId}/overlap"

  - name: DataEngineer
    description: "Operates the ingestion pipeline: submits batches, validates data quality, requeues quarantined batches and promotes them into the profile graph."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/ingest-batches"
      - "POST /cdp/ingest-batches/{batchId}/validate"
      - "POST /cdp/ingest-batches/{batchId}/requeue"
      - "POST /cdp/ingest-batches/{batchId}/promote"
    shared_operations:
      - "every GET endpoint except the segment performance and overlap reads"
      - "POST /cdp/_clock/set_current_utc"

  - name: IdentitySteward
    description: "Adjudicates the identity graph: proposes candidate links, confirms or rejects them, and reconciles household membership by hand."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/identity-links"
      - "POST /cdp/identity-links/{linkId}/decision"
      - "POST /cdp/profiles/{profileId}/household-assignment"
    shared_operations:
      - "every GET endpoint except the segment performance and overlap reads"
      - "POST /cdp/_clock/set_current_utc"

  - name: PrivacyOfficer
    description: "Owns consent, suppression and erasure. Subject to segregation of duties on legal-hold releases."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/consent-records"
      - "POST /cdp/suppression-entries"
      - "POST /cdp/suppression-entries/{suppressionId}/release"
      - "POST /cdp/deletion-requests"
      - "POST /cdp/deletion-requests/{deletionRequestId}/propagate"
    shared_operations:
      - "every GET endpoint except the segment performance and overlap reads"
      - "POST /cdp/_clock/set_current_utc"

  - name: SegmentAnalyst
    description: "Builds segments and runs audience activations. Submits segments for governance review but may never decide them."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/segments"
      - "POST /cdp/segments/{segmentId}/submit-for-review"
      - "POST /cdp/activations"
      - "POST /cdp/activations/{activationId}/dispatch"
      - "POST /cdp/activations/{activationId}/pause"
      - "POST /cdp/activations/{activationId}/resume"
    shared_operations:
      - "every GET endpoint"
      - "POST /cdp/segments/{segmentId}/retire"
      - "GET /cdp/segments/{segmentId}/performance"
      - "GET /cdp/segments/{segmentId}/overlap"
      - "POST /cdp/_clock/set_current_utc"

  - name: DataGovernanceOfficer
    description: "Approves or rejects segment governance, with authority over sensitive-attribute usage. Cannot submit the segment it decides."
    identity: opaque
    exclusive_operations:
      - "POST /cdp/segments/{segmentId}/governance-decision"
    shared_operations:
      - "every GET endpoint"
      - "POST /cdp/segments/{segmentId}/retire"
      - "GET /cdp/segments/{segmentId}/performance"
      - "GET /cdp/segments/{segmentId}/overlap"
      - "POST /cdp/_clock/set_current_utc"

  - name: DestinationPlatform
    description: >-
      The advertising or messaging platform itself. X-User-ID is the Destination.id, so a platform
      may only report on and acknowledge its own deliveries and deletion tasks.
    identity: "entity_backed:Destination"
    exclusive_operations:
      - "POST /cdp/activations/{activationId}/match-report"
      - "POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge"
    shared_operations:
      - "every GET endpoint except the segment performance and overlap reads"
      - "POST /cdp/_clock/set_current_utc"

  # SEGREGATION OF DUTIES (enforced on X-User-ID, §1.4 priority 28):
  #   (a) Segment.submitted_by_user_id != the X-User-ID recording the governance decision.
  #   (b) SuppressionEntry.created_by_user_id != the X-User-ID releasing a LEGAL_HOLD entry.
  # SegmentAnalyst and DataGovernanceOfficer are peers over the same Segment resource, split by
  # step; PrivacyOfficer is split from itself by user id on legal-hold release.
