      - name: installment_schedule_known_inputs_produce_the_expected_components
        claim_type: correct_result
        grounds:
          - calculations.installment_schedule_generation
          - entities.Installment.fields.principal_component_cents
        excluded_because:
          difficulty_instance: installment_component_rounding_residual_on_last
          rationale: |
            That §1.8 instance is the correct-result test for this calculation at full
            precision: it pins base_principal round_half_up(89900/24) == 3746, installments
            1-23 at 3746 + 999 == 4745, the residual 3742 + 999 == 4741 on installment 24, the
            premium total 23976 and the obligation 113876, and proves the 24 components sum
            back to the principal exactly. A breadth corner would restate the same numbers.

      - name: trade_in_credit_rounding_and_deduction_precision
        claim_type: precision
        grounds:
          - calculations.trade_in_credit
          - entities.TradeIn.fields.credit_final_cents
        excluded_because:
          difficulty_instance: trade_in_final_credit_nested_min_max_deductions
          rationale: |
            Rounding order is the whole subject of that §1.8 instance: it fixes the CRACKED +
            55% device at max(0, round_half_up(45000 * 6000/10000) - 9500 - 8000) == 9500,
            proving the multiplier is rounded BEFORE the deductions are subtracted and the
            floor applied only after, and contrasts it with the FAIL short-circuit at 4500. A
            second precision corner would add no discriminating power.

      - name: payoff_aggregation_over_an_empty_paid_installment_set
        claim_type: aggregation
        grounds:
          - calculations.payoff_quote
          - entities.PayoffQuote.fields.past_due_amount_cents
        excluded_because:
          difficulty_instance: payoff_quote_on_zero_payments_empty_past_due_set
          rationale: |
            The degenerate aggregation case is already covered there: with zero postings the
            quote must aggregate an empty past-due set to 0 (not null and not the whole
            schedule), keep remaining_principal at the full 89900 and rebate the entire
            unearned premium. Running-total-after-add and after-reversal are covered by
            payment_reversal_restores_loan_obligation_balance.

      - name: reservation_windows_that_merely_touch_do_not_overlap
        claim_type: interval_merge
        grounds:
          - calculations.model_reservation_capacity
          - entities.DeviceModel.fields.reserved_slot_count
        excluded_because:
          difficulty_instance: model_reservation_capacity_over_overlapping_fulfillment_windows
          rationale: |
            That §1.8 instance is built on the adjacency edge: it proves a window starting
            exactly at another's end (gap 0) does not count as an overlap under the half-open
            [start, end) rule while a one-day-earlier start does, including the
            ERR_MODEL_CAPACITY_EXHAUSTED arm at capacity 1. Nothing about interval handling is
            left untested.

      - name: premium_rebate_decay_curve_selection
        claim_type: decay_function
        grounds:
          - calculations.unearned_premium_rebate
          - entities.PayoffQuote.fields.premium_rebate_cents
        excluded_because:
          difficulty_instance: payoff_quote_variant_divergence_cancellation_vs_rollover
          rationale: |
            Both decay curves are exercised head-to-head there on one 12-paid loan: rule-of-78
            unearned round_half_up(23976 * 156/600) == 6234 for the rollover variant versus
            pro-rata 11988 rebated at 90% == 10789 for the cancellation variant, ending in the
            38714 / 36659 divergence. That covers "decay applied at the correct interval" and
            variant selection at once.

      - name: variant_selection_by_operation_context
        claim_type: variant_selection
        grounds:
          - calculations.payoff_quote
          - entities.PayoffQuote.fields.quote_type
        excluded_because:
          difficulty_instance: payoff_quote_variant_divergence_cancellation_vs_rollover
          rationale: |
            The same instance also proves selection, not merely divergence: the
            UPGRADE_ROLLOVER quote is the one an upgrade completion may consume and the
            EARLY_CANCELLATION quote the one a cancellation may consume, each priced by its
            own curve on identical loan state, so a swapped selection is caught by the totals.

      - name: declared_estimate_to_final_graded_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.trade_in_credit
          - entities.TradeIn.fields.credit_variance_cents
        excluded_because:
          difficulty_instance: trade_in_credit_declared_estimate_vs_final_graded
          rationale: |
            The provisional-to-final delta is exactly that instance's subject: the GOOD
            declaration books 38250 as a non-binding estimate, grading books the real
            35750, and credit_variance_cents == -2500 reconciles the two, with the
            declared value proven never to leak into the rollover arithmetic.

