              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app_id}.status == CERTIFIED"
            - "PaymentApplication.${app_id}.revision_number == 2"
            - "PaymentApplication.${app_id}.rejection_reason == null"
            - "PaymentApplication.${app_id}.certified_current_due_cents == 1800000"
            - "CaProject.${p_id}.certified_to_date_cents == 1800000"

      - name: punch_item_verify_reopen_cycle
        grounds:
          - state_machines.PunchListItem.CLAIMED_COMPLETE_to_VERIFIED
          - state_machines.PunchListItem.VERIFIED_to_REOPENED
        distinguishing_aspect: |
          Cyclic machine on PunchListItem (third entity): OPEN -> CLAIMED_COMPLETE ->
          VERIFIED -> REOPENED -> CLAIMED_COMPLETE -> VERIFIED, with reopen_count
          tracking the loop (exactly 1) — VERIFIED is reopenable, not terminal.
        test_recipe:
          setup:
            - "ACTIVE project with a REPORT_ISSUED PUNCH_INSPECTION visit (2026-08-20, performer user-arch-2)."
            - "Punch item raised from that visit, OPEN."
