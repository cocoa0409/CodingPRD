scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: rating_shortfall_remedy_provisional_vs_final
    grounds:
    - calculations.rating_shortfall_remedy
    - entities.AudienceMeasurement.fields.status
    - entities.Deal.fields.cumulative_rating_basis_points
    distinguishing_aspect: 'Two variants of rating_shortfall_remedy — provisional_remedy
      and

      final_remedy — produce different liability figures on the same Deal

      because they draw from different input sets (provisional filters by

      reporting_period_end <= quarter_end; final includes late-confirmed

      PROVISIONAL rows). The Deal entity''s accrued_shortfall_liability_cents

      differs between variants even with identical underlying measurements.

      '
    test_recipe:
      setup:
      - One RightsAsset with guaranteed_rating_basis_points = 5000
      - One Broadcaster ACCREDITED with INVESTMENT_GRADE
      - One RightsPackage on the asset, awarded to the broadcaster; Deal executed
        with base_fee_cents = 100000000, escalator 0.03, min_growth 0.0, cap 200000000,
        audience_commitment_pct = 0.6 (so audience_commitment_basis_points = 3000)
      - 'Two BroadcastEvents DELIVERED with audience measurements: M1 CONFIRMED rating
        1000 bp with reporting_period_end 2026-09-30 (in Q3); M2 PROVISIONAL at creation
        then CONFIRMED with rating 800 bp and reporting_period_end 2026-11-15 (after
        Q3, before season_close)'
      - Quarter end Q3 = 2026-09-30T23:59:59Z
      setup_api_calls:
      - call: POST /rights-assets
        payload:
          asset_code: PL-2026
          competition_name: Premier League
          season_label: 2026-27
          season_start_date: '2026-08-01T00:00:00Z'
          season_end_date: '2027-05-31T23:59:59Z'
          total_package_pool: 5
          guaranteed_rating_basis_points: 5000
        as: RightsManager
        captures:
          asset_id: $.data.id
      - call: POST /broadcasters
        payload:
          legal_name: Sky Sports Ltd
          home_territory: GB
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: PL-DOM-A
          territory_code: GB
          platform_class: LINEAR_TV
          window_start: '2026-08-01T00:00:00Z'
          window_end: '2027-05-31T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 50000000
          games_committed: 10
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 100000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.03
          minimum_growth_pct: 0.0
          fee_cap_cents: 200000000
          production_commitment_games: 10
          audience_commitment_pct: 0.6
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      - call: POST /packages/${pkg_id}/bids/${bid_id}/submit
        payload: {}
        as: BidCoordinator
        as_user_id: ${b_id}
      - call: POST /packages/${pkg_id}/bids/${bid_id}/start-review
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
      - call: GET /packages/${pkg_id}
        as: RightsManager
        captures:
          pkg_v_after_shortlist: $.data.version
      - call: POST /packages/${pkg_id}/bids/${bid_id}/accept
        payload:
          expected_package_version: ${pkg_v_after_shortlist}
        as: RightsManager
        captures:
          deal_id: $.data.id
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 1
          sequence_in_season: 1
          due_date: '2026-09-01T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
        captures:
          ms_id: $.data.id
      - call: POST /deals/${deal_id}/production-obligations
        payload:
          season_index: 1
        as: ProductionAuditor
        captures:
          ob_id: $.data.id
      - call: GET /deals/${deal_id}
        as: RightsManager
        captures:
          deal_v: $.data.version
      - call: POST /deals/${deal_id}/execute
        payload:
          expected_deal_version: ${deal_v}
          term_start: '2026-08-01T00:00:00Z'
          term_end: '2027-05-31T23:59:59Z'
        as: RightsManager
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: PL-WK01-MUN-LIV
          scheduled_kickoff_utc: '2026-08-15T15:00:00Z'
        as: ProductionAuditor
        captures:
          ev1_id: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev1_id}/mark-delivered
        payload:
          actual_air_start_utc: '2026-08-15T15:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/audience-measurements
        payload:
          broadcast_event_id: ${ev1_id}
          reporting_period_end: '2026-09-30T23:59:59Z'
          rating_basis_points: 1000
          source: PANEL
        as: ProductionAuditor
        captures:
          m1_id: $.data.id
      - call: POST /deals/${deal_id}/audience-measurements/${m1_id}/confirm
        payload: {}
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: PL-WK02-ARS-CHE
          scheduled_kickoff_utc: '2026-11-10T17:30:00Z'
        as: ProductionAuditor
        captures:
          ev2_id: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev2_id}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-10T17:30:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/audience-measurements
        payload:
          broadcast_event_id: ${ev2_id}
          reporting_period_end: '2026-11-15T23:59:59Z'
          rating_basis_points: 800
          source: CENSUS
        as: ProductionAuditor
        captures:
          m2_id: $.data.id
      trigger:
      - call: POST /deals/${deal_id}/audience-measurements/${m2_id}/confirm
        payload: {}
        as: ProductionAuditor
      assert:
      - Deal.cumulative_rating_basis_points == 1800 (1000 + 800)
      - 'Provisional remedy at quarter_end 2026-09-30 (only M1 in input set): delivered_bp
        = 1000, shortfall_bp = 3000 - 1000 = 2000, ratio = 2000/3000 = 0.6666...,
        remedy_provisional = round_half_up(100000000 * 0.6666... * 0.25) = 16666667
        cents'
      - 'Final remedy at season close (M1 + M2): delivered_bp = 1800, shortfall_bp
        = 3000 - 1800 = 1200, ratio = 0.4, remedy_final = round_half_up(100000000
        * 0.4 * 0.25) = 10000000 cents'
      - remedy_provisional != remedy_final (16666667 != 10000000) — dual variant produces
        different liabilities for identical measurement history
  - name: escalated_fee_vs_make_good_credit_divergent_domains
    grounds:
    - calculations.escalated_rights_fee
    - calculations.make_good_credit
    distinguishing_aspect: 'Escalated_rights_fee operates on the Deal''s season-fee
      domain

      (compound + floor + cap), while make_good_credit operates on the

      ProductionObligation''s games-shortfall domain (per-game rate ×

      shortfall × aggravation multiplier). The two calculations produce

      independent numbers over the same deal: escalated fee is a forward

      projection of broadcaster cost; make-good is a backward-looking

      credit against that cost. The same input state yields different

      outputs in different subsystems.

      '
    test_recipe:
      setup:
      - One executed Deal with base_fee_cents = 50000000, escalator 0.05, min_growth
        0.02, cap 80000000, production_commitment_games = 20
      - ProductionObligation for season 1 with games_required = 20
      - 8 BroadcastEvents DELIVERED (games_delivered = 8)
      - Clock advanced past season end 2027-05-31
