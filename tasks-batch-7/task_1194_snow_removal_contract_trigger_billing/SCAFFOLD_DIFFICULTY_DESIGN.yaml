            - "Dual failure on the VOIDED invoice (state INVALID + fiscal EXCEEDED): error_id == ERR_INVALID_STATE — the state check at priority 5 outranks the fiscal check at priority 21"

      - name: coverage_capability_vs_temporal_overlap_priority
        grounds:
          - validations[priority=11]
          - validations[priority=16]
          - calculations.backup_subcontractor_selection
        distinguishing_aspect: |
          Error-category pair (business_constraint vs business_temporal, distinct
          from the state/fiscal pair): a single coverage create that violates both
          the loader-capability constraint and the half-open overlap check must
          return ERR_CAPABILITY_MISMATCH (constraint, priority 11), never
          ERR_COVERAGE_OVERLAP (temporal, priority 16).
        test_recipe:
          setup:
            - "Subcontractor subC APPROVED but has_loader=false"
            - "Contract kN ACTIVE covering site sN (requires_loader=false); coverage caC ACTIVE for subC on event eC spanning 06:00-14:00"
