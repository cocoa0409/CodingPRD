        distinguishing_aspect: "A second POST /orders with the same (aggregator, external_ref) returns ERR_DUPLICATE_ORDER (409)."
        test_recipe:
          setup: ["Brand BU with item; one order DD-U already ingested."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "BU", owner_email: "bu@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bu_id: $.data.id }
