  - section: endpoints
    instances:
      - name: endpoint_capital_raise_open_action_flips_status_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /de-novo/capital-raises/{raise_id}/open]
          - state_machines.CapitalRaise.STRUCTURING_to_OPEN
          - errors[ERR_RAISE_NOT_OPENABLE]
          - validations[priority=16]
        distinguishing_aspect: >
          A bodyless action endpoint: it takes no input fields, returns the whole CapitalRaise,
          moves STRUCTURING -> OPEN and bumps version by exactly one; replaying it on the now-OPEN
          raise is 409 ERR_RAISE_NOT_OPENABLE, so the action is not idempotent.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING."
            - "One CapitalRaise in status STRUCTURING: target_gross_cents 4,300,000,000,"
            - "minimum_gross_cents 4,100,000,000, offering_price_cents_per_share 1000,"
            - "max_shares 5,000,000, organizational_expense_claim_cents 150,000,000."
            - "Its version at creation is captured as ${r_v0}."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/capital-raises"
              payload: { group_id: "${g_id}", target_gross_cents: 4300000000, minimum_gross_cents: 4100000000, offering_price_cents_per_share: 1000, max_shares: 5000000, organizational_expense_claim_cents: 150000000 }
              as: CharterCounsel
              captures: { r_id: $.data.id, r_v0: $.data.version }
          trigger:
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
              captures: { err_id: $.data.error_id }
          assert:
            - "the first call returns 200 and the body is the full CapitalRaise representation"
            - "CapitalRaise.${r_id}.status == OPEN"
            - "CapitalRaise.${r_id}.version == ${r_v0} + 1 - exactly one bump"
            - "CapitalRaise.${r_id}.subscribed_shares == 0 and pledged_gross_cents == 0"
            - "CapitalRaise.${r_id}.projected_reimbursement_cents == 0 and projected_net_release_cents == 0"
            - "the second call returns 409 with $.data.error_id == ERR_RAISE_NOT_OPENABLE"
            - "after the second call CapitalRaise.${r_id}.version == ${r_v0} + 1 - the refused replay bumps nothing"
      - name: endpoint_capital_adequacy_read_returns_the_full_derivation
        claim_type: computed_read
        grounds:
          - endpoints[GET /de-novo/organizing-groups/{group_id}/capital-adequacy]
          - calculations.capital_adequacy_verdict
          - calculations.stress_leverage_path
          - entities.BusinessPlan.fields.worst_governing_min_leverage_ratio_bps
        distinguishing_aspect: >
          A read-only endpoint that persists nothing and returns a ten-field derivation rather than an
          entity: for the canonical NATIONAL plan every intermediate step is visible and pre-computed -
          base 800, concentration 6511, add-on 5, breach count 0, risk add-on 5, required 805,
          worst governing 882, verdict ADEQUATE.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING, charter_type NATIONAL, five cleared organizers."
            - "One SUBMITTED BusinessPlan (assets 25/34/43 bn, loans 15/21/28 bn, opening tier 1"
            - "4,000,000,000) with one ADVERSE StressScenario (credit loss 60 bps, NIM compression 15 bps,"
            - "no expense overrun): governing DYNAMIC_GROWTH, governing min 882 bps, no breach year."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
