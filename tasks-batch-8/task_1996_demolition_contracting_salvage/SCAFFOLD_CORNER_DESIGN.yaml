          setup:
            - "Project PRECONDITIONS_PENDING: clean COMPLETE survey, CONFIRMED disconnect, ACTIVE permit, pinned CERTIFIED engineering survey; NO notifications."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
