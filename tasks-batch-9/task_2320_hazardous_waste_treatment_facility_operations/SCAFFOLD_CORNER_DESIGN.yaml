      - name: incompatible_class_placement_rejected_on_both_clauses
        claim_type: constraint_propagation
        grounds:
          - calculations.compatibility_segregation
          - validations[priority=17]
          - errors[ERR_INCOMPATIBLE_SEGREGATION]
        distinguishing_aspect: |
          Both clauses of the segregation constraint are exercised on the same manifest: clause (i)
          refuses a WATER_REACTIVE drum in a unit permitted only for ORGANIC_SOLVENT and ACID even
          though that unit is EMPTY, and clause (ii) refuses the same drum in a unit that permits the
          class but already holds an ACID drum, since {ACID, WATER_REACTIVE} is an incompatible pair.
          A second ACID drum into that same unit succeeds, proving a class is never incompatible with
          itself.
