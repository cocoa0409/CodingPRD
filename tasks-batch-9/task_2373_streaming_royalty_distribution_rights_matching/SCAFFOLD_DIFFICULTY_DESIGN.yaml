  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_half_open_interval_and_world_wildcard
        grounds:
          - validations.priority_22
          - entities.RightsRegistration.fields.effective_to
          - entities.RightsRegistration.fields.territory_set
          - errors.ERR_SHARE_OVERSUBSCRIBED
        distinguishing_aspect: |
          RightsRegistration intervals are HALF-OPEN, so two 10000-bps GB claims that share the
          endpoint 2026-07-01 both approve, while a WORLD claim of just 1 bp over 2026-06-01..
          2026-06-30 is refused because WORLD is a wildcard that collides with the concrete GB
          territory and its interval genuinely overlaps the first claim — occupancy is decided per
          concrete territory, not per literal territory_set value.
        test_recipe:
          setup:
            - "One RECORDING work and four LABEL holders (MASTER claims may only be filed by LABEL or DISTRIBUTOR holders), each with direct_deal_rate_bps 800."
            - "Four MASTER registrations, all in UNDER_REVIEW: A = GB [2026-01-01, 2026-07-01) 10000 bps; B = GB [2026-07-01, 2027-01-01) 10000 bps; C = WORLD [2026-06-01, 2026-06-30) 1 bp; D = IE [2026-01-01, 2026-07-01) 10000 bps."
            - "No usage exists, so the claim window never interferes."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
