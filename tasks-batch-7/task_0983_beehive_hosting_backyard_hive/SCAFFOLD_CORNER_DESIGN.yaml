            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "21 Dist Rd", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-06-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-15T00:00:00Z", gross_kg: 4.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { har: $.data.id } }
            - { call: "POST /api/harvests/${har}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
