# =============================================================================
# SCAFFOLD.yaml — Securities Lending & Collateral Management (custodian desk)
# §1.0–§1.7 seed tables. Difficulty: beyond-expert (dense coupling, OCC,
# segregation of duties, dual-variant accruals, batched MTM ops-run).
# =============================================================================

scenario: |
  Securities Lending & Collateral Management (custodian securities lending desk): lendable inventory & borrower demand matching, rate negotiation & rebate calculation, collateral margin requirement & daily mark-to-market, recall for corporate action or sale & fail management, revenue split with beneficial owners, counterparty credit limits & indemnification, reinvestment of cash collateral & risk, reporting & regulatory disclosure

domain_name: securities-lending-collateral
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # lendable pool reserved/committed/released
  secondary_archetype: compliance_audit      # segregation of duties, regulatory reporting
  complexity_layers:
    - optimistic_concurrency                 # OCC on Loan.version for amendments & substitutions
    - cascading_side_effects                 # default/halt/settlement cascades, depth 3-4
    - rate_threshold_triggers                # margin deficit, utilization >= 9000 bps gate
    - ops_run_checkpoint                     # daily mark-to-market + month-end close epochs
  entity_topology: flat                      # all resources top-level under /api, FK-linked
  state_machine_shape: cyclic                # negotiation loop, halt/resume, report reopen; plus parallel dims on Loan
  relationship_patterns:
    - one_to_many                            # Loan -> pledges, margin calls, recalls, tranches, ledger
    - cross_aggregate                        # Loan ties Owner/Borrower/Security/Position together
  role_model: segregation_of_duties          # trader requests, risk approves; settler finalizes, admin files
  consistency_model: immediate               # all side effects visible in the same request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# Money is integer cents; rates/margins/haircuts are integer basis points.
# All dates/times read the logical clock (default 2026-08-01T00:00:00Z).
# =============================================================================
entities:
  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: symbol, type: string, source: input, description: "Ticker / ISIN-style identifier; unique" }
      - { name: asset_class, type: enum, source: input, description: "EQUITY | GOV_BOND | CORP_BOND" }
      - { name: price_cents, type: integer, source: input, description: "Current marked price in cents; changed via POST /api/securities/{id}/price" }
      - { name: haircut_bps, type: integer, source: computed, description: "Collateral haircut by asset_class: GOV_BOND 200, CORP_BOND 600, EQUITY 1000" }
      - { name: status, type: enum, source: system, description: "LENDABLE | HALTED", default: LENDABLE }

  - name: BeneficialOwner
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Owner name" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Owner's share of monthly net lending revenue, basis points (e.g. 6250 = 62.5%)" }
      - { name: indemnification_opt_in, type: boolean, source: input, description: "Whether the agent indemnifies this owner's loans against borrower default" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFFBOARDED", default: ACTIVE }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Borrower name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Base counterparty credit limit in cents" }
      - { name: effective_limit_cents, type: integer, source: computed, description: "LimitOverride.limit if an APPROVED non-expired override covers current date, else credit_limit_cents" }
      - { name: utilization_cents, type: integer, source: computed, description: "Sum of market value (quantity x Security.price_cents) over loans in BOOKED or RECALLED" }
      - { name: utilization_bps, type: integer, source: computed, description: "floor(utilization_cents x 10000 / effective_limit_cents); bookings blocked when prospective value >= 9000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEFAULTED", default: ACTIVE }

  - name: LendablePosition
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> BeneficialOwner.id; owning lender" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; instrument made lendable" }
      - { name: quantity_total, type: integer, source: input, description: "Total shares made lendable (> 0)" }
      - { name: min_fee_bps, type: integer, source: input, description: "Owner's minimum acceptable loan rate (fee bps); used for matching eligibility and ranking" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Sum of quantity over loans in PROPOSED or COUNTERED matched from this position" }
      - { name: quantity_on_loan, type: integer, source: computed, description: "Sum of outstanding quantity over loans in BOOKED or RECALLED matched from this position" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_total - quantity_reserved - quantity_on_loan" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED", default: OPEN }

  - name: BorrowRequest
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; requesting borrower" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; instrument demanded" }
      - { name: quantity, type: integer, source: input, description: "Shares requested (> 0)" }
      - { name: max_rate_bps, type: integer, source: input, description: "Maximum fee (SECURITIES-collateral) the borrower will pay" }
      - { name: collateral_type, type: enum, source: input, description: "CASH | SECURITIES — collateral the borrower will post" }
      - { name: term_days, type: integer, source: input, description: "Fixed term in calendar days; omit for open-term", default: null }
      - { name: needed_by_date, type: string, source: input, description: "ISO date; request expires once the logical clock date exceeds it" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | MATCHED | LOANED | CANCELLED | EXPIRED", default: SUBMITTED }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: borrow_request_id, type: string, source: system, description: "FK -> BorrowRequest.id; null when booked directly by the desk", default: null }
      - { name: position_id, type: string, source: input, description: "FK -> LendablePosition.id; source inventory" }
      - { name: owner_id, type: string, source: input, description: "FK -> BeneficialOwner.id" }
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id" }
      - { name: quantity, type: integer, source: input, description: "Shares on loan (> 0)" }
      - { name: outstanding_quantity, type: integer, source: computed, description: "quantity minus cumulative returned shares" }
      - { name: collateral_type, type: enum, source: input, description: "CASH | SECURITIES" }
      - { name: rate_bps, type: integer, source: input, description: "Negotiated annualized rate: fee_bps when collateral_type=SECURITIES, rebate_bps when CASH" }
      - { name: term_days, type: integer, source: input, description: "Fixed term in calendar days; null = open term", default: null }
      - { name: original_price_cents, type: integer, source: system, description: "Security.price_cents captured at transition to BOOKED" }
      - { name: market_value_cents, type: integer, source: computed, description: "outstanding_quantity x Security.price_cents (current mark)" }
      - { name: required_collateral_cents, type: integer, source: computed, description: "per required_collateral_value calc" }
      - { name: posted_collateral_cents, type: integer, source: computed, description: "per posted_collateral_value calc (ACTIVE pledges only)" }
      - { name: cash_uninvested_cents, type: integer, source: computed, description: "ACTIVE cash pledges total minus principal of INVESTED tranches" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | BOOKED | RECALLED | SETTLED | DEFAULTED | CANCELLED", default: PROPOSED }
      - { name: margin_status, type: enum, source: computed, description: "CURRENT | CALL_OPEN — CALL_OPEN iff a MarginCall in OPEN or ESCALATED exists for this loan" }

  - name: CollateralPledge
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: pledge_type, type: enum, source: input, description: "CASH | SECURITY" }
      - { name: amount_cents, type: integer, source: input, description: "Cash pledged; required iff pledge_type=CASH, forbidden otherwise" }
      - { name: pledge_security_id, type: string, source: input, description: "FK -> Security.id; required iff pledge_type=SECURITY, forbidden otherwise" }
      - { name: quantity, type: integer, source: input, description: "Shares pledged; required iff pledge_type=SECURITY" }
      - { name: marked_value_cents, type: integer, source: computed, description: "CASH: amount_cents. SECURITY: round_half_up(quantity x price_cents x (10000-haircut_bps)/10000), per-pledge rounding" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | SUBSTITUTED | SEIZED", default: ACTIVE }

  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: amount_due_cents, type: integer, source: computed, description: "required_collateral_cents - posted_collateral_cents at issuance; refreshed by each mark-to-market run while OPEN" }
      - { name: issued_date, type: string, source: system, description: "Logical clock date at issuance" }
      - { name: due_date, type: string, source: system, description: "issued_date + 1 calendar day" }
      - { name: status, type: enum, source: system, description: "OPEN | CURED | ESCALATED | DEFAULTED", default: OPEN }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: owner_id, type: string, source: system, description: "FK -> BeneficialOwner.id; copied from Loan.owner_id" }
      - { name: quantity, type: integer, source: input, description: "Shares recalled; must equal Loan.outstanding_quantity (full recall only)" }
      - { name: reason, type: enum, source: input, description: "SALE | CORPORATE_ACTION | VOTE | PORTFOLIO_REBALANCE" }
      - { name: issue_date, type: string, source: system, description: "Logical clock date at issuance" }
      - { name: deadline_date, type: string, source: input, description: "Last day to deliver; must be strictly after issue_date" }
      - { name: delivered_quantity, type: integer, source: computed, description: "Shares returned against this recall (loan returns apply to an open recall first)" }
      - { name: extended_once, type: boolean, source: system, description: "True after one extension; second extension rejected", default: false }
      - { name: fail_price_cents, type: integer, source: system, description: "Security.price_cents snapshot taken when the recall transitions to FAILED", default: null }
      - { name: fail_fee_cents, type: integer, source: computed, description: "Accumulated fail fees per fail_fee_accrual calc", default: 0 }
      - { name: status, type: enum, source: system, description: "ISSUED | EXTENDED | COMPLETED | FAILED | BOUGHT_IN | CANCELLED", default: ISSUED }

  - name: ReinvestmentTranche
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan whose cash collateral is invested" }
      - { name: instrument_type, type: enum, source: input, description: "MMF | REPO | TIME_DEPOSIT" }
      - { name: principal_cents, type: integer, source: input, description: "Cash invested (> 0)" }
      - { name: stated_yield_bps, type: integer, source: input, description: "Stated annualized yield used for provisional income accrual" }
      - { name: current_nav_cents, type: integer, source: input, description: "Current mark of the tranche; initialized to principal_cents, updated via /mark" }
      - { name: realized_income_cents, type: integer, source: computed, description: "At unwind: current_nav_cents - principal_cents (may be negative)", default: null }
      - { name: status, type: enum, source: system, description: "INVESTED | UNWOUND", default: INVESTED }

  - name: RevenueLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; null on REVENUE_SPLIT_* entries" }
      - { name: owner_id, type: string, source: system, description: "FK -> BeneficialOwner.id; set on all entries (loan owner; split beneficiary on REVENUE_SPLIT_*)" }
      - { name: entry_type, type: enum, source: system, description: "FEE_ACCRUAL_PROVISIONAL | FEE_ACCRUAL_FINAL | FEE_TRUE_UP | REBATE_ACCRUAL | REINVEST_INCOME_PROVISIONAL | REINVEST_INCOME_FINAL | FAIL_FEE | BUY_IN_CHARGE | COLLATERAL_SEIZURE | INDEMNITY_CREDIT | REVENUE_SPLIT_OWNER | REVENUE_SPLIT_AGENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; charges to borrower negative, income positive" }
      - { name: accrual_date, type: string, source: system, description: "Logical date the entry accrues for" }
      - { name: period, type: string, source: system, description: "YYYY-MM derived from accrual_date" }
      - { name: note, type: string, source: system, description: "Free-form provenance note", default: "" }

  - name: LimitOverride
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id" }
      - { name: new_limit_cents, type: integer, source: input, description: "Replacement credit limit while the window is current" }
      - { name: effective_from, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: expires_at, type: string, source: input, description: "ISO date, exclusive window end; must be strictly after effective_from" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requesting DeskTrader" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding RiskOfficer; null until decided", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | EXPIRED", default: REQUESTED }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: period, type: string, source: input, description: "YYYY-MM the report covers" }
      - { name: report_type, type: enum, source: input, description: "MONTHLY_LOAN_ACTIVITY | FAILS_AND_BUYINS | COLLATERAL_SUMMARY" }
      - { name: total_on_loan_value_cents, type: integer, source: computed, description: "Sum of Loan.market_value_cents over loans in BOOKED or RECALLED at finalize time", default: null }
      - { name: total_fee_income_cents, type: integer, source: computed, description: "Sum of FEE_ACCRUAL_FINAL + FEE_TRUE_UP ledger amounts for the period", default: null }
      - { name: total_rebate_expense_cents, type: integer, source: computed, description: "Sum of REBATE_ACCRUAL ledger amounts for the period (as positive expense)", default: null }
      - { name: fail_count, type: integer, source: computed, description: "Recalls that entered FAILED during the period", default: null }
      - { name: buy_in_count, type: integer, source: computed, description: "Recalls that entered BOUGHT_IN during the period", default: null }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the OpsSettler who finalized", default: null }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the DeskAdmin who filed", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | FILED", default: DRAFT }

  - name: PeriodClose
    parent: null
    common_fields: false
    fields:
      - { name: period, type: string, source: input, description: "YYYY-MM; unique — a closed period cannot be closed again" }
      - { name: loans_finalized_count, type: integer, source: system, description: "Loans whose provisional accruals were finalized by this close" }
      - { name: status, type: enum, source: system, description: "CLOSED", default: CLOSED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: PROPOSED
    terminal_states: [SETTLED, DEFAULTED, CANCELLED]
    note: |
      Two parallel dimensions on one row: status (below) and margin_status
      (CURRENT | CALL_OPEN, computed: CALL_OPEN iff a MarginCall in OPEN or
      ESCALATED exists for this loan). margin_status=CALL_OPEN gates amendments.
      Negotiation is a cycle: PROPOSED -> COUNTERED -> PROPOSED -> ... until
      accept/confirm/cancel.
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/loans/{loan_id}/counter"
        actor: BorrowerRep
        preconditions:
          - "X-User-ID == loan.borrower_id"
          - "If loan.borrow_request_id is set: new rate_bps <= request.max_rate_bps (ERR_RATE_ABOVE_MAX)"
        side_effects:
          - "loan.rate_bps = payload rate_bps; loan.version += 1"

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/loans/{loan_id}/counter"
        actor: DeskTrader
        preconditions: []
        side_effects:
          - "loan.rate_bps = payload rate_bps; loan.version += 1"

      - from: PROPOSED
        to: BOOKED
        trigger: "POST /api/loans/{loan_id}/accept"
        actor: BorrowerRep
        preconditions:
          - "X-User-ID == loan.borrower_id"
          - "Borrower.status == ACTIVE (ERR_BORROWER_SUSPENDED)"
          - "BeneficialOwner.status == ACTIVE (ERR_OWNER_SUSPENDED)"
          - "Security.status == LENDABLE (ERR_SECURITY_HALTED)"
          - "LendablePosition.status == OPEN (ERR_POSITION_SUSPENDED)"
          - "forward_capacity_check passes for the loan's term window (ERR_FORWARD_CAPACITY_EXCEEDED)"
          - "borrower_utilization_bps including this loan < 9000 (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "position.quantity_reserved -= quantity; position.quantity_on_loan += quantity"
          - "loan.original_price_cents = Security.price_cents"
          - "If loan.borrow_request_id set: BorrowRequest -> LOANED"
          - "loan.version += 1"

      - from: COUNTERED
        to: BOOKED
        trigger: "POST /api/loans/{loan_id}/confirm"
        actor: DeskTrader
        preconditions:
          - "Same business preconditions as PROPOSED -> BOOKED"
        side_effects:
          - "Same side effects as PROPOSED -> BOOKED"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/loans/{loan_id}/cancel"
        actor: DeskTrader | BorrowerRep
        preconditions:
          - "BorrowerRep callers: X-User-ID == loan.borrower_id"
        side_effects:
          - "position.quantity_reserved -= quantity"
          - "If loan.borrow_request_id set: BorrowRequest -> SUBMITTED (reservation released, demand re-opens)"

      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /api/loans/{loan_id}/cancel"
        actor: DeskTrader | BorrowerRep
        preconditions:
          - "BorrowerRep callers: X-User-ID == loan.borrower_id"
        side_effects:
          - "Same side effects as PROPOSED -> CANCELLED"

      - from: BOOKED
        to: RECALLED
        trigger: "system — side effect of POST /api/loans/{loan_id}/recalls (Recall created)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.version += 1"

      - from: RECALLED
        to: BOOKED
        trigger: "system — side effect of POST /api/recalls/{recall_id}/cancel when delivered_quantity == 0"
        actor: system
        preconditions: []
        side_effects:
          - "loan.version += 1"

      - from: BOOKED
        to: SETTLED
        trigger: "POST /api/loans/{loan_id}/returns bringing outstanding_quantity to 0"
        actor: BorrowerRep
        preconditions:
          - "return quantity <= outstanding_quantity (ERR_RETURN_EXCEEDS_LOAN)"
        side_effects:
          - "position.quantity_on_loan -= quantity"
          - "All ACTIVE CollateralPledges -> RELEASED (cash pledges return cash_uninvested_cents to 0)"
          - "All INVESTED ReinvestmentTranches -> UNWOUND at current_nav_cents; REINVEST_INCOME_FINAL ledger entry per tranche (link 2 of the settlement cascade)"
          - "MarginCalls in OPEN or ESCALATED -> CURED (system, note 'settled')"

      - from: RECALLED
        to: SETTLED
        trigger: "POST /api/loans/{loan_id}/returns bringing outstanding_quantity to 0, or system on recall buy-in"
        actor: BorrowerRep | system
        preconditions: []
        side_effects:
          - "Same side effects as BOOKED -> SETTLED"
          - "Open recall (ISSUED/EXTENDED) -> COMPLETED when delivered_quantity reaches recall.quantity"

      - from: BOOKED
        to: DEFAULTED
        trigger: "system — MarginCall declare-default, or Borrower default cascade"
        actor: system
        preconditions: []
        side_effects:
          - "ACTIVE CollateralPledges -> SEIZED (link 2: seizure posts COLLATERAL_SEIZURE ledger entry per pledge at marked_value_cents)"
          - "INVESTED ReinvestmentTranches -> UNWOUND at current_nav_cents; REINVEST_INCOME_FINAL posted (link 3)"
          - "If loan owner has indemnification_opt_in: INDEMNITY_CREDIT entry posted to owner per indemnity_shortfall calc (link 4)"
          - "position.quantity_on_loan -= outstanding_quantity (inventory released back to owner)"

      - from: RECALLED
        to: DEFAULTED
        trigger: "system — MarginCall declare-default, or Borrower default cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as BOOKED -> DEFAULTED"
          - "Open recall (ISSUED/EXTENDED/FAILED) -> CANCELLED"

  - entity: BorrowRequest
    initial_state: SUBMITTED
    terminal_states: [LOANED, CANCELLED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /api/borrow-requests/{request_id}/match"
        actor: DeskTrader
        preconditions:
          - "Borrower.status == ACTIVE (ERR_BORROWER_SUSPENDED)"
          - "Security.status == LENDABLE (ERR_SECURITY_HALTED)"
          - "needed_by_date >= current clock date (ERR_REQUEST_EXPIRED)"
          - "Selected position: status OPEN, owner ACTIVE, min_fee_bps <= request.max_rate_bps, forward capacity for quantity over [current date, current date + term_days) (ERR_NO_INVENTORY / ERR_FORWARD_CAPACITY_EXCEEDED)"
        side_effects:
          - "Loan created in PROPOSED (rate_bps = position.min_fee_bps, terms copied from request)"
          - "position.quantity_reserved += request.quantity"

      - from: MATCHED
        to: SUBMITTED
        trigger: "system — linked Loan proposal is cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "Request returns to the demand pool and may be matched again (cycle)"

      - from: MATCHED
        to: LOANED
        trigger: "system — linked Loan reaches BOOKED"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/borrow-requests/{request_id}/cancel"
        actor: BorrowerRep
        preconditions:
          - "X-User-ID == request.borrower_id"
        side_effects: []

      - from: MATCHED
        to: CANCELLED
        trigger: "POST /api/borrow-requests/{request_id}/cancel"
        actor: BorrowerRep
        preconditions:
          - "X-User-ID == request.borrower_id"
        side_effects:
          - "Linked Loan proposal (PROPOSED/COUNTERED) -> CANCELLED (cascade link 2)"
          - "position.quantity_reserved -= request.quantity (cascade link 3)"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system — mark-to-market run when current date > needed_by_date"
        actor: system
        preconditions: []
        side_effects: []

      - from: MATCHED
        to: EXPIRED
        trigger: "system — mark-to-market run when current date > needed_by_date"
        actor: system
        preconditions: []
        side_effects:
          - "Linked Loan proposal -> CANCELLED; position reservation released (same cascade as MATCHED -> CANCELLED)"

  - entity: Recall
    initial_state: ISSUED
    terminal_states: [COMPLETED, BOUGHT_IN, CANCELLED]
    transitions:
      - from: ISSUED
        to: EXTENDED
        trigger: "POST /api/recalls/{recall_id}/extend"
        actor: OwnerRep
        preconditions:
          - "X-User-ID == recall.owner_id"
          - "extended_once == false (ERR_RECALL_ALREADY_EXTENDED)"
          - "new_deadline_date > current deadline_date (ERR_RECALL_WINDOW_INVALID)"
        side_effects:
          - "deadline_date = new_deadline_date; extended_once = true"

      - from: ISSUED
        to: COMPLETED
        trigger: "system — loan returns bring delivered_quantity == recall.quantity"
        actor: system
        preconditions: []
        side_effects:
          - "fail_fee_cents finalized per fail_fee_accrual; FAIL_FEE ledger entry if fee > 0"

      - from: EXTENDED
        to: COMPLETED
        trigger: "system — loan returns bring delivered_quantity == recall.quantity"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as ISSUED -> COMPLETED"

      - from: ISSUED
        to: FAILED
        trigger: "system — mark-to-market run when current date > deadline_date and delivered_quantity < quantity"
        actor: system
        preconditions: []
        side_effects:
          - "fail_price_cents = Security.price_cents at the failing run"

      - from: EXTENDED
        to: FAILED
        trigger: "system — mark-to-market run when current date > deadline_date and delivered_quantity < quantity"
        actor: system
        preconditions: []
        side_effects:
          - "fail_price_cents = Security.price_cents at the failing run"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /api/recalls/{recall_id}/cancel"
        actor: OwnerRep
        preconditions:
          - "X-User-ID == recall.owner_id"
          - "delivered_quantity == 0 (ERR_RECALL_PARTIALLY_DELIVERED)"
        side_effects:
          - "Loan: RECALLED -> BOOKED"

      - from: EXTENDED
        to: CANCELLED
        trigger: "POST /api/recalls/{recall_id}/cancel"
        actor: OwnerRep
        preconditions:
          - "X-User-ID == recall.owner_id"
          - "delivered_quantity == 0 (ERR_RECALL_PARTIALLY_DELIVERED)"
        side_effects:
          - "Loan: RECALLED -> BOOKED"

      - from: FAILED
        to: BOUGHT_IN
        trigger: "POST /api/recalls/{recall_id}/buy-in"
        actor: DeskTrader
        preconditions:
          - "Recall must be FAILED; from any other state the call is rejected with ERR_BUY_IN_NOT_ALLOWED"
        side_effects:
          - "fail_fee_cents finalized: undelivered shares accrue from deadline_date (exclusive) to buy-in date (inclusive)"
          - "FAIL_FEE ledger entry (if fee > 0) + BUY_IN_CHARGE ledger entry per buy_in_charge calc, both charged to borrower"
          - "Loan -> SETTLED (economic close); pledges RELEASED and tranches UNWOUND per the settlement cascade"

  - entity: MarginCall
    initial_state: OPEN
    terminal_states: [CURED, DEFAULTED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "system — after a pledge, price update, or MTM run, posted_collateral_cents >= required_collateral_cents"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.margin_status recomputed (may flip CALL_OPEN -> CURRENT)"

      - from: OPEN
        to: ESCALATED
        trigger: "system — mark-to-market run when current date > due_date and deficit persists"
        actor: system
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: CURED
        trigger: "system — posted_collateral_cents >= required_collateral_cents"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.margin_status recomputed"

      - from: ESCALATED
        to: DEFAULTED
        trigger: "POST /api/margin-calls/{call_id}/declare-default"
        actor: RiskOfficer
        preconditions:
          - "Loan is in BOOKED or RECALLED (ERR_INVALID_STATE)"
        side_effects:
          - "Loan -> DEFAULTED (fires the full default cascade: pledges SEIZED, tranches UNWOUND, INDEMNITY_CREDIT if indemnified)"

  - entity: CollateralPledge
    initial_state: ACTIVE
    terminal_states: [RELEASED, SUBSTITUTED, SEIZED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/pledges/{pledge_id}/release, or system on loan SETTLED/BOUGHT_IN"
        actor: DeskTrader | system
        preconditions:
          - "Loan in BOOKED or RECALLED (ERR_INVALID_STATE)"
          - "Manual release, checked IN THIS ORDER: (1) posted_collateral_cents after release must be >= required_collateral_cents (ERR_MARGIN_DEFICIT); (2) for a CASH pledge, loan.cash_uninvested_cents must cover the amount (ERR_INSUFFICIENT_UNINVESTED_CASH)"
        side_effects:
          - "Loan.posted_collateral_cents / cash_uninvested_cents recomputed; open margin calls may cure"

      - from: ACTIVE
        to: SUBSTITUTED
        trigger: "POST /api/loans/{loan_id}/pledges/{pledge_id}/substitute"
        actor: BorrowerRep
        preconditions:
          - "OCC: expected_loan_version == loan.version (ERR_STALE_VERSION)"
          - "Loan in BOOKED or RECALLED"
          - "Replacement pledge's marked_value_cents >= substituted pledge's marked_value_cents (ERR_COLLATERAL_SHORTFALL)"
        side_effects:
          - "New CollateralPledge created ACTIVE; loan.version += 1; posted collateral recomputed"

      - from: ACTIVE
        to: SEIZED
        trigger: "system — Loan -> DEFAULTED"
        actor: system
        preconditions: []
        side_effects:
          - "COLLATERAL_SEIZURE ledger entry posted at marked_value_cents (income to owner side)"

  - entity: LimitOverride
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/limit-overrides/{override_id}/approve"
        actor: RiskOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != requested_by_user_id (ERR_SOD_VIOLATION)"
          - "Window [effective_from, expires_at) does not overlap any other APPROVED override for this borrower (ERR_OVERRIDE_WINDOW_OVERLAP); half-open: adjacency is permitted"
        side_effects:
          - "Borrower.effective_limit_cents recomputed"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/limit-overrides/{override_id}/reject"
        actor: RiskOfficer
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system — mark-to-market run when current date >= expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Borrower.effective_limit_cents recomputed (falls back to credit_limit_cents)"

  - entity: ReinvestmentTranche
    initial_state: INVESTED
    terminal_states: [UNWOUND]
    transitions:
      - from: INVESTED
        to: UNWOUND
        trigger: "POST /api/reinvestments/{tranche_id}/unwind, or system on loan SETTLED/DEFAULTED/BOUGHT_IN"
        actor: DeskTrader | system
        preconditions:
          - "Manual unwind: Loan.status in {BOOKED, RECALLED} (ERR_INVALID_STATE) — cross-entity dependency ReinvestmentTranche -> Loan"
        side_effects:
          - "realized_income_cents = current_nav_cents - principal_cents"
          - "REINVEST_INCOME_FINAL ledger entry (signed by realized income)"
          - "loan.cash_uninvested_cents += principal_cents (gain/loss goes to revenue, never to borrower's collateral principal)"

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/regulatory-reports/{report_id}/finalize"
        actor: OpsSettler
        preconditions:
          - "A PeriodClose exists for report.period (ERR_PERIOD_NOT_CLOSED)"
        side_effects:
          - "Aggregate fields computed and frozen; finalized_by_user_id = X-User-ID"

      - from: FINALIZED
        to: DRAFT
        trigger: "POST /api/regulatory-reports/{report_id}/reopen"
        actor: OpsSettler
        preconditions: []
        side_effects:
          - "Aggregate fields cleared to null; finalized_by_user_id cleared (cycle)"

      - from: FINALIZED
        to: FILED
        trigger: "POST /api/regulatory-reports/{report_id}/file"
        actor: DeskAdmin
        preconditions:
          - "Segregation of duties: X-User-ID != finalized_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "filed_by_user_id = X-User-ID"

  - entity: BeneficialOwner
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/beneficial-owners/{owner_id}/suspend"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Owner's LendablePositions become ineligible for new matches (existing loans continue)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/beneficial-owners/{owner_id}/resume"
        actor: RiskOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /api/beneficial-owners/{owner_id}/offboard"
        actor: RiskOfficer
        preconditions:
          - "No loans in BOOKED or RECALLED for this owner (ERR_OWNER_HAS_OPEN_LOANS)"
          - "All positions have quantity_on_loan == 0 and quantity_reserved == 0 (ERR_OWNER_HAS_OPEN_LOANS)"
        side_effects:
          - "All OPEN positions -> SUSPENDED"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /api/beneficial-owners/{owner_id}/offboard"
        actor: RiskOfficer
        preconditions:
          - "Same guards as ACTIVE -> OFFBOARDED"
        side_effects:
          - "All OPEN positions -> SUSPENDED"

  - entity: Borrower
    initial_state: ACTIVE
    terminal_states: [DEFAULTED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/borrowers/{borrower_id}/suspend"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Borrower's SUBMITTED BorrowRequests -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/borrowers/{borrower_id}/resume"
        actor: RiskOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /api/borrowers/{borrower_id}/default"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Cascade link 1: all loans in BOOKED or RECALLED -> DEFAULTED"
          - "Cascade link 2 (per defaulted loan): ACTIVE pledges -> SEIZED with COLLATERAL_SEIZURE entries"
          - "Cascade link 3 (per defaulted loan): INVESTED tranches -> UNWOUND with REINVEST_INCOME_FINAL entries"
          - "Cascade link 4 (per defaulted loan, indemnified owners): INDEMNITY_CREDIT per indemnity_shortfall"
          - "Borrower's SUBMITTED and MATCHED BorrowRequests -> CANCELLED (MATCHED cancels its proposal and releases the reservation)"
      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /api/borrowers/{borrower_id}/default"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> DEFAULTED"

  - entity: Security
    initial_state: LENDABLE
    terminal_states: []
    transitions:
      - from: LENDABLE
        to: HALTED
        trigger: "POST /api/securities/{security_id}/halt"
        actor: DeskAdmin
        preconditions: []
        side_effects:
          - "Cascade link 1: SUBMITTED and MATCHED BorrowRequests for this security -> CANCELLED"
          - "Cascade link 2: every Loan in PROPOSED or COUNTERED for this security -> CANCELLED (includes proposals not tied to a request)"
          - "Cascade link 3: each cancelled proposal releases its LendablePosition reservation (quantity_reserved decremented)"
      - from: HALTED
        to: LENDABLE
        trigger: "POST /api/securities/{security_id}/resume"
        actor: DeskAdmin
        preconditions: []
        side_effects: []

  - entity: LendablePosition
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /api/lendable-positions/{position_id}/suspend"
        actor: OwnerRep
        preconditions:
          - "X-User-ID == position.owner_id"
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /api/lendable-positions/{position_id}/resume"
        actor: OwnerRep
        preconditions:
          - "X-User-ID == position.owner_id"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: loan-amend-stale-version
    parent_entity: Loan
    write_endpoint: "POST /api/loans/{loan_id}/amendments"
    occ_field: "expected_loan_version"
    description: |
      Amending a BOOKED loan (rate_bps and/or term_days) against a Loan whose
      version has advanced since the client last observed it is rejected.
      Sequential amendments are each legitimate under product semantics (each
      supersedes the prior terms), so the stale writer is rejected on version
      rather than on state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pledge-substitute-stale-version
    parent_entity: Loan
    write_endpoint: "POST /api/loans/{loan_id}/pledges/{pledge_id}/substitute"
    occ_field: "expected_loan_version"
    description: |
      Substituting collateral against a Loan whose version has advanced since
      the client last observed it is rejected. Two substitutions targeting
      different ACTIVE pledges of the same loan are each legitimate when
      evaluated alone; the second writer's view of the loan's collateral mix is
      stale, so it is rejected on version rather than on pledge state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_collateral_value
    trigger: "loan booking, price update, mark-to-market run, pledge release/substitute guard"
    algorithm: threshold
    formula: |
      margin_bps = 10200 if loan.collateral_type == CASH else 10500
      required_collateral_cents = round_half_up(outstanding_quantity x Security.price_cents x margin_bps / 10000)
      Conditional branch on collateral_type x current mark x outstanding quantity (3+ inputs).
    input_set: "The single loan; Security.price_cents is the current mark"
    constants:
      MARGIN_BPS_CASH: 10200
      MARGIN_BPS_SECURITIES: 10500
    precision: "integer cents, round_half_up at the final multiplication only"

  - name: posted_collateral_value
    trigger: "pledge create/substitute/release, price update, mark-to-market run"
    algorithm: aggregation
    formula: |
      For each CollateralPledge with status == ACTIVE on the loan:
        pledge_value = amount_cents                                          if pledge_type == CASH
        pledge_value = round_half_up(quantity x price x (10000-haircut)/10000) if pledge_type == SECURITY
      posted_collateral_cents = sum(pledge_value)
      PINNED ROUNDING ORDER: round each pledge to integer cents FIRST, then sum.
      (Sum-then-round diverges: two pledges of 1 sh @ 22225c EQUITY (haircut 1000)
      give 20003 + 20003 = 40006 per-pledge vs 40005 sum-then-round.)
    input_set: "CollateralPledge rows with status == ACTIVE for the loan (RELEASED/SUBSTITUTED/SEIZED excluded)"
    constants:
      HAIRCUT_BPS_GOV_BOND: 200
      HAIRCUT_BPS_CORP_BOND: 600
      HAIRCUT_BPS_EQUITY: 1000
    precision: "integer cents, round_half_up per pledge"

  - name: margin_deficit_and_call_issuance
    trigger: "mark-to-market run; also evaluated after pledge create/substitute/release and price update (cure direction only)"
    algorithm: threshold
    formula: |
      deficit = required_collateral_cents - posted_collateral_cents
      deficit > 0  -> margin call territory; deficit <= 0 -> no call (exact equality is NOT a deficit)
      On an MTM run with deficit > 0:
        if no MarginCall in {OPEN, ESCALATED}: create MarginCall(amount_due=deficit, due_date = current+1 day)
        elif a call is OPEN: refresh amount_due_cents = deficit (ESCALATED calls keep their original amount_due)
      On any collateral/price change with deficit <= 0: all OPEN/ESCALATED calls -> CURED.
    input_set: "Loans in BOOKED or RECALLED"
    constants:
      CURE_RULE: "full deficit covered; no partial cure"
    precision: "integer cents, strict > 0 comparison for issuance"

  - name: loan_fee_accrual
    trigger: "mark-to-market run (provisional, per accrual date); month-end close (final + true-up)"
    algorithm: chronological
    formula: |
      Applies to loans with collateral_type == SECURITIES in status BOOKED or RECALLED on the accrual date.
      PROVISIONAL (daily, at MTM run):
        fee(day d) = round_half_up(outstanding_quantity(d) x price_cents(d) x rate_bps / 10000 / 360)
        One entry per (loan, accrual_date); a second MTM run on the same date posts nothing.
        Zero-amount entries are never posted (a rate_bps of 0 produces no rows).
      FINAL (month-end close for period P):
        exact_total = sum over accrued days d in P of (outstanding_quantity(d) x price_cents(d) x rate_bps / 10000 / 360)
        final_fee = round_half_up(exact_total)            # round ONCE at month end
        Post FEE_ACCRUAL_FINAL(final_fee) and FEE_TRUE_UP(final_fee - sum of that period's provisionals).
      The two variants diverge by accumulated per-day rounding.
    input_set: "Loans in BOOKED/RECALLED on each accrual date; price_cents(d) is the security's marked price at that day's MTM run"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "integer cents; provisional rounds per day, final rounds once per period"
    variants:
      - name: provisional_daily
        when: "each mark-to-market run"
        difference: "rounds each day's fee independently; entry_type FEE_ACCRUAL_PROVISIONAL"
      - name: final_month_end
        when: "month-end close of the period"
        difference: "rounds the period total once; posts FEE_ACCRUAL_FINAL plus a FEE_TRUE_UP delta against provisionals"

  - name: rebate_accrual
    trigger: "mark-to-market run, for CASH-collateral loans"
    algorithm: chronological
    formula: |
      Applies to loans with collateral_type == CASH in status BOOKED or RECALLED.
      rebate(day d) = round_half_up(active_cash_pledged_cents(d) x rate_bps / 10000 / 360)
      Posted as REBATE_ACCRUAL with negative amount (income owed to borrower).
      One entry per (loan, accrual_date); re-run same date posts nothing.
      Zero-amount entries are never posted (a rate_bps of 0 produces no rows).
    input_set: "CASH-collateral loans BOOKED/RECALLED; active_cash_pledged_cents = sum of ACTIVE CASH pledges"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "integer cents, round_half_up per day"

  - name: reinvestment_income
    trigger: "mark-to-market run (provisional); tranche unwind (final)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (daily, at MTM run):
        income(day d) = round_half_up(principal_cents x stated_yield_bps / 10000 / 360)
        entry_type REINVEST_INCOME_PROVISIONAL; one per (tranche, accrual_date).
      FINAL (at unwind):
        realized_income_cents = current_nav_cents - principal_cents   # may be negative (shortfall)
        REINVEST_INCOME_FINAL entry for realized amount.
      The provisional stated-yield stream and the final NAV realization diverge
      whenever the mark moves; the provisional stream is informational only and
      is never trued-up — the FINAL entry alone hits the revenue pool.
    input_set: "ReinvestmentTranche rows with status == INVESTED"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "integer cents, round_half_up per provisional day"
    variants:
      - name: stated_yield_provisional
        when: "each mark-to-market run while INVESTED"
        difference: "accrues principal x stated_yield_bps/360 regardless of NAV moves"
      - name: nav_final
        when: "unwind (manual or cascade)"
        difference: "realizes current_nav_cents - principal_cents; ignores the provisional stream entirely"

  - name: borrower_utilization_bps
    trigger: "loan accept/confirm (prospective check), borrower read, limit override approve/expire"
    algorithm: aggregation
    formula: |
      utilization_cents = sum over loans of this borrower in {BOOKED, RECALLED} of market_value_cents
      utilization_bps = floor(utilization_cents x 10000 / effective_limit_cents)
      Booking gate (accept/confirm): prospective_bps = floor((utilization_cents + new_loan market value) x 10000 / effective_limit_cents)
        prospective_bps >= 9000 -> reject ERR_CREDIT_LIMIT_EXCEEDED. Exactly 9000 is blocked (>=, not >).
      effective_limit_cents = new_limit_cents of an APPROVED LimitOverride whose [effective_from, expires_at)
        covers the current clock date; otherwise credit_limit_cents.
    input_set: "Loans in {BOOKED, RECALLED} only; PROPOSED/COUNTERED do not count until booked"
    constants:
      SOFT_CAP_BPS: 9000
    precision: "integer floor division for bps"

  - name: forward_capacity_check
    trigger: "direct loan create and borrow-request match (reservation is taken), and again at accept/confirm (booking re-validates against current occupancy)"
    algorithm: interval_merge
    formula: |
      For the loan's window W = [current_date, current_date + term_days):
        open-term (term_days null) W covers every day from current_date onward.
      For each calendar day d in W:
        occupied(d) = position.quantity_on_loan
                    + sum of quantity over PROPOSED/COUNTERED loans matched from this position whose windows cover d
      At create/match: reject ERR_FORWARD_CAPACITY_EXCEEDED if for ANY day d: occupied(d) + new_quantity > quantity_total.
      At accept/confirm the check re-validates the CONVERTING reservation: the booking loan's own
        reservation is excluded from occupied(d) and no new quantity is added (reserved -> on_loan is
        bucket-neutral per day), so booking can never fail capacity on its own reservation.
      Windows are half-open [start, end): a deal starting on the day another ends does NOT overlap it.
    input_set: "Loans matched from the same LendablePosition in PROPOSED/COUNTERED (reservations) plus BOOKED/RECALLED (on loan)"
    precision: "whole shares; half-open day intervals; zero buffer"

  - name: fail_fee_accrual
    trigger: "recall completion, recall failure finalization, buy-in"
    algorithm: chronological
    formula: |
      For each tranche of shares delivered on date t (or bought in on date t):
        fee_days(t) = (t - deadline_date) in calendar days, floored at 0   # deadline day itself is free
        fee = fee_days x round_half_up(shares x fail_price_cents x FAIL_FEE_BPS / 10000)
      Window semantics: deadline_date EXCLUSIVE, delivery/buy-in date INCLUSIVE.
      fail_fee_cents accumulates; a FAIL_FEE ledger entry posts when the recall
      reaches COMPLETED (for any late partial tranches) and at buy-in.
    input_set: "Return events applied to the recall, and the bought-in remainder at buy-in date"
    constants:
      FAIL_FEE_BPS: 100
    precision: "integer cents, round_half_up per tranche-day product"

  - name: buy_in_charge
    trigger: "POST /api/recalls/{recall_id}/buy-in"
    algorithm: aggregation
    formula: |
      undelivered = recall.quantity - recall.delivered_quantity
      BUY_IN_CHARGE = undelivered x buy_in_price_cents        (charged to borrower as negative entry)
      Fail fee for the undelivered remainder accrues separately per fail_fee_accrual.
    input_set: "The FAILED recall"
    precision: "integer cents"

  - name: revenue_split_waterfall
    trigger: "month-end close"
    algorithm: waterfall_allocation
    formula: |
      Per BeneficialOwner, for the closed period P:
        gross       = sum(FEE_ACCRUAL_FINAL) + sum(REINVEST_INCOME_FINAL)   over owner's loans, period P
        # FEE_TRUE_UP is EXCLUDED from the pool: it reconciles the provisional stream to the
        # FINAL entry, which is authoritative — adding both would double-count the delta.
        rebates     = sum(-REBATE_ACCRUAL amounts) over owner's loans, period P   (stored negative; negate here)
        net_pool    = gross - rebates                          # may be negative
        owner_share = round_half_up(net_pool x owner.revenue_share_bps / 10000)
        agent_share = net_pool - owner_share                   # agent takes the residual cent
      PINNED EVALUATION ORDER (resolves the circular-looking dependency):
        compute net_pool first, then owner_share rounded, then agent_share as the remainder.
        (Agent-first rounding diverges on .5/.5 splits: pool 42780 @ 6250bps -> owner 26738/agent 16042
        owner-first, but agent 16043/owner 26737 agent-first.)
      FAIL_FEE and BUY_IN_CHARGE amounts are excluded from the pool: fail economics pass
      through 100% to the owner (no agent cut). Entries: REVENUE_SPLIT_OWNER / REVENUE_SPLIT_AGENT per owner.
    input_set: "Ledger entries with period == P for loans whose owner is the BeneficialOwner"
    precision: "integer cents; owner_share round_half_up; agent_share is the exact residual"

  - name: indemnity_shortfall
    trigger: "loan DEFAULTED (via margin call or borrower default cascade)"
    algorithm: constraint_propagation
    formula: |
      owed    = loan.market_value_cents at default + outstanding unpaid finalized fees
      seized  = sum(marked_value_cents of pledges transitioned to SEIZED)
      shortfall = max(0, owed - seized)
      If BeneficialOwner.indemnification_opt_in: post INDEMNITY_CREDIT(shortfall) to the owner.
      Otherwise no entry — the owner bears the shortfall.
    input_set: "The defaulted loan and its just-seized pledges"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed scoping: OwnerRep X-User-ID must equal the owner_id of the resource acted on (or in the body); BorrowerRep X-User-ID must equal the borrower_id; filtered GETs by entity-backed roles must pass their own id as the matching FK filter (omitted filter auto-scopes to the caller)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "endpoints with owner/borrower scoping"
  - priority: 4
    category: business_request
    check: "Required fields present; enums in range; quantities/amounts positive; ISO date formats valid; cross-reference consistency (Loan.security_id must equal the referenced position's security_id, Loan.owner_id must equal the position's owner_id)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 5
    category: existence
    check: "Path ids and body FK references exist (path left-to-right, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 7
    category: business_safety
    check: "Regulatory/safety gates: Security HALTED blocks direct loan create, match, accept/confirm, and pledging the halted security as collateral (ERR_SECURITY_HALTED); Borrower not ACTIVE blocks match/booking (ERR_BORROWER_SUSPENDED); Owner not ACTIVE blocks position create/match/booking (ERR_OWNER_SUSPENDED); segregation of duties on override approve and report file (ERR_SOD_VIOLATION)"
    error_id: "ERR_SECURITY_HALTED | ERR_BORROWER_SUSPENDED | ERR_OWNER_SUSPENDED | ERR_SOD_VIOLATION"
    http_status: 409
    applies_to: "loan create, match, accept, confirm, pledge create, position create, override approve, report file"
  - priority: 8
    category: business_constraint
    check: "Structural rules: one non-terminal Recall per loan (ERR_RECALL_ALREADY_OPEN); override window overlap vs APPROVED overrides (ERR_OVERRIDE_WINDOW_OVERLAP); one open proposal per borrow request; selector tie unresolved (ERR_AMBIGUOUS_MATCH); pledge field consistency (ERR_PLEDGE_TYPE_MISMATCH); recall quantity must equal outstanding (full recall); PeriodClose period uniqueness (ERR_PERIOD_ALREADY_CLOSED)"
    error_id: "ERR_RECALL_ALREADY_OPEN | ERR_OVERRIDE_WINDOW_OVERLAP | ERR_AMBIGUOUS_MATCH | ERR_PLEDGE_TYPE_MISMATCH | ERR_PERIOD_ALREADY_CLOSED | ERR_VALIDATION"
    http_status: 409
    applies_to: "recalls create, override approve, match, pledge create/substitute"
  - priority: 9
    category: business_temporal
    check: "Window/date rules: recall deadline strictly after issue date (ERR_RECALL_WINDOW_INVALID); extend raises the deadline (ERR_RECALL_WINDOW_INVALID); override effective_from < expires_at (ERR_INVALID_WINDOW); request not past needed_by_date (ERR_REQUEST_EXPIRED)"
    error_id: "ERR_RECALL_WINDOW_INVALID | ERR_INVALID_WINDOW | ERR_REQUEST_EXPIRED"
    http_status: 422
    applies_to: "recalls create/extend, limit-overrides create, match"
  - priority: 10
    category: business_fiscal
    check: "Money/capacity rules: utilization < 9000bps after booking (ERR_CREDIT_LIMIT_EXCEEDED); forward capacity (ERR_FORWARD_CAPACITY_EXCEEDED); no eligible inventory (ERR_NO_INVENTORY); release leaves posted >= required (ERR_MARGIN_DEFICIT); return <= outstanding (ERR_RETURN_EXCEEDS_LOAN); reinvest <= uninvested cash (ERR_REINVEST_EXCEEDS_CASH); cash loan required for reinvestment (ERR_LOAN_NOT_CASH_COLLATERAL); rate <= max_rate_bps on request-linked loans (ERR_RATE_ABOVE_MAX); substitute value >= substituted value (ERR_COLLATERAL_SHORTFALL); cash release covered by uninvested cash (ERR_INSUFFICIENT_UNINVESTED_CASH); amendment blocked while marginStatus CALL_OPEN (ERR_MARGIN_CALL_OUTSTANDING)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_FORWARD_CAPACITY_EXCEEDED | ERR_NO_INVENTORY | ERR_MARGIN_DEFICIT | ERR_RETURN_EXCEEDS_LOAN | ERR_REINVEST_EXCEEDS_CASH | ERR_LOAN_NOT_CASH_COLLATERAL | ERR_RATE_ABOVE_MAX | ERR_COLLATERAL_SHORTFALL | ERR_INSUFFICIENT_UNINVESTED_CASH | ERR_MARGIN_CALL_OUTSTANDING"
    http_status: 409
    applies_to: "accept, confirm, match, returns, release, reinvestments, counter, substitute, amendments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Security master ---
  - { method: POST, path: "/api/securities", description: "Register a security", roles: [DeskAdmin], code: 201, input: [symbol, asset_class, price_cents], output: Security, side_effects: ["status=LENDABLE; haircut_bps derived from asset_class"] }
  - { method: GET, path: "/api/securities/{security_id}", description: "Read a security", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: Security, side_effects: [] }
  - { method: GET, path: "/api/securities", description: "List securities", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["status?"], output: "Security[]", side_effects: [] }
  - { method: POST, path: "/api/securities/{security_id}/halt", description: "Halt lending in a security; cancels open demand and proposals", roles: [DeskAdmin], code: 200, input: [], output: Security, side_effects: ["halt cascade: BorrowRequests SUBMITTED/MATCHED -> CANCELLED; Loans PROPOSED/COUNTERED -> CANCELLED; reservations released"] }
  - { method: POST, path: "/api/securities/{security_id}/resume", description: "Resume lending", roles: [DeskAdmin], code: 200, input: [], output: Security, side_effects: ["status -> LENDABLE"] }
  - { method: POST, path: "/api/securities/{security_id}/price", description: "Mark a new price", roles: [DeskAdmin], code: 200, input: [price_cents], output: Security, side_effects: ["recompute marked_value_cents of ACTIVE pledges on this security and market_value_cents of open loans immediately; margin-call issuance stays batched at MTM"] }

  # --- Beneficial owners ---
  - { method: POST, path: "/api/beneficial-owners", description: "Onboard a beneficial owner", roles: [DeskAdmin], code: 201, input: [display_name, revenue_share_bps, indemnification_opt_in], output: BeneficialOwner, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/api/beneficial-owners/{owner_id}", description: "Read an owner", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: BeneficialOwner, side_effects: [] }
  - { method: GET, path: "/api/beneficial-owners", description: "List owners", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["status?"], output: "BeneficialOwner[]", side_effects: [] }
  - { method: POST, path: "/api/beneficial-owners/{owner_id}/suspend", description: "Suspend an owner (blocks new matches)", roles: [RiskOfficer], code: 200, input: [], output: BeneficialOwner, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/api/beneficial-owners/{owner_id}/resume", description: "Resume an owner", roles: [RiskOfficer], code: 200, input: [], output: BeneficialOwner, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/api/beneficial-owners/{owner_id}/offboard", description: "Offboard an owner (guarded by zero open loans/reservations)", roles: [RiskOfficer], code: 200, input: [], output: BeneficialOwner, side_effects: ["status -> OFFBOARDED; OPEN positions -> SUSPENDED"] }

  # --- Borrowers ---
  - { method: POST, path: "/api/borrowers", description: "Onboard a borrower", roles: [DeskAdmin], code: 201, input: [display_name, credit_limit_cents], output: Borrower, side_effects: ["status=ACTIVE; effective_limit_cents=credit_limit_cents"] }
  - { method: GET, path: "/api/borrowers/{borrower_id}", description: "Read a borrower", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: Borrower, side_effects: [] }
  - { method: GET, path: "/api/borrowers", description: "List borrowers", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["status?"], output: "Borrower[]", side_effects: [] }
  - { method: POST, path: "/api/borrowers/{borrower_id}/suspend", description: "Suspend a borrower; cancels its SUBMITTED requests", roles: [RiskOfficer], code: 200, input: [], output: Borrower, side_effects: ["SUBMITTED BorrowRequests -> CANCELLED"] }
  - { method: POST, path: "/api/borrowers/{borrower_id}/resume", description: "Resume a borrower", roles: [RiskOfficer], code: 200, input: [], output: Borrower, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/api/borrowers/{borrower_id}/default", description: "Declare borrower default; fires the default cascade", roles: [RiskOfficer], code: 200, input: [], output: Borrower, side_effects: ["loans BOOKED/RECALLED -> DEFAULTED; pledges SEIZED; tranches UNWOUND; INDEMNITY_CREDIT where indemnified; SUBMITTED/MATCHED requests CANCELLED"] }

  # --- Limit overrides ---
  - { method: POST, path: "/api/borrowers/{borrower_id}/limit-overrides", description: "Request a temporary credit-limit override", roles: [DeskTrader], code: 201, input: [new_limit_cents, effective_from, expires_at], output: LimitOverride, side_effects: ["status=REQUESTED; requested_by_user_id = X-User-ID"] }
  - { method: GET, path: "/api/limit-overrides/{override_id}", description: "Read an override", roles: [DeskAdmin, DeskTrader, RiskOfficer, OpsSettler], code: 200, input: [], output: LimitOverride, side_effects: [] }
  - { method: GET, path: "/api/limit-overrides", description: "List overrides", roles: [DeskAdmin, DeskTrader, RiskOfficer, OpsSettler], code: 200, input: ["borrower_id?", "status?"], output: "LimitOverride[]", side_effects: [] }
  - { method: POST, path: "/api/limit-overrides/{override_id}/approve", description: "Approve an override (SoD: approver != requester; window must not overlap APPROVED)", roles: [RiskOfficer], code: 200, input: [], output: LimitOverride, side_effects: ["status -> APPROVED; borrower.effective_limit_cents recomputed; decided_by_user_id = X-User-ID"] }
  - { method: POST, path: "/api/limit-overrides/{override_id}/reject", description: "Reject an override", roles: [RiskOfficer], code: 200, input: [], output: LimitOverride, side_effects: ["status -> REJECTED; decided_by_user_id = X-User-ID"] }

  # --- Lendable positions ---
  - { method: POST, path: "/api/lendable-positions", description: "Make inventory lendable (owner_id must equal X-User-ID)", roles: [OwnerRep], code: 201, input: [owner_id, security_id, quantity_total, min_fee_bps], output: LendablePosition, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/api/lendable-positions/{position_id}", description: "Read a position", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: LendablePosition, side_effects: [] }
  - { method: GET, path: "/api/lendable-positions", description: "List positions", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["owner_id?", "security_id?", "status?"], output: "LendablePosition[]", side_effects: [] }
  - { method: POST, path: "/api/lendable-positions/{position_id}/suspend", description: "Suspend a position (owner only)", roles: [OwnerRep], code: 200, input: [], output: LendablePosition, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/api/lendable-positions/{position_id}/resume", description: "Resume a position (owner only)", roles: [OwnerRep], code: 200, input: [], output: LendablePosition, side_effects: ["status -> OPEN"] }

  # --- Borrow requests ---
  - { method: POST, path: "/api/borrow-requests", description: "Submit borrow demand (borrower_id must equal X-User-ID)", roles: [BorrowerRep], code: 201, input: [borrower_id, security_id, quantity, max_rate_bps, collateral_type, needed_by_date, "term_days?"], output: BorrowRequest, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/api/borrow-requests/{request_id}", description: "Read a request", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: BorrowRequest, side_effects: [] }
  - { method: GET, path: "/api/borrow-requests", description: "List requests", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["borrower_id?", "security_id?", "status?"], output: "BorrowRequest[]", side_effects: [] }
  - { method: POST, path: "/api/borrow-requests/{request_id}/cancel", description: "Cancel demand; a MATCHED request's proposal is cancelled and its reservation released", roles: [BorrowerRep], code: 200, input: [], output: BorrowRequest, side_effects: ["MATCHED: linked proposal -> CANCELLED, position reservation released"] }
  - { method: POST, path: "/api/borrow-requests/{request_id}/match", description: "Match demand to inventory and open a Loan proposal; position_id optional — when omitted the selector ranks eligible positions by min_fee_bps ASC, then created_at ASC, then quantity_total DESC (empty pool ERR_NO_INVENTORY, residual tie ERR_AMBIGUOUS_MATCH)", roles: [DeskTrader], code: 201, input: ["position_id?"], output: Loan, side_effects: ["Loan created PROPOSED with rate_bps=position.min_fee_bps; request -> MATCHED; position.quantity_reserved += quantity"] }

  # --- Loans ---
  - { method: POST, path: "/api/loans", description: "Open a direct Loan proposal (no borrow request)", roles: [DeskTrader], code: 201, input: [owner_id, borrower_id, security_id, position_id, quantity, collateral_type, rate_bps, "term_days?"], output: Loan, side_effects: ["status=PROPOSED; position.quantity_reserved += quantity after capacity check"] }
  - { method: GET, path: "/api/loans/{loan_id}", description: "Read a loan", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: GET, path: "/api/loans", description: "List loans", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["owner_id?", "borrower_id?", "security_id?", "position_id?", "borrow_request_id?", "status?"], output: "Loan[]", side_effects: [] }
  - { method: POST, path: "/api/loans/{loan_id}/counter", description: "Counter-propose the rate (BorrowerRep from PROPOSED; DeskTrader from COUNTERED)", roles: [DeskTrader, BorrowerRep], code: 200, input: [rate_bps], output: Loan, side_effects: ["status flips PROPOSED<->COUNTERED; loan.version += 1"] }
  - { method: POST, path: "/api/loans/{loan_id}/accept", description: "Borrower accepts a desk proposal -> BOOKED", roles: [BorrowerRep], code: 200, input: [], output: Loan, side_effects: ["status -> BOOKED; reserved -> on_loan; original_price_cents captured; linked request -> LOANED; loan.version += 1"] }
  - { method: POST, path: "/api/loans/{loan_id}/confirm", description: "Desk confirms a borrower counter -> BOOKED", roles: [DeskTrader], code: 200, input: [], output: Loan, side_effects: ["status -> BOOKED; same booking side effects as accept"] }
  - { method: POST, path: "/api/loans/{loan_id}/cancel", description: "Cancel a proposal (either party; scoped)", roles: [DeskTrader, BorrowerRep], code: 200, input: [], output: Loan, side_effects: ["status -> CANCELLED; reservation released; linked request -> SUBMITTED"] }
  - { method: POST, path: "/api/loans/{loan_id}/amendments", description: "Amend rate/term on a BOOKED loan (OCC on loan version)", roles: [DeskTrader], code: 200, input: [expected_loan_version, "rate_bps?", "term_days?"], output: Loan, side_effects: ["increments Loan.version by 1; blocked while margin_status == CALL_OPEN"] }
  - { method: POST, path: "/api/loans/{loan_id}/returns", description: "Return shares; full return settles the loan and fires the settlement cascade", roles: [BorrowerRep], code: 200, input: [quantity], output: Loan, side_effects: ["outstanding_quantity -= quantity; open recall absorbs returns first; full return -> SETTLED cascade (pledges RELEASED, tranches UNWOUND, calls CURED); loan.version += 1"] }

  # --- Collateral pledges ---
  - { method: POST, path: "/api/loans/{loan_id}/pledges", description: "Post collateral (loan must be BOOKED/RECALLED; pledge fields consistent with pledge_type)", roles: [BorrowerRep], code: 201, input: [pledge_type, "amount_cents?", "pledge_security_id?", "quantity?"], output: CollateralPledge, side_effects: ["status=ACTIVE; posted_collateral_cents recomputed; open margin calls may cure"] }
  - { method: GET, path: "/api/pledges/{pledge_id}", description: "Read a pledge", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: CollateralPledge, side_effects: [] }
  - { method: GET, path: "/api/pledges", description: "List pledges", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["loan_id?", "pledge_security_id?", "status?"], output: "CollateralPledge[]", side_effects: [] }
  - { method: POST, path: "/api/loans/{loan_id}/pledges/{pledge_id}/substitute", description: "Replace a pledge with new collateral (OCC on loan version)", roles: [BorrowerRep], code: 200, input: [expected_loan_version, pledge_type, "amount_cents?", "pledge_security_id?", "quantity?"], output: CollateralPledge, side_effects: ["old pledge -> SUBSTITUTED; new pledge ACTIVE; increments Loan.version by 1"] }
  - { method: POST, path: "/api/pledges/{pledge_id}/release", description: "Release excess collateral (must not create a margin deficit)", roles: [DeskTrader], code: 200, input: [], output: CollateralPledge, side_effects: ["status -> RELEASED; posted_collateral_cents recomputed"] }

  # --- Margin calls ---
  - { method: GET, path: "/api/margin-calls/{call_id}", description: "Read a margin call", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: MarginCall, side_effects: [] }
  - { method: GET, path: "/api/margin-calls", description: "List margin calls", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["loan_id?", "status?"], output: "MarginCall[]", side_effects: [] }
  - { method: POST, path: "/api/margin-calls/{call_id}/declare-default", description: "Declare default on an ESCALATED call; defaults the loan", roles: [RiskOfficer], code: 200, input: [], output: MarginCall, side_effects: ["status -> DEFAULTED; loan -> DEFAULTED with full default cascade"] }

  # --- Recalls ---
  - { method: POST, path: "/api/loans/{loan_id}/recalls", description: "Issue a full recall (owner only; quantity must equal outstanding; deadline strictly after today)", roles: [OwnerRep], code: 201, input: [quantity, reason, deadline_date], output: Recall, side_effects: ["status=ISSUED; loan BOOKED -> RECALLED"] }
  - { method: GET, path: "/api/recalls/{recall_id}", description: "Read a recall", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: Recall, side_effects: [] }
  - { method: GET, path: "/api/recalls", description: "List recalls", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["loan_id?", "owner_id?", "status?"], output: "Recall[]", side_effects: [] }
  - { method: POST, path: "/api/recalls/{recall_id}/extend", description: "Extend the deadline once", roles: [OwnerRep], code: 200, input: [new_deadline_date], output: Recall, side_effects: ["status -> EXTENDED; extended_once = true"] }
  - { method: POST, path: "/api/recalls/{recall_id}/cancel", description: "Cancel a recall with zero deliveries; loan returns to BOOKED", roles: [OwnerRep], code: 200, input: [], output: Recall, side_effects: ["status -> CANCELLED; loan RECALLED -> BOOKED"] }
  - { method: POST, path: "/api/recalls/{recall_id}/buy-in", description: "Execute a buy-in on a FAILED recall", roles: [DeskTrader], code: 200, input: [buy_in_price_cents], output: Recall, side_effects: ["status -> BOUGHT_IN; FAIL_FEE + BUY_IN_CHARGE ledger entries; loan -> SETTLED with settlement cascade"] }

  # --- Cash collateral reinvestment ---
  - { method: POST, path: "/api/loans/{loan_id}/reinvestments", description: "Invest uninvested cash collateral (CASH loans in BOOKED/RECALLED)", roles: [DeskTrader], code: 201, input: [instrument_type, principal_cents, stated_yield_bps], output: ReinvestmentTranche, side_effects: ["status=INVESTED; current_nav_cents=principal_cents; cash_uninvested_cents -= principal"] }
  - { method: GET, path: "/api/reinvestments/{tranche_id}", description: "Read a tranche", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: ReinvestmentTranche, side_effects: [] }
  - { method: GET, path: "/api/reinvestments", description: "List tranches", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["loan_id?", "status?"], output: "ReinvestmentTranche[]", side_effects: [] }
  - { method: POST, path: "/api/reinvestments/{tranche_id}/mark", description: "Mark the tranche NAV", roles: [OpsSettler], code: 200, input: [current_nav_cents], output: ReinvestmentTranche, side_effects: ["current_nav_cents updated"] }
  - { method: POST, path: "/api/reinvestments/{tranche_id}/unwind", description: "Unwind a tranche (loan must be BOOKED/RECALLED)", roles: [DeskTrader], code: 200, input: [], output: ReinvestmentTranche, side_effects: ["status -> UNWOUND; REINVEST_INCOME_FINAL entry; principal returns to cash_uninvested_cents"] }

  # --- Ledger ---
  - { method: GET, path: "/api/ledger-entries/{entry_id}", description: "Read a ledger entry", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: RevenueLedgerEntry, side_effects: [] }
  - { method: GET, path: "/api/ledger-entries", description: "List ledger entries", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: ["loan_id?", "owner_id?", "period?", "entry_type?"], output: "RevenueLedgerEntry[]", side_effects: [] }

  # --- Ops runs, period close, clock ---
  - { method: POST, path: "/api/ops/mark-to-market", description: "Daily batch for the current clock date: provisional accruals (fee/rebate/reinvest), margin-call issue/refresh/cure/escalation, request expiry, recall failure, override expiry. Re-running the same date never double-accrues", roles: [OpsSettler], code: 200, input: [], output: "{ as_of_date: string, loans_accrued: integer, margin_calls_issued: integer, margin_calls_cured: integer, margin_calls_escalated: integer, requests_expired: integer, recalls_failed: integer, overrides_expired: integer }", side_effects: ["all daily checkpoints per the calculations table"] }
  - { method: POST, path: "/api/ops/month-end-close", description: "Close a period: finalize accruals, post true-ups, run the revenue split", roles: [OpsSettler], code: 201, input: [period], output: PeriodClose, side_effects: ["FEE_ACCRUAL_FINAL + FEE_TRUE_UP per loan; REVENUE_SPLIT_OWNER/AGENT per owner; ERR_PERIOD_ALREADY_CLOSED on repeat"] }
  - { method: GET, path: "/api/period-closes/{period_id}", description: "Read a period close record (id is the YYYY-MM period)", roles: [DeskAdmin, DeskTrader, BorrowerRep, OwnerRep, RiskOfficer, OpsSettler], code: 200, input: [], output: PeriodClose, side_effects: [] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time", roles: [DeskAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all date-sensitive logic reads this clock"] }

  # --- Regulatory reports ---
  - { method: POST, path: "/api/regulatory-reports", description: "Create a DRAFT regulatory report for a period", roles: [OpsSettler], code: 201, input: [period, report_type], output: RegulatoryReport, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/api/regulatory-reports/{report_id}", description: "Read a report", roles: [DeskAdmin, DeskTrader, RiskOfficer, OpsSettler], code: 200, input: [], output: RegulatoryReport, side_effects: [] }
  - { method: GET, path: "/api/regulatory-reports", description: "List reports", roles: [DeskAdmin, DeskTrader, RiskOfficer, OpsSettler], code: 200, input: ["period?", "status?"], output: "RegulatoryReport[]", side_effects: [] }
  - { method: POST, path: "/api/regulatory-reports/{report_id}/finalize", description: "Finalize (freeze aggregates); requires the period to be closed", roles: [OpsSettler], code: 200, input: [], output: RegulatoryReport, side_effects: ["status -> FINALIZED; aggregates computed; finalized_by_user_id set"] }
  - { method: POST, path: "/api/regulatory-reports/{report_id}/reopen", description: "Reopen a FINALIZED report (cycle back to DRAFT)", roles: [OpsSettler], code: 200, input: [], output: RegulatoryReport, side_effects: ["status -> DRAFT; aggregates cleared"] }
  - { method: POST, path: "/api/regulatory-reports/{report_id}/file", description: "File a FINALIZED report (SoD: filer != finalizer)", roles: [DeskAdmin], code: 200, input: [], output: RegulatoryReport, side_effects: ["status -> FILED; filed_by_user_id set"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or entity-backed caller acting on another owner's/borrower's resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, non-positive quantity/amount, malformed date" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is in a state from which the requested transition does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loan_version does not match the loan's current version (OCC)" }
  - { id: ERR_SECURITY_HALTED, http: 409, condition: "Security is HALTED; match/accept/confirm/security-pledge creation blocked" }
  - { id: ERR_BORROWER_SUSPENDED, http: 409, condition: "Borrower is SUSPENDED or DEFAULTED; match/booking blocked" }
  - { id: ERR_OWNER_SUSPENDED, http: 409, condition: "Beneficial owner is SUSPENDED or OFFBOARDED; position create/match/booking blocked" }
  - { id: ERR_POSITION_SUSPENDED, http: 409, condition: "Lendable position is SUSPENDED; match/booking blocked" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: override approver equals requester, or report filer equals finalizer" }
  - { id: ERR_RECALL_ALREADY_OPEN, http: 409, condition: "Loan already has a non-terminal Recall (ISSUED/EXTENDED/FAILED)" }
  - { id: ERR_RECALL_ALREADY_EXTENDED, http: 409, condition: "Recall was already extended once" }
  - { id: ERR_RECALL_PARTIALLY_DELIVERED, http: 409, condition: "Recall cancel rejected: delivered_quantity > 0" }
  - { id: ERR_RECALL_WINDOW_INVALID, http: 422, condition: "Recall deadline not strictly after issue date, or extension does not push the deadline later" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Override effective_from must be strictly before expires_at" }
  - { id: ERR_REQUEST_EXPIRED, http: 422, condition: "Borrow request needed_by_date is before the current clock date" }
  - { id: ERR_OVERRIDE_WINDOW_OVERLAP, http: 409, condition: "Approve would overlap another APPROVED override window for the borrower (half-open; adjacency allowed)" }
  - { id: ERR_NO_INVENTORY, http: 409, condition: "No eligible lendable position satisfies the match selector" }
  - { id: ERR_AMBIGUOUS_MATCH, http: 409, condition: "Selector tie remains after min_fee_bps, created_at, and quantity_total keys" }
  - { id: ERR_FORWARD_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping reservations plus on-loan quantity would exceed position quantity_total on some day of the window" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "Prospective borrower utilization would reach >= 9000 bps of the effective limit" }
  - { id: ERR_MARGIN_DEFICIT, http: 409, condition: "Release would drop posted collateral below required" }
  - { id: ERR_MARGIN_CALL_OUTSTANDING, http: 409, condition: "Amendment blocked while a margin call is OPEN or ESCALATED on the loan" }
  - { id: ERR_RETURN_EXCEEDS_LOAN, http: 422, condition: "Return quantity exceeds outstanding_quantity" }
  - { id: ERR_REINVEST_EXCEEDS_CASH, http: 422, condition: "Reinvestment principal exceeds loan.cash_uninvested_cents" }
  - { id: ERR_LOAN_NOT_CASH_COLLATERAL, http: 409, condition: "Reinvestment requires a CASH-collateral loan" }
  - { id: ERR_PLEDGE_TYPE_MISMATCH, http: 422, condition: "pledge_type=CASH requires amount_cents and forbids pledge_security_id/quantity; pledge_type=SECURITY requires pledge_security_id+quantity and forbids amount_cents" }
  - { id: ERR_COLLATERAL_SHORTFALL, http: 409, condition: "Substitute pledge value is below the substituted pledge's marked value" }
  - { id: ERR_INSUFFICIENT_UNINVESTED_CASH, http: 409, condition: "Cash pledge release exceeds the loan's uninvested cash balance" }
  - { id: ERR_RATE_ABOVE_MAX, http: 422, condition: "Counter rate exceeds the linked borrow request's max_rate_bps" }
  - { id: ERR_BUY_IN_NOT_ALLOWED, http: 409, condition: "Buy-in requires the recall in FAILED status" }
  - { id: ERR_PERIOD_ALREADY_CLOSED, http: 409, condition: "Month-end close already exists for the period" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 409, condition: "Report finalize requires a PeriodClose for the report's period" }
  - { id: ERR_OWNER_HAS_OPEN_LOANS, http: 409, condition: "Owner offboard blocked by open loans or reserved/on-loan position quantities" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeskTrader
    description: "Custodian lending-desk trader: matches demand, negotiates and books loans, manages collateral mix and reinvestment"
    identity: opaque
    exclusive_operations:
      - "POST /api/borrow-requests/{id}/match"
      - "POST /api/loans (direct proposal), /counter (from COUNTERED), /confirm, /amendments"
      - "POST /api/pledges/{id}/release"
      - "POST /api/loans/{id}/reinvestments, POST /api/reinvestments/{id}/unwind"
      - "POST /api/recalls/{id}/buy-in"
      - "POST /api/borrowers/{id}/limit-overrides (request only — cannot approve)"
    shared_operations: ["GET reads", "POST /api/loans/{id}/cancel (with BorrowerRep)"]
  - name: BorrowerRep
    description: "Borrower-side representative; X-User-ID is the Borrower id"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /api/borrow-requests, /cancel (own borrower only)"
      - "POST /api/loans/{id}/counter (from PROPOSED), /accept (own loans)"
      - "POST /api/loans/{id}/returns, POST /api/loans/{id}/pledges, pledge substitute (own loans)"
    shared_operations: ["GET reads (auto-scoped to own borrower_id)", "POST /api/loans/{id}/cancel (with DeskTrader)"]
  - name: OwnerRep
    description: "Beneficial-owner representative; X-User-ID is the BeneficialOwner id"
    identity: "entity_backed:BeneficialOwner"
    exclusive_operations:
      - "POST /api/lendable-positions (+ suspend/resume, own positions only)"
      - "POST /api/loans/{id}/recalls, /api/recalls/{id}/extend, /cancel (own loans only)"
    shared_operations: ["GET reads (auto-scoped to own owner_id)"]
  - name: RiskOfficer
    description: "Counterparty risk: suspends/defaults borrowers and owners, approves/rejects limit overrides (never own requests), declares margin-call default"
    identity: opaque
    exclusive_operations:
      - "POST /api/borrowers/{id}/suspend, /resume, /default"
      - "POST /api/beneficial-owners/{id}/suspend, /resume, /offboard"
      - "POST /api/limit-overrides/{id}/approve, /reject"
      - "POST /api/margin-calls/{id}/declare-default"
    shared_operations: ["GET reads"]
  - name: OpsSettler
    description: "Operations/settlement: runs mark-to-market and month-end close, marks reinvestment NAVs, drafts and finalizes regulatory reports"
    identity: opaque
    exclusive_operations:
      - "POST /api/ops/mark-to-market, /api/ops/month-end-close"
      - "POST /api/reinvestments/{id}/mark"
      - "POST /api/regulatory-reports (+ finalize, reopen — never file)"
    shared_operations: ["GET reads"]
  - name: DeskAdmin
    description: "Desk administrator: security master and price feed, counterparty onboarding, logical clock, files finalized regulatory reports (never finalizes)"
    identity: opaque
    exclusive_operations:
      - "POST /api/securities (+ halt, resume, price)"
      - "POST /api/beneficial-owners, POST /api/borrowers"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/regulatory-reports/{id}/file"
    shared_operations: ["GET reads"]
