              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { st_late: "$.data.status", recv_late: "$.data.received_at" }
          assert:
            - "${dl_mail} == 2026-08-22T00:00:00Z and ${dl_store} == 2026-08-03T00:00:00Z  # 21 versus 2 days from the same submission instant"
            - "${st_store} == RECEIVED with ${recv_store} == 2026-08-03T00:00:00Z  # the in-store deadline is inclusive too"
            - "${st_ontime} == RECEIVED with ${recv_ontime} == 2026-08-22T00:00:00Z  # clock_now == receive_deadline_at is on time"
