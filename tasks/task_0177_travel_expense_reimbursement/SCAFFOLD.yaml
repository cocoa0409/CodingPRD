scenario: |
  Travel & Expense Reimbursement (T&E): GSA Per Diem, flight policy, rental car
  CDW, meal itemization, receipt OCR, virtual card issuance, Out-of-Policy
  approval chain, Mileage Reimbursement.

domain_name: "travel-expense-reimbursement"
api_prefix: "/trips"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: hybrid
  # Trip is a parent; ExpenseReport sits under Trip but ExpenseLine references
  # peer entities Receipt and VirtualCard via FK (not nested), and
  # OutOfPolicyApproval references ExpenseLine cross-aggregate.

  state_machine_shape: branching
  # ExpenseReport has fork (REJECTED vs CHANGES_REQUESTED vs APPROVED) plus
  # cycle (CHANGES_REQUESTED → DRAFT). ExpenseLine carries parallel dimensions
  # (policy_status × ocr_status). OutOfPolicyApproval has approval-chain
  # branching with optional escalation hop.

  relationship_patterns:
    - one_to_many       # Trip → ExpenseReport → ExpenseLine
    - cross_aggregate   # OutOfPolicyApproval → ExpenseLine; VirtualCard → Trip
    - polymorphic       # ExpenseLine.category determines which sub-fields apply
                        # (flight | lodging | rental_car | meal | mileage | other)

  role_model: approval_chain
  # Traveler → Manager → FinanceReviewer; OutOfPolicy escalates to OOPApprover.
  # Segregation: a Traveler cannot approve their own report; Manager cannot
  # approve OOP if they are also the named Traveler.

  consistency_model: immediate
  # All mutations atomic per request; derived fields (e.g., report.total,
  # report.policy_violation_count) recomputed inline on the mutating endpoint.

# =============================================================================
# Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Display name of the employee."
      - name: email
        type: string
        source: input
        description: "Unique business email; used as login identifier."
        constraints: "Globally unique; case-insensitive comparison."
      - name: role
        type: enum
        source: input
        description: "Functional role determining default permissions."
        constraints: "One of {TRAVELER, MANAGER, FINANCE_REVIEWER, OOP_APPROVER, ADMIN}."
      - name: manager_id
        type: string
        source: input
        description: "Employee.id of the direct manager. Required for TRAVELER, must be null for ADMIN."
      - name: cost_center
        type: string
        source: input
        description: "Free-form cost-center code charged for this employee's trips."
      - name: home_address_state
        type: string
        source: input
        description: "Two-letter US state code of the employee's home/duty address; used as default origin for per-diem boundary checks."

  - name: PerDiemRate
    parent: null
    common_fields: false
    fields:
      - name: city
        type: string
        source: input
        description: "City name; matched case-insensitively against trip destinations."
      - name: state
        type: string
        source: input
        description: "Two-letter US state code."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the fiscal-year window during which this rate applies."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the fiscal-year window during which this rate applies."
      - name: lodging_cap_cents
        type: integer
        source: input
        description: "Maximum reimbursable lodging per night, in cents."
      - name: mie_cap_cents
        type: integer
        source: input
        description: "Maximum daily Meals & Incidental Expenses (M&IE) cap, in cents."
      - name: is_high_cost_locality
        type: boolean
        source: input
        description: "True for GSA-designated high-cost localities (affects OOP escalation rules)."

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - name: traveler_id
        type: string
        source: input
        description: "Employee.id of the traveler (must have role TRAVELER)."
      - name: purpose
        type: string
        source: input
        description: "Business purpose of the trip; free-form text 1-500 chars."
      - name: origin_city
        type: string
        source: input
        description: "Origin city."
      - name: origin_state
        type: string
        source: input
        description: "Two-letter US state code of origin."
      - name: destination_city
        type: string
        source: input
        description: "Destination city — used to resolve PerDiemRate."
      - name: destination_state
        type: string
        source: input
        description: "Two-letter US state code of destination."
      - name: start_date
        type: datetime
        source: input
        description: "Trip start (inclusive, UTC midnight semantics)."
      - name: end_date
        type: datetime
        source: input
        description: "Trip end (inclusive, UTC midnight semantics)."
        constraints: "end_date >= start_date."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the trip request."
        constraints: "One of {DRAFT, SUBMITTED, APPROVED, REJECTED, CHANGES_REQUESTED, COMPLETED, CANCELLED}."
        default: "DRAFT"
      - name: estimated_budget_cents
        type: integer
        source: computed
        description: "Provisional cost estimate computed at submission time (calculation: trip_budget_estimate, provisional variant)."
      - name: pinned_per_diem_rate_id
        type: string
        source: computed
        description: "PerDiemRate.id frozen onto the trip when APPROVED — defends against rate-table edits between approval and reimbursement."
      - name: approved_at
        type: datetime
        source: system
        description: "Timestamp of manager approval (null until APPROVED)."

  - name: VirtualCard
    parent: null
    common_fields: true
    fields:
      - name: trip_id
        type: string
        source: input
        description: "Trip.id this card funds."
      - name: card_last4
        type: string
        source: system
        description: "Server-minted last-4 digits identifier (string of 4 digits)."
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum cumulative authorized amount on this card, in cents."
        constraints: "credit_limit_cents >= 0; must be <= trip.estimated_budget_cents at issuance."
      - name: status
        type: enum
        source: computed
        description: "Card lifecycle state."
        constraints: "One of {REQUESTED, ISSUED, ACTIVE, LOCKED, CLOSED}."
        default: "REQUESTED"
      - name: authorized_amount_cents
        type: integer
        source: computed
        description: "Running sum of authorized (non-reversed) charges, in cents."
        default: 0
      - name: locked_reason
        type: string
        source: system
        description: "Free-form reason populated when status transitions to LOCKED (null otherwise)."

  - name: ExpenseReport
    parent: Trip
    common_fields: true
    fields:
      - name: trip_id
        type: string
        source: input
        description: "Parent Trip.id."
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle."
        constraints: "One of {DRAFT, SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, REJECTED, APPROVED, REIMBURSED}."
        default: "DRAFT"
      - name: total_claimed_cents
        type: integer
        source: computed
        description: "Sum over child ExpenseLine.amount_claimed_cents for lines with line_status != VOIDED. Recomputed on every line mutation."
        default: 0
      - name: total_reimbursable_cents
        type: integer
        source: computed
        description: "Sum over child ExpenseLine.amount_reimbursable_cents (lines with line_status != VOIDED). Recomputed on every line mutation and on report state changes."
        default: 0
      - name: policy_violation_count
        type: integer
        source: computed
        description: "Count of child ExpenseLine where policy_status == OUT_OF_POLICY. Recomputed inline."
        default: 0
      - name: reviewer_id
        type: string
        source: system
        description: "FinanceReviewer Employee.id who claimed the report (null until IN_REVIEW)."
      - name: submitted_at
        type: datetime
        source: system
        description: "Submission timestamp (null until SUBMITTED)."
      - name: approved_at
        type: datetime
        source: system
        description: "Approval timestamp (null until APPROVED)."
      - name: reimbursed_at
        type: datetime
        source: system
        description: "Reimbursement timestamp (null until REIMBURSED)."

  - name: ExpenseLine
    parent: ExpenseReport
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "Parent ExpenseReport.id."
      - name: category
        type: enum
        source: input
        description: "Expense category — determines which polymorphic fields apply."
        constraints: "One of {FLIGHT, LODGING, RENTAL_CAR, MEAL, MILEAGE, OTHER}."
      - name: expense_date
        type: datetime
        source: input
        description: "Date on which the expense was incurred (UTC midnight)."
      - name: amount_claimed_cents
        type: integer
        source: input
        description: "Raw amount the traveler is claiming, in cents. For MILEAGE category this MUST be omitted on create (server computes from miles_driven)."
      - name: amount_reimbursable_cents
        type: integer
        source: computed
        description: "Final reimbursable amount after applying caps, deductions, and OOP rules."
        default: 0
      - name: policy_status
        type: enum
        source: computed
        description: "Parallel state dimension #1: policy evaluation outcome."
        constraints: "One of {PENDING_EVAL, IN_POLICY, OUT_OF_POLICY, OOP_APPROVED, OOP_DENIED}."
        default: "PENDING_EVAL"
      - name: ocr_status
        type: enum
        source: computed
        description: "Parallel state dimension #2: OCR/receipt validation outcome — evolves INDEPENDENTLY of policy_status."
        constraints: "One of {NO_RECEIPT, PENDING_OCR, OCR_VERIFIED, OCR_MISMATCH, OCR_WAIVED}."
        default: "NO_RECEIPT"
      - name: line_status
        type: enum
        source: computed
        description: "Top-level line lifecycle, derived from policy_status × ocr_status."
        constraints: "One of {ACTIVE, REIMBURSED, VOIDED}."
        default: "ACTIVE"
      - name: receipt_id
        type: string
        source: input
        description: "FK to Receipt.id; required when category in {LODGING, RENTAL_CAR, FLIGHT} or amount_claimed_cents > 7500 (=$75)."
      - name: miles_driven
        type: number
        source: input
        description: "Required when category == MILEAGE; total mileage for the leg. Decimal with 1 fractional digit."
      - name: rental_days
        type: integer
        source: input
        description: "Required when category == RENTAL_CAR; integer >= 1."
      - name: meal_type
        type: enum
        source: input
        description: "Required when category == MEAL."
        constraints: "One of {BREAKFAST, LUNCH, DINNER, INCIDENTAL}."
      - name: meal_was_provided
        type: boolean
        source: input
        description: "When true and category == MEAL, line is reimbursed at 0 and policy_status auto-set to IN_POLICY (provided-meal deduction)."
        default: false
      - name: per_diem_method
        type: enum
        source: input
        description: "For LODGING and MEAL: ACTUAL (itemized) or PER_DIEM (cap-based). Required for LODGING; required for MEAL when meal_was_provided=false."
        constraints: "One of {ACTUAL, PER_DIEM}."
      - name: cdw_purchased
        type: boolean
        source: input
        description: "Only meaningful when category == RENTAL_CAR; indicates Collision Damage Waiver was purchased by the traveler."
        default: false
      - name: virtual_card_id
        type: string
        source: input
        description: "Optional FK to VirtualCard.id; when set, the line was charged to this card and must reconcile against authorized_amount_cents."

  - name: Receipt
    parent: null
    common_fields: false
    fields:
      - name: uploader_employee_id
        type: string
        source: input
        description: "Employee.id who uploaded the receipt."
      - name: merchant_name
        type: string
        source: input
        description: "Merchant as captured from upload metadata."
      - name: merchant_total_cents
        type: integer
        source: input
        description: "OCR-extracted total amount, in cents — single source of truth for OCR comparison."
      - name: ocr_extracted_date
        type: datetime
        source: input
        description: "OCR-extracted date on the receipt (UTC midnight semantics)."
      - name: ocr_confidence
        type: number
        source: input
        description: "OCR confidence score in [0.00, 1.00]."
      - name: used_by_line_id
        type: string
        source: system
        description: "ExpenseLine.id this receipt is currently bound to (null until first bind). Once bound it MUST NOT be rebound to a different line."

  - name: OutOfPolicyApproval
    parent: null
    common_fields: true
    fields:
      - name: expense_line_id
        type: string
        source: input
        description: "ExpenseLine.id whose policy_status == OUT_OF_POLICY at request time."
      - name: requester_employee_id
        type: string
        source: input
        description: "Employee.id of the traveler requesting OOP approval."
      - name: justification
        type: string
        source: input
        description: "Free-form justification, 10-1000 chars."
      - name: chain_level
        type: enum
        source: computed
        description: "Where in the approval chain the request currently sits."
        constraints: "One of {AWAITING_L1, AWAITING_L2, AWAITING_FINAL, FINAL_APPROVED, DENIED}."
        default: "AWAITING_L1"
      - name: l1_approver_id
        type: string
        source: system
        description: "Manager Employee.id who acted at L1 (null until L1 action)."
      - name: l2_approver_id
        type: string
        source: system
        description: "FinanceReviewer Employee.id who acted at L2 (null until L2 action)."
      - name: final_approver_id
        type: string
        source: system
        description: "OOPApprover Employee.id who acted at FINAL (null unless escalated and acted on)."
      - name: requires_final_escalation
        type: boolean
        source: computed
        description: "True iff line.amount_claimed_cents > $1000 (100000 cents) OR the destination's PerDiemRate.is_high_cost_locality is true. Determines whether L2 approval finalizes or hands off to OOP_APPROVER."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Trip
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /trips/{id}/submit"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
          - "end_date >= start_date"
          - "destination_city resolves to at least one PerDiemRate whose [effective_from, effective_to) covers start_date"
        side_effects:
          - "Compute and store trip.estimated_budget_cents via calculation 'trip_budget_estimate' (provisional variant)."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /trips/{id}/approve"
        actor: MANAGER
        preconditions:
          - "Acting Employee.id == Trip.traveler's Employee.manager_id"
          - "estimated_budget_cents > 0"
        side_effects:
          - "Pin pinned_per_diem_rate_id to the PerDiemRate.id resolved at submission (defends against later rate edits)."
          - "Set approved_at = now()."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /trips/{id}/reject"
        actor: MANAGER
        preconditions:
          - "Acting Employee.id == Trip.traveler's Employee.manager_id"
        side_effects:
          - "Any pending VirtualCard with trip_id and status==REQUESTED auto-transitions to CLOSED (cascade hop 1)."
          - "That CLOSED transition itself triggers any existing ExpenseReport with this trip_id to transition to REJECTED (cascade hop 2), since a closed funding source on a non-approved trip invalidates the report."
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /trips/{id}/request-changes"
        actor: MANAGER
        preconditions:
          - "Acting Employee.id == Trip.traveler's Employee.manager_id"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /trips/{id}"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
        side_effects:
          - "estimated_budget_cents cleared to 0; pinned_per_diem_rate_id cleared to null."
        note: "Revision cycle — traveler edits, then re-submits."
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /trips/{id}/complete"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
          - "current_date >= end_date (use POST /_clock/advance to drive)"
        side_effects:
          - "All ACTIVE VirtualCards for this trip auto-transition to LOCKED with locked_reason='trip_completed' (cascade prevents post-trip charges)."
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
          - "No ExpenseReport with this trip_id has status != DRAFT"
        side_effects:
          - "All VirtualCards for this trip with status in {REQUESTED, ISSUED, ACTIVE} auto-transition to CLOSED."

  - entity: VirtualCard
    initial_state: REQUESTED
    terminal_states: [CLOSED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /virtual-cards/{id}/issue"
        actor: FINANCE_REVIEWER
        preconditions:
          - "Trip.status == APPROVED"
          - "credit_limit_cents <= Trip.estimated_budget_cents"
        side_effects:
          - "Server mints card_last4 (deterministic from id)."
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /virtual-cards/{id}/activate"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
        side_effects: []
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /virtual-cards/{id}/lock"
        actor: FINANCE_REVIEWER
        preconditions: []
        side_effects:
          - "Set locked_reason from request body."
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /virtual-cards/{id}/unlock"
        actor: FINANCE_REVIEWER
        preconditions:
          - "Trip.status != COMPLETED AND Trip.status != CANCELLED"
        side_effects:
          - "Clear locked_reason."
        note: "Cycle: ACTIVE ↔ LOCKED."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /virtual-cards/{id}/close"
        actor: FINANCE_REVIEWER
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CLOSED
        trigger: "system: parent Trip transitions to REJECTED or CANCELLED"
        actor: system
        preconditions:
          - "Trip.status in {REJECTED, CANCELLED}"
        side_effects: []

  - entity: ExpenseReport
    initial_state: DRAFT
    terminal_states: [REIMBURSED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /expense-reports/{id}/submit"
        actor: TRAVELER
        preconditions:
          - "Trip.status == APPROVED OR Trip.status == COMPLETED"
          - "At least one ExpenseLine exists with line_status == ACTIVE"
          - "Every ExpenseLine with category in {LODGING, RENTAL_CAR, FLIGHT} has a bound Receipt (ocr_status in {OCR_VERIFIED, OCR_MISMATCH, OCR_WAIVED})"
        side_effects:
          - "Set submitted_at = now()."
          - "Recompute total_claimed_cents, total_reimbursable_cents, policy_violation_count."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /expense-reports/{id}/claim"
        actor: FINANCE_REVIEWER
        preconditions: []
        side_effects:
          - "Set reviewer_id = X-User-ID."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /expense-reports/{id}/approve"
        actor: FINANCE_REVIEWER
        preconditions:
          - "policy_violation_count == 0 OR every OUT_OF_POLICY line has a resolved OutOfPolicyApproval with chain_level == FINAL_APPROVED"
          - "Acting reviewer_id == X-User-ID"
          - "Acting Employee.id != Trip.traveler_id (segregation of duties)"
        side_effects:
          - "Set approved_at = now()."
          - "Recompute total_reimbursable_cents using FINAL variant of each calculation (replays per-diem and mileage with pinned per-diem rate)."
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /expense-reports/{id}/reject"
        actor: FINANCE_REVIEWER
        preconditions:
          - "reviewer_id == X-User-ID"
        side_effects:
          - "Cascade hop 1: every child ExpenseLine with line_status == ACTIVE transitions to VOIDED."
          - "Cascade hop 2: each VOIDED line whose virtual_card_id is non-null triggers VirtualCard.authorized_amount_cents -= line.amount_reimbursable_cents (deauthorization)."
          - "Cascade hop 3: any OutOfPolicyApproval bound to a now-VOIDED line is itself transitioned to DENIED."
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /expense-reports/{id}/request-changes"
        actor: FINANCE_REVIEWER
        preconditions:
          - "reviewer_id == X-User-ID"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /expense-reports/{id} or POST /expense-reports/{id}/lines"
        actor: TRAVELER
        preconditions:
          - "Trip.traveler_id == X-User-ID"
        side_effects:
          - "Clear reviewer_id."
        note: "Cycle: traveler edits and re-submits."
      - from: APPROVED
        to: REIMBURSED
        trigger: "POST /expense-reports/{id}/disburse"
        actor: FINANCE_REVIEWER
        preconditions:
          - "approved_at is not null"
          - "Acting Employee.id != Trip.traveler_id"
        side_effects:
          - "Set reimbursed_at = now()."
          - "Every child ExpenseLine with line_status == ACTIVE transitions to REIMBURSED."

  - entity: ExpenseLine
    initial_state: ACTIVE
    terminal_states: [REIMBURSED, VOIDED]
    transitions:
      # ----- policy_status dimension (parallel) -----
      - from: "policy_status=PENDING_EVAL"
        to: "policy_status=IN_POLICY"
        trigger: "POST /expense-reports/{report_id}/lines or PATCH /expense-lines/{id}"
        actor: TRAVELER
        preconditions:
          - "amount_claimed_cents (post-calculation) <= applicable cap (per-diem, mileage, CDW)"
        side_effects:
          - "Compute amount_reimbursable_cents via category-specific calculation."
          - "If meal_was_provided == true, force amount_reimbursable_cents = 0 and policy_status = IN_POLICY."
      - from: "policy_status=PENDING_EVAL"
        to: "policy_status=OUT_OF_POLICY"
        trigger: "POST /expense-reports/{report_id}/lines or PATCH /expense-lines/{id}"
        actor: TRAVELER
        preconditions:
          - "amount_claimed_cents (post-calculation) > applicable cap"
        side_effects:
          - "Parent ExpenseReport.policy_violation_count += 1."
      - from: "policy_status=OUT_OF_POLICY"
        to: "policy_status=OOP_APPROVED"
        trigger: "system: bound OutOfPolicyApproval.chain_level transitions to FINAL_APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Set amount_reimbursable_cents = amount_claimed_cents."
          - "Parent ExpenseReport.policy_violation_count -= 1."
          - "Parent ExpenseReport.total_reimbursable_cents += (amount_claimed_cents - prior_reimbursable)."
      - from: "policy_status=OUT_OF_POLICY"
        to: "policy_status=OOP_DENIED"
        trigger: "system: bound OutOfPolicyApproval.chain_level transitions to DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "Set amount_reimbursable_cents = capped amount (per the category's cap calculation)."
      # ----- ocr_status dimension (parallel and independent) -----
      - from: "ocr_status=NO_RECEIPT"
        to: "ocr_status=PENDING_OCR"
        trigger: "POST /expense-lines/{id}/attach-receipt"
        actor: TRAVELER
        preconditions:
          - "Receipt.used_by_line_id is null"
        side_effects:
          - "Set Receipt.used_by_line_id = this line id."
      - from: "ocr_status=PENDING_OCR"
        to: "ocr_status=OCR_VERIFIED"
        trigger: "system: Receipt.merchant_total_cents == ExpenseLine.amount_claimed_cents AND ocr_confidence >= 0.80"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ocr_status=PENDING_OCR"
        to: "ocr_status=OCR_MISMATCH"
        trigger: "system: Receipt.merchant_total_cents != ExpenseLine.amount_claimed_cents OR ocr_confidence < 0.80"
        actor: system
        preconditions: []
        side_effects:
          - "If category == MEAL and abs(diff) <= 200 cents and ocr_confidence >= 0.60, auto-set ocr_status=OCR_WAIVED instead."
      - from: "ocr_status=OCR_MISMATCH"
        to: "ocr_status=OCR_WAIVED"
        trigger: "POST /expense-lines/{id}/waive-ocr"
        actor: FINANCE_REVIEWER
        preconditions:
          - "Parent ExpenseReport.status == IN_REVIEW"
        side_effects: []
      # ----- line_status dimension (rolled up; only transitions captured at submission/reject) -----
      - from: "line_status=ACTIVE"
        to: "line_status=VOIDED"
        trigger: "system: parent ExpenseReport transitions to REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "If virtual_card_id is non-null, VirtualCard.authorized_amount_cents -= amount_reimbursable_cents."
      - from: "line_status=ACTIVE"
        to: "line_status=REIMBURSED"
        trigger: "system: parent ExpenseReport transitions to REIMBURSED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OutOfPolicyApproval
    initial_state: AWAITING_L1
    terminal_states: [FINAL_APPROVED, DENIED]
    transitions:
      - from: AWAITING_L1
        to: AWAITING_L2
        trigger: "POST /oop-approvals/{id}/l1-approve"
        actor: MANAGER
        preconditions:
          - "Acting Employee.id == Traveler.manager_id (Traveler = ExpenseLine.report.trip.traveler)"
          - "Acting Employee.id != Traveler.id (segregation of duties)"
        side_effects:
          - "Set l1_approver_id = X-User-ID."
      - from: AWAITING_L1
        to: DENIED
        trigger: "POST /oop-approvals/{id}/deny"
        actor: MANAGER
        preconditions:
          - "Acting Employee.id == Traveler.manager_id"
        side_effects:
          - "Set chain_level = DENIED."
          - "Cascade: bound ExpenseLine transitions policy_status to OOP_DENIED (system transition)."
      - from: AWAITING_L2
        to: AWAITING_FINAL
        trigger: "POST /oop-approvals/{id}/l2-approve"
        actor: FINANCE_REVIEWER
        preconditions:
          - "requires_final_escalation == true"
          - "Acting Employee.id != Traveler.id"
        side_effects:
          - "Set l2_approver_id = X-User-ID."
      - from: AWAITING_L2
        to: FINAL_APPROVED
        trigger: "POST /oop-approvals/{id}/l2-approve"
        actor: FINANCE_REVIEWER
        preconditions:
          - "requires_final_escalation == false"
          - "Acting Employee.id != Traveler.id"
        side_effects:
          - "Set l2_approver_id = X-User-ID."
          - "Cascade: bound ExpenseLine transitions policy_status to OOP_APPROVED (system transition)."
      - from: AWAITING_L2
        to: DENIED
        trigger: "POST /oop-approvals/{id}/deny"
        actor: FINANCE_REVIEWER
        preconditions: []
        side_effects:
          - "Cascade: bound ExpenseLine transitions policy_status to OOP_DENIED."
      - from: AWAITING_FINAL
        to: FINAL_APPROVED
        trigger: "POST /oop-approvals/{id}/final-approve"
        actor: OOP_APPROVER
        preconditions:
          - "Acting Employee.id != Traveler.id"
          - "Acting Employee.id != l1_approver_id"
        side_effects:
          - "Set final_approver_id = X-User-ID."
          - "Cascade: bound ExpenseLine transitions policy_status to OOP_APPROVED."
      - from: AWAITING_FINAL
        to: DENIED
        trigger: "POST /oop-approvals/{id}/deny"
        actor: OOP_APPROVER
        preconditions: []
        side_effects:
          - "Cascade: bound ExpenseLine transitions policy_status to OOP_DENIED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two finance reviewers simultaneously claim the same SUBMITTED ExpenseReport."
    guarantee: "Exactly one /claim succeeds; second receives ERR_REPORT_ALREADY_CLAIMED."
    error_id: ERR_REPORT_ALREADY_CLAIMED
    http_status: 409
    serialization: "First-writer-wins on ExpenseReport.reviewer_id."

  - scenario: "Two travelers attach the same Receipt to two different ExpenseLines."
    guarantee: "Receipt.used_by_line_id can be set at most once; second attach is rejected."
    error_id: ERR_RECEIPT_ALREADY_USED
    http_status: 409
    serialization: "First-writer-wins on Receipt.used_by_line_id."

  - scenario: "Approve and reject the same OutOfPolicyApproval simultaneously."
    guarantee: "Exactly one terminal transition wins; loser receives ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on OutOfPolicyApproval.chain_level."

  - scenario: "Two charges race to authorize against the same VirtualCard where the second would breach credit_limit_cents."
    guarantee: "First charge succeeds; second receives ERR_CARD_LIMIT_EXCEEDED."
    error_id: ERR_CARD_LIMIT_EXCEEDED
    http_status: 409
    serialization: "Authorize attempts serialize on VirtualCard.id; running authorized_amount_cents checked under lock."

  - scenario: "Disburse an APPROVED report twice simultaneously."
    guarantee: "Exactly one disburse advances status to REIMBURSED; second receives ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ExpenseReport.status."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: trip_budget_estimate
    trigger: "POST /trips/{id}/submit (provisional); POST /expense-reports/{id}/approve (final)"
    algorithm: aggregation
    formula: |
      # Number of nights = (end_date - start_date) in whole days
      nights = (end_date - start_date).days
      # Number of M&IE days = nights + 1 (per GSA: travel days are included)
      mie_days = nights + 1

      rate = resolve_per_diem(destination_city, destination_state, start_date)
      lodging_budget = rate.lodging_cap_cents * nights

      # First and last day = 75% of M&IE rate (GSA "first-and-last-day rule").
      # Middle days = full M&IE rate. Use Python integer math, round half up.
      if mie_days == 1:
          mie_budget = round_half_up(rate.mie_cap_cents * 0.75)
      else:
          first_last = 2 * round_half_up(rate.mie_cap_cents * 0.75)
          middle = (mie_days - 2) * rate.mie_cap_cents
          mie_budget = first_last + middle

      estimated_budget_cents = lodging_budget + mie_budget
    input_set: "Trip with status==DRAFT (provisional run) or Trip with status==APPROVED (final run)."
    constants:
      FIRST_LAST_DAY_FRACTION: 0.75
    precision: "Integer cents; intermediate fraction multiplies cap then round_half_up."
    variants:
      - name: provisional
        when: "Computed at /submit; uses PerDiemRate active at start_date as resolved at submission time."
        difference: "Result stored on Trip.estimated_budget_cents; PerDiemRate.id NOT yet pinned."
      - name: final
        when: "Computed at /expense-reports/{id}/approve; uses Trip.pinned_per_diem_rate_id."
        difference: "Resolves the per-diem rate via pinned_per_diem_rate_id, NOT by re-running the resolver. If the rate-table row has been edited since approval, the two variants diverge even with identical Trip inputs."

  - name: mileage_reimbursement
    trigger: "POST /expense-reports/{report_id}/lines with category==MILEAGE; recomputed on PATCH"
    algorithm: tiered_pricing
    formula: |
      # IRS standard rates (2024): 67 cents/mile for business.
      # Personal-car deduction: when the trip also has a RENTAL_CAR line on
      # the same date, mileage in excess of 30 round-trip miles is reimbursed
      # at MILEAGE_PERSONAL_OVERLAP_RATE_CENTS (= 21 cents/mile) instead.

      def round_per_leg(miles, rate_cents_per_mile):
          # Per-leg-round-then-sum: round each leg to nearest cent, then sum.
          # The scaffold pins this order; sum-then-round produces different cents.
          return round_half_up(miles * rate_cents_per_mile)

      same_date_rental = exists ExpenseLine where
          report_id == self.report_id
          and category == RENTAL_CAR
          and expense_date == self.expense_date
          and line_status != VOIDED

      if not same_date_rental or self.miles_driven <= MILEAGE_OVERLAP_THRESHOLD:
          amount_reimbursable_cents = round_per_leg(self.miles_driven, IRS_BUSINESS_RATE_CENTS)
      else:
          base = round_per_leg(MILEAGE_OVERLAP_THRESHOLD, IRS_BUSINESS_RATE_CENTS)
          excess = round_per_leg(self.miles_driven - MILEAGE_OVERLAP_THRESHOLD,
                                 MILEAGE_PERSONAL_OVERLAP_RATE_CENTS)
          amount_reimbursable_cents = base + excess
    input_set: "ExpenseLine where category==MILEAGE and line_status != VOIDED."
    constants:
      IRS_BUSINESS_RATE_CENTS: 67           # cents per mile
      MILEAGE_OVERLAP_THRESHOLD: 30.0       # miles
      MILEAGE_PERSONAL_OVERLAP_RATE_CENTS: 21  # cents per mile beyond threshold when rental car is in use
    precision: "Per-leg-round-then-sum, round_half_up at each leg's cent boundary."
    variants:
      - name: standalone
        when: "No same-date RENTAL_CAR line on the report."
        difference: "Single-tier formula: miles * IRS_BUSINESS_RATE_CENTS."
      - name: rental_overlap
        when: "Same-date RENTAL_CAR line exists on the report."
        difference: "Tiered with overlap threshold; excess miles reimbursed at deeply discounted rate to discourage double-dipping."

  - name: meal_itemization_reimbursement
    trigger: "POST /expense-reports/{report_id}/lines with category==MEAL; recomputed on PATCH and on report approve (final variant)"
    algorithm: threshold
    formula: |
      if self.meal_was_provided:
          return 0

      rate = resolve_per_diem(trip.destination_city, trip.destination_state, self.expense_date)
      meal_share = {
          BREAKFAST: 0.25,
          LUNCH: 0.30,
          DINNER: 0.45,
          INCIDENTAL: 0.05,
      }[self.meal_type]
      per_meal_cap = round_half_up(rate.mie_cap_cents * meal_share)

      if self.per_diem_method == PER_DIEM:
          return per_meal_cap
      # per_diem_method == ACTUAL
      if self.amount_claimed_cents <= per_meal_cap:
          return self.amount_claimed_cents
      else:
          # Over-cap → policy_status = OUT_OF_POLICY; reimbursable defaults
          # to per_meal_cap unless OOP approval flips it back to claimed.
          return per_meal_cap
    input_set: "ExpenseLine where category==MEAL and line_status != VOIDED."
    constants:
      MEAL_BREAKFAST_SHARE: 0.25
      MEAL_LUNCH_SHARE: 0.30
      MEAL_DINNER_SHARE: 0.45
      MEAL_INCIDENTAL_SHARE: 0.05
    precision: "Round_half_up to integer cents."
    variants:
      - name: provisional
        when: "Line creation/edit during DRAFT or SUBMITTED."
        difference: "Resolves PerDiemRate live at expense_date."
      - name: final
        when: "Report approval."
        difference: "Resolves PerDiemRate via Trip.pinned_per_diem_rate_id; diverges from provisional iff the rate row was edited since trip approval."

  - name: rental_car_cdw_reimbursement
    trigger: "POST /expense-reports/{report_id}/lines with category==RENTAL_CAR; recomputed on PATCH"
    algorithm: threshold
    formula: |
      # rental_days * daily_cap + CDW handling.
      base = self.rental_days * RENTAL_DAILY_CAP_CENTS  # 6500 cents/day = $65/day
      claimed_base = min(self.amount_claimed_cents, base)

      if self.cdw_purchased:
          # CDW is reimbursable up to CDW_DAILY_CAP_CENTS per day if and
          # only if the destination_state is NOT in CORPORATE_CDW_STATES.
          if trip.destination_state in CORPORATE_CDW_STATES:
              # Corporate insurance program covers CDW → CDW non-reimbursable.
              cdw_allowed = 0
          else:
              cdw_allowed = self.rental_days * CDW_DAILY_CAP_CENTS  # 1500 cents/day
          if self.amount_claimed_cents > base:
              # Excess over base is treated as CDW component, capped.
              cdw_component = min(self.amount_claimed_cents - base, cdw_allowed)
              return claimed_base + cdw_component
      return claimed_base
    input_set: "ExpenseLine where category==RENTAL_CAR and line_status != VOIDED."
    constants:
      RENTAL_DAILY_CAP_CENTS: 6500
      CDW_DAILY_CAP_CENTS: 1500
      CORPORATE_CDW_STATES: ["CA", "TX", "NY", "FL", "WA"]
    precision: "Integer cents."
    variants:
      - name: standard
        when: "Trip destination_state NOT in CORPORATE_CDW_STATES."
        difference: "CDW reimbursable up to CDW_DAILY_CAP_CENTS * rental_days."
      - name: corporate_covered
        when: "Trip destination_state IN CORPORATE_CDW_STATES."
        difference: "CDW component is non-reimbursable regardless of cdw_purchased flag."

  - name: lowest_logical_fare_variance
    trigger: "POST /expense-reports/{report_id}/lines with category==FLIGHT (provisional); POST /expense-reports/{id}/approve (final)"
    algorithm: forward_looking
    formula: |
      # Lowest Logical Fare (LLF) = mean of (lodging_cap + mie_cap) snapshot
      # for the destination on the booking date, used as a proxy ceiling.
      # In production, LLF would come from a GDS feed; this scaffold pins it
      # to a deterministic function of PerDiemRate so tests are reproducible.

      rate = resolve_per_diem(trip.destination_city, trip.destination_state, self.expense_date)
      llf_cents = rate.lodging_cap_cents + rate.mie_cap_cents

      variance_cents = self.amount_claimed_cents - llf_cents

      if variance_cents <= LLF_VARIANCE_TOLERANCE_CENTS:
          policy_status = IN_POLICY
          amount_reimbursable_cents = self.amount_claimed_cents
      else:
          policy_status = OUT_OF_POLICY
          amount_reimbursable_cents = llf_cents  # capped pending OOP approval
    input_set: "ExpenseLine where category==FLIGHT and line_status != VOIDED."
    constants:
      LLF_VARIANCE_TOLERANCE_CENTS: 10000  # $100
    precision: "Integer cents."
    variants:
      - name: forward_looking_at_booking
        when: "Line creation during DRAFT — uses PerDiemRate active at expense_date."
        difference: "Pins variance against the rate live at booking; never updated by later rate edits."
      - name: chronological_at_approval
        when: "Report approval (final pass)."
        difference: "Replays variance against Trip.pinned_per_diem_rate_id (which was frozen at trip approval, NOT at the flight line's expense_date). The two variants diverge whenever the line's expense_date sits in a different rate window than the trip's start_date."

  - name: report_totals_rollup
    trigger: "Any mutation on ExpenseLine; any state transition on ExpenseReport"
    algorithm: aggregation
    formula: |
      total_claimed_cents = sum(line.amount_claimed_cents
                                for line in report.lines
                                if line.line_status != VOIDED)
      total_reimbursable_cents = sum(line.amount_reimbursable_cents
                                     for line in report.lines
                                     if line.line_status != VOIDED)
      policy_violation_count = count(line for line in report.lines
                                     if line.policy_status == OUT_OF_POLICY)
    input_set: "All ExpenseLine children of the report, filtered by line_status != VOIDED for amount sums."
    constants: {}
    precision: "Integer cents; no rounding (sums of already-rounded values)."
    variants:
      - name: live
        when: "Run inline on every line mutation and every report state transition."
        difference: "Single variant — no provisional/final divergence."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present, non-empty, well-formed UUID for X-User-ID."
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {TRAVELER, MANAGER, FINANCE_REVIEWER, OOP_APPROVER, ADMIN}; X-User-ID resolves to an Employee with that role."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-parameter resources exist (left-to-right). Trip before ExpenseReport before ExpenseLine, etc."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys resolve (receipt_id, virtual_card_id, manager_id, expense_line_id, etc.)."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: state
    check: "Resource is in a state that permits the requested transition (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state precondition holds — e.g., ExpenseReport submit requires Trip.status in {APPROVED, COMPLETED}; VirtualCard issue requires Trip.status==APPROVED."
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "submit/issue/disburse endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties — acting Employee.id MUST NOT equal Trip.traveler_id when invoking /approve, /disburse, /l1-approve, /l2-approve, /final-approve."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "approval and disbursement endpoints"

  - priority: 8
    category: business_safety
    check: "Receipt is not already bound to another ExpenseLine (Receipt.used_by_line_id is null)."
    error_id: ERR_RECEIPT_ALREADY_USED
    http_status: 409
    applies_to: "POST /expense-lines/{id}/attach-receipt"

  - priority: 9
    category: business_referential
    check: "VirtualCard is being charged against a Trip that matches the report's parent trip (virtual_card_id.trip_id == report.trip_id)."
    error_id: ERR_CARD_TRIP_MISMATCH
    http_status: 422
    applies_to: "POST/PATCH expense-lines with virtual_card_id"

  - priority: 10
    category: business_temporal
    check: "ExpenseLine.expense_date lies within [Trip.start_date, Trip.end_date] inclusive."
    error_id: ERR_EXPENSE_OUTSIDE_TRIP_WINDOW
    http_status: 422
    applies_to: "POST/PATCH expense-lines"

  - priority: 11
    category: business_constraint
    check: "Per-diem rate exists covering trip start_date for the destination."
    error_id: ERR_PER_DIEM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /trips/{id}/submit, POST /expense-reports/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "Receipt is required when category in {LODGING, RENTAL_CAR, FLIGHT} OR amount_claimed_cents > 7500."
    error_id: ERR_RECEIPT_REQUIRED
    http_status: 422
    applies_to: "POST /expense-reports/{report_id}/lines"

  - priority: 13
    category: business_constraint
    check: "Category-specific required fields populated: MILEAGE→miles_driven; RENTAL_CAR→rental_days; MEAL→meal_type; LODGING/MEAL→per_diem_method when not provided meal."
    error_id: ERR_CATEGORY_FIELD_MISSING
    http_status: 422
    applies_to: "POST /expense-reports/{report_id}/lines"

  - priority: 14
    category: business_fiscal
    check: "VirtualCard.credit_limit_cents at issuance <= Trip.estimated_budget_cents."
    error_id: ERR_CARD_LIMIT_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /virtual-cards/{id}/issue, POST /virtual-cards (create)"

  - priority: 15
    category: business_fiscal
    check: "VirtualCard charge would not push authorized_amount_cents above credit_limit_cents."
    error_id: ERR_CARD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST/PATCH expense-lines with virtual_card_id"

  - priority: 16
    category: business_constraint
    check: "OOP approval chain step is invoked by the correct role: L1 by MANAGER, L2 by FINANCE_REVIEWER, FINAL by OOP_APPROVER."
    error_id: ERR_OOP_WRONG_APPROVER_ROLE
    http_status: 403
    applies_to: "POST /oop-approvals/{id}/{l1-approve|l2-approve|final-approve}"

  - priority: 17
    category: business_constraint
    check: "OOP final approver MUST NOT equal l1_approver_id (no rubber-stamp escalation)."
    error_id: ERR_OOP_DUPLICATE_APPROVER
    http_status: 403
    applies_to: "POST /oop-approvals/{id}/final-approve"

  - priority: 18
    category: business_constraint
    check: "OCC version mismatch: request body's `version` must equal current entity.version."
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Trips -----
  - method: POST
    path: "/trips"
    description: "Create a Trip in DRAFT state."
    roles: [TRAVELER]
    code: 201
    input: [traveler_id, purpose, origin_city, origin_state, destination_city, destination_state, start_date, end_date]
    output: Trip
    side_effects: []

  - method: GET
    path: "/trips"
    description: "List trips, filtered by traveler_id, status, date range; paginated."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: ["traveler_id?", "status?", "start_date_from?", "start_date_to?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/trips/{id}"
    description: "Retrieve a Trip."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: PATCH
    path: "/trips/{id}"
    description: "Edit Trip fields while in DRAFT or CHANGES_REQUESTED."
    roles: [TRAVELER]
    code: 200
    input: ["purpose?", "origin_city?", "origin_state?", "destination_city?", "destination_state?", "start_date?", "end_date?", version]
    output: Trip
    side_effects:
      - "If current status==CHANGES_REQUESTED, transition to DRAFT (clears estimated_budget_cents, pinned_per_diem_rate_id)."

  - method: POST
    path: "/trips/{id}/submit"
    description: "Submit a DRAFT trip for manager approval."
    roles: [TRAVELER]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "calculation: trip_budget_estimate (provisional)."

  - method: POST
    path: "/trips/{id}/approve"
    description: "Manager approves submitted trip."
    roles: [MANAGER]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "Pin pinned_per_diem_rate_id."

  - method: POST
    path: "/trips/{id}/reject"
    description: "Manager rejects submitted trip (terminal)."
    roles: [MANAGER]
    code: 200
    input: ["reason?"]
    output: Trip
    side_effects:
      - "Cascade: pending VirtualCards → CLOSED → any ExpenseReport on this trip → REJECTED."

  - method: POST
    path: "/trips/{id}/request-changes"
    description: "Manager sends trip back to traveler for revisions."
    roles: [MANAGER]
    code: 200
    input: ["notes?"]
    output: Trip
    side_effects: []

  - method: POST
    path: "/trips/{id}/complete"
    description: "Traveler marks trip completed after end_date (gate-checked against system clock)."
    roles: [TRAVELER]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "Cascade: ACTIVE VirtualCards → LOCKED."

  - method: POST
    path: "/trips/{id}/cancel"
    description: "Traveler cancels APPROVED trip before travel."
    roles: [TRAVELER]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "Cascade: all non-CLOSED VirtualCards → CLOSED."

  # ----- Virtual Cards -----
  - method: POST
    path: "/virtual-cards"
    description: "Request a VirtualCard for an APPROVED trip."
    roles: [TRAVELER]
    code: 201
    input: [trip_id, credit_limit_cents]
    output: VirtualCard
    side_effects: []

  - method: POST
    path: "/virtual-cards/{id}/issue"
    description: "Finance issues the requested card (REQUESTED→ISSUED)."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  - method: POST
    path: "/virtual-cards/{id}/activate"
    description: "Traveler activates an ISSUED card."
    roles: [TRAVELER]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  - method: POST
    path: "/virtual-cards/{id}/lock"
    description: "Finance locks an ACTIVE card."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: [locked_reason]
    output: VirtualCard
    side_effects: []

  - method: POST
    path: "/virtual-cards/{id}/unlock"
    description: "Finance unlocks a LOCKED card (cycle back to ACTIVE)."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  - method: POST
    path: "/virtual-cards/{id}/close"
    description: "Finance closes a card (terminal)."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  - method: GET
    path: "/virtual-cards/{id}"
    description: "Retrieve a virtual card."
    roles: [TRAVELER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  # ----- Expense Reports -----
  - method: POST
    path: "/expense-reports"
    description: "Create an ExpenseReport bound to a trip."
    roles: [TRAVELER]
    code: 201
    input: [trip_id]
    output: ExpenseReport
    side_effects: []

  - method: GET
    path: "/expense-reports"
    description: "List expense reports; filterable by traveler, status, trip; paginated."
    roles: [TRAVELER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: ["traveler_id?", "status?", "trip_id?", "limit?", "offset?"]
    output: "ExpenseReport[]"
    side_effects: []

  - method: GET
    path: "/expense-reports/{id}"
    description: "Retrieve an expense report."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: []
    output: ExpenseReport
    side_effects: []

  - method: POST
    path: "/expense-reports/{id}/submit"
    description: "Submit a DRAFT report."
    roles: [TRAVELER]
    code: 200
    input: []
    output: ExpenseReport
    side_effects:
      - "calculation: report_totals_rollup."

  - method: POST
    path: "/expense-reports/{id}/claim"
    description: "Finance reviewer claims a SUBMITTED report."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: ExpenseReport
    side_effects: []

  - method: POST
    path: "/expense-reports/{id}/approve"
    description: "Reviewer approves an IN_REVIEW report."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: ExpenseReport
    side_effects:
      - "calculation: report_totals_rollup (final variant of dependent calcs)."

  - method: POST
    path: "/expense-reports/{id}/reject"
    description: "Reviewer rejects an IN_REVIEW report."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: ["reason?"]
    output: ExpenseReport
    side_effects:
      - "Cascade: lines VOIDED → card deauthorization → bound OOP approvals DENIED."

  - method: POST
    path: "/expense-reports/{id}/request-changes"
    description: "Reviewer sends report back to traveler."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: ["notes?"]
    output: ExpenseReport
    side_effects: []

  - method: POST
    path: "/expense-reports/{id}/disburse"
    description: "Reviewer disburses APPROVED report (terminal)."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: ExpenseReport
    side_effects:
      - "All ACTIVE child lines transition to REIMBURSED."

  - method: PATCH
    path: "/expense-reports/{id}"
    description: "Edit a CHANGES_REQUESTED report (lightweight metadata edits)."
    roles: [TRAVELER]
    code: 200
    input: [version]
    output: ExpenseReport
    side_effects:
      - "If CHANGES_REQUESTED, transition to DRAFT."

  # ----- Expense Lines -----
  - method: POST
    path: "/expense-reports/{report_id}/lines"
    description: "Add a new expense line to a report."
    roles: [TRAVELER]
    code: 201
    input: [category, expense_date, "amount_claimed_cents?", "receipt_id?", "miles_driven?", "rental_days?", "meal_type?", "meal_was_provided?", "per_diem_method?", "cdw_purchased?", "virtual_card_id?"]
    output: ExpenseLine
    side_effects:
      - "calculation: category-specific (mileage_reimbursement | meal_itemization_reimbursement | rental_car_cdw_reimbursement | lowest_logical_fare_variance)."
      - "calculation: report_totals_rollup."

  - method: PATCH
    path: "/expense-lines/{id}"
    description: "Edit a line in DRAFT or CHANGES_REQUESTED report."
    roles: [TRAVELER]
    code: 200
    input: ["amount_claimed_cents?", "miles_driven?", "rental_days?", "meal_type?", "meal_was_provided?", "per_diem_method?", "cdw_purchased?", "virtual_card_id?", version]
    output: ExpenseLine
    side_effects:
      - "Recompute category calculation and report_totals_rollup."

  - method: GET
    path: "/expense-lines/{id}"
    description: "Retrieve an expense line."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: []
    output: ExpenseLine
    side_effects: []

  - method: POST
    path: "/expense-lines/{id}/attach-receipt"
    description: "Bind a Receipt to a line (drives ocr_status independently of policy_status)."
    roles: [TRAVELER]
    code: 200
    input: [receipt_id]
    output: ExpenseLine
    side_effects:
      - "ocr_status: NO_RECEIPT → PENDING_OCR → OCR_VERIFIED|OCR_MISMATCH|OCR_WAIVED (inline)."

  - method: POST
    path: "/expense-lines/{id}/waive-ocr"
    description: "Finance reviewer waives an OCR_MISMATCH while report IN_REVIEW."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: ["waiver_note?"]
    output: ExpenseLine
    side_effects: []

  # ----- Receipts -----
  - method: POST
    path: "/receipts"
    description: "Upload a receipt (caller supplies OCR fields directly — no actual file upload in this scaffold)."
    roles: [TRAVELER]
    code: 201
    input: [merchant_name, merchant_total_cents, ocr_extracted_date, ocr_confidence]
    output: Receipt
    side_effects: []

  - method: GET
    path: "/receipts/{id}"
    description: "Retrieve a receipt."
    roles: [TRAVELER, FINANCE_REVIEWER, ADMIN]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  # ----- Out-of-Policy Approvals -----
  - method: POST
    path: "/oop-approvals"
    description: "Open an OOP approval for an OUT_OF_POLICY line."
    roles: [TRAVELER]
    code: 201
    input: [expense_line_id, justification]
    output: OutOfPolicyApproval
    side_effects:
      - "Compute requires_final_escalation = (line.amount_claimed_cents > 100000) OR rate.is_high_cost_locality."

  - method: GET
    path: "/oop-approvals/{id}"
    description: "Retrieve an OOP approval."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, OOP_APPROVER, ADMIN]
    code: 200
    input: []
    output: OutOfPolicyApproval
    side_effects: []

  - method: POST
    path: "/oop-approvals/{id}/l1-approve"
    description: "Manager step (AWAITING_L1 → AWAITING_L2)."
    roles: [MANAGER]
    code: 200
    input: []
    output: OutOfPolicyApproval
    side_effects: []

  - method: POST
    path: "/oop-approvals/{id}/l2-approve"
    description: "Finance step. Branches: if requires_final_escalation, AWAITING_L2 → AWAITING_FINAL; else AWAITING_L2 → FINAL_APPROVED."
    roles: [FINANCE_REVIEWER]
    code: 200
    input: []
    output: OutOfPolicyApproval
    side_effects:
      - "If finalizing: cascade ExpenseLine.policy_status → OOP_APPROVED."

  - method: POST
    path: "/oop-approvals/{id}/final-approve"
    description: "OOP approver step (AWAITING_FINAL → FINAL_APPROVED)."
    roles: [OOP_APPROVER]
    code: 200
    input: []
    output: OutOfPolicyApproval
    side_effects:
      - "Cascade ExpenseLine.policy_status → OOP_APPROVED."

  - method: POST
    path: "/oop-approvals/{id}/deny"
    description: "Any approver can deny their current chain level."
    roles: [MANAGER, FINANCE_REVIEWER, OOP_APPROVER]
    code: 200
    input: ["reason?"]
    output: OutOfPolicyApproval
    side_effects:
      - "Cascade ExpenseLine.policy_status → OOP_DENIED."

  # ----- Per-Diem Rates -----
  - method: POST
    path: "/per-diem-rates"
    description: "Admin loads or edits a per-diem rate row."
    roles: [ADMIN]
    code: 201
    input: [city, state, effective_from, effective_to, lodging_cap_cents, mie_cap_cents, is_high_cost_locality]
    output: PerDiemRate
    side_effects: []

  - method: GET
    path: "/per-diem-rates"
    description: "List per-diem rates; filterable by city/state/effective_from."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, OOP_APPROVER, ADMIN]
    code: 200
    input: ["city?", "state?", "effective_on?", "limit?", "offset?"]
    output: "PerDiemRate[]"
    side_effects: []

  # ----- Employees -----
  - method: POST
    path: "/employees"
    description: "Admin creates an employee."
    roles: [ADMIN]
    code: 201
    input: [full_name, email, role, "manager_id?", cost_center, home_address_state]
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees/{id}"
    description: "Retrieve an employee."
    roles: [TRAVELER, MANAGER, FINANCE_REVIEWER, OOP_APPROVER, ADMIN]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # ----- Test-driving endpoints -----
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving clock advance — sets the server's logical 'now' for time-gated transitions (trip complete after end_date)."
    roles: [ADMIN]
    code: 200
    input: [to]
    output: null
    side_effects:
      - "All subsequent now() calls return the advanced value."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "Required headers missing or malformed."

  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role not recognized or X-User-ID does not have that role."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist."

  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body FK references a non-existent resource."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation invalid for the resource's current state."

  - id: ERR_CROSS_ENTITY_STATE
    http: 409
    condition: "Operation requires a related entity to be in a specific state (e.g., Trip not APPROVED)."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is the traveler (or otherwise prohibited from approving their own action)."

  - id: ERR_RECEIPT_ALREADY_USED
    http: 409
    condition: "Receipt is already bound to a different ExpenseLine."

  - id: ERR_CARD_TRIP_MISMATCH
    http: 422
    condition: "VirtualCard.trip_id != ExpenseReport.trip_id."

  - id: ERR_EXPENSE_OUTSIDE_TRIP_WINDOW
    http: 422
    condition: "ExpenseLine.expense_date not within [trip.start_date, trip.end_date]."

  - id: ERR_PER_DIEM_UNAVAILABLE
    http: 422
    condition: "No PerDiemRate row covers the destination on the relevant date."

  - id: ERR_RECEIPT_REQUIRED
    http: 422
    condition: "Receipt required for this category or amount."

  - id: ERR_CATEGORY_FIELD_MISSING
    http: 422
    condition: "Category-specific required field (miles_driven, rental_days, meal_type, per_diem_method) missing."

  - id: ERR_CARD_LIMIT_EXCEEDS_BUDGET
    http: 422
    condition: "VirtualCard.credit_limit_cents exceeds Trip.estimated_budget_cents at issuance."

  - id: ERR_CARD_LIMIT_EXCEEDED
    http: 409
    condition: "Authorization would push VirtualCard.authorized_amount_cents above credit_limit_cents."

  - id: ERR_OOP_WRONG_APPROVER_ROLE
    http: 403
    condition: "OOP approval step invoked by the wrong role."

  - id: ERR_OOP_DUPLICATE_APPROVER
    http: 403
    condition: "OOP final approver coincides with l1_approver_id."

  - id: ERR_STALE_VERSION
    http: 409
    condition: "OCC version mismatch on PATCH."

  - id: ERR_REPORT_ALREADY_CLAIMED
    http: 409
    condition: "Two reviewers race to /claim the same SUBMITTED report; loser sees this."

  - id: ERR_VALIDATION
    http: 400
    condition: "Generic input validation failure (missing required field, bad type/format) not covered by a more specific error."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TRAVELER
    description: "Employee who travels and submits expense reports."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /trips, PATCH /trips/{id}"
      - "POST /trips/{id}/submit, /cancel, /complete"
      - "POST /virtual-cards, /activate"
      - "POST /expense-reports, /submit"
      - "POST /expense-reports/{report_id}/lines, PATCH /expense-lines/{id}"
      - "POST /expense-lines/{id}/attach-receipt"
      - "POST /receipts"
      - "POST /oop-approvals"
    shared_operations:
      - "GET /trips, /trips/{id}, /virtual-cards/{id}, /expense-reports, /expense-reports/{id}, /expense-lines/{id}, /receipts/{id}, /employees/{id}, /per-diem-rates, /oop-approvals/{id}"

  - name: MANAGER
    description: "Direct manager of one or more travelers; approves trips and L1-approves OOP requests."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /trips/{id}/approve, /reject, /request-changes"
      - "POST /oop-approvals/{id}/l1-approve"
    shared_operations:
      - "POST /oop-approvals/{id}/deny"
      - "GET endpoints listed above"

  - name: FINANCE_REVIEWER
    description: "Finance team member who reviews and reimburses expense reports; L2-approves OOP requests."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /virtual-cards/{id}/issue, /lock, /unlock, /close"
      - "POST /expense-reports/{id}/claim, /approve, /reject, /request-changes, /disburse"
      - "POST /expense-lines/{id}/waive-ocr"
      - "POST /oop-approvals/{id}/l2-approve"
    shared_operations:
      - "POST /oop-approvals/{id}/deny"
      - "GET endpoints listed above"

  - name: OOP_APPROVER
    description: "Senior approver for OOP requests requiring final escalation (high-cost localities or >$1000 lines)."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /oop-approvals/{id}/final-approve"
    shared_operations:
      - "POST /oop-approvals/{id}/deny"
      - "GET endpoints listed above"

  - name: ADMIN
    description: "Platform admin: manages employees, per-diem rates, and the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees, /per-diem-rates, /_clock/advance"
    shared_operations:
      - "GET endpoints listed above"
