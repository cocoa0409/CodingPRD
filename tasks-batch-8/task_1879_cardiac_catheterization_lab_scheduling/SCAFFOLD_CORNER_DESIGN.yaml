        claim_type: constants_applied
        grounds: ["calculations.registry_completeness", "errors[ERR_SUBMISSION_INCOMPLETE]"]
        distinguishing_aspect: "An ELECTIVE case completed with no RADIATION dose record has 6 of 7 required elements => completeness_pct 85.7; submit is rejected ERR_SUBMISSION_INCOMPLETE."
