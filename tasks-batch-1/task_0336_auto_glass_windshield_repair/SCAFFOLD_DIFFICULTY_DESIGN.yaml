            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_a}", technician_id: "${tech_id}", service_bay_id: "${bay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T13:00:00Z", end_at: "2026-06-13T14:00:00Z" }
              as: ServiceAdvisor
              captures: { appt_a: $.data.id }
            - call: "POST /work-orders"
