        distinguishing_aspect: |
          VolumeFact declares common_fields false, so its create and read responses carry
          id and created_at but NO version and NO updated_at, and §1.5 declares no PATCH,
          PUT or DELETE for it: a correction is a second fact row in a different week, not
          an edit of the first.
        test_recipe:
          setup:
