            - { call: "POST /iz-compliance/households/${h3_id}/apply", payload: { lottery_event_id: "${le2_id}" }, as: Resident, as_user_id: "${h3_id}" }
            - { call: "POST /iz-compliance/lottery-events/${le1_id}/draw", payload: {}, as: ProgramAdministrator, captures: { err_open: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/lottery-events/${le2_id}/draw", payload: {}, as: ProgramAdministrator, captures: { err_empty: $.data.error_id } }
            - { call: "POST /iz-compliance/lottery-events/${le1_id}/draw", payload: {}, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u1_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-20" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
            - { call: "POST /iz-compliance/lottery-events/${le1_id}/redraw", payload: { reason: "Preference audit reopened" }, as: ProgramAdministrator, captures: { err_redraw: $.data.error_id } }
          assert:
            - "the plan whose lottery_open_at equals its lottery_close_at returns 422 ERR_INVALID_MARKETING_WINDOW — the rule is STRICTLY before, so a zero-length window is not a degenerate accept"
            - "applying at 2026-08-01T00:00:00Z returns 422 ERR_APPLICATION_WINDOW_CLOSED and Household.${h1_id}.state stays REGISTERED"
            - "the same call at 2026-08-10T00:00:00Z returns 200 with state APPLIED — only the clock changed"
            - "the draw attempted at 2026-08-10T00:00:00Z returns 409 ERR_APPLICATION_WINDOW_OPEN and LotteryEvent.${le1_id}.state stays PENDING with drawn_at null"
            - "at 2026-08-20T00:00:00Z — exactly lottery_close_at — the draw is allowed while an apply would be refused: the half-open window excludes its upper endpoint for applicants and includes it for the draw"
            - "drawing ${le2_id} returns 422 ERR_EMPTY_ELIGIBLE_POOL because its only applicant ${h3_id} earns 6400000 against the 6334900 limit for household_size 3; the event stays PENDING rather than DRAWN with an empty selection"
            - "drawing ${le1_id} returns 200 with selected_household_ids [${h1_id}, ${h2_id}] and reserves LT-101 for ${h1_id} and LT-102 for ${h2_id}"
            - "after certifying only ${h1_id}, the redraw returns 409 ERR_REDRAW_AFTER_CERTIFICATION even though ${h2_id} is merely SELECTED — one certified selection in the round is enough"
            - "IncomeCertification.${c1_id} survives the refused redraw and LotteryEvent.${le1_id}.state stays DRAWN with redraw_count 0"

      - name: certification_and_recertification_guards_over_eligibility_and_terms
        claim_type: violation_to_error
        grounds:
          - validations.priority_16
          - validations.priority_36
          - validations.priority_41
          - validations.priority_57
          - errors[ERR_HOUSEHOLD_NOT_ELIGIBLE]
          - errors[ERR_RECERT_WINDOW_NOT_OPEN]
          - errors[ERR_RECERT_NOT_APPLICABLE]
          - errors[ERR_CERTIFICATION_NOT_ACTIVE]
        distinguishing_aspect: |
          Recertification is fenced by two rules that must not shadow each other: priority 36 is
          scoped to predecessors with a non-null expires_at, so an OWNERSHIP certification — which
          has no term at all — falls THROUGH it and is caught by priority 57 instead. A RENTAL
          predecessor recertified too early is caught by 36. The same endpoint then reports
          ERR_CERTIFICATION_NOT_ACTIVE once the predecessor has been superseded by a successful
          recertification, so one certification id yields three different errors depending only on
          its tenure and its own state. Eligibility is checked against the limit for the
          household's OWN size, so 6400000 fails at size 3 while a smaller income passes.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT, ONSITE elected, agreement recorded."
            - "Units: RC-101 RENTAL 2br at 5000 bps, and RC-201 OWNERSHIP 2br at 5000 bps with its restriction recorded at 32500000."
            - "Households H1 (size 3, 6000000), H2 (size 3, 6400000 — over the 6334900 limit) and H3 (size 2, 5000000)."
            - "Income limits in force: 6334900 for size 3 and 5639000 for size 2; RECERT_WINDOW_DAYS is 30, so a term expiring 2027-08-01 opens for recertification on 2027-07-02."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Recert Rise", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-RC-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "RC-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u1_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "RC-201", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u2_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u2_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Kira Baros", household_size: 3, gross_annual_income_cents: 6400000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Ines Novak", household_size: 2, gross_annual_income_cents: 5000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h3_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u1_id}", certified_income_cents: 6400000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_elig: $.data.error_id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u1_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h3_id}", unit_id: "${u2_id}", certified_income_cents: 5000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c2_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications/${c1_id}/recertify", payload: { certified_income_cents: 6100000, contract_rent_cents: 141000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_window: $.data.error_id } }
            - { call: "POST /iz-compliance/income-certifications/${c2_id}/recertify", payload: { certified_income_cents: 5100000, contract_rent_cents: 0 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_napp: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-07-15T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/income-certifications/${c1_id}/recertify", payload: { certified_income_cents: 6200000, contract_rent_cents: 141000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1b_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications/${c1_id}/recertify", payload: { certified_income_cents: 6300000, contract_rent_cents: 142000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_inactive: $.data.error_id } }
          assert:
            - "certifying ${h2_id} returns 422 ERR_HOUSEHOLD_NOT_ELIGIBLE: 6400000 exceeds the 6334900 limit for household_size 3 at 5000 bps, and AffordableUnit.${u1_id} stays PLANNED with occupant_household_id null"
            - "certifying ${h1_id} on the same unit with the same payload shape returns 201 — only the income differs"
            - "IncomeCertification.${c1_id}.expires_at == 2027-08-01 (RENTAL, 365 days) while IncomeCertification.${c2_id}.expires_at is null (OWNERSHIP)"
            - "recertifying ${c1_id} at 2026-08-01 returns 422 ERR_RECERT_WINDOW_NOT_OPEN — the window opens 2027-07-02, thirty days before the term ends"
            - "recertifying ${c2_id} returns 422 ERR_RECERT_NOT_APPLICABLE, NOT ERR_RECERT_WINDOW_NOT_OPEN: priority 36 is scoped to a non-null expires_at, so an OWNERSHIP predecessor falls through to priority 57"
            - "at 2027-07-15 the recertification of ${c1_id} returns 201 with a successor ${c1b_id} whose period runs from 2027-08-01, and ${c1_id}.state becomes SUPERSEDED"
            - "recertifying ${c1_id} again returns 409 ERR_CERTIFICATION_NOT_ACTIVE — the same id that succeeded moments earlier now fails at priority 16, before any window arithmetic"
            - "AffordableUnit.${u1_id}.current_rent_cents is 141000 after the successful recertification and unchanged by the refused one"

      - name: monitoring_guards_reject_a_repeat_year_and_an_insufficient_cure
        claim_type: violation_to_error
        grounds:
          - validations.priority_23
          - validations.priority_29
          - errors[ERR_CURE_INSUFFICIENT]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          The cure gate is arithmetic, not procedural: clearing a cure is refused unless
          corrected_rent_cents is at or below the unit's pinned max_allowed_rent_cents, so a
          submitted cure of 150000 against a ceiling of 143872 is rejected at clear-cure even
          though the submission itself was accepted and the review is properly in CURE_SUBMITTED.
          A cure of exactly 143872 on a sibling unit clears, pinning the comparison as
          less-than-or-equal. The annual review key is scoped per unit, so review_year 2027 is
          refused a second time on the same unit and accepted on its neighbour.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT, ONSITE elected, agreement recorded, with RENTAL 2br units MN-101 and MN-102 at 5000 bps."
            - "Households H1 and H2 (both size 3, income 6000000) certified into MN-101 and MN-102 at contract_rent_cents 140000, pinning max_allowed_rent_cents 143872 on both units."
            - "Clock advanced to 2027-03-01T00:00:00Z, then 2027 reviews are recorded by hco-1 on both units reporting rent 165000, giving cure_deadline 2027-03-31 and penalty_at_base_cents 88384 on each."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Monitor Mews", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-MN-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "MN-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u1_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "MN-102", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u2_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Jonas Wolf", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u1_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u2_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u1_id}", review_year: 2027, reported_rent_cents: 165000, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mv1_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u1_id}", review_year: 2027, reported_rent_cents: 143000, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_dup: $.data.error_id } }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u2_id}", review_year: 2027, reported_rent_cents: 165000, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mv2_id: $.data.id } }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv1_id}/submit-cure", payload: { corrected_rent_cents: 150000 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv1_id}/clear-cure", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2", captures: { err_cure: $.data.error_id } }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv2_id}/submit-cure", payload: { corrected_rent_cents: 143872 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv2_id}/clear-cure", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2" }
          assert:
            - "the second 2027 review on ${u1_id} returns 409 ERR_DUPLICATE_RESOURCE and MonitoringReview.${mv1_id} is untouched — its reported_rent_cents is still 165000"
            - "review_year 2027 on ${u2_id} returns 201: the uniqueness key is (unit_id, review_year), not review_year alone"
            - "clear-cure on ${mv1_id} returns 422 ERR_CURE_INSUFFICIENT because 150000 exceeds max_allowed_rent_cents 143872; the review stays CURE_SUBMITTED and AffordableUnit.${u1_id}.compliance_status stays CURE_PENDING"
            - "the refused clear-cure is priority 23, not 17 or 21: the review IS in CURE_SUBMITTED and hco-2 is not the issuing officer hco-1, so both higher rules pass"
            - "clear-cure on ${mv2_id} returns 200 with state CURED and AffordableUnit.${u2_id}.compliance_status COMPLIANT — a cure of EXACTLY 143872 satisfies the ceiling, pinning the comparison as <="
            - "MonitoringReview.${mv1_id}.penalty_final_cents is unchanged by the refused clear-cure"

      - name: close_out_guards_reject_a_bad_unit_mix_and_an_unmet_obligation
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - validations.priority_58
          - errors[ERR_BEDROOM_DISTRIBUTION_FAILED]
          - errors[ERR_OBLIGATION_UNSATISFIED]
        distinguishing_aspect: |
          Close-out runs a ladder of four project-wide audits and the first two are independent in
          opposite directions. Project PX delivers its full 20000 bps obligation but every
          affordable unit is a one-bedroom, so the family-unit floor of 5000 bps fails and
          ERR_BEDROOM_DISTRIBUTION_FAILED wins at priority 25 — the obligation check that follows
          would have passed. Project PY has a perfect unit mix (its single unit is a
          two-bedroom, so the family share is 10000 bps) but delivers only half its obligation,
          so it falls through to ERR_OBLIGATION_UNSATISFIED at priority 58.
