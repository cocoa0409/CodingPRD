            - call: "POST /pressure-tests"
              payload: { job_id: "${y_job_id}", test_side: "SHELL_SIDE", test_type: "PNEUMATIC", test_bay_code: "BAY_2", scheduled_start: "2026-08-12T13:59:00.000Z", scheduled_end: "2026-08-12T18:00:00.000Z" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { err_pneumatic_touch: $.data.error_id }
            - call: "POST /pressure-tests"
              payload: { job_id: "${y_job_id}", test_side: "SHELL_SIDE", test_type: "PNEUMATIC", test_bay_code: "BAY_2", scheduled_start: "2026-08-12T14:00:00.000Z", scheduled_end: "2026-08-12T18:00:00.000Z" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { t3_id: $.data.id, t3_pressure: $.data.test_pressure_psi, t3_hold: $.data.min_hold_minutes, t3_temp: $.data.min_medium_temp_f }
            - call: "POST /pressure-tests"
              payload: { job_id: "${y_job_id}", test_side: "TUBE_SIDE", test_type: "HYDROSTATIC", test_bay_code: "BAY_2", scheduled_start: "2026-08-12T12:00:00.000Z", scheduled_end: "2026-08-12T13:00:00.000Z" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { t4_id: $.data.id }
          assert:
            - "First hydrostatic into an empty bay: HTTP 201, PressureTest.${t1_id}.result == PENDING, test_pressure_psi == 455.0, min_hold_minutes == 30, min_medium_temp_f == 10, and the creation cascades VesselJob.${x_job_id}.status to TESTING"
            - "Second overlapping hydrostatic: HTTP 201 for ${t2_id} — the 10:00-14:00 window overlaps 08:00-12:00 and brings the concurrent count to exactly HYDRO_BAY_CAPACITY = 2, which is admitted"
            - "Third overlapping hydrostatic: ${err_third_hydro} == ERR_TEST_BAY_CAPACITY_EXCEEDED with HTTP 409 — 11:00-13:00 overlaps BOTH existing windows, so it would be the third concurrent hydrostatic test in BAY_2"
            - "Pneumatic exclusivity at one-minute resolution: ${err_pneumatic_touch} == ERR_TEST_BAY_CAPACITY_EXCEEDED — 13:59 is still inside ${t2_id}'s [10:00, 14:00) window, and a pneumatic test must overlap nothing at all, not merely stay under the capacity of 2"
            - "Half-open adjacency: the 14:00 start returns HTTP 201 for ${t3_id} because 14:00 is the exclusive end of ${t2_id}'s window; unlike the furnace rule there is no cooldown buffer, so touching is legal"
            - "Pneumatic variant divergence on the admitted test: ${t3_pressure} == 385.0 (round_half_up(1.1 * 350 * 1.00, 1)), ${t3_hold} == 60 and ${t3_temp} == 40 (-20 + 60) — a LOWER pressure with a LONGER hold at a WARMER medium than the hydrostatic tests in the same bay"
            - "Per-overlap counting, not per-bay counting: the final 12:00-13:00 hydrostatic returns HTTP 201 for ${t4_id}; it is disjoint from ${t1_id}'s [08:00, 12:00) by adjacency and from ${t3_id}'s pneumatic window, so only ${t2_id} overlaps it and the concurrent hydrostatic count is 1"
            - "GET /pressure-tests?test_bay_code=BAY_2 returns exactly 4 rows, all with result == PENDING, and both refused requests left no row behind"

  - rule_id: compensating_invariant
    instances:
      - name: compensating_invariant_heat_mass_conserved_across_issue_scrap_reissue
        grounds:
          - calculations.material_balance
          - state_machines.MaterialHeat.ACCEPTED_to_DEPLETED
          - state_machines.MaterialHeat.DEPLETED_to_ACCEPTED
          - state_machines.Part.ISSUED_to_SCRAPPED
          - endpoints.POST_/parts/{part_id}/scrap
        distinguishing_aspect: |
          The conserved quantity is a MASS ledger in pounds, pinned as
          quantity_received_lb == quantity_remaining_lb + quantity_issued_lb with quantity_issued_lb
          summed over ISSUED parts only. The compensating action (scrap) must reverse both the
          arithmetic AND the status cascade it triggered — a DEPLETED heat has to climb back to
          ACCEPTED — and a re-issue of the identical mass must land on byte-identical ledger values,
          so any drift from float accumulation or from counting SCRAPPED parts in the issued total
          shows up immediately.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers (SoD), one WeldingEngineer, one QCInspector."
            - "A PRESSURE_VESSEL job J-2885-17 in FAB_PLANNING with both design sheets APPROVED, so parts may be issued and scrapped."
            - "Heat H-4471 (SA-516-70, PLATE) received at exactly 2000.00 lb and MTR reviewed ACCEPT: quantity_issued_lb 0.00, quantity_remaining_lb 2000.00, status ACCEPTED."
            - "No parts issued yet."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-17", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "NONE", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_shell_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv2: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv2}", component: "HEAD", rt_extent_declared: "NONE", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_head_id: $.data.id }
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /design-calculations/${c_head_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_head_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /material-heats"
              payload: { heat_number: "H-4471", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_id: $.data.id }
            - call: "POST /material-heats/${heat_id}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
          trigger:
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "SH-01", component_type: "SHELL", issued_quantity_lb: 1200.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "SH-02", component_type: "SHELL", issued_quantity_lb: 800.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /material-heats/${heat_id}"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { remaining_at_depletion: $.data.quantity_remaining_lb, status_at_depletion: $.data.status }
            - call: "POST /parts/${p2_id}/scrap"
              payload: { scrap_reason: "LAMINATION FOUND AT LAYOUT" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "GET /material-heats/${heat_id}"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { remaining_after_scrap: $.data.quantity_remaining_lb, issued_after_scrap: $.data.quantity_issued_lb, status_after_scrap: $.data.status }
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "SH-03", component_type: "SHELL", issued_quantity_lb: 800.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { p3_id: $.data.id }
            - call: "GET /material-heats/${heat_id}"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { remaining_after_reissue: $.data.quantity_remaining_lb, issued_after_reissue: $.data.quantity_issued_lb, status_after_reissue: $.data.status }
          assert:
            - "Forward action drives the ledger to exhaustion: ${remaining_at_depletion} == 0.00 and ${status_at_depletion} == DEPLETED, with quantity_issued_lb == 2000.00"
            - "Compensating action restores the mass: ${remaining_after_scrap} == 800.00 and ${issued_after_scrap} == 1200.00 — the SCRAPPED part is excluded from quantity_issued_lb rather than being netted against it"
            - "Compensating action reverses the cascade: ${status_after_scrap} == ACCEPTED, so the DEPLETED -> ACCEPTED transition fires on the way back, not only ACCEPTED -> DEPLETED on the way out"
            - "Part.${p2_id}.status == SCRAPPED with scrap_reason == LAMINATION FOUND AT LAYOUT, while Part.${p1_id}.status is untouched at ISSUED"
            - "Re-issuing the identical 800.00 lb lands on byte-identical values: ${remaining_after_reissue} == 0.00, ${issued_after_reissue} == 2000.00 and ${status_after_reissue} == DEPLETED — the round trip issue -> scrap -> re-issue leaves ZERO drift in the ledger"
            - "The invariant quantity_received_lb == quantity_remaining_lb + quantity_issued_lb holds at all four observation points: 2000.00 == 800.00 + 1200.00, 2000.00 == 0.00 + 2000.00, 2000.00 == 800.00 + 1200.00 and 2000.00 == 0.00 + 2000.00"
            - "GET /parts?job_id=${job_id}&status=ISSUED returns exactly 2 rows (SH-01 and SH-03) summing to 2000.00 lb, and MaterialHeat.${heat_id}.version has incremented once per ledger-moving call (three times), so the compensation is recorded rather than silently patched"

      - name: compensating_invariant_open_nonconformance_count_conserved_through_repair_cycle
        grounds:
          - entities.VesselJob.fields.nonconformance_open_count
          - state_machines.Nonconformance.OPEN_to_REPAIR
          - state_machines.Nonconformance.REPAIR_to_CLOSED
          - state_machines.VesselJob.NDE_HOLD_to_FABRICATION
          - state_machines.ProductionWeld.nde_REJECTED_to_nde_ACCEPTED
          - calculations.weld_completion_pct
          - endpoints.POST_/nonconformances/{nonconformance_id}/repair-welds
        distinguishing_aspect: |
          A completely different kind of conserved quantity — an integer COUNT of open compliance
          records, pinned as nonconformance_open_count == count(Nonconformance of the job with
          disposition IN {OPEN, REPAIR, USE_AS_IS}) — and the compensation is a multi-step repair
          cycle rather than a single reversing call. The count must hold at every intermediate step
          (a disposition moves the record between two open states without changing the count) and
          must return to 0 only on close, releasing the job's NDE_HOLD; meanwhile the joint ledger
          legitimately GROWS from one joint to two, so the test proves which quantity is conserved
          and which is allowed to change.
