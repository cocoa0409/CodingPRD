            - "Status is 200 and Scenario.${sc_id}.status == \"EVALUATED\""
            - "incremental_units == 0 and investment_cost_cents == 0 — both are short-circuited by the PRICE_REALIZATION variant"
            - "target_item_id is null and added_capacity_hours is null"
            - "gross_uplift_cents == 66567 == round_half_up(1331330 * 5 / 100) — the product is exactly 66566.50 and round_half_up must go UP, so 66566 is wrong"
            - "pre_trade_closure_cents == 66567 == gross_uplift_cents (nothing is subtracted)"
            - "trade_rate_pct == 4.0 because 66567 < TRADE_TIER_1_CENTS 1000000"
            - "trade_spend_cents == 2663 == round_half_up(66567 * 4 / 100) == round_half_up(2662.68)"
            - "net_gap_closure_cents == 63904 == 66567 - 2663"

      - name: scenario_trade_tier_at_5_000_000_boundary_selects_eight_percent
        claim_type: Precision
        grounds:
          - calculations.calc_scenario_gap_closure
          - entities.Scenario.fields.pre_trade_closure_cents
          - entities.Scenario.fields.trade_rate_pct
        distinguishing_aspect: |
          The tier is read from pre_trade_closure_cents ONLY, and its 5_000_000 edge is
          inclusive. Buying 100 hours lands pre-trade at exactly 5_000_000 and pays 8.0 percent
          of the GROSS uplift (600_000), netting 4_400_000; buying 99 hours lands at 4_950_000,
          pays 6.0 percent (445_500) and nets 4_504_500 — MORE net closure from LESS capacity.
          A tier read off gross_uplift_cents would put both scenarios in the 8.0 band and
          destroy the inversion.
