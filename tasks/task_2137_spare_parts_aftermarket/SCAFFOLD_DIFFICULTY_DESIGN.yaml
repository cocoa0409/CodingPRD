          - calculations.aftermarket_price_uplift
          - entities.WorkOrderPartLine.fields.quoted_line_total_cents
        distinguishing_aspect: |
          Depth-4 chain originating from the campaign approval transition: approve writes
          approved_qty (hop 1), which moves the Part PHASE_OUT -> LTB_OPEN (hop 2), which
          re-prices the part at scarcity 0.08 giving current_list_unit_price_cents 1906
          (hop 3), which re-quotes the already-RESERVED line from 12970 to 13343 (hop 4).
          Each hop is caused by the previous one, not directly by the approve call.
