          - errors[ERR_MILK_NOT_ADMINISTRABLE]
        distinguishing_aspect: |
          A third entity pair (MilkBatch -> Admission.infection_status) reading
          the OTHER state dimension of Admission: the batch is verified, unexpired
          and has ample volume, but the infant's infection dimension quarantined
          it. Resolving the infection replays the batch back to VERIFIED and the
          same administration then succeeds.
        test_recipe:
          setup:
            - "Prelude as above."
            - "One ADMITTED admission at Regional NICU A with a VERIFIED MOTHERS_OWN batch of 120.0 ml (received by nurse-1, verified by nurse-2)."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-Q2", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_q2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_q2: $.data.version }
            - call: "POST /referrals/${ref_q2}/accept"
              payload: { expected_unit_version: "${v_q2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_q2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_q2: $.data.id }
            - call: "POST /milk-batches"
              payload: { admission_id: "${adm_q2}", donor_type: "MOTHERS_OWN", volume_ml: 120.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-Q2" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { batch_q2: $.data.id }
            - call: "POST /milk-batches/${batch_q2}/verify"
              payload: { label_code: "LBL-Q2" }
              as: BedsideNurse
              as_user_id: "nurse-2"
          trigger:
            - call: "POST /admissions/${adm_q2}/infection-events"
              payload: { event: "SUSPECT" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /milk-batches/${batch_q2}/administrations"
              payload: { volume_ml: 40.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
              captures: { err_milk_state: $.data.error_id }
            - call: "POST /admissions/${adm_q2}/infection-events"
              payload: { event: "RESOLVE" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /milk-batches/${batch_q2}/administrations"
              payload: { volume_ml: 40.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
          assert:
            - "After call 1: MilkBatch.${batch_q2}.status == QUARANTINED with pre_quarantine_status == VERIFIED"
            - "${err_milk_state} == ERR_MILK_NOT_ADMINISTRABLE with HTTP 422"
            - "After the refused call: administered_ml == 0.0 and remaining_ml == 120.0"
            - "After call 3: MilkBatch.${batch_q2}.status == VERIFIED and pre_quarantine_status == null and Admission.${adm_q2}.infection_status == RESOLVED"
            - "After call 4: administered_ml == 40.0, remaining_ml == 80.0, status == PARTIALLY_ADMINISTERED, Admission.${adm_q2}.milk_administered_ml == 40.0"
            - "Admission.${adm_q2}.care_status stayed ADMITTED throughout — only the infection dimension gated the batch"

  - rule_id: resource_temporal_overlap
    instances:

      - name: isolette_interval_half_open_with_decontamination_buffer
        grounds:
          - calculations.isolette_occupation_interval
          - validations[priority=13]
          - errors[ERR_ISOLETTE_UNAVAILABLE]
          - entities.EquipmentAsset.fields.decontamination_ready_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [depart_at, planned_return_at + buffer)
          on an EquipmentAsset resource, where the buffer (45 minutes for GROUND)
          is part of the occupied interval. A run starting at 12:30 conflicts and
          a run starting exactly at 12:45 — the instant the interval ends — is
          accepted. No other overlap instance uses a buffer or a half-open bound.
        test_recipe:
          setup:
            - "Prelude as above, plus the TRANSPORT_ISOLETTE asset."
            - "Two referrals are accepted at Regional NICU A, giving two reservations."
            - "One ACTIVATED GROUND run occupies the isolette from 2026-08-02T08:00Z with planned return 12:00Z, so its interval including the 45-minute buffer is [08:00, 12:45)."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - *k_isolette
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-I1", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "HFOV" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_i1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_i1: $.data.version }
            - call: "POST /referrals/${ref_i1}/accept"
              payload: { expected_unit_version: "${v_i1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_i1: $.data.reservation_id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-I2", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "HFOV" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_i2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_i2: $.data.version }
            - call: "POST /referrals/${ref_i2}/accept"
              payload: { expected_unit_version: "${v_i2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_i2: $.data.reservation_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_i1}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T08:00:00Z", planned_return_at: "2026-08-02T12:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_i1: $.data.id }
          trigger:
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_i2}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T12:30:00Z", planned_return_at: "2026-08-02T16:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
