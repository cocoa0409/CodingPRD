  # ==========================================================================
  # RULE 4 - transitive_cascade
  # Two four-link chains in different aggregates: the approval cascade
  # (route -> version -> asset -> prior version -> plate orders + ledger) and the
  # settlement cascade (escape -> printer ledger/scorecard -> probation ->
  # proof recheck).
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: approval_cascade_supersedes_prior_version_and_autocancels_plate_orders
        grounds:
          - state_machines.ReviewRoute.IN_PROGRESS_to_COMPLETE_APPROVED
          - state_machines.ArtworkVersion.IN_REVIEW_to_APPROVED
          - state_machines.ArtworkAsset.ACTIVE_to_SUPERSEDE_PENDING
          - state_machines.ArtworkVersion.APPROVED_to_OBSOLETE_PENDING
          - state_machines.PlateOrder.ORDERED_to_CANCELLED
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
          - entities.PlateOrder.fields.auto_cancelled
          - calculations.route_stage_resolution
          - calculations.plate_order_cost
        distinguishing_aspect: |
          One stage-3 QUALITY decision propagates four links in a single request -
          route -> COMPLETE_APPROVED, v2 -> APPROVED, asset -> SUPERSEDE_PENDING with
          current_approved_version_id repointed, and v1 -> OBSOLETE_PENDING - and the
          fourth link is itself conditional, auto-cancelling only the ORDERED
          PlateOrder of v1 and debiting committed_plate_cost_cents by exactly its
          163000 cents; this instance's chain runs through the artwork/plate-cost
          aggregate.
