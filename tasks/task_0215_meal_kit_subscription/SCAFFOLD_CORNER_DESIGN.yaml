              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_act_on_another_members_subscription
        claim_type: peer_roles
        grounds:
          - "roles"
          - "validations[priority=2]"
        distinguishing_aspect: "A Member (X-User-ID = m2) cancelling m1's subscription is rejected with ERR_UNAUTHORIZED (403) — entity_backed ownership enforced."
        test_recipe:
          setup: ["m1 owns subscription s1; m2 is a different member"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_OW", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "ow1@x.com", full_name: "OW1", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "ow2@x.com", full_name: "OW2", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m1}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_UNAUTHORIZED"

      - name: missing_user_context_header_rejected
        claim_type: peer_roles
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call with an undeclared X-User-Role value is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /plans"
              payload: {}
              as: BogusRole
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_plan_change_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-change-stale-subscription]"
          - "endpoints"
        distinguishing_aspect: "POST /subscriptions/{id}/plan-changes with expected_subscription_version equal to the current version succeeds, switches plan_id, and bumps version to 2."
        test_recipe:
          setup: ["Subscription at version 1; a second active plan exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_OCC1", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /plans"
              payload: { code: "P_OCC2", servings_per_meal: 4, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "occ@x.com", full_name: "OCC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p1}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s}/plan-changes"
              payload: { plan_id: "${p2}", expected_subscription_version: "${sv}" }
              as: Member
              as_user_id: "${m}"
              captures: { nv: $.data.version }
          assert:
            - "HTTP 200; Subscription.${s}.plan_id == ${p2}; Subscription.${s}.version == 2"

      - name: occ_stale_version_plan_change_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-change-stale-subscription]"
          - "errors[ERR_STALE_SUBSCRIPTION_VERSION]"
        distinguishing_aspect: "A plan change carrying a stale expected_subscription_version (the original version after a pause already bumped it) is rejected with ERR_STALE_SUBSCRIPTION_VERSION (412)."
        test_recipe:
          setup: ["Subscription version observed as 1, then paused (version -> 2); a plan change carrying expected_subscription_version=1 is stale"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_ST1", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /plans"
              payload: { code: "P_ST2", servings_per_meal: 4, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "stale@x.com", full_name: "Stale", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p1}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id, sv: $.data.version }
            - call: "POST /subscriptions/${s}/pause"
              payload: { resume_date: "2026-08-01T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /subscriptions/${s}/plan-changes"
              payload: { plan_id: "${p2}", expected_subscription_version: "${sv}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_SUBSCRIPTION_VERSION"

      - name: pause_skips_in_window_boxes_cascade
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Subscription.ACTIVE_to_PAUSED"
          - "entities.WeeklyBox.fields.selection_status"
        distinguishing_aspect: "Pausing until 2026-08-01 cascades: an OPEN/PENDING box with delivery_date 2026-07-29 (within window) becomes SKIPPED, while a box with delivery_date 2026-08-12 (after resume) stays OPEN."
        test_recipe:
          setup: ["Two OPEN boxes: in-window 2026-07-29 and post-resume 2026-08-12; subscription paused until 2026-08-01"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CSC", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "csc@x.com", full_name: "CSC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-29T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { boxin: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-08-12T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { boxout: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s}/pause"
              payload: { resume_date: "2026-08-01T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
          assert:
            - "WeeklyBox.${boxin}.selection_status == SKIPPED"
            - "WeeklyBox.${boxout}.selection_status == OPEN"

      - name: cancel_skips_pending_boxes_cascade
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Subscription.ACTIVE_to_CANCELLED"
          - "entities.WeeklyBox.fields.selection_status"
        distinguishing_aspect: "Cancelling a subscription cascades all PENDING boxes (any future delivery_date) to selection_status SKIPPED, regardless of window."
        test_recipe:
          setup: ["One OPEN/PENDING box; subscription cancelled"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CXC", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "cxc@x.com", full_name: "CXC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-09-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m}"
          assert:
            - "WeeklyBox.${box}.selection_status == SKIPPED"
            - "Subscription.${s}.status == CANCELLED"

      - name: lifetime_box_count_derived_after_ship
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Member.fields.lifetime_box_count"
          - "state_machines.WeeklyBox.CHARGED_to_SHIPPED"
        distinguishing_aspect: "Member.lifetime_box_count increments by exactly 1 when a box reaches SHIPPED (derived counter reconciled on the ship side-effect)."
        test_recipe:
          setup: ["Box charged then shipped; member had lifetime_box_count 0"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_LB", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LB1" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LB2" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /members"
              payload: { email: "lb@x.com", full_name: "LB", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r1}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r2}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-11T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /weekly-boxes/${box}/charge"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /weekly-boxes/${box}/ship"
              payload: {}
              as: PlatformOps
          assert:
            - "Member.${m}.lifetime_box_count == 1"

      - name: occ_stale_excluded_difficulty
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-change-stale-subscription]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / subscription_active_paused_cycle
          rationale: "Version monotonic increment across pause/resume hops (1->2->3) is asserted by the named §1.8 instance; the stale-version negative path is separately covered by occ_stale_version_plan_change_rejected above."

