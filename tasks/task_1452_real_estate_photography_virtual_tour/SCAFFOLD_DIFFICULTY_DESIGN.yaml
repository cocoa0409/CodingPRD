  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_gated_by_airspace_authorization_pair
        grounds:
          - state_machines.ShootBooking.ASSIGNED_to_CONFIRMED
          - state_machines.ShootBooking.ASSIGNED_to_AUTHORIZATION_PENDING
          - state_machines.AirspaceAuthorization.PENDING_to_APPROVED
          - errors[ERR_AUTHORIZATION_PENDING]
        distinguishing_aspect: |
          Entity pair ShootBooking -> AirspaceAuthorization: a drone booking's
          ASSIGNED -> CONFIRMED path is forbidden while any authorization is
          PENDING; only the authorization's APPROVED transition unlocks the booking.
          Direct confirm while drone add-on active is rejected outright.
        test_recipe:
          setup:
