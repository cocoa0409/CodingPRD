            - "Two work orders WO1 and WO2 on design D1, both ASSEMBLED, each with its own PerformanceTest scheduled on cell DYNO-1 in non-overlapping windows."
            - "WO1's test uses test_method IEC_60034_2_1_SUMMATION; WO2's test uses IEEE_112_B_DYNAMOMETER."
            - "Both tests are recorded with byte-identical measurements: input 8.02 kW, output 7.50 kW, losses 210.0 / 95.0 / 128.0 / 44.0 W, ambient 40.0 C."
