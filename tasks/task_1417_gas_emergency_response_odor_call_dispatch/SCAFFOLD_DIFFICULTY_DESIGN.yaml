  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: adjusted_elapsed_exactly_at_threshold_is_compliant
        grounds:
          - calculations.sla_breach_classification
          - entities.GasIncident.fields.breach_class
          - entities.RegulatoryReport.fields.compliant_count_adjusted
        distinguishing_aspect: |
          Numeric-threshold boundary on adjusted elapsed: at exactly
          threshold_minutes*60 seconds (3600 == 60*60) the incident is
          COMPLIANT (rule is strictly-greater); observed through the incident
          GET and through the regulatory report counters, a distinct metric
          from the empty-reading-set boundary.
        test_recipe:
          setup:
            - "Same fixture as response_elapsed_raw_vs_adjusted_variants: P2 incident, pause [00:10,00:30), arrival at 01:20 -> adjusted exactly 3600s"
            - "A DRAFT report generated after arrival"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
