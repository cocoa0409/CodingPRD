          setup:
            - "One project with an ACCEPTED grading area and 57 accepted MODULE units on hand"
            - "One block, planned_pile_count 1 and planned_string_count 1, mechanical_status MECH_COMPLETE and electrical_status TESTED, mc_ready true"
