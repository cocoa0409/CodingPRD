  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: release_shift_cascades_to_lines_shipments_commitments
        grounds:
          - state_machines.AssortmentCommitment.COMMITTED_to_AT_RISK
          - endpoints.POST_/toy-licensing/properties/{id}/shift_release
          - entities.Shipment.fields.street_date
        distinguishing_aspect: |
          Depth-3 transitive cascade from one trigger: shift_release mutates
          Property.release_date (hop 1); that mutation rewrites every anchored
          ToyLine.target_street_date (hop 2); each line's PLANNED shipments
          inherit the new street_date (hop 3); each hop is caused by the
          previous, not by the original call, plus a parallel risk-flagging
          hop onto commitments.
        test_recipe:
          setup:
            - "Studio, revealed property P1 (release 2027-03-01), ACTIVE agreement, LICENSED line L1, sku SK1."
            - "Retailer R1, CONFIRMED review with window_start 2026-09-15, commitment C1 on SK1, PLANNED shipment SH1 (street_date 2027-03-01)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "Galaxy Racers", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-03-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 0, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id, la1_v: $.data.version }
            - call: "POST /toy-licensing/license-agreements/${la1}/activate"
              payload: { expected_license_agreement_version: "${la1_v}" }
              as: BrandManager
