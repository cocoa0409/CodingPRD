# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3087_private_label_co_brand_retail_credit_program
# Sibling of SCAFFOLD.yaml; every instance grounds in that file's §1.1-§1.6.
# 9 rules x >= 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: subsidy_asset_projected_vs_as_charged
    grounds:
    - calculations.promo_subsidy_settlement
    - entities.SettlementBatch.fields.gross_subsidy_cents
    - entities.SettlementBatch.fields.net_subsidy_cents
    - entities.SettlementBatch.fields.variance_cents
    - endpoints.POST_/servicing/settlement-batches/{id}/finalize
    distinguishing_aspect: The same two promotional plans yield gross_subsidy_cents 34776 (full-term projection) and net_subsidy_cents 4139 (30 days accrued at period_end) — the two variants differ by 30637 for identical inputs, on the PromoPlan/SettlementBatch subsidy domain.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agreement with promo_subsidy_rate 0.30, one ACTIVE program, one ACTIVE account, two POSTED purchases carrying deferred-interest promo plans (120000 cents/12mo and 240000 cents/6mo), one OPEN settlement batch.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Sable Home
          loyalty_program_code: SABLE_PLUS
          loyalty_link_enabled: true
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
          partner_id: ${p_id}
          revenue_share_rate: 0.12
          promo_subsidy_rate: 0.3
          promo_term_months: 12
          minimum_charge_cents: 29900
        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
        captures:
          ag_v: $.data.version
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 15
        as: ProgramAdmin
        captures:
          g_id: $.data.id
          g_v: $.data.version
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: DIGITAL
          requested_credit_limit_cents: 200000
        as: Applicant
        captures:
          app_id: $.data.id
      - call: POST /servicing/applications/${app_id}/decide
        payload: {}
        as: Underwriter
      - call: GET /servicing/accounts?program_id=${g_id}
        payload: {}
        as: ProgramAdmin
        captures:
          acct_id: $.data[0].id
      - call: POST /servicing/transactions
        payload:
          account_id: ${acct_id}
          merchant_name: Sable Living Room
          amount_cents: 120000
          transaction_channel: IN_STORE
          promo_requested: true
          promo_term_months: 12
        as: Cardholder
        as_user_id: ${acct_id}
        captures:
          tx1: $.data.id
      - call: POST /servicing/transactions
        payload:
          account_id: ${acct_id}
          merchant_name: Sable Patio
          amount_cents: 240000
          transaction_channel: DIGITAL
          promo_requested: true
          promo_term_months: 6
        as: Cardholder
        as_user_id: ${acct_id}
        captures:
          tx2: $.data.id
      - call: POST /servicing/settlement-batches
        payload:
          agreement_id: ${ag_id}
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
          settlement_method: AS_CHARGED
          reconciliation_method: PROJECTED
        as: ProgramAdmin
        captures:
          b_id: $.data.id
      trigger:
      - call: POST /servicing/settlement-batches/${b_id}/finalize
        payload: {}
        as: ProgramAdmin
        captures:
          b_net: $.data.net_subsidy_cents
          b_gross: $.data.gross_subsidy_cents
          b_var: $.data.variance_cents
      assert:
      - SettlementBatch.${b_id}.gross_subsidy_cents == 34776
      - SettlementBatch.${b_id}.net_subsidy_cents == 4139
      - SettlementBatch.${b_id}.variance_cents == 30637
      - SettlementBatch.${b_id}.gross_subsidy_cents != SettlementBatch.${b_id}.net_subsidy_cents
  - name: delinquency_minimum_payment_counterfactual_variants
    grounds:
    - calculations.account_minimum_payment
    - entities.Account.fields.account_status
    - endpoints.POST_/servicing/accounts/{id}/charge-off
    distinguishing_aspect: 'On the Account minimum-payment domain the two variants diverge without any change to the balance: a DELINQUENT account with outstanding_balance_cents 360000 services a 360000 minimum, while the same balance CHARGED_OFF services exactly 0.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One program, one ACTIVE account carrying 360000 cents of principal recorded through a ScheduledBalance row.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Northline Grocers
          loyalty_program_code: NORTHLINE
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
          partner_id: ${p_id}
          revenue_share_rate: 0.1
          promo_subsidy_rate: 0.25
          promo_term_months: 12
        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 20
        as: ProgramAdmin
        captures:
          g_id: $.data.id
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: DIGITAL
          requested_credit_limit_cents: 500000
        as: Applicant
        captures:
          app_id: $.data.id
      - call: POST /servicing/applications/${app_id}/decide
        payload: {}
        as: Underwriter
      - call: GET /servicing/accounts?program_id=${g_id}
        payload: {}
        as: ProgramAdmin
        captures:
          acct_id: $.data[0].id
      - call: POST /servicing/accounts/${acct_id}/balances
        payload:
          principal_balance_cents: 360000
          balance_bucket: PRINCIPAL
        as: ProgramAdmin
      - call: POST /servicing/accounts/${acct_id}/schedule-payment
        payload:
          due_date: '2026-09-10T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/_clock/advance
        payload:
          days: 200
        as: ProgramAdmin
      trigger:
      - call: POST /servicing/accounts/${acct_id}/charge-off
        payload: {}
        as: ProgramAdmin
        captures:
          acct_status: $.data.account_status
          bal_after: $.data.outstanding_balance_cents
      assert:
      - Account.${acct_id}.account_status == CHARGED_OFF
      - Account.${acct_id}.outstanding_balance_cents == 360000
      - the chargeback_discharged variant of account_minimum_payment returns 0 while the DELINQUENT snapshot of the same balance returned 360000
      - the ACCOUNT's scheduled minimum due after charge-off == 0, not 3500
