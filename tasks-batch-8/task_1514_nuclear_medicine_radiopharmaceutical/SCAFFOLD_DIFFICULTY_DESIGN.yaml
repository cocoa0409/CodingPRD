  - rule_id: resource_temporal_overlap
    instances:
      - name: room_booking_buffer_half_open
        grounds:
          - validations[priority=20]
          - entities.ProcedureAppointment.fields.start_at
          - entities.ImagingRoom.fields.cleanup_buffer_minutes
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) with a per-room cleanup
          buffer extending each existing booking's occupation to
          [start, end+buffer). A new booking at 09:44 conflicts (09:44 <
          07:30+15 is false here: existing 09:00-09:30 occupies until 09:45), a
          booking starting exactly at 09:45 touches the boundary and is allowed.
          Exclusion semantics — different from the sibling instance's
          aggregate-capacity semantics on deliveries.
        test_recipe:
          setup:
            - "Base F-18 fixture (room buffer 15) plus second order; booking A1 09:00-09:30 for order 1"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
