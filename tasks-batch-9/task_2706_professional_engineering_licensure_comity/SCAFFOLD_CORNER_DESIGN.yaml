        excluded_because:
          difficulty_instance: combinatorial_formula / comity_fee_tier_keyed_on_pre_credit_total_47642
          rationale: "A derived read whose value must match the full fee formula (base + records + NCEES + expedite, then the tier credit keyed on the pre-credit total) is asserted end-to-end by the named §1.8 instance."

      - name: case_close_blocked_while_sanction_unresolved
        claim_type: conditional_action
        grounds:
          - state_machines.Case.transitions.PROBABLE_CAUSE_to_CLOSED
          - errors.ERR_OPEN_SANCTION_BLOCKS_CLOSE
          - validations[priority=42]
        distinguishing_aspect: "Closing is permitted from PROBABLE_CAUSE only while sanction_status is CONSENT_EXECUTED or HEARING_REFERRED; with an outstanding PROPOSED consent order the same call returns 409 ERR_OPEN_SANCTION_BLOCKS_CLOSE and both axes are left untouched."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "An UNLICENSED_PRACTICE Case against 'Dell Prine' has been investigated to investigation_status PROBABLE_CAUSE (violation_count 1, no aggravating or mitigating factors, assessed_penalty_cents 298000)."
            - "A REPRIMAND ConsentOrder has been proposed but not executed, so sanction_status is PROPOSED."
          setup_api_calls:
            - call: "POST /cases"
              payload: { allegation_type: "UNLICENSED_PRACTICE", complainant_name: "City of Bend", received_on: "2026-07-20T00:00:00Z", unlicensed_respondent_name: "Dell Prine" }
