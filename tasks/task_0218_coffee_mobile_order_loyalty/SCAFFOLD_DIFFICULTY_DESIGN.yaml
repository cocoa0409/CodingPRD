# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Coffee Shop Mobile Order & Loyalty — 9 rules x 2 instances = 18 instances
# All numeric asserts pre-computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_no_reward_vs_capped_reward
        grounds:
          - calculations.order_total
          - entities.Order.fields.reward_discount_cents
          - entities.Order.fields.total_cents
          - entities.RewardGrant.fields.max_discount_cents
        distinguishing_aspect: >
          A two-line order (900c + 1100c) of reward-eligible drinks: the FREE_ITEM reward caps the discount
          at its max_discount_cents 700 (cheapest unit 900 > 700), so reward_discount_cents is 700 and
          total_cents 1414 under variant reward_capped, vs 2175 under variant no_reward — the two variants
          of order_total diverge on the Order entity, with tax taken on the post-discount base.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; store with slot_capacity 5, prep_minutes 0."
            - "Two reward_eligible menu items: ColdBrewLg base 900c and SpecialtyLatte base 1100c."
            - "Member registered; a FREE_ITEM reward (max_discount_cents 700, the FREE_ITEM_MAX_DISCOUNT_CENTS constant) ISSUED via star redeem (member pre-loaded to 150 stars)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Pike St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "ColdBrewLg", base_price_cents: 900, category: "BEVERAGE", reward_eligible: true }, as: PlatformAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "SpecialtyLatte", base_price_cents: 1100, category: "BEVERAGE", reward_eligible: true }, as: PlatformAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "a@x.com", full_name: "A", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            # pre-load 150 stars via a green/external order of pretax $150 (15000c base item) so redeem can fire
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Catering Box", base_price_cents: 15000, category: "FOOD", reward_eligible: false }, as: PlatformAdmin, captures: { box_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T18:00:00Z", window_end: "2026-06-01T18:15:00Z" }, as: PlatformAdmin, captures: { slot2_id: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot2_id}" }, as: Member, as_user_id: "${mem_id}", captures: { seed_order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${seed_order_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_order_id}/place", payload: { expected_slot_version: "${slot2_v}" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/rewards/redeem", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { reward_id: $.data.id } }
          trigger:
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}", applied_reward_id: "${reward_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${cb_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${sp_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { paid: $.data.id } }
          assert:
            - "Order.${order_id}.subtotal_cents == 2000"
            - "Order.${order_id}.reward_discount_cents == 700"
            - "Order.${order_id}.tax_cents == 114"
            - "Order.${order_id}.total_cents == 1414"

      - name: stars_earned_green_external_vs_gold_storedvalue
        grounds:
          - calculations.stars_earned
          - calculations.member_star_balance
          - entities.Member.fields.tier
          - entities.Order.fields.stars_earned
        distinguishing_aspect: >
          stars_earned diverges by entity domain (Member loyalty, not Order money): the same 615c-unit
          order earns 6 stars under variant green_external (tier GREEN, EXTERNAL_CARD, rate 1) but 18
          stars under variant gold_stored_value (tier GOLD, STORED_VALUE, rate 3 = 2 base + 1 SV bonus).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; store slot_capacity 5, prep_minutes 0; latte item 615c unit."
            - "Member already GOLD (lifetime_stars 200 from a prior $200 pretax order) with a stored-value card holding >= 669c."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Pine St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE", reward_eligible: true }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Gold Box", base_price_cents: 20000, category: "FOOD", reward_eligible: false }, as: PlatformAdmin, captures: { box_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot1_id: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T18:00:00Z", window_end: "2026-06-01T18:15:00Z" }, as: PlatformAdmin, captures: { slot2_id: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /members", payload: { email: "g@x.com", full_name: "G", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            # GOLD setup: $200 pretax order earns exactly 200 lifetime stars -> tier GOLD
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot1_id}" }, as: Member, as_user_id: "${mem_id}", captures: { ord_gold_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${ord_gold_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${ord_gold_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${ord_gold_id}/place", payload: { expected_slot_version: "${slot1_v}" }, as: Member, as_user_id: "${mem_id}" }
            # fund the stored-value card
            - { call: "POST /members/${mem_id}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mem_id}", captures: { card_v: $.data.version } }
          trigger:
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot2_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${card_v}" }, as: Member, as_user_id: "${mem_id}", captures: { tier_now: $.data.id } }
          assert:
            - "Member.${mem_id}.tier == GOLD"
            - "Order.${order_id}.stars_earned == 18"
            - "Order.${order_id}.total_cents == 669"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: stars_earned_three_input_nonlinear_mode_a
        grounds:
          - calculations.stars_earned
          - entities.Member.fields.tier
          - entities.Order.fields.pay_method
          - entities.Order.fields.tax_cents
        distinguishing_aspect: >
          Mode (a): stars_earned has >=3 inputs (tier, pay_method, floor(pre-tax dollars)) with a
          non-linear branch — base_rate selected by tier AND a conditional STORED_VALUE bonus added,
          multiplied by a floored dollar count; GREEN+STORED_VALUE on a 669c/54c-tax order yields
          floor(615/100) * (1+1) = 12 stars, not a single linear rate.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 5; latte 615c; member GREEN with card funded >= 669c."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Bell St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "c@x.com", full_name: "C", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mem_id}", captures: { card_v: $.data.version } }
          trigger:
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${card_v}" }, as: Member, as_user_id: "${mem_id}", captures: { done: $.data.id } }
          assert:
            - "Order.${order_id}.tax_cents == 54"
            - "Order.${order_id}.total_cents == 669"
            - "Order.${order_id}.stars_earned == 12"

      - name: order_total_rounding_order_pinned_mode_b
        grounds:
          - calculations.order_total
          - entities.Order.fields.tax_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: >
          Mode (b): nested rounding order is pinned to round-ONCE on the summed post-discount base. Two
          305c lines give tax round_half_up(610*0.0875)=53 (round-once), whereas the rejected per-line
          order round_half_up(305*0.0875)+round_half_up(305*0.0875)=27+27=54 would give 54; the scaffold
          mandates 53, total 663.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 5; espresso item base 305c, no modifiers; no reward."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Olive St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Espresso", base_price_cents: 305, category: "BEVERAGE" }, as: PlatformAdmin, captures: { esp_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "d@x.com", full_name: "D", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
          trigger:
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${esp_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${esp_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { done: $.data.id } }
          assert:
            - "Order.${order_id}.subtotal_cents == 610"
            - "Order.${order_id}.tax_cents == 53"
            - "Order.${order_id}.total_cents == 663"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rewardgrant_cyclic_reserved_back_to_issued
        grounds:
          - state_machines.RewardGrant.ISSUED_to_RESERVED
          - state_machines.RewardGrant.RESERVED_to_REDEEMED
          - state_machines.RewardGrant.RESERVED_to_ISSUED
          - entities.RewardGrant.fields.status
        distinguishing_aspect: >
          RewardGrant exhibits a cycle ISSUED -> RESERVED -> ISSUED (the cancel/refund restore edge), a
          revision loop on a different entity than instance 2's parallel-axis Order; a redeemed reward is
          returned to ISSUED so the member can reuse it.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 5; latte 615c reward_eligible; member with a FREE_ITEM reward ISSUED (max_discount 700c)."
            - "An order applies the reward, is paid (reward RESERVED) and placed (reward REDEEMED), then cancelled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Cedar St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE", reward_eligible: true }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Box", base_price_cents: 15000, category: "FOOD", reward_eligible: false }, as: PlatformAdmin, captures: { box_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot1_id: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T18:00:00Z", window_end: "2026-06-01T18:15:00Z" }, as: PlatformAdmin, captures: { slot2_id: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /members", payload: { email: "e@x.com", full_name: "E", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            # earn 150 stars then redeem to mint FREE_ITEM reward
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot1_id}" }, as: Member, as_user_id: "${mem_id}", captures: { seed_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/place", payload: { expected_slot_version: "${slot1_v}" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/rewards/redeem", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { reward_id: $.data.id } }
            # order using the reward, pay (RESERVED) and place (REDEEMED)
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot2_id}", applied_reward_id: "${reward_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${order_id}/place", payload: { expected_slot_version: "${slot2_v}" }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { cancelled: $.data.id } }
            - { call: "GET /rewards/${reward_id}", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { rstatus: $.data.status } }
          assert:
            - "RewardGrant.${reward_id}.status == ISSUED"
            - "RewardGrant.${reward_id}.reserved_by_order_id == null"

      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.CART_to_PLACED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: >
          Order carries two independent state dimensions on one row — payment_status (UNPAID->PAID) and
          fulfillment_status (CART->PLACED) advance via different triggers; after pay the order is
          PAID + CART, distinct from instance 1's single cyclic RewardGrant axis.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 5; latte 615c; member, slot."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Fir St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "f@x.com", full_name: "F", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { paid_fs: $.data.fulfillment_status, paid_ps: $.data.payment_status } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mem_id}", captures: { placed_fs: $.data.fulfillment_status, placed_ps: $.data.payment_status } }
          assert:
            - "After pay: Order.${order_id}.payment_status == PAID and Order.${order_id}.fulfillment_status == CART"
            - "After place: Order.${order_id}.fulfillment_status == PLACED and Order.${order_id}.payment_status == PAID"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_depth3_refund_wallettxn_cardbalance
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - state_machines.Refund.(none)_to_SETTLED
          - entities.WalletTransaction.fields.amount_cents
          - entities.StoredValueCard.fields.balance_cents
        distinguishing_aspect: >
          Depth-3 cascade from the cancel trigger: cancel(Order) -> Refund auto-created -> WalletTransaction(REFUND)
          appended -> StoredValueCard.balance_cents recomputed; each link is caused by the previous, distinct
          from instance 2's pay-triggered tier cascade.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 5; latte 615c; member with card pre-funded 5000c."
            - "Order paid STORED_VALUE (total 669, balance 5000->4331) and placed; about to be cancelled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Ash St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "h@x.com", full_name: "H", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mem_id}", captures: { card_v: $.data.version } }
