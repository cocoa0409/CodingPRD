# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Walks references/claim-extraction-guide.md row-by-row against this scaffold's
# §1.1-§1.7. section: values are the guide's nine sections; claim_type: values
# are the per-section claim-type rows. excluded_because stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product, "endpoints[\"POST /products\"]"]
        distinguishing_aspect: "POST /products with all required fields returns 201, status defaults ACTIVE, and a server-minted id/created_at/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 350, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.version == 1"
            - "Product.${pid}.contract_type == FIXED"

      - name: get_contract_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Contract, "endpoints[\"GET /contracts/{id}\"]"]
        distinguishing_aspect: "GET /contracts/{id} returns the contract with owner_name and product_id matching what was created."
        test_recipe:
          setup: ["A PENDING contract exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Ada", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { owner: $.data.owner_name }
          assert:
            - "response status == 200"
            - "Contract.${cid}.owner_name == Ada"
            - "Contract.${cid}.product_id == ${pid}"
            - "Contract.${cid}.status == PENDING"

      - name: list_contracts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Contract, "endpoints[\"GET /contracts\"]"]
        distinguishing_aspect: "GET /contracts returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two contracts exist under one product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "One", annuitant_age: 60 }
              as: ContractAdmin
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Two", annuitant_age: 61 }
              as: ContractAdmin
          trigger:
            - call: "GET /contracts"
              payload: { limit: 1, offset: 0 }
              as: ContractAdmin
          assert:
            - "response status == 200"
            - "response envelope total_count == 2"
            - "response envelope has_more == true"
            - "response data length == 1"

      - name: get_contract_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Contract, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /contracts/{id} with a random unknown UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_contract_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.Contract.fields.annuitant_age, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /contracts omitting required annuitant_age returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "NoAge" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_contract_annuitant_age_out_of_range_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Contract.fields.annuitant_age, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "annuitant_age 86 (>85 max) is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "TooOld", annuitant_age: 86 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_contract_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.contract_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products with contract_type 'CRYPTO' (outside {FIXED,VARIABLE,INDEXED}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Bad", contract_type: "CRYPTO", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: premium_net_computed_from_load_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Premium.fields.net_premium_cents, calculations.accumulation_value_chronological]
        distinguishing_aspect: "net_premium_cents is computed = round_half_up(gross*(1-load/10000)); gross 1,000,000 with load 250bps yields net 975,000 (a client-supplied net is ignored)."
        test_recipe:
          setup: ["PENDING contract under a 0-load-irrelevant product; premium submitted with premium_load_bps=250."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 100000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 1000000, premium_load_bps: 250, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
          trigger:
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
              captures: { net: $.data.net_premium_cents }
          assert:
            - "Premium.${prem0}.net_premium_cents == 975000"
            - "Contract.${cid}.accumulation_value_cents == 975000"

      - name: system_fields_minted_by_server_on_product
        claim_type: System Fields
        grounds: [entities.Product]
        distinguishing_aspect: "Client-supplied id/created_at/version on POST /products are ignored; server mints id (UUID, no prefix), created_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Product.${pid}.version == 1"
            - "Product.${pid}.id is a server-minted UUID with no type prefix"

      - name: crediting_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.CreditingEvent]
        distinguishing_aspect: "CreditingEvent has common_fields:false — it is append-only with only id/created_at, no version field and no update endpoint."
        test_recipe:
          setup: ["A FIXED contract ACTIVE; one FIXED_GUARANTEED crediting event posted."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 350, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /crediting-events"
              payload: { contract_id: "${cid}", crediting_kind: "FIXED_GUARANTEED" }
              as: CreditingOfficer
              captures: { ce: $.data.id }
          trigger:
            - call: "GET /crediting-events/${ce}"
              payload: {}
              as: ContractAdmin
              captures: { credit: $.data.credit_cents }
          assert:
            - "response status == 200"
            - "CreditingEvent.${ce}.credit_cents == 70000"

      - name: contract_referenced_product_not_found
        claim_type: Parent Relationships
        grounds: [entities.Contract.fields.product_id, "validations[priority=4]", "errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /contracts with a product_id that does not exist returns ERR_REFERENCED_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts"
              payload: { product_id: "11111111-1111-4111-8111-111111111111", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

      - name: premiums_filtered_list_by_source_exchange_fk
        claim_type: Creation
        grounds: [entities.Premium.fields.source_exchange_id, "endpoints[\"GET /premiums\"]"]
        distinguishing_aspect: "FK reverse-reachability: GET /premiums?source_exchange_id={ex} returns the funding premium for an inbound 1035 exchange."
        test_recipe:
          setup: ["INBOUND 1035 exchange APPROVED with a SUBMITTED funding premium on the target contract carrying source_exchange_id."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Target", annuitant_age: 60 }
              as: ContractAdmin
              captures: { tgt: $.data.id, tv0: $.data.version }
            - call: "POST /exchanges-1035"
              payload: { direction: "INBOUND", target_contract_id: "${tgt}", external_carrier: "OldCo", transfer_amount_cents: 2000000, cost_basis_cents: 1500000 }
              as: ContractAdmin
              captures: { ex: $.data.id }
            - call: "POST /premiums"
              payload: { contract_id: "${tgt}", gross_premium_cents: 2000000, source_exchange_id: "${ex}", expected_contract_version: "${tv0}" }
              as: ContractAdmin
              captures: { prem_in: $.data.id }
          trigger:
            - call: "GET /premiums?source_exchange_id=${ex}"
              payload: { source_exchange_id: "${ex}" }
              as: ContractAdmin
          assert:
            - "response status == 200"
            - "response data length == 1"
            - "response data[0].id == ${prem_in}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: clear_already_cleared_premium_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Premium.SUBMITTED_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Clearing a Premium already CLEARED is not a defined transition and returns ERR_INVALID_STATE (409); no double-credit."
        test_recipe:
          setup: ["FIXED contract ACTIVE via a cleared initial premium."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Contract.${cid}.accumulation_value_cents == 2000000"

      - name: new_contract_starts_in_pending
        claim_type: Initial State
        grounds: [state_machines.Contract, entities.Contract.fields.status]
        distinguishing_aspect: "A newly created Contract starts in status PENDING with accumulation_value_cents 0."
        test_recipe:
          setup: ["One product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, st: $.data.status }
          assert:
            - "Contract.${cid}.status == PENDING"
            - "Contract.${cid}.accumulation_value_cents == 0"

      - name: withdraw_on_pending_contract_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Withdrawal.REQUESTED_to_SETTLED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Creating a withdrawal against a PENDING (not yet ACTIVE) contract is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING contract (no cleared premium yet)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
          trigger:
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 100000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_surrendered_contract_rejects_annuitization
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Contract, state_machines.Annuitization.ELECTED_to_ACTIVE_PAYOUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once a Contract is SURRENDERED (terminal), electing then beginning an annuitization is impossible; annuitization create on a SURRENDERED contract returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["FIXED contract fully surrendered (SURRENDERED) via a full-surrender withdrawal; corridor 10000bps and charge 0 so gross==accumulation."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, free_withdrawal_corridor_bps: 10000, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 2000000, is_full_surrender: true, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { wid: $.data.id }
            - call: "POST /withdrawals/${wid}/settle"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /annuitizations"
              payload: { contract_id: "${cid}", payout_option: "LIFE_ONLY" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Contract.${cid}.status == SURRENDERED"
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: deny_then_reverify_identity_loops_back_invalid
        claim_type: Idempotency
        grounds: [state_machines.DeathClaim.FILED_to_VERIFYING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify-identity twice: the second verify (already VERIFYING) is not a defined transition from VERIFYING and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Contract ACTIVE funded 2,000,000, single beneficiary, DeathClaim FILED then VERIFYING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "AV", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /beneficiaries"
              payload: { contract_id: "${cid}", full_name: "Bea", relationship: "SPOUSE", share_bps: 10000 }
              as: ContractAdmin
            - call: "POST /death-claims"
              payload: { contract_id: "${cid}", date_of_death: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { dc: $.data.id }
            - call: "POST /death-claims/${dc}/verify-identity"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /death-claims/${dc}/verify-identity"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: full_surrender_liquidates_allocations_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Contract.ACTIVE_to_SURRENDERED, entities.SubAccountAllocation.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / full_surrender_cascade_depth3
          rationale: "The SubAccountAllocation LIQUIDATED cascade side-effect is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: index_credit_floor_clamps_negative_to_zero
        claim_type: Correct Result
        grounds: [calculations.apply_crediting, entities.IndexSegment.fields.floor_bps]
        distinguishing_aspect: "INDEX_SEGMENT credit floors at 0: raw -500bps with floor 0 and 100% participation yields credit 0, not negative; accumulation unchanged."
        test_recipe:
          setup: ["INDEXED contract ACTIVE accumulation 2,000,000; OPEN SP500 segment premium 1,000,000 cap 800 floor 0 participation 10000 term [2026-01-01,2027-01-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Indexed", contract_type: "INDEXED", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /index-segments"
              payload: { contract_id: "${cid}", index_name: "SP500", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", segment_premium_cents: 1000000, cap_bps: 800, floor_bps: 0, participation_bps: 10000 }
              as: ContractAdmin
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /crediting-events"
