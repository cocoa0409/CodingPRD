  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_void_session_preserves_hours_partition
        grounds:
          - calculations.obligation_partition
          - state_machines.WorkSession.COMPLETED_to_VOIDED
          - entities.Referral.fields.hours_completed
          - entities.Referral.fields.hours_outstanding
        distinguishing_aspect: "Conserved quantity = hours (hours_ordered == completed + converted + outstanding): verify then void a 4h session leaves 10 == 0 + 0 + 10, matching the pre-verify partition 10 == 0 + 0 + 10."
        test_recipe:
          setup:
            - "Referral hours_ordered 10; a session verified for 4h (completed 4, outstanding 6); then the session is voided."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-17", offense_class: "MISDEMEANOR", hours_ordered: 10, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-01T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws_id}/check-out", payload: { check_out_at: "2026-06-01T13:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/void", payload: { reason: "logged in error" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          assert:
            - "Referral.${ref_id}.hours_completed == 0"
            - "Referral.${ref_id}.hours_converted == 0"
            - "Referral.${ref_id}.hours_outstanding == 10"
            - "WorkSession.${ws_id}.attendance_status == VOIDED"

      - name: ci_reverse_fee_preserves_money_ledger
        grounds:
          - calculations.conversion_fee
          - state_machines.FeeConversion.PAID_to_REVERSED
          - entities.Referral.fields.fees_settled_cents
          - entities.Referral.fields.hours_converted
        distinguishing_aspect: "Conserved quantity = money (fees_settled_cents = sum(PAID settlement) - sum(REVERSED)): pay 6000 then reverse returns fees_settled_cents to 0 and hours_converted to 0."
        test_recipe:
          setup:
            - "Referral hours_ordered 10, NONE; request+approve a 4h conversion; pay 6000 (fees_settled 6000, converted 4, outstanding 6); then reverse."
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-18", offense_class: "MISDEMEANOR", hours_ordered: 10, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id", ref_v: "$.data.version" } }
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 4, expected_referral_version: "${ref_v}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_id: "$.data.id" } }
            - { call: "POST /fee-conversions/${fee_id}/approve", payload: {}, as: ProgramCoordinator, as_user_id: "coord-2" }
            - { call: "POST /fee-conversions/${fee_id}/pay", payload: { amount_cents: 6000 }, as: Participant, as_user_id: "${part_id}" }
          trigger:
            - { call: "POST /fee-conversions/${fee_id}/reverse", payload: { reason: "refunded" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          assert:
            - "Referral.${ref_id}.fees_settled_cents == 0"
            - "Referral.${ref_id}.hours_converted == 0"
            - "Referral.${ref_id}.hours_outstanding == 10"
            - "FeeConversion.${fee_id}.status == REVERSED"
