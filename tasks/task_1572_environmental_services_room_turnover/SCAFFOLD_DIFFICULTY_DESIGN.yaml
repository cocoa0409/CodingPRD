            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T16:10:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${rm3}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${rm3}", audit_method: "ATP_SWAB", rlu_reading: 400 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # T_GOOD clocked 08:00->13:00 = 5h => credits 4.00, score exactly 80.00
            # T_MISS must ALSO land exactly 5h: in 11:10, out 16:10 = 5h => 100*4/5 - 5 = 75.00
            - call: "POST /evs/staff/${tg}/clock-out"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tg}"
            - call: "POST /evs/staff/${tm}/clock-out"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            # STAT queue: STAT demand for STANDARD + fresh QUEUED request on bed S1
            - call: "POST /evs/placement-demands"
              payload: { unit_id: "${u1}", required_bed_kind: "STANDARD", urgency_tier: "STAT", needed_by: "2026-08-01T20:00:00Z" }
              as: BedPlacementCoordinator
              captures: { ds: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bs1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { rs: $.data.id }
            # both techs must be ON_SHIFT to pull: clock them back in at 16:10
            - call: "POST /evs/staff/${tg}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tg}"
            - call: "POST /evs/staff/${tm}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
          trigger:
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
              captures: { err_miss: $.data.error_id }
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tg}"
              captures: { pulled: $.data.id }
          assert:
            - "StaffMember.${tg}.productivity_score == 80.00 AND stat_eligible == true (score exactly at the 80.00 threshold passes: >=)"
            - "StaffMember.${tm}.productivity_score == 75.00 AND stat_eligible == false"
            - "err_miss == ERR_QUEUE_EMPTY: the only QUEUED request ${rs} is STAT-tier and filtered out for T_MISS"
            - "pulled == ${rs}: T_GOOD (exactly 80.00) is admitted to the STAT candidate set"
            - "CleanRequest.${rs}.assigned_staff_id == ${tg} AND status == ASSIGNED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
  # ---------------------------------------------------------------------------
    instances:
      - name: start_gated_by_staff_shift_state
        grounds:
          - state_machines.CleanRequest.ASSIGNED_to_IN_PROGRESS
          - state_machines.StaffMember.transitions
          - errors[ERR_STAFF_NOT_ON_SHIFT]
        distinguishing_aspect: |
          Entity pair CleanRequest -> StaffMember: the request's
          ASSIGNED -> IN_PROGRESS transition is guarded by the ASSIGNED
          staff member's independent shift_status; ON_BREAK blocks the start
          even though the request itself is perfectly assignable.
        test_recipe:
          setup:
            - "Unit U, standards, supplies, bed B1, tech T1 (CLEAN)"
            - "T1 clocked in then put ON_BREAK; ROUTINE request R assigned to T1 (assign does not check shift state)"
          setup_api_calls:
