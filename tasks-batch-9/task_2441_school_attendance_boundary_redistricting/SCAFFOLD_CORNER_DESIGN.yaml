  - name: transfer_request_filed_after_the_deadline_is_rejected
    claim_type: temporal_validation
    grounds:
    - validations[priority=50]
    - errors[ERR_TRANSFER_WINDOW_EXPIRED]
    - endpoints[POST /redistricting/transfer-requests]
    - entities.AdoptionRecord.fields.transfer_deadline_date
    distinguishing_aspect: transfer_deadline_not_passed fires only when the clock is STRICTLY after transfer_deadline_date, so a request filed at the deadline instant is accepted and one filed a second later is refused - while transfer_window_status is still TRANSFER_WINDOW_OPEN in both cases. That separates the date rule at priority 50 from the window-dimension rule at priority 46, which would otherwise produce ERR_TRANSFER_WINDOW_CLOSED.
