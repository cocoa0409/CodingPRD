  - rule_id: non_linear_state_machine
    instances:
      - name: submission_filed_rejected_resubmitted_and_refiled_cycle
        grounds:
          - state_machines.FilingSubmission.FILED_to_REJECTED
          - state_machines.FilingSubmission.REJECTED_to_DRAFT
          - state_machines.FilingSubmission.DRAFT_to_EDITS_ATTACHED
          - entities.FilingSubmission.fields.resubmission_count
          - entities.Institution.fields.filing_posture
        distinguishing_aspect: |
          FilingSubmission is CYCLIC on the FilingSubmission entity: the same row
          re-enters DRAFT after FILED -> REJECTED -> DRAFT and walks the whole
          pipeline a second time, ending FILED again with resubmission_count 1
          and a freshly recomputed final_record_count. The second non-linear
          instance is PARALLEL DIMENSIONS on the Application entity, a different
          entity and a different non-linear shape.
        test_recipe:
          setup:
            - "One non partial-exempt Institution, one CensusTract, one Application originated 2026-03-15 and REGISTER_LOCKED."
            - "Edit run 1 raises no exceptions, so it lands CLEARED_ALL and the record becomes CLEARED."
            - "A FilingSubmission attached to run 1, certified by officer-alpha and filed while the clock reads 2027-02-01T00:00:00Z."
            - "The examiner then rejects the filing, which un-archives the record and returns the institution to OPEN."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000041", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "VISUAL_OBSERVATION_OR_SURNAME", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", observation_basis: "VISUAL" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-15T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
