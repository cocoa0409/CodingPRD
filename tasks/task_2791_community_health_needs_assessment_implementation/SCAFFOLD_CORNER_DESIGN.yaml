          - state_machines.AssessmentCycle.transitions
        distinguishing_aspect: "From DATA_COLLECTION every to_status other than INPUT_GATHERING is rejected with ERR_INVALID_PHASE_TRANSITION — including the backward pair and the two-step skip — while the non-advance action endpoints for later phases fail with ERR_INVALID_STATE."
