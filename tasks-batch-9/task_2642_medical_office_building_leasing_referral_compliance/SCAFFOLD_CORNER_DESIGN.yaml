      - name: rent_concession_lock_blocks_a_reduction_but_not_an_increase
        claim_type: conditional_validation
        grounds:
          - validations[22]
          - entities.Lease.fields.rent_concession_locked
          - state_machines[RentInvoice].transitions[ISSUED -> DELINQUENT].side_effects
        distinguishing_aspect: "The delinquency cascade reaches a DRAFT lease that has never been invoiced and locks it, and the lock is directional: a PATCH lowering base_rent_psf_annual is refused with ERR_RENT_CONCESSION_LOCKED while a PATCH raising it, and a PATCH extending the term, both succeed on the very same locked lease."
