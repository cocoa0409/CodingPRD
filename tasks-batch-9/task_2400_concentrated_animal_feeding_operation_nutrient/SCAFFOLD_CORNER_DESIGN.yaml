        grounds:
          - validations[priority=19]
          - errors.ERR_PLAN_NOT_APPROVED
        excluded_because:
          difficulty_instance: plan_not_approved_outranks_rate_exceeds_limit
          rationale: "That §1.8 priority-pair instance triggers priority 19 as the winning error and re-runs the same request after approval, covering both the violation and the satisfaction arm."
      - name: applying_on_frozen_ground_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_FROZEN_GROUND_APPLICATION
        excluded_because:
          difficulty_instance: frozen_ground_outranks_field_allowance_exceeded
          rationale: "That §1.8 priority-pair instance already returns priority 23 while priority 44 is simultaneously violated, and then shows the same request passing on thawed ground."
      - name: reapplying_inside_the_twenty_one_day_buffer_is_rejected
