  # ===========================================================================
  # §1.9 breadth walk — errors
  # All 50 §1.6 codes are asserted by name somewhere across §1.8 + §1.9. The
  # eight per-entity 404 codes are pinned in the first instance below; the two
  # §1.2.1 stale-version codes are pinned in cross_cutting_complexity_layers;
  # every other code is asserted by the validations, state_machines,
  # calculations or rbac sections of this file or by a §1.8 instance.
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_the_owning_entitys_own_not_found_code
        claim_type: not_found
        grounds:
          - errors.ERR_BUYER_NOT_FOUND
          - errors.ERR_VALUATION_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_MILESTONE_NOT_FOUND
          - errors.ERR_PACKAGE_NOT_FOUND
          - errors.ERR_FACILITY_NOT_FOUND
          - errors.ERR_ACCOUNT_NOT_FOUND
          - errors.ERR_MARKET_ITEM_NOT_FOUND
        distinguishing_aspect: |
          There is no generic 404: nine lookups against the same unknown UUID produce eight DIFFERENT
          error_ids, one per owning entity — except ScreeningSlot and BuyerMeeting, which deliberately
          share ERR_MARKET_ITEM_NOT_FOUND. An implementation with a single NOT_FOUND code, or one that
          splits the two market items, is detectable from the error_id alone.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; nothing else exists, so every id below is unknown."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /film-sales/buyers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { e_buyer: $.data.error_id }
            - call: "GET /film-sales/territory-valuations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { e_val: $.data.error_id }
            - call: "POST /film-sales/agency-agreements/00000000-0000-0000-0000-000000000000/expenses"
              payload: { amount_usd: 100.00, memo: "market travel" }
              as: SalesAgent
              captures: { e_agr: $.data.error_id }
            - call: "POST /film-sales/payment-milestones/00000000-0000-0000-0000-000000000000/receipt"
              payload: { amount_usd: 100.00, received_at: "2026-08-05T00:00:00Z" }
              as: CollectionAgent
              captures: { e_ms: $.data.error_id }
            - call: "POST /film-sales/deliverable-packages/00000000-0000-0000-0000-000000000000/qc-result"
              payload: { result: "PASS" }
              as: Buyer
              captures: { e_pkg: $.data.error_id }
            - call: "POST /film-sales/banking-facilities/00000000-0000-0000-0000-000000000000/completion-bond"
              payload: { bond_provider: "Meridian Surety", bond_amount_usd: 24000000.00 }
              as: Lender
              captures: { e_fac: $.data.error_id }
            - call: "GET /film-sales/collection-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CollectionAgent
              captures: { e_acct: $.data.error_id }
            - call: "GET /film-sales/screening-slots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { e_slot: $.data.error_id }
            - call: "GET /film-sales/buyer-meetings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { e_meet: $.data.error_id }
          assert:
            - "${e_buyer} == ERR_BUYER_NOT_FOUND, ${e_val} == ERR_VALUATION_NOT_FOUND, ${e_agr} == ERR_AGREEMENT_NOT_FOUND at HTTP 404"
            - "${e_ms} == ERR_MILESTONE_NOT_FOUND, ${e_pkg} == ERR_PACKAGE_NOT_FOUND, ${e_fac} == ERR_FACILITY_NOT_FOUND at HTTP 404"
            - "${e_acct} == ERR_ACCOUNT_NOT_FOUND at HTTP 404"
            - "${e_slot} == ERR_MARKET_ITEM_NOT_FOUND and ${e_meet} == ERR_MARKET_ITEM_NOT_FOUND — one shared code for both market items"
            - "all nine responses are 404; none is a 200 with a null body and none is a 500"

      - name: error_envelope_shape_is_identical_at_every_status_class_when_a_write_is_rejected
        claim_type: violation_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_FILM_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Whatever the status class, the body is the same envelope: a machine-readable error_id and a
          human message, and nothing else that a client could mistake for a resource. The same endpoint is
          driven to 401, 403, 404 and 422 so the shape cannot be attributed to the route.
        test_recipe:
          setup:
            - "One registered film so that a well-formed authorised request would otherwise succeed."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          trigger:
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { principal_cast_score: 70 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { e1: $.data.error_id, m1: $.data.message }
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { principal_cast_score: 70 }
              as: SalesAgent
              captures: { e2: $.data.error_id, m2: $.data.message }
            - call: "PATCH /film-sales/films/00000000-0000-0000-0000-000000000000"
              payload: { principal_cast_score: 70 }
              as: PlatformAdmin
              captures: { e3: $.data.error_id, m3: $.data.message }
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { principal_cast_score: 101 }
              as: PlatformAdmin
              captures: { e4: $.data.error_id, m4: $.data.message }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED at 401, ${e2} == ERR_UNAUTHORIZED at 403, ${e3} == ERR_FILM_NOT_FOUND at 404, ${e4} == ERR_INVALID_REQUEST at 422"
            - "${m1}, ${m2}, ${m3} and ${m4} are all non-empty strings"
            - "no error body contains an id, version or any Film field"
            - "Film.${film_id}.principal_cast_score is still 88 and version is still 1 after all four calls"

      - name: one_endpoint_returns_four_different_status_classes_by_error_class
        claim_type: violation_error
        grounds:
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_MARKET_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The status code is a property of the error class, not of the route: the single market state
          endpoint yields 403, 404, 422 and 409 depending on which rule fires, and in particular an
          unknown enum value is 422 ERR_INVALID_REQUEST while a well-formed but illegal transition is 409
          ERR_INVALID_STATE. Collapsing those two into one status is a distinguishable failure.
        test_recipe:
          setup:
            - "One market driven PLANNED -> OPEN -> CLOSED."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-17T00:00:00Z", screening_room_count: 3, meeting_table_count: 4 }
              as: PlatformAdmin
              captures: { market_id: $.data.id }
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "CLOSED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: SalesAgent
              captures: { s403: $.data.error_id }
            - call: "POST /film-sales/markets/00000000-0000-0000-0000-000000000000/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
              captures: { s404: $.data.error_id }
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "SOLD" }
              as: PlatformAdmin
              captures: { s422: $.data.error_id }
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
              captures: { s409: $.data.error_id }
          assert:
            - "${s403} == ERR_UNAUTHORIZED at HTTP 403 — the role gate fires even on a closed market"
            - "${s404} == ERR_MARKET_NOT_FOUND at HTTP 404"
            - "${s422} == ERR_INVALID_REQUEST at HTTP 422 for the unknown enum value"
            - "${s409} == ERR_INVALID_STATE at HTTP 409 for the well-formed but illegal CLOSED -> OPEN edge"
            - "Market.${market_id}.status is CLOSED throughout and its version never advances after the four failures"

      - name: a_refused_write_leaves_no_row_and_advances_no_version
        claim_type: violation_error
        grounds:
          - errors.ERR_TERRITORY_CODE_TAKEN
          - errors.ERR_INVALID_REQUEST
          - entities.Film.fields.version
        distinguishing_aspect: |
          Rejection must be atomic in both directions: a duplicate territory code creates no second row,
          and an out-of-range PATCH neither bumps Film.version nor triggers the cast-score side effect
          that stales the published valuation. An implementation that writes first and validates second
          leaves either a stray Territory or a STALE valuation behind.
        test_recipe:
          setup:
            - "Territory DE with a PUBLISHED CAST_ADJUSTED valuation on an IN_MARKET film at version 1."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 3000000.00, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_de_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "IN_MARKET" }
              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v1: $.data.version }
          trigger:
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany Duplicate", region: "APAC", market_tier: 3, currency_code: "USD", base_value_index: 0.50 }
              as: PlatformAdmin
              captures: { e_dup: $.data.error_id }
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { principal_cast_score: -1 }
              as: PlatformAdmin
              captures: { e_range: $.data.error_id }
            - call: "GET /film-sales/territories"
              payload: { region: "APAC" }
              as: SalesAgent
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { v_after: $.data.version, cast_after: $.data.principal_cast_score }
            - call: "GET /film-sales/territory-valuations/${val_de_id}"
              payload: {}
              as: HeadOfSales
              captures: { val_status: $.data.status }
          assert:
            - "${e_dup} == ERR_TERRITORY_CODE_TAKEN at HTTP 409 and the APAC list returns total_count 0"
            - "${e_range} == ERR_INVALID_REQUEST at HTTP 422"
            - "${v_after} == ${film_v1} and ${cast_after} == 88 — the refused PATCH did not advance the version"
            - "${val_status} == PUBLISHED, so the refused PATCH also skipped the stale-valuation side effect"
            - "Film.${film_id}.published_territory_count == 1"

  # ===========================================================================
