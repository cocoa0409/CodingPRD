      - name: pressure_ceiling_admits_the_confirm_that_lands_just_under_the_limit
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_15_ERR_FIELD_PRESSURE_LIMIT
          - errors.ERR_FIELD_PRESSURE_LIMIT
          - entities.StorageField.fields.max_pressure_psig
          - entities.StorageField.fields.current_pressure_psig
        distinguishing_aspect: |
          The pressure gate is prospective — it is evaluated on the pressure the confirm WOULD
          produce, not on the pressure the field currently reports. On a high-base field already
          reading 2980 psig a 15000 Dth injection is refused because it would land on 3022 psig, yet
          a 5000 Dth injection is admitted because it lands on exactly 2994 psig, two psi under the
          3000 limit, even though the field is simultaneously RESTRICTED by the 2850 posture ceiling
          — posture RESTRICTED never blocks a FIRM movement.
        test_recipe:
          setup:
            - "Field F-PLIM: total 1,000,000 / cushion 500,000 / base_pressure 2000 / span 1400 / max_pressure 3000, opening working gas 350000 (inventory_pct 70.00, 2980 psig, posture RESTRICTED), one well PLIM-1."
