            - "Risk was then assessed: exposure 400000/800000 = 0.5 -> 0.225, routing slack 40 days -> 0, lead 71 days -> 0.0816667, sell-through -> 0.02, score round_half_up(32.67) = 33 -> LOW -> CLEARED with projected_margin_cents 150000."
            - "The rider was reviewed CAPABLE and cleared and the engagement was confirmed; no tickets were sold, so box_office_gross_cents is 0."
            - "The clock was moved to 2026-10-12T00:00:00Z and the settlement was opened (engagement auto-advanced to PERFORMED) and then reconciled with actual_marketing_cents 0: adjusted_gross 0, cap band 300000, reimbursable 0, overage max(0, 0 - 400000) = 0, artist_share 0, net -400000, reserve 0, amount_payable_to_artist_cents 400000."
          setup_api_calls:
