  # ===========================================================================
  # 6. ERRORS (Table 6)
  # ===========================================================================
  - section: errors
    instances:
      - name: auth_layer_returns_401_pair_before_any_lookup
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: |
          Both 401 codes are raised before path resolution, so an unknown role on a nonexistent program id still
          returns ERR_UNKNOWN_ROLE (401) rather than ERR_PROGRAM_NOT_FOUND (404), and an empty X-User-ID returns
          ERR_MISSING_AUTH_HEADERS even though the role header is a valid role. Nothing is written by either call.
        test_recipe:
          setup:
            - "One ACTIVE program exists so that the read path itself would succeed with proper headers."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /private-label/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: ""
              captures: { err_headers: $.data.error_id }
            - call: "GET /private-label/programs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: CategoryBuyer
              as_user_id: "u-buyer-9"
              captures: { err_role: $.data.error_id }
          assert:
            - "the first read returns status 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "the second read returns status 401 with error_id ERR_UNKNOWN_ROLE"
            - "the second read does not return ERR_PROGRAM_NOT_FOUND"
            - "BrandProgram.${prog_id}.version == 1"

      - name: unknown_path_ids_on_core_entities_return_their_own_404
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_ITEM_NOT_FOUND]
          - errors[ERR_COST_MODEL_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_SPECIFICATION_NOT_FOUND]
        distinguishing_aspect: |
          Each entity has its own 404 code rather than one generic NOT_FOUND, and the codes are keyed to the path
          segment rather than to the payload: five reads with syntactically valid but unknown ids return five
          distinct error ids while a populated database sits behind them untouched.
        test_recipe:
          setup:
            - "A fully populated program exists (gap, supplier, line, audit, item, cost model, specification) so that every addressed collection is non-empty and the 404s cannot be an artifact of an empty table."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
