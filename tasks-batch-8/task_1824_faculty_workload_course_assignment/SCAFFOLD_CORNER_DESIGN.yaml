        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_EXCEEDS_CAP]", "entities.CourseSection.fields.enrollment_cap"]
        distinguishing_aspect: "Class-size constraint: enrollment-sync of 31 against cap 30 fails 422."
        test_recipe:
