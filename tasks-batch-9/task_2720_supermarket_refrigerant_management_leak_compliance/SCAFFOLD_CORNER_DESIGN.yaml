      - name: priority_ordering_between_simultaneously_violated_rules
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - validations[priority=17]
          - validations[priority=21]
          - validations[priority=39]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: retired_system_beats_expired_certification_state_over_safety
          rationale: "The §1.8 priority instances already cover three differentiated category pairs on doubly-invalid payloads: state-over-safety (retired system 10 beats expired certification 15) in the cited instance, safety-over-constraint (uncertified machine 17 beats cylinder fill limit 39) in uncertified_recovery_machine_beats_cylinder_fill_limit_safety_over_constraint, and referential-over-constraint (chemistry mismatch 21 beats insufficient contents 40) in refrigerant_type_mismatch_beats_insufficient_cylinder_contents_referential_over_constraint. Adding another ordering pair here would duplicate the claim rather than extend coverage."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: compliance_run_sweeps_all_five_deadline_families_in_one_call
        claim_type: bulk_action
        grounds:
          - endpoints[POST /compliance-runs]
          - state_machines.LeakEvent.OPEN_to_REPAIR_OVERDUE
          - state_machines.ExtensionRequest.PENDING_to_EXPIRED
          - state_machines.RecoveryEquipment.CERTIFIED_to_VERIFICATION_OVERDUE
          - state_machines.Inspection.OPEN_to_ESCALATED
        distinguishing_aspect: "One run at 2027-07-01 must return every one of the five declared arrays populated from a single fixture - the overdue leak event, the expired extension request, the uncertified machine and the escalated inspection - report stores_recomputed_count 1 and as_of equal to the clock, and leave the store NON_COMPLIANT with the inspection repriced from the AT_RISK 1.25 band to the NON_COMPLIANT 1.50 band (344.44 to 413.33)."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z: one store, R-404A, SYS1 (full 60.0, initial 0.0), EQ1 last verified 2026-06-01, T1."
            - "OPEN LeakEvent E1 detected 2026-08-01 (repair_deadline 2026-08-31), a PENDING extension request (expires 2026-08-16), and an inspection with one MINOR 1-day citation (response_deadline 2026-08-31) opened while the store is already AT_RISK."
            - "Clock advanced to 2027-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2029-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "PARTS_UNAVAILABLE", requested_days: 10, justification: "Compressor gasket kit on national backorder." }
              as: ComplianceManager
              captures: { req_id: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-LEAK-REC", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, insp_penalty_before: $.data.penalty_exposure_usd, insp_mult_before: $.data.chronic_multiplier_applied }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /compliance-runs"
              payload: {}
              as: PlatformAdmin
              captures: { run_as_of: $.data.as_of, run_store_count: $.data.stores_recomputed_count }
          assert:
            - "at inspection creation: chronic_multiplier_applied == 1.25 and penalty_exposure_usd == 344.44 (store AT_RISK)"
            - "HTTP 200 with as_of == 2027-07-01T00:00:00Z and stores_recomputed_count == 1"
            - "swept_repair_overdue_leak_event_ids == [${event_id}] and swept_verification_overdue_leak_event_ids == []"
            - "expired_extension_request_ids == [${req_id}] and overdue_equipment_ids == [${eq1_id}] and escalated_inspection_ids == [${insp_id}]"
            - "LeakEvent.${event_id}.status == REPAIR_OVERDUE; ExtensionRequest.${req_id}.status == EXPIRED; RecoveryEquipment.${eq1_id}.status == VERIFICATION_OVERDUE; Inspection.${insp_id}.status == ESCALATED"
            - "Store.${store_id}.overdue_leak_event_count == 1, compliance_status == NON_COMPLIANT"
            - "Inspection.${insp_id}.chronic_multiplier_applied == 1.50, penalty_exposure_usd == 413.33, Store.${store_id}.penalty_exposure_total_usd == 413.33"
            - "LeakEvent.${event_id}.repair_deadline is still 2026-08-31T00:00:00Z (an EXPIRED request grants nothing)"

      - name: leak_rate_projection_honours_the_as_of_override
        claim_type: computed_read
        grounds:
          - endpoints[GET /systems/{id}/leak-rate-projection]
          - calculations.system_leak_rate_pct
        distinguishing_aspect: "The projection is a pure read that re-runs the rolling window at an arbitrary instant without mutating anything: at the clock it reports 15.0 over the window 2025-08-01..2026-08-01, and with as_of 2027-08-02 the same 30.0 lb addition has aged out so it reports 0.0 over 2026-08-02..2027-08-02 - and the stored leak_rate_pct stays 15.0 either way."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 200.0, initial 0.0, ROLLING_AVERAGE), T1, EQ1, CYL1 (nominal 100.0, initial 80.0), one 30.0 lb ADD_REFRIGERANT record on 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 200.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2029-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 100.0, initial_contents_lbs: 80.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 30.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "GET /systems/${sys1_id}/leak-rate-projection"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { now_rate: $.data.leak_rate_pct, now_window_start: $.data.window_start, now_trigger: $.data.would_trigger_leak_event }
            - call: "GET /systems/${sys1_id}/leak-rate-projection"
              payload: { as_of: "2027-08-02T00:00:00Z" }
              as: ComplianceManager
              captures: { future_rate: $.data.leak_rate_pct, future_window_start: $.data.window_start }
          assert:
            - "first read: HTTP 200, method == ROLLING_AVERAGE, leak_rate_pct == 15.0, refrigerant_added_lbs_in_window == 30.0, window_start == 2025-08-01T00:00:00Z, window_end == 2026-08-01T00:00:00Z, threshold_pct == 20.0, would_trigger_leak_event == false"
            - "second read: leak_rate_pct == 0.0, refrigerant_added_lbs_in_window == 0.0, window_start == 2026-08-02T00:00:00Z, window_end == 2027-08-02T00:00:00Z, would_trigger_leak_event == false"
            - "RefrigerantSystem.${sys1_id}.leak_rate_pct is still 15.0 and version is unchanged after both reads"
            - "GET /leak-events?system_id=${sys1_id} returns total_count 0 (a projection never opens an event)"

      - name: response_envelope_shape_differs_for_object_array_and_error
        claim_type: standard_crud
        grounds:
          - response_envelope
          - errors[ERR_STORE_NOT_FOUND]
        distinguishing_aspect: "All three envelope shapes are exercised on one collection: a single-object read carries response_type object with no pagination keys, a list read carries response_type array with total_count / has_more, and a 404 carries response_type error with error_id and message - and the error body never carries an entity payload."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Two stores so the list is non-trivial."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storea_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Southgate Market", store_code: "SG-002", state_code: "TX", region: "SOUTH" }
              as: ComplianceManager
              captures: { storeb_id: $.data.id }
          trigger:
            - call: "GET /stores/${storea_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-1"
              captures: { obj_code: $.data.store_code }
            - call: "GET /stores"
              payload: { region: "SOUTH" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { list_first: "$.data[0].id" }
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              as_user_id: "regulator-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "object read: HTTP 200, response_type == object, data.store_code == NG-001, no total_count / has_more keys present"
            - "filtered list: HTTP 200, response_type == array, total_count == 1, has_more == false, data[0].id == ${storeb_id}"
            - "unknown id: HTTP 404, response_type == error, error_id == ERR_STORE_NOT_FOUND, message is a non-empty string and no entity fields are returned"

      - name: clock_endpoint_reports_the_instant_it_replaced
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The very first call on a fresh server reports previous_utc equal to the documented startup default 2026-08-01T00:00:00Z, and the second call reports the instant the first one installed - so the endpoint is a real swap that returns both sides, not a write-only setter."
        test_recipe:
          setup:
            - "A fresh server whose logical clock is at the documented default 2026-08-01T00:00:00Z; nothing else is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { first_prev: $.data.previous_utc, first_now: $.data.current_utc }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { second_prev: $.data.previous_utc, second_now: $.data.current_utc }
          assert:
            - "first call: HTTP 200, current_utc == 2026-08-01T00:00:00Z, previous_utc == 2026-08-01T00:00:00Z"
            - "second call: HTTP 200, current_utc == 2026-09-01T00:00:00Z, previous_utc == 2026-08-01T00:00:00Z"
            - "a store created after the second call carries created_at == 2026-09-01T00:00:00Z"

      - name: closing_an_inspection_freezes_its_exposure_and_drops_it_from_the_store_total
        claim_type: conditional_action
        grounds:
          - state_machines.Inspection.RESPONDED_to_CLOSED
          - calculations.inspection_penalty_exposure.input_set
          - entities.Store.fields.penalty_exposure_total_usd
        distinguishing_aspect: "Closure is the freeze point: a CLOSED inspection leaves the exposure pool (store total falls to 0.00) and is never recomputed again, so a leak event opened afterwards moves the store to AT_RISK without disturbing the frozen 275.55 or its 1.00 multiplier."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store with no systems, one inspection with a single MINOR 1-day citation opened by regulator-1, responded to by the store manager."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
