          assert:
            - "the limit=0 read returned HTTP 400 with error_id == ERR_INVALID_PAGINATION"
            - "the limit=101 read returned HTTP 400 with error_id == ERR_INVALID_PAGINATION"
            - "the limit=100 read returned HTTP 200 with 1 row, total_count == 1, limit == 100, offset == 0, has_more == false"

      - name: every_remaining_lookup_code_is_reachable_and_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
          - errors[ERR_AMENDMENT_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_PETITION_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Each of the seven remaining 404 codes must be produced by its own endpoint against an unknown id: carrier, hold, amendment, report, claim, petition and the read-only ledger entry (ERR_RESOURCE_NOT_FOUND)."
        test_recipe:
          setup:
            - "Empty database; officer identities OFF-1 and FPF-9 in use; clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "GET /in-bond/carriers/00000000-0000-0000-0000-000000000001"
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/examination-holds/00000000-0000-0000-0000-000000000002"
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/amendment-requests/00000000-0000-0000-0000-000000000003/decision"
              payload: { decision: "DENY", decision_reason_code: "NOT_JUSTIFIED" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/reports/00000000-0000-0000-0000-000000000004"
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/ld-claims/00000000-0000-0000-0000-000000000005"
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/petitions/00000000-0000-0000-0000-000000000006/decision"
              payload: { decision: "DENY", decision_reason_code: "NO_MITIGATION" }
              as: FPFOfficer
              as_user_id: "FPF-9"
            - call: "GET /in-bond/ledger-entries/00000000-0000-0000-0000-000000000007"
              as: CBPOfficer
              as_user_id: "OFF-1"
          assert:
            - "all seven calls returned HTTP 404 with response_type == error"
            - "the carrier read returned error_id == ERR_CARRIER_NOT_FOUND"
            - "the hold read returned error_id == ERR_HOLD_NOT_FOUND"
            - "the amendment decision returned error_id == ERR_AMENDMENT_NOT_FOUND"
            - "the report read returned error_id == ERR_REPORT_NOT_FOUND"
            - "the claim read returned error_id == ERR_CLAIM_NOT_FOUND"
            - "the petition decision returned error_id == ERR_PETITION_NOT_FOUND"
            - "the ledger-entry read returned error_id == ERR_RESOURCE_NOT_FOUND"

      - name: duplicate_irs_number_and_duplicate_port_code_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=7].ERR_DUPLICATE_IRS_NUMBER
          - validations[priority=7].ERR_DUPLICATE_PORT_CODE
        distinguishing_aspect: "Re-registering irs_number 12-3456789 and re-registering port_code 4601 must each return 409 (ERR_DUPLICATE_IRS_NUMBER / ERR_DUPLICATE_PORT_CODE) and create no second row."
        test_recipe:
