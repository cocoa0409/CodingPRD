# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Companion to SCAFFOLD.yaml for task_2475_customer_success_renewal_health_scoring.
#
# Walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe;
# every corner it already asserts appears here as an `excluded_because:` stub
# citing the §1.8 instance by name.
#
# Logical clock: the mandatory default 2026-08-01T00:00:00Z unless an instance
# calls POST /_clock/set_current_utc explicitly.
#
# Every numeric assert below was executed against the §1.3 formulas with
# Python Decimal / ROUND_HALF_UP before being written here as a literal.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_returns_all_declared_fields_with_computed_baseline
        claim_type: creation
        grounds:
          - entities.Account
          - endpoints[id=E1]
          - calculations.account_health_score
        distinguishing_aspect: "POST /accounts with the five required inputs returns 201 and every §1.1 Account field, including the deterministic empty-signal baseline snapshot_health_score 43.75."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == \"object\"."
            - "Account.${acct_id}.name == \"Northwind Traders\" and arr_cents == 30000000 and segment_band == \"ENTERPRISE\"."
            - "Account.${acct_id}.contract_start_date == \"2026-01-01\" and contract_end_date == \"2026-12-31\"."
            - "Account.${acct_id}.lifecycle_state == \"ONBOARDING\"."
            - "Account.${acct_id}.adoption_index == 0.00 and support_risk_penalty == 0.00 and exec_engagement_score == 25.00 and outcome_attainment_index == 60.00."
            - "Account.${acct_id}.snapshot_health_score == 43.75 and trended_health_score == 43.75 and health_tier == \"RED\"."
            - "Account.${acct_id}.reference_calls_cap == 6 (ENTERPRISE band)."
            - "Every field name declared in entities.Account is present in data."

      - name: csm_get_returns_the_stored_capacity_row
        claim_type: retrieval
        grounds:
          - entities.Csm
          - endpoints[id=E9]
          - endpoints[id=E10]
        distinguishing_aspect: "GET /csms/{id} returns exactly the row POST /csms created, with capacity_units_committed 0 and capacity_units_available equal to capacity_units_total."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40 and no CoverageAssignment rows."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
          trigger:
            - call: "GET /csms/${csm_a_id}"
              payload: {}
              as: CsOpsAdmin
          assert:
            - "HTTP 200 and data.id == ${csm_a_id}."
            - "Csm.${csm_a_id}.full_name == \"Ada Lovelace\" and coverage_specialty == \"HIGH_TOUCH\"."
            - "Csm.${csm_a_id}.capacity_units_total == 40 and capacity_units_committed == 0 and capacity_units_available == 40."
            - "Csm.${csm_a_id}.status == \"ACTIVE\" and version == 1."

      - name: account_list_returns_pagination_envelope_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[id=E3]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three accounts stored, GET /accounts?limit=2 returns exactly 2 rows plus limit 2 / offset 0 / total_count 3 / has_more true."
        test_recipe:
          setup:
            - "Exactly three Account rows, all ENTERPRISE, created in order A then B then C."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Account A", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Account B", arr_cents: 20000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Account C", arr_cents: 10000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_c_id: $.data.id }
          trigger:
            - call: "GET /accounts"
              payload: { limit: 2 }
              as: CsOpsAdmin
          assert:
            - "HTTP 200 and response_type == \"array\"."
            - "len(data.items) == 2."
            - "data.limit == 2 and data.offset == 0 and data.total_count == 3 and data.has_more == true."
            - "A second call with { limit: 2, offset: 2 } returns 1 item and has_more == false."

      - name: account_get_with_unknown_id_returns_account_not_found
        claim_type: not_found
        grounds:
          - endpoints[id=E2]
          - errors.ERR_ACCOUNT_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid UUID that matches no Account row yields ERR_ACCOUNT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database (no Account rows at all)."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == \"error\"."
            - "data.error_id == \"ERR_ACCOUNT_NOT_FOUND\"."

      - name: save_play_create_missing_required_window_start_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[id=E32]
          - entities.SavePlay.fields.window_start_date
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required window_start_date on POST /save-plays returns ERR_INVALID_REQUEST (400) and persists no SavePlay row."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm and one ENTERPRISE Account in ONBOARDING with coverage_posture RESTRICTED."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "ADOPTION_DECLINE", play_type: "ENABLEMENT_SPRINT", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /save-plays?account_id=${acct_id} returns 0 items."
            - "Account.${acct_id}.open_save_play_count == 0."

      - name: account_create_applies_declared_defaults_for_system_and_computed_fields
        claim_type: defaults
        grounds:
          - entities.Account.fields.lifecycle_state
          - entities.Account.fields.coverage_tier
          - entities.Account.fields.coverage_posture
          - entities.Account.fields.renewal_likelihood
          - entities.Account.fields.ttv_breach_flag
        distinguishing_aspect: "POST /accounts supplies none of lifecycle_state, coverage_tier, coverage_posture, renewal_likelihood, ttv_breach_flag or the credit ledger, and each lands on its §1.1 declared default."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Default Probe", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.lifecycle_state == \"ONBOARDING\"."
            - "Account.${acct_id}.coverage_tier == \"UNASSIGNED\" and coverage_posture == \"RESTRICTED\" and assigned_csm_id is null."
            - "Account.${acct_id}.renewal_likelihood == \"AT_RISK\" and ttv_breach_flag == false."
            - "Account.${acct_id}.open_save_play_count == 0 and remediation_credit_outstanding_cents == 0 and remediation_credit_settled_cents == 0."
            - "Account.${acct_id}.churn_root_cause_code is null and win_back_offer_bp is null."
            - "Account.${acct_id}.contractual_ttv_days is null and activation_ttv_days is null."

      - name: expansion_opportunity_qualification_score_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.ExpansionOpportunity.fields.qualification_score
          - calculations.expansion_qualification_score
          - endpoints[id=E48]
        distinguishing_aspect: "POST /expansion-opportunities accepts no qualification_score input, yet the created row carries 65.70 = 0.5*67.20 (trended) + 0.3*67.00 (adoption) + 0.2*60.00 (arr_term for 30000000 cents) derived entirely from stored account state."
        test_recipe:
          setup:
            - "One ENTERPRISE Account, arr_cents 30000000, term 2026-01-01..2026-12-31."
            - "Exactly three USAGE_PERIOD signals whose usage_row_index values are 36.00 (2026-05-31), 56.00 (2026-06-30) and 86.00 (2026-07-31), giving adoption_index 67.00 and trended_health_score 67.20."
            - "No SponsorContact and no OutcomeGoal, so outcome_attainment_index is the 60.00 no-goal substitute."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          trigger:
            - call: "POST /expansion-opportunities"
              payload: { account_id: "${acct_id}", estimated_value_cents: 4000000, source_signal: "SEAT_SATURATION" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { opp_id: $.data.id }
          assert:
            - "HTTP 201 and ExpansionOpportunity.${opp_id}.qualification_score == 65.70."
            - "ExpansionOpportunity.${opp_id}.state == \"IDENTIFIED\" and recycled_from_opportunity_id is null."
            - "ExpansionOpportunity.${opp_id}.identified_at == \"2026-08-01T00:00:00Z\" (logical clock, not wall clock)."

      - name: account_create_stamps_system_id_created_at_and_version_one
        claim_type: system_fields
        grounds:
          - entities.Account
          - endpoints[id=E1]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: created_at equals the logical clock 2026-08-01T00:00:00Z and version is exactly 1 on a freshly created Account."
        test_recipe:
          setup:
            - "Empty database; logical clock at its mandatory default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "System Field Probe", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "data.id is a server-generated UUID string, non-empty."
            - "Account.${acct_id}.created_at == \"2026-08-01T00:00:00Z\" and updated_at == \"2026-08-01T00:00:00Z\"."
            - "Account.${acct_id}.version == 1."
            - "GET /accounts/${acct_id} returns the same id, created_at and version."

      - name: account_create_with_invalid_segment_band_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Account.fields.segment_band
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "segment_band \"MIDMARKETT\" is outside the declared enum {ENTERPRISE, MIDMARKET, SMB} and is rejected with ERR_INVALID_REQUEST (400); no Account row is written."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Bad Enum", arr_cents: 30000000, segment_band: "MIDMARKETT", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /accounts returns total_count == 0."

      - name: account_signal_row_has_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.AccountSignal
          - endpoints[id=E16]
          - endpoints[id=E17]
        distinguishing_aspect: "AccountSignal declares common_fields: false, so its create response carries id and created_at but no version and no updated_at, and §1.5 exposes no PATCH or DELETE for it."
        test_recipe:
          setup:
            - "One ENTERPRISE Account and one ACTIVE HIGH_TOUCH Csm."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sig_id: $.data.id }
          assert:
            - "HTTP 201 and AccountSignal.${sig_id}.seat_utilisation_pct == 90.00 and usage_row_index == 86.00."
            - "The response data contains no \"version\" key and no \"updated_at\" key."
            - "§1.5 declares no PATCH, PUT or DELETE whose path resolves to an AccountSignal row."
            - "GET /accounts/${acct_id}/signals returns 1 item whose id == ${sig_id}."

      - name: outcome_goal_create_under_unknown_account_returns_account_not_found
        claim_type: parent_relationships
        grounds:
          - entities.OutcomeGoal
          - endpoints[id=E26]
          - validations[priority=3]
          - errors.ERR_ACCOUNT_NOT_FOUND
        distinguishing_aspect: "A sub-resource POST under a non-existent parent account returns ERR_ACCOUNT_NOT_FOUND (404) before any body validation, so the missing-parent path outranks the goal's own field checks."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm exists so the acting CsmUser identity resolves; no Account row with the probed id exists."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
          trigger:
            - call: "POST /accounts/99999999-9999-4999-8999-999999999999/outcome-goals"
              payload: { title: "Reduce ticket volume", target_value: 100.00, weight_bp: 5000 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_ACCOUNT_NOT_FOUND\"."

      - name: escalation_case_across_two_accounts_returns_cross_account_reference
        claim_type: parent_relationships
        grounds:
          - entities.EscalationCase.fields.save_play_id
          - validations[priority=25]
          - errors.ERR_CROSS_ACCOUNT_REFERENCE
          - complexity_profile.entity_topology
        distinguishing_aspect: "The graph topology's cross-aggregate edge is guarded: an EscalationCase naming account A but a SavePlay belonging to account B returns ERR_CROSS_ACCOUNT_REFERENCE (422), even though both referenced rows exist."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "Two ENTERPRISE Accounts A and B, both in ONBOARDING with coverage_posture RESTRICTED."
            - "One DRAFT SavePlay whose account_id is B."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Account A", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Account B", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_b_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_b_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_b_id: $.data.id }
          trigger:
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_a_id}", save_play_id: "${sp_b_id}", severity: "HIGH", summary: "Mismatched aggregate reference" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_CROSS_ACCOUNT_REFERENCE\"."
            - "GET /escalation-cases?account_id=${acct_a_id} returns 0 items."
            - "SavePlay.${sp_b_id}.state == \"DRAFT\" (unchanged)."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_save_play_starts_in_draft_state
        claim_type: initial_state
        grounds:
          - state_machines.SavePlay
          - entities.SavePlay.fields.state
          - entities.Account.fields.open_save_play_count
        distinguishing_aspect: "A freshly created SavePlay is DRAFT, not ACTIVE, so it does not yet count towards Account.open_save_play_count and does not restrict the account."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, no signals, so snapshot_health_score 43.75 and health_tier RED."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "ADOPTION_DECLINE", play_type: "ENABLEMENT_SPRINT", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
          assert:
            - "HTTP 201 and SavePlay.${sp_id}.state == \"DRAFT\"."
            - "SavePlay.${sp_id}.outcome_note is null."
            - "Account.${acct_id}.open_save_play_count == 0 (DRAFT plays are not counted)."
            - "Account.${acct_id}.coverage_posture == \"RESTRICTED\" (still the no-COMMITTED-assignment clause, not the save-play clause)."

      - name: advocacy_enrollment_suspend_then_reactivate_returns_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.AdvocacyEnrollment.ACTIVE_to_SUSPENDED
          - state_machines.AdvocacyEnrollment.SUSPENDED_to_ACTIVE
          - validations[priority=14]
          - validations[priority=18]
        distinguishing_aspect: "The cyclic SUSPENDED edge is reversible by hand: ACTIVE -> SUSPENDED -> ACTIVE leaves reference_calls_used at 0 and reference_calls_cap at the 6 snapshotted for the ENTERPRISE band."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 20."
            - "One ENTERPRISE Account, arr_cents 30000000, term 2026-01-01..2026-12-31, with one USAGE_PERIOD signal of usage_row_index 86.00 and one ACTIVE CXO SponsorContact who is the economic buyer, so exec_engagement_score is 50.00 and snapshot_health_score is 77.60 -> GREEN (APPROVE requires GREEN)."
            - "Segmentation run (coverage_tier HIGH_TOUCH) and one COMMITTED CoverageAssignment of 16 load_units, so coverage_posture is OPEN (APPROVE requires OPEN)."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 20 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/sponsor-contacts"
              payload: { full_name: "Grace Chen", seniority: "CXO", is_economic_buyer: true }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sponsor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/health-recompute"
              payload: {}
              as: CsOpsAdmin
