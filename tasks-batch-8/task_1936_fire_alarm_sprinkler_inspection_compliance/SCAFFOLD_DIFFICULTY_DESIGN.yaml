              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-02T01:00:00Z", cause_code: "NEGLIGENCE" }
              as: FireMarshal
              captures: { fa1: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa1}/assess"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-03T01:00:00Z", cause_code: "EQUIPMENT_FAULT" }
              as: FireMarshal
              captures: { fa2: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa2}/assess"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-04T01:00:00Z", cause_code: "UNKNOWN" }
              as: FireMarshal
              captures: { fa3: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa3}/assess"
              payload: {}
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/false-alarm-cases/${fa3}/waive"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-05T01:00:00Z", cause_code: "NEGLIGENCE" }
              as: FireMarshal
              captures: { fa4: $.data.id, seq4: $.data.sequence_number }
          assert:
            - "FalseAlarmCase.${fa3}.status == WAIVED and fee_cents == 0"
            - "sum of fee_cents over ASSESSED cases of property == 0 + 0 (fa1, fa2 were tier 1-2) — invariant: pool after assess+waive equals pool before assess"
            - "captured seq4 == 3 (WAIVED fa3 excluded from the count, so fa4 takes the slot fa3 vacated)"
