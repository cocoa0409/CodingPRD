            - "after deprovision: identity_status == DEPROVISIONED, password_state == EXPIRED and deprovision_scheduled_date == 2026-08-01, while seat_status is STILL ACTIVE, BuildingAllocation.${alloc_id}.consumed_seats is STILL 1 and VendorApp.${va_id}.committed_charge_cents is STILL 1000"
            - "after release: seat_status == RELEASED, refunded_charge_cents == 1000, BuildingAllocation.${alloc_id}.consumed_seats == 0, VendorApp.${va_id}.committed_charge_cents == 0, identity_status STILL DEPROVISIONED"
            - "the combined terminal state is RELEASED + DEPROVISIONED; no single trigger moved both axes"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  #   4a: depth 4, triggered by POST /students/{id}/withdraw.
  #   4b: depth 3, triggered by POST /teachers/{id}/separate (different
  #       triggering transition, different first link).
  #   Every link is CAUSED BY the previous link, not fanned out from the
  #       trigger: the seat is only released BECAUSE the enrollment dropped,
  #       the building counter only moves BECAUSE the seat was released, and
  #       the licence economics only move BECAUSE the building counter moved.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: student_withdraw_depth4_cascade
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.Enrollment.ACTIVE_to_DROPPED
          - state_machines.AppAccount.RESERVED_or_ACTIVE_to_RELEASED
          - state_machines.AppAccount.PROVISIONED_to_DEPROVISIONED
          - entities.BuildingAllocation.fields.consumed_seats
          - entities.VendorApp.fields.committed_charge_cents
          - entities.School.fields.enrolled_student_count
          - calculations.renewal_recommendation_score
        distinguishing_aspect: "Depth 4 from a single withdraw: (1) Student ENROLLED -> WITHDRAWN, (2) because the student left, its ACTIVE Enrollment -> DROPPED, (3) because that enrollment dropped, the AppAccount seat -> RELEASED and its identity -> DEPROVISIONED with a full in-window refund, (4) because the seat was released, BuildingAllocation.consumed_seats and the VendorApp licence economics (consumed_seats, committed_charge_cents, renewal_score, renewal_recommendation) all re-settle. Link 3 cannot fire without link 2 and link 4 cannot fire without link 3."
        test_recipe:
          setup:
            - "Clock advanced to 2026-08-20T00:00:00Z BEFORE the enrollment is created, so the enrollment requested for 2026-08-15 lands ACTIVE immediately rather than PENDING_ADD; 2026-08-20 is still inside the add/drop window (cutoff 2026-09-15), so the seat refund is the full charge."
            - "One ACTIVE ELEMENTARY building with exactly one ENROLLED student; Term Fall 2026 ACTIVE."
            - "An ACTIVE PER_STUDENT licence with total_seats 4, price_per_seat_cents 1000, PROPORTIONAL_HEADCOUNT and overage_policy BLOCK, so the single building holds all 4 seats."
            - "One AppAccount for that student, password-set (identity PROVISIONED) and carrying seat_charge_cents 1000, so BuildingAllocation.consumed_seats == 1 and VendorApp.committed_charge_cents == 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
