  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activity_release_requires_submittal_released
        grounds:
          - state_machines.InstallationActivity.status.PLANNED_to_RELEASED
          - state_machines.Submittal.review_status
        distinguishing_aspect: |
          Pair InstallationActivity -> Submittal: release of an activity whose governing
          submittal is merely REGISTERED fails ERR_SUBMITTAL_NOT_RELEASED; after the
          submittal completes its review cycle and release-for-construction, the same release
          succeeds.
        test_recipe:
          setup:
            - "Project ACTIVE; sub C1 responsible for short-lead section (lead 5, need 2026-09-01); reviewer R1; submittal S REGISTERED; PLANNED activity on S/C1 [2026-09-01, 2026-09-10)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Gate1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "ConcCo", trade: "concrete" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", lead_time_days: 5, review_days: 5, default_need_date: "2026-09-01", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["PRODUCT_DATA"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /v1/projects/${p_id}/installation-activities"
              payload: { submittal_id: "${sub_id}", subcontractor_id: "${c1_id}", start_date: "2026-09-01", end_date: "2026-09-10" }
              as: ProjectEngineer
              captures: { act_id: $.data.id }
          trigger:
            - call: "POST /v1/installation-activities/${act_id}/release"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
            - call: "GET /v1/submittals/${sub_id}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
            - call: "POST /v1/submittals/${sub_id}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /v1/revisions/${rev_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/revisions/${rev_id}/return"
              payload: { action_code: "A" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /v1/submittals/${sub_id}/release-for-construction"
              payload: {}
              as: ProjectEngineer
            - call: "POST /v1/installation-activities/${act_id}/release"
              payload: {}
              as: ProjectManager
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SUBMITTAL_NOT_RELEASED while submittal is REGISTERED"
            - "st == RELEASED after the submittal reaches RELEASED"

      - name: rfi_close_requires_impact_assessment_terminal
        grounds:
          - state_machines.RFI.status.ANSWERED_to_CLOSED
          - state_machines.ImpactAssessment.status
        distinguishing_aspect: |
          Pair RFI -> ImpactAssessment: closing an answered RFI whose assessment is still
          ESTIMATED/PRICED fails ERR_ASSESSMENT_OPEN_ON_CLOSE; only after the assessment
          reaches a terminal state (WAIVED) does the same close succeed.
        test_recipe:
          setup:
            - "Project ACTIVE (contingency 2000000); reviewer R1; RFI answered with cost flag est 100000 -> IA ESTIMATED"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Gate2", initial_contingency_cents: 2000000 }
