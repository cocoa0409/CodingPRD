            - call: "POST /loans"
              payload: { loan_application_id: "${app}", annual_debt_service_cents: 36000000, interest_reserve_shortfall_cents: 1500000 }
              as: LoanServicer
              captures: { loan: $.data.id }
            - call: "POST /draw-requests"
              payload: { loan_id: "${loan}", project_phase: "FOUNDATION", requested_amount_cents: 60000000, percent_complete: 0.3000 }
              as: LoanServicer
              captures: { d1: $.data.id }
            - call: "POST /draw-requests/${d1}/approve"
              payload: { approved_amount_cents: 60000000, inspector_note: "Foundation poured and inspected" }
              as: LoanServicer
            - call: "POST /draw-requests/${d1}/disburse"
