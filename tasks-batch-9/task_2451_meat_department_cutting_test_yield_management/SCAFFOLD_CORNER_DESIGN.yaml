            - "${res_status} == RESOLVED with ${res_by} == mgr-01 and disposition == MARKDOWN"
            - "${posture_after} == SALES_OPEN with ${open_after} == 0, ${cont_after} == 0 and ${consec_after} == 0 — the in-spec 4.0 reading had already cleared the run"
