            - "VetPrescription.${rx1}.status == ACTIVE and VetPrescription.${rx2}.status == DRAFT"
            - "Horse.${h1}.active_prescription_id == ${rx1}"

      - name: corner_occ_payment_with_a_stale_client_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[apply-payment-stale-client]", "validations[priority=27]", "errors[ERR_STALE_CLIENT_VERSION]"]
        distinguishing_aspect: "Posting a deposit bumped the client's version, so a payment still carrying the version read at client creation is rejected 412 ERR_STALE_CLIENT_VERSION and no invoice balance moves."
