          setup:
            - "A TERMS_AGREED 25.000 MW deal with credit_status APPROVED, credit_support_required_usd 0.00 and no posted instruments."
            - "Four PROPOSED instruments on that deal: a CCC letter of credit expiring 2026-08-15, a parent guarantee naming an unrelated offtaker and expiring 2029-08-01, 500000.00 of cash collateral expiring 2026-08-15, and a BBB letter of credit for 1000000.00 expiring 2029-08-01."
