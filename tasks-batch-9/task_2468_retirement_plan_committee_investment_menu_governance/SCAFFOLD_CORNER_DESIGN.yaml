      - name: the_same_single_for_vote_is_100_percent_under_one_basis_and_33_percent_under_the_other
        claim_type: Variant Selection
        grounds:
          - calculations.motion_tally
          - errors.ERR_NO_ELIGIBLE_VOTERS
          - entities.Motion.eligible_voter_count
        distinguishing_aspect: "Four motions moved on one quorate meeting isolate the denominator: one FOR and nothing else is 100.0000 under VOTES_CAST but 33.3333 under ELIGIBLE_VOTERS; a full recusal sweep zeroes the ELIGIBLE_VOTERS denominator; and a motion with no votes at all zeroes the VOTES_CAST denominator. Both zero-denominator closes fail with ERR_NO_ELIGIBLE_VOTERS and leave the motion OPEN — the only way a close can be rejected on a quorate meeting."
        test_recipe:
          setup:
            - "chain_l3 is replayed verbatim, then one meeting is convened with all three voting members (quorum_met == true), so no close can fail for quorum and every failure must come from the tally denominator."
            - "eligible_voter_count is frozen at 3 on all four motions from meeting.eligible_voting_seat_count."
