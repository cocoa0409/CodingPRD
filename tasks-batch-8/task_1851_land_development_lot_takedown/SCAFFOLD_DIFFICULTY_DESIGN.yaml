  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: phase_selling_window_half_open_overlap
        grounds:
          - calculations.phase_window_overlap_check
          - errors[ERR_PHASE_WINDOW_OVERLAP]
          - validations[priority=9]
        distinguishing_aspect: |
          Half-open interval semantics on the Parcel's phase windows: window B
          [2027-03-01, 2027-09-01) is adjacent to A [2026-09-01, 2027-03-01) and is
          ACCEPTED (end == start is not overlap), while window C
          [2027-02-15, 2027-08-01) intersects A's interior and is rejected with
          ERR_PHASE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Parcel P exists (any state); phase A with window [2026-09-01, 2027-03-01) already created"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P15", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p15: $.data.id }
            - call: "POST /api/phases"
              payload: { parcel_id: "${p15}", phase_name: "A", sequence_number: 1, planned_lot_count: 10, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph15a: $.data.id }
          trigger:
            - call: "POST /api/phases"
              payload: { parcel_id: "${p15}", phase_name: "B", sequence_number: 2, planned_lot_count: 10, selling_window_start: "2027-03-01T00:00:00Z", selling_window_end: "2027-09-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph15b: $.data.id, ph15b_status: $.data.status }
            - call: "POST /api/phases"
              payload: { parcel_id: "${p15}", phase_name: "C", sequence_number: 3, planned_lot_count: 10, selling_window_start: "2027-02-15T00:00:00Z", selling_window_end: "2027-08-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { err15: $.data.error_id }
          assert:
            - "adjacent window B accepted: captured ph15b_status == PLANNED (half-open adjacency is not overlap)"
            - "intersecting window C rejected: captured err15 == ERR_PHASE_WINDOW_OVERLAP (409)"

      - name: provider_daily_capacity_aggregate
        grounds:
          - calculations.provider_daily_capacity_check
          - errors[ERR_PROVIDER_CAPACITY_EXCEEDED]
