            - "ProductionRun.${run2_id}.production_status remains IN_PRODUCTION; no FinishedGoodLot created for run2 (GET /v1/production-runs/${run2_id}/finished-good-lots is empty)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_customer_active
        grounds:
          - state_machines.ProductionRun.QUOTED_to_CONFIRMED
          - state_machines.CustomerAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair ProductionRun -> CustomerAccount: confirm is gated on the
          CUSTOMER's status, not the run's. With the minimum-run rule satisfied
          (planned 600 >= 500), a SUSPENDED customer still blocks confirmation.
        test_recipe:
          setup:
            - "ACTIVE-then-SUSPENDED customer; APPROVED formula; run QUOTED planned_units 600"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "GateOne", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "G1-473", name: "Gate One", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 600, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/suspend", payload: {}, as: FinanceClerk }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CUSTOMER_NOT_ACTIVE (HTTP 409) even though planned_units 600 >= minimum 500"
            - "ProductionRun.${run_id}.production_status remains QUOTED"

      - name: release_requires_validated_process_run
        grounds:
          - state_machines.Batch.PROCESSING_to_RELEASED
          - state_machines.ProcessRun.RUNNING_to_DEVIATED
        distinguishing_aspect: |
          Entity pair Batch -> ProcessRun: releasing a batch still in PROCESSING
          is gated on the governing ProcessRun's status; a DEVIATED run blocks
          release (ERR_PROCESS_NOT_VALIDATED) until QA dispositions it RELEASE.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula; batch QA_PASSED then PROCESSING; process run DEVIATED (minor: min_temp 86.5 vs setpoint 88.0, 30 s below)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "GateTwo", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "G2-473", name: "Gate Two", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-G2", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
