            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser SC", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t1_id}" }, as: TrainingDirector }
          trigger:
            - call: "POST /api/dogs/${d_id}/milestones"
              payload: { category: OBEDIENCE, score: 70 }
              as: Trainer
              as_user_id: "${t2_id}"
              captures: { err: $.data.error_id }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 70 }, as: Trainer, as_user_id: "${t1_id}", captures: { m_id: $.data.id } }
          assert:
            - "T2: error_id == ERR_OWNERSHIP_SCOPE (403)"
            - "T1: milestone ${m_id} created — ownership gates the write, not the role"

      - name: raiser_admin_is_programadmin_exclusive
        claim_type: role_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", "roles[ProgramAdmin]"]
        distinguishing_aspect: "Exclusive-operation denial: IntakeCoordinator calling POST /api/puppy-raisers (ProgramAdmin-exclusive) fails with ERR_FORBIDDEN; segregation-of-duties role model keeps recruitment admin separate from intake."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/puppy-raisers"
              payload: { full_name: "Sneak Raiser", region: NW, foster_capacity: 1, experience_score: 10 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http 403; GET /api/puppy-raisers list remains empty"

