        claim_type: precision
        grounds: ["calculations.invoice_line_rounding"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / invoice_subtotal_rounds_each_line_before_summing"
          rationale: "That §1.8 instance asserts subtotal_cents == 945546 and explicitly rejects the 945545 sum-then-round reading."

