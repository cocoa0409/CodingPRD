      - name: dose_tier_upper_edge_is_inclusive_at_exactly_five_hundred_milligrams
        claim_type: threshold
        grounds:
          - calculations.appointment_window_build
          - calculations.appointment_window_build.constants.LOW_TIER_MAX_DOSE_MG
          - validations[priority 63]
          - errors[ERR_TEMPLATE_TIER_MISMATCH]
        distinguishing_aspect: |
          Two patients straddle the LOW/MID edge by one tenth of a milligram: 10 mg/kg on
          50.00 kg gives dose_mg exactly 500.0, which is LOW because the upper edge is
          inclusive, while 10 mg/kg on 50.01 kg gives 500.1 and is MID. The LOW template
          therefore books the first patient (tier_add 0, admin max(90,120) == 120, chair
          210) and is refused for the second with ERR_TEMPLATE_TIER_MISMATCH, whose MID
          template then books at chair 240 (tier_add 30, admin max(90,150) == 150).
