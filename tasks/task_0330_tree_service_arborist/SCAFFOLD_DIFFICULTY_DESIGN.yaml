# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances. All literals pre-computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_total_per_job_vs_hourly_diverge
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.total_cents
          - entities.Estimate.fields.heritage_surcharge_cents
          - entities.WorkOrder.fields.pricing_mode
        distinguishing_aspect: |
          Two valid algorithms on the Estimate entity: with identical line items + identical
          SEVERE/heritage/utility context, PER_JOB applies a heritage surcharge (0.15) while
          HOURLY forces heritage_surcharge_cents to 0 — the two totals diverge (555698 vs 332080).
        test_recipe:
          setup:
            - "ServiceArea NW with disposal_fee_cents_per_ton=8000, heritage_surcharge_pct=0.15, requires_permit_authority=true."
            - "Two work orders W_PJ (PER_JOB) and W_HR (HOURLY), same client, same area, is_emergency=true on W_PJ, false on W_HR."
            - "Each has one heritage tree T (dbh=42, is_heritage=true, near_utility_line=true, lean=20, has_visible_decay=true → hazard_score 100 SEVERE), assessed."
            - "Each estimate has lines: REMOVAL on T (180000), HAUL_OFF qty=3 tons (25500), STUMP_GRINDING qty=42 in (50400); subtotal 255900."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000, requires_permit_authority: true, heritage_surcharge_pct: 0.15 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "1 Oak St", pricing_mode: "PER_JOB", is_emergency: true }
              as: Dispatcher
              captures: { w_pj: $.data.id }
            - call: "POST /work-orders/${w_pj}/trees"
              payload: { species: "Oak", dbh_inches: 42, is_heritage: true, near_utility_line: true, lean_degrees: 20, has_visible_decay: true }
              as: Arborist
              captures: { t_pj: $.data.id }
            - call: "POST /work-orders/${w_pj}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w_pj}/estimates"
              payload: {}
              as: Arborist
              captures: { e_pj: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${e_pj}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${t_pj}" }
              as: Arborist
            - call: "POST /line-items"
              payload: { estimate_id: "${e_pj}", service_type: "HAUL_OFF", quantity: 3 }
              as: Arborist
            - call: "POST /line-items"
              payload: { estimate_id: "${e_pj}", service_type: "STUMP_GRINDING", quantity: 42, tree_asset_id: "${t_pj}" }
              as: Arborist
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "1 Oak St", pricing_mode: "HOURLY", is_emergency: false }
              as: Dispatcher
              captures: { w_hr: $.data.id }
            - call: "POST /work-orders/${w_hr}/trees"
              payload: { species: "Oak", dbh_inches: 42, is_heritage: true, near_utility_line: true, lean_degrees: 20, has_visible_decay: true }
              as: Arborist
              captures: { t_hr: $.data.id }
            - call: "POST /work-orders/${w_hr}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w_hr}/estimates"
              payload: {}
              as: Arborist
              captures: { e_hr: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${e_hr}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${t_hr}" }
              as: Arborist
            - call: "POST /line-items"
              payload: { estimate_id: "${e_hr}", service_type: "HAUL_OFF", quantity: 3 }
              as: Arborist
            - call: "POST /line-items"
              payload: { estimate_id: "${e_hr}", service_type: "STUMP_GRINDING", quantity: 42, tree_asset_id: "${t_hr}" }
              as: Arborist
          trigger:
            - call: "POST /work-orders/${w_pj}/estimates/${e_pj}/issue"
              payload: {}
              as: Arborist
              captures: { pj_total: $.data.total_cents }
            - call: "POST /work-orders/${w_hr}/estimates/${e_hr}/issue"
              payload: {}
              as: Arborist
              captures: { hr_total: $.data.total_cents }
          assert:
            - "Estimate.${e_pj}.line_items_subtotal_cents == 255900"
            - "Estimate.${e_pj}.heritage_surcharge_cents == 38385"
            - "Estimate.${e_pj}.emergency_multiplier_applied == true"
            - "Estimate.${e_pj}.total_cents == 555698"
            - "Estimate.${e_hr}.heritage_surcharge_cents == 0"
            - "Estimate.${e_hr}.emergency_multiplier_applied == false"
            - "Estimate.${e_hr}.total_cents == 332080"
            - "Estimate.${e_pj}.total_cents != Estimate.${e_hr}.total_cents"

      - name: final_invoice_per_job_frozen_vs_hourly_metered
        grounds:
          - calculations.final_invoice
          - entities.WorkOrder.fields.final_invoice_cents
          - entities.WorkOrder.fields.labor_cost_accrued_cents
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Two valid algorithms on the WorkOrder entity (different domain than the Estimate dual-variant):
          PER_JOB final_invoice_cents == accepted_estimate.total_cents (frozen, ignores accruals);
          HOURLY final_invoice_cents == labor + disposal + hazard surcharge over accruals (243100), ignoring any estimate.
        test_recipe:
          setup:
            - "HOURLY work order in SCHEDULED, hazard_level MODERATE (one tree dbh=20, has_visible_decay=true → score 50 MODERATE)."
            - "One crew booking finalized at 10h @9000/hr = 99000 and one equipment booking finalized at 6h @15000/hr = 90000 → labor_cost_accrued 189000."
            - "One disposal ticket 4 tons @8000/ton finalized → disposal_cost_accrued 32000."
            - "Permit not required (tree not protected/heritage), so estimate acceptance needed no permit."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
              payload: { service_area_id: "${area_id}", name: "Crew A", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { service_area_id: "${area_id}", kind: "CHIPPER", name: "Chip-1", hourly_rate_cents: 15000, mobilization_buffer_minutes: 0 }
              as: Dispatcher
              captures: { equip_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "2 Elm St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20, has_visible_decay: true }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
              captures: { v_assessed: $.data.version }
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
              captures: { v_quoted: $.data.version }
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v_sched: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T19:00:00Z", expected_work_order_version: "${v_sched}" }
              as: Dispatcher
              captures: { bk_crew: $.data.id }
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "EQUIPMENT", equipment_id: "${equip_id}", start_at: "2026-07-02T09:00:00Z", end_at: "2026-07-02T15:00:00Z", expected_work_order_version: "${v2}" }
              as: Dispatcher
              captures: { bk_equip: $.data.id }
            - call: "POST /bookings/${bk_crew}/finalize"
              payload: { actual_hours: 10 }
              as: Dispatcher
            - call: "POST /bookings/${bk_equip}/finalize"
              payload: { actual_hours: 6 }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/disposal-tickets"
              payload: { debris_tons: 4 }
              as: FinanceClerk
              captures: { ticket: $.data.id }
            - call: "POST /work-orders/${wo}/disposal-tickets/${ticket}/finalize"
              payload: {}
              as: FinanceClerk
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: {}
              as: Dispatcher
              captures: { invoice: $.data.final_invoice_cents }
          assert:
            - "WorkOrder.${wo}.labor_cost_accrued_cents == 189000"
            - "WorkOrder.${wo}.disposal_cost_accrued_cents == 32000"
            - "WorkOrder.${wo}.hazard_level == MODERATE"
            - "WorkOrder.${wo}.final_invoice_cents == 243100"
            - "WorkOrder.${wo}.status == COMPLETED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tree_hazard_score_three_input_nonlinear
        grounds:
          - calculations.tree_hazard_score
          - entities.TreeAsset.fields.hazard_score
          - entities.TreeAsset.fields.hazard_tier
        distinguishing_aspect: |
          Mode (a): a ≥3-input formula with non-linear interaction — tiered dbh_component
          (10/30/50 step) + capped stepped lean_component (min(30, floor(lean/5)*10)) + additive
          decay, then >= tier bucketing. dbh=36,lean=10,decay=true → 50+20+20 = 90 SEVERE.
        test_recipe:
          setup:
            - "DRAFT work order with one tree dbh=36, lean_degrees=10, has_visible_decay=true."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "3 Pine St", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Fir", dbh_inches: 36, lean_degrees: 10, has_visible_decay: true }
              as: Arborist
              captures: { tree: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
          assert:
            - "TreeAsset.${tree}.hazard_score == 90"
            - "TreeAsset.${tree}.hazard_tier == SEVERE"
            - "WorkOrder.${wo}.hazard_level == SEVERE"

      - name: estimate_round_per_line_then_sum_order
        grounds:
          - calculations.estimate_total
          - calculations.line_item_cost
          - entities.Estimate.fields.line_items_subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each line is rounded
          (round_half_up) BEFORE summing into line_items_subtotal_cents, then percentage
          surcharges are applied to the integer subtotal and rounded individually. HAUL_OFF
          qty=2.5 tons @8500 = 21250 (round_half_up of 21250.0) and STUMP qty=12.5 in @1200 =
          15000; subtotal 36250; MODERATE hazard 0.10 → surcharge round_half_up(3625.0)=3625.
        test_recipe:
          setup:
            - "PER_JOB work order, MODERATE hazard (tree dbh=20 + decay → 50 MODERATE), no heritage, no utility, not emergency."
            - "Estimate with HAUL_OFF qty=2.5 tons and STUMP_GRINDING qty=12.5 inches."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000, heritage_surcharge_pct: 0.15 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "4 Birch St", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20, has_visible_decay: true }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "HAUL_OFF", quantity: 2.5 }
              as: Arborist
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "STUMP_GRINDING", quantity: 12.5, tree_asset_id: "${tree}" }
              as: Arborist
          trigger:
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
          assert:
            - "Estimate.${est}.line_items_subtotal_cents == 36250"
            - "Estimate.${est}.hazard_surcharge_cents == 3625"
            - "Estimate.${est}.heritage_surcharge_cents == 0"
            - "Estimate.${est}.total_cents == 39875"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_branch_scheduled_to_completed_vs_cancelled
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.WorkOrder.fields.final_invoice_cents
        distinguishing_aspect: |
          Branching fork on WorkOrder: from SCHEDULED the two outbound edges have divergent
          side-effect sets — COMPLETED computes final_invoice_cents (243100) leaving bookings
          FINALIZED; CANCELLED zeroes final_invoice_cents and RELEASES bookings. Two SCHEDULED
          work orders take opposite branches.
        test_recipe:
          setup:
            - "Two SCHEDULED HOURLY work orders W1, W2 (same setup: tree dbh=20 decay → MODERATE, estimate accepted)."
            - "W1 has a crew booking finalized 10h@9000 (labor 99000) and disposal 4t@8000 finalized (32000)."
            - "W2 has one RESERVED crew booking only."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
              payload: { service_area_id: "${area_id}", name: "Crew A", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "5 Cedar St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/trees"
              payload: { species: "Maple", dbh_inches: 20, has_visible_decay: true }
              as: Arborist
              captures: { t1: $.data.id }
            - call: "POST /work-orders/${w1}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w1}/estimates"
              payload: {}
              as: Arborist
              captures: { e1: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${e1}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${t1}" }
              as: Arborist
            - call: "POST /work-orders/${w1}/estimates/${e1}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w1}/estimates/${e1}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${w1}"
              payload: {}
              as: Dispatcher
              captures: { w1_v: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${w1}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T19:00:00Z", expected_work_order_version: "${w1_v}" }
              as: Dispatcher
              captures: { bk1: $.data.id }
            - call: "POST /bookings/${bk1}/finalize"
              payload: { actual_hours: 10 }
              as: Dispatcher
            - call: "POST /work-orders/${w1}/disposal-tickets"
              payload: { debris_tons: 4 }
              as: FinanceClerk
              captures: { tk1: $.data.id }
            - call: "POST /work-orders/${w1}/disposal-tickets/${tk1}/finalize"
              payload: {}
              as: FinanceClerk
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "6 Cedar St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/trees"
              payload: { species: "Maple", dbh_inches: 20, has_visible_decay: true }
              as: Arborist
              captures: { t2: $.data.id }
            - call: "POST /work-orders/${w2}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w2}/estimates"
              payload: {}
              as: Arborist
              captures: { e2: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${e2}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${t2}" }
              as: Arborist
            - call: "POST /work-orders/${w2}/estimates/${e2}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${w2}/estimates/${e2}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${w2}"
              payload: {}
              as: Dispatcher
              captures: { w2_v: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${w2}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T19:00:00Z", expected_work_order_version: "${w2_v}" }
              as: Dispatcher
              captures: { bk2: $.data.id }
          trigger:
            - call: "POST /work-orders/${w1}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${w2}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /bookings/${bk2}"
              payload: {}
              as: Dispatcher
              captures: { bk2_status: $.data.status }
          assert:
            - "WorkOrder.${w1}.status == COMPLETED"
            - "WorkOrder.${w1}.final_invoice_cents == 243100"
            - "WorkOrder.${w2}.status == CANCELLED"
            - "WorkOrder.${w2}.final_invoice_cents == 0"
            - "Booking.${bk2}.status == RELEASED"

      - name: permit_revision_cycle_under_review_changes_requested
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Permit.CHANGES_REQUESTED_to_UNDER_REVIEW
          - entities.Permit.fields.revision_count
        distinguishing_aspect: |
          Cyclic shape on the Permit entity (different entity than WorkOrder): the back-edge
          UNDER_REVIEW → CHANGES_REQUESTED → UNDER_REVIEW may repeat; each request-changes bumps
          revision_count. Two full cycles → revision_count == 2 and status back to UNDER_REVIEW.
        test_recipe:
          setup:
            - "Work order with a protected tree so requires_permit is true after assess; a DRAFT permit submitted."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000, requires_permit_authority: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "7 Walnut St", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Oak", dbh_inches: 30, is_protected: true }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/permits"
              payload: { authority_ref: "PRM-001" }
              as: Arborist
              captures: { permit: $.data.id }
            - call: "POST /work-orders/${wo}/permits/${permit}/submit"
              payload: {}
              as: Arborist
          trigger:
            - call: "POST /work-orders/${wo}/permits/${permit}/request-changes"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo}/permits/${permit}/submit"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/permits/${permit}/request-changes"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo}/permits/${permit}/submit"
              payload: {}
              as: Arborist
              captures: { final_status: $.data.status, rev: $.data.revision_count }
          assert:
            - "Permit.${permit}.revision_count == 2"
            - "Permit.${permit}.status == UNDER_REVIEW"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_finalize_cascade_ledger_version_stale_create
        grounds:
          - state_machines.Booking.RESERVED_to_FINALIZED
          - entities.WorkOrder.fields.labor_cost_accrued_cents
          - entities.WorkOrder.fields.version
          - concurrency_rules[booking-create-stale-work-order]
        distinguishing_aspect: |
          Depth-3 transitive chain triggered by booking finalize: finalize → Booking RESERVED→FINALIZED
          (B); B sets billed_cost and B's mutation bumps WorkOrder.labor_cost_accrued_cents (C, caused by B);
          C's ledger mutation increments WorkOrder.version (D, caused by C). A second booking create still
          carrying the pre-finalize version is then rejected ERR_STALE_WORK_ORDER_VERSION.
        test_recipe:
          setup:
            - "SCHEDULED HOURLY work order with crew@9000, one RESERVED crew booking BK1 9h."
            - "Client captured the work order version BEFORE finalize."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
