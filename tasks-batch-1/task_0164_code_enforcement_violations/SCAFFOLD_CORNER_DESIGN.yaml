              payload: { full_name: "Stan S", mailing_email: "stan@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-ST", street_address: "21 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { stale_v: $.data.version }
            - call: "POST /cases/${case_id}/payments"
              payload: { amount_cents: 10000, expected_case_version: "${stale_v}" }
              as: FinanceClerk
          trigger:
            - call: "POST /liens"
              payload: { case_id: "${case_id}", expected_case_version: "${stale_v}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_VERSION (expected_case_version is now one behind current after the payment bumped it)"

