# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Laundry & Dry-Cleaning Pickup/Delivery — EXPERT band
# 9 rule_ids x >= 2 instances each (>= 18 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_total_diverge
        grounds:
          - calculations.garment_line_price
          - calculations.order_estimate_total
          - calculations.order_final_total
          - state_machines.Order.SCHEDULED_to_PICKED_UP
          - state_machines.Order.IN_PROCESSING_to_QC_HOLD
          - entities.Order.fields.estimate_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          Same two garments produce estimate_total_cents=4300 (declared 4000g WF +
          3 DRY_CLEAN pieces) but final_total_cents=4100 (actual 6000g WF + 2
          DRY_CLEAN pieces); the dual variant is on the ORDER cost domain.
        test_recipe:
          setup:
            - "One Customer in zone Z1; one PICKUP window and one DELIVERY window in Z1; order created with 2 garments (WASH_FOLD declared 4000g, DRY_CLEAN declared 3 pieces); no subscription; no rush."
            - "Order scheduled (estimate computed), picked up, both garments logged with actuals 6000g and 2 pieces, processing started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "dv1@x.com", full_name: "DV One", default_address: "1 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP", rush: false }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 4000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "DRY_CLEAN", declared_piece_count: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g2_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 6000 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g2_id}/log-intake"
              payload: { actual_piece_count: 2 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g2_id}/finish-clean"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/qc-hold"
              payload: {}
              as: PlantOperator
              captures: { final_total: $.data.final_total_cents, est_total: $.data.estimate_total_cents }
          assert:
            - "Order.${order_id}.estimate_total_cents == 4300"
            - "Order.${order_id}.final_total_cents == 4100"

      - name: customer_risk_provisional_vs_settled
        grounds:
          - calculations.customer_risk_score
          - state_machines.Garment.INTAKE_LOGGED_to_LOST
          - state_machines.Claim.APPROVED_to_SETTLED
          - entities.Customer.fields.risk_score
        distinguishing_aspect: |
          The dual variant is on the CUSTOMER risk domain (not order cost): a logged
          note contributes its provisional severity (+5) while a SETTLED claim adds a
          fixed SETTLED_CLAIM_RISK_POINTS (+25), proving two divergent valuations of
          the same subject on a different entity than dual_variant_calc instance 1.
        test_recipe:
          setup:
            - "Order processed to IN_PROCESSING with one WASH_FOLD garment logged; a STAIN note of severity 5 logged (provisional +5); the garment marked LOST (+15); a GARMENT claim filed, investigated, approved, settled (+25)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "dv2@x.com", full_name: "DV Two", default_address: "2 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 3000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 3000 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/notes"
              payload: { note_kind: "STAIN", severity: 5, description: "ink" }
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/mark-lost"
              payload: {}
              as: PlantOperator
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov: $.data.version }
            - call: "POST /claims"
              payload: { order_id: "${order_id}", subject_kind: "GARMENT", garment_id: "${g1_id}", declared_value_cents: 10000, expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/investigate"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/settle"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rs: $.data.risk_score }
          assert:
            - "Customer.${cust_id}.risk_score == 45"
            - "Claim.${claim_id}.settlement_cents == 8000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: garment_line_price_tiered_discount_rush_modeA
        grounds:
          - calculations.garment_line_price
          - state_machines.Garment.CLEANING_to_CLEANED
          - entities.Garment.fields.final_line_cents
          - entities.SubscriptionPlan.fields.dryclean_discount_pct
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction (service_type branch ->
          subscriber discount factor -> rush multiplier) on one DRY_CLEAN garment:
          4 pieces * 900 = 3600, *0.75 (25% sub discount) = 2700, *1.25 (rush) = 3375.
        test_recipe:
          setup:
            - "PLUS plan (dryclean_discount_pct=0.25, rush_waived=false); subscriber customer with ACTIVE subscription; rush order with one DRY_CLEAN garment, 4 pieces logged; processing started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 6000, included_wash_fold_grams: 5000, overage_rate_cents_per_kg: 350, dryclean_discount_pct: 0.25, rush_waived: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF One", default_address: "3 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", subscription_id: "${sub_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP", rush: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "DRY_CLEAN", declared_piece_count: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_piece_count: 4 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/garments/${g1_id}/finish-clean"
              payload: {}
              as: PlantOperator
              captures: { line: $.data.final_line_cents }
          assert:
            - "Garment.${g1_id}.final_line_cents == 3375"

      - name: order_total_round_per_line_then_sum_modeB
        grounds:
          - calculations.garment_line_price
          - calculations.order_final_total
          - state_machines.Order.IN_PROCESSING_to_QC_HOLD
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          MODE (b): rounding order is pinned to round-per-line-THEN-sum. Three
          WASH_FOLD garments each 1g under rush produce a raw 0.5 cents that rounds
          to 1 cent per line; summed = 3. The sum-then-round interpretation would
          give round(1.5)=2. The scaffold pins 3.
        test_recipe:
          setup:
            - "Rush, non-subscriber order with three WASH_FOLD garments each declared/actual 1 gram; processing started; all three finish-cleaned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "cf2@x.com", full_name: "CF Two", default_address: "4 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP", rush: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g2_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g3_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 1 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g2_id}/log-intake"
              payload: { actual_weight_grams: 1 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g3_id}/log-intake"
              payload: { actual_weight_grams: 1 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g2_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g3_id}/finish-clean"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/qc-hold"
              payload: {}
              as: PlantOperator
              captures: { final_total: $.data.final_total_cents }
          assert:
            - "Garment.${g1_id}.final_line_cents == 1"
            - "Order.${order_id}.final_total_cents == 3"

      - name: subscription_billing_read_before_write_modeC
        grounds:
          - calculations.subscription_billing
          - calculations.invoice_amounts
          - state_machines.Order.QC_HOLD_to_READY
          - entities.Subscription.fields.cycle_wash_fold_grams_used
          - entities.Invoice.fields.subscription_credit_cents
        distinguishing_aspect: |
          MODE (c): circular-looking dependency pinned by evaluation order. At the
          second order's qc-pass the subscription credit reads
          cycle_wash_fold_grams_used (prior=2000) BEFORE adding this order's 4000g, so
          included_remaining=3000, covered=3000, credit=1200; only AFTER does
          cycle_used become 6000. Reversing the order would yield a different credit.
        test_recipe:
          setup:
            - "PLUS plan (included_wash_fold_grams=5000); subscriber whose subscription cycle_wash_fold_grams_used has already reached 2000 via a prior delivered order; a second order with one WASH_FOLD garment actual 4000g processed through to QC_HOLD with a DOORSTEP handoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 6000, included_wash_fold_grams: 5000, overage_rate_cents_per_kg: 350, dryclean_discount_pct: 0.25 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cf3@x.com", full_name: "CF Three", default_address: "5 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            # ----- prior order: 2000g wash-fold, delivered, to set cycle_used=2000 -----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", subscription_id: "${sub_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o0_id: $.data.id }
            - call: "POST /orders/${o0_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o0g_id: $.data.id }
            - call: "POST /orders/${o0_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o0_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${o0_id}/garments/${o0g_id}/log-intake"
              payload: { actual_weight_grams: 2000 }
              as: PlantOperator
            - call: "POST /orders/${o0_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${o0_id}/garments/${o0g_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${o0_id}/qc-hold"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${o0_id}/qc-pass"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${o0_id}/dispatch-delivery"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${o0_id}/confirm-delivery"
              payload: {}
              as: DispatchAgent
            # ----- second order: 4000g wash-fold, advanced to READY -----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", subscription_id: "${sub_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 4000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 4000 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/qc-hold"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/qc-pass"
              payload: {}
              as: PlantOperator
            - call: "GET /orders/${order_id}/invoice"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_credit: "$.data[0].subscription_credit_cents" }
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { used: $.data.cycle_wash_fold_grams_used }
          assert:
            - "Invoice for ${order_id} subscription_credit_cents == 1200"
            - "Subscription.${sub_id}.cycle_wash_fold_grams_used == 6000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_qc_rework_cycle
        grounds:
          - state_machines.Order.IN_PROCESSING_to_QC_HOLD
          - state_machines.Order.QC_HOLD_to_IN_PROCESSING
          - state_machines.Garment.CLEANED_to_CLEANING
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          Cyclic IN_PROCESSING <-> QC_HOLD on the ORDER entity: qc-hold then
          reopen-processing (after a rewash) returns to IN_PROCESSING and clears
          final_total_cents to 0, proving a non-linear loop (not an A->B->C pipeline).
        test_recipe:
          setup:
            - "Order with one WASH_FOLD garment processed to QC_HOLD (final_total computed); one garment rewashed (CLEANED->CLEANING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "nl1@x.com", full_name: "NL One", default_address: "6 A St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
