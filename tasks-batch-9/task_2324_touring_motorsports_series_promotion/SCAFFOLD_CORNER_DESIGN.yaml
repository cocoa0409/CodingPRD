          - validations[order=23]
          - validations[order=24]
          - validations[order=53]
          - calculations.stop_readiness_posture
        distinguishing_aspect: "A bare stop violates four separate on-sale rules at once, so the only way to observe all four codes is to repair them one at a time in declared order: 15 (safety), 23 (competition segments), 24 (tiers), then the composite 53 which is left over once every specific check passes but marketing_spend_committed_cents is still 0. ERR_STOP_NOT_READY must never be returned in place of one of the specific codes."
