  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: renewal_with_stale_version_returns_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[renewal-stale-facility]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Facility.version: inside an open renewal window, a renewal carrying expected_facility_version one behind the current version is rejected 412 ERR_STALE_VERSION, while the same call at the current version succeeds — two sequential requests, no overlap."
        test_recipe:
          setup:
            - "Facility registered at default clock (version 1); clock advanced to the open window instant 2028-06-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Quito Cacao", facility_kind: "FOREIGN", country_code: "EC", ufi: "UFI-EC-2701" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /registry/facilities/${fac_id}/renew"
              payload: { expected_facility_version: "${fac_v} - 1" }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
            - call: "POST /registry/facilities/${fac_id}/renew"
              payload: { expected_facility_version: "${fac_v}" }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { st: $.data.registration_status, new_exp: $.data.expires_at }
          assert:
            - "stale call: err == ERR_STALE_VERSION (http 412); facility unchanged"
            - "fresh call succeeds: st == REGISTERED and new_exp == 2030-08-31T00:00:00Z and version == 2"

      - name: petition_with_stale_alert_version_returns_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[petition-create-stale-alert]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on ImportAlert.version: the first petition filing legitimately advances the alert's version (v1 -> v2), so a second filing that still carries v1 is rejected 412 ERR_STALE_VERSION — the losing request observes an unchanged ACTIVE state and would succeed without the version check."
        test_recipe:
          setup: ["Default clock; facility; FIRM alert (version 1)."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Oaxaca Chocolate", facility_kind: "FOREIGN", country_code: "MX", ufi: "UFI-MX-2702" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Salmonella" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_id: $.data.id, alert_v: $.data.version }
          trigger:
            - call: "POST /registry/import-alerts/${alert_id}/petitions"
              payload: { expected_import_alert_version: "${alert_v}", evidence_links: ["doc-1"] }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { pet_1: $.data.id }
            - call: "POST /registry/import-alerts/${alert_id}/petitions"
              payload: { expected_import_alert_version: "${alert_v}", evidence_links: ["doc-2"] }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first filing succeeds (201): AlertPetition.${pet_1}.status == EVIDENCE_REVIEW and the alert version advances to 2"
            - "second filing with the stale v1: err == ERR_STALE_VERSION (http 412)"
            - "GET /registry/import-alerts/${alert_id}/petitions returns exactly 1 row"

      - name: open_detention_count_reconciles_across_detain_release_refuse
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Facility.fields.open_detention_count
          - endpoints.POST_/registry/entries/{id}/release
          - endpoints.POST_/registry/entries/{id}/refuse
        distinguishing_aspect: "The derived counter tracks each bucket transition exactly: 2 after the alert cascade detains two entries, 1 after a ComplianceOfficer release, 0 after a refusal — while violation_count independently steps 0 -> 0 -> 1."
        test_recipe:
          setup: ["Default clock; facility, importer; two entries auto-detained by one FIRM alert."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Riga Rupjmaize", facility_kind: "FOREIGN", country_code: "LV", ufi: "UFI-LV-2703" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Piedmont Traders", account_code: "IMP-2703" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-BRD-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 5, unit_value_cents: 100, port_code: "US-BAL" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_1: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_1}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_1: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-BRD-02", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 5, unit_value_cents: 100, port_code: "US-BAL" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_2: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_2}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_2: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Filth" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /registry/entries/${ent_1}/release"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "GET /registry/facilities/${fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { odc_mid: $.data.open_detention_count, vc_mid: $.data.violation_count }
            - call: "POST /registry/entries/${ent_2}/refuse"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /registry/facilities/${fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { odc_end: $.data.open_detention_count, vc_end: $.data.violation_count }
          assert:
            - "after the alert cascade: open_detention_count was 2 (both entries DETAINED)"
            - "after release: odc_mid == 1 and vc_mid == 0 (release is not a violation)"
            - "after refusal: odc_end == 0 and vc_end == 1"

      - name: inspection_refusal_cascade_side_effects
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Inspection.SCHEDULED_to_REFUSED_BY_FACILITY
        excluded_because:
          difficulty_instance: inspection_refusal_cascade
          rationale: "The three-link cascade (suspend -> detain -> compromise) is asserted link-by-link in the named §1.8 instance."

      - name: alert_activation_cascade_side_effects
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/registry/import-alerts
        excluded_because:
          difficulty_instance: alert_activation_cascade
          rationale: "Auto-detention of matching entries plus open_detention_count recompute is asserted in the named §1.8 instance; COUNTRY_PRODUCT matching is covered by the corner instance country_product_alert_cascade_matches_scope."

