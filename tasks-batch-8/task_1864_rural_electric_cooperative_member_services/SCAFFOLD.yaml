  - { method: GET, path: "/coop/service-orders", description: "List service orders", roles: [MemberServicesRep, FieldOpsCoordinator], code: 200, input: ["service_location_id?", "status?", "row_agreement_id?", "limit?", "offset?"], output: "ServiceOrder[]", side_effects: [] }
  - { method: POST, path: "/coop/service-orders/{id}/estimate", description: "Compute aid-to-construction estimate", roles: [FieldOpsCoordinator], code: 200, input: [], output: ServiceOrder, side_effects: ["status -> ESTIMATED", "aid_to_construction_cents computed", "ROW auto-created"] }
