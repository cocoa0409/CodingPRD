# =============================================================================
# SCAFFOLD.yaml — Private Label Manufacturing & Health System Conversion Programs
# Sections 1.0-1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Private Label Manufacturing & Health System Conversion Programs (Medline): manufacturing and sourcing of branded and private label medical products across categories with quality system oversight, health system conversion programs where a facility switches from competing products with clinician evaluation and training, custom procedure tray configuration with component selection, assembly and change management as preferences shift, prime vendor distribution agreements with fill rate, delivery frequency and low unit of measure commitments, contract compliance and rebate administration through group purchasing organizations, supply disruption management with allocation, substitution approval and clinician communication, sterilization and regulatory registration for manufactured devices, on-site inventory management programs in hospitals

domain_name: private-label-medsupply
api_prefix: /supply

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; globally unique across all products" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: brand_type, type: enum, source: input, description: "BRANDED | PRIVATE_LABEL — only PRIVATE_LABEL products may have manufacturing lots" }
      - { name: category, type: enum, source: input, description: "SURGICAL_INSTRUMENTS | WOUND_CARE | EXAM_GLOVES | STERILIZATION_SUPPLIES | UROLOGICAL | RESPIRATORY" }
      - { name: sterile, type: boolean, source: input, description: "True if the product is supplied sterile" }
      - { name: device_class, type: enum, source: input, description: "CLASS_I | CLASS_II | CLASS_III regulatory device class" }
      - { name: registration_status, type: enum, source: system, default: UNREGISTERED, description: "Regulatory registration lifecycle: UNREGISTERED | SUBMITTED | REGISTERED | REJECTED (see state machine)" }
      - { name: availability, type: enum, source: input, default: ACTIVE, description: "ACTIVE | DISCONTINUED — orderability flag" }
      - { name: units_per_case, type: integer, source: input, description: "Eaches per distribution case; > 0" }
      - { name: each_price_cents, type: integer, source: input, description: "Unit price per each in cents; >= 0" }
      - { name: order_multiple, type: integer, source: input, default: 1, description: "Orders for this product must be a multiple of this quantity unless LUM-applies; >= 1" }
      - { name: lum_eligible, type: boolean, source: input, default: false, description: "Eligible for low-unit-of-measure (each-level) ordering when the governing agreement carries lum_commitment" }

  - name: ManufacturingLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code; globally unique" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must reference a PRIVATE_LABEL product whose registration_status == REGISTERED" }
      - { name: quantity, type: integer, source: input, description: "Units produced; > 0" }
      - { name: manufacture_date, type: string, source: input, description: "ISO date of manufacture (YYYY-MM-DD)" }
      - { name: expiry_date, type: string, source: input, description: "ISO expiry date; must be strictly after manufacture_date" }
      - { name: status, type: enum, source: system, default: AWAITING_QA, description: "AWAITING_QA | RELEASED | REJECTED | QUARANTINED (see state machine)" }
      - { name: sterilization_batch_id, type: string, source: system, description: "FK -> SterilizationBatch.id; null until the lot is included in a sterilization batch; a lot belongs to at most one batch" }
      - { name: sterility_status, type: enum, source: computed, default: PENDING, description: "NOT_REQUIRED when product.sterile is false; otherwise mirrors the containing batch sterility_result: PENDING until recorded, PASSED or FAILED once recorded" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the ManufacturingPlanner who created the lot; used by the segregation-of-duties check" }
      - { name: qa_disposition_by, type: string, source: system, description: "X-User-ID of the QualityManager who recorded the QA disposition; null until dispositioned" }
      - { name: qa_disposition_at, type: datetime, source: system, description: "Logical-clock timestamp of QA disposition; null until dispositioned" }

  - name: SterilizationBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Batch code; globally unique" }
      - { name: chamber_id, type: string, source: input, description: "Sterilizer chamber identifier; scheduling resource for overlap checks" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC window start; half-open interval [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC window end; must be strictly after scheduled_start" }
      - { name: lot_ids, type: array, source: input, description: "IDs of ManufacturingLots included; sets each lot's sterilization_batch_id (canonical link lives on the lot)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED" }
      - { name: sterility_result, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED; set once by record-sterility-result" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the QualityManager who recorded the result; null until recorded" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: health_system_name, type: string, source: input, description: "Owning health system label" }
      - { name: facility_type, type: enum, source: input, description: "ACUTE_CARE | SURGERY_CENTER | CLINIC | LONG_TERM_CARE" }
      - { name: ship_to_address, type: string, source: input, description: "Delivery address" }

  - name: ConversionProgram
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the facility switching away from competing products" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: target_categories, type: array, source: input, description: "List of Product.category values this conversion covers; non-empty" }
      - { name: line_items, type: array, source: input, description: "1..20 embedded line items, each: { line_id (server-minted string), incumbent_product_id (references Product.id), replacement_product_id (references Product.id), evaluation_status (system enum PENDING | PASSED | FAILED, default PENDING), training_completed (system boolean, default false), evaluated_by (system string, null until evaluated), evaluation_notes (system string) }" }
      - { name: status, type: enum, source: system, default: IN_EVALUATION, description: "IN_EVALUATION | IN_REVIEW | CONVERTED (see state machine; cyclic redesign loop)" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the ConversionManager who recorded the last review decision; null until reviewed" }
      - { name: review_decision_at, type: datetime, source: system, description: "Logical-clock timestamp of the last review decision; null until reviewed" }

  - name: TrayTemplate
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility this custom procedure tray serves" }
      - { name: name, type: string, source: input, description: "Tray template name" }
      - { name: procedure_type, type: string, source: input, description: "Free-text procedure label (e.g. 'LACERATION_REPAIR')" }
      - { name: sterile_assembly, type: boolean, source: input, description: "When true, every component product must have sterile == true" }
      - { name: components, type: array, source: input, description: "1..30 embedded components, each: { product_id (references Product.id), quantity (integer > 0) }; product_id values unique within the array" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | ACTIVE | UNDER_CHANGE (see state machine; change-management cycle)" }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of the user who submitted the currently pending proposal; null when no proposal is pending" }
      - { name: approved_version, type: integer, source: system, description: "Template version pinned at the most recent APPROVE decision (post-increment); null until first approval" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the SupplyChainAdmin who last approved; null until first approval" }

  - name: PrimeVendorAgreement
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; at most one non-EXPIRED agreement per facility" }
      - { name: committed_fill_rate_pct, type: number, source: input, description: "Committed aggregate fill rate percent, 0..100 with up to 2 decimals (e.g. 98.5)" }
      - { name: deliveries_per_week, type: integer, source: input, description: "Committed delivery frequency; 1..7" }
      - { name: lum_commitment, type: boolean, source: input, description: "Low-unit-of-measure commitment: when true, lum_eligible products may be ordered in eaches" }
      - { name: annual_commitment_cents, type: integer, source: input, description: "Annual spend cap covered by the agreement; > 0" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of total_price_cents over this agreement's orders that reached RECEIVED" }
      - { name: rolling_fill_rate_pct, type: number, source: computed, description: "Aggregate fill rate over RECEIVED orders received within the trailing 90-day window of the logical clock; null until at least one RECEIVED order exists in the window" }
      - { name: start_date, type: string, source: input, description: "ISO date the agreement opens (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date the agreement closes (inclusive); must be strictly after start_date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | EXPIRED (see state machine; auto breach/recovery cycle, lazy expiry)" }

  - name: DistributionOrder
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PrimeVendorAgreement.id; order rides under this agreement" }
      - { name: requested_delivery_date, type: string, source: input, description: "ISO date; must be strictly after the current logical-clock date and within [agreement.start_date, agreement.end_date]" }
      - { name: lines, type: array, source: input, description: "1..50 embedded order lines, each: { product_id (references Product.id), ordered_qty (integer > 0), shipped_qty (system integer, default 0), backorder_cancelled (system boolean, default false) }; product_id values unique within the array" }
      - { name: status, type: enum, source: system, default: PLACED, description: "PLACED | PARTIALLY_SHIPPED | SHIPPED | RECEIVED (see state machine)" }
      - { name: provisional_fill_rate_pct, type: number, source: computed, description: "Fill rate computed from shipped vs ordered units at each SHIPPED fulfillment event; null until the first SHIPPED event" }
      - { name: final_fill_rate_pct, type: number, source: computed, description: "Fill rate computed at RECEIVED against still-wanted units (ordered minus backorder-cancelled); null until RECEIVED" }
      - { name: total_price_cents, type: integer, source: computed, description: "Order total computed at creation by the order_price calculation (per-line case-rounding rule)" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt; null until RECEIVED" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; member facility whose purchases accrue the rebate" }
      - { name: gpo_name, type: string, source: input, description: "Group purchasing organization administering the contract" }
      - { name: period_start, type: string, source: input, description: "ISO period start; CLOSED interval [period_start, period_end] — both endpoints inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO period end; must be strictly after period_start" }
      - { name: eligible_purchase_cents, type: integer, source: input, description: "Contract-eligible purchase volume in cents for the period; > 0" }
      - { name: private_label_share, type: number, source: input, description: "Fraction 0..1 of eligible purchases that were private label" }
      - { name: compliant, type: boolean, source: input, description: "Whether the facility met GPO contract compliance for the period" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Accrual computed at creation: base tier rate x eligible volume (no compliance multiplier, no private-label bonus)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Validated amount computed at SUBMIT and recomputed at RESUBMIT: (base tier rate + private-label bonus) x compliance multiplier; null until first SUBMIT" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED | SUBMITTED | PAID | DISPUTED (see state machine; dispute-resubmit cycle)" }
      - { name: dispute_reason, type: string, source: input, description: "Required when lifecycle event SETTLE_DISPUTED is recorded; null otherwise" }

  - name: SupplyDisruption
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product in short supply" }
      - { name: disrupted_quantity, type: integer, source: input, description: "Total units short across all facilities; > 0" }
      - { name: reason, type: enum, source: input, description: "RAW_MATERIAL_SHORTAGE | FDA_HOLD | TRANSPORTATION | DEMAND_SURGE | RECALL" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: expected_resolution_date, type: string, source: input, description: "ISO date supply is expected to normalize" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED | MITIGATING | RESOLVED (see state machine; auto-transitions on coverage)" }
      - { name: allocations, type: array, source: system, description: "Embedded allocation records appended by POST .../allocations: { allocation_id, facility_id, quantity, created_at }" }
      - { name: substitution_requests, type: array, source: system, description: "Embedded substitution requests: { request_id, facility_id, proposed_product_id (references Product.id), covered_quantity, status (PENDING | APPROVED | REJECTED), decided_by, rationale }" }
      - { name: allocated_total, type: integer, source: computed, default: 0, description: "Sum of allocations[].quantity" }
      - { name: approved_sub_total, type: integer, source: computed, default: 0, description: "Sum of covered_quantity over substitution_requests with status APPROVED" }
      - { name: remaining_pool, type: integer, source: computed, description: "disrupted_quantity - allocated_total - approved_sub_total; equals disrupted_quantity at creation" }
      - { name: covered_quantity, type: integer, source: computed, default: 0, description: "allocated_total + approved_sub_total; disruption auto-resolves when covered_quantity >= disrupted_quantity" }

  - name: InventoryProgram
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; hospital whose stockroom the vendor manages on-site" }
      - { name: program_type, type: enum, source: input, description: "STOCKROOM_MANAGED | CRASH_CART | OR_CORE" }
      - { name: positions, type: array, source: input, description: "1..50 embedded stock positions, each: { product_id (references Product.id), par_level (integer > 0), reorder_point (integer >= 0, must be <= par_level), on_hand (integer >= 0) }; product_id values unique within the array. Each position carries two computed subfields: reorder_status (OK | DUE | CRITICAL) and suggested_order_qty (integer)." }
      - { name: auto_replenish_enabled, type: boolean, source: system, default: true, description: "Set false by the fill-rate-breach cascade from the facility's PrimeVendorAgreement; restored to true on agreement recovery" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: UNREGISTERED
    terminal_states: [REGISTERED]
    note: "Machine governs Product.registration_status. REGISTERED is terminal for the benchmark scope; REJECTED loops back to SUBMITTED (resubmission cycle)."
    transitions:
      - from: UNREGISTERED
        to: SUBMITTED
        trigger: "POST /supply/products/{id}/registration-events with event=SUBMIT"
        actor: RegulatorySpecialist
        preconditions:
          - "registration_status == UNREGISTERED (else ERR_INVALID_STATE)"
        side_effects:
          - "registration_status := SUBMITTED; increments Product.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /supply/products/{id}/registration-events with event=SUBMIT"
        actor: RegulatorySpecialist
        preconditions:
          - "registration_status == REJECTED (else ERR_INVALID_STATE)"
        side_effects:
          - "registration_status := SUBMITTED; increments Product.version by 1"
        note: "Resubmission closes the registration cycle REJECTED -> SUBMITTED."
      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /supply/products/{id}/registration-events with event=APPROVE"
        actor: RegulatorySpecialist
        preconditions:
          - "registration_status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "registration_status := REGISTERED; increments Product.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /supply/products/{id}/registration-events with event=REJECT"
        actor: RegulatorySpecialist
        preconditions:
          - "registration_status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "registration_status := REJECTED; increments Product.version by 1"

  - entity: ManufacturingLot
    initial_state: AWAITING_QA
    terminal_states: [RELEASED, REJECTED]
    note: "Machine governs ManufacturingLot.status."
    transitions:
      - from: AWAITING_QA
        to: RELEASED
        trigger: "POST /supply/manufacturing-lots/{id}/qa-disposition with disposition=RELEASE"
        actor: QualityManager
        preconditions:
          - "lot.status == AWAITING_QA (else ERR_INVALID_STATE)"
          - "Segregation of duties: lot.created_by != acting X-User-ID (else ERR_SOD_LOT_DISPOSITION)"
          - "Product of lot.product_id has registration_status == REGISTERED (else ERR_PRODUCT_NOT_REGISTERED)"
          - "lot.sterility_status in {PASSED, NOT_REQUIRED} (else ERR_STERILITY_NOT_PASSED)"
        side_effects:
          - "lot.status := RELEASED; qa_disposition_by := acting X-User-ID; qa_disposition_at := current logical clock; increments lot.version by 1"
      - from: AWAITING_QA
        to: REJECTED
        trigger: "POST /supply/manufacturing-lots/{id}/qa-disposition with disposition=REJECT"
        actor: QualityManager
        preconditions:
          - "lot.status == AWAITING_QA (else ERR_INVALID_STATE)"
          - "Segregation of duties: lot.created_by != acting X-User-ID (else ERR_SOD_LOT_DISPOSITION)"
        side_effects:
          - "lot.status := REJECTED; qa_disposition_by := acting X-User-ID; qa_disposition_at := current logical clock; increments lot.version by 1"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /supply/manufacturing-lots/{id}/qa-disposition with disposition=REJECT"
        actor: QualityManager
        preconditions:
          - "lot.status == QUARANTINED (else ERR_INVALID_STATE)"
          - "Segregation of duties: lot.created_by != acting X-User-ID (else ERR_SOD_LOT_DISPOSITION)"
        side_effects:
          - "lot.status := REJECTED; qa_disposition_by := acting X-User-ID; qa_disposition_at := current logical clock; increments lot.version by 1"
      - from: AWAITING_QA
        to: QUARANTINED
        trigger: "system cascade — a SterilizationBatch containing this lot records sterility_result=FAILED"
        actor: system
        preconditions:
          - "lot.status == AWAITING_QA (lots already RELEASED or REJECTED are skipped by the cascade)"
        side_effects:
          - "lot.status := QUARANTINED; lot.sterility_status := FAILED; increments lot.version by 1"

  - entity: SterilizationBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    note: "Machine governs SterilizationBatch.status."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /supply/sterilization-batches/{id}/record-sterility-result with result in {PASSED, FAILED}"
        actor: QualityManager
        preconditions:
          - "batch.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "batch.status := COMPLETED; sterility_result := payload result; recorded_by := acting X-User-ID; increments batch.version by 1"
          - "If result == PASSED: every lot in lot_ids gets sterility_status := PASSED (lot status unchanged)"
          - "If result == FAILED: cascade — every lot in lot_ids with status == AWAITING_QA transitions to QUARANTINED with sterility_status := FAILED (lots already RELEASED or REJECTED are untouched); each cascaded lot's version increments by 1"

  - entity: ConversionProgram
    initial_state: IN_EVALUATION
    terminal_states: [CONVERTED]
    note: "Machine governs ConversionProgram.status. The IN_REVIEW -> IN_EVALUATION redesign loop makes this machine cyclic."
    transitions:
      - from: IN_EVALUATION
        to: IN_REVIEW
        trigger: "system auto-transition — a line-item evaluation leaves zero line items with evaluation_status == PENDING"
        actor: system
        preconditions:
          - "program.status == IN_EVALUATION"
          - "count of line_items with evaluation_status == PENDING == 0 after the evaluation is applied"
        side_effects:
          - "program.status := IN_REVIEW; increments program.version by 1"
      - from: IN_REVIEW
        to: CONVERTED
        trigger: "POST /supply/conversion-programs/{id}/review-decision with decision=APPROVE"
        actor: ConversionManager
        preconditions:
          - "program.status == IN_REVIEW (else ERR_INVALID_STATE)"
          - "Every line item has evaluation_status == PASSED (else ERR_PROGRAM_ITEMS_FAILED)"
          - "Every line item has training_completed == true (else ERR_ITEMS_NOT_TRAINED)"
          - "Cross-entity gate: the facility's PrimeVendorAgreement exists, has status == ACTIVE, and current logical clock <= end_date (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "program.status := CONVERTED; reviewed_by := acting X-User-ID; review_decision_at := current logical clock; increments program.version by 1"
      - from: IN_REVIEW
        to: IN_EVALUATION
        trigger: "POST /supply/conversion-programs/{id}/review-decision with decision=REDESIGN"
        actor: ConversionManager
        preconditions:
          - "program.status == IN_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "program.status := IN_EVALUATION; reviewed_by := acting X-User-ID; review_decision_at := current logical clock; increments program.version by 1"
          - "Line items keep their evaluation_status; FAILED items may be re-evaluated while the program is back in IN_EVALUATION"

  - entity: TrayTemplate
    initial_state: DRAFT
    terminal_states: []
    note: "Machine governs TrayTemplate.status. ACTIVE -> PENDING_APPROVAL -> ACTIVE is the preference-shift change-management cycle; REJECT routes through UNDER_CHANGE."
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /supply/tray-templates/{id}/propose-change"
        actor: "FacilitySupplyDirector or SupplyChainAdmin"
        preconditions:
          - "template.status in {DRAFT, PENDING_APPROVAL, ACTIVE, UNDER_CHANGE} (else ERR_INVALID_STATE)"
          - "OCC: payload expected_template_version == template.version (else ERR_STALE_VERSION, 412)"
          - "Ownership: if acting role is FacilitySupplyDirector, X-User-ID == template.facility_id (else ERR_FACILITY_MISMATCH)"
          - "Component business rules on the proposed components array (see validations 6f, 8j, 9a)"
        side_effects:
          - "template.components := payload components; status := PENDING_APPROVAL; proposed_by := acting X-User-ID; increments template.version by 1"
      - from: PENDING_APPROVAL
        to: PENDING_APPROVAL
        trigger: "POST /supply/tray-templates/{id}/propose-change"
        actor: "FacilitySupplyDirector or SupplyChainAdmin"
        preconditions:
          - "template.status in {DRAFT, PENDING_APPROVAL, ACTIVE, UNDER_CHANGE} (else ERR_INVALID_STATE)"
          - "OCC: payload expected_template_version == template.version (else ERR_STALE_VERSION, 412)"
          - "Ownership: if acting role is FacilitySupplyDirector, X-User-ID == template.facility_id (else ERR_FACILITY_MISMATCH)"
          - "Component business rules on the proposed components array (see validations 6f, 8j, 9a)"
        side_effects:
          - "template.components := payload components; proposed_by := acting X-User-ID; increments template.version by 1"
        note: "Self-loop supersedes a pending proposal."
      - from: ACTIVE
        to: PENDING_APPROVAL
        trigger: "POST /supply/tray-templates/{id}/propose-change"
        actor: "FacilitySupplyDirector or SupplyChainAdmin"
        preconditions:
          - "template.status in {DRAFT, PENDING_APPROVAL, ACTIVE, UNDER_CHANGE} (else ERR_INVALID_STATE)"
          - "OCC: payload expected_template_version == template.version (else ERR_STALE_VERSION, 412)"
          - "Ownership: if acting role is FacilitySupplyDirector, X-User-ID == template.facility_id (else ERR_FACILITY_MISMATCH)"
          - "Component business rules on the proposed components array (see validations 6f, 8j, 9a)"
        side_effects:
          - "template.components := payload components; status := PENDING_APPROVAL; proposed_by := acting X-User-ID; increments template.version by 1"
      - from: UNDER_CHANGE
        to: PENDING_APPROVAL
        trigger: "POST /supply/tray-templates/{id}/propose-change"
        actor: "FacilitySupplyDirector or SupplyChainAdmin"
        preconditions:
          - "template.status in {DRAFT, PENDING_APPROVAL, ACTIVE, UNDER_CHANGE} (else ERR_INVALID_STATE)"
          - "OCC: payload expected_template_version == template.version (else ERR_STALE_VERSION, 412)"
          - "Ownership: if acting role is FacilitySupplyDirector, X-User-ID == template.facility_id (else ERR_FACILITY_MISMATCH)"
          - "Component business rules on the proposed components array (see validations 6f, 8j, 9a)"
        side_effects:
          - "template.components := payload components; status := PENDING_APPROVAL; proposed_by := acting X-User-ID; increments template.version by 1"
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /supply/tray-templates/{id}/approval-decision with decision=APPROVE"
        actor: SupplyChainAdmin
        preconditions:
          - "template.status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "Segregation of duties: template.proposed_by != acting X-User-ID (else ERR_SOD_SELF_APPROVAL)"
        side_effects:
          - "Increments template.version by 1, then status := ACTIVE and approved_version := version (post-increment); approved_by := acting X-User-ID"
        note: "Version-pinning on approval: approved_version records exactly which component set was approved."
      - from: PENDING_APPROVAL
        to: UNDER_CHANGE
        trigger: "POST /supply/tray-templates/{id}/approval-decision with decision=REJECT"
        actor: SupplyChainAdmin
        preconditions:
          - "template.status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "Segregation of duties: template.proposed_by != acting X-User-ID (else ERR_SOD_SELF_APPROVAL)"
        side_effects:
          - "template.status := UNDER_CHANGE; increments template.version by 1"

  - entity: PrimeVendorAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "Machine governs PrimeVendorAgreement.status. ACTIVE <-> SUSPENDED is an automatic fill-rate breach/recovery cycle; EXPIRED is a lazy system transition evaluated whenever the agreement is read or written while the logical clock is past end_date."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system auto-transition — a fulfillment-events RECEIVED recomputation leaves rolling_fill_rate_pct < committed_fill_rate_pct"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "rolling_fill_rate_pct < committed_fill_rate_pct after the recompute (strictly less-than; equality is compliant)"
        side_effects:
          - "agreement.status := SUSPENDED; increments agreement.version by 1"
          - "Cascade: every InventoryProgram with facility_id == agreement.facility_id gets auto_replenish_enabled := false; each cascaded program's version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system auto-transition — a fulfillment-events RECEIVED recomputation leaves rolling_fill_rate_pct >= committed_fill_rate_pct"
        actor: system
        preconditions:
          - "agreement.status == SUSPENDED"
          - "rolling_fill_rate_pct >= committed_fill_rate_pct after the recompute"
        side_effects:
          - "agreement.status := ACTIVE; increments agreement.version by 1"
          - "Cascade: every InventoryProgram with facility_id == agreement.facility_id gets auto_replenish_enabled := true; each cascaded program's version increments by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system lazy transition — any read or write of the agreement when current logical clock > end_date"
        actor: system
        preconditions:
          - "current logical clock > agreement.end_date"
        side_effects:
          - "agreement.status := EXPIRED; increments agreement.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system lazy transition — any read or write of the agreement when current logical clock > end_date"
        actor: system
        preconditions:
          - "current logical clock > agreement.end_date"
        side_effects:
          - "agreement.status := EXPIRED; increments agreement.version by 1"

  - entity: DistributionOrder
    initial_state: PLACED
    terminal_states: [RECEIVED]
    note: "Machine governs DistributionOrder.status."
    transitions:
      - from: PLACED
        to: PARTIALLY_SHIPPED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=SHIPPED leaving at least one line with shipped_qty < ordered_qty and backorder_cancelled == false"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {PLACED, PARTIALLY_SHIPPED} (else ERR_INVALID_STATE)"
          - "Every shipped_lines entry references a product_id present in order.lines (else ERR_NOT_FOUND)"
          - "Cumulative shipped_qty per line never exceeds ordered_qty (else ERR_OVER_SHIPMENT)"
        side_effects:
          - "Apply shipped quantities and backorder_cancelled flags; recompute provisional_fill_rate_pct (see order_fill_rate, provisional variant); increments order.version by 1"
      - from: PLACED
        to: SHIPPED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=SHIPPED leaving every line fully resolved (shipped_qty == ordered_qty or backorder_cancelled == true)"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {PLACED, PARTIALLY_SHIPPED} (else ERR_INVALID_STATE)"
          - "Every shipped_lines entry references a product_id present in order.lines (else ERR_NOT_FOUND)"
          - "Cumulative shipped_qty per line never exceeds ordered_qty (else ERR_OVER_SHIPMENT)"
        side_effects:
          - "Apply shipped quantities and backorder_cancelled flags; recompute provisional_fill_rate_pct; increments order.version by 1"
      - from: PARTIALLY_SHIPPED
        to: PARTIALLY_SHIPPED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=SHIPPED leaving at least one line unresolved"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {PLACED, PARTIALLY_SHIPPED} (else ERR_INVALID_STATE)"
          - "Every shipped_lines entry references a product_id present in order.lines (else ERR_NOT_FOUND)"
          - "Cumulative shipped_qty per line never exceeds ordered_qty (else ERR_OVER_SHIPMENT)"
        side_effects:
          - "Apply shipped quantities and backorder_cancelled flags; recompute provisional_fill_rate_pct; increments order.version by 1"
      - from: PARTIALLY_SHIPPED
        to: SHIPPED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=SHIPPED resolving the final open line(s)"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {PLACED, PARTIALLY_SHIPPED} (else ERR_INVALID_STATE)"
          - "Every shipped_lines entry references a product_id present in order.lines (else ERR_NOT_FOUND)"
          - "Cumulative shipped_qty per line never exceeds ordered_qty (else ERR_OVER_SHIPMENT)"
        side_effects:
          - "Apply shipped quantities and backorder_cancelled flags; recompute provisional_fill_rate_pct; increments order.version by 1"
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=RECEIVED"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {SHIPPED, PARTIALLY_SHIPPED} (else ERR_ORDER_NOT_RECEIVABLE when PLACED, ERR_INVALID_STATE when RECEIVED)"
        side_effects:
          - "order.status := RECEIVED; received_at := current logical clock; compute final_fill_rate_pct (final variant); increments order.version by 1"
          - "Lines neither fully shipped nor backorder_cancelled remain short: their unshipped units stay in the final fill-rate denominator (shortfall counts against the rate); RECEIVED is terminal so lines can no longer be amended"
          - "Cascade link 1: agreement.spent_cents += order.total_price_cents; recompute agreement.rolling_fill_rate_pct over RECEIVED orders in the trailing 90-day window; increments agreement.version by 1"
          - "Cascade link 2: if the recompute crosses the committed threshold, the agreement auto-transitions ACTIVE -> SUSPENDED (rolling < committed) or SUSPENDED -> ACTIVE (rolling >= committed)"
          - "Cascade link 3: an agreement transition into SUSPENDED sets auto_replenish_enabled := false on every InventoryProgram of the facility; a transition into ACTIVE restores true; each cascaded program's version increments by 1"
          - "Lazy expiry is evaluated first: if current logical clock > agreement.end_date the agreement transitions to EXPIRED and breach/recovery logic is skipped"
      - from: PARTIALLY_SHIPPED
        to: RECEIVED
        trigger: "POST /supply/distribution-orders/{id}/fulfillment-events with event=RECEIVED"
        actor: SupplyChainAdmin
        preconditions:
          - "order.status in {SHIPPED, PARTIALLY_SHIPPED} (else ERR_ORDER_NOT_RECEIVABLE when PLACED, ERR_INVALID_STATE when RECEIVED)"
        side_effects:
          - "Identical side-effect set as SHIPPED -> RECEIVED (final fill rate with open-line shortfall counted against, agreement recompute, breach/recovery cascade, lazy-expiry-first)"

  - entity: RebateClaim
    initial_state: ACCRUED
    terminal_states: [PAID]
    note: "Machine governs RebateClaim.status. SUBMITTED -> DISPUTED -> SUBMITTED is the dispute-resubmission cycle."
    transitions:
      - from: ACCRUED
        to: SUBMITTED
        trigger: "POST /supply/rebate-claims/{id}/lifecycle-events with event=SUBMIT"
        actor: GPOAnalyst
        preconditions:
          - "claim.status == ACCRUED (else ERR_INVALID_STATE)"
        side_effects:
          - "claim.status := SUBMITTED; compute final_amount_cents (rebate_amount, validated variant); increments claim.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /supply/rebate-claims/{id}/lifecycle-events with event=RESUBMIT"
        actor: GPOAnalyst
        preconditions:
          - "claim.status == DISPUTED (else ERR_INVALID_STATE)"
        side_effects:
          - "claim.status := SUBMITTED; recompute final_amount_cents (validated variant); dispute_reason := null; increments claim.version by 1"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /supply/rebate-claims/{id}/lifecycle-events with event=SETTLE_PAID"
        actor: GPOAnalyst
        preconditions:
          - "claim.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "claim.status := PAID; increments claim.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /supply/rebate-claims/{id}/lifecycle-events with event=SETTLE_DISPUTED (dispute_reason required)"
        actor: GPOAnalyst
        preconditions:
          - "claim.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "dispute_reason present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "claim.status := DISPUTED; dispute_reason := payload value; increments claim.version by 1"

  - entity: SupplyDisruption
    initial_state: DECLARED
    terminal_states: [RESOLVED]
    note: "Machine governs SupplyDisruption.status. Both forward transitions are automatic: first mitigation (allocation or substitution request) moves DECLARED -> MITIGATING; full coverage moves MITIGATING -> RESOLVED."
    transitions:
      - from: DECLARED
        to: MITIGATING
        trigger: "system auto-transition — first allocation posted OR first substitution request created"
        actor: system
        preconditions:
          - "disruption.status == DECLARED"
        side_effects:
          - "disruption.status := MITIGATING (the posting allocation/request side effects also apply; version increments once for the whole request)"
      - from: MITIGATING
        to: RESOLVED
        trigger: "system auto-transition — after an allocation post or a substitution DECIDE, covered_quantity >= disrupted_quantity"
        actor: system
        preconditions:
          - "disruption.status == MITIGATING"
          - "covered_quantity >= disrupted_quantity (inclusive; equality resolves)"
        side_effects:
          - "disruption.status := RESOLVED"
          - "Cascade: every substitution_requests entry still PENDING is set to REJECTED with rationale := 'AUTO_RESOLVED'"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: tray-propose-stale-version
    parent_entity: TrayTemplate
    write_endpoint: "POST /supply/tray-templates/{id}/propose-change"
    occ_field: expected_template_version
    description: |
      Proposing a tray change against a TrayTemplate whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just proposed or decided on the template (each
      legitimately superseding the client's view) and the current proposal is
      therefore based on a stale component set.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disruption-allocation-stale-version
    parent_entity: SupplyDisruption
    write_endpoint: "POST /supply/supply-disruptions/{id}/allocations"
    occ_field: expected_disruption_version
    description: |
      Posting an allocation against a SupplyDisruption whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just posted an allocation or a
      substitution decision has consumed pool quantity, and the current
      allocation is therefore based on a stale remaining_pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_fill_rate
    trigger: "provisional variant: on every fulfillment-events call with event=SHIPPED; final variant: on the fulfillment-events call with event=RECEIVED"
    algorithm: aggregation
    formula: |
      ordered_units   = sum over order.lines of ordered_qty
      shipped_units   = sum over order.lines of shipped_qty
      cancelled_units = sum over order.lines of (ordered_qty - shipped_qty) where backorder_cancelled == true
      provisional_fill_rate_pct = round_half_up(100 * shipped_units / ordered_units, 2)
      final_fill_rate_pct       = round_half_up(100 * shipped_units / (ordered_units - cancelled_units), 2)
      If (ordered_units - cancelled_units) == 0 then final_fill_rate_pct := 100.00 by convention.
    input_set: "The single DistributionOrder's own lines (all lines, regardless of status)"
    constants:
      SCALE_PERCENT: 100
      EMPTY_DENOMINATOR_FILL: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "event=SHIPPED (order PLACED or PARTIALLY_SHIPPED)"
        difference: "Denominator is total ordered units; cancelled-but-never-shipped units count AGAINST the rate (ship-to-date performance)."
      - name: final
        when: "event=RECEIVED"
        difference: "Denominator excludes backorder-cancelled units (fill against what the facility still wanted). For identical line data the two variants differ whenever any unit was cancelled after partial shipment; final >= provisional always."

  - name: rolling_agreement_fill_rate
    trigger: "on every fulfillment-events call with event=RECEIVED, after final_fill_rate_pct is stored on the order"
    algorithm: chronological
    formula: |
      window_start = current_logical_clock - WINDOW_DAYS (inclusive); window_end = current_logical_clock (inclusive)
      eligible = orders of this agreement with status == RECEIVED and received_at within [window_start, window_end]
      shipped_units   = sum over eligible orders of line shipped_qty totals
      wanted_units    = sum over eligible orders of (ordered_qty - cancelled units) line totals
      rolling_fill_rate_pct = round_half_up(100 * shipped_units / wanted_units, 2)
      If no eligible orders: rolling_fill_rate_pct := null (no breach/recovery decision is made)
    input_set: "Only orders with status == RECEIVED whose received_at falls inside the trailing 90-day window; PLACED, PARTIALLY_SHIPPED and SHIPPED orders never contribute"
    constants:
      WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up"
    variants:
      - name: aggregate_units
        when: "always (pinned)"
        difference: "Unit-weighted aggregate (total shipped / total wanted), NOT the mean of per-order rates; a large order dominates the rate."

  - name: rebate_amount
    trigger: "provisional variant: at RebateClaim creation; validated variant: on lifecycle-events SUBMIT and RESUBMIT"
    algorithm: tiered_pricing
    formula: |
      base_rate(eligible_purchase_cents):
        >= TIER4_THRESHOLD_CENTS -> TIER4_RATE
        >= TIER3_THRESHOLD_CENTS -> TIER3_RATE
        >= TIER2_THRESHOLD_CENTS -> TIER2_RATE
        >= TIER1_THRESHOLD_CENTS -> TIER1_RATE
        else -> BASE_RATE_FLOOR
      (tier thresholds are INCLUSIVE lower bounds: exactly 1000000 selects TIER3)
      provisional_amount_cents = round_half_up(eligible_purchase_cents * base_rate, 0)
      validated rate = base_rate + (PL_SHARE_BONUS_RATE if private_label_share >= PL_SHARE_BONUS_THRESHOLD else 0)
      validated multiplier = COMPLIANT_MULTIPLIER if compliant == true else NONCOMPLIANT_MULTIPLIER
      final_amount_cents = round_half_up(round_half_up(eligible_purchase_cents * validated_rate, 0) * validated_multiplier, 0)
    input_set: "The RebateClaim's own fields (eligible_purchase_cents, private_label_share, compliant); no other entities"
    constants:
      TIER1_THRESHOLD_CENTS: 100000
      TIER1_RATE: 0.01
      TIER2_THRESHOLD_CENTS: 500000
      TIER2_RATE: 0.02
      TIER3_THRESHOLD_CENTS: 1000000
      TIER3_RATE: 0.03
      TIER4_THRESHOLD_CENTS: 2000000
      TIER4_RATE: 0.04
      BASE_RATE_FLOOR: 0.005
      PL_SHARE_BONUS_THRESHOLD: 0.30
      PL_SHARE_BONUS_RATE: 0.005
      COMPLIANT_MULTIPLIER: 1.0
      NONCOMPLIANT_MULTIPLIER: 0.5
    precision: "integer cents, round_half_up; the rate multiplication is rounded to whole cents BEFORE the compliance multiplier is applied, then rounded again (pinned order)"
    variants:
      - name: provisional
        when: "claim creation (status ACCRUED)"
        difference: "Ignores private-label bonus and compliance multiplier entirely; provisional <= final whenever compliant and bonus applies, provisional >= final when non-compliant."
      - name: validated
        when: "SUBMIT / RESUBMIT"
        difference: "Applies tier + bonus + compliance multiplier in the pinned order above."

  - name: order_price
    trigger: "at DistributionOrder creation; result stored as total_price_cents"
    algorithm: aggregation
    formula: |
      For each line (per-line rounding is PINNED; never round at order level):
        if product.lum_eligible == true AND agreement.lum_commitment == true:
          billable_qty = ordered_qty
        else:
          billable_qty = ceil(ordered_qty / product.units_per_case) * product.units_per_case
        line_total_cents = billable_qty * product.each_price_cents
      total_price_cents = sum of line_total_cents (integer cents; no further rounding)
    input_set: "The order's lines joined to Product (lum_eligible, units_per_case, each_price_cents) and the governing PrimeVendorAgreement (lum_commitment)"
    constants:
      ROUNDING_SCOPE: per_line
    precision: "integer cents, exact; ceiling division applied PER LINE before summation"
    variants:
      - name: per_line_case_ceiling
        when: "always (pinned)"
        difference: "Rounding each line up to case multiples before summing yields a strictly larger total than summing raw each-extended prices whenever any non-LUM line is not case-aligned; the order-level alternative is forbidden."

  - name: reorder_suggestion
    trigger: "recomputed after every stock-events call and returned on every InventoryProgram read (positions[].reorder_status and positions[].suggested_order_qty)"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (steps must execute in this sequence):
      (1) open_pipeline_qty(product) = sum over the facility's agreement's orders with
          status in {PLACED, PARTIALLY_SHIPPED} of (ordered_qty - shipped_qty) for that product;
          if the facility has no non-EXPIRED agreement, open_pipeline_qty := 0.
      (2) raw_need = par_level - on_hand (post-adjustment on_hand).
      (3) suggested_order_qty = 0 when auto_replenish_enabled == false;
          else max(0, raw_need - open_pipeline_qty) rounded UP to the product's order_multiple
          (round UP only when the max(...) value is > 0; 0 stays 0).
      (4) reorder_status: CRITICAL when on_hand == 0;
          else DUE when on_hand <= reorder_point (INCLUSIVE: on_hand == reorder_point is DUE);
          else OK.
    input_set: "The position's own fields; DistributionOrders of the facility's PrimeVendorAgreement with status PLACED or PARTIALLY_SHIPPED only"
    constants:
      REORDER_STATUS_QUANTITY: on_hand
      CRITICAL_LEVEL: 0
    precision: "integer units, ceiling to order_multiple applied last"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins when a
#     request violates multiple rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role name", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles (for POST /supply/supply-disruptions/{id}/substitution-requests, role must also match action: REQUEST requires FacilitySupplyDirector, DECIDE requires Clinician)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path parameters resolve left-to-right (product, lot, batch, program, template, agreement, order, claim, disruption, inventory program); body-referenced ids (product_id in lines/components/positions/stock-events, agreement_id, line_id, request_id) must exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3.5, category: existence, check: "stock-events: the program has a position for payload product_id", error_id: ERR_POSITION_NOT_FOUND, http_status: 422, applies_to: "POST /supply/inventory-programs/{id}/stock-events" }
  - { priority: 4, category: auth, check: "Ownership: when acting role is FacilitySupplyDirector, X-User-ID must equal the facility that owns the target resource (tray template's facility_id; the agreement's facility_id for order creation; facility_id of a substitution REQUEST)", error_id: ERR_FACILITY_MISMATCH, http_status: 403, applies_to: "POST /supply/tray-templates, POST /supply/tray-templates/{id}/propose-change, POST /supply/distribution-orders, POST /supply/supply-disruptions/{id}/substitution-requests" }
  - { priority: 5, category: state, check: "State-machine preconditions of the target transition (from-state membership); includes ERR_INVALID_STATE for generic illegal transitions, ERR_AGREEMENT_NOT_ACTIVE when an order is created under a non-ACTIVE or expired agreement, ERR_ORDER_NOT_RECEIVABLE when RECEIVED is sent against a PLACED order, ERR_DISRUPTION_RESOLVED when posting allocations/requests/decisions against a RESOLVED disruption", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Lot creation: product.brand_type == PRIVATE_LABEL", error_id: ERR_NOT_PRIVATE_LABEL, http_status: 422, applies_to: "POST /supply/manufacturing-lots" }
  - { priority: 6.1, category: business_safety, check: "Lot creation and qa-disposition RELEASE: product.registration_status == REGISTERED", error_id: ERR_PRODUCT_NOT_REGISTERED, http_status: 422, applies_to: "POST /supply/manufacturing-lots, POST /supply/manufacturing-lots/{id}/qa-disposition" }
  - { priority: 6.2, category: business_safety, check: "qa-disposition RELEASE: lot.sterility_status in {PASSED, NOT_REQUIRED}", error_id: ERR_STERILITY_NOT_PASSED, http_status: 422, applies_to: "POST /supply/manufacturing-lots/{id}/qa-disposition" }
  - { priority: 6.3, category: business_safety, check: "Segregation of duties: lot.created_by != acting X-User-ID on any qa-disposition", error_id: ERR_SOD_LOT_DISPOSITION, http_status: 403, applies_to: "POST /supply/manufacturing-lots/{id}/qa-disposition" }
  - { priority: 6.4, category: business_safety, check: "Segregation of duties: template.proposed_by != acting X-User-ID on approval-decision", error_id: ERR_SOD_SELF_APPROVAL, http_status: 403, applies_to: "POST /supply/tray-templates/{id}/approval-decision" }
  - { priority: 6.5, category: business_safety, check: "Tray create/propose: when sterile_assembly == true, every component product must have sterile == true", error_id: ERR_STERILE_COMPONENT_REQUIRED, http_status: 422, applies_to: "POST /supply/tray-templates, POST /supply/tray-templates/{id}/propose-change" }
  - { priority: 7, category: business_temporal, check: "Sterilization batch window: scheduled_start >= current logical clock and scheduled_end > scheduled_start", error_id: ERR_STERILIZATION_IN_PAST, http_status: 422, applies_to: "POST /supply/sterilization-batches" }
  - { priority: 7.1, category: business_temporal, check: "Order requested_delivery_date strictly after current logical-clock date and within [agreement.start_date, agreement.end_date]", error_id: ERR_ORDER_DATE_OUT_OF_WINDOW, http_status: 422, applies_to: "POST /supply/distribution-orders" }
  - { priority: 7.2, category: business_temporal, check: "Rebate period_end strictly after period_start", error_id: ERR_CLAIM_PERIOD_INVALID, http_status: 422, applies_to: "POST /supply/rebate-claims" }
  - { priority: 7.3, category: business_temporal, check: "Lot expiry_date strictly after manufacture_date", error_id: ERR_LOT_DATES_INVALID, http_status: 422, applies_to: "POST /supply/manufacturing-lots" }
  - { priority: 8, category: business_constraint, check: "Uniqueness: Product.sku globally unique; ManufacturingLot.lot_code globally unique; SterilizationBatch.batch_code globally unique", error_id: ERR_DUPLICATE_SKU, http_status: 409, applies_to: "POST /supply/products (sku), POST /supply/manufacturing-lots (lot_code -> ERR_DUPLICATE_LOT_CODE), POST /supply/sterilization-batches (batch_code -> ERR_DUPLICATE_BATCH_CODE)" }
  - { priority: 8.1, category: business_constraint, check: "Sterilization batch: every lot in lot_ids exists, has status == AWAITING_QA, product.sterile == true, and sterilization_batch_id is null", error_id: ERR_LOT_ALREADY_BATCHED, http_status: 409, applies_to: "POST /supply/sterilization-batches (ERR_INVALID_STATE for wrong lot status, ERR_STERILE_COMPONENT_REQUIRED is not applied here — a non-sterile lot in a batch yields ERR_INVALID_REQUEST)" }
  - { priority: 8.2, category: business_constraint, check: "Sterilization chamber half-open overlap: reject when another batch on the same chamber_id satisfies existing.scheduled_start < new.scheduled_end AND new.scheduled_start < existing.scheduled_end; touching windows (end == start) are allowed", error_id: ERR_CHAMBER_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /supply/sterilization-batches" }
  - { priority: 8.3, category: business_constraint, check: "At most one non-EXPIRED PrimeVendorAgreement per facility", error_id: ERR_ACTIVE_AGREEMENT_EXISTS, http_status: 409, applies_to: "POST /supply/prime-vendor-agreements" }
  - { priority: 8.4, category: business_constraint, check: "Rebate claim periods for the same facility_id + gpo_name use CLOSED intervals: reject when existing.period_start <= new.period_end AND new.period_start <= existing.period_end (sharing a boundary date IS an overlap); applies across claims in any status", error_id: ERR_REBATE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /supply/rebate-claims" }
  - { priority: 8.5, category: business_constraint, check: "Inventory program positions: reorder_point <= par_level for every position", error_id: ERR_PAR_LEVEL_VIOLATION, http_status: 422, applies_to: "POST /supply/inventory-programs" }
  - { priority: 8.6, category: business_constraint, check: "No duplicate product_id within positions array, tray components array, or order lines array", error_id: ERR_DUPLICATE_POSITION, http_status: 409, applies_to: "POST /supply/inventory-programs (ERR_DUPLICATE_POSITION), POST /supply/tray-templates and propose-change (ERR_DUPLICATE_COMPONENT), POST /supply/distribution-orders (ERR_DUPLICATE_ORDER_LINE)" }
  - { priority: 8.7, category: business_constraint, check: "Conversion line item: incumbent_product_id != replacement_product_id; replacement product availability == ACTIVE", error_id: ERR_SAME_PRODUCT_CONVERSION, http_status: 422, applies_to: "POST /supply/conversion-programs" }
  - { priority: 8.8, category: business_constraint, check: "Substitution REQUEST: no other PENDING substitution request exists for the same disruption + facility", error_id: ERR_DUPLICATE_SUBSTITUTION, http_status: 409, applies_to: "POST /supply/supply-disruptions/{id}/substitution-requests" }
  - { priority: 8.9, category: business_constraint, check: "Conversion review-decision APPROVE: every line item evaluation_status == PASSED", error_id: ERR_PROGRAM_ITEMS_FAILED, http_status: 409, applies_to: "POST /supply/conversion-programs/{id}/review-decision" }
  - { priority: 8.91, category: business_constraint, check: "Conversion review-decision APPROVE: every line item training_completed == true (evaluated after 8.9)", error_id: ERR_ITEMS_NOT_TRAINED, http_status: 409, applies_to: "POST /supply/conversion-programs/{id}/review-decision" }
  - { priority: 8.92, category: business_constraint, check: "fulfillment-events SHIPPED: cumulative shipped_qty per line <= ordered_qty", error_id: ERR_OVER_SHIPMENT, http_status: 422, applies_to: "POST /supply/distribution-orders/{id}/fulfillment-events" }
  - { priority: 8.93, category: business_constraint, check: "fulfillment-events RECEIVED from PARTIALLY_SHIPPED is allowed with open (uncancelled, short-shipped) lines; the shortfall counts AGAINST the final fill rate (denominator keeps those units)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /supply/distribution-orders/{id}/fulfillment-events (no dedicated error; informational rule — RECEIVED is terminal so lines can no longer be amended)" }
  - { priority: 8.94, category: business_constraint, check: "Order create: ordered_qty must be a multiple of product.order_multiple unless (product.lum_eligible AND agreement.lum_commitment)", error_id: ERR_ORDER_MULTIPLE_VIOLATION, http_status: 422, applies_to: "POST /supply/distribution-orders" }
  - { priority: 9, category: business_referential, check: "Order create and tray create/propose: every referenced product has availability == ACTIVE", error_id: ERR_PRODUCT_NOT_ORDERABLE, http_status: 422, applies_to: "POST /supply/distribution-orders, POST /supply/tray-templates, POST /supply/tray-templates/{id}/propose-change" }
  - { priority: 9.1, category: business_referential, check: "Substitution REQUEST: proposed product exists, registration_status == REGISTERED, availability == ACTIVE, same category as the disrupted product, and != disrupted product", error_id: ERR_PRODUCT_NOT_SUBSTITUTABLE, http_status: 422, applies_to: "POST /supply/supply-disruptions/{id}/substitution-requests" }
  - { priority: 9.2, category: business_referential, check: "Conversion review-decision APPROVE: facility's PrimeVendorAgreement exists, status == ACTIVE, and current logical clock <= end_date", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /supply/conversion-programs/{id}/review-decision" }
  - { priority: 10, category: business_fiscal, check: "Order create: agreement.spent_cents + computed total_price_cents <= agreement.annual_commitment_cents", error_id: ERR_COMMITMENT_EXCEEDED, http_status: 422, applies_to: "POST /supply/distribution-orders" }
  - { priority: 10.1, category: business_fiscal, check: "Allocation post: 0 < quantity <= disruption.remaining_pool; substitution DECIDE APPROVE: request.covered_quantity <= disruption.remaining_pool", error_id: ERR_INSUFFICIENT_ALLOCATION_POOL, http_status: 422, applies_to: "POST /supply/supply-disruptions/{id}/allocations, POST /supply/supply-disruptions/{id}/substitution-requests" }
  - { priority: 10.2, category: business_fiscal, check: "stock-events: post-adjustment on_hand >= 0", error_id: ERR_STOCK_INSUFFICIENT, http_status: 422, applies_to: "POST /supply/inventory-programs/{id}/stock-events" }

# =============================================================================
# 1.5 API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock (test-driving endpoint, outside the business prefix). Before any call the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All temporal rules (sterilization past-window, delivery windows, rebate periods, agreement expiry, rolling fill-rate windows) read this clock."
    roles: [SupplyChainAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Subsequent reads/writes of PrimeVendorAgreement evaluate lazy EXPIRED transition against the new clock"]

  - method: POST
    path: "/supply/facilities"
    description: "Create a facility (hospital / site of care)"
    roles: [SupplyChainAdmin]
    code: 201
    input: [name, health_system_name, facility_type, ship_to_address]
    output: Facility
    side_effects: []

  - method: POST
    path: "/supply/products"
    description: "Create a catalog product (branded or private label)"
    roles: [SupplyChainAdmin]
    code: 201
    input: [sku, name, brand_type, category, sterile, device_class, "availability?", units_per_case, each_price_cents, "order_multiple?", "lum_eligible?"]
    output: Product
    side_effects: ["registration_status initialized to UNREGISTERED"]

  - method: POST
    path: "/supply/products/{id}/registration-events"
    description: "Drive the regulatory registration lifecycle (SUBMIT from UNREGISTERED/REJECTED, APPROVE or REJECT from SUBMITTED)"
    roles: [RegulatorySpecialist]
    code: 200
    input: [event]
    output: Product
    side_effects: ["Product.registration_status transition per state machine", "increments Product.version by 1"]

  - method: POST
    path: "/supply/manufacturing-lots"
    description: "Create a manufacturing lot for a REGISTERED PRIVATE_LABEL product (lot starts AWAITING_QA)"
    roles: [ManufacturingPlanner]
    code: 201
    input: [lot_code, product_id, quantity, manufacture_date, expiry_date]
    output: ManufacturingLot
    side_effects: ["created_by := acting X-User-ID", "sterility_status computed (NOT_REQUIRED when product.sterile is false, else PENDING)"]

  - method: GET
    path: "/supply/manufacturing-lots"
    description: "List manufacturing lots with optional filters"
    roles: [SupplyChainAdmin, ManufacturingPlanner, QualityManager]
    code: 200
    input: ["product_id?", "status?", "sterilization_batch_id?", "limit?", "offset?"]
    output: ManufacturingLot[]
    side_effects: []

  - method: GET
    path: "/supply/manufacturing-lots/{id}"
    description: "Read a single manufacturing lot"
    roles: [SupplyChainAdmin, ManufacturingPlanner, QualityManager]
    code: 200
    input: []
    output: ManufacturingLot
    side_effects: []

  - method: POST
    path: "/supply/manufacturing-lots/{id}/qa-disposition"
    description: "Quality disposition of a lot (RELEASE or REJECT); segregation of duties forbids the lot creator from dispositioning it"
    roles: [QualityManager]
    code: 200
    input: [disposition]
    output: ManufacturingLot
    side_effects: ["ManufacturingLot.status transition per state machine", "increments lot.version by 1"]

  - method: POST
    path: "/supply/sterilization-batches"
    description: "Schedule a sterilization batch on a chamber for a set of AWAITING_QA sterile lots; half-open chamber-window overlap check"
    roles: [ManufacturingPlanner]
    code: 201
    input: [batch_code, chamber_id, scheduled_start, scheduled_end, lot_ids]
    output: SterilizationBatch
    side_effects: ["Each listed lot: sterilization_batch_id := batch id, version +1"]

  - method: POST
    path: "/supply/sterilization-batches/{id}/record-sterility-result"
    description: "Record the sterility test outcome; FAILED quarantines all non-terminal lots in the batch"
    roles: [QualityManager]
    code: 200
    input: [result]
    output: SterilizationBatch
    side_effects: ["SterilizationBatch.status := COMPLETED", "On FAILED: cascade lots AWAITING_QA -> QUARANTINED", "On PASSED: lots' sterility_status := PASSED"]

  - method: POST
    path: "/supply/conversion-programs"
    description: "Create a conversion program with its initial line items (starts IN_EVALUATION)"
    roles: [ConversionManager]
    code: 201
    input: [facility_id, name, target_categories, line_items]
    output: ConversionProgram
    side_effects: ["Each line item mints line_id, evaluation_status := PENDING, training_completed := false"]

  - method: GET
    path: "/supply/conversion-programs"
    description: "List conversion programs with optional filters"
    roles: [SupplyChainAdmin, ConversionManager, Clinician]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: ConversionProgram[]
    side_effects: []

  - method: GET
    path: "/supply/conversion-programs/{id}"
    description: "Read a single conversion program (includes embedded line items)"
    roles: [SupplyChainAdmin, ConversionManager, Clinician]
    code: 200
    input: []
    output: ConversionProgram
    side_effects: []

  - method: POST
    path: "/supply/conversion-programs/{id}/review-decision"
    description: "Review gate: APPROVE converts the program (requires all items PASSED + trained + facility agreement ACTIVE); REDESIGN loops back to IN_EVALUATION"
    roles: [ConversionManager]
    code: 200
    input: [decision]
    output: ConversionProgram
    side_effects: ["ConversionProgram.status transition per state machine", "increments program.version by 1"]

  - method: POST
    path: "/supply/conversion-programs/{id}/line-item-evaluations"
    description: "Clinician records evaluation outcome and training completion for one line item; auto-advances program to IN_REVIEW when no PENDING items remain"
    roles: [Clinician]
    code: 200
    input: [line_id, outcome, training_completed, "notes?"]
    output: ConversionProgram
    side_effects: ["Line item evaluation_status := outcome (only PENDING or FAILED items may be evaluated; PASSED items are immutable -> ERR_INVALID_STATE)", "training_completed := payload value", "evaluated_by := acting X-User-ID", "Bubble-up: if zero PENDING items remain, program IN_EVALUATION -> IN_REVIEW", "increments program.version by 1"]

  - method: POST
    path: "/supply/tray-templates"
    description: "Create a custom procedure tray template with its component list (starts DRAFT)"
    roles: [FacilitySupplyDirector, SupplyChainAdmin]
    code: 201
    input: [facility_id, name, procedure_type, sterile_assembly, components]
    output: TrayTemplate
    side_effects: []

  - method: GET
    path: "/supply/tray-templates"
    description: "List tray templates with optional filters"
    roles: [SupplyChainAdmin, FacilitySupplyDirector]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: TrayTemplate[]
    side_effects: []

  - method: GET
    path: "/supply/tray-templates/{id}"
    description: "Read a single tray template"
    roles: [SupplyChainAdmin, FacilitySupplyDirector]
    code: 200
    input: []
    output: TrayTemplate
    side_effects: []

  - method: POST
    path: "/supply/tray-templates/{id}/propose-change"
    description: "Propose a new component set (change management); OCC-guarded by expected_template_version; valid from any non-terminal status and always lands on PENDING_APPROVAL"
    roles: [FacilitySupplyDirector, SupplyChainAdmin]
    code: 200
    input: [components, expected_template_version]
    output: TrayTemplate
    side_effects: ["TrayTemplate.components := payload components", "status := PENDING_APPROVAL", "proposed_by := acting X-User-ID", "increments template.version by 1"]

  - method: POST
    path: "/supply/tray-templates/{id}/approval-decision"
    description: "Approve (pins approved_version, status ACTIVE) or reject (status UNDER_CHANGE) a pending proposal; proposer may not approve own proposal"
    roles: [SupplyChainAdmin]
    code: 200
    input: [decision]
    output: TrayTemplate
    side_effects: ["TrayTemplate.status transition per state machine", "On APPROVE: approved_version := post-increment version", "increments template.version by 1"]

  - method: POST
    path: "/supply/prime-vendor-agreements"
    description: "Create a prime vendor distribution agreement (starts ACTIVE) with fill-rate, delivery-frequency, LUM and annual commitment terms"
    roles: [SupplyChainAdmin]
    code: 201
    input: [facility_id, committed_fill_rate_pct, deliveries_per_week, lum_commitment, annual_commitment_cents, start_date, end_date]
    output: PrimeVendorAgreement
    side_effects: ["spent_cents := 0", "rolling_fill_rate_pct := null", "status := ACTIVE"]

  - method: GET
    path: "/supply/prime-vendor-agreements"
    description: "List prime vendor agreements with optional filters"
    roles: [SupplyChainAdmin, FacilitySupplyDirector, GPOAnalyst]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: PrimeVendorAgreement[]
    side_effects: []

  - method: GET
    path: "/supply/prime-vendor-agreements/{id}"
    description: "Read a single prime vendor agreement (lazy EXPIRED transition applied before responding)"
    roles: [SupplyChainAdmin, FacilitySupplyDirector, GPOAnalyst]
    code: 200
    input: []
    output: PrimeVendorAgreement
    side_effects: ["Lazy expiry: if current logical clock > end_date, status := EXPIRED"]

  - method: POST
    path: "/supply/distribution-orders"
    description: "Place a distribution order under an ACTIVE agreement; computes total_price_cents via per-line case rounding; enforces commitment cap"
    roles: [FacilitySupplyDirector]
    code: 201
    input: [agreement_id, requested_delivery_date, lines]
    output: DistributionOrder
    side_effects: ["total_price_cents computed via order_price", "Lazy expiry of the agreement is evaluated first"]

  - method: GET
    path: "/supply/prime-vendor-agreements/{id}/distribution-orders"
    description: "List distribution orders riding under an agreement (sub-resource reverse lookup)"
    roles: [SupplyChainAdmin, FacilitySupplyDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DistributionOrder[]
    side_effects: []

  - method: POST
    path: "/supply/distribution-orders/{id}/fulfillment-events"
    description: "Record a SHIPPED event (per-line shipped_qty and backorder_cancelled updates; recomputes provisional fill rate) or a RECEIVED event (computes final fill rate, debits agreement spend, recomputes rolling fill rate, may suspend/recover the agreement and mute/unmute facility inventory programs)"
    roles: [SupplyChainAdmin]
    code: 200
    input: [event, shipped_lines]
    output: DistributionOrder
    side_effects: ["DistributionOrder.status transition per state machine", "On RECEIVED: agreement.spent_cents += total_price_cents; rolling_fill_rate_pct recompute; breach/recovery auto-transitions; inventory-program auto_replenish_enabled cascade", "increments order.version by 1"]

  - method: POST
    path: "/supply/rebate-claims"
    description: "Accrue a GPO rebate claim for a facility period (computes provisional_amount_cents); closed-interval period overlap enforced per facility + GPO"
    roles: [GPOAnalyst]
    code: 201
    input: [facility_id, gpo_name, period_start, period_end, eligible_purchase_cents, private_label_share, compliant]
    output: RebateClaim
    side_effects: ["provisional_amount_cents computed via rebate_amount (provisional variant)", "status := ACCRUED"]

  - method: GET
    path: "/supply/rebate-claims"
    description: "List rebate claims with optional filters"
    roles: [SupplyChainAdmin, GPOAnalyst]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: RebateClaim[]
    side_effects: []

  - method: GET
    path: "/supply/rebate-claims/{id}"
    description: "Read a single rebate claim"
    roles: [SupplyChainAdmin, GPOAnalyst]
    code: 200
    input: []
    output: RebateClaim
    side_effects: []

  - method: POST
    path: "/supply/rebate-claims/{id}/lifecycle-events"
    description: "Drive the rebate lifecycle: SUBMIT (ACCRUED -> SUBMITTED, computes final_amount_cents), SETTLE_PAID (SUBMITTED -> PAID), SETTLE_DISPUTED (SUBMITTED -> DISPUTED, dispute_reason required), RESUBMIT (DISPUTED -> SUBMITTED, recomputes final_amount_cents)"
    roles: [GPOAnalyst]
    code: 200
    input: [event, "dispute_reason?"]
    output: RebateClaim
    side_effects: ["RebateClaim.status transition per state machine", "final_amount_cents (re)computed on SUBMIT/RESUBMIT", "increments claim.version by 1"]

  - method: POST
    path: "/supply/supply-disruptions"
    description: "Declare a supply disruption for a product (starts DECLARED with remaining_pool == disrupted_quantity)"
    roles: [SupplyChainAdmin]
    code: 201
    input: [product_id, disrupted_quantity, reason, severity, expected_resolution_date]
    output: SupplyDisruption
    side_effects: ["allocated_total := 0", "approved_sub_total := 0", "remaining_pool := disrupted_quantity", "covered_quantity := 0"]

  - method: GET
    path: "/supply/supply-disruptions"
    description: "List supply disruptions with optional filters"
    roles: [SupplyChainAdmin, FacilitySupplyDirector, Clinician]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: SupplyDisruption[]
    side_effects: []

  - method: GET
    path: "/supply/supply-disruptions/{id}"
    description: "Read a single supply disruption (includes embedded allocations and substitution requests)"
    roles: [SupplyChainAdmin, FacilitySupplyDirector, Clinician]
    code: 200
    input: []
    output: SupplyDisruption
    side_effects: []

  - method: POST
    path: "/supply/supply-disruptions/{id}/allocations"
    description: "Post a scarce-stock allocation to a facility; OCC-guarded by expected_disruption_version; decrements remaining_pool; first mitigation flips DECLARED -> MITIGATING; full coverage flips MITIGATING -> RESOLVED"
    roles: [SupplyChainAdmin]
    code: 200
    input: [facility_id, quantity, expected_disruption_version]
    output: SupplyDisruption
    side_effects: ["Append allocation record", "allocated_total += quantity", "remaining_pool -= quantity", "Auto-transitions per state machine", "increments disruption.version by 1"]

  - method: POST
    path: "/supply/supply-disruptions/{id}/substitution-requests"
    description: "action=REQUEST (FacilitySupplyDirector, facility_id must equal X-User-ID): propose a substitute product with covered_quantity. action=DECIDE (Clinician): APPROVE or REJECT a PENDING request by request_id; APPROVE consumes remaining_pool and may auto-resolve the disruption (which auto-rejects other PENDING requests)."
    roles: [FacilitySupplyDirector, Clinician]
    code: 200
    input: [action, "facility_id?", "proposed_product_id?", "covered_quantity?", "request_id?", "decision?", "rationale?"]
    output: SupplyDisruption
    side_effects: ["REQUEST: append PENDING substitution request; first mitigation flips DECLARED -> MITIGATING", "DECIDE APPROVE: request.status := APPROVED, decided_by := acting X-User-ID, approved_sub_total += covered_quantity, remaining_pool -= covered_quantity, auto-resolve check", "DECIDE REJECT: request.status := REJECTED with rationale", "Auto-resolve cascade: PENDING requests -> REJECTED (AUTO_RESOLVED)", "increments disruption.version by 1"]

  - method: POST
    path: "/supply/inventory-programs"
    description: "Create an on-site inventory management program for a facility with initial stock positions"
    roles: [SupplyChainAdmin]
    code: 201
    input: [facility_id, program_type, positions]
    output: InventoryProgram
    side_effects: ["Each position's reorder_status and suggested_order_qty computed via reorder_suggestion"]

  - method: GET
    path: "/supply/inventory-programs"
    description: "List inventory programs with optional filters"
    roles: [SupplyChainAdmin, FacilitySupplyDirector]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: InventoryProgram[]
    side_effects: []

  - method: GET
    path: "/supply/inventory-programs/{id}"
    description: "Read a single inventory program (positions carry computed reorder_status and suggested_order_qty)"
    roles: [SupplyChainAdmin, FacilitySupplyDirector]
    code: 200
    input: []
    output: InventoryProgram
    side_effects: ["positions' reorder_status and suggested_order_qty recomputed on read"]

  - method: POST
    path: "/supply/inventory-programs/{id}/stock-events"
    description: "Record a stock event (RECEIPT, ISSUE, CYCLE_COUNT_ADJUST) with signed quantity_delta against one position; on_hand may never go negative; recomputes the position's reorder_status and suggested_order_qty"
    roles: [SupplyChainAdmin]
    code: 200
    input: [product_id, quantity_delta, event_type]
    output: InventoryProgram
    side_effects: ["position.on_hand += quantity_delta (must stay >= 0)", "reorder_suggestion recomputed for the position", "increments program.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header, or undeclared role name" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint (or role/action mismatch on substitution-requests)" }
  - { id: ERR_FACILITY_MISMATCH, http: 403, condition: "FacilitySupplyDirector's X-User-ID does not equal the owning facility id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, unknown enum member, or action-specific required field absent (e.g. decision without request_id)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: transition not valid from the current state, terminal-state write, evaluation of a PASSED line item, or lot-status mismatch at batch creation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE, non-expired PrimeVendorAgreement (order creation; conversion approve gate)" }
  - { id: ERR_ORDER_NOT_RECEIVABLE, http: 409, condition: "RECEIVED fulfillment event against a PLACED order (nothing shipped yet)" }
  - { id: ERR_DISRUPTION_RESOLVED, http: 409, condition: "Allocation, substitution request, or substitution decision attempted against a RESOLVED disruption" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 409, condition: "Facility already has a non-EXPIRED prime vendor agreement" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product sku already exists" }
  - { id: ERR_DUPLICATE_LOT_CODE, http: 409, condition: "ManufacturingLot lot_code already exists" }
  - { id: ERR_DUPLICATE_BATCH_CODE, http: 409, condition: "SterilizationBatch batch_code already exists" }
  - { id: ERR_LOT_ALREADY_BATCHED, http: 409, condition: "A lot in lot_ids already belongs to a sterilization batch" }
  - { id: ERR_DUPLICATE_SUBSTITUTION, http: 409, condition: "A PENDING substitution request already exists for this disruption + facility" }
  - { id: ERR_DUPLICATE_COMPONENT, http: 409, condition: "Duplicate product_id within a tray components array" }
  - { id: ERR_DUPLICATE_POSITION, http: 409, condition: "Duplicate product_id within an inventory program positions array" }
  - { id: ERR_DUPLICATE_ORDER_LINE, http: 409, condition: "Duplicate product_id within an order lines array" }
  - { id: ERR_CHAMBER_WINDOW_OVERLAP, http: 409, condition: "Sterilization chamber half-open window collides with an existing batch on the same chamber" }
  - { id: ERR_REBATE_PERIOD_OVERLAP, http: 409, condition: "Rebate claim closed period collides with an existing claim for the same facility + GPO (shared boundary date counts as overlap)" }
  - { id: ERR_NOT_PRIVATE_LABEL, http: 422, condition: "Manufacturing lot attempted for a BRANDED product" }
  - { id: ERR_PRODUCT_NOT_REGISTERED, http: 422, condition: "Lot creation or RELEASE disposition requires product registration_status == REGISTERED" }
  - { id: ERR_STERILITY_NOT_PASSED, http: 422, condition: "RELEASE disposition requires sterility_status PASSED or NOT_REQUIRED" }
  - { id: ERR_SOD_LOT_DISPOSITION, http: 403, condition: "Segregation of duties: lot creator may not record its QA disposition" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "Segregation of duties: tray proposer may not record the approval decision" }
  - { id: ERR_STERILE_COMPONENT_REQUIRED, http: 422, condition: "Sterile-assembly tray includes a non-sterile component product" }
  - { id: ERR_PRODUCT_NOT_ORDERABLE, http: 422, condition: "Referenced product availability is DISCONTINUED" }
  - { id: ERR_PRODUCT_NOT_SUBSTITUTABLE, http: 422, condition: "Proposed substitute fails category match, registration, availability, or identity rules" }
  - { id: ERR_SAME_PRODUCT_CONVERSION, http: 422, condition: "Conversion line item has incumbent_product_id == replacement_product_id, or replacement product is not ACTIVE" }
  - { id: ERR_PROGRAM_ITEMS_FAILED, http: 409, condition: "Conversion APPROVE attempted while a line item evaluation_status != PASSED" }
  - { id: ERR_ITEMS_NOT_TRAINED, http: 409, condition: "Conversion APPROVE attempted while a line item training_completed == false" }
  - { id: ERR_ORDER_DATE_OUT_OF_WINDOW, http: 422, condition: "requested_delivery_date not strictly after current logical-clock date, or outside the agreement window" }
  - { id: ERR_ORDER_MULTIPLE_VIOLATION, http: 422, condition: "ordered_qty not a multiple of product.order_multiple and LUM does not apply" }
  - { id: ERR_CLAIM_PERIOD_INVALID, http: 422, condition: "Rebate period_end not strictly after period_start" }
  - { id: ERR_STERILIZATION_IN_PAST, http: 422, condition: "Sterilization window starts before the current logical clock, or end <= start" }
  - { id: ERR_LOT_DATES_INVALID, http: 422, condition: "Lot expiry_date not strictly after manufacture_date" }
  - { id: ERR_COMMITMENT_EXCEEDED, http: 422, condition: "Order total would push agreement.spent_cents above annual_commitment_cents" }
  - { id: ERR_INSUFFICIENT_ALLOCATION_POOL, http: 422, condition: "Allocation quantity or approved substitution coverage exceeds disruption.remaining_pool" }
  - { id: ERR_STOCK_INSUFFICIENT, http: 422, condition: "Stock event would drive a position's on_hand below 0" }
  - { id: ERR_POSITION_NOT_FOUND, http: 422, condition: "No position for the given product_id in the inventory program" }
  - { id: ERR_OVER_SHIPMENT, http: 422, condition: "Cumulative shipped_qty for a line would exceed ordered_qty" }
  - { id: ERR_PAR_LEVEL_VIOLATION, http: 422, condition: "Position reorder_point > par_level" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SupplyChainAdmin
    description: "Vendor-side supply chain operator: master data, agreements, fulfillment, disruptions, inventory programs, tray approval, logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /supply/facilities", "POST /supply/products", "POST /supply/prime-vendor-agreements", "POST /supply/distribution-orders/{id}/fulfillment-events", "POST /supply/supply-disruptions", "POST /supply/supply-disruptions/{id}/allocations", "POST /supply/inventory-programs", "POST /supply/inventory-programs/{id}/stock-events", "POST /supply/tray-templates/{id}/approval-decision"]
    shared_operations: ["POST /supply/tray-templates", "POST /supply/tray-templates/{id}/propose-change", "all GET endpoints"]
  - name: RegulatorySpecialist
    description: "Regulatory affairs operator driving device registration submissions and decisions"
    identity: opaque
    exclusive_operations: ["POST /supply/products/{id}/registration-events"]
    shared_operations: ["GET list/single endpoints for products via action responses"]
  - name: ManufacturingPlanner
    description: "Manufacturing planner who creates production lots and schedules sterilization batches; may never disposition own lots"
    identity: opaque
    exclusive_operations: ["POST /supply/manufacturing-lots", "POST /supply/sterilization-batches"]
    shared_operations: ["GET /supply/manufacturing-lots", "GET /supply/manufacturing-lots/{id}"]
  - name: QualityManager
    description: "Quality-system operator who dispositions lots and records sterility results; segregation of duties against the lot creator"
    identity: opaque
    exclusive_operations: ["POST /supply/manufacturing-lots/{id}/qa-disposition", "POST /supply/sterilization-batches/{id}/record-sterility-result"]
    shared_operations: ["GET /supply/manufacturing-lots", "GET /supply/manufacturing-lots/{id}"]
  - name: ConversionManager
    description: "Conversion program owner: creates programs and records review decisions (APPROVE / REDESIGN)"
    identity: opaque
    exclusive_operations: ["POST /supply/conversion-programs", "POST /supply/conversion-programs/{id}/review-decision"]
    shared_operations: ["GET /supply/conversion-programs", "GET /supply/conversion-programs/{id}"]
  - name: Clinician
    description: "Facility clinician who evaluates conversion line items, records training completion, and approves or rejects product substitutions during disruptions"
    identity: opaque
    exclusive_operations: ["POST /supply/conversion-programs/{id}/line-item-evaluations"]
    shared_operations: ["POST /supply/supply-disruptions/{id}/substitution-requests (action=DECIDE only)", "GET /supply/conversion-programs", "GET /supply/supply-disruptions"]
  - name: FacilitySupplyDirector
    description: "Facility-side supply director; X-User-ID equals the Facility id; proposes tray changes, places distribution orders, and requests substitutions for own facility"
    identity: "entity_backed:Facility"
    exclusive_operations: ["POST /supply/distribution-orders"]
    shared_operations: ["POST /supply/tray-templates", "POST /supply/tray-templates/{id}/propose-change", "POST /supply/supply-disruptions/{id}/substitution-requests (action=REQUEST only)", "GET endpoints for own facility's resources"]
  - name: GPOAnalyst
    description: "Group purchasing organization analyst administering rebate accruals, submissions, disputes and settlement"
    identity: opaque
    exclusive_operations: ["POST /supply/rebate-claims", "POST /supply/rebate-claims/{id}/lifecycle-events"]
    shared_operations: ["GET /supply/rebate-claims", "GET /supply/rebate-claims/{id}", "GET /supply/prime-vendor-agreements"]
