            - "${err} == ERR_PROJECT_STAGE_INVALID with HTTP 409"
            - "RelicensingProject.${proj}.pad_filed_at == 2026-08-01T00:00:00Z (not moved to the new clock), pad_year == 2026 and version == ${v1}"

