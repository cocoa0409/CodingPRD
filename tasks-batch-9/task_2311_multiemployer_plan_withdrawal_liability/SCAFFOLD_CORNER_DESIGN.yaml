            - call: "POST /payment-schedules"
              payload: { liability_assessment_id: "${la_id}", expected_assessment_version: "${la_v2}", source: "REVIEW_DECISION" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { gen2_id: "$.data.id", gen2_seq: "$.data.generation_seq" }
          assert:
            - "Stale token: HTTP 412 with data.error_id == \"ERR_STALE_ASSESSMENT_VERSION\"."
