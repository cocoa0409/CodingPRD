              as_user_id: "td-001"
              captures: { status_submitted: $.data.status }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "REQUEST_CHANGES", notes: "add a robo position at centre field" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { status_changes: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CENTER_FIELD", position_type: "ROBO", cable_run_feet: 100, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos3_id: $.data.id, pos3_requires_operator: $.data.requires_operator }
            - call: "GET /broadcast-ops/venue-surveys/${survey_id}"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { reopened_status: $.data.status, reopened_revision: $.data.revision }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
          assert:
            - "After the REQUEST_CHANGES review, VenueSurvey.${survey_id}.status == CHANGES_REQUESTED and revision == 1"
            - "After the third camera position, VenueSurvey.${survey_id}.status == DRAFT and revision == 2 and submitted_by_user_id == null"
            - "CameraPosition.${pos3_id}.requires_operator == false"
            - "CameraPosition.${pos3_id}.signal_loss_db == 1.35"
            - "VenueSurvey.${survey_id}.camera_position_count == 3"
            - "VenueSurvey.${survey_id}.total_signal_loss_db == 6.76"
            - "VenueSurvey.${survey_id}.total_power_draw_amps == 60 and power_headroom_amps == 340"
            - "After the second review, VenueSurvey.${survey_id}.status == APPROVED, revision == 2, reviewed_by_user_id == lo-001"
            - "Production.${prod_id}.status == SURVEYED"

