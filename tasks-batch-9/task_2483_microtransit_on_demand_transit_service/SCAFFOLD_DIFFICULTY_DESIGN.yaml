              as: Dispatcher
          assert:
            - "the adjacent block [10:00, 12:00) returns HTTP 409 with error_id == ERR_DRIVER_REST_BUFFER (exact adjacency is REJECTED on the driver axis, unlike the vehicle axis)"
            - "the block [10:30, 12:30) — a gap of exactly 30 minutes — returns HTTP 201; VehicleBlock.${b3_id}.state == SCHEDULED and VehicleBlock.${b3_id}.block_type == SURGE"
            - "the block [10:29, 10:30) — a gap of 29 minutes — returns HTTP 409 with error_id == ERR_DRIVER_REST_BUFFER"
            - "GET /vehicle-blocks?driver_id=${d1_id} returns total_count == 2 (only ${b1_id} and ${b3_id} persisted)"
            - "GET /vehicle-blocks?vehicle_id=${v2_id} returns total_count == 0"
            - "GET /vehicle-blocks?vehicle_id=${v4_id} returns total_count == 0"
            - "VehicleBlock.${b1_id}.state == SCHEDULED (the rejected candidates left it untouched)"

      - name: curb_bucket_capacity_aggregates_across_blocks_and_frees_on_release
        grounds:
          - validations.priority_40.ERR_CURB_CAPACITY_EXCEEDED
