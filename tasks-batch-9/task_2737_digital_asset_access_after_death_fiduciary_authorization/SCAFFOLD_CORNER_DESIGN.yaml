        grounds:
          - validations[priority=67]
          - validations[priority=68]
          - validations[priority=71]
          - validations[priority=72]
          - state_machines.Estate.WIND_DOWN_to_CLOSED
        distinguishing_aspect: |
          With four close blockers outstanding, POST /estates/{estate_id}/close names them one at a
          time in ascending priority order — ERR_VALUATION_NOT_FINALIZED, then
          ERR_ASSETS_PENDING_DISPOSITION, then ERR_OPEN_CANCELLATIONS, then ERR_OPEN_REFUND_CLAIMS —
