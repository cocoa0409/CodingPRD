      - name: assign_orientation_to_full_session_returns_training_session_full
        claim_type: violation_to_error
        grounds:
          - "§1.1 TrainingSession.capacity is an input >= 1 and enrolled_count is computed from the hires pointing at the session; §1.6 declares ERR_TRAINING_SESSION_FULL (422) when a further enrolment would exceed capacity."
        distinguishing_aspect: "capacity 1 is already consumed by the hire that named the session at create time, so the second enrolment is refused with ERR_TRAINING_SESSION_FULL at 422 and enrolled_count stays 1."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One ROOMS plan (headcount_target 2, wave_start_date 2026-09-10), one SCHEDULED ROOMS session in TR-1 on 2026-09-14 09:00-12:00 with capacity 1 already holding one hire (enrolled_count 1), and a second OFFERED hire with orientation_session_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 2, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_id}", title: "Rooms orientation", training_room_code: "TR-1", starts_at: "2026-09-14T09:00:00Z", ends_at: "2026-09-14T12:00:00Z", capacity: 1, department: "ROOMS" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { sess_small: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "A. Keeper", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15", orientation_session_id: "${sess_small}" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_1: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "B. Porter", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_2: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/hires/${hire_2}/assign-orientation"
              payload: { orientation_session_id: "${sess_small}" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { e_full: "$.data.error_id" }
          assert:
            - "the session enrolled_count is 1 of capacity 1 before the trigger"
            - "response status is 422"
            - "data.error_id == 'ERR_TRAINING_SESSION_FULL'"
            - "GET /pre-opening/hires/${hire_2} still returns orientation_session_id == null"
            - "GET /pre-opening/programs/${prog_id}/training-sessions still reports enrolled_count == 1 for that session"

      - name: assign_orientation_across_departments_returns_training_department_mismatch
        claim_type: violation_to_error
        grounds:
          - "§1.1 TrainingSession.department is an enum defaulting to ALL and DepartmentHiringPlan.department scopes the hire; §1.6 declares ERR_TRAINING_DEPARTMENT_MISMATCH (422) when a departmental session does not match the hire's plan department."
