  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_status_and_construction_status_advance_independently
        grounds:
          - state_machines.InjectionWellPermit.TECHNICAL_REVIEW_to_REVISION_REQUESTED
          - state_machines.InjectionWellPermit.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.InjectionWellPermit.TECHNICAL_REVIEW_to_APPROVED
          - state_machines.InjectionWellPermit.construction_status=NOT_STARTED_to_construction_status=DRILLING
          - state_machines.InjectionWellPermit.construction_status=DRILLING_to_construction_status=CASING_SET
          - entities.InjectionWellPermit.fields.construction_status
        distinguishing_aspect: |
          Parallel dimensions on the InjectionWellPermit entity: the regulatory dimension traverses a full
          revision cycle TECHNICAL_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> TECHNICAL_REVIEW ->
          APPROVED (revision_round_count reaching 2) while construction_status never leaves NOT_STARTED,
          and the physical dimension then advances NOT_STARTED -> DRILLING -> CASING_SET while
          permit_status stays APPROVED, so the combined state (APPROVED, CASING_SET) is reachable only if
          the two dimensions are stored and gated independently.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with project.aor_radius_km 3.0 and corrective_action_completion_pct 100.00"
            - "one ACCEPTED GeologicModel with plume_status AOR_FINALIZED and seal_classification PASS"
            - "one InjectionWellPermit 'ALPHA-1' in permit_status SUBMITTED, construction_status NOT_STARTED, revision_round_count 1"
            - "no LegacyWellbore rows, so the permit approval precondition on corrective action holds"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits"
              payload: { project_id: "${proj_id}", geologic_model_id: "${model_id}", well_name: "ALPHA-1", casing_program: "LONG_STRING_CEMENTED_TO_SURFACE", corrosion_resistant_material: true, tubing_packer_installed: true, requested_injection_pressure_psi: 4000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { permit_id: $.data.id }
            - call: "POST /ccs/injection-well-permits/${permit_id}/submit"
              payload: { submission_note: "Class VI application" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          trigger:
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "BEGIN_TECHNICAL_REVIEW", review_note: "assigned to reviewer-2" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "clarify cement bond plan" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
              captures: { cs_after_revision: $.data.construction_status }
            - call: "POST /ccs/injection-well-permits/${permit_id}/submit"
              payload: { submission_note: "revision 2" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { rr_after_resubmit: $.data.revision_round_count }
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "BEGIN_TECHNICAL_REVIEW", review_note: "second pass" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "APPROVE", review_note: "construction standards met" }
