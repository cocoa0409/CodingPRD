scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_at_open_versus_refreshed_on_deposit_account
        grounds:
          - calculations.new_account_risk_score
          - entities.DepositAccount.fields.risk_score
          - entities.DepositAccount.fields.risk_score_basis
          - entities.DepositAccount.fields.risk_band
          - state_machines.DepositAccount.PENDING_FUNDING_to_ACTIVE
        distinguishing_aspect: |
          This dual variant lives on the DepositAccount onboarding-risk domain: PROVISIONAL_AT_OPEN
          forces funding_state to NONE (30 points) while REFRESHED reads the live FundingSource row,
          so the identical customer and channel score 77/HIGH at open, 67/HIGH once a source is
          declared, and 47/ELEVATED once that source verifies.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer with kyc_tier TIER_3 and watchlist_hit false."
            - "One DepositAccount opened through the ONLINE channel, still PENDING_FUNDING, with no FundingSource and no AccountLink."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Dana Kesselring", tin_last4: "3391", kyc_tier: "TIER_3", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_dv1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_dv1}", product_type: "CHECKING", open_channel: "ONLINE" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_dv1: "$.data.id", score_at_open: "$.data.risk_score" }
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_dv1}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "0219" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_dv1: "$.data.id", md_dv1: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_dv1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_dv1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_dv1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${score_at_open} == 77"
            - "The POST /deposit-fraud/accounts response carried risk_score_basis == PROVISIONAL_AT_OPEN and risk_band == HIGH"
            - "The POST /deposit-fraud/accounts/${acct_dv1}/funding-sources response carried DepositAccount-refresh evidence: a subsequent read shows risk_score dropping from 77 to 67 while the source is MICRO_DEPOSIT_SENT"
            - "GET /deposit-fraud/accounts/${acct_dv1} returns risk_score == 47"
            - "GET /deposit-fraud/accounts/${acct_dv1} returns risk_band == ELEVATED"
            - "GET /deposit-fraud/accounts/${acct_dv1} returns risk_score_basis == REFRESHED"
            - "GET /deposit-fraud/accounts/${acct_dv1} returns lifecycle_status == ACTIVE"

      - name: kiting_strict_versus_inclusive_qualifying_statuses_on_circulation_graph
        grounds:
          - calculations.kiting_cycle_score
          - entities.DepositItem.fields.drawee_account_id
          - entities.FraudCase.fields.scan_mode
          - entities.FraudCase.fields.cycle_account_ids
        distinguishing_aspect: |
          This dual variant lives on the cross-account deposit-item circulation graph, not on any
          single account's onboarding score: with one of four on-us checks settled CLEARED, STRICT
          scores the same data 66 (three PENDING edges, ratio 2500 bps) while INCLUSIVE scores it 70
          (four edges, ratio 1875 bps), so only INCLUSIVE reaches KITING_OPEN_THRESHOLD and opens a case.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default throughout."
            - "Two ACTIVE DepositAccounts A and B, each TIER_2 / BRANCH so both sit in risk_band STANDARD."
            - "Four CHECK DepositItems of 30000 cents each: two deposited into B drawn on A, two deposited into A drawn on B. Each mints an ACTIVE EXCEPTION_NEW_ACCOUNT CheckHold of 7500 cents."
            - "The last of the four items (deposited into A, drawn on B) is settled CLEARED, releasing its hold."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Rowan Blaise", tin_last4: "5522", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_k: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_k}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ka: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ka}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1100" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_ka: "$.data.id", md_ka: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_ka}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ka}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_k}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_kb: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_kb}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1101" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_kb: "$.data.id", md_kb: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_kb}/verification-attempts"
              payload: { micro_deposit_cents: "${md_kb}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_kb}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000, drawee_account_id: "${acct_ka}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_k1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ka}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000, drawee_account_id: "${acct_kb}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_k2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_kb}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000, drawee_account_id: "${acct_ka}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_k3: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ka}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000, drawee_account_id: "${acct_kb}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_k4: "$.data.id" }
            - call: "POST /deposit-fraud/deposit-items/${item_k4}/settle"
              payload: { outcome: "CLEARED" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_ka}/kiting-scan"
              payload: { mode: "STRICT", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { strict_score: "$.data.kiting_score", strict_case: "$.data.fraud_case_id" }
            - call: "POST /deposit-fraud/accounts/${acct_ka}/kiting-scan"
              payload: { mode: "INCLUSIVE", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { inclusive_score: "$.data.kiting_score", inclusive_case: "$.data.fraud_case_id" }
          assert:
            - "${strict_score} == 66"
            - "The STRICT scan response has cycle_length == 2, qualifying_item_count == 3, deposited_cents == 90000, uncollected_cents == 22500, uncollected_ratio_bps == 2500, detected == false and fraud_case_id == null"
            - "${inclusive_score} == 70"
            - "The INCLUSIVE scan response has cycle_length == 2, qualifying_item_count == 4, deposited_cents == 120000, uncollected_cents == 22500, uncollected_ratio_bps == 1875 and detected == true"
            - "${inclusive_case} is a non-null FraudCase id"
            - "GET /deposit-fraud/fraud-cases/${inclusive_case} returns case_type == KITING, detection_source == KITING_SCAN, scan_mode == INCLUSIVE, kiting_score == 70 and status == OPENED"
            - "GET /deposit-fraud/accounts/${acct_ka} returns lifecycle_status == RESTRICTED after the INCLUSIVE scan and returned ACTIVE after the STRICT scan"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_five_input_assembly_with_link_cap_and_confidence_gate
        grounds:
          - calculations.new_account_risk_score
          - entities.AccountLink.fields.is_risk_bearing
          - entities.AccountLink.fields.confidence_bps
          - entities.DepositAccount.fields.risk_band
        distinguishing_aspect: |
          Mode (a): a five-input formula whose terms interact non-linearly — a conditional branch on
          FundingSource state picks the funding term, a min() caps link points at 25 no matter how many
          risk-bearing links exist, a confidence gate at 6000 bps decides membership, and an outer
          min(100)/max(0) clamps the total. Six risk-bearing links and eight both yield exactly 73.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer with kyc_tier TIER_1 and watchlist_hit false."
            - "Three DepositAccounts owned by that customer: the subject account opened MOBILE, plus two counterpart accounts opened BRANCH."
            - "No FundingSource exists anywhere, so funding_state is NONE (30 points) for the subject account."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Perry Onslow", tin_last4: "7788", kyc_tier: "TIER_1", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_cf1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_cf1}", product_type: "CHECKING", open_channel: "MOBILE" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_cf1: "$.data.id", cf1_open_score: "$.data.risk_score" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_cf1}", product_type: "SAVINGS", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_cfx: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_cf1}", product_type: "SAVINGS", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_cfy: "$.data.id" }
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfx}", link_type: "SHARED_DEVICE", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfx}", link_type: "SHARED_ADDRESS", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfx}", link_type: "SHARED_PHONE", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfy}", link_type: "SHARED_DEVICE", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfy}", link_type: "SHARED_ADDRESS", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cf1}", to_account_id: "${acct_cfy}", link_type: "SHARED_PHONE", confidence_bps: 9000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "GET /deposit-fraud/accounts/${acct_cf1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { cf1_score_six_links: "$.data.risk_score" }
          trigger:
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cfy}", to_account_id: "${acct_cf1}", link_type: "SHARED_DEVICE", confidence_bps: 5999 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { link_below_gate: "$.data.id" }
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_cfx}", to_account_id: "${acct_cf1}", link_type: "TRANSFER_COUNTERPARTY", confidence_bps: 10000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { link_wrong_type: "$.data.id" }
            - call: "GET /deposit-fraud/accounts/${acct_cf1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { cf1_score_after: "$.data.risk_score" }
          assert:
            - "${cf1_open_score} == 48"
            - "${cf1_score_six_links} == 73"
            - "${cf1_score_after} == 73"
            - "AccountLink.${link_below_gate}.is_risk_bearing == false because confidence_bps 5999 is below LINK_CONFIDENCE_MIN_BPS 6000"
            - "AccountLink.${link_wrong_type}.is_risk_bearing == false because TRANSFER_COUNTERPARTY is outside the risk-bearing link_type set"
            - "GET /deposit-fraud/accounts/${acct_cf1} returns risk_band == HIGH and risk_score_basis == REFRESHED"

      - name: loss_exposure_rounds_each_hold_line_before_summing_then_scales
        grounds:
          - calculations.hold_override_loss_exposure
          - entities.HoldOverrideReview.fields.loss_exposure_cents
          - entities.HoldOverrideReview.fields.adjusted_exposure_cents
          - entities.DepositAccount.fields.risk_band
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. Two ACTIVE CHECK holds of 700 cents
          each round to 19 apiece for a total of 38; summing the raw products first (1400 * 275 / 10000
          = 38.5) and rounding once gives 39. The pinned per-line order then scales to 48 under the
          ELEVATED multiplier, where the sum-first path would give 49.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer with kyc_tier TIER_3 and watchlist_hit false; one ACTIVE DepositAccount opened BRANCH with a VERIFIED FundingSource, giving risk_score 35 and risk_band ELEVATED."
            - "Two CHECK DepositItems of 23200 cents each on that account, so each mints an ACTIVE CheckHold of exactly 700 cents (23200 - IMMEDIATE_AVAIL_CENTS 22500)."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Imani Followell", tin_last4: "6401", kyc_tier: "TIER_3", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_cf2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_cf2}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_cf2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_cf2}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "3030" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_cf2: "$.data.id", md_cf2: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_cf2}/verification-attempts"
              payload: { micro_deposit_cents: "${md_cf2}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_cf2}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 23200 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_cf2a: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_cf2}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 23200 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_cf2b: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_cf2a}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_cf2a: "$.data[0].id", hold_cf2a_v: "$.data[0].version" }
          trigger:
            - call: "POST /deposit-fraud/check-holds/${hold_cf2a}/override-reviews"
              payload: { requested_release_cents: 700, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Payroll customer, funds needed today", expected_check_hold_version: "${hold_cf2a_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_cf2: "$.data.id", exposure_cf2: "$.data.loss_exposure_cents", adjusted_cf2: "$.data.adjusted_exposure_cents" }
          assert:
            - "${exposure_cf2} == 38"
            - "${adjusted_cf2} == 48"
            - "HoldOverrideReview.${rev_cf2}.loss_exposure_cents != 39, which is the value a sum-then-round implementation produces"
            - "HoldOverrideReview.${rev_cf2}.adjusted_exposure_cents != 49, which is the value a sum-then-round implementation produces"
            - "GET /deposit-fraud/accounts/${acct_cf2} returns risk_score == 35, risk_band == ELEVATED, ledger_balance_cents == 46400, available_balance_cents == 45000 and held_amount_cents == 1400"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deposit_account_lifecycle_and_posture_dimensions_advance_independently
        grounds:
          - state_machines.DepositAccount.NORMAL_to_STEP_UP_REQUIRED
          - state_machines.DepositAccount.STEP_UP_REQUIRED_to_STEP_UP_REQUIRED
          - state_machines.DepositAccount.STEP_UP_REQUIRED_to_LOCKED
          - state_machines.DepositAccount.ACTIVE_to_RESTRICTED
          - entities.DepositAccount.fields.access_posture
          - entities.DepositAccount.fields.lifecycle_status
        distinguishing_aspect: |
          Non-linear shape on DepositAccount: two independent state dimensions on one row. The posture
          dimension walks NORMAL -> STEP_UP_REQUIRED -> STEP_UP_REQUIRED (self-loop) -> LOCKED on
          step-up traffic while the lifecycle dimension independently walks PENDING_FUNDING -> ACTIVE
          -> RESTRICTED on funding and case traffic; neither dimension reads or writes the other.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer with tin_last4 4417; one DepositAccount, ACTIVE after funding verification, access_posture NORMAL."
            - "An access review posts NEW_DEVICE (15) and GEO_VELOCITY (25), scoring exactly ATO_STEP_UP_MIN 40 and moving the posture to STEP_UP_REQUIRED while lifecycle_status stays ACTIVE."
            - "A manually opened MULE FraudCase then drives lifecycle_status ACTIVE -> RESTRICTED while the posture stays STEP_UP_REQUIRED."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Sena Okonkwo", tin_last4: "4417", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_nl1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_nl1}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_nl1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_nl1}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "8811" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_nl1: "$.data.id", md_nl1: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_nl1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_nl1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_nl1}/access-review"
              payload: { indicator_codes: ["NEW_DEVICE", "GEO_VELOCITY"] }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { posture_after_review: "$.data.access_posture", ato_after_review: "$.data.ato_score" }
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_nl1}", case_type: "MULE" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { case_nl1: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_nl1}/step-up-response"
              payload: { challenge_answer: "0000" }
              as: AccountHolder
              as_user_id: "${cust_nl1}"
            - call: "POST /deposit-fraud/accounts/${acct_nl1}/step-up-response"
              payload: { challenge_answer: "0000" }
              as: AccountHolder
              as_user_id: "${cust_nl1}"
            - call: "POST /deposit-fraud/accounts/${acct_nl1}/step-up-response"
              payload: { challenge_answer: "0000" }
              as: AccountHolder
              as_user_id: "${cust_nl1}"
              captures: { posture_final: "$.data.access_posture", lifecycle_final: "$.data.lifecycle_status", failures_final: "$.data.step_up_failure_count" }
          assert:
            - "${posture_after_review} == STEP_UP_REQUIRED"
            - "${ato_after_review} == 40"
            - "${posture_final} == LOCKED"
            - "${lifecycle_final} == RESTRICTED"
            - "${failures_final} == 3"
            - "GET /deposit-fraud/accounts/${acct_nl1} returns ato_score == 40, unchanged by the three failed challenges"
            - "GET /deposit-fraud/fraud-cases/${case_nl1} returns status == OPENED, unaffected by any posture movement"

      - name: hold_override_review_returns_for_info_and_resubmits_in_a_loop
        grounds:
          - state_machines.HoldOverrideReview.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.HoldOverrideReview.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.HoldOverrideReview.fields.revision_count
          - entities.HoldOverrideReview.fields.status
        distinguishing_aspect: |
          Non-linear shape on HoldOverrideReview, a different entity from DepositAccount: the machine
          contains a true revision cycle SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED that can be walked
          repeatedly, each traversal incrementing revision_count while the review remains eligible for
          a later APPROVE.
        test_recipe:
