        constraints: one of {CLOSED, OPEN, GREEN_RECOVERY, WINTERIZED}
      - name: open_work_order_count
        type: integer
        source: computed
        description: Count of WorkOrders for this Pool whose status IN {OPEN, DIAGNOSED, ON_HOLD, AWAITING_APPROVAL}. Recomputed on every WorkOrder transition.
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: Sum of Invoice.amount_cents for this Pool whose status == ISSUED, minus sum of Invoice.amount_cents whose status == PAID is NOT included; only ISSUED unpaid invoices accrue. Recomputed on every Invoice transition.
        default: 0

