# =============================================================================
# PRD Benchmark Seed Tables — Spring Training Complex Operations & Roster
# Task: task_3215_spring_training_complex_operations_roster_assignment
# Complexity profile: Expert++ (posture-driven gating + workflow orchestration,
# temporal windowing, SOD, cascading side effects, OCC, derived reconciliation,
# scheduled/deferred actions, selector policy, graph dependencies).
# =============================================================================

scenario: |
  Spring Training Complex Operations & Roster Assignment (Chicago Cubs): shared or dedicated complex facilities hosting major and minor league camps with field, clubhouse and training room scheduling, player report dates by roster status with invitation letters and travel arrangements, daily workout group assignment and pitcher throwing programs coordinated with game schedules, exhibition game scheduling with split squads and travel radius limits, roster decision timelines for option status, waivers and non-roster invitee outcomes, host community relationships including stadium lease, ticketing and local sponsorships, medical evaluations, physicals and injury management before the season, minor league assignment and camp break-out logistics

domain_name: "spring-training-complex-operations"
api_prefix: "/camp-ops"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions     # logical clock 2026-09-01T00:00:00Z default; all gates are clock-window based
    - segregation_of_duties
    - selector_policy
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:

  - name: Complex
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility complex display name" }
      - { name: host_city, type: string, source: input, description: "Municipality the complex sits in" }
      - { name: season_split_track, type: enum, source: input, default: "SHARED", constraints: "SHARED | DEDICATED — SHARED means major and minor camps co-tenure the complex" }
      - { name: timezone, type: string, source: input, default: "America/Phoenix", description: "IANA timezone the dream-gate dates resolve against" }
      - { name: facility_capacity_units, type: integer, source: input, description: "Composite concurrent-occupancy capacity across all facility kinds" }
      - { name: posted_occupancy_units, type: integer, source: computed, default: 0, description: "Sum of capacity_units over WorkoutGroups on this complex whose group_status == PUBLISHED" }
      - { name: reserved_major_units, type: integer, source: computed, default: 0, description: "Count of GroupAssignments on this Complex with roster_bucket == MAJOR and assignment_status IN {PROVISIONAL, ACTIVE} whose owning WorkoutGroup.group_status == PUBLISHED" }
      - { name: reserved_minor_units, type: integer, source: computed, default: 0, description: "Count of GroupAssignments on this Complex with roster_bucket == MINOR and assignment_status IN {PROVISIONAL, ACTIVE} whose owning WorkoutGroup.group_status == PUBLISHED" }
      - { name: maintenance_block_units, type: integer, source: computed, default: 0, description: "Units withheld by the most recent field-maintenance action: HALF_FIELD withholds ceil(facility_capacity_units / 2), CLOSED withholds facility_capacity_units" }
      - { name: field_maintenance_status, type: enum, source: computed, default: "OPEN", constraints: "OPEN | HALF_FIELD | CLOSED — written by POST /camp-ops/complexes/{complexId}/field-maintenance" }
      - { name: facility_posture, type: enum, source: computed, default: "NORMAL", constraints: "NORMAL | FIELD_RESTRICTED | CLOSED — derived by ComplexPostureSweepCalculation from posted_occupancy_units vs effective capacity" }
      - { name: contention_flagged, type: boolean, source: computed, default: false, description: "True when posted_occupancy_units exceeds effective capacity; cleared by the next posture sweep" }
      - { name: posture_sweep_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each POST /camp-ops/complexes/{complexId}/posture-sweeps" }

  - name: CommunityAgreement
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: input, description: "FK -> Complex.id; the complex this host-community agreement covers" }
      - { name: stadium_name, type: string, source: input, description: "Host community ballpark name" }
      - { name: lease_start_date, type: datetime, source: input, description: "Stadium lease start instant (ISO 8601 UTC)" }
      - { name: lease_end_date, type: datetime, source: input, description: "Stadium lease end instant; must be strictly after lease_start_date" }
      - { name: annual_rent_cents, type: integer, source: input, description: "Annual lease rent in cents" }
      - { name: sponsorship_minor_league_base_cents, type: integer, source: input, description: "Base value of one MINOR bucket sponsorship fulfillment event" }
      - { name: sponsorship_major_league_base_cents, type: integer, source: input, description: "Base value of one MAJOR bucket sponsorship fulfillment event" }
      - { name: ticket_price_cents, type: integer, source: input, description: "Unit price applied per ticket sold" }
      - { name: ticket_sellout_capacity, type: integer, source: input, description: "Tickets available per gameday for sellout detection" }
      - { name: agreement_status, type: enum, source: computed, default: "DRAFT", constraints: "DRAFT | ACTIVE | TERMINATED — ACTIVE is required before any HostCommunityRecord may open ticketing" }
      - { name: travel_liability_window_count, type: integer, source: computed, default: 0, description: "Count of TravelArrangement rows under this agreement whose reimbursement_status IN {LIABLE, VOIDED} — the TravelLiabilityWindowCalculation inclusive-end backlog key" }
      - { name: travel_liability_days, type: integer, source: computed, default: 0, description: "Sum over those arrangements of business-day span from departure_at to the agreement's lease_end_date" }
      - { name: settlement_release_lag_days, type: integer, source: computed, default: 0, description: "TravelLiabilityWindowCalculation's complementary read: business_days(PERIOD_END, latest settlement action) when a settlement has been acted on, else 0; the lag between the end of the funding period and the settlement action" }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Player legal name" }
      - { name: idp_number, type: string, source: input, constraints: "unique across all Players; the roster-invitation identity" }
      - { name: position_code, type: enum, source: input, constraints: "P | C | INF | OF | DH" }
      - { name: acquisition_channel, type: enum, source: input, constraints: "DRAFT_PICK | NRI_ASSIGNMENT | FREE_AGENT | INTERNATIONAL_SIGNING | TRADE" }
      - { name: mlb_service_days, type: integer, source: input, default: 0, constraints: "0..9999" }
      - { name: minor_league_option_years_used, type: integer, source: input, default: 0, constraints: "0..3" }
      - { name: home_country, type: string, source: input, description: "ISO 3166 country name; 'United States' never needs a work visa" }
      - { name: home_complex_id, type: string, source: input, description: "FK -> Complex.id; the camp complex this player reports to. Resolves the 'owning Complex' used by TravelCostAllocation, TravelFundingSourceCalculation and TravelLiabilityWindowCalculation." }
      - { name: clearance_status, type: enum, source: computed, default: "PENDING", constraints: "PENDING | MEDICALS_COMPLETE | CAMP_CLEARED | TURNED_AWAY — mirrors the owning PlayerProgramProfile.eligibility_status" }

  - name: PlayerRosterRecord
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the player whose roster status this record tracks" }
      - { name: current_roster_status, type: enum, source: computed, default: "NRI", constraints: "NRI | ACTIVE_ROSTER | OPTIONED_MINORS | DESIGNATED_FOR_ASSIGNMENT | WAIVER_PENDING | WAIVER_CLAIMED | RELEASED | NRI_RELEASED | ASSIGNED_AAA | ASSIGNED_AA" }
      - { name: roster_decision_status, type: enum, source: computed, default: "DECISION_PENDING", constraints: "DECISION_PENDING | DECISION_FINALIZED | DECISION_VOIDED — independent dimension from current_roster_status" }
      - { name: option_eligibility, type: enum, source: computed, constraints: "OPTION_AVAILABLE | NO_OPTION_REMAINING — derived from Player.minor_league_option_years_used" }
      - { name: option_decisions_used, type: integer, source: computed, default: 0, description: "Count of finalized OPTION_ASSIGN decisions plus 1 for each finalized waiver_claim outcome" }
      - { name: waivers_required, type: boolean, source: computed, default: false, description: "True once 3*minor_trigger_count + 5*major_trigger_count >= WAIVERS_REQUIRED_CREDIT_THRESHOLD (minor_trigger_count and major_trigger_count come from this player's PlayerProgramProfile); refreshed on every finalize-decision and void-decision" }
      - { name: option_credit_source, type: enum, source: computed, default: "BASE_ALLOWANCE", constraints: "BASE_ALLOWANCE | VOIDED_OPTION_RESTORES_CHARGE — selects which MajorLeagueOptionEligibilityCalculation variant computes option_eligibility" }
      - { name: last_decision_actor_id, type: string, source: computed, description: "X-User-ID that last advanced current_roster_status; compared against the finalizing actor for the segregation-of-duties precondition" }
      - { name: waiver_claim_window_days, type: integer, source: computed, default: 0, description: "effective_claim_days captured by WaiverClaimCountdownCalculation at request-waivers time; consumed by the engaged waiver-claim variant at finalize time" }
      - { name: waiver_claim_requested_at, type: datetime, source: computed, description: "Current logical clock when request-waivers opened the claim window; null when no claim is engaged. The engaged variant is NEWLY_ENGAGED when this equals the clock at finalize time and AGED else." }
      - { name: split_squad_eligibility, type: enum, source: computed, default: "HOME_ONLY", constraints: "HOME_AND_TRAVEL | HOME_ONLY — HOME_AND_TRAVEL requires a CONFIRMED TravelArrangement with travel_radius_miles <= 250" }
      - { name: decision_sequence, type: integer, source: system, default: 0, description: "Monotone per-decision counter; the roster-decision tie-break key (never the UUID id)" }
      - { name: decision_finalized_at, type: datetime, source: computed, description: "Clock instant captured when roster_decision_status last became DECISION_FINALIZED" }

  - name: HostCommunityRecord
    parent: CommunityAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CommunityAgreement.id; the agreement this community ledger belongs to" }
      - { name: ticketing_status, type: enum, source: computed, default: "NOT_OPEN", constraints: "NOT_OPEN | ON_SALE | SOLD_OUT | SUSPENDED" }
      - { name: tickets_sold, type: integer, source: computed, default: 0, description: "Cumulative tickets sold under this record" }
      - { name: ticketing_revenue_cents, type: integer, source: computed, default: 0, description: "Cumulative ticketing revenue in cents" }
      - { name: sponsorship_recorded_cents, type: integer, source: computed, default: 0, description: "Sum of committed_amount_cents over Sponsorships on this record whose reconciliation_status IN {UNSETTLED, SETTLED}" }
      - { name: sponsorship_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of received_amount_cents over Sponsorships on this record whose reconciliation_status IN {UNSETTLED, SETTLED}" }
      - { name: community_ledger_cents, type: integer, source: computed, default: 0, description: "= ticketing_revenue_cents + sponsorship_revenue_cents" }
      - { name: agreement_funded_cents, type: integer, source: computed, default: 0, description: "Cumulative travel draws posted against the community ledger: sum of TravelArrangement.agreement_funded_cents over this agreement's invitations with funding_source == AGREEMENT_FUND; reversed by revert and cancel" }
      - { name: recognition_funded_cents, type: integer, source: computed, default: 0, description: "Sum over recognized sponsorships of RecognitionAllocation(major_group_count, minor_group_count, agreement bases)" }
      - { name: ledger_gap_cents, type: integer, source: computed, default: 0, description: "= community_ledger_cents - recognition_funded_cents; must return to its pre-settlement value after recognize + void-settlement" }

  - name: Sponsorship
    parent: HostCommunityRecord
    common_fields: true
    fields:
      - { name: host_community_record_id, type: string, source: input, description: "FK -> HostCommunityRecord.id; the community ledger this sponsorship posts against" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor legal name" }
      - { name: sponsor_tier, type: enum, source: input, constraints: "LOCAL | REGIONAL | NATIONAL — selects the recognition multiplier" }
      - { name: committed_amount_cents, type: integer, source: input, constraints: "must be >= 0" }
      - { name: received_amount_cents, type: integer, source: computed, default: 0, description: "Contributions minus withdrawals; can never go negative" }
      - { name: fulfillment_completed, type: boolean, source: input, default: false, description: "Set true by POST /camp-ops/sponsorships/{id}/settle once received_amount_cents >= committed_amount_cents" }
      - { name: reconciliation_status, type: enum, source: computed, default: "UNSETTLED", constraints: "UNSETTLED | SETTLED | RECOGNIZED | SETTLEMENT_VOIDED" }

  - name: WorkoutGroup
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: input, description: "FK -> Complex.id; the complex hosting this workout group" }
      - { name: roster_bucket, type: enum, source: input, constraints: "MAJOR | MINOR" }
      - { name: group_name, type: string, source: input, description: "Daily workout group label, e.g. 'Pitchers Group A'" }
      - { name: facility_kind, type: enum, source: input, constraints: "FIELD | CLUBHOUSE | TRAINING_ROOM" }
      - { name: capacity_units, type: integer, source: input, constraints: "must be >= 1" }
      - { name: assigned_units, type: integer, source: computed, default: 0, description: "Count of group assignments on this group whose assignment_status IN {PROVISIONAL, ACTIVE}" }
      - { name: assignment_group_tag, type: string, source: computed, description: "= group_name normalized to upper snake case; the key a ThrowProgram uses to locate its player's active group" }
      - { name: group_status, type: enum, source: computed, default: "FORMING", constraints: "FORMING | PUBLISHED | DISBANDED" }

  - name: GroupAssignment
    parent: WorkoutGroup
    common_fields: true
    fields:
      - { name: workout_group_id, type: string, source: input, description: "FK -> WorkoutGroup.id; the group this player is assigned into" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the assigned player" }
      - { name: roster_bucket, type: enum, source: input, constraints: "MAJOR | MINOR — must equal the owning WorkoutGroup.roster_bucket" }
      - { name: assignment_kind, type: enum, source: input, constraints: "ACTIVE_WORKOUT | REHAB" }
      - { name: assignment_status, type: enum, source: computed, default: "PROVISIONAL", constraints: "PROVISIONAL | ACTIVE | WITHDRAWN" }
      - { name: assigned_at, type: datetime, source: system, description: "Clock instant the assignment row was created" }
      - { name: withdrawal_reason, type: string, source: computed, description: "Populated only when assignment_status == WITHDRAWN" }

  - name: ThrowProgram
    parent: GroupAssignment
    common_fields: true
    fields:
      - { name: group_assignment_id, type: string, source: input, description: "FK -> GroupAssignment.id; the assignment this throwing program hangs off" }
      - { name: player_id, type: string, source: computed, description: "Mirror of the owning GroupAssignment.player_id" }
      - { name: program_phase, type: enum, source: computed, default: "PHASE_1", constraints: "PHASE_1 | PHASE_2 | PHASE_3 | PHASE_4 | PHASE_LIVE | SHUTDOWN" }
      - { name: target_catch_play_throws, type: integer, source: input, constraints: "must be >= 1" }
      - { name: target_bullpen_sessions, type: integer, source: input, constraints: "must be >= 1" }
      - { name: cumulative_throws, type: integer, source: computed, default: 0, description: "Chronological accumulator over ThrowProgramSession rows with session_kind == CATCH_PLAY" }
      - { name: cumulative_bullpen_sessions, type: integer, source: computed, default: 0, description: "Count of ThrowProgramSession rows with session_kind == BULLPEN" }
      - { name: schedule_requirement_throws, type: integer, source: computed, default: 0, description: "Recomputed by ThrowingProgramRequirementCalculation on every session log and phase advance" }
      - { name: requirement_status, type: enum, source: computed, default: "NOT_REQUIRED", constraints: "NOT_REQUIRED | MET | UNMET" }
      - { name: last_session_date, type: datetime, source: computed, description: "game_datetime-style clock instant of the newest ThrowProgramSession row by logged_at, tie-broken by session_sequence" }
      - { name: last_game_scheduled_date, type: datetime, source: computed, description: "Newest GameSchedule.game_datetime over games this player is SCHEDULED or CONFIRMED into" }

  - name: WorkoutGroupSession
    parent: WorkoutGroup
    common_fields: true
    fields:
      - { name: workout_group_id, type: string, source: input, description: "FK -> WorkoutGroup.id; the group this session block belongs to" }
      - { name: session_date, type: datetime, source: input, description: "Session start instant (ISO 8601 UTC)" }
      - { name: session_end_datetime, type: datetime, source: input, description: "Session end instant; the half-open interval is [session_date, session_end_datetime)" }
      - { name: session_kind, type: enum, source: input, constraints: "BULLPEN | CATCH_PLAY | LIVE_BP | DEFENSE" }
      - { name: field_units, type: integer, source: input, constraints: "must be >= 1" }
      - { name: session_status, type: enum, source: computed, default: "SCHEDULED", constraints: "SCHEDULED | PUBLISHED | CANCELLED" }

  - name: ThrowProgramSession
    parent: ThrowProgram
    common_fields: true
    fields:
      - { name: throw_program_id, type: string, source: input, description: "FK -> ThrowProgram.id; the program this logged session belongs to" }
      - { name: logged_at, type: datetime, source: input, description: "Clock instant the session was logged" }
      - { name: session_sequence, type: integer, source: system, default: 0, description: "Monotone per-program counter; the chronological tie-break key when two sessions share logged_at" }
      - { name: session_kind, type: enum, source: input, constraints: "CATCH_PLAY | BULLPEN" }
      - { name: play_catch_throws, type: integer, source: input, default: 0, constraints: "must be >= 0; non-zero only for session_kind == CATCH_PLAY" }
      - { name: session_status, type: enum, source: computed, default: "LOGGED", constraints: "LOGGED | VOIDED — only LOGGED sessions enter the throwing-program accumulators" }

  - name: SpringTrail
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the player mapped onto the minor-league spring trail" }
      - { name: trail_level, type: enum, source: input, constraints: "AAA | AA | A_PLUS | A" }
      - { name: mapped_at, type: datetime, source: system, description: "Clock instant the mapping row was created" }
      - { name: trail_status, type: enum, source: computed, default: "ACTIVE", constraints: "ACTIVE | ENDED" }

  - name: MinorLeagueAssignment
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the player assigned after camp break-out" }
      - { name: roster_record_id, type: string, source: input, description: "FK -> PlayerRosterRecord.id; the finalized roster record this break-out assignment settles" }
      - { name: assigned_level, type: enum, source: input, constraints: "AAA | AA" }
      - { name: affiliate_name, type: string, source: input, description: "Affiliate club the player is assigned to" }
      - { name: effective_datetime, type: datetime, source: input, description: "Instant the minor league assignment takes effect" }
      - { name: travel_day_count, type: integer, source: computed, default: 0, description: "Business-day span from effective_datetime to the player's Complex lease_end_date; the MinorLeagueAssignmentCalculation break-out window key" }
      - { name: break_out_liability_cents, type: integer, source: computed, default: 0, description: "= sum of agreement_funded_cents over the player's TRAVEL_LIABILITY_ROWS at break-out time; fixed once written" }
      - { name: assignment_status, type: enum, source: computed, default: "PENDING", constraints: "PENDING | SETTLED | BREAKOUT_VOIDED" }
      - { name: settlement_actor_id, type: string, source: computed, description: "X-User-ID that settled the assignment; compared against the break-out actor for the segregation-of-duties gate" }

  - name: PlayerProgramProfile
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the player this camp-eligibility profile belongs to" }
      - { name: eligibility_status, type: enum, source: computed, default: "MEDICALS_PENDING", constraints: "MEDICALS_PENDING | CAMP_ELIGIBLE — CAMP_ELIGIBLE requires a Physical with status PERFORMED" }
      - { name: rehab_program_phase, type: enum, source: computed, default: "PHASE_1", constraints: "PHASE_1 | PHASE_2 | PHASE_3 | PHASE_4 | PHASE_LIVE | SHUTDOWN — mirrors ThrowProgram.program_phase, with one reconciliation lag: a PHASE_3->PHASE_4 advance does not mirror until a WorkoutGroupSession is published" }
      - { name: active_group_assignment_id, type: string, source: computed, description: "The GroupAssignment row this player currently occupies; selected by GroupAssignmentSelector" }
      - { name: active_group_session_date, type: datetime, source: computed, description: "Newest session_date over WorkoutGroupSessions of the group named by active_group_assignment_id" }
      - { name: active_rehab_assignment_count, type: integer, source: computed, default: 0, description: "Count of GroupAssignment rows for this player with assignment_kind == REHAB and assignment_status IN {PROVISIONAL, ACTIVE}" }
      - { name: major_group_count, type: integer, source: computed, default: 0, description: "Count of GroupAssignment rows for this player with roster_bucket == MAJOR and assignment_status IN {PROVISIONAL, ACTIVE}" }
      - { name: minor_group_count, type: integer, source: computed, default: 0, description: "Count of GroupAssignment rows for this player with roster_bucket == MINOR and assignment_status IN {PROVISIONAL, ACTIVE}" }

  - name: CampInvitation
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the invited player" }
      - { name: invitation_kind, type: enum, source: input, constraints: "NRI_STANDARD | GUEST_INSTRUCTOR | CAMP_INVITEE" }
      - { name: report_current_date, type: datetime, source: input, description: "Earliest permitted arrival instant; pitchers and catchers report first" }
      - { name: report_final_date, type: datetime, source: input, description: "Mandatory arrival instant; must be >= report_current_date" }
      - { name: actual_report_date, type: datetime, source: computed, description: "Clock instant captured by POST /camp-ops/camp-invitations/{id}/arrive" }
      - { name: arrival_band, type: enum, source: computed, default: "MISSED_WINDOW", constraints: "EARLY | MET_CURRENT | MET_FINAL | MISSED_WINDOW — derived from actual_report_date vs report_current_date and report_final_date" }
      - { name: travel_arrangement_status, type: enum, source: computed, default: "NOT_ARRANGED", constraints: "NOT_ARRANGED | ARRANGED | CANCELLED" }
      - { name: invitation_status, type: enum, source: computed, default: "ISSUED", constraints: "ISSUED | ACKNOWLEDGED | ARRIVED | VISA_BLOCKED | NO_SHOW" }
      - { name: invitation_letter_status, type: enum, source: computed, default: "LETTER_PENDING", constraints: "LETTER_PENDING | LETTER_SENT" }
      - { name: domestic_travel, type: boolean, source: computed, default: true, description: "True when Player.home_country == 'United States'" }

  - name: TravelArrangement
    parent: CampInvitation
    common_fields: true
    fields:
      - { name: camp_invitation_id, type: string, source: input, description: "FK -> CampInvitation.id; the invitation this arrangement serves" }
      - { name: player_id, type: string, source: computed, description: "Mirror of the owning CampInvitation.player_id" }
      - { name: mode, type: enum, source: input, constraints: "AIR | BUS | AUTO" }
      - { name: travel_radius_miles, type: number, source: input, constraints: "must be >= 0" }
      - { name: departure_at, type: datetime, source: input, description: "Planned departure instant; must not be after the invitation's report_current_date when confirmed" }
      - { name: status, type: enum, source: computed, default: "PLANNED", constraints: "PLANNED | CONFIRMED | CANCELLED" }
      - { name: travel_cost_cents, type: integer, source: input, constraints: "must be >= 0" }
      - { name: reimbursement_status, type: enum, source: computed, default: "NOT_LIABLE", constraints: "NOT_LIABLE | LIABLE | VOIDED — LIABLE whenever travel_cost_cents > 0; VOIDED after cancel" }
      - { name: agreement_funded_cents, type: integer, source: computed, default: 0, description: "= TravelCostAllocation.agreement_funded_cents when funding_source == AGREEMENT_FUND, else 0; this is the draw posted against HostCommunityRecord.agreement_funded_cents" }
      - { name: reimbursement_cents, type: integer, source: computed, default: 0, description: "= TravelCostAllocation.reimbursement_cents when funding_source == REIMBURSEMENT, else 0" }
      - { name: funding_source, type: enum, source: computed, constraints: "AGREEMENT_FUND | REIMBURSEMENT | NONE" }

  - name: Physical
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; the player examined" }
      - { name: scheduled_visit_date, type: datetime, source: input, description: "Planned examination instant; a non-domestic player's visit must sit at least 5 days before the invitation's report_current_date" }
      - { name: status, type: enum, source: computed, default: "SCHEDULED", constraints: "SCHEDULED | PERFORMED | VOIDED" }
      - { name: physical_result, type: enum, source: computed, constraints: "PASSED | PASSED_WITH_MODIFICATION | FAILED — only PASSED and PASSED_WITH_MODIFICATION carry the program forward" }
      - { name: performed_at, type: datetime, source: computed, description: "Clock instant captured by POST /camp-ops/physicals/{id}/perform" }

  - name: GameSchedule
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: input, description: "FK -> Complex.id; the complex hosting or dispatching this exhibition game" }
      - { name: opponent_name, type: string, source: input, description: "Opposing club name" }
      - { name: home_away, type: enum, source: input, constraints: "HOME | AWAY — AWAY games may not be published while the acting complex's facility_posture == CLOSED" }
      - { name: game_datetime, type: datetime, source: input, description: "First-pitch instant; drives gameday gating and throwing-program delay" }
      - { name: travel_radius_miles, type: number, source: input, constraints: "must be >= 0; an AWAY game with travel_radius_miles > 250 cannot be published" }
      - { name: duration_units, type: integer, source: input, description: "Field-time units consumed by this game" }
      - { name: split_squad, type: boolean, source: input, default: false }
      - { name: game_schedule_status, type: enum, source: computed, default: "DRAFT", constraints: "DRAFT | PUBLISHED | PLAYED | CANCELLED" }
      - { name: gameday_status, type: enum, source: computed, default: "NOT_GAMEDAY", constraints: "GAMEDAY | NOT_GAMEDAY" }
      - { name: game_interval_start, type: datetime, source: computed, description: "= game_datetime - DURATION_UNITS; half-open interval start for field-time overlap checks" }
      - { name: game_interval_end, type: datetime, source: computed, description: "= game_datetime + DURATION_UNITS; half-open interval end for field-time overlap checks" }

  - name: GameParticipation
    parent: GameSchedule
    common_fields: true
    fields:
      - { name: game_schedule_id, type: string, source: input, description: "FK -> GameSchedule.id; the game this player appears in" }
      - { name: player_id, type: string, source: input, description: "Mirror of the participating player's id; a plain reference resolved through the roster record" }
      - { name: squad_side, type: enum, source: input, constraints: "HOME_SQUAD | AWAY_SQUAD" }
      - { name: participation_status, type: enum, source: computed, default: "SCHEDULED", constraints: "SCHEDULED | CONFIRMED | WITHDRAWN | LOCKED" }
      - { name: throw_count, type: integer, source: input, default: 0, constraints: "must be >= 0; non-pitcher participations must carry throw_count == 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Complex
    initial_state: NORMAL
    terminal_states: [CLOSED]
    note: "facility_posture is driven by ComplexPostureSweepCalculation; the transitions below are the maintenance transitions whose side effects move it."
    transitions:
      - from: NORMAL
        to: FIELD_RESTRICTED
        trigger: "POST /camp-ops/complexes/{complexId}/field-maintenance (maintenance_action=FIELD_RESTRICTED)"
        actor: ComplexDirector
        preconditions:
          - "Complex.field_maintenance_status == OPEN"
          - "Complex.posted_occupancy_units <= floor(facility_capacity_units * 85 / 100)"
        side_effects:
          - "Complex.field_maintenance_status -> HALF_FIELD"
          - "Complex.maintenance_block_units = ceil(Complex.facility_capacity_units / 2)"
          - "recompute Complex.facility_posture via ComplexPostureSweepCalculation"
      - from: FIELD_RESTRICTED
        to: NORMAL
        trigger: "POST /camp-ops/complexes/{complexId}/field-maintenance (maintenance_action=OPEN)"
        actor: ComplexDirector
        preconditions:
          - "Complex.field_maintenance_status == HALF_FIELD"
        side_effects:
          - "Complex.maintenance_block_units = 0"
          - "Complex.field_maintenance_status -> OPEN"
          - "recompute Complex.facility_posture via ComplexPostureSweepCalculation"
          - "recompute Complex.reserved_major_units and Complex.reserved_minor_units"
      - from: NORMAL
        to: CLOSED
        trigger: "POST /camp-ops/complexes/{complexId}/field-maintenance (maintenance_action=CLOSED)"
        actor: ComplexDirector
        preconditions:
          - "Complex.field_maintenance_status == OPEN"
          - "no GroupAssignment on this Complex has assignment_status == PROVISIONAL"
        side_effects:
          - "Complex.maintenance_block_units = Complex.facility_capacity_units"
          - "Complex.field_maintenance_status -> CLOSED"
          - "Complex.facility_posture -> CLOSED"
          - "CASCADE 3 hop 1: every GroupAssignment on this Complex with assignment_status == PROVISIONAL is driven PROVISIONAL -> WITHDRAWN (withdrawal_reason='COMPLEX_FIELD_CLOSED')"
          - "CASCADE 3 hop 2: each WorkoutGroup that loses its last PROVISIONAL-or-ACTIVE assignment is driven FORMING -> DISBANDED, or PUBLISHED -> DISBANDED"
          - "CASCADE 3 hop 3: for every member player of a DISBANDED WorkoutGroup, that player's PlayerProgramProfile.rehab_program_phase is reset to PHASE_1 (from PHASE_2 or PHASE_1, whichever it held) and active_group_assignment_id is cleared"
          - "CASCADE 3 hop 4: recompute PlayerProgramProfile.major_group_count / minor_group_count, then Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"
          - "every WorkoutGroupSession belonging to a DISBANDED WorkoutGroup is driven to session_status CANCELLED"
          - "every GameSchedule on this Complex with home_away == AWAY and game_schedule_status == DRAFT is driven DRAFT -> CANCELLED"
      - from: FIELD_RESTRICTED
        to: CLOSED
        trigger: "POST /camp-ops/complexes/{complexId}/field-maintenance (maintenance_action=CLOSED)"
        actor: ComplexDirector
        preconditions:
          - "no GroupAssignment on this Complex has assignment_status == PROVISIONAL"
        side_effects:
          - "Complex.maintenance_block_units = Complex.facility_capacity_units"
          - "Complex.field_maintenance_status -> CLOSED"
          - "Complex.facility_posture -> CLOSED"
          - "CASCADE 3 hop 1 through hop 4 as in NORMAL -> CLOSED"

  # ---------------------------------------------------------------------------
  - entity: CommunityAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    note: "agreement_status drops from ACTIVE back to DRAFT when the owning complex has no HostCommunityRecord with ticketing_status == ON_SALE."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /camp-ops/community-agreements/{agreementId}/activate"
        actor: CommunityLiaison
        preconditions:
          - "CommunityAgreement.agreement_status == DRAFT"
          - "Complex.lease_start_date < Complex.lease_end_date"
          - "owning Complex.facility_posture != CLOSED"
        side_effects:
          - "CommunityAgreement.agreement_status -> ACTIVE"
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /camp-ops/community-agreements/{agreementId}/revert-to-draft"
        actor: CommunityLiaison
        preconditions:
          - "CommunityAgreement.agreement_status == ACTIVE"
          - "no HostCommunityRecord on this CommunityAgreement has ticketing_status == ON_SALE"
        side_effects:
          - "CommunityAgreement.agreement_status -> DRAFT"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /camp-ops/community-agreements/{agreementId}/terminate"
        actor: CommunityLiaison
        preconditions:
          - "CommunityAgreement.agreement_status == ACTIVE"
        side_effects:
          - "CommunityAgreement.agreement_status -> TERMINATED"
          - "CASCADE 1 hop 2 trigger: every HostCommunityRecord on this agreement with ticketing_status IN {ON_SALE, SOLD_OUT} is driven to ticketing_status SUSPENDED"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /camp-ops/community-agreements/{agreementId}/terminate"
        actor: CommunityLiaison
        preconditions:
          - "CommunityAgreement.agreement_status == DRAFT"
        side_effects:
          - "CommunityAgreement.agreement_status -> TERMINATED"

  # ---------------------------------------------------------------------------
  - entity: Player
    initial_state: PENDING
    terminal_states: [TURNED_AWAY]
    note: "clearance_status mirrors PlayerProgramProfile.eligibility_status; the transitions here are the system-driven mirrors."
    transitions:
      - from: PENDING
        to: MEDICALS_COMPLETE
        trigger: "system event: a Physical on this Player is driven SCHEDULED -> PERFORMED"
        actor: system
        preconditions:
          - "Physical.status == PERFORMED"
        side_effects:
          - "Player.clearance_status -> MEDICALS_COMPLETE"
      - from: MEDICALS_COMPLETE
        to: CAMP_CLEARED
        trigger: "system event: the Player's PlayerProgramProfile is driven MEDICALS_PENDING -> CAMP_ELIGIBLE"
        actor: system
        preconditions:
          - "PlayerProgramProfile.eligibility_status == CAMP_ELIGIBLE"
        side_effects:
          - "Player.clearance_status -> CAMP_CLEARED"
      - from: MEDICALS_COMPLETE
        to: TURNED_AWAY
        trigger: "system event: a Physical on this Player is driven SCHEDULED -> PERFORMED with physical_result FAILED"
        actor: system
        preconditions:
          - "Physical.physical_result == FAILED"
        side_effects:
          - "Player.clearance_status -> TURNED_AWAY"
      - from: CAMP_CLEARED
        to: TURNED_AWAY
        trigger: "system event: a Physical on this Player is driven SCHEDULED -> PERFORMED with physical_result FAILED"
        actor: system
        preconditions:
          - "Physical.physical_result == FAILED"
        side_effects:
          - "Player.clearance_status -> TURNED_AWAY"
      - from: TURNED_AWAY
        to: PENDING
        trigger: "POST /camp-ops/players/{playerId}/clearance/pend"
        actor: TeamPhysician
        preconditions:
          - "Player.clearance_status == TURNED_AWAY"
          - "at least one Physical on this Player has status == PERFORMED and physical_result IN {PASSED, PASSED_WITH_MODIFICATION}"
        side_effects:
          - "Player.clearance_status -> PENDING"
          - "recompute PlayerProgramProfile.eligibility_status via the Physical reconcile rule"

  # ---------------------------------------------------------------------------
  - entity: PlayerRosterRecord
    initial_state: NRI
    terminal_states: [RELEASED, NRI_RELEASED, ASSIGNED_AAA, ASSIGNED_AA]
    note: "current_roster_status and roster_decision_status are two independent dimensions on the same row; both live in this machine. Assignment-finalizing decisions carry option handling and waivers."
    transitions:
      - from: NRI
        to: ACTIVE_ROSTER
        trigger: "POST /camp-ops/players/{playerId}/roster-record/select-active-roster"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_PENDING"
          - "Player.clearance_status == CAMP_CLEARED"
          - "PlayerProgramProfile.eligibility_status == CAMP_ELIGIBLE"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> ACTIVE_ROSTER"
      - from: NRI
        to: OPTIONED_MINORS
        trigger: "POST /camp-ops/players/{playerId}/roster-record/decide (decision_type=OPTION_ASSIGN)"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_PENDING"
          - "PlayerRosterRecord.option_eligibility == OPTION_AVAILABLE"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> OPTIONED_MINORS"
          - "recompute PlayerRosterRecord.option_eligibility via MajorLeagueOptionEligibilityCalculation"
          - "PlayerRosterRecord.decision_sequence += 1"
      - from: OPTIONED_MINORS
        to: OPTIONED_MINORS
        trigger: "POST /camp-ops/players/{playerId}/roster-record/decide (decision_type=OPTION_ASSIGN) issued while roster_decision_status == DECISION_VOIDED"
        actor: RosterManager
        note: "revision loop: a voided option decision can be re-issued once per camp."
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_VOIDED"
          - "PlayerRosterRecord.option_decisions_used <= 3"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> OPTIONED_MINORS"
          - "PlayerRosterRecord.roster_decision_status -> DECISION_PENDING"
          - "PlayerRosterRecord.decision_sequence += 1"
      - from: NRI
        to: NRI_RELEASED
        trigger: "POST /camp-ops/players/{playerId}/roster-record/decide (decision_type=NONROSTER_RELEASE)"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_PENDING"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> NRI_RELEASED"
          - "PlayerRosterRecord.decision_sequence += 1"
      - from: OPTIONED_MINORS
        to: DESIGNATED_FOR_ASSIGNMENT
        trigger: "POST /camp-ops/players/{playerId}/roster-record/decide (decision_type=OUTRIGHT_ASSIGN)"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_PENDING"
          - "PlayerRosterRecord.option_eligibility == NO_OPTION_REMAINING"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> DESIGNATED_FOR_ASSIGNMENT"
          - "PlayerRosterRecord.decision_sequence += 1"
      - from: DESIGNATED_FOR_ASSIGNMENT
        to: WAIVER_PENDING
        trigger: "POST /camp-ops/players/{playerId}/roster-record/request-waivers"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.current_roster_status == DESIGNATED_FOR_ASSIGNMENT"
          - "PlayerRosterRecord.waivers_required"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> WAIVER_PENDING"
      - from: WAIVER_PENDING
        to: WAIVER_CLAIMED
        trigger: "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome (outcome=CLAIMED)"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.current_roster_status IN {WAIVER_PENDING, WAIVER_CLAIMED}"
          - "PlayerRosterRecord.waivers_required"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> WAIVER_CLAIMED"
      - from: WAIVER_CLAIMED
        to: WAIVER_PENDING
        trigger: "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome (outcome=PENDING)"
        actor: RosterManager
        note: "cycle edge: a recorded claim can be un-recorded before the decision is finalized."
        preconditions:
          - "PlayerRosterRecord.current_roster_status == WAIVER_CLAIMED"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> WAIVER_PENDING"
      - from: WAIVER_PENDING
        to: DESIGNATED_FOR_ASSIGNMENT
        trigger: "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome (outcome=RETURNED)"
        actor: RosterManager
        note: "cycle edge: waivers returned to the club, so the player returns to awaiting an outright assignment."
        preconditions:
          - "PlayerRosterRecord.current_roster_status == WAIVER_PENDING"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> DESIGNATED_FOR_ASSIGNMENT"
      - from: WAIVER_PENDING
        to: RELEASED
        trigger: "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome (outcome=CLEARED)"
        actor: RosterManager
        preconditions:
          - "PlayerRosterRecord.current_roster_status == WAIVER_PENDING"
          - "PlayerRosterRecord.waivers_required"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> RELEASED"
      - from: RELEASED
        to: DESIGNATED_FOR_ASSIGNMENT
        trigger: "POST /camp-ops/players/{playerId}/roster-record/finalize-decision (decision_type=RESCIND_RELEASE)"
        actor: RosterManager
        note: "cycle edge: an un-finalized release can be rescinded back into the assignment path."
        preconditions:
          - "PlayerRosterRecord.roster_decision_status IN {DECISION_PENDING, DECISION_VOIDED}"
          - "PlayerRosterRecord.current_roster_status == RELEASED"
          - "PlayerRosterRecord.waivers_required"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> DESIGNATED_FOR_ASSIGNMENT"
          - "PlayerRosterRecord.roster_decision_status -> DECISION_PENDING"
          - "PlayerRosterRecord.decision_sequence += 1"
      - from: NRI
        to: ASSIGNED_AAA
        trigger: "POST /camp-ops/roster-records/{recordId}/break-out-camp (level=AAA)"
        actor: MinorLeagueCoordinator
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_FINALIZED"
          - "PlayerRosterRecord.current_roster_status == NRI"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> ASSIGNED_AAA"
          - "every GroupAssignment of this Player with assignment_status IN {PROVISIONAL, ACTIVE} is driven to WITHDRAWN"
          - "recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count and active_group_assignment_id"
      - from: OPTIONED_MINORS
        to: ASSIGNED_AAA
        trigger: "POST /camp-ops/roster-records/{recordId}/break-out-camp (level=AAA)"
        actor: MinorLeagueCoordinator
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_FINALIZED"
          - "PlayerRosterRecord.current_roster_status == OPTIONED_MINORS"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> ASSIGNED_AAA"
          - "every GroupAssignment of this Player with assignment_status IN {PROVISIONAL, ACTIVE} is driven to WITHDRAWN"
          - "recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"
      - from: DESIGNATED_FOR_ASSIGNMENT
        to: ASSIGNED_AA
        trigger: "POST /camp-ops/roster-records/{recordId}/break-out-camp (level=AA)"
        actor: MinorLeagueCoordinator
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_FINALIZED"
          - "PlayerRosterRecord.current_roster_status == DESIGNATED_FOR_ASSIGNMENT"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> ASSIGNED_AA"
          - "every GroupAssignment of this Player with assignment_status IN {PROVISIONAL, ACTIVE} is driven to WITHDRAWN"
          - "recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"
      - from: ASSIGNED_AAA
        to: ASSIGNED_AA
        trigger: "POST /camp-ops/roster-records/{recordId}/break-out-camp (level=AA)"
        actor: MinorLeagueCoordinator
        preconditions:
          - "PlayerRosterRecord.current_roster_status == ASSIGNED_AAA"
        side_effects:
          - "PlayerRosterRecord.current_roster_status -> ASSIGNED_AA"
      - from: DECISION_PENDING
        to: DECISION_FINALIZED
        trigger: "POST /camp-ops/players/{playerId}/roster-record/finalize-decision"
        actor: RosterManager
        note: "the decision dimension's forward edge; requires that some option path was already applied."
        preconditions:
          - "PlayerRosterRecord.current_roster_status IN {OPTIONED_MINORS, NRI_RELEASED, RELEASED, WAIVER_PENDING, WAIVER_CLAIMED}"
          - "PlayerRosterRecord.roster_decision_status == DECISION_PENDING"
          - "the finalizing actor's X-User-ID differs from the X-User-ID that last advanced current_roster_status on this record (segregation of duties)"
        side_effects:
          - "PlayerRosterRecord.roster_decision_status -> DECISION_FINALIZED"
          - "PlayerRosterRecord.decision_sequence += 1"
          - "PlayerRosterRecord.decision_finalized_at = current logical clock"
          - "if PlayerRosterRecord.current_roster_status == WAIVER_CLAIMED then option_decisions_used += 1"
          - "recompute PlayerRosterRecord.option_eligibility via MajorLeagueOptionEligibilityCalculation"
          - "recompute PlayerRosterRecord.waivers_required from option_eligibility"
      - from: DECISION_FINALIZED
        to: DECISION_VOIDED
        trigger: "POST /camp-ops/players/{playerId}/roster-record/void-decision"
        actor: RosterManager
        note: "the decision dimension's reverse edge; time-boxed to strictly before the player's current report date."
        preconditions:
          - "PlayerRosterRecord.roster_decision_status == DECISION_FINALIZED"
          - "PlayerRosterRecord.current_roster_status IN {OPTIONED_MINORS, NRI_RELEASED}"
          - "current logical clock is strictly before the owning Player's CampInvitation.report_current_date"
        side_effects:
          - "PlayerRosterRecord.roster_decision_status -> DECISION_VOIDED"
          - "PlayerRosterRecord.current_roster_status -> NRI"
          - "PlayerRosterRecord.option_decisions_used = max(0, option_decisions_used - 1)"
          - "recompute PlayerRosterRecord.option_eligibility via MajorLeagueOptionEligibilityCalculation (this is the VOIDED_OPTION_RESTORES_CHARGE variant)"
          - "recompute PlayerRosterRecord.waivers_required from option_eligibility"
          - "PlayerRosterRecord.decision_sequence += 1"

  # ---------------------------------------------------------------------------
  - entity: CampInvitation
    initial_state: ISSUED
    terminal_states: [NO_SHOW]
    note: "invitation_status drives onboarding; arrival_band is a derived read-only dimension on the same row."
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /camp-ops/camp-invitations/{invitationId}/acknowledge"
        actor: Player
        preconditions:
          - "CampInvitation.invitation_status == ISSUED"
          - "the acting Player.id equals CampInvitation.player_id"
        side_effects:
          - "CampInvitation.invitation_status -> ACKNOWLEDGED"
      - from: ACKNOWLEDGED
        to: ARRIVED
        trigger: "POST /camp-ops/camp-invitations/{invitationId}/arrive"
        actor: TravelCoordinator
        preconditions:
          - "CampInvitation.invitation_status == ACKNOWLEDGED"
          - "CampInvitation.invitation_letter_status == LETTER_SENT"
          - "CampInvitation.domestic_travel OR CampInvitation.travel_arrangement_status == ARRANGED"
          - "current logical clock <= CampInvitation.report_final_date"
        side_effects:
          - "CampInvitation.invitation_status -> ARRIVED"
          - "CampInvitation.actual_report_date = current logical clock"
          - "CampInvitation.arrival_band derived: EARLY if actual_report_date < report_current_date, MET_CURRENT if actual_report_date == report_current_date, MET_FINAL if report_current_date < actual_report_date <= report_final_date"
      - from: ARRIVED
        to: VISA_BLOCKED
        trigger: "POST /camp-ops/camp-invitations/{invitationId}/mark-visa-blocked"
        actor: TravelCoordinator
        preconditions:
          - "CampInvitation.invitation_status == ARRIVED"
          - "CampInvitation.domestic_travel == false"
        side_effects:
          - "CampInvitation.invitation_status -> VISA_BLOCKED"
          - "CampInvitation.travel_arrangement_status -> CANCELLED"
          - "CASCADE 1 hop 2: every TravelArrangement on this invitation with status IN {PLANNED, CONFIRMED} is driven to CANCELLED"
          - "CASCADE 1 hop 3: each such arrangement with funding_source == AGREEMENT_FUND reverses its post against HostCommunityRecord.ticketing_revenue_cents"
          - "CASCADE 1 hop 4: recompute HostCommunityRecord.sponsorship_recorded_cents, recognition_funded_cents, community_ledger_cents, ledger_gap_cents via RecognitionAllocationCalculation and TravelLiabilityWindowCalculation"
      - from: ISSUED
        to: NO_SHOW
        trigger: "system event: POST /camp-ops/ops-runs (run_type=invitation-report-sweep)"
        actor: system
        note: "stale-invitation sweep: fires only for invitations whose report window has closed with no arrival."
        preconditions:
          - "current logical clock > CampInvitation.report_final_date"
          - "CampInvitation.actual_report_date is null"
        side_effects:
          - "CampInvitation.invitation_status -> NO_SHOW"
          - "CASCADE 1 hop 1: CampInvitation.travel_arrangement_status -> CANCELLED"
          - "CASCADE 1 hop 2: every TravelArrangement on this invitation with status IN {PLANNED, CONFIRMED} is driven to CANCELLED"
          - "CASCADE 1 hop 3: each such arrangement with funding_source == AGREEMENT_FUND reverses its post against HostCommunityRecord.ticketing_revenue_cents"
          - "CASCADE 1 hop 4: recompute HostCommunityRecord.sponsorship_recorded_cents, recognition_funded_cents, community_ledger_cents, ledger_gap_cents; recompute CommunityAgreement.travel_liability_window_count, travel_liability_days, settlement_release_lag_days via TravelLiabilityWindowCalculation"

  # ---------------------------------------------------------------------------
  - entity: TravelArrangement
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement (confirm=true)"
        actor: TravelCoordinator
        preconditions:
          - "TravelArrangement.status == PLANNED"
          - "CampInvitation.invitation_letter_status == LETTER_SENT"
          - "TravelArrangement.departure_at <= CampInvitation.report_current_date"
          - "CampInvitation.domestic_travel OR TravelArrangement.departure_at <= CampInvitation.report_current_date - 5 days"
        side_effects:
          - "TravelArrangement.status -> CONFIRMED"
          - "CampInvitation.travel_arrangement_status -> ARRANGED"
          - "TravelArrangement.funding_source = AGREEMENT_FUND if the owning Complex has a CommunityAgreement with agreement_status == ACTIVE, else REIMBURSEMENT"
          - "TravelArrangement.reimbursement_status = LIABLE if travel_cost_cents > 0 else NOT_LIABLE"
          - "if funding_source == AGREEMENT_FUND: post agreement_funded_cents against HostCommunityRecord.ticketing_revenue_cents"
          - "recompute CommunityAgreement.travel_liability_window_count, travel_liability_days, settlement_release_lag_days via TravelLiabilityWindowCalculation"
      - from: CONFIRMED
        to: PLANNED
        trigger: "POST /camp-ops/travel-arrangements/{arrangementId}/revert"
        actor: TravelCoordinator
        note: "compensating action for PLANNED -> CONFIRMED; must restore every conserved quantity."
        preconditions:
          - "TravelArrangement.status == CONFIRMED"
        side_effects:
          - "TravelArrangement.status -> PLANNED"
          - "CampInvitation.travel_arrangement_status -> NOT_ARRANGED"
          - "reverse the HostCommunityRecord.ticketing_revenue_cents post by agreement_funded_cents"
          - "TravelArrangement.funding_source -> NONE and reimbursement_status -> NOT_LIABLE"
          - "recompute HostCommunityRecord.community_ledger_cents, ledger_gap_cents; recompute CommunityAgreement.travel_liability_window_count, travel_liability_days, settlement_release_lag_days"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /camp-ops/travel-arrangements/{arrangementId}/cancel"
        actor: TravelCoordinator
        preconditions:
          - "TravelArrangement.status == PLANNED"
        side_effects:
          - "TravelArrangement.status -> CANCELLED"
          - "if it was the invitation's only non-CANCELLED arrangement then CampInvitation.travel_arrangement_status -> NOT_ARRANGED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /camp-ops/travel-arrangements/{arrangementId}/cancel"
        actor: TravelCoordinator
        note: "compensating pair with PLANNED -> CONFIRMED: cancellation plus revert must leave community_ledger_cents where revert alone leaves it."
        preconditions:
          - "TravelArrangement.status == CONFIRMED"
        side_effects:
          - "TravelArrangement.status -> CANCELLED"
          - "reverse the HostCommunityRecord.ticketing_revenue_cents post by agreement_funded_cents"
          - "TravelArrangement.reimbursement_status -> VOIDED"
          - "recompute HostCommunityRecord.community_ledger_cents, ledger_gap_cents; recompute CommunityAgreement.travel_liability_window_count, travel_liability_days, settlement_release_lag_days"

  # ---------------------------------------------------------------------------
  - entity: Physical
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /camp-ops/physicals/{physicalId}/perform"
        actor: TeamPhysician
        preconditions:
          - "Physical.status == SCHEDULED"
          - "Physical.scheduled_visit_date <= current logical clock"
          - "CampInvitation.domestic_travel OR Physical.scheduled_visit_date <= CampInvitation.report_current_date - 5 days"
        side_effects:
          - "Physical.status -> PERFORMED"
          - "Physical.performed_at = current logical clock"
          - "Physical.physical_result = the payload result"
          - "CASCADE 4 hop 1: if physical_result IN {PASSED, PASSED_WITH_MODIFICATION} then PlayerProgramProfile.eligibility_status -> CAMP_ELIGIBLE, else PlayerProgramProfile.eligibility_status -> TURNED_AWAY"
          - "CASCADE 4 hop 2: Player.clearance_status -> CAMP_CLEARED or TURNED_AWAY to mirror the profile"
          - "CASCADE 4 hop 3: if TURNED_AWAY then every GroupAssignment of this Player with assignment_status IN {PROVISIONAL, ACTIVE} is driven to WITHDRAWN"
          - "CASCADE 4 hop 4: recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units; recompute PlayerProgramProfile.major_group_count / minor_group_count and active_group_assignment_id"
      - from: PERFORMED
        to: VOIDED
        trigger: "POST /camp-ops/physicals/{physicalId}/void"
        actor: TeamPhysician
        note: "compensating action for SCHEDULED -> PERFORMED."
        preconditions:
          - "Physical.status == PERFORMED"
        side_effects:
          - "Physical.status -> VOIDED"
          - "Physical.physical_result -> null"
          - "PlayerProgramProfile.eligibility_status -> MEDICALS_PENDING when no other Physical on this Player has status == PERFORMED"
          - "Player.clearance_status -> PENDING when no other Physical on this Player has status == PERFORMED"
          - "every GroupAssignment of this Player with assignment_status == PROVISIONAL is driven to WITHDRAWN"
          - "recompute Complex.reserved_major_units, reserved_minor_units; recompute PlayerProgramProfile.major_group_count / minor_group_count"

  # ---------------------------------------------------------------------------
  - entity: PlayerProgramProfile
    initial_state: MEDICALS_PENDING
    terminal_states: [TURNED_AWAY]
    note: "cycle: TURNED_AWAY -> MEDICALS_PENDING via reinstatement. rehab_program_phase is a parallel dimension on the same row and is moved only by side effects."
    transitions:
      - from: MEDICALS_PENDING
        to: CAMP_ELIGIBLE
        trigger: "system event: a Physical on this Player is driven SCHEDULED -> PERFORMED with physical_result IN {PASSED, PASSED_WITH_MODIFICATION}"
        actor: system
        preconditions:
          - "Physical.status == PERFORMED"
          - "Physical.physical_result IN {PASSED, PASSED_WITH_MODIFICATION}"
        side_effects:
          - "PlayerProgramProfile.eligibility_status -> CAMP_ELIGIBLE"
      - from: CAMP_ELIGIBLE
        to: TURNED_AWAY
        trigger: "system event: a Physical on this Player is driven SCHEDULED -> PERFORMED with physical_result FAILED"
        actor: system
        preconditions:
          - "Physical.status == PERFORMED"
          - "Physical.physical_result == FAILED"
        side_effects:
          - "PlayerProgramProfile.eligibility_status -> TURNED_AWAY"
      - from: CAMP_ELIGIBLE
        to: MEDICALS_PENDING
        trigger: "system event: the Player's only PERFORMED Physical is driven PERFORMED -> VOIDED"
        actor: system
        preconditions:
          - "no other Physical on this Player has status == PERFORMED"
        side_effects:
          - "PlayerProgramProfile.eligibility_status -> MEDICALS_PENDING"
      - from: TURNED_AWAY
        to: MEDICALS_PENDING
        trigger: "POST /camp-ops/players/{playerId}/program-profile/reinstate"
        actor: TeamPhysician
        note: "cycle edge back into the medical pipeline."
        preconditions:
          - "PlayerProgramProfile.eligibility_status == TURNED_AWAY"
          - "a Physical on this Player has status == PERFORMED and physical_result IN {PASSED, PASSED_WITH_MODIFICATION}"
        side_effects:
          - "PlayerProgramProfile.eligibility_status -> MEDICALS_PENDING"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count"
      - from: PHASE_ADVANCE_MIRROR
        to: PHASE_ADVANCE_MIRROR
        trigger: "system event: the Player's ThrowProgram is driven PHASE_3 -> PHASE_4"
        actor: system
        note: "documented reconciliation lag: this mirror is a no-op here; rehab_program_phase stays PHASE_3 until a WorkoutGroupSession is published for the player's active group."
        preconditions:
          - "ThrowProgram.program_phase == PHASE_4"
        side_effects:
          - "PlayerProgramProfile.rehab_program_phase is left at PHASE_3 (no write)"

  # ---------------------------------------------------------------------------
  - entity: WorkoutGroup
    initial_state: FORMING
    terminal_states: [DISBANDED]
    note: "branching fork-join: FORMING forks into PUBLISHED or DISBANDED, and PUBLISHED can still join DISBANDED."
    transitions:
      - from: FORMING
        to: PUBLISHED
        trigger: "POST /camp-ops/workout-groups/{groupId}/publish"
        actor: ComplexDirector
        preconditions:
          - "WorkoutGroup.group_status == FORMING"
          - "WorkoutGroup.assigned_units <= WorkoutGroup.capacity_units"
          - "owning Complex.field_maintenance_status != CLOSED"
          - "no GroupAssignment on this WorkoutGroup whose player's ThrowProgram.requirement_status == UNMET"
        side_effects:
          - "WorkoutGroup.group_status -> PUBLISHED"
          - "recompute Complex.posted_occupancy_units"
          - "recompute Complex.reserved_major_units and Complex.reserved_minor_units"
          - "recompute Complex.facility_posture via ComplexPostureSweepCalculation"
      - from: FORMING
        to: DISBANDED
        trigger: "POST /camp-ops/workout-groups/{groupId}/disband"
        actor: ComplexDirector
        preconditions:
          - "WorkoutGroup.group_status == FORMING"
        side_effects:
          - "WorkoutGroup.group_status -> DISBANDED"
          - "every GroupAssignment on this WorkoutGroup with assignment_status IN {PROVISIONAL, ACTIVE} is driven to WITHDRAWN"
          - "recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count for member players"
      - from: PUBLISHED
        to: DISBANDED
        trigger: "system event: the owning Complex is driven FIELD_RESTRICTED -> CLOSED or NORMAL -> CLOSED"
        actor: system
        note: "CASCADE 3 hop 2."
        preconditions:
          - "owning Complex.facility_posture == CLOSED"
        side_effects:
          - "WorkoutGroup.group_status -> DISBANDED"
          - "CASCADE 3 hop 3: for each member player of this DISBANDED WorkoutGroup, that player's PlayerProgramProfile.rehab_program_phase is reset to PHASE_1 (from PHASE_2 or PHASE_1, whichever it held) and active_group_assignment_id -> null"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count for member players"
          - "recompute Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units"

  # ---------------------------------------------------------------------------
  - entity: GroupAssignment
    initial_state: PROVISIONAL
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /camp-ops/group-assignments/{assignmentId}/call-up"
        actor: FieldCoordinator
        preconditions:
          - "GroupAssignment.assignment_status == PROVISIONAL"
          - "owning WorkoutGroup.group_status == PUBLISHED"
          - "Player.clearance_status == CAMP_CLEARED"
          - "no other GroupAssignment of this Player has assignment_status == ACTIVE"
        side_effects:
          - "GroupAssignment.assignment_status -> ACTIVE"
          - "recompute WorkoutGroup.assigned_units"
          - "recompute Complex.reserved_major_units and Complex.reserved_minor_units"
          - "recompute PlayerProgramProfile.active_group_assignment_id via GroupAssignmentSelector"
      - from: PROVISIONAL
        to: WITHDRAWN
        trigger: "POST /camp-ops/group-assignments/{assignmentId}/withdraw"
        actor: FieldCoordinator
        preconditions:
          - "GroupAssignment.assignment_status == PROVISIONAL"
        side_effects:
          - "GroupAssignment.assignment_status -> WITHDRAWN"
          - "GroupAssignment.withdrawal_reason = the payload reason"
          - "recompute WorkoutGroup.assigned_units"
          - "recompute Complex.reserved_major_units and Complex.reserved_minor_units"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count and active_group_assignment_id"
          - "if WorkoutGroup.assigned_units == 0 and WorkoutGroup.group_status == FORMING then WorkoutGroup.group_status -> DISBANDED"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /camp-ops/group-assignments/{assignmentId}/withdraw"
        actor: FieldCoordinator
        preconditions:
          - "GroupAssignment.assignment_status == ACTIVE"
        side_effects:
          - "GroupAssignment.assignment_status -> WITHDRAWN"
          - "recompute WorkoutGroup.assigned_units"
          - "recompute Complex.reserved_major_units and Complex.reserved_minor_units"
          - "recompute PlayerProgramProfile.major_group_count / minor_group_count and active_group_assignment_id"

  # ---------------------------------------------------------------------------
  - entity: ThrowProgram
    initial_state: PHASE_1
    terminal_states: [SHUTDOWN]
    note: "cyclic: PHASE_2 <-> PHASE_1, PHASE_3 -> PHASE_2, and SHUTDOWN -> PHASE_1 reinstatement."
    transitions:
      - from: PHASE_1
        to: PHASE_2
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=ADVANCE)"
        actor: PitchingCoordinator
        preconditions:
          - "ThrowProgram.program_phase == PHASE_1"
          - "ThrowProgram.cumulative_throws >= ThrowProgram.target_catch_play_throws"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_2"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status via ThrowingProgramRequirementCalculation"
          - "PlayerProgramProfile.rehab_program_phase -> PHASE_2"
      - from: PHASE_2
        to: PHASE_3
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=ADVANCE)"
        actor: PitchingCoordinator
        preconditions:
          - "ThrowProgram.program_phase == PHASE_2"
          - "ThrowProgram.cumulative_bullpen_sessions >= ThrowProgram.target_bullpen_sessions"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_3"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status via ThrowingProgramRequirementCalculation"
          - "PlayerProgramProfile.rehab_program_phase -> PHASE_3"
      - from: PHASE_2
        to: PHASE_1
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=REGRESS)"
        actor: PitchingCoordinator
        note: "cycle edge."
        preconditions:
          - "ThrowProgram.program_phase == PHASE_2"
          - "ThrowProgram.cumulative_throws < ThrowProgram.target_catch_play_throws"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_1"
          - "PlayerProgramProfile.rehab_program_phase -> PHASE_1"
      - from: PHASE_3
        to: PHASE_4
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=ADVANCE)"
        actor: PitchingCoordinator
        preconditions:
          - "ThrowProgram.program_phase == PHASE_3"
          - "ThrowProgram.requirement_status IN {NOT_REQUIRED, MET}"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_4"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status via ThrowingProgramRequirementCalculation"
          - "PlayerProgramProfile.rehab_program_phase is NOT advanced here (reconciliation lag: it mirrors only once a WorkoutGroupSession is published for the player's active group)"
      - from: PHASE_3
        to: PHASE_2
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=REGRESS)"
        actor: PitchingCoordinator
        note: "cycle edge, gated on the UNMET requirement."
        preconditions:
          - "ThrowProgram.program_phase == PHASE_3"
          - "ThrowProgram.requirement_status == UNMET"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_2"
          - "recompute ThrowProgram.requirement_status via ThrowingProgramRequirementCalculation"
      - from: PHASE_4
        to: PHASE_LIVE
        trigger: "POST /camp-ops/throw-programs/{programId}/advance-phase (direction=ADVANCE)"
        actor: PitchingCoordinator
        note: "CASCADE 2 origin: the phase advance itself causes the group assignment."
        preconditions:
          - "ThrowProgram.program_phase == PHASE_4"
          - "ThrowProgram.requirement_status != UNMET"
          - "Player.clearance_status == CAMP_CLEARED"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_LIVE"
          - "CASCADE 2 hop 1: recompute ThrowProgram.schedule_requirement_throws and requirement_status via ThrowingProgramRequirementCalculation (post-advance score)"
          - "CASCADE 2 hop 2: if requirement_status == MET, GroupAssignmentSelector picks the player's WorkoutGroup and a GroupAssignment is created with assignment_status PROVISIONAL and roster_bucket equal to that WorkoutGroup.roster_bucket"
          - "CASCADE 2 hop 3: recompute Complex.reserved_major_units and Complex.reserved_minor_units from the newly created assignment"
          - "CASCADE 2 hop 4: recompute PlayerProgramProfile.major_group_count / minor_group_count and active_group_assignment_id"
      - from: PHASE_LIVE
        to: SHUTDOWN
        trigger: "POST /camp-ops/throw-programs/{programId}/shutdown"
        actor: PitchingCoordinator
        preconditions:
          - "ThrowProgram.program_phase == PHASE_LIVE"
        side_effects:
          - "ThrowProgram.program_phase -> SHUTDOWN"
          - "ThrowProgram.requirement_status -> NOT_REQUIRED"
          - "PlayerProgramProfile.rehab_program_phase -> SHUTDOWN"
          - "every GroupAssignment of this Player with assignment_status == PROVISIONAL is driven to WITHDRAWN"
          - "recompute Complex.reserved_major_units, reserved_minor_units; recompute PlayerProgramProfile.major_group_count / minor_group_count"
      - from: SHUTDOWN
        to: PHASE_1
        trigger: "POST /camp-ops/throw-programs/{programId}/reinstate"
        actor: PitchingCoordinator
        note: "cycle edge back to the program start; the accumulator is cleared."
        preconditions:
          - "ThrowProgram.program_phase == SHUTDOWN"
          - "no GameSchedule on the owning Complex has gameday_status == GAMEDAY"
        side_effects:
          - "ThrowProgram.program_phase -> PHASE_1"
          - "ThrowProgram.cumulative_throws -> 0"
          - "ThrowProgram.cumulative_bullpen_sessions -> 0"
          - "recompute ThrowProgram.requirement_status via ThrowingProgramRequirementCalculation"
          - "PlayerProgramProfile.rehab_program_phase -> PHASE_1"

  # ---------------------------------------------------------------------------
  - entity: GameSchedule
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /camp-ops/games/{gameId}/publish"
        actor: ComplexDirector
        preconditions:
          - "GameSchedule.home_away == HOME OR GameSchedule.travel_radius_miles <= 250"
          - "owning Complex.facility_posture != CLOSED"
          - "no WorkoutGroupSession on the owning Complex collides with the candidate game interval at minute granularity: [session_date, session_end_datetime) and [game_datetime - DURATION_UNITS, game_datetime + DURATION_UNITS) must be disjoint after truncation to whole minutes, so a session ending exactly at the game interval start still conflicts"
        side_effects:
          - "GameSchedule.game_schedule_status -> PUBLISHED"
          - "if current logical clock is within [game_datetime - 1 day, game_datetime + 1 day] then GameSchedule.gameday_status -> GAMEDAY"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status for every ThrowProgram of a player in this game's GameParticipation rows"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /camp-ops/games/{gameId}/revert-to-draft"
        actor: ComplexDirector
        preconditions:
          - "GameSchedule.game_schedule_status == PUBLISHED"
          - "no GameParticipation on this game has participation_status == LOCKED"
        side_effects:
          - "GameSchedule.game_schedule_status -> DRAFT"
          - "GameSchedule.gameday_status -> NOT_GAMEDAY"
          - "recompute ThrowProgram.requirement_status for participating players"
      - from: PUBLISHED
        to: PLAYED
        trigger: "POST /camp-ops/games/{gameId}/record-result"
        actor: ComplexDirector
        preconditions:
          - "GameSchedule.game_schedule_status == PUBLISHED"
          - "current logical clock >= GameSchedule.game_datetime"
        side_effects:
          - "GameSchedule.game_schedule_status -> PLAYED"
          - "GameSchedule.gameday_status -> NOT_GAMEDAY"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status for participating players"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /camp-ops/games/{gameId}/cancel"
        actor: ComplexDirector
        preconditions:
          - "GameSchedule.game_schedule_status == DRAFT"
        side_effects:
          - "GameSchedule.game_schedule_status -> CANCELLED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /camp-ops/games/{gameId}/cancel"
        actor: ComplexDirector
        preconditions:
          - "GameSchedule.game_schedule_status == PUBLISHED"
        side_effects:
          - "GameSchedule.game_schedule_status -> CANCELLED"
          - "GameSchedule.gameday_status -> NOT_GAMEDAY"
          - "every GameParticipation on this game with participation_status IN {SCHEDULED, CONFIRMED} is driven to WITHDRAWN"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status for those players"

  # ---------------------------------------------------------------------------
  - entity: GameParticipation
    initial_state: SCHEDULED
    terminal_states: [LOCKED]
    note: "branching fork-join: SCHEDULED forks into CONFIRMED or WITHDRAWN, and CONFIRMED joins LOCKED."
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"
        actor: FieldCoordinator
        preconditions:
          - "owning GameSchedule.game_schedule_status == PUBLISHED"
          - "PlayerRosterRecord.split_squad_eligibility == HOME_AND_TRAVEL OR GameParticipation.squad_side == HOME_SQUAD"
          - "the player's ThrowProgram.requirement_status != UNMET"
          - "GameSchedule.home_away == HOME OR the player's ThrowProgram.requirement_status == MET"
          - "if the player's ThrowProgram.program_phase inbound value exceeds PHASE_2 then the player must be CAMP_CLEARED and, on an AWAY game, injury_travel_flag must be false"
        side_effects:
          - "GameParticipation.participation_status -> CONFIRMED"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status for this player via ThrowingProgramRequirementCalculation"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /camp-ops/games/{gameId}/participations/{participationId}/withdraw"
        actor: FieldCoordinator
        preconditions:
          - "GameParticipation.participation_status == SCHEDULED"
        side_effects:
          - "GameParticipation.participation_status -> WITHDRAWN"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /camp-ops/games/{gameId}/participations/{participationId}/withdraw"
        actor: FieldCoordinator
        preconditions:
          - "GameParticipation.participation_status == CONFIRMED"
        side_effects:
          - "GameParticipation.participation_status -> WITHDRAWN"
          - "recompute ThrowProgram.schedule_requirement_throws and requirement_status for this player"
      - from: CONFIRMED
        to: LOCKED
        trigger: "POST /camp-ops/games/{gameId}/package-roster"
        actor: ComplexDirector
        note: "scheduled action: the packaging window opens 6 hours before first pitch."
        preconditions:
          - "owning GameSchedule.game_schedule_status == PUBLISHED"
          - "GameParticipation.participation_status == CONFIRMED"
          - "current logical clock is within [game_datetime - 6 hours, game_datetime]"
        side_effects:
          - "GameParticipation.participation_status -> LOCKED"

  # ---------------------------------------------------------------------------
  - entity: Sponsorship
    initial_state: UNSETTLED
    terminal_states: [SETTLEMENT_VOIDED]
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /camp-ops/sponsorships/{sponsorshipId}/settle"
        actor: CommunityLiaison
        preconditions:
          - "Sponsorship.reconciliation_status == UNSETTLED"
          - "Sponsorship.received_amount_cents >= Sponsorship.committed_amount_cents"
        side_effects:
          - "Sponsorship.reconciliation_status -> SETTLED"
          - "Sponsorship.fulfillment_completed -> true"
          - "recompute HostCommunityRecord.sponsorship_recorded_cents, sponsorship_revenue_cents, community_ledger_cents, ledger_gap_cents"
      - from: SETTLED
        to: RECOGNIZED
        trigger: "POST /camp-ops/sponsorships/{sponsorshipId}/recognize"
        actor: CommunityLiaison
        preconditions:
          - "Sponsorship.reconciliation_status == SETTLED"
        side_effects:
          - "Sponsorship.reconciliation_status -> RECOGNIZED"
          - "recompute HostCommunityRecord.recognition_funded_cents via RecognitionAllocationCalculation"
          - "recompute HostCommunityRecord.ledger_gap_cents"
      - from: SETTLED
        to: SETTLEMENT_VOIDED
        trigger: "POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement"
        actor: CommunityLiaison
        note: "CASCADE 5 origin: settlement reversal rolls back the agreement and its posture."
        preconditions:
          - "Sponsorship.reconciliation_status == SETTLED"
          - "owning Complex.facility_posture == NORMAL"
        side_effects:
          - "Sponsorship.reconciliation_status -> SETTLEMENT_VOIDED"
          - "Sponsorship.fulfillment_completed -> false"
          - "CASCADE 5 hop 1: recompute HostCommunityRecord.sponsorship_recorded_cents, sponsorship_revenue_cents, community_ledger_cents, ledger_gap_cents"
          - "CASCADE 5 hop 2: recompute HostCommunityRecord.recognition_funded_cents via RecognitionAllocationCalculation"
          - "CASCADE 5 hop 3: recompute CommunityAgreement.agreement_status back to DRAFT when no HostCommunityRecord on it has ticketing_status == ON_SALE"
      - from: RECOGNIZED
        to: SETTLEMENT_VOIDED
        trigger: "POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement"
        actor: CommunityLiaison
        note: "compensating pair with the settle + recognize chain; the recognition post is reversed too."
        preconditions:
          - "Sponsorship.reconciliation_status == RECOGNIZED"
          - "owning Complex.facility_posture == NORMAL"
        side_effects:
          - "Sponsorship.reconciliation_status -> SETTLEMENT_VOIDED"
          - "Sponsorship.fulfillment_completed -> false"
          - "recompute HostCommunityRecord.recognition_funded_cents excluding this sponsorship's post"
          - "recompute HostCommunityRecord.sponsorship_recorded_cents, sponsorship_revenue_cents, community_ledger_cents, ledger_gap_cents"
          - "CASCADE 5 hop 3: recompute CommunityAgreement.agreement_status back to DRAFT when no HostCommunityRecord on it has ticketing_status == ON_SALE"

  # ---------------------------------------------------------------------------
  - entity: HostCommunityRecord
    initial_state: NOT_OPEN
    terminal_states: [SUSPENDED]
    transitions:
      - from: NOT_OPEN
        to: ON_SALE
        trigger: "POST /camp-ops/host-community-records/{recordId}/open-ticketing"
        actor: CommunityLiaison
        preconditions:
          - "owning CommunityAgreement.agreement_status == ACTIVE"
          - "current logical clock >= CommunityAgreement.lease_start_date"
          - "current logical clock < CommunityAgreement.lease_end_date"
        side_effects:
          - "HostCommunityRecord.ticketing_status -> ON_SALE"
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system event: POST /camp-ops/host-community-records/{recordId}/sell-tickets raises tickets_sold to the sellout capacity"
        actor: system
        preconditions:
          - "HostCommunityRecord.ticketing_status == ON_SALE"
          - "HostCommunityRecord.tickets_sold >= CommunityAgreement.ticket_sellout_capacity"
        side_effects:
          - "HostCommunityRecord.ticketing_status -> SOLD_OUT"
          - "recompute HostCommunityRecord.ticketing_revenue_cents and community_ledger_cents"
      - from: ON_SALE
        to: NOT_OPEN
        trigger: "POST /camp-ops/host-community-records/{recordId}/close-ticketing"
        actor: CommunityLiaison
        note: "compensating action for NOT_OPEN -> ON_SALE."
        preconditions:
          - "HostCommunityRecord.ticketing_status == ON_SALE"
          - "HostCommunityRecord.tickets_sold == 0"
        side_effects:
          - "HostCommunityRecord.ticketing_status -> NOT_OPEN"
      - from: ON_SALE
        to: SUSPENDED
        trigger: "system event: the owning CommunityAgreement is driven ACTIVE -> TERMINATED"
        actor: system
        preconditions:
          - "CommunityAgreement.agreement_status == TERMINATED"
        side_effects:
          - "HostCommunityRecord.ticketing_status -> SUSPENDED"
      - from: SOLD_OUT
        to: SUSPENDED
        trigger: "system event: the owning CommunityAgreement is driven ACTIVE -> TERMINATED"
        actor: system
        preconditions:
          - "CommunityAgreement.agreement_status == TERMINATED"
        side_effects:
          - "HostCommunityRecord.ticketing_status -> SUSPENDED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observable true races)
# =============================================================================
concurrency_rules:
  - rule_id: group-assignment-create-stale-group
    parent_entity: WorkoutGroup
    write_endpoint: "POST /camp-ops/workout-groups/{groupId}/assignments"
    occ_field: "expected_group_version"
    description: |
      Creating a GroupAssignment against a WorkoutGroup whose version has
      advanced since the client last observed it is rejected. This captures the
      case where a withdrawal has just freed a seat on the group (which
      legitimately changes the group's capacity position) and the current
      writer's view of the group is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: travel-arrangement-confirm-stale-invitation
    parent_entity: CampInvitation
    write_endpoint: "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement"
    occ_field: "expected_invitation_version"
    description: |
      Confirming a TravelArrangement against a CampInvitation whose version has
      advanced since the client last observed it is rejected. This captures the
      case where the invitation's letter has just been sent or the invitation
      has just arrived (which legitimately changes the invitation's version) and
      the current writer's view of the invitation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: game-participation-confirm-stale-game
    parent_entity: GameSchedule
    write_endpoint: "POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"
    occ_field: "expected_game_version"
    description: |
      Confirming a GameParticipation against a GameSchedule whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another participation on the same game has just been confirmed
      (which legitimately advances the game's version) and the current writer's
      view of the game is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (11 rules)
# =============================================================================
calculations:

  - name: ComplexPostureSweepCalculation
    trigger: "POST /camp-ops/complexes/{complexId}/posture-sweeps, and as a side effect of every GroupAssignment / WorkoutGroup / Complex-field-maintenance mutation"
    algorithm: threshold
    formula: |
      effective_capacity    = facility_capacity_units - maintenance_block_units
      maintenance_block_units = 0                                  if field_maintenance_status == OPEN
                              = ceil(facility_capacity_units / 2)   if field_maintenance_status == HALF_FIELD
                              = facility_capacity_units            if field_maintenance_status == CLOSED

      # evaluation order is pinned: compare against effective_capacity FIRST
      if posted_occupancy_units >= effective_capacity:                 facility_posture = CLOSED
      elif posted_occupancy_units >= floor(effective_capacity * 95 / 100): facility_posture = FIELD_RESTRICTED
      else:                                                            facility_posture = NORMAL

      contention_flagged = (posted_occupancy_units > facility_capacity_units)
      posture_sweep_index += 1
    input_set: "posted_occupancy_units sums capacity_units over WorkoutGroups on this Complex with group_status == PUBLISHED only; FORMING and DISBANDED groups contribute 0."
    constants:
      RESTRICTED_PCT_OF_EFFECTIVE: 95
      MINOR_LEAGUE_MAJOR_BUCKETS: [MAJOR, MINOR]
    precision: "integer comparison; the 95% threshold uses floor() (never round-half-up)"
    variants:
      - name: CLOSED_STICKY
        when: "continuation sweeps after facility_posture has already been driven to CLOSED"
        difference: "A sweep may only move CLOSED -> field_maintenance_status==CLOSED is permanent until a field-maintenance OPEN action is issued from FIELD_RESTRICTED; the sweep itself can never move CLOSED down to FIELD_RESTRICTED or NORMAL."
      - name: NORMAL_WITH_HEADROOM_GUARD
        when: "field-maintenance sweeps on a SHARED-season complex"
        difference: "Adds an extra FIELD_RESTRICTED result when posted_occupancy_units > facility_capacity_units even if effective_capacity is larger (i.e. compares the raw posting against the raw capacity, ignoring the maintenance block)."

  - name: FacilityContentionPosture
    trigger: "POST /camp-ops/complexes/{complexId}/posture-sweeps"
    algorithm: threshold
    formula: |
      denominator   = facility_capacity_units - maintenance_block_units   # same maintenance_block_units as ComplexPostureSweepCalculation
      ratio_permille = (posted_occupancy_units * 1000) // max(1, denominator)
      if ratio_permille >= 1000:  contention_posture = OVER
      elif ratio_permille >= 950: contention_posture = TIGHT
      elif ratio_permille >= 900: contention_posture = WATCH
      else:                       contention_posture = NORMAL
    input_set: "Same posted_occupancy_units aggregation as ComplexPostureSweepCalculation (PUBLISHED groups only)."
    constants:
      OVER_PERMILLE: 1000
      TIGHT_PERMILLE: 950
      WATCH_PERMILLE: 900
    precision: "integer permille, floor division; the reported posture is an enum, not the raw ratio"
    variants:
      - name: CONTENTION_SPIKE
        when: "SHARED-season complexes"
        difference: "Overrides NORMAL to TIGHT when at least one WorkoutGroup on this Complex has group_status == PUBLISHED and assigned_units >= capacity_units, even though the aggregate ratio stays under 950."

  - name: RecognitionAllocation
    trigger: "POST /camp-ops/sponsorships/{sponsorshipId}/recognize, and as a side effect of POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement and of roster-decision/finalize-decision"
    algorithm: weighted_scoring
    formula: |
      # per player p in the recognition corpus:
      weight_sum_p        = 5 * p.major_group_count + 2 * p.minor_group_count
      match_points_p      = (weight_sum_p * TIER_MULTIPLIER_PERMILLE[sponsor_tier]) // MATCH_POINTS_DIVISOR
      commitment_points_p = min(committed_amount_cents // COMMITMENT_POINTS_DIVISOR, COMMITMENT_POINTS_CAP)
      max_jv_points_p     = JV_POINTS_CAP - REHAB_POINTS_DEBIT * p.active_rehab_assignment_count
      jv_points_p         = min(match_points_p + commitment_points_p, max(0, max_jv_points_p))
      # then, per recognized sponsorship, with the corpus-equivalent counts summed once:
      major_equivalents   = sum over corpus of p.major_group_count
      minor_equivalents   = sum over corpus of p.minor_group_count
      recognition_cents   = (sponsorship_major_league_base_cents * major_equivalents * jv_points_p
                             + sponsorship_minor_league_base_cents * minor_equivalents * jv_points_p) // FINAL_DIVISOR
      recognition_funded_cents += recognition_cents
    input_set: "The recognition corpus is every GROUP_CAMP entity with major_group_count + minor_group_count >= 1. Entities with both counts 0 or negative are EXCLUDED. If the corpus is empty, recognition_cents = 0 and the recognition is still recorded. jv_points_p is read from the corpus's single member when the corpus has exactly one member; for a multi-member corpus the recognition is computed per member and summed."
    constants:
      TIER_MULTIPLIER_PERMILLE: { LOCAL: 100, REGIONAL: 130, NATIONAL: 165 }
      MATCH_POINTS_DIVISOR: 10
      COMMITMENT_POINTS_DIVISOR: 100
      FINAL_DIVISOR: 1000
      JV_POINTS_CAP: 5000
      REHAB_POINTS_DEBIT: 100
      COMMITMENT_POINTS_CAP: 2000
      MAJOR_WEIGHT: 5
      MINOR_WEIGHT: 2
    precision: "2 decimal places is N/A — recognition_cents is integer cents, single floor division at the end"
    variants:
      - name: RECOGNITION_RAISE
        when: "POST /camp-ops/sponsorships/{sponsorshipId}/recognize"
        difference: "Adds recognition_cents to recognition_funded_cents; afterward recognition_funded_cents - community_ledger_cents changes by exactly the raise."
      - name: RECOGNITION_VOID
        when: "POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement"
        difference: "Subtracts the same recognition_cents that RECOGNITION_RAISE added, computed from the corpus state at void time. For identical corpus inputs the two variants produce equal-and-opposite deltas, so recognition_funded_cents returns to its pre-raise value."

  - name: TravelCostAllocation
    trigger: "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement (confirm=true)"
    algorithm: tiered_pricing
    formula: |
      band_key = 100  if travel_radius_miles <= 100
               = 300  if travel_radius_miles <= 300
               = 1000 otherwise
      discount_permille = MODE_RADIUS_DISCOUNT[mode][band_key]
      agreement_funded_cents = travel_cost_cents * (1000 - discount_permille) // 1000   # PINNED ORDER: scale first, then floor-divide once
      reimbursement_cents    = travel_cost_cents * (1000 - HOLDBACK_PERMILLE) // 1000   # REIMBURSEMENT variant only
    input_set: "One TravelArrangement at confirm time; travel_radius_miles and mode come from the arrangement row, travel_cost_cents from the request."
    constants:
      MODE_RADIUS_DISCOUNT:
        AUTO: { 100: 0, 300: 10, 1000: 20 }
        AIR:  { 100: 0, 300: 5,  1000: 10 }
        BUS:  { 100: 0, 300: 15, 1000: 30 }
      HOLDBACK_PERMILLE: 50
    precision: "integer cents; exactly one floor division, applied after the per-mille scale"
    variants:
      - name: AGREEMENT_FUND_PER_LEG
        when: "funding_source == AGREEMENT_FUND"
        difference: "Charges agreement_funded_cents to the community ledger and applies MODE_RADIUS_DISCOUNT to the raw cost."
      - name: REIMBURSEMENT_HOLDBACK
        when: "funding_source == REIMBURSEMENT (agreement not ACTIVE)"
        difference: "Applies no radius discount at all and instead withholds HOLDBACK_PERMILLE from the raw cost, producing a strictly smaller number than AGREEMENT_FUND_PER_LEG for the same raw cost. ReimbursementStatus becomes LIABLE when reimbursement_cents > 0."

  - name: TravelLiabilityWindowCalculation
    trigger: "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement, POST /camp-ops/travel-arrangements/{arrangementId}/revert, POST /camp-ops/travel-arrangements/{arrangementId}/cancel, and the invitation-report sweep"
    algorithm: interval_merge
    formula: |
      liability_rows = TravelArrangement rows under this agreement whose reimbursement_status is in LIABILITY_SET
      travel_liability_days         = sum over liability_rows of business_days(row.departure_at, CommunityAgreement.lease_end_date)
      travel_liability_window_count = count of liability_rows
      settlement_release_lag_days   = business_days(lease_end_date, the latest sponsor settle / recognize / void-settlement instant under this agreement)
                                      = 0 when no sponsorship under this agreement has been acted on
    input_set: "LIABILITY_SET is [LIABLE, VOIDED] under the default variant and [LIABLE] under VOID_EXCLUDED. Rows with reimbursement_status == NOT_LIABLE never enter."
    constants:
      LIABILITY_SET: [LIABLE, VOIDED]
      LIABILITY_SET_END_INCLUSIVE: true
    precision: "business_days counts whole days, start-inclusive and end-exclusive; settlement_release_lag_days is an integer day count"
    variants:
      - name: CURRENT
        when: "live recomputation while the arrangement has not been cancelled"
        difference: "LIABILITY_SET == [LIABLE, VOIDED], so a cancelled arrangement still occupies a liability window."
      - name: VOID_EXCLUDED
        when: "recomputation after POST /camp-ops/travel-arrangements/{arrangementId}/cancel"
        difference: "LIABILITY_SET == [LIABLE], so the cancelled arrangement drops out and travel_liability_window_count decreases by exactly 1."

  - name: MajorLeagueOptionEligibilityCalculation
    trigger: "POST /camp-ops/players/{playerId}/roster-record/decide, /finalize-decision and /void-decision"
    algorithm: threshold
    formula: |
      charges_base       = OPTION_EQUIVALENT_YEARS_OFFSET + Player.minor_league_option_years_used
      decision_burden    = min(PlayerRosterRecord.option_decisions_used, OPTION_DECISION_BURDEN_CAP)
      charges            = charges_base + decision_burden
      option_eligibility = OPTION_AVAILABLE      if charges < OPTION_ELIGIBILITY_THRESHOLD
                         = NO_OPTION_REMAINING   otherwise
      waivers_required   = (option_eligibility == NO_OPTION_REMAINING)
    input_set: "Reads Player.minor_league_option_years_used and PlayerRosterRecord.option_decisions_used as they stand AFTER the triggering transition's own counter update."
    constants:
      OPTION_EQUIVALENT_YEARS_OFFSET: 0
      OPTION_DECISION_BURDEN_CAP: 2
      OPTION_ELIGIBILITY_THRESHOLD: 3
    precision: "integer comparison, exact boundary at charges == 3 (3 is NO_OPTION_REMAINING, 2 is OPTION_AVAILABLE)"
    variants:
      - name: BASE_ALLOWANCE
        when: "OPTION_ASSIGN decisions, OUTRIGHT_ASSIGN decisions and post-finalize recomputation"
        difference: "Uses charges as written above."
      - name: VOIDED_OPTION_RESTORES_CHARGE
        when: "POST /camp-ops/players/{playerId}/roster-record/void-decision"
        difference: "Uses restored_charges = max(0, charges - 1) instead of charges, so a void immediately after a finalize can flip NO_OPTION_REMAINING back to OPTION_AVAILABLE and clear waivers_required."

  - name: WaiverClaimCountdownCalculation
    trigger: "POST /camp-ops/players/{playerId}/roster-record/request-waivers and /finalize-decision"
    algorithm: aggregation
    formula: |
      if not PlayerRosterRecord.waivers_required:
          outcome = NOT_REQUIRED; effective_claim_days = 0
      else:
          rule_days = WAIVER_RULE_DAYS_LONG if Player.minor_league_option_years_used >= 4 else WAIVER_RULE_DAYS_SHORT
          liability_sum = sum of TravelCostAllocation.agreement_funded_cents over this player's TRAVEL_LIABILITY_ROWS
          bump = ceil(liability_sum / WAIVER_BUMP_DIVISOR_CENTS)
          prior = count of this player's FINALIZED_CLAIM_WINDOW rows
          effective_claim_days = max(0, min(rule_days + bump, WAIVER_CLAIM_CAP_DAYS) - prior)
    input_set: "TRAVEL_LIABILITY_ROWS = the player's TravelArrangement rows with reimbursement_status IN {LIABLE, VOIDED}, ordered by created_at ASC then by departure_at ASC (never by id). FINALIZED_CLAIM_WINDOW = PlayerRosterRecord rows for this player whose decision_finalized_at is non-null AND whose current_roster_status was WAIVER_CLAIMED at finalize time."
    constants:
      WAIVER_RULE_DAYS_LONG: 15
      WAIVER_RULE_DAYS_SHORT: 8
      WAIVER_BUMP_DIVISOR_CENTS: 30000
      WAIVER_CLAIM_CAP_DAYS: 21
      WAIVERS_REQUIRED_CREDIT_THRESHOLD: 5
      MINOR_BUCKET_CREDIT: 3
      MAJOR_BUCKET_CREDIT: 5
    precision: "integer days; waivers_required uses a 3-day credit per row for MINOR bucket rows, 5 for MAJOR bucket rows, and waivers_required = true only once 3*minor_trigger_count + 5*major_trigger_count >= WAIVERS_REQUIRED_CREDIT_THRESHOLD"
    variants:
      - name: EFFECTIVE_CLAIM_WINDOW
        when: "request-waivers records the window; finalize-decision consumes it"
        difference: "A waiver claimed inside the window finalizes with current_roster_status == WAIVER_CLAIMED; the same claim attempted after effective_claim_days have elapsed would land on outcome == EXPIRED."
      - name: CLAIM_WINDOW_EXPIRED
        when: "the logical clock has advanced past rule_days + bump days from the request"
        difference: "outcome == EXPIRED and finalizing is refused with ERR_WAIVER_WINDOW_EXPIRED instead of routing to WAIVER_CLAIMED."

  - name: ThrowingProgramRequirementCalculation
    trigger: "every POST /camp-ops/throw-programs/{programId}/sessions, /advance-phase, /shutdown and /reinstate, and every game publish/record-result/confirm/cancel that touches a participating pitcher"
    algorithm: constraint_propagation
    formula: |
      accumulated_throws = sum of ThrowProgramSession.play_catch_throws for sessions with session_kind == CATCH_PLAY, in chronological order of (logged_at ASC, session_sequence ASC)
      accumulated_bullpen = count of ThrowProgramSession rows with session_kind == BULLPEN
      cumulative_throws          = accumulated_throws
      cumulative_bullpen_sessions = accumulated_bullpen
      age_factor         = min(AGE_CAP_DAYS, business_days(ThrowProgram.created_at, current logical clock))
      day_of_game_bump   = 0 if no GameSchedule on the owning Complex has gameday_status == GAMEDAY
                         = 0 if this player's GameParticipation on that gameday has throw_count > 0
                         = DAY_OF_GAME_REQUIRED_THROWS otherwise
      base_workload      = cumulative_throws + age_factor
      schedule_requirement_throws = base_workload + day_of_game_bump
      programmed_max_catch = (target_catch_play_throws * PHASE_CATCH_ALLOWANCE_PERMILLE[program_phase]) // 100
      step_tolerance       = (target_catch_play_throws // 10) * STEP_TOLERANCE_PER_UNIT
      requirement_status = MET     if programmed_max_catch <= schedule_requirement_throws <= programmed_max_catch + step_tolerance
                         = UNMET   otherwise
                         = NOT_REQUIRED if program_phase == SHUTDOWN
    input_set: "ThrowProgramSession rows for this program only, session_kind IN {CATCH_PLAY, BULLPEN}; sessions with session_status == VOIDED are excluded. The gameday lookup uses the owning Complex of the ThrowProgram's GroupAssignment."
    constants:
      PHASE_CATCH_ALLOWANCE_PERMILLE: { PHASE_1: 100, PHASE_2: 105, PHASE_3: 125, PHASE_4: 150, PHASE_LIVE: 175, SHUTDOWN: 0 }
      STEP_TOLERANCE_PER_UNIT: 2
      DAY_OF_GAME_REQUIRED_THROWS: 30
      AGE_CAP_DAYS: 7
    precision: "integer throws; the allowance band is inclusive on BOTH ends (== programmed_max_catch is MET, == programmed_max_catch + step_tolerance is MET, and one throw either side is UNMET)"
    variants:
      - name: PHASE_BOUNDED
        when: "program_phase IN {PHASE_1, PHASE_2, PHASE_3, PHASE_4}"
        difference: "Uses the phase's own PHASE_CATCH_ALLOWANCE_PERMILLE entry; the same accumulated workload can be UNMET in PHASE_4 and MET in PHASE_LIVE because the allowance band moves with the phase."
      - name: LIVE_UNBOUNDED
        when: "program_phase == PHASE_LIVE"
        difference: "Uses PHASE_LIVE's 175 per-mille allowance; because the band is wider and higher, a workload that was UNMET at PHASE_4 becomes MET the moment the phase advances, with no new session logged."

  - name: SplitSquadEligibilityCalculation
    trigger: "POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"
    algorithm: threshold
    formula: |
      if the player has a TravelArrangement with status == CONFIRMED and travel_radius_miles <= TRAVEL_RADIUS_LIMIT_MILES:
          split_squad_eligibility = HOME_AND_TRAVEL
      else:
          split_squad_eligibility = HOME_ONLY
      away_game_permitted = (split_squad_eligibility == HOME_AND_TRAVEL)
                            OR (GameSchedule.travel_radius_miles <= TRAVEL_RADIUS_LIMIT_MILES)
    input_set: "The player's CONFIRMED TravelArrangement rows only; PLANNED and CANCELLED rows are ignored. The most recent CONFIRMED row by created_at ASC is the one consulted when several exist."
    constants:
      TRAVEL_RADIUS_LIMIT_MILES: 250
    precision: "miles compared as numbers; exactly 250 is inside the limit, 250.01 is outside"
    variants:
      - name: HOME_ONLY_DEFAULT
        when: "no CONFIRMED arrangement at or under the limit exists"
        difference: "split_squad_eligibility == HOME_ONLY, so an AWAY participation is refused unless the game itself is within the travel radius."
      - name: HOME_AND_TRAVEL_GRANTED
        when: "a CONFIRMED arrangement at or under the limit exists"
        difference: "split_squad_eligibility == HOME_AND_TRAVEL, so the AWAY participation is permitted regardless of the game's own travel radius."

  - name: SpringReportDateCalculation
    trigger: "POST /camp-ops/players/{playerId}/camp-invitations"
    algorithm: chronological
    formula: |
      report_base_date    = request report_base_date, defaulting to 2026-02-10T00:00:00Z
      lead_days           = 14 if Player.position_code IN {P, C} else 21
      invitation_extra    = 7 if invitation_kind == GUEST_INSTRUCTOR else 0
      report_current_date = (report_base_date - (lead_days + invitation_extra) days) truncated to 00:00:00Z
      final_grace_days    = 14 + ceil(3 * PlayerProgramProfile.active_rehab_assignment_count / 10)
      report_final_date   = report_current_date + final_grace_days days
      arrival_band (read-only, derived) =
          EARLY       if actual_report_date < report_current_date
          MET_CURRENT if actual_report_date == report_current_date
          MET_FINAL   if report_current_date < actual_report_date <= report_final_date
          MISSED_WINDOW otherwise
    input_set: "Reads Player.position_code and PlayerProgramProfile.active_rehab_assignment_count at invite time; the report dates are frozen once written and are not recomputed when the profile changes."
    constants:
      DEFAULT_REPORT_BASE_DATE: "2026-02-10T00:00:00Z"
      PITCHER_CATCHER_LEAD_DAYS: 14
      POSITION_PLAYER_LEAD_DAYS: 21
      GUEST_INSTRUCTOR_EXTRA_DAYS: 7
      FINAL_GRACE_BASE_DAYS: 14
      REHAB_GRACE_DIVISOR: 10
    precision: "whole days, UTC midnight truncation; arrival_band uses half-open comparisons on the invariant side"
    variants:
      - name: PITCHER_CATCHER_REPORT
        when: "Player.position_code IN {P, C}"
        difference: "lead_days == 14, so report_current_date sits 7 days later than the position-player variant for the same base date."
      - name: POSITION_PLAYER_REPORT
        when: "Player.position_code IN {INF, OF, DH}"
        difference: "lead_days == 21, so report_current_date sits 7 days earlier and the MET_CURRENT instant differs accordingly."

  - name: TravelFundingSourceCalculation
    trigger: "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement (confirm=true) and /revert"
    algorithm: waterfall_allocation
    formula: |
      if the owning Complex (Player.home_complex_id) has a CommunityAgreement with agreement_status == ACTIVE:
          funding_source = AGREEMENT_FUND
          agreement_funded_cents = TravelCostAllocation.agreement_funded_cents
          reimbursement_cents = 0
      elif travel_cost_cents > 0:
          funding_source = REIMBURSEMENT
          agreement_funded_cents = 0
          reimbursement_cents = TravelCostAllocation.reimbursement_cents
      else:
          funding_source = NONE
          agreement_funded_cents = 0
          reimbursement_cents = 0
      reimbursement_status = LIABLE if travel_cost_cents > 0 else NOT_LIABLE
    input_set: "Candidate agreements are the owning Complex's CommunityAgreement rows with agreement_status == ACTIVE. When several exist they are considered in created_at ASC order and the FIRST is used."
    constants:
      FUNDING_ORDER: [AGREEMENT_FUND, REIMBURSEMENT, NONE]
    precision: "integer cents"
    variants:
      - name: AGREEMENT_BACKED
        when: "an ACTIVE CommunityAgreement exists on the owning Complex"
        difference: "The full agreement_funded_cents is posted against HostCommunityRecord.ticketing_revenue_cents and reimbursement_status stays NOT_LIABLE."
      - name: CLUB_REIMBURSED
        when: "no ACTIVE CommunityAgreement exists"
        difference: "Nothing is posted against the community ledger; the club carries reimbursement_cents and reimbursement_status == LIABLE."

  - name: MinorLeagueAssignmentCalculation
    trigger: "POST /camp-ops/players/{playerId}/minor-league-assignments, POST /camp-ops/minor-league-assignments/{assignmentId}/settle and /void-breakout"
    algorithm: aggregation
    formula: |
      end_dt            = the player's owning Complex CommunityAgreement.lease_end_date
      travel_day_count  = business_days(effective_datetime, end_dt)      # start-inclusive, end-exclusive; 0 when end_dt <= effective_datetime
      break_out_liability_cents = sum of TravelCostAllocation.agreement_funded_cents over the player's TRAVEL_LIABILITY_ROWS
      # TRAVEL_LIABILITY_ROWS = the player's TravelArrangement rows with reimbursement_status IN {LIABLE, VOIDED},
      # ordered by created_at ASC then departure_at ASC (never by id).
      assignment_status = PENDING on create; SETTLED on settle; BREAKOUT_VOIDED on void-breakout
      settlement_actor_id = the acting X-User-ID on settle; cleared on void-breakout
    input_set: "Reads the player's travel arrangements and the owning complex's active agreement at evaluation time. Rows with reimbursement_status NOT_LIABLE contribute 0."
    constants:
      BREAKOUT_SETTLEMENT_DAYS: 14
    precision: "integer cents and whole days; exactly one summation, no per-row rounding"
    variants:
      - name: BREAKOUT_ASSIGNMENT
        when: "the assignment is being created or settled forward"
        difference: "break_out_liability_cents accumulates the player's outstanding agreement-funded travel; travel_day_count is the remaining window to lease end."
      - name: BREAKOUT_VOIDED
        when: "POST /camp-ops/minor-league-assignments/{assignmentId}/void-breakout"
        difference: "Re-evaluates the same inputs but writes break_out_liability_cents = 0, so a create + void pair leaves the conserved quantity (the player's outstanding agreement-funded travel) unchanged at 0 rather than drifting negative."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the endpoint being called"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_safety
    check: "The acting X-User-ID is not the same non-opaque principal that last advanced PlayerRosterRecord.current_roster_status on this record (segregation of duties). Enforced only on POST /camp-ops/players/{playerId}/roster-record/finalize-decision."
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /camp-ops/players/{playerId}/roster-record/finalize-decision"]

  - priority: 4
    category: existence
    check: "The parent resource in the path exists (checked left-to-right: complexId, then the child id) and the child belongs to that parent"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all collection-scoped endpoints"

  - priority: 5
    category: existence
    check: "A referenced entity named in the request body exists (player_id, agreement_id, workout_group_id, host_community_record_id, group_assignment_id). Non-existent id is distinguishable from the wrong-parent 404."
    error_id: ERR_FOREIGN_KEY_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints"

  - priority: 6
    category: state
    check: "The target entity is in a state from which the requested transition is declared"
    error_id: ERR_ROSTER_STATUS_INVALID_TRANSITION
    http_status: 409
    applies_to: ["POST /camp-ops/players/{playerId}/roster-record/decide", "POST /camp-ops/players/{playerId}/roster-record/finalize-decision", "POST /camp-ops/players/{playerId}/roster-record/void-decision", "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome", "POST /camp-ops/roster-records/{recordId}/break-out-camp"]

  - priority: 7
    category: state
    check: "The target entity has not already reached a terminal roster status"
    error_id: ERR_ROSTER_ALREADY_FINAL
    http_status: 409
    applies_to: ["POST /camp-ops/roster-records/{recordId}/break-out-camp", "POST /camp-ops/players/{playerId}/roster-record/decide"]

  - priority: 8
    category: state
    check: "The target facility or invitation entity is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /camp-ops/complexes/{complexId}/field-maintenance", "POST /camp-ops/community-agreements/{agreementId}/activate", "POST /camp-ops/community-agreements/{agreementId}/revert-to-draft", "POST /camp-ops/host-community-records/{recordId}/open-ticketing", "POST /camp-ops/host-community-records/{recordId}/close-ticketing", "POST /camp-ops/games/{gameId}/publish", "POST /camp-ops/games/{gameId}/revert-to-draft", "POST /camp-ops/workout-groups/{groupId}/publish"]

  - priority: 9
    category: business_temporal
    check: "The current logical clock sits inside the endpoint's declared window (report window for arrivals, [lease_start_date, lease_end_date) for ticketing, [game_datetime - 6h, game_datetime] for roster packaging, strictly before CampInvitation.report_current_date for void-decision)"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: ["POST /camp-ops/camp-invitations/{invitationId}/arrive", "POST /camp-ops/host-community-records/{recordId}/open-ticketing", "POST /camp-ops/games/{gameId}/package-roster", "POST /camp-ops/players/{playerId}/roster-record/void-decision"]

  - priority: 10
    category: business_temporal
    check: "The physical examination is scheduled no later than 5 days before CampInvitation.report_current_date for a non-domestic player"
    error_id: ERR_PHYSICAL_WINDOW_LEAD
    http_status: 422
    applies_to: ["POST /camp-ops/physicals/{physicalId}/perform"]

  - priority: 11
    category: business_safety
    check: "The medical clearance precondition is satisfied: the target effective player must be Player.clearance_status == CAMP_CLEARED at the instant of the operation"
    error_id: ERR_MEDICAL_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: ["POST /camp-ops/throw-programs/{programId}/advance-phase", "POST /camp-ops/group-assignments/{assignmentId}/call-up", "POST /camp-ops/players/{playerId}/roster-record/select-active-roster", "POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"]

  - priority: 12
    category: business_safety
    check: "An AWAY GameParticipation confirm is refused while the effective player's ThrowProgram.program_phase is a strict-precursor phase (PHASE_1, PHASE_2 or PHASE_3) unless the player is injury-flagged and cleared"
    error_id: ERR_INJURY_TRAVEL_UNSAFE
    http_status: 422
    applies_to: ["POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"]

  - priority: 13
    category: business_safety
    check: "No GroupAssignment is left occupying a seat that the field-maintenance action is withdrawing: the CLOSED action requires that no GroupAssignment on the complex has assignment_status == PROVISIONAL"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 409
    applies_to: ["POST /camp-ops/complexes/{complexId}/field-maintenance"]

  - priority: 14
    category: business_constraint
    check: "No WorkoutGroupSession interval on the subject complex collides with the candidate game interval at minute granularity: the half-open intervals [session_start, session_end) and [game_datetime - DURATION_UNITS, game_datetime + DURATION_UNITS) must be disjoint, and a session ending exactly at the game interval's start still conflicts because the two intervals are compared after truncation to whole minutes"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 409
    applies_to: ["POST /camp-ops/games/{gameId}/publish"]

  - priority: 15
    category: business_constraint
    check: "No two PERFORMED Physicals on the same player have overlapping examination intervals: two visits are compatible only when the earlier performed_at plus the exam duration is at or before the later scheduled_visit_date, or when at least a 2-day clearance buffer separates them"
    error_id: ERR_PHYSICAL_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /camp-ops/physicals/{physicalId}/perform"]

  - priority: 16
    category: business_constraint
    check: "A GroupAssignment create would not push WorkoutGroup.assigned_units above WorkoutGroup.capacity_units (aggregate capacity reservation)"
    error_id: ERR_GROUP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /camp-ops/workout-groups/{groupId}/assignments", "POST /camp-ops/group-assignments/{assignmentId}/call-up"]

  - priority: 17
    category: business_constraint
    check: "The player already holds an ACTIVE GroupAssignment and cannot hold a second one"
    error_id: ERR_PLAYER_ALREADY_ASSIGNED
    http_status: 409
    applies_to: ["POST /camp-ops/group-assignments/{assignmentId}/call-up"]

  - priority: 18
    category: business_constraint
    check: "The GroupAssignment.roster_bucket equals its owning WorkoutGroup.roster_bucket"
    error_id: ERR_BUCKET_MISMATCH
    http_status: 422
    applies_to: ["POST /camp-ops/workout-groups/{groupId}/assignments"]

  - priority: 19
    category: business_constraint
    check: "An AWAY GameSchedule may not be created or published with travel_radius_miles > 250"
    error_id: ERR_TRAVEL_RADIUS_EXCEEDED
    http_status: 422
    applies_to: ["POST /camp-ops/complexes/{complexId}/games", "POST /camp-ops/games/{gameId}/publish"]

  - priority: 20
    category: business_constraint
    check: "Player.idp_number is unique across all Players (unscoped uniqueness)"
    error_id: ERR_DUPLICATE_IDP_NUMBER
    http_status: 409
    applies_to: ["POST /camp-ops/players"]

  - priority: 21
    category: business_constraint
    check: "A WorkoutGroup may not be published while any of its member players has ThrowProgram.requirement_status == UNMET"
    error_id: ERR_THROW_REQUIREMENT_UNMET
    http_status: 422
    applies_to: ["POST /camp-ops/workout-groups/{groupId}/publish", "POST /camp-ops/group-assignments/{assignmentId}/call-up"]

  - priority: 22
    category: business_constraint
    check: "The waiver claim window has not elapsed: effective_claim_days from WaiverClaimCountdownCalculation must be strictly positive at finalize time"
    error_id: ERR_WAIVER_WINDOW_EXPIRED
    http_status: 409
    applies_to: ["POST /camp-ops/players/{playerId}/roster-record/finalize-decision"]

  - priority: 23
    category: business_constraint
    check: "Farm-scoped entities (PlayerRosterRecord, PlayerProgramProfile, CampInvitation) may not be created or mutated for a player who is mapped into an active SpringTrail row"
    error_id: ERR_FARM_ENTITY_EXCLUDED
    http_status: 409
    applies_to: ["POST /camp-ops/players/{playerId}/roster-record/decide", "POST /camp-ops/players/{playerId}/roster-record/finalize-decision", "POST /camp-ops/players/{playerId}/roster-record/void-decision", "POST /camp-ops/players/{playerId}/roster-record/select-active-roster", "POST /camp-ops/players/{playerId}/program-profile/reinstate", "POST /camp-ops/physicals/{physicalId}/perform"]

  - priority: 24
    category: business_referential
    check: "A HostCommunityRecord's owning CommunityAgreement must be ACTIVE, and current logical clock must be strictly before CommunityAgreement.lease_end_date"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /camp-ops/host-community-records/{recordId}/open-ticketing", "POST /camp-ops/host-community-records/{recordId}/sell-tickets"]

  - priority: 25
    category: business_referential
    check: "A TravelArrangement may not be CONFIRMED while its CampInvitation.invitation_letter_status is LETTER_PENDING"
    error_id: ERR_INVITATION_LETTER_MISSING
    http_status: 409
    applies_to: ["POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement"]

  - priority: 26
    category: business_referential
    check: "A Sponsorship may not be settled while received_amount_cents < committed_amount_cents"
    error_id: ERR_SPONSORSHIP_NOT_FULLY_FUNDED
    http_status: 422
    applies_to: ["POST /camp-ops/sponsorships/{sponsorshipId}/settle"]

  - priority: 26
    category: business_constraint
    check: "A settled minor league break-out may not be voided or settled again by the same non-opaque principal that settled it originally (settlement_actor_id must differ from the voiding actor's X-User-ID)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /camp-ops/minor-league-assignments/{assignmentId}/void-breakout"]

  - priority: 26
    category: business_temporal
    check: "A minor league assignment may not be opened more than BAILOUT_DAYS before its effective_datetime, and its effective_datetime must fall at or before the owning agreement's lease_end_date"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: ["POST /camp-ops/players/{playerId}/minor-league-assignments"]

  - priority: 27
    category: business_fiscal
    check: "The requested draw against the community ledger exceeds HostCommunityRecord.ticketing_revenue_cents minus already-posted agreement funding"
    error_id: ERR_AGREEMENT_UNDERFUNDED
    http_status: 402
    applies_to: ["POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement"]

  - priority: 28
    category: business_fiscal
    check: "Voiding a settlement is refused while the owning Complex.facility_posture is not NORMAL (fiscal operations are locked during facility restriction)"
    error_id: ERR_POSTURE_BLOCKS_FISCAL
    http_status: 409
    applies_to: ["POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement"]

  - priority: 29
    category: business_constraint
    check: "A create request omits a required body field or supplies a structurally invalid value (unknown enum member, capacity_units < 1, negative cents, report_final_date < report_current_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create and action endpoints"

  - priority: 30
    category: business_constraint
    check: "expected_invitation_version on a travel-arrangement confirm does not match the CampInvitation's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement"]

  - priority: 31
    category: business_constraint
    check: "expected_group_version on a GroupAssignment create does not match the WorkoutGroup's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /camp-ops/workout-groups/{groupId}/assignments"]

  - priority: 32
    category: business_constraint
    check: "expected_game_version on a participation confirm does not match the GameSchedule's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"]

  # =============================================================================
# §1.5 API Endpoint Table
# All read roles share one operational roster; action endpoints are narrower.
# =============================================================================
endpoints:

  # --- logical clock / test-driving ---
  - method: POST
    path: "/camp-ops/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every window gate (report windows, lease windows, packaging window, void-decision cutoff) reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["system logical clock -> current_utc"]

  # --- Complex ---
  - method: POST
    path: "/camp-ops/complexes"
    description: "Create a spring training complex"
    roles: [PlatformAdmin]
    code: 201
    input: [name, host_city, "season_split_track?", "timezone?", facility_capacity_units]
    output: Complex
    side_effects: ["facility_posture=NORMAL, field_maintenance_status=OPEN, maintenance_block_units=0, posture_sweep_index=0"]
  - method: GET
    path: "/camp-ops/complexes/{complexId}"
    description: "Get a complex with its derived posture and occupancy aggregates"
    roles: [PlatformAdmin, ComplexDirector, FieldCoordinator, Analytics]
    code: 200
    input: []
    output: Complex
    side_effects: []
  - method: GET
    path: "/camp-ops/complexes"
    description: "List complexes (paginated)"
    roles: [PlatformAdmin, ComplexDirector, Analytics]
    code: 200
    input: ["limit?", "offset?"]
    output: Complex[]
    side_effects: []
  - method: POST
    path: "/camp-ops/complexes/{complexId}/field-maintenance"
    description: "Apply a field-maintenance action (OPEN | FIELD_RESTRICTED | CLOSED) and recompute posture"
    roles: [ComplexDirector]
    code: 200
    input: [maintenance_action]
    output: Complex
    side_effects:
      - "Complex.field_maintenance_status and maintenance_block_units updated"
      - "ComplexPostureSweepCalculation recomputed"
      - "Complex.version incremented by 1"
      - "CLOSED cascades GroupAssignment withdrawal, WorkoutGroup disband, ThrowProgram/ProgramProfile phase reset (CASCADE 3)"
  - method: POST
    path: "/camp-ops/complexes/{complexId}/posture-sweeps"
    description: "Run the posture and contention sweep for a complex"
    roles: [ComplexDirector, PlatformAdmin]
    code: 200
    input: []
    output: Complex
    side_effects:
      - "posted_occupancy_units, reserved_major_units, reserved_minor_units recomputed"
      - "ComplexPostureSweepCalculation and FacilityContentionPosture evaluated"
      - "posture_sweep_index incremented by 1"

  # --- CommunityAgreement ---
  - method: POST
    path: "/camp-ops/community-agreements"
    description: "Create a host-community stadium lease agreement"
    roles: [CommunityLiaison, PlatformAdmin]
    code: 201
    input: [complex_id, stadium_name, lease_start_date, lease_end_date, annual_rent_cents, sponsorship_minor_league_base_cents, sponsorship_major_league_base_cents, ticket_price_cents, ticket_sellout_capacity]
    output: CommunityAgreement
    side_effects: ["agreement_status=DRAFT"]
  - method: GET
    path: "/camp-ops/community-agreements/{agreementId}"
    description: "Get a community agreement"
    roles: [CommunityLiaison, PlatformAdmin, ComplexDirector, Analytics]
    code: 200
    input: []
    output: CommunityAgreement
    side_effects: []
  - method: GET
    path: "/camp-ops/community-agreements"
    description: "List community agreements, optionally filtered by complex"
    roles: [CommunityLiaison, PlatformAdmin, Analytics]
    code: 200
    input: ["complex_id?", "limit?", "offset?"]
    output: CommunityAgreement[]
    side_effects: []
  - method: GET
    path: "/camp-ops/complexes/{complexId}/community-agreements"
    description: "List community agreements belonging to a complex"
    roles: [CommunityLiaison, PlatformAdmin, ComplexDirector]
    code: 200
    input: []
    output: CommunityAgreement[]
    side_effects: []
  - method: POST
    path: "/camp-ops/community-agreements/{agreementId}/activate"
    description: "Move a DRAFT agreement to ACTIVE"
    roles: [CommunityLiaison]
    code: 200
    input: []
    output: CommunityAgreement
    side_effects: ["agreement_status -> ACTIVE", "CommunityAgreement.version incremented by 1"]
  - method: POST
    path: "/camp-ops/community-agreements/{agreementId}/revert-to-draft"
    description: "Send an ACTIVE agreement back to DRAFT when no ticketing is on sale"
    roles: [CommunityLiaison]
    code: 200
    input: []
    output: CommunityAgreement
    side_effects: ["agreement_status -> DRAFT", "CommunityAgreement.version incremented by 1"]
  - method: POST
    path: "/camp-ops/community-agreements/{agreementId}/terminate"
    description: "Terminate an agreement; cascades every on-sale host community record to SUSPENDED"
    roles: [CommunityLiaison]
    code: 200
    input: []
    output: CommunityAgreement
    side_effects: ["agreement_status -> TERMINATED", "dependent HostCommunityRecords -> SUSPENDED (CASCADE 1)", "CommunityAgreement.version incremented by 1"]

  # --- Player ---
  - method: POST
    path: "/camp-ops/players"
    description: "Register a player"
    roles: [PlatformAdmin, RosterManager]
    code: 201
    input: [full_name, idp_number, position_code, acquisition_channel, "mlb_service_days?", "minor_league_option_years_used?", home_country, home_complex_id]
    output: Player
    side_effects: ["clearance_status=PENDING"]
  - method: GET
    path: "/camp-ops/players/{playerId}"
    description: "Get a player"
    roles: [PlatformAdmin, RosterManager, ComplexDirector, FieldCoordinator, PitchingCoordinator, TravelCoordinator, TeamPhysician, MinorLeagueCoordinator, Analytics, Player]
    code: 200
    input: []
    output: Player
    side_effects: []
  - method: GET
    path: "/camp-ops/players"
    description: "List players (paginated, filterable by home complex, position and clearance)"
    roles: [PlatformAdmin, RosterManager, Analytics]
    code: 200
    input: ["home_complex_id?", "clearance_status?", "position_code?", "limit?", "offset?"]
    output: Player[]
    side_effects: []
  - method: GET
    path: "/camp-ops/complexes/{complexId}/players"
    description: "List players whose home complex is this complex"
    roles: [PlatformAdmin, RosterManager, ComplexDirector, Analytics]
    code: 200
    input: []
    output: Player[]
    side_effects: []
  - method: POST
    path: "/camp-ops/players/{playerId}/clearance/pend"
    description: "Reset a TURNED_AWAY player's clearance back into the medical pipeline"
    roles: [TeamPhysician]
    code: 200
    input: []
    output: Player
    side_effects: ["clearance_status -> PENDING", "Player.version incremented by 1"]

  # --- PlayerRosterRecord ---
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record"
    description: "Open the roster record for a player (starts at NRI / DECISION_PENDING)"
    roles: [RosterManager]
    code: 201
    input: [player_id]
    output: PlayerRosterRecord
    side_effects: ["current_roster_status=NRI", "roster_decision_status=DECISION_PENDING", "option_decisions_used=0", "decision_sequence=0", "split_squad_eligibility=HOME_ONLY"]
  - method: GET
    path: "/camp-ops/roster-records/{recordId}"
    description: "Get a roster record"
    roles: [PlatformAdmin, RosterManager, MinorLeagueCoordinator, Analytics]
    code: 200
    input: []
    output: PlayerRosterRecord
    side_effects: []
  - method: GET
    path: "/camp-ops/roster-records"
    description: "List roster records, optionally filtered by player"
    roles: [PlatformAdmin, RosterManager, Analytics]
    code: 200
    input: ["player_id?", "current_roster_status?", "limit?", "offset?"]
    output: PlayerRosterRecord[]
    side_effects: []
  - method: GET
    path: "/camp-ops/players/{playerId}/roster-records"
    description: "List roster records belonging to a player"
    roles: [PlatformAdmin, RosterManager, MinorLeagueCoordinator]
    code: 200
    input: []
    output: PlayerRosterRecord[]
    side_effects: []
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/select-active-roster"
    description: "Promote an NRI to the active roster"
    roles: [RosterManager]
    code: 200
    input: []
    output: PlayerRosterRecord
    side_effects: ["current_roster_status -> ACTIVE_ROSTER", "last_decision_actor_id = acting X-User-ID", "PlayerRosterRecord.version incremented by 1"]
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/decide"
    description: "Apply a roster decision to a pending record (OPTION_ASSIGN | NONROSTER_RELEASE | OUTRIGHT_ASSIGN)"
    roles: [RosterManager]
    code: 200
    input: [decision_type]
    output: PlayerRosterRecord
    side_effects:
      - "current_roster_status moves per decision_type"
      - "MajorLeagueOptionEligibilityCalculation recomputed (BASE_ALLOWANCE variant)"
      - "option_decisions_used and waivers_required refreshed"
      - "decision_sequence incremented by 1"
      - "last_decision_actor_id = acting X-User-ID"
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/request-waivers"
    description: "Place a designated-for-assignment player on waivers and open the claim window"
    roles: [RosterManager]
    code: 200
    input: []
    output: PlayerRosterRecord
    side_effects: ["current_roster_status -> WAIVER_PENDING", "WaiverClaimCountdownCalculation evaluated and the effective claim window recorded"]
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/record-waiver-outcome"
    description: "Record a waiver outcome (CLAIMED | PENDING | RETURNED | CLEARED)"
    roles: [RosterManager]
    code: 200
    input: [outcome]
    output: PlayerRosterRecord
    side_effects: ["current_roster_status moves per outcome", "PlayerRosterRecord.version incremented by 1"]
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/finalize-decision"
    description: "Finalize the roster decision (segregation of duties applies)"
    roles: [RosterManager]
    code: 200
    input: []
    output: PlayerRosterRecord
    side_effects:
      - "roster_decision_status -> DECISION_FINALIZED"
      - "decision_finalized_at = current logical clock"
      - "WaiverClaimCountdownCalculation consumed; option_decisions_used += 1 when the record is WAIVER_CLAIMED"
      - "MajorLeagueOptionEligibilityCalculation recomputed"
      - "decision_sequence incremented by 1"
  - method: POST
    path: "/camp-ops/players/{playerId}/roster-record/void-decision"
    description: "Void a finalized roster decision before the report date"
    roles: [RosterManager]
    code: 200
    input: []
    output: PlayerRosterRecord
    side_effects:
      - "roster_decision_status -> DECISION_VOIDED"
      - "current_roster_status -> NRI"
      - "option_decisions_used decremented"
      - "MajorLeagueOptionEligibilityCalculation recomputed (VOIDED_OPTION_RESTORES_CHARGE)"
      - "WaiverClaimCountdownCalculation re-derivable"
      - "decision_sequence incremented by 1"
  - method: POST
    path: "/camp-ops/roster-records/{recordId}/break-out-camp"
    description: "Break a finalized record out of camp to a minor league level (AAA | AA)"
    roles: [MinorLeagueCoordinator]
    code: 200
    input: [level]
    output: PlayerRosterRecord
    side_effects:
      - "current_roster_status -> ASSIGNED_AAA / ASSIGNED_AA"
      - "every GroupAssignment of the player is driven to WITHDRAWN"
      - "Complex.posted_occupancy_units, reserved_major_units, reserved_minor_units recomputed"
      - "PlayerProgramProfile.major_group_count / minor_group_count recomputed"

  # --- PlayerProgramProfile ---
  - method: POST
    path: "/camp-ops/players/{playerId}/program-profile"
    description: "Open the camp-eligibility program profile for a player"
    roles: [TeamPhysician, RosterManager]
    code: 201
    input: [player_id]
    output: PlayerProgramProfile
    side_effects: ["eligibility_status=MEDICALS_PENDING", "rehab_program_phase=PHASE_1", "major_group_count=0, minor_group_count=0, active_rehab_assignment_count=0"]
  - method: GET
    path: "/camp-ops/program-profiles/{profileId}"
    description: "Get a program profile"
    roles: [PlatformAdmin, TeamPhysician, RosterManager, Analytics]
    code: 200
    input: []
    output: PlayerProgramProfile
    side_effects: []
  - method: GET
    path: "/camp-ops/program-profiles"
    description: "List program profiles, optionally filtered by player"
    roles: [PlatformAdmin, TeamPhysician, Analytics]
    code: 200
    input: ["player_id?", "limit?", "offset?"]
    output: PlayerProgramProfile[]
    side_effects: []
  - method: GET
    path: "/camp-ops/players/{playerId}/program-profiles"
    description: "List program profiles belonging to a player"
    roles: [PlatformAdmin, TeamPhysician, RosterManager]
    code: 200
    input: []
