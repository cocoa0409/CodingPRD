# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task_1019)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into §1.1–§1.7.
# All literals in assert: precomputed against the pinned formulas/constants.
# Logical clock default = 2026-07-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: line_price_provisional_vs_final_on_orderline
        grounds:
          - calculations.line_price
          - entities.OrderLine.fields.provisional_price_cents
          - entities.OrderLine.fields.final_price_cents
          - state_machines.Order.SUBMITTED_to_FULFILLED
        distinguishing_aspect: "Provisional line price uses requested_weight_g (500g -> 2100), final uses actual_cut_weight_g at fulfill (520g -> 2184); the divergence is on the Order/OrderLine cost-accounting domain."
        test_recipe:
          setup:
            - "RETAIL customer; pasteurized BY_WEIGHT product at 4200 cents/kg, min_aging_days 0, shrink 0; READY lot of 2000g; DRAFT order with one 500g line allocated, then SUBMITTED and PAID."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail A", region_code: "CA" }, as: ShopManager, captures: { cust1: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Comte", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 4200, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod1: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 1", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave1: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod1}", cave_id: "${cave1}", received_weight_g: 2000 }, as: ShopManager, captures: { lot1: "$.data.id" } }
            - { call: "POST /api/caves/${cave1}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust1}" }, as: CounterStaff, captures: { ord1: "$.data.id" } }
            - { call: "POST /api/orders/${ord1}/lines", payload: { line_type: "PRODUCT", product_id: "${prod1}", requested_weight_g: 500 }, as: CounterStaff, captures: { line1: "$.data.id" } }
            - { call: "GET /api/lots/${lot1}", payload: {}, as: CounterStaff, captures: { lotv1: "$.data.version" } }
            - { call: "POST /api/order-lines/${line1}/allocate", payload: { lot_id: "${lot1}", expected_lot_version: "${lotv1}" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord1}/submit", payload: {}, as: CounterStaff }
            - { call: "POST /api/orders/${ord1}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord1}/fulfill", payload: { line_actuals: [ { line_id: "${line1}", actual_cut_weight_g: 520 } ] }, as: CounterStaff }
          assert:
            - "OrderLine.${line1}.provisional_price_cents == 2100"
            - "OrderLine.${line1}.final_price_cents == 2184"
            - "Order.${ord1}.fulfillment_status == FULFILLED"

      - name: lot_shrink_projected_vs_actual_on_lot
        grounds:
          - calculations.lot_shrink
          - entities.Lot.fields.projected_ready_weight_g
          - entities.Lot.fields.current_weight_g
          - state_machines.Lot.AGING_to_READY
        distinguishing_aspect: "Projected shrink is one-shot on the original 1000g (=820), actual accumulates per rotation run on the diminishing current weight (910 then 828); the dual variant lives on the Lot inventory domain, not the Order domain."
        test_recipe:
          setup:
            - "Clock at 2026-07-01; BY_WEIGHT product shrink 0.001/day, target_aging_days 180, min_aging_days 0; lot of 1000g received at 2026-07-01; one rotation at +90 days."
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/products", payload: { name: "Tomme", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 180, shrink_pct_per_day: 0.001 }, as: ShopManager, captures: { prod2: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 2", temp_c: 11, humidity_pct: 90, capacity_g: 100000 }, as: ShopManager, captures: { cave2: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod2}", cave_id: "${cave2}", received_weight_g: 1000 }, as: ShopManager, captures: { lot2: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-29T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/caves/${cave2}/rotate", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-28T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/caves/${cave2}/rotate", payload: {}, as: ShopManager }
          assert:
            - "Lot.${lot2}.projected_ready_weight_g == 820"
            - "Lot.${lot2}.current_weight_g == 828"
            - "Lot.${lot2}.cumulative_shrink_g == 172"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: wholesale_tiered_volume_discount_mode_a
        grounds:
          - calculations.order_totals
          - entities.Order.fields.discount_cents
          - entities.Order.fields.billable_weight_g
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (a): >=3 inputs with tiered-rate selection and a min-cap — billable_weight_g 6000 selects the 0.08 tier, discount = min(round(30000*0.08)=2400, 50000) = 2400, total 27600."
        test_recipe:
          setup:
            - "WHOLESALE customer; BY_WEIGHT product at 5000 cents/kg, min_aging 0, shrink 0; READY lot of 10000g; DRAFT WHOLESALE order with one 6000g line allocated."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Bistro X", region_code: "CA", wholesale_tier: "SILVER" }, as: ShopManager, captures: { custw: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Cheddar", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 5000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prodw: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave W", temp_c: 10, humidity_pct: 80, capacity_g: 100000 }, as: ShopManager, captures: { cavew: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prodw}", cave_id: "${cavew}", received_weight_g: 10000 }, as: ShopManager, captures: { lotw: "$.data.id" } }
            - { call: "POST /api/caves/${cavew}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "WHOLESALE", customer_id: "${custw}" }, as: WholesaleCustomer, as_user_id: "${custw}", captures: { ordw: "$.data.id" } }
            - { call: "POST /api/orders/${ordw}/lines", payload: { line_type: "PRODUCT", product_id: "${prodw}", requested_weight_g: 6000 }, as: CounterStaff, captures: { linew: "$.data.id" } }
            - { call: "GET /api/lots/${lotw}", payload: {}, as: CounterStaff, captures: { lotwv: "$.data.version" } }
            - { call: "POST /api/order-lines/${linew}/allocate", payload: { lot_id: "${lotw}", expected_lot_version: "${lotwv}" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ordw}/submit", payload: {}, as: CounterStaff }
          assert:
            - "Order.${ordw}.billable_weight_g == 6000"
            - "Order.${ordw}.subtotal_cents == 30000"
            - "Order.${ordw}.discount_cents == 2400"
            - "Order.${ordw}.total_cents == 27600"

      - name: board_per_component_rounding_mode_b
        grounds:
          - calculations.board_price
          - entities.Board.fields.base_price_cents
          - entities.Board.fields.assembly_fee_cents
        distinguishing_aspect: "Mode (b): rounding order matters — round each 75g component (251) then sum (502) is pinned; sum-then-round (round(502.5)=503) is rejected; base_price = 502 + 1500 = 2002."
        test_recipe:
          setup:
            - "One BY_WEIGHT product at 3350 cents/kg; a board of two 75g components of that product."
          setup_api_calls:
            - { call: "POST /api/products", payload: { name: "Manchego", category: "CHEESE", milk_type: "SHEEP", pasteurized: true, form: "WEDGE", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3350, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prodb: "$.data.id" } }
          trigger:
            - { call: "POST /api/boards", payload: { name: "Duo Board", components: [ { product_id: "${prodb}", portion_g: 75 }, { product_id: "${prodb}", portion_g: 75 } ] }, as: ShopManager, captures: { boardb: "$.data.id" } }
          assert:
            - "Board.${boardb}.base_price_cents == 2002"
            - "Board.${boardb}.assembly_fee_cents == 1500"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: "Subscription revisits PAUSED after a full ACTIVE->PAUSED->ACTIVE->PAUSED cycle — a true cycle (non-linear) on the Subscription entity."
        test_recipe:
          setup:
            - "WHOLESALE customer, a board, and an ACTIVE subscription; then pause then resume it once."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Club Member", region_code: "NY" }, as: ShopManager, captures: { cust5: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Brie", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod5: "$.data.id" } }
            - { call: "POST /api/boards", payload: { name: "Monthly Board", components: [ { product_id: "${prod5}", portion_g: 100 } ] }, as: ShopManager, captures: { board5: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust5}", board_id: "${board5}", tier: "CLASSIC", monthly_price_cents: 5000, cadence_days: 30 }, as: WholesaleCustomer, as_user_id: "${cust5}", captures: { sub5: "$.data.id" } }
            - { call: "POST /api/subscriptions/${sub5}/pause", payload: {}, as: WholesaleCustomer, as_user_id: "${cust5}" }
            - { call: "POST /api/subscriptions/${sub5}/resume", payload: {}, as: WholesaleCustomer, as_user_id: "${cust5}" }
          trigger:
            - { call: "POST /api/subscriptions/${sub5}/pause", payload: {}, as: WholesaleCustomer, as_user_id: "${cust5}" }
          assert:
            - "Subscription.${sub5}.status == PAUSED"

      - name: order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Paying advances payment_status UNPAID->PAID while fulfillment_status stays SUBMITTED — two independent state dimensions on the same Order row (distinct entity from the Subscription cycle)."
        test_recipe:
          setup:
            - "RETAIL customer; pasteurized BY_WEIGHT product min_aging 0 shrink 0; READY lot 1000g; DRAFT order with one 300g line allocated, then SUBMITTED (still UNPAID)."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail B", region_code: "CA" }, as: ShopManager, captures: { cust6: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Gouda", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod6: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 6", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave6: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod6}", cave_id: "${cave6}", received_weight_g: 1000 }, as: ShopManager, captures: { lot6: "$.data.id" } }
            - { call: "POST /api/caves/${cave6}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust6}" }, as: CounterStaff, captures: { ord6: "$.data.id" } }
            - { call: "POST /api/orders/${ord6}/lines", payload: { line_type: "PRODUCT", product_id: "${prod6}", requested_weight_g: 300 }, as: CounterStaff, captures: { line6: "$.data.id" } }
            - { call: "GET /api/lots/${lot6}", payload: {}, as: CounterStaff, captures: { lotv6: "$.data.version" } }
            - { call: "POST /api/order-lines/${line6}/allocate", payload: { lot_id: "${lot6}", expected_lot_version: "${lotv6}" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord6}/submit", payload: {}, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord6}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff }
          assert:
            - "Order.${ord6}.payment_status == PAID"
            - "Order.${ord6}.fulfillment_status == SUBMITTED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_order_depletes_lot_updates_cave
        grounds:
          - state_machines.Order.SUBMITTED_to_FULFILLED
          - state_machines.Lot.READY_to_DEPLETED
          - calculations.cave_usage
          - entities.Cave.fields.used_g
        distinguishing_aspect: "Depth-3 chain from the fulfill trigger: fulfill -> line consumes lot (current 500->0) -> lot READY->DEPLETED -> Cave.used_g recomputed to 0; each hop caused by the prior one."
        test_recipe:
          setup:
            - "RETAIL customer; pasteurized product min_aging 0 shrink 0; READY lot of exactly 500g in a cave; order with one 500g line allocated, SUBMITTED and PAID."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail C", region_code: "CA" }, as: ShopManager, captures: { cust7: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Havarti", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod7: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 7", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave7: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod7}", cave_id: "${cave7}", received_weight_g: 500 }, as: ShopManager, captures: { lot7: "$.data.id" } }
            - { call: "POST /api/caves/${cave7}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust7}" }, as: CounterStaff, captures: { ord7: "$.data.id" } }
            - { call: "POST /api/orders/${ord7}/lines", payload: { line_type: "PRODUCT", product_id: "${prod7}", requested_weight_g: 500 }, as: CounterStaff, captures: { line7: "$.data.id" } }
            - { call: "GET /api/lots/${lot7}", payload: {}, as: CounterStaff, captures: { lotv7: "$.data.version" } }
            - { call: "POST /api/order-lines/${line7}/allocate", payload: { lot_id: "${lot7}", expected_lot_version: "${lotv7}" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord7}/submit", payload: {}, as: CounterStaff }
            - { call: "POST /api/orders/${ord7}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord7}/fulfill", payload: { line_actuals: [ { line_id: "${line7}", actual_cut_weight_g: 500 } ] }, as: CounterStaff }
          assert:
            - "Lot.${lot7}.status == DEPLETED"
            - "Lot.${lot7}.current_weight_g == 0"
            - "Lot.${lot7}.consumed_weight_g == 500"
            - "Cave.${cave7}.used_g == 0"

      - name: rotation_shrink_discards_lot_updates_cave
        grounds:
          - calculations.lot_shrink
          - state_machines.Lot.AGING_to_DISCARDED
          - calculations.cave_usage
          - entities.Cave.fields.used_g
        distinguishing_aspect: "Cascade from the rotate trigger (different origin than fulfill): rotate applies shrink -> cumulative_shrink_g 400 crosses LOT_MAX_SHRINK_PCT*received (350) -> lot DISCARDED -> Cave.used_g recomputed to 0."
        test_recipe:
          setup:
            - "Clock at 2026-07-01; product shrink 0.02/day, min_aging 0, target 30; lot of 1000g received; clock advanced to +20 days (2026-07-21)."
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/products", payload: { name: "Fresh Chevre", category: "CHEESE", milk_type: "GOAT", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 30, shrink_pct_per_day: 0.02 }, as: ShopManager, captures: { prod8: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 8", temp_c: 8, humidity_pct: 92, capacity_g: 100000 }, as: ShopManager, captures: { cave8: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod8}", cave_id: "${cave8}", received_weight_g: 1000 }, as: ShopManager, captures: { lot8: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-21T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /api/caves/${cave8}/rotate", payload: {}, as: ShopManager }
          assert:
            - "Lot.${lot8}.status == DISCARDED"
            - "Lot.${lot8}.cumulative_shrink_g == 400"
            - "Cave.${cave8}.used_g == 0"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocate_cancelled_order_beats_insufficient_weight
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors[ERR_ORDER_NOT_DRAFT]
          - errors[ERR_INSUFFICIENT_LOT_WEIGHT]
        distinguishing_aspect: "Dual failure on allocate: order is CANCELLED (state, ERR_ORDER_NOT_DRAFT, pri 7) and the lot has only 100g vs 500g requested (business_constraint, ERR_INSUFFICIENT_LOT_WEIGHT, pri 15); the state error wins. Pair: state x business_constraint."
        test_recipe:
          setup:
            - "READY lot of only 100g; a DRAFT order with a 500g line; order then CANCELLED before allocation."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail D", region_code: "CA" }, as: ShopManager, captures: { cust9: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Small Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WEDGE", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod9: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 9", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave9: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod9}", cave_id: "${cave9}", received_weight_g: 100 }, as: ShopManager, captures: { lot9: "$.data.id" } }
            - { call: "POST /api/caves/${cave9}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust9}" }, as: CounterStaff, captures: { ord9: "$.data.id" } }
            - { call: "POST /api/orders/${ord9}/lines", payload: { line_type: "PRODUCT", product_id: "${prod9}", requested_weight_g: 500 }, as: CounterStaff, captures: { line9: "$.data.id" } }
            - { call: "POST /api/orders/${ord9}/cancel", payload: {}, as: CounterStaff }
            - { call: "GET /api/lots/${lot9}", payload: {}, as: CounterStaff, captures: { lotv9: "$.data.version" } }
          trigger:
            - { call: "POST /api/order-lines/${line9}/allocate", payload: { lot_id: "${lot9}", expected_lot_version: "${lotv9}" }, as: CounterStaff, captures: { err9: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_ORDER_NOT_DRAFT"
            - "OrderLine.${line9}.lot_id == null"

      - name: submit_rawmilk_safety_beats_wholesale_min
        grounds:
          - validations[priority=10]
          - validations[priority=17]
          - errors[ERR_RAW_MILK_AGING]
          - errors[ERR_WHOLESALE_MIN_ORDER]
        distinguishing_aspect: "Dual failure on submit: an unpasteurized lot aged 40 days (< 60 legal) triggers ERR_RAW_MILK_AGING (business_safety, pri 10) and the wholesale subtotal 4000 < 10000 triggers ERR_WHOLESALE_MIN_ORDER (business_fiscal, pri 17); safety wins. Pair: business_safety x business_fiscal."
        test_recipe:
          setup:
            - "Clock 2026-07-01; unpasteurized product min_aging_days 30 at 8000 cents/kg; lot received then aged to 40 days (2026-08-10) and rotated READY; WHOLESALE order with a single 500g line (subtotal 4000) allocated."
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Bistro Y", region_code: "CA" }, as: ShopManager, captures: { cust10: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Raw Sheep", category: "CHEESE", milk_type: "SHEEP", pasteurized: false, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 8000, allergens: ["MILK"], min_aging_days: 30, target_aging_days: 60, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod10: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 10", temp_c: 10, humidity_pct: 88, capacity_g: 100000 }, as: ShopManager, captures: { cave10: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod10}", cave_id: "${cave10}", received_weight_g: 1000 }, as: ShopManager, captures: { lot10: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/caves/${cave10}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "WHOLESALE", customer_id: "${cust10}" }, as: WholesaleCustomer, as_user_id: "${cust10}", captures: { ord10: "$.data.id" } }
            - { call: "POST /api/orders/${ord10}/lines", payload: { line_type: "PRODUCT", product_id: "${prod10}", requested_weight_g: 500 }, as: CounterStaff, captures: { line10: "$.data.id" } }
            - { call: "GET /api/lots/${lot10}", payload: {}, as: CounterStaff, captures: { lotv10: "$.data.version" } }
            - { call: "POST /api/order-lines/${line10}/allocate", payload: { lot_id: "${lot10}", expected_lot_version: "${lotv10}" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord10}/submit", payload: {}, as: CounterStaff, captures: { err10: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_RAW_MILK_AGING"
            - "Order.${ord10}.fulfillment_status == DRAFT"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lot_ready_at_exact_min_aging_days
        grounds:
          - state_machines.Lot.AGING_to_READY
          - entities.Lot.fields.aging_days
          - entities.Product.fields.min_aging_days
        distinguishing_aspect: "aging_days == min_aging_days (120) inclusively flips AGING->READY at rotate — the >= boundary; a numeric-threshold metric reached through POST /api/caves/{id}/rotate."
        test_recipe:
          setup:
            - "Clock 2026-07-01; product min_aging_days 120, shrink 0; lot received; clock advanced exactly +120 days (2026-10-29)."
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/products", payload: { name: "Aged Alpine", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 120, target_aging_days: 180, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod11: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 11", temp_c: 11, humidity_pct: 87, capacity_g: 100000 }, as: ShopManager, captures: { cave11: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod11}", cave_id: "${cave11}", received_weight_g: 1000 }, as: ShopManager, captures: { lot11: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /api/caves/${cave11}/rotate", payload: {}, as: ShopManager }
          assert:
            - "Lot.${lot11}.aging_days == 120"
            - "Lot.${lot11}.status == READY"

      - name: submit_empty_order_zero_lines
        grounds:
          - validations[priority=16]
          - errors[ERR_EMPTY_ORDER]
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: "An order with zero lines (empty-collection edge, cardinality 0) is rejected at POST /api/orders/{id}/submit with ERR_EMPTY_ORDER — a distinct metric and endpoint from the numeric aging threshold."
        test_recipe:
          setup:
            - "A DRAFT RETAIL order with no lines added."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail E", region_code: "CA" }, as: ShopManager, captures: { cust12: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust12}" }, as: CounterStaff, captures: { ord12: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${ord12}/submit", payload: {}, as: CounterStaff, captures: { err12: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_EMPTY_ORDER"
            - "Order.${ord12}.fulfillment_status == DRAFT"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocate_requires_lot_ready
        grounds:
          - validations[priority=8]
          - state_machines.Lot.AGING_to_READY
          - entities.Lot.fields.status
          - errors[ERR_LOT_NOT_READY]
        distinguishing_aspect: "OrderLine allocation is valid only when the referenced Lot.status == READY; an AGING lot (aged 10 < min 120) yields ERR_LOT_NOT_READY. Cross-entity pair OrderLine -> Lot."
        test_recipe:
          setup:
            - "Clock 2026-07-01; product min_aging_days 120; lot received and clock advanced only +10 days (2026-07-11), rotated (still AGING); DRAFT order with a 100g line."
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail F", region_code: "CA" }, as: ShopManager, captures: { cust13: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Young Wheel", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 120, target_aging_days: 180, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod13: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 13", temp_c: 11, humidity_pct: 87, capacity_g: 100000 }, as: ShopManager, captures: { cave13: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod13}", cave_id: "${cave13}", received_weight_g: 1000 }, as: ShopManager, captures: { lot13: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-11T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/caves/${cave13}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust13}" }, as: CounterStaff, captures: { ord13: "$.data.id" } }
            - { call: "POST /api/orders/${ord13}/lines", payload: { line_type: "PRODUCT", product_id: "${prod13}", requested_weight_g: 100 }, as: CounterStaff, captures: { line13: "$.data.id" } }
            - { call: "GET /api/lots/${lot13}", payload: {}, as: CounterStaff, captures: { lotv13: "$.data.version" } }
          trigger:
            - { call: "POST /api/order-lines/${line13}/allocate", payload: { lot_id: "${lot13}", expected_lot_version: "${lotv13}" }, as: CounterStaff, captures: { err13: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_LOT_NOT_READY"
            - "OrderLine.${line13}.lot_id == null"

      - name: tasting_requires_customer_active
        grounds:
          - validations[priority=9]
          - state_machines.Customer.ACTIVE_to_DELINQUENT
          - entities.Customer.fields.status
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
        distinguishing_aspect: "Booking a TastingEvent is valid only when the referenced Customer.status == ACTIVE; a DELINQUENT customer yields ERR_CUSTOMER_NOT_ACTIVE. Cross-entity pair TastingEvent -> Customer (different pair than OrderLine -> Lot)."
        test_recipe:
          setup:
            - "A customer set to DELINQUENT and a tasting room."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail G", region_code: "CA" }, as: ShopManager, captures: { cust14: "$.data.id" } }
            - { call: "POST /api/customers/${cust14}/set-status", payload: { status: "DELINQUENT" }, as: ShopManager }
            - { call: "POST /api/tasting-rooms", payload: { name: "Room A", seat_capacity: 20, buffer_minutes: 30 }, as: ShopManager, captures: { tr14: "$.data.id" } }
          trigger:
            - { call: "POST /api/tasting-events", payload: { tasting_room_id: "${tr14}", customer_id: "${cust14}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", seats: 5 }, as: CounterStaff, captures: { err14: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_CUSTOMER_NOT_ACTIVE"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: prep_station_window_overlap
        grounds:
          - validations[priority=11]
          - entities.Order.fields.prep_window_start
          - entities.Order.fields.prep_station_id
          - errors[ERR_PREP_STATION_CONFLICT]
        distinguishing_aspect: "Half-open [start,end) single-occupancy overlap on a PrepStation: a second catering order [11:00,13:00) collides with a live [09:00,12:00) on the same station -> ERR_PREP_STATION_CONFLICT (adjacency end==start would be allowed)."
        test_recipe:
          setup:
            - "A prep station and a live CATERING order occupying [2026-08-01T09:00Z, 12:00Z) on it."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Event Host", region_code: "CA" }, as: ShopManager, captures: { cust15: "$.data.id" } }
            - { call: "POST /api/prep-stations", payload: { name: "Station 1" }, as: ShopManager, captures: { ps15: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "CATERING", customer_id: "${cust15}", prep_station_id: "${ps15}", prep_window_start: "2026-08-01T09:00:00Z", prep_window_end: "2026-08-01T12:00:00Z", event_date: "2026-08-01T18:00:00Z" }, as: CounterStaff, captures: { o15a: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders", payload: { order_type: "CATERING", customer_id: "${cust15}", prep_station_id: "${ps15}", prep_window_start: "2026-08-01T11:00:00Z", prep_window_end: "2026-08-01T13:00:00Z", event_date: "2026-08-01T19:00:00Z" }, as: CounterStaff, captures: { err15: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_PREP_STATION_CONFLICT"

      - name: tasting_room_buffer_gap
        grounds:
          - validations[priority=12]
          - entities.TastingRoom.fields.buffer_minutes
          - entities.TastingEvent.fields.start_at
          - errors[ERR_TASTING_ROOM_CONFLICT]
        distinguishing_aspect: "Buffer-gap interval semantics on a TastingRoom: two non-overlapping events must be >= buffer_minutes (30) apart; a 15-minute gap ([10:00,11:00) then [11:15,12:00)) is rejected with ERR_TASTING_ROOM_CONFLICT — distinct from PrepStation half-open single-occupancy."
        test_recipe:
          setup:
            - "An ACTIVE customer, a tasting room with buffer 30 / capacity 20, and a SCHEDULED event [10:00,11:00) seats 5."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Taster", region_code: "CA" }, as: ShopManager, captures: { cust16: "$.data.id" } }
            - { call: "POST /api/tasting-rooms", payload: { name: "Room B", seat_capacity: 20, buffer_minutes: 30 }, as: ShopManager, captures: { tr16: "$.data.id" } }
            - { call: "POST /api/tasting-events", payload: { tasting_room_id: "${tr16}", customer_id: "${cust16}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", seats: 5 }, as: CounterStaff, captures: { e16a: "$.data.id" } }
          trigger:
            - { call: "POST /api/tasting-events", payload: { tasting_room_id: "${tr16}", customer_id: "${cust16}", start_at: "2026-07-05T11:15:00Z", end_at: "2026-07-05T12:00:00Z", seats: 5 }, as: CounterStaff, captures: { err16: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_TASTING_ROOM_CONFLICT"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_weight_conserved_fulfill_then_return
        grounds:
          - calculations.lot_weight_ledger
          - state_machines.Order.FULFILLED_to_RETURNED
          - entities.Lot.fields.current_weight_g
          - entities.Lot.fields.consumed_weight_g
        distinguishing_aspect: "Conserved quantity is physical weight (grams): fulfill moves 500g current->consumed, the compensating return moves it back; current_weight_g + consumed_weight_g stays 1000 across the pair (current 1000, consumed 0 after return)."
        test_recipe:
          setup:
            - "READY lot of 1000g; order with a 500g line allocated, SUBMITTED, PAID (EXTERNAL), then FULFILLED with actual 500g (lot current 500, consumed 500)."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail H", region_code: "CA" }, as: ShopManager, captures: { cust17: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Return Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod17: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 17", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave17: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod17}", cave_id: "${cave17}", received_weight_g: 1000 }, as: ShopManager, captures: { lot17: "$.data.id" } }
            - { call: "POST /api/caves/${cave17}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust17}" }, as: CounterStaff, captures: { ord17: "$.data.id" } }
            - { call: "POST /api/orders/${ord17}/lines", payload: { line_type: "PRODUCT", product_id: "${prod17}", requested_weight_g: 500 }, as: CounterStaff, captures: { line17: "$.data.id" } }
            - { call: "GET /api/lots/${lot17}", payload: {}, as: CounterStaff, captures: { lotv17: "$.data.version" } }
            - { call: "POST /api/order-lines/${line17}/allocate", payload: { lot_id: "${lot17}", expected_lot_version: "${lotv17}" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord17}/submit", payload: {}, as: CounterStaff }
            - { call: "POST /api/orders/${ord17}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord17}/fulfill", payload: { line_actuals: [ { line_id: "${line17}", actual_cut_weight_g: 500 } ] }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord17}/return", payload: {}, as: CounterStaff }
          assert:
            - "Lot.${lot17}.current_weight_g == 1000"
            - "Lot.${lot17}.consumed_weight_g == 0"
            - "Order.${ord17}.fulfillment_status == RETURNED"
            - "Order.${ord17}.payment_status == REFUNDED"

      - name: store_credit_conserved_pay_then_cancel
        grounds:
          - calculations.store_credit_ledger
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Customer.fields.store_credit_cents
          - entities.Order.fields.store_credit_applied_cents
        distinguishing_aspect: "Conserved quantity is money (cents): paying by STORE_CREDIT debits 2100 (10000->7900), the compensating cancel-refund credits it back to 10000; store_credit_cents is invariant across the pay+cancel pair — a different conserved quantity than lot weight."
        test_recipe:
          setup:
            - "RETAIL customer with store_credit_cents 10000; product at 4200 cents/kg; READY lot 1000g; order with a 500g line (subtotal/total 2100) allocated, SUBMITTED, then PAID via STORE_CREDIT (store_credit 7900, applied 2100)."
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Retail I", region_code: "CA", store_credit_cents: 10000 }, as: ShopManager, captures: { cust18: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Credit Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WEDGE", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 4200, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { prod18: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave 18", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cave18: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${prod18}", cave_id: "${cave18}", received_weight_g: 1000 }, as: ShopManager, captures: { lot18: "$.data.id" } }
            - { call: "POST /api/caves/${cave18}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${cust18}" }, as: CounterStaff, captures: { ord18: "$.data.id" } }
            - { call: "POST /api/orders/${ord18}/lines", payload: { line_type: "PRODUCT", product_id: "${prod18}", requested_weight_g: 500 }, as: CounterStaff, captures: { line18: "$.data.id" } }
            - { call: "GET /api/lots/${lot18}", payload: {}, as: CounterStaff, captures: { lotv18: "$.data.version" } }
            - { call: "POST /api/order-lines/${line18}/allocate", payload: { lot_id: "${lot18}", expected_lot_version: "${lotv18}" }, as: CounterStaff }
            - { call: "POST /api/orders/${ord18}/submit", payload: {}, as: CounterStaff }
            - { call: "POST /api/orders/${ord18}/pay", payload: { payment_method: "STORE_CREDIT" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${ord18}/cancel", payload: {}, as: CounterStaff }
          assert:
            - "Customer.${cust18}.store_credit_cents == 10000"
            - "Order.${ord18}.store_credit_applied_cents == 2100"
            - "Order.${ord18}.payment_status == REFUNDED"
