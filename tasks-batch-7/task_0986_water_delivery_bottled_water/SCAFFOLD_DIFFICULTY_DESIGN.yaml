  - rule_id: resource_temporal_overlap
    instances:
      - name: stop_sequence_uniqueness_per_route
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_SEQUENCE]
        distinguishing_aspect: |
          Route acts as a temporal/spatial resource; sequence_index represents a
          half-open position within the route. Two stops with the same sequence_index
          on the same route collide (interval semantics: positional overlap). The
          same sequence_index on different routes is allowed.
        test_recipe:
          setup:
            - "Route R4 exists"
            - "Stop S1 on R4 with sequence_index=1"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "SeqA", billing_email: "sa@x.example", service_address: "1 SA", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 1, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_a: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "SeqB", billing_email: "sb@x.example", service_address: "1 SB", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 1, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_b: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-15", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r4: '$.data.id' }
            - call: "POST /api/v1/routes/${r4}/stops"
              payload: { customer_id: "${cust_a}", sequence_index: 1 }
              as: Dispatcher
          trigger:
            - call: "POST /api/v1/routes/${r4}/stops"
              payload: { customer_id: "${cust_b}", sequence_index: 1 }
              as: Dispatcher
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id == ERR_DUPLICATE_SEQUENCE"

      - name: pricing_config_period_no_overlap
        grounds:
          - entities.PricingConfig.fields.effective_from
          - calculations.calc_water_charge
        distinguishing_aspect: |
          PricingConfigs define half-open [effective_from, next.effective_from)
          intervals. Two PricingConfigs with identical effective_from values would
          create ambiguous zero-length interval overlap. Interval semantics differ
          from sequence_index (positional) — these are temporal half-open intervals
          over the PricingConfig resource. The boundary at exactly effective_from
          belongs to the new config, not the old.
        test_recipe:
          setup:
            - "PricingConfig PC1 effective_from=2026-01-01 with rate=700c"
            - "PricingConfig PC2 effective_from=2026-06-01 with rate=800c"
            - "Delivery on 2026-06-01 (boundary) uses PC2 (new config wins at boundary)"
            - "Delivery on 2026-05-31 uses PC1"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
              captures: { pc1: '$.data.id' }
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-06-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 800, silver_per_bottle_cents: 750, gold_per_bottle_cents: 700, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
              captures: { pc2: '$.data.id' }
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "BoundaryCo", billing_email: "b@x.example", service_address: "5 B", delivery_zone_id: "${zone_id}", service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            # Delivery on 2026-06-01 (boundary)
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: "${cust_id}", order_kind: "DELIVERY", requested_date: "2026-06-01", quantity_bottles: 2 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-01", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
          trigger:
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 2, actual_empties_collected: 0 }
              as: Driver
          assert:
            - "Stop.${s1}.stop_status == DELIVERED"
            - "Charge uses PC2 rate (800c/bottle) since service_date == effective_from (half-open interval, boundary belongs to new config)"

  - rule_id: compensating_invariant
    instances:
      - name: payment_apply_then_refund_invariant
        grounds:
          - state_machines.Payment.PENDING_to_APPLIED
          - state_machines.Payment.APPLIED_to_REFUNDED
          - entities.Invoice.fields.balance_due_cents
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Invoice.balance_due_cents. Forward action (Payment
          apply) reduces balance by amount_cents; compensating action (Payment
          refund) restores it by the same amount. Invariant: balance_due after
          refund == balance_due before apply.
        test_recipe:
          setup:
            - "Invoice INV1 OPEN with balance_due=7000c (10 bottles at 700c)"
            - "Payment P1 of 7000c PENDING"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "Inv10", billing_email: "i@x.example", service_address: "10 I", delivery_zone_id: "${zone_id}", service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: "${cust_id}", order_kind: "DELIVERY", requested_date: "2026-05-10", quantity_bottles: 10 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-05-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 10, actual_empties_collected: 0 }
              as: Driver
            - call: "POST /api/v1/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-05-01", billing_period_end: "2026-06-01", due_date: "2026-06-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
            - call: "POST /api/v1/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
            - call: "GET /api/v1/invoices/${inv_id}"
              as: BillingAdmin
              captures: { balance_before: '$.data.balance_due_cents' }
            - call: "POST /api/v1/payments"
              payload: { invoice_id: "${inv_id}", amount_cents: 7000, method: "CARD" }
              as: BillingAdmin
              captures: { pay_id: '$.data.id' }
            - call: "POST /api/v1/payments/${pay_id}/apply"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/v1/payments/${pay_id}/refund"
              payload: {}
              as: BillingAdmin
          assert:
            - "After apply: Invoice.${inv_id}.balance_due_cents == 0 (PAID)"
            - "After refund: Invoice.${inv_id}.balance_due_cents == ${balance_before} == 7000 (reopened)"
            - "Invariant: forward(apply) + compensate(refund) leaves balance_due unchanged"

      - name: route_commit_deliver_then_cancel_invariant
        grounds:
          - state_machines.Route.PUBLISHED_to_CANCELLED
          - entities.Route.fields.committed_bottles
          - calculations.calc_route_commit
        distinguishing_aspect: |
          Conserved quantity: Route.committed_bottles. Forward action (Stop planning)
          adds planned_bottles; compensating actions (Stop deliver/skip/cancel) remove
          it. Invariant: sum of committed_bottles across terminal transitions equals
          zero when all stops are terminal.
        test_recipe:
          setup:
            - "Route R5 PUBLISHED with 2 stops planned=3 and planned=2, committed=5"
            - "One stop delivered; one stop skipped"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "CA", billing_email: "ca@x.example", service_address: "1 CA", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 3, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_a: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "CB", billing_email: "cb@x.example", service_address: "1 CB", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 2, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_b: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-15", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r5: '$.data.id' }
            - call: "POST /api/v1/routes/${r5}/stops"
              payload: { customer_id: "${cust_a}", sequence_index: 1 }
              as: Dispatcher
              captures: { s_a: '$.data.id' }
            - call: "POST /api/v1/routes/${r5}/stops"
              payload: { customer_id: "${cust_b}", sequence_index: 2 }
              as: Dispatcher
              captures: { s_b: '$.data.id' }
            - call: "POST /api/v1/routes/${r5}/publish"
              payload: {}
              as: Dispatcher
            - call: "GET /api/v1/routes/${r5}"
              as: Dispatcher
              captures: { committed_initial: '$.data.committed_bottles' }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r5}/start"
              payload: {}
              as: Driver
            - call: "POST /api/v1/stops/${s_a}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r5}"
              as: Driver
              captures: { r5_v1: '$.data.version' }
            - call: "POST /api/v1/stops/${s_a}/deliver"
              payload: { expected_route_version: '${r5_v1}', actual_bottles_delivered: 3, actual_empties_collected: 0 }
              as: Driver
          trigger:
            - call: "POST /api/v1/stops/${s_b}/skip"
              payload: { skip_reason: "not home", notified_before_cutoff: false }
              as: Driver
          assert:
            - "After deliver: Route.${r5}.committed_bottles == 5 - 3 == 2"
            - "After skip: Route.${r5}.committed_bottles == 2 - 2 == 0"
            - "Invariant: committed_bottles = sum of planned for non-terminal stops; terminal transitions remove their contribution"
