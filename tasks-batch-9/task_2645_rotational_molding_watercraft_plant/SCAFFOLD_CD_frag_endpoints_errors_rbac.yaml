        distinguishing_aspect: |
          The two administrative overrides are the discriminator: the same
          WarrantyAgent that may start-review, storage-review, approve, deny and
          return-to-queue is refused 403 on waive-storage-finding and on void
          (both PlantAdmin-exclusive) and on withdraw (Customer-exclusive), while
