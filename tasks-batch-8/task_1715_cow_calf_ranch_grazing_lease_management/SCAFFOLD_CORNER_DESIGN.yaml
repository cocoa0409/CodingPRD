      - name: lease_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", entities.GrazingLease]
        distinguishing_aspect: "Omitting rate_per_aum_cents (a required input with no default) fails ERR_INVALID_REQUEST before any lease logic."
        test_recipe:
          setup: ["Ranch R; LEASED pasture P"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 50, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { err: $.data.error_id } }
