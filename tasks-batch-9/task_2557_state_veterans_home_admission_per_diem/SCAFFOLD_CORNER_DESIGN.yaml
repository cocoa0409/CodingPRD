          Two different floors apply to two different posting types on the same ledger: a
          COST_SHARE_DEBIT must leave at least the home's 9000 personal-needs-allowance reserve
          (11001 fails, 11000 lands exactly on 9000), while a WITHDRAWAL is only floored at zero
          (9001 fails, 9000 empties the fund to exactly 0) - so the reserve never binds a resident's
          own withdrawal.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home whose personal_needs_allowance_monthly_cents is 9000."
            - "One DEPOSIT of 20000 effective 2026-08-01, so the running balance is 20000."
