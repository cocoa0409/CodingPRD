            - "CrewAssignment.${ok_ca}.status == SCHEDULED"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: equipment_units_reserve_release_conserved
        grounds:
          - state_machines.EquipmentReservation.HELD_to_RELEASED
          - calculations.equipment_availability
        distinguishing_aspect: >
          Reserve (forward) qty5 then release (compensating) leaves EquipmentItem available_units for
          the 06-10..06-12 window unchanged at 20 (= total_units - peak_reserved) — the conserved
          quantity is equipment units.
        test_recipe:
          setup:
            - "LED total 20; order DRAFT; no reservations initially (availability 20 for 06-10..06-12)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Q", contact_email: "q@q.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V15", address: "17 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E15", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 5, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /equipment-reservations/${res_id}/release", payload: {}, as: WarehouseManager }
            - { call: "GET /equipment/${led_id}/availability", payload: { start_date: "2026-06-10", end_date: "2026-06-12" }, as: WarehouseManager, captures: { avail_after: "$.data.available_units" } }
          assert:
            - "EquipmentReservation.${res_id}.status == RELEASED"
            - "GET /equipment/${led_id}/availability for 06-10..06-12 returns available_units == 20"

      - name: deposit_hold_release_conserved
        grounds:
          - state_machines.RentalOrder.CONFIRMED_to_CANCELLED
          - calculations.deposit_settlement
          - entities.RentalOrder.fields.deposit_outstanding_cents
        distinguishing_aspect: >
          Confirm (forward HOLD 360000) then cancel (compensating RELEASE 360000) leaves
          deposit_outstanding_cents = 0 while deposit_held_cents and deposit_released_cents both read
          360000 — the conserved quantity is deposit money (cents), distinct from equipment units.
        test_recipe:
          setup:
            - "Order CONFIRMED (clock 2026-05-01) with LED qty2 (replacement 500000) + array qty1 (replacement 800000); deposit HOLD = round(0.20 * 1,800,000) = 360000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "R", contact_email: "r@r.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V16", address: "18 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "K2 Array", category: "SOUND", total_units: 8, daily_rate_cents: 15000, replacement_value_cents: 800000 }, as: WarehouseManager, captures: { arr_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E16", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${arr_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/cancel", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.deposit_held_cents == 360000"
            - "RentalOrder.${ord_id}.deposit_released_cents == 360000"
            - "RentalOrder.${ord_id}.deposit_outstanding_cents == 0"

