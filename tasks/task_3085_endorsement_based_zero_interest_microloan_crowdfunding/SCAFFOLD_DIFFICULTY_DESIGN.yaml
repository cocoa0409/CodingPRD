  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: social_score_weighted_components
        grounds:
          - calculations.social_underwriting_score
          - state_machines.LoanApplication.DRAFT_to_IN_REVIEW
        distinguishing_aspect: |
          Mode (a): a 4-input non-linear formula (tenure, accepted invites,
          trustee flag, prior repayments) with per-input min() caps, a
          conditional branch on endorsement_mode, and a hard 60-point approval
          threshold. Pinned: tenure 30 caps at 24 (20 pts not 25); 12 accepts
          cap at 10 (30 pts); trustee mode on; prior repayments ignored.
          Total = 20 + 30 + 25 + 0 = 75.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Borrower with tenure 30 months (over cap), prior_repaid_loans_count 5 (ignored in trustee mode), 12 invites of which 10 accepted and 2 declined, trustee-vouched application for 2000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trustees"
