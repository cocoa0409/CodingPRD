              as: ProductionAdmin
          assert:
            - "ClearanceChart.${chart1}.status == SUPERSEDED and ClearanceChart.${chart2}.status == PINNED"
            - "both charts have pinned_row_count == 0 (the production has no assets), so the demotion is not row-driven"
            - "the trigger returns 409 with error_id ERR_CHART_SUPERSEDED"
            - "EOApplication.${eo_id}.status is still DRAFT with premium_cents null and both review dimensions PENDING"
            - "the second pinning required a fresh expected_production_version (${pv2} != ${pv1}) because the first pinning incremented Production.version"

