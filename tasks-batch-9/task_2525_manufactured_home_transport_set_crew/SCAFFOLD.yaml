      - "increments InstallationOrder.version by 1"
  - method: GET
    path: /installations/sites/{id}
    description: "Reads one site, including readiness_status, blocking_defect_count and last_inspector_user_id."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: Site
    side_effects: []
  - method: GET
    path: /installations/sites
    description: "Lists sites, filterable by order_id (FK reverse-reachability for Site.order_id)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
