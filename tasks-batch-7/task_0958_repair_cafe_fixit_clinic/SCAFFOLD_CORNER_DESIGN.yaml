        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/repair-events", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401 (headers stripped by the test harness)"
      - name: fixer_cannot_create_event_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Fixer role calling POST /api/repair-events (Coordinator-exclusive) fails with 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["one fixer exists"]
