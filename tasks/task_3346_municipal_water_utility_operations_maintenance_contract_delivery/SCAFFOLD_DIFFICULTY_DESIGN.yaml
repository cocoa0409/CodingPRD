  - rule_id: resource_temporal_overlap
    instances:
      - name: measurement_period_adjacency_rejected_on_standard
        grounds:
          - validations[priority=40]
          - errors[ERR_MEASUREMENT_PERIOD_OVERLAP]
          - state_machines.PerformanceMeasurement.RECORDED_to_ASSESSED
          - entities.PerformanceMeasurement.fields.period_end
        distinguishing_aspect: |
          Interval semantics are half-open [period_start, period_end) on the PerformanceStandard resource: a second measurement that starts
          exactly at the existing period's period_end is accepted, while one that starts one second earlier is rejected with
          ERR_MEASUREMENT_PERIOD_OVERLAP, so adjacency is permitted but any true intersection is not.
        test_recipe:
          setup:
            - "one OPERATING contract with an ACTIVE standard carrying a measurement period [2026-06-01T00:00:00Z, 2026-07-01T00:00:00Z)"
