  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_rents_state_guard_outranks_the_over_market_rent_ceiling
        grounds:
          - validations[priority=40]
          - validations[priority=70]
          - errors[ERR_RCS_NOT_ACCEPTED]
          - errors[ERR_RENT_EXCEEDS_COMPARABLE]
          - calculations.renewal_rent_determination
          - state_machines.RentComparabilityStudy.SUBMITTED_to_REJECTED
          - state_machines.RentComparabilityStudy.REJECTED_to_SUPERSEDED
        distinguishing_aspect: |
          One approve-rents call violates a `state` rule at priority 40 (no ACCEPTED study on a
          case whose rcs_required is true) and a `business_fiscal` rule at priority 70 (OCAF rent
          120752 above the comparable market rent 111500) at the same time; the response is
          409 ERR_RCS_NOT_ACCEPTED, and only after the study is superseded and accepted — which
          removes the state violation while leaving the fiscal one untouched — does the identical
          call return 422 ERR_RENT_EXCEEDS_COMPARABLE. Error-category pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Owner, IL property, HapContract (rent 118000, debt 32000), clock at 2026-12-01."
            - "Renewal case with OPTION_1_MARK_UP_TO_MARKET (rcs_required true) and OCAF elected, so ocaf_rent_per_unit_cents is 120752."
            - "A study whose single comparable yields estimated_market_rent_cents 111500, submitted and then REJECTED — so comparable_market_rent_cents is 111500 while no study is ACCEPTED."
          setup_api_calls:
            - call: "POST /pbra/owners"
