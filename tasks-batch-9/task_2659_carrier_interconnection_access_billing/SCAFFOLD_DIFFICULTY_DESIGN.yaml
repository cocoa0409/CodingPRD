scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: access_charge_rating_preliminary_to_final_on_usage_batch
    grounds:
    - calculations.access_charge_rating
    - calculations.jurisdiction_determination
    - state_machines.TrafficFactorFiling.DISPUTED_to_AUDITED
    - state_machines.UsageBatch.RATED_to_RATED
    - entities.UsageBatch.fields.rating_variant
    - entities.UsageBatch.fields.rerate_count
    distinguishing_aspect: |
      The PRELIMINARY/FINAL variant pair lives in the usage-rating entity domain (UsageBatch and CallDetailRecord minutes priced against TariffFiling rates): the same six call detail records rate to 32.47 under carrier-reported factors and to 34.28 under audited factors, a 1.81 divergence in access revenue. That domain is disjoint from the Carrier receivable/reserve domain carrying the second dual-variant instance.
    test_recipe:
      setup:
      - A carrier with all three access rate elements EFFECTIVE for 2026-08-01 through 2027-01-01.
      - A 2026Q3 TrafficFactorFiling reported at PIU 50.00 / PLU 10.00 and moved to DISPUTED by review.
      - 'One TERMINATING_TO_US batch of six CDRs covering 2026-08-01..2026-08-31: 73 total billable minutes, 10 signaling-determined and 63 indeterminate.'
      - The batch is JURISDICTIONALIZED and then RATED under the reported factors, so rating_variant == PRELIMINARY and rated_amount_usd == 32.47.
      - Logical clock at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-INT-001
          rate_element: INTERSTATE_SWITCHED_ACCESS
          rate_per_mou_usd: 0.512500
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_int_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_int_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-IST-001
          rate_element: INTRASTATE_SWITCHED_ACCESS
          rate_per_mou_usd: 0.487500
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_ist_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_ist_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 50.00
          reported_plu_pct: 10.00
        as: AccessBillingAnalyst
        captures:
          ff_id: $.data.id
      - call: POST /interconnection/traffic-factor-filings/${ff_id}/review
        payload:
          decision: DISPUTE
          dispute_reason: Reported interstate use is inconsistent with the signalled sample
        as: AccessBillingAnalyst
      - call: POST /_clock/set_current_utc
        payload:
          target_utc: '2026-09-01T00:00:00.000Z'
        as: PlatformAdmin
      - call: POST /interconnection/usage-batches
        payload:
          carrier_id: ${car_id}
          period_start: '2026-08-01T00:00:00.000Z'
          period_end: '2026-08-31T00:00:00.000Z'
          direction: TERMINATING_TO_US
          exchange_reference: EXG-2026-08-IN
        as: AccessBillingAnalyst
        captures:
          batch_id: $.data.id
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '214777'
          duration_seconds: 180
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: true
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '405222'
          duration_seconds: 61
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: OK
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '713444'
          duration_seconds: 300
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '713444'
          duration_seconds: 120
          signaling_cpn_present: false
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '682555'
          terminating_npanxx: '713444'
          duration_seconds: 3600
          signaling_cpn_present: false
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '682555'
          terminating_npanxx: '713444'
          duration_seconds: 30
          signaling_cpn_present: true
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/jurisdictionalize
        payload: {}
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/rate
        payload: {}
        as: AccessBillingAnalyst
      trigger:
      - call: POST /interconnection/traffic-factor-filings/${ff_id}/audit
        payload:
          audited_piu_pct: 80.00
          audited_plu_pct: 5.00
        as: RevenueAssuranceController
        as_user_id: u-revassure-04
      assert:
      - TrafficFactorFiling.${ff_id}.status == AUDITED
      - TrafficFactorFiling.${ff_id}.effective_piu_pct == 80.00 and effective_plu_pct == 5.00
      - UsageBatch.${batch_id}.rating_variant == FINAL (it was PRELIMINARY immediately after the setup rate call)
      - UsageBatch.${batch_id}.rerate_count == 1
      - UsageBatch.${batch_id}.interstate_minutes == 52.4000, intrastate_minutes == 14.4500, local_minutes == 6.1500
      - UsageBatch.${batch_id}.interstate_amount_usd == 26.86 (the PRELIMINARY variant produced 17.17)
      - UsageBatch.${batch_id}.intrastate_amount_usd == 7.05 (the PRELIMINARY variant produced 14.73)
      - UsageBatch.${batch_id}.local_amount_usd == 0.37 (the PRELIMINARY variant produced 0.57)
      - UsageBatch.${batch_id}.rated_amount_usd == 34.28 and the PRELIMINARY figure was 32.47, so the variant delta is exactly 1.81
      - UsageBatch.${batch_id}.total_billable_minutes == 73 and the three minute buckets still re-sum to 73.0000
      - Every CallDetailRecord of the batch with jurisdiction_source == FACTOR_ALLOCATED still has rated_amount_usd == null
  - name: reserve_provision_regulatory_versus_gaap_basis_on_carrier
    grounds:
    - calculations.reserve_provision
    - entities.Carrier.fields.disputed_reserve_balance_usd
    - entities.Carrier.fields.uncollectible_reserve_balance_usd
    - state_machines.BillingDispute.(creation)_to_SUBMITTED
    - endpoints.GET /interconnection/carriers/{carrier_id}/reserve-summary
    distinguishing_aspect: |
      The regulatory_basis/gaap_basis variant pair lives in the Carrier receivable-reserve domain (a balance-sheet provision over AccessInvoice exposure), not in usage rating: one disputed amount of 10.00 is held at 10.00 on the persisted regulatory basis and at 6.00 on the GAAP probable-loss basis, a 4.00 basis delta on the same invoice and dispute data.
    test_recipe:
      setup:
      - A carrier with an ISSUED access invoice for 32.47 and no payments.
      - 'Carrier reserves after issue: open_receivable_usd 32.47, net_receivable_usd 32.47, uncollectible_reserve_balance_usd 1.62.'
      - One SUBMITTED BillingDispute for 10.00 with reason_code RATE_APPLICATION filed inside the 90-day window.
      - Logical clock at 2026-09-01T00:00:00Z.
