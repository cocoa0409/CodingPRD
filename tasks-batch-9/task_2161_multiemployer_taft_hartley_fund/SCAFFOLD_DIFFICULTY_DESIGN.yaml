            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v}", lines: [ { participant_id: "${p_at_id}", hours: 870.00, gross_wages_cents: 3500000, work_classification: "JOURNEYMAN" }, { participant_id: "${p_under_id}", hours: 869.99, gross_wages_cents: 3499960, work_classification: "JOURNEYMAN" } ] }
              as: ContributingEmployer
