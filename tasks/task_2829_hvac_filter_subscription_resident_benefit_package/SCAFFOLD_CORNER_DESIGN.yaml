              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "B-201", hvac_system_type: "TWO_STAGE", filter_slot_count: 1, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
