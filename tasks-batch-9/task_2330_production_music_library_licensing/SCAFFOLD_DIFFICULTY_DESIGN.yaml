  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: quote_cross_entity_licensable_outranks_business_term_range
        grounds:
          - validations[priority=14]
          - validations[priority=28]
          - errors[ERR_COMPOSITION_NOT_LICENSABLE]
          - errors[ERR_TERM_OUTSIDE_TIER_RANGE]
          - state_machines.Composition.CATALOGED_to_RETIRED
        distinguishing_aspect: |
          Error-category pair cross_entity (priority 14) versus business_rule (priority 28): one quote
          call violates both at once and MUST answer ERR_COMPOSITION_NOT_LICENSABLE (409), while the
          control quote that violates only the term-range rule answers ERR_TERM_OUTSIDE_TIER_RANGE (422),
          proving the ordering rather than a single-error coincidence.
        test_recipe:
          setup:
            - "Composer with an ACTIVE ROYALTY_SPLIT agreement (so the priority-13 agreement check passes)."
            - "Two CATALOGED compositions A and B under that agreement."
            - "A BROADCAST_TV tier whose term range is 1-12 months only."
            - "SyncRequest A on composition A with requested_term_months 24, reviewed (term range is only enforced at quote time)."
            - "SyncRequest B on composition B with requested_term_months 24, reviewed; composition B stays CATALOGED."
            - "Composition A has been RETIRED (and therefore WITHDRAWN) after the request was reviewed, so BOTH rules are violated on A's quote."
