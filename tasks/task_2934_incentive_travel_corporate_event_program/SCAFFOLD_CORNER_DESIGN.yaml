  - name: a_filed_tax_report_can_only_be_voided_by_a_different_officer
    claim_type: segregation_of_duties
    grounds:
    - §1.4 priority 15 ERR_TAX_VOID_SELF_REVIEW
    - §1.2 TaxAwardReport FILED -> VOIDED preconditions and side effects
    - §1.1 TaxAwardReport.filed_by_user_id, voided_by_user_id, void_reason
    - §1.1 Qualifier.tax_status, Program.reported_award_total_cents
    distinguishing_aspect: |
      The second half of the segregation_of_duties role model, on the only other pair of operations in §1.5 that records who did what: filing and voiding a taxable-award report. It is a separate instance from the contract case because the mechanics differ in a way that matters — there is one provenance field rather than two, both operations belong to the same role, and the void reverses a money field on a third entity. This is also the only recipe that shows what a void costs downstream: VOIDED is terminal on the qualifier tax axis, so the program can no longer be closed.
    test_recipe:
      setup: Empty database. The canonical 5000000-cent program is RECONCILED with gross_up_policy FULL_GROSS_UP.
        Ana Reyes travelled, so her taxable_award_cents is 783500 and her tax_status is PENDING_REPORT;
        report ${tr1_id} was drafted and filed by TaxComplianceOfficer tc-01, which moved her to REPORTED
        and pushed reported_value_cents 1198929 into the program total.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
