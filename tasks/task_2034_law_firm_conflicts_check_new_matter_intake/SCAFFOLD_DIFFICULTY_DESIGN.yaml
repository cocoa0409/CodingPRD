# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2034: Law Firm Conflicts Check & New Matter Intake
# 9 rules x 2 instances = 18 instances. Every ${var} is bound by a captures:
# block earlier in the same instance. All numeric asserts are literals computed
# by hand-executing the scaffold's formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_strict_vs_phonetic_hit_set
        grounds:
          - calculations.conflict_match_score
          - entities.ConflictCheck.fields.search_variant
        distinguishing_aspect: |
          Entity domain = ConflictCheck/Party name matching. Identical party data under STRICT yields
          zero hits while PHONETIC yields one hit (score 70 via equal soundex S530 for 'smyth'/'smith'),
          so the two variants of the same prose 'find matching parties' produce different result sets.
        test_recipe:
          setup:
            - "Existing matter M0 (INTAKE) has client party 'Smyth & Co' (normalized 'smyth', soundex S530)"
            - "New matter M1 has client party 'Smith Company' (normalized 'smith', soundex S530; suffix 'company' dropped)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Smyth & Co", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_smyth: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Smith Company", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_smith: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_smyth}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_smith}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk_strict: $.data.id, hits_strict: $.data.hit_count } }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "PHONETIC" }, as: IntakeSpecialist, captures: { chk_phon: $.data.id, hits_phon: $.data.hit_count } }
            - { call: "GET /intake/conflict-hits?check_id=${chk_phon}", as: IntakeSpecialist, captures: { hit_score: "$.data[0].match_score", hit_party: "$.data[0].matched_party_id", hit_matter: "$.data[0].matched_matter_id" } }
          assert:
            - "hits_strict == 0 (STRICT ignores the phonetic channel: 'smith' vs 'smyth' share no tokens)"
            - "hits_phon == 1 (PHONETIC adds soundex channel 70 >= default threshold 60)"
            - "hit_score == 70 and hit_party == ${p_smyth} and hit_matter == ${m0}"

      - name: dual_variant_recent_vs_best_band_retainer
        grounds:
          - calculations.retainer_required_amount
          - calculations.credit_band
        distinguishing_aspect: |
          Entity domain = RetainerDeposit/CreditAssessment fiscal sizing. With an older PRIME (800) and a
          newer STANDARD (700) assessment both inside the 90-day validity window, the pinned V_RECENT
          variant sizes the retainer at fee x 2 = 4,000,000 while the rejected V_BEST interpretation would
          give fee x 1 = 2,000,000 — same prose 'required retainer based on the client's credit band',
          different numbers.
        test_recipe:
          setup:
            - "Matter M (INTAKE) for client C with two valid assessments: PRIME 800 assessed 2026-08-01, STANDARD 700 assessed 2026-08-11"
            - "Logical clock at 2026-08-21 (both assessments still valid: +90d windows are 2026-10-30 and 2026-11-09)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /intake/parties", payload: { legal_name: "Retainer Client Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 800 }, as: BillingClerk, captures: { band1: $.data.band } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 700 }, as: BillingClerk, captures: { band2: $.data.band } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: FirmAdmin }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id, fee_est: $.data.fee_estimate_cents } }
          trigger:
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { dep_req: "$.data[0].required_cents", dep_status: "$.data[0].status" } }
          assert:
            - "band1 == PRIME and band2 == STANDARD"
            - "fee_est == 2000000 (100.0 x 20000)"
            - "dep_req == 4000000 (V_RECENT: latest valid assessment STANDARD -> x2); a V_BEST implementation would wrongly produce 2000000"
            - "dep_status == PENDING"

  # ---------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_affiliate_channel_max
        grounds:
          - calculations.conflict_match_score
          - entities.Party.fields.affiliate_of_id
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — channel max (DIRECT vs ALIAS vs phonetic gate),
          conditional branch on candidate entity state (affiliate-tree membership), and a per-hop discount
          feeding a threshold comparison. Query 'Globex Corp' exactly matches P (100); affiliate C at depth 1
          scores 90 (included at threshold 85), grand-affiliate G at depth 2 scores 80 (excluded).
        test_recipe:
          setup:
            - "Matter M0 (client X 'Umbrella Industries') has roster parties P 'Globex Corporation', C 'Globex Subsidiary Holdings' (affiliate_of=P), G 'Globex Sub Sub' (affiliate_of=C)"
            - "Matter M1 has client Q 'Globex Corp' (normalized 'globex', exactly equal to P's normalized_name)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Umbrella Industries", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Globex Corporation", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_p: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Globex Subsidiary Holdings", party_type: "CORPORATION", affiliate_of_id: "${p_p}" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Globex Sub Sub", party_type: "CORPORATION", affiliate_of_id: "${p_c}" }, as: FirmAdmin, captures: { p_g: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Globex Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_q: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters/${m0}/parties", payload: { party_id: "${p_p}", role_in_matter: "RELATED" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m0}/parties", payload: { party_id: "${p_c}", role_in_matter: "RELATED" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m0}/parties", payload: { party_id: "${p_g}", role_in_matter: "RELATED" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_q}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT", match_threshold: 85 }, as: IntakeSpecialist, captures: { chk: $.data.id, hits: $.data.hit_count } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h0_party: "$.data[0].matched_party_id", h0_via: "$.data[0].matched_via", h0_score: "$.data[0].match_score", h1_party: "$.data[1].matched_party_id", h1_via: "$.data[1].matched_via", h1_score: "$.data[1].match_score" } }
          assert:
            - "hits == 2 (P direct 100 and C affiliate 100-10=90 both >= 85; G affiliate 100-20=80 < 85 produces no hit)"
            - "hit set = { ${p_p} via DIRECT score 100, ${p_c} via AFFILIATE score 90 } (order between the two captures by score desc: h0_score==100, h1_score==90)"
            - "no hit references ${p_g}"

      - name: combinatorial_per_line_rounding_order
        grounds:
          - calculations.letter_fee_estimate
          - entities.EngagementLetter.fields.fee_estimate_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-line-then-sum.
          Two lines of 0.5h x 101c: per-line round_half_up(50.5)=51 each -> total 102; the rejected
          sum-then-round order gives round_half_up(101.0)=101. Assert 102.
        test_recipe:
          setup:
            - "Matter M (INTAKE) with responsible attorney RA"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Rounding Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id, m_v: $.data.version } }
          trigger:
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "a", hours: 0.5, rate_cents: 101 }, { description: "b", hours: 0.5, rate_cents: 101 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { fee_est: $.data.fee_estimate_cents } }
          assert:
            - "fee_est == 102 (round_half_up(50.5)=51 per line, then 51+51); sum-then-round implementations return 101 and are wrong"

  # ---------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: waiver_redraft_cycle
        grounds:
          - state_machines.WaiverRequest.DECLINED_to_DRAFT
          - state_machines.WaiverRequest.DRAFT_to_SENT
        distinguishing_aspect: |
          WaiverRequest is cyclic: DRAFT -> SENT -> DECLINED -> DRAFT -> SENT. The loop must actually
          work (fields reset on REDRAFT; a fresh sent_at/expires_at issued on the second SEND), which a
          linear-pipeline implementation cannot express.
        test_recipe:
          setup:
            - "Matter M1 (client Y 'Echo Bravo Corp') has a CONFIRMED hit H matching party X 'Delta Panda Inc' which is client of existing matter M0"
            - "Waiver W drafted by M1's responsible attorney RA"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Delta Panda Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Echo Bravo Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED", note: "real conflict" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "v1 terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w: $.data.id, w_st0: $.data.status } }
          trigger:
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "SEND" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w_st1: $.data.status, w_exp1: $.data.expires_at } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "DECLINE", decline_reason: "client unhappy" }, as: Client, as_user_id: "${p_y}", captures: { w_st2: $.data.status } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "REDRAFT", proposed_terms: "v2 terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w_st3: $.data.status, w_exp3: $.data.expires_at, w_consent3: $.data.consent_document_ref } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "SEND" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w_st4: $.data.status, w_exp4: $.data.expires_at } }
          assert:
            - "w_st0 == DRAFT, w_st1 == SENT, w_st2 == DECLINED, w_st3 == DRAFT, w_st4 == SENT (full loop traversed)"
            - "w_exp1 != null and w_exp1 == '2026-08-31T00:00:00Z' (sent at default clock 2026-08-01 + 30 days)"
            - "w_exp3 == null and w_consent3 == null after REDRAFT reset"
            - "w_exp4 == '2026-08-31T00:00:00Z' (recomputed fresh on second SEND)"

      - name: matter_clearance_cycle_parallel_dimensions
        grounds:
          - state_machines.Matter.CLEARED_to_UNCHECKED
          - state_machines.Matter.UNCHECKED_to_CLEARED
          - state_machines.Matter.CLEARED_to_HITS_PENDING
        distinguishing_aspect: |
          Matter carries two parallel dimensions: clearance_status cycles UNCHECKED -> CLEARED ->
          UNCHECKED -> HITS_PENDING -> CLEARED (driven by roster-add supersede and hit review) while
          lifecycle_status stays pinned at INTAKE throughout — one dimension moving must not drag the other.
        test_recipe:
          setup:
            - "Matter M0 (INTAKE) client X2 'Foxtrot Lima LLC'; matter M1 client Y2 'Golf Hotel Inc', no roster parties yet"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Foxtrot Lima LLC", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Golf Hotel Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id, cs0: $.data.clearance_status, lc0: $.data.lifecycle_status } }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk1: $.data.id, chk1_hits: $.data.hit_count } }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs1: $.data.clearance_status, lc1: $.data.lifecycle_status } }
          trigger:
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs2: $.data.clearance_status, lc2: $.data.lifecycle_status } }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk2: $.data.id, chk2_hits: $.data.hit_count } }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs3: $.data.clearance_status } }
            - { call: "GET /intake/conflict-hits?check_id=${chk2}", as: IntakeSpecialist, captures: { h2: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h2}/review", payload: { decision: "DISMISSED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs4: $.data.clearance_status, lc4: $.data.lifecycle_status } }
          assert:
            - "cs0 == UNCHECKED; chk1_hits == 0; cs1 == CLEARED (zero-hit check completes clearance)"
            - "cs2 == UNCHECKED (roster add superseded the INTAKE check) while lc2 == INTAKE (parallel dimension untouched)"
            - "chk2_hits == 1 (same party X2 is client of M0 and ADVERSE on M1, exact match 100) and cs3 == HITS_PENDING"
            - "cs4 == CLEARED after DISMISS and lc4 == INTAKE still"

  # ---------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: waiver_revoke_three_hop_cascade
        grounds:
          - state_machines.WaiverRequest.APPROVED_to_REVOKED
          - state_machines.ConflictHit.WAIVED_to_CONFIRMED
          - state_machines.Matter.WAIVED_to_BLOCKED
          - state_machines.EngagementLetter.ISSUED_to_VOID
        distinguishing_aspect: |
          Depth-3 cascade from one trigger (REVOKE): waiver APPROVED->REVOKED mutates the hit
          (WAIVED->CONFIRMED), which mutates the matter clearance (WAIVED->BLOCKED), which conditionally
          mutates the letter (ISSUED->VOID). Each hop is caused by the previous hop, not by the trigger.
        test_recipe:
          setup:
            - "Matter M1 (client Y) BLOCKED on CONFIRMED hit H (party X is ADVERSE on M1 and client of M0); waiver W APPROVED for H, so H is WAIVED and M1 clearance WAIVED"
            - "Engagement letter L for M1 in ISSUED state (issued while clearance WAIVED)"
            - "Conflicts partner CP is a different attorney than requester RA (SoD)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Kilo Victor Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Lima Zulu Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w: $.data.id } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "SEND" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "RECORD_CONSENT", consent_document_ref: "doc-001" }, as: Client, as_user_id: "${p_y}" }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "APPROVE" }, as: ConflictsPartner, as_user_id: "${atty_cp}", captures: { w_ap: $.data.status } }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs_waived: $.data.clearance_status, m_v: $.data.version } }
            - { call: "POST /intake/matters/${m1}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 10.0, rate_cents: 10000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id } }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { l_iss: $.data.status } }
          trigger:
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "REVOKE" }, as: Client, as_user_id: "${p_y}", captures: { w_fin: $.data.status } }
            - { call: "GET /intake/conflict-hits/${h}", as: IntakeSpecialist, captures: { h_fin: $.data.review_status } }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { cs_fin: $.data.clearance_status, lc_fin: $.data.lifecycle_status } }
            - { call: "GET /intake/matters/${m1}/engagement-letters", as: IntakeSpecialist, captures: { l_fin: "$.data[0].status" } }
          assert:
            - "w_ap == APPROVED and cs_waived == WAIVED and l_iss == ISSUED (pre-revoke state)"
            - "w_fin == REVOKED"
            - "h_fin == CONFIRMED (hop 1: waiver revoke un-waives the hit)"
            - "cs_fin == BLOCKED (hop 2: clearance recompute on the hit flip) and lc_fin == INTAKE"
            - "l_fin == VOID (hop 3: conditional cascade voids only the ISSUED letter)"

      - name: lateral_review_activation_wall_cascade
        grounds:
          - state_machines.ConflictHit.PENDING_to_CONFIRMED
          - state_machines.Attorney.LATERAL_PENDING_to_ACTIVE
          - state_machines.EthicalWall.ACTIVE_to_LIFTED
          - entities.EthicalWall.fields.excluded_attorney_ids
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (hit review on a LATERAL_SWEEP hit): the review resolves
          the lateral's last PENDING hit, which flips the attorney LATERAL_PENDING -> ACTIVE, which
          auto-creates an EthicalWall on the confirmed-hit matter with the lateral excluded — observable as
          a 403 ERR_WALL_EXCLUDED when the lateral then reads that matter.
        test_recipe:
          setup:
            - "Matter M0 (INTAKE) client G 'Acme Global Ltd' (normalized 'acme global'), responsible RA"
            - "No ethical wall exists on M0 yet"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Acme Global Ltd", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_g: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_g}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Larry Lateral", bar_number: "BAR009", practice_group: "LITIGATION", hire_type: "LATERAL", lateral_employed_from: "2024-01-01", lateral_employed_to: "2026-08-15", prior_client_names: ["Acme Global"] }, as: FirmAdmin, captures: { atty_l: $.data.id, l_status0: $.data.status } }
            - { call: "GET /intake/conflict-hits?matched_matter_id=${m0}", as: ConflictsPartner, as_user_id: "${atty_r}", captures: { h: "$.data[0].id", h_via: "$.data[0].matched_via", h_lat: "$.data[0].lateral_attorney_id" } }
            - { call: "GET /intake/matters/${m0}", as: IntakeSpecialist, captures: { cs0: $.data.clearance_status } }
          trigger:
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED", note: "lateral represented adverse party" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { h_fin: $.data.review_status } }
            - { call: "GET /intake/attorneys/${atty_l}", as: FirmAdmin, captures: { l_status1: $.data.status } }
            - { call: "GET /intake/matters/${m0}/ethical-walls", as: ConflictsPartner, as_user_id: "${atty_r}", captures: { wall_reason: "$.data[0].reason", wall_excl: "$.data[0].excluded_attorney_ids" } }
            - { call: "GET /intake/matters/${m0}", as: ResponsibleAttorney, as_user_id: "${atty_l}", captures: { denied: $.data.error_id } }
          assert:
            - "l_status0 == LATERAL_PENDING (sweep produced a hit, so no immediate activation)"
            - "h_via == LATERAL and h_lat == ${atty_l} and cs0 == HITS_PENDING (retroactive imputation on an existing matter)"
            - "h_fin == CONFIRMED and l_status1 == ACTIVE (hop 2: last PENDING resolved auto-activates)"
            - "wall_reason == LATERAL_IMPUTATION and wall_excl contains ${atty_l} (hop 3: wall auto-created)"
            - "denied == ERR_WALL_EXCLUDED (exclusion enforced on the wall-gated read)"

  # ---------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: clearance_safety_beats_retainer_fiscal
        grounds:
          - "validations[priority=7]"
          - "validations[priority=11]"
          - errors[ERR_MATTER_CLEARANCE_BLOCKED]
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal): the countersign request fails BOTH the
          clearance gate (matter BLOCKED) AND the retainer gate (deposit PENDING/unfunded); the scaffold's
          priority order (safety p7 before fiscal p11) pins ERR_MATTER_CLEARANCE_BLOCKED as the winner.
        test_recipe:
          setup:
            - "Matter M1 clearance BLOCKED (CONFIRMED hit, no waiver); letter ISSUED; valid PRIME credit assessment; deposit auto-created at ISSUE with required 2,000,000 and never funded"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Mike November Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Oscar Pine Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { m_v: $.data.version, cs: $.data.clearance_status } }
            - { call: "POST /intake/matters/${m1}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id } }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m1}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id", dep_status: "$.data[0].status", dep_req: "$.data[0].required_cents" } }
          trigger:
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p_y}", captures: { err: $.data.error_id } }
          assert:
            - "cs == BLOCKED and dep_status == PENDING and dep_req == 2000000 (both gates failing)"
            - "err == ERR_MATTER_CLEARANCE_BLOCKED (business_safety p7 wins over business_fiscal p11 ERR_RETAINER_UNFUNDED)"

      - name: superseded_check_referential_beats_active_waiver_constraint
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
          - errors[ERR_CHECK_SUPERSEDED]
        distinguishing_aspect: |
          Category pair (business_referential, business_constraint): the waiver-create request fails BOTH
          the referential rule (hit's check is SUPERSEDED) AND the constraint rule (an active DRAFT waiver
          already exists for the hit); priority order pins ERR_CHECK_SUPERSEDED as the winner.
        test_recipe:
          setup:
            - "Matter M1 has CONFIRMED hit H on check CHK1 and an active DRAFT waiver W1 for H"
            - "A roster add then supersedes CHK1 (H stays CONFIRMED; only PENDING hits go STALE)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Quebec Romeo Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Sierra Tango Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Unrelated Extra LLC", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_z: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "w1 terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { w1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_z}", role_in_matter: "WITNESS" }, as: IntakeSpecialist }
          trigger:
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "w2 terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CHECK_SUPERSEDED (referential p9 wins over constraint p10 ERR_WAIVER_ACTIVE_EXISTS, though both hold)"

  # ---------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: credit_band_boundary_740_inclusive
        grounds:
          - calculations.credit_band
          - entities.CreditAssessment.fields.band
        distinguishing_aspect: |
          Metric = credit score on POST /intake/matters/{id}/credit-assessments. The PRIME threshold is an
          inclusive >= 740: score 740 yields PRIME while 739 yields STANDARD — one point flips the band and
          downstream the retainer multiplier (x1 vs x2).
        test_recipe:
          setup: ["Matter M (INTAKE) exists"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Boundary Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 740 }, as: BillingClerk, captures: { band_740: $.data.band } }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 739 }, as: BillingClerk, captures: { band_739: $.data.band } }
          assert:
            - "band_740 == PRIME (inclusive threshold: >= 740)"
            - "band_739 == STANDARD (one point below flips the band)"

      - name: retainer_exact_equality_funded
        grounds:
          - calculations.retainer_required_amount
          - state_machines.RetainerDeposit.PARTIALLY_FUNDED_to_FUNDED
        distinguishing_aspect: |
          Metric = money (received_cents vs required_cents) on POST /intake/retainer-deposits/{id}/transition.
          FUNDED uses >= : received == required exactly counts as funded; one cent short does not.
        test_recipe:
          setup:
            - "Matter M (INTAKE) with PRIME assessment (800) and ISSUED letter estimating 2,000,000 -> deposit required_cents == 2000000"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Equality Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id } }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id", dep_req: "$.data[0].required_cents" } }
          trigger:
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 1999999 }, as: BillingClerk, captures: { st1: $.data.status, rc1: $.data.received_cents } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 1 }, as: BillingClerk, captures: { st2: $.data.status, rc2: $.data.received_cents } }
          assert:
            - "dep_req == 2000000"
            - "st1 == PARTIALLY_FUNDED and rc1 == 1999999 (one cent short of required)"
            - "st2 == FUNDED and rc2 == 2000000 (exact equality counts as funded: received >= required)"

  # ---------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: countersign_gated_by_matter_clearance
        grounds:
          - state_machines.EngagementLetter.ISSUED_to_COUNTERSIGNED
          - entities.Matter.fields.clearance_status
        distinguishing_aspect: |
          Pair (EngagementLetter, Matter): the letter's COUNTERSIGN transition is valid only when the
          PARENT matter's derived clearance_status is CLEARED or WAIVED. Here every other gate passes
          (valid PRIME credit, deposit FUNDED, letter fresh) and the sole blocker is clearance BLOCKED.
        test_recipe:
          setup:
            - "Matter M1 clearance BLOCKED via CONFIRMED hit; credit assessment 800 (PRIME, valid); letter ISSUED; deposit FUNDED at exactly required 2,000,000"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Victor Whiskey Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Xray Yankee Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${m1}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m1}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id } }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m1}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id" } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 2000000 }, as: BillingClerk, captures: { dep_st: $.data.status } }
          trigger:
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p_y}", captures: { err: $.data.error_id } }
          assert:
            - "dep_st == FUNDED (fiscal gate passes)"
            - "err == ERR_MATTER_CLEARANCE_BLOCKED (the cross-entity gate Letter<-Matter.clearance_status is the sole blocker)"

      - name: waiver_create_gated_by_check_state
        grounds:
          - state_machines.ConflictCheck.COMPLETED_to_SUPERSEDED
          - "validations[priority=9]"
        distinguishing_aspect: |
          Pair (WaiverRequest, ConflictCheck): waiver creation is valid only while the referenced hit's
          ConflictCheck is still COMPLETED. Once a roster change supersedes the check, the same create call
          fails with ERR_CHECK_SUPERSEDED even though the hit itself remains CONFIRMED.
        test_recipe:
          setup:
            - "Matter M1 has CONFIRMED hit H on check CHK1; no waiver exists yet for H"
            - "A roster add supersedes CHK1"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Zulu Alpha Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_x: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Bravo Charlie Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_y: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Extra Witness LLC", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_z: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_x}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_y}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_x}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_z}", role_in_matter: "WITNESS" }, as: IntakeSpecialist }
          trigger:
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "terms" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CHECK_SUPERSEDED (waiver create depends on the ConflictCheck's state, not just the hit's)"

  # ---------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: responsible_attorney_half_open_overlap
        grounds:
          - "validations[priority=7]"
          - errors[ERR_ATTORNEY_ADVERSE_OVERLAP]
          - entities.Matter.fields.closed_at
        distinguishing_aspect: |
          Resource = Matter (responsibility interval). Interval semantics = half-open [opened_at, closed_at)
          with null end = open-ended: creating a matter for client PA with responsible attorney R is rejected
          while R's other matter M1 (where PA is ADVERSE) is OPEN, but allowed once M1 is CLOSED with
          closed_at <= the new matter's creation instant — exact-boundary equality is disjoint (allowed).
        test_recipe:
          setup:
            - "Matter M1 (client PC 'Halo Client Inc', responsible RA) fully countersigned OPEN at 2026-08-10; party PA 'Halo Adverse Corp' added ADVERSE on M1"
            - "Conflicts partner CP exists for the CLOSE action"
