          difficulty_instance: dual_variant_calc / printed_vs_adjusted_content_pct
          rationale: "That instance places a 1000.0 PENDING_INSPECTION domestic lot beside VERIFIED 400 US / 600 CN lots and asserts manufactured_products_pct == 0.4000, which holds only if non-VERIFIED lots are excluded from the input set."

