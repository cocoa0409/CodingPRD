  - name: duplicate_cohort_code_within_one_audit_is_rejected
    claim_type: violation_error
    grounds:
    - "validations[priority=37]"
    - "errors[ERR_COHORT_DUPLICATE]"
    - "endpoints[POST /idv/bias-audits/{id}/cohort-metrics]"
    distinguishing_aspect: "cohort_code is unique per bias_audit_id rather than globally, so filing AGE_18_24 twice on the same audit is rejected while the same code on a different audit of the same profile\
      \ is fine."
    test_recipe:
      setup:
      - "The clock is 2026-08-01T00:00:00Z, docv1 exists and a COLLECTING audit over 2026-06-01 -> 2026-07-01 already carries cohort AGE_18_24 with 100 attempts and 5 false rejects."
