  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mit_windows_padded_by_the_clearance_buffer_on_both_sides
        grounds:
          - validations.priority_24_ERR_MIT_WINDOW_CONFLICT
          - global_constants.MIT_BUFFER_HOURS
          - entities.MechanicalIntegrityTest.fields.scheduled_start_at
        distinguishing_aspect: |
          Each SCHEDULED window on a well is padded by MIT_BUFFER_HOURS = 12 on BOTH sides, and the padded
          comparison is strict, so around an existing window of [2026-08-10T00:00Z, 06:00Z) a new test starting
          at exactly 2026-08-10T18:00Z is accepted, a test ending at exactly 2026-08-09T12:00Z (12h before the
          existing start) is accepted, and a test starting one minute earlier at 2026-08-10T17:59Z is refused
          with ERR_MIT_WINDOW_CONFLICT. Only the two-sided padded predicate produces all three outcomes: a
          one-sided check accepts the 17:59Z test, and a >= comparison refuses both boundary tests.
        test_recipe:
          setup:
            - "Field F_STD with one well rated 600000 Dth/day."
            - "A SCHEDULED TIGHTNESS MIT A on that well spanning 2026-08-10T00:00Z..2026-08-10T06:00Z, created while the clock is 2026-08-01T00:00:00Z so no window is in the past."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "TIGHTNESS", scheduled_start_at: "2026-08-10T00:00:00Z", scheduled_end_at: "2026-08-10T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "engineer-a"
              captures: { ma: $.data.id }
          trigger:
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "TIGHTNESS", scheduled_start_at: "2026-08-09T06:00:00Z", scheduled_end_at: "2026-08-09T12:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "engineer-a"
              captures: { mb: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "TIGHTNESS", scheduled_start_at: "2026-08-10T18:00:00Z", scheduled_end_at: "2026-08-10T22:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "engineer-a"
              captures: { mc: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "TIGHTNESS", scheduled_start_at: "2026-08-10T17:59:00Z", scheduled_end_at: "2026-08-10T21:59:00Z" }
              as: IntegrityEngineer
              as_user_id: "engineer-a"
              captures: { e1: $.data.error_id }
          assert:
            - "MIT ${mb} is created with HTTP 201 (its end 2026-08-09T12:00Z is exactly MIT_BUFFER_HOURS before A's start)"
            - "MIT ${mc} is created with HTTP 201 (its start 2026-08-10T18:00Z is exactly MIT_BUFFER_HOURS after A's end)"
            - "${e1} == ERR_MIT_WINDOW_CONFLICT with HTTP 409 (2026-08-10T17:59Z falls one minute inside A's padded window)"
            - "exactly 3 MechanicalIntegrityTests exist on well ${w1}, all with status == SCHEDULED"
            - "Well.${w1}.integrity_state == MIT_CURRENT and operational_state == IN_SERVICE (scheduling changes nothing)"
            - "StorageField.${f1}.field_posture == OPEN"

      - name: compressor_horsepower_aggregated_over_partially_overlapping_windows
        grounds:
          - validations.priority_25_ERR_HORSEPOWER_OVERSUBSCRIBED
          - entities.CompressorRun.fields.window_start_at
          - entities.CompressorUnit.fields.rated_horsepower
        distinguishing_aspect: |
          The horsepower ceiling is enforced per instant, not per run and not per calendar day: on a 6000 hp
          unit a 4000 hp run over [00:00Z, 08:00Z) admits a 3000 hp run starting at exactly 08:00Z but refuses
          the same 3000 hp run starting at 06:00Z, where only two hours overlap and the instantaneous sum
          reaches 7000. A 2000 hp run nested inside the accepted 08:00Z run is admissible (5000 <= 6000), and a
          further 1001 hp run overlapping both of those is refused on the three-run aggregate 6001 — so the
          check has to sum every covering run rather than compare pairs.
        test_recipe:
          setup:
            - "Field F_STD with one well; one compressor unit rated 6000 hp, derate_factor 0.0."
            - "One SCHEDULED run of 4000 hp over 2026-08-05T00:00Z..08:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "CU-01", rated_horsepower: 6000, derate_factor: 0.0 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 4000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T06:00:00Z", window_end_at: "2026-08-05T12:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T08:00:00Z", window_end_at: "2026-08-05T12:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r2: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T11:00:00Z", allocated_horsepower: 2000, mode: "WITHDRAWAL" }
              as: FieldOperator
              captures: { r3: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T10:00:00Z", window_end_at: "2026-08-05T10:30:00Z", allocated_horsepower: 1001, mode: "INJECTION" }
              as: FieldOperator
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_HORSEPOWER_OVERSUBSCRIBED with HTTP 409 (4000 + 3000 over the shared [06:00Z, 08:00Z) slice)"
            - "run ${r2} is created with HTTP 201 (starting exactly at 08:00Z does not overlap [00:00Z, 08:00Z))"
            - "run ${r3} is created with HTTP 201 (3000 + 2000 == 5000 <= 6000 over [09:00Z, 11:00Z))"
            - "${e2} == ERR_HORSEPOWER_OVERSUBSCRIBED with HTTP 409 (3000 + 2000 + 1001 == 6001 over [10:00Z, 10:30Z))"
            - "CompressorUnit.${u1}.scheduled_run_count == 3 (only ${r1}, ${r2} and ${r3} exist)"
            - "CompressorRun.${r3}.duration_hours is null until completion and CompressorUnit.${u1}.lifetime_fuel_dth == 0"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ticket_reversal_restores_field_and_contract_quantities_to_the_exact_opening_position
        grounds:
          - state_machines.GasMovementTicket.transitions.CONFIRMED_to_REVERSED
          - calculations.contract_position_reconciliation
          - entities.StorageField.fields.retained_fuel_pool_dth
        distinguishing_aspect: |
          The reversal has to undo four quantities that the confirm moved by different amounts — working gas by
          the actual 82000, the retained fuel pool by the retention 984.000, the contract balance by the net
          81016.000 and the contract imbalance by the 2000 Dth overrun — and land exactly on the opening
          position (3,000,000 / 0.000 / 0.000 / 0.000) with the gas_volume_conservation residual at 0.000.
          The compensation is additive, not a delete: a second DAILY_IMBALANCE entry of -2000.000 appears next
          to the original +2000.000, the ticket's stamped money fields survive, and the field version keeps
          climbing.
        test_recipe:
          setup:
            - "Field F_STD (opening 3,000,000 Dth) with one well rated 600000 Dth/day."
            - "One FIRM contract, ACTIVE, commodity 0.0450 and index 3.4500."
            - "A CONFIRMED nomination of 80000 Dth INJECTION for gas day 2026-08-02 and a CONFIRMED ticket metering 82000 Dth (2.5% overrun)."
            - "No RegulatoryReport exists, so the reporting-period lock never fires."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CT-REV", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
              captures: { c1_v1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${c1_v1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
