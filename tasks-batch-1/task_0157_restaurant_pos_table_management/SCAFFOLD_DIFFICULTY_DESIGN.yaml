            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id }
            - call: "POST /courses/${crs}/fire"
              payload: {}
