            - "second trigger fails with error_id == ERR_VENDOR_OVERLAP (start 08-07 < 08-08 collides)"
            - "ScopeItem.${it3}.status remains PLANNED"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_scope_requires_planned_scope_item
        grounds:
          - state_machines.Turn.OPEN_to_SCOPED
          - errors[ERR_NO_SCOPE_ITEMS]
        distinguishing_aspect: |
          Entity pair Turn × ScopeItem: the Turn OPEN→SCOPED transition is
          gated on the aggregate state of its ScopeItems (>= 1 PLANNED); with
          zero items it fails with ERR_NO_SCOPE_ITEMS, and succeeds after an item
          is added.
        test_recipe:
          setup:
            - "Turn OPEN with no scope items"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
          trigger:
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
          assert:
            - "first finalize fails with error_id == ERR_NO_SCOPE_ITEMS (http 422); turn stays OPEN"
            - "second finalize succeeds: Turn.${t}.status == SCOPED, approved_budget_cents == 5000, started_on == 2026-08-01, target_ready_date == 2026-08-06"
            - "Unit.${u}.status == IN_TURN"

      - name: commitment_creation_requires_active_turn
        grounds:
          - state_machines.LeaseCommitment
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DELIVERY_BEFORE_PROJECTED]
        distinguishing_aspect: |
          Different entity pair than finalize_scope (LeaseCommitment × Turn, not
          Turn × ScopeItem): commitment creation is gated on the turn being in
          {SCOPED, IN_PROGRESS, REWORK} — while the turn is OPEN it fails with
          ERR_INVALID_STATE; after finalize it succeeds with
          committed_delivery_date == projected_ready_date (>= is inclusive).
        test_recipe:
          setup:
            - "Turn OPEN with one PLANNED REPAIR item (estimate 5000)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "B Kay", committed_delivery_date: "2026-08-10" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "B Kay", committed_delivery_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { lc: $.data.id }
          assert:
            - "first commitment fails with error_id == ERR_INVALID_STATE (turn OPEN is not in {SCOPED, IN_PROGRESS, REWORK})"
            - "second commitment ${lc} created with status ACTIVE; committed 2026-08-03 == projected_ready_date 2026-08-03 satisfies the inclusive >="

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: vendor_calendar_half_open_overlap_semantics
        grounds:
          - errors[ERR_VENDOR_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics #1 — pairwise half-open occupation of the Vendor
          resource: collision iff start < other.end AND other.start < end over
          the SAME vendor's SCHEDULED|ACCEPTED assignments; an identical window
          for a DIFFERENT vendor does not collide (occupation is per-vendor).
        test_recipe:
          setup:
            - "Vendor V1 (CLEAN) SCHEDULED [2026-08-05, 2026-08-08) on turn T1; vendor V2 (CLEAN) free"
            - "Turns T2, T3 (separate units) SCOPED with one PLANNED CLEAN item each"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "102", square_feet: 800 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "103", square_feet: 800 }
              as: PropertyManager
              captures: { u3: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u1}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t1}", category: "CLEAN", description: "clean 101", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it1: $.data.id }
            - call: "POST /make-ready/turns/${t1}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "CleanCo One", trade: "CLEAN" }
              as: PropertyManager
              captures: { v1: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "CleanCo Two", trade: "CLEAN" }
              as: PropertyManager
              captures: { v2: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it1}", vendor_id: "${v1}", start_date: "2026-08-05", end_date: "2026-08-08" }
              as: TurnCoordinator
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u2}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t2: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t2}", category: "CLEAN", description: "clean 102", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it2: $.data.id }
            - call: "POST /make-ready/turns/${t2}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u3}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t3: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t3}", category: "CLEAN", description: "clean 103", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it3: $.data.id }
            - call: "POST /make-ready/turns/${t3}/finalize-scope"
              payload: {}
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it2}", vendor_id: "${v2}", start_date: "2026-08-05", end_date: "2026-08-08" }
              as: TurnCoordinator
              captures: { ok: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it3}", vendor_id: "${v1}", start_date: "2026-08-06", end_date: "2026-08-07" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "identical window for vendor V2 succeeds: assignment ${ok} status SCHEDULED (occupation is per-vendor)"
            - "nested window [08-06, 08-07) inside V1's [08-05, 08-08) fails with error_id == ERR_VENDOR_OVERLAP"

      - name: paint_carpet_cure_buffer_semantics
        grounds:
          - errors[ERR_CURE_BUFFER_VIOLATION]
          - validations[priority=8]
          - calculations.projected_ready_date
        distinguishing_aspect: |
          Interval semantics #2 — mandatory buffer, not pairwise overlap: on the
          turn's unit calendar a CARPET assignment must start >= latest same-turn
          PAINT assignment end_date + 1 cure day; start == paint end (2026-08-07)
          is rejected even though no days are shared, start == end+1 (2026-08-08)
          is allowed. Different resource (turn/unit calendar, not vendor).
        test_recipe:
          setup:
            - "Turn SCOPED with PAINT item (estimate 100000) and CARPET item (estimate 5000, auto-PLANNED at 500bp <= 1000bp)"
            - "PAINT assignment [2026-08-05, 2026-08-07) accepted and COMPLETED (actual 9000)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "repaint", estimated_cost_cents: 100000 }
              as: TurnCoordinator
              captures: { it_p: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CARPET", description: "recarpet", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it_c: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v_p: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "CarpetCo", trade: "CARPET" }
              as: PropertyManager
              captures: { v_c: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_p}", vendor_id: "${v_p}", start_date: "2026-08-05", end_date: "2026-08-07" }
              as: TurnCoordinator
              captures: { asg_p: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg_p}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/vendor-assignments/${asg_p}/complete"
              payload: { actual_cost_cents: 9000 }
              as: Vendor
              as_user_id: "${v_p}"
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_c}", vendor_id: "${v_c}", start_date: "2026-08-07", end_date: "2026-08-09" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_c}", vendor_id: "${v_c}", start_date: "2026-08-08", end_date: "2026-08-09" }
              as: TurnCoordinator
              captures: { ok: $.data.id }
          assert:
            - "first trigger fails with error_id == ERR_CURE_BUFFER_VIOLATION (start 08-07 < paint end 08-07 + 1 cure day, despite zero shared days)"
            - "second trigger succeeds: assignment ${ok} status SCHEDULED (start 08-08 == paint end + 1 satisfies the buffer)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: estimated_cost_add_void_conservation
        grounds:
          - calculations.turn_estimated_cost
          - state_machines.ScopeItem.PLANNED_to_VOIDED
          - entities.Turn.fields.estimated_cost_cents
        distinguishing_aspect: |
          Conserved quantity is the money aggregate: turn.estimated_cost_cents ==
          Σ estimated_cost_cents over items in {PLANNED, SCHEDULED, COMPLETED,
          FAILED}. Forward action add(A, 5000) paired with compensating void(A)
          returns the aggregate to exactly the pre-add value (7000 from item B),
          no drift.
        test_recipe:
          setup:
            - "Turn OPEN; item B (CLEAN, estimate 7000) added first → estimated 7000"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CLEAN", description: "item B", estimated_cost_cents: 7000 }
              as: TurnCoordinator
              captures: { ib: $.data.id }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "item A", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { ia: $.data.id }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${ia}/void"
              payload: {}
              as: TurnCoordinator
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
          assert:
            - "before add: Turn.${t}.estimated_cost_cents == 7000"
            - "after add: estimated_cost_cents == 12000"
            - "after compensating void: estimated_cost_cents == 7000 (invariant restored exactly; VOIDED item excluded from the sum)"
            - "ScopeItem.${ia}.status == VOIDED"

      - name: vendor_open_assignment_create_decline_conservation
        grounds:
          - entities.Vendor.fields.open_assignment_count
          - state_machines.VendorAssignment.SCHEDULED_to_DECLINED
          - state_machines.ScopeItem.SCHEDULED_to_PLANNED
        distinguishing_aspect: |
          Different conserved quantity than the money aggregate: a count —
          open_assignment_count == |assignments of the vendor in {SCHEDULED,
          ACCEPTED}|. Forward create (+1) paired with compensating decline (−1)
          returns the count to 0 and returns the scope item to PLANNED.
        test_recipe:
          setup:
            - "Turn SCOPED with one PLANNED REPAIR item; vendor V (REPAIR trade) has no assignments"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "GET /make-ready/vendor-assignments?vendor_id=${v}&status=SCHEDULED"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "GET /make-ready/vendor-assignments?vendor_id=${v}&status=SCHEDULED"
              payload: {}
              as: PropertyManager
            - call: "POST /make-ready/vendor-assignments/${asg}/decline"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "GET /make-ready/vendor-assignments?vendor_id=${v}&status=SCHEDULED"
              payload: {}
              as: PropertyManager
          assert:
            - "before create: filtered list total_count == 0 (open_assignment_count == 0)"
            - "after create: total_count == 1 (forward action +1)"
            - "after compensating decline: total_count == 0 (invariant restored; DECLINED is not an open status)"
            - "VendorAssignment.${asg}.status == DECLINED and ScopeItem.${it}.status == PLANNED"
