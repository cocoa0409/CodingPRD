          assert:
            - "err == ERR_GENERAL_PERMIT_INELIGIBLE (422)"

      - name: corner_mitigation_threshold_boundary
        claim_type: boundary_check
        grounds: [entities.PermitApplication.fields.compensatory_mitigation_required, "validations[priority=30]", "errors[ERR_MITIGATION_NOT_SECURED]"]
        distinguishing_aspect: "The mitigation trigger is strictly-greater: a GENERAL application at exactly 0.10 acres issues with no plan at all; at 0.11 acres render-decision ISSUE fails with ERR_MITIGATION_NOT_SECURED."
