            - "${panel_after} == PASSED, ${panel_attempt} == 1 and ${panel_retests} == 0"
            - "the DIMENSIONAL_STABILITY_HEAT result carries unit PCT, spec_limit 0.25 (GLUE_DOWN, not click-lock) and outcome PASS"
            - "${sku_after_panel} == PROVISIONAL — the SKU advanced without any call addressed to it"

      - name: cyclic_retest_loop_on_test_panel
        claim_type: cyclic
        excluded_because:
          difficulty_instance: "test_panel_marginal_retest_loop_terminates_at_max_retests"
          rationale: |
            The IN_TEST -> RETEST_REQUIRED -> IN_TEST cycle, its attempt_no /
            retest_count bookkeeping and the V-CON-8 termination cap are already walked
            edge by edge over three attempts by that §1.8 instance. A breadth instance
            here would re-drive the same loop with the same fixtures.

      - name: cascade_down_from_raw_material_restriction
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: "raw_material_restriction_five_hop_cascade_to_allocation"
          rationale: |
            The deepest downward cascade in the model (material -> formulation -> SKU ->
            batch -> allocation line -> allocation) is asserted hop by hop there,
            including the quantities returned at the last hop.

      - name: compensation_on_run_abort
        claim_type: compensation
        excluded_because:
          difficulty_instance: "license_reserved_entitlement_conserved_across_create_and_abort"
          rationale: |
            The abort edge's compensating side effect is verified there as a conservation
            law — reserved_volume_sqm bit-identical before and after a create/abort pair,
            with no Batch minted and no royalty accrued.

      - name: ledger_sync_between_run_and_license
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: "royalty_money_and_consumed_area_reversed_exactly_on_qc_scrap"
          rationale: |
            The money-and-area ledger synchronisation between ProductionRun and
            DesignLicense, including the exact reversal of the STORED royalty integer on
            SCRAPPED rather than a recomputation, is the whole subject of that instance.

      - name: guarded_transition_into_setup
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: "run_setup_blocked_until_sku_certification_reaches_provisional"
          rationale: |
            The setup edge's cross-entity guard (certification must have reached
            PROVISIONAL and commercial must be DEVELOPMENT or RELEASED) is exercised
            there in both directions, before and after the panel result that lifts the
            SKU out of TESTING.

  # ===========================================================================
  # Guide section 3 — Table 3 (Calculations) + algorithm types + variants
  # ===========================================================================
  - section: calculations
    instances:

      - name: blend_metrics_correct_result_on_three_category_recipe
        claim_type: correct_result
        grounds:
          - "calculations.formulation_blend_metrics"
          - "entities.Formulation.fields.performance_score"
          - "entities.Formulation.fields.indentation_resistance_class"
        distinguishing_aspect: |
          The straightforward correct-result claim on the eight-output blend calculation,
          exercised with all three ratio-bearing categories present and with
          plasticizer_ratio landing exactly on the 0.25 ladder rung, so BOTH penalties
          must be 0 (the mid rung is a strict `>` comparison).
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmFiller
            - *rmSoft
            - *fstd
            - *fstdC1
            - *fstdC2
          trigger:
            - *fstdC3
            - call: "GET /formulations/${f_std_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { fstd_total: $.data.total_phr, fstd_cost: $.data.blended_cost_per_kg_cents, fstd_score: $.data.performance_score, fstd_class: $.data.indentation_resistance_class }
          assert:
            - "${fstd_total} == 165.00 with resin_phr 100.00, plasticizer_phr 25.00, filler_phr 40.00 and stabilizer_phr 0.00"
            - "${fstd_cost} == 165 (27300 / 165 = 165.454545 -> ROUND_HALF_UP to 0 dp)"
            - "${fstd_score} == 80.39 from blended_indentation 80.848485, blended_thermal 76.848485 and blended_migration_resistance 84.606061 with softness_penalty 0 (ratio exactly 0.2500, not > 0.25) and brittleness_penalty 0 (ratio 0.4000)"
            - "${fstd_class} == CLASS_33_42 — derived from blended_indentation 80.848485, never from the score"

      - name: changeover_gap_skips_aborted_predecessor_run
        claim_type: input_set_filtering
        grounds:
          - "calculations.press_line_changeover_gap.input_set"
          - "entities.ProductionRun.fields.changeover_minutes_applied"
          - "state_machines.ProductionRun run_status=PLANNED -> run_status=ABORTED"
        distinguishing_aspect: |
          Three runs on one line where the CHRONOLOGICALLY nearest predecessor has been
          ABORTED. The gap must be measured against the run before it, which changes both
          the multiplier rung (same formulation 0.50 instead of unrelated 1.00) and the
          thickness surcharge (0 instead of 30) — 30 minutes rather than 90.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *rmFiller
            - *rmSoft
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *fstd
            - *fstdC1
            - *fstdC2
            - *fstdC3
            - &fstdSubmit
              call: "POST /formulations/${f_std_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - &fstdApprove
              call: "POST /formulations/${f_std_id}/review-decision"
              payload: { decision: APPROVE, review_note: "Standard plasticised blend, 80.39." }
              as: TechnicalDirector
              as_user_id: "td-001"
            - *lic
            - *pf1
            - &pfSlate
              call: "POST /print-films"
              payload: { design_code: "PF-SLATE-900", license_id: "${lic_id}", pattern_repeat_mm_length: 900, pattern_repeat_mm_width: 150, registration_tolerance_mm: 0.30, emboss_plate_code: "EP-SLATE-A", emboss_alignment_offset_mm: 0.05, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf_slate_id: $.data.id }
            - *skuA
