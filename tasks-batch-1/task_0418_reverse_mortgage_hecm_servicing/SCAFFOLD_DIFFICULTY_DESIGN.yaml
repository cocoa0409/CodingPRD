  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disbursement_approve_requires_loan_active_current
        grounds:
          - state_machines.Disbursement.transitions.REQUESTED_to_APPROVED
          - entities.Loan.fields.disposition_status
          - entities.Loan.fields.servicing_status
          - errors[ERR_LOAN_NOT_DRAWABLE]
          - endpoints["POST /disbursements/{disbursementId}/approve"]
        distinguishing_aspect: |
          Entity pair Disbursement -> Loan: a Disbursement's REQUESTED->APPROVED transition is valid
          only if the referenced Loan.disposition_status == ACTIVE AND servicing_status == CURRENT;
          with servicing_status flipped to DELINQUENT_OCCUPANCY the approve is rejected
          ERR_LOAN_NOT_DRAWABLE even though disposition_status is still ACTIVE.
        test_recipe:
          setup:
            - "Originated LOC loan; one PENDING cert marked DELINQUENT so servicing_status=DELINQUENT_OCCUPANCY while disposition_status stays ACTIVE; one REQUESTED LINE_DRAW of 100000 (well within line)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer XE1", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ned Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { disb_id: $.data.id }
            - call: "POST /occupancy-certifications"
              payload: { loan_id: "${loan_id}", certification_year: 1 }
              as: ServicerOps
              captures: { cert_id: $.data.id }
            - call: "POST /occupancy-certifications/${cert_id}/mark-delinquent"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LOAN_NOT_DRAWABLE"
            - "Loan.${loan_id}.servicing_status == DELINQUENT_OCCUPANCY, disposition_status == ACTIVE"
            - "Disbursement.${disb_id}.status == REQUESTED (unchanged)"

      - name: property_charge_payment_requires_lesa_funded
        grounds:
          - validations[priority=13]
          - entities.LesaSetAside.fields.status
          - errors[ERR_LESA_EXHAUSTED]
          - endpoints["POST /property-charge-payments"]
        distinguishing_aspect: |
          DIFFERENT entity pair PropertyChargePayment -> LesaSetAside: a new PropertyChargePayment is
          valid only if the referenced LesaSetAside.status == FUNDED; once a prior payment drained the
          pool to remaining_cents==0 (status EXHAUSTED) a new payment is rejected ERR_LESA_EXHAUSTED.
        test_recipe:
          setup:
            - "Originated LINE_OF_CREDIT loan with FULLY_FUNDED LESA initial_amount_cents=6000000; one PropertyChargePayment for 6000000 already POSTED, draining the pool to remaining_cents=0 (EXHAUSTED)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer XE2", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ola Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_id}", funding_mode: "FULLY_FUNDED", annual_property_charge_cents: 600000, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { lesa_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "PROPERTY_TAX", coverage_start: "2024-01-01", coverage_end: "2025-01-01", amount_cents: 6000000 }
              as: ServicerOps
              captures: { pay1_id: $.data.id }
          trigger:
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "HAZARD_INSURANCE", coverage_start: "2025-01-01", coverage_end: "2026-01-01", amount_cents: 100000 }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LESA_EXHAUSTED"
            - "LesaSetAside.${lesa_id}.status == EXHAUSTED, remaining_cents == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
