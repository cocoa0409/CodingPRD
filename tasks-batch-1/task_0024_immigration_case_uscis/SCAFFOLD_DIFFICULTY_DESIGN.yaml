              payload: { alien_number: "A131313131", full_name: "O ASC1", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "o1@x.com" }
              as: Anonymous
              captures: { applicant_a: $.data.id }
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A131313132", full_name: "O ASC2", date_of_birth: "1991-01-01", country_of_chargeability: "WORLDWIDE", email: "o2@x.com" }
              as: Anonymous
              captures: { applicant_b: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_a}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { case_a_id: $.data.id }
            - call: "POST /uscis/cases/${case_a_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_a_id}/biometrics"
              payload: { scheduled_at: "2026-07-02T15:00:00Z", asc_location_code: "ASC-SF-09" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_a_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_b}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_b}"
              captures: { case_b_id: $.data.id }
            - call: "POST /uscis/cases/${case_b_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_b}"
              captures: { officer_id_b: $.data.assigned_officer_id }
          trigger:
            - call: "POST /uscis/cases/${case_b_id}/biometrics"
              payload: { scheduled_at: "2026-07-02T15:00:00Z", asc_location_code: "ASC-SF-09" }
              as: Officer
              as_user_id: "${officer_id_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_ASC_SLOT_TAKEN'"
            - "BiometricsAppointment.${biom_a_id}.status == 'SCHEDULED'"

  # =========================================================================
  # Rule 9 — compensating_invariant (≥ 2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rfe_issue_then_respond_preserves_case_rfe_round_count_versus_status_loop
        grounds:
          - state_machines.Case.UNDER_REVIEW_to_RFE_PENDING
          - state_machines.Case.RFE_PENDING_to_UNDER_REVIEW
          - entities.Case.fields.rfe_round_count
          - entities.Case.fields.status
        distinguishing_aspect: |
          Conserved quantity #1 — Case.status after a complete RFE issue+respond cycle.
          Forward action: POST /uscis/cases/{id}/rfes (Case.status UNDER_REVIEW->RFE_PENDING).
          Compensating action: POST /uscis/rfes/{id}/respond (Case.status RFE_PENDING->UNDER_REVIEW).
          Invariant (formula): Case.status_after == Case.status_before == 'UNDER_REVIEW'.
          Note: rfe_round_count is intentionally NOT conserved (it persists by design as an
          auditable rate counter); the named conserved quantity is Case.status only.
        test_recipe:
          setup:
            - "I-130 case post-advance in UNDER_REVIEW; rfe_round_count=0."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A141414141", full_name: "P Compensate1", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "p1@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["doc_a"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_id: $.data.id, v_after_rfe: $.data.version }
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_after_rfe: $.data.version }
          trigger:
            - call: "POST /uscis/rfes/${rfe_id}/respond"
              payload: { expected_case_version: "${case_v_after_rfe}", response_summary: "Provided doc_a" }
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Case.${case_id}.status == 'UNDER_REVIEW'"
            - "RFE.${rfe_id}.status == 'RESPONDED'"

      - name: biometrics_reschedule_preserves_active_scheduled_appointment_count_versus_status
        grounds:
          - state_machines.BiometricsAppointment.SCHEDULED_to_RESCHEDULED
          - endpoints."POST /uscis/biometrics/{id}/reschedule"
          - entities.BiometricsAppointment.fields.status
          - entities.Case.fields.status
        distinguishing_aspect: |
          Different conserved quantity from instance #1 (status of a sibling, not status of Case).
          Forward action: POST /uscis/cases/{id}/biometrics creates a SCHEDULED appointment.
          Compensating action: POST /uscis/biometrics/{id}/reschedule marks original RESCHEDULED
          AND creates a new SCHEDULED appointment, leaving:
          Invariant (formula): count(BiometricsAppointment where case_id == this_case AND status == 'SCHEDULED') == 1
          (one and only one ACTIVE appointment per case). The named conserved quantity is
          the active-SCHEDULED count, which differs from instance #1's Case.status preservation.
        test_recipe:
          setup:
            - "I-485 case post-file with one SCHEDULED biometrics; case status is BIOMETRICS_SCHEDULED."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A141414142", full_name: "Q Compensate2", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "q@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-07-05T15:00:00Z", asc_location_code: "ASC-SF-10" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_a_id: $.data.id }
          trigger:
            - call: "POST /uscis/biometrics/${biom_a_id}/reschedule"
              payload: { new_scheduled_at: "2026-07-10T16:00:00Z", new_asc_location_code: "ASC-SF-11" }
              as: Officer
              as_user_id: "${officer_id}"
          assert:
            - "BiometricsAppointment.${biom_a_id}.status == 'RESCHEDULED'"
            - "Case.${case_id}.status == 'BIOMETRICS_SCHEDULED'"
            - "count(BiometricsAppointment where case_id == ${case_id} and status == 'SCHEDULED') == 1"
