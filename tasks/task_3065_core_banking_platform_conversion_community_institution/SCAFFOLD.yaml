    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
    side_effects: ["status -> SENT", "resend_count += 1", "scheduled_send_date recomputed per comm_wave_schedule backoff"]
  - method: POST
    path: "/api/v1/customer-comms/{cid}/cancel"
    description: "Cancel a DRAFT or SCHEDULED comm"
    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
    side_effects: ["status -> CANCELLED"]

  # --- Defect ---
  - method: POST
