          assert:
            - "HTTP 200; data.fulfillment_status == \"CANCELLED\"; data.settlement_status is still \"UNSECURED\" (the money dimension is untouched)"
            - "${count_before} == 1 and GET /foreign-buyers/${buyer_id} now reports open_order_count == 0"

      - name: corner_graph_topology_supersedes_lc_chain_is_walkable_by_filter
        claim_type: graph
        grounds:
          - entities.LetterOfCredit.fields.supersedes_lc_id
          - endpoints.GET /letters-of-credit
          - complexity_profile.relationship_patterns.self_referential
        distinguishing_aspect: "The self-referential replacement chain is only legal from a REJECTED or EXPIRED predecessor, and GET /letters-of-credit?supersedes_lc_id=<predecessor> returns exactly the one replacement row — the predecessor itself is not included in its own chain result."
        test_recipe:
          setup:
            - "Credit LC-2026-0001 has been reviewed and REJECTED on a CRITICAL amount finding; a replacement credit LC-2026-0002 is then captured with supersedes_lc_id pointing at it."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0001"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                tolerance_pct: 10.00
                availability: "SIGHT"
                usance_days: 0
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                presentation_period_days: 21
                partial_shipment_allowed: false
                transshipment_allowed: false
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_1: "$.data.id", lc_1_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_1}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_1_v}" }
              captures: { review_1: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_1}/findings"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { code: "AMOUNT_MISMATCH", severity: "CRITICAL", clause_ref: "AMOUNT", detail: "Credit amount does not match the invoice value" }
              captures: { finding_1: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_1}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
