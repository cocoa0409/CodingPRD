scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: package_rate_withheld_vs_debited_split
        grounds:
          - calculations.package_rate
          - calculations.package_rate_authorization
          - entities.Reservation.fields.package_rate_withheld_cents
        distinguishing_aspect: |
          The room fee split (ROOM_FEE_ACTUATION_CENTS) sits inside the Authorization
          variant and outside the Settlement variant, so one Reservation with guest_count
          8 against a max_occupancy-8 room type carries package_rate_total_cents == 116200
          and package_rate_withheld_cents == 113400 on the same row.
        test_recipe:
          setup:
            - "Resort with park_capacity_occupancy_units 36 and day_pass_cap_units 20"
            - "Room type WOLF at base_rate_cents 18900 and max_occupancy 8"
            - "One Reservation for 8 guests, arrival 2026-09-03, departure 2026-09-05"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Traverse City", park_capacity_occupancy_units: 36, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r1_id: "$.data.id" }
            - call: "POST /resorts/${r1_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt1_id: "$.data.id" }
            - call: "POST /resorts/${r1_id}/reservations"
              payload: { room_type_id: "${rt1_id}", guest_count: 8, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res1_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${r1_id}/reservations/${res1_id}"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res1_id}.package_rate_total_cents == 116200"
            - "Reservation.${res1_id}.package_rate_withheld_cents == 113400"
            - "Reservation.package_rate_total_cents - Reservation.package_rate_withheld_cents == 2800"

      - name: activity_refund_sum_then_round_vs_per_attendee
        grounds:
          - calculations.activity_refund_variant
          - entities.ActivityBooking.fields.activity_rate_refund_cents
        distinguishing_aspect: |
          The refund is defined as rounding the attendees' summed gross, not the sum of
          per-attendee rounds: two attendees at base_price_cents 3900 produce 2925 cents
          under the pinned reading and 2926 under the per-attendee reading.
        test_recipe:
          setup:
            - "Resort, one room type, a CONFIRMED group booking for 2 members, and a STANDARD activity session at base_price_cents 3900"
            - "One ActivityBooking for 2 attendees, confirmed then cancelled"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Mason", park_capacity_occupancy_units: 40, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r2_id: "$.data.id" }
            - call: "POST /resorts/${r2_id}/activities"
              payload: { name: "Story Time", tier_code: "STANDARD", base_price_cents: 3900, capacity_units: 20 }
              as: platform_ops
              captures: { sess1_id: "$.data.id" }
            - call: "POST /resorts/${r2_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-10", member_count: 2, deposit_paid_cents: 1000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb1_id: "$.data.id" }
            - call: "POST /resorts/${r2_id}/group-bookings/${gb1_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb1_id}"
            - call: "POST /resorts/${r2_id}/activity-bookings"
              payload: { activity_session_id: "${sess1_id}", group_booking_id: "${gb1_id}", attendees: 2, reservation_id: null }
              as: Group
              as_user_id: "${gb1_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /resorts/${r2_id}/activity-bookings/${ab1_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb1_id}"
          trigger:
            - call: "POST /resorts/${r2_id}/activity-bookings/${ab1_id}/cancel"
              payload: {}
              as: Group
              as_user_id: "${gb1_id}"
              captures: { ab1_cancelled: "$.data" }
          assert:
            - "ActivityBooking.${ab1_id}.activity_booking_status == CANCELLED"
            - "ActivityBooking.${ab1_id}.activity_rate_refund_cents == 2925"
            - "ActivityBooking.${ab1_id}.activity_rate_refund_cents != 2926"

  - rule_id: combinatorial_formula
    instances:

      - name: package_rate_surcharge_nested_occupancy_branch
        grounds:
          - calculations.package_rate
          - entities.RoomType.fields.max_occupancy
          - entities.Reservation.fields.waterpark_included_units
        distinguishing_aspect: |
          Mode (a): package_surcharge_cents is selected by a nested conditional whose
          predicate compares the booking's occupancy against the room type's posted
          maximum, so the same room type and the same two nights price at 113400 for
          6 guests and 116200 for 8 guests.
        test_recipe:
          setup:
            - "Resort with one WOLF room type at base_rate_cents 18900 and max_occupancy 8"
            - "Two Reservations on the same dates: one for 6 guests, one for 8 guests"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Grapevine", park_capacity_occupancy_units: 40, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r3_id: "$.data.id" }
            - call: "POST /resorts/${r3_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt3_id: "$.data.id" }
            - call: "POST /resorts/${r3_id}/reservations"
              payload: { room_type_id: "${rt3_id}", guest_count: 6, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res_at_par_id: "$.data.id" }
            - call: "POST /resorts/${r3_id}/reservations"
              payload: { room_type_id: "${rt3_id}", guest_count: 8, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res_over_par_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${r3_id}/reservations/${res_at_par_id}"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res_at_par_id}.package_rate_total_cents == 113400"
            - "Reservation.${res_over_par_id}.package_rate_total_cents == 116200"
            - "Reservation.${res_at_par_id}.package_rate_total_cents != Reservation.${res_over_par_id}.package_rate_total_cents"

      - name: activity_refund_rounding_order_pinned
        grounds:
          - calculations.activity_refund_variant
          - calculations.activity_rate
        distinguishing_aspect: |
          Mode (b): the refund pins sum-then-round over per-attendee rounding, and the
          two orders diverge by exactly one cent whenever ACTIVITY_REFUND_RATE yields a
          half-cent per attendee.
        test_recipe:
          setup:
            - "Resort, a CONFIRMED birthday group, and a STANDARD activity session at base_price_cents 3900"
            - "One ActivityBooking for 3 attendees, confirmed, then cancelled"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Fitchburg", park_capacity_occupancy_units: 40, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r4_id: "$.data.id" }
            - call: "POST /resorts/${r4_id}/activities"
              payload: { name: "Character Meet", tier_code: "STANDARD", base_price_cents: 3900, capacity_units: 20 }
              as: platform_ops
              captures: { sess2_id: "$.data.id" }
            - call: "POST /resorts/${r4_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-12", member_count: 3, deposit_paid_cents: 1500 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb2_id: "$.data.id" }
            - call: "POST /resorts/${r4_id}/group-bookings/${gb2_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb2_id}"
            - call: "POST /resorts/${r4_id}/activity-bookings"
              payload: { activity_session_id: "${sess2_id}", group_booking_id: "${gb2_id}", attendees: 3, reservation_id: null }
              as: Group
              as_user_id: "${gb2_id}"
              captures: { ab2_id: "$.data.id" }
            - call: "POST /resorts/${r4_id}/activity-bookings/${ab2_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb2_id}"
          trigger:
            - call: "POST /resorts/${r4_id}/activity-bookings/${ab2_id}/cancel"
              payload: {}
              as: Group
              as_user_id: "${gb2_id}"
          assert:
            - "ActivityBooking.${ab2_id}.activity_rate_refund_cents == 4388"
            - "ActivityBooking.${ab2_id}.activity_rate_refund_cents != 4387"
            - "ActivityBooking.${ab2_id}.activity_rate_refund_cents == 4388"

      - name: activity_rate_discount_order_pinned
        grounds:
          - calculations.activity_rate
          - entities.ActivityBooking.fields.activity_rate_total_cents
        distinguishing_aspect: |
          Mode (c): the pricing chain is evaluation-order sensitive — tier_units is
          derived from ActivitySession.tier_code before the bulk discount is subtracted,
          so a PREMIUM session at base_price_cents 3500 with 10 attendees prices at
          69000 and not at the base-price reading of 34000.
        test_recipe:
          setup:
            - "Resort, a CONFIRMED group, and a PREMIUM activity session at base_price_cents 3500"
            - "One ActivityBooking for 10 attendees"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Gurnee", park_capacity_occupancy_units: 40, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r5_id: "$.data.id" }
            - call: "POST /resorts/${r5_id}/activities"
              payload: { name: "Premium Splash Party", tier_code: "PREMIUM", base_price_cents: 3500, capacity_units: 30 }
              as: platform_ops
              captures: { sess3_id: "$.data.id" }
            - call: "POST /resorts/${r5_id}/group-bookings"
              payload: { group_kind: "SCHOOL", service_date: "2026-09-14", member_count: 10, deposit_paid_cents: 5000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb3_id: "$.data.id" }
            - call: "POST /resorts/${r5_id}/group-bookings/${gb3_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb3_id}"
          trigger:
            - call: "POST /resorts/${r5_id}/activity-bookings"
              payload: { activity_session_id: "${sess3_id}", group_booking_id: "${gb3_id}", attendees: 10, reservation_id: null }
              as: Group
              as_user_id: "${gb3_id}"
              captures: { ab3_id: "$.data.id" }
          assert:
            - "ActivityBooking.${ab3_id}.activity_rate_total_cents == 69000"
            - "ActivityBooking.${ab3_id}.activity_rate_total_cents != 34000"
            - "ActivityBooking.${ab3_id}.activity_booking_status == PENDING_PAYMENT"

  - rule_id: non_linear_state_machine
    instances:

      - name: wristband_reissue_returns_to_issued
        grounds:
          - state_machines.Wristband.transitions.ACTIVE_to_ISSUED
          - state_machines.Wristband.transitions.ISSUED_to_ACTIVE
          - entities.Wristband.fields.superseded_by_wristband_id
        distinguishing_aspect: |
          Wristband.wristband_status is cyclic rather than a pipeline: ACTIVE returns to
          ISSUED, and a band that has travelled ACTIVE to REISSUED can never re-enter the
          cycle because superseded_by_wristband_id is then non-null.
        test_recipe:
          setup:
            - "Resort with a WOLF room type at base_rate_cents 18900, max_occupancy 8, and arcade_credit_rate_cents_per_unit 9450"
            - "A checked-in Reservation for 2 guests and two guest wristbands issued against it"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Concord", park_capacity_occupancy_units: 30, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 9450 }
              as: platform_ops
              captures: { r6_id: "$.data.id" }
            - call: "POST /resorts/${r6_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt6_id: "$.data.id" }
            - call: "POST /resorts/${r6_id}/reservations"
              payload: { room_type_id: "${rt6_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res6_id: "$.data.id" }
            - call: "POST /resorts/${r6_id}/reservations/${res6_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${r6_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Ava", reservation_id: "${res6_id}" }
              as: FrontDesk
              captures: { wb_a_id: "$.data.id" }
            - call: "POST /resorts/${r6_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Ben", reservation_id: "${res6_id}" }
              as: FrontDesk
              captures: { wb_b_id: "$.data.id" }
            - call: "POST /resorts/${r6_id}/wristbands/${wb_a_id}/activate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${r6_id}/wristbands/${wb_a_id}/reissue"
              payload: {}
              as: FrontDesk
              captures: { wb_new_id: "$.data.superseded_by_wristband_id" }
          assert:
            - "Wristband.${wb_a_id}.wristband_status == REISSUED"
            - "Wristband.${wb_new_id}.wristband_status == ISSUED"
            - "Wristband.${wb_new_id}.arcade_credit_limit_cents == 18900"

      - name: attraction_status_parallel_to_shift_status
        grounds:
          - calculations.lifeguard_attraction_status
          - state_machines.LifeguardShift.transitions.ON_DUTY_to_ROTATED
          - entities.Attraction.fields.attraction_status
        distinguishing_aspect: |
          Attraction.attraction_status evolves on a second, independent axis from
          LifeguardShift.shift_status: rotating a staffer ON_DUTY to ROTATED leaves the
          attraction OPEN while completing that same shift to COMPLETED drops it to LIMITED.
        test_recipe:
          setup:
            - "Resort with a LIFEGUARD-certified rostered staffer named Dana and an attraction demanding 2 staffers"
            - "One scheduled shift for Dana on 2026-09-03, started then rotated"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Wisconsin Dells", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r7_id: "$.data.id" }
            - call: "POST /resorts/${r7_id}/managers"
              payload: { async_role: "AquaticsManager", async_name: "Dana" }
              as: platform_ops
            - call: "POST /resorts/${r7_id}/attractions"
              payload: { name: "Howlin Tornado", min_occupancy_units: 2, required_certification: "NONE" }
              as: AquaticsManager
              captures: { att7_id: "$.data.id" }
            - call: "POST /resorts/${r7_id}/lifeguard-shifts"
              payload: { attraction_id: "${att7_id}", staffer_name: "Dana", certification_code: "LIFEGUARD", shift_date: "2026-09-03", start_minute: 540, end_minute: 780, rotation_minutes: 60 }
              as: AquaticsManager
              captures: { sh7_id: "$.data.id" }
            - call: "POST /resorts/${r7_id}/lifeguard-shifts/${sh7_id}/start"
              payload: {}
              as: AquaticsManager
          trigger:
            - call: "POST /resorts/${r7_id}/lifeguard-shifts/${sh7_id}/rotate"
              payload: {}
              as: AquaticsManager
          assert:
            - "LifeguardShift.${sh7_id}.shift_status == ROTATED"
            - "Attraction.${att7_id}.attraction_status == LIMITED"

  - rule_id: transitive_cascade
    instances:

      - name: release_cabana_unwinds_group_member_admissions
        grounds:
          - state_machines.Cabana.transitions.BOOKED_to_HELD
          - state_machines.CabanaBooking.transitions.BOOKED_to_COMPLETED
          - calculations.group_reserved_units
        distinguishing_aspect: |
          Depth 3 from the cabana release: the release flips the booking to HELD, that
          recalculation zeroes GroupBooking.group_reserved_units, and that zeroing is what
          unchecks the group's members — no hop is caused by the original request directly.
        test_recipe:
          setup:
            - "Resort with a CONFIRMED 2-member group, a cabana, and a booked cabana occupation"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Manteca", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r8_id: "$.data.id" }
            - call: "POST /resorts/${r8_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-15", member_count: 2, deposit_paid_cents: 1000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb8_id: "$.data.id" }
            - call: "POST /resorts/${r8_id}/group-bookings/${gb8_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb8_id}"
            - call: "POST /resorts/${r8_id}/group-members"
              payload: { group_booking_id: "${gb8_id}", member_name: "Cleo", member_units: 1 }
              as: Group
              as_user_id: "${gb8_id}"
              captures: { gm8a_id: "$.data.id" }
            - call: "POST /resorts/${r8_id}/group-members"
              payload: { group_booking_id: "${gb8_id}", member_name: "Dev", member_units: 1 }
              as: Group
              as_user_id: "${gb8_id}"
              captures: { gm8b_id: "$.data.id" }
            - call: "POST /resorts/${r8_id}/cabanas"
              payload: { cabana_label: "CAB-1", cabana_kind: "CABANA", capacity_units: 4 }
              as: platform_ops
              captures: { cab8_id: "$.data.id", cab8_v: "$.data.version" }
            - call: "POST /resorts/${r8_id}/cabana-bookings"
              payload: { cabana_id: "${cab8_id}", group_booking_id: "${gb8_id}", service_date: "2026-09-15", start_minute: 600, end_minute: 720, member_units: 2, expected_cabana_version: "${cab8_v}" }
              as: Group
              as_user_id: "${gb8_id}"
              captures: { cb8_id: "$.data[0].id" }
            - call: "POST /resorts/${r8_id}/cabana-bookings/${cb8_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb8_id}"
          trigger:
            - call: "POST /resorts/${r8_id}/cabana-bookings/${cb8_id}/release"
              payload: {}
              as: platform_ops
          assert:
            - "CabanaBooking.${cb8_id}.cabana_booking_status == HELD"
            - "GroupBooking.${gb8_id}.group_reserved_units == 0"
            - "GroupMember.${gm8a_id}.checked_in == false"
            - "GroupMember.${gm8b_id}.checked_in == false"

      - name: pool_closure_revokes_band_then_declines_grants
        grounds:
          - calculations.pool_posture
          - state_machines.Wristband.transitions.ISSUED_to_REVOKED
          - entities.ArcadeCreditGrant.fields.grant_status
        distinguishing_aspect: |
          Depth 2 from the FAIL reading: the reading revokes the standing wristbands, and
          that revocation is what declines their outstanding arcade grants, so a grant
          posted against a band outside the closure stays SUCCEEDED.
        test_recipe:
          setup:
            - "Resort with a WOLF room type, an attraction, a checked-in Reservation on 2026-09-03 and an active guest band"
            - "One PENDING arcade grant on that band"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Bloomington", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 9450 }
              as: platform_ops
              captures: { r9_id: "$.data.id" }
            - call: "POST /resorts/${r9_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:00:00Z" }
              as: platform_ops
            - call: "POST /resorts/${r9_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt9_id: "$.data.id" }
            - call: "POST /resorts/${r9_id}/attractions"
              payload: { name: "Bear Track", min_occupancy_units: 1, required_certification: "NONE" }
              as: AquaticsManager
              captures: { att9_id: "$.data.id" }
            - call: "POST /resorts/${r9_id}/reservations"
              payload: { room_type_id: "${rt9_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res9_id: "$.data.id" }
            - call: "POST /resorts/${r9_id}/reservations/${res9_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${r9_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Eve", reservation_id: "${res9_id}" }
              as: FrontDesk
              captures: { wb9_id: "$.data.id" }
            - call: "POST /resorts/${r9_id}/wristbands/${wb9_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${r9_id}/wristbands/${wb9_id}/arcade-grants"
              payload: { amount_cents: 900 }
              as: Anonymous
              captures: { grant9_id: "$.data.id", grant9_status: "$.data.grant_status" }
          trigger:
            - call: "POST /resorts/${r9_id}/water-quality-logs"
              payload: { attraction_id: "${att9_id}", sampled_at: "2026-09-03T11:00:00Z", ph_reading: 6.1, free_chlorine_ppm: 2.0, turbidity_ntu: 0.4 }
              as: AquaticsManager
              captures: { log9_id: "$.data.id" }
          assert:
            - "Wristband.${wb9_id}.wristband_status == REVOKED"
            - "Wristband.${wb9_id}.access_denied_reason == 'WATER_QUALITY_CLOSED'"
            - "ArcadeCreditGrant.${grant9_id}.grant_status == DECLINED"
            - "Resort.${r9_id}.pool_posture == CLOSED"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: branch_manager_cannot_override_safety_closure_priority
        grounds:
          - validations[priority=8]
          - validations[priority=7]
        distinguishing_aspect: |
          A business_safety pair: the water-quality plausibility gate at priority 8 outranks
          the attraction-open gate at priority 7, so a reading that is both implausible and
          taken at a CLOSED attraction fails as ERR_WATER_QUALITY_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "Resort with an attraction that has never had a staffer posted, so it is CLOSED"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Sandusky", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r10_id: "$.data.id" }
            - call: "POST /resorts/${r10_id}/attractions"
              payload: { name: "Tamarin Trail", min_occupancy_units: 1, required_certification: "LIFEGUARD" }
              as: AquaticsManager
              captures: { att10_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${r10_id}/water-quality-logs"
              payload: { attraction_id: "${att10_id}", sampled_at: "2026-09-03T11:00:00Z", ph_reading: 15.0, free_chlorine_ppm: 2.0, turbidity_ntu: 0.4 }
              as: AquaticsManager
              captures: { err10: "$.data.error_id" }
          assert:
            - "${err10} == ERR_WATER_QUALITY_OUT_OF_RANGE"
            - "Attraction.${att10_id}.attraction_status == CLOSED"
            - "no WaterQualityLog exists for Attraction ${att10_id}"

      - name: out_of_range_service_date_outranks_day_pass_cap
        grounds:
          - validations[priority=4]
          - validations[priority=10]
        distinguishing_aspect: |
          A business_temporal vs business_constraint pair: the deposit horizon gate at
          priority 4 outranks the day-pass ceiling at priority 10, so a request that is
          both past the horizon and over a zero ceiling fails as
          ERR_SERVICE_DATE_OUT_OF_RANGE, never as ERR_DAY_PASS_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Resort with day_pass_cap_units 0 (so any request breaches the ceiling) and the logical clock at its 2026-09-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Sandusky", park_capacity_occupancy_units: 30, day_pass_cap_units: 0, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r22_id: "$.data.id", r22_v: "$.data.version" }
          trigger:
            - call: "POST /resorts/${r22_id}/day-passes"
              payload: { service_date: "2027-10-01", units_requested: 1, expected_resort_version: "${r22_v}" }
              as: FrontDesk
              captures: { err22: "$.data.error_id" }
          assert:
            - "${err22} == ERR_SERVICE_DATE_OUT_OF_RANGE"
            - "day_pass_reserved_units for 2027-10-01 == 0"
            - "Resort.${r22_id}.day_pass_cap_units == 0"

  - rule_id: boundary_precision_check
    instances:

      - name: arcade_ceiling_exact_equality_admits
        grounds:
          - validations[priority=12]
          - entities.Wristband.fields.arcade_credit_remaining_cents
        distinguishing_aspect: |
          A numeric threshold on a wristband ceiling: a grant of exactly
          arcade_credit_remaining_cents is accepted and leaves the remainder at 0, while
          one cent more is rejected, so the comparison is >= and not >.
        test_recipe:
          setup:
            - "Resort with a WOLF room type at base_rate_cents 18900, a checked-in Reservation and an active guest band"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Grapevine", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 18900 }
              as: platform_ops
              captures: { r12_id: "$.data.id" }
            - call: "POST /resorts/${r12_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: platform_ops
            - call: "POST /resorts/${r12_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt12_id: "$.data.id" }
            - call: "POST /resorts/${r12_id}/reservations"
              payload: { room_type_id: "${rt12_id}", guest_count: 1, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res12_id: "$.data.id" }
            - call: "POST /resorts/${r12_id}/reservations/${res12_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${r12_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Gil", reservation_id: "${res12_id}" }
              as: FrontDesk
              captures: { wb12_id: "$.data.id" }
            - call: "POST /resorts/${r12_id}/wristbands/${wb12_id}/activate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${r12_id}/wristbands/${wb12_id}/arcade-grants"
              payload: { amount_cents: 18900 }
              as: Anonymous
              captures: { grant12_id: "$.data.id" }
          assert:
            - "ArcadeCreditGrant.${grant12_id}.grant_status == SUCCEEDED"
            - "Wristband.${wb12_id}.arcade_credit_spent_cents == 18900"
            - "Wristband.${wb12_id}.arcade_credit_remaining_cents == 0"

      - name: park_capacity_exact_equality_admits
        grounds:
          - calculations.resort_park_occupancy
          - validations[priority=11]
        distinguishing_aspect: |
          A capacity threshold on an admission: occupancy exactly equal to
          park_capacity_occupancy_units is admitted, so the gate is <= and not <, and the
          very next occupancy unit is rejected.
        test_recipe:
          setup:
            - "Resort with park_capacity_occupancy_units 12, one Reservation for 6 guests, and a 6-unit day pass on 2026-09-03 bringing occupancy to exactly 12"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Fitchburg", park_capacity_occupancy_units: 12, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r13_id: "$.data.id", r13_v: "$.data.version" }
            - call: "POST /resorts/${r13_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: platform_ops
            - call: "POST /resorts/${r13_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt13_id: "$.data.id" }
            - call: "POST /resorts/${r13_id}/reservations"
              payload: { room_type_id: "${rt13_id}", guest_count: 6, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res13_id: "$.data.id" }
            - call: "GET /resorts/${r13_id}"
              payload: {}
              as: platform_ops
              captures: { r13_v_now: "$.data.version" }
            - call: "POST /resorts/${r13_id}/day-passes"
              payload: { service_date: "2026-09-03", units_requested: 6, expected_resort_version: "${r13_v_now}" }
              as: FrontDesk
              captures: { dp13_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${r13_id}/capacity"
              payload: { service_date: "2026-09-03" }
              as: FrontDesk
          assert:
            - "occupancy_units for 2026-09-03 == 12"
            - "capacity_remaining_units for 2026-09-03 == 0"
            - "Resort.${r13_id}.park_capacity_occupancy_units == 12"

      - name: day_pass_zero_units_remaining_rejects_admission
        grounds:
          - calculations.day_pass_reserved_units
          - errors[ERR_DAY_PASS_UNITS_EXHAUSTED]
        distinguishing_aspect: |
          An empty-collection edge: when a day pass has zero RESERVED units left because
          its band was revoked, admitting that band must fail on the zero-count boundary
          rather than silently consuming a negative quantity.
        test_recipe:
          setup:
            - "Resort with a 6-unit RESERVED day pass on 2026-09-03 whose issued band was revoked by a Reservation check-in on the same service date"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Gurnee", park_capacity_occupancy_units: 40, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
