            - call: "GET /production-slots/00000000-0000-4000-8000-000000000017"
              payload: {}
              as: TalentAgent
              captures: { e_slot: $.data.error_id }
            - call: "POST /payout-statements/00000000-0000-4000-8000-000000000018/disburse"
