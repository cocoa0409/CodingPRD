            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 16 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PAUSE_DURATION_EXCEEDED (75 + 16 == 91 > 90); Subscription.${sub_id}.status remains ACTIVE"

