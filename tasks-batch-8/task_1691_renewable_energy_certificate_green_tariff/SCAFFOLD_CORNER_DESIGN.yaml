          trigger:
            - call: "POST /greenpower/meter-readings/${r_edge}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r_old}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
              captures: { err: $.data.error_id }
          assert:
