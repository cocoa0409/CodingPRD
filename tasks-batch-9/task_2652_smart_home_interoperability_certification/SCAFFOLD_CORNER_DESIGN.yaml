          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          The role check sits at priority 2, above path existence at priority 4, so a wrong-role request
          against an id that does not exist still answers 403 rather than 404 - which is what makes the
          whole matrix testable from an almost empty database. It also catches the two counter-intuitive
          cells: ProgramAdmin owns publication but NOT withdrawal (ComplianceOfficer only) and owns session
          booking and cancellation but NOT running a session (TestLaboratory only), and the clock endpoint
          is exempt from priority 1 but not from priority 2.
