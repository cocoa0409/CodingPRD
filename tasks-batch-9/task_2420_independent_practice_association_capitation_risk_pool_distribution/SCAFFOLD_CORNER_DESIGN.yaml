              payload: { physician_id: "${p_e4}", measurement_period: "2026", hedis_composite_bps: 7000, access_score_bps: 7000, patient_experience_bps: 7000, attributed_member_months: 12, expected_physician_version: "${p_e4_v}" }
              as: IpaAdmin
              captures: { sc_e4: "$.data.id" }
            - call: "POST /ipa/quality-scorecards/${sc_e4}/state"
              payload: { to_state: "FINAL" }
              as: IpaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_e4}/state"
              payload: { to_state: "CLOSED_FOR_INCURRAL" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_e4}/state"
              payload: { to_state: "RESERVED" }
              as: IpaAdmin
              captures: { pool_e4_ibnr: "$.data.ibnr_reserve_cents" }
          trigger:
            - call: "GET /ipa/risk-pools/${pool_e4}/settlement-preview"
              as: IpaAdmin
              captures: { prev_e4_gross: "$.data.gross_claims_cents", prev_e4_net: "$.data.net_claims_cents", prev_e4_raw: "$.data.raw_surplus_cents", prev_e4_ratio: "$.data.surplus_ratio_bps", prev_e4_tier: "$.data.surplus_tier", prev_e4_fee_bps: "$.data.admin_fee_bps", prev_e4_fee: "$.data.admin_fee_cents", prev_e4_dist: "$.data.distributable_surplus_cents", prev_e4_savings: "$.data.shared_savings_pool_cents" }
            - call: "POST /ipa/risk-pools/${pool_e4}/state"
              payload: { to_state: "SETTLEMENT_PROPOSED" }
              as: IpaAdmin
              captures: { pool_e4_raw: "$.data.raw_surplus_cents", pool_e4_tier: "$.data.surplus_tier", pool_e4_fee: "$.data.admin_fee_cents", pool_e4_dist: "$.data.distributable_surplus_cents", pool_e4_savings: "$.data.shared_savings_pool_cents" }
            - call: "GET /ipa/pool-distributions"
              payload: { pool_id: "${pool_e4}", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { pd_e4_savings: "$.data[0].shared_savings_cents", pd_e4_net: "$.data[0].net_distribution_cents" }
          assert:
            - "${pool_e4_ibnr} == 0 — no PAID claims, so the completion-factor reserve is round_half_up(0 * 10000 / 8000) = 0"
            - "${prev_e4_gross} == 0 and ${prev_e4_net} == 0 and ${prev_e4_raw} == 20000"
            - "${prev_e4_ratio} == 10000 and ${prev_e4_tier} == \"TIER_3\" and ${prev_e4_fee_bps} == 1000"
            - "${prev_e4_fee} == 2000 and ${prev_e4_dist} == 18000 and ${prev_e4_savings} == 10800"
            - "${pool_e4_raw} == ${prev_e4_raw} and ${pool_e4_tier} == ${prev_e4_tier} and ${pool_e4_fee} == ${prev_e4_fee} and ${pool_e4_dist} == ${prev_e4_dist} and ${pool_e4_savings} == ${prev_e4_savings} — the preview predicted the proposal exactly"
            - "call 3 returns total_count == 1 with ${pd_e4_savings} == 10800 and ${pd_e4_net} == 10800 (withhold_share_cents 0, since quality_withhold_bps is 0)"

      - name: panel_reopen_under_review_posture_rejected_then_allowed_after_void
        claim_type: conditional_action
        grounds:
          - validations.priority_29_ERR_CAPITATION_POSTURE_RESTRICTED
          - state_machines.PhysicianMember.CLOSED_TO_NEW_to_OPEN
          - calculations.capitation_posture_derivation
        distinguishing_aspect: |
          The reopen action is allowed only while capitation_posture == CURRENT.
          A PAID claim of 20000 against a pool funded 20000 drives loss_ratio_bps
          to 10000, sets deficit_flag and moves the posture to UNDER_REVIEW, so
          the reopen must fail with ERR_CAPITATION_POSTURE_RESTRICTED even though
          the panel is CLOSED_TO_NEW and the physician is ACTIVE. Voiding the
          claim clears the deficit, returns the posture to CURRENT and makes the
          identical reopen succeed — the action is gated on state elsewhere in the
          graph, not on the panel row itself.
        test_recipe:
          setup:
            - "Agreement AGR_E5 with a PROFESSIONAL 2026 pool funded 20000, one ACTIVE physician whose panel has been PATCHed to CLOSED_TO_NEW, and one PAID claim of 20000 that leaves the pool in deficit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Posture Gate Health", payer_tax_id: "94-3000075", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e5: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e5}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e5}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_e5: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e5}/physicians"
              payload: { npi: "5800000001", full_name: "Dr Posture Gate", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_e5: "$.data.id" }
            - call: "POST /ipa/physicians/${p_e5}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e5}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_e5}/enrollees"
              payload: { external_member_id: "E5-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_e5: "$.data.id", e_e5_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_e5}", physician_id: "${p_e5}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_e5_v}" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e5}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-E5-2026-07" }
              as: IpaAdmin
              captures: { file_e5: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_e5}/rows"
              payload: { external_member_id: "E5-0001", physician_npi: "5800000001", row_action: "ADD", claimed_capitation_cents: 20000, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_e5}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_e5}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_e5}/state"
              payload: { to_state: "POSTED" }
              as: IpaAdmin
            - call: "PATCH /ipa/physicians/${p_e5}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: NetworkManager
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_e5}", enrollee_id: "${e_e5}", attributed_physician_id: "${p_e5}", pool_type: "PROFESSIONAL", downstream_provider_name: "Posture Gate Hospital", billed_cents: 20000, service_date: "2026-07-10T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_e5: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_e5}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 20000 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_e5}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
              captures: { clm_e5_paid: "$.data.paid_cents" }
          trigger:
            - call: "GET /ipa/delegation-agreements/${agr_e5}"
              as: IpaAdmin
              captures: { agr_e5_posture_1: "$.data.capitation_posture" }
            - call: "PATCH /ipa/physicians/${p_e5}/panel-status"
              payload: { panel_status: "OPEN" }
              as: NetworkManager
              captures: { posture_error: "$.data.error_id" }
            - call: "POST /ipa/downstream-claims/${clm_e5}/state"
              payload: { to_state: "VOIDED" }
              as: ClaimsExaminer
            - call: "GET /ipa/delegation-agreements/${agr_e5}"
              as: IpaAdmin
              captures: { agr_e5_posture_2: "$.data.capitation_posture" }
            - call: "PATCH /ipa/physicians/${p_e5}/panel-status"
              payload: { panel_status: "OPEN" }
              as: NetworkManager
              captures: { p_e5_panel_after: "$.data.panel_status" }
          assert:
            - "${clm_e5_paid} == 20000 and RiskPool.${pool_e5}.loss_ratio_bps == 10000 with deficit_flag == true"
            - "${agr_e5_posture_1} == \"UNDER_REVIEW\""
            - "call 2 returns HTTP 409 with ${posture_error} == \"ERR_CAPITATION_POSTURE_RESTRICTED\" and PhysicianMember.${p_e5}.panel_status is still \"CLOSED_TO_NEW\""
            - "${agr_e5_posture_2} == \"CURRENT\" — the void clears the deficit and the posture derivation falls through to CURRENT"
            - "${p_e5_panel_after} == \"OPEN\" — the identical reopen now succeeds; only the posture changed"
            - "RiskPool.${pool_e5}.paid_claims_cents == 0 and deficit_flag == false"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_path_id_not_found_code_is_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - validations.priority_4_path_id_existence
          - errors.ERR_PHYSICIAN_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_ENROLLMENT_FILE_NOT_FOUND
          - errors.ERR_REMITTANCE_NOT_FOUND
          - errors.ERR_RISK_POOL_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_RECOVERY_NOT_FOUND
          - errors.ERR_SCORECARD_NOT_FOUND
          - errors.ERR_DISTRIBUTION_NOT_FOUND
        distinguishing_aspect: |
          Each entity family owns a distinct 404 code, and a well-formed but
          unknown UUID on each single-resource GET must return that family's own
          code — not a shared generic ERR_NOT_FOUND and not a 500. The nine
          codes not already exercised by the entities section are covered here in
          one sweep so the catalog has no dead entries.
        test_recipe:
          setup:
            - "No fixture; every id below is a well-formed UUID that was never minted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "GET /ipa/physicians/00000000-0000-4000-8000-0000000000f1"
              as: IpaAdmin
              captures: { err_physician: "$.data.error_id" }
            - call: "GET /ipa/member-assignments/00000000-0000-4000-8000-0000000000f2"
              as: IpaAdmin
              captures: { err_assignment: "$.data.error_id" }
            - call: "GET /ipa/enrollment-files/00000000-0000-4000-8000-0000000000f3"
              as: IpaAdmin
              captures: { err_file: "$.data.error_id" }
            - call: "GET /ipa/capitation-remittances/00000000-0000-4000-8000-0000000000f4"
              as: IpaAdmin
              captures: { err_remittance: "$.data.error_id" }
            - call: "GET /ipa/risk-pools/00000000-0000-4000-8000-0000000000f5"
              as: IpaAdmin
              captures: { err_pool: "$.data.error_id" }
            - call: "GET /ipa/downstream-claims/00000000-0000-4000-8000-0000000000f6"
              as: ClaimsExaminer
              captures: { err_claim: "$.data.error_id" }
            - call: "GET /ipa/stop-loss-recoveries/00000000-0000-4000-8000-0000000000f7"
              as: ReinsuranceUnderwriter
              captures: { err_recovery: "$.data.error_id" }
            - call: "GET /ipa/quality-scorecards/00000000-0000-4000-8000-0000000000f8"
              as: IpaAdmin
              captures: { err_scorecard: "$.data.error_id" }
            - call: "GET /ipa/pool-distributions/00000000-0000-4000-8000-0000000000f9"
              as: IpaAdmin
              captures: { err_distribution: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with the standard error envelope { error_id, message }"
            - "${err_physician} == \"ERR_PHYSICIAN_NOT_FOUND\" and ${err_assignment} == \"ERR_ASSIGNMENT_NOT_FOUND\""
            - "${err_file} == \"ERR_ENROLLMENT_FILE_NOT_FOUND\" and ${err_remittance} == \"ERR_REMITTANCE_NOT_FOUND\""
            - "${err_pool} == \"ERR_RISK_POOL_NOT_FOUND\" and ${err_claim} == \"ERR_CLAIM_NOT_FOUND\""
            - "${err_recovery} == \"ERR_RECOVERY_NOT_FOUND\" and ${err_scorecard} == \"ERR_SCORECARD_NOT_FOUND\""
            - "${err_distribution} == \"ERR_DISTRIBUTION_NOT_FOUND\""
            - "no two of the nine responses carry the same error_id"

      - name: body_foreign_keys_are_resolved_in_input_order_not_found
        claim_type: every_error_code_is_triggerable
        grounds:
          - validations.priority_5_body_foreign_key_existence
          - errors.ERR_ENROLLEE_NOT_FOUND
          - errors.ERR_PHYSICIAN_NOT_FOUND
        distinguishing_aspect: |
          Rule 5 resolves body foreign keys in the endpoint's declared input
          order, and POST /ipa/member-assignments declares enrollee_id before
          physician_id. A request with BOTH ids unknown must therefore return
          ERR_ENROLLEE_NOT_FOUND; repairing only enrollee_id must then expose
          ERR_PHYSICIAN_NOT_FOUND. An implementation that resolves physician
          first, or that reports a combined error, diverges on the first call.
        test_recipe:
          setup:
            - "Agreement AGR_R2 ACTIVE with one real enrollee; no assignment yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Fk Order Health", payer_tax_id: "94-3000076", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_r2: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_r2}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_r2}/enrollees"
              payload: { external_member_id: "R2-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_r2: "$.data.id", e_r2_v: "$.data.version" }
          trigger:
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "00000000-0000-4000-8000-0000000000fa", physician_id: "00000000-0000-4000-8000-0000000000fb", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_r2_v}" }
              as: NetworkManager
              captures: { err_first: "$.data.error_id" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_r2}", physician_id: "00000000-0000-4000-8000-0000000000fb", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_r2_v}" }
              as: NetworkManager
              captures: { err_second: "$.data.error_id" }
          assert:
            - "call 1 returns HTTP 404 with ${err_first} == \"ERR_ENROLLEE_NOT_FOUND\" — enrollee_id is declared first in the input list"
            - "call 2 returns HTTP 404 with ${err_second} == \"ERR_PHYSICIAN_NOT_FOUND\""
            - "no MemberAssignment exists for Enrollee.${e_r2} afterwards and DelegationAgreement.${agr_r2}.total_assigned_members == 0"
            - "Enrollee.${e_r2}.version is unchanged, so ${e_r2_v} remains the valid expected_enrollee_version"

      - name: stop_loss_not_attached_code_is_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_STOP_LOSS_NOT_ATTACHED
        excluded_because:
          difficulty_instance: boundary_precision_check / stop_loss_attachment_rejected_at_exact_then_allowed_one_cent_above
          rationale: "That §1.8 instance triggers the code with eligible_paid exactly at the attachment and then shows the one-cent-above case succeeding, so the code has a dedicated failing test already."

      - name: physician_not_accepting_assignments_code_is_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / physician_notice_given_wins_over_full_panel_capacity
          rationale: "The NOTICE_GIVEN physician there returns this exact code with HTTP 409 before the panel-capacity rule is reached."

      - name: pool_period_overlap_code_is_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_POOL_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pool_year_closed_interval_shared_endpoint_collides
          rationale: "A second pool of the same type sharing one endpoint instant is rejected with this code there, and the disjoint pool is accepted, so the code is covered."

      - name: panel_not_transferred_code_is_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_PANEL_NOT_TRANSFERRED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / physician_exit_blocked_by_active_assignment
          rationale: "The EXITED attempt with a live assignment returns this code there, and the exit succeeds once the assignment leaves its non-terminal states."

      - name: assignment_before_coverage_and_period_overlap_codes_are_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_ASSIGNMENT_BEFORE_COVERAGE
          - errors.ERR_ASSIGNMENT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_before_coverage_wins_over_period_overlap
          rationale: "Both codes are asserted in that one instance — the first when both rules are violated, the second once only the coverage clause is repaired."

      - name: enrollment_file_empty_and_scorecard_not_final_codes_are_reachable
        claim_type: every_error_code_is_triggerable
        grounds:
          - errors.ERR_ENROLLMENT_FILE_EMPTY
          - errors.ERR_SCORECARD_NOT_FINAL
        excluded_because:
          difficulty_instance: boundary_precision_check / enrollment_file_row_count_boundary_at_zero_then_one
          rationale: "ERR_ENROLLMENT_FILE_EMPTY is triggered there at row_count 0 and matched_row_count 0; ERR_SCORECARD_NOT_FINAL is triggered by cross_entity_state_dependency / pool_settlement_proposal_blocked_by_non_final_scorecard, so neither code is dead."

  # ===========================================================================
  - section: rbac
    instances:

      - name: ipa_admin_and_network_manager_perform_their_own_exclusive_operations
        claim_type: role_can_perform_own_operations
        grounds:
          - roles.IpaAdmin.exclusive_operations
          - roles.NetworkManager.exclusive_operations
        distinguishing_aspect: |
          The positive half of the RBAC matrix. IpaAdmin must be able to create an
          agreement, drive its lifecycle transition and create a risk pool;
          NetworkManager must be able to credential and activate a physician,
          reopen a CLOSED_TO_NEW panel and terminate an assignment. Every call
          here is on the acting role's own exclusive list, so all of them must
          return 2xx — an over-restrictive implementation that gates these behind
          a single super-role fails.
        test_recipe:
          setup:
            - "Empty slate; the whole recipe is the positive RBAC walk."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Rbac Positive Health", payer_tax_id: "94-3000077", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_r1: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_r1}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
              captures: { agr_r1_status: "$.data.status" }
            - call: "POST /ipa/delegation-agreements/${agr_r1}/risk-pools"
              payload: { pool_type: "INSTITUTIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_r1: "$.data.id", pool_r1_status: "$.data.status", pool_r1_due: "$.data.settlement_due_date" }
            - call: "POST /ipa/delegation-agreements/${agr_r1}/physicians"
              payload: { npi: "5900000001", full_name: "Dr Rbac Positive", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_r1: "$.data.id" }
            - call: "POST /ipa/physicians/${p_r1}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_r1}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
              captures: { p_r1_cred: "$.data.credential_status" }
            - call: "PATCH /ipa/physicians/${p_r1}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: NetworkManager
            - call: "PATCH /ipa/physicians/${p_r1}/panel-status"
              payload: { panel_status: "OPEN" }
              as: NetworkManager
              captures: { p_r1_panel: "$.data.panel_status" }
            - call: "POST /ipa/delegation-agreements/${agr_r1}/enrollees"
              payload: { external_member_id: "R1-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_r1: "$.data.id", e_r1_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_r1}", physician_id: "${p_r1}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_r1_v}" }
              as: NetworkManager
              captures: { ma_r1: "$.data.id" }
            - call: "POST /ipa/member-assignments/${ma_r1}/state"
              payload: { to_state: "TERMINATED" }
              as: NetworkManager
              captures: { ma_r1_status: "$.data.status" }
          assert:
            - "every call returns 2xx"
            - "${agr_r1_status} == \"ACTIVE\" and DelegationAgreement.${agr_r1}.capitation_posture == \"CURRENT\""
            - "${pool_r1_status} == \"ACCUMULATING\" and ${pool_r1_due} == \"2027-09-27T23:59:59Z\" — the INSTITUTIONAL lag is 270 days"
            - "${p_r1_cred} == \"ACTIVE\" and ${p_r1_panel} == \"OPEN\" — the reopen is NetworkManager-exclusive and succeeds while the posture is CURRENT"
            - "${ma_r1_status} == \"TERMINATED\" and PhysicianMember.${p_r1}.panel_size == 0"

      - name: roles_cannot_perform_another_roles_exclusive_operation_returns_403
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - roles.IpaAdmin.exclusive_operations
          - roles.NetworkManager.exclusive_operations
          - roles.ClaimsExaminer.exclusive_operations
        distinguishing_aspect: |
          Three cross-role attempts that must each return ERR_UNAUTHORIZED with
          HTTP 403 and no state change: NetworkManager creating an agreement
          (IpaAdmin-exclusive), ClaimsExaminer patching a panel status
          (NetworkManager / PhysicianUser only), and ReinsuranceUnderwriter
          creating a risk pool (IpaAdmin-exclusive). The 403 must be returned
          before any body validation, so an invalid enum in the same payload must
          still surface as ERR_UNAUTHORIZED rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Agreement AGR_R2B ACTIVE with one physician on an OPEN panel, created by the roles that are allowed to do so."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Rbac Negative Health", payer_tax_id: "94-3000078", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_r2b: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_r2b}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_r2b}/physicians"
              payload: { npi: "6000000001", full_name: "Dr Rbac Negative", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_r2b: "$.data.id", p_r2b_v: "$.data.version" }
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Rbac Forbidden Health", payer_tax_id: "94-3000079", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: NetworkManager
              captures: { err_agreement_create: "$.data.error_id" }
            - call: "PATCH /ipa/physicians/${p_r2b}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: ClaimsExaminer
              captures: { err_panel_patch: "$.data.error_id" }
            - call: "POST /ipa/delegation-agreements/${agr_r2b}/risk-pools"
              payload: { pool_type: "NOT_A_POOL_TYPE", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: ReinsuranceUnderwriter
              captures: { err_pool_create: "$.data.error_id" }
          assert:
            - "${err_agreement_create} == \"ERR_UNAUTHORIZED\" with HTTP 403 and no agreement with payer_tax_id \"94-3000079\" exists"
            - "${err_panel_patch} == \"ERR_UNAUTHORIZED\" with HTTP 403; PhysicianMember.${p_r2b}.panel_status is still \"OPEN\" and version is still ${p_r2b_v}"
            - "${err_pool_create} == \"ERR_UNAUTHORIZED\" (not ERR_INVALID_REQUEST) — priority 2 outranks the priority 3 body check that the bogus pool_type would otherwise trip"
            - "zero RiskPool rows exist for DelegationAgreement.${agr_r2b}"

      - name: request_with_missing_x_user_role_header_returns_401_unauthenticated
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - roles.IpaAdmin
        distinguishing_aspect: |
          Priority 1 checks the identity headers before anything else. A request
          with no X-User-Role header and a request whose X-User-Role names a role
          that is not declared in §1.7 must both return ERR_UNAUTHENTICATED with
          HTTP 401 — not 403, and not a 200 that silently defaults to some role.
          Both calls target a plain list read that every declared role is allowed
          to make, so only the identity headers can be responsible.
        test_recipe:
          setup:
            - "No fixture; the header shape is the whole subject."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "GET /ipa/delegation-agreements"
              payload: { limit: 10, offset: 0 }
              as: NONE
              captures: { err_no_header: "$.data.error_id" }
            - call: "GET /ipa/delegation-agreements"
              payload: { limit: 10, offset: 0 }
              as: AuditorUser
              captures: { err_unknown_role: "$.data.error_id" }
          assert:
            - "call 1 is sent with the X-User-Role header omitted entirely and returns HTTP 401 with ${err_no_header} == \"ERR_UNAUTHENTICATED\""
            - "call 2 is sent with X-User-Role: AuditorUser, a value not declared in §1.7, and returns HTTP 401 with ${err_unknown_role} == \"ERR_UNAUTHENTICATED\" (not 403)"
            - "a request carrying X-User-Role: IpaAdmin but an empty X-User-ID likewise returns ERR_UNAUTHENTICATED"
            - "both responses carry the standard error envelope { error_id, message } and no list payload"

      - name: physician_user_cannot_patch_another_physicians_panel_status
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - validations.priority_6_ERR_NOT_RESOURCE_OWNER
          - roles.PhysicianUser.identity
        distinguishing_aspect: |
          PhysicianUser is entity-backed: its X-User-ID must equal the
          PhysicianMember id it acts on. Closing another physician's panel is a
          role-allowed operation on the wrong resource, so it must return
          ERR_NOT_RESOURCE_OWNER (403) rather than ERR_UNAUTHORIZED, and the same
          request against the caller's own record must succeed. An implementation
          that only checks the role, or that returns ERR_UNAUTHORIZED for the
          ownership failure, is caught.
        test_recipe:
          setup:
            - "Agreement AGR_R4 ACTIVE with two ACTIVE physicians on OPEN panels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
