    roles: [FoundryAdmin, LineOperator, QualityInspector, WarrantyManager]
    code: 200
    input: ["mold_id?", "order_id?", "routing_status?", "quality_status?", "limit?", "offset?"]
    output: "Casting[]"
    side_effects: []
  - method: POST
    path: "/api/castings/{id}/advance"
    description: "Advance routing one step (SHAKEOUT->CLEANING->GRINDING->FINAL_INSPECTION->COMPLETE)"
    roles: [LineOperator]
    code: 200
    input: []
    output: Casting
    side_effects: ["routing_status advanced per Casting machine; FINAL_INSPECTION->COMPLETE requires quality ACCEPTED/USE_AS_IS"]

  # --- InspectionReport ---
  - method: POST
    path: "/api/inspections"
