            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { pw_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${pw_team_id}", player_id: "${pw_p_id}", transaction_type: "SIGNING", expected_team_version: "${pw_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${pw_team_id}"
              captures: { pw_txn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T21:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /transactions/${pw_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${pw_team_id}"
              captures: { pw_err: $.data.error_id }
