        test_recipe:
          setup: ["three static faces F2a/F2b/F2c (not illuminated, 50000; permits to 2026-12-31); campaign APPROVED with three confirmed BOOKED 4-week flights: A starts 2026-08-29, B starts 2026-08-28, C starts 2026-08-14; clock is 2026-08-01"]
