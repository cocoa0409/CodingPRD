                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-AISC", description: "AISC certified fabricator", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s14_id: $.data.id }
            - call: "POST /procurement/solicitations/${s14_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v17_id}", cause_code: "FRAUD", aggravating_factor_codes: ["FRAUD"], mitigating_factor_codes: [], interim_suspension: true }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d4_id: $.data.id }
            - call: "GET /procurement/solicitations/${s14_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
