          assert:
            - "Before the trigger WocNurse.${n1_id}.active_consult_load == 3 and max_consult_load == 3"
            - "Call 1 returns HTTP 422 with data.error_id == ERR_NURSE_LOAD_EXCEEDED — the check is `load < max` evaluated before the increment, so 3 < 3 is false"
            - "After call 1: ConsultRequest.${c4_id}.status is still TRIAGED with assigned_nurse_id == null, and WocNurse.${n1_id}.active_consult_load is still 3 — no partial increment leaked"
            - "Call 3 returns HTTP 200 and ConsultRequest.${c1_id}.status == ESCALATED with escalation_count == 1; the logical clock 2026-08-05T00:00:00Z is strictly after sla_due_at 2026-08-04T00:00:00Z"
            - "Escalation does not release the nurse: WocNurse.${n1_id}.active_consult_load is still 3"
            - "Call 4 returns HTTP 200 even though load 3 is at the ceiling, because payload assigned_nurse_id == ConsultRequest.${c1_id}.assigned_nurse_id and the ESCALATED -> ASSIGNED precondition only checks the load when the nurse CHANGES"
            - "After call 4: ConsultRequest.${c1_id}.status == ASSIGNED and WocNurse.${n1_id}.active_consult_load is STILL 3 — a re-assignment to the incumbent must not double-count"

