            - "ALLOW on ${ex_ok} returns 200 with ALLOWED / ALLOWED_BY_REVIEW and billable_amount 220.00 (200.00 * 1.10)"
            - "ExpenseItem.${ex_doc}: DISALLOWED / STATUTORY_UNALLOWABLE at creation — documented and below the threshold, so the exclusion clause is reached directly"
            - "Project.${p_priv}.unbilled_wip == 220.00 and Project.${p_pub}.unbilled_wip == 0.00"

      - name: fixed_fee_headroom_refuses_then_admits_the_same_invoice
