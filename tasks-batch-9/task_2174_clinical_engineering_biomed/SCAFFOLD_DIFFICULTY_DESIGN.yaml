            - "PMTask.${pt_id}.completed_at == null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: risk_score_26_is_high_25_is_medium
        grounds:
          - calculations.device_risk_classification
          - entities.Device.fields.risk_score
          - entities.Device.fields.risk_class
          - entities.Device.fields.pm_interval_days
        distinguishing_aspect: |
          Boundary metric #1 — the NUMERIC risk_score threshold on POST /devices. Two units
          differing only in maintenance_requirement_code (2 vs 3) land on risk_score 25 and
          26; because RISK_HIGH_MIN uses an inclusive >=, 25 must classify MEDIUM with
          pm_interval_days 270 and 26 must classify HIGH with pm_interval_days 180.
        test_recipe:
          setup:
            - "One facility, one department and one non-network-connected monitor model."
            - "The logical clock at its 2026-08-01T00:00:00Z default, so a 2023-01-10 acquisition is exactly 3 years old and contributes no age adder."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000, is_network_connected: false }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-EDGE-25", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 7, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 1 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_low_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-EDGE-26", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 7, physical_risk_code: 3, maintenance_requirement_code: 3, condition_score: 1 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_high_id: $.data.id }
          assert:
            - "Device.${dev_low_id}.risk_score == 25"
            - "Device.${dev_low_id}.risk_class == MEDIUM"
            - "Device.${dev_low_id}.pm_interval_days == 270"
            - "Device.${dev_high_id}.risk_score == 26"
            - "Device.${dev_high_id}.risk_class == HIGH"
            - "Device.${dev_high_id}.pm_interval_days == 180"

      - name: pm_audit_empty_denominator_strict_zero_operational_hundred
        grounds:
          - calculations.pm_compliance_rate
          - entities.Facility.fields.pm_compliance_pct_strict
          - entities.Facility.fields.pm_compliance_pct_operational
          - entities.Facility.fields.pm_audit_index
          - validations[priority=5]
        distinguishing_aspect: |
          Boundary metric #2 — the EMPTY-COLLECTION edge on a different endpoint
          (POST /facilities/{id}/pm-audit). With zero PM tasks inside the compliance window,
          the two denominators are both empty yet report deliberately asymmetric constants:
          pm_compliance_pct_strict == 0.00 and pm_compliance_pct_operational == 100.00, and
          the empty strict denominator suppresses the posture escalation that a 0.00 rate
          would otherwise trigger against a 90.00 target.
        test_recipe:
          setup:
            - "One facility with pm_compliance_target_pct 90.00 and one device."
            - "One PM task whose window opens on 2026-09-01, i.e. entirely after the audit clock, so nothing is due."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, condition_score: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/pm-tasks"
              payload: { device_id: "${dev1_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T23:59:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/facilities/${f_id}/pm-audit"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "Facility.${f_id}.pm_compliance_pct_strict == 0.00"
            - "Facility.${f_id}.pm_compliance_pct_operational == 100.00"
            - "Facility.${f_id}.ce_posture == NORMAL"
            - "Facility.${f_id}.pm_audit_index == 1"
            - "PMTask.${pt_id}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: work_order_assign_gated_by_facility_posture
        grounds:
          - validations[priority=13]
          - errors[ERR_FACILITY_LOCKDOWN]
          - state_machines.WorkOrder.INTAKE_to_IN_REPAIR
          - entities.Facility.fields.ce_posture
        distinguishing_aspect: |
          Entity pair #1 — WorkOrder depends on FACILITY: the INTAKE -> IN_REPAIR transition
          is legal only while the device's Facility has ce_posture != LOCKDOWN, even though
          intake itself is unaffected by posture. Restoring posture to NORMAL makes the very
          same assign call succeed.
        test_recipe:
          setup:
            - "A facility manually driven to ce_posture LOCKDOWN."
            - "A work order already at status INTAKE on a device of that facility."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, condition_score: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/facilities/${f_id}/posture"
              payload: { to_posture: "LOCKDOWN", note: "Facility-wide network incident" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev1_id}", reported_severity: "ROUTINE", problem_summary: "Screen backlight failure" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { err: $.data.error_id }
            - call: "POST /clinical-engineering/facilities/${f_id}/posture"
              payload: { to_posture: "NORMAL" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
          assert:
            - "first assign: HTTP status == 409 and data.error_id == ERR_FACILITY_LOCKDOWN"
            - "first assign: WorkOrder.${wo_id}.status == INTAKE and WorkOrder.${wo_id}.repair_started_at == null"
            - "the intake itself succeeded under LOCKDOWN, so Device.${dev1_id}.operational_state == DOWN before the first assign"
            - "second assign: HTTP status == 200 and WorkOrder.${wo_id}.status == IN_REPAIR"

      - name: loaner_creation_gated_by_pool_device_security_state
        grounds:
          - validations[priority=11]
          - errors[ERR_DEVICE_QUARANTINED]
          - state_machines.Device.VULNERABLE_to_QUARANTINED
          - calculations.loaner_pool_selection
          - concurrency_rules[loaner-create-stale-work-order]
        distinguishing_aspect: |
          Entity pair #2 — LoanerAssignment depends on the loaner DEVICE (a different pair
          from WorkOrder/Facility): creating coverage against an explicitly named pool unit
          is rejected purely because that unit's security_state is QUARANTINED, while the
          work order, the downed unit and the OCC version are all perfectly valid.
        test_recipe:
          setup:
            - "A downed monitor with a work order at IN_REPAIR."
            - "The only same-model pool unit driven UNASSESSED -> VULNERABLE -> QUARANTINED."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
