scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_binding_appearance_fee_diverge
        grounds:
          - calculations.appearance_fee_engine
          - entities.TermSheet.fields.provisional_fee_cents
          - entities.Engagement.fields.binding_fee_cents
          - state_machines.Engagement.PENDING_COUNTERSIGN_to_ACTIVE
        distinguishing_aspect: |
          Money domain (contract value on TermSheet/Engagement): the PROVISIONAL variant scores the paper
          with travel_component_cents forced to 0 while the BINDING variant folds in the CONFIRMED booking's
          travel cost plus 25% of the card rate per travel day, so identical negotiated terms yield
          2621400 provisional versus 3001900 binding on the very same deal.
        test_recipe:
          setup:
            - "Athlete Rae Nakamura, market_tier GLOBAL, base_appearance_rate_cents 400000, commission_pct 0.15, status ACTIVE."
            - "Brand Volt Hydration, category BEVERAGE, compliance_rating 45, sanctioned false."
            - "Opportunity SCREENED with brand_fit_score 60 and expected_fee_cents 800000."
            - "TermSheet SUBMITTED with fee 1400000 / BROADCAST / TIER_B / NORTH_AMERICA / 12 exclusivity months, provisional_fee_cents 2621400."
            - "Engagement PENDING_COUNTERSIGN with exactly one CONFIRMED AppearanceBooking (8h appearance, 12h travel buffer, travel_cost_cents 180500, travel_days 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 800000, planned_posts: 2, planned_appearances: 1, planned_shoots: 1, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
              captures: { fit_score: $.data.brand_fit_score }
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 2 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
              captures: { prov_fee: $.data.provisional_fee_cents }
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id, eng_v1: $.data.version }
            - call: "POST /appearance-bookings"
              payload: { engagement_id: "${eng_id}", city: "Chicago", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T22:00:00Z", travel_buffer_hours: 12, expected_engagement_version: "${eng_v1}" }
              as: TalentAgent
              captures: { bk_id: $.data.id }
            - call: "POST /appearance-bookings/${bk_id}/confirm"
              payload: { travel_cost_cents: 180500 }
              as: TalentAgent
          trigger:
            - call: "POST /engagements/${eng_id}/countersign"
              payload: { signed_by_reference: "CS-2026-0001" }
              as: FinanceManager
              as_user_id: "fm-1"
              captures: { binding_fee: $.data.binding_fee_cents }
          assert:
            - "TermSheet.${ts_id}.provisional_fee_cents == 2621400"
            - "Engagement.${eng_id}.provisional_fee_cents == 2621400"
            - "Engagement.${eng_id}.binding_fee_cents == 3001900"
            - "Engagement.${eng_id}.binding_fee_cents - Engagement.${eng_id}.provisional_fee_cents == 380500"
            - "AppearanceBooking.${bk_id}.travel_days == 2"
            - "Engagement.${eng_id}.contract_status == ACTIVE"

      - name: roster_snapshot_vs_pipeline_projected_exposure_risk
        grounds:
          - calculations.athlete_exposure_risk_score
          - entities.Athlete.fields.exposure_risk_snapshot_score
          - entities.ExclusivityGrant.fields.status
          - endpoints[GET /athletes/{id}/exposure-summary]
        distinguishing_aspect: |
          Athlete risk domain (not money): ROSTER_SNAPSHOT counts only committed rows and returns 28,
          while PIPELINE_PROJECTED additionally charges 8 points per MORALS_WEIGHT of every SUBMITTED
          term sheet and returns 52 for the same athlete at the same instant.
        test_recipe:
          setup:
            - "Athlete with exactly one ACTIVE Engagement at morals tier TIER_B and one ACTIVE ExclusivityGrant (BEVERAGE)."
            - "A second, independent Opportunity (FOOTWEAR) for the same athlete carrying a SUBMITTED TermSheet at morals tier TIER_A."
            - "Zero NON_COMPLIANT disclosure records."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 800000, planned_posts: 2, planned_appearances: 1, planned_shoots: 1, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 2 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/countersign"
              payload: { signed_by_reference: "CS-2026-0001" }
              as: FinanceManager
            - call: "POST /brands"
              payload: { name: "Kite Footwear", category: "FOOTWEAR", legal_entity_name: "Kite Footwear LLC", compliance_rating: 45 }
              as: BrandRep
              captures: { brand2_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand2_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "FOOTWEAR", exclusivity_months: 6, territory: "DOMESTIC", usage_rights_tier: "SOCIAL_ONLY" }
              as: BrandRep
              as_user_id: "${brand2_id}"
              captures: { opp2_id: $.data.id }
            - call: "POST /opportunities/${opp2_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-2"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp2_id}", fee_cents: 1000000, usage_rights_tier: "SOCIAL_ONLY", usage_term_months: 12, territory: "DOMESTIC", morals_clause_tier: "TIER_A", exclusivity_months: 6, appearance_days: 0 }
              as: TalentAgent
              captures: { ts2_id: $.data.id }
            - call: "POST /term-sheets/${ts2_id}/submit"
              payload: {}
              as: TalentAgent
          trigger:
            - call: "GET /athletes/${ath_id}/exposure-summary"
              payload: { variant: "ROSTER_SNAPSHOT" }
              as: ComplianceOfficer
              captures: { snapshot_score: $.data.score }
            - call: "GET /athletes/${ath_id}/exposure-summary"
              payload: { variant: "PIPELINE_PROJECTED" }
              as: ComplianceOfficer
              captures: { projected_score: $.data.score }
          assert:
            - "ROSTER_SNAPSHOT response score == 28 (category_load 1, morals_exposure 2, noncompliance_hits 0)"
            - "PIPELINE_PROJECTED response score == 52 (category_load 1, morals_exposure 5, noncompliance_hits 0)"
            - "ROSTER_SNAPSHOT response morals_exposure == 2 and PIPELINE_PROJECTED response morals_exposure == 5"
            - "both responses report category_load == 1"
            - "Athlete.${ath_id}.exposure_risk_snapshot_score == 28"

  - rule_id: combinatorial_formula
    instances:
      - name: appearance_fee_multiplier_stack_with_cap
        grounds:
          - calculations.appearance_fee_engine
          - entities.TermSheet.fields.provisional_fee_cents
          - state_machines.TermSheet.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) - four interacting inputs with a non-linear ceiling: usage x morals x territory
          multiply into 600300, the month-capped exclusivity uplift adds 480000, and the
          min(raw_value, fee_cents * 2.5) ceiling clamps the 1080300 raw result down to exactly 500000.
        test_recipe:
          setup:
            - "Athlete with base_appearance_rate_cents 400000, market_tier GLOBAL."
            - "Brand with compliance_rating 60 so a 24-month exclusivity request still screens in at 64."
            - "Opportunity SCREENED with usage_rights_tier PERPETUAL, territory GLOBAL, exclusivity_months 24."
            - "TermSheet in DRAFT with fee_cents 200000, morals TIER_A, exclusivity_months 24."
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Ivo Marchetti", sport: "TENNIS", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Northstar Motors", category: "AUTOMOTIVE", legal_entity_name: "Northstar Motors SA", compliance_rating: 60 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "AUTOMOTIVE", exclusivity_months: 24, territory: "GLOBAL", usage_rights_tier: "PERPETUAL" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-3"
              captures: { fit_score: $.data.brand_fit_score }
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 200000, usage_rights_tier: "PERPETUAL", usage_term_months: 24, territory: "GLOBAL", morals_clause_tier: "TIER_A", exclusivity_months: 24, appearance_days: 0 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
              captures: { prov_fee: $.data.provisional_fee_cents }
          assert:
            - "Opportunity.${opp_id}.brand_fit_score == 64 and Opportunity.${opp_id}.status == SCREENED"
            - "TermSheet.${ts_id}.provisional_fee_cents == 500000"
            - "TermSheet.${ts_id}.provisional_fee_cents != 1080300 (the uncapped rights 600300 + uplift 480000 sum)"
            - "TermSheet.${ts_id}.status == SUBMITTED"
            - "TermSheet.${ts_id}.offer_expires_at == 2026-08-15T00:00:00.000Z"

      - name: payout_line_rounding_before_sum
        grounds:
          - calculations.payout_distribution
          - entities.PayoutStatement.fields.gross_amount_cents
          - entities.PayoutStatement.fields.agency_commission_cents
          - entities.Deliverable.fields.line_value_cents
        distinguishing_aspect: |
          Mode (b) - the pinned rounding order is observable: rounding each of the four weighted lines
          to cents BEFORE summing gives gross 3001901 and commission 450286, whereas summing the raw
          shares and rounding once would give 3001900 and 450285; both figures differ by exactly one cent.
        test_recipe:
          setup:
            - "Engagement ACTIVE with binding_fee_cents 3001900 and required_deliverable_count 4."
            - "Four APPROVED deliverables created in order: SOCIAL_POST (weight 1), SOCIAL_POST (weight 1), APPEARANCE (weight 4), SHOOT (weight 2); total_weight 8."
            - "Athlete.commission_pct 0.15; zero PENALTY ledger entries."
            - "settlement_status BILLABLE after the fourth approval completed the contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 800000, planned_posts: 2, planned_appearances: 1, planned_shoots: 1, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 2 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id, eng_v1: $.data.version }
            - call: "POST /appearance-bookings"
              payload: { engagement_id: "${eng_id}", city: "Chicago", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T22:00:00Z", travel_buffer_hours: 12, expected_engagement_version: "${eng_v1}" }
              as: TalentAgent
