# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# River Cleanup & Adopt-a-Roadway Program
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: group_creation_returns_201_with_server_fields
        claim_type: creation
        grounds: [entities.AdopterGroup]
        distinguishing_aspect: "POST /program/groups with all four required fields returns 201 with a server-minted UUID id, version 1, created_at at the logical-clock default 2026-08-01T00:00:00Z, and echoes org_type."
        test_recipe:
          setup: ["empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { gid: $.data.id, gver: $.data.version, gcat: $.data.created_at, gtype: $.data.org_type } }
          assert:
            - "gid is a non-null UUID and gver == 1"
            - "gcat == 2026-08-01T00:00:00Z (logical clock default, never wall clock)"
            - "gtype == CIVIC"

      - name: group_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AdopterGroup, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field name is rejected with ERR_INVALID_REQUEST (400) at shape-validation priority 5, after existence and before any state/business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/groups", payload: { org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: segment_mile_length_computed_from_markers
        claim_type: computed_fields
        grounds: [entities.RoadSegment.fields.mile_length]
        distinguishing_aspect: "mile_length is server-computed as mile_marker_end - mile_marker_start at 2dp round_half_up: markers 10.0 and 11.55 yield exactly 1.55, and water_adjacent defaults to false when omitted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 10.0, mile_marker_end: 11.55, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { len: $.data.mile_length, wa: $.data.water_adjacent, st: $.data.status } }
          assert:
            - "len == 1.55"
            - "wa == false (default applied)"
            - "st == AVAILABLE (initial state)"

      - name: segment_invalid_marker_range_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.RoadSegment, "validations[priority=5]"]
        distinguishing_aspect: "mile_marker_end <= mile_marker_start violates the range rule and returns ERR_INVALID_REQUEST (400); enum violation on segment_type behaves the same."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/segments", payload: { route_name: "Bad Rd", mile_marker_start: 6.0, mile_marker_end: 4.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /program/segments", payload: { route_name: "Bad Rd 2", mile_marker_start: 1.0, mile_marker_end: 2.0, segment_type: "HIGHWAY" }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST"
            - "err2 == ERR_INVALID_REQUEST (HIGHWAY not in {ROADWAY, RIVERBANK})"

      - name: not_found_reads_and_actions_return_entity_codes
        claim_type: not_found
        grounds: ["errors[ERR_GROUP_NOT_FOUND]", "errors[ERR_SEGMENT_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_EVENT_NOT_FOUND]", "errors[ERR_SUPPLY_NOT_FOUND]", "errors[ERR_HAZARD_NOT_FOUND]", "errors[ERR_SIGN_NOT_FOUND]", "errors[ERR_WAIVER_NOT_FOUND]"]
        distinguishing_aspect: "Every entity-scoped endpoint rejects a non-existent UUID with its own domain-specific 404 code — eight distinct codes verified in one sweep."
        test_recipe:
          setup: ["empty database (no id can collide with the all-zero UUID)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /program/groups/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { e_group: $.data.error_id } }
            - { call: "GET /program/segments/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { e_seg: $.data.error_id } }
            - { call: "GET /program/agreements/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { e_ag: $.data.error_id } }
            - { call: "GET /program/events/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { e_ev: $.data.error_id } }
            - { call: "GET /program/supplies/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { e_sup: $.data.error_id } }
            - { call: "POST /program/hazards/00000000-0000-0000-0000-000000000000/acknowledge", payload: {}, as: ProgramCoordinator, captures: { e_haz: $.data.error_id } }
            - { call: "POST /program/signs/00000000-0000-0000-0000-000000000000/install", payload: {}, as: ProgramCoordinator, captures: { e_sign: $.data.error_id } }
            - { call: "POST /program/waivers/00000000-0000-0000-0000-000000000000/revoke", payload: {}, as: GroupLeader, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { e_wav: $.data.error_id } }
          assert:
            - "e_group == ERR_GROUP_NOT_FOUND and e_seg == ERR_SEGMENT_NOT_FOUND and e_ag == ERR_AGREEMENT_NOT_FOUND"
            - "e_ev == ERR_EVENT_NOT_FOUND and e_sup == ERR_SUPPLY_NOT_FOUND"
            - "e_haz == ERR_HAZARD_NOT_FOUND and e_sign == ERR_SIGN_NOT_FOUND and e_wav == ERR_WAIVER_NOT_FOUND"
            - "all eight responses use http 404"

      - name: events_list_pagination_and_agreement_filter
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /program/events filtered by agreement_id paginates with limit/offset: three events yield total_count 3, has_more true at limit 2 offset 0, and exactly 1 row with has_more false at offset 2."
        test_recipe:
          setup: ["approved agreement with three SCHEDULED events on 2026-09-10/11/12"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-11", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-12", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "GET /program/events?agreement_id=${ag}&limit=2&offset=0", payload: {}, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/events?agreement_id=${ag}&limit=2&offset=2", payload: {}, as: GroupLeader, as_user_id: "${g}" }
          assert:
            - "page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: waiver_defaults_and_computed_dates
        claim_type: defaults
        grounds: [entities.VolunteerWaiver]
        distinguishing_aspect: "An adult waiver created at the default clock has guardian_consent false (default), is_minor false (computed), status ACTIVE, signed_date 2026-08-01 and expiry_date exactly one year later 2027-08-01."
        test_recipe:
          setup: ["approved agreement"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w_minor: $.data.is_minor, w_consent: $.data.guardian_consent, w_status: $.data.status, w_signed: $.data.signed_date, w_expiry: $.data.expiry_date } }
          assert:
            - "w_minor == false and w_consent == false (defaults/computed)"
            - "w_status == ACTIVE and w_signed == 2026-08-01 and w_expiry == 2027-08-01"

      - name: debris_report_immutable_shape
        claim_type: immutability
        grounds: [entities.DebrisReport]
        distinguishing_aspect: "DebrisReport carries common_fields false: its response exposes id and created_at but no version and no updated_at, and no update endpoint exists for it in §1.5."
        test_recipe:
          setup: ["approved agreement; briefed event on its scheduled date 2026-09-10"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { rid: $.data.id, rcat: $.data.created_at } }
            - { call: "GET /program/events/${e}/debris-reports", payload: {}, as: GroupLeader, as_user_id: "${g}" }
          assert:
            - "rid is a non-null UUID and rcat == 2026-09-10T10:00:00Z"
            - "report payload contains no version key and no updated_at key (common_fields false)"
            - "GET /program/events/${e}/debris-reports returns an array of length 1 with the same id"

      - name: depot_pool_totals_pinned_at_creation
        claim_type: system_fields
        grounds: [entities.SupplyDepot.fields.vests_pool_total, entities.SupplyDepot.fields.grabbers_pool_total]
        distinguishing_aspect: "vests_pool_total and grabbers_pool_total are pinned to the initial stock at creation and do not move when an issue debits on_hand (40/20 pinned while on_hand drops to 33/16)."
        test_recipe:
          setup: ["depot 100 bags/40 vests/20 grabbers; approved agreement on water-adjacent 2.0-mile segment; event V=7"]
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "South Depot", bags_on_hand: 100, vests_on_hand: 40, grabbers_on_hand: 20 }, as: ProgramCoordinator, captures: { d: $.data.id, pool_v: $.data.vests_pool_total, pool_g: $.data.grabbers_pool_total } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 7 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
          trigger:
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { post_pool_v: $.data.vests_pool_total, post_pool_g: $.data.grabbers_pool_total, post_vests: $.data.vests_on_hand, post_grabbers: $.data.grabbers_on_hand } }
          assert:
            - "pool_v == 40 and pool_g == 20 at creation"
            - "post_pool_v == 40 and post_pool_g == 20 (pinned), while post_vests == 33 and post_grabbers == 16 (mutated)"

      - name: supervisor_self_reference_reverse_list
        claim_type: parent_relationships
        grounds: [entities.VolunteerWaiver.fields.supervisor_waiver_id]
        distinguishing_aspect: "The self-referential FK supervisor_waiver_id is reverse-reachable: GET /program/waivers?supervisor_waiver_id=<sup> returns exactly the minor waiver(s) naming that supervisor."
        test_recipe:
          setup: ["approved agreement; adult supervisor waiver sup; minor waiver m1 supervised by sup"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Scout Troop 9", org_type: "CIVIC", contact_name: "Tess Lead", contact_email: "tess@troop9.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 1.0, mile_marker_end: 2.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "tess@troop9.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Sup Adult", dob: "1990-01-01" }, as: GroupLeader, as_user_id: "${g}", captures: { sup: $.data.id } }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Milo Minor", dob: "2009-06-15", guardian_full_name: "Pat Parent", guardian_consent: true, supervisor_waiver_id: "${sup}" }, as: GroupLeader, as_user_id: "${g}", captures: { m1: $.data.id } }
          trigger:
            - { call: "GET /program/waivers?supervisor_waiver_id=${sup}", payload: {}, as: GroupLeader, as_user_id: "${g}" }
          assert:
            - "response is an array of length 1 whose sole element id == ${m1} (total_count == 1)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: rejected_agreement_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AdoptionAgreement.PENDING_REVIEW_to_REJECTED, "errors[ERR_AGREEMENT_NOT_PENDING]", "errors[ERR_AGREEMENT_TERMINAL]"]
        distinguishing_aspect: "A REJECTED agreement is terminal: a second review-decision returns ERR_AGREEMENT_NOT_PENDING, terminate returns ERR_AGREEMENT_TERMINAL, and the segment stays AVAILABLE throughout."
        test_recipe:
          setup: ["agreement in PENDING_REVIEW on a free segment"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "REJECT", note: "duplicate effort" }, as: ProgramCoordinator, captures: { st1: $.data.status } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /program/agreements/${ag}/terminate", payload: {}, as: ProgramCoordinator, captures: { err3: $.data.error_id } }
            - { call: "GET /program/segments/${s}", payload: {}, as: ProgramCoordinator, captures: { seg_status: $.data.status } }
          assert:
            - "st1 == REJECTED"
            - "err2 == ERR_AGREEMENT_NOT_PENDING"
            - "err3 == ERR_AGREEMENT_TERMINAL"
            - "seg_status == AVAILABLE (rejection never locked the segment)"

      - name: briefing_after_cancel_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CleanupEvent, "errors[ERR_EVENT_NOT_SCHEDULED]"]
        distinguishing_aspect: "Briefing a CANCELLED event is rejected with ERR_EVENT_NOT_SCHEDULED and records no attendee count."
        test_recipe:
          setup: ["approved agreement; event cancelled before briefing"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/cancel", payload: { reason: "low turnout" }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_SCHEDULED"

      - name: hazard_resolve_before_acknowledge_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HazardReport.ACKNOWLEDGED_to_RESOLVED, "errors[ERR_HAZARD_NOT_ACKNOWLEDGED]"]
        distinguishing_aspect: "RESOLVE on a REPORTED (never acknowledged) hazard is rejected with ERR_HAZARD_NOT_ACKNOWLEDGED; the acknowledge step then unlocks resolve, which mints resolved_at."
        test_recipe:
          setup: ["hazard report in REPORTED on a segment"]
          setup_api_calls:
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/hazards", payload: { segment_id: "${s}", hazard_type: "SYRINGES", description: "needle pack", location_note: "MP 5.2 culvert" }, as: ProgramCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /program/hazards/${h}/resolve", payload: { resolution_note: "removed" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /program/hazards/${h}/acknowledge", payload: {}, as: ProgramCoordinator, captures: { ack_ref: $.data.agency_reference } }
            - { call: "POST /program/hazards/${h}/resolve", payload: { resolution_note: "crew removed and disposed" }, as: ProgramCoordinator, captures: { fin: $.data.status } }
          assert:
            - "err == ERR_HAZARD_NOT_ACKNOWLEDGED"
            - "ack_ref is non-null (agency notification reference minted at acknowledgement)"
            - "fin == RESOLVED"

      - name: unbriefed_past_event_swept_to_no_show
        claim_type: valid_transition
        grounds: [state_machines.CleanupEvent.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "The clock sweep flips a SCHEDULED event whose scheduled_date has passed to NO_SHOW (a terminal state: a later cancel returns ERR_EVENT_TERMINAL); NO_SHOW events never count as cleanups."
        test_recipe:
          setup: ["approved agreement; event scheduled 2026-09-10, never briefed; clock advanced past it"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
          trigger:
