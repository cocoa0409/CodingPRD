  - name: years_experience_above_sixty_is_rejected
    claim_type: type_constraints
    grounds: entities.Candidate.years_experience (0..60); validations.numeric_ranges_respected; errors[ERR_INVALID_RANGE]
    distinguishing_aspect: 61 is one past the declared ceiling and returns ERR_INVALID_RANGE, while 60
      is accepted, so the bound is inclusive.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
