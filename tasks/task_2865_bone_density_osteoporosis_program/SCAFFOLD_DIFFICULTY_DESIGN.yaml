              as: Scheduler
          assert:
            - "the first trigger call (09:40-10:10) returns 409 with data.error_id ERR_DEVICE_SLOT_CONFLICT"
            - "the second trigger call (08:30-09:00) returns 409 with data.error_id ERR_DEVICE_SLOT_CONFLICT"
            - "the third trigger call (09:45-10:15) returns 201 with status BOOKED and scheduled_duration_minutes 30"
            - "the fourth trigger call (08:15-08:45) returns 201 with status BOOKED and scheduled_duration_minutes 30"
            - "ScanOrder.${order2_id}.status == SCHEDULED"
            - "ScanOrder.${order3_id}.status == SCHEDULED"
            - "GET /bone-density/scan-appointments?densitometer_id=${dev_a_id}&status=BOOKED returns total_count 3"
            - "in that listing the 08:15 slot has slot_index 1, the 09:00 slot has slot_index 2 and the 09:45 slot has slot_index 3"
            - "ScanAppointment.${appt1_id}.status == BOOKED"
            - "ScanAppointment.${appt1_id}.slot_index == 2"
            - "Patient.${pat1_id}.open_scheduled_order_count == 1"
            - "Patient.${pat2_id}.open_scheduled_order_count == 1"
            - "Patient.${pat3_id}.open_scheduled_order_count == 1"
      - name: patient_same_day_rule_rejects_second_device_but_admits_next_day
        grounds:
          - validations[priority=59]
          - errors[ERR_PATIENT_DOUBLE_BOOKED]
          - entities.Patient.fields.open_scheduled_order_count
          - endpoints["POST /bone-density/scan-appointments"]
        distinguishing_aspect: |
          The second slot is on a different densitometer and eleven hours clear of the first, so no
          device interval and no buffer is involved: the collision is on the patient's own UTC calendar
          day bucket, which is closed over all devices and counts only BOOKED and CHECKED_IN rows.
          Moving the very same request to 2026-03-11T14:00:00Z must succeed, proving the bucket is a
          calendar-date bucket rather than a rolling 24-hour window, and the patient's
          open_scheduled_order_count must end at 2 rather than 1.
