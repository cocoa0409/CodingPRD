            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector }
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/complete", payload: {}, as: RaceDirector }
          trigger:
            - { call: "GET /karting/seasons/${s_id}/standings", payload: { class_id: "${cls_id}" }, as: LeagueAdmin }
          assert:
            - "standings row for ${d_a}: provisional_points == 25"
            - "standings row for ${d_a}: final_points == 0 and dropped_round_numbers == [1] (counted set empty when drop_rounds >= completed rounds)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_requires_event_registration_open
        grounds:
          - state_machines.RaceEvent.SCHEDULED_to_REGISTRATION_OPEN
          - validations[priority=6]
          - errors[ERR_EVENT_REGISTRATION_CLOSED]
        distinguishing_aspect: |
          Entity pair EventEntry -> RaceEvent: EventEntry creation is valid only
          while the parent RaceEvent is REGISTRATION_OPEN; the same request fails
          in SCHEDULED and succeeds after open-registration.
        test_recipe:
          setup:
            - "Season ACTIVE, SENIOR class, driver A ACTIVE; event created (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Gate Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
          trigger:
            - call: "POST /karting/events/${e_id}/entries"
              payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
          assert:
            - "first entry attempt rejected: error_id == ERR_EVENT_REGISTRATION_CLOSED while RaceEvent.SCHEDULED"
            - "after open-registration: identical request succeeds with EventEntry.status == ENTERED and fee_status == UNPAID"

      - name: event_finalize_blocked_by_open_incident
        grounds:
          - state_machines.RaceEvent.COMPLETED_to_FINALIZED
          - validations[priority=6]
          - errors[ERR_OPEN_INCIDENTS]
        distinguishing_aspect: |
          Entity pair RaceEvent -> Incident (different pair than EventEntry ->
          RaceEvent): event finalize is gated on the absence of child Incidents in
          REPORTED/UNDER_REVIEW/APPEALED; dismissing the incident unblocks it.
        test_recipe:
          setup:
            - "Event with one scored MAIN session, status COMPLETED; one incident REPORTED against entry A"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Protest Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector, captures: { r_a: "$.data[0].id" } }
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/incidents", payload: { entry_id: "${en_a}", session_id: "${sess}", description: "Unsafe rejoin" }, as: RaceDirector, as_user_id: "rd-1", captures: { inc: $.data.id } }
            - { call: "POST /karting/events/${e_id}/complete", payload: {}, as: RaceDirector }
          trigger:
            - call: "POST /karting/events/${e_id}/finalize"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
            - { call: "POST /karting/incidents/${inc}/open-review", payload: {}, as: Steward, as_user_id: "st-1" }
            - { call: "POST /karting/incidents/${inc}/adjudicate", payload: { decision: "DISMISSED" }, as: Steward, as_user_id: "st-1" }
            - { call: "POST /karting/events/${e_id}/finalize", payload: {}, as: RaceDirector }
          assert:
            - "first finalize rejected: error_id == ERR_OPEN_INCIDENTS while Incident.${inc} is REPORTED"
            - "after DISMISSED: finalize succeeds, RaceEvent.status == FINALIZED"
            - "SessionResult.${r_a}.status == FINAL after event finalize"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: kart_half_open_window_overlap
        grounds:
          - validations[priority=8]
          - entities.PracticeBooking.fields.start_time
          - errors[ERR_BOOKING_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = pairwise half-open exclusion on resource RentalKart:
          [10:00,11:00) vs [11:00,12:00) touch and are accepted, while
          [10:30,11:30) intersects and is rejected.
        test_recipe:
          setup:
            - "Kart K1 AVAILABLE; drivers D1, D2 ACTIVE; K1 booked 10:00-11:00 by D1 (RESERVED)"
          setup_api_calls:
            - { call: "POST /karting/karts", payload: { fleet_number: "K-10", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_1: $.data.id } }
            - { call: "POST /karting/drivers", payload: { full_name: "D1", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_1: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_1}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D2", date_of_birth: "1991-01-01", body_weight_kg: 81.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_2: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_2}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_1}", kart_id: "${k_1}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_1}", captures: { bk_1: $.data.id } }
          trigger:
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_2}", kart_id: "${k_1}", start_time: "2026-09-01T11:00:00Z", end_time: "2026-09-01T12:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_2}", captures: { bk_2: $.data.id } }
            - call: "POST /karting/practice-bookings"
              payload: { driver_id: "${d_2}", kart_id: "${k_1}", start_time: "2026-09-01T10:30:00Z", end_time: "2026-09-01T11:30:00Z", pricing_mode: "FLAT" }
              as: Driver
              as_user_id: "${d_2}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent booking ${bk_2} created (touching endpoint 11:00 == 11:00 does not intersect under half-open semantics)"
            - "overlapping booking rejected: error_id == ERR_BOOKING_OVERLAP"

      - name: track_aggregate_capacity_window
        grounds:
          - validations[priority=9]
          - errors[ERR_TRACK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity counting on the track resource
          (different resource and semantics than pairwise kart exclusion): the 5th
          booking intersecting a window already holding TRACK_CAPACITY_KARTS (4)
          bookings on 4 different karts is rejected even though its own kart is
          free; the same kart in a disjoint window is accepted.
        test_recipe:
          setup:
            - "Karts K1..K5 AVAILABLE; drivers D1..D5 ACTIVE; K1..K4 booked 10:00-11:00 (window at capacity 4)"
          setup_api_calls:
            - { call: "POST /karting/karts", payload: { fleet_number: "T-1", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_1: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "T-2", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_2: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "T-3", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_3: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "T-4", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_4: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "T-5", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_5: $.data.id } }
            - { call: "POST /karting/drivers", payload: { full_name: "D1", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_1: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_1}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D2", date_of_birth: "1990-01-02", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_2: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_2}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D3", date_of_birth: "1990-01-03", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_3: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_3}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D4", date_of_birth: "1990-01-04", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_4: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_4}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D5", date_of_birth: "1990-01-05", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_5: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_5}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_1}", kart_id: "${k_1}", start_time: "2026-09-02T10:00:00Z", end_time: "2026-09-02T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_1}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_2}", kart_id: "${k_2}", start_time: "2026-09-02T10:00:00Z", end_time: "2026-09-02T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_2}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_3}", kart_id: "${k_3}", start_time: "2026-09-02T10:00:00Z", end_time: "2026-09-02T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_3}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_4}", kart_id: "${k_4}", start_time: "2026-09-02T10:00:00Z", end_time: "2026-09-02T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_4}" }
          trigger:
            - call: "POST /karting/practice-bookings"
              payload: { driver_id: "${d_5}", kart_id: "${k_5}", start_time: "2026-09-02T10:00:00Z", end_time: "2026-09-02T11:00:00Z", pricing_mode: "FLAT" }
              as: Driver
              as_user_id: "${d_5}"
              captures: { err: $.data.error_id }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_5}", kart_id: "${k_5}", start_time: "2026-09-02T11:00:00Z", end_time: "2026-09-02T12:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_5}", captures: { bk_5: $.data.id } }
          assert:
            - "5th booking inside the saturated window rejected: error_id == ERR_TRACK_CAPACITY_EXCEEDED (4 existing >= TRACK_CAPACITY_KARTS 4) even though kart K5 itself is free"
            - "same kart in the disjoint 11:00-12:00 window accepted: ${bk_5} created with status RESERVED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: penalty_apply_reverse_conserves_session_points
        grounds:
          - state_machines.Incident.UNDER_REVIEW_to_UPHELD
          - state_machines.Incident.UNDER_REVIEW_to_DISMISSED
          - calculations.session_points
        distinguishing_aspect: |
          Conserved quantity = sum of points_awarded over a session's results
          (points are permuted, never created or destroyed): UPHELD(TIME_SECONDS)
          followed by appeal and DISMISSED leaves sum == 47 at every stage and
          restores each result's pre-penalty position and points exactly.
        test_recipe:
          setup:
            - "Scored MAIN session: A pos1 total 600000ms (25 pts), B pos2 total 603000ms (22 pts); session points sum 47"
            - "Incident against A UNDER_REVIEW (reported by rd-1)"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Invariant Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
