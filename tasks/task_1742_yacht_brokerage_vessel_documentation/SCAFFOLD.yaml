    side_effects: ["runs commission_split, sales_use_tax, proration_aggregator, lien_payoff_waterfall, closing_total", "creates TaxAssessment rows", "sets lien payoff_amount_cents and statuses", "statement.status = BALANCED", "increments statement.version by 1"]
  - method: POST
