              captures: { windows: $.data }
          assert:
            - "error_id == ERR_WINDOW_CLOSED (window 0 closed once clock date 2026-04-01 >= window_end 2026-03-10)"
            - "tiling: window 0 is [2025-03-10, 2026-03-10) and window 1 is [2026-03-10, 2027-03-10) — exact adjacency, no gap"
            - "a deal closing exactly 2026-03-10 belongs to window 1 (end-exclusive boundary)"

  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settle_unsettle_leaves_debit_balance_and_accumulators_exact
        grounds:
          - state_machines.Deal.SETTLED_to_CLOSED
          - calculations.debit_balance_reconciliation
          - entities.AnniversaryPeriod.fields.company_dollar_accrued_cents
        distinguishing_aspect: |
          Conserved quantity: agent debit balance AND window accumulators.
          Settle a deal with a shortfall (debit +27710), then unsettle: the
          compensating ledger entries (FEE_SHORTFALL_REVERSAL) restore
          debit_balance_cents to exactly 0 and the window's
          company_dollar_accrued_cents / royalty_accrued_cents to their
          pre-settle values — zero drift.
        test_recipe:
          setup:
            - "Agent ACTIVE on P1; tiny deal gross 5000 settled (shortfall 27710, company 1410, royalty 300) then unsettled"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Drift Dan", email: "dan@x.com", license_number: "LIC-DD1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
