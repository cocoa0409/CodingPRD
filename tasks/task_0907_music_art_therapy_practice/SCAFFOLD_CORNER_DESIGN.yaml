              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref1: $.data.id }
            - call: "POST /referrals/${ref1}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "y", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref2: $.data.id }
            - call: "POST /referrals/${ref2}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 42 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref1}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid1: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref2}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
          assert: ["Response 412 error_id == ERR_STALE_CLIENT_VERSION (cv0 is stale; version advanced on first create)"]

      - name: occ_fresh_client_version_supersedes_prior_plan
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-client]", state_machines.TreatmentPlan.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Re-reading the client version after the first create and passing it lets a second create succeed and supersede the prior ACTIVE plan."
        test_recipe:
          setup: ["A client whose first plan is ACTIVE; the current client.version re-read via GET /clients/{id}."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref1: $.data.id }
            - call: "POST /referrals/${ref1}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "y", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref2: $.data.id }
            - call: "POST /referrals/${ref2}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 42 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref1}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid1: $.data.id }
            - call: "POST /treatment-plans/${pid1}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "GET /clients/${cid}"
              payload: {}
              as: ClinicalDirector
              captures: { cv_fresh: $.data.version }
          trigger:
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref2}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv_fresh}" }
              as: ClinicalDirector
              captures: { pid2: $.data.id }
          assert:
            - "Second plan created 201 (id == ${pid2}, status DRAFT)"
            - "TreatmentPlan.${pid1}.status == SUPERSEDED"

