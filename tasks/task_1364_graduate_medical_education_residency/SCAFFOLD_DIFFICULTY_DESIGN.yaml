  - rule_id: boundary_precision_check
    instances:
      - name: eighty_hour_average_exact_boundary
        grounds:
          - calculations.duty_hour_violation_detection
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric: rolling 4-week duty-hour average via log attest. 320.00h in
          the window gives avg == 80.00 exactly and creates NO violation (rule
          is strict >); attesting one more 0.04h log (320.04 total) pushes the
