            - "${s2_outcome} == \"FAIL\", ${s2_status} == \"UNSUCCESSFUL_LOCKED\"; ${enr_status_2} == \"UNSUCCESSFUL_PARTICIPATION\", ${fails_2} == 2, ${graded_2} == 2"
            - "HTTP status is 409 and ${err} == \"ERR_PT_ENROLLMENT_STATUS_INVALID\""
            - "GET /poct/pt-events?enrollment_id=${enr_id} returns meta.total_count == 2 - S-03 was not created"
