              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { zero_length_error: $.data.error_id }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "STREAMING", window_start_utc: "2026-09-14T14:00:00Z", window_end_utc: "2026-09-14T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { inverted_error: $.data.error_id }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "STREAMING", window_start_utc: "2026-09-21T10:00:00Z", window_end_utc: "2026-09-21T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { deadline_error: $.data.error_id }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "STREAMING", window_start_utc: "2026-09-21T13:00:00Z", window_end_utc: "2026-09-21T10:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
