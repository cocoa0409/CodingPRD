      - name: improvement_project_close_below_threshold_auto_cites_major_deficiency
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /cancer-registry/quality-measures/{measureId}/improvement-project]
          - state_machines.QualityMeasure.measure_state
          - calculations.deficiency_response_window
        distinguishing_aspect: |
          Closing a project below the threshold is the only place a Deficiency is created by the
          system rather than by a surveyor: the measure lands in PROJECT_CLOSED_MISSED and a MAJOR
          deficiency appears with source_measure_id set, cited_on the clock date and a 45-day window
          (2026-09-15) - and because it is MAJOR, not CRITICAL, the registry posture stays OPEN.
        test_recipe:
          setup:
            - "One program with an under-threshold measure (threshold 80.0) that already has an OPEN improvement project."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "BCSRT", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures/${meas_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_II", eligible_case_count: 10, compliant_case_count: 6 }] }
              as: RegistryManager
            - call: "POST /cancer-registry/quality-measures/${meas_id}/improvement-project"
              payload: { action: "OPEN", project_title: "Radiation referral pathway redesign", target_rate_pct: 85.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /cancer-registry/quality-measures/${meas_id}/improvement-project"
              payload: { action: "CLOSE", final_rate_pct: 72.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          assert:
            - "the evaluate call produced performance_rate_pct == 60.0, performance_state == UNDER_THRESHOLD and measure_state == PROJECT_REQUIRED; OPEN moved it to PROJECT_ACTIVE"
            - "the CLOSE call returns HTTP 200 with measure_state == PROJECT_CLOSED_MISSED, final_rate_pct == 72.0 and performance_state == UNDER_THRESHOLD (72.0 < 80.0)"
            - "GET /cancer-registry/deficiencies?source_measure_id=${meas_id} returns total_count == 1 with severity == MAJOR, deficiency_state == CITED, cited_on == 2026-08-01 and response_due_date == 2026-09-15"
            - "CancerProgram.${prog_id}.open_critical_deficiency_count == 0 and registry_posture == OPEN (a MAJOR citation does not freeze the registry)"
            - "CancerProgram.${prog_id}.accreditation_state is still ACCREDITED"

      - name: deficiency_resolution_unfreezes_posture_and_restores_held_submission
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /cancer-registry/deficiencies/{deficiencyId}/response-review]
          - calculations.registry_posture
          - state_machines.RegistrySubmission.submission_state DRAFT<->HOLD
        distinguishing_aspect: |
          The freeze/unfreeze pair must be symmetric across two entities: citing a CRITICAL
          deficiency drives posture FROZEN and parks the DRAFT submission in HOLD with
          pre_hold_state DRAFT, and an ACCEPTED response review must restore exactly that
          pre_hold_state rather than leaving the submission in HOLD or inventing a new state.
        test_recipe:
          setup:
            - "One program with one DRAFT submission and one CRITICAL deficiency cited on the clock date."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-06-30", deadline_date: "2026-08-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.4", severity: "CRITICAL", cited_on: "2026-08-01", evidence_reference: "SURVEY-2026-EX-11" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "Registrar staffing restored and backlog cleared; monthly monitoring in place.", evidence_reference: "CAP-2026-04" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "Evidence sufficient." }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          assert:
            - "immediately after the citation: registry_posture == FROZEN, open_critical_deficiency_count == 1, RegistrySubmission ${sub_id}.submission_state == HOLD with pre_hold_state == DRAFT"
            - "the response call left deficiency_state == RESPONSE_SUBMITTED with the posture still FROZEN (filing a response is not a remedy)"
            - "the review returns HTTP 200 with deficiency_state == RESOLVED and escalation_count == 0"
            - "after the review: open_critical_deficiency_count == 0, registry_posture == OPEN and RegistrySubmission ${sub_id}.submission_state == DRAFT (restored from pre_hold_state)"
            - "accreditation_state was ACCREDITED throughout - a resolved citation never touches it"

      - name: compliance_summary_is_repeatable_and_does_not_mutate_workflow_state
        claim_type: Computed read
        grounds:
          - endpoints[GET /cancer-registry/programs/{programId}/compliance-summary]
          - calculations.conference_compliance
          - calculations.registry_posture
        distinguishing_aspect: |
          The computed read recomputes derived aggregates only: two consecutive calls must return
          byte-identical bodies, must not advance the case's state or the source's
          last_reconciled_through (a clock-only field), and must report required_sessions_12mo 12 for
          a caseload of 300 (below CONFERENCE_CASELOAD_THRESHOLD 500).
        test_recipe:
          setup:
            - "One program with caseload 300, one source with one entry and one IDENTIFIED case, and no conference sessions."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
          trigger:
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          assert:
            - "both responses are HTTP 200 and identical field by field"
            - "credited_sessions_12mo == 0, required_sessions_12mo == 12, conference_frequency_compliant == false and coordinator_attendance_compliant == false"
            - "identified_case_count == 1, open_backlog_count == 1, overdue_backlog_count == 0, registry_posture == OPEN"
            - "TumorCase.${case_id}.case_state is still IDENTIFIED and its version is unchanged by the reads"
            - "CasefindingSource.${src_id}.last_reconciled_through is still null (only POST /_clock/set_current_utc writes it)"

      - name: endpoint_action_precondition_on_transmit_after_state_regression
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: transmit_requires_every_item_case_completed_after_audit_regression
          rationale: |
            The §1.8 instance already exercises transmit's cross-entity item precondition against a
            case that regressed out of COMPLETED after the item was added, which is the hardest form
            of this endpoint's precondition claim.

      - name: endpoint_conditional_action_blocked_by_frozen_registry
        claim_type: Conditional action
        excluded_because:
          difficulty_instance: frozen_registry_masks_abstractor_capacity_cap_on_assign
          rationale: |
            The §1.8 instance covers the conditional-action pattern where a frozen posture blocks an
            otherwise valid action and the action succeeds once the freeze lifts.

      - name: endpoint_compensating_action_on_audit_void
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: discrepancy_points_and_rework_cascade_fully_reversed_by_audit_void
          rationale: |
            The §1.8 instance drives void as a full compensating action (ledger, quality scores,
            workload counter and the rework cascade all reversed), covering every side effect this
            endpoint declares.

  # =========================================================================
  # Guide section 6 - From Table 6 (Errors)  [77 codes, every one triggerable]
  #
  # Coverage map for the catalogue. Codes triggered by instances in the other
  # sections of this file: ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND,
  # ERR_ABSTRACTOR_NOT_FOUND, ERR_SOURCE_NOT_FOUND, ERR_ENTRY_NOT_FOUND,
  # ERR_CASE_NOT_FOUND, ERR_ABSTRACTION_NOT_FOUND, ERR_AUDIT_NOT_FOUND,
  # ERR_SESSION_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_DEFICIENCY_NOT_FOUND,
  # ERR_MEASURE_NOT_FOUND, ERR_CONTACT_NOT_FOUND (entities Not Found + Parent
  # Relationship instances, plus the not-found sweep below);
  # ERR_STALE_CASE_VERSION (validations priority instance);
  # ERR_ENTRY_NOT_PENDING_REVIEW, ERR_ABSTRACTION_NOT_IN_QA,
  # ERR_AUDIT_ALREADY_SCORED, ERR_AUDIT_ALREADY_VOIDED,
  # ERR_SESSION_NOT_SCHEDULED, ERR_SESSION_NOT_YET_STARTED (state_machines);
  # ERR_ABSTRACTION_INCOMPLETE, ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR,
  # ERR_CONTACT_DATE_INVALID, ERR_CONFERENCE_QUORUM_NOT_MET,
  # ERR_DUPLICATE_CASEFINDING_ENTRY, ERR_SURVEY_DATE_TOO_SOON,
  # ERR_CLOCK_NOT_MONOTONIC, ERR_ABSTRACTOR_PROGRAM_MISMATCH,
  # ERR_DUPLICATE_COC_PROGRAM_ID, ERR_SUBMISSION_PERIOD_OVERLAP,
  # ERR_MEASURE_STATE_INVALID (calculations + validations);
  # ERR_UNRESOLVED_EDITS (endpoints); ERR_UNAUTHORIZED, ERR_FORBIDDEN,
  # ERR_NOT_ASSIGNED_ABSTRACTOR (rbac); ERR_STALE_SUBMISSION_VERSION
  # (cross_cutting_complexity_layers). The instances below cover the remainder,
  # and the excluded_because stubs point at the §1.8 instances that carry the
  # rest (limits, capacity, frozen registry, unpaid assessment, calendar
  # conflicts, terminal-state lockdown of abstraction/session/submission).
  # =========================================================================
  - section: errors
    instances:

      - name: foreign_program_case_added_to_a_submission_is_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_CASE_PROGRAM_MISMATCH]
          - validations[priority 60 case/submission program agreement]
          - endpoints[POST /cancer-registry/submissions/{submissionId}/items]
        distinguishing_aspect: |
          Both ids resolve and the case IS completed, so the only reason to refuse is that it belongs
          to another program; the item must not be created and the submission's version must not move,
          which distinguishes this from the priority-40 ERR_CASE_NOT_COMPLETED path.
        test_recipe:
          setup:
            - "Program A holds a DRAFT submission; program B holds one COMPLETED case abstracted and approved by its own staff."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_a: $.data.id }
            - call: "POST /cancer-registry/programs"
              payload: { name: "Lakeside Cancer Institute", coc_program_id: "COC-2200L", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_b: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_b}", name: "Sam Okafor", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_b_a: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_b}", name: "Rea Villanueva", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_b_q: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_b}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_b: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_b}/entries"
              payload: { patient_mrn: "MRN-0501", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_b: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_b}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_b: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_b}/assign"
              payload: { abstractor_id: "${abs_b_a}" }
              as: RegistryManager
              captures: { case_b_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_b}", abstractor_id: "${abs_b_a}", expected_case_version: "${case_b_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_b_a}"
              captures: { abst_b: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_b}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_b_a}"
            - call: "POST /cancer-registry/abstractions/${abst_b}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_b_q}"
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_a}", period_start: "2026-07-01", period_end: "2026-07-31", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_a: $.data.id, sub_a_v: $.data.version }
          trigger:
            - call: "POST /cancer-registry/submissions/${sub_a}/items"
              payload: { case_id: "${case_b}", expected_submission_version: "${sub_a_v}" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_CASE_PROGRAM_MISMATCH"
            - "RegistrySubmission ${sub_a}.total_case_count == 0 and its version still equals ${sub_a_v}"
            - "TumorCase ${case_b}.submission_state is still NOT_SUBMITTED"
            - "GET /cancer-registry/submission-items?submission_id=${sub_a} returns total_count == 0"

      - name: empty_submission_cannot_transmit_and_overpayment_is_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_SUBMISSION_EMPTY]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
          - endpoints[POST /cancer-registry/submissions/{submissionId}/assessment-payments]
        distinguishing_aspect: |
          A brand-new submission has total_case_count 0 AND assessment_due_cents 0, which makes it the
          only fixture where both guards fire: transmit is refused for emptiness (409) and any payment
          at all overshoots a zero balance (422), leaving assessment_paid_cents at 0.
        test_recipe:
          setup:
            - "One program with one empty DRAFT submission."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-07-01", period_end: "2026-07-31", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/submissions/${sub_id}/transmit"
              payload: { transmit_note: "Nothing to send" }
              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/submissions/${sub_id}/assessment-payments"
              payload: { amount_cents: 100 }
              as: RegistryManager
              captures: { err2: $.data.error_id }
          assert:
            - "transmit returns HTTP 409 with data.error_id == ERR_SUBMISSION_EMPTY and submission_state is still DRAFT with transmitted_at == null"
            - "the payment returns HTTP 422 with data.error_id == ERR_PAYMENT_EXCEEDS_BALANCE"
            - "assessment_due_cents == 0 and assessment_paid_cents == 0 after both refusals"
            - "the submission's version is unchanged by either refusal"

      - name: measure_with_no_eligible_strata_and_project_on_a_draft_measure_are_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_MEASURE_STRATA_EMPTY]
          - errors[ERR_MEASURE_STATE_INVALID]
          - state_machines.QualityMeasure.measure_state
        distinguishing_aspect: |
          A strata array that is non-empty but contains only zero-eligible strata must still raise
          ERR_MEASURE_STRATA_EMPTY (the emptiness is post-filter, not post-parse) and must write no
          rates; separately, opening an improvement project on a measure that was never evaluated is
          a state error, not ERR_PROJECT_NOT_REQUIRED.
        test_recipe:
          setup:
            - "One program with one DRAFT quality measure."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "CSTC", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/quality-measures/${meas_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_0", eligible_case_count: 0, compliant_case_count: 0 }, { stage_group: "STAGE_I", eligible_case_count: 0, compliant_case_count: 0 }] }
              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/quality-measures/${meas_id}/improvement-project"
              payload: { action: "OPEN", project_title: "Premature project", target_rate_pct: 90.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { err2: $.data.error_id }
          assert:
            - "evaluate returns HTTP 422 with data.error_id == ERR_MEASURE_STRATA_EMPTY"
            - "after the refusal performance_rate_pct == null, pooled_rate_pct == null, included_strata_count == 0 and measure_state is still DRAFT"
            - "improvement-project OPEN returns HTTP 409 with data.error_id == ERR_MEASURE_STATE_INVALID and measure_state is still DRAFT"

      - name: restricted_posture_requires_ctr_and_expired_certification_blocks_assignment
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_RESTRICTED_REQUIRES_CTR]
          - errors[ERR_ABSTRACTOR_CERTIFICATION_EXPIRED]
          - calculations.registry_posture
        distinguishing_aspect: |
          Both guards live on the same assign call but key on different entities: the credential rule
          only exists while the posture is RESTRICTED (four open cases), while the certification rule
          fires against the logical clock date regardless of posture - and a CTR registrar with a live
          credential is still assignable in the same RESTRICTED registry.
        test_recipe:
          setup:
            - "One program with four IDENTIFIED cases (posture RESTRICTED), a NON_CTR registrar, a CTR registrar whose certification lapsed 2026-07-31, and a fully valid CTR registrar."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Noor Haddad", credential: "NON_CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_nonctr: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Lee Chen", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2026-07-31" }
              as: RegistryManager
              captures: { abs_expired: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_ok: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { e1: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0002", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { e2: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0003", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { e3: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0004", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { e4: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${e1}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_1: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-entries/${e2}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_2: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-entries/${e3}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_3: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-entries/${e4}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_4: $.data.created_case_id }
          trigger:
            - call: "POST /cancer-registry/cases/${case_1}/assign"
              payload: { abstractor_id: "${abs_nonctr}" }
              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/cases/${case_1}/assign"
              payload: { abstractor_id: "${abs_expired}" }
              as: RegistryManager
              captures: { err2: $.data.error_id }
            - call: "POST /cancer-registry/cases/${case_1}/assign"
              payload: { abstractor_id: "${abs_ok}" }
              as: RegistryManager
          assert:
            - "the program's registry_posture == RESTRICTED with open_backlog_count == 4 before any assignment"
            - "the NON_CTR assignment returns HTTP 409 with data.error_id == ERR_RESTRICTED_REQUIRES_CTR"
            - "the lapsed-CTR assignment returns HTTP 409 with data.error_id == ERR_ABSTRACTOR_CERTIFICATION_EXPIRED (certification_expires_on 2026-07-31 < clock date 2026-08-01)"
            - "the valid CTR assignment returns HTTP 200 with case_state == ASSIGNED and Abstractor.${abs_ok}.assigned_open_case_count == 1"
            - "Abstractor.${abs_nonctr}.assigned_open_case_count == 0 and Abstractor.${abs_expired}.assigned_open_case_count == 0"

      - name: duplicate_attendee_ref_on_one_session_is_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_DUPLICATE_ATTENDANCE]
          - endpoints[POST /cancer-registry/conference-sessions/{sessionId}/attendances]
        distinguishing_aspect: |
          Uniqueness is on attendee_ref within the session only, so the second post is refused even
          though it carries a different discipline and a longer attended_minutes - it must not be
          allowed to overwrite the first row's minutes, which is what would silently corrupt the
          coordinator-attendance percentage.
        test_recipe:
          setup:
            - "One SCHEDULED conference session with a single surgery attendee recorded at 45 minutes."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
