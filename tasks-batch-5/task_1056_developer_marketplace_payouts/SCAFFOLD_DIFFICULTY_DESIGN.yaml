scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: revenue_share_provisional_vs_final_on_tier_boundary_crossing_purchase
        grounds:
          - calculations.revenue_share_split
          - entities.Purchase.fields.provisional_developer_net_cents
          - entities.PayoutLine.fields.final_share_bps
          - entities.PayoutLine.fields.tier_trueup_cents
          - state_machines.Purchase.AUTHORIZED_to_CAPTURED
          - state_machines.PayoutBatch.OPEN_to_CALCULATED
        distinguishing_aspect: |
          This dual variant operates on the money domain (Purchase / PayoutLine revenue split):
          the PROVISIONAL variant rates the boundary-crossing purchase at 7000 bps because the
          developer's lifetime base excludes it, while the FINAL variant re-rates that purchase
          AND its predecessor at 8500 bps, producing tier_trueup_cents == 150227 for identical inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z; US jurisdiction (0 bps, facilitator) and DE jurisdiction (1900 bps, facilitator) configured."
            - "Two revenue-share tiers: BASE at 0 cents -> 7000 bps and SCALE at 1000000 cents -> 8500 bps."
            - "Verified ACTIVE developer with tax_id_provided true owning a LIVE app with an ACTIVE USD ONE_TIME plan."
            - "Purchase P1 captured for 999000 cents in US (base 999000, provisional 7000 bps, net 699300); developer lifetime base is then 999000."
            - "Purchase P2 captured for three DE line items of 999 cents (gross 2997, tax 480, base 2517, provisional 7000 bps, net 1762); lifetime base becomes 1001517."
            - "An OPEN USD payout batch covering [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "DE", vat_rate_bps: 1900, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "SCALE", min_cumulative_base_cents: 1000000, developer_share_bps: 8500 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Acme Labs LLC", email: "dev@acme.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Acme Notes", category: "PRODUCTIVITY", listed_countries: ["US", "DE"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 999, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "initial release" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "meets guidelines" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-BIG-1", line_items: [{ sku: "site-license", unit_price_cents: 999000, quantity: 1 }] }
              as: StorefrontService
              captures: { p1_id: $.data.id }
            - call: "POST /api/purchases/${p1_id}/capture"
              payload: {}
              as: StorefrontService
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "DE", external_order_ref: "ORD-DE-1", line_items: [{ sku: "seat-a", unit_price_cents: 999, quantity: 1 }, { sku: "seat-b", unit_price_cents: 999, quantity: 1 }, { sku: "seat-c", unit_price_cents: 999, quantity: 1 }] }
              as: StorefrontService
              captures: { p2_id: $.data.id }
            - call: "POST /api/purchases/${p2_id}/capture"
              payload: {}
              as: StorefrontService
              captures: { p2_prov_net: $.data.provisional_developer_net_cents }
            - call: "POST /api/payout-batches"
              payload: { payout_currency: "USD", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /api/payout-batches/${batch_id}/calculate"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { batch_lines: $.data.line_count }
          assert:
            - "Purchase.${p2_id}.provisional_share_bps == 7000"
            - "Purchase.${p2_id}.provisional_developer_net_cents == 1762"
            - "PayoutBatch.${batch_id}.line_count == 1"
            - "The single PayoutLine of batch ${batch_id} has final_share_bps == 8500"
            - "That PayoutLine.tier_trueup_cents == 150227"
            - "That PayoutLine.gross_earnings_cents == 851289"
            - "That PayoutLine.payout_amount_cents == 808725"

      - name: developer_risk_score_standard_vs_accelerated_window
        grounds:
          - calculations.developer_risk_score
          - entities.Developer.fields.risk_score
          - entities.Developer.fields.risk_variant
          - entities.Developer.fields.risk_watch
          - state_machines.PolicyCase.OPEN_to_INVESTIGATING
        distinguishing_aspect: |
          This dual variant operates on a different entity domain from revenue_share_split - the
          Developer risk domain, not money: identical purchase history yields risk_score 20 under
          STANDARD (all-time denominator) and risk_score 0 under ACCELERATED (trailing 30 days by
          captured_at), because the fully refunded purchase falls outside the accelerated window.
        test_recipe:
          setup:
            - "US jurisdiction (0 bps, facilitator) and a single BASE tier at 7000 bps configured."
            - "Verified ACTIVE developer with a LIVE app and an ACTIVE USD ONE_TIME plan."
            - "Purchase A of 10000 cents captured at 2026-07-05T00:00:00Z and fully refunded at 2026-07-06T00:00:00Z."
            - "Purchase B of 10000 cents captured at 2026-08-10T00:00:00Z; at that moment risk_score is 20 with risk_variant STANDARD."
            - "Clock advanced to 2026-09-01T00:00:00Z and an OPEN PolicyCase exists on the app."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Risky Bits Inc", email: "risk@bits.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Bits Tracker", category: "HEALTH", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 10000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-A", line_items: [{ sku: "lifetime", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { pa_id: $.data.id }
            - call: "POST /api/purchases/${pa_id}/capture"
              payload: {}
              as: StorefrontService
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/purchases/${pa_id}/refunds"
              payload: { amount_cents: 10000, reason: "BUYER_REQUEST" }
              as: StorefrontService
              captures: { ra_id: $.data.id }
            - call: "POST /api/refunds/${ra_id}/decide"
              payload: { outcome: "APPROVED" }
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/refunds/${ra_id}/execute"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-B", line_items: [{ sku: "lifetime", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { pb_id: $.data.id }
            - call: "POST /api/purchases/${pb_id}/capture"
              payload: {}
              as: StorefrontService
            - call: "GET /api/developers/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { risk_before: $.data.risk_score, variant_before: $.data.risk_variant }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/policy-cases"
              payload: { app_id: "${app_id}", category: "PAYMENT_ABUSE", severity: "MEDIUM" }
              as: PolicyOfficer
              as_user_id: "officer-open"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/policy-cases/${case_id}/investigate"
              payload: {}
              as: PolicyOfficer
              as_user_id: "officer-open"
          assert:
            - "${risk_before} == 20"
            - "${variant_before} == STANDARD"
            - "Developer.${dev_id}.risk_watch == true"
            - "Developer.${dev_id}.risk_variant == ACCELERATED"
            - "Developer.${dev_id}.risk_score == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: vat_rounded_per_line_item_then_summed_beats_sum_then_round
        grounds:
          - calculations.purchase_tax_split
          - entities.Purchase.fields.tax_cents
          - entities.Purchase.fields.revenue_base_cents
          - entities.TaxJurisdiction.fields.vat_rate_bps
        distinguishing_aspect: |
          Mode (b) - nested rounding where order changes the cents: three DE line items of 999
          each round to 160 cents of VAT individually and sum to 480, whereas rounding the
          combined gross of 2997 once yields 479. The scaffold pins per-line-then-sum, so
          tax_cents == 480 and revenue_base_cents == 2517.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z; DE jurisdiction at 1900 bps with marketplace_facilitator true."
            - "Single BASE tier at 7000 bps."
            - "Verified ACTIVE developer owning a LIVE app with an ACTIVE USD ONE_TIME plan."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "DE", vat_rate_bps: 1900, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Rounding Co", email: "r@round.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Seat Manager", category: "PRODUCTIVITY", listed_countries: ["US", "DE"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 999, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "DE", external_order_ref: "ORD-DE-ROUND", line_items: [{ sku: "seat-a", unit_price_cents: 999, quantity: 1 }, { sku: "seat-b", unit_price_cents: 999, quantity: 1 }, { sku: "seat-c", unit_price_cents: 999, quantity: 1 }] }
              as: StorefrontService
              captures: { p_id: $.data.id }
          assert:
            - "Purchase.${p_id}.gross_cents == 2997"
            - "Purchase.${p_id}.tax_cents == 480"
            - "Purchase.${p_id}.revenue_base_cents == 2517"
            - "Purchase.${p_id}.tax_remitter == MARKETPLACE"
            - "Purchase.${p_id}.developer_tax_remittance_cents == 0"

      - name: backup_withholding_base_pinned_to_after_recovery_not_payable
        grounds:
          - calculations.payout_line_waterfall
          - entities.PayoutLine.fields.reserve_cents
          - entities.PayoutLine.fields.recovery_cents
          - entities.PayoutLine.fields.withholding_cents
          - entities.PayoutLine.fields.payout_amount_cents
          - entities.Developer.fields.negative_balance_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned by evaluation order: withholding is a
          rate on "what is payable" while payable is "what is left after withholding". The pinned
          order takes 2400 bps of after_recovery (59500 -> 14280), not of after_reserve (66500 ->
          15960) and not of payable, so payout_amount_cents == 45220.
        test_recipe:
          setup:
            - "US jurisdiction at 0 bps with marketplace_facilitator true; single BASE tier at 7000 bps."
            - "Developer verified ACTIVE, then flipped to tax_id_provided false so backup withholding applies."
            - "Purchase X of 10000 cents captured on 2026-07-01 (net 7000) and fully paid out in batch 1, whose line paid 5054 cents."
            - "A chargeback on X resolved LOST, leaving Developer.negative_balance_cents == 7000 and payout_hold true."
            - "Clock at 2026-08-05T00:00:00Z with purchase Y of 100000 cents captured (net 70000) and an OPEN USD batch for [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
