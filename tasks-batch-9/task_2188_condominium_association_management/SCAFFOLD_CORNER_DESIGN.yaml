        distinguishing_aspect: "Ratifying a PROPOSED (never-noticed) budget whose meeting is also not IN_SESSION and whose agenda lacks nothing must return the priority-12 ERR_INVALID_BUDGET_STATE, not the priority-13 ERR_MEETING_NOT_IN_SESSION — the state gate outranks the meeting gate, and no allocation may be written."
