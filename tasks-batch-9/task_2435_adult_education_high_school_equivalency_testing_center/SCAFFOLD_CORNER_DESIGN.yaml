      - name: credential_attainment_outcome_requires_matching_credential_evidence
        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
          - errors[ERR_OUTCOME_EVIDENCE_MISMATCH]
          - entities[OutcomeRecord]
        distinguishing_aspect: |
          credential_issuance_id is an optional endpoint input, so the required-field check at priority 5
          cannot catch a CREDENTIAL_ATTAINMENT outcome that omits it - priority 63 must. The instance also
          pins the mirror-image defect: a non-credential measure that supplies a credential_issuance_id is
          equally a mismatch, and a credential belonging to a different student is a third variant. Only
          the exact pairing is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. An OPEN funding period covering August 2026."
            - "Two PLACED students; the first holds an ISSUED HSE credential, the second holds none."
          setup_api_calls:
