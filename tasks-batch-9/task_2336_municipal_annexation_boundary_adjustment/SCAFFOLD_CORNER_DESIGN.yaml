          setup:
            - "A CIRCULATING petition on a certified two-parcel territory, with one SIGNED consent from OW1 on OW1's parcel."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
