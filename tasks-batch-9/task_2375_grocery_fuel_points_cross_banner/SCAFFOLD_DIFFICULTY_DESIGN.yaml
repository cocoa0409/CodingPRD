  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  #   * HouseholdLink  -> cycle PENDING -> ACTIVE -> SUSPENDED -> ACTIVE
  #   * FuelRedemption -> parallel dimensions with a cyclic settlement axis
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: household_link_cycles_active_suspended_active_and_restamps_activation
        grounds:
          - state_machines.HouseholdLink.SUSPENDED_to_ACTIVE
          - state_machines.HouseholdLink.ACTIVE_to_SUSPENDED
          - entities.HouseholdLink.fields.activated_at
          - entities.Household.fields.linked_member_count
        distinguishing_aspect: |
          The cycle back-edge is real: the same POST /household-links/{id}/activate
          serves PENDING->ACTIVE and SUSPENDED->ACTIVE, the household's
          linked_member_count drops to 0 while SUSPENDED and returns to 1 on
          re-activation, and activated_at is overwritten with the later clock
          instant rather than preserved. This cycle lives on HouseholdLink, a
          different entity from the parallel-dimension machine in this rule's
          other instance.
        test_recipe:
          setup:
            - "Banner B_LINK; Household H3 ACTIVE; Member M5; a PENDING PRIMARY HouseholdLink L1 between them."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "LINK", name: "Link Banner" }
              as: ProgramAdmin
              captures: { bl_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${bl_id}", household_code: "HH-LINK-1" }
              as: LoyaltyAnalyst
              captures: { h3_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bl_id}", alt_id: "5550000005", card_number: "4000000000000005", full_name: "Eli Link" }
              as: LoyaltyAnalyst
              captures: { m5_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${h3_id}", member_id: "${m5_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /household-links/${l1_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
              captures: { first_activation: $.data.activated_at }
            - call: "POST /household-links/${l1_id}/suspend"
              payload: {}
              as: LoyaltyAnalyst
            - call: "GET /households/${h3_id}"
              payload: {}
              as: LoyaltyAnalyst
              captures: { suspended_count: $.data.linked_member_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /household-links/${l1_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
              captures: { second_activation: $.data.activated_at }
          assert:
            - "${first_activation} == \"2026-08-01T00:00:00Z\""
            - "${suspended_count} == 0"
            - "${second_activation} == \"2026-08-11T00:00:00Z\""
            - "HouseholdLink.${l1_id}.status == \"ACTIVE\""
            - "HouseholdLink.${l1_id}.revoked_at == null"
            - "Household.${h3_id}.linked_member_count == 1"
            - "GET /household-links?household_id=${h3_id}&status=ACTIVE returns meta total_count == 1"

      - name: redemption_settlement_axis_cycles_while_authorization_axis_is_frozen
        grounds:
          - state_machines.FuelRedemption.DISPENSED_BATCHED_to_DISPENSED_PENDING
          - state_machines.FuelRedemption.AUTHORIZED_NOT_APPLICABLE_to_DISPENSED_PENDING
          - state_machines.SettlementBatch.SUBMITTED_to_REJECTED
          - entities.FuelRedemption.fields.settlement_status
        distinguishing_aspect: |
          The redemption's two axes move independently: settlement_status walks
          NOT_APPLICABLE -> PENDING -> BATCHED -> PENDING -> BATCHED -> SETTLED,
          traversing the reject back-edge, while authorization_status stays
          DISPENSED across all four settlement transitions. This parallel machine
          lives on FuelRedemption, a different entity from the HouseholdLink cycle.
