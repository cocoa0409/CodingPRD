# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Motor Club Membership Tiers, Reciprocity & Service Limits
# Breadth probe: required fields, defaults, enum closure, invalid transitions,
# RBAC denials, FK integrity, envelope/pagination, system sweeps, SoD, OCC, errors.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: club_creation_defaults_and_duplicate_code
        claim_type: creation_defaults
        grounds:
          - "entities.Club.fields.billing_policy"
          - "entities.Club.fields.status"
          - "entities.Club.fields.club_code"
        distinguishing_aspect: "Creating a club without billing_policy applies the SCHEDULE default and status ACTIVE; a second club with the same club_code is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id, club1_policy: $.data.billing_policy, club1_status: $.data.status }
          trigger:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "Duplicate", territory_state_codes: ["OR"], default_arrival_target_minutes: 30 }
              as: ClubAdmin
              captures: { err1: $.data.error_id }
          assert:
            - "first club billing_policy == SCHEDULE (default applied) and status == ACTIVE"
            - "duplicate club_code rejected with error_id == ERR_INVALID_REQUEST (http 400)"
      - name: club_get_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but non-existent club id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /motor-club/clubs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"
      - name: tier_required_fields_missing
        claim_type: required_fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]]"
          - "endpoints.POST /motor-club/tiers"
        distinguishing_aspect: "Omitting the required included_tow_miles from tier creation yields ERR_INVALID_REQUEST 400 before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: membership_duplicate_email_rejected
        claim_type: uniqueness_constraint
        grounds:
          - "entities.Membership.fields.primary_member_email"
        distinguishing_aspect: "Two memberships with the same primary_member_email are rejected at creation regardless of home club."
        test_recipe:
          setup: ["NCA club and CLASSIC tier exist"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "dup@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
          trigger:
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Other Person", primary_member_email: "dup@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: provider_sla_multiplier_range_enforced
        claim_type: type_constraints
        grounds:
          - "entities.ServiceProvider.fields.sla_multiplier"
        distinguishing_aspect: "sla_multiplier 3.5 exceeds the declared 0.5..3.0 range and is rejected at creation."
        test_recipe:
          setup: ["NCA club exists"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
          trigger:
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "Bad SLA", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 3.5, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 1 }
              as: ClubAdmin
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: membership_event_immutability_and_reverse_lookup
        claim_type: immutability
        grounds:
          - "entities.MembershipEvent"
        distinguishing_aspect: "MembershipEvent carries no version/updated_at (common_fields false), has no update endpoint, and every enrollment is retrievable via the membership's events feed."
        test_recipe:
          setup: ["M1 enrolled"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /motor-club/memberships/${m1}/membershipEvents"
              payload: {}
              as: MemberServicesRep
              captures: { ev0_type: "$.data[0].event_type" }
          assert:
            - "exactly one event with event_type == ENROLLMENT exists for ${m1}"
            - "the event payload carries id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: membership_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Membership"
        distinguishing_aspect: "From CANCELLED every action (renew, lapse, reinstate, upgrade) is rejected with ERR_INVALID_STATE; the terminal state absorbs all triggers."
        test_recipe:
          setup: ["M1 cancelled"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/cancel"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /motor-club/memberships/${m1}/renew"
              payload: {}
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status == 409"
      - name: renew_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Membership.GRACE_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Renew is only declared from GRACE and REINSTATED; attempting it from ACTIVE fails."
        test_recipe:
          setup: ["M1 ACTIVE"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /motor-club/memberships/${m1}/renew"
              payload: {}
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status == 409"
      - name: reinstate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Membership.LAPSED_to_REINSTATED"
        distinguishing_aspect: "Reinstate from ACTIVE (never lapsed) is rejected with ERR_INVALID_STATE — lapse is a hard precondition."
        test_recipe:
          setup: ["M1 ACTIVE"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /motor-club/memberships/${m1}/reinstate"
              payload: { dues_paid: true }
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status == 409"
      - name: grace_entry_and_renew_via_clock
        claim_type: valid_transition
        grounds:
          - "state_machines.Membership.ACTIVE_to_GRACE"
          - "state_machines.Membership.GRACE_to_ACTIVE"
          - "calculations.benefit_cap_check"
        distinguishing_aspect: "Clock advance past term_end_date auto-moves ACTIVE->GRACE; renew from GRACE rolls the term [2027-09-01, 2028-09-01) and resets the call counter to 0."
        test_recipe:
          setup: ["M1 ACTIVE enrolled at the 2026-09-01 default clock with one completed call (count 1)"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "GET /motor-club/memberships/${m1}"
              payload: {}
              as: MemberServicesRep
              captures: { m1_status: $.data.status }
            - call: "POST /motor-club/memberships/${m1}/renew"
              payload: {}
              as: MemberServicesRep
              captures: { m1_status2: $.data.status, m1_ts: $.data.term_start_date, m1_te: $.data.term_end_date, m1_calls: $.data.calls_used_current_term }
          assert:
            - "after the clock sweep status == GRACE"
            - "renew from GRACE succeeds: status == ACTIVE, term_start_date == 2027-09-01T00:00:00Z, term_end_date == 2028-09-01T00:00:00Z"
            - "calls_used_current_term resets 1 -> 0"
      - name: grace_to_lapsed_after_30_days
        claim_type: valid_transition
        grounds:
          - "state_machines.Membership.GRACE_to_LAPSED"
        distinguishing_aspect: "Clock advance past term_end_date + 30 days without renewal moves GRACE->LAPSED and stamps lapse_at; renew is then rejected as ERR_INVALID_STATE."
        test_recipe:
          setup: ["M1 ACTIVE; clock advanced to 2027-10-02 (one day past the grace deadline)"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-02T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "GET /motor-club/memberships/${m1}"
              payload: {}
              as: MemberServicesRep
              captures: { m1_status: $.data.status, m1_lapse: $.data.lapse_at }
            - call: "POST /motor-club/memberships/${m1}/renew"
              payload: {}
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "status == LAPSED and lapse_at is set"
            - "renew attempt returns error_id == ERR_INVALID_STATE (http 409)"
      - name: dispatch_complete_from_assigned_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Dispatch.ARRIVED_to_COMPLETED"
        distinguishing_aspect: "Complete requires ARRIVED; calling it on an ASSIGNED dispatch fails with ERR_INVALID_STATE and mutates nothing."
        test_recipe:
          setup: ["Call dispatched; dispatch ASSIGNED"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status == 409"
            - "Dispatch.${d1} remains ASSIGNED with mileage_charge_cents == 0"
      - name: dispatch_arrive_sla_boundary_inclusive
        claim_type: side_effect_execution
        grounds:
          - "calculations.effective_arrival_target"
          - "entities.Dispatch.fields.sla_met"
        distinguishing_aspect: "sla_met is inclusive at the exact promised minute: arriving at promised_arrive_by yields true, one minute later yields false."
        test_recipe:
          setup: ["Club target 45 min, provider multiplier 1.0 -> promised = assigned_at + 45; dispatch assigned at 2026-09-01T00:00:00Z (arrive at 00:45 first), then a second dispatch arriving at 00:46"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 6, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 3 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:45:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
              captures: { d1_sla: $.data.sla_met }
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c2: $.data.id, c2v: $.data.version }
            - call: "POST /motor-club/service-calls/${c2}/dispatch"
              payload: { expected_service_call_version: "${c2v}" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /motor-club/dispatches/${d2}/accept"
              payload: { en_route: true }
              as: ProviderOps
          trigger:
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:31:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/dispatches/${d2}/arrive"
              payload: {}
              as: ProviderOps
              captures: { d2_sla: $.data.sla_met }
          assert:
            - "Dispatch.${d1}.sla_met == true (arrived exactly at promised_arrive_by 00:45, inclusive boundary)"
            - "Dispatch.${d2}.sla_met == false (assigned 00:45, promised 01:30, arrived 01:31 — one minute late)"
      - name: service_call_expiry_via_clock
        claim_type: valid_transition
        grounds:
