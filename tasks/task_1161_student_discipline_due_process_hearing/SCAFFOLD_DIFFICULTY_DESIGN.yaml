# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1161: Student Discipline & Due-Process Hearing
# Nine Difficulty Rules x 2 instances = 18 instances.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (case-history domain vs aggregate-report domain).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: occurrence_window_variants_diverge_on_summer_incident
        grounds:
          - calculations.occurrence_count
          - entities.DisciplineCase.fields.occurrence_index
          - entities.DisciplineCase.fields.occurrence_index_ay
        distinguishing_aspect: |
          Entity domain = individual DisciplineCase history. The ROLLING_365
          variant counts the 2025-06-15 prior (252 days before the new incident)
          while the ACADEMIC_YEAR variant discards it (different July-1 window),
          so the same history yields occurrence_index 3 vs occurrence_index_ay 2.
        test_recipe:
          setup:
            - "Offense code DISR-01 (category DISRUPTION) with bands occ1 [1,3], occ2 [2,4], occ3 [4,8]"
            - "One student (disability NONE) with two CONFIRMED priors in category DISRUPTION: incident 2025-06-15 (academic year 2024-25) and incident 2026-01-15 (academic year 2025-26)"
            - "A third case with incident_date 2026-05-01, freshly created and still SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-06-10T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 2, min_days: 2, max_days: 4 }, as: DistrictAdmin }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 3, min_days: 4, max_days: 8 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu One", date_of_birth: "2009-03-01T00:00:00Z", grade_level: 10, demographic_group: "WHITE", guardian_id: "guard_1", disability_status: "NONE" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2025-06-15T00:00:00Z", description: "June prior incident" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case1_id: $.data.id, case1_v: $.data.version }
            - call: "POST /cases/${case1_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case1_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case1_v2: $.data.version }
            - call: "POST /cases/${case1_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case1_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case1_v3: $.data.version }
            - { call: "POST /cases/${case1_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-06-17T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${case1_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-01-15T00:00:00Z", description: "January prior incident" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case2_id: $.data.id, case2_v: $.data.version }
            - call: "POST /cases/${case2_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case2_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case2_v2: $.data.version }
            - call: "POST /cases/${case2_id}/sanction"
              payload: { sanction_days: 3, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case2_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case2_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-21T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${case2_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-01T00:00:00Z", description: "May incident under test" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case3_id: $.data.id, case3_v: $.data.version }
          trigger:
            - call: "POST /cases/${case3_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case3_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          assert:
            - "classify response DisciplineCase.occurrence_index == 3 (ROLLING_365 counts both the 2025-06-15 and 2026-01-15 priors)"
            - "classify response DisciplineCase.occurrence_index_ay == 2 (ACADEMIC_YEAR counts only the 2026-01-15 prior; 2025-06-15 belongs to AY 2024-25)"
            - "band lookup uses min(3, 3) = 3 (band [4,8]) where the ACADEMIC_YEAR variant would have used 2 (band [2,4]) — the two variants disagree on the same history"

      - name: risk_ratio_vs_share_gap_diverge_on_same_report
        grounds:
          - calculations.disproportionality_report
        distinguishing_aspect: |
          Entity domain = aggregate disproportionality report over Student x
          DisciplineCase (different domain from the case-history occurrence
          count). RISK_RATIO measures group risk relative to the reference group
          while SHARE_GAP measures composition difference; identical data yields
          0.5 vs -0.1667 for the same group.
        test_recipe:
          setup:
            - "Offense code TARD-01 (ATTENDANCE, severity 1) with band occ1 [1,2]"
            - "Six BLACK students and three WHITE students enrolled (guardian ids g_b1..g_b6, g_w1..g_w3), all disability NONE"
            - "Exactly one BLACK student (b1) and one WHITE student (w1) each have one CONFIRMED case with incident_date 2026-03-02 (inside AY 2025-2026)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "TARD-01", title: "Tardiness", category: "ATTENDANCE", severity_level: 1, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 2 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "B One", date_of_birth: "2010-01-01T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b1" }
              as: SchoolAdministrator
              captures: { b1_id: $.data.id }
            - { call: "POST /students", payload: { full_name: "B Two", date_of_birth: "2010-01-02T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b2" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Three", date_of_birth: "2010-01-03T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b3" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Four", date_of_birth: "2010-01-04T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b4" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Five", date_of_birth: "2010-01-05T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b5" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Six", date_of_birth: "2010-01-06T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b6" }, as: SchoolAdministrator }
            - call: "POST /students"
              payload: { full_name: "W One", date_of_birth: "2010-02-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w1" }
              as: SchoolAdministrator
              captures: { w1_id: $.data.id }
            - { call: "POST /students", payload: { full_name: "W Two", date_of_birth: "2010-02-02T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w2" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "W Three", date_of_birth: "2010-02-03T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w3" }, as: SchoolAdministrator }
            - call: "POST /cases"
              payload: { student_id: "${b1_id}", incident_date: "2026-03-02T00:00:00Z", description: "b1 case" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /cases/${cb_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${cb_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cb_v2: $.data.version }
            - call: "POST /cases/${cb_id}/sanction"
              payload: { sanction_days: 1, sanction_type: "IN_SCHOOL", expected_case_version: "${cb_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${cb_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-09T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${cb_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /cases"
              payload: { student_id: "${w1_id}", incident_date: "2026-03-02T00:00:00Z", description: "w1 case" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { cw_id: $.data.id, cw_v: $.data.version }
            - call: "POST /cases/${cw_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${cw_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cw_v2: $.data.version }
            - call: "POST /cases/${cw_id}/sanction"
              payload: { sanction_days: 1, sanction_type: "IN_SCHOOL", expected_case_version: "${cw_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${cw_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-16T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${cw_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
          trigger:
            - call: "GET /reports/disproportionality"
              payload: { academic_year: "2025-2026", reference_group: "WHITE" }
              as: DistrictAdmin
          assert:
            - "response groups_evaluated == 2"
            - "results row BLACK: risk == 0.1667 (1/6 rounded to 4 decimals)"
            - "results row BLACK: risk_ratio == 0.5 ((1/6)/(1/3) at full precision, then round_half_up to 2 decimals)"
            - "results row BLACK: share_gap == -0.1667 (1/2 - 6/9 rounded to 4 decimals)"
            - "results row WHITE: risk_ratio == 1.0 and share_gap == 0.1667"
            - "RISK_RATIO (0.5) != SHARE_GAP (-0.1667) for the same group on identical inputs — the two variants diverge"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes
  # (a) multi-input non-linear branch formula; (b) nested rounding order.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sanction_band_clamp_with_override_and_threshold_branch
        grounds:
          - calculations.sanction_determination
          - entities.DisciplineCase.fields.sanction_override
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (band from min(occurrence_index,3),
          requested days, override_justification presence, disability status,
          cumulative days) with non-linear interaction — band-range branch
          flips sanction_override, the absolute-cap branch rejects, and the MDR
          threshold branch spawns a child entity.
        test_recipe:
          setup:
            - "Offense code DISR-01 (DISRUPTION) with band occ1 [1,3]"
            - "Student NONE disability, no priors; case incident 2026-05-02 classified (occurrence 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Combo", date_of_birth: "2009-05-01T00:00:00Z", grade_level: 11, demographic_group: "HISPANIC", guardian_id: "guard_c" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-02T00:00:00Z", description: "hallway disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 3, sanction_type: "IN_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v3: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 6, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v3}", override_justification: "repeat severe disruption with safety risk" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          assert:
            - "first proposal (3 days inside band [1,3], no justification): sanction_override == false, proposed_sanction_days == 3"
            - "second proposal (6 days > band max 3 WITH justification, 6 <= cap 10): HTTP 200, sanction_override == true, proposed_sanction_days == 6"
            - "case.mdr_required == false (disability NONE short-circuits the threshold branch)"

      - name: risk_ratio_rounding_order_divide_then_round
        grounds:
          - calculations.disproportionality_report
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — divide group risks at full
          precision, then round_half_up to 2 decimals. Rounding each group risk
          first (0.17/0.33) would yield 0.52; the pinned order yields 0.5.
          Different mode from the sanction formula's branchy mode (a).
        test_recipe:
          setup:
            - "Same fixture shape as risk_ratio_vs_share_gap_diverge_on_same_report: 6 BLACK students (1 disciplined), 3 WHITE students (1 disciplined, reference), AY 2025-2026"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "TARD-01", title: "Tardiness", category: "ATTENDANCE", severity_level: 1, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 2 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "B One", date_of_birth: "2010-01-01T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b1" }
              as: SchoolAdministrator
              captures: { b1_id: $.data.id }
            - { call: "POST /students", payload: { full_name: "B Two", date_of_birth: "2010-01-02T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b2" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Three", date_of_birth: "2010-01-03T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b3" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Four", date_of_birth: "2010-01-04T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b4" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Five", date_of_birth: "2010-01-05T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b5" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "B Six", date_of_birth: "2010-01-06T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "g_b6" }, as: SchoolAdministrator }
            - call: "POST /students"
              payload: { full_name: "W One", date_of_birth: "2010-02-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w1" }
              as: SchoolAdministrator
              captures: { w1_id: $.data.id }
            - { call: "POST /students", payload: { full_name: "W Two", date_of_birth: "2010-02-02T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w2" }, as: SchoolAdministrator }
            - { call: "POST /students", payload: { full_name: "W Three", date_of_birth: "2010-02-03T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "g_w3" }, as: SchoolAdministrator }
            - call: "POST /cases"
              payload: { student_id: "${b1_id}", incident_date: "2026-03-02T00:00:00Z", description: "b1 case" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /cases/${cb_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${cb_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cb_v2: $.data.version }
            - call: "POST /cases/${cb_id}/sanction"
              payload: { sanction_days: 1, sanction_type: "IN_SCHOOL", expected_case_version: "${cb_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${cb_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-09T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${cb_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /cases"
              payload: { student_id: "${w1_id}", incident_date: "2026-03-02T00:00:00Z", description: "w1 case" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { cw_id: $.data.id, cw_v: $.data.version }
            - call: "POST /cases/${cw_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${cw_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cw_v2: $.data.version }
            - call: "POST /cases/${cw_id}/sanction"
              payload: { sanction_days: 1, sanction_type: "IN_SCHOOL", expected_case_version: "${cw_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${cw_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-16T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${cw_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
          trigger:
            - call: "GET /reports/disproportionality"
              payload: { academic_year: "2025-2026", reference_group: "WHITE" }
              as: DistrictAdmin
          assert:
            - "results row BLACK: risk_ratio == 0.5 exactly (full-precision division 0.1666.../0.3333... = 0.5, then round)"
            - "the forbidden round-first order would give round(0.17/0.33, 2) == 0.52; the implementation MUST NOT produce 0.52"
            - "results row BLACK: risk == 0.1667 (display rounding to 4 decimals is applied to the stored field only, not fed back into the ratio)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cyclic machines on DIFFERENT entities
  # (DisciplineCase appeal-reversal cycle vs Conference reschedule loop).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_cycle_notice_to_proposal_on_appeal_reversal
        grounds:
          - state_machines.DisciplineCase.NOTICE_ISSUED_to_SANCTION_PROPOSED
          - state_machines.Appeal.FILED_to_REVERSED
        distinguishing_aspect: |
          Entity = DisciplineCase (cycle SANCTION_PROPOSED -> NOTICE_ISSUED ->
          SANCTION_PROPOSED via appeal REVERSED, then re-proposal closes the
          loop a second time to NOTICE_ISSUED). Distinct entity from the
          Conference loop instance.
        test_recipe:
          setup:
            - "Student NONE disability, guardian g1; offense DISR-01 band occ1 [1,3]"
            - "Case (referrer admin_ref_1) classified by admin_adj_1, sanctioned 2 days, notice issued at 2026-05-04T09:00:00Z, conference HELD, guardian appeal FILED at 2026-05-05T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
