            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject1", email: "s1@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject1: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject2", email: "s2@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 8000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject2: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "FY26", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { strat_id: $.data.id } }
            - { call: "POST /strategies/${strat_id}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "A", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject1}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_id: $.data.id } }
            - { call: "POST /matches/${match_id}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_id}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp_id: $.data.id } }
            - { call: "POST /composites/${comp_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v: $.data.version } }
            - { call: "POST /composites/${comp_id}/publish", payload: { expected_job_version: "${job_v}" }, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "2026-Q3", effective_date: "2026-08-01", budget_cents: 1000000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { cycle_id: $.data.id } }
            - { call: "POST /cycles/${cycle_id}/adjustments", payload: { employee_id: "${subject1}", proposed_amount_cents: 100000, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { adj1: $.data.id } }
            - { call: "POST /cycles/${cycle_id}/adjustments", payload: { employee_id: "${subject2}", proposed_amount_cents: 50000, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { adj2: $.data.id } }
            - { call: "POST /adjustments/${adj1}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /adjustments/${adj2}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "GET /cycles/${cycle_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { cyc_v: $.data.version, alloc_before: $.data.allocated_cents } }
            - { call: "POST /adjustments/${adj1}/approve", payload: { expected_cycle_version: "${cyc_v}" }, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /cycles/${cycle_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { cyc_v2: $.data.version, alloc_after_a1: $.data.allocated_cents } }
            - { call: "POST /adjustments/${adj2}/approve", payload: { expected_cycle_version: "${cyc_v2}" }, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /cycles/${cycle_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { alloc_after_a2: $.data.allocated_cents } }
            # Lock cycle so adjustments can be applied
            - { call: "POST /cycles/${cycle_id}/lock", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
          trigger:
            - { call: "POST /adjustments/${adj1}/apply", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /adjustments/${adj2}/apply", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /cycles/${cycle_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { alloc_final: $.data.allocated_cents } }
          assert:
            - "alloc_before == 0"
            - "alloc_after_a1 == 100000"
            - "alloc_after_a2 == 150000"
            - "alloc_final == 150000 (APPLIED adjustments still counted — invariant conserved across approve→apply)"
            - "MarketAdjustment.${adj1}.status == APPLIED"
            - "MarketAdjustment.${adj2}.status == APPLIED"
