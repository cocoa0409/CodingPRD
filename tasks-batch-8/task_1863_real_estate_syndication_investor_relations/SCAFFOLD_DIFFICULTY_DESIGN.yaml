# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1863: Real Estate Syndication & Investor Relations
#
# Two instances per §0.5 Difficulty Rule (18 instances total). Every instance
# cross-references grounds declared in SCAFFOLD.yaml §1.1–§1.7 and pins an
# executable test_recipe (setup + setup_api_calls + trigger + assert).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: preferred_return_simple_vs_compounding
        grounds:
          - calculations.preferred_return_accrual
          - entities.Subscription.fields.accrued_pref_cents
          - entities.Offering.fields.carried_interest_pct
        distinguishing_aspect: |
          Variant selection on Subscription.accrued_pref_cents is driven by
          Offering.carried_interest_pct: below 0.25 uses simple linear accrual
          (P * r * Q/4); at-or-above 0.25 uses quarterly compounding
          (P * ((1+r/4)^Q - 1)). Two subscriptions with identical principal,
          rate, and elapsed quarters diverge by 24,322 cents over 4 quarters
          solely because their offerings chose different promote levels.
        test_recipe:
          setup:
            - "Two syndications exist, each with one offering, each with one FUNDED subscription of $100,000 (10,000,000 cents) at preferred_return_pct_annual=0.08"
            - "Offering A has carried_interest_pct=0.20 (simple variant)"
            - "Offering B has carried_interest_pct=0.30 (compounding variant)"
            - "Both subscriptions funded_at=2026-01-01T00:00:00Z; logical clock advanced to 2027-01-01T00:00:00Z (4 full quarters elapsed)"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "SynA", sponsor_legal_entity: "SynA LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_a_id: $.data.id }
            - call: "POST /syndications"
              payload: { syndication_name: "SynB", sponsor_legal_entity: "SynB LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.30 }
              as: SponsorOperator
              captures: { syn_b_id: $.data.id }
            - call: "POST /syndications/${syn_a_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_b_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "PropA LLC", street_address: "1 Main St", acquisition_price_cents: 500000000 }
              as: SponsorOperator
              captures: { prop_a_id: $.data.id }
            - call: "POST /properties"
              payload: { property_legal_name: "PropB LLC", street_address: "2 Main St", acquisition_price_cents: 500000000 }
              as: SponsorOperator
              captures: { prop_b_id: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings"
              payload: { property_id: "${prop_a_id}", offering_name: "OffA", target_raise_cents: 50000000, min_subscription_cents: 1000000, max_non_accredited_count: 35, preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { off_a_id: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings"
              payload: { property_id: "${prop_b_id}", offering_name: "OffB", target_raise_cents: 50000000, min_subscription_cents: 1000000, max_non_accredited_count: 35, preferred_return_pct_annual: 0.08, carried_interest_pct: 0.30 }
              as: SponsorOperator
              captures: { off_b_id: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "Investor A", tax_id_last4: "1111", email: "a@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_a_id: $.data.id }
            - call: "POST /investors"
              payload: { full_legal_name: "Investor B", tax_id_last4: "2222", email: "b@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_b_id: $.data.id }
            # Subscriptions on offering A
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions"
              payload: { investor_id: "${inv_a_id}", committed_cents: 10000000 }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { sub_a_id: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents"
              payload: { doc_type: "SUBSCRIPTION_AGREEMENT", file_uri: "s3://docs/a-sub.pdf" }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { doc_a_sub: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://docs/a-w9.pdf" }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { doc_a_w9: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://docs/a-suit.pdf" }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { doc_a_suit: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents"
              payload: { doc_type: "ACCREDITATION_LETTER", file_uri: "s3://docs/a-acc.pdf" }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { doc_a_acc: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents/${doc_a_sub}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents/${doc_a_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents/${doc_a_suit}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/documents/${doc_a_acc}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_a_id}"
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/verify-accreditation"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            # Subscription on offering B
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions"
              payload: { investor_id: "${inv_b_id}", committed_cents: 10000000 }
              as: Investor
              as_user_id: "${inv_b_id}"
              captures: { sub_b_id: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents"
              payload: { doc_type: "SUBSCRIPTION_AGREEMENT", file_uri: "s3://docs/b-sub.pdf" }
              as: Investor
              as_user_id: "${inv_b_id}"
              captures: { doc_b_sub: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://docs/b-w9.pdf" }
              as: Investor
              as_user_id: "${inv_b_id}"
              captures: { doc_b_w9: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://docs/b-suit.pdf" }
              as: Investor
              as_user_id: "${inv_b_id}"
              captures: { doc_b_suit: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents"
              payload: { doc_type: "ACCREDITATION_LETTER", file_uri: "s3://docs/b-acc.pdf" }
              as: Investor
              as_user_id: "${inv_b_id}"
              captures: { doc_b_acc: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents/${doc_b_sub}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents/${doc_b_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents/${doc_b_suit}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/documents/${doc_b_acc}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_b_id}"
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/verify-accreditation"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            # Move clock to 2026-01-01 (funding date), then issue + receive + release capital calls to drive FUNDED
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/capital-calls"
              payload: { total_call_cents: 10000000, due_date: "2026-02-01T00:00:00Z" }
              as: SponsorOperator
              captures: { cc_a_id: $.data.id }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/capital-calls/${cc_a_id}/issue"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_a_id}/offerings/${off_a_id}/capital-calls/${cc_a_id}/contributions"
              payload: {}
              as: SponsorOperator
              captures: { contrib_a_id: "$.data[0].id" }
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/capital-calls/${cc_a_id}/contributions/${contrib_a_id}/receive-escrow"
              payload: { amount_cents: 10000000 }
              as: Investor
              as_user_id: "${inv_a_id}"
            - call: "POST /syndications/${syn_a_id}/offerings/${off_a_id}/capital-calls/${cc_a_id}/contributions/${contrib_a_id}/release-escrow"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/capital-calls"
              payload: { total_call_cents: 10000000, due_date: "2026-02-01T00:00:00Z" }
              as: SponsorOperator
              captures: { cc_b_id: $.data.id }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/capital-calls/${cc_b_id}/issue"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_b_id}/offerings/${off_b_id}/capital-calls/${cc_b_id}/contributions"
              payload: {}
              as: SponsorOperator
              captures: { contrib_b_id: "$.data[0].id" }
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/capital-calls/${cc_b_id}/contributions/${contrib_b_id}/receive-escrow"
              payload: { amount_cents: 10000000 }
              as: Investor
              as_user_id: "${inv_b_id}"
            - call: "POST /syndications/${syn_b_id}/offerings/${off_b_id}/capital-calls/${cc_b_id}/contributions/${contrib_b_id}/release-escrow"
              payload: {}
              as: SponsorOperator
            # Advance clock to 2027-01-01 (4 full quarters)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: SponsorOperator
          trigger:
            - call: "GET /syndications/${syn_a_id}/offerings/${off_a_id}/subscriptions/${sub_a_id}"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_b_id}/offerings/${off_b_id}/subscriptions/${sub_b_id}"
              payload: {}
              as: SponsorOperator
          assert:
            - "Subscription.${sub_a_id}.accrued_pref_cents == 800000"
            - "Subscription.${sub_b_id}.accrued_pref_cents == 824322"
            - "Subscription.${sub_b_id}.accrued_pref_cents - Subscription.${sub_a_id}.accrued_pref_cents == 24322"

      - name: k1_provisional_vs_final_reconciliation
        grounds:
          - calculations.k1_provisional_allocation
          - calculations.k1_final_allocation
          - entities.K1Package.fields.draft_k1_cents_by_subscription
          - entities.K1Package.fields.final_k1_cents_by_subscription
        distinguishing_aspect: |
          K-1 allocation on K1Package entity (different entity domain from
          Subscription): provisional variant skips largest-remainder
          reconciliation and may drift from offering NOI; final variant
          reconciles to exactly the offering NOI. On identical inputs, the
          two variants produce different per-subscription amounts.
        test_recipe:
          setup:
            - "One syndication with one offering; three FUNDED subscriptions: A=$30,000 (3,000,000c), B=$30,000, C=$40,000 (4,000,000c); total $100,000"
            - "One PUBLISHED QuarterlyReport for tax_year 2026 (Q1) with noi_cents=100001"
            - "K1Package in PREPARATION for tax_year 2026"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "K1 Syn", sponsor_legal_entity: "K1 LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
