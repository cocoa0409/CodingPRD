              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v4: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-08T10:00:00Z", expected_case_version: "${case_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_i: $.data.id }
          assert:
            - "while the case was CALENDAR, the INDIVIDUAL_MERITS creation was rejected with 409 ERR_HEARING_TYPE_STAGE_MISMATCH (the priority-5 state check fires; the supplied version was current, so no OCC interference)"
            - "after the master hearing completed (case now MERITS), the identical INDIVIDUAL_MERITS creation returns 201 with Hearing.${h_i}.status == SCHEDULED"
            - "Hearing.${h_i}.hearing_type == INDIVIDUAL_MERITS and judge_id == ${judge_id} (copied from the case)"

      - name: appeal_gated_on_decision_issued_state
        grounds:
          - state_machines.Decision.APPEAL_PENDING_to_REMANDED
          - errors.ERR_DECISION_NOT_APPEALABLE
        distinguishing_aspect: |
          Entity pair Appeal -> Decision (different pair than Hearing -> Case):
          an appeal may be filed only while its decision is ISSUED — after a
