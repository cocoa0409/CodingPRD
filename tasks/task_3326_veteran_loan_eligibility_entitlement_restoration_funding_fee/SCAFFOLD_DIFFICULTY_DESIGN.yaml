scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: entitlement_base_vs_bonus_second_loan
    grounds:
    - calculations.remaining_entitlement_calc
    - entities.EntitlementAccount.fields.remaining_base_cents
    - entities.EntitlementAccount.fields.remaining_with_bonus_cents
    distinguishing_aspect: "EntitlementAccount domain: identical charge history (one closed\n$300,000 loan charging $75,000) yields remaining_base_cents\
      \ = 0 under\nthe base_only variant but remaining_with_bonus_cents = 11663750 under\nthe with_bonus variant \u2014 two valid readings, different\
      \ numbers.\n"
    test_recipe:
      setup:
      - Veteran HONORABLE regular military, 888 qualifying days, COE issued
      - SOUTH appraiser available; loan of price $300,000 closed with charge $75,000 (7500000 cents)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V One
          ssn_last4: '1001'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v1: $.data.id
      - call: POST /va-loans/veterans/${v1}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v1}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe1: $.data.id
      - call: POST /va-loans/coe-requests/${coe1}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v1}/loans
        payload:
          coe_id: ${coe1}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan1: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App S1
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appS1: $.data.id
      - call: POST /va-loans/loans/${loan1}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          apr1: $.data.id
      - call: POST /va-loans/appraisal-requests/${apr1}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 30000000
        as: Appraiser
        as_user_id: ${appS1}
      - call: POST /va-loans/loans/${loan1}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
      - call: POST /va-loans/loans/${loan1}/close
        payload:
          closing_date: '2026-03-10'
          first_payment_due_date: '2026-05-01'
        as: LoanOfficer
        as_user_id: lo-1
      trigger:
      - call: GET /va-loans/veterans/${v1}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          acct_base: $.data[0].remaining_base_cents
          acct_bonus: $.data[0].remaining_with_bonus_cents
          acct_charged: $.data[0].total_charged_cents
      assert:
      - EntitlementAccount[${v1}].total_charged_cents == 7500000
      - EntitlementAccount[${v1}].remaining_base_cents == 0
      - EntitlementAccount[${v1}].remaining_with_bonus_cents == 11663750
      - ${acct_base} != ${acct_bonus}
  - name: underwriting_va_method_vs_dti_only_divergence
    grounds:
    - calculations.residual_income_calc
    - calculations.dti_calc
    - entities.UnderwritingDecision.fields.dti_only_pass
    distinguishing_aspect: "UnderwritingDecision domain: identical income data yields\ndti_only_pass = true (conventional DTI-only variant) while\
      \ the VA\nresidual method computes outcome = DENIED because residual 95300 <\nrequired 100300 \u2014 different entity domain than the entitlement\
      \ pair\nand a different divergence shape (boolean pass/fail, not cents).\n"
    test_recipe:
      setup:
      - Veteran with ISSUED COE and a SOUTH loan in underwriting_status SUBMITTED
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Two
          ssn_last4: '1002'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v2: $.data.id
      - call: POST /va-loans/veterans/${v2}/service-periods
        payload:
          branch: NAVY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v2}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe2: $.data.id
      - call: POST /va-loans/coe-requests/${coe2}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v2}/loans
        payload:
          coe_id: ${coe2}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan2: $.data.id
      trigger:
      - call: POST /va-loans/loans/${loan2}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
        captures:
          dec_outcome: $.data.outcome
          dec_dti_only: $.data.dti_only_pass
          dec_residual: $.data.residual_income_cents
      assert:
      - UnderwritingDecision.outcome == DENIED
      - UnderwritingDecision.dti_only_pass == true
      - UnderwritingDecision.dti_percent == 25.00
      - UnderwritingDecision.residual_income_cents == 450000
      - UnderwritingDecision.residual_required_cents == 100300
      - Loan.${loan2}.underwriting_status == DENIED
  - name: funding_fee_exempt_variant_zeroes_tiered_fee
    grounds:
    - calculations.funding_fee_calc
    - entities.FundingFeeAssessment.fields.exempt
    distinguishing_aspect: "FundingFeeAssessment domain: two loans with identical price, zero\ndown payment and FIRST_USE pricing tier diverge\
      \ purely on the\nexemption variant \u2014 disability-compensation veteran pays 0 while the\nnon-exempt twin pays 645000 \u2014 a third entity\
      \ domain for dual-variant\nbehavior.\n"
    test_recipe:
      setup:
      - Two veterans, both HONORABLE regular military with 888 qualifying days and ISSUED COEs; one receives disability compensation
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Exempt
          ssn_last4: '1003'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: true
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v3a: $.data.id
      - call: POST /va-loans/veterans/${v3a}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v3a}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe3a: $.data.id
      - call: POST /va-loans/coe-requests/${coe3a}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans
        payload:
          full_name: V NonExempt
          ssn_last4: '1004'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v3b: $.data.id
      - call: POST /va-loans/veterans/${v3b}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v3b}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe3b: $.data.id
      - call: POST /va-loans/coe-requests/${coe3b}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v3a}/loans
        payload:
          coe_id: ${coe3a}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan3a: $.data.id
      - call: POST /va-loans/veterans/${v3b}/loans
        payload:
          coe_id: ${coe3b}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan3b: $.data.id
      trigger:
      - call: GET /va-loans/loans/${loan3a}/funding-fee-assessments
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          fee3a: $.data[0].assessed_fee_cents
          exempt3a: $.data[0].exempt
      - call: GET /va-loans/loans/${loan3b}/funding-fee-assessments
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          fee3b: $.data[0].assessed_fee_cents
          exempt3b: $.data[0].exempt
      assert:
      - FundingFeeAssessment[${loan3a}].exempt == true
      - FundingFeeAssessment[${loan3a}].assessed_fee_cents == 0
      - FundingFeeAssessment[${loan3b}].exempt == false
      - FundingFeeAssessment[${loan3b}].assessed_fee_cents == 645000
      - ${fee3a} != ${fee3b}
- rule_id: combinatorial_formula
  instances:
  - name: funding_fee_tiered_mode_a
    grounds:
    - calculations.funding_fee_calc
    distinguishing_aspect: "Mode (a) \u2014 >=3 inputs with tier selection: service_category x\nloan_use x down-payment tier x exemption; a FIRST_USE\
      \ purchase at\nexactly 5.0000% down selects the 1.50% tier (>= boundary) yielding\n427500, while 4.9999%-down would stay at 2.15%.\n"
    test_recipe:
      setup:
      - Veteran with ISSUED COE; no prior charged loans (FIRST_USE)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Tier
          ssn_last4: '1005'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v4: $.data.id
      - call: POST /va-loans/veterans/${v4}/service-periods
        payload:
          branch: MARINES
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v4}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe4: $.data.id
      - call: POST /va-loans/coe-requests/${coe4}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /va-loans/veterans/${v4}/loans
        payload:
          coe_id: ${coe4}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 1500000
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan4: $.data.id
      - call: GET /va-loans/loans/${loan4}/funding-fee-assessments
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          fee4: $.data[0].assessed_fee_cents
          rate4: $.data[0].fee_rate
      assert:
      - Loan.${loan4}.down_payment_pct == 5.0000
      - FundingFeeAssessment[${loan4}].fee_rate == 1.5
      - FundingFeeAssessment[${loan4}].assessed_fee_cents == 427500
  - name: dti_per_item_rounding_mode_b
    grounds:
    - calculations.dti_calc
    - entities.UnderwritingDecision.fields.other_obligations_monthly_cents
    distinguishing_aspect: "Mode (b) \u2014 nested rounding order pinned: annual obligations\n[12500,12500,12500] convert per-item round_half_up(item/12)=1042\
      \ then\nsum to 3126; the rejected sum-then-divide order yields 3125. The\nscaffold pins per-item, so the exposed field MUST equal 3126.\n"
    test_recipe:
      setup:
      - Veteran with ISSUED COE and a loan in underwriting_status SUBMITTED
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Round
          ssn_last4: '1006'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v5: $.data.id
      - call: POST /va-loans/veterans/${v5}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v5}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe5: $.data.id
      - call: POST /va-loans/coe-requests/${coe5}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v5}/loans
        payload:
          coe_id: ${coe5}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan5: $.data.id
      trigger:
      - call: POST /va-loans/loans/${loan5}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents:
          - 12500
          - 12500
          - 12500
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
        captures:
          dec5_monthly: $.data.other_obligations_monthly_cents
          dec5_dti: $.data.dti_percent
      assert:
      - UnderwritingDecision.other_obligations_monthly_cents == 3126
      - UnderwritingDecision.other_obligations_monthly_cents != 3125
      - UnderwritingDecision.dti_percent == 25.52
  - name: refinance_recoupment_evaluation_order_mode_c
    grounds:
    - calculations.refinance_seasoning_ntb_calc
    - entities.RefinanceRequest.fields.recoupment_months
    distinguishing_aspect: "Mode (c) \u2014 circular-looking dependency pinned to a fixed evaluation\norder: fee depends on new base, costs include\
      \ the fee, new payment\ndepends on costs. With new_base 20000000, fee 100000, flat 150000,\nrate 6.5 -> 5.5 FIXED/FIXED the pinned order\
      \ yields savings 11437 and\nrecoupment 22 months (<= 36, NTB satisfied); at rate 5.9 the same\ninputs yield savings 6304 and recoupment\
      \ 40 months (NTB fails).\n"
    test_recipe:
      setup:
      - 'Veteran with a CLOSED loan: price $200,000, 0 down, 6.5% FIXED, closing 2026-01-15, first payment due 2026-03-01'
      - logical clock at 2026-10-01 (seasoning 214 days)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Refi
          ssn_last4: '1007'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v6: $.data.id
      - call: POST /va-loans/veterans/${v6}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v6}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe6: $.data.id
      - call: POST /va-loans/coe-requests/${coe6}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v6}/loans
        payload:
          coe_id: ${coe6}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan6: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App S2
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appS2: $.data.id
      - call: POST /va-loans/loans/${loan6}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          apr6: $.data.id
      - call: POST /va-loans/appraisal-requests/${apr6}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 20000000
        as: Appraiser
        as_user_id: ${appS2}
      - call: POST /va-loans/loans/${loan6}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
      - call: POST /va-loans/loans/${loan6}/close
        payload:
          closing_date: '2026-01-15'
          first_payment_due_date: '2026-03-01'
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: ProgramAdmin
        as_user_id: admin-1
      - call: GET /va-loans/loans/${loan6}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan6_v: $.data.version
      - call: POST /va-loans/loans/${loan6}/refinance-requests
        payload:
          refinance_type: IRRRL
          new_rate_percent: 5.5
          new_rate_type: FIXED
          flat_costs_cents: 150000
          expected_loan_version: ${loan6_v}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          rr6: $.data.id
      trigger:
      - call: POST /va-loans/refinance-requests/${rr6}/evaluate
        payload: {}
        as: Underwriter
        as_user_id: uw-1
        captures:
          rr6_status: $.data.status
          rr6_recoup: $.data.recoupment_months
      assert:
      - RefinanceRequest.${rr6}.seasoning_days == 214
      - RefinanceRequest.${rr6}.ntb_rate_satisfied == true
      - RefinanceRequest.${rr6}.recoupment_months == 22
      - RefinanceRequest.${rr6}.ntb_satisfied == true
      - RefinanceRequest.${rr6}.status == APPROVED
- rule_id: non_linear_state_machine
  instances:
  - name: coe_denial_reconsideration_cycle
    grounds:
    - state_machines.CertificateOfEligibility.DENIED_to_RECONSIDERATION
    - state_machines.CertificateOfEligibility.RECONSIDERATION_to_ISSUED
    - entities.CertificateOfEligibility.fields.reconsideration_count
    distinguishing_aspect: 'CertificateOfEligibility machine is cyclic: REQUESTED -> DENIED ->

      RECONSIDERATION -> ISSUED, and the loop terminates after 2

      reconsiderations (third attempt rejected ERR_RECONSIDERATION_EXHAUSTED).

      '
    test_recipe:
      setup:
      - Veteran with DISHONORABLE discharge (deniable), COE REQUESTED
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Cyc
          ssn_last4: '1008'
          service_category: REGULAR_MILITARY
          character_of_discharge: DISHONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v7: $.data.id
      - call: POST /va-loans/veterans/${v7}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v7}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe7: $.data.id
      - call: POST /va-loans/coe-requests/${coe7}/deny
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/coe-requests/${coe7}/reconsider
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/coe-requests/${coe7}/deny
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/coe-requests/${coe7}/reconsider
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/coe-requests/${coe7}/deny
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /va-loans/coe-requests/${coe7}/reconsider
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          err7: $.data.error_id
      assert:
      - trigger response status == 409
      - error_id == ERR_RECONSIDERATION_EXHAUSTED
      - CertificateOfEligibility.${coe7}.reconsideration_count == 2
      - CertificateOfEligibility.${coe7}.status == DENIED
  - name: loan_parallel_dimensions_close_then_payoff
    grounds:
    - state_machines.Loan
    - entities.Loan.fields.underwriting_status
    - entities.Loan.fields.closing_status
