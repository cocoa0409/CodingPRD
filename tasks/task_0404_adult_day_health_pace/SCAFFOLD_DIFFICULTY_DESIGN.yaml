  - rule_id: priority_pair_validation_conflict
    instances:
      - name: enroll_state_beats_loc_safety
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.Participant.ELIGIBLE_to_ENROLLED
        distinguishing_aspect: |
          Category pair state(5) vs business_safety(8): a participant who is still APPLICANT (not ELIGIBLE) AND has
          no CERTIFIED LOC fails both; the higher-priority state check wins, so enroll returns ERR_INVALID_STATE,
          not ERR_LOC_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "Participant in APPLICANT status (no LOC certified, no care plan) — both the state precondition and the LOC-safety check would fail."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center I", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Applicant P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

