  # ===================================================================
  # SECTION 2 — state_machines  (§1.2, shape: parallel)
  # ===================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Season.initial_state
          - state_machines.ScheduleVersion.initial_state
          - state_machines.SlotHolding.initial_state
          - state_machines.FlightLeg.initial_state
        distinguishing_aspect: |
          Four machines are asserted in one chain: Season starts DRAFT (not OPEN), ScheduleVersion
          starts DRAFT on the filing dimension AND CLEAN on the independent compliance dimension,
          SlotHolding starts HELD, FlightLeg starts DRAFT. A Season that auto-opens would let slot and
          leg writes through before the coordinator has opened the season.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
          trigger:
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-I1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
          assert:
            - "the Season returned by trigger call 1 has status == \"DRAFT\" and slot_audit_completed_at_utc == null and audit_reference == null"
            - "ScheduleVersion.${sv_id}.filing_status == \"DRAFT\" and compliance_state == \"CLEAN\" — both dimensions at their own initial state"
            - "SlotHolding.${sh_id}.holding_status == \"HELD\", pending_transaction_id == null, returned_before_deadline == null, retains_historic_precedence == null"
            - "FlightLeg.${leg_id}.status == \"DRAFT\" and cancellation_reason == null"
            - "Season.${season_id}.status == \"OPEN\" after trigger call 2 and its version == 2"

      - name: season_draft_to_open_transition_moves_the_status_and_bumps_the_version
        claim_type: valid_transition
        grounds:
          - state_machines.Season.DRAFT_to_OPEN
          - endpoints.POST_seasons_season_id_transition
        distinguishing_aspect: |
          The declared happy path: to_status OPEN from DRAFT returns 200, sets status OPEN and
          increments Season.version from 1 to 2 as its declared side effect. This is the gate every
          slot and schedule write depends on, so it must be observable before any negative case is
          meaningful.
        test_recipe:
          setup:
            - "One Season W26 in DRAFT with version 1."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          assert:
            - "HTTP 200; Season.${season_id}.status == \"OPEN\" and version == 2"
            - "slot_audit_completed_at_utc == null and held_series_count == 0 — the transition has no other side effect"

      - name: season_archive_before_the_slot_audit_is_rejected_as_audit_pending
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Season.CLOSED_to_ARCHIVED
          - "validations.priority_29_ERR_SEASON_AUDIT_PENDING"
        distinguishing_aspect: |
          CLOSED -> ARCHIVED carries the precondition slot_audit_completed_at_utc != null. Archiving a
          CLOSED season that has never been audited must fail with ERR_SEASON_AUDIT_PENDING (409) —
          not ERR_SEASON_STATE_INVALID, because the requested status IS the immediate successor — and
          must leave the season CLOSED so the audit can still run.
        test_recipe:
          setup:
            - "One Season W26 driven DRAFT -> OPEN -> CLOSED; no slot audit has been run, so slot_audit_completed_at_utc is null."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "CLOSED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ARCHIVED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_SEASON_AUDIT_PENDING\", NOT ERR_SEASON_STATE_INVALID"
            - "Season.${season_id}.status == \"CLOSED\" and version == 3 — the rejected transition did not bump the version"

      - name: season_transition_skipping_a_status_is_rejected_as_state_invalid
        claim_type: invalid_transitions
        grounds:
          - "validations.priority_27_ERR_SEASON_STATE_INVALID"
          - state_machines.Season
        distinguishing_aspect: |
          The Season ladder is DRAFT -> OPEN -> CLOSED -> ARCHIVED and only the immediate successor is
          legal. A DRAFT season asked to go straight to CLOSED must fail with
          ERR_SEASON_STATE_INVALID (409), and the same season asked to go back to DRAFT once OPEN must
          fail too — proving the machine is neither skippable nor reversible.
        test_recipe:
          setup:
            - "One Season W26 in DRAFT."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "CLOSED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "DRAFT" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          assert:
            - "trigger call 1 (DRAFT -> CLOSED, skipping OPEN) -> HTTP 409 with data.error_id == \"ERR_SEASON_STATE_INVALID\"; Season.${season_id}.status == \"DRAFT\" and version == 1"
            - "trigger call 2 (DRAFT -> OPEN) -> HTTP 200; version == 2"
            - "trigger call 3 (OPEN -> DRAFT, backwards) -> HTTP 409 with data.error_id == \"ERR_SEASON_STATE_INVALID\"; status is still \"OPEN\" and version is still 2"

      - name: cancelled_leg_refuses_every_further_action_endpoint
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FlightLeg.terminal_states
          - "validations.priority_35_ERR_FLIGHT_LEG_STATE_INVALID"
        distinguishing_aspect: |
          CANCELLED is a terminal FlightLeg state: attach-slot, assign-aircraft and PATCH must all fail
          with ERR_FLIGHT_LEG_STATE_INVALID (409) afterwards, and none of them may resurrect the leg or
          touch the holding's attached_operations. Three different action endpoints are probed from the
          same terminal state so a per-endpoint guard cannot be faked by one lucky branch.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN; Aircraft D-AHXA IN_SERVICE; ScheduleVersion W26-K1."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z days_of_week \"1\" series_weeks 5, HELD, attached_operations 0."
            - "One FRA->MUC leg on 2026-11-02 08:00Z->09:00Z that has been cancelled with reason FLEET_REALLOCATION."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
