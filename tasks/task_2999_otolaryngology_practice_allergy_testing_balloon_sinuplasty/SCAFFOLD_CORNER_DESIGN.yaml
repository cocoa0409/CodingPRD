      - name: segregation_of_duties_across_five_actor_identity_rules
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SELF_VERIFICATION_FORBIDDEN
          - errors.ERR_SELF_DECISION_FORBIDDEN
          - errors.ERR_SELF_INTERPRETATION_FORBIDDEN
          - errors.ERR_SELF_SETTLEMENT_FORBIDDEN
          - errors.ERR_REPROCESSING_TECH_MISMATCH
