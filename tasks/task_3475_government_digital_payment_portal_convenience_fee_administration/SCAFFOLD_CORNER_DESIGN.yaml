            - &d_service
              call: "POST /portal/services"
              payload: { agency_id: "${ag2_id}", service_code: "PROP-TAX", name: "Property Tax Payment", fee_model: "ABSORBED", allowed_methods: ["ECHECK"], min_amount_cents: 1, max_amount_cents: 100000000, gl_code: "5200" }
              as: AgencyAdmin
              as_user_id: "aa-county"
              captures: { svc2_id: $.data.id }
            - &d_service_on
              call: "POST /portal/services/${svc2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *c_payer
            - *c_echeck
            - *c_echeck_ok
