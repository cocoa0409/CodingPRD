            - 'data.error_id == "ERR_PERMIT_NOT_ACTIVE"'
            - 'data.error_id != "ERR_INVOICE_PAST_DUE"'
            - 'FeeInvoice.${inv_a}.status == "PAST_DUE"'
            - 'Permit.${permit_a}.lifecycle_status == "PENDING_FEE"'
