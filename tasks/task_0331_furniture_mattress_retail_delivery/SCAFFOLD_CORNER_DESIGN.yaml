# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Furniture & Mattress Retail with Delivery — Expert
# Breadth probe across §1.1–§1.7; excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints
        distinguishing_aspect: "POST /customers with all required fields returns 201; response carries server-minted id, created_at, version=1, and open_financing_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Tess New", email: "tess@x.com", credit_score: 700, monthly_income_cents: 5000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cid: $.data.id, ofc: $.data.open_financing_count, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Customer.${cid}.open_financing_count == 0"
            - "Customer.${cid}.version == 1"

      - name: create_customer_missing_credit_score_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Customer.fields.credit_score
          - "validations[priority=5]"
        distinguishing_aspect: "Omitting required credit_score on POST /customers returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No Score", email: "noscore@x.com", monthly_income_cents: 5000000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Order
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /orders/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: order_line_default_quantity_and_flags_applied
        claim_type: Defaults
        grounds:
          - entities.OrderLine.fields.quantity
          - entities.OrderLine.fields.add_assembly
          - entities.OrderLine.fields.add_haul_away
        distinguishing_aspect: "Omitting quantity/add_assembly/add_haul_away on POST /order-lines applies defaults 1/false/false; line_total equals unit_config_price and addon_fee_cents == 0."
        test_recipe:
          setup: ["A DRAFT order and a sofa product (base 100000, STANDARD/STD)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Uma Buyer", email: "uma@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD" }
              as: SalesAssociate
              captures: { line_id: $.data.id, qty: $.data.quantity, addon: $.data.addon_fee_cents, lt: $.data.line_total_cents }
          assert:
            - "OrderLine.${line_id}.quantity == 1"
            - "OrderLine.${line_id}.addon_fee_cents == 0"
            - "OrderLine.${line_id}.line_total_cents == 100000"

      - name: line_unit_config_price_computed_from_surcharges
        claim_type: Computed Fields
        grounds:
          - calculations.line_unit_config_price
          - entities.OrderLine.fields.unit_config_price_cents
        distinguishing_aspect: "VELVET fabric (surcharge 20000) on a base-100000 sofa, qty 3, computes unit_config_price 120000 and line_total 360000; client cannot override computed fields."
        test_recipe:
          setup: ["A DRAFT order and a sofa product offering VELVET (+20000)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }, { code: "VELVET", surcharge_cents: 20000 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Vic Buyer", email: "vic@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "VELVET", size_code: "STD", quantity: 3 }
              as: SalesAssociate
              captures: { line_id: $.data.id, ucp: $.data.unit_config_price_cents, lt: $.data.line_total_cents }
          assert:
            - "OrderLine.${line_id}.unit_config_price_cents == 120000"
            - "OrderLine.${line_id}.line_total_cents == 360000"

      - name: order_line_invalid_fabric_returns_invalid_configuration
        claim_type: Type Constraints
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_INVALID_CONFIGURATION]"
          - entities.OrderLine.fields.fabric_code
        distinguishing_aspect: "A fabric_code not in Product.available_fabrics returns ERR_INVALID_CONFIGURATION (422), distinct from a malformed-body ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A DRAFT order and a sofa product offering only STANDARD fabric."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Wes Buyer", email: "wes@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "LEATHER", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_CONFIGURATION"

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Payment
        distinguishing_aspect: "Payment has common_fields:false — its create response carries id and created_at but no version field and has no update endpoint."
        test_recipe:
          setup: ["An approved INSTALLMENT plan ready to receive a payment."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Xan Buyer", email: "xan@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { o_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o_v}" }
              as: SalesAssociate
              captures: { fp_id: $.data.id }
            - call: "POST /financing-plans/${fp_id}/approve"
              as: StoreManager
          trigger:
            - call: "POST /financing-plans/${fp_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
              captures: { pay_period: $.data.applied_period_index }
          assert:
            - "HTTP status == 201"
            - "Payment.applied_period_index == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Confirming an order already in CONFIRMED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A CONFIRMED, PAID_IN_FULL order."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Yas Buyer", email: "yas@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_empty_order_returns_empty_order
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - "errors[ERR_EMPTY_ORDER]"
        distinguishing_aspect: "Pay-in-full on a DRAFT order with zero ACTIVE lines returns ERR_EMPTY_ORDER (409)."
        test_recipe:
          setup: ["A DRAFT order with no lines."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Zed Buyer", email: "zed@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_EMPTY_ORDER"

      - name: new_order_starts_draft_unpaid
        claim_type: Initial State
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "A freshly created order has fulfillment_status DRAFT and payment_status UNPAID."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann Init", email: "anninit@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id, fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "Order.${o_id}.fulfillment_status == DRAFT"
            - "Order.${o_id}.payment_status == UNPAID"

      - name: cancel_delivered_order_via_cancel_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel is only defined from DRAFT/CONFIRMED; cancelling a DELIVERED order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DELIVERED order (stop completed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bo Buyer", email: "bo@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/lock"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/dispatch"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/complete"
              as: DeliveryDispatcher
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: add_line_to_confirmed_order_returns_order_not_draft
        claim_type: Precondition Enforcement
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_ORDER_NOT_DRAFT]"
          - state_machines.OrderLine
        distinguishing_aspect: "Adding a line to a CONFIRMED order returns ERR_ORDER_NOT_DRAFT (409); lines are frozen after confirmation."
        test_recipe:
          setup: ["A CONFIRMED, PAID_IN_FULL order."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cal Buyer", email: "cal@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_DRAFT"

      - name: reject_approved_return_revert_no_ledger_drift
        claim_type: Compensation
        grounds:
          - state_machines.ReturnRequest.APPROVED_to_REJECTED
          - entities.Order.fields.amount_refunded_cents
          - entities.OrderLine.fields.status
        distinguishing_aspect: "Rejecting an APPROVED return (the revert path) leaves the line ACTIVE and Order.amount_refunded_cents unchanged at 0 — no refund side-effects fire."
        test_recipe:
          setup: ["A delivered line with an APPROVED CHANGED_MIND return (refund_amount 85000 computed but not disbursed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dot Buyer", email: "dot@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/lock"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/dispatch"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/complete"
              as: DeliveryDispatcher
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /return-requests/${ret_id}/approve"
              as: StoreManager
          trigger:
            - call: "POST /return-requests/${ret_id}/reject"
              as: StoreManager
              captures: { st: $.data.status }
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { refunded: $.data.amount_refunded_cents }
          assert:
            - "ReturnRequest.${ret_id}.status == REJECTED"
            - "Order.${o_id}.amount_refunded_cents == 0"
            - "OrderLine.${line_id}.status == ACTIVE"

      - name: financing_payoff_in_one_shot_sets_order_paid_in_full
        claim_type: Valid Transition
        grounds:
          - state_machines.FinancingPlan.CURRENT_to_PAID_OFF
          - entities.Order.fields.payment_status
          - entities.Customer.fields.open_financing_count
        distinguishing_aspect: "A single payment >= payoff_balance (116802 on a fresh INSTALLMENT plan) moves the plan to PAID_OFF, sets Order.payment_status PAID_IN_FULL, and decrements open_financing_count to 0."
        test_recipe:
          setup: ["A CURRENT INSTALLMENT plan, principal 116802, payoff_balance 116802 (no payments yet)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Eli Buyer", email: "eli@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { o_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o_v}" }
              as: SalesAssociate
              captures: { fp_id: $.data.id }
            - call: "POST /financing-plans/${fp_id}/approve"
              as: StoreManager
          trigger:
            - call: "POST /financing-plans/${fp_id}/payments"
              payload: { amount_cents: 116802 }
              as: SalesAssociate
            - call: "GET /financing-plans/${fp_id}"
