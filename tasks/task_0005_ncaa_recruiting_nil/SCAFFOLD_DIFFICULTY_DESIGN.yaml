# =============================================================================
# §1.8 Scaffold Difficulty Design — NCAA Recruiting & NIL Compliance
# 9 rules × ≥2 instances each = 18 instances total.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: scholarship_slot_utilization_base_vs_projected_diverge
        grounds:
          - calculations.scholarship_slot_utilization
          - entities.Program.fields.slots_committed
          - entities.Program.fields.slots_projected
        distinguishing_aspect: |
          Same Program row, same offer/certification ledger; base (committed
          only) and projected (committed + DRAFT-with-non-DENIED) return
          DIFFERENT integers for slot count. Entity domain: Program (scholarship-
          allocation accounting).
        test_recipe:
          setup:
            - "Program FB with cap=85, 1 SENT offer for athlete A (CERTIFIED), 1 DRAFT offer for athlete B (PENDING certification)."
            - "slots_committed = 1; slots_projected = 2."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "State U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_fb_id: $.data.id, prog_fb_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete A", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_a_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete B", sport_code: "FOOTBALL", gpa: 3.200, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_b_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_a_id}" }
              as: EligibilityCenter
              captures: { cert_a_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert_a_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_fb_id}", student_athlete_id: "${ath_a_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { off_a_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_a_id}/send"
              payload: { expected_program_version: "${prog_fb_v0}" }
              as: Coach
              captures: { prog_fb_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_fb_id}", student_athlete_id: "${ath_b_id}", annual_value_cents: 4500000 }
              as: Coach
              captures: { off_b_id: $.data.id }
          trigger:
            - call: "GET /ncaa/programs/${prog_fb_id}/utilization?variant=base"
              payload: {}
              as: Coach
              captures: { base_count: $.data.slot_count }
            - call: "GET /ncaa/programs/${prog_fb_id}/utilization?variant=projected"
              payload: {}
              as: Coach
              captures: { proj_count: $.data.slot_count }
          assert:
            - "base_count == 1"
            - "proj_count == 2"
            - "base_count != proj_count"

      - name: nil_value_gross_vs_net_diverge_on_tier
        grounds:
          - calculations.nil_value_classification
          - entities.NILDeal.fields.tier
          - entities.NILDeal.fields.net_value_cents
        distinguishing_aspect: |
          Same NILDeal inputs; classifying by gross_value_cents would tier as
          STANDARD, but the scaffold's pinned net-basis variant tiers as
          DE_MINIMIS for the same data. Entity domain: NILDeal (endorsement
          valuation) — structurally different from Program slot accounting.
        test_recipe:
          setup:
            - "CERTIFIED athlete A; NILDeal proposed with gross 60000 cents, agent_fee_pct 0.10."
            - "Pinned net variant yields net=54000, tier=DE_MINIMIS; gross variant would yield STANDARD on 60000."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete A", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_a_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_a_id}" }
              as: EligibilityCenter
              captures: { cert_a_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert_a_id}/approve"
              payload: {}
              as: EligibilityCenter
          trigger:
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${ath_a_id}", brand_name: "Sneakers Inc", gross_value_cents: 60000, agent_fee_pct: 0.10 }
              as: StudentAthlete
              as_user_id: "${ath_a_id}"
              captures: { deal_id: $.data.id, deal_tier: $.data.tier, deal_net: $.data.net_value_cents }
          assert:
            - "deal_net == 54000"
            - "deal_tier == DE_MINIMIS"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: program_penalty_tier_three_input_nonlinear_aggregation
        grounds:
          - calculations.program_penalty_tier
          - entities.Program.fields.penalty_tier
          - entities.BoosterIncident.fields.severity_weight
        distinguishing_aspect: |
          Mode (a) — formula with 3 inputs and non-linear interaction:
          (1) per-incident alleged_value_cents tiered into one of four weights,
          (2) sum across SUSTAINED incidents only, (3) threshold-step into one
          of four penalty tiers. Distinct from boundary mode (b) below.
        test_recipe:
          setup:
            - "Program with two SUSTAINED incidents: weights 3 + 7 = 10 -> penalty_tier=LEVEL_II."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Hoops U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete X", sport_code: "MBB", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_x_id: $.data.id }
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "Booster Beta", student_athlete_id: "${ath_x_id}", alleged_value_cents: 100000 }
              as: ComplianceOfficer
              captures: { inc1_id: $.data.id }
            - call: "POST /ncaa/booster-incidents/${inc1_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
              captures: { inc1_v1: $.data.version }
            - call: "POST /ncaa/booster-incidents/${inc1_id}/sustain"
              payload: { expected_boosterincident_version: "${inc1_v1}" }
              as: ComplianceOfficer
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "Booster Gamma", student_athlete_id: "${ath_x_id}", alleged_value_cents: 1000000 }
              as: ComplianceOfficer
              captures: { inc2_id: $.data.id }
            - call: "POST /ncaa/booster-incidents/${inc2_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
              captures: { inc2_v1: $.data.version }
            - call: "POST /ncaa/booster-incidents/${inc2_id}/sustain"
              payload: { expected_boosterincident_version: "${inc2_v1}" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prog_tier: $.data.penalty_tier }
          assert:
            - "prog_tier == LEVEL_II"

      - name: nil_value_classification_nested_rounding_order
        grounds:
          - calculations.nil_value_classification
          - entities.NILDeal.fields.net_value_cents
          - entities.NILDeal.fields.tier
        distinguishing_aspect: |
          Mode (b) — nested rounding order MUST be `round_half_even(net), THEN
          tier-compare`. For gross=555555, agent_fee_pct=0.10: net step yields
          499999.5 -> round_half_even -> 500000 (banker's). Tier check uses
          500000 (HIGH_VALUE because 500000 is NOT < 500000). The opposite
          order (compare gross 555555 then take net) would never assign
          HIGH_VALUE, since gross_basis would tier on 555555 first.
        test_recipe:
          setup:
            - "CERTIFIED athlete; deal with gross=555555, agent_fee_pct=0.10. After rounding net=500000 -> HIGH_VALUE tier."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete Y", sport_code: "WBB", gpa: 3.300, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_y_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_y_id}" }
              as: EligibilityCenter
              captures: { cert_y_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert_y_id}/approve"
              payload: {}
              as: EligibilityCenter
          trigger:
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${ath_y_id}", brand_name: "Energy Co", gross_value_cents: 555555, agent_fee_pct: 0.10 }
              as: StudentAthlete
              as_user_id: "${ath_y_id}"
              captures: { deal_id: $.data.id, deal_net: $.data.net_value_cents, deal_tier: $.data.tier }
          assert:
            - "deal_net == 500000"
            - "deal_tier == HIGH_VALUE"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nildeal_cyclic_revision_loop
        grounds:
          - state_machines.NILDeal
          - entities.NILDeal.fields.review_round
        distinguishing_aspect: |
          NILDeal: PROPOSED -> UNDER_REVIEW -> PROPOSED -> UNDER_REVIEW -> APPROVED.
          Cycle A->B->A is a non-linear cyclic shape; review_round increments
          on each request_revision and the deal returns to a non-terminal
          earlier state.
        test_recipe:
          setup:
            - "CERTIFIED athlete; STANDARD-tier NILDeal in UNDER_REVIEW after submit."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete Z", sport_code: "BASEBALL", gpa: 3.100, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_z_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_z_id}" }
              as: EligibilityCenter
              captures: { cert_z_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert_z_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${ath_z_id}", brand_name: "Bat Co", gross_value_cents: 200000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${ath_z_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
          trigger:
            - call: "POST /ncaa/nil-deals/${deal_id}/request-revision"
              payload: {}
              as: NILReviewer
              captures: { rr1_round: $.data.review_round, rr1_status: $.data.status }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
              captures: { sub2_status: $.data.status }
          assert:
            - "rr1_status == PROPOSED"
            - "rr1_round == 1"
            - "sub2_status == UNDER_REVIEW"

      - name: scholarship_offer_branching_from_sent
        grounds:
          - state_machines.ScholarshipOffer
        distinguishing_aspect: |
          ScholarshipOffer from SENT has THREE divergent outgoing transitions
          (ACCEPTED, DECLINED, WITHDRAWN) with divergent side-effect sets:
          ACCEPTED stamps enrolled_program_id without changing slots;
          DECLINED and WITHDRAWN decrement slots_committed. Branching shape
          on a different entity than NILDeal's cycle.
        test_recipe:
          setup:
            - "Two CERTIFIED athletes A1, A2 in Program P; both have SENT offers; slots_committed=2."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "SOFTBALL", school_name: "Diamond U", scholarship_slot_cap: 12 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "A1", sport_code: "SOFTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "A2", sport_code: "SOFTBALL", gpa: 3.400, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a1_id}" }
              as: EligibilityCenter
              captures: { c1_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${c1_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a2_id}" }
              as: EligibilityCenter
              captures: { c2_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${c2_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${a1_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { o1_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${o1_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { prog_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${a2_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { o2_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${o2_id}/send"
              payload: { expected_program_version: "${prog_v1}" }
              as: Coach
          trigger:
            - call: "POST /ncaa/scholarship-offers/${o1_id}/accept"
              payload: {}
              as: StudentAthlete
              as_user_id: "${a1_id}"
              captures: { o1_status: $.data.status }
            - call: "POST /ncaa/scholarship-offers/${o2_id}/decline"
              payload: {}
              as: StudentAthlete
              as_user_id: "${a2_id}"
              captures: { o2_status: $.data.status }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_slots: $.data.slots_committed }
          assert:
            - "o1_status == ACCEPTED"
            - "o2_status == DECLINED"
            - "final_slots == 1"

  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: booster_sustain_postseason_ban_cascade_depth3
        grounds:
          - state_machines.BoosterIncident
          - state_machines.ScholarshipOffer
          - calculations.program_penalty_tier
        distinguishing_aspect: |
          Depth-3 cascade: (1) sustain BoosterIncident -> recompute Program
          penalty_tier; (2) tier hits POSTSEASON_BAN -> auto-WITHDRAW each
          SENT ScholarshipOffer on that program; (3) each cascaded WITHDRAW
          decrements Program.slots_committed. Each link is CAUSED by the
          previous link's mutation, not by the original sustain call directly.
        test_recipe:
          setup:
            - "Program with 1 SENT offer, slots_committed=1, penalty_tier=NONE."
            - "One INVESTIGATING booster incident with alleged_value=5000000 (weight=15)."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Ban U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete C", sport_code: "FOOTBALL", gpa: 3.200, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_c_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_c_id}" }
              as: EligibilityCenter
              captures: { cert_c_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert_c_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${ath_c_id}", annual_value_cents: 6000000 }
              as: Coach
              captures: { off_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "Big Donor", student_athlete_id: "${ath_c_id}", alleged_value_cents: 5000000 }
              as: ComplianceOfficer
              captures: { inc_id: $.data.id }
            - call: "POST /ncaa/booster-incidents/${inc_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
              captures: { inc_v: $.data.version }
          trigger:
            - call: "POST /ncaa/booster-incidents/${inc_id}/sustain"
              payload: { expected_boosterincident_version: "${inc_v}" }
              as: ComplianceOfficer
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier: $.data.penalty_tier, slots: $.data.slots_committed }
            - call: "GET /ncaa/scholarship-offers/${off_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { off_status: $.data.status }
          assert:
            - "tier == POSTSEASON_BAN"
            - "off_status == WITHDRAWN"
            - "slots == 0"

      - name: eligibility_deny_cascade_withdraws_offers_depth2
        grounds:
          - state_machines.EligibilityCertification
          - state_machines.ScholarshipOffer
        distinguishing_aspect: |
          Depth-2 cascade originating from EligibilityCertification PENDING->
          DENIED (a different trigger than the booster sustain above):
          (1) deny -> StudentAthlete.eligibility_status := INELIGIBLE;
          (2) the eligibility flip cascades each ScholarshipOffer for that
          athlete in DRAFT/SENT to WITHDRAWN. Distinct trigger origin and
          distinct propagation pattern from the booster cascade.
        test_recipe:
          setup:
            - "Program FB; athlete D in PENDING certification; SENT offer to D; slots_committed=0 because send is blocked by ERR_ATHLETE_NOT_CERTIFIED — so we keep the offer in DRAFT."
            - "Actually: certify D first, send offer (slots_committed=1), then a NEW certification PENDING (rare but allowed: re-certification) then DENY that certification."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "BASEBALL", school_name: "Diamond State", scholarship_slot_cap: 11 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete D", sport_code: "BASEBALL", gpa: 3.400, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_d_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_d_id}" }
              as: EligibilityCenter
              captures: { cert1_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cert1_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${ath_d_id}", annual_value_cents: 4000000 }
              as: Coach
              captures: { off_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ath_d_id}" }
              as: EligibilityCenter
              captures: { cert2_id: $.data.id }
          trigger:
            - call: "POST /ncaa/eligibility-certifications/${cert2_id}/deny"
              payload: { denial_reason: "AMATEURISM_LOST" }
              as: EligibilityCenter
            - call: "GET /ncaa/student-athletes/${ath_d_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ath_status: $.data.eligibility_status }
            - call: "GET /ncaa/scholarship-offers/${off_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { off_status: $.data.status }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { slots: $.data.slots_committed }
          assert:
            - "ath_status == INELIGIBLE"
            - "off_status == WITHDRAWN"
            - "slots == 0"

  # ===========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: existence_vs_business_safety_not_found_wins_over_dead_period
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_DEAD_PERIOD_CONTACT]
        distinguishing_aspect: |
          Same RecruitingContact request violates BOTH the existence rule
          (program_id and student_athlete_id are bogus UUIDs) AND the
          DEAD-period business_safety rule (contact_at falls in a DEAD
          period of an actual program). Pair = (existence, business_safety).
          Existence (priority 4) wins; ERR_NOT_FOUND is returned, not
          ERR_DEAD_PERIOD_CONTACT.
        test_recipe:
          setup:
            - "A program has a DEAD period [2026-06-10..2026-06-20). Clock = 2026-06-15T12:00:00Z. Coach attempts a contact at that moment with bogus FK ids."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Calendar U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "DEAD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ncaa/recruiting-contacts"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", student_athlete_id: "00000000-0000-0000-0000-000000000001", coach_user_id: "coach_zzz", contact_at: "2026-06-15T12:00:00Z", channel: "EMAIL" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: business_fiscal_vs_business_constraint_athlete_not_certified_wins
        grounds:
          - validations[priority=14]
          - validations[priority=17]
          - errors[ERR_ATHLETE_NOT_CERTIFIED]
          - errors[ERR_SLOT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Same `send` request violates BOTH the business_constraint
          (athlete not CERTIFIED, priority 14) AND the business_fiscal
          (slot cap exceeded, priority 17). Pair = (business_constraint,
          business_fiscal) — a different error-category pair than instance 1.
          The lower-priority-number rule (14) wins; ERR_ATHLETE_NOT_CERTIFIED
          is returned.
        test_recipe:
          setup:
            - "Program FB with scholarship_slot_cap=1; one SENT offer already to certified athlete X (slots_committed=1)."
            - "DRAFT offer to athlete Y whose certification is still PENDING."
            - "Sending Y's offer simultaneously violates `>=` cap (1+1>1) AND `athlete not certified`."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Cap1 U", scholarship_slot_cap: 1 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete X", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { x_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete Y", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { y_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${x_id}" }
              as: EligibilityCenter
              captures: { cx_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cx_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${y_id}" }
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${x_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { ox_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${ox_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { prog_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${y_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { oy_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${oy_id}/send"
              payload: { expected_program_version: "${prog_v1}" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ATHLETE_NOT_CERTIFIED"

  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: scholarship_slot_cap_boundary_at_equal
        grounds:
          - validations[priority=17]
          - calculations.scholarship_slot_utilization
          - errors[ERR_SLOT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Boundary at `slots_committed + 1 > cap` vs `>= cap`. Sending the
          Nth offer when slots_committed == cap-1 -> SUCCESS (becomes ==cap).
          Sending one more -> ERR_SLOT_CAP_EXCEEDED. Numeric-threshold metric;
          endpoint = POST /ncaa/scholarship-offers/{id}/send.
        test_recipe:
          setup:
            - "Program with cap=2 and 1 SENT offer (slots_committed=1). A second DRAFT offer to a CERTIFIED athlete is ready to send."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "WBB", school_name: "Bound U", scholarship_slot_cap: 2 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete P", sport_code: "WBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete Q", sport_code: "WBB", gpa: 3.400, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { q_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${p_id}" }
              as: EligibilityCenter
              captures: { cp_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cp_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${q_id}" }
              as: EligibilityCenter
              captures: { cq_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cq_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${p_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { op_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${op_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { prog_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${q_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { oq_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${oq_id}/send"
              payload: { expected_program_version: "${prog_v1}" }
              as: Coach
              captures: { oq_status: $.data.status, prog_v2: "$.data.version" }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { slots: $.data.slots_committed, prog_v_final: $.data.version }
          assert:
            - "oq_status == SENT"
            - "slots == 2"

      - name: zero_value_incident_rejected_empty_zero_boundary
        grounds:
          - validations[priority=18]
          - errors[ERR_ZERO_VALUE_INCIDENT]
        distinguishing_aspect: |
          Different boundary metric (zero-quantity edge, not a numeric >= cap)
          on a different endpoint (POST /ncaa/booster-incidents). An incident
          with alleged_value_cents==0 is rejected; alleged_value_cents==1 is
          accepted.
        test_recipe:
          setup:
            - "Program and athlete exist; ComplianceOfficer files an incident with zero alleged value."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Zero U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete R", sport_code: "MBB", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "Zero Booster", student_athlete_id: "${r_id}", alleged_value_cents: 0 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ZERO_VALUE_INCIDENT"

  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: send_offer_requires_athlete_certified
        grounds:
          - state_machines.ScholarshipOffer
          - state_machines.EligibilityCertification
          - validations[priority=14]
          - errors[ERR_ATHLETE_NOT_CERTIFIED]
        distinguishing_aspect: |
          Entity pair (ScholarshipOffer, StudentAthlete): ScholarshipOffer's
          DRAFT->SENT transition is permitted only when the StudentAthlete's
          eligibility_status == CERTIFIED. Removing the cert (or never
          certifying) blocks the transition. Tests both polarities.
        test_recipe:
          setup:
            - "Athlete S has PENDING certification (no approve yet); DRAFT offer ready to send."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Cert U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete S", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { s_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${s_id}" }
              as: EligibilityCenter
              captures: { cs_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${s_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { os_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${os_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ATHLETE_NOT_CERTIFIED"

      - name: nil_approve_requires_program_not_under_sanction
        grounds:
          - state_machines.NILDeal
          - calculations.program_penalty_tier
          - validations[priority=16]
          - errors[ERR_PROGRAM_UNDER_SANCTION]
        distinguishing_aspect: |
          Different entity pair (NILDeal, Program). NILDeal UNDER_REVIEW->
          APPROVED with tier==HIGH_VALUE is blocked when Program.penalty_tier
          != NONE for the athlete's enrolled_program_id. State dependency
          crosses NILDeal/Program rather than ScholarshipOffer/StudentAthlete.
        test_recipe:
          setup:
            - "CERTIFIED athlete T enrolled in Program with penalty_tier=LEVEL_I (one weight-3 SUSTAINED incident)."
            - "NILDeal HIGH_VALUE (gross=600000, fee=0.0 -> net=600000, tier=HIGH_VALUE) in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Sanction U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete T", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { t_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${t_id}" }
              as: EligibilityCenter
              captures: { ct_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${ct_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${t_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { ot_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${ot_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
            - call: "POST /ncaa/scholarship-offers/${ot_id}/accept"
              payload: {}
              as: StudentAthlete
              as_user_id: "${t_id}"
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "Lvl1 Booster", student_athlete_id: "${t_id}", alleged_value_cents: 100000 }
              as: ComplianceOfficer
              captures: { inc_id: $.data.id }
            - call: "POST /ncaa/booster-incidents/${inc_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
              captures: { inc_v: $.data.version }
            - call: "POST /ncaa/booster-incidents/${inc_id}/sustain"
              payload: { expected_boosterincident_version: "${inc_v}" }
              as: ComplianceOfficer
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${t_id}", brand_name: "Big Brand", gross_value_cents: 600000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${t_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
          trigger:
            - call: "POST /ncaa/nil-deals/${deal_id}/approve"
              payload: {}
              as: NILReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PROGRAM_UNDER_SANCTION"

  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: period_overlap_halfopen_adjacency_permitted
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.Period
        distinguishing_aspect: |
          Interval semantics on Period: [starts_at, ends_at) half-open.
          Adjacency (B.starts_at == A.ends_at) is PERMITTED. One-cent overlap
          (B.starts_at < A.ends_at) is REJECTED. Resource = Period on a Program.
        test_recipe:
          setup:
            - "Program with one CONTACT period [2026-07-01..2026-07-10)."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Overlap U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "CONTACT", starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-07-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "DEAD", starts_at: "2026-07-10T00:00:00Z", ends_at: "2026-07-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { adj_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "QUIET", starts_at: "2026-07-09T23:59:00Z", ends_at: "2026-07-20T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PERIOD_OVERLAP"

      - name: portal_window_45day_exact_halfopen
        grounds:
          - validations[priority=11]
          - errors[ERR_PORTAL_WINDOW_CLOSED]
          - entities.TransferPortalEntry.fields.window_closes_at
        distinguishing_aspect: |
          Different interval semantics: a single-resource sliding window of
          fixed duration (entered_at + 45 days). The window is half-open: at
          current_utc == window_closes_at the action is REJECTED (boundary is
          exclusive end). Different resource (TransferPortalEntry) and
          geometry (sliding) from Period's static [start,end).
        test_recipe:
          setup:
            - "Clock=2026-01-01T00:00:00Z. CERTIFIED athlete enters portal."
            - "Advance clock to entered_at + 45 days exactly (2026-02-15T00:00:00Z)."
          setup_api_calls:
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Portal U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { src_prog_id: $.data.id }
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Destination U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { dst_prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete W", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { w_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${w_id}" }
              as: EligibilityCenter
              captures: { cw_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cw_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/transfer-portal-entries"
              payload: { student_athlete_id: "${w_id}", source_program_id: "${src_prog_id}" }
              as: StudentAthlete
              as_user_id: "${w_id}"
              captures: { entry_id: $.data.id, entry_v: $.data.version }
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ncaa/transfer-portal-entries/${entry_id}/match"
              payload: { matched_program_id: "${dst_prog_id}", expected_transferportalentry_version: "${entry_v}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PORTAL_WINDOW_CLOSED"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: send_then_withdraw_keeps_slots_invariant
        grounds:
          - state_machines.ScholarshipOffer
          - entities.Program.fields.slots_committed
          - calculations.scholarship_slot_utilization
        distinguishing_aspect: |
          Conserved quantity: Program.slots_committed. After a SEND followed
          by its compensating WITHDRAW, slots_committed MUST equal its
          pre-SEND value (delta=0). Pinned formula:
          slots_committed_post == count(offers WHERE status IN {SENT,ACCEPTED}).
        test_recipe:
          setup:
            - "Program FB cap=85, slots_committed=0; one CERTIFIED athlete; one DRAFT offer ready."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Invariant U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete K", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { k_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${k_id}" }
              as: EligibilityCenter
              captures: { ck_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${ck_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${k_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { ok_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${ok_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { after_send_status: $.data.status }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { mid_slots: $.data.slots_committed }
            - call: "POST /ncaa/scholarship-offers/${ok_id}/withdraw"
              payload: {}
              as: Coach
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_slots: $.data.slots_committed }
          assert:
            - "after_send_status == SENT"
            - "mid_slots == 1"
            - "final_slots == 0"

      - name: nil_revision_cycle_preserves_review_round_monotonicity
        grounds:
          - state_machines.NILDeal
          - entities.NILDeal.fields.review_round
        distinguishing_aspect: |
          Conserved quantity: NILDeal.review_round monotonic over the
          cyclic revision dance. Different conserved-quantity TYPE from
          slot count (review_round is a per-NILDeal monotonic counter, not
          a program-wide allocation). Invariant: review_round AFTER a
          submit->request_revision->submit round equals 1; doing it again
          equals 2; rejecting at round 2 leaves the field at 2.
        test_recipe:
          setup:
            - "STANDARD-tier NILDeal in PROPOSED; review_round=0."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Athlete L", sport_code: "WBB", gpa: 3.200, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { l_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${l_id}" }
              as: EligibilityCenter
              captures: { cl_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cl_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${l_id}", brand_name: "Apparel Co", gross_value_cents: 200000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${l_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
              captures: { rr0: $.data.review_round }
            - call: "POST /ncaa/nil-deals/${deal_id}/request-revision"
              payload: {}
              as: NILReviewer
              captures: { rr1: $.data.review_round }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
              captures: { rr1b: $.data.review_round }
            - call: "POST /ncaa/nil-deals/${deal_id}/request-revision"
              payload: {}
              as: NILReviewer
              captures: { rr2: $.data.review_round }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
              captures: { rr2b: $.data.review_round }
            - call: "POST /ncaa/nil-deals/${deal_id}/reject"
              payload: { rejection_reason: "BRAND_PROHIBITED" }
              as: NILReviewer
              captures: { final_rr: $.data.review_round, final_status: $.data.status }
          assert:
            - "rr0 == 0"
            - "rr1 == 1"
            - "rr1b == 1"
            - "rr2 == 2"
            - "rr2b == 2"
            - "final_rr == 2"
            - "final_status == REJECTED"
