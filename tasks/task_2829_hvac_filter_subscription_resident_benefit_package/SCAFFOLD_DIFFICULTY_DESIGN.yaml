# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2829 — HVAC Filter Subscription & Resident Benefit Package
#
# Nine §0.5 rule_ids, two differentiated instances each (18 instances).
# Every numeric assert below was computed with exact rational arithmetic against
# the §1.3 formulas and their constants, then written as a literal.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: non_install_evidence_runtime_variant_vs_survey_variant_diverge
        grounds:
          - calculations.non_install_evidence_score
          - entities.NonInstallCase.fields.evidence_score
          - entities.NonInstallCase.fields.confirm_threshold
          - entities.Subscription.fields.latest_evidence_score
          - state_machines.Subscription.installation_posture.UNVERIFIED_to_NON_INSTALL_SUSPECTED
        distinguishing_aspect: |
          Entity domain = Subscription/Unit telemetry. The same physical fact ("did the
          resident install the filters we shipped?") scores 70 under the renewal_survey
          variant and 62 under the runtime_analytics variant on the identical fixture, and
          the variants also carry different confirm thresholds (80 vs 60), so the survey
          case is NOT confirmable while the runtime case IS.
        test_recipe:
          setup:
            - "Catalog holds two ACTIVE 16x25x1 SKUs: MERV 8 at 680 cents and MERV 11 at 1120 cents."
            - "Property 'Cedar Ridge' is ACTIVE, PM_BILLED, benefit_tier PLUS, damage_waiver_enabled true, aqg_enabled true, credit_limit_cents 5000000."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2 and nominal_size_code 16x25x1; no measured size captured."
            - "Resident Ada Reyes has household_size 3 and no pets/smoker/allergy flags, so sku_selection picks the MERV 8 SKU, ship_cadence_days is 75 and filters_per_shipment is 2."
            - "Subscription is ACTIVE (activated on the logical date 2026-08-05) with monthly_fee_cents 3546 and four ACTIVE benefit entitlements."
            - "Shipment #1 (quantity 2) is DELIVERED with delivered_at 2026-08-06T00:00:00Z."
            - "Two RuntimeReading rows cover 2026-08-07 -> 2026-08-09 (window_days 2) with runtime_minutes 168 each and static_pressure_delta_pa rising 100 -> 120."
            - "Exactly one RenewalSurvey says installed_last_shipment false, filters_on_hand_count 0, self_reported_change_date 2026-08-08."
            - "Logical clock stands at 2026-08-09T00:00:00Z and installation_posture is UNVERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M11", size_code: "16x25x1", thickness_inches: 1, merv_rating: 11, unit_cost_cents: 1120, ship_weight_oz: 15, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m11_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "GET /shipments"
              payload: { subscription_id: "${sub_a_id}" }
              as: ProgramOperator
              captures: { ship1_id: "$.data[0].id" }
            - call: "POST /shipments/${ship1_id}/ship"
              payload: { tracking_code: "TRK-A-0001" }
              as: ProgramOperator
            - call: "POST /shipments/${ship1_id}/deliver"
              payload: { delivered_at: "2026-08-06T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-08T00:00:00Z", runtime_minutes: 168, static_pressure_delta_pa: 100, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-08T00:00:00Z", window_end: "2026-08-09T00:00:00Z", runtime_minutes: 168, static_pressure_delta_pa: 120, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/renewal-surveys"
              payload: { installed_last_shipment: false, filters_on_hand_count: 0, self_reported_change_date: "2026-08-08" }
              as: Resident
              as_user_id: "${res_a_id}"
          trigger:
            - call: "POST /subscriptions/${sub_a_id}/non-install-evaluations"
              payload: { detection_method: "RENEWAL_SURVEY", evaluated_through_date: "2026-08-09" }
              as: ProgramOperator
              captures: { case_survey_id: "$.data.id" }
            - call: "POST /non-install-cases/${case_survey_id}/close-unsubstantiated"
              payload: {}
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/non-install-evaluations"
              payload: { detection_method: "RUNTIME_ANALYTICS", evaluated_through_date: "2026-08-09" }
              as: ProgramOperator
              captures: { case_runtime_id: "$.data.id" }
          assert:
            - "NonInstallCase.${case_survey_id}.detection_method == RENEWAL_SURVEY"
            - "NonInstallCase.${case_survey_id}.evidence_score == 70"
            - "NonInstallCase.${case_survey_id}.suspect_threshold == 55"
            - "NonInstallCase.${case_survey_id}.confirm_threshold == 80"
            - "NonInstallCase.${case_survey_id}.status == CLOSED_UNSUBSTANTIATED"
            - "NonInstallCase.${case_runtime_id}.detection_method == RUNTIME_ANALYTICS"
            - "NonInstallCase.${case_runtime_id}.evidence_score == 62"
            - "NonInstallCase.${case_runtime_id}.suspect_threshold == 40"
            - "NonInstallCase.${case_runtime_id}.confirm_threshold == 60"
            - "NonInstallCase.${case_survey_id}.evidence_score != NonInstallCase.${case_runtime_id}.evidence_score (70 vs 62 on identical fixture data)"
            - "70 < 80 so the survey case cannot be confirmed, while 62 >= 60 so the runtime case can"
            - "Subscription.${sub_a_id}.latest_evidence_score == 62"
            - "Subscription.${sub_a_id}.latest_detection_method == RUNTIME_ANALYTICS"
            - "Subscription.${sub_a_id}.installation_posture == NON_INSTALL_SUSPECTED"

      - name: claim_settlement_provisional_at_triage_vs_final_at_decision_diverge
        grounds:
          - calculations.claim_settlement_amount
          - entities.Claim.fields.provisional_amount_cents
          - entities.Claim.fields.approved_amount_cents
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity domain = Claim settlement accounting (not telemetry). The divergence is
          produced by WHEN the snapshot is taken: provisional_at_triage freezes 30000 cents
          while installation_posture is UNVERIFIED, and final_at_decision re-reads the
          posture as NON_INSTALL_SUSPECTED and applies NON_INSTALL_HAIRCUT_PCT 0.50 to give
          15000 cents for the very same Claim row.
        test_recipe:
          setup:
            - "Fixture A as in the previous instance: ACTIVE PM_BILLED PLUS property, TWO_STAGE unit A-101, MERV 8 SKU at 680 cents, ACTIVE subscription with monthly_fee_cents 3546 activated on 2026-08-05."
            - "A DAMAGE_WAIVER Claim for requested_amount_cents 40000 with incident_date 2026-08-05 is UNDER_REVIEW, triaged by adjuster user adj-001 while installation_posture was still UNVERIFIED, so provisional_amount_cents is frozen at 30000."
            - "Shipment #1 is DELIVERED (delivered_at 2026-08-06T00:00:00Z) and two RuntimeReading rows over 2026-08-07 -> 2026-08-09 carry runtime_minutes 144 each with static_pressure_delta_pa 100 -> 120, scoring exactly 60."
            - "A RUNTIME_ANALYTICS evaluation has since moved installation_posture to NON_INSTALL_SUSPECTED; the DAMAGE_WAIVER entitlement is still ACTIVE because nothing has been CONFIRMED."
            - "Logical clock stands at 2026-08-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /claims"
              payload: { subscription_id: "${sub_a_id}", claim_type: "DAMAGE_WAIVER", incident_date: "2026-08-05", requested_amount_cents: 40000, description: "Return grille torn during filter change" }
              as: PropertyManager
              as_user_id: "${prop_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /claims/${claim_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "GET /shipments"
              payload: { subscription_id: "${sub_a_id}" }
              as: ProgramOperator
              captures: { ship1_id: "$.data[0].id" }
            - call: "POST /shipments/${ship1_id}/ship"
              payload: { tracking_code: "TRK-A-0001" }
              as: ProgramOperator
            - call: "POST /shipments/${ship1_id}/deliver"
              payload: { delivered_at: "2026-08-06T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-08T00:00:00Z", runtime_minutes: 144, static_pressure_delta_pa: 100, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-08T00:00:00Z", window_end: "2026-08-09T00:00:00Z", runtime_minutes: 144, static_pressure_delta_pa: 120, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/non-install-evaluations"
              payload: { detection_method: "RUNTIME_ANALYTICS", evaluated_through_date: "2026-08-09" }
              as: ProgramOperator
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Waiver applies; non-install suspicion open" }
              as: ClaimsAdjuster
              as_user_id: "adj-002"
          assert:
            - "Claim.${claim_id}.provisional_amount_cents == 30000"
            - "Claim.${claim_id}.approved_amount_cents == 15000"
            - "Claim.${claim_id}.provisional_amount_cents != Claim.${claim_id}.approved_amount_cents for one and the same Claim row"
            - "Claim.${claim_id}.status == APPROVED"
            - "Claim.${claim_id}.triaged_by_user_id == adj-001"
            - "Claim.${claim_id}.decided_by_user_id == adj-002"
            - "Subscription.${sub_a_id}.installation_posture == NON_INSTALL_SUSPECTED"
            - "NonInstallCase.${case_id}.evidence_score == 60"

  - rule_id: combinatorial_formula
    instances:

      - name: monthly_fee_nested_rounding_per_component_not_on_the_sum
        grounds:
          - calculations.monthly_fee_cents
          - calculations.ship_cadence_days
          - calculations.filters_per_shipment
          - calculations.benefit_entitlement_set
          - entities.Subscription.fields.monthly_fee_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — NESTED ROUNDING WHERE ORDER MATTERS. Three annual
          components are each divided by 12 and rounded independently, then summed
          (745 + 201 + 2600 = 3546). The plausible alternative "sum the annual components,
          divide by 12, round once" yields 3545 on this exact fixture, so the pinned order
          is observable from the API response alone.
        test_recipe:
          setup:
            - "Catalog holds one ACTIVE 16x25x1 MERV 8 SKU with unit_cost_cents 680, ship_weight_oz 14 and pack_quantity 1."
            - "Property 'Cedar Ridge' is ACTIVE, PM_BILLED, benefit_tier PLUS with damage_waiver_enabled true and aqg_enabled true, so all four benefit codes are entitled (annual 3600 + 15600 + 7200 + 4800 = 31200)."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2, giving filters_per_shipment 2."
            - "Resident Ada Reyes has household_size 3 with no pets/smoker/allergy flags, giving ship_cadence_days 75 and therefore shipments_per_year = 365/75 exactly."
            - "per_ship_weight_oz is 14 * 2 = 28, which is below WEIGHT_FREE_OZ 32, so weight_surcharge is 0 and only SHIP_HANDLING_CENTS 495 drives logistics."
            - "Logical clock stands at 2026-08-05T00:00:00Z; the subscription does not exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
          assert:
            - "Subscription.${sub_a_id}.assigned_sku_id == ${sku_m8_id}"
            - "Subscription.${sub_a_id}.ship_cadence_days == 75"
            - "Subscription.${sub_a_id}.filters_per_shipment == 2"
            - "Subscription.${sub_a_id}.entitled_benefit_codes has exactly 4 members: CREDIT_REPORTING, RENTERS_INSURANCE, DAMAGE_WAIVER, AIR_QUALITY_GUARANTEE"
            - "Subscription.${sub_a_id}.monthly_fee_cents == 3546"
            - "the pinned decomposition is m_filter 745 + m_logistics 201 + m_benefit 2600, each rounded independently"
            - "the rejected single-rounding order (42544.2 annual cents / 12 rounded once) would give 3545; 3545 is a WRONG answer and must not be returned"
            - "Subscription.${sub_a_id}.status == PENDING_SETUP"
            - "Subscription.${sub_a_id}.version == 1"

      - name: cancellation_settlement_tier_keyed_on_gross_credit_not_on_net
        grounds:
          - calculations.cancellation_settlement
          - calculations.unreturned_shipment_fee
          - endpoints.GET_subscriptions_id_settlement
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Combinatorial mode (c) — CIRCULAR-LOOKING DEPENDENCY WITH A PINNED ORDER. The
          waiver tier is looked up on step 1's gross_prorated_credit_cents (2364 -> 0.25),
          never on step 5's net_settlement_cents. Keying the tier on the net value is a real
          circularity and, resolved naively, gives pct 0.00 and a net of -356 instead of
          +324, so the two orders are distinguishable from one response.
        test_recipe:
          setup:
            - "Fixture A is ACTIVE with monthly_fee_cents 3546 (activated on 2026-08-05); the MERV 8 SKU costs 680 cents and filters_per_shipment is 2."
            - "Shipment #1 (scheduled_ship_date 2026-08-05, quantity 2) is DELIVERED with delivered_at 2026-08-06T00:00:00Z."
            - "Shipment #2 was scheduled for 2026-10-19 — exactly cadence-adjacent, so priority 23 accepts it — with quantity 2, and is SHIPPED."
            - "Both shipments therefore sit in the exposed set {SHIPPED, DELIVERED, RETURN_REQUESTED}; each contributes min(680 * 2, UNRETURNED_FEE_CAP_CENTS 2500) = 1360, so unreturned_fee_gross_cents is 2720."
            - "Logical clock stands at 2026-09-01T00:00:00Z so that a cancel effective_date of 2026-09-11 satisfies priority 27."
            - "September has 30 days: used_days 10, unused_days 20, gross_prorated_credit_cents = round_half_up(3546 * 20 / 30) = 2364."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "GET /shipments"
              payload: { subscription_id: "${sub_a_id}" }
              as: ProgramOperator
              captures: { ship1_id: "$.data[0].id" }
            - call: "POST /shipments/${ship1_id}/ship"
              payload: { tracking_code: "TRK-A-0001" }
              as: ProgramOperator
            - call: "POST /shipments/${ship1_id}/deliver"
              payload: { delivered_at: "2026-08-06T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/shipments"
              payload: { scheduled_ship_date: "2026-10-19", quantity: 2 }
              as: ProgramOperator
              captures: { ship2_id: "$.data.id" }
            - call: "POST /shipments/${ship2_id}/ship"
              payload: { tracking_code: "TRK-A-0002" }
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "GET /subscriptions/${sub_a_id}/settlement"
              payload: { effective_date: "2026-09-11" }
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/cancel"
              payload: { effective_date: "2026-09-11", cancel_reason: "RESIDENT_MOVE_OUT" }
              as: ProgramOperator
          assert:
            - "the settlement read returns used_days == 10 and unused_days == 20"
            - "the settlement read returns gross_prorated_credit_cents == 2364"
            - "the settlement read returns exposed_shipment_count == 2 and unreturned_fee_gross_cents == 2720"
            - "the settlement read returns waiver_credit_pct == 0.25 (tier looked up on 2364, which lies in [1000, 5000))"
