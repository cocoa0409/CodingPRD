        distinguishing_aspect: "The offer carries three foreign keys that must not only exist but agree: a dwelling belonging to a different policyholder is ERR_DWELLING_OWNER_MISMATCH rather than a not-found, and only the consistent triple produces a PENDING offer expiring 60 days out."
        test_recipe:
