scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: change_cea_credit_dual_credit_scopes
        grounds:
          - calculations.cea_credit_award
          - calculations.sponsoring_society_credit_balance
          - entities.CodeChange.fields.cea_credits
          - entities.SpecialtySociety.fields.cea_credit_balance
        distinguishing_aspect: |
          Two credit-bearing quantities ride the same approval of one CodeChange:
          the change-level cea_credits awarded to the sponsoring society on a
          TIER_I single-organ-system high-volume addition is 4.5, while the
          society-level balance in which non-approved and unsponsored changes
          contribute nothing is 4.5 only because this change is sponsored and approved.
        test_recipe:
          setup:
            - "One ACTIVE SpecialtySociety holding 1 seat with all three GPCIs at national 1.0000"
            - "One ACTIVE ChangeApplicant"
            - "One EditorialPanelMeeting in SCHEDULED state"
            - "One ReleaseCycle for 2027 with code_set_capacity 200, open for submissions"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One DRAFT CodeChange 00001 with change_type ADDITION, category CATEGORY_I, clinical_evidence_tier TIER_I, procedure_volume_threshold 8000, organ_system_count 1, sponsored by the society"
            - "The change posted, docketed at the meeting and moved to PANEL_REVIEW; meeting quorum satisfied by the three sentinel rows"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Alpha Society", specialty_code: "ALP", voting_seat_count: 1, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_a: $.data.id }
            - call: "POST /cpt/applicants"
              payload: { name: "Alpha Applicant", applicant_type: "SPECIALTY_SOCIETY", society_id: "${soc_a}", is_entity_member: true, dues_paid_current: true, contact_email: "alpha@example.org" }
              as: EditorialStaff
              captures: { app_a: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "FEB2027", meeting_month: "FEBRUARY", starts_at: "2027-02-08T14:00:00Z", ends_at: "2027-02-08T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_a: $.data.id }
            - call: "POST /cpt/release-cycles"
              payload: { year: 2027, comment_open: "2026-09-01T00:00:00Z", comment_close: "2026-10-01T00:00:00Z", addendum_comment_close: "2027-11-15T00:00:00Z", meeting_ids: ["${mtg_a}"], code_set_capacity: 200, errata_deadline: "2027-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_a: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00001", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_a}", society_id: "${soc_a}", clinical_evidence_tier: "TIER_I", evidence_sufficiency_index: 90, procedure_volume_threshold: 8000, organ_system_count: 1, descriptor_current: "Placeholder descriptor", descriptor_proposed: "Placeholder descriptor revised", guidelines: "None", parenthetical_instructions: "None" }
              as: EditorialStaff
              captures: { chg_a: $.data.id, chg_a_version: $.data.version }
            - call: "POST /cpt/code-changes"
              payload: { code: "00011", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_a}", society_id: "${soc_a}", clinical_evidence_tier: "TIER_II", evidence_sufficiency_index: 55, procedure_volume_threshold: 700, organ_system_count: 2, descriptor_current: "Second placeholder", descriptor_proposed: "Second placeholder revised", guidelines: "None", parenthetical_instructions: "None" }
              as: EditorialStaff
              captures: { chg_a2: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00012", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_a}", society_id: "${soc_a}", clinical_evidence_tier: "TIER_II", evidence_sufficiency_index: 45, procedure_volume_threshold: 600, organ_system_count: 2, descriptor_current: "Third placeholder", descriptor_proposed: "Third placeholder revised", guidelines: "None", parenthetical_instructions: "None" }
              as: EditorialStaff
              captures: { chg_a3: $.data.id }
            - call: "POST /cpt/release-cycles/${cyc_a}/submissions"
              payload: { change_ids: ["${chg_a}"], expected_change_version: "${chg_a_version}" }
              as: EditorialStaff
              captures: { cyc_a_version_after: $.data.version }
            - call: "POST /cpt/code-changes/${chg_a}/postings"
              payload: { comment_period_open_at: "2026-09-01T00:00:00Z", comment_period_close_at: "2026-10-01T00:00:00Z" }
              as: EditorialStaff
              captures: { chg_a_version: $.data.version }
            - call: "POST /cpt/meetings/${mtg_a}/agenda"
              payload: { change_ids: ["${chg_a}", "${chg_a2}", "${chg_a3}"] }
              as: EditorialStaff
            - call: "POST /cpt/meetings/${mtg_a}/openings"
              payload: {}
              as: EditorialPanelChair
          trigger:
            - call: "POST /cpt/code-changes/${chg_a}/determinations"
              payload: { determination: "APPROVED", determination_basis: "Evidence supports the addition" }
              as: EditorialPanelChair
              captures: { det_version: $.data.version }
          assert:
            - "CodeChange.${chg_a}.determination == APPROVED"
            - "CodeChange.${chg_a}.cea_credits == 4.5"
            - "SpecialtySociety.${soc_a}.cea_credit_balance == 4.5"
            - "SpecialtySociety.${soc_a}.cea_credit_balance >= 0.0"

      - name: value_record_component_rounding_dual_variant
        grounds:
          - calculations.code_value_dollar_split_proration
          - entities.CodeValue.fields.facility_payment_cents
          - entities.CodeValue.fields.component_round_total_cents
          - entities.CodeValue.fields.aggregate_round_total_cents
        distinguishing_aspect: |
          Two published totals on one CodeValue diverge for identical inputs:
          aggregate_round_total_cents is 18173 while component_round_total_cents
          is 18174, and the value's rounding_variant decides which of the two
          facility_payment_cents publishes, so the same RVU inputs yield 18173
          or 18174 depending on the variant.
        test_recipe:
          setup:
            - "One SpecialtySociety with gpci_work 1.0521, gpci_pe 1.1234 and gpci_mp 0.6980"
            - "One ACTIVE LicensingAgreement of the Licensee class supplying the licence"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One CodeValue 00002 with work_rvu 2.80, facility_pe_rvu 1.90, nonfacility_pe_rvu 1.90, mp_rvu 0.24, conversion_factor 34.63, rounding_variant AGGREGATE_ROUNDING"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Beta Society", specialty_code: "BET", voting_seat_count: 1, gpci_work: 1.0521, gpci_pe: 1.1234, gpci_mp: 0.6980 }
              as: EditorialStaff
              captures: { soc_b: $.data.id }
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-NORTHEAST", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_b: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Beta Clinic", vendor_worldwide: false, expected_users: 20, sales_unit_count: 10, base_fee_cents: 0, territory_id: "${ter_b}" }
              as: LicensingOfficer
              captures: { lic_b: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-values"
              payload: { code: "00002", specialty_id: "${soc_b}", work_rvu: 2.80, facility_pe_rvu: 1.90, nonfacility_pe_rvu: 1.90, mp_rvu: 0.24, conversion_factor: 34.63, rounding_variant: "AGGREGATE_ROUNDING" }
              as: LicensingOfficer
              captures: { cv_b: $.data.id }
          trigger:
            - call: "POST /cpt/code-values/${cv_b}/effective-dates"
              payload: { effective_date: "2027-01-01T00:00:00Z" }
              as: LicensingOfficer
              captures: { cv_b_version: $.data.version }
          assert:
            - "CodeValue.${cv_b}.aggregate_round_total_cents == 18173"
            - "CodeValue.${cv_b}.component_round_total_cents == 18174"
            - "CodeValue.${cv_b}.facility_payment_cents == 18173"
            - "CodeValue.${cv_b}.nonfacility_payment_cents == 18173"
            - "CodeValue.${cv_b}.aggregate_round_total_cents != CodeValue.${cv_b}.component_round_total_cents"

      - name: release_cycle_pool_dual_derivation
        grounds:
          - calculations.release_cycle_code_pool_allocation
          - entities.ReleaseCycle.fields.discretionary_codes
          - entities.ReleaseCycle.fields.budget_gate_status
          - validations[priority=11]
        distinguishing_aspect: |
          The ReleaseCycle domain computes discretionary_codes twice for the same
          capacity: per_bucket_floors at capacity 192 yields 40 and clears the
          gate, while single_floor_budgeting at the same capacity yields 39 and
          sets budget_gate_status to EXHAUSTED, so identical input diverges by one code.
        test_recipe:
          setup:
            - "One EditorialPanelMeeting in SCHEDULED state"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One ReleaseCycle for 2027 with code_set_capacity 192 and single_floor_budgeting false"
          setup_api_calls:
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "APR2027", meeting_month: "APRIL", starts_at: "2027-04-12T14:00:00Z", ends_at: "2027-04-12T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_c: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/release-cycles"
              payload: { year: 2027, comment_open: "2026-01-01T00:00:00Z", comment_close: "2026-02-01T00:00:00Z", addendum_comment_close: "2027-11-15T00:00:00Z", meeting_ids: ["${mtg_c}"], code_set_capacity: 192, errata_deadline: "2027-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_c: $.data.id }
          trigger:
            - call: "POST /cpt/release-cycles/${cyc_c}/returns"
              payload: { reason: "Recompute the descriptor pools" }
              as: EditorialStaff
              captures: { cyc_c_version: $.data.version }
          assert:
            - "ReleaseCycle.${cyc_c}.editorial_reserved_codes == 76"
            - "ReleaseCycle.${cyc_c}.additions_pool_codes == 67"
            - "ReleaseCycle.${cyc_c}.catiii_pool_codes == 9"
            - "ReleaseCycle.${cyc_c}.discretionary_codes == 40"
            - "ReleaseCycle.${cyc_c}.budget_gate_status == OPEN"

  - rule_id: combinatorial_formula
    instances:
      - name: change_payment_units_tiered_magnitude_chain
        grounds:
          - calculations.code_value_dollar_split_proration
          - calculations.ruc_global_valuation_to_code_value
          - entities.CodeValue.fields.dollar_split_shortfall_cents
          - validations[priority=22]
        distinguishing_aspect: |
          Mode (a): the published nonfacility total is a nested min/select over
          three tiered magnitude weights and three geographic indices, so the
          value for a 0.24 malpractice RVU depends on which RVU band the survey
          time selects, not on any single rate.
        test_recipe:
          setup:
            - "One SpecialtySociety with gpci_work 1.0521, gpci_pe 1.1234 and gpci_mp 0.6980"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One CodeValue 00003 with work_rvu 2.80, facility_pe_rvu 1.90, nonfacility_pe_rvu 1.90, mp_rvu 0.24, conversion_factor 34.63"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Gamma Society", specialty_code: "GAM", voting_seat_count: 2, gpci_work: 1.0521, gpci_pe: 1.1234, gpci_mp: 0.6980 }
              as: EditorialStaff
              captures: { soc_g: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-values"
              payload: { code: "00003", specialty_id: "${soc_g}", work_rvu: 2.80, facility_pe_rvu: 1.90, nonfacility_pe_rvu: 1.90, mp_rvu: 0.24, conversion_factor: 34.63, rounding_variant: "AGGREGATE_ROUNDING" }
              as: LicensingOfficer
              captures: { cv_g: $.data.id }
          trigger:
            - call: "POST /cpt/code-values/${cv_g}/effective-dates"
              payload: { effective_date: "2027-01-01T00:00:00Z" }
              as: LicensingOfficer
              captures: { cv_g_version: $.data.version }
          assert:
            - "CodeValue.${cv_g}.nonfacility_payment_cents == 18173"
            - "CodeValue.${cv_g}.dollar_split_shortfall_cents == 0"
            - "CodeValue.${cv_g}.facility_payment_cents == 18173"

      - name: release_cycle_pool_pinned_subtraction_order
        grounds:
          - calculations.release_cycle_code_pool_allocation
          - entities.ReleaseCycle.fields.discretionary_codes
          - entities.ReleaseCycle.fields.editorial_reserved_codes
        distinguishing_aspect: |
          Mode (c): discretionary_codes is defined only because the scaffold pins
          the evaluation order editorial, then additions, then catiii before the
          subtraction, so a capacity of 190 yields 39 and trips the gate whereas
          summing the pools in any other order would yield a different residual.
        test_recipe:
          setup:
            - "One EditorialPanelMeeting in SCHEDULED state"
            - "Logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "JUN2027", meeting_month: "JUNE", starts_at: "2027-06-14T14:00:00Z", ends_at: "2027-06-14T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_h: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/release-cycles"
              payload: { year: 2028, comment_open: "2026-01-01T00:00:00Z", comment_close: "2026-03-15T00:00:00Z", addendum_comment_close: "2028-11-15T00:00:00Z", meeting_ids: ["${mtg_h}"], code_set_capacity: 190, errata_deadline: "2028-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_h: $.data.id }
          trigger:
            - call: "POST /cpt/release-cycles/${cyc_h}/openings"
              payload: {}
              as: EditorialStaff
              captures: { cyc_h_version: $.data.version }
            - call: "POST /cpt/release-cycles/${cyc_h}/closures"
              payload: {}
              as: EditorialStaff
              captures: { cyc_h_close_version: $.data.version }
          assert:
            - "ReleaseCycle.${cyc_h}.editorial_reserved_codes == 76"
            - "ReleaseCycle.${cyc_h}.additions_pool_codes == 66"
            - "ReleaseCycle.${cyc_h}.catiii_pool_codes == 9"
            - "ReleaseCycle.${cyc_h}.discretionary_codes == 39"

      - name: code_value_nested_rounding_order_pinned
        grounds:
          - calculations.code_value_dollar_split_proration
          - entities.CodeValue.fields.component_round_total_cents
          - entities.CodeValue.fields.aggregate_round_total_cents
        distinguishing_aspect: |
          Mode (b): rounding each adjusted-RVU dollar product before summing
          yields 18174 cents while rounding the adjusted sum once yields 18173,
          so the scaffold pins the order that publishes facility_payment_cents
          through rounding_variant rather than leaving both orders valid.
        test_recipe:
          setup:
            - "One SpecialtySociety with gpci_work 1.0521, gpci_pe 1.1234 and gpci_mp 0.6980"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One CodeValue 00004 with work_rvu 2.80, facility_pe_rvu 1.90, nonfacility_pe_rvu 1.90, mp_rvu 0.24, conversion_factor 34.63"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Delta Society", specialty_code: "DEL", voting_seat_count: 1, gpci_work: 1.0521, gpci_pe: 1.1234, gpci_mp: 0.6980 }
              as: EditorialStaff
              captures: { soc_d: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-values"
              payload: { code: "00004", specialty_id: "${soc_d}", work_rvu: 2.80, facility_pe_rvu: 1.90, nonfacility_pe_rvu: 1.90, mp_rvu: 0.24, conversion_factor: 34.63, rounding_variant: "COMPONENT_ROUNDING" }
              as: LicensingOfficer
              captures: { cv_d: $.data.id }
          trigger:
            - call: "POST /cpt/code-values/${cv_d}/effective-dates"
              payload: { effective_date: "2027-01-01T00:00:00Z" }
              as: LicensingOfficer
              captures: { cv_d_version: $.data.version }
          assert:
            - "CodeValue.${cv_d}.component_round_total_cents == 18174"
            - "CodeValue.${cv_d}.aggregate_round_total_cents == 18173"
            - "CodeValue.${cv_d}.facility_payment_cents == 18174"
            - "CodeValue.${cv_d}.component_round_total_cents - CodeValue.${cv_d}.aggregate_round_total_cents == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: code_change_revision_cycle_returns_to_draft
        grounds:
          - state_machines.CodeChange.POSTED_FOR_COMMENT_to_DRAFT
          - state_machines.CodeChange.DETERMINED_to_DRAFT
          - state_machines.CodeChange.AGENDA_SET_to_DRAFT
          - state_machines.CodeChange.DRAFT_to_POSTED_FOR_COMMENT
        distinguishing_aspect: |
          The CodeChange machine is cyclic rather than a pipeline: DETERMINED
          returns to DRAFT, DRAFT returns to POSTED_FOR_COMMENT, and the same
          visibility state POSTED_FOR_COMMENT is both entered and left, so the
          reachable state set is not a linear ordering.
        test_recipe:
          setup:
            - "One ACTIVE SpecialtySociety and one ACTIVE ChangeApplicant"
            - "One EditorialPanelMeeting in SCHEDULED state and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One DRAFT CodeChange 00005 sponsored by the society and submitted into the cycle, already posted for comment"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Epsilon Society", specialty_code: "EPS", voting_seat_count: 1, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_e: $.data.id }
            - call: "POST /cpt/applicants"
              payload: { name: "Epsilon Applicant", applicant_type: "PHYSICIAN", society_id: "${soc_e}", is_entity_member: true, dues_paid_current: true, contact_email: "epsilon@example.org" }
              as: EditorialStaff
              captures: { app_e: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "AUG2026", meeting_month: "AUGUST", starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_e: $.data.id }
            - call: "POST /cpt/release-cycles"
              payload: { year: 2027, comment_open: "2026-09-01T00:00:00Z", comment_close: "2026-10-01T00:00:00Z", addendum_comment_close: "2026-11-15T00:00:00Z", meeting_ids: ["${mtg_e}"], code_set_capacity: 300, errata_deadline: "2027-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_e: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00005", change_type: "REVISION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_e}", society_id: "${soc_e}", clinical_evidence_tier: "TIER_II", evidence_sufficiency_index: 70, procedure_volume_threshold: 1200, organ_system_count: 2, descriptor_current: "Existing descriptor", descriptor_proposed: "Revised descriptor", guidelines: "Revised guideline", parenthetical_instructions: "None" }
              as: EditorialStaff
              captures: { chg_e: $.data.id, v0: $.data.version }
            - call: "POST /cpt/release-cycles/${cyc_e}/submissions"
              payload: { change_ids: ["${chg_e}"], expected_change_version: "${v0}" }
              as: EditorialStaff
              captures: { cyc_e_v1: $.data.version }
            - call: "POST /cpt/code-changes/${chg_e}/postings"
              payload: { comment_period_open_at: "2026-09-01T00:00:00Z", comment_period_close_at: "2026-10-01T00:00:00Z" }
              as: EditorialStaff
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /cpt/code-changes/${chg_e}/administrative-returns"
              payload: { reason: "Incomplete evidence packet" }
              as: EditorialStaff
              captures: { v2: $.data.version }
          assert:
            - "CodeChange.${chg_e}.review_status == DRAFT"
            - "CodeChange.${chg_e}.administrative_review_status == ADMIN_RETURNED"
            - "CodeChange.${chg_e}.posting_state == NOT_POSTED"
            - "CodeChange.${chg_e}.version > ${v1}"

      - name: editorial_meeting_parallel_dimensions_independent
        grounds:
          - state_machines.EditorialPanelMeeting.SCHEDULED_to_PUBLIC_COMMENT_OPEN
          - state_machines.EditorialPanelMeeting.PUBLIC_COMMENT_OPEN_to_SCHEDULED
          - state_machines.EditorialPanelMeeting.RECESSED_to_OPEN
          - state_machines.EditorialPanelMeeting.SET_to_ADDENDUM_OPEN
        distinguishing_aspect: |
          EditorialPanelMeeting carries two independent state axes — meeting_status
          and agenda_status — that change on separate triggers, so the meeting can
          sit in OPEN while its agenda is UNSET, and a recess-and-reopen pair on
          meeting_status leaves agenda_status untouched.
        test_recipe:
          setup:
            - "One EditorialPanelMeeting in SCHEDULED state with agenda_status UNSET and citation_mode false"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "OCT2026", meeting_month: "OCTOBER", starts_at: "2026-10-12T14:00:00Z", ends_at: "2026-10-12T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_p: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "POST /cpt/meetings/${mtg_p}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_p_v1: $.data.version }
          assert:
            - "EditorialPanelMeeting.${mtg_p}.meeting_status == OPEN"
            - "EditorialPanelMeeting.${mtg_p}.agenda_status == UNSET"

      - name: licensing_agreement_cyclic_lifecycle
        grounds:
          - state_machines.LicensingAgreement.ACTIVE_to_SUSPENDED
