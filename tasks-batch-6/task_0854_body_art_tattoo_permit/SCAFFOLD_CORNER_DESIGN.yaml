              payload: { establishment_id: "${est_a_id}", floor_plan_reference: "FP-XX", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${err} == ERR_NOT_RESOURCE_OWNER"
            - "GET /body-art/plan-reviews with establishment_id == ${est_a_id} returns total_count == 0"

      - name: artist_cannot_file_procedure_log_for_another_artist
        claim_type: peer_roles
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Artist
        distinguishing_aspect: "Artist is entity_backed:Artist, so the artist_id in a procedure-log body must equal X-User-ID; artist B logging a session under artist A's id returns ERR_NOT_RESOURCE_OWNER (403) before the artist-establishment or posture checks run."
