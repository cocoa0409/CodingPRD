              payload: { class_code: "S19IC", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
