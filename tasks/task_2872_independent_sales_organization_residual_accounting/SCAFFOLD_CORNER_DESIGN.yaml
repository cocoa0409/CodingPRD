            - "ResidualBatch.${b1}.state == RECEIVED, line_count == 0, gross_volume_cents == 0, total_normalized_net_revenue_cents == 0, iso_retained_cents == 0, posted_at == null, recall_count == 0"
            - "AgentAdvance.${adv}.state == ACTIVE, outstanding_cents == 100000, cumulative_recouped_cents == 0, months_recouped == 0, recoupment_pct == null"
            - "Agent.${a1}.advance_outstanding_cents == 100000 immediately after funding"

      - name: statement_and_adjustment_initial_states_after_first_post
