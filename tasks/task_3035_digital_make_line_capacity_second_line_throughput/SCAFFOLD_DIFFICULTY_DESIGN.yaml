              as: StoreManager
          assert:
            - "after place, Store.digital_interval_load == 3 and Ingredient.on_hand_grams == 9640"
            - "after cancel, Store.digital_interval_load == 0 (restored)"
            - "after cancel, Ingredient.on_hand_grams == 10000 (restored to the newest ACTIVE batch)"
            - "Order.${order_a}.fulfillment_status == CANCELLED and payment_status == VOIDED"
            - "forward + compensate leaves both conserved quantities unchanged"

      - name: day_close_freezes_variance_against_late_waste
        grounds:
          - calculations.theoretical_vs_actual_food_cost
          - entities.DayClose.fields.food_cost_variance_bps
        distinguishing_aspect: |
          Different conserved quantity — the FROZEN DayClose variance snapshot.
          Day close captures variance_bps; a waste event posted AFTER close must
          add to Store.actual_food_cost_cents (next day) while leaving the
          closed DayClose.food_cost_variance_bps bit-identical. The invariant is
          snapshot immutability under a later forward action, distinct from the
          capacity/gram restoration invariant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store S18, BOWL, stock, window, locked deployment."
            - "1 order driven to PICKED_UP (theoretical 396)."
            - "Waste 100g chicken (210c) before close => actual 606, variance bps computed."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S18", name: "Store Eighteen", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
              captures: { batch_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/publish"
              payload: {}
              as: StoreManager
              as_user_id: "sm-pat"
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/lock"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_a: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/start-production"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/verify-accuracy"
              payload: { line_results: [{ menu_item_id: "${item_bowl}", matched: true }] }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/mark-ready"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/waste-events"
              payload: { ingredient_batch_id: "${batch_id}", grams: 100, reason: "OVERPRODUCTION" }
              as: LineWorker
              as_user_id: "lw-1"
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:31:00Z" }
              as: PlatformAdmin
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { store_v_pre_close: $.data.version }
            - call: "POST /api/v1/stores/${store_id}/day-close"
              payload: { expected_store_version: "${store_v_pre_close}" }
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { close_id: $.data.id, frozen_bps: $.data.food_cost_variance_bps }
            - call: "POST /api/v1/stores/${store_id}/waste-events"
              payload: { ingredient_batch_id: "${batch_id}", grams: 50, reason: "CONTAMINATION" }
              as: LineWorker
              as_user_id: "lw-1"
          assert:
            - "DayClose.${close_id}.food_cost_variance_bps == frozen value captured at close (round_half_up(10000*(606-396)/396) = 5303)"
            - "after the post-close 50g waste, Store.actual_food_cost_cents increases by 105 (50*2.1)"
            - "DayClose.${close_id}.food_cost_variance_bps is UNCHANGED (snapshot conserved)"
            - "Store.${store_id}.food_cost_variance_bps (live) now differs from the frozen DayClose value"
