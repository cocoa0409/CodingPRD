          Boundary metric #1 — a numeric threshold crossing on utilization_pct at the configure
          endpoint. total_load_lb 73500 against net_capacity_lb 98000 rounds to exactly 75.00,
          which is CRITICAL because the ladder uses `>=`; a 72990 lb load rounds to 74.99 and
          stays STANDARD.
