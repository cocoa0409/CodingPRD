        distinguishing_aspect: "A record submission carrying expected_vehicle_version one behind the vehicle's current version fails 412; the correct version succeeds and bumps the vehicle version again."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle V exists at version 1 (one inspection record)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 100, payload_ref: "i1", idempotency_key: "k-i1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id, vv: $.data.version }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 3, payload_ref: "a1", idempotency_key: "k-a1", expected_vehicle_version: "${vv}" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { vv2: $.data.version }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 4, payload_ref: "a2", idempotency_key: "k-a2", expected_vehicle_version: "${vv}" }
              as: SourceOperator
              as_user_id: "${src}"
          assert:
            - "First submission with current version succeeds; vv2 == vv + 1"
            - "Second submission replaying the stale version -> HTTP 412 ERR_STALE_VERSION"

