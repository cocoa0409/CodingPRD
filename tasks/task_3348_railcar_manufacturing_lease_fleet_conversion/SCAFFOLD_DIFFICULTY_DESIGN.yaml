      - 'Hop 2 (caused by hop 1): GET /api/v1/lease-fleet-cars?production_order_id=${order_id} returns
        exactly 2 LeaseFleetCars, each status == HELD with production_order_id == ${order_id} and acquisition_cost_cents
        == 660000 (the committed order_price_quote: ceil((1*180000+25000)/100)*100 + ceil((1*250000+25000)/100)*100
        + 4*45000 = 205000 + 275000 + 180000, zero change fee)'
      - 'Hop 3 (caused by hop 2): LeaseContract ${contract_id}.capital_allocation_cents == 1320000, re-derived
