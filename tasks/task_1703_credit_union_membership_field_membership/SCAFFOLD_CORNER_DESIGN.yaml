            - "err_past == ERR_INVALID_TRANSACTION_DATE (422) (before opened_date 2026-08-01)"

      - name: withdrawal_insufficient_funds_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INSUFFICIENT_FUNDS]"]
        distinguishing_aspect: "SUPPLEMENTAL floor is exactly 0: withdrawing the full 50,000 succeeds; 50,001 fails."
        test_recipe:
          setup: ["member with SUPPLEMENTAL 50,000 opened 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
