scenario: |
  Research Model Production & Welfare Oversight (Charles River Laboratories): breeding colony management with genetic monitoring, health status barriers and production planning against customer order patterns, health status categorization with defined exclusion lists and diagnostic surveillance testing, customer order fulfillment with age and weight specifications, sex ratios and delivery date requirements, transportation logistics maintaining barrier status with dedicated vehicles and receiving protocols, institutional animal care oversight with protocol review, veterinary care and welfare inspection at production and customer sites, custom model generation and cryopreservation services with intellectual property terms, capacity constraints for specialized and immunocompromised models, regulatory registration and inspection compliance

domain_name: "research-model-production-welfare"
api_prefix: "/api"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_intent: |
    Beyond-expert density: thirteen entities coupled through health-status barrier
    cascades, protocol-quota accounting, cage-capacity aggregation, OCC-guarded
    allocation/shipment writes on CustomerOrder.version, a logical-clock sweep that
    expires protocols, ages genetic-monitoring panels, and escalates overdue
    corrective actions into facility suspensions, and dual-variant calculations on
    two different entity domains (colony production forecast vs customer credit).

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
# Barrier health-status levels are an ordered rank used across Room, Cohort,
# Shipment and Order: CONVENTIONAL(1) < MPF(2) < VF(3) < GERM_FREE(4).
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the production site."
      - name: site_code
        type: string
        source: input
        description: "Short unique site identifier."
        constraints: "unique across all facilities"
      - name: registration_number
        type: string
        source: input
        description: "Regulatory registration number issued by the oversight authority (e.g. USDA/OLAW)."
      - name: registration_status
        type: enum
        source: system
        description: "Regulatory registration lifecycle state."
        default: REGISTERED
        constraints: "one of REGISTERED, UNDER_INSPECTION, SUSPENDED, REVOKED"
      - name: registration_expires_at
        type: datetime
        source: input
        description: "ISO8601 instant when the current registration lapses; transitions to REGISTERED require this to be strictly in the future."
      - name: suspension_reason
        type: string
        source: system
        description: "Set when registration_status flips to SUSPENDED (manual or overdue-corrective-action cascade); null otherwise."
        default: null

  - name: BarrierRoom
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; housing site of this barrier room."
      - name: room_code
        type: string
        source: input
        description: "Room identifier, unique within its facility."
        constraints: "unique per facility_id"
      - name: barrier_level
        type: enum
        source: input
        description: "Health-status category of the barrier; ordered rank CONVENTIONAL(1) < MPF(2) < VF(3) < GERM_FREE(4). Downgraded one step by an excluded-agent positive health screen; never upgraded."
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: excluded_agents
        type: array
        source: input
        description: "Defined exclusion list of infectious agents (strings) that MUST NOT be present at this barrier level; a positive result for any listed agent flips a health screen to RESULTED_POSITIVE."
        constraints: "non-empty array of agent name strings"
      - name: cage_capacity
        type: integer
        source: input
        description: "Total cage slots in the room; occupancy is computed by room_occupied_cages and must never exceed this."
        constraints: ">= 1"
      - name: occupied_cages
        type: integer
        source: computed
        description: "Derived by calculation room_occupied_cages: sum of breeding-pair cages plus per-cohort ceiling of headcount / CAGE_DENSITY."
      - name: status
        type: enum
        source: system
        description: "Operational state of the room."
        default: ACTIVE
        constraints: "one of ACTIVE, QUARANTINED, DECOMMISSIONED"
      - name: quarantined_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the room entered QUARANTINED; a lift requires a RESULTED_NEGATIVE screen resulted strictly after this instant."
        default: null

  - name: ModelStrain
    parent: null
    common_fields: false
    fields:
      - name: strain_code
        type: string
        source: input
        description: "Unique catalog code of the research model strain."
        constraints: "unique across all strains"
      - name: species
        type: enum
        source: input
        description: "Species of the model."
        constraints: "one of MOUSE, RAT"
      - name: immune_class
        type: enum
        source: input
        description: "IMMUNOCOMPROMISED strains carry a pricing surcharge and a single-strain-per-room housing constraint."
        constraints: "one of IMMUNOCOMPETENT, IMMUNOCOMPROMISED"
      - name: breeding_type
        type: enum
        source: input
        description: "Breeding scheme of the colony."
        constraints: "one of INBRED, OUTBRED, HYBRID"
      - name: min_barrier_level
        type: enum
        source: input
        description: "Minimum barrier_level rank of any BarrierRoom allowed to house this strain."
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: gestation_days
        type: integer
        source: input
        description: "Gestation length in days; used by production planning feasibility."
        constraints: "> 0"
      - name: wean_age_days
        type: integer
        source: input
        description: "Age at weaning in days; used by production planning feasibility."
        constraints: "> 0"
      - name: typical_litter_size
        type: integer
        source: input
        description: "Expected pups per breeding pair per litter; input to colony_availability_forecast."
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "List price per animal in cents; input to order_quote."
        constraints: ">= 0"

  - name: Colony
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK -> BarrierRoom.id; room housing the breeding colony."
      - name: strain_id
        type: string
        source: input
        description: "FK -> ModelStrain.id; strain under production."
      - name: protocol_id
        type: string
        source: input
        description: "FK -> IACUCProtocol.id; approved animal-care protocol authorizing this colony."
      - name: breeding_pair_count
        type: integer
        source: input
        description: "Number of active breeding pairs; consumes 1 cage per pair and 2 protocol animals per pair at creation."
        constraints: ">= 1"
      - name: generation_number
        type: integer
        source: input
        description: "Filial generation of the breeding stock, for genetic monitoring traceability."
        default: 0
        constraints: ">= 0"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Production lifecycle dimension (FOUNDING -> EXPANDING -> PRODUCTION -> PHASING_OUT -> RETIRED, with a PHASING_OUT -> PRODUCTION reactivation revert)."
        default: FOUNDING
        constraints: "one of FOUNDING, EXPANDING, PRODUCTION, PHASING_OUT, RETIRED"
      - name: genetic_status
        type: enum
        source: system
        description: "Genetic-monitoring dimension, independent of lifecycle_status. CLEAR -> PANEL_DUE on clock sweep past the SNP interval; PANEL_DUE -> CLEAR or DRIFT_DETECTED via SNP panel result."
        default: CLEAR
        constraints: "one of CLEAR, PANEL_DUE, DRIFT_DETECTED"
      - name: last_snp_panel_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the latest recorded SNP panel; initialized to the colony creation timestamp."
      - name: snp_panel_interval_weeks
        type: integer
        source: input
        description: "Weeks allowed between SNP panels before genetic_status flips CLEAR -> PANEL_DUE on the clock sweep."
        default: 12
        constraints: ">= 1"
      - name: confirmed_available_count
        type: integer
        source: computed
        description: "CONFIRMED_ONLY variant output of colony_availability_forecast: free headcount across cohorts in HOLD or PARTIALLY_ALLOCATED."
      - name: projected_pipeline_count
        type: integer
        source: computed
        description: "PROJECTED variant output of colony_availability_forecast: confirmed_available_count plus expected next-litter yield when in PRODUCTION and not DRIFT_DETECTED."

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: colony_id
        type: string
        source: input
        description: "FK -> Colony.id; producing colony."
      - name: birth_date
        type: datetime
        source: input
        description: "ISO8601 birth instant of the cohort; must be <= current logical clock. Basis of cohort_age_weeks."
      - name: count_male
        type: integer
        source: input
        description: "Live male headcount; supplied at creation, then decremented by cull transitions and by allocation consumption at shipment departure."
        constraints: ">= 0"
      - name: count_female
        type: integer
        source: input
        description: "Live female headcount; supplied at creation, same mutation rules as count_male."
        constraints: ">= 0"
      - name: initial_count_total
        type: integer
        source: system
        description: "Immutable snapshot count_male + count_female taken at creation; the monotonic protocol_animals_used accumulator reads this, never the live counts."
      - name: reserved_male
        type: integer
        source: system
        description: "Sum of qty_male over this cohort's allocations in RESERVED status. available_male = count_male - reserved_male."
        default: 0
      - name: reserved_female
        type: integer
        source: system
        description: "Sum of qty_female over this cohort's allocations in RESERVED status."
        default: 0
      - name: avg_weight_g_male
        type: number
        source: input
        description: "Average male weight in grams; drives order weight-window eligibility and shipment boxing tier."
        constraints: "> 0"
      - name: avg_weight_g_female
        type: number
        source: input
        description: "Average female weight in grams; same usage as avg_weight_g_male."
        constraints: "> 0"
      - name: health_status
        type: enum
        source: system
        description: "Barrier-level rank of the cohort; initialized to the room's barrier_level at creation, downgraded by the positive-screen cascade, never upgraded."
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: status
        type: enum
        source: system
        description: "Cohort lifecycle."
        default: WEANED
        constraints: "one of WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED, SHIPPED, CULLED"
      - name: age_weeks
        type: integer
        source: computed
        description: "floor((as_of - birth_date)/7 days) per calculation cohort_age_weeks; as_of is the logical clock on reads and the order's required_delivery_date during allocation eligibility."

  - name: HealthScreen
    parent: null
    common_fields: false
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK -> BarrierRoom.id; room under diagnostic surveillance."
      - name: panel_type
        type: enum
        source: input
        description: "Surveillance panel context."
        constraints: "one of QUARTERLY_SENTINEL, OUTBREAK_DIAGNOSTIC, PRE_SHIPMENT"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Planned sampling instant (logical clock)."
      - name: status
        type: enum
        source: system
        description: "RESULTED_POSITIVE iff at least one result entry is positive AND its agent is on the room's excluded_agents list; otherwise RESULTED_NEGATIVE."
        default: SCHEDULED
        constraints: "one of SCHEDULED, RESULTED_NEGATIVE, RESULTED_POSITIVE"
      - name: results
        type: array
        source: input
        description: "Array of {agent: string, positive: boolean} recorded by the result endpoint."
        default: []
      - name: resulted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when results were recorded."
        default: null

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: institution_name
        type: string
        source: input
        description: "Research institution name."
      - name: account_number
        type: string
        source: input
        description: "Unique billing account number."
        constraints: "unique across all customers"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum allowed GROSS credit exposure in cents; the sourcing credit check rejects when exposure would strictly exceed this."
        constraints: ">= 0"
      - name: account_status
        type: enum
        source: system
        description: "CREDIT_HOLD and SUSPENDED block new order submission; SUSPENDED is also reached by the overdue customer-site inspection cascade."
        default: ACTIVE
        constraints: "one of ACTIVE, CREDIT_HOLD, SUSPENDED"
      - name: accepted_min_health_status
        type: enum
        source: input
        description: "Minimum health-status rank the institution's receiving barrier accepts; informational default for its orders."
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: is_commercial
        type: boolean
        source: input
        description: "Commercial (vs academic) flag; CUSTOMER_EXCLUSIVE IP terms on a ServiceContract require is_commercial == true."
        default: false
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "NET_BILLED variant of customer_credit_positions: quoted_total_cents summed over orders in DELIVERED only."
        default: 0
      - name: credit_exposure_cents
        type: integer
        source: computed
        description: "GROSS variant of customer_credit_positions: quoted_total_cents summed over orders in {SOURCING, ALLOCATED, SCHEDULED, SHIPPED, DELIVERED}."
        default: 0

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; taken from the X-User-ID header of the placing Customer role, never from the request body."
      - name: strain_id
        type: string
        source: input
        description: "FK -> ModelStrain.id; requested strain."
      - name: quantity_male
        type: integer
        source: input
        description: "Males requested. quantity_male + quantity_female must be >= 1 (sex-ratio requirement is expressed as exact per-sex counts)."
        constraints: ">= 0"
      - name: quantity_female
        type: integer
        source: input
        description: "Females requested."
        constraints: ">= 0"
      - name: min_age_weeks
        type: integer
        source: input
        description: "Inclusive lower bound of the accepted age window, in whole weeks at required_delivery_date."
        constraints: ">= 0 and <= max_age_weeks"
      - name: max_age_weeks
        type: integer
        source: input
        description: "Inclusive upper bound of the accepted age window."
        constraints: ">= min_age_weeks"
      - name: min_weight_g
        type: number
        source: input
        description: "Inclusive lower bound of the accepted average-weight window in grams."
        constraints: "> 0 and < max_weight_g"
      - name: max_weight_g
        type: number
        source: input
        description: "Exclusive-feel upper bound implemented as inclusive: avg weight must satisfy min_weight_g <= avg <= max_weight_g."
        constraints: "> min_weight_g"
      - name: required_delivery_date
        type: datetime
        source: input
        description: "Customer-required delivery instant; must be at least MIN_ORDER_LEAD_DAYS after the current logical clock at submission."
      - name: min_health_status
        type: enum
        source: input
        description: "Minimum acceptable barrier-level rank for supplied cohorts and for the transport vehicle's certification."
        default: MPF
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle including the SOURCING <-> BACKORDERED supply loop."
        default: SUBMITTED
        constraints: "one of SUBMITTED, SOURCING, BACKORDERED, ALLOCATED, SCHEDULED, SHIPPED, DELIVERED, CLOSED, CANCELLED, REJECTED"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Price locked by calculation order_quote when the order enters SOURCING; null until then."
        default: null
      - name: allocated_male
        type: integer
        source: computed
        description: "Sum of qty_male over this order's allocations in RESERVED status."
        default: 0
      - name: allocated_female
        type: integer
        source: computed
        description: "Sum of qty_female over this order's allocations in RESERVED status."
        default: 0

  - name: Allocation
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; order being supplied."
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; source cohort."
      - name: qty_male
        type: integer
        source: input
        description: "Males reserved from the cohort for the order."
        constraints: ">= 0"
      - name: qty_female
        type: integer
        source: input
        description: "Females reserved from the cohort for the order."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "RESERVED on creation; RELEASED by explicit release, order cancel, or the barrier-downgrade cascade; CONSUMED when the shipment departs."
        default: RESERVED
        constraints: "one of RESERVED, RELEASED, CONSUMED"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; exactly one non-CANCELLED shipment per order."
      - name: vehicle_code
        type: string
        source: input
        description: "Identifier of the dedicated barrier-certified transport vehicle; transit windows on the same vehicle_code must not overlap."
      - name: vehicle_barrier_cert
        type: enum
        source: input
        description: "Barrier-level rank the vehicle is certified to maintain; must be >= order.min_health_status rank."
        constraints: "one of CONVENTIONAL, MPF, VF, GERM_FREE"
      - name: sanitized_at
        type: datetime
        source: input
        description: "Vehicle sanitization timestamp; must be within 72h before departure_date and >= the latest planned_arrival_date of any prior non-CANCELLED shipment on the same vehicle_code."
      - name: departure_date
        type: datetime
        source: input
        description: "Planned departure; must be >= current logical clock."
      - name: planned_arrival_date
        type: datetime
        source: input
        description: "Planned arrival; must satisfy planned_arrival_date - departure_date <= MAX_TRANSIT_HOURS and planned_arrival_date <= order.required_delivery_date."
      - name: actual_arrival_at
        type: datetime
        source: system
        description: "Recorded when the shipment reaches ARRIVED."
        default: null
      - name: box_count
        type: integer
        source: computed
        description: "Derived by calculation shipment_box_count: per (allocation, sex) ceiling of animals per weight-tier box, summed."
      - name: received_male
        type: integer
        source: input
        description: "Male count declared by the customer at receipt acceptance; required only on the ACCEPTED transition."
        default: null
      - name: received_female
        type: integer
        source: input
        description: "Female count declared at receipt acceptance."
        default: null
      - name: status
        type: enum
        source: system
        description: "Transport lifecycle with receiving-protocol fork at ARRIVED."
        default: PLANNED
        constraints: "one of PLANNED, LOADED, IN_TRANSIT, ARRIVED, ACCEPTED, REJECTED_AT_RECEIPT, CANCELLED"

  - name: IACUCProtocol
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; site where the protocol's animal work occurs."
      - name: protocol_number
        type: string
        source: input
        description: "Unique protocol identifier."
        constraints: "unique across all protocols"
      - name: pi_name
        type: string
        source: input
        description: "Principal investigator responsible for the protocol."
      - name: species
        type: enum
        source: input
        description: "Species covered."
        constraints: "one of MOUSE, RAT"
      - name: approved_animal_quota
        type: integer
        source: input
        description: "Maximum cumulative animals_usable under this protocol; protocol_animals_used must remain <= this (equality allowed)."
        constraints: ">= 1"
      - name: animals_used
        type: integer
        source: computed
        description: "Monotonic accumulator per calculation protocol_animals_used: +2 x breeding_pair_count at colony creation, + cohort initial_count_total at cohort creation. Culls, releases, and shipments never refund it."
        default: 0
      - name: effective_date
        type: datetime
        source: input
        description: "Start of the protocol's approval validity."
      - name: expiration_date
        type: datetime
        source: input
        description: "End of approval validity; the clock sweep flips APPROVED -> EXPIRED once the logical clock passes this."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID recorded on the DRAFT -> SUBMITTED transition; the same user may not later approve or reject it (segregation of duties)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Review lifecycle with the UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED resubmission loop."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, SUSPENDED, EXPIRED, WITHDRAWN, REJECTED"

  - name: WelfareInspection
    parent: null
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; production site under inspection. Exactly one of facility_id / customer_id must be set."
        default: null
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; customer site under inspection. Exactly one of facility_id / customer_id must be set."
        default: null
      - name: inspection_type
        type: enum
        source: input
        description: "Inspection context."
        constraints: "one of ROUTINE, FOR_CAUSE, PRE_PLACEMENT"
      - name: scheduled_date
        type: datetime
        source: input
        description: "Planned inspection day; at most one open inspection per site per calendar day (UTC)."
      - name: findings
        type: array
        source: input
        description: "Array of {deficiency: string, severity: MINOR | SIGNIFICANT} recorded by the report endpoint; empty array closes the inspection immediately."
        default: []
      - name: corrective_deadline
        type: datetime
        source: input
        description: "Required when any finding is SIGNIFICANT; the clock sweep escalates CORRECTIVE_ACTION inspections past this instant."
        default: null
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the inspector who filed the report; the same user may not verify corrective closure (segregation of duties)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle; the report endpoint lands directly in CORRECTIVE_ACTION (findings present) or CLOSED_VERIFIED (no findings)."
        default: SCHEDULED
        constraints: "one of SCHEDULED, CORRECTIVE_ACTION, CLOSED_VERIFIED, ESCALATED"

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; contracting customer."
      - name: contract_type
        type: enum
        source: input
        description: "CUSTOM_GENERATION creates a new ModelStrain at COMPLETED; CRYOPRESERVATION banks germplasm and scores viability."
        constraints: "one of CUSTOM_GENERATION, CRYOPRESERVATION"
      - name: source_strain_id
        type: string
        source: input
        description: "FK -> ModelStrain.id; background strain the custom model derives from (CUSTOM_GENERATION) or the strain being banked (CRYOPRESERVATION)."
      - name: new_strain_spec
        type: object
        source: input
        description: "Required for CUSTOM_GENERATION: {strain_code, species, immune_class, breeding_type, min_barrier_level, gestation_days, wean_age_days, typical_litter_size, base_price_cents} used to create the ModelStrain at COMPLETED. Forbidden for CRYOPRESERVATION."
        default: null
      - name: ip_ownership
        type: enum
        source: input
        description: "Intellectual-property terms: CUSTOMER_EXCLUSIVE requires is_commercial customer and exclusivity_fee_cents >= 1 and forbids royalty_rate_pct; VENDOR_RETAINED or SHARED require royalty_rate_pct in (0, 100]."
        constraints: "one of CUSTOMER_EXCLUSIVE, SHARED, VENDOR_RETAINED"
      - name: exclusivity_fee_cents
        type: integer
        source: input
        description: "One-time fee; required >= 1 iff ip_ownership == CUSTOMER_EXCLUSIVE."
        default: null
      - name: royalty_rate_pct
        type: number
        source: input
        description: "Royalty on downstream sales; required in (0, 100] iff ip_ownership in {SHARED, VENDOR_RETAINED}, must be absent or 0 for CUSTOMER_EXCLUSIVE."
        default: null
      - name: straw_count
        type: integer
        source: input
        description: "Cryopreserved straws banked; required >= 1 for CRYOPRESERVATION, forbidden for CUSTOM_GENERATION."
        default: null
      - name: viability_pct
        type: number
        source: input
        description: "Post-thaw viability recorded at the VALIDATION -> COMPLETED transition of a CRYOPRESERVATION contract; < 70 routes to VALIDATION_FAILED instead."
        default: null
      - name: generated_strain_id
        type: string
        source: system
        description: "FK -> ModelStrain.id of the strain created when a CUSTOM_GENERATION contract completes; null until then."
        default: null
      - name: milestone_status
        type: enum
        source: system
        description: "Contract milestone lifecycle."
        default: DRAFT
        constraints: "one of DRAFT, EXECUTED, IN_PROGRESS, VALIDATION, VALIDATION_FAILED, COMPLETED, CLOSED, CANCELLED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: REGISTERED
    terminal_states: [REVOKED]
    transitions:
      - from: REGISTERED
        to: UNDER_INSPECTION
        trigger: "POST /api/facilities/{id}/transition with target_state=UNDER_INSPECTION"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_INSPECTION
        to: REGISTERED
        trigger: "POST /api/facilities/{id}/transition with target_state=REGISTERED"
        actor: PlatformAdmin
        preconditions:
          - "payload registration_expires_at is strictly after the current logical clock"
        side_effects:
          - "sets registration_expires_at from payload; increments Facility.version"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /api/facilities/{id}/transition with target_state=SUSPENDED, or system cascade from a WelfareInspection escalation at this facility"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "sets suspension_reason (payload reason on manual trigger, 'OVERDUE_CORRECTIVE_ACTION' on cascade)"
          - "cancels every Shipment in {PLANNED, LOADED} whose order draws any allocation from a cohort housed in this facility's rooms"
          - "each such cancelled shipment's order transitions SCHEDULED -> ALLOCATED (allocations stay RESERVED)"
          - "increments Facility.version"
      - from: UNDER_INSPECTION
        to: SUSPENDED
        trigger: "system cascade from a WelfareInspection escalation at this facility"
        actor: system
        preconditions: []
        side_effects:
          - "identical cascade as REGISTERED -> SUSPENDED"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /api/facilities/{id}/transition with target_state=REGISTERED"
        actor: PlatformAdmin
        preconditions:
          - "no WelfareInspection with facility_id == this facility is in ESCALATED"
          - "payload registration_expires_at is strictly after the current logical clock"
        side_effects:
          - "sets registration_expires_at from payload; clears suspension_reason; increments Facility.version"
      - from: UNDER_INSPECTION
        to: REVOKED
        trigger: "POST /api/facilities/{id}/transition with target_state=REVOKED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "same shipment-cancellation cascade as the SUSPENDED transition"

  - entity: BarrierRoom
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system cascade from a HealthScreen flipping to RESULTED_POSITIVE, or POST /api/rooms/{id}/transition with target_state=QUARANTINED"
        actor: Veterinarian | system
        preconditions: []
        side_effects:
          - "sets quarantined_at to the current logical clock; increments BarrierRoom.version"
          - "ONLY on the HealthScreen cascade trigger: downgrades barrier_level one rank (GERM_FREE->VF->MPF->CONVENTIONAL; CONVENTIONAL unchanged) and fires the cohort/allocation downgrade chain documented on the HealthScreen RESULTED_POSITIVE transition"
          - "manual quarantine does NOT change barrier_level"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /api/rooms/{id}/transition with target_state=ACTIVE"
        actor: Veterinarian
        preconditions:
          - "a HealthScreen exists with room_id == this room, status == RESULTED_NEGATIVE, and resulted_at strictly after quarantined_at"
        side_effects:
          - "clears quarantined_at; increments BarrierRoom.version"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /api/rooms/{id}/transition with target_state=DECOMMISSIONED"
        actor: FacilityManager
        preconditions:
          - "no Colony with room_id == this room has lifecycle_status != RETIRED"
          - "no Cohort of those colonies has status in {WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}"
        side_effects:
          - "increments BarrierRoom.version"

  - entity: Colony
    initial_state: FOUNDING
    terminal_states: [RETIRED]
    note: "Lifecycle dimension (lifecycle_status). Genetic dimension (genetic_status) is a separate, independent state dimension on the same entity — see the second Colony machine."
    transitions:
      - from: FOUNDING
        to: EXPANDING
        trigger: "POST /api/colonies/{id}/transition with target_state=EXPANDING"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments Colony.version"
      - from: EXPANDING
        to: PRODUCTION
        trigger: "POST /api/colonies/{id}/transition with target_state=PRODUCTION"
        actor: FacilityManager
        preconditions:
          - "at least one Cohort of this colony has status in {WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}"
        side_effects:
          - "increments Colony.version"
      - from: PRODUCTION
        to: PHASING_OUT
        trigger: "POST /api/colonies/{id}/transition with target_state=PHASING_OUT"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments Colony.version"
      - from: PHASING_OUT
        to: PRODUCTION
        trigger: "POST /api/colonies/{id}/transition with target_state=PRODUCTION (reactivation revert)"
        actor: FacilityManager
        preconditions:
          - "genetic_status != DRIFT_DETECTED"
        side_effects:
          - "increments Colony.version"
      - from: PHASING_OUT
        to: RETIRED
        trigger: "POST /api/colonies/{id}/transition with target_state=RETIRED"
        actor: FacilityManager
        preconditions:
          - "no Cohort of this colony has status in {WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}"
          - "no Allocation in RESERVED exists on any cohort of this colony"
        side_effects:
          - "increments Colony.version; room_occupied_cages drops this colony's breeding pairs"

  - entity: Colony
    initial_state: CLEAR
    terminal_states: [DRIFT_DETECTED]
    note: "Genetic-monitoring dimension (genetic_status), evolving independently of lifecycle_status; both dimensions gate different operations."
    transitions:
      - from: CLEAR
        to: PANEL_DUE
        trigger: "system clock sweep: logical clock passes last_snp_panel_at + snp_panel_interval_weeks"
        actor: system
        preconditions: []
        side_effects:
          - "increments Colony.version"
      - from: CLEAR
        to: DRIFT_DETECTED
        trigger: "POST /api/colonies/{id}/snp-panel with result=DRIFT_DETECTED"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "sets last_snp_panel_at to the current logical clock"
          - "lifecycle_status transitions EXPANDING|PRODUCTION -> PHASING_OUT when in one of those states"
          - "increments Colony.version"
      - from: PANEL_DUE
        to: CLEAR
        trigger: "POST /api/colonies/{id}/snp-panel with result=CLEAR"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "sets last_snp_panel_at to the current logical clock; increments Colony.version"
      - from: PANEL_DUE
        to: DRIFT_DETECTED
        trigger: "POST /api/colonies/{id}/snp-panel with result=DRIFT_DETECTED"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "sets last_snp_panel_at to the current logical clock"
          - "lifecycle_status transitions EXPANDING|PRODUCTION -> PHASING_OUT when in one of those states"
          - "increments Colony.version"

  - entity: Cohort
    initial_state: WEANED
    terminal_states: [SHIPPED, CULLED]
    transitions:
      - from: WEANED
        to: HOLD
        trigger: "POST /api/cohorts/{id}/transition with target_state=HOLD"
        actor: FacilityManager
        preconditions:
          - "colony.lifecycle_status in {EXPANDING, PRODUCTION}"
          - "colony.genetic_status == CLEAR"
        side_effects:
          - "increments Cohort.version"
      - from: HOLD
        to: PARTIALLY_ALLOCATED
        trigger: "system: first allocation creation against this cohort"
        actor: system
        preconditions: []
        side_effects:
          - "increments Cohort.version"
      - from: PARTIALLY_ALLOCATED
        to: FULLY_ALLOCATED
        trigger: "system: allocation leaves available_male == 0 and available_female == 0 with at least one RESERVED allocation"
        actor: system
        preconditions: []
        side_effects:
          - "increments Cohort.version"
      - from: FULLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system: an allocation release reopens availability"
        actor: system
        preconditions: []
        side_effects:
          - "increments Cohort.version"
      - from: PARTIALLY_ALLOCATED
        to: HOLD
        trigger: "system: the last RESERVED allocation is released (compensation revert)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Cohort.version"
      - from: WEANED
        to: CULLED
        trigger: "POST /api/cohorts/{id}/transition with target_state=CULLED and cull counts equal to current counts"
        actor: Veterinarian
        preconditions:
          - "no Allocation in RESERVED exists on this cohort"
          - "cull_male == count_male and cull_female == count_female"
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; protocol animals_used NOT refunded; increments Cohort.version"
      - from: HOLD
        to: CULLED
        trigger: "POST /api/cohorts/{id}/transition with target_state=CULLED and cull counts equal to current counts"
        actor: Veterinarian
        preconditions:
          - "no Allocation in RESERVED exists on this cohort"
          - "cull_male == count_male and cull_female == count_female"
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; increments Cohort.version"
      - from: PARTIALLY_ALLOCATED
        to: CULLED
        trigger: "POST /api/cohorts/{id}/transition with target_state=CULLED and cull counts equal to current counts"
        actor: Veterinarian
        preconditions:
          - "no Allocation in RESERVED exists on this cohort"
          - "cull_male == count_male and cull_female == count_female"
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; increments Cohort.version"
      - from: FULLY_ALLOCATED
        to: SHIPPED
        trigger: "system: shipment departure consumes allocations and remaining live counts reach 0"
        actor: system
        preconditions: []
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; increments Cohort.version"
      - from: PARTIALLY_ALLOCATED
        to: SHIPPED
        trigger: "system: shipment departure consumes allocations and remaining live counts reach 0"
        actor: system
        preconditions: []
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; increments Cohort.version"
      - from: HOLD
        to: SHIPPED
        trigger: "system: shipment departure consumes allocations and remaining live counts reach 0"
        actor: system
        preconditions: []
        side_effects:
          - "count_male and count_female become 0; room_occupied_cages recomputed; increments Cohort.version"
    post_consumption_recompute: |
      After any shipment departure, for every cohort touched: decrement
      count_male/count_female by the consumed quantities; then if both counts are
      0 the cohort is SHIPPED; else if available_male == 0 and available_female ==
      0 and reserved > 0 it is FULLY_ALLOCATED; else if any RESERVED allocation
      remains it is PARTIALLY_ALLOCATED; otherwise it returns to HOLD.

  - entity: HealthScreen
    initial_state: SCHEDULED
    terminal_states: [RESULTED_NEGATIVE, RESULTED_POSITIVE]
    transitions:
      - from: SCHEDULED
        to: RESULTED_NEGATIVE
        trigger: "POST /api/health-screens/{id}/result where no positive entry names an agent on the room's excluded_agents list"
        actor: Veterinarian
        preconditions:
          - "room.status != DECOMMISSIONED"
        side_effects:
          - "sets results and resulted_at"
      - from: SCHEDULED
        to: RESULTED_POSITIVE
        trigger: "POST /api/health-screens/{id}/result where at least one positive entry names an agent on the room's excluded_agents list"
        actor: Veterinarian
        preconditions:
          - "room.status != DECOMMISSIONED"
        side_effects:
          - "sets results and resulted_at"
          - "cascade hop 1: BarrierRoom -> QUARANTINED with quarantined_at = now, and barrier_level downgraded exactly one rank (GERM_FREE->VF, VF->MPF, MPF->CONVENTIONAL, CONVENTIONAL unchanged)"
          - "cascade hop 2: every Cohort of every colony in that room whose health_status rank exceeds the new room rank is downgraded to the new room barrier_level"
          - "cascade hop 3: every Allocation in RESERVED on a downgraded cohort whose order's min_health_status rank exceeds the cohort's new health_status rank transitions to RELEASED; cohort reserved_male/reserved_female and order allocated_male/allocated_female are decremented"
          - "cascade hop 4: for each affected order, if allocated totals now fall short of requested quantities: an order in {ALLOCATED} goes to SOURCING; an order in {SCHEDULED} first has its PLANNED|LOADED shipment CANCELLED and then goes to SOURCING; orders in {SOURCING, BACKORDERED} remain; orders in {SHIPPED, DELIVERED, CLOSED} are untouched (their allocations are already CONSUMED)"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /api/customers/{id}/transition with target_state=CREDIT_HOLD"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments Customer.version"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /api/customers/{id}/transition with target_state=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments Customer.version"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/transition with target_state=SUSPENDED, or system cascade from an ESCALATED customer-site WelfareInspection"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "increments Customer.version"
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/transition with target_state=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments Customer.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{id}/transition with target_state=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "no WelfareInspection with customer_id == this customer is in ESCALATED"
        side_effects:
          - "increments Customer.version"

  - entity: CustomerOrder
    initial_state: SUBMITTED
    terminal_states: [CLOSED, CANCELLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SOURCING
        trigger: "POST /api/orders/{id}/transition with target_state=SOURCING"
        actor: FacilityManager
        preconditions:
          - "customer.account_status == ACTIVE"
          - "credit check: customer credit_exposure_cents + order_quote(this order) <= customer.credit_limit_cents (equality passes)"
          - "feasibility: PROJECTED availability (calculation colony_availability_forecast) summed over eligible colonies of the strain >= quantity_male + quantity_female; eligible colonies are those whose room is ACTIVE, whose room's facility registration_status == REGISTERED, whose genetic_status != DRIFT_DETECTED, and whose room barrier_level rank >= order.min_health_status rank"
        side_effects:
          - "computes and stores quoted_total_cents via order_quote"
          - "customer.credit_exposure_cents increases by quoted_total_cents (GROSS variant)"
          - "increments CustomerOrder.version"
      - from: SUBMITTED
        to: BACKORDERED
        trigger: "POST /api/orders/{id}/transition with target_state=BACKORDERED"
        actor: FacilityManager
        preconditions:
          - "customer.account_status == ACTIVE"
        side_effects:
          - "computes and stores quoted_total_cents via order_quote"
          - "customer.credit_exposure_cents increases by quoted_total_cents"
          - "increments CustomerOrder.version"
      - from: SOURCING
        to: BACKORDERED
        trigger: "POST /api/orders/{id}/transition with target_state=BACKORDERED (supply loop back-edge)"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "RESERVED allocations are kept; increments CustomerOrder.version"
      - from: BACKORDERED
        to: SOURCING
        trigger: "POST /api/orders/{id}/transition with target_state=SOURCING (retry sourcing after supply arrives)"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/orders/{id}/transition with target_state=REJECTED"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "increments CustomerOrder.version"
      - from: SOURCING
        to: CANCELLED
        trigger: "POST /api/orders/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "releases all RESERVED allocations (cohort reserved counts decremented; cohort status recomputed)"
          - "customer.credit_exposure_cents decreases by quoted_total_cents (compensation)"
          - "increments CustomerOrder.version"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "releases all RESERVED allocations"
          - "customer.credit_exposure_cents decreases by quoted_total_cents"
          - "increments CustomerOrder.version"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "releases all RESERVED allocations"
          - "customer.credit_exposure_cents decreases by quoted_total_cents"
          - "increments CustomerOrder.version"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "the order's PLANNED|LOADED shipment transitions to CANCELLED"
          - "releases all RESERVED allocations"
          - "customer.credit_exposure_cents decreases by quoted_total_cents"
          - "increments CustomerOrder.version"
      - from: SOURCING
        to: ALLOCATED
        trigger: "system: an allocation creation makes allocated_male == quantity_male and allocated_female == quantity_female"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system: an allocation creation completes full coverage"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: ALLOCATED
        to: SOURCING
        trigger: "system: an allocation release or the barrier-downgrade cascade drops coverage below requested"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: ALLOCATED
        to: SCHEDULED
        trigger: "system: shipment creation against this order"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: SCHEDULED
        to: ALLOCATED
        trigger: "system: the order's shipment is CANCELLED while allocations remain RESERVED"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: SCHEDULED
        to: SHIPPED
        trigger: "system: the order's shipment reaches IN_TRANSIT"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerOrder.version"
      - from: SHIPPED
        to: DELIVERED
        trigger: "system: the order's shipment is ACCEPTED at receipt"
        actor: system
        preconditions: []
        side_effects:
          - "billing: customer.outstanding_balance_cents += quoted_total_cents (NET_BILLED variant)"
          - "increments CustomerOrder.version"
      - from: SHIPPED
        to: CLOSED
        trigger: "system: the order's shipment is REJECTED_AT_RECEIPT"
        actor: system
        preconditions: []
        side_effects:
          - "no billing is posted; customer.credit_exposure_cents decreases by quoted_total_cents"
          - "increments CustomerOrder.version"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /api/orders/{id}/transition with target_state=CLOSED"
        actor: Customer
        preconditions:
          - "Customer actor: X-User-ID == order.customer_id"
        side_effects:
          - "customer.credit_exposure_cents decreases by quoted_total_cents (GROSS no longer counts CLOSED orders); outstanding_balance_cents is unchanged"
          - "increments CustomerOrder.version"

  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/allocations/{id}/release, or order cancel cascade, or barrier-downgrade cascade"
        actor: FacilityManager | system
        preconditions: []
        side_effects:
          - "cohort reserved_male/reserved_female decremented; cohort status recomputed (FULLY_ALLOCATED -> PARTIALLY_ALLOCATED, or PARTIALLY_ALLOCATED -> HOLD when nothing remains reserved)"
          - "order allocated_male/allocated_female decremented; order coverage recomputed (ALLOCATED -> SOURCING when coverage is lost)"
          - "increments CustomerOrder.version"
      - from: RESERVED
        to: CONSUMED
        trigger: "system: the order's shipment transitions LOADED -> IN_TRANSIT"
        actor: system
        preconditions: []
        side_effects:
          - "cohort count_male/count_female decremented by qty; cohort status recomputed (may reach SHIPPED)"
          - "order allocated_male/allocated_female decremented (consumption)"
          - "increments CustomerOrder.version"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [ACCEPTED, REJECTED_AT_RECEIPT, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /api/shipments/{id}/transition with target_state=LOADED"
        actor: LogisticsCoordinator
        preconditions:
          - "order.status == SCHEDULED"
        side_effects:
          - "increments Shipment.version"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /api/shipments/{id}/transition with target_state=IN_TRANSIT"
        actor: LogisticsCoordinator
        preconditions:
          - "the facility housing the source cohorts' rooms has registration_status == REGISTERED"
        side_effects:
          - "all RESERVED allocations of the order transition to CONSUMED; cohort counts decrement and recompute per post_consumption_recompute"
          - "order transitions SCHEDULED -> SHIPPED"
          - "increments Shipment.version"
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /api/shipments/{id}/transition with target_state=ARRIVED"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "sets actual_arrival_at to the current logical clock; increments Shipment.version"
      - from: ARRIVED
        to: ACCEPTED
        trigger: "POST /api/shipments/{id}/transition with target_state=ACCEPTED carrying received_male and received_female (receiving protocol)"
        actor: Customer
        preconditions:
          - "Customer actor: X-User-ID == shipment.order.customer_id"
        side_effects:
          - "records received_male / received_female"
          - "order transitions SHIPPED -> DELIVERED (billing posts there)"
          - "increments Shipment.version"
      - from: ARRIVED
        to: REJECTED_AT_RECEIPT
        trigger: "POST /api/shipments/{id}/transition with target_state=REJECTED_AT_RECEIPT (receiving protocol refusal)"
        actor: Customer
        preconditions:
          - "Customer actor: X-User-ID == shipment.order.customer_id"
        side_effects:
          - "order transitions SHIPPED -> CLOSED with no billing"
          - "increments Shipment.version"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/shipments/{id}/transition with target_state=CANCELLED, or system cascade (facility suspension/revocation, barrier downgrade)"
        actor: LogisticsCoordinator | PlatformAdmin | system
        preconditions: []
        side_effects:
          - "order transitions SCHEDULED -> ALLOCATED unless the same cascade already forced it to SOURCING"
          - "increments Shipment.version"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /api/shipments/{id}/transition with target_state=CANCELLED, or system cascade"
        actor: LogisticsCoordinator | PlatformAdmin | system
        preconditions: []
        side_effects:
          - "order transitions SCHEDULED -> ALLOCATED unless the same cascade already forced it to SOURCING"
          - "increments Shipment.version"

  - entity: IACUCProtocol
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/protocols/{id}/transition with target_state=SUBMITTED"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "sets submitted_by_user_id to the caller's X-User-ID; increments IACUCProtocol.version"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/protocols/{id}/transition with target_state=UNDER_REVIEW"
        actor: IACUCReviewer
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/protocols/{id}/transition with target_state=APPROVED"
        actor: IACUCReviewer
        preconditions:
          - "caller's X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "increments IACUCProtocol.version"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/protocols/{id}/transition with target_state=REJECTED"
        actor: IACUCReviewer
        preconditions:
          - "caller's X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "increments IACUCProtocol.version"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /api/protocols/{id}/transition with target_state=REVISION_REQUESTED"
        actor: IACUCReviewer
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/protocols/{id}/transition with target_state=SUBMITTED (resubmission loop back-edge)"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "sets submitted_by_user_id to the caller's X-User-ID; increments IACUCProtocol.version"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /api/protocols/{id}/transition with target_state=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /api/protocols/{id}/transition with target_state=APPROVED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock sweep: logical clock passes expiration_date"
        actor: system
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version; colonies referencing this protocol can no longer create cohorts or accept allocations (ERR_PROTOCOL_NOT_APPROVED)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/protocols/{id}/transition with target_state=WITHDRAWN"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/protocols/{id}/transition with target_state=WITHDRAWN"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "increments IACUCProtocol.version"

  - entity: WelfareInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED_VERIFIED, ESCALATED]
    transitions:
      - from: SCHEDULED
        to: CORRECTIVE_ACTION
        trigger: "POST /api/inspections/{id}/report with a non-empty findings array"
        actor: WelfareInspector
        preconditions:
          - "corrective_deadline is present in the payload whenever any finding has severity SIGNIFICANT"
        side_effects:
          - "stores findings and reported_by_user_id"
      - from: SCHEDULED
        to: CLOSED_VERIFIED
        trigger: "POST /api/inspections/{id}/report with an empty findings array"
        actor: WelfareInspector
        preconditions: []
        side_effects:
          - "stores empty findings and reported_by_user_id"
      - from: CORRECTIVE_ACTION
        to: CLOSED_VERIFIED
        trigger: "POST /api/inspections/{id}/verify with outcome=VERIFIED_OK"
        actor: WelfareInspector
        preconditions:
          - "caller's X-User-ID != reported_by_user_id (segregation of duties)"
        side_effects: []
      - from: CORRECTIVE_ACTION
        to: ESCALATED
        trigger: "POST /api/inspections/{id}/verify with outcome=VERIFIED_FAILED, or system clock sweep past corrective_deadline"
        actor: WelfareInspector | system
        preconditions:
          - "manual verify: caller's X-User-ID != reported_by_user_id"
        side_effects:
          - "cascade hop 1: facility site -> Facility.registration_status becomes SUSPENDED (firing the shipment-cancellation cascade); customer site -> Customer.account_status becomes SUSPENDED"

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /api/contracts/{id}/transition with target_state=EXECUTED"
        actor: Customer
        preconditions:
          - "Customer actor: X-User-ID == contract.customer_id"
          - "IP terms validated (ERR_IP_TERMS_INVALID rules)"
        side_effects:
          - "increments ServiceContract.version"
      - from: EXECUTED
        to: IN_PROGRESS
        trigger: "POST /api/contracts/{id}/transition with target_state=IN_PROGRESS"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments ServiceContract.version"
      - from: IN_PROGRESS
        to: VALIDATION
        trigger: "POST /api/contracts/{id}/transition with target_state=VALIDATION"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments ServiceContract.version"
      - from: VALIDATION
        to: COMPLETED
        trigger: "POST /api/contracts/{id}/transition with target_state=COMPLETED"
        actor: PlatformAdmin
        preconditions:
          - "CRYOPRESERVATION: payload viability_pct present, 0 <= viability_pct <= 100, and viability_pct >= 70"
          - "CUSTOM_GENERATION: new_strain_spec present on the contract"
        side_effects:
          - "CUSTOM_GENERATION: creates a new ModelStrain from new_strain_spec and stores its id in generated_strain_id"
          - "CRYOPRESERVATION: stores viability_pct"
          - "increments ServiceContract.version"
      - from: VALIDATION
        to: VALIDATION_FAILED
        trigger: "POST /api/contracts/{id}/transition with target_state=COMPLETED for a CRYOPRESERVATION contract whose viability_pct < 70"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "stores viability_pct; increments ServiceContract.version"
      - from: VALIDATION_FAILED
        to: IN_PROGRESS
        trigger: "POST /api/contracts/{id}/transition with target_state=IN_PROGRESS (retry loop)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments ServiceContract.version"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /api/contracts/{id}/transition with target_state=CLOSED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments ServiceContract.version"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/contracts/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == contract.customer_id"
        side_effects:
          - "increments ServiceContract.version"
      - from: EXECUTED
        to: CANCELLED
        trigger: "POST /api/contracts/{id}/transition with target_state=CANCELLED"
        actor: Customer | PlatformAdmin
        preconditions:
          - "Customer actor: X-User-ID == contract.customer_id"
        side_effects:
          - "increments ServiceContract.version"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
# Global version rule: a mutating request increments the version of every
# entity it touches by EXACTLY 1, regardless of how many cascade hops or
# automatic transitions fire inside that single request.
concurrency_rules:
  - rule_id: allocation-create-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /api/allocations"
    occ_field: "expected_order_version"
    description: |
      Creating an Allocation against a CustomerOrder whose version has advanced
      since the client last observed it is rejected. This covers the case where
      another writer has just created a further allocation or released one —
      each a legitimate mutation under the order state machine — leaving the
      current writer's view of coverage stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shipment-create-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /api/shipments"
    occ_field: "expected_order_version"
    description: |
      Creating a Shipment against a CustomerOrder whose version has advanced
      since the client last observed it is rejected: the order's coverage or
      scheduling state may have changed under a stale read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cohort_age_weeks
    trigger: "computed on Cohort reads; evaluated during allocation eligibility with as_of = order.required_delivery_date"
    algorithm: threshold
    formula: |
      age_days = floor((as_of - cohort.birth_date) / 86400 seconds)
      age_weeks = floor(age_days / 7)
      Eligibility requires min_age_weeks <= age_weeks <= max_age_weeks (both inclusive).
    input_set: "the single Cohort under evaluation"
    constants:
      SECONDS_PER_DAY: 86400
      DAYS_PER_WEEK: 7
    precision: "integer weeks, floor; window bounds inclusive on both ends"

  - name: colony_availability_forecast
    trigger: "computed on Colony reads; the SUBMITTED -> SOURCING order transition sums it over eligible colonies for the feasibility check"
    algorithm: forward_looking
    formula: |
      confirmed_available_count = SUM over cohorts c where c.colony_id == this
        AND c.status in {HOLD, PARTIALLY_ALLOCATED}:
          (c.count_male + c.count_female - c.reserved_male - c.reserved_female)
      projected_pipeline_count = confirmed_available_count +
        (FLOOR(breeding_pair_count * strain.typical_litter_size * SURVIVAL_RATE)
         if lifecycle_status == PRODUCTION and genetic_status != DRIFT_DETECTED
         else 0)
    input_set: "cohorts of this colony with status in {HOLD, PARTIALLY_ALLOCATED} (WEANED, FULLY_ALLOCATED, SHIPPED, CULLED excluded)"
    constants:
      SURVIVAL_RATE: 0.8
    precision: "integer animals"
    variants:
      - name: PROJECTED
        when: "order sourcing feasibility (SUBMITTED -> SOURCING) and the projected_pipeline_count read field"
        difference: "includes the expected next-litter yield term for PRODUCTION colonies"
      - name: CONFIRMED_ONLY
        when: "the confirmed_available_count read field"
        difference: "counts only physically present, unreserved animals; identical inputs yield a strictly smaller-or-equal number than PROJECTED"

  - name: customer_credit_positions
    trigger: "computed on Customer reads; the sourcing credit check uses the GROSS variant"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents (NET_BILLED) = SUM(order.quoted_total_cents)
        over orders of this customer with status == DELIVERED
      credit_exposure_cents (GROSS) = SUM(order.quoted_total_cents)
        over orders of this customer with status in
        {SOURCING, BACKORDERED, ALLOCATED, SCHEDULED, SHIPPED, DELIVERED}
      Sourcing credit check: reject when
        credit_exposure_cents_after = credit_exposure_cents + new_order_quote
        is STRICTLY greater than credit_limit_cents; equality passes.
    input_set: "orders of the customer filtered by the status sets above; SUBMITTED, CLOSED, CANCELLED, REJECTED are excluded from both variants; BACKORDERED counts toward GROSS only once its quote is locked (which happens on the transition into BACKORDERED)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: GROSS
        when: "credit-limit enforcement at sourcing; credit_exposure_cents field"
        difference: "counts the committed pipeline (SOURCING through DELIVERED)"
      - name: NET_BILLED
        when: "outstanding_balance_cents field; billing on receipt acceptance"
        difference: "counts only DELIVERED orders; identical order data yields a smaller-or-equal number than GROSS"

  - name: order_quote
    trigger: "computed and stored as quoted_total_cents when an order leaves SUBMITTED for SOURCING or BACKORDERED"
    algorithm: tiered_pricing
    formula: |
      qty = order.quantity_male + order.quantity_female
      subtotal = qty * strain.base_price_cents
      tier_discount = 0.20 if qty >= TIER2_QTY
                      else 0.10 if qty >= TIER1_QTY
                      else 0
      discounted = ROUND_HALF_UP(subtotal * (1 - tier_discount))
      surcharge_rate = (IMMUNO_SURCHARGE if strain.immune_class == IMMUNOCOMPROMISED else 0)
                     + (GERM_FREE_PREMIUM if order.min_health_status == GERM_FREE
                        else VF_PREMIUM if order.min_health_status == VF else 0)
      quoted_total_cents = ROUND_HALF_UP(discounted * (1 + surcharge_rate))
      Evaluation order is pinned: tier discount first, surcharges second;
      each step rounds to integer cents before the next.
    input_set: "the order's quantities and min_health_status; the strain's base_price_cents and immune_class"
    constants:
      TIER1_QTY: 100
      TIER1_DISCOUNT: 0.10
      TIER2_QTY: 250
      TIER2_DISCOUNT: 0.20
      IMMUNO_SURCHARGE: 0.25
      VF_PREMIUM: 0.20
      GERM_FREE_PREMIUM: 0.40
    precision: "integer cents, round_half_up at each pinned step"

  - name: shipment_box_count
    trigger: "computed when a Shipment is created; stored as box_count"
    algorithm: aggregation
    formula: |
      For each allocation a in RESERVED on the order, for each sex s in
      {male, female} with a.qty_s > 0:
        w = cohort.avg_weight_g_<s>
        per_box = LIGHT_PER_BOX if w < LIGHT_MAX_G
                  else HEAVY_PER_BOX if w >= HEAVY_MIN_G
                  else STANDARD_PER_BOX
        line_boxes = CEIL(a.qty_s / per_box)
      box_count = SUM(line_boxes)
      Rounding order is pinned: ceiling PER (allocation, sex) line first,
      then summation. Summing animals first and ceiling once is a different
      (rejected) algorithm that yields fewer boxes.
    input_set: "the order's RESERVED allocations at shipment creation; per-cohort average weights per sex"
    constants:
      LIGHT_MAX_G: 15
      HEAVY_MIN_G: 25
      LIGHT_PER_BOX: 10
      STANDARD_PER_BOX: 6
      HEAVY_PER_BOX: 4
    precision: "integer boxes"

  - name: room_occupied_cages
    trigger: "computed on BarrierRoom reads and on the cage-capacity checks at colony and cohort creation"
    algorithm: aggregation
    formula: |
      occupied_cages = SUM over colonies co where co.room_id == this
          AND co.lifecycle_status != RETIRED: co.breeding_pair_count
        + SUM over cohorts c where c.colony.room_id == this
          AND c.status in {WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}:
            CEIL((c.count_male + c.count_female) / CAGE_DENSITY)
      Colony creation check: occupied_cages + breeding_pair_count <= cage_capacity.
      Cohort creation check: occupied_cages + CEIL(new_total / CAGE_DENSITY) <= cage_capacity.
      Equality passes in both checks.
    input_set: "non-RETIRED colonies of the room; cohorts in {WEANED, HOLD, PARTIALLY_ALLOCATED, FULLY_ALLOCATED} (SHIPPED and CULLED excluded)"
    constants:
      CAGE_DENSITY: 5
    precision: "integer cages; ceiling per cohort before summation"

  - name: protocol_animals_used
    trigger: "incremented at colony creation and cohort creation; read on IACUCProtocol; the quota gate consults it"
    algorithm: aggregation
    formula: |
      animals_used = SUM over colonies co where co.protocol_id == this:
          2 * co.breeding_pair_count
        + SUM over cohorts c of those colonies: c.initial_count_total
      Monotonic: culls, releases, shipments, and retirements never decrement it
      (initial_count_total is an immutable creation snapshot).
      Quota gates (equality passes):
        colony create: animals_used + 2 * breeding_pair_count <= approved_animal_quota
        cohort create: animals_used + (count_male + count_female) <= approved_animal_quota
    input_set: "colonies referencing this protocol (any lifecycle_status) and their cohorts (any status)"
    constants: {}
    precision: "integer animals"

  - name: clock_sweep_effects
    trigger: "POST /_clock/set_current_utc advances the logical clock"
    algorithm: threshold
    formula: |
      On every clock advance, in this pinned order:
      1. Protocol expiry: IACUCProtocol in APPROVED with expiration_date < now
         -> EXPIRED.
      2. Genetic monitoring: Colony with genetic_status == CLEAR and
         now > last_snp_panel_at + snp_panel_interval_weeks -> PANEL_DUE.
      3. Corrective escalation: WelfareInspection in CORRECTIVE_ACTION with
         corrective_deadline < now -> ESCALATED; then fire the site cascade
         (facility -> SUSPENDED with shipment cancellations, or customer ->
         SUSPENDED).
    input_set: "protocols in APPROVED; colonies with genetic_status == CLEAR; inspections in CORRECTIVE_ACTION"
    constants: {}
    precision: "strictly-greater comparisons on ISO8601 instants"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
# Priority ladder: auth(1) -> authorization(2) -> ownership(3) -> existence(4)
# -> state(5) -> business_safety(6) -> business_temporal(7)
# -> business_constraint(8) -> business_referential(9) -> business_fiscal(10).
# A request violating several rules reports the LOWEST priority number.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a role declared in the RBAC matrix; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For Customer-role calls acting on an owned resource (order read/cancel/close, shipment accept/reject, contract execute/cancel): X-User-ID equals the resource's customer_id (transitively via order for shipments)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /api/orders/{id}/transition, POST /api/shipments/{id}/transition, POST /api/contracts/{id}/transition, GET /api/customers/{id}, GET /api/customers/{id}/orders, GET /api/customers/{id}/contracts, GET /api/customers/{id}/inspections, GET /api/orders/{id}, GET /api/orders/{id}/allocations, GET /api/orders/{id}/shipments"
  - priority: 4
    category: existence
    check: "Path-template ids resolve left-to-right; then present request-body foreign keys (room_id, strain_id, protocol_id, colony_id, order_id, cohort_id, facility_id, customer_id, source_strain_id) resolve. A missing required field is NOT a 404 — it is caught at priority 8."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource is in a from-state of the requested transition; from a terminal state every further transition is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_order_version equals the CustomerOrder's current version (applies to POST /api/allocations and POST /api/shipments)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/allocations, POST /api/shipments"
  - priority: 6
    category: business_safety
    check: "Room not QUARANTINED or DECOMMISSIONED for colony creation, cohort creation, and allocation creation touching that room"
    error_id: ERR_ROOM_QUARANTINED
    http_status: 409
    applies_to: "POST /api/colonies, POST /api/cohorts, POST /api/allocations"
  - priority: 6
    category: business_safety
    check: "Facility registration_status == REGISTERED for colony creation in its rooms and for the LOADED -> IN_TRANSIT shipment transition"
    error_id: ERR_FACILITY_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /api/colonies, POST /api/shipments/{id}/transition"
  - priority: 6
    category: business_safety
    check: "Colony genetic_status: cohort creation requires CLEAR (PANEL_DUE or DRIFT_DETECTED reject); allocation creation rejects DRIFT_DETECTED"
    error_id: ERR_GENETIC_DRIFT
    http_status: 409
    applies_to: "POST /api/cohorts, POST /api/allocations"
  - priority: 6
    category: business_safety
    check: "Colony genetic_status == PANEL_DUE blocks new allocations (surveillance overdue) — distinct from drift"
    error_id: ERR_PANEL_OVERDUE
    http_status: 409
    applies_to: "POST /api/allocations"
  - priority: 6
    category: business_safety
    check: "Colony's IACUCProtocol status == APPROVED for colony creation and cohort creation"
    error_id: ERR_PROTOCOL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /api/colonies, POST /api/cohorts"
  - priority: 6
    category: business_safety
    check: "Protocol quota headroom: protocol_animals_used + incoming animals <= approved_animal_quota (colony: +2*pairs; cohort: +total headcount); equality passes"
    error_id: ERR_PROTOCOL_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /api/colonies, POST /api/cohorts"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: protocol APPROVED/REJECTED caller differs from submitted_by_user_id; inspection verify caller differs from reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/protocols/{id}/transition, POST /api/inspections/{id}/verify"
  - priority: 7
    category: business_temporal
    check: "required_delivery_date >= now + MIN_ORDER_LEAD_DAYS at order submission"
    error_id: ERR_DELIVERY_WINDOW_INFEASIBLE
    http_status: 422
    applies_to: "POST /api/orders"
  - priority: 7
    category: business_temporal
    check: "planned_arrival_date - departure_date <= MAX_TRANSIT_HOURS and planned_arrival_date <= order.required_delivery_date and departure_date >= now"
    error_id: ERR_TRANSIT_DURATION_EXCEEDED
    http_status: 422
    applies_to: "POST /api/shipments"
  - priority: 7
    category: business_temporal
    check: "sanitized_at must satisfy departure_date - 72h <= sanitized_at <= departure_date; and for every prior non-CANCELLED shipment on the same vehicle_code whose planned_arrival_date <= this departure_date (i.e. non-overlapping predecessors), sanitized_at >= that shipment's planned_arrival_date (fresh sanitization after the previous tour)"
    error_id: ERR_VEHICLE_NOT_SANITIZED
    http_status: 422
    applies_to: "POST /api/shipments"
  - priority: 7
    category: business_temporal
    check: "Half-open transit windows [departure_date, planned_arrival_date) on the same vehicle_code do not overlap any non-CANCELLED shipment in {PLANNED, LOADED, IN_TRANSIT}; a departure exactly equal to a prior planned arrival is allowed"
    error_id: ERR_VEHICLE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/shipments"
  - priority: 7
    category: business_temporal
    check: "At most one inspection per site per UTC calendar day of scheduled_date among inspections in {SCHEDULED, CORRECTIVE_ACTION}"
    error_id: ERR_INSPECTION_DAY_CONFLICT
    http_status: 409
    applies_to: "POST /api/inspections"
  - priority: 7
    category: business_temporal
    check: "Cohort age at the order's required_delivery_date (cohort_age_weeks) lies within [min_age_weeks, max_age_weeks] inclusive"
    error_id: ERR_AGE_SPEC_MISMATCH
    http_status: 422
    applies_to: "POST /api/allocations"
  - priority: 8
    category: business_constraint
    check: "Required fields present and well-typed; polymorphic site rule on inspections: exactly one of facility_id / customer_id set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: business_constraint
    check: "Enum fields carry a declared member"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: business_constraint
    check: "Uniqueness: Facility.site_code, Customer.account_number, IACUCProtocol.protocol_number, ModelStrain.strain_code (including the strain_code inside a contract's new_strain_spec) must not collide with an existing record"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /api/facilities, POST /api/customers, POST /api/protocols, POST /api/strains, POST /api/contracts/{id}/transition"
  - priority: 8
    category: business_constraint
    check: "quantity_male + quantity_female >= 1 on order creation; qty_male + qty_female >= 1 on allocation creation"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /api/orders, POST /api/allocations"
  - priority: 8
    category: business_constraint
    check: "min_age_weeks <= max_age_weeks"
    error_id: ERR_INVALID_AGE_WINDOW
    http_status: 422
    applies_to: "POST /api/orders"
  - priority: 8
    category: business_constraint
    check: "min_weight_g < max_weight_g"
    error_id: ERR_INVALID_WEIGHT_WINDOW
    http_status: 422
    applies_to: "POST /api/orders"
  - priority: 8
    category: business_constraint
    check: "Cage capacity: room_occupied_cages + incoming cages <= cage_capacity (equality passes)"
    error_id: ERR_CAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/colonies, POST /api/cohorts"
  - priority: 8
    category: business_constraint
    check: "Contract type-specific field rules: CRYOPRESERVATION requires straw_count >= 1 and forbids new_strain_spec; CUSTOM_GENERATION requires new_strain_spec and forbids straw_count; IP terms per ServiceContract.ip_ownership description"
    error_id: ERR_IP_TERMS_INVALID
    http_status: 422
    applies_to: "POST /api/contracts, POST /api/contracts/{id}/transition"
  - priority: 8
    category: business_constraint
    check: "On the SUBMITTED -> SOURCING transition, PROJECTED availability summed over eligible colonies must be >= requested total; otherwise the order must be routed to BACKORDERED"
    error_id: ERR_SUPPLY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/orders/{id}/transition"
  - priority: 9
    category: business_referential
    check: "Colony housing: room.barrier_level rank >= strain.min_barrier_level rank; shipment vehicle_barrier_cert rank >= order.min_health_status rank"
    error_id: ERR_BARRIER_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/colonies, POST /api/shipments"
  - priority: 9
    category: business_referential
    check: "Immunocompromised housing: a room hosts colonies of at most one IMMUNOCOMPROMISED strain; an IMMUNOCOMPROMISED strain requires room.barrier_level rank >= VF"
    error_id: ERR_IMMUNOCOMPROMISED_MIXING
    http_status: 422
    applies_to: "POST /api/colonies"
  - priority: 9
    category: business_referential
    check: "Allocation's cohort belongs to a colony whose strain_id == order.strain_id"
    error_id: ERR_STRAIN_MISMATCH
    http_status: 422
    applies_to: "POST /api/allocations"
  - priority: 9
    category: business_referential
    check: "Cohort average weight for each allocated sex within [min_weight_g, max_weight_g] inclusive"
    error_id: ERR_WEIGHT_SPEC_MISMATCH
    http_status: 422
    applies_to: "POST /api/allocations"
  - priority: 9
    category: business_referential
    check: "Cohort free headcount suffices: available_male >= qty_male and available_female >= qty_female; cohort status in {HOLD, PARTIALLY_ALLOCATED}"
    error_id: ERR_COHORT_NOT_ALLOCATABLE
    http_status: 409
    applies_to: "POST /api/allocations"
  - priority: 9
    category: business_referential
    check: "Order status in {SOURCING, BACKORDERED} for allocation creation; order status == ALLOCATED for shipment creation"
    error_id: ERR_ORDER_NOT_SOURCING
    http_status: 409
    applies_to: "POST /api/allocations, POST /api/shipments"
  - priority: 9
    category: business_referential
    check: "At most one non-CANCELLED shipment per order: shipment creation is rejected when the order already has a shipment in {PLANNED, LOADED, IN_TRANSIT, ARRIVED, ACCEPTED, REJECTED_AT_RECEIPT}"
    error_id: ERR_DUPLICATE_ACTIVE_SHIPMENT
    http_status: 409
    applies_to: "POST /api/shipments"
  - priority: 10
    category: business_fiscal
    check: "customer.account_status == ACTIVE for order submission and sourcing"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /api/orders, POST /api/orders/{id}/transition"
  - priority: 10
    category: business_fiscal
    check: "Sourcing credit check: credit_exposure_cents + order_quote <= credit_limit_cents (equality passes)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/orders/{id}/transition"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# All list endpoints accept limit?/offset? and return the paginated envelope.
# ALL_ROLES anchor: any authenticated role may read.
endpoints:
  - method: POST
    path: "/api/facilities"
    description: "Register a production facility."
    roles: [PlatformAdmin]
    code: 201
    input: [name, site_code, registration_number, registration_expires_at]
    output: Facility
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}"
    description: "Read one facility."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/api/facilities/{id}/transition"
    description: "Drive the registration_status machine (UNDER_INSPECTION / REGISTERED / SUSPENDED / REVOKED per state table)."
    roles: [PlatformAdmin]
    code: 200
    input: [target_state, "registration_expires_at?", "reason?"]
    output: Facility
    side_effects: ["Facility registration cascade per state machine (shipment cancellations on SUSPENDED/REVOKED)", "increments Facility.version"]
  - method: GET
    path: "/api/facilities/{id}/rooms"
    description: "List barrier rooms of a facility (reverse reachability for BarrierRoom.facility_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: BarrierRoom[]
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}/protocols"
    description: "List IACUC protocols of a facility (reverse reachability for IACUCProtocol.facility_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: IACUCProtocol[]
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}/inspections"
    description: "List welfare inspections at this facility site."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: WelfareInspection[]
    side_effects: []
  - method: POST
    path: "/api/rooms"
    description: "Create a barrier room in a facility."
    roles: [FacilityManager, PlatformAdmin]
    code: 201
    input: [facility_id, room_code, barrier_level, excluded_agents, cage_capacity]
    output: BarrierRoom
    side_effects: []
  - method: GET
    path: "/api/rooms/{id}"
    description: "Read one barrier room (includes computed occupied_cages)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: []
    output: BarrierRoom
    side_effects: []
  - method: POST
    path: "/api/rooms/{id}/transition"
    description: "Room lifecycle: QUARANTINED (manual), ACTIVE (lift quarantine), DECOMMISSIONED."
    roles: [FacilityManager, Veterinarian]
    code: 200
    input: [target_state]
    output: BarrierRoom
    side_effects: ["quarantine set/lift semantics per state machine", "increments BarrierRoom.version"]
  - method: GET
    path: "/api/rooms/{id}/health-screens"
    description: "List health screens of a room (reverse reachability for HealthScreen.room_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: HealthScreen[]
    side_effects: []
  - method: POST
    path: "/api/strains"
    description: "Register a research model strain in the catalog."
    roles: [PlatformAdmin]
    code: 201
    input: [strain_code, species, immune_class, breeding_type, min_barrier_level, gestation_days, wean_age_days, typical_litter_size, base_price_cents]
    output: ModelStrain
    side_effects: []
  - method: GET
    path: "/api/strains/{id}"
    description: "Read one strain."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: []
    output: ModelStrain
    side_effects: []
  - method: GET
    path: "/api/strains/{id}/orders"
    description: "List orders requesting this strain (reverse reachability for CustomerOrder.strain_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []
  - method: GET
    path: "/api/strains/{id}/contracts"
    description: "List service contracts referencing this strain as source_strain_id or generated_strain_id (reverse reachability for both ServiceContract strain references)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: POST
    path: "/api/colonies"
    description: "Found a breeding colony: requires room ACTIVE, barrier level >= strain minimum, immunocompromised single-strain rule, protocol APPROVED with quota and cage headroom."
    roles: [FacilityManager]
    code: 201
    input: [room_id, strain_id, protocol_id, breeding_pair_count, "generation_number?", "snp_panel_interval_weeks?"]
    output: Colony
    side_effects: ["protocol animals_used += 2 * breeding_pair_count", "last_snp_panel_at initialized to current logical clock", "room_occupied_cages recomputed"]
  - method: GET
    path: "/api/colonies"
    description: "List colonies; filters cover Colony's room_id, strain_id, protocol_id foreign keys."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["room_id?", "strain_id?", "protocol_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Colony[]
    side_effects: []
  - method: GET
    path: "/api/colonies/{id}"
    description: "Read one colony (includes computed confirmed_available_count and projected_pipeline_count)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: []
    output: Colony
    side_effects: []
  - method: POST
    path: "/api/colonies/{id}/transition"
    description: "Drive lifecycle_status (EXPANDING / PRODUCTION / PHASING_OUT / RETIRED per state table)."
    roles: [FacilityManager]
    code: 200
    input: [target_state]
    output: Colony
    side_effects: ["lifecycle transitions per state machine", "increments Colony.version"]
  - method: POST
    path: "/api/colonies/{id}/snp-panel"
    description: "Record a genetic-monitoring SNP panel result; drives genetic_status."
    roles: [Veterinarian]
    code: 200
    input: [result]
    output: Colony
    side_effects: ["genetic_status transitions per state machine (CLEAR|DRIFT_DETECTED)", "last_snp_panel_at := now", "DRIFT_DETECTED forces lifecycle PHASING_OUT from EXPANDING|PRODUCTION", "increments Colony.version"]
  - method: GET
    path: "/api/colonies/{id}/cohorts"
    description: "List cohorts of a colony (reverse reachability for Cohort.colony_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: POST
    path: "/api/cohorts"
    description: "Record a weaned cohort: requires colony EXPANDING|PRODUCTION, genetic CLEAR, protocol APPROVED with quota headroom, room cage headroom, room not quarantined."
    roles: [FacilityManager]
    code: 201
    input: [colony_id, birth_date, count_male, count_female, avg_weight_g_male, avg_weight_g_female]
    output: Cohort
    side_effects: ["protocol animals_used += count_male + count_female (via initial_count_total)", "health_status := room.barrier_level", "initial_count_total snapshot", "room_occupied_cages recomputed"]
  - method: GET
    path: "/api/cohorts/{id}"
    description: "Read one cohort (includes computed age_weeks at the current logical clock)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: POST
    path: "/api/cohorts/{id}/transition"
    description: "WEANED->HOLD release for sale; CULLED full or partial cull (cull_male/cull_female bounded by available counts)."
    roles: [FacilityManager, Veterinarian]
    code: 200
    input: [target_state, "cull_male?", "cull_female?"]
    output: Cohort
    side_effects: ["cohort transitions and partial-cull semantics per state machine", "room_occupied_cages recomputed", "increments Cohort.version"]
  - method: GET
    path: "/api/cohorts/{id}/allocations"
    description: "List allocations drawing from this cohort (reverse reachability for Allocation.cohort_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, IACUCReviewer, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []
  - method: POST
    path: "/api/health-screens"
    description: "Schedule a diagnostic surveillance screen for a room."
    roles: [Veterinarian]
    code: 201
    input: [room_id, panel_type, scheduled_at]
    output: HealthScreen
    side_effects: []
  - method: POST
    path: "/api/health-screens/{id}/result"
    description: "Record agent results; flips to RESULTED_POSITIVE iff a positive entry names an excluded agent, firing the barrier-downgrade cascade."
    roles: [Veterinarian]
    code: 200
    input: [results]
    output: HealthScreen
    side_effects: ["HealthScreen RESULTED_* per state machine", "on RESULTED_POSITIVE: room quarantine + one-rank downgrade, cohort downgrade, allocation release, order reversion (4-hop cascade)"]
  - method: POST
    path: "/api/customers"
    description: "Onboard a research-institution customer."
    roles: [PlatformAdmin]
    code: 201
    input: [institution_name, account_number, credit_limit_cents, accepted_min_health_status, is_commercial]
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers/{id}"
    description: "Read one customer (includes computed outstanding_balance_cents and credit_exposure_cents). Customer role may read only its own record."
    roles: [PlatformAdmin, FacilityManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/api/customers/{id}/transition"
    description: "Drive account_status (CREDIT_HOLD / ACTIVE / SUSPENDED per state table)."
    roles: [PlatformAdmin]
    code: 200
    input: [target_state]
    output: Customer
    side_effects: ["account_status transitions per state machine", "increments Customer.version"]
  - method: GET
    path: "/api/customers/{id}/orders"
    description: "List orders of a customer (reverse reachability for CustomerOrder.customer_id). Customer role sees only its own."
    roles: [PlatformAdmin, FacilityManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []
  - method: GET
    path: "/api/customers/{id}/contracts"
    description: "List service contracts of a customer (reverse reachability for ServiceContract.customer_id)."
    roles: [PlatformAdmin, FacilityManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: GET
    path: "/api/customers/{id}/inspections"
    description: "List welfare inspections at this customer site."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, Customer, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: WelfareInspection[]
    side_effects: []
  - method: POST
    path: "/api/orders"
    description: "Place a customer order with per-sex quantities, age/weight windows, health-status floor, and required delivery date. customer_id comes from X-User-ID."
    roles: [Customer]
    code: 201
    input: [strain_id, quantity_male, quantity_female, min_age_weeks, max_age_weeks, min_weight_g, max_weight_g, required_delivery_date, "min_health_status?"]
    output: CustomerOrder
    side_effects: []
  - method: GET
    path: "/api/orders/{id}"
    description: "Read one order."
    roles: [PlatformAdmin, FacilityManager, Customer, LogisticsCoordinator]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []
  - method: POST
    path: "/api/orders/{id}/transition"
    description: "Drive the order machine: FacilityManager -> SOURCING / BACKORDERED / REJECTED; Customer(own) or PlatformAdmin -> CANCELLED; Customer(own) -> CLOSED from DELIVERED."
    roles: [FacilityManager, Customer, PlatformAdmin]
    code: 200
    input: [target_state, "reason?"]
    output: CustomerOrder
    side_effects: ["order transitions per state machine", "SOURCING locks quoted_total_cents via order_quote and raises credit_exposure_cents", "CANCELLED releases RESERVED allocations and compensates exposure", "increments CustomerOrder.version"]
  - method: GET
    path: "/api/orders/{id}/allocations"
    description: "List allocations serving this order (reverse reachability for Allocation.order_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []
  - method: GET
    path: "/api/orders/{id}/shipments"
    description: "List shipments of this order (reverse reachability for Shipment.order_id)."
    roles: [PlatformAdmin, FacilityManager, Veterinarian, Customer, LogisticsCoordinator, WelfareInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/api/allocations"
    description: "Reserve animals from a cohort for an order (OCC on CustomerOrder.version). Requires order SOURCING|BACKORDERED, cohort HOLD|PARTIALLY_ALLOCATED, strain match, health/age/weight specs, quarantine/drift/panel gates, protocol quota."
    roles: [FacilityManager]
    code: 201
    input: [order_id, cohort_id, qty_male, qty_female, expected_order_version]
    output: Allocation
    side_effects: ["cohort reserved_male/reserved_female += qty; cohort status HOLD->PARTIALLY_ALLOCATED or PARTIALLY_ALLOCATED->FULLY_ALLOCATED", "order allocated_male/allocated_female += qty; full coverage auto-transitions order SOURCING|BACKORDERED -> ALLOCATED", "increments CustomerOrder.version by exactly 1 (any same-request auto-transition shares this single increment)"]
  - method: POST
    path: "/api/allocations/{id}/release"
    description: "Release a RESERVED allocation (compensating action)."
    roles: [FacilityManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["Allocation RESERVED -> RELEASED with cohort/order recompute per state machine", "increments CustomerOrder.version"]
  - method: POST
    path: "/api/shipments"
    description: "Plan a barrier-preserving shipment for an ALLOCATED order (OCC on CustomerOrder.version). Validates vehicle certification, sanitization chronology, transit duration, delivery deadline, and vehicle window overlap."
    roles: [LogisticsCoordinator]
    code: 201
    input: [order_id, vehicle_code, vehicle_barrier_cert, sanitized_at, departure_date, planned_arrival_date, expected_order_version]
    output: Shipment
    side_effects: ["box_count computed via shipment_box_count", "order ALLOCATED -> SCHEDULED", "increments CustomerOrder.version by exactly 1 (order auto-transition included)"]
  - method: POST
    path: "/api/shipments/{id}/transition"
    description: "Drive the shipment machine: LOADED / IN_TRANSIT / ARRIVED (LogisticsCoordinator); ACCEPTED / REJECTED_AT_RECEIPT (Customer owning the order, with received counts on accept); CANCELLED (LogisticsCoordinator|PlatformAdmin)."
    roles: [LogisticsCoordinator, Customer, PlatformAdmin]
    code: 200
    input: [target_state, "received_male?", "received_female?"]
    output: Shipment
    side_effects: ["shipment transitions per state machine", "IN_TRANSIT consumes allocations and decrements cohort counts", "ACCEPTED posts billing via order DELIVERED transition", "increments Shipment.version"]
  - method: POST
    path: "/api/protocols"
    description: "Create an IACUC protocol in DRAFT."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, protocol_number, pi_name, species, approved_animal_quota, effective_date, expiration_date]
    output: IACUCProtocol
    side_effects: []
  - method: POST
    path: "/api/protocols/{id}/transition"
    description: "Drive the protocol review machine (SUBMITTED by FacilityManager; UNDER_REVIEW / APPROVED / REJECTED / REVISION_REQUESTED by IACUCReviewer with segregation of duties; SUSPENDED and reinstate by PlatformAdmin; WITHDRAWN by FacilityManager)."
    roles: [FacilityManager, IACUCReviewer, PlatformAdmin]
    code: 200
    input: [target_state, "reason?"]
    output: IACUCProtocol
    side_effects: ["protocol transitions per state machine", "submitted_by_user_id refreshed on (re)submit", "increments IACUCProtocol.version"]
  - method: POST
    path: "/api/inspections"
    description: "Schedule a welfare inspection at a facility or customer site (exactly one). Day-slot uniqueness per site."
    roles: [WelfareInspector]
    code: 201
    input: ["facility_id?", "customer_id?", inspection_type, scheduled_date]
    output: WelfareInspection
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/report"
    description: "File inspection findings; empty findings close the inspection, otherwise it enters CORRECTIVE_ACTION."
    roles: [WelfareInspector]
    code: 200
    input: [findings, "corrective_deadline?"]
    output: WelfareInspection
    side_effects: ["SCHEDULED -> REPORTED -> CORRECTIVE_ACTION (or CLOSED_VERIFIED on empty findings)", "stores reported_by_user_id"]
  - method: POST
    path: "/api/inspections/{id}/verify"
    description: "Verify corrective action (VERIFIED_OK -> CLOSED_VERIFIED; VERIFIED_FAILED -> ESCALATED with site-suspension cascade). Verifier must differ from reporter."
    roles: [WelfareInspector]
    code: 200
    input: [outcome]
    output: WelfareInspection
    side_effects: ["inspection transitions per state machine", "on ESCALATED: site suspension cascade"]
  - method: POST
    path: "/api/contracts"
    description: "Create a custom-model-generation or cryopreservation service contract with IP terms."
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, contract_type, source_strain_id, "new_strain_spec?", ip_ownership, "exclusivity_fee_cents?", "royalty_rate_pct?", "straw_count?"]
    output: ServiceContract
    side_effects: []
  - method: POST
    path: "/api/contracts/{id}/transition"
    description: "Drive contract milestones: EXECUTED (Customer own) / IN_PROGRESS / VALIDATION / COMPLETED / CLOSED / CANCELLED; COMPLETED of a CUSTOM_GENERATION contract mints the new ModelStrain; CRYOPRESERVATION completion requires viability_pct >= 70 else VALIDATION_FAILED."
    roles: [PlatformAdmin, Customer]
    code: 200
    input: [target_state, "viability_pct?"]
    output: ServiceContract
    side_effects: ["contract transitions per state machine", "CUSTOM_GENERATION COMPLETED creates ModelStrain from new_strain_spec and sets generated_strain_id", "increments ServiceContract.version"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Startup default is 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock runs the time sweep (protocol expiry, SNP panel due, corrective-action escalation) per calculation clock_sweep_effects."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock_sweep_effects calculation"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not declared in the RBAC matrix"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Caller role is not in the endpoint's roles list"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "Customer-role caller's X-User-ID does not equal the target resource's customer_id (via order for shipments)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Protocol APPROVED/REJECTED attempted by submitted_by_user_id, or inspection verify attempted by reported_by_user_id"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or present body foreign key does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, or inspection site rule violated (exactly one of facility_id/customer_id)"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "Enum field carries a value outside its declared member set"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "site_code, account_number, protocol_number, or strain_code collides with an existing record"
  - id: ERR_DUPLICATE_ACTIVE_SHIPMENT
    http: 409
    condition: "Order already has a non-CANCELLED shipment when another shipment creation is attempted"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version differs from the CustomerOrder's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not declared for the resource's current state, or the resource is in a terminal state"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 403
    condition: "Customer account_status is CREDIT_HOLD or SUSPENDED at order submission or sourcing"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Sourcing would push GROSS credit exposure strictly above credit_limit_cents"
  - id: ERR_ROOM_QUARANTINED
    http: 409
    condition: "Colony creation, cohort creation, or allocation touches a room in QUARANTINED (or DECOMMISSIONED)"
  - id: ERR_FACILITY_NOT_REGISTERED
    http: 409
    condition: "Facility registration_status is not REGISTERED for colony creation or shipment departure"
  - id: ERR_GENETIC_DRIFT
    http: 409
    condition: "Cohort creation while colony genetic_status != CLEAR, or allocation while DRIFT_DETECTED"
  - id: ERR_PANEL_OVERDUE
    http: 409
    condition: "Allocation attempted while colony genetic_status == PANEL_DUE"
  - id: ERR_PROTOCOL_NOT_APPROVED
    http: 409
    condition: "Colony or cohort creation references a protocol not in APPROVED"
  - id: ERR_PROTOCOL_QUOTA_EXCEEDED
    http: 422
    condition: "Colony/cohort creation would push protocol_animals_used strictly above approved_animal_quota"
  - id: ERR_CAGE_CAPACITY_EXCEEDED
    http: 422
    condition: "Colony/cohort creation would push room_occupied_cages strictly above cage_capacity"
  - id: ERR_IMMUNOCOMPROMISED_MIXING
    http: 422
    condition: "Colony creation would add a second IMMUNOCOMPROMISED strain to a room, or house an IMMUNOCOMPROMISED strain below VF"
  - id: ERR_BARRIER_LEVEL_INSUFFICIENT
    http: 422
    condition: "Room barrier_level below strain min_barrier_level at colony creation, or vehicle_barrier_cert below order min_health_status at shipment creation"
  - id: ERR_STRAIN_MISMATCH
    http: 422
    condition: "Allocation cohort's colony strain differs from the order's strain_id"
  - id: ERR_COHORT_NOT_ALLOCATABLE
    http: 409
    condition: "Cohort status not in {HOLD, PARTIALLY_ALLOCATED}, or free (count - reserved) headcount below the requested per-sex quantities"
  - id: ERR_ORDER_NOT_SOURCING
    http: 409
    condition: "Allocation attempted while the order is not in {SOURCING, BACKORDERED}, or shipment attempted while the order is not ALLOCATED"
  - id: ERR_AGE_SPEC_MISMATCH
    http: 422
    condition: "Cohort age at required_delivery_date falls outside the order's inclusive [min_age_weeks, max_age_weeks] window"
  - id: ERR_WEIGHT_SPEC_MISMATCH
    http: 422
    condition: "Cohort average weight for an allocated sex falls outside [min_weight_g, max_weight_g] inclusive"
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "Order quantity_male + quantity_female == 0, or allocation qty_male + qty_female == 0"
  - id: ERR_INVALID_AGE_WINDOW
    http: 422
    condition: "min_age_weeks > max_age_weeks"
  - id: ERR_INVALID_WEIGHT_WINDOW
    http: 422
    condition: "min_weight_g >= max_weight_g"
  - id: ERR_DELIVERY_WINDOW_INFEASIBLE
    http: 422
    condition: "required_delivery_date is earlier than now + MIN_ORDER_LEAD_DAYS at order submission"
  - id: ERR_TRANSIT_DURATION_EXCEEDED
    http: 422
    condition: "planned_arrival_date - departure_date exceeds MAX_TRANSIT_HOURS, planned arrival lands after required_delivery_date, or departure precedes the logical clock"
  - id: ERR_VEHICLE_NOT_SANITIZED
    http: 422
    condition: "sanitized_at older than 72h before departure_date or after departure_date, or earlier than the planned arrival of a non-overlapping predecessor shipment on the same vehicle_code"
  - id: ERR_VEHICLE_SCHEDULE_CONFLICT
    http: 409
    condition: "Half-open transit window [departure_date, planned_arrival_date) overlaps another non-CANCELLED shipment in {PLANNED, LOADED, IN_TRANSIT} on the same vehicle_code"
  - id: ERR_INSPECTION_DAY_CONFLICT
    http: 409
    condition: "Another inspection in {SCHEDULED, CORRECTIVE_ACTION} exists for the same site on the same UTC calendar day"
  - id: ERR_IP_TERMS_INVALID
    http: 422
    condition: "CUSTOMER_EXCLUSIVE without is_commercial or without exclusivity_fee_cents >= 1, royalty_rate_pct present on CUSTOMER_EXCLUSIVE, royalty_rate_pct missing/out of (0,100] on SHARED|VENDOR_RETAINED, straw_count/new_strain_spec mismatch with contract_type, or viability_pct out of range"
  - id: ERR_SUPPLY_INSUFFICIENT
    http: 422
    condition: "Reserved for a sourcing refusal when the FacilityManager attempts SOURCING while PROJECTED availability is below the requested total (the order should be routed to BACKORDERED instead)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Central operator: registers facilities, strains, and customers; drives account status, facility registration, protocol suspension, and contract milestones; owns the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/facilities, POST /api/facilities/{id}/transition"
      - "POST /api/strains"
      - "POST /api/customers, POST /api/customers/{id}/transition"
      - "POST /api/contracts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints; order and contract CANCELLED transitions; shipment CANCELLED transition; protocol SUSPENDED/APPROVED reinstatement and contract milestone transitions"
  - name: FacilityManager
    description: "Production-site operator: rooms, colonies, cohorts, sourcing and allocation decisions, protocol drafting/submission."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/colonies, POST /api/colonies/{id}/transition"
      - "POST /api/cohorts"
      - "POST /api/allocations, POST /api/allocations/{id}/release"
      - "POST /api/protocols"
      - "order transitions to SOURCING, BACKORDERED, REJECTED"
      - "protocol transitions to SUBMITTED and WITHDRAWN"
    shared_operations:
      - "POST /api/rooms, POST /api/rooms/{id}/transition (DECOMMISSIONED)"
      - "POST /api/cohorts/{id}/transition (HOLD)"
      - "all GET endpoints"
  - name: Veterinarian
    description: "Veterinary authority: health surveillance screens, genetic SNP panels, quarantine lift, culls."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/health-screens, POST /api/health-screens/{id}/result"
      - "POST /api/colonies/{id}/snp-panel"
      - "POST /api/cohorts/{id}/transition with target_state=CULLED"
      - "POST /api/rooms/{id}/transition with target_state=QUARANTINED or ACTIVE"
    shared_operations:
      - "all GET endpoints"
  - name: IACUCReviewer
    description: "Institutional animal care and use committee reviewer; cannot decide a protocol it submitted (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "protocol transitions to UNDER_REVIEW, APPROVED, REJECTED, REVISION_REQUESTED"
    shared_operations:
      - "all GET endpoints"
  - name: Customer
    description: "Research institution account holder; X-User-ID equals the Customer entity id. Places and cancels its own orders, executes its own contracts, performs receiving-protocol acceptance."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/orders"
      - "shipment transitions to ACCEPTED and REJECTED_AT_RECEIPT for own orders"
      - "order transitions to CLOSED from DELIVERED for own orders"
      - "contract transition to EXECUTED for own contracts"
    shared_operations:
      - "GET own customer record and sub-collections; order CANCELLED transition (with PlatformAdmin); contract CANCELLED transition (with PlatformAdmin)"
  - name: LogisticsCoordinator
    description: "Transport planner: creates shipments on dedicated barrier-certified vehicles and drives them through departure and arrival."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/shipments"
      - "shipment transitions to LOADED, IN_TRANSIT, ARRIVED"
    shared_operations:
      - "shipment CANCELLED transition (with PlatformAdmin); all GET endpoints"
  - name: WelfareInspector
    description: "Welfare/compliance inspector for production and customer sites; cannot verify corrective closure of a report it filed (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/inspections, POST /api/inspections/{id}/report, POST /api/inspections/{id}/verify"
    shared_operations:
      - "all GET endpoints"

    notes_on_partial_cull: |
      A cull transition whose cull counts are smaller than current counts is a
      partial cull: allowed from WEANED, HOLD, or PARTIALLY_ALLOCATED provided
      cull_male <= available_male and cull_female <= available_female (reserved
      animals cannot be culled). It decrements count_male/count_female without a
      status change, then recomputes PARTIALLY_ALLOCATED/FULLY_ALLOCATED per the
      availability rule. A cull from PARTIALLY_ALLOCATED that removes all
      available animals flips the cohort to FULLY_ALLOCATED, not CULLED.





