            - "${roll_b} == -4.75 and ${base_b} == -2.31"
            - "${a_total} == 1 and ${a_reason} == WEIGHT_LOSS_30D (exactly -5.00 breaches because the comparison is <=)"
            - "${b_total} == 0 (-4.75 is above the trigger, no review opens)"
            - "Resident.${r_b_id}.tray_card_state == CLEAR"
      - name: empty_period_reconciliation_zero_and_empty_counts
