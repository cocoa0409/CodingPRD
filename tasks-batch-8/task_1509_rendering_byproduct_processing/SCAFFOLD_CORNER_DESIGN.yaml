        distinguishing_aspect: "A STANDARD wash on a QUARANTINED vehicle fails ERR_DEEP_WASH_REQUIRED (422); a DEEP wash with PASS then clears it to SANITIZED."
        test_recipe:
          setup: ["plant; vehicle QUARANTINED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 40000, duty_class: "DUAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/vehicles/${veh_id}/quarantine", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /rendering/vehicles/${veh_id}/wash-tickets", payload: { plant_id: "${plant_id}", wash_type: "STANDARD", washed_at: "2026-08-05T09:00:00Z", detergent_ppm: 800.0, result: "PASS" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
            - { call: "POST /rendering/vehicles/${veh_id}/wash-tickets", payload: { plant_id: "${plant_id}", wash_type: "DEEP", washed_at: "2026-08-05T10:00:00Z", detergent_ppm: 1200.0, result: "PASS" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/vehicles/${veh_id}", as: Any }
          assert:
            - "${err1} == ERR_DEEP_WASH_REQUIRED; no WashTicket persisted for the rejected wash"
            - "After DEEP PASS: Vehicle.${veh_id}.sanitation_status == SANITIZED"

      - name: finished_vehicle_on_raw_route_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_VEHICLE_DUTY_MISMATCH]"]
        distinguishing_aspect: "A FINISHED_PRODUCT vehicle cannot be assigned to a raw collection route (ERR_VEHICLE_DUTY_MISMATCH, 409); a DUAL vehicle can."
        test_recipe:
          setup: ["plant; vehicle V-F (FINISHED_PRODUCT) and vehicle V-D (DUAL), both SANITIZED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V-F", capacity_lbs: 40000, duty_class: "FINISHED_PRODUCT" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_f: $.data.id } }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V-D", capacity_lbs: 40000, duty_class: "DUAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_d: $.data.id } }
          trigger:
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_f}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T12:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_d}", route_code: "R2", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T12:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { ok1: $.data.id } }
          assert:
            - "${err1} == ERR_VEHICLE_DUTY_MISMATCH (409)"
            - "DUAL vehicle route created (201): CollectionRoute.${ok1}.status == PLANNED"

  # ==================================================================
  - section: endpoints
    instances:
      - name: advance_period_full_checkpoint_effects
        claim_type: action_endpoint
        grounds: [endpoints.advance_period, state_machines.PeriodSettlement, entities.CompliancePermit.fields.confirmed_violation_count]
        distinguishing_aspect: "advance-period is the ops-run checkpoint: it requires the current settlement CLOSED, increments current_period_index, opens a fresh OPEN settlement, and resets the ACTIVE permit's confirmed_violation_count to 0 — all atomically."
        test_recipe:
          setup: ["plant; ACTIVE permit (threshold 5); one MEDIUM odor event confirmed (score 900, permit count 1); period-1 settlement CLOSED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/permits", payload: { plant_id: "${plant_id}", permit_number: "P-1", odor_event_threshold: 5, emission_limit_ppm: 5.0, expires_on: "2027-01-31" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { per_id: $.data.id } }
            - { call: "POST /rendering/permits/${per_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /rendering/permits/${per_id}/issue", payload: {}, as: Regulator, as_user_id: "reg-1" }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T09:00:00Z", location_description: "Gate", severity: "MEDIUM" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev_id: $.data.id } }
            - { call: "POST /rendering/odor-events/${ev_id}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
            - { call: "POST /rendering/period-settlements/${st1}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
          trigger:
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
            - { call: "GET /rendering/permits/${per_id}", as: Any }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=2", as: Any, captures: { st2: "$.data[0].id" } }
          assert:
            - "Plant.current_period_index == 2; posture == OPERATING; odor_score == 900 (period 1 had a confirmed event: no recovery)"
            - "CompliancePermit.${per_id}.confirmed_violation_count == 0 (reset by checkpoint), status still ACTIVE"
            - "PeriodSettlement period 2: ${st2} exists with status OPEN and all accruals 0; period-1 settlement stays CLOSED"

      - name: invoice_accrues_revenue_to_open_settlement
        claim_type: computed_read
        grounds: [state_machines.SalesOrder.SHIPPED_to_INVOICED, entities.PeriodSettlement.fields.product_revenue_cents, entities.PeriodSettlement.fields.gross_margin_cents]
        distinguishing_aspect: "Full order pipeline (price -> confirm -> ship -> invoice) lands net 17500 on the settlement; combined with the cook run's 12600 energy accrual the computed margin fields read 4900 / 28.0."
        test_recipe:
          setup: ["plant (std cost 38); PREMIUM TALLOW lot 800 lbs RELEASED (cook run 3h, energy 12600 accrued); FIXED contract ACTIVE (base 50, floor 15.0); FINISHED_PRODUCT vehicle sanitized; order qty 100 PRICED STANDARD (unit 50, net 17500)"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 5000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 5000 } ], cook_start: "2026-08-04T06:00:00Z", cook_end: "2026-08-04T09:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { run_id: $.data.id } }
            - { call: "POST /rendering/cook-runs/${run_id}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/complete", payload: { actual_fat_output_lbs: 800, actual_meal_output_lbs: 1200 }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "GET /rendering/product-lots?cook_run_id=${run_id}&product_type=TALLOW", as: Any, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /rendering/product-lots/${lot_id}/grade", payload: { lab_moisture_pct: 0.2, lab_ffa_pct: 1.5, lab_protein_pct: 0 }, as: QualityLabTech, as_user_id: "ql-1" }
            - { call: "POST /rendering/product-lots/${lot_id}/release", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 1000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-20", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
            - { call: "POST /rendering/sales-orders/${ord_id}/price", payload: { expected_grade: "STANDARD" }, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/sales-orders/${ord_id}/confirm", payload: { allocations: [ { lot_id: "${lot_id}", quantity_lbs: 100 } ] }, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V-F", capacity_lbs: 40000, duty_class: "FINISHED_PRODUCT" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_f: $.data.id } }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord_id}/ship", payload: { vehicle_id: "${veh_f}" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/sales-orders/${ord_id}/invoice", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements/${st1}", as: Any }
            - { call: "GET /rendering/customer-contracts/${con_id}", as: Any }
            - { call: "GET /rendering/vehicles/${veh_f}", as: Any }
            - { call: "GET /rendering/product-lots/${lot_id}", as: Any }
          assert:
            - "Order after ship: status SHIPPED, shipped_vehicle_id == ${veh_f}; after invoice: INVOICED"
            - "PeriodSettlement.${st1}: product_revenue_cents == 17500 (500 * 50 - 0 + 12500), energy_costs_cents == 12600, gross_margin_cents == 4900, margin_pct == 28.0"
            - "CustomerContract.${con_id}.delivered_volume_lbs == 100"
            - "Vehicle.${veh_f}.sanitation_status == DIRTY, completed_trip_count == 1"
            - "ProductLot.${lot_id}: allocated_lbs == 0, available_lbs == 700, status stays RELEASED (not depleted)"

      - name: permit_expiry_at_advance_suspends_plant
        claim_type: conditional_action
        grounds: [state_machines.CompliancePermit.ACTIVE_to_EXPIRED, state_machines.Plant.OPERATING_to_SUSPENDED, endpoints.advance_period]
        distinguishing_aspect: "A permit whose expires_on is before the logical clock flips to EXPIRED at advance-period and drags the plant to SUSPENDED — the expiry only evaluates at the checkpoint, never by wall clock."
        test_recipe:
          setup: ["plant; ACTIVE permit expires_on 2026-08-15; logical clock set to 2026-08-20T00:00:00Z; period-1 settlement CLOSED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/permits", payload: { plant_id: "${plant_id}", permit_number: "P-1", odor_event_threshold: 5, emission_limit_ppm: 5.0, expires_on: "2026-08-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { per_id: $.data.id } }
            - { call: "POST /rendering/permits/${per_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /rendering/permits/${per_id}/issue", payload: {}, as: Regulator, as_user_id: "reg-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlantManager }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
            - { call: "POST /rendering/period-settlements/${st1}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
          trigger:
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "GET /rendering/permits/${per_id}", as: Any }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
          assert:
            - "CompliancePermit.${per_id}.status == EXPIRED (expires_on 2026-08-15 < clock 2026-08-20)"
            - "Plant.posture == SUSPENDED and current_period_index == 2"

