            - "Call 1 → 422 with data.error_id == \"ERR_PAYMENT_EXCEEDS_FEE\" (1254001 > final_fee_cents 1254000) and collected_amount_cents stays 0"
            - "Call 2 → 422 with data.error_id == \"ERR_PAYMENT_EXCEEDS_FEE\" (amount_cents <= 0 is refused by the same rule)"
            - "Call 3 → 200 with collected_amount_cents 254000, collected_at null and status still \"ISSUED\""
            - "Call 4 → 422 with data.error_id == \"ERR_PAYMENT_EXCEEDS_FEE\" (254000 + 1000001 = 1254001 exceeds the fee by one cent) and collected_amount_cents stays 254000"
            - "Call 5 → 200 with collected_amount_cents 1254000 and collected_at == \"2026-08-01T00:00:00.000Z\""
            - "Call 6 → total_count 1 with data[0].amount_cents == 501600 and data[0].cash_recognized_at == \"2026-08-01T00:00:00.000Z\" (null before call 5)"

      - name: activation_temporal_gates_and_clock_rewind_enforced
        claim_type: temporal_validation
        grounds:
          - validations[priority=49].coverage_window_not_passed
          - validations[priority=50].license_term_started
          - endpoints["POST /_clock/set_current_utc"].description
          - errors[ERR_CLOCK_REWIND]
        distinguishing_aspect: |
          Both activation gates are driven purely by moving the logical clock, and they point in opposite
          directions: a license may not be activated too early while a blanket may not be activated too
          late, so the single clock advance that unblocks nothing for the license is exactly the one that
          permanently blocks the blanket — and the clock itself refuses to rewind afterwards.
        test_recipe:
          setup:
            - "One ISSUED license whose term_start is 2026-10-01, and one DRAFT blanket covering [2026-08-01, 2026-09-01)."
            - "The logical clock is still at its initial 2026-08-01T00:00:00Z."
