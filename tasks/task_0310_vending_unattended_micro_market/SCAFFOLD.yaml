# =============================================================================
# Vending & Unattended Micro-Market — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Vending & Unattended Micro-Market: machine/location inventory & planogram,
  telemetry (stockout/cash level), route-driver pre-kit & restock, cashless
  payment & price, spoilage/expiration (FIFO), commission to host site,
  service ticket, sales/shrink reporting

domain_name: vending-micro-market
api_prefix: /operations

# complexity_profile — structural DNA (Expert band per §0.4)
complexity_profile:
  primary_archetype: quota_allocation          # planogram slots, par levels, FIFO lot consumption
  secondary_archetype: ledger_reconciliation   # theoretical-vs-physical shrink; commission gross-vs-net
  complexity_layers:
    - optimistic_concurrency                   # OCC on Machine.version for restock commit & price change
    - cascading_side_effects                   # visit -> lot -> slot.on_hand -> machine.stock_status
    - dual_variant_calculation                 # provisional vs final COGS; gross vs net commission
    - derived_field_reconciliation             # slot.on_hand, machine posture, host lifetime balances
    - rate_threshold_triggers                  # par-level reorder threshold; cash-level alert threshold
  entity_topology: hybrid
  state_machine_shape: parallel                # Machine carries stock_status x cash_status x service_status
  relationship_patterns:
    - one_to_many                              # HostSite->Machine, Machine->Slot, Slot->Lot
    - flat_with_references                     # Sale, RestockVisit, ServiceTicket reference by FK
    - cross_aggregate                          # CommissionStatement aggregates across Sale + ShrinkReport
  role_model: peer_roles                       # FieldOps vs RouteDriver vs HostManager vs FinanceClerk
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HostSite
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Host location name" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: commission_model, type: enum, source: input, default: "FLAT", description: "FLAT | TIERED — selects which branch of the commission formula applies; constraints: one of {FLAT, TIERED}" }
      - { name: flat_commission_pct, type: number, source: input, default: 0.10, description: "Commission rate used when commission_model=FLAT, fraction in [0,1]" }
      - { name: monthly_guarantee_cents, type: integer, source: input, default: 0, description: "Minimum monthly commission the host is guaranteed regardless of sales; integer cents >= 0" }
      - { name: lifetime_commission_cents, type: integer, source: computed, default: 0, description: "Read-only running sum of finalized CommissionStatement.net_commission_cents for this host" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new machine placement and statement opening; constraints: one of {ACTIVE, SUSPENDED}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stable SKU code; unique across all products" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "BEVERAGE | SNACK | FRESH_FOOD — FRESH_FOOD is perishable and excluded from TIERED commission; constraints: one of {BEVERAGE, SNACK, FRESH_FOOD}" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Wholesale cost per unit in integer cents; > 0" }
      - { name: shelf_life_days, type: integer, source: input, default: 0, description: "Days from production to expiration; 0 means non-perishable (no expiration tracking); integer >= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCONTINUED — DISCONTINUED products cannot be added to new planogram slots; constraints: one of {ACTIVE, DISCONTINUED}" }

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: host_site_id, type: string, source: input, description: "FK -> HostSite.id; the host location this machine sits at" }
      - { name: asset_tag, type: string, source: input, description: "Physical asset tag; unique across all machines" }
      - { name: machine_type, type: enum, source: input, description: "SNACK_VENDOR | BEVERAGE_VENDOR | MICRO_MARKET_KIOSK; constraints: one of {SNACK_VENDOR, BEVERAGE_VENDOR, MICRO_MARKET_KIOSK}" }
      - { name: cash_capacity_cents, type: integer, source: input, default: 50000, description: "Bill/coin vault capacity in cents; > 0" }
      - { name: cash_on_hand_cents, type: integer, source: computed, default: 0, description: "Read-only cash currently in the vault; rises on CASH sales, falls to 0 on cash collection" }
      - { name: cash_alert_threshold_pct, type: number, source: input, default: 0.80, description: "Fraction of cash_capacity_cents at which cash_status flips to CASH_FULL_WARN; in (0,1]" }
      - { name: par_fill_threshold_pct, type: number, source: input, default: 0.25, description: "Fraction of total capacity at/below which stock_status flips to LOW_STOCK; in (0,1)" }
      - { name: stock_status, type: enum, source: computed, default: "STOCKED", description: "STOCKED | LOW_STOCK | STOCKOUT — derived from aggregate slot fill; constraints: one of {STOCKED, LOW_STOCK, STOCKOUT}" }
      - { name: cash_status, type: enum, source: computed, default: "CASH_OK", description: "CASH_OK | CASH_FULL_WARN — derived from cash_on_hand_cents vs threshold; constraints: one of {CASH_OK, CASH_FULL_WARN}" }
      - { name: service_status, type: enum, source: computed, default: "IN_SERVICE", description: "IN_SERVICE | FROZEN — FROZEN (set by an open blocking ServiceTicket) blocks Sales and restock commits; constraints: one of {IN_SERVICE, FROZEN}" }

  - name: PlanogramSlot
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the machine this slot belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product assigned to this slot" }
      - { name: slot_code, type: string, source: input, description: "Slot coordinate e.g. A1; unique within a machine" }
      - { name: capacity, type: integer, source: input, description: "Max units this slot can hold; > 0" }
      - { name: par_level, type: integer, source: input, description: "Target units after restock; 0 < par_level <= capacity" }
      - { name: price_cents, type: integer, source: input, description: "Retail price per unit in integer cents; > 0" }
      - { name: on_hand, type: integer, source: computed, default: 0, description: "Read-only sum of remaining_units across this slot's non-expired InventoryLot rows" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED — RETIRED slots reject sales and restock; constraints: one of {ACTIVE, RETIRED}" }

  - name: InventoryLot
    parent: PlanogramSlot
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> PlanogramSlot.id; the slot holding this lot" }
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; denormalized owning machine, copied from the slot" }
      - { name: filled_units, type: integer, source: input, description: "Units placed into the slot when this lot was created; > 0" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of the slot's Product.unit_cost_cents at the moment this lot was filled; immutable, so re-priced products yield lots of differing cost in one slot" }
      - { name: remaining_units, type: integer, source: computed, default: 0, description: "Read-only units still available; decremented FIFO by Sales, zeroed on spoilage purge" }
      - { name: expiration_date, type: datetime, source: system, description: "Computed at fill time as restock_visit clock + Product.shelf_life_days; null when shelf_life_days=0" }
      - { name: restock_visit_id, type: string, source: input, description: "FK -> RestockVisit.id; the visit that placed this lot" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | DEPLETED | SPOILED — DEPLETED when remaining_units hits 0, SPOILED when purged past expiration; constraints: one of {AVAILABLE, DEPLETED, SPOILED}" }

  - name: RestockRoute
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> RouteDriverProfile.id; the driver assigned to run this route" }
      - { name: service_date, type: datetime, source: input, description: "ISO 8601 date the route is scheduled to run" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | DISPATCHED | CLOSED — DRAFT accepts stop edits, DISPATCHED locks the pre-kit, CLOSED is terminal; constraints: one of {DRAFT, DISPATCHED, CLOSED}" }

  - name: RouteDriverProfile
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver name" }
      - { name: employee_code, type: string, source: input, description: "Stable employee code; unique across drivers" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE — INACTIVE drivers cannot be assigned to new routes; constraints: one of {ACTIVE, INACTIVE}" }

  - name: RouteStop
    parent: RestockRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> RestockRoute.id; the route this stop belongs to" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the machine to be serviced at this stop" }
      - { name: window_start_min, type: integer, source: input, description: "Service window open, minutes-from-midnight on the route's service_date; 0 <= window_start_min < 1440" }
      - { name: window_end_min, type: integer, source: input, description: "Service window close, minutes-from-midnight, exclusive (half-open [start,end)); window_start_min < window_end_min <= 1440" }
      - { name: prekit_json, type: object, source: computed, description: "Read-only map slot_id -> recommended fill units, computed from par_level minus on_hand at dispatch" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | KITTED | VISITED | SKIPPED — VISITED set when its RestockVisit reconciles; constraints: one of {PLANNED, KITTED, VISITED, SKIPPED}" }

  - name: RestockVisit
    parent: null
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: input, description: "FK -> RouteStop.id; the planned stop this visit executes" }
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; denormalized from the stop" }
      - { name: counted_lines, type: array, source: input, description: "Driver-entered list of {slot_id, physical_count, refill_units} objects captured at the machine" }
      - { name: total_shrink_units, type: integer, source: computed, default: 0, description: "Read-only sum over lines of max(0, theoretical_on_hand - physical_count)" }
      - { name: shrink_value_cents, type: integer, source: computed, default: 0, description: "Read-only monetary shrink; see calculation shrink_valuation" }
      - { name: expected_machine_version, type: integer, source: input, description: "OCC token: the Machine.version the driver last observed; rejected if stale" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | RECONCILED | REJECTED — RECONCILED applies refills and shrink; REJECTED is a revert; constraints: one of {DRAFT, RECONCILED, REJECTED}" }

  - name: Sale
    parent: null
    common_fields: false   # immutable event: only id + created_at
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the machine where the sale occurred" }
      - { name: slot_id, type: string, source: input, description: "FK -> PlanogramSlot.id; the slot vended" }
      - { name: lot_consumption_json, type: object, source: computed, description: "Read-only FIFO breakdown: ordered list of {lot_id, units} the sale drew from" }
      - { name: quantity, type: integer, source: input, description: "Units purchased; > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only price snapshot copied from PlanogramSlot.price_cents at sale time" }
      - { name: gross_cents, type: integer, source: computed, description: "Read-only quantity * unit_price_cents" }
      - { name: provisional_cogs_cents, type: integer, source: computed, description: "Read-only estimated cost of goods using slot weighted-average lot cost; see calculation provisional_cogs" }
      - { name: payment_method, type: enum, source: input, description: "CASHLESS | CASH; CASH raises Machine.cash_on_hand_cents; constraints: one of {CASHLESS, CASH}" }
      - { name: settlement_status, type: enum, source: input, default: "SETTLED", description: "SETTLED | VOID — VOID reverses inventory and cash; constraints: one of {SETTLED, VOID}" }

  - name: CommissionStatement
    parent: HostSite
    common_fields: true
    fields:
      - { name: host_site_id, type: string, source: input, description: "FK -> HostSite.id; the host this statement pays" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start (ISO 8601); statements for one host may not overlap on [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive period end (ISO 8601); period_end > period_start" }
      - { name: gross_sales_cents, type: integer, source: computed, default: 0, description: "Read-only sum of Sale.gross_cents for SETTLED sales on this host's machines within the period" }
      - { name: shrink_chargeback_cents, type: integer, source: computed, default: 0, description: "Read-only host-borne share of shrink_value over the period; see calculation shrink_chargeback" }
      - { name: gross_commission_cents, type: integer, source: computed, default: 0, description: "Read-only commission before shrink chargeback; see calculation gross_commission" }
      - { name: net_commission_cents, type: integer, source: computed, default: 0, description: "Read-only max(gross_commission - shrink_chargeback, monthly_guarantee); see calculation net_commission" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED — FINALIZED freezes all amounts and credits the host; constraints: one of {OPEN, FINALIZED}" }

  - name: ServiceTicket
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the machine needing service" }
      - { name: issue_type, type: enum, source: input, description: "JAM | TELEMETRY_ALERT | VANDALISM | COIN_MECH; constraints: one of {JAM, TELEMETRY_ALERT, VANDALISM, COIN_MECH}" }
      - { name: blocking, type: boolean, source: input, default: false, description: "When true and OPEN/IN_PROGRESS, forces Machine.service_status=FROZEN" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | IN_PROGRESS | RESOLVED | REOPENED — cyclic: RESOLVED can return to REOPENED; constraints: one of {OPEN, IN_PROGRESS, RESOLVED, REOPENED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Machine
    initial_state: "stock_status=STOCKED, cash_status=CASH_OK, service_status=IN_SERVICE"
    terminal_states: []
    note: |
      Machine carries THREE independent (parallel) status dimensions that evolve
      separately: stock_status (driven by slot on_hand), cash_status (driven by
      cash_on_hand_cents), and service_status (driven by open blocking tickets).
      Transitions below are grouped by dimension.
    transitions:
      # --- stock_status dimension (computed, re-derived on every inventory mutation) ---
      - from: "stock_status=STOCKED"
        to: "stock_status=LOW_STOCK"
        trigger: "system: any Sale settle / lot purge / visit reconcile that drops aggregate fill ratio to <= par_fill_threshold_pct"
        actor: system
        preconditions:
          - "aggregate_fill_ratio = sum(slot.on_hand) / sum(slot.capacity) over ACTIVE slots <= par_fill_threshold_pct"
          - "sum(slot.on_hand) > 0"
        side_effects:
          - "Machine.stock_status = LOW_STOCK"
      - from: "stock_status=LOW_STOCK"
        to: "stock_status=STOCKOUT"
        trigger: "system: inventory mutation that brings every ACTIVE slot on_hand to 0"
        actor: system
        preconditions:
          - "sum(slot.on_hand) over ACTIVE slots == 0"
        side_effects:
          - "Machine.stock_status = STOCKOUT"
      - from: "stock_status=STOCKOUT"
        to: "stock_status=STOCKED"
        trigger: "system: RestockVisit RECONCILED raises aggregate fill ratio above par_fill_threshold_pct"
        actor: system
        preconditions:
          - "aggregate_fill_ratio > par_fill_threshold_pct"
        side_effects:
          - "Machine.stock_status = STOCKED"
      # --- cash_status dimension ---
      - from: "cash_status=CASH_OK"
        to: "cash_status=CASH_FULL_WARN"
        trigger: "system: CASH Sale settle pushes cash_on_hand_cents to >= cash_alert_threshold_pct * cash_capacity_cents"
        actor: system
        preconditions:
          - "cash_on_hand_cents >= floor(cash_alert_threshold_pct * cash_capacity_cents)"
        side_effects:
          - "Machine.cash_status = CASH_FULL_WARN"
      - from: "cash_status=CASH_FULL_WARN"
        to: "cash_status=CASH_OK"
        trigger: "POST /operations/machines/{machineId}/cash-collections"
        actor: FieldOps
        preconditions: []
        side_effects:
          - "cash_on_hand_cents reset to 0"
          - "Machine.cash_status = CASH_OK"
      # --- service_status dimension ---
      - from: "service_status=IN_SERVICE"
        to: "service_status=FROZEN"
        trigger: "system: a ServiceTicket with blocking=true enters OPEN"
        actor: system
        preconditions:
          - "at least one ServiceTicket for this machine has blocking=true and status IN {OPEN, IN_PROGRESS, REOPENED}"
        side_effects:
          - "Machine.service_status = FROZEN"
      - from: "service_status=FROZEN"
        to: "service_status=IN_SERVICE"
        trigger: "system: last blocking ServiceTicket transitions to RESOLVED"
        actor: system
        preconditions:
          - "no ServiceTicket for this machine has blocking=true and status IN {OPEN, IN_PROGRESS, REOPENED}"
        side_effects:
          - "Machine.service_status = IN_SERVICE"

  - entity: RestockVisit
    initial_state: DRAFT
    terminal_states: [RECONCILED, REJECTED]
    note: "Branching with revert: DRAFT forks to RECONCILED (apply) or REJECTED (discard); divergent side-effect sets per branch."
    transitions:
      - from: DRAFT
        to: RECONCILED
        trigger: "POST /operations/restock-visits/{visitId}/reconcile"
        actor: RouteDriver
        preconditions:
          - "parent RouteStop.route status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "Machine.service_status == IN_SERVICE (ERR_MACHINE_FROZEN)"
          - "expected_machine_version matches Machine.version (ERR_STALE_MACHINE_VERSION)"
          - "every counted_lines.slot_id belongs to this visit's machine and is ACTIVE (ERR_SLOT_NOT_ON_MACHINE)"
          - "for each line, refill_units + physical_count <= slot.capacity (ERR_SLOT_OVERFILL)"
        side_effects:
          - "compute total_shrink_units and shrink_value_cents (calculation shrink_valuation)"
          - "for each line with refill_units>0: create InventoryLot (filled_units=refill_units, unit_cost_cents snapshotted from the slot's Product.unit_cost_cents, expiration_date from clock+shelf_life_days, status AVAILABLE) [cascade hop 1]"
          - "recompute each touched PlanogramSlot.on_hand from its lots [cascade hop 2]"
          - "re-derive Machine.stock_status from aggregate slot fill [cascade hop 3]"
          - "increment Machine.version by 1"
          - "RouteStop.status = VISITED"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /operations/restock-visits/{visitId}/reject"
        actor: FieldOps
        preconditions:
          - "visit status == DRAFT (ERR_VISIT_NOT_DRAFT)"
        side_effects:
          - "no lots created; no slot or machine mutation"
          - "RouteStop.status = SKIPPED"

  - entity: RestockRoute
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Linear with cross-entity guard: dispatch computes pre-kits; close requires all stops resolved."
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /operations/routes/{routeId}/dispatch"
        actor: FieldOps
        preconditions:
          - "route has >= 1 RouteStop (ERR_ROUTE_EMPTY)"
          - "assigned RouteDriverProfile.status == ACTIVE (ERR_DRIVER_INACTIVE)"
        side_effects:
          - "for each RouteStop: compute prekit_json = {slot_id: max(0, par_level - on_hand)} over ACTIVE slots"
          - "each RouteStop.status = KITTED"
          - "route status = DISPATCHED"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /operations/routes/{routeId}/close"
        actor: FieldOps
        preconditions:
          - "every RouteStop.status IN {VISITED, SKIPPED} (ERR_STOPS_UNRESOLVED)"
        side_effects:
          - "route status = CLOSED"

  - entity: CommissionStatement
    initial_state: OPEN
    terminal_states: [FINALIZED]
    note: "Linear with cross-entity guard and ledger sync on finalize."
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /operations/commission-statements/{statementId}/finalize"
        actor: FinanceClerk
        preconditions:
          - "statement status == OPEN (ERR_STATEMENT_NOT_OPEN)"
          - "no RestockVisit on this host's machines within the period is still DRAFT (ERR_VISITS_PENDING)"
        side_effects:
          - "recompute gross_sales_cents, shrink_chargeback_cents, gross_commission_cents, net_commission_cents"
          - "HostSite.lifetime_commission_cents += net_commission_cents [cascade: ledger sync]"
          - "status = FINALIZED"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic: RESOLVED -> REOPENED -> IN_PROGRESS -> RESOLVED loop allowed for recurring faults."
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /operations/service-tickets/{ticketId}/start"
        actor: FieldOps
        preconditions:
          - "ticket status == OPEN (ERR_TICKET_NOT_OPEN)"
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /operations/service-tickets/{ticketId}/resolve"
        actor: FieldOps
        preconditions:
          - "ticket status == IN_PROGRESS (ERR_TICKET_NOT_IN_PROGRESS)"
        side_effects:
          - "if no other blocking ticket remains OPEN/IN_PROGRESS/REOPENED on the machine: Machine.service_status = IN_SERVICE"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /operations/service-tickets/{ticketId}/reopen"
        actor: FieldOps
        preconditions:
          - "ticket status == RESOLVED (ERR_TICKET_NOT_RESOLVED)"
        side_effects:
          - "if blocking=true: Machine.service_status = FROZEN"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /operations/service-tickets/{ticketId}/start"
        actor: FieldOps
        preconditions:
          - "ticket status == REOPENED (ERR_TICKET_NOT_REOPENED)"
        side_effects: []

  - entity: Sale
    initial_state: SETTLED
    terminal_states: [VOID]
    note: "Append-only event with a single compensating transition (void) that reverses all side effects."
    transitions:
      - from: SETTLED
        to: VOID
        trigger: "POST /operations/sales/{saleId}/void"
        actor: FieldOps
        preconditions:
          - "sale settlement_status == SETTLED (ERR_SALE_NOT_SETTLED)"
        side_effects:
          - "restore remaining_units to each lot in lot_consumption_json (reversing FIFO draw) [compensation]"
          - "lots whose status was DEPLETED by this sale revert to AVAILABLE"
          - "recompute affected PlanogramSlot.on_hand"
          - "if payment_method==CASH: Machine.cash_on_hand_cents -= gross_cents"
          - "re-derive Machine.stock_status and cash_status"

# 1.2.1 Concurrency Rules — true races only (OCC on Machine.version)
concurrency_rules:
  - rule_id: restock-commit-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /operations/restock-visits/{visitId}/reconcile"
    occ_field: "expected_machine_version"
    description: |
      Reconciling a RestockVisit against a Machine whose version has advanced
      since the driver last observed it is rejected. Reconcile legitimately
      supersedes the machine's inventory baseline; if another reconcile (or a
      sale-driven posture change) has already advanced Machine.version, the
      current driver's counted_lines reflect a stale on-hand view and the
      refill math would double-apply, so the stale-version write is refused.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_cogs
    trigger: "Sale settle (POST /operations/sales)"
    algorithm: weighted_scoring
    formula: |
      # Estimate cost of goods at sale time WITHOUT walking FIFO lots.
      # Uses the slot's weighted-average lot cost over AVAILABLE lots, where each
      # lot carries its own snapshot lot.unit_cost_cents (set at fill time).
      avg_cost = round_half_up(
        sum(lot.remaining_units * lot.unit_cost_cents for AVAILABLE lots in slot)
        / sum(lot.remaining_units for AVAILABLE lots in slot)
      )                                   # integer cents, computed BEFORE this sale draws down
      provisional_cogs_cents = avg_cost * quantity
    input_set: "AVAILABLE lots in the sold slot, snapshot taken before FIFO draw-down"
    constants: {}
    precision: "integer cents, round_half_up on the average"
    variants:
      - name: provisional_at_sale
        when: "Sale.settle"
        difference: "Uses slot weighted-average cost; ignores which specific lots FIFO will consume"
      - name: final_fifo_cogs
        when: "RestockVisit reconcile recomputes realized COGS via shrink_valuation's FIFO walk"
        difference: |
          Final realized COGS walks the actual FIFO lot consumption recorded in
          Sale.lot_consumption_json (oldest expiration first), so identical sales
          can yield a different total than the provisional average when lots have
          different unit_cost_cents.

  - name: fifo_lot_consumption
    trigger: "Sale settle (POST /operations/sales)"
    algorithm: chronological
    formula: |
      # Draw `quantity` units from the slot's AVAILABLE lots, oldest first.
      order lots by (expiration_date ASC NULLS LAST, created_at ASC)   # tie-break created_at, NEVER id
      remaining = quantity
      consumption = []
      for lot in ordered_lots:
        take = min(remaining, lot.remaining_units)
        lot.remaining_units -= take
        if lot.remaining_units == 0: lot.status = DEPLETED
        consumption.append({lot_id: lot.id, units: take})
        remaining -= take
        if remaining == 0: break
      if remaining > 0: reject ERR_INSUFFICIENT_STOCK   # not enough on hand
      Sale.lot_consumption_json = consumption
    input_set: "AVAILABLE lots in the sold slot (status AVAILABLE, not SPOILED/DEPLETED)"
    constants: {}
    precision: "integer units"

  - name: shrink_valuation
    trigger: "RestockVisit reconcile (POST /operations/restock-visits/{visitId}/reconcile)"
    algorithm: aggregation
    formula: |
      # Per-line theoretical-vs-physical reconciliation, then valuation.
      total_shrink_units = 0
      shrink_value_cents = 0
      for line in counted_lines:
        slot = line.slot_id
        theoretical = slot.on_hand                       # system-tracked before this visit applies
        line_shrink_units = max(0, theoretical - line.physical_count)
        total_shrink_units += line_shrink_units
        # value each shrunk unit at that slot's CURRENT retail price (lost-revenue basis)
        shrink_value_cents += line_shrink_units * slot.price_cents
      # NOTE: per-line valuation then sum — pinned order (mode b of Rule 2)
    input_set: "counted_lines on the visit; slot.on_hand is the pre-visit theoretical count"
    constants: {}
    precision: "integer cents; per-line multiply then sum (round order pinned: no fractional cents arise so order is exact but pinned for parity with chargeback)"

  - name: gross_commission
    trigger: "CommissionStatement finalize (recompute) and on-read of OPEN statements"
    algorithm: tiered_pricing
    formula: |
      # commission_model branches; >=3 inputs with non-linear tier selection (mode a of Rule 2).
      # gross_sales_cents = sum of Sale.gross_cents for SETTLED sales on host's machines in [period_start, period_end)
      if HostSite.commission_model == "FLAT":
        gross_commission_cents = round_half_up(gross_sales_cents * flat_commission_pct)
      else:  # TIERED — FRESH_FOOD category sales are EXCLUDED from the tiered base
        tiered_base = sum(Sale.gross_cents for SETTLED sales whose slot's Product.category != FRESH_FOOD, in period)
        # marginal tier rates applied to the portion of tiered_base in each band:
        #   band 1: [0, 500000)      -> 0.08
        #   band 2: [500000, 1500000)-> 0.12
        #   band 3: [1500000, inf)   -> 0.15
        c = 0
        c += min(tiered_base, 500000) * 0.08
        if tiered_base > 500000:  c += (min(tiered_base, 1500000) - 500000) * 0.12
        if tiered_base > 1500000: c += (tiered_base - 1500000) * 0.15
        gross_commission_cents = round_half_up(c)
    input_set: "SETTLED Sales on this host's machines within [period_start, period_end); TIERED also filters by Product.category"
    constants:
      BAND1_CAP: 500000
      BAND2_CAP: 1500000
      BAND1_RATE: 0.08
      BAND2_RATE: 0.12
      BAND3_RATE: 0.15
    precision: "integer cents, round_half_up applied ONCE to the final commission sum (sum-then-round)"

  - name: shrink_chargeback
    trigger: "CommissionStatement finalize (recompute)"
    algorithm: aggregation
    formula: |
      # Host bears HOST_SHRINK_SHARE of shrink value over the period.
      # Rounding order pinned: round EACH visit's chargeback to cents, THEN sum
      # (round-per-line-then-sum) — contrast gross_commission's sum-then-round (mode b of Rule 2).
      total = 0
      for visit in RECONCILED RestockVisits on host's machines with reconcile time in [period_start, period_end):
        per_visit = round_half_up(visit.shrink_value_cents * HOST_SHRINK_SHARE)
        total += per_visit
      shrink_chargeback_cents = total
    input_set: "RECONCILED RestockVisits on this host's machines whose updated_at (reconcile time) falls in [period_start, period_end)"
    constants:
      HOST_SHRINK_SHARE: 0.50
    precision: "integer cents, round_half_up PER VISIT then sum (round-then-sum)"

  - name: net_commission
    trigger: "CommissionStatement finalize (recompute)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: gross_commission and shrink_chargeback are
      # computed first (both depend on the period filter), THEN net applies the
      # guarantee floor. Circular-looking because net feeds lifetime balance but
      # the guarantee is keyed off the computed gross/chargeback (mode c of Rule 2).
      raw_net = gross_commission_cents - shrink_chargeback_cents
      net_commission_cents = max(raw_net, monthly_guarantee_cents)
    input_set: "this statement's own computed gross_commission_cents, shrink_chargeback_cents, and host monthly_guarantee_cents"
    constants: {}
    precision: "integer cents"

  - name: cash_alert_check
    trigger: "CASH Sale settle and cash collection"
    algorithm: threshold
    formula: |
      threshold_cents = floor(cash_alert_threshold_pct * cash_capacity_cents)
      if cash_on_hand_cents >= threshold_cents: cash_status = CASH_FULL_WARN
      else: cash_status = CASH_OK
    input_set: "Machine.cash_on_hand_cents after the mutation"
    constants: {}
    precision: "integer cents; boundary is >= (at exactly threshold_cents it WARNS)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation (per RBAC matrix)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "Body foreign keys reference existing resources (machine_id, slot_id, product_id, host_site_id, route_id, driver_id, route_stop_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: "POST endpoints that carry FK fields"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for this transition (state-machine from: precondition)"
    error_id: "varies (ERR_VISIT_NOT_DRAFT, ERR_STATEMENT_NOT_OPEN, ERR_TICKET_NOT_OPEN, ERR_SALE_NOT_SETTLED, etc.)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "Cross-entity state guard: RestockVisit reconcile requires parent route DISPATCHED"
    error_id: ERR_ROUTE_NOT_DISPATCHED
    http_status: 409
    applies_to: "POST /operations/restock-visits/{visitId}/reconcile"

  - priority: 7
    category: business_safety
    check: "Sale and restock reconcile blocked when Machine.service_status == FROZEN"
    error_id: ERR_MACHINE_FROZEN
    http_status: 409
    applies_to: "POST /operations/sales, POST /operations/restock-visits/{visitId}/reconcile"

  - priority: 8
    category: business_referential
    check: "Every counted_lines.slot_id (reconcile) / Sale.slot_id belongs to the target machine and slot is ACTIVE"
    error_id: ERR_SLOT_NOT_ON_MACHINE
    http_status: 409
    applies_to: "POST /operations/sales, POST /operations/restock-visits/{visitId}/reconcile"

  - priority: 9
    category: business_temporal
    check: "RouteStop service window [window_start_min, window_end_min) must not overlap another stop assigned to the SAME driver on the SAME service_date (half-open; touching endpoints allowed)"
    error_id: ERR_DRIVER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /operations/routes/{routeId}/stops"

  - priority: 10
    category: business_temporal
    check: "CommissionStatement [period_start, period_end) must not overlap another statement for the SAME host_site_id (half-open on dates; an existing period_end equal to new period_start is allowed)"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /operations/commission-statements"

  - priority: 11
    category: business_constraint
    check: "Host site must be ACTIVE (not SUSPENDED) to place a machine or open a statement"
    error_id: ERR_HOST_SUSPENDED
    http_status: 409
    applies_to: "POST /operations/machines, POST /operations/commission-statements"

  - priority: 12
    category: business_constraint
    check: "PlanogramSlot par_level <= capacity, price_cents > 0, capacity > 0; slot_code unique within machine"
    error_id: ERR_INVALID_SLOT_CONFIG
    http_status: 422
    applies_to: "POST /operations/machines/{machineId}/slots"

  - priority: 13
    category: business_constraint
    check: "Restock refill_units + physical_count must not exceed slot.capacity for any line"
    error_id: ERR_SLOT_OVERFILL
    http_status: 422
    applies_to: "POST /operations/restock-visits/{visitId}/reconcile"

  - priority: 14
    category: business_constraint
    check: "Product assigned to a new slot must be ACTIVE (not DISCONTINUED)"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /operations/machines/{machineId}/slots"

  - priority: 15
    category: business_fiscal
    check: "Sale quantity must not exceed slot on_hand (sum of AVAILABLE lot remaining_units)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /operations/sales"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_machine_version on reconcile must equal current Machine.version"
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
    applies_to: "POST /operations/restock-visits/{visitId}/reconcile"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- HostSite ----
  - method: POST
    path: "/operations/host-sites"
    description: "Create a host site"
    roles: [FieldOps]
    code: 201
    input: [name, contact_email, "commission_model?", "flat_commission_pct?", "monthly_guarantee_cents?"]
    output: HostSite
    side_effects: ["status=ACTIVE", "lifetime_commission_cents=0"]
  - method: GET
    path: "/operations/host-sites"
    description: "List host sites"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "HostSite[]"
    side_effects: []
  - method: GET
    path: "/operations/host-sites/{hostSiteId}"
    description: "Get a host site"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: HostSite
    side_effects: []
  - method: POST
    path: "/operations/host-sites/{hostSiteId}/suspend"
    description: "Suspend a host site"
    roles: [FieldOps]
    code: 200
    input: []
    output: HostSite
    side_effects: ["status=SUSPENDED"]

  # ---- Product ----
  - method: POST
    path: "/operations/products"
    description: "Create a catalog product"
    roles: [FieldOps]
    code: 201
    input: [sku, name, category, unit_cost_cents, "shelf_life_days?"]
    output: Product
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/operations/products"
    description: "List products"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/operations/products/{productId}"
    description: "Get a product"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: PATCH
    path: "/operations/products/{productId}/cost"
    description: "Update a product's wholesale unit_cost_cents (affects only lots filled afterwards)"
    roles: [FieldOps]
    code: 200
    input: [unit_cost_cents]
    output: Product
    side_effects: ["unit_cost_cents updated; existing lots keep their snapshot cost"]
  - method: POST
    path: "/operations/products/{productId}/discontinue"
    description: "Discontinue a product"
    roles: [FieldOps]
    code: 200
    input: []
    output: Product
    side_effects: ["status=DISCONTINUED"]

  # ---- Machine ----
  - method: POST
    path: "/operations/machines"
    description: "Place a machine at a host site"
    roles: [FieldOps]
    code: 201
    input: [host_site_id, asset_tag, machine_type, "cash_capacity_cents?", "cash_alert_threshold_pct?", "par_fill_threshold_pct?"]
    output: Machine
    side_effects: ["stock_status=STOCKOUT (no slots yet)", "cash_status=CASH_OK", "service_status=IN_SERVICE", "cash_on_hand_cents=0"]
  - method: GET
    path: "/operations/machines"
    description: "List machines (filterable by host_site_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["host_site_id?", "limit?", "offset?"]
    output: "Machine[]"
    side_effects: []
  - method: GET
    path: "/operations/machines/{machineId}"
    description: "Get a machine (includes derived posture and version)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: Machine
    side_effects: []
  - method: POST
    path: "/operations/machines/{machineId}/cash-collections"
    description: "Record a cash collection (empties the vault)"
    roles: [FieldOps]
    code: 200
    input: []
    output: Machine
    side_effects: ["cash_on_hand_cents=0", "re-derive cash_status=CASH_OK", "increment Machine.version by 1"]

  # ---- PlanogramSlot ----
  - method: POST
    path: "/operations/machines/{machineId}/slots"
    description: "Add a planogram slot to a machine"
    roles: [FieldOps]
    code: 201
    input: [product_id, slot_code, capacity, par_level, price_cents]
    output: PlanogramSlot
    side_effects: ["on_hand=0", "status=ACTIVE", "re-derive Machine.stock_status"]
  - method: GET
    path: "/operations/machines/{machineId}/slots"
    description: "List slots on a machine (reverse-reachability for Slot.machine_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PlanogramSlot[]"
    side_effects: []
  - method: GET
    path: "/operations/slots"
    description: "List slots (filter by machine_id or product_id; reverse-reachability for PlanogramSlot.product_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["machine_id?", "product_id?", "limit?", "offset?"]
    output: "PlanogramSlot[]"
    side_effects: []
  - method: GET
    path: "/operations/slots/{slotId}"
    description: "Get a slot (includes derived on_hand)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: PlanogramSlot
    side_effects: []
  - method: PATCH
    path: "/operations/slots/{slotId}/price"
    description: "Change a slot's retail price"
    roles: [FieldOps]
    code: 200
    input: [price_cents]
    output: PlanogramSlot
    side_effects: ["price_cents updated (does not retro-price prior sales)"]

  # ---- InventoryLot ----
  - method: GET
    path: "/operations/slots/{slotId}/lots"
    description: "List inventory lots in a slot (reverse-reachability for Lot.slot_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/operations/lots"
    description: "List inventory lots (filter by slot_id, machine_id, or restock_visit_id; reverse-reachability for Lot.slot_id, Lot.machine_id, Lot.restock_visit_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["slot_id?", "machine_id?", "restock_visit_id?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/operations/lots/{lotId}"
    description: "Get a lot"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/operations/machines/{machineId}/spoilage-purge"
    description: "Purge expired lots on a machine (FIFO spoilage sweep at the current clock)"
    roles: [FieldOps]
    code: 200
    input: []
    output: Machine
    side_effects:
      - "every AVAILABLE lot whose expiration_date <= current clock: remaining_units=0, status=SPOILED [cascade hop 1]"
      - "recompute affected PlanogramSlot.on_hand [cascade hop 2]"
      - "re-derive Machine.stock_status [cascade hop 3]"

  # ---- RouteDriverProfile ----
  - method: POST
    path: "/operations/drivers"
    description: "Create a route driver profile"
    roles: [FieldOps]
    code: 201
    input: [full_name, employee_code]
    output: RouteDriverProfile
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/operations/drivers"
    description: "List drivers"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteDriverProfile[]"
    side_effects: []
  - method: GET
    path: "/operations/drivers/{driverId}"
    description: "Get a driver"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: RouteDriverProfile
    side_effects: []

  # ---- RestockRoute ----
  - method: POST
    path: "/operations/routes"
    description: "Create a restock route (DRAFT)"
    roles: [FieldOps]
    code: 201
    input: [driver_id, service_date]
    output: RestockRoute
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/operations/routes"
    description: "List routes (filter by driver_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["driver_id?", "limit?", "offset?"]
    output: "RestockRoute[]"
    side_effects: []
  - method: GET
    path: "/operations/routes/{routeId}"
    description: "Get a route"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: RestockRoute
    side_effects: []
  - method: POST
    path: "/operations/routes/{routeId}/stops"
    description: "Add a stop to a DRAFT route"
    roles: [FieldOps]
    code: 201
    input: [machine_id, window_start_min, window_end_min]
    output: RouteStop
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/operations/routes/{routeId}/stops"
    description: "List stops for a route (reverse-reachability for RouteStop.route_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []
  - method: POST
    path: "/operations/routes/{routeId}/dispatch"
    description: "Dispatch a route: compute pre-kits and lock the route"
    roles: [FieldOps]
    code: 200
    input: []
    output: RestockRoute
    side_effects: ["each stop prekit_json computed", "each stop status=KITTED", "route status=DISPATCHED"]
  - method: POST
    path: "/operations/routes/{routeId}/close"
    description: "Close a dispatched route once all stops resolved"
    roles: [FieldOps]
    code: 200
    input: []
    output: RestockRoute
    side_effects: ["route status=CLOSED"]

  # ---- RouteStop reverse reachability for machine_id ----
  - method: GET
    path: "/operations/stops"
    description: "List route stops (filter by machine_id; reverse-reachability for RouteStop.machine_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["machine_id?", "route_id?", "limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []
  - method: GET
    path: "/operations/stops/{stopId}"
    description: "Get a route stop"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  # ---- RestockVisit ----
  - method: POST
    path: "/operations/restock-visits"
    description: "Open a DRAFT restock visit for a kitted stop (driver records counts)"
    roles: [RouteDriver]
    code: 201
    input: [route_stop_id, counted_lines, expected_machine_version]
    output: RestockVisit
    side_effects: ["status=DRAFT", "total_shrink_units/shrink_value_cents computed on reconcile, not here"]
  - method: GET
    path: "/operations/restock-visits"
    description: "List restock visits (filter by route_stop_id or machine_id; reverse-reachability for RestockVisit.route_stop_id and machine_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["route_stop_id?", "machine_id?", "limit?", "offset?"]
    output: "RestockVisit[]"
    side_effects: []
  - method: GET
    path: "/operations/restock-visits/{visitId}"
    description: "Get a restock visit"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: RestockVisit
    side_effects: []
  - method: POST
    path: "/operations/restock-visits/{visitId}/reconcile"
    description: "Reconcile a visit: apply refills (create lots), compute shrink, advance machine"
    roles: [RouteDriver]
    code: 200
    input: [expected_machine_version]
    output: RestockVisit
    side_effects:
      - "compute total_shrink_units, shrink_value_cents"
      - "create InventoryLot per refill line [cascade hop 1]"
      - "recompute PlanogramSlot.on_hand [cascade hop 2]"
      - "re-derive Machine.stock_status [cascade hop 3]"
      - "increment Machine.version by 1"
      - "RouteStop.status=VISITED"
  - method: POST
    path: "/operations/restock-visits/{visitId}/reject"
    description: "Reject a DRAFT visit (no inventory applied)"
    roles: [FieldOps]
    code: 200
    input: []
    output: RestockVisit
    side_effects: ["status=REJECTED", "RouteStop.status=SKIPPED"]

  # ---- Sale ----
  - method: POST
    path: "/operations/sales"
    description: "Record a cashless or cash sale (FIFO lot draw)"
    roles: [FieldOps, HostManager]
    code: 201
    input: [machine_id, slot_id, quantity, payment_method, "settlement_status?"]
    output: Sale
    side_effects:
      - "snapshot unit_price_cents from slot.price_cents; gross_cents=quantity*unit_price_cents"
      - "compute provisional_cogs_cents (weighted-average)"
      - "FIFO draw lots -> lot_consumption_json; decrement remaining_units; DEPLETED lots"
      - "recompute slot.on_hand; re-derive Machine.stock_status"
      - "if CASH: cash_on_hand_cents += gross_cents; re-derive cash_status"
  - method: GET
    path: "/operations/sales"
    description: "List sales (filter by machine_id or slot_id; reverse-reachability for Sale.machine_id and Sale.slot_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["machine_id?", "slot_id?", "limit?", "offset?"]
    output: "Sale[]"
    side_effects: []
  - method: GET
    path: "/operations/sales/{saleId}"
    description: "Get a sale (includes lot_consumption_json and provisional_cogs_cents)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/operations/sales/{saleId}/void"
    description: "Void a settled sale (compensating reversal of inventory and cash)"
    roles: [FieldOps]
    code: 200
    input: []
    output: Sale
    side_effects:
      - "restore remaining_units per lot_consumption_json [compensation]"
      - "revert DEPLETED lots to AVAILABLE"
      - "recompute slot.on_hand; re-derive Machine.stock_status"
      - "if CASH: cash_on_hand_cents -= gross_cents; re-derive cash_status"

  # ---- CommissionStatement ----
  - method: POST
    path: "/operations/commission-statements"
    description: "Open a commission statement for a host over a period"
    roles: [FinanceClerk]
    code: 201
    input: [host_site_id, period_start, period_end]
    output: CommissionStatement
    side_effects: ["status=OPEN", "all computed amounts recomputed on read and on finalize"]
  - method: GET
    path: "/operations/commission-statements"
    description: "List commission statements (filter by host_site_id; reverse-reachability for CommissionStatement.host_site_id)"
    roles: [FieldOps, HostManager, FinanceClerk]
    code: 200
    input: ["host_site_id?", "limit?", "offset?"]
    output: "CommissionStatement[]"
    side_effects: []
  - method: GET
    path: "/operations/commission-statements/{statementId}"
    description: "Get a commission statement (recomputes amounts while OPEN)"
    roles: [FieldOps, HostManager, FinanceClerk]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["while OPEN: gross_sales/shrink_chargeback/gross_commission/net_commission recomputed live"]
  - method: POST
    path: "/operations/commission-statements/{statementId}/finalize"
    description: "Finalize a statement: freeze amounts, credit host lifetime balance"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["recompute all amounts", "HostSite.lifetime_commission_cents += net_commission_cents", "status=FINALIZED"]

  # ---- ServiceTicket ----
  - method: POST
    path: "/operations/machines/{machineId}/service-tickets"
    description: "Open a service ticket on a machine"
    roles: [FieldOps, HostManager]
    code: 201
    input: [issue_type, "blocking?"]
    output: ServiceTicket
    side_effects: ["status=OPEN", "if blocking: Machine.service_status=FROZEN"]
  - method: GET
    path: "/operations/machines/{machineId}/service-tickets"
    description: "List service tickets on a machine (reverse-reachability for ServiceTicket.machine_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []
  - method: GET
    path: "/operations/service-tickets"
    description: "List service tickets (filter by machine_id; reverse-reachability for ServiceTicket.machine_id)"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: ["machine_id?", "limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []
  - method: GET
    path: "/operations/service-tickets/{ticketId}"
    description: "Get a service ticket"
    roles: [FieldOps, RouteDriver, HostManager, FinanceClerk]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: POST
    path: "/operations/service-tickets/{ticketId}/start"
    description: "Begin work on an OPEN or REOPENED ticket"
    roles: [FieldOps]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=IN_PROGRESS"]
  - method: POST
    path: "/operations/service-tickets/{ticketId}/resolve"
    description: "Resolve an in-progress ticket"
    roles: [FieldOps]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=RESOLVED", "if no blocking ticket remains active: Machine.service_status=IN_SERVICE"]
  - method: POST
    path: "/operations/service-tickets/{ticketId}/reopen"
    description: "Reopen a resolved ticket (recurring fault)"
    roles: [FieldOps]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=REOPENED", "if blocking: Machine.service_status=FROZEN"]

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/operations/_clock/set_current_utc"
    description: "Test-driving: set the server clock used for expiration_date stamping and spoilage purge"
    roles: [FieldOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to the given UTC instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or wrong type" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_SLOT_CONFIG, http: 422, condition: "Slot par_level>capacity, non-positive capacity/price, or duplicate slot_code within machine" }
  - { id: ERR_DUPLICATE_SKU, http: 422, condition: "Product sku already exists" }
  - { id: ERR_DUPLICATE_ASSET_TAG, http: 422, condition: "Machine asset_tag already exists" }
  # --- not found ---
  - { id: ERR_HOST_SITE_NOT_FOUND, http: 404, condition: "Referenced host site does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Referenced product does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "Referenced machine does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "Referenced slot does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Referenced lot does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Referenced driver does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Referenced route does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "Referenced route stop does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Referenced restock visit does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "Referenced sale does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Referenced commission statement does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced service ticket does not exist" }
  # --- state ---
  - { id: ERR_VISIT_NOT_DRAFT, http: 409, condition: "Reconcile/reject requires visit in DRAFT" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Reconcile requires the parent route to be DISPATCHED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Dispatch requires the route to have at least one stop" }
  - { id: ERR_STOPS_UNRESOLVED, http: 409, condition: "Close requires every stop VISITED or SKIPPED" }
  - { id: ERR_DRIVER_INACTIVE, http: 409, condition: "Dispatch requires the assigned driver to be ACTIVE" }
  - { id: ERR_STATEMENT_NOT_OPEN, http: 409, condition: "Finalize requires statement in OPEN" }
  - { id: ERR_VISITS_PENDING, http: 409, condition: "Finalize blocked while a DRAFT visit exists on the host's machines within the period" }
  - { id: ERR_SALE_NOT_SETTLED, http: 409, condition: "Void requires the sale to be SETTLED" }
  - { id: ERR_TICKET_NOT_OPEN, http: 409, condition: "Start requires ticket OPEN" }
  - { id: ERR_TICKET_NOT_REOPENED, http: 409, condition: "Start from reopened path requires ticket REOPENED" }
  - { id: ERR_TICKET_NOT_IN_PROGRESS, http: 409, condition: "Resolve requires ticket IN_PROGRESS" }
  - { id: ERR_TICKET_NOT_RESOLVED, http: 409, condition: "Reopen requires ticket RESOLVED" }
  # --- business ---
  - { id: ERR_MACHINE_FROZEN, http: 409, condition: "Sale or reconcile attempted while machine service_status=FROZEN" }
  - { id: ERR_SLOT_NOT_ON_MACHINE, http: 409, condition: "Slot referenced does not belong to the target machine or is RETIRED" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Adding a DISCONTINUED product to a new slot" }
  - { id: ERR_SLOT_OVERFILL, http: 422, condition: "refill_units + physical_count exceeds slot capacity on a reconcile line" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Sale quantity exceeds slot on_hand (FIFO walk runs short)" }
  - { id: ERR_DRIVER_WINDOW_OVERLAP, http: 409, condition: "Route stop window overlaps another stop for the same driver on the same service_date" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Statement period overlaps an existing statement for the same host" }
  - { id: ERR_HOST_SUSPENDED, http: 409, condition: "Placing a machine or opening a statement against a SUSPENDED host" }
  # --- concurrency ---
  - { id: ERR_STALE_MACHINE_VERSION, http: 412, condition: "expected_machine_version does not match current Machine.version on reconcile" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FieldOps
    description: "Operations technician: provisions catalog/machines/slots/routes, dispatches, services machines, collects cash, voids sales, rejects visits"
    identity: opaque
    exclusive_operations:
      - "POST /operations/host-sites — create host site"
      - "POST /operations/host-sites/{id}/suspend — suspend host"
      - "POST /operations/products — create product"
      - "POST /operations/products/{id}/discontinue — discontinue product"
      - "POST /operations/machines — place machine"
      - "POST /operations/machines/{id}/cash-collections — collect cash"
      - "POST /operations/machines/{id}/slots — add slot"
      - "PATCH /operations/slots/{id}/price — change price"
      - "POST /operations/machines/{id}/spoilage-purge — purge expired lots"
      - "POST /operations/drivers — create driver"
      - "POST /operations/routes — create route"
      - "POST /operations/routes/{id}/stops — add stop"
      - "POST /operations/routes/{id}/dispatch — dispatch route"
      - "POST /operations/routes/{id}/close — close route"
      - "POST /operations/restock-visits/{id}/reject — reject visit"
      - "POST /operations/sales/{id}/void — void sale"
      - "POST /operations/service-tickets/{id}/start — start ticket"
      - "POST /operations/service-tickets/{id}/resolve — resolve ticket"
      - "POST /operations/service-tickets/{id}/reopen — reopen ticket"
      - "POST /operations/_clock/set_current_utc — set test clock"
    shared_operations:
      - "POST /operations/sales — record sale (shared with HostManager)"
      - "POST /operations/machines/{id}/service-tickets — open ticket (shared with HostManager)"
      - "GET endpoints (shared with all roles)"

  - name: RouteDriver
    description: "Field driver: opens and reconciles restock visits during a dispatched route"
    identity: "entity_backed:RouteDriverProfile"
    exclusive_operations:
      - "POST /operations/restock-visits — open draft visit"
      - "POST /operations/restock-visits/{id}/reconcile — reconcile visit"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: HostManager
    description: "Host-site staff: views their statements, opens service tickets, records sales at the kiosk"
    identity: "entity_backed:HostSite"
    exclusive_operations: []
    shared_operations:
      - "POST /operations/sales — record sale (shared with FieldOps)"
      - "POST /operations/machines/{id}/service-tickets — open ticket (shared with FieldOps)"
      - "GET endpoints (shared with all roles)"

  - name: FinanceClerk
    description: "Finance back-office: opens and finalizes commission statements"
    identity: opaque
    exclusive_operations:
      - "POST /operations/commission-statements — open statement"
      - "POST /operations/commission-statements/{id}/finalize — finalize statement"
    shared_operations:
      - "GET endpoints (shared with all roles)"
