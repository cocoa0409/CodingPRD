          The conserved quantity is the agency's proceeds ledger: SUM(Agency.proceeds_account_balance_cents)
          must always equal SUM(ProceedsDistribution.net_to_agency_cents WHERE status == POSTED). The
          reversal is a recomputation over the surviving POSTED rows rather than a subtraction, so the
