  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_half_open_overlap_semantics
        grounds:
          - validations[priority=8]
          - errors.ERR_LINE_WINDOW_CONFLICT
          - entities.ProductionRun.fields.line_index
        distinguishing_aspect: "Resource = factory production line, HALF-OPEN day intervals: run A occupies [09-07, 09-11) and run B [09-11, 09-14) — touching at 09-11 is ALLOWED; run C [09-10, 09-12) intersects A's interior and is rejected at reserve with ERR_LINE_WINDOW_CONFLICT."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. DOMESTIC factory with exactly 1 line (capacity 1000)."
            - "Model MWIN (one IMPORT_ALLOWED thread line; lot 1000 @100). Week 2026-W36 allocation total 100."
            - "Runs A [2026-09-07, 2026-09-11), B [2026-09-11, 2026-09-14), C [2026-09-10, 2026-09-12), all STOCK 10 units on line 1, all created before lock (domestic pool 30)."
          setup_api_calls:
            - *c_clk
            - *c_fac_95
            - *c_comp_thread
            - *c_lot_thread
            - &c_model_win
              call: "POST /footwear/models"
              payload: { style_code: "MWIN", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *c_alloc_100
            - &c_run_wa
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { ra: $.data.id }
            - &c_run_wb
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-11", end_day: "2026-09-14", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { rb: $.data.id }
            - &c_run_wc
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-10", end_day: "2026-09-12", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { rc: $.data.id }
            - *c_lock_a100
            - &c_reserve_wa
              call: "POST /footwear/production-runs/${ra}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - &c_reserve_wb
              call: "POST /footwear/production-runs/${rb}/reserve-materials"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /footwear/production-runs/${rc}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "run B reserve succeeded even though B.start_day == A.end_day (2026-09-11): half-open [start_day, end_day) adjacency is not a conflict"
            - "run C reserve: status 409, err == ERR_LINE_WINDOW_CONFLICT ([09-10, 09-12) intersects A's [09-07, 09-11) on line 1)"
            - "run C stays PLANNED; only 20 units of thread are consumed (lot remaining 980)"

      - name: contract_window_closed_interval_overlap_semantics
        grounds:
          - validations[priority=8]
          - errors.ERR_GOV_CONTRACT_WINDOW_CONFLICT
          - entities.GovContract.fields.fulfillment_end
        distinguishing_aspect: "Resource = factory hosting a government contract, CLOSED date intervals: contract 1 occupies [2026-10-01, 2026-10-31] INCLUSIVE, so contract 2 starting exactly 2026-10-31 CONFLICTS (touching endpoints collide — the opposite of the half-open line-window semantics); contract 3 starting 2026-11-01 is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DOMESTIC factory; model MGOV2 (DOMESTIC_ONLY) — contract creation checks the window only, not Berry content."
          setup_api_calls:
            - *c_clk
            - *c_fac_dom
            - *c_comp_upper
            - &c_model_gov2
              call: "POST /footwear/models"
              payload: { style_code: "MGOV2", production_policy: "DOMESTIC_ONLY", base_price_cents: 20000, import_cost_basis_cents: 8000, bom_lines: [ { component_id: "${c_up}", quantity_per_pair: 1.0, sourcing_requirement: "DOMESTIC_REQUIRED", planned_unit_cost_cents: 500, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - &c_contract_w1
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-100", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 10, fulfillment_start: "2026-10-01", fulfillment_end: "2026-10-31" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          trigger:
            - &c_contract_w2
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-101", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 10, fulfillment_start: "2026-10-31", fulfillment_end: "2026-11-15" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - &c_contract_w3
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-102", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 10, fulfillment_start: "2026-11-01", fulfillment_end: "2026-11-30" }
              as: PlatformAdmin
              captures: { g3: $.data.id }
          assert:
            - "contract G-101 is rejected: status 409, err == ERR_GOV_CONTRACT_WINDOW_CONFLICT — closed intervals treat shared endpoint 2026-10-31 as overlap"
            - "contract G-102 is created (201, status AWARDED): 2026-11-01 is strictly after G-100's inclusive end 2026-10-31"
            - "the two rules differ in interval semantics: for production lines touching days are allowed, for contract windows they collide"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capacity_shift_conserves_total_reserved_units
        grounds:
          - state_machines.CapacityAllocation.LOCKED_to_LOCKED
          - concurrency_rules[allocation-shift-stale-version]
          - entities.CapacityAllocation.fields.domestic_reserved_units
          - entities.CapacityAllocation.fields.import_reserved_units
        distinguishing_aspect: "Conserved quantity = pool sum: domestic_reserved_units + import_reserved_units MUST equal total_reserved_units (100) after every shift; the forward shift TO_DOMESTIC 20 and its compensation TO_IMPORT 20 return the pools to exactly (30, 70)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. DOMESTIC factory; model MSHIFT; week 2026-W36 allocation total 100."
            - "One STOCK run of 30 units created before lock -> waterfall yields domestic 30 / import 70."
          setup_api_calls:
            - *c_clk
            - *c_fac_dom
            - *c_comp_thread
            - *c_lot_thread
            - &c_model_shift
              call: "POST /footwear/models"
              payload: { style_code: "MSHIFT", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *c_alloc_100
            - &c_run_shift30
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 30, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_id: $.data.id }
            - &c_lock_a100b
              call: "POST /footwear/capacity-allocations/${a_id}/lock"
              payload: {}
              as: PlatformAdmin
              captures: { a_v: $.data.version, a_dom: $.data.domestic_reserved_units, a_imp: $.data.import_reserved_units }
          trigger:
            - &c_shift_fwd
              call: "POST /footwear/capacity-allocations/${a_id}/shift"
              payload: { direction: "TO_DOMESTIC", units: 20, expected_allocation_version: "${a_v}" }
              as: PlatformAdmin
              captures: { a_v2: $.data.version, a_dom2: $.data.domestic_reserved_units, a_imp2: $.data.import_reserved_units }
            - &c_shift_back
              call: "POST /footwear/capacity-allocations/${a_id}/shift"
              payload: { direction: "TO_IMPORT", units: 20, expected_allocation_version: "${a_v2}" }
              as: PlatformAdmin
              captures: { a_dom3: $.data.domestic_reserved_units, a_imp3: $.data.import_reserved_units }
          assert:
            - "after lock: a_dom == 30 and a_imp == 70 (waterfall over demand 30), sum 100 == total_reserved_units"
            - "after TO_DOMESTIC 20: a_dom2 == 50 and a_imp2 == 30, sum still 100"
            - "after the compensating TO_IMPORT 20: a_dom3 == 30 and a_imp3 == 70 — the pair conserves the pool total exactly"

      - name: lot_reserve_release_conserves_received_quantity
        grounds:
          - state_machines.ProductionRun.PLANNED_to_MATERIAL_RESERVED
          - state_machines.ProductionRun.MATERIAL_RESERVED_to_PLANNED
          - entities.MaterialLot.fields.quantity_remaining
          - calculations.fifo_lot_consumption
        distinguishing_aspect: "Conserved quantity = lot stock identity: quantity_received == quantity_remaining + live consumption at all times; reserve (consume 200) followed by its compensating release returns quantity_remaining to exactly quantity_received (500) with run.consumed_lots empty — no drift in the named quantity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. DOMESTIC factory; model MCONS (one IMPORT_ALLOWED thread line 1.0/pair); thread lot of 500 units @100."
            - "Week 2026-W36 allocation total 500; STOCK run of 200 units created before lock (domestic pool 200)."
          setup_api_calls:
            - *c_clk
            - *c_fac_dom
            - *c_comp_thread
            - &c_lot_500
              call: "POST /footwear/lots"
              payload: { component_id: "${c_t}", supplier_name: "Fall River Mills", is_domestic: true, quantity_received: 500, unit_cost_cents: 100 }
              as: SourcingManager
              captures: { l_t: $.data.id }
            - &c_model_cons
              call: "POST /footwear/models"
              payload: { style_code: "MCONS", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - &c_alloc_500
              call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W36", total_reserved_units: 500 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - &c_run_200
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 200, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_id: $.data.id }
            - &c_lock_a500
              call: "POST /footwear/capacity-allocations/${a_id}/lock"
              payload: {}
              as: PlatformAdmin
          trigger:
            - *c_reserve
            - &c_cons_lot_read1
              call: "GET /footwear/lots/${l_t}"
              payload: {}
              as: SourcingManager
              captures: { rem_mid: $.data.quantity_remaining }
            - &c_cons_release
              call: "POST /footwear/production-runs/${r_id}/release-materials"
              payload: {}
              as: ProductionPlanner
            - &c_cons_lot_read2
              call: "GET /footwear/lots/${l_t}"
              payload: {}
              as: SourcingManager
              captures: { rem_end: $.data.quantity_remaining }
          assert:
            - "after reserve: rem_mid == 300 and the run holds consumed_lots [{ lot_id: ${l_t}, units_consumed: 200 }] — invariant: 500 == 300 + 200"
            - "after release: rem_end == 500 == quantity_received and run.consumed_lots == [] — invariant: 500 == 500 + 0"
            - "the forward/compensating pair leaves MaterialLot.version reflecting both mutations while the conserved quantity is bit-identical"
