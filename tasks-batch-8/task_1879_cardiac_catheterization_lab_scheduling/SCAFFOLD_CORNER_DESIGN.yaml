      - name: room_out_of_service_and_return_cycle
        claim_type: valid_transition
        grounds: ["state_machines.CathLabRoom"]
        distinguishing_aspect: "CathLabRoom cycles ACTIVE -> OUT_OF_SERVICE -> ACTIVE via PATCH; setting the current status is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One ACTIVE room with no scheduled cases"]
          setup_api_calls:
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
          trigger:
            - call: "PATCH /cath-lab/rooms/${room1_id}"
              payload: { status: OUT_OF_SERVICE }
              as: CathLabScheduler
              captures: { st1: $.data.status }
            - call: "PATCH /cath-lab/rooms/${room1_id}"
              payload: { status: OUT_OF_SERVICE }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
            - call: "PATCH /cath-lab/rooms/${room1_id}"
              payload: { status: ACTIVE }
              as: CathLabScheduler
              captures: { st2: $.data.status }
          assert:
            - "First PATCH: status == OUT_OF_SERVICE"
            - "Setting current status again: HTTP 400 ERR_INVALID_REQUEST"
            - "Return PATCH: status == ACTIVE"

      - name: room_deactivation_with_scheduled_case_returns_resource_in_use
        claim_type: precondition_enforcement
        grounds: ["state_machines.CathLabRoom", "errors[ERR_RESOURCE_IN_USE]"]
        distinguishing_aspect: "A room with a SCHEDULED case cannot go OUT_OF_SERVICE (ERR_RESOURCE_IN_USE); after the case is cancelled, deactivation succeeds."
        test_recipe:
          setup: ["URGENT case SCHEDULED on room R"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
