      - name: preclearance_info_requested_resubmit_cycle
        grounds:
          - state_machines.PreclearanceRequest.SUBMITTED_to_INFO_REQUESTED
          - state_machines.PreclearanceRequest.INFO_REQUESTED_to_SUBMITTED
          - state_machines.PreclearanceRequest.SUBMITTED_to_APPROVED
          - entities.PreclearanceRequest.fields.revision_count
          - calculations.preclearance_validity
          - validations[priority=66]
          - errors[ERR_MAX_PRECLEARANCE_REVISIONS_EXCEEDED]
        distinguishing_aspect: |
          The cyclic entity here is PreclearanceRequest, not Grant: SUBMITTED ->
          INFO_REQUESTED -> SUBMITTED is traversable twice, the counter lives on
          revision_count and is bumped by resubmit while the cap is enforced on
          decide/REQUEST_INFO, and the loop exit is an APPROVE that stamps valid_until at
