        test_recipe:
          setup: ["OPEN period and beneficiary exist"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-V1", aco_name: "V1", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
