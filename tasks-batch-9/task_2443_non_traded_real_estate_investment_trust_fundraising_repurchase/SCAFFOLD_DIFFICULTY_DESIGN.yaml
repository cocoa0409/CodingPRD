            - "NavRecord.${nav_aug_id}.nav_per_share_cents == 1000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: repurchase_hardship_tier_then_prorata_leftover_allocation
        grounds:
          - calculations.repurchase_allocation_waterfall
          - calculations.repurchase_capacity
          - calculations.early_repurchase_deduction
          - entities.RepurchasePeriod.fields.capacity_cents
          - entities.RepurchaseRequest.fields.approved_value_cents
          - state_machines.RepurchasePeriod.OPEN_to_PROCESSED
        distinguishing_aspect: |
          Three interacting stages compose in a fixed order — capacity is the
          minimum of the monthly and quarterly caps (600000), the hardship tier is
          satisfied in full first (300000), and only the 300000 residue is split
          pro rata with the one-cent floor remainder handed to the earliest
          created_at — so request A settles at exactly 200000 rather than the
          199999 a bare floor would give or the 200000.5 a single-stage share
          would suggest.
        test_recipe:
          setup:
            - "Offering 'Harborline Diversified REIT' EFFECTIVE, escrow BROKEN, one zero-fee class I at a PUBLISHED NAV of 1000 cents, 300000000 e4 outstanding, aggregate_nav_cents 30000000."
            - "Three investors each holding one OPEN lot of 100000000 e4 issued 2026-08-01."
            - "RepurchasePeriod 2026-09 OPEN, window [2026-09-03T00:00:00Z, 2026-09-25T00:00:00Z), settlement_date 2026-09-30, quarter_key 2026-Q3 with no other processed period."
            - "Three QUEUED requests created in order A (4000000 e4, NONE), B (3000000 e4, DEATH), C (2000010 e4, NONE); clock advanced past the cutoff before processing."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Harborline Diversified REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
