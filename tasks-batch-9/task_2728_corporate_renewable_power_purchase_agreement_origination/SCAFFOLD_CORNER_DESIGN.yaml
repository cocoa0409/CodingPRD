        excluded_because:
          difficulty_instance: boundary_precision_check / credit_tier_at_exact_standard_threshold_62_00
          rationale: "The named §1.8 instance tests the STANDARD boundary at exactly 62.00 and at the 0.01 step below it, which is the threshold-1 / threshold / threshold+1 walk for this calculation."

