  # ------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_reapproval_cycle
        grounds:
          - state_machines.Offer.EXTENDED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_PENDING_APPROVAL
          - state_machines.Offer.COUNTERED_to_APPROVED
          - calculations.concession_authority
        distinguishing_aspect: |
          Cycle on the OFFER entity: APPROVED -> LETTER_GENERATED -> EXTENDED ->
          COUNTERED -> (accepted counter with band escalation IN_BAND ->
          EXCEPTION, concession 20% exceeding Recruiter 5% and HiringManager 10%
          caps) -> PENDING_APPROVAL -> APPROVED -> LETTER_GENERATED -> EXTENDED,
          proving the machine loops rather than terminating at APPROVED.
        test_recipe:
          setup:
            - "Policy rows for ABOVE_BAND/EXCEPTION chain exist; requisition (L5/T1 standard range, budget 80000000, headcount 1) OPEN; three L5/T1 peers"
            - "Offer base 20000000 pct 0 equity 0 -> submitted, HM-approved, letter generated, extended at default clock (expires 2026-08-11T00:00:00Z)"
