          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "An AccountManager calling POST /commission-statements/{id}/pay (TrustAccountant-exclusive) returns ERR_UNAUTHORIZED 403 (peer-role isolation)."
        test_recipe:
          setup: ["a FINALIZED statement exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /producers"
              payload: { full_name: "Prod RB2", npn: "NPN-RB2", default_split_pct: 1.0 }
