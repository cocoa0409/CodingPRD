              captures: { assigned_trailer: $.data.trailer_id, assign_peak: $.data.peak_case_load }
            - call: "POST /fleet/trips/${trip_id}/plan"
              payload: {}
              as: FleetPlanner
              captures: { trip_status_final: $.data.plan_status, planned_peak: $.data.peak_case_load }
          assert:
            - "${temp_err} == ERR_TEMPERATURE_MODE_MISMATCH with HTTP 422 and ${dry_status} == AVAILABLE - the trailer_type objection is reported although the DRY_VAN has 1800 cases of room"
            - "${cap_err} == ERR_TRAILER_CAPACITY_EXCEEDED with HTTP 422 - the REEFER clears the temperature check and then fails 600 <= 599 by one case"
            - "${reefer_status} == AVAILABLE - a refused assignment locks nothing"
            - "${assigned_trailer} == ${r600_id} with HTTP 200 and ${assign_peak} == 600 - a peak exactly equal to capacity_cases passes the inclusive gate"
            - "${trip_status_final} == PLANNED and ${planned_peak} == 600 - the plan call re-runs the same capacity gate and reaches the same verdict"

