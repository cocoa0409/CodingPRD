# =============================================================================
# Scaffold: Closed-Loop Social Care Referral Network & Outcome Confirmation
# (Unite Us-style community care coordination platform)
# =============================================================================

scenario: |
  Closed-Loop Social Care Referral Network & Outcome Confirmation (Unite Us):
  community-based organization onboarding with service taxonomy, eligibility
  criteria and capacity declarations, referral creation from a clinical or
  community setting with client consent for information sharing, referral
  routing to an accepting organization with decline and reassignment handling,
  closed-loop confirmation that the service was delivered or the client was
  not reached, network coordinator oversight of unresolved and aging referrals,
  outcome and demographic reporting to funders including health plans and
  public agencies, payment enablement where an organization is reimbursed for
  delivered social services, data sharing agreements and consent revocation
  propagation.

domain_name: closed-loop-social-care-referral
api_prefix: /care-network

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: compliance-audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CareNetwork
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network name" }
      - { name: coordinator_org_name, type: string, source: input, description: "Backbone/coordinating organization name" }
      - { name: max_reassignment_count, type: integer, source: input, default: 3, description: "Maximum times a referral may be reassigned (rejected/withdrawn accepts) before it must be cancelled; boundary: a 4th decline is rejected" }
      - { name: auto_accept_window_hours, type: integer, source: input, default: 72, description: "Hours a ROUTED referral may sit before coordinator escalates (aging metric uses strict >)" }
      - { name: unresolved_aging_days, type: integer, source: input, default: 30, description: "Days after creation a non-terminal referral counts as aging (strict >)" }
      - { name: referral_expiry_days, type: integer, source: input, default: 60, description: "Days a referral may sit in ROUTED with no accept before the aging sweep expires it (strict >); deliberately decoupled from unresolved_aging_days so aging-but-not-expired referrals are observable" }
      - { name: network_escrow_cents, type: integer, source: input, default: 0, description: "Network-level clearing account used to settle clawbacks when a receiver's balance is insufficient" }
      - { name: network_escrow_reserved_cents, type: integer, source: computed, default: 0, description: "Total escrow reserved for VOIDED PaymentClaims awaiting clawback settlement (escrow_hold invariant: equals sum over PaymentClaims in VOIDED of their clawback_reserve_cents)" }

  - name: ServiceTaxonomyCategory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short taxonomy code, unique across the network (e.g. FOOD, HOUSING, TRANSPORT)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED categories reject new ServiceOfferings and new Referrals naming them" }

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization legal name" }
      - { name: org_type, type: enum, source: input, description: "CBO | CLINIC | FUNDER — CBO=community-based org, CLINIC=clinical sender, FUNDER=health plan / public agency" }
      - { name: funder_type, type: enum, source: input, description: "HEALTH_PLAN | PUBLIC_AGENCY | NONE — meaningful only when org_type=FUNDER; NONE otherwise" , default: NONE}
      - { name: ein, type: string, source: input, description: "Tax id; unique across network" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: suspension_reason, type: string, source: input, description: "Reason captured at suspension; null otherwise", default: null }
      - { name: payable_balance_cents, type: integer, source: computed, default: 0, description: "Reimbursable balance accrued from APPROVED claims, decremented by disbursements; never negative" }

  - name: ServiceOffering
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; owning provider org" }
      - { name: category_code, type: string, source: input, description: "FK-like reference to ServiceTaxonomyCategory.code (string code, must be ACTIVE at creation)" }
      - { name: description, type: string, source: input, description: "Human description of the service" }
      - { name: min_client_age, type: integer, source: input, default: 0, description: "Eligibility: client age must be >= this" }
      - { name: max_client_age, type: integer, source: input, default: 150, description: "Eligibility: client age must be <= this" }
      - { name: eligible_zip_codes, type: array, source: input, default: [], description: "Eligibility: empty array = all zips accepted; otherwise client zip must be a member" }
      - { name: eligible_genders, type: array, source: input, default: ["ANY"], description: "Eligibility: contains ANY or the client's gender value" }
      - { name: income_cap_annual_cents, type: integer, source: input, default: null, description: "Eligibility: null = no income test; otherwise client annual income must be strictly below this cap" }
      - { name: capacity_total, type: integer, source: input, description: "Declared caseload capacity (>= 1)" }
      - { name: capacity_consumed, type: integer, source: computed, default: 0, description: "Count of this org's ACCEPTED referrals routed to this offering (case_reservation invariant)" }
      - { name: capacity_available, type: integer, source: computed, description: "capacity_total - capacity_consumed; never negative" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED — PAUSED blocks new routing" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for age evaluation at referral creation" }
      - { name: zip_code, type: string, source: input, description: "Residential zip; eligibility input" }
      - { name: gender, type: enum, source: input, description: "FEMALE | MALE | NONBINARY | UNDISCLOSED" }
      - { name: annual_income_cents, type: integer, source: input, default: null, description: "Self-reported annual income; null = undisclosed (income-cap offerings then reject)" }
      - { name: race, type: enum, source: input, default: UNDISCLOSED, description: "AMERICAN_INDIAN | ASIAN | BLACK | PACIFIC_ISLANDER | WHITE | MULTIRACIAL | UNDISCLOSED — demographic reporting dimension" }
      - { name: ethnicity, type: enum, source: input, default: UNDISCLOSED, description: "HISPANIC | NON_HISPANIC | UNDISCLOSED — demographic reporting dimension" }
      - { name: language, type: string, source: input, default: "en", description: "Preferred language ISO code — demographic reporting dimension" }
      - { name: veteran_status, type: boolean, source: input, default: false, description: "Demographic reporting dimension" }
      - { name: open_referral_count, type: integer, source: computed, default: 0, description: "Count of this client's referrals not in a terminal state" }

  - name: DataSharingAgreement
    parent: Organization
    common_fields: true
    fields:
      - { name: party_a_org_id, type: string, source: input, description: "FK -> Organization.id; first party (direction matters: sharing flows BOTH ways when ACTIVE)" }
      - { name: party_b_org_id, type: string, source: input, description: "FK -> Organization.id; second party; party_a != party_b" }
      - { name: effective_at, type: datetime, source: input, description: "ISO8601 instant the agreement becomes effective (must be <= server clock at approval)" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | TERMINATED" }

  - name: Consent
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; consenting client" }
      - { name: sender_org_id, type: string, source: input, description: "FK -> Organization.id; org allowed to send referrals under this consent" }
      - { name: receiver_org_id, type: string, source: input, description: "FK -> Organization.id; org allowed to receive under this consent" }
      - { name: scope, type: enum, source: input, description: "FULL | MINIMUM_NECESSARY — MINIMUM_NECESSARY hides client contact fields from receiver reads" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }
      - { name: revoked_at, type: datetime, source: system, description: "Set on revocation; null while ACTIVE", default: null }

  - name: Referral
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: sender_org_id, type: string, source: input, description: "FK -> Organization.id; originating org (CLINIC or CBO)" }
      - { name: receiver_org_id, type: string, source: input, description: "FK -> Organization.id; candidate receiver (CBO) — updated on reassignment" }
      - { name: service_offering_id, type: string, source: input, description: "FK -> ServiceOffering.id; target offering — updated on reassignment" }
      - { name: consent_id, type: string, source: input, description: "FK -> Consent.id; consent authorizing this referral (must be ACTIVE and match sender/receiver pair at creation)" }
      - { name: category_code, type: string, source: input, description: "ServiceTaxonomyCategory.code snapshot at creation" }
      - { name: urgency, type: enum, source: input, default: STANDARD, description: "STANDARD | URGENT — URGENT referrals auto-escalate at half the aging window" }
      - { name: status, type: enum, source: system, description: "DRAFT | ROUTED | ACCEPTED | DECLINED | IN_SERVICE | OUTCOME_RECORDED | ESCALATED | CANCELLED | EXPIRED" }
      - { name: service_started_at, type: datetime, source: system, default: null, description: "Timestamp of ACCEPTED -> IN_SERVICE transition (billable service start)" }
      - { name: reassignment_count, type: integer, source: computed, default: 0, description: "Number of times this referral was re-routed after decline/withdrawal" }
      - { name: aging_days, type: integer, source: computed, default: 0, description: "Whole days between created_at and the earlier of (terminal transition time, server clock); 0 while in DRAFT" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of ESCALATED -> ROUTED reassignments (cyclic loop counter)" }
      - { name: outcome_code, type: enum, source: system, default: null, description: "DELIVERED | NOT_REACHED | CLIENT_DECLINED | PARTIALLY_DELIVERED — set on outcome confirmation" }
      - { name: delivered_units, type: integer, source: system, default: 0, description: "Units of service delivered (0 when outcome_code is NOT_REACHED or CLIENT_DECLINED)" }

  - name: ReferralNote
    parent: Referral
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: author_org_id, type: string, source: system, description: "FK -> Organization.id; note author's org (from caller identity)" }
      - { name: body, type: string, source: input, description: "Free-text note" }
      - { name: visibility, type: enum, source: input, default: NETWORK, description: "NETWORK | SENDER_ONLY | RECEIVER_ONLY" }

  - name: OutcomeRecord
    parent: Referral
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; exactly one per referral" }
      - { name: outcome_code, type: enum, source: system, description: "DELIVERED | NOT_REACHED | CLIENT_DECLINED | PARTIALLY_DELIVERED" }
      - { name: delivered_units, type: integer, source: system, description: "Units delivered" }
      - { name: reported_by_org_id, type: string, source: system, description: "FK -> Organization.id; receiver org reporting the outcome" }
      - { name: reported_at, type: datetime, source: system, description: "Server timestamp of outcome confirmation" }
      - { name: billable, type: boolean, source: computed, description: "True iff outcome_code is DELIVERED or PARTIALLY_DELIVERED with delivered_units >= 1" }

  - name: ServiceRateCard
    parent: Organization
    common_fields: true
    fields:
      - { name: funder_org_id, type: string, source: system, description: "FK -> Organization.id; the FUNDER org that publishes this rate card" }
      - { name: category_code, type: string, source: input, description: "ServiceTaxonomyCategory.code this card prices" }
      - { name: rate_cents_per_unit, type: integer, source: input, description: "Base reimbursement per delivered unit (>= 1)" }
      - { name: min_units, type: integer, source: input, default: 1, description: "Tier boundary: units strictly below this use rate_cents_per_unit" }
      - { name: tier2_rate_cents_per_unit, type: integer, source: input, default: null, description: "Rate for units at or above min_units; null = flat rate" }
      - { name: monthly_cap_cents, type: integer, source: input, default: null, description: "Funder's per-receiver monthly payout cap; null = uncapped" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: PaymentClaim
    parent: Referral
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the OUTCOME_RECORDED referral being billed" }
      - { name: funder_org_id, type: string, source: input, description: "FK -> Organization.id; FUNDER org billed (must hold an ACTIVE DataSharingAgreement with the receiver)" }
      - { name: provider_org_id, type: string, source: system, description: "FK -> Organization.id; the referral's receiver org at submission" }
      - { name: claimed_units, type: integer, source: input, description: "Units billed; must equal referral's OutcomeRecord.delivered_units" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "Full X-User-ID of the FunderAdmin who moved the claim to UNDER_REVIEW; segregation-of-duties compares against this" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Optimistic quote at submission: per-unit rate, no monthly-cap application (claim_amount_quote PROVISIONAL variant)" }
      - { name: approved_amount_cents, type: integer, source: computed, default: null, description: "Final adjudicated amount: units-summed rounding AND monthly-cap waterfall applied (claim_amount_quote FINAL variant); null until APPROVED" }
      - { name: clawback_reserve_cents, type: integer, source: computed, default: 0, description: "Amount escrowed from CareNetwork.network_escrow_cents when this claim is VOIDED; settles the clawback" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | VOIDED | PAID" }

  - name: Disbursement
    parent: Organization
    common_fields: true
    fields:
      - { name: provider_org_id, type: string, source: system, description: "FK -> Organization.id; org being paid (batch target)" }
      - { name: funder_org_id, type: string, source: input, description: "FK -> Organization.id; FUNDER authorizing the payout batch" }
      - { name: claim_ids, type: array, source: input, description: "Explicit list of APPROVED PaymentClaim ids to include; order irrelevant" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of approved_amount_cents of included claims at RUN execution" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAID | FAILED" }
      - { name: failure_reason, type: string, source: system, default: null, description: "Set when status = FAILED" }

  - name: FunderReport
    parent: Organization
    common_fields: true
    fields:
      - { name: funder_org_id, type: string, source: system, description: "FK -> Organization.id; FUNDER receiving the report" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive; >= period_start" }
      - { name: baseline_snapshot_cents, type: integer, source: system, description: "Total approved_amount_cents across claims known at SEALED time; invariant anchor for the sealed-report invariant" }
      - { name: total_referrals, type: integer, source: computed, description: "Referrals received by CBOs under agreements with this funder, created within period" }
      - { name: delivered_count, type: integer, source: computed, description: "OutcomeRecords in period with outcome DELIVERED or PARTIALLY_DELIVERED" }
      - { name: not_reached_count, type: integer, source: computed, description: "OutcomeRecords in period with outcome NOT_REACHED or CLIENT_DECLINED" }
      - { name: unresolved_count, type: integer, source: computed, description: "Referrals non-terminal at seal time created in period" }
      - { name: aging_count, type: integer, source: computed, description: "Referrals with aging_days > CareNetwork.unresolved_aging_days among unresolved_count" }
      - { name: total_reimbursed_cents, type: integer, source: computed, description: "Sum of approved_amount_cents for claims APPROVED in period (after any clawbacks — clawbacks net against it)" }
      - { name: demographic_breakdown, type: object, source: computed, description: "Counts keyed by (gender, race, ethnicity, veteran_status, language) over clients of period referrals; cells below k-anonymity threshold suppressed (k=5)" }
      - { name: closure_rate_percent, type: number, source: computed, description: "delivered_count / total_referrals * 100 — the deliverable-facing metric; variant of closure_rate_dual" }
      - { name: resolution_rate_percent, type: number, source: computed, description: "(delivered_count + not_reached_count) / total_referrals * 100 — the closed-loop-facing metric counting every confirmed outcome, delivered or not; variant of closure_rate_dual" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Organization
    initial_state: PENDING_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /care-network/organizations/{id}/activate"
        actor: NetworkCoordinator
        preconditions:
          - "Organization in PENDING_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "Organization.status = ACTIVE; updated_at refreshed; version incremented"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /care-network/organizations/{id}/suspend"
        actor: NetworkCoordinator
        preconditions:
          - "Organization in ACTIVE (else ERR_INVALID_STATE)"
          - "No PaymentClaim of this org in SUBMITTED or UNDER_REVIEW (else ERR_OPEN_CLAIMS_BLOCK_TRANSITION)"
        side_effects:
          - "suspension_reason captured"
          - "All ServiceOfferings of the org -> PAUSED"
          - "Cascade A hop 1: every ROUTED Referral with receiver_org_id = this org is force-DECLINED with system reason ORG_SUSPENDED (Referral status ROUTED -> DECLINED, consent untouched)"
          - "Cascade A hop 2: each such DECLINED referral's receiver-facing case reservation is released — the ServiceOffering it was routed to decrements capacity_consumed by 1 (reservation release), which decrements capacity_available upward; each Referral.reassignment_count incremented by 1 by the system re-route attempt"
          - "Cascade A hop 3: if any affected referral's reassignment_count would exceed CareNetwork.max_reassignment_count, that referral auto-CANCELLS (DECLINED -> CANCELLED) and its Client.open_referral_count decrements"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /care-network/organizations/{id}/activate"
        actor: NetworkCoordinator
        preconditions:
          - "Organization in SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason cleared; offerings remain PAUSED (manual resume required)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /care-network/organizations/{id}/terminate"
        actor: NetworkCoordinator
        preconditions:
          - "Organization in ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
          - "No non-terminal Referral where this org is sender or receiver (else ERR_OPEN_REFERRALS_BLOCK_TERMINATION)"
          - "payable_balance_cents == 0 (else ERR_UNSETTLED_BALANCE)"
        side_effects:
          - "All ACTIVE DataSharingAgreements naming this org -> TERMINATED (cascade)"
          - "All ServiceOfferings -> PAUSED (terminal lock)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /care-network/organizations/{id}/terminate"
        actor: NetworkCoordinator
        preconditions:
          - "Same as ACTIVE -> TERMINATED"
        side_effects:
          - "Same as ACTIVE -> TERMINATED"

  - entity: ServiceTaxonomyCategory
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /care-network/taxonomy/{id}/retire"
        actor: NetworkCoordinator
        preconditions:
          - "Category ACTIVE (else ERR_INVALID_STATE)"
          - "No ServiceOffering with status ACTIVE references this category_code (else ERR_CATEGORY_IN_USE)"
        side_effects:
          - "New referrals and offerings naming this code are rejected with ERR_CATEGORY_RETIRED"

  - entity: ServiceOffering
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /care-network/offerings/{id}/pause OR system cascade from Organization suspension"
        actor: OrgAdmin | system
        preconditions:
          - "Offering ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Offering not routable; capacity_consumed unchanged"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /care-network/offerings/{id}/resume"
        actor: OrgAdmin
        preconditions:
          - "Offering PAUSED (else ERR_INVALID_STATE)"
          - "Owning Organization must be ACTIVE (else ERR_ORG_NOT_ACTIVE)"
        side_effects: []

  - entity: DataSharingAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /care-network/agreements/{id}/approve"
        actor: NetworkCoordinator
        preconditions:
          - "Agreement PENDING (else ERR_INVALID_STATE)"
          - "effective_at <= server clock (else ERR_AGREEMENT_NOT_YET_EFFECTIVE)"
          - "Both party orgs ACTIVE (else ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "Referral creation between the two orgs becomes permissible (consent still required)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /care-network/agreements/{id}/expire"
        actor: NetworkCoordinator
        preconditions:
          - "Agreement ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "New referrals between the parties blocked (ERR_AGREEMENT_INACTIVE); existing non-terminal referrals unaffected"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /care-network/agreements/{id}/terminate OR system cascade from Organization termination"
        actor: NetworkCoordinator | system
        preconditions:
          - "Agreement ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade B hop 1: every non-terminal Referral whose (sender, receiver) pair matches this agreement is flagged consent_blocked = true via its Consent — any Consent with (sender_org_id, receiver_org_id) equal to either party direction of this agreement moves ACTIVE -> REVOKED with revoked_at = clock"
          - "Cascade B hop 2: Consent revocation propagation (see Consent machine revoke side effects) fires for each revoked consent"

  - entity: Consent
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /care-network/consents/{id}/revoke OR system cascade from DataSharingAgreement termination"
        actor: Client | CaseWorker | system
        preconditions:
          - "Consent ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "revoked_at = server clock"
          - "Cascade C hop 1: every Referral with consent_id = this consent and status in {DRAFT, ROUTED, DECLINED, ESCALATED} -> CANCELLED with reason CONSENT_REVOKED"
          - "Cascade C hop 2: for each cancelled referral in ROUTED state, the receiver org's ServiceOffering decrements capacity_consumed by 1 (reservation release)"
          - "Cascade C hop 3: each cancelled referral decrements Client.open_referral_count; EVERY PaymentClaim in SUBMITTED or UNDER_REVIEW status whose referral's consent_id == this consent -> VOIDED (regardless of whether that referral itself was cancelled) and the clawback_reserve is funded from CareNetwork.network_escrow_cents (clawback_reserve_cents = claim.approved_amount_cents when set, else claim.provisional_amount_cents; network_escrow_cents -= reserve; network_escrow_reserved_cents += reserve) — the entire revoke is rejected atomically with ERR_ESCROW_EXHAUSTED if escrow cannot cover the total reserve"
          - "Referrals already IN_SERVICE or OUTCOME_RECORDED are NOT cancelled (service already underway); they become non-billable evidence: new PaymentClaims against them are rejected with ERR_CONSENT_REVOKED"

  - entity: Referral
    initial_state: DRAFT
    terminal_states: [CANCELLED, EXPIRED, OUTCOME_RECORDED]
    transitions:
      - from: DRAFT
        to: ROUTED
        trigger: "POST /care-network/referrals/{id}/route"
        actor: CaseWorker
        preconditions:
          - "Referral DRAFT (else ERR_INVALID_STATE)"
          - "Sender org ACTIVE, receiver org ACTIVE and org_type=CBO (else ERR_ORG_NOT_ACTIVE / ERR_RECEIVER_NOT_CBO)"
          - "ACTIVE DataSharingAgreement exists covering sender<->receiver (else ERR_AGREEMENT_INACTIVE)"
          - "Consent ACTIVE and matches (sender, receiver) pair (else ERR_CONSENT_REQUIRED)"
          - "ServiceOffering ACTIVE, belongs to receiver, category matches referral.category_code, category not RETIRED (else ERR_CATEGORY_RETIRED / ERR_OFFERING_MISMATCH)"
          - "Eligibility: client age within [min_client_age, max_client_age], zip in eligible_zip_codes (or empty), gender matches, income < income_cap_annual_cents when cap non-null (else ERR_ELIGIBILITY_FAILED)"
          - "capacity_available >= 1 (else ERR_CAPACITY_EXHAUSTED)"
        side_effects:
          - "capacity_consumed += 1 on the offering (case_reservation invariant)"
          - "Client.open_referral_count += 1"

      - from: ROUTED
        to: ACCEPTED
        trigger: "POST /care-network/referrals/{id}/accept"
        actor: OrgAdmin
        preconditions:
          - "Referral ROUTED (else ERR_INVALID_STATE)"
          - "Caller org is the current receiver_org_id (else ERR_FORBIDDEN_ORG)"
          - "capacity_available >= 1 on the (possibly reassigned) offering (else ERR_CAPACITY_EXHAUSTED)"
        side_effects:
          - "service window opens; referral awaiting IN_SERVICE"

      - from: ROUTED
        to: DECLINED
        trigger: "POST /care-network/referrals/{id}/decline"
        actor: OrgAdmin
        preconditions:
          - "Referral ROUTED (else ERR_INVALID_STATE)"
          - "Caller org is receiver_org_id (else ERR_FORBIDDEN_ORG)"
        side_effects:
          - "capacity_consumed -= 1 on current offering (reservation release)"
          - "reassignment_count += 1"
          - "If reassignment_count > CareNetwork.max_reassignment_count: referral auto-CANCELLED (terminal), Client.open_referral_count -= 1 (boundary rule)"

      - from: DECLINED
        to: ROUTED
        trigger: "POST /care-network/referrals/{id}/reassign"
        actor: CaseWorker | NetworkCoordinator
        preconditions:
          - "Referral DECLINED (else ERR_INVALID_STATE)"
          - "New receiver differs from the declining receiver (else ERR_REASSIGNMENT_LOOP)"
          - "New receiver offering passes the same routing preconditions as DRAFT->ROUTED (agreement ACTIVE with sender, consent pair matches NEW receiver, eligibility, capacity >= 1)"
        side_effects:
          - "receiver_org_id and service_offering_id overwritten"
          - "New offering capacity_consumed += 1"

      - from: ROUTED
        to: ESCALATED
        trigger: "POST /care-network/referrals/{id}/escalate"
        actor: NetworkCoordinator
        preconditions:
          - "Referral ROUTED (else ERR_INVALID_STATE)"
          - "Referral is aging: (clock - routed_at) > auto_accept_window_hours hours, halved when urgency=URGENT (else ERR_NOT_AGING)"
        side_effects:
          - "Escalation flag set; receiver unchanged; coordinator oversight queue gains the referral"

      - from: ESCALATED
        to: ROUTED
        trigger: "POST /care-network/referrals/{id}/reassign"
        actor: NetworkCoordinator
        preconditions:
          - "Referral ESCALATED (else ERR_INVALID_STATE)"
          - "Same reassignment preconditions as DECLINED->ROUTED"
        side_effects:
          - "reopen_count += 1"
          - "reassignment_count += 1 (also counts against max_reassignment_count)"
          - "Old offering capacity_consumed -= 1; new offering capacity_consumed += 1"

      - from: ACCEPTED
        to: IN_SERVICE
        trigger: "POST /care-network/referrals/{id}/start-service"
        actor: OrgAdmin
        preconditions:
          - "Referral ACCEPTED (else ERR_INVALID_STATE)"
          - "Caller org is receiver_org_id (else ERR_FORBIDDEN_ORG)"
        side_effects:
          - "service_started_at = server clock (billable window opens)"

      - from: IN_SERVICE
        to: OUTCOME_RECORDED
        trigger: "POST /care-network/referrals/{id}/confirm-outcome"
        actor: OrgAdmin
        preconditions:
          - "Referral IN_SERVICE (else ERR_INVALID_STATE)"
          - "Caller org is receiver_org_id (else ERR_FORBIDDEN_ORG)"
          - "outcome_code present; delivered_units >= 1 iff outcome_code in {DELIVERED, PARTIALLY_DELIVERED}; delivered_units == 0 iff outcome_code in {NOT_REACHED, CLIENT_DECLINED} (else ERR_OUTCOME_UNITS_MISMATCH)"
        side_effects:
          - "OutcomeRecord created (exactly one per referral)"
          - "capacity_consumed -= 1 on the offering (case closed)"
          - "Client.open_referral_count -= 1"
          - "Referral.aging_days frozen at terminal value"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /care-network/referrals/{id}/cancel"
        actor: CaseWorker
        preconditions:
          - "Referral in DRAFT, ROUTED, ACCEPTED, DECLINED, or ESCALATED (else ERR_INVALID_STATE)"
        side_effects:
          - "If ROUTED/ACCEPTED/ESCALATED: offering capacity_consumed -= 1"
          - "Client.open_referral_count -= 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /care-network/referrals/{id}/cancel"
        actor: CaseWorker
        preconditions: ["Referral in a cancellable state (else ERR_INVALID_STATE)"]
        side_effects: ["Client.open_referral_count -= 1"]

      - from: ROUTED
        to: CANCELLED
        trigger: "POST /care-network/referrals/{id}/cancel OR system (consent revocation, reassignment overflow, org suspension overflow)"
        actor: CaseWorker | system
        preconditions: ["Referral in a cancellable state (else ERR_INVALID_STATE)"]
        side_effects:
          - "offering capacity_consumed -= 1"
          - "Client.open_referral_count -= 1"

      - from: DECLINED
        to: CANCELLED
        trigger: "POST /care-network/referrals/{id}/cancel OR system"
        actor: CaseWorker | system
        preconditions: ["Referral in a cancellable state (else ERR_INVALID_STATE)"]
        side_effects: ["Client.open_referral_count -= 1"]

      - from: ESCALATED
        to: CANCELLED
        trigger: "POST /care-network/referrals/{id}/cancel OR system"
        actor: CaseWorker | system
        preconditions: ["Referral in a cancellable state (else ERR_INVALID_STATE)"]
        side_effects:
          - "offering capacity_consumed -= 1"
          - "Client.open_referral_count -= 1"

      - from: ROUTED
        to: EXPIRED
        trigger: "system sweep (POST /care-network/_clock/set_current_utc advance OR POST /care-network/referrals/aging-sweep): referral sat in ROUTED for more than referral_expiry_days days with no accept"
        actor: system
        preconditions:
          - "Referral ROUTED and floor((clock - routed_at)/24h) > referral_expiry_days"
        side_effects:
          - "offering capacity_consumed -= 1"
          - "Client.open_referral_count -= 1"

  - entity: PaymentClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /care-network/claims/{id}/review"
        actor: FunderAdmin
        preconditions:
          - "Claim SUBMITTED (else ERR_INVALID_STATE)"
          - "Caller org is the claim's funder_org_id (else ERR_FORBIDDEN_ORG)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /care-network/claims/{id}/approve"
        actor: FunderAdmin
        preconditions:
          - "Claim UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "Caller org is funder_org_id (else ERR_FORBIDDEN_ORG)"
          - "Segregation of duties: approving FunderAdmin's full X-User-ID must differ from the claim's reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Referral consent still ACTIVE at approval time (else ERR_CONSENT_REVOKED)"
        side_effects:
          - "approved_amount_cents = claim_amount_quote FINAL variant (cap waterfall + summed rounding)"
          - "provider org payable_balance_cents += approved_amount_cents"
          - "funder monthly paid-to-date accumulator += approved_amount_cents (cap accounting)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /care-network/claims/{id}/deny"
        actor: FunderAdmin
        preconditions:
          - "Claim UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "Caller org is funder_org_id (else ERR_FORBIDDEN_ORG)"
          - "Segregation of duties: denying FunderAdmin's full X-User-ID must differ from reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["denial reason stored"]

      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /care-network/claims/{id}/void OR system cascade from consent revocation"
        actor: FunderAdmin | system
        preconditions:
          - "Claim SUBMITTED or UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "clawback_reserve_cents = provisional_amount_cents; network escrow debited and network_escrow_reserved_cents incremented (escrow_hold invariant)"

      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "POST /care-network/claims/{id}/void OR system cascade"
        actor: FunderAdmin | system
        preconditions: ["Claim SUBMITTED or UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["Same as SUBMITTED -> VOIDED"]

      - from: APPROVED
        to: VOIDED
        trigger: "POST /care-network/claims/{id}/void (clawback path)"
        actor: FunderAdmin
        preconditions:
          - "Claim APPROVED (else ERR_INVALID_STATE)"
          - "Claim not yet included in a PAID Disbursement (else ERR_CLAIM_ALREADY_PAID)"
        side_effects:
          - "Clawback: provider payable_balance_cents -= approved_amount_cents; if balance insufficient, remainder funded from CareNetwork.network_escrow_cents (clawback_reserve_cents = shortfall; network_escrow_reserved_cents += shortfall) — ERR_ESCROW_EXHAUSTED when escrow cannot cover"
          - "funder monthly paid-to-date accumulator -= approved_amount_cents"

      - from: APPROVED
        to: PAID
        trigger: "system (Disbursement batch PAID)"
        actor: system
        preconditions: ["Claim included in a Disbursement that transitions to PAID"]
        side_effects: ["provider payable_balance_cents -= approved_amount_cents (already accrued; now settled)"]

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [PAID, FAILED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /care-network/disbursements/{id}/run"
        actor: FunderAdmin
        preconditions:
          - "Disbursement SCHEDULED (else ERR_INVALID_STATE)"
          - "Caller org is funder_org_id (else ERR_FORBIDDEN_ORG)"
          - "Every listed claim APPROVED and belongs to provider_org_id (else ERR_CLAIM_NOT_PAYABLE)"
          - "Provider org status ACTIVE (else ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "total_amount_cents computed from claims"
          - "Each included claim APPROVED -> PAID; provider payable_balance_cents decremented per claim"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /care-network/disbursements/{id}/run with simulate_failure=true"
        actor: FunderAdmin
        preconditions:
          - "Disbursement SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "No claim state changes; failure_reason captured; provider balance unchanged (saga compensation: no partial payouts)"

  - entity: FunderReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /care-network/reports/{id}/seal"
        actor: FunderAdmin
        preconditions:
          - "Report DRAFT (else ERR_INVALID_STATE)"
          - "Caller org is funder_org_id (else ERR_FORBIDDEN_ORG)"
        side_effects:
          - "baseline_snapshot_cents frozen; sealed-report invariant armed (total_reimbursed_cents + network escrow_reserved attributable to this funder's claims == baseline at seal time plus later-approved claims delta; a sealed report's metrics never change afterwards)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: referral-reassign-stale-version
    parent_entity: Referral
    write_endpoint: "POST /care-network/referrals/{id}/reassign"
    occ_field: "expected_referral_version"
    description: |
      Reassigning a DECLINED or ESCALATED referral with an
      expected_referral_version that no longer matches the referral's current
      version is rejected. This captures the case where another writer has
      just re-routed the referral (which legitimately overwrites
      receiver_org_id under the decline-reassign policy) and the current
      writer's view of the referral is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-approve-stale-version
    parent_entity: PaymentClaim
    write_endpoint: "POST /care-network/claims/{id}/approve"
    occ_field: "expected_claim_version"
    description: |
      Approving a claim whose version has advanced since the funder last
      observed it is rejected. This captures the case where another writer has
      just mutated the claim (e.g., a void that escrowed the reserve) and the
      approving writer's view of the claim is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: org-suspend-stale-version
    parent_entity: Organization
    write_endpoint: "POST /care-network/organizations/{id}/suspend"
    occ_field: "expected_org_version"
    description: |
      Suspending an organization whose version has advanced since the
      coordinator last observed it is rejected. This captures the case where
      another writer has just changed org state (e.g., activation completing
      onboarding fields) and the suspending writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_evaluation
    trigger: "Referral DRAFT -> ROUTED and DECLINED/ESCALATED -> ROUTED"
    algorithm: constraint_propagation
    formula: |
      Inputs: client (date_of_birth, zip_code, gender, annual_income_cents),
              offering (min_client_age, max_client_age, eligible_zip_codes,
                        eligible_genders, income_cap_annual_cents)
      age_years = floor((referral_created_date - client.date_of_birth) / 365.25 days)
      eligible = (age_years >= offering.min_client_age)
             AND (age_years <= offering.max_client_age)
             AND (offering.eligible_zip_codes == [] OR client.zip_code IN offering.eligible_zip_codes)
             AND ("ANY" IN offering.eligible_genders OR client.gender IN offering.eligible_genders)
             AND (offering.income_cap_annual_cents IS NULL
                  OR (client.annual_income_cents IS NOT NULL
                      AND client.annual_income_cents < offering.income_cap_annual_cents))
      Boundary pins: age bounds are INCLUSIVE (>= / <=); income cap is
      EXCLUSIVE (strict <): income exactly equal to the cap FAILS.
    input_set: "The single client and single offering named on the referral"
    constants:
      DAYS_PER_YEAR: 365.25
    precision: "integer years, floor"

  - name: claim_amount_quote
    trigger: "PaymentClaim submission (PROVISIONAL) and approval (FINAL)"
    algorithm: tiered_pricing
    formula: |
      Base per-unit tier selection against the funder's ACTIVE ServiceRateCard
      for the referral's category_code:
        if rate_card.tier2_rate_cents_per_unit IS NULL:
          unit_rate = rate_card.rate_cents_per_unit
        elif claimed_units < rate_card.min_units:
          unit_rate = rate_card.rate_cents_per_unit
        else:
          unit_rate = rate_card.tier2_rate_cents_per_unit
      Boundary: tier2 applies when claimed_units >= min_units (>=, not >).

      PROVISIONAL variant (at submission):
        provisional_amount_cents = claimed_units * unit_rate
        (NO monthly cap applied; integer multiplication, no rounding needed)

      FINAL variant (at approval):
        gross = claimed_units * unit_rate
        paid_this_month = sum of approved_amount_cents over this funder's
                          claims APPROVED in the same calendar month (clock),
                          excluding this claim
        remaining_cap = rate_card.monthly_cap_cents - paid_this_month
                        (when monthly_cap_cents IS NULL: remaining_cap = +inf)
        approved_amount_cents = max(0, min(gross, remaining_cap))
        Circular-looking dependency pin: the cap depends on approved claims,
        which depends on amounts — evaluation order is FIXED: (1) compute
        gross from the rate card tier; (2) sum prior-month approvals EXCLUDING
        this claim; (3) clamp. A claim never contributes to its own cap
        residue.
    input_set: "The claim, its referral's category, the funder's ACTIVE rate card for that category, and the funder's other APPROVED claims in the same calendar month"
    constants:
      UNCAPPED: null
    precision: "integer cents, no fractional rounding (unit rates are integer cents)"
    variants:
      - name: PROVISIONAL
        when: "Claim submission"
        difference: "Ignores monthly_cap_cents entirely; quotes the optimistic gross so the provider sees a pre-adjudication estimate that can exceed the final approved amount"
      - name: FINAL
        when: "Claim approval"
        difference: "Applies the monthly-cap waterfall after tier selection; may be strictly less than provisional_amount_cents"

  - name: capacity_reservation_balance
    trigger: "route, decline, reassign, cancel, confirm-outcome, org suspension cascade, consent revocation cascade"
    algorithm: aggregation
    formula: |
      case_reservation invariant (pinned formula over entity fields):
        ServiceOffering.capacity_consumed ==
          count of Referrals where referral.service_offering_id == offering.id
          AND referral.status IN {ROUTED, ACCEPTED, IN_SERVICE}
      capacity_available = capacity_total - capacity_consumed
      Every transition that creates/destroys a reservation updates
      capacity_consumed by exactly +/-1 in the same request.
    input_set: "All non-terminal referrals of one offering"
    precision: "integer counts"

  - name: referral_aging
    trigger: "escalate precondition, aging sweep, FunderReport aging_count"
    algorithm: threshold
    formula: |
      elapsed_hours = (server_clock - referral.routed_at) in whole hours (floor)
      window = network.auto_accept_window_hours
               (halved when referral.urgency == URGENT)
      is_aging_for_escalation = elapsed_hours > window        # STRICT >
      aging_days = floor((min(server_clock, terminal_time) - referral.created_at) / 24h)
      counts_as_aging_in_report = aging_days > network.unresolved_aging_days   # STRICT >
      Boundary pins: a referral exactly AT the window is NOT aging; a referral
      exactly unresolved_aging_days old is NOT counted in aging_count.
    input_set: "Single referral vs network config"
    precision: "integer hours/days, floor"

  - name: closure_rate_dual
    trigger: "FunderReport creation and seal"
    algorithm: aggregation
    formula: |
      Both variants share the same input set (referrals created within
      [period_start, period_end] INCLUSIVE on both ends, routed under this
      funder's agreements):
        closure_rate_percent    = delivered_count / total_referrals * 100
        resolution_rate_percent = (delivered_count + not_reached_count) / total_referrals * 100
      Both 0.0 when total_referrals == 0. A NOT_REACHED outcome RAISES
      resolution_rate but LOWERS nothing — it leaves closure_rate untouched
      in the numerator while still counting in total_referrals, so the two
      metrics diverge by exactly not_reached_count / total_referrals * 100.
    input_set: "Referrals created in the report period under this funder's agreements and their OutcomeRecords"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: DELIVERABLE_FACING
        when: "closure_rate_percent field"
        difference: "Numerator counts only DELIVERED + PARTIALLY_DELIVERED outcomes"
      - name: CLOSED_LOOP_FACING
        when: "resolution_rate_percent field"
        difference: "Numerator additionally counts NOT_REACHED + CLIENT_DECLINED — every closed loop"

  - name: demographic_breakdown_suppression
    trigger: "FunderReport seal"
    algorithm: aggregation
    formula: |
      Build raw cells keyed by (gender, race, ethnicity, veteran_status) over
      clients of period referrals. k-anonymity suppression:
        cell_visible(c) = raw_count(c) when raw_count(c) >= K_ANON else 0
        suppressed_total = sum of raw_count(c) over cells with raw_count < K_ANON
        A single synthetic bucket key ("SUPPRESSED") carries suppressed_total
        and is itself reported ONLY when suppressed_total >= K_ANON; when
        0 < suppressed_total < K_ANON the synthetic bucket is omitted entirely
        (counts then do not sum to total_referrals — that gap is the visible
        signal of suppression and is intentional).
    input_set: "Clients of the report's period referrals"
    constants:
      K_ANON: 5
    precision: "integer counts; no percentage redistribution"

  - name: escrow_clawback_settlement
    trigger: "PaymentClaim void of an APPROVED claim; consent revocation cascade"
    algorithm: waterfall_allocation
    formula: |
      shortfall = max(0, claim.approved_amount_cents - provider.payable_balance_cents)
      provider.payable_balance_cents = max(0, provider.payable_balance_cents - claim.approved_amount_cents)
      claim.clawback_reserve_cents = shortfall
      network.network_escrow_cents -= shortfall
      network.network_escrow_reserved_cents += shortfall
      escrow_hold invariant: network.network_escrow_reserved_cents ==
        sum over PaymentClaims in VOIDED status of claim.clawback_reserve_cents
      ERR_ESCROW_EXHAUSTED when shortfall > network.network_escrow_cents
      (the whole void is rejected atomically; no partial clawback).
    input_set: "Single claim, its provider org, the CareNetwork"
    precision: "integer cents"

  - name: network_health_metrics
    trigger: "FunderReport seal; coordinator dashboard read"
    algorithm: aggregation
    formula: |
      unresolved_count = count of referrals created within [period_start,
        period_end] whose status is NOT IN {CANCELLED, EXPIRED, OUTCOME_RECORDED}
        at seal time
      aging_count = count within unresolved where aging_days >
        network.unresolved_aging_days
      Same-data dual reading vs closure_rate: closure_rate uses terminal
      outcomes only; unresolved uses live status — a report where every
      referral is unresolved yields closure_rate 0.0 AND unresolved_count ==
      total_referrals (consistent by construction, tested as a pair).
    input_set: "Referrals created in the report period routed under this funder's agreements"
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Entity-backed caller identity matches the org the action targets. For entity-backed roles, X-User-ID is either the bare org id (the org acting as itself) or the compound form '<org_id>#<staff_label>' identifying an individual staff member of that org — org-ownership checks compare the org-id prefix, while segregation-of-duties compares the FULL X-User-ID string. Receiver-only actions require the caller's org == referral.receiver_org_id."
    error_id: ERR_FORBIDDEN_ORG
    http_status: 403
    applies_to: "org-scoped mutation endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, FK targets exist (consent_id, service_offering_id, category_code, claim_ids...)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "OCC: expected_*_version, when the endpoint requires it, matches the parent's current version (checked before business rules, after existence)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /care-network/referrals/{id}/reassign, POST /care-network/claims/{id}/approve, POST /care-network/organizations/{id}/suspend"

  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 8
    category: business_safety
    check: "Consent: referral creation requires an ACTIVE Consent whose (sender_org_id, receiver_org_id) equals the referral pair; claim submission/approval requires the referral's consent still ACTIVE"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /care-network/referrals, POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign"

  - priority: 9
    category: business_safety
    check: "Consent revoked propagation: billing actions against a referral whose consent is REVOKED"
    error_id: ERR_CONSENT_REVOKED
    http_status: 422
    applies_to: "POST /care-network/claims, POST /care-network/claims/{id}/approve"

  - priority: 10
    category: business_referential
    check: "ACTIVE DataSharingAgreement covering the (sender, receiver) pair (either party direction) at referral route/reassign; agreement covering (funder, provider) at claim submission"
    error_id: ERR_AGREEMENT_INACTIVE
    http_status: 422
    applies_to: "POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign, POST /care-network/claims"

  - priority: 11
    category: business_referential
    check: "Offering belongs to receiver org, offering category matches referral category, category not RETIRED, offering ACTIVE"
    error_id: ERR_OFFERING_MISMATCH
    http_status: 422
    applies_to: "POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign"

  - priority: 12
    category: business_constraint
    check: "Client eligibility against offering criteria (age window inclusive, zip membership, gender match, strict income cap)"
    error_id: ERR_ELIGIBILITY_FAILED
    http_status: 422
    applies_to: "POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign"

  - priority: 13
    category: business_fiscal
    check: "Offering capacity_available >= 1 for route/reassign/accept"
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign, POST /care-network/referrals/{id}/accept"

  - priority: 14
    category: business_temporal
    check: "Escalate requires elapsed strictly greater than the (urgency-adjusted) auto-accept window; agreement approve requires effective_at <= clock; rate card tier boundary uses >= min_units"
    error_id: ERR_NOT_AGING
    http_status: 409
    applies_to: "POST /care-network/referrals/{id}/escalate"

  - priority: 15
    category: business_constraint
    check: "Reassignment target differs from the declining/current receiver"
    error_id: ERR_REASSIGNMENT_LOOP
    http_status: 409
    applies_to: "POST /care-network/referrals/{id}/reassign"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: claim approve/deny actor differs from the actor who moved the claim to UNDER_REVIEW"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /care-network/claims/{id}/approve, POST /care-network/claims/{id}/deny"

  - priority: 17
    category: business_fiscal
    check: "Outcome units consistency: delivered_units >= 1 iff DELIVERED/PARTIALLY_DELIVERED; == 0 iff NOT_REACHED/CLIENT_DECLINED; claim claimed_units == OutcomeRecord.delivered_units"
    error_id: ERR_OUTCOME_UNITS_MISMATCH
    http_status: 422
    applies_to: "POST /care-network/referrals/{id}/confirm-outcome, POST /care-network/claims"

  - priority: 18
    category: business_fiscal
    check: "Escrow sufficiency for clawback funding"
    error_id: ERR_ESCROW_EXHAUSTED
    http_status: 402
    applies_to: "POST /care-network/claims/{id}/void, POST /care-network/consents/{id}/revoke (cascade)"

  - priority: 19
    category: business_fiscal
    check: "Org lifecycle fiscal gates: terminate requires payable_balance_cents == 0 and no non-terminal referrals; suspend requires no open claims"
    error_id: ERR_UNSETTLED_BALANCE
    http_status: 409
    applies_to: "POST /care-network/organizations/{id}/terminate"

  - priority: 20
    category: business_constraint
    check: "Org lifecycle structural gates: open claims block suspension; non-terminal referrals block termination; category in use blocks retirement"
    error_id: ERR_OPEN_CLAIMS_BLOCK_TRANSITION
    http_status: 409
    applies_to: "POST /care-network/organizations/{id}/suspend"

  - priority: 21
    category: business_constraint
    check: "Receiver org must be org_type CBO on route/reassign"
    error_id: ERR_RECEIVER_NOT_CBO
    http_status: 422
    applies_to: "POST /care-network/referrals/{id}/route, POST /care-network/referrals/{id}/reassign"

  - priority: 22
    category: business_constraint
    check: "Duplicate submission: exactly one PaymentClaim per referral; exactly one OutcomeRecord per referral"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /care-network/claims"

  - priority: 23
    category: business_temporal
    check: "Agreement effective_at must be <= clock at approval"
    error_id: ERR_AGREEMENT_NOT_YET_EFFECTIVE
    http_status: 409
    applies_to: "POST /care-network/agreements/{id}/approve"

  - priority: 24
    category: business_constraint
    check: "Referral must be OUTCOME_RECORDED with billable outcome before claim submission"
    error_id: ERR_REFERRAL_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /care-network/claims"

  - priority: 25
    category: business_constraint
    check: "Claim payable: every claim in a disbursement run must be APPROVED and belong to the provider; org termination blocks"
    error_id: ERR_CLAIM_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /care-network/disbursements/{id}/run"

  - priority: 26
    category: business_constraint
    check: "Category retired: new offerings/referrals cannot name a RETIRED category"
    error_id: ERR_CATEGORY_RETIRED
    http_status: 422
    applies_to: "POST /care-network/organizations/{id}/offerings, POST /care-network/referrals"

  - priority: 27
    category: business_constraint
    check: "Category retirement blocked while ACTIVE offerings reference it"
    error_id: ERR_CATEGORY_IN_USE
    http_status: 409
    applies_to: "POST /care-network/taxonomy/{id}/retire"

  - priority: 28
    category: business_constraint
    check: "Org must be ACTIVE for offering resume, agreement approval parties, referral route endpoints"
    error_id: ERR_ORG_NOT_ACTIVE
    http_status: 409
    applies_to: "offering resume, agreement approve, referral route/reassign"

  - priority: 29
    category: business_constraint
    check: "Termination blocked by non-terminal referrals naming the org"
    error_id: ERR_OPEN_REFERRALS_BLOCK_TERMINATION
    http_status: 409
    applies_to: "POST /care-network/organizations/{id}/terminate"

  - priority: 30
    category: business_fiscal
    check: "Void of a claim already PAID via a disbursement"
    error_id: ERR_CLAIM_ALREADY_PAID
    http_status: 409
    applies_to: "POST /care-network/claims/{id}/void"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/care-network/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [NetworkCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Triggers the referral aging sweep: ROUTED referrals with floor((clock - routed_at)/24h) > referral_expiry_days -> EXPIRED"]

  # --- network ---
  - method: POST
    path: "/care-network/networks"
    description: "Create a CareNetwork"
    roles: [NetworkCoordinator]
    code: 201
    input: [name, coordinator_org_name, "max_reassignment_count?", "auto_accept_window_hours?", "unresolved_aging_days?", "referral_expiry_days?", "network_escrow_cents?"]
    output: CareNetwork
    side_effects: ["All computed fields initialized to 0"]

  - method: GET
    path: "/care-network/networks/{id}"
    description: "Get a CareNetwork"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: []
    output: CareNetwork
    side_effects: []

  # --- taxonomy ---
  - method: POST
    path: "/care-network/taxonomy"
    description: "Create a ServiceTaxonomyCategory"
    roles: [NetworkCoordinator]
    code: 201
    input: [code, name]
    output: ServiceTaxonomyCategory
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/care-network/taxonomy"
    description: "List taxonomy categories"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceTaxonomyCategory[]
    side_effects: []

  - method: GET
    path: "/care-network/taxonomy/{id}"
    description: "Get a category"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: []
    output: ServiceTaxonomyCategory
    side_effects: []

  - method: POST
    path: "/care-network/taxonomy/{id}/retire"
    description: "Retire a category"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: ServiceTaxonomyCategory
    side_effects: ["status -> RETIRED"]

  # --- organizations ---
  - method: POST
    path: "/care-network/organizations"
    description: "Register an organization (CBO onboarding entry point)"
    roles: [NetworkCoordinator]
    code: 201
    input: [name, org_type, ein, "funder_type?"]
    output: Organization
    side_effects: ["status=PENDING_REVIEW, payable_balance_cents=0"]

  - method: GET
    path: "/care-network/organizations"
    description: "List organizations"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: ["org_type?", "status?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  - method: GET
    path: "/care-network/organizations/{id}"
    description: "Get an organization"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: POST
    path: "/care-network/organizations/{id}/activate"
    description: "Activate an org (PENDING_REVIEW or SUSPENDED -> ACTIVE)"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: Organization
    side_effects: ["increments Organization.version by 1"]

  - method: POST
    path: "/care-network/organizations/{id}/suspend"
    description: "Suspend an org; cascades to offerings and routed referrals (OCC-guarded)"
    roles: [NetworkCoordinator]
    code: 200
    input: [suspension_reason, expected_org_version]
    output: Organization
    side_effects:
      - "increments Organization.version by 1"
      - "Cascade A: offerings PAUSED; ROUTED referrals force-declined; reservation release; overflow auto-cancel"

  - method: POST
    path: "/care-network/organizations/{id}/terminate"
    description: "Terminate an org"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: Organization
    side_effects: ["increments Organization.version by 1", "agreements TERMINATED (cascade B)"]

  # --- service offerings ---
  - method: POST
    path: "/care-network/organizations/{id}/offerings"
    description: "Declare a service offering with eligibility + capacity"
    roles: [OrgAdmin, NetworkCoordinator]
    code: 201
    input: [category_code, description, capacity_total, "min_client_age?", "max_client_age?", "eligible_zip_codes?", "eligible_genders?", "income_cap_annual_cents?"]
    output: ServiceOffering
    side_effects: ["capacity_consumed=0; org must be ACTIVE; category must be ACTIVE"]

  - method: GET
    path: "/care-network/organizations/{id}/offerings"
    description: "List an org's offerings"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceOffering[]
    side_effects: []

  - method: GET
    path: "/care-network/offerings/{id}"
    description: "Get an offering"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: []
    output: ServiceOffering
    side_effects: []

  - method: POST
    path: "/care-network/offerings/{id}/pause"
    description: "Pause an offering"
    roles: [OrgAdmin, NetworkCoordinator]
    code: 200
    input: []
    output: ServiceOffering
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/care-network/offerings/{id}/resume"
    description: "Resume an offering"
    roles: [OrgAdmin, NetworkCoordinator]
    code: 200
    input: []
    output: ServiceOffering
    side_effects: ["status -> ACTIVE"]

  # --- clients ---
  - method: POST
    path: "/care-network/clients"
    description: "Register a client"
    roles: [CaseWorker, NetworkCoordinator]
    code: 201
    input: [full_name, date_of_birth, zip_code, gender, "annual_income_cents?", "race?", "ethnicity?", "language?", "veteran_status?"]
    output: Client
    side_effects: ["open_referral_count=0"]

  - method: GET
    path: "/care-network/clients/{id}"
    description: "Get a client"
    roles: [NetworkCoordinator, CaseWorker]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- agreements ---
  - method: POST
    path: "/care-network/agreements"
    description: "Create a DataSharingAgreement between two orgs"
    roles: [NetworkCoordinator]
    code: 201
    input: [party_a_org_id, party_b_org_id, effective_at]
    output: DataSharingAgreement
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/care-network/agreements"
    description: "List agreements"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: ["party_a_org_id?", "party_b_org_id?", "status?", "limit?", "offset?"]
    output: DataSharingAgreement[]
    side_effects: []

  - method: GET
    path: "/care-network/organizations/{id}/agreements"
    description: "List agreements naming this org as either party"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin, CaseWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: DataSharingAgreement[]
    side_effects: []

  - method: POST
    path: "/care-network/agreements/{id}/approve"
    description: "Approve an agreement (effective_at must have arrived)"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: DataSharingAgreement
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/care-network/agreements/{id}/expire"
    description: "Expire an agreement"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: DataSharingAgreement
    side_effects: ["status -> EXPIRED"]

  - method: POST
    path: "/care-network/agreements/{id}/terminate"
    description: "Terminate an agreement; cascades consent revocation"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: DataSharingAgreement
    side_effects: ["status -> TERMINATED", "Cascade B: matching consents REVOKED -> Cascade C"]

  # --- consents ---
  - method: POST
    path: "/care-network/clients/{id}/consents"
    description: "Record client consent for a sender/receiver org pair"
    roles: [CaseWorker, NetworkCoordinator]
    code: 201
    input: [sender_org_id, receiver_org_id, scope]
    output: Consent
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/care-network/consents"
    description: "List consents filtered by counterparty org (FK reverse-reachability for Consent.sender_org_id / receiver_org_id)"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin]
    code: 200
    input: ["sender_org_id?", "receiver_org_id?", "status?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []

  - method: GET
    path: "/care-network/clients/{id}/consents"
    description: "List a client's consents"
    roles: [NetworkCoordinator, CaseWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []

  - method: GET
    path: "/care-network/consents/{id}"
    description: "Get a consent"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin]
    code: 200
    input: []
    output: Consent
    side_effects: []

  - method: POST
    path: "/care-network/consents/{id}/revoke"
    description: "Revoke consent; propagates referral cancellation + claim void cascade"
    roles: [CaseWorker, NetworkCoordinator]
    code: 200
    input: []
    output: Consent
    side_effects: ["Cascade C: non-terminal referrals CANCELLED, reservations released, open claims VOIDED with escrow reserve"]

  # --- referrals ---
  - method: POST
    path: "/care-network/referrals"
    description: "Create a referral in DRAFT (consent + category validated eagerly)"
    roles: [CaseWorker]
    code: 201
    input: [client_id, sender_org_id, receiver_org_id, service_offering_id, consent_id, category_code, "urgency?"]
    output: Referral
    side_effects: ["status=DRAFT; no capacity reservation yet"]

  - method: GET
    path: "/care-network/referrals"
    description: "List referrals (coordinator oversight of unresolved/aging)"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin, FunderAdmin]
    code: 200
    input: ["client_id?", "sender_org_id?", "receiver_org_id?", "service_offering_id?", "consent_id?", "status?", "aging_only?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/care-network/offerings/{id}/referrals"
    description: "List referrals currently routed to an offering"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/care-network/referrals/{id}"
    description: "Get a referral"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin, FunderAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/care-network/referrals/{id}/route"
    description: "Route a DRAFT referral (eligibility + capacity gate)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Referral
    side_effects: ["DRAFT -> ROUTED; capacity_consumed += 1; open_referral_count += 1"]

  - method: POST
    path: "/care-network/referrals/{id}/accept"
    description: "Receiver accepts"
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["ROUTED -> ACCEPTED"]

  - method: POST
    path: "/care-network/referrals/{id}/decline"
    description: "Receiver declines; reservation released; overflow auto-cancel"
    roles: [OrgAdmin]
    code: 200
    input: [reason]
    output: Referral
    side_effects: ["ROUTED -> DECLINED; capacity_consumed -= 1; reassignment_count += 1"]

  - method: POST
    path: "/care-network/referrals/{id}/reassign"
    description: "Re-route a DECLINED or ESCALATED referral to a new receiver (OCC-guarded)"
    roles: [CaseWorker, NetworkCoordinator]
    code: 200
    input: [new_receiver_org_id, new_service_offering_id, expected_referral_version]
    output: Referral
    side_effects: ["increments Referral.version by 1; DECLINED/ESCALATED -> ROUTED; old/new reservation swap"]

  - method: POST
    path: "/care-network/referrals/{id}/escalate"
    description: "Coordinator escalates an aging ROUTED referral"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["ROUTED -> ESCALATED"]

  - method: POST
    path: "/care-network/referrals/{id}/start-service"
    description: "Receiver marks service started"
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["ACCEPTED -> IN_SERVICE; service_started_at set"]

  - method: POST
    path: "/care-network/referrals/{id}/confirm-outcome"
    description: "Receiver confirms closed-loop outcome"
    roles: [OrgAdmin]
    code: 200
    input: [outcome_code, delivered_units]
    output: Referral
    side_effects: ["IN_SERVICE -> OUTCOME_RECORDED; OutcomeRecord created; reservation released; open_referral_count -= 1"]

  - method: POST
    path: "/care-network/referrals/{id}/cancel"
    description: "Cancel a non-terminal referral"
    roles: [CaseWorker, NetworkCoordinator]
    code: 200
    input: [reason]
    output: Referral
    side_effects: ["-> CANCELLED; reservation released if held; open_referral_count -= 1"]

  - method: GET
    path: "/care-network/clients/{id}/referrals"
    description: "List a client's referrals"
    roles: [NetworkCoordinator, CaseWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  # --- referral notes ---
  - method: POST
    path: "/care-network/referrals/{id}/notes"
    description: "Add a referral note"
    roles: [CaseWorker, OrgAdmin, NetworkCoordinator]
    code: 201
    input: [body, "visibility?"]
    output: ReferralNote
    side_effects: []

  - method: GET
    path: "/care-network/referrals/{id}/notes"
    description: "List notes on a referral"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReferralNote[]
    side_effects: []

  - method: GET
    path: "/care-network/organizations/{id}/notes"
    description: "List referral notes authored by an org (FK reverse-reachability for ReferralNote.author_org_id)"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReferralNote[]
    side_effects: []

  # --- outcome records ---
  - method: GET
    path: "/care-network/referrals/{id}/outcome"
    description: "Get the OutcomeRecord of a referral (array of 0 or 1)"
    roles: [NetworkCoordinator, CaseWorker, OrgAdmin, FunderAdmin]
    code: 200
    input: []
    output: OutcomeRecord[]
    side_effects: []

  - method: GET
    path: "/care-network/organizations/{id}/outcomes"
    description: "List outcome records reported by an org (FK reverse-reachability for OutcomeRecord.reported_by_org_id)"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

  # --- rate cards ---
  - method: POST
    path: "/care-network/organizations/{id}/rate-cards"
    description: "Funder publishes a rate card for a category"
    roles: [FunderAdmin, NetworkCoordinator]
    code: 201
    input: [category_code, rate_cents_per_unit, "min_units?", "tier2_rate_cents_per_unit?", "monthly_cap_cents?"]
    output: ServiceRateCard
    side_effects: ["status=ACTIVE; org must be FUNDER and ACTIVE"]

  - method: GET
    path: "/care-network/organizations/{id}/rate-cards"
    description: "List a funder's rate cards"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceRateCard[]
    side_effects: []

  - method: GET
    path: "/care-network/rate-cards/{id}"
    description: "Get a rate card"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: []
    output: ServiceRateCard
    side_effects: []

  # --- claims ---
  - method: POST
    path: "/care-network/claims"
    description: "Submit a payment claim for an OUTCOME_RECORDED referral"
    roles: [OrgAdmin]
    code: 201
    input: [referral_id, funder_org_id, claimed_units]
    output: PaymentClaim
    side_effects: ["provisional_amount_cents computed (PROVISIONAL variant); status=SUBMITTED"]

  - method: GET
    path: "/care-network/claims"
    description: "List claims"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: ["referral_id?", "funder_org_id?", "provider_org_id?", "status?", "limit?", "offset?"]
    output: PaymentClaim[]
    side_effects: []

  - method: GET
    path: "/care-network/claims/{id}"
    description: "Get a claim"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: []
    output: PaymentClaim
    side_effects: []

  - method: POST
    path: "/care-network/claims/{id}/review"
    description: "Move claim to UNDER_REVIEW"
    roles: [FunderAdmin]
    code: 200
    input: []
    output: PaymentClaim
    side_effects: ["SUBMITTED -> UNDER_REVIEW; reviewed_by_user_id set to the caller's full X-User-ID"]

  - method: POST
    path: "/care-network/claims/{id}/approve"
    description: "Approve a claim; computes FINAL amount with cap waterfall (OCC-guarded)"
    roles: [FunderAdmin]
    code: 200
    input: [expected_claim_version]
    output: PaymentClaim
    side_effects: ["increments PaymentClaim.version by 1; approved_amount_cents computed (FINAL variant); provider payable_balance_cents += approved"]

  - method: POST
    path: "/care-network/claims/{id}/deny"
    description: "Deny a claim"
    roles: [FunderAdmin]
    code: 200
    input: [reason]
    output: PaymentClaim
    side_effects: ["UNDER_REVIEW -> DENIED"]

  - method: POST
    path: "/care-network/claims/{id}/void"
    description: "Void a claim; clawback path for APPROVED claims"
    roles: [FunderAdmin, NetworkCoordinator]
    code: 200
    input: [reason]
    output: PaymentClaim
    side_effects: ["-> VOIDED; clawback waterfall; escrow reserve"]

  # --- disbursements ---
  - method: POST
    path: "/care-network/disbursements"
    description: "Schedule a payout batch to a provider org"
    roles: [FunderAdmin]
    code: 201
    input: [provider_org_id, funder_org_id, claim_ids]
    output: Disbursement
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/care-network/disbursements"
    description: "List disbursements"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: ["provider_org_id?", "funder_org_id?", "status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: GET
    path: "/care-network/disbursements/{id}"
    description: "Get a disbursement"
    roles: [NetworkCoordinator, FunderAdmin, OrgAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/care-network/disbursements/{id}/run"
    description: "Execute a payout batch (saga: all-or-nothing)"
    roles: [FunderAdmin]
    code: 200
    input: ["simulate_failure?"]
    output: Disbursement
    side_effects: ["SCHEDULED -> PAID: claims -> PAID, balances settled; or -> FAILED with no side effects"]

  # --- reports ---
  - method: POST
    path: "/care-network/organizations/{id}/reports"
    description: "Generate a FunderReport (DRAFT) for a period"
    roles: [FunderAdmin, NetworkCoordinator]
    code: 201
    input: [period_start, period_end]
    output: FunderReport
    side_effects: ["computed metrics evaluated at creation; status=DRAFT"]

  - method: GET
    path: "/care-network/reports/{id}"
    description: "Get a report"
    roles: [NetworkCoordinator, FunderAdmin]
    code: 200
    input: []
    output: FunderReport
    side_effects: []

  - method: GET
    path: "/care-network/organizations/{id}/reports"
    description: "List a funder's reports"
    roles: [NetworkCoordinator, FunderAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FunderReport[]
    side_effects: []

  - method: POST
    path: "/care-network/reports/{id}/seal"
    description: "Seal a report; freezes metrics"
    roles: [FunderAdmin]
    code: 200
    input: []
    output: FunderReport
    side_effects: ["DRAFT -> SEALED; baseline_snapshot_cents frozen"]

  # --- aging sweep ---
  - method: POST
    path: "/care-network/referrals/aging-sweep"
    description: "Run the aging sweep now: expire idle ROUTED referrals past referral_expiry_days"
    roles: [NetworkCoordinator]
    code: 200
    input: []
    output: { expired_count: integer, expired_referral_ids: array }
    side_effects: ["ROUTED referrals with floor((clock - routed_at)/24h) > referral_expiry_days -> EXPIRED with reservation release"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_FORBIDDEN_ORG, http: 403, condition: "Caller org does not own / is not the counterparty of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, unknown field, or FK target does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "No ACTIVE consent matches the referral's (sender, receiver) pair" }
  - { id: ERR_CONSENT_REVOKED, http: 422, condition: "Billing action against a referral whose consent is REVOKED" }
  - { id: ERR_AGREEMENT_INACTIVE, http: 422, condition: "No ACTIVE DataSharingAgreement covers the org pair" }
  - { id: ERR_AGREEMENT_NOT_YET_EFFECTIVE, http: 409, condition: "Agreement effective_at is after the server clock at approval time" }
  - { id: ERR_OFFERING_MISMATCH, http: 422, condition: "Offering does not belong to receiver, is PAUSED, or its category differs from the referral's" }
  - { id: ERR_CATEGORY_RETIRED, http: 422, condition: "Category is RETIRED; new offerings/referrals may not reference it" }
  - { id: ERR_CATEGORY_IN_USE, http: 409, condition: "Category retirement blocked by ACTIVE offerings referencing it" }
  - { id: ERR_ELIGIBILITY_FAILED, http: 422, condition: "Client fails age/zip/gender/income eligibility of the offering" }
  - { id: ERR_CAPACITY_EXHAUSTED, http: 409, condition: "Offering capacity_available < 1 at route/reassign/accept" }
  - { id: ERR_NOT_AGING, http: 409, condition: "Escalate rejected: referral has not exceeded the (urgency-adjusted) auto-accept window" }
  - { id: ERR_REASSIGNMENT_LOOP, http: 409, condition: "Reassignment targets the same org that just declined / currently holds the referral" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approve/deny actor is the same user who moved the claim to UNDER_REVIEW" }
  - { id: ERR_OUTCOME_UNITS_MISMATCH, http: 422, condition: "delivered_units inconsistent with outcome_code, or claimed_units != OutcomeRecord.delivered_units" }
  - { id: ERR_ESCROW_EXHAUSTED, http: 402, condition: "Network escrow cannot fund the clawback reserve; void/revoke rejected atomically" }
  - { id: ERR_UNSETTLED_BALANCE, http: 409, condition: "Org termination blocked: payable_balance_cents != 0" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_TRANSITION, http: 409, condition: "Org suspension blocked by SUBMITTED/UNDER_REVIEW claims" }
  - { id: ERR_OPEN_REFERRALS_BLOCK_TERMINATION, http: 409, condition: "Org termination blocked by non-terminal referrals naming the org" }
  - { id: ERR_RECEIVER_NOT_CBO, http: 422, condition: "Referral receiver org_type is not CBO" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A PaymentClaim already exists for this referral" }
  - { id: ERR_REFERRAL_NOT_BILLABLE, http: 422, condition: "Referral not OUTCOME_RECORDED or outcome not billable" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "Disbursement includes a claim that is not APPROVED or belongs to another provider" }
  - { id: ERR_CLAIM_ALREADY_PAID, http: 409, condition: "Void attempted on a claim already PAID via disbursement" }
  - { id: ERR_ORG_NOT_ACTIVE, http: 409, condition: "Required org (sender, receiver, offering owner, agreement party, provider) is not ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkCoordinator
    description: "Backbone network operator: onboards orgs, manages taxonomy and agreements, escalates and reassigns aging referrals, runs sweeps, controls the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /care-network/networks"
      - "POST /care-network/_clock/set_current_utc"
      - "POST /care-network/taxonomy (create/retire)"
      - "POST /care-network/organizations (register/activate/suspend/terminate)"
      - "POST /care-network/agreements (create/approve/expire/terminate)"
      - "POST /care-network/referrals/{id}/escalate"
      - "POST /care-network/referrals/aging-sweep"
    shared_operations:
      - "Read endpoints across the network"
      - "POST /care-network/referrals/{id}/reassign (shared with CaseWorker)"
      - "POST /care-network/claims/{id}/void (shared with FunderAdmin)"
      - "Offerings, clients, consents, notes, reports (shared creation)"

  - name: CaseWorker
    description: "Sender-side staff (clinic or CBO): registers clients, records consent, creates/routes/cancels referrals. X-User-ID is the org id, optionally suffixed '#<staff_label>' to distinguish individual workers of the same org."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /care-network/referrals (create)"
      - "POST /care-network/referrals/{id}/route"
      - "POST /care-network/referrals/{id}/cancel"
    shared_operations:
      - "POST /care-network/clients, POST /care-network/clients/{id}/consents, POST /care-network/consents/{id}/revoke"
      - "POST /care-network/referrals/{id}/reassign (shared with NetworkCoordinator)"
      - "Read endpoints"

  - name: OrgAdmin
    description: "Receiver CBO administrator: declares offerings, accepts/declines referrals, starts service, confirms outcomes, submits claims. X-User-ID is the org id, optionally suffixed '#<staff_label>'."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /care-network/referrals/{id}/accept"
      - "POST /care-network/referrals/{id}/decline"
      - "POST /care-network/referrals/{id}/start-service"
      - "POST /care-network/referrals/{id}/confirm-outcome"
      - "POST /care-network/claims (submit)"
    shared_operations:
      - "POST /care-network/organizations/{id}/offerings, pause/resume (shared with NetworkCoordinator)"
      - "POST /care-network/referrals/{id}/notes"
      - "Read endpoints"

  - name: FunderAdmin
    description: "Health plan / public agency administrator: publishes rate cards, adjudicates claims, runs disbursements, reads and seals funder reports. X-User-ID is the funder org id, optionally suffixed '#<staff_label>' — segregation-of-duties on claim approve/deny compares the FULL X-User-ID against the claim's reviewed_by_user_id, so two staff members of the same funder must use distinct suffixes."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /care-network/claims/{id}/review"
      - "POST /care-network/claims/{id}/approve"
      - "POST /care-network/claims/{id}/deny"
      - "POST /care-network/disbursements, POST /care-network/disbursements/{id}/run"
      - "POST /care-network/reports/{id}/seal"
    shared_operations:
      - "POST /care-network/organizations/{id}/rate-cards (shared with NetworkCoordinator)"
      - "POST /care-network/claims/{id}/void (shared with NetworkCoordinator)"
      - "Read endpoints; POST /care-network/organizations/{id}/reports (shared with NetworkCoordinator)"
