# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7. Logical clock boots at 2026-08-01T00:00:00Z.

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: standard_create_applies_defaults
        claim_type: defaults
        grounds: ["entities.ClaimStandard.fields.audit_validity_months", "entities.ClaimStandard.fields.renewal_window_days", "entities.ClaimStandard.fields.license_term_days"]
        distinguishing_aspect: "Omitting the three optional numeric configs applies defaults 12 / 60 / 365, and the system stamps version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { avm: $.data.audit_validity_months, rwd: $.data.renewal_window_days, ltd: $.data.license_term_days, v: $.data.version } }
          assert:
            - "audit_validity_months == 12 AND renewal_window_days == 60 AND license_term_days == 365"
            - "version == 1 (system-managed common field)"

      - name: product_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Product.fields.gtin"]
        distinguishing_aspect: "Omitting required gtin yields 400 ERR_VALIDATION and no product is persisted."
        test_recipe:
          setup: ["standard and brand exist"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status == 400"

      - name: ingredient_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Ingredient.fields.crop_type"]
        distinguishing_aspect: "crop_type outside {HIGH_RISK, LOW_RISK, NON_CROP} is rejected as a 400 ERR_VALIDATION."
        test_recipe:
          setup: ["DRAFT product P1 exists"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "X", crop_type: "MEDIUM_RISK", declared_weight_pct: 10.00 }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status == 400"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but non-existent product id returns 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /products/00000000-0000-0000-0000-000000000000", as: VerifierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: computed_field_in_request_body_rejected
        claim_type: computed_fields
        grounds: ["entities.Ingredient.fields.is_exempt"]
        distinguishing_aspect: "Sending the computed field is_exempt in a create body is rejected (400 ERR_VALIDATION); clients cannot forge exemption flags."
        test_recipe:
          setup: ["DRAFT product P1 exists"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 10.00, is_exempt: true }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status == 400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.Product", "state_machines.SupplierAffidavit", "state_machines.FacilityAudit", "state_machines.EnforcementCase", "state_machines.SamplingPlan"]
        distinguishing_aspect: "Each entity is born in its declared initial state: Product DRAFT, affidavit SUBMITTED, audit SCHEDULED, case OPENED; a zero-requirement plan is born COMPLETED (covered separately)."
        test_recipe:
          setup: ["standard, brand, DRAFT product with one HIGH_RISK ingredient"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id, pst: $.data.enrollment_status } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
          trigger:
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { affst: $.data.status } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { aust: $.data.status } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "CONSUMER_COMPLAINT", description: "d" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { cst: $.data.status } }
          assert:
            - "product created with enrollment_status == DRAFT"
            - "affidavit status == SUBMITTED; audit status == SCHEDULED; case status == OPENED"

      - name: submit_verified_product_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Product.DRAFT_to_SUBMITTED", "errors[ERR_PRODUCT_INVALID_STATE]"]
        distinguishing_aspect: "submit is only legal from DRAFT; a VERIFIED product rejects it with ERR_PRODUCT_INVALID_STATE and stays VERIFIED."
        test_recipe:
          setup:
            - "Product P1 fully VERIFIED (compliant sample, current affidavit, fresh PASSED audit)"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-06-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRODUCT_INVALID_STATE and http status == 409"
            - "product remains VERIFIED (no transition fired)"

      - name: confirm_collected_sample_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.TestSample.RESULT_RECORDED_to_CONFIRMED", "errors[ERR_SAMPLE_INVALID_STATE]"]
        distinguishing_aspect: "confirm requires RESULT_RECORDED; a COLLECTED sample (no result yet) rejects with ERR_SAMPLE_INVALID_STATE."
        test_recipe:
          setup: ["UNDER_EVALUATION product with ACTIVE plan (required 1) and one COLLECTED sample"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SAMPLE_INVALID_STATE and http status == 409"

      - name: review_expired_affidavit_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SupplierAffidavit.SUBMITTED_to_ACCEPTED", "state_machines.SupplierAffidavit.ACCEPTED_to_EXPIRED", "errors[ERR_AFFIDAVIT_NOT_REVIEWABLE]"]
        distinguishing_aspect: "review requires SUBMITTED; an affidavit swept to EXPIRED by the clock is settled and rejects review with ERR_AFFIDAVIT_NOT_REVIEWABLE."
        test_recipe:
          setup: ["affidavit ACCEPTED with window [2026-01-01, 2026-09-01); clock advanced to 2026-09-01 so the sweep flips it EXPIRED"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AFFIDAVIT_NOT_REVIEWABLE and http status == 409 (expiry is terminal-settled for review)"

      - name: decide_scheduled_audit_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.FacilityAudit.REPORT_SUBMITTED_to_PASSED", "errors[ERR_AUDIT_INVALID_STATE]"]
        distinguishing_aspect: "decide requires REPORT_SUBMITTED; a SCHEDULED audit (no report) rejects with ERR_AUDIT_INVALID_STATE."
        test_recipe:
          setup: ["brand B1 with SCHEDULED audit A1"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
          trigger:
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUDIT_INVALID_STATE and http status == 409"

      - name: resolve_closed_case_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.EnforcementCase.OPENED_to_SUBSTANTIATED", "errors[ERR_CASE_NOT_OPEN]"]
        distinguishing_aspect: "SUBSTANTIATED is terminal; a second resolve on the closed case fails with ERR_CASE_NOT_OPEN and applies no further penalty."
        test_recipe:
          setup: ["brand with DRAFT product; case C1 already resolved SUBSTANTIATED(WARNING) by eo-2"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "CONSUMER_COMPLAINT", description: "d" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "WARNING" }, as: EnforcementOfficer, as_user_id: "eo-2" }
          trigger:
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "eo-2", captures: { err: $.data.error_id } }
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { pts: $.data.lifetime_penalty_points } }
          assert:
            - "error_id == ERR_CASE_NOT_OPEN and http status == 409"
            - "brand lifetime_penalty_points == 5 (no double penalty from the rejected second resolve)"

      - name: plan_zero_required_samples_auto_completes
        claim_type: valid_transition
        grounds: ["state_machines.SamplingPlan.ACTIVE_to_COMPLETED", "calculations.required_sample_count"]
        distinguishing_aspect: "Empty-set edge: a plan whose formula yields required_sample_count == 0 (INGREDIENT_INTAKE, no PCR-required ingredients, low volume, clean history) is born COMPLETED without any samples."
        test_recipe:
          setup: ["product with a single NON_CROP ingredient, SUBMITTED then UNDER_EVALUATION"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Salt", crop_type: "NON_CROP", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { req: $.data.required_sample_count, st: $.data.status } }
          assert:
            - "required_sample_count == 0 (min(10, 0 base + 0 pcr + 0 volume + 0 history))"
            - "status == COMPLETED immediately at creation"

      - name: clock_sweep_expires_affidavit_and_flips_ingredient
        claim_type: side_effect_execution
        grounds: ["state_machines.SupplierAffidavit.ACCEPTED_to_EXPIRED", "entities.Ingredient.fields.compliance_status"]
        distinguishing_aspect: "Clock sweep at exactly valid_until (half-open end) expires the ACCEPTED affidavit and the derived ingredient compliance drops COMPLIANT -> PENDING."
        test_recipe:
          setup: ["DRAFT product with LOW_RISK 30% ingredient (affidavit-only requirement); affidavit ACCEPTED covering [2026-01-01, 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Oats", crop_type: "LOW_RISK", declared_weight_pct: 30.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id, cs0: $.data.compliance_status } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "GET /ingredients/${ing}", as: VerifierAdmin, captures: { cs1: $.data.compliance_status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: VerifierAdmin }
            - { call: "GET /affidavits/${aff}", as: VerifierAdmin, captures: { ast: $.data.status } }
            - { call: "GET /ingredients/${ing}", as: VerifierAdmin, captures: { cs2: $.data.compliance_status } }
          assert:
            - "before sweep: compliance_status == COMPLIANT (affidavit requirement satisfied)"
            - "at exactly valid_until: affidavit status == EXPIRED (half-open end is out of coverage)"
            - "after sweep: ingredient compliance_status == PENDING"

      - name: clock_sweep_moves_product_to_renewal_due_then_lapsed
        claim_type: side_effect_execution
        grounds: ["state_machines.Product.VERIFIED_to_RENEWAL_DUE", "state_machines.Product.RENEWAL_DUE_to_LAPSED", "state_machines.LabelLicense.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "Two sweep stages: entering the renewal window flips VERIFIED -> RENEWAL_DUE; passing valid_until without renewal expires the license and lapses the product, and LAPSED is terminal (submit afterwards fails)."
        test_recipe:
