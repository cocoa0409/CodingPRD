          Depth-4 cascade: mark-no-show mutates Booking (hop 1) -> appends a
          strike and recomputes Patient.reliability_score (hop 2) -> score 25 <
          50 auto-CANCELLs the patient's other future CONFIRMED booking with
          cancel_reason RELIABILITY_GATE (hop 3) -> that booking's slot releases
          BOOKED -> OPEN (hop 4). Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "Bookable practice/provider with type copay 10000 and four slots s1..s4"
            - "Patient booked all four slots while reliability was 100"
            - "b1, b2, b3 marked NO_SHOW in turn; after the third, score 25 < 50"
