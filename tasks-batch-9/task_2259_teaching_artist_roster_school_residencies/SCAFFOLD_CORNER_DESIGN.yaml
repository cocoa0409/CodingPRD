# =============================================================================
# §1.9 Scaffold Corner Design — task_2259_teaching_artist_roster_school_residencies
#
# Breadth probe over every testable claim the §1.1–§1.7 surface declares that the
# §1.8 depth probe does not already cover. Sections and claim_type values come
# verbatim from references/claim-extraction-guide.md; nothing is invented.
# `excluded_because:` stubs cite a §1.8 instance by name and carry no test_recipe.
#
# Fixture conventions reused throughout (identical to SCAFFOLD_DIFFICULTY_DESIGN):
#   * logical clock is always pinned to 2026-08-01T00:00:00Z first;
#   * "CLEARED ARTIST" means the 13-call chain intake → PORTFOLIO_REVIEW →
#     2 portfolio reviews → DEMO_SCHEDULED → DEMO_PASSED (evaluator
#     demo-evaluator-1, never a panelist) → SCREENING_PENDING → 3 CLEARED
#     screenings (2026-07-01 .. 2027-06-30) → CLEARED, which also auto-moves the
#     roster axis NOT_LISTED → ACTIVE;
#   * the canonical residency is DANCE / G3_5 / instruction_language "es" /
#     60-minute sessions / budget 200000, taught by its own APPRENTICE lead, so
#     session_fee is 13974 at full length (12600 graded → 11340 tiered → +1134
#     lead premium → +1500 bilingual);
#   * every POST /sessions is preceded by a fresh GET /residencies/{id} so that
#     expected_residency_version is a captured placeholder, never a literal.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: Entities
    instances:

      - name: school_partner_creation_returns_envelope_and_all_fields
        claim_type: creation
        grounds:
          - endpoints[POST /school-partners]
          - entities.SchoolPartner
          - response_envelope.success
        distinguishing_aspect: "201 with every input field echoed and both computed fields seeded (partnership_health HEALTHY, open_residency_count 0), inside the §1.0 success envelope."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id, health: $.data.partnership_health, orc: $.data.open_residency_count }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id is present"
            - "${health} == HEALTHY"
            - "${orc} == 0"
            - "SchoolPartner.${s1_id}.name == Riverbend Arts Academy"
            - "SchoolPartner.${s1_id}.concurrent_session_capacity == 2"
            - "SchoolPartner.${s1_id}.total_enrollment == 600"
            - "SchoolPartner.${s1_id}.frl_pct == 0.62"
            - "SchoolPartner.${s1_id}.ell_pct == 0.28"
            - "SchoolPartner.${s1_id}.iep_pct == 0.14"

      - name: teaching_artist_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /teaching-artists/{id}]
          - entities.TeachingArtist
        distinguishing_aspect: "GET /teaching-artists/{id} returns exactly what intake stored, including both state axes and the capability tag arrays in their submitted order."
        test_recipe:
          setup:
            - "One applicant artist, no vetting progress yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", secondary_disciplines: ["THEATER"], grade_bands: ["G3_5", "G6_8"], languages: ["en", "es"], roster_tier_assigned: "APPRENTICE" }
              as: RosterCoordinator
              captures: { a1_id: $.data.id }
          trigger:
            - call: "GET /teaching-artists/${a1_id}"
              payload: {}
              as: CurriculumSpecialist
              captures: { got_id: $.data.id, vet: $.data.vetting_status, ros: $.data.roster_status }
          assert:
            - "HTTP status == 200"
            - "${got_id} == ${a1_id}"
            - "${vet} == APPLIED"
            - "${ros} == NOT_LISTED"
            - "TeachingArtist.${a1_id}.full_name == Ana Reyes"
            - "TeachingArtist.${a1_id}.primary_discipline == DANCE"
            - "TeachingArtist.${a1_id}.secondary_disciplines == [THEATER]"
            - "TeachingArtist.${a1_id}.grade_bands == [G3_5, G6_8]"
            - "TeachingArtist.${a1_id}.languages == [en, es]"
            - "TeachingArtist.${a1_id}.roster_tier_assigned == APPRENTICE"

      - name: roster_listing_filters_by_discipline_then_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /teaching-artists]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The discipline filter is applied BEFORE pagination: with 2 DANCE artists out of 3 rows and limit 1, total_count is 2 (not 3) and has_more is true."
        test_recipe:
          setup:
            - "Three applicants: two DANCE, one MUSIC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", grade_bands: ["G3_5"], languages: ["en", "es"] }
              as: RosterCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /teaching-artists"
              payload: { full_name: "Bo Halvorsen", email: "bo.halvorsen@arts.org", primary_discipline: "DANCE", grade_bands: ["G3_5"], languages: ["en"] }
              as: RosterCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /teaching-artists"
              payload: { full_name: "Cai Moreno", email: "cai.moreno@arts.org", primary_discipline: "MUSIC", grade_bands: ["G6_8"], languages: ["en"] }
              as: RosterCoordinator
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /teaching-artists"
              payload: { discipline: "DANCE", limit: 1, offset: 0 }
              as: ProgramDirector
              captures: { first_id: "$.data[0].id" }
            - call: "GET /teaching-artists"
              payload: { discipline: "DANCE", limit: 1, offset: 1 }
              as: ProgramDirector
              captures: { second_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200 and response_type == array"
            - "first page: total_count == 2, has_more == true, limit == 1, offset == 0, data length == 1"
            - "second page: total_count == 2, has_more == false, offset == 1, data length == 1"
            - "${first_id} != ${second_id}"
            - "${first_id} IN [${a1_id}, ${a2_id}] and ${second_id} IN [${a1_id}, ${a2_id}]"
            - "${a3_id} does not appear on either page"

      - name: residency_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /residencies/{id}]
          - validations[priority=3]
          - errors[ERR_RESIDENCY_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown residency id resolves to ERR_RESIDENCY_NOT_FOUND (404) from the priority-3 path-existence pass, not to a 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call, so no residency exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /residencies/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: ProgramDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_RESIDENCY_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: session_create_without_end_time_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /sessions]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "end_time is a required §1.5 input with no default; omitting it fails at priority 4 (400) BEFORE any id resolution, state, capability or interval check can run."
        test_recipe:
          setup:
            - "A school, an applicant artist and a DRAFT residency exist so that every id in the body would resolve if the shape check passed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", grade_bands: ["G3_5"], languages: ["en", "es"] }
              as: RosterCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Story in Motion", discipline: "DANCE", grade_band: "G3_5", instruction_language: "es", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "CO_TEACH", required_strands: ["CREATING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { r1_id: $.data.id }
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: RosterCoordinator
              captures: { rv_1: $.data.version }
          trigger:
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "${a1_id}", session_date: "2026-09-15", start_time: "09:00", expected_residency_version: "${rv_1}" }
              as: RosterCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "Residency.${r1_id}.sessions_open_count == 0"
            - "Residency.${r1_id}.version == ${rv_1}"

      - name: residency_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /residencies]
          - entities.Residency.fields.instruction_language
          - entities.Residency.fields.materials_stipend_cents
          - entities.Residency.fields.co_planning_hours_required
        distinguishing_aspect: "Omitting the three optional residency inputs yields instruction_language \"en\", materials_stipend_cents 0 and co_planning_hours_required 0 — declared defaults, not nulls."
        test_recipe:
          setup:
            - "One school partner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Story in Motion", discipline: "DANCE", grade_band: "G3_5", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "OBSERVE", required_strands: ["CREATING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { r1_id: $.data.id, lang: $.data.instruction_language, stip: $.data.materials_stipend_cents, hours: $.data.co_planning_hours_required }
          assert:
            - "HTTP status == 201"
            - "${lang} == en"
            - "${stip} == 0"
            - "${hours} == 0"
            - "Residency.${r1_id}.status == DRAFT"
            - "Residency.${r1_id}.staffing_status == LEAD_VACANT"
            - "Residency.${r1_id}.sessions_unscheduled_count == 0"
            - "Residency.${r1_id}.available_cents == 0"

      - name: portfolio_review_computed_fields_and_artist_rollup
        claim_type: computed_fields
        grounds:
          - calculations.portfolio_composite
          - entities.PortfolioReview.fields.composite_score
          - entities.PortfolioReview.fields.recommendation
          - entities.TeachingArtist.fields.portfolio_mean_composite
        distinguishing_aspect: "composite_score and recommendation are derived per review (0.40/0.35/0.25 weights against the 3.50 threshold: 3.60 ADVANCE, 3.40 DECLINE) and the artist-level mean 3.50 is a rollup over BOTH reviews, not a copy of the latest one."
        test_recipe:
          setup:
            - "One applicant artist in PORTFOLIO_REVIEW with no reviews yet, so portfolio_mean_composite is null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", grade_bands: ["G3_5"], languages: ["en", "es"] }
              as: RosterCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "PORTFOLIO_REVIEW" }
              as: RosterCoordinator
          trigger:
            - call: "POST /teaching-artists/${a1_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-1", artistic_quality_score: 3.5, pedagogical_clarity_score: 4.0, cultural_responsiveness_score: 3.2 }
              as: CurriculumSpecialist
              captures: { pr1_id: $.data.id, c1: $.data.composite_score, rec1: $.data.recommendation }
            - call: "POST /teaching-artists/${a1_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-2", artistic_quality_score: 3.4, pedagogical_clarity_score: 3.4, cultural_responsiveness_score: 3.4 }
              as: CurriculumSpecialist
              captures: { pr2_id: $.data.id, c2: $.data.composite_score, rec2: $.data.recommendation }
          assert:
            - "${c1} == 3.60"
            - "${rec1} == ADVANCE"
            - "${c2} == 3.40"
            - "${rec2} == DECLINE"
            - "TeachingArtist.${a1_id}.portfolio_review_count == 2"
            - "TeachingArtist.${a1_id}.portfolio_mean_composite == 3.50"

      - name: artist_intake_seeds_system_fields_from_the_state_machines
        claim_type: system_fields
        grounds:
          - endpoints[POST /teaching-artists]
          - state_machines.TeachingArtist.vetting_status.initial_state
          - state_machines.TeachingArtist.roster_status.initial_state
          - entities.TeachingArtist.fields.reliability_bps_rolling
        distinguishing_aspect: "The two axis fields and the reliability metrics are system/computed, never client-supplied: intake always produces APPLIED / NOT_LISTED and 10000 bps on both variants, plus a server-generated id."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", grade_bands: ["G3_5"], languages: ["en", "es"], roster_tier_assigned: "MASTER" }
              as: RosterCoordinator
              captures: { a1_id: $.data.id, vet: $.data.vetting_status, ros: $.data.roster_status, rr: $.data.reliability_bps_rolling, rp: $.data.reliability_bps_program_year }
          assert:
            - "${a1_id} is a server-generated identifier, non-null and not present in the request"
            - "${vet} == APPLIED"
            - "${ros} == NOT_LISTED"
            - "${rr} == 10000"
            - "${rp} == 10000"
            - "TeachingArtist.${a1_id}.roster_tier_effective == MASTER"
            - "TeachingArtist.${a1_id}.demo_attempt_count == 0"
            - "TeachingArtist.${a1_id}.portfolio_mean_composite == null"
            - "TeachingArtist.${a1_id}.clearance_status == NONE"
            - "TeachingArtist.${a1_id}.created_at and updated_at are non-null and were not supplied by the client"

      - name: residency_type_constraints_reject_bad_enum_and_reversed_term
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.Residency.fields.grade_band
          - entities.Residency.fields.term_end_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Both an out-of-domain enum (grade_band \"G13\") and a reversed date pair (term_end_date before term_start_date) are priority-4 shape failures on the same endpoint; neither reaches the residency table."
        test_recipe:
          setup:
            - "One school partner and no residencies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Bad Band", discipline: "DANCE", grade_band: "G13", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "OBSERVE", required_strands: ["CREATING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { err_enum: $.data.error_id }
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Bad Term", discipline: "DANCE", grade_band: "G3_5", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "OBSERVE", required_strands: ["CREATING"], term_start_date: "2026-12-18", term_end_date: "2026-09-08", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { err_dates: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_dates} == ERR_INVALID_REQUEST"
            - "both responses carry HTTP status 400 and response_type error"
            - "SchoolPartner.${s1_id}.open_residency_count == 0"

      - name: calendar_blackout_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.CalendarBlackout
          - endpoints[POST /school-partners/{id}/calendar-blackouts]
          - endpoints[GET /school-partners/{id}/calendar-blackouts]
        distinguishing_aspect: "CalendarBlackout is declared common_fields: false — the row has no version/updated_at field and §1.5 exposes no update or delete endpoint for it, so the only way to change a school calendar is to add another window."
        test_recipe:
          setup:
            - "One school partner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /school-partners/${s1_id}/calendar-blackouts"
              payload: { blackout_type: "HOLIDAY", start_date: "2026-11-25", end_date: "2026-11-27", note: "Thanksgiving recess" }
              as: SchoolLiaison
              as_user_id: "${s1_id}"
              captures: { bo_id: $.data.id, bo_school: $.data.school_partner_id }
            - call: "GET /school-partners/${s1_id}/calendar-blackouts"
              payload: { limit: 10, offset: 0 }
              as: RosterCoordinator
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "HTTP status == 201 on the create and 200 on the list"
            - "${bo_school} == ${s1_id} (taken from the path, never from the body)"
            - "${listed_id} == ${bo_id}"
            - "CalendarBlackout.${bo_id} exposes no version field and no updated_at field"
            - "§1.5 declares no PATCH/PUT/DELETE endpoint for CalendarBlackout"
            - "list total_count == 1"

      - name: calendar_blackout_requires_an_existing_parent_school
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - entities.CalendarBlackout.parent
          - errors[ERR_SCHOOL_PARTNER_NOT_FOUND]
        distinguishing_aspect: "The blackout's parent comes from the path, so an unknown school id fails at priority 3 with ERR_SCHOOL_PARTNER_NOT_FOUND before the body is even shape-checked."
        test_recipe:
          setup:
            - "One real school partner exists, but the trigger addresses a different, non-existent id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /school-partners/00000000-0000-4000-8000-0000000000ff/calendar-blackouts"
              payload: { blackout_type: "HOLIDAY", start_date: "2026-11-25", end_date: "2026-11-27" }
              as: RosterCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_SCHOOL_PARTNER_NOT_FOUND"
            - "HTTP status == 404"
            - "GET /school-partners/${s1_id}/calendar-blackouts still reports total_count == 0"

      - name: session_body_reference_to_unknown_artist_is_rejected
        claim_type: flat_foreign_key_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=5]
          - errors[ERR_TEACHING_ARTIST_NOT_FOUND]
        distinguishing_aspect: "Flat topology means cross-references arrive in the body: an unresolvable assigned_artist_id is caught by the priority-5 body-existence pass (404) ahead of the OCC, state, allotment and interval checks that would otherwise also reject this DRAFT-residency request."
        test_recipe:
          setup:
            - "A school and a DRAFT residency; no artist row is ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
            - call: "POST /residencies"
