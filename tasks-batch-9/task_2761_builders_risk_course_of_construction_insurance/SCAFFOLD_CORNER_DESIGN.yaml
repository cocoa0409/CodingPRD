      - name: corner_mitigation_plan_is_demanded_only_for_grade_c_and_d_hazardous_notices
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MITIGATION_PLAN_REQUIRED]
          - validations[priority 75].ERR_MITIGATION_PLAN_REQUIRED
          - entities.TestingCommissioningNotice.mitigation_plan_ref
        distinguishing_aspect: "The requirement is conditional on two independent facts - the project's engineering_grade (C or D) and the notice being hazardous (hot_work OR water_charged) - so four combinations must diverge: grade C + hazardous + no plan fails, grade C + benign passes, grade C + hazardous + plan passes, and grade A + hazardous + no plan passes. It also outranks the window-conflict check at priority 80."
