              captures: { l999_id: $.data.id }
            - call: "POST /sales-orders/${below_moq_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot8_id}" }
              as: Brewer
              as_user_id: "${b8_id}"
          trigger:
            - call: "POST /sales-orders/${at_moq_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b8_id}"
              captures: { at_total: $.data.total_cents, at_sos: $.data.small_order_surcharge_cents }
            - call: "POST /sales-orders/${below_moq_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b8_id}"
              captures: { below_total: $.data.total_cents, below_sos: $.data.small_order_surcharge_cents }
          assert:
            - "AT_MOQ: SalesOrder.${at_moq_id}.chargeable_lbs == 2000"
            - "AT_MOQ: ${at_sos} == 0 and SalesOrder.${at_moq_id}.small_order_surcharge_cents == 0"
            - "AT_MOQ: SalesOrder.${at_moq_id}.subtotal_cents == 137000 and SalesOrder.${at_moq_id}.freight_cents == 25000 and SalesOrder.${at_moq_id}.pallet_break_fee_cents == 9000"
            - "AT_MOQ: ${at_total} == 171000"
            - "AT_MOQ: SalesOrder.${at_moq_id}.requires_cold_chain == false (no reefer surcharge in the 25000)"
            - "BELOW_MOQ: SalesOrder.${below_moq_id}.chargeable_lbs == 1999"
            - "BELOW_MOQ: OrderLine.${l999_id}.extended_cents == 68432 (round_half_up of 68431.5)"
            - "BELOW_MOQ: SalesOrder.${below_moq_id}.subtotal_cents == 136932"
            - "BELOW_MOQ: ${below_sos} == 7500"
            - "BELOW_MOQ: SalesOrder.${below_moq_id}.freight_cents == 25000 (the tier minimum still dominates 1999 * 12)"
            - "BELOW_MOQ: ${below_total} == 178432"
            - "the one-pound difference moves total_cents by 7568, not by 68"

      - name: substitute_candidate_admitted_at_exactly_offered_pounds
        boundary_metric: HopVariety.available_spot_lbs against SubstitutionOffer.offered_lbs
        endpoint: "POST /hop-contracts/{id}/substitution-offers"
        grounds:
          - calculations.substitution_ranking
          - validations[priority=38]
          - errors.ERR_NO_SUBSTITUTE_AVAILABLE
          - entities.SubstitutionOffer.fields.alpha_acid_delta_pct
          - concurrency_rules.substitution-offer-create-stale-contract
        distinguishing_aspect: |
          A different metric on a different endpoint: candidate-set membership turns
          on the peer variety's available_spot_lbs being AT LEAST the offered_lbs,
          so 999 available against 1000 offered leaves the set empty and 422s, while
          exactly 1000 admits the peer and mints the offer. Unlike the MOQ case this
          boundary decides whether a row exists at all, not the size of a fee.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000."
            - "Crop-year program 2026."
            - "Hop variety Citra: substitution_group AROMA_HIGH_ALPHA, alpha_acid_target_pct 12.50, available_spot_lbs 20000."
            - "Hop variety Mosaic: the SAME substitution_group, alpha_acid_target_pct 12.00, spot_price_cents_per_lb 450.00, and available_spot_lbs 999 — one pound short of what will be offered. It is the only peer in the group."
            - "A 5000 lb FIXED_CROP_YEAR Citra contract at 285.50 cents/lb; the program then reports an 80.00 percent harvest, so allocated_lbs is 4000, shortfall_lbs is 1000 and the contract is SHORTFALL_ADJUSTED — the only status from which an offer may be made."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Substitute Brewing", brewery_license_no: "BR-0014", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b9_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "MOSAIC", name: "Mosaic", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.00, spot_price_cents_per_lb: 450.00, available_spot_lbs: 999, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { mosaic_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b9_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cs_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 80.00, reported_note: "crop down a fifth" }
              as: AllocationManager
            - call: "GET /hop-contracts/${cs_id}"
              payload: {}
              as: AllocationManager
              captures: { cs_v1: $.data.version }
          trigger:
            - call: "POST /hop-contracts/${cs_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${cs_v1}", selection_mode: "AUTO_RANKED", offered_lbs: 1000 }
              as: AllocationManager
              captures: { err: $.data.error_id }
            - call: "PUT /hop-varieties/${mosaic_id}/spot-price"
              payload: { spot_price_cents_per_lb: 450.00, available_spot_lbs: 1000 }
              as: AllocationManager
            - call: "GET /hop-contracts/${cs_id}"
              payload: {}
              as: AllocationManager
              captures: { cs_v2: $.data.version }
            - call: "POST /hop-contracts/${cs_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${cs_v2}", selection_mode: "AUTO_RANKED", offered_lbs: 1000 }
              as: AllocationManager
              captures: { offer_id: $.data.id, offer_price: $.data.offered_price_cents_per_lb }
          assert:
            - "setup: HopContract.${cs_id}.status == SHORTFALL_ADJUSTED and HopContract.${cs_id}.allocated_lbs == 4000 and HopContract.${cs_id}.shortfall_lbs == 1000"
            - "at 999 available: the call returns HTTP 422 with ${err} == ERR_NO_SUBSTITUTE_AVAILABLE"
            - "at 999 available: GET /substitution-offers?hop_contract_id returns total_count 0 (no row was created)"
            - "at 999 available: HopContract.${cs_id}.version == ${cs_v1} (the refused call did not bump the contract)"
            - "at exactly 1000 available: the call returns HTTP 201 and SubstitutionOffer.${offer_id}.status == OPEN"
            - "at exactly 1000 available: SubstitutionOffer.${offer_id}.substitute_variety_id == ${mosaic_id} and SubstitutionOffer.${offer_id}.offered_lbs == 1000"
            - "at exactly 1000 available: ${offer_price} == 450.00 and SubstitutionOffer.${offer_id}.alpha_acid_delta_pct == 0.50"
            - "at exactly 1000 available: HopVariety.${mosaic_id}.available_spot_lbs == 1000 (nothing is drawn until the brewer accepts)"
            - "GET /substitution-offers?hop_contract_id returns total_count 1"

      - name: credit_exposure_exactly_at_limit_is_watch_not_hold
        boundary_metric: Brewer.credit_exposure_cents against Brewer.credit_limit_cents
        endpoint: "PUT /brewers/{id}/credit-profile"
        grounds:
          - calculations.brewer_credit_posture
          - entities.Brewer.fields.credit_status
          - entities.Brewer.fields.credit_utilization_pct
          - concurrency_rules.credit-profile-update-stale-brewer
        distinguishing_aspect: |
          A third metric on a third endpoint, and the sharpest precision trap in the
          scaffold: the HOLD test compares RAW CENTS while
          credit_utilization_pct is rounded to two places. Exposure 171000 against a
          limit of 171000 gives 100.00 percent and WATCH; against 170999 it still
          ROUNDS to 100.00 percent yet must be HOLD. An implementation that reads the
          status off the rounded percentage cannot tell these two apart.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and cold_chain_certified false."
            - "Malt product Pale Ale Malt with a released 20000 lb lot."
            - "A CONFIRMED malt-only order of two 1000 lb lines, total_cents 171000, so credit_exposure_cents is exactly 171000 and ar_balance_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Exactly Brewing", brewery_license_no: "BR-0015", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b10_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-2606", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { lot10_id: $.data.id }
            - call: "POST /malt-lots/${lot10_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lot10_id}/release"
              payload: { release_note: "cleared" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b10_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-EXACT" }
              as: Brewer
              as_user_id: "${b10_id}"
              captures: { og_id: $.data.id }
            - call: "POST /sales-orders/${og_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot10_id}" }
              as: Brewer
              as_user_id: "${b10_id}"
            - call: "POST /sales-orders/${og_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot10_id}" }
              as: Brewer
              as_user_id: "${b10_id}"
            - call: "POST /sales-orders/${og_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b10_id}"
            - call: "GET /brewers/${b10_id}"
              payload: {}
              as: CreditManager
              captures: { b10_v1: $.data.version }
          trigger:
            - call: "PUT /brewers/${b10_id}/credit-profile"
              payload: { expected_brewer_version: "${b10_v1}", credit_limit_cents: 171000 }
              as: CreditManager
              captures: { at_status: $.data.credit_status, at_util: $.data.credit_utilization_pct, b10_v2: $.data.version }
            - call: "PUT /brewers/${b10_id}/credit-profile"
              payload: { expected_brewer_version: "${b10_v2}", credit_limit_cents: 170999 }
              as: CreditManager
              captures: { over_status: $.data.credit_status, over_util: $.data.credit_utilization_pct }
          assert:
            - "setup: SalesOrder.${og_id}.total_cents == 171000 and Brewer.${b10_id}.credit_exposure_cents == 171000 and Brewer.${b10_id}.ar_balance_cents == 0"
            - "at limit exactly 171000: ${at_util} == 100.00"
            - "at limit exactly 171000: ${at_status} == WATCH"
            - "at limit exactly 171000: ${at_status} != HOLD (the comparison is strictly greater-than)"
            - "at limit 170999: ${over_util} == 100.00 (the same rounded percentage)"
            - "at limit 170999: ${over_status} == HOLD"
            - "the two calls differ by one cent of limit and produce the same credit_utilization_pct but different credit_status"
            - "Brewer.${b10_id}.open_order_exposure_cents == 171000 throughout"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies over different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_pick_gated_on_malt_lot_release_state
        entity_pair: [SalesOrder, MaltLot]
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_PICKED
          - state_machines.MaltLot.PASSED_to_RELEASED
          - validations[priority=22]
          - errors.ERR_MALT_LOT_NOT_RELEASED
          - validations[priority=20]
        distinguishing_aspect: |
          The dependent pair is SalesOrder -> MaltLot: the order's own fields are
          all in order and its credit dimension is APPROVED, yet the pick is refused
          purely because a DIFFERENT entity is one transition short — the lot is
          PASSED, not RELEASED. Because release is segregation-of-duties guarded,
          unblocking the order requires a second, different user, which no
          same-entity retry could achieve.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and cold_chain_certified false."
            - "Malt product Pale Ale Malt with a 20000 lb lot analysed by qa-analyst-1 — so the lot is PASSED with analyzed_by_user_id qa-analyst-1 and has NOT been released."
            - "A malt-only order of two 1000 lb lines, CONFIRMED with total_cents 171000 and credit_status APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Held Lot Brewing", brewery_license_no: "BR-0016", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b11_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-2607", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { lot11_id: $.data.id }
            - call: "POST /malt-lots/${lot11_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b11_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-LOT" }
              as: Brewer
              as_user_id: "${b11_id}"
              captures: { oh_id: $.data.id }
            - call: "POST /sales-orders/${oh_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot11_id}" }
              as: Brewer
              as_user_id: "${b11_id}"
            - call: "POST /sales-orders/${oh_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot11_id}" }
              as: Brewer
              as_user_id: "${b11_id}"
            - call: "POST /sales-orders/${oh_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b11_id}"
            - call: "POST /sales-orders/${oh_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
          trigger:
            - call: "POST /sales-orders/${oh_id}/pick"
              payload: {}
              as: WarehouseOperator
              captures: { blocked: $.data.error_id }
            - call: "POST /malt-lots/${lot11_id}/release"
              payload: { release_note: "QA sign-off by second operator" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders/${oh_id}/pick"
              payload: {}
              as: WarehouseOperator
          assert:
            - "setup: MaltLot.${lot11_id}.status == PASSED and MaltLot.${lot11_id}.released_by_user_id == null"
            - "setup: SalesOrder.${oh_id}.fulfillment_status == CONFIRMED and SalesOrder.${oh_id}.credit_status == APPROVED and SalesOrder.${oh_id}.total_cents == 171000"
            - "the first pick returns HTTP 409 with ${blocked} == ERR_MALT_LOT_NOT_RELEASED"
            - "after the blocked pick: SalesOrder.${oh_id}.fulfillment_status == CONFIRMED (unchanged) and SalesOrder.${oh_id}.credit_status == APPROVED"
            - "after release: MaltLot.${lot11_id}.status == RELEASED and MaltLot.${lot11_id}.released_by_user_id == qa-analyst-2"
            - "the second pick returns HTTP 200 and SalesOrder.${oh_id}.fulfillment_status == PICKED"
            - "nothing about the order changed between the two picks; only the MaltLot moved"

      - name: shipment_depart_gated_on_order_credit_dimension
        entity_pair: [ColdChainShipment, SalesOrder]
        grounds:
          - state_machines.ColdChainShipment.STAGED_to_IN_TRANSIT
          - state_machines.SalesOrder.dimension.credit_status
          - validations[priority=46]
          - errors.ERR_ORDER_CREDIT_NOT_APPROVED
          - calculations.zone_occupancy_projection
        distinguishing_aspect: |
          A different pair and a different direction: the blocked entity is the
          ColdChainShipment and the gate is its parent order's CREDIT dimension,
          not the fulfillment dimension the shipment otherwise tracks. The order is
          already PICKED — the fulfillment precondition is satisfied — so only the
          credit dimension can be responsible, and the pallets must stay occupied
          while the departure is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and cold_chain_certified true."
            - "Hop variety Citra with cold_storage_required true, available_spot_lbs 20000."
            - "Cold storage zone Z1 with capacity_pallets 10 and temp_setpoint_c 2.0."
            - "An order with one 880 lb SPOT Citra line, confirmed at total_cents 95380, credit APPROVED, then PICKED."
            - "The credit decision is then reversed to HOLD BEFORE any shipment exists, so no shipment is dragged to HELD; the shipment is staged afterwards and sits in STAGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Dock Hold Brewing", brewery_license_no: "BR-0017", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b12_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone1_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b12_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-DOCK" }
              as: Brewer
              as_user_id: "${b12_id}"
              captures: { oi_id: $.data.id }
            - call: "POST /sales-orders/${oi_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b12_id}"
            - call: "POST /sales-orders/${oi_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b12_id}"
            - call: "POST /sales-orders/${oi_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /sales-orders/${oi_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "POST /sales-orders/${oi_id}/credit-decision"
              payload: { decision: "HOLD", decision_note: "aged receivable flagged after picking" }
              as: CreditManager
            - call: "GET /sales-orders/${oi_id}"
              payload: {}
              as: WarehouseOperator
              captures: { oi_v: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${oi_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${oi_v}", pallet_count: 4, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { si_id: $.data.id }
          trigger:
            - call: "POST /cold-chain-shipments/${si_id}/depart"
              payload: {}
              as: WarehouseOperator
              captures: { blocked: $.data.error_id }
            - call: "POST /sales-orders/${oi_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "receivable cleared" }
              as: CreditManager
            - call: "POST /cold-chain-shipments/${si_id}/depart"
              payload: {}
              as: WarehouseOperator
          assert:
            - "setup: SalesOrder.${oi_id}.fulfillment_status == PICKED and SalesOrder.${oi_id}.credit_status == ON_HOLD and SalesOrder.${oi_id}.total_cents == 95380"
            - "setup: ColdChainShipment.${si_id}.status == STAGED and ColdStorageZone.${zone1_id}.occupied_pallets == 4"
            - "the first depart returns HTTP 402 with ${blocked} == ERR_ORDER_CREDIT_NOT_APPROVED"
            - "after the blocked depart: ColdChainShipment.${si_id}.status == STAGED (still staged, not HELD and not IN_TRANSIT)"
            - "after the blocked depart: ColdStorageZone.${zone1_id}.occupied_pallets == 4 (the refusal must not release pallets)"
            - "after APPROVE: SalesOrder.${oi_id}.credit_status == APPROVED and SalesOrder.${oi_id}.fulfillment_status == PICKED"
            - "the second depart returns HTTP 200 and ColdChainShipment.${si_id}.status == IN_TRANSIT"
            - "after the successful depart: ColdStorageZone.${zone1_id}.occupied_pallets == 0"

      - name: program_settlement_gated_on_pending_carry_forward_contract
        entity_pair: [CropYearProgram, HopContract]
        grounds:
          - state_machines.CropYearProgram.HARVEST_REPORTED_to_SETTLED
          - state_machines.HopContract.ACTIVE_to_CARRY_FORWARD_PENDING
          - state_machines.HopContract.CARRY_FORWARD_PENDING_to_ACTIVE
          - validations[priority=13]
          - errors.ERR_INVALID_PROGRAM_STATE
        distinguishing_aspect: |
          A third pair, and the only one where the gate points DOWN the ownership
          edge: a parent CropYearProgram cannot reach its terminal SETTLED state
          while any child HopContract is still parked in CARRY_FORWARD_PENDING. The
          program's own status is already the correct HARVEST_REPORTED, so the
          refusal is entirely attributable to the child, and resolving it needs a
          decision on the child rather than a retry on the parent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000."
            - "Crop-year program 2026 and program 2027 (OPEN, crop_year one greater)."
            - "Hop variety Citra."
            - "A 5000 lb FIXED_CROP_YEAR contract at 250.00 cents/lb in program 2026."
            - "Program 2026 reports a 100.00 percent harvest, so it is HARVEST_REPORTED and the contract stays ACTIVE with remaining_lbs 5000."
            - "The brewer then files a 1250 lb carry-forward request into program 2027, parking the contract in CARRY_FORWARD_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Openbook Brewing", brewery_license_no: "BR-0018", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b13_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2027, contract_open_date: "2027-01-15T00:00:00Z", harvest_report_due_date: "2027-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog27_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b13_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cp_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
            - call: "POST /hop-contracts/${cp_id}/carry-forward-requests"
              payload: { carry_forward_target_program_id: "${prog27_id}", requested_lbs: 1250, justification: "no tank space this year" }
              as: Brewer
              as_user_id: "${b13_id}"
          trigger:
            - call: "POST /crop-year-programs/${prog26_id}/settle"
              payload: { settlement_note: "closing the crop year" }
              as: AllocationManager
              captures: { blocked: $.data.error_id }
            - call: "POST /hop-contracts/${cp_id}/carry-forward-decision"
              payload: { decision: "DECLINE", decision_note: "2027 crop already committed" }
              as: AllocationManager
            - call: "POST /crop-year-programs/${prog26_id}/settle"
              payload: { settlement_note: "closing the crop year" }
              as: AllocationManager
          assert:
            - "setup: CropYearProgram.${prog26_id}.status == HARVEST_REPORTED and HopContract.${cp_id}.status == CARRY_FORWARD_PENDING"
            - "the first settle returns HTTP 409 with ${blocked} == ERR_INVALID_PROGRAM_STATE"
            - "after the blocked settle: CropYearProgram.${prog26_id}.status == HARVEST_REPORTED (unchanged)"
            - "after DECLINE: HopContract.${cp_id}.status == ACTIVE and HopContract.${cp_id}.carry_forward_requested_lbs == null"
            - "the second settle returns HTTP 200 and CropYearProgram.${prog26_id}.status == SETTLED"
            - "CropYearProgram.${prog27_id}.status == OPEN (only the source program settles)"
            - "Brewer.${b13_id}.ar_balance_cents == 0 (a declined carry-forward posts no fee)"

  # ===========================================================================
  # Rule 8 — Resource / temporal overlap with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: zone_capacity_swept_over_half_open_staging_intervals
        resource_entity: ColdStorageZone
        interval_semantics: "HALF-OPEN [stage_from, stage_until) — aggregate sweep over merged boundaries; a sub-interval sum exactly equal to capacity_pallets is accepted, adjacency with a zero gap never overlaps"
        grounds:
          - calculations.zone_occupancy_projection
          - validations[priority=31]
          - errors.ERR_ZONE_CAPACITY_EXCEEDED
          - entities.ColdStorageZone.fields.capacity_pallets
          - entities.ColdStorageZone.fields.occupied_pallets
        distinguishing_aspect: |
          The contested resource is warehouse pallet space and the semantics are
          HALF-OPEN with an AGGREGATE sweep: capacity is a sum across every shipment
          covering an instant, so 6 + 5 breaches at 11 while 6 + 4 is admitted at
          exactly 10, and a shipment starting at the very instant another ends does
          not overlap at all. Each shipment goes on its OWN order, because a second
          shipment for the same order would supersede the first instead of stacking.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and cold_chain_certified true."
            - "Hop variety Citra with cold_storage_required true and available_spot_lbs 20000."
            - "Cold storage zone Z1 with capacity_pallets 10, temp_setpoint_c 2.0 and tolerance_c 2.0."
            - "Four separate DRAFT orders A, B, C and D, each with one 880 lb SPOT Citra line so each requires cold chain; a shipment may be staged for a DRAFT order because only departure needs a PICKED order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Pallet Tetris Brewing", brewery_license_no: "BR-0019", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b14_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone1_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b14_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-ZA" }
              as: Brewer
              as_user_id: "${b14_id}"
              captures: { za_id: $.data.id }
            - call: "POST /sales-orders/${za_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b14_id}"
            - call: "GET /sales-orders/${za_id}"
              payload: {}
              as: WarehouseOperator
              captures: { za_v: $.data.version }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b14_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-ZB" }
              as: Brewer
              as_user_id: "${b14_id}"
              captures: { zb_id: $.data.id }
            - call: "POST /sales-orders/${zb_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b14_id}"
            - call: "GET /sales-orders/${zb_id}"
              payload: {}
              as: WarehouseOperator
              captures: { zb_v: $.data.version }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b14_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-ZC" }
              as: Brewer
              as_user_id: "${b14_id}"
              captures: { zc_id: $.data.id }
            - call: "POST /sales-orders/${zc_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b14_id}"
            - call: "GET /sales-orders/${zc_id}"
              payload: {}
              as: WarehouseOperator
              captures: { zc_v: $.data.version }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b14_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-ZD" }
              as: Brewer
              as_user_id: "${b14_id}"
              captures: { zd_id: $.data.id }
            - call: "POST /sales-orders/${zd_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b14_id}"
            - call: "GET /sales-orders/${zd_id}"
              payload: {}
              as: WarehouseOperator
              captures: { zd_v: $.data.version }
          trigger:
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${za_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${za_v}", pallet_count: 6, stage_from: "2026-08-01T08:00:00Z", stage_until: "2026-08-01T16:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sa_id: $.data.id }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${zb_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${zb_v}", pallet_count: 5, stage_from: "2026-08-01T12:00:00Z", stage_until: "2026-08-01T20:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { over_err: $.data.error_id }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${zc_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${zc_v}", pallet_count: 5, stage_from: "2026-08-01T16:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sc_id: $.data.id }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${zd_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${zd_v}", pallet_count: 4, stage_from: "2026-08-01T12:00:00Z", stage_until: "2026-08-01T14:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sd_id: $.data.id }
          assert:
            - "S_a (6 pallets, 08:00-16:00): HTTP 201 and ColdChainShipment.${sa_id}.status == STAGED"
            - "S_b (5 pallets, 12:00-20:00): HTTP 409 with ${over_err} == ERR_ZONE_CAPACITY_EXCEEDED, because [12:00,16:00) would sum to 11 against capacity 10"
            - "S_b left no row: GET /cold-chain-shipments?sales_order_id=${zb_id} returns total_count 0"
            - "S_c (5 pallets, 16:00-24:00): HTTP 201 and ColdChainShipment.${sc_id}.status == STAGED — it begins at the exact instant S_a ends, so the half-open intervals do not overlap"
            - "S_d (4 pallets, 12:00-14:00): HTTP 201 and ColdChainShipment.${sd_id}.status == STAGED — [12:00,14:00) sums to exactly 10, and equality is accepted"
            - "ColdChainShipment.${sa_id}.status == STAGED and ColdChainShipment.${sc_id}.status == STAGED (admitting S_c and S_d superseded nothing; they are on different orders)"
            - "ColdStorageZone.${zone1_id}.occupied_pallets == 0 — the reported occupancy covers only the CURRENT clock 2026-08-01T00:00:00Z, which no staging window contains, even though three shipments passed the admission sweep"
            - "GET /cold-chain-shipments?cold_storage_zone_id=${zone1_id} returns total_count 3"

      - name: propagation_slot_gap_measured_in_whole_days_inclusive_at_lead_time
        resource_entity: YeastStrain
        interval_semantics: "MINIMUM-SEPARATION gap between pitch_date instants on one strain, measured in whole days and symmetric in both directions; a gap exactly equal to propagation_lead_time_days is permitted, anything strictly closer is refused"
        grounds:
          - validations[priority=29]
          - errors.ERR_PROPAGATION_SLOT_CONFLICT
          - entities.YeastStrain.fields.propagation_lead_time_days
          - state_machines.YeastPropagationJob
        distinguishing_aspect: |
          Not a coverage interval at all: the resource is a single propagation vessel
          per strain and the constraint is a MINIMUM SEPARATION between point-in-time
          pitch dates, so there are no start and end instants to sweep and no
          capacity to sum. Only jobs in REQUESTED, PROPAGATING or READY occupy the
          vessel, and the boundary is inclusive — exactly 7 days apart is legal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and credit_status GOOD_STANDING."
            - "Yeast strain WLP001, ALE, propagation_lead_time_days 7, min_batch_l 20.0, vessel_max_l 2000.0."
            - "Malt product Pale Ale Malt and a recipe 'House Ale' whose yeast_strain_id is WLP001."
            - "No propagation jobs yet, so the vessel is free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Vessel Queue Brewing", brewery_license_no: "BR-0020", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b15_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { wlp001_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${b15_id}", malt_product_id: "${malt_pale_id}", yeast_strain_id: "${wlp001_id}", name: "House Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${b15_id}"
              captures: { recipe15_id: $.data.id }
          trigger:
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${b15_id}", recipe_id: "${recipe15_id}", yeast_strain_id: "${wlp001_id}", pitch_date: "2026-08-20T00:00:00Z" }
              as: Brewer
              as_user_id: "${b15_id}"
              captures: { j1_id: $.data.id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${b15_id}", recipe_id: "${recipe15_id}", yeast_strain_id: "${wlp001_id}", pitch_date: "2026-08-25T00:00:00Z" }
              as: Brewer
              as_user_id: "${b15_id}"
              captures: { clash_err: $.data.error_id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${b15_id}", recipe_id: "${recipe15_id}", yeast_strain_id: "${wlp001_id}", pitch_date: "2026-08-27T00:00:00Z" }
              as: Brewer
              as_user_id: "${b15_id}"
              captures: { j3_id: $.data.id }
          assert:
            - "J1 at 2026-08-20 (19 days out, well beyond the 7-day lead): HTTP 201 and YeastPropagationJob.${j1_id}.status == REQUESTED"
            - "J2 at 2026-08-25 (a 5-day gap from J1): HTTP 409 with ${clash_err} == ERR_PROPAGATION_SLOT_CONFLICT"
            - "J2 left no row: GET /yeast-propagation-jobs?yeast_strain_id=${wlp001_id} returns total_count 1 at that point"
            - "J3 at 2026-08-27 (a gap of exactly 7 days from J1): HTTP 201 and YeastPropagationJob.${j3_id}.status == REQUESTED"
            - "GET /yeast-propagation-jobs?yeast_strain_id=${wlp001_id} finally returns total_count 2"
            - "YeastPropagationJob.${j1_id}.pitch_date == 2026-08-20T00:00:00Z and YeastPropagationJob.${j3_id}.pitch_date == 2026-08-27T00:00:00Z"
            - "YeastPropagationJob.${j1_id}.required_cells_billion == 33004.13, viability_fraction == 0.54 (19-day wait) and recommended_slurry_l == 50.932"
            - "YeastPropagationJob.${j3_id}.viability_fraction == 0.50 — a 26-day wait would decay to 0.40, so the floor clamps it — and recommended_slurry_l == 55.007"
            - "the conflict is symmetric: J2 was refused for being too close to an EARLIER job, and a J at 2026-08-13 would be refused for the same reason"

      - name: contract_delivery_windows_are_closed_intervals_sharing_an_endpoint
        resource_entity: HopContract
        interval_semantics: "CLOSED INCLUSIVE [delivery_window_start, delivery_window_end] pairwise intersection per (brewer_id, variety_id); sharing a single endpoint date IS an intersection and is refused, so back-to-back windows must be at least one day apart"
        grounds:
          - validations[priority=30]
          - errors.ERR_CONTRACT_WINDOW_OVERLAP
          - entities.HopContract.fields.delivery_window_start
          - entities.HopContract.fields.delivery_window_end
        distinguishing_aspect: |
          The opposite endpoint convention from the staging sweep: these intervals are
          CLOSED at both ends, so the adjacency that is legal for pallets is illegal
          here — a window ending 2026-12-31 and one starting 2026-12-31 share an
          instant and collide, while 2027-01-01 clears by a single day. The resource
          is the (brewer, variety) commitment slot and there is no capacity to sum;
          any intersection at all is fatal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000."
            - "Crop-year program 2026 OPEN — contracts may only be created against an OPEN program."
            - "Hop variety Citra; no existing contracts for this (brewer, variety) pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Window Pane Brewing", brewery_license_no: "BR-0021", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b16_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
          trigger:
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b16_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 2000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { wa_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b16_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "SPOT_HOLD", contracted_lbs: 1000, price_per_lb_cents: 51.00, delivery_window_start: "2026-12-31T00:00:00Z", delivery_window_end: "2027-03-31T00:00:00Z" }
              as: AllocationManager
              captures: { overlap_err: $.data.error_id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b16_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "SPOT_HOLD", contracted_lbs: 1000, price_per_lb_cents: 51.00, delivery_window_start: "2027-01-01T00:00:00Z", delivery_window_end: "2027-03-31T00:00:00Z" }
              as: AllocationManager
              captures: { wc_id: $.data.id }
          assert:
            - "C_a (2026-09-01 through 2026-12-31): HTTP 201 and HopContract.${wa_id}.status == ACTIVE"
            - "C_b (2026-12-31 through 2027-03-31): HTTP 409 with ${overlap_err} == ERR_CONTRACT_WINDOW_OVERLAP — the shared 2026-12-31 endpoint is an intersection"
            - "C_b left no row: GET /hop-contracts?brewer_id=${b16_id} returns total_count 1 at that point"
            - "C_c (2027-01-01 through 2027-03-31): HTTP 201 and HopContract.${wc_id}.status == ACTIVE — one day of clearance is enough"
            - "GET /hop-contracts?brewer_id=${b16_id} finally returns total_count 2"
            - "HopContract.${wa_id}.remaining_lbs == 2000 and HopContract.${wc_id}.remaining_lbs == 1000"
            - "the refused C_b did not disturb C_a: HopContract.${wa_id}.version is unchanged"

  # ===========================================================================
  # Rule 9 — Compensating invariant (conserved quantity survives undo)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: contract_poundage_conserved_across_commit_and_release
        conserved_quantity: "hop poundage on a HopContract — allocated_lbs == remaining_lbs + committed_lbs + carried_forward_out_lbs + defaulted_lbs + resold_lbs"
        conserved_quantity_type: physical_inventory_units
        grounds:
          - calculations.contract_allocation_ledger
          - state_machines.SalesOrder[dimension=fulfillment_status].transitions[DRAFT->CONFIRMED].side_effects
          - state_machines.SalesOrder[dimension=fulfillment_status].transitions[CONFIRMED->CANCELLED].side_effects
          - entities.HopContract.fields.allocated_lbs
          - entities.HopContract.fields.committed_lbs
          - entities.HopContract.fields.remaining_lbs
        distinguishing_aspect: |
          The conserved quantity is discrete physical poundage. Confirming an order
          moves pounds from remaining_lbs into committed_lbs and cancelling moves them
          back; allocated_lbs is the invariant total and must never move in either
          direction. The trap is an implementation that decrements remaining_lbs on
          confirm but recomputes allocated_lbs (or forgets to restore remaining_lbs)
          on cancel, leaving the five-way identity broken by 1200 lbs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer, cold_chain_certified true, credit_limit_cents 5000000."
            - "Crop-year program 2026 OPEN and hop variety Citra (pallet_quantity_lbs 880, available_spot_lbs 20000)."
            - "HopContract of 5000 lbs FIXED_CROP_YEAR at 285.50 cents/lb, delivery window 2026-09-01 through 2026-12-31."
            - "DRAFT order with requested_ship_date 2026-09-20 (inside the delivery window) and one CONTRACT hop line of 1200 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Ledger Balance Brewing", brewery_license_no: "BR-0022", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b17_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${b17_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { k17_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b17_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-CONS-1" }
              as: Brewer
              as_user_id: "${b17_id}"
              captures: { o17_id: $.data.id }
            - call: "POST /sales-orders/${o17_id}/lines"
              payload: { item_type: "HOP", quantity: 1200, uom: "LB", allocation_source: "CONTRACT", hop_contract_id: "${k17_id}" }
              as: Brewer
              as_user_id: "${b17_id}"
              captures: { l17_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${o17_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b17_id}"
            - call: "GET /hop-contracts/${k17_id}"
              payload: {}
              as: AllocationManager
              captures: { mid_alloc: $.data.allocated_lbs, mid_version: $.data.version }
            - call: "POST /sales-orders/${o17_id}/cancel"
              payload: { cancel_reason: "brewer rescheduled the brew day" }
              as: Brewer
              as_user_id: "${b17_id}"
          assert:
            - "at contract creation: HopContract.${k17_id}.allocated_lbs == 5000, committed_lbs == 0, remaining_lbs == 5000, carried_forward_out_lbs == 0, defaulted_lbs == 0, resold_lbs == 0 — identity 5000 == 5000 + 0 + 0 + 0 + 0"
            - "after confirm: HopContract.${k17_id}.committed_lbs == 1200 and remaining_lbs == 3800, with ${mid_alloc} == 5000 — identity 5000 == 3800 + 1200 + 0 + 0 + 0"
            - "after confirm: SalesOrder.${o17_id}.total_cents == 397600 (subtotal 342600, discount 0, freight 43000 including the 18000 reefer surcharge, pallet break 4500, small-order surcharge 7500)"
            - "after cancel: HopContract.${k17_id}.committed_lbs == 0 and remaining_lbs == 5000 — identity restored to 5000 == 5000 + 0 + 0 + 0 + 0 with no drift"
            - "HopContract.${k17_id}.allocated_lbs == 5000 at all three observation points; the cancel must not recompute it and must not double-credit remaining_lbs to 6200"
            - "HopContract.${k17_id}.status == ACTIVE and shortfall_lbs == 0 throughout — the release is a field-level compensation, not a state change"
            - "HopContract.${k17_id}.version is strictly greater than ${mid_version} (commit and release are separate writes)"
            - "OrderLine.${l17_id}.status == REMOVED and SalesOrder.${o17_id}.fulfillment_status == CANCELLED"
            - "HopVariety.${citra_id}.available_spot_lbs == 20000 — a CONTRACT line never touches the spot pool, so the release must not credit it there"

      - name: brewer_ar_balance_conserved_across_invoice_and_credit_memo
        conserved_quantity: "money on the Brewer ledger — ar_balance_cents plus open_order_exposure_cents nets back to zero once an invoiced order is fully reversed"
        conserved_quantity_type: monetary_receivable
        grounds:
          - calculations.brewer_ar_ledger
          - calculations.brewer_credit_posture
          - state_machines.SalesOrder[dimension=fulfillment_status].transitions[PICKED->SHIPPED].side_effects
          - state_machines.SalesOrder[dimension=fulfillment_status].transitions[CONFIRMED->CANCELLED].side_effects
          - entities.Brewer.fields.ar_balance_cents
        distinguishing_aspect: |
          A different kind of conserved quantity: money, and one that MOVES BETWEEN TWO
          BUCKETS before it is reversed. Confirming books the order into
          open_order_exposure_cents; shipping moves the identical amount out of that
          bucket and into ar_balance_cents so credit_exposure_cents is flat across the
          ship; cancelling a SHIPPED order must issue a credit memo for exactly the
          amount that was invoiced, driving ar_balance_cents to 0 without also
          re-crediting the open-order bucket it already left. Two ways to get this
          wrong: reverse from the wrong bucket, or double-count during the ship.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000, legacy_trailing_lbs 0, ar_balance_cents 0, cold_chain_certified true."
            - "Malt product Pale Ale Malt, list 68.50 cents/lb, pallet_quantity_lbs 2200, cold_storage_required false (so the order needs no cold chain and can ship without a shipment)."
            - "MaltLot of 5000 lbs analysed by qa-analyst-1 and released by qa-analyst-2 (segregation of duties), status RELEASED."
            - "DRAFT order with one MALT line of 1650 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Credit Memo Brewing", brewery_license_no: "BR-0023", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b18_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-AR-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { lot18_id: $.data.id }
            - call: "POST /malt-lots/${lot18_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lot18_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b18_id}", requested_ship_date: "2026-09-05T00:00:00Z", purchase_order_ref: "PO-CONS-2" }
              as: Brewer
              as_user_id: "${b18_id}"
              captures: { o18_id: $.data.id }
            - call: "POST /sales-orders/${o18_id}/lines"
              payload: { item_type: "MALT", quantity: 1650, uom: "LB", malt_lot_id: "${lot18_id}" }
              as: Brewer
              as_user_id: "${b18_id}"
              captures: { l18_id: $.data.id }
            - call: "POST /sales-orders/${o18_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b18_id}"
            - call: "POST /sales-orders/${o18_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "within limit" }
              as: CreditManager
            - call: "POST /sales-orders/${o18_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "GET /brewers/${b18_id}"
              payload: {}
              as: CreditManager
              captures: { pre_ship_ar: $.data.ar_balance_cents, pre_ship_open: $.data.open_order_exposure_cents, pre_ship_exposure: $.data.credit_exposure_cents }
          trigger:
            - call: "POST /sales-orders/${o18_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "GET /brewers/${b18_id}"
              payload: {}
              as: CreditManager
              captures: { post_ship_ar: $.data.ar_balance_cents, post_ship_open: $.data.open_order_exposure_cents, post_ship_exposure: $.data.credit_exposure_cents }
            - call: "POST /sales-orders/${o18_id}/cancel"
              payload: { cancel_reason: "load refused at the dock" }
              as: AllocationManager
          assert:
            - "after confirm: SalesOrder.${o18_id}.total_cents == 150025 (subtotal 113025, discount 0, freight 25000 at the TIER_1 minimum with no reefer surcharge, pallet break 4500, small-order surcharge 7500) and fee_variant == PROVISIONAL"
            - "pre-ship: ${pre_ship_ar} == 0, ${pre_ship_open} == 150025 and ${pre_ship_exposure} == 150025 — the money sits entirely in the open-order bucket"
            - "post-ship: ${post_ship_ar} == 150025 and ${post_ship_open} == 0, while ${post_ship_exposure} == 150025 — the ship MOVED the money between buckets and the total exposure is flat, not 300050"
            - "post-ship: SalesOrder.${o18_id}.invoiced_at == 2026-08-01T00:00:00Z and fulfillment_status == SHIPPED"
            - "post-ship: Brewer.${b18_id}.credit_utilization_pct == 3.00 and credit_status == GOOD_STANDING"
            - "after cancel: Brewer.${b18_id}.ar_balance_cents == 0 — the credit memo is exactly 150025, the amount that was invoiced, and final_freight_adjustment_cents is 0 because deliver never ran"
            - "after cancel: Brewer.${b18_id}.open_order_exposure_cents == 0, credit_exposure_cents == 0, credit_utilization_pct == 0.00 and credit_status == GOOD_STANDING — the reversal must not push open_order_exposure_cents back to 150025 nor ar_balance_cents to -150025"
            - "after cancel: SalesOrder.${o18_id}.fulfillment_status == CANCELLED and cancel_reason == 'load refused at the dock'"
            - "after cancel: OrderLine.${l18_id}.status == REMOVED, MaltLot.${lot18_id}.committed_lbs == 0 and available_lbs == 5000 — the physical release accompanies the monetary one"
            - "MaltLot.${lot18_id}.status == RELEASED and analysis_count == 1 are untouched by the cancel"

      - name: zone_pallet_space_conserved_across_supersede_and_depart
        conserved_quantity: "cold-storage pallet space — occupied_pallets returns to its starting value once every shipment that took space has released it, and never exceeds capacity_pallets"
        conserved_quantity_type: reusable_capacity_slots
        grounds:
          - calculations.zone_occupancy_projection
          - state_machines.ColdChainShipment.transitions[STAGED->SUPERSEDED].side_effects
          - state_machines.ColdChainShipment.transitions[STAGED->IN_TRANSIT].side_effects
          - entities.ColdStorageZone.fields.occupied_pallets
        distinguishing_aspect: |
          The conserved quantity is a REUSABLE capacity slot rather than consumable
          inventory or money: pallet space is lent out and handed back, so the ledger
          must return to exactly its starting value, and every release must return the
          releasing shipment's OWN pallet_count. The supersede is the trap — the newer
          shipment takes 3 while the superseded one gives back 4, so an implementation
          that releases the new count, or that stacks without releasing, lands on 7 or
          4 instead of 3. Departure then drains it back to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z so the staging window [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z) contains the current instant and occupancy is actually reported."
            - "Cold storage zone Z1 with capacity_pallets 10, temp_setpoint_c 2.0, tolerance_c 2.0 and occupied_pallets 0."
            - "Brewer, cold_chain_certified true, credit_limit_cents 5000000."
            - "Hop variety Citra with cold_storage_required true, available_spot_lbs 20000."
            - "Order with one 880 lb SPOT Citra line, confirmed, credit APPROVED and PICKED so departure is legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Pallet Ledger Brewing", brewery_license_no: "BR-0024", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b19_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone19_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b19_id}", requested_ship_date: "2026-09-10T00:00:00Z", purchase_order_ref: "PO-CONS-3" }
              as: Brewer
              as_user_id: "${b19_id}"
              captures: { o19_id: $.data.id }
            - call: "POST /sales-orders/${o19_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${b19_id}"
            - call: "POST /sales-orders/${o19_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b19_id}"
            - call: "POST /sales-orders/${o19_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "spot hops within limit" }
              as: CreditManager
            - call: "POST /sales-orders/${o19_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "GET /cold-storage-zones/${zone19_id}"
              payload: {}
              as: WarehouseOperator
              captures: { occ_start: $.data.occupied_pallets }
            - call: "GET /sales-orders/${o19_id}"
              payload: {}
              as: WarehouseOperator
              captures: { o19_v1: $.data.version }
          trigger:
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${o19_id}", cold_storage_zone_id: "${zone19_id}", expected_sales_order_version: "${o19_v1}", pallet_count: 4, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { ship1_id: $.data.id }
            - call: "GET /cold-storage-zones/${zone19_id}"
              payload: {}
              as: WarehouseOperator
              captures: { occ_after_1: $.data.occupied_pallets }
            - call: "GET /sales-orders/${o19_id}"
              payload: {}
              as: WarehouseOperator
              captures: { o19_v2: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${o19_id}", cold_storage_zone_id: "${zone19_id}", expected_sales_order_version: "${o19_v2}", pallet_count: 3, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { ship2_id: $.data.id }
            - call: "GET /cold-storage-zones/${zone19_id}"
              payload: {}
              as: WarehouseOperator
              captures: { occ_after_2: $.data.occupied_pallets }
            - call: "POST /cold-chain-shipments/${ship2_id}/depart"
              payload: {}
              as: WarehouseOperator
          assert:
            - "baseline: ${occ_start} == 0 and ColdStorageZone.${zone19_id}.capacity_pallets == 10"
            - "after the first shipment: ${occ_after_1} == 4 and ColdChainShipment.${ship1_id}.status == STAGED"
            - "the second shipment supersedes the first: ColdChainShipment.${ship1_id}.status == SUPERSEDED and ColdChainShipment.${ship2_id}.status == STAGED"
            - "after the supersede: ${occ_after_2} == 3 — the released 4 and the newly taken 3 both post, so occupancy is neither 7 (release skipped) nor 4 (wrong pallet_count released) nor 1 (the new count released instead)"
            - "after depart: ColdStorageZone.${zone19_id}.occupied_pallets == 0 and ColdChainShipment.${ship2_id}.status == IN_TRANSIT — the space is fully returned"
            - "ColdStorageZone.${zone19_id}.capacity_pallets == 10 at every observation point; capacity is never mutated to model occupancy"
            - "ColdChainShipment.${ship1_id}.pallet_count == 4 and ColdChainShipment.${ship2_id}.pallet_count == 3 — superseding does not rewrite the older row's pallet_count"
            - "SalesOrder.${o19_id}.total_cents == 95380 and fulfillment_status == PICKED are unaffected by the shipment churn"
            - "GET /cold-chain-shipments?cold_storage_zone_id=${zone19_id} returns total_count 2 (the SUPERSEDED row is retained as an audit record, not deleted)"
