            - { call: "GET /paper-machines/${pm1_id}", payload: {}, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_v2: "$.data.version" } }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-09T08:00:00Z", window_end: "2026-08-09T12:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm1_v2}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_b: "$.data.id" } }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_a}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_a}/complete", payload: { broke_tons: 0.000, reel_readings: [ { reel_no: 1, reel_tons: 5.000, basis_weight_gsm: 145.25, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 2, reel_tons: 5.000, basis_weight_gsm: 145.25, moisture_pct: 7.50, sct_kn_m: 2.50 } ] }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_b}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_b}/complete", payload: { broke_tons: 0.000, reel_readings: [ { reel_no: 1, reel_tons: 5.000, basis_weight_gsm: 145.26, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 2, reel_tons: 5.000, basis_weight_gsm: 145.26, moisture_pct: 7.50, sct_kn_m: 2.50 } ] }, as: MachineOperator, as_user_id: "mo_1" }
