scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with required fields returns 201 and account_status=ACTIVE, version=1, outstanding_balance_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { business_name: "New Account", billing_email: "n@x.com", credit_limit_cents: 250000 }
              as: Admin
              captures: { cust_id: $.data.id, st: $.data.account_status, ver: $.data.version, bal: $.data.outstanding_balance_cents }
          assert:
            - "Customer.${cust_id}.account_status == ACTIVE"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.outstanding_balance_cents == 0"

      - name: create_site_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Site.fields.municipality_code]
        distinguishing_aspect: "POST /sites omitting municipality_code is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A Customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Req Fields", billing_email: "rf@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "1 Missing St", permit_number: "P-Z" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer]
        distinguishing_aspect: "GET /customers/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: work_order_priority_defaults_to_routine
        claim_type: Defaults
        grounds: [entities.WorkOrder.fields.priority]
        distinguishing_aspect: "Creating a WorkOrder without priority defaults it to ROUTINE."
        test_recipe:
          setup: ["A Customer, Site, and grease-trap Equipment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Default Co", billing_email: "df@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "2 Def Rd", municipality_code: "MUNI-A", permit_number: "P-D" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id, pr: $.data.priority }
          assert:
            - "WorkOrder.${wo_id}.priority == ROUTINE"

      - name: new_equipment_service_state_is_overdue
        claim_type: Computed Fields
        grounds: [entities.Equipment.fields.service_state]
        distinguishing_aspect: "A never-serviced Equipment reports service_state=OVERDUE (next_service_due_at null)."
        test_recipe:
          setup: ["A Customer and Site"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Compute Co", billing_email: "cp@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "3 Cmp Rd", municipality_code: "MUNI-A", permit_number: "P-C" }
              as: Admin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id, ss: $.data.service_state }
          assert:
            - "Equipment.${eq_id}.service_state == OVERDUE"

  # =========================================================================
  - section: state_machines
    instances:
      - name: revise_non_rejected_report_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ComplianceReport.REJECTED_to_DRAFT]
        distinguishing_aspect: "Calling revise on a DRAFT (not REJECTED) ComplianceReport returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT ComplianceReport for a site with no equipment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Bad Revise", billing_email: "br@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "4 Rev Rd", municipality_code: "MUNI-B", permit_number: "P-R" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", municipality_code: "MUNI-B", period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep_id}/revise"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: transition_cancelled_contract_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceContract.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Transitioning a CANCELLED (terminal) ServiceContract to ACTIVE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A ServiceContract moved to CANCELLED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Terminal Co", billing_email: "tc@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_id: "${cust_id}", billing_cycle: "MONTHLY", base_rate_cents: 1000, tax_rate_bps: 0 }
              as: Admin
              captures: { contract_id: $.data.id }
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Admin
          trigger:
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: close_customer_with_open_balance_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Customer.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Closing a Customer with outstanding_balance_cents > 0 (an ISSUED invoice) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer with one ISSUED invoice (outstanding 12500)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Owes Money", billing_email: "om@x.com", credit_limit_cents: 1000000 }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_id: "${cust_id}", billing_cycle: "MONTHLY", base_rate_cents: 12500, tax_rate_bps: 0 }
              as: Admin
              captures: { contract_id: $.data.id }
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { cust_v: $.data.version }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", contract_id: "${contract_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_customer_version: "${cust_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /customers/${cust_id}/close"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # =========================================================================
  - section: calculations
    instances:
      - name: disposal_fee_single_tier_correct
        claim_type: Correct Result
        grounds: [calculations.pump_out_disposal_fee]
        distinguishing_aspect: "300 gallons entirely in tier 1 (300 x 40), fog 5, non-hazmat -> disposal_fee_cents=12000."
        test_recipe:
          setup: ["A grease-trap WorkOrder IN_PROGRESS owned by a technician"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Tier1 Co", billing_email: "t1@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "5 Tier Rd", municipality_code: "MUNI-A", permit_number: "P-T" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 500, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-7", hazmat_certified: false, volume_gallons: 300, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { fee: $.data.disposal_fee_cents, flag: $.data.compliance_flag }
          assert:
            - "PumpOutManifest.disposal_fee_cents == 12000"
            - "PumpOutManifest.compliance_flag == COMPLIANT"

      - name: fog_boundary_flag
        claim_type: Constants Applied
        grounds: [calculations.fog_compliance_flag]
        excluded_because:
          difficulty_instance: boundary_precision_check / fog_25_percent_inclusive_boundary
          rationale: "The 25.0 inclusive threshold flag transition is exercised directly by the named §1.8 boundary instance."

  # =========================================================================
  - section: validations
    instances:
      - name: rbac_technician_cannot_create_customer
        claim_type: Violation to Error
        grounds: ['validations[priority=2]', roles.Technician]
        distinguishing_aspect: "A Technician calling POST /customers (Admin-only) is denied with ERR_FORBIDDEN."
        test_recipe:
          setup: ["A Technician identity exists"]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { business_name: "Sneaky", billing_email: "sk@x.com" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: technician_cannot_start_unowned_work_order
        claim_type: Violation to Error
        grounds: ['validations[priority=2]', roles.Technician]
        distinguishing_aspect: "A Technician starting a WorkOrder dispatched to a different technician is denied with ERR_FORBIDDEN (ownership)."
        test_recipe:
          setup: ["WorkOrder dispatched to technician A; technician B distinct"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Own Co", billing_email: "ow@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "6 Own Rd", municipality_code: "MUNI-A", permit_number: "P-O" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech A", certification_level: "BASIC" }
              as: Admin
              captures: { techa_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { techb_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${techa_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${techb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: compliance_report_period_invalid_returns_422
        claim_type: Violation to Error
        grounds: ['validations[priority=4]', 'errors[ERR_REPORT_PERIOD_INVALID]']
        distinguishing_aspect: "A ComplianceReport with period_end <= period_start returns ERR_REPORT_PERIOD_INVALID."
        test_recipe:
          setup: ["A Site exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Period Co", billing_email: "pc2@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "7 Per Rd", municipality_code: "MUNI-B", permit_number: "P-P" }
              as: Admin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", municipality_code: "MUNI-B", period_start: "2026-05-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPORT_PERIOD_INVALID"

      - name: manifest_invalid_facility_permit_returns_422
        claim_type: Violation to Error
        grounds: ['validations[priority=6]', 'errors[ERR_DISPOSAL_FACILITY_INVALID]']
        distinguishing_aspect: "A manifest whose disposal_facility_permit is not prefixed 'FAC-' returns ERR_DISPOSAL_FACILITY_INVALID."
        test_recipe:
          setup: ["A grease-trap WorkOrder IN_PROGRESS owned by a technician"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Perm Co", billing_email: "pm@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "8 Perm Rd", municipality_code: "MUNI-A", permit_number: "P-PM" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "BADPERMIT", hazmat_certified: false, volume_gallons: 100, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISPOSAL_FACILITY_INVALID"

      - name: hood_certificate_on_grease_order_returns_type_mismatch
        claim_type: Cross-entity validation
        grounds: ['validations[priority=6]', 'errors[ERR_EQUIPMENT_TYPE_MISMATCH]']
        distinguishing_aspect: "Issuing a HoodCertificate against a GREASE_TRAP work order returns ERR_EQUIPMENT_TYPE_MISMATCH."
        test_recipe:
          setup: ["A grease-trap WorkOrder IN_PROGRESS owned by a technician"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Mismatch Co", billing_email: "mm@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "9 Mis Rd", municipality_code: "MUNI-A", permit_number: "P-M" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /hood-certificates"
              payload: { work_order_id: "${wo_id}", cleanliness_grade: "ACCEPTABLE" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EQUIPMENT_TYPE_MISMATCH"

      - name: list_work_orders_over_limit_returns_400
        claim_type: Type Constraints
        grounds: ['errors[ERR_PAGINATION_INVALID]']
        distinguishing_aspect: "GET /work-orders with limit=200 (> max 100) returns ERR_PAGINATION_INVALID."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders"
              payload: { limit: 200 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID"

  # =========================================================================
  - section: endpoints
    instances:
      - name: list_site_equipment_returns_array_envelope
        claim_type: Computed read
        grounds: [endpoints]
        distinguishing_aspect: "GET /sites/{id}/equipment returns response_type=array with a list of Equipment for the site."
        test_recipe:
          setup: ["A Site with two grease-trap equipment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "List Co", billing_email: "lc@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "10 Lst Rd", municipality_code: "MUNI-A", permit_number: "P-L" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "HOOD", capacity_gallons: 0, nominal_frequency_days: 90 }
              as: Admin
          trigger:
            - call: "GET /sites/${site_id}/equipment"
              payload: {}
              as: Dispatcher
          assert:
            - "response response_type == array"
            - "data length == 2"

      - name: filter_work_orders_by_equipment_fk_reverse
        claim_type: Cross-reference link
        grounds: [entities.WorkOrder.fields.equipment_id]
        distinguishing_aspect: "GET /work-orders?equipment_id={eq} returns only work orders for that equipment (FK reverse-reachability)."
        test_recipe:
          setup: ["One grease-trap equipment with a single SCHEDULED work order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "FK Co", billing_email: "fk@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "11 FK Rd", municipality_code: "MUNI-A", permit_number: "P-F" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "GET /work-orders"
              payload: { equipment_id: "${eq_id}" }
              as: Dispatcher
          assert:
            - "response response_type == array"
            - "data length == 1"

      - name: hood_certificate_happy_path_issues_sticker
        claim_type: Action endpoint
        grounds: [endpoints, entities.HoodCertificate.fields.sticker_number]
        distinguishing_aspect: "An NFPA96_CERTIFIED technician issues a HoodCertificate on a HOOD order in progress, minting a sticker_number."
        test_recipe:
          setup: ["A HOOD WorkOrder IN_PROGRESS owned by an NFPA96_CERTIFIED technician"]
          setup_api_calls:
            - call: "POST /customers"
