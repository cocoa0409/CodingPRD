scenario: "Down-Payment Assistance & Shared-Equity Program: applicant & income/AMI eligibility, assistance (grant/loan/shared-appreciation) calculation, homebuyer education & certificate, layered-funding & subordination, purchase & closing coordination, recapture/repayment on sale, servicing, reporting"
domain_name: "down-payment-assistance"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - dual_variant_calculation      # provisional-vs-final assistance; shared-appreciation-vs-declining-balance recapture
    - cascading_side_effects        # closing-complete disbursement chain; award-cancel release chain
    - optimistic_concurrency        # OCC on FundingSource.version at allocation draw
    - conditional_feature_flags     # Program.recapture_model switches recapture algorithm
    - derived_field_reconciliation  # FundingSource ledger buckets kept consistent with FundingAllocation rows

  entity_topology: flat             # peer entities linked by foreign keys, no deep URL nesting
  state_machine_shape: cyclic       # Application NEEDS_INFO<->UNDER_REVIEW loop; ServicingAccount parallel dims
  relationship_patterns:
    - one_to_many                   # Program->IncomeLimit, Award->FundingAllocation, ServicingAccount->SaleEvent
    - many_to_many                  # FundingAllocation is the Award x FundingSource junction; Enrollment is Applicant x EducationSession junction
    - cross_aggregate               # Closing references both Award and Property across aggregates
  role_model: segregation_of_duties # the reviewer of an Application may not approve its Award
  consistency_model: immediate      # all cascades resolve atomically within the triggering request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable program name."
      - name: ami_limit_pct
        type: integer
        source: input
        description: "Maximum eligible income as a whole-number percent of Area Median Income (e.g. 80 means <=80% AMI)."
        constraints: "1..120"
      - name: max_assistance_cents
        type: integer
        source: input
        description: "Hard ceiling on assistance any single Award may reserve/disburse, in cents."
        constraints: ">= 0"
      - name: recapture_model
        type: enum
        source: input
        description: "Recapture algorithm applied to Awards created under this Program. SHARED_APPRECIATION shares appreciation on sale; DECLINING_BALANCE forgives the disbursed principal pro-rata over recapture_term_months."
        constraints: "one of {SHARED_APPRECIATION, DECLINING_BALANCE}"
      - name: recapture_term_months
        type: integer
        source: input
        description: "Number of months over which a DECLINING_BALANCE award is fully forgiven. Ignored for SHARED_APPRECIATION."
        default: 120
        constraints: ">= 1"
      - name: appreciation_share_pct
        type: integer
        source: input
        description: "Whole-number percent of appreciation the program recaptures for SHARED_APPRECIATION awards (e.g. 30). Ignored for DECLINING_BALANCE."
        default: 30
        constraints: "0..100"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the program. OPEN accepts new applications; CLOSED does not."
        default: "OPEN"
        constraints: "one of {OPEN, CLOSED}"

  - name: IncomeLimit
    parent: Program
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this income limit row belongs to."
      - name: household_size
        type: integer
        source: input
        description: "Household size this row applies to."
        constraints: "1..12; unique per program_id"
      - name: ami_100_income_cents
        type: integer
        source: input
        description: "Annual income (cents) equal to 100% of Area Median Income for this household_size."
        constraints: ">= 1"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name."
      - name: email
        type: string
        source: input
        description: "Applicant contact email; unique across applicants."
        constraints: "unique"
      - name: household_size
        type: integer
        source: input
        description: "Number of persons in the applicant household."
        constraints: "1..12"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Gross annual household income in cents."
        constraints: ">= 0"
      - name: first_time_buyer
        type: boolean
        source: input
        description: "Whether the applicant is a first-time homebuyer."
        default: true

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: address
        type: string
        source: input
        description: "Street address of the property."
      - name: county_code
        type: string
        source: input
        description: "County/jurisdiction code used for reporting."
      - name: unit_type
        type: enum
        source: input
        description: "Dwelling type."
        default: "SINGLE_FAMILY"
        constraints: "one of {SINGLE_FAMILY, CONDO, TOWNHOME}"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Contract purchase price in cents (estimate at intake)."
        constraints: ">= 1"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraised value in cents. Null until an appraisal is recorded."
        default: null
        constraints: ">= 1 when set"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the household applying."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program applied to."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the target property."
      - name: first_mortgage_amount_cents
        type: integer
        source: input
        description: "Estimated first-mortgage principal the buyer will carry, in cents."
        constraints: ">= 0"
      - name: buyer_contribution_cents
        type: integer
        source: input
        description: "Cash the buyer states they will bring, in cents."
        constraints: ">= 0"
      - name: ami_pct
        type: number
        source: computed
        description: "Applicant income as a percent of 100% AMI for the household size, round_half_up to 2 decimals. Reporting figure only; eligibility uses the integer comparison in calc ami_eligibility."
      - name: estimated_assistance_cents
        type: integer
        source: computed
        description: "Provisional assistance computed at submit from estimated inputs (calc assistance_amount, variant provisional)."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CaseManager who moved the application to ELIGIBLE/INELIGIBLE. Null until reviewed. Used for segregation-of-duties on award approval."
        default: null
      - name: status
        type: enum
        source: system
        description: "Application lifecycle."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO, ELIGIBLE, INELIGIBLE, WITHDRAWN}"

  - name: EducationSession
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; program offering this homebuyer-education session."
      - name: title
        type: string
        source: input
        description: "Session title."
      - name: start_at
        type: datetime
        source: input
        description: "Session start (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Session end (ISO 8601 UTC)."
        constraints: "must be strictly after start_at"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of ENROLLED enrollments."
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollment rows for this session in status ENROLLED or ATTENDED."
        default: 0

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> EducationSession.id; the session enrolled into."
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the enrolling applicant."
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle."
        default: "ENROLLED"
        constraints: "one of {ENROLLED, ATTENDED, NO_SHOW, CANCELLED}"

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; certificate holder."
      - name: source_enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the ATTENDED enrollment that produced this certificate."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the certificate was issued."
      - name: expires_at
        type: datetime
        source: system
        description: "issued_at + CERT_VALIDITY_DAYS (CERT_VALIDITY_DAYS = 365). A certificate is valid while current clock <= expires_at."
      - name: status
        type: enum
        source: system
        description: "Certificate lifecycle. VALID at issue; becomes EXPIRED once the logical clock passes expires_at (system-derived on read)."
        default: "VALID"
        constraints: "one of {VALID, EXPIRED}"

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the eligible application this award funds."
      - name: assistance_type
        type: enum
        source: input
        description: "Product form of the assistance."
        constraints: "one of {GRANT, LOAN, SHARED_APPRECIATION}"
      - name: recapture_model
        type: enum
        source: system
        description: "Copied from the Program at creation; pins the recapture algorithm even if the program later changes."
        constraints: "one of {SHARED_APPRECIATION, DECLINING_BALANCE}"
      - name: assistance_amount_cents
        type: integer
        source: computed
        description: "Reserved/approved assistance = Application.estimated_assistance_cents at creation (calc assistance_amount, variant provisional)."
      - name: assistance_amount_final_cents
        type: integer
        source: computed
        description: "Recomputed at closing from closing actuals (calc assistance_amount, variant final). Null until the Closing completes."
        default: null
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this award's FundingAllocation rows in status RESERVED or DISBURSED."
        default: 0
      - name: original_disbursed_cents
        type: integer
        source: computed
        description: "Total actually disbursed at closing = assistance_amount_final_cents. Basis for recapture. Null until closing completes."
        default: null
      - name: basis_value_cents
        type: integer
        source: computed
        description: "min(final_purchase_price, appraised_value) captured at closing; basis for appreciation. Null until closing completes."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CaseManager who approved the award. Null until APPROVED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Award lifecycle."
        default: "PENDING_EDUCATION"
        constraints: "one of {PENDING_EDUCATION, APPROVED, FUNDED, SERVICING, REPAID, RECAPTURED, CANCELLED}"

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Funding source / appropriation name."
      - name: priority
        type: integer
        source: input
        description: "Subordination priority; lower number = senior lien position drawn first. Unique across active funding sources."
        constraints: ">= 1; unique"
      - name: total_appropriation_cents
        type: integer
        source: input
        description: "Total appropriation, in cents. Invariant: available_cents + reserved_cents + disbursed_cents == total_appropriation_cents at all times."
        constraints: ">= 0"
      - name: available_cents
        type: integer
        source: computed
        description: "Uncommitted balance. Initialized to total_appropriation_cents; debited on allocation RESERVED, credited back on RELEASED."
      - name: reserved_cents
        type: integer
        source: computed
        description: "Committed-but-not-disbursed balance. Credited on allocation RESERVED, debited on DISBURSED or RELEASED."
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Permanently disbursed balance. Credited on allocation DISBURSED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Funding source lifecycle. ACTIVE until fully drawn; FULLY_COMMITTED when available_cents and reserved_cents both reach 0 after disbursement."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, FULLY_COMMITTED}"

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award being funded."
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; the source drawn from."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount drawn from the source, in cents."
        constraints: ">= 1"
      - name: lien_position
        type: integer
        source: input
        description: "Subordination rank recorded on the allocation (1 = most senior). Must be assigned in non-decreasing FundingSource.priority order across an award's allocations."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle."
        default: "RESERVED"
        constraints: "one of {RESERVED, DISBURSED, RELEASED}"

  - name: Closing
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award being closed."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being purchased."
      - name: scheduled_date
        type: datetime
        source: input
        description: "Scheduled closing date (ISO 8601 UTC, start of the closing window)."
      - name: window_days
        type: integer
        source: input
        description: "Length of the exclusive property occupation window in days; the window is the half-open interval [scheduled_date, scheduled_date + window_days)."
        default: 7
        constraints: ">= 1"
      - name: final_purchase_price_cents
        type: integer
        source: input
        description: "Actual purchase price at closing, in cents. Provided on complete."
        default: null
        constraints: ">= 1 when set"
      - name: final_first_mortgage_cents
        type: integer
        source: input
        description: "Actual first-mortgage principal at closing, in cents. Provided on complete."
        default: null
        constraints: ">= 0 when set"
      - name: status
        type: enum
        source: system
        description: "Closing lifecycle."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, DOCS_PENDING, COMPLETED, CANCELLED}"

  - name: ServicingAccount
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the disbursed award being serviced."
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the closing completed and servicing opened. Anchor for DECLINING_BALANCE months_held."
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "Outstanding assistance principal = Award.original_disbursed_cents at open; unchanged until sale settles recapture."
      - name: recapture_amount_cents
        type: integer
        source: computed
        description: "Amount owed back to the program on sale (calc recapture_amount). Null until a sale is reported."
        default: null
      - name: forgiven_amount_cents
        type: integer
        source: computed
        description: "Amount of principal forgiven on sale (DECLINING_BALANCE only; 0 for SHARED_APPRECIATION). Null until a sale is reported."
        default: null
      - name: lifecycle_status
        type: enum
        source: system
        description: "Primary lifecycle dimension (independent of payment_status)."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, IN_SALE, CLOSED}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension, evolves independently of lifecycle_status."
        default: "CURRENT"
        constraints: "one of {CURRENT, DELINQUENT}"

  - name: SaleEvent
    parent: ServicingAccount
    common_fields: true
    fields:
      - name: servicing_account_id
        type: string
        source: input
        description: "FK -> ServicingAccount.id; the account whose collateral was sold."
      - name: sale_price_cents
        type: integer
        source: input
        description: "Gross sale price in cents."
        constraints: ">= 1"
      - name: sale_date
        type: datetime
        source: input
        description: "Sale/settlement date (ISO 8601 UTC). Must be >= ServicingAccount.opened_at."
      - name: appreciation_cents
        type: integer
        source: computed
        description: "max(0, sale_price_cents - Award.basis_value_cents). Used by SHARED_APPRECIATION recapture."
      - name: recapture_amount_cents
        type: integer
        source: computed
        description: "Recapture computed by calc recapture_amount for this sale; copied onto the ServicingAccount."
      - name: forgiven_amount_cents
        type: integer
        source: computed
        description: "Forgiveness computed by calc recapture_amount for this sale; copied onto the ServicingAccount."
# --- end entities ---

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [INELIGIBLE, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Program.status == OPEN"
          - "an IncomeLimit row exists for (program_id, applicant.household_size)"
        side_effects:
          - "compute Application.ami_pct (calc ami_eligibility, reporting figure)"
          - "compute Application.estimated_assistance_cents (calc assistance_amount, variant provisional)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/review with decision=START"
        actor: CaseManager
        preconditions: ["Application.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /applications/{id}/review with decision=NEEDS_INFO"
        actor: CaseManager
        preconditions: ["Application.status == UNDER_REVIEW"]
        side_effects: ["record review_notes"]
        note: "cyclic revert; applicant must resubmit"
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/resubmit"
        actor: Applicant
        preconditions: ["Application.status == NEEDS_INFO"]
        side_effects:
          - "recompute Application.ami_pct and Application.estimated_assistance_cents from current inputs"
        note: "closes the NEEDS_INFO <-> UNDER_REVIEW cycle (Rule 3)"
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /applications/{id}/review with decision=ELIGIBLE"
        actor: CaseManager
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "eligibility passes: applicant.annual_income_cents <= floor(ami_100_income_cents * program.ami_limit_pct / 100) (calc ami_eligibility)"
        side_effects:
          - "set Application.reviewed_by_user_id = X-User-ID (anchors segregation-of-duties on award approval)"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /applications/{id}/review with decision=INELIGIBLE"
        actor: CaseManager
        preconditions: ["Application.status == UNDER_REVIEW"]
        side_effects: ["set Application.reviewed_by_user_id = X-User-ID"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["Application.status in {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["Application.status in {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["Application.status in {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: []
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["Application.status in {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: []

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/attend"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment.status == ENROLLED"
          - "current clock >= EducationSession.start_at"
        side_effects:
          - "CASCADE: create Certificate for applicant (status VALID, issued_at = current clock, expires_at = issued_at + CERT_VALIDITY_DAYS where CERT_VALIDITY_DAYS = 365)"
        note: "single-hop cross-entity effect: attendance mints the education certificate"
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /enrollments/{id}/no-show"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == ENROLLED"]
        side_effects: ["decrement EducationSession.enrolled_count by 1"]
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Applicant
        preconditions: ["Enrollment.status == ENROLLED"]
        side_effects: ["decrement EducationSession.enrolled_count by 1"]

  - entity: Award
    initial_state: PENDING_EDUCATION
    terminal_states: [REPAID, RECAPTURED, CANCELLED]
    transitions:
      - from: PENDING_EDUCATION
        to: APPROVED
        trigger: "POST /awards/{id}/approve"
        actor: CaseManager
        preconditions:
          - "Application.status == ELIGIBLE (cross-entity: Award depends on Application state)"
          - "applicant has a Certificate with status == VALID and current clock <= expires_at (cross-entity: Award depends on Certificate state)"
          - "X-User-ID != Application.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "set Award.approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: FUNDED
        trigger: "system: auto-transition when sum of RESERVED FundingAllocation.amount_cents == Award.assistance_amount_cents"
        actor: system
        preconditions: ["Award.allocated_cents == Award.assistance_amount_cents"]
        side_effects: []
        note: "compound/bubble-up: fully-reserved award auto-advances to FUNDED"
      - from: FUNDED
        to: SERVICING
        trigger: "system: side-effect of POST /closings/{id}/complete"
        actor: system
        preconditions: ["Award.status == FUNDED", "Closing.status transitioning to COMPLETED"]
        side_effects:
          - "recompute Award.assistance_amount_final_cents (calc assistance_amount, variant final) from closing actuals"
          - "set Award.basis_value_cents = min(Closing.final_purchase_price_cents, Property.appraised_value_cents)"
          - "if assistance_amount_final_cents < allocated_cents: RELEASE the excess from the most-junior (highest lien_position) RESERVED allocations first (calc funding_reconciliation)"
          - "set Award.original_disbursed_cents = assistance_amount_final_cents"
          - "CASCADE hop 2: transition every remaining RESERVED FundingAllocation for this award to DISBURSED"
          - "create ServicingAccount(award) with lifecycle_status ACTIVE, payment_status CURRENT, principal_balance_cents = original_disbursed_cents, opened_at = current clock"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /awards/{id}/cancel"
        actor: CaseManager
        preconditions: ["Award.status in {APPROVED, FUNDED}"]
        side_effects:
          - "CASCADE hop 1: transition every RESERVED FundingAllocation for this award to RELEASED"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /awards/{id}/cancel"
        actor: CaseManager
        preconditions: ["Award.status in {APPROVED, FUNDED}"]
        side_effects:
          - "CASCADE hop 1: transition every RESERVED FundingAllocation for this award to RELEASED"
      - from: SERVICING
        to: RECAPTURED
        trigger: "system: side-effect of POST /servicing-accounts/{id}/close for a SHARED_APPRECIATION award, or a DECLINING_BALANCE award with recapture_amount_cents > 0"
        actor: system
        preconditions: ["ServicingAccount.lifecycle_status == IN_SALE"]
        side_effects: []
      - from: SERVICING
        to: REPAID
        trigger: "system: side-effect of POST /servicing-accounts/{id}/close for a DECLINING_BALANCE award fully forgiven (recapture_amount_cents == 0)"
        actor: system
        preconditions: ["ServicingAccount.lifecycle_status == IN_SALE"]
        side_effects: []

  - entity: FundingAllocation
    initial_state: RESERVED
    terminal_states: [DISBURSED, RELEASED]
    transitions:
      - from: RESERVED
        to: DISBURSED
        trigger: "system: CASCADE hop 2 from Award FUNDED->SERVICING (closing complete)"
        actor: system
        preconditions: ["FundingAllocation.status == RESERVED"]
        side_effects:
          - "CASCADE hop 3: FundingSource.reserved_cents -= amount_cents; FundingSource.disbursed_cents += amount_cents"
          - "if FundingSource.available_cents == 0 and FundingSource.reserved_cents == 0: FundingSource.status = FULLY_COMMITTED"
      - from: RESERVED
        to: RELEASED
        trigger: "system: CASCADE hop 1 from Award ->CANCELLED, or funding_reconciliation at closing"
        actor: system
        preconditions: ["FundingAllocation.status == RESERVED"]
        side_effects:
          - "CASCADE hop 2: FundingSource.reserved_cents -= amount_cents; FundingSource.available_cents += amount_cents (conservation preserved)"

  - entity: Closing
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DOCS_PENDING
        trigger: "POST /closings/{id}/docs-pending"
        actor: ClosingCoordinator
        preconditions: ["Closing.status == SCHEDULED"]
        side_effects: []
      - from: DOCS_PENDING
        to: COMPLETED
        trigger: "POST /closings/{id}/complete"
        actor: ClosingCoordinator
        preconditions:
          - "Closing.status == DOCS_PENDING"
          - "Award.status == FUNDED (cross-entity: Closing depends on Award state)"
          - "Property.appraised_value_cents is set (appraisal recorded)"
        side_effects:
          - "CASCADE hop 1 (depth-4 chain): drive Award FUNDED->SERVICING (which recomputes final assistance, disburses allocations, debits funding sources, and opens servicing)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /closings/{id}/cancel"
        actor: ClosingCoordinator
        preconditions: ["Closing.status in {SCHEDULED, DOCS_PENDING}"]
        side_effects: []
      - from: DOCS_PENDING
        to: CANCELLED
        trigger: "POST /closings/{id}/cancel"
        actor: ClosingCoordinator
        preconditions: ["Closing.status in {SCHEDULED, DOCS_PENDING}"]
        side_effects: []

  - entity: ServicingAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: IN_SALE
        trigger: "POST /servicing-accounts/{id}/report-sale"
        actor: Servicer
        preconditions:
          - "ServicingAccount.lifecycle_status == ACTIVE"
          - "SaleEvent.sale_date >= ServicingAccount.opened_at"
        side_effects:
          - "create SaleEvent; compute appreciation_cents = max(0, sale_price_cents - Award.basis_value_cents)"
          - "compute SaleEvent.recapture_amount_cents and forgiven_amount_cents (calc recapture_amount, variant by Award.recapture_model)"
          - "copy recapture_amount_cents and forgiven_amount_cents onto the ServicingAccount"
      - from: IN_SALE
        to: CLOSED
        trigger: "POST /servicing-accounts/{id}/close"
        actor: Servicer
        preconditions: ["ServicingAccount.lifecycle_status == IN_SALE", "a SaleEvent exists for this account"]
        side_effects:
          - "set principal_balance_cents = 0"
          - "drive Award SERVICING -> RECAPTURED (if recapture_amount_cents > 0) or REPAID (if recapture_amount_cents == 0)"
      # payment_status is an INDEPENDENT parallel dimension (Rule 3): it toggles regardless of lifecycle_status
      - from: "payment_status=CURRENT"
        to: "payment_status=DELINQUENT"
        trigger: "POST /servicing-accounts/{id}/payment-status with to=DELINQUENT"
        actor: Servicer
        preconditions: ["ServicingAccount.payment_status == CURRENT", "ServicingAccount.lifecycle_status != CLOSED"]
        side_effects: []
        note: "parallel dimension: does not change lifecycle_status"
      - from: "payment_status=DELINQUENT"
        to: "payment_status=CURRENT"
        trigger: "POST /servicing-accounts/{id}/payment-status with to=CURRENT"
        actor: Servicer
        preconditions: ["ServicingAccount.payment_status == DELINQUENT", "ServicingAccount.lifecycle_status != CLOSED"]
        side_effects: []
        note: "cyclic on the payment dimension; independent of lifecycle_status"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: allocation-draw-stale-source
    parent_entity: FundingSource
    write_endpoint: "POST /funding-allocations"
    occ_field: "expected_funding_source_version"
    description: |
      Creating a FundingAllocation that draws from a FundingSource whose version
      has advanced since the client last observed it is rejected. A prior draw
      against the same source legitimately reduced available_cents and bumped the
      source's version; the current writer's view of the remaining balance is
      therefore stale. Both draws could each succeed on their own from the
      observed balance, so this is a genuine race resolved by OCC on the parent
      FundingSource.version (not a state precondition).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ami_eligibility
    trigger: "on POST /applications/{id}/submit, POST /applications/{id}/resubmit (reporting figure), and enforced on review decision=ELIGIBLE"
    algorithm: threshold
    formula: |
      # Reporting figure (2dp, informational only):
      ami_pct = round_half_up(applicant.annual_income_cents / income_limit.ami_100_income_cents * 100, 2)
      # Eligibility (exact integer comparison — boundary lives here, NOT on the rounded ami_pct):
      income_ceiling_cents = floor(income_limit.ami_100_income_cents * program.ami_limit_pct / 100)
      eligible = (applicant.annual_income_cents <= income_ceiling_cents)
    input_set: "the single IncomeLimit row matching (Application.program_id, Applicant.household_size)"
    constants: {}
    precision: "ami_pct: 2 decimals round_half_up; eligibility: exact integer cents, inclusive <="
    variants: []

  - name: assistance_amount
    trigger: "provisional variant on submit/resubmit; final variant as a side-effect of Award FUNDED->SERVICING at closing complete"
    algorithm: threshold
    formula: |
      # tier_pct selects the buyer's minimum contribution fraction from ami_pct (calc ami_eligibility):
      #   ami_pct <= 50.00            -> 0
      #   50.00 < ami_pct <= 65.00    -> 1   (1%)
      #   65.00 < ami_pct <= 80.00    -> 3   (3%)
      required_buyer_contribution = max(stated_buyer_contribution_cents, ceil(basis_cents * tier_pct / 100))
      funding_gap = basis_cents - first_mortgage_cents - required_buyer_contribution
      assistance = min(program.max_assistance_cents, max(0, funding_gap))
    input_set: |
      provisional: basis_cents = Property.purchase_price_cents, first_mortgage_cents =
        Application.first_mortgage_amount_cents, stated_buyer_contribution_cents =
        Application.buyer_contribution_cents, ami_pct from the application at submit.
      final: basis_cents = min(Closing.final_purchase_price_cents, Property.appraised_value_cents),
        first_mortgage_cents = Closing.final_first_mortgage_cents, stated_buyer_contribution_cents =
        Application.buyer_contribution_cents, ami_pct as recorded on the application.
    constants:
      TIER_PCT_LOW_MAX_AMI: 50
      TIER_PCT_MID_MAX_AMI: 65
      TIER_PCT_HIGH_MAX_AMI: 80
      TIER_PCT_MID: 1
      TIER_PCT_HIGH: 3
    precision: "integer cents; ceil on the percentage contribution; funding_gap floored at 0"
    variants:
      - name: provisional
        when: "computed at submit/resubmit; stored on Application.estimated_assistance_cents and copied to Award.assistance_amount_cents at award creation"
        difference: "uses estimated Property.purchase_price and Application.first_mortgage_amount; no appraised-value cap on basis"
      - name: final
        when: "computed at closing complete; stored on Award.assistance_amount_final_cents"
        difference: "uses Closing final actuals and caps basis at min(final_purchase_price, appraised_value); can differ from provisional in either direction"

  - name: funding_reconciliation
    trigger: "side-effect of Award FUNDED->SERVICING when assistance_amount_final_cents < allocated_cents"
    algorithm: waterfall_allocation
    formula: |
      excess = allocated_cents - assistance_amount_final_cents
      # Release excess from RESERVED allocations ordered by lien_position DESC (most junior first),
      # tie-break created_at DESC (newest first). Each release reduces excess by min(excess, allocation.amount_cents);
      # a partially-released allocation's amount_cents is reduced to the remaining reserved amount, the released
      # portion credited back to its FundingSource.available_cents. Remaining allocations disburse in full.
      # Never touch id for ordering.
    input_set: "the award's FundingAllocation rows in status RESERVED"
    constants: {}
    precision: "integer cents; process junior-to-senior by lien_position DESC, created_at DESC tie-break"
    variants: []

  - name: recapture_amount
    trigger: "side-effect of ServicingAccount ACTIVE->IN_SALE (POST /servicing-accounts/{id}/report-sale)"
    algorithm: threshold
    formula: |
      original = Award.original_disbursed_cents
      # SHARED_APPRECIATION:
      appreciation = max(0, sale_price_cents - Award.basis_value_cents)
      recapture = original + round_half_up(program.appreciation_share_pct/100 * appreciation)   # forgiven = 0
      # DECLINING_BALANCE (mode-b nested rounding — pin SUM-THEN-ROUND, single final rounding):
      months_held = full calendar months from ServicingAccount.opened_at to SaleEvent.sale_date (floor)
      forgiven = round_half_up(original * min(months_held, program.recapture_term_months) / program.recapture_term_months)
      recapture = original - forgiven
    input_set: "the Award's original_disbursed_cents and basis_value_cents; the SaleEvent sale_price and sale_date vs ServicingAccount.opened_at"
    constants: {}
    precision: |
      integer cents. DECLINING_BALANCE forgiveness is computed with a SINGLE round_half_up on the whole
      product (sum-then-round); per-month rounding then summing is explicitly NOT used and yields different cents.
    variants:
      - name: shared_appreciation
        when: "Award.recapture_model == SHARED_APPRECIATION"
        difference: "recapture = disbursed principal + program share of appreciation; forgiven always 0; recapture can exceed original"
      - name: declining_balance
        when: "Award.recapture_model == DECLINING_BALANCE"
        difference: "recapture = disbursed principal minus pro-rata forgiveness over recapture_term_months; recapture in [0, original]; forgiven = original - recapture"

  - name: portfolio_summary
    trigger: "on GET /reports/portfolio-summary"
    algorithm: aggregation
    formula: |
      total_awards = count(Award)
      total_reserved_cents = sum(FundingAllocation.amount_cents where status == RESERVED)
      total_disbursed_cents = sum(FundingAllocation.amount_cents where status == DISBURSED)
      total_recaptured_cents = sum(ServicingAccount.recapture_amount_cents where lifecycle_status == CLOSED)
      awards_by_status = count(Award) grouped by status
    input_set: "all Award rows; all FundingAllocation rows filtered by status; all CLOSED ServicingAccount rows"
    constants: {}
    precision: "integer cents; counts are exact; ordering irrelevant (commutative sums/counts)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /applicants and POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named in the path and every FK in the body exists, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PROGRAM_NOT_FOUND, ERR_APPLICANT_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_FUNDING_SOURCE_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_CLOSING_NOT_FOUND, ERR_SERVICING_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path id or body FK"
  - priority: 4
    category: business_constraint
    check: "request body has all required fields, enums are valid members, integer amounts are within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined (generic state-machine guard)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition action endpoints"
  - priority: 6
    category: state
    check: "Award.status == APPROVED when creating a FundingAllocation for it (state gate that MUST be evaluated before any fiscal check on this endpoint)"
    error_id: ERR_AWARD_NOT_APPROVED
    http_status: 409
    applies_to: "POST /funding-allocations"
  - priority: 7
    category: state
    check: "expected_funding_source_version equals the FundingSource's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /funding-allocations"
  - priority: 8
    category: business_safety
    check: "the approving X-User-ID differs from Application.reviewed_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /awards/{id}/approve"
  - priority: 9
    category: business_safety
    check: "the applicant has at least one Certificate that was ever issued (education requirement; status VALID or EXPIRED) - this only checks that education was completed, not that it is still in-date (see priority 10)"
    error_id: ERR_EDUCATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /awards/{id}/approve"
  - priority: 10
    category: business_temporal
    check: "the applicant's certificate is still valid: current clock <= Certificate.expires_at"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /awards/{id}/approve"
  - priority: 11
    category: business_safety
    check: "applicant income within AMI ceiling: annual_income_cents <= floor(ami_100_income_cents * ami_limit_pct / 100)"
    error_id: ERR_INCOME_OVER_LIMIT
    http_status: 422
    applies_to: "POST /applications/{id}/review with decision=ELIGIBLE"
  - priority: 12
    category: business_referential
    check: "an IncomeLimit row exists for (Application.program_id, Applicant.household_size)"
    error_id: ERR_INCOME_LIMIT_UNDEFINED
    http_status: 422
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/resubmit"
  - priority: 13
    category: business_temporal
    check: "the applicant is not already ENROLLED or ATTENDED in another EducationSession whose [start_at, end_at] interval lies within SESSION_BUFFER_MINUTES (=30) of this session's interval (closed intervals; two sessions conflict when session_b.start_at < session_a.end_at + 30m AND session_a.start_at < session_b.end_at + 30m)"
    error_id: ERR_SESSION_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /education-sessions/{id}/enrollments"
  - priority: 14
    category: business_constraint
    check: "EducationSession.enrolled_count < capacity"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /education-sessions/{id}/enrollments"
  - priority: 15
    category: business_temporal
    check: "no other non-CANCELLED Closing on the same Property has a half-open window [scheduled_date, scheduled_date + window_days) overlapping this one; adjacency (next starts exactly at prior window end) is allowed"
    error_id: ERR_CLOSING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /awards/{id}/closings"
  - priority: 16
    category: business_referential
    check: "Property.appraised_value_cents is set before a closing may complete"
    error_id: ERR_APPRAISAL_MISSING
    http_status: 422
    applies_to: "POST /closings/{id}/complete"
  - priority: 17
    category: business_referential
    check: "lien_position >= the max lien_position among this award's existing RESERVED/DISBURSED allocations, and non-decreasing with respect to FundingSource.priority (subordination order preserved)"
    error_id: ERR_LIEN_ORDER_INVALID
    http_status: 422
    applies_to: "POST /funding-allocations"
  - priority: 18
    category: business_fiscal
    check: "Award.allocated_cents + amount_cents <= Award.assistance_amount_cents (no over-reservation beyond the approved award)"
    error_id: ERR_ALLOCATION_EXCEEDS_AWARD
    http_status: 422
    applies_to: "POST /funding-allocations"
  - priority: 19
    category: business_fiscal
    check: "amount_cents <= FundingSource.available_cents (the fiscal check, evaluated AFTER the state gate at priority 6)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /funding-allocations"
  - priority: 20
    category: business_temporal
    check: "SaleEvent.sale_date >= ServicingAccount.opened_at"
    error_id: ERR_SALE_BEFORE_OPEN
    http_status: 422
    applies_to: "POST /servicing-accounts/{id}/report-sale"
  - priority: 21
    category: business_constraint
    check: "EducationSession.end_at is strictly after start_at"
    error_id: ERR_SESSION_TIME_INVALID
    http_status: 400
    applies_to: "POST /education-sessions"
  - priority: 22
    category: business_constraint
    check: "no existing IncomeLimit row for the same (program_id, household_size)"
    error_id: ERR_DUPLICATE_INCOME_LIMIT
    http_status: 409
    applies_to: "POST /programs/{id}/income-limits"

# =============================================================================
# §1.5 API Endpoint Table  (all paths under api_prefix /api/v1)
# =============================================================================
endpoints:
  # ---- Program & IncomeLimit --------------------------------------------------
  - method: POST
    path: "/api/v1/programs"
    description: "Create a program."
    roles: [ProgramAdmin]
    code: 201
    input: [name, ami_limit_pct, max_assistance_cents, recapture_model, "recapture_term_months?", "appreciation_share_pct?"]
    output: Program
    side_effects: ["status = OPEN"]
  - method: POST
    path: "/api/v1/programs/{id}/close"
    description: "Close a program to new applications (status OPEN -> CLOSED)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status = CLOSED"]
  - method: GET
    path: "/api/v1/programs/{id}"
    description: "Fetch a program."
    roles: [ProgramAdmin, CaseManager, Applicant, ClosingCoordinator, Servicer]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/api/v1/programs"
    description: "List programs."
    roles: [ProgramAdmin, CaseManager, Applicant, ClosingCoordinator, Servicer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/api/v1/programs/{id}/income-limits"
    description: "Define an income limit row for a household size."
    roles: [ProgramAdmin]
    code: 201
    input: [household_size, ami_100_income_cents]
    output: IncomeLimit
    side_effects: []
  - method: GET
    path: "/api/v1/programs/{id}/income-limits"
    description: "List income-limit rows for a program (reverse-reachability for IncomeLimit.program_id)."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: IncomeLimit[]
    side_effects: []
  - method: GET
    path: "/api/v1/programs/{id}/education-sessions"
    description: "List education sessions of a program (reverse-reachability for EducationSession.program_id)."
    roles: [ProgramAdmin, CaseManager, Applicant]
    code: 200
    input: []
    output: EducationSession[]
    side_effects: []

  # ---- Applicant --------------------------------------------------------------
  - method: POST
    path: "/api/v1/applicants"
    description: "Self-register an applicant (public)."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, household_size, annual_income_cents, "first_time_buyer?"]
    output: Applicant
    side_effects: []
  - method: GET
    path: "/api/v1/applicants/{id}"
    description: "Fetch an applicant."
    roles: [Applicant, CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- Property ---------------------------------------------------------------
  - method: POST
    path: "/api/v1/properties"
    description: "Register a property."
    roles: [CaseManager]
    code: 201
    input: [address, county_code, "unit_type?", purchase_price_cents]
    output: Property
    side_effects: []
  - method: GET
    path: "/api/v1/properties/{id}"
    description: "Fetch a property."
    roles: [CaseManager, ClosingCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: POST
    path: "/api/v1/properties/{id}/appraisal"
    description: "Record an appraised value on a property."
    roles: [CaseManager]
    code: 200
    input: [appraised_value_cents]
    output: Property
    side_effects: ["set Property.appraised_value_cents"]

  # ---- Application ------------------------------------------------------------
  - method: POST
    path: "/api/v1/applications"
    description: "Create an application in DRAFT."
    roles: [Applicant, CaseManager]
    code: 201
    input: [applicant_id, program_id, property_id, first_mortgage_amount_cents, buyer_contribution_cents]
    output: Application
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/v1/applications/{id}"
    description: "Fetch an application."
    roles: [Applicant, CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/api/v1/applications"
    description: "List/filter applications (reverse-reachability for applicant_id, program_id, property_id)."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: ["applicant_id?", "program_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/api/v1/applications/{id}/submit"
    description: "Submit an application (DRAFT->SUBMITTED)."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["compute ami_pct", "compute estimated_assistance_cents (provisional)", "status = SUBMITTED"]
  - method: POST
    path: "/api/v1/applications/{id}/review"
    description: "CaseManager review action; decision drives SUBMITTED->UNDER_REVIEW->{NEEDS_INFO, ELIGIBLE, INELIGIBLE}."
    roles: [CaseManager]
    code: 200
    input: [decision, "review_notes?"]
    output: Application
    side_effects: ["status per decision (decision one of START, NEEDS_INFO, ELIGIBLE, INELIGIBLE)", "set reviewed_by_user_id on ELIGIBLE/INELIGIBLE"]
  - method: POST
    path: "/api/v1/applications/{id}/resubmit"
    description: "Applicant resubmits after NEEDS_INFO (NEEDS_INFO->UNDER_REVIEW)."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["recompute ami_pct and estimated_assistance_cents", "status = UNDER_REVIEW"]
  - method: POST
    path: "/api/v1/applications/{id}/withdraw"
    description: "Applicant withdraws a non-terminal application."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status = WITHDRAWN"]

  # ---- Education: Session / Enrollment / Certificate --------------------------
  - method: POST
    path: "/api/v1/education-sessions"
    description: "Create a homebuyer-education session."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, title, start_at, end_at, capacity]
    output: EducationSession
    side_effects: ["status = SCHEDULED", "enrolled_count = 0"]
  - method: GET
    path: "/api/v1/education-sessions/{id}"
    description: "Fetch a session."
    roles: [ProgramAdmin, CaseManager, Applicant]
    code: 200
    input: []
    output: EducationSession
    side_effects: []
  - method: POST
    path: "/api/v1/education-sessions/{id}/enrollments"
    description: "Enroll an applicant into a session."
    roles: [Applicant]
    code: 201
    input: [applicant_id]
    output: Enrollment
    side_effects: ["status = ENROLLED", "increment EducationSession.enrolled_count"]
  - method: GET
    path: "/api/v1/education-sessions/{id}/enrollments"
    description: "List enrollments of a session (reverse-reachability for Enrollment.session_id)."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/api/v1/enrollments/{id}"
    description: "Fetch an enrollment."
    roles: [ProgramAdmin, CaseManager, Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/api/v1/enrollments"
    description: "List/filter enrollments (reverse-reachability for Enrollment.applicant_id and session_id)."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["session_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/api/v1/enrollments/{id}/attend"
    description: "Mark attendance; mints the applicant's education Certificate."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = ATTENDED", "CASCADE: create Certificate (VALID, expires_at = issued_at + 365d)"]
  - method: POST
    path: "/api/v1/enrollments/{id}/no-show"
    description: "Mark an enrollment as a no-show."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = NO_SHOW", "decrement EducationSession.enrolled_count"]
  - method: POST
    path: "/api/v1/enrollments/{id}/cancel"
    description: "Applicant cancels an enrollment."
    roles: [Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = CANCELLED", "decrement EducationSession.enrolled_count"]
  - method: GET
    path: "/api/v1/certificates/{id}"
    description: "Fetch a certificate."
    roles: [ProgramAdmin, CaseManager, Applicant]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/api/v1/certificates"
    description: "List/filter certificates (reverse-reachability for Certificate.applicant_id and source_enrollment_id)."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["applicant_id?", "source_enrollment_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  # ---- Award ------------------------------------------------------------------
  - method: POST
    path: "/api/v1/applications/{id}/awards"
    description: "Create an Award from an ELIGIBLE application."
    roles: [CaseManager]
    code: 201
    input: [assistance_type]
    output: Award
    side_effects: ["copy recapture_model from Program", "assistance_amount_cents = Application.estimated_assistance_cents", "status = PENDING_EDUCATION"]
  - method: GET
    path: "/api/v1/awards/{id}"
    description: "Fetch an award."
    roles: [CaseManager, ProgramAdmin, ClosingCoordinator, Servicer]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/api/v1/awards"
    description: "List/filter awards (reverse-reachability for Award.application_id)."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/api/v1/awards/{id}/approve"
    description: "Approve an award (PENDING_EDUCATION->APPROVED); enforces SoD, education, cert validity."
    roles: [CaseManager]
    code: 200
    input: []
    output: Award
    side_effects: ["set approved_by_user_id", "status = APPROVED"]
  - method: POST
    path: "/api/v1/awards/{id}/cancel"
    description: "Cancel an award (APPROVED/FUNDED->CANCELLED); releases reserved allocations."
    roles: [CaseManager]
    code: 200
    input: []
    output: Award
    side_effects: ["CASCADE: RESERVED allocations -> RELEASED (credit FundingSource.available)", "status = CANCELLED"]

  # ---- Funding ----------------------------------------------------------------
  - method: POST
    path: "/api/v1/funding-sources"
    description: "Create a funding source."
    roles: [ProgramAdmin]
    code: 201
    input: [name, priority, total_appropriation_cents]
    output: FundingSource
    side_effects: ["available_cents = total_appropriation_cents", "reserved_cents = 0", "disbursed_cents = 0", "status = ACTIVE"]
  - method: GET
    path: "/api/v1/funding-sources/{id}"
    description: "Fetch a funding source."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: GET
    path: "/api/v1/funding-sources"
    description: "List funding sources."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []
  - method: POST
    path: "/api/v1/funding-allocations"
    description: "Reserve an assistance draw from a funding source against an APPROVED award (layered funding). OCC on FundingSource.version."
    roles: [CaseManager]
    code: 201
    input: [award_id, funding_source_id, amount_cents, lien_position, expected_funding_source_version]
    output: FundingAllocation
    side_effects: ["status = RESERVED", "FundingSource.available_cents -= amount_cents; reserved_cents += amount_cents", "increment FundingSource.version by 1", "recompute Award.allocated_cents", "auto Award APPROVED->FUNDED when allocated_cents == assistance_amount_cents"]
  - method: GET
    path: "/api/v1/funding-allocations/{id}"
    description: "Fetch a funding allocation."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []
  - method: GET
    path: "/api/v1/funding-allocations"
    description: "List/filter funding allocations (reverse-reachability for award_id and funding_source_id)."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: ["award_id?", "funding_source_id?", "status?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []

  # ---- Closing ----------------------------------------------------------------
  - method: POST
    path: "/api/v1/awards/{id}/closings"
    description: "Schedule a closing for an award on a property (award_id from path)."
    roles: [ClosingCoordinator]
    code: 201
    input: [property_id, scheduled_date, "window_days?"]
    output: Closing
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/api/v1/closings/{id}"
    description: "Fetch a closing."
    roles: [ClosingCoordinator, CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: Closing
    side_effects: []
  - method: GET
    path: "/api/v1/closings"
    description: "List/filter closings (reverse-reachability for award_id and property_id)."
    roles: [ClosingCoordinator, CaseManager, ProgramAdmin]
    code: 200
    input: ["award_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Closing[]
    side_effects: []
  - method: POST
    path: "/api/v1/closings/{id}/docs-pending"
    description: "Move a closing to DOCS_PENDING."
    roles: [ClosingCoordinator]
    code: 200
    input: []
    output: Closing
    side_effects: ["status = DOCS_PENDING"]
  - method: POST
    path: "/api/v1/closings/{id}/complete"
    description: "Complete a closing; drives the depth-4 disbursement cascade."
    roles: [ClosingCoordinator]
    code: 200
    input: [final_purchase_price_cents, final_first_mortgage_cents]
    output: Closing
    side_effects: ["status = COMPLETED", "CASCADE: recompute final assistance, funding_reconciliation, disburse allocations, debit funding sources, open ServicingAccount, Award->SERVICING"]
  - method: POST
    path: "/api/v1/closings/{id}/cancel"
    description: "Cancel a scheduled/docs-pending closing."
    roles: [ClosingCoordinator]
    code: 200
    input: []
    output: Closing
    side_effects: ["status = CANCELLED"]

  # ---- Servicing --------------------------------------------------------------
  - method: GET
    path: "/api/v1/servicing-accounts/{id}"
    description: "Fetch a servicing account."
    roles: [Servicer, CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: ServicingAccount
    side_effects: []
  - method: GET
    path: "/api/v1/servicing-accounts"
    description: "List/filter servicing accounts (reverse-reachability for award_id)."
    roles: [Servicer, ProgramAdmin]
    code: 200
    input: ["award_id?", "lifecycle_status?", "payment_status?", "limit?", "offset?"]
    output: ServicingAccount[]
    side_effects: []
  - method: POST
    path: "/api/v1/servicing-accounts/{id}/report-sale"
    description: "Report a sale; computes recapture and moves lifecycle ACTIVE->IN_SALE."
    roles: [Servicer]
    code: 201
    input: [sale_price_cents, sale_date]
    output: SaleEvent
    side_effects: ["create SaleEvent", "compute appreciation_cents, recapture_amount_cents, forgiven_amount_cents (calc recapture_amount)", "copy recapture/forgiven onto ServicingAccount", "lifecycle_status = IN_SALE"]
  - method: GET
    path: "/api/v1/servicing-accounts/{id}/sale-events"
    description: "List sale events for an account (reverse-reachability for SaleEvent.servicing_account_id)."
    roles: [Servicer, ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: SaleEvent[]
    side_effects: []
  - method: POST
    path: "/api/v1/servicing-accounts/{id}/close"
    description: "Close servicing after sale settles (IN_SALE->CLOSED); drives Award->RECAPTURED/REPAID."
    roles: [Servicer]
    code: 200
    input: []
    output: ServicingAccount
    side_effects: ["principal_balance_cents = 0", "lifecycle_status = CLOSED", "Award SERVICING->RECAPTURED (recapture>0) or REPAID (recapture==0)"]
  - method: POST
    path: "/api/v1/servicing-accounts/{id}/payment-status"
    description: "Toggle the parallel payment dimension (CURRENT<->DELINQUENT)."
    roles: [Servicer]
    code: 200
    input: [to]
    output: ServicingAccount
    side_effects: ["set payment_status to the requested value (does not change lifecycle_status)"]

  # ---- Reporting --------------------------------------------------------------
  - method: GET
    path: "/api/v1/reports/portfolio-summary"
    description: "Aggregate portfolio report (calc portfolio_summary)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ total_awards: integer, total_reserved_cents: integer, total_disbursed_cents: integer, total_recaptured_cents: integer }"
    side_effects: []

  # ---- Test-driving: logical clock -------------------------------------------
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time. All temporal rules (cert expiry, closing windows, session times, months_held) read this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role/X-User-ID missing or X-User-Role not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Referenced program id does not exist."
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "Referenced applicant id does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Referenced application id does not exist."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "Referenced property id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced education session id does not exist."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced enrollment id does not exist."
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "Referenced certificate id does not exist."
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "Referenced award id does not exist."
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "Referenced funding source id does not exist."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "Referenced funding allocation id does not exist."
  - id: ERR_CLOSING_NOT_FOUND
    http: 404
    condition: "Referenced closing id does not exist."
  - id: ERR_SERVICING_NOT_FOUND
    http: 404
    condition: "Referenced servicing account id does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum member, or out-of-range integer in the body."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined."
  - id: ERR_AWARD_NOT_APPROVED
    http: 409
    condition: "Funding allocation attempted against an award not in APPROVED status."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_funding_source_version does not equal the FundingSource's current version (OCC)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Award approver X-User-ID equals the application's reviewed_by_user_id."
  - id: ERR_EDUCATION_INCOMPLETE
    http: 422
    condition: "Applicant has no non-REVOKED education certificate on award approval."
  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "Applicant's certificate has expired (current clock > expires_at) on award approval."
  - id: ERR_INCOME_OVER_LIMIT
    http: 422
    condition: "Applicant income exceeds the AMI income ceiling on an ELIGIBLE review decision."
  - id: ERR_INCOME_LIMIT_UNDEFINED
    http: 422
    condition: "No IncomeLimit row exists for the applicant's household size in the program."
  - id: ERR_SESSION_TIME_CONFLICT
    http: 409
    condition: "Applicant already enrolled/attended in another session within SESSION_BUFFER_MINUTES (=30) of this session."
  - id: ERR_SESSION_FULL
    http: 409
    condition: "Education session enrolled_count has reached capacity."
  - id: ERR_CLOSING_WINDOW_CONFLICT
    http: 409
    condition: "Another non-CANCELLED closing on the same property has an overlapping half-open occupation window."
  - id: ERR_APPRAISAL_MISSING
    http: 422
    condition: "Property has no appraised_value_cents when completing a closing."
  - id: ERR_LIEN_ORDER_INVALID
    http: 422
    condition: "lien_position violates the non-decreasing subordination order for the award's allocations."
  - id: ERR_ALLOCATION_EXCEEDS_AWARD
    http: 422
    condition: "Reserving this allocation would push allocated_cents above the award's assistance_amount_cents."
  - id: ERR_INSUFFICIENT_FUNDS
    http: 409
    condition: "amount_cents exceeds the funding source's available_cents."
  - id: ERR_SALE_BEFORE_OPEN
    http: 422
    condition: "Reported sale_date precedes the servicing account's opened_at."
  - id: ERR_SESSION_TIME_INVALID
    http: 400
    condition: "Education session end_at is not strictly after start_at."
  - id: ERR_DUPLICATE_INCOME_LIMIT
    http: 409
    condition: "An IncomeLimit row already exists for the (program, household_size) pair."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only self-register as an applicant."
    identity: "opaque"
    exclusive_operations:
      - "POST /applicants"
    shared_operations: []
  - name: Applicant
    description: "A registered homebuyer acting on their own applications, enrollments, and certificates."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/resubmit"
      - "POST /applications/{id}/withdraw"
      - "POST /education-sessions/{id}/enrollments"
      - "POST /enrollments/{id}/cancel"
    shared_operations:
      - "POST /applications (shared with CaseManager)"
      - "GET reads of own applicant, applications, programs, sessions, enrollments, certificates"
  - name: CaseManager
    description: "Program staff who intake properties, review applications, create/approve/cancel awards, and reserve funding. Segregation of duties: a case manager who reviewed an application to ELIGIBLE may not approve that application's award (enforced by ERR_SEGREGATION_OF_DUTIES on X-User-ID)."
    identity: "opaque"
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{id}/appraisal"
      - "POST /applications/{id}/review"
      - "POST /applications/{id}/awards"
      - "POST /awards/{id}/approve"
      - "POST /awards/{id}/cancel"
      - "POST /funding-allocations"
    shared_operations:
      - "POST /applications (shared with Applicant)"
      - "GET reads across applications, awards, funding, closings, servicing"
  - name: ProgramAdmin
    description: "Program administrator: configures programs, income limits, funding sources, education sessions; marks attendance; runs reports; controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/income-limits"
      - "POST /funding-sources"
      - "POST /education-sessions"
      - "POST /enrollments/{id}/attend"
      - "POST /enrollments/{id}/no-show"
      - "GET /reports/portfolio-summary"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all collections"
  - name: ClosingCoordinator
    description: "Coordinates purchase closings for funded awards."
    identity: "opaque"
    exclusive_operations:
      - "POST /awards/{id}/closings"
      - "POST /closings/{id}/docs-pending"
      - "POST /closings/{id}/complete"
      - "POST /closings/{id}/cancel"
    shared_operations:
      - "GET reads of programs, properties, awards, closings"
  - name: Servicer
    description: "Services disbursed awards: reports sales, computes recapture, closes servicing, toggles payment status."
    identity: "opaque"
    exclusive_operations:
      - "POST /servicing-accounts/{id}/report-sale"
      - "POST /servicing-accounts/{id}/close"
      - "POST /servicing-accounts/{id}/payment-status"
    shared_operations:
      - "GET reads of awards, servicing accounts, sale events"


