# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# of SKILL.md §0.5. Two instances per rule. All monetary asserts are integer
# cents computed with decimal round_half_up per the scaffold's calculations.
scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: manipulated_duty_pf_vs_npf_variant
        grounds:
          - calculations.duty_assessment
          - calculations.manipulation_output_valuation
          - entities.InventoryLot.fields.zone_status
          - state_machines.ManipulationOrder.APPROVED_to_COMPLETED
        distinguishing_aspect: |
          Duty-variant divergence on the Withdrawal/InventoryLot domain: identical
          merchandise, quantities, and manipulation produce duty 48000 under the
          PRIVILEGED_FOREIGN variant (locked component rate/basis) vs 144000 under
          the NON_PRIVILEGED_FOREIGN variant (finished-good rate and value-added
          basis). The sibling instance lives on the AnnualReconciliation domain.
        test_recipe:
          setup:
            - "Zone with bond 10000000000; two lots of HTS 8542.31 (rate 0.04), 100 units at 10000 cents, one PRIVILEGED_FOREIGN and one NON_PRIVILEGED_FOREIGN"
            - "Each lot fully consumed (100 units) by a completed manipulation producing 50 units of HTS 9503.00 (rate 0.12) with value_added_cents 200000; output lots both have unit_value_cents 24000"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Variant Zone", zone_code: "Z-VAR", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors PF", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a_pf: "$.data.id" }
            - call: "POST /zones/admissions/${a_pf}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a_pf}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a_pf}"
              as: ZoneOperator
              captures: { lot_pf: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors NPF", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a_npf: "$.data.id" }
            - call: "POST /zones/admissions/${a_npf}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a_npf}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a_npf}"
              as: ZoneOperator
              captures: { lot_npf: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot_pf}", input_quantity: 100, output_hts_code: "9503.00", output_quantity: 50, value_added_cents: 200000, output_description: "Assembled toys ex-PF" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m_pf: "$.data.id" }
            - call: "POST /zones/manipulation-orders/${m_pf}/approve"
              as: ZoneOperator
            - call: "POST /zones/manipulation-orders/${m_pf}/complete"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots?source_manipulation_id=${m_pf}"
              as: ZoneOperator
              captures: { ol_pf: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot_npf}", input_quantity: 100, output_hts_code: "9503.00", output_quantity: 50, value_added_cents: 200000, output_description: "Assembled toys ex-NPF" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m_npf: "$.data.id" }
            - call: "POST /zones/manipulation-orders/${m_npf}/approve"
              as: ZoneOperator
            - call: "POST /zones/manipulation-orders/${m_npf}/complete"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots?source_manipulation_id=${m_npf}"
              as: ZoneOperator
              captures: { ol_npf: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${ol_pf}", withdrawal_type: "CONSUMPTION", quantity: 50 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w1: "$.data.id" }
            - call: "POST /zones/withdrawals/${w1}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { w1_duty: "$.data.assessed_duty_cents" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${ol_npf}", withdrawal_type: "CONSUMPTION", quantity: 50 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w2: "$.data.id" }
            - call: "POST /zones/withdrawals/${w2}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { w2_duty: "$.data.assessed_duty_cents" }
          assert:
            - "Withdrawal.${w1}.assessed_duty_cents == 48000  (50 x 24000 x 0.04 locked source rate; PF variant ignores the 200000 value added and the 0.12 output rate)"
            - "Withdrawal.${w2}.assessed_duty_cents == 144000 (50 x 24000 x 0.12 finished-good rate on value-added basis; NPF variant)"
            - "Withdrawal.${w1}.assessed_duty_cents != Withdrawal.${w2}.assessed_duty_cents despite identical quantities and identical physical transformation"
            - "both output lots have unit_value_cents == 24000 and zone_status inherited from their source lot"

      - name: book_vs_physical_reconciliation_variant
        grounds:
          - calculations.reconciliation_variance
          - entities.AnnualReconciliation.fields.book_ending_value_cents
          - entities.AnnualReconciliation.fields.physical_ending_value_cents
          - state_machines.AnnualReconciliation.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Dual-variant divergence on the AnnualReconciliation (zone inventory)
          domain — a different entity domain from the duty variant instance: the
          book-derived algorithm (beginning + receipts - withdrawals) yields
          190000 while the independent physical-count input yields 188000, and
          the scaffold exposes the delta as discrepancy_cents/discrepancy_pct.
        test_recipe:
          setup:
            - "Zone; admission A1 (HTS 8542.31, qty 10, unit 5000, NPF) ADMITTED; admission A2 (HTS 9503.00, qty 20, unit 3000, NPF) ADMITTED — both stamped at the default clock 2026-08-01T00:00:00Z, inside zone year 2026"
            - "One CONSUMPTION withdrawal of 4 units from A1's lot FILED (withdrawal value 20000)"
            - "DRAFT reconciliation for zone_year 2026 with beginning_value_cents 100000 and physical_ending_value_cents 188000"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Recon Zone", zone_code: "Z-REC", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 10, unit_value_cents: 5000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
            - call: "POST /zones/admissions/${a1}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a1}"
              as: ZoneOperator
              captures: { lot1: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Toys", hts_code: "9503.00", quantity: 20, unit_value_cents: 3000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a2}/admit"
              as: CustomsOfficer
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot1}", withdrawal_type: "CONSUMPTION", quantity: 4 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zv: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 100000, physical_ending_value_cents: 188000, expected_zone_version: "${zv}" }
              as: ZoneOperator
              captures: { r1: "$.data.id" }
          trigger:
            - call: "POST /zones/annual-reconciliations/${r1}/submit"
              as: ZoneOperator
          assert:
            - "AnnualReconciliation.${r1}.book_receipts_value_cents == 110000  (10x5000 + 20x3000)"
            - "AnnualReconciliation.${r1}.book_withdrawals_value_cents == 20000 (4 x 5000)"
            - "AnnualReconciliation.${r1}.book_ending_value_cents == 190000"
            - "AnnualReconciliation.${r1}.discrepancy_cents == -2000"
            - "AnnualReconciliation.${r1}.discrepancy_pct == 1.0526"
            - "AnnualReconciliation.${r1}.audit_flagged == true"
            - "Zone.${z}.compliance_posture == AUDIT_HOLD"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: duty_branching_by_zone_status
        grounds:
          - calculations.duty_assessment
          - entities.InventoryLot.fields.duty_rate
        distinguishing_aspect: |
          Mode (a) combinatorial formula: duty = round(qty x unit_value x rate)
          with >= 3 inputs and a conditional branch on lot.zone_status —
          DOMESTIC short-circuits to 0 while PRIVILEGED_FOREIGN and
          NON_PRIVILEGED_FOREIGN take the ad valorem branch. The sibling
          instance exercises mode (b) nested rounding on the weekly entry.
        test_recipe:
          setup:
            - "Zone; three ADMITTED lots, each HTS 9503.00 (rate 0.12), qty 10, unit 5000 — one DOMESTIC, one PRIVILEGED_FOREIGN, one NON_PRIVILEGED_FOREIGN"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Branch Zone", zone_code: "Z-BR", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Domestic toys", hts_code: "9503.00", quantity: 10, unit_value_cents: 5000, zone_status: "DOMESTIC" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a_d: "$.data.id" }
            - call: "POST /zones/admissions/${a_d}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a_d}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a_d}"
              as: ZoneOperator
              captures: { lot_d: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "PF toys", hts_code: "9503.00", quantity: 10, unit_value_cents: 5000, zone_status: "PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a_pf: "$.data.id" }
            - call: "POST /zones/admissions/${a_pf}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a_pf}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a_pf}"
              as: ZoneOperator
              captures: { lot_pf: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "NPF toys", hts_code: "9503.00", quantity: 10, unit_value_cents: 5000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a_npf: "$.data.id" }
            - call: "POST /zones/admissions/${a_npf}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a_npf}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a_npf}"
              as: ZoneOperator
              captures: { lot_npf: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot_d}", withdrawal_type: "CONSUMPTION", quantity: 10 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_d: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_d}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty_d: "$.data.assessed_duty_cents" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot_pf}", withdrawal_type: "CONSUMPTION", quantity: 10 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_pf: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_pf}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty_pf: "$.data.assessed_duty_cents" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot_npf}", withdrawal_type: "CONSUMPTION", quantity: 10 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_npf: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_npf}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty_npf: "$.data.assessed_duty_cents" }
          assert:
            - "Withdrawal.${w_d}.assessed_duty_cents == 0       (DOMESTIC branch: rate forced to 0 regardless of HTS rate)"
            - "Withdrawal.${w_pf}.assessed_duty_cents == 6000   (10 x 5000 x 0.12)"
            - "Withdrawal.${w_npf}.assessed_duty_cents == 6000  (10 x 5000 x 0.12)"
            - "the DOMESTIC short-circuit branch diverges from the ad valorem branch for identical quantity, unit value, and HTS code"

      - name: weekly_settlement_line_rounding_order
        grounds:
          - calculations.weekly_entry_settlement
          - entities.WeeklyEntry.fields.duty_total_cents
          - entities.WeeklyEntry.fields.mpf_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-line duty rounded half-up FIRST then
          summed yields 67, whereas sum-then-round would yield 66 — the scaffold
          pins round-per-line-then-sum; MPF separately rounds the consolidated
          value once then applies min/max caps. Different mode from the sibling
          (mode a) instance.
        test_recipe:
          setup:
            - "Zone; lot1 = 10 units at 1221 cents HTS 8708.29 (rate 0.025) NPF; lot2 = 10 units at 1421 cents HTS 8708.29 NPF"
            - "Weekly entry week [2026-07-27T00:00:00Z, 2026-08-03T00:00:00Z) — the default clock 2026-08-01T00:00:00Z falls inside it"
            - "W1: 1 unit from lot1 attached to the entry, FILED (line duty round(1221 x 0.025) = round(30.525) = 31); W2: 1 unit from lot2 attached, FILED (round(35.525) = 36)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Round Zone", zone_code: "Z-RND", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Auto parts A", hts_code: "8708.29", quantity: 10, unit_value_cents: 1221, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
            - call: "POST /zones/admissions/${a1}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a1}"
              as: ZoneOperator
              captures: { lot1: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Auto parts B", hts_code: "8708.29", quantity: 10, unit_value_cents: 1421, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a2}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a2}"
              as: ZoneOperator
              captures: { lot2: "$.data[0].id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-07-27T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e: "$.data.id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot1}", withdrawal_type: "CONSUMPTION", quantity: 1, weekly_entry_id: "${e}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w1: "$.data.id" }
            - call: "POST /zones/withdrawals/${w1}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot2}", withdrawal_type: "CONSUMPTION", quantity: 1, weekly_entry_id: "${e}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w2: "$.data.id" }
            - call: "POST /zones/withdrawals/${w2}/file"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/weekly-entries/${e}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { ev: $.data.entered_value_cents, dt: $.data.duty_total_cents, mu: $.data.mpf_uncapped_cents, mpf: $.data.mpf_cents, psm: $.data.per_shipment_mpf_cents, sav: "$.data.mpf_savings_cents" }
          assert:
            - "WeeklyEntry.${e}.entered_value_cents == 2642        (1221 + 1421)"
            - "WeeklyEntry.${e}.duty_total_cents == 67            (31 + 36 per-line rounding; sum-then-round of 66.05 would give 66 and is non-conformant)"
            - "WeeklyEntry.${e}.mpf_uncapped_cents == 9           (round(2642 x 0.003464) = round(9.151888))"
            - "WeeklyEntry.${e}.mpf_cents == 3000                (MPF_MIN_CENTS floor)"
            - "WeeklyEntry.${e}.per_shipment_mpf_cents == 6000    (each line alone: round(..) < 3000 -> 3000 floor; 3000 + 3000)"
            - "WeeklyEntry.${e}.mpf_savings_cents == 3000         (weekly consolidation saving)"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: admission_submit_return_cycle
        grounds:
          - state_machines.Admission.DRAFT_to_SUBMITTED
          - state_machines.Admission.SUBMITTED_to_DRAFT
          - state_machines.Admission.SUBMITTED_to_ADMITTED
        distinguishing_aspect: |
          Cyclic machine on Admission (DRAFT -> SUBMITTED -> DRAFT revision loop,
          terminable by admit); the sibling instance is a branching fork on the
          Withdrawal entity — different entity, different non-linear shape.
        test_recipe:
          setup:
            - "Zone; one admission created (DRAFT)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Cycle Zone", zone_code: "Z-CYC", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 4, unit_value_cents: 2500, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
          trigger:
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
              captures: { s1: "$.data.status" }
            - call: "POST /zones/admissions/${a}/return"
              as: CustomsOfficer
              captures: { s2: "$.data.status" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
              captures: { s3: "$.data.status" }
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { s4: $.data.status, adate: $.data.admission_date, aver: "$.data.version" }
          assert:
            - "after first submit: Admission.${a}.status == SUBMITTED"
            - "after customs return: Admission.${a}.status == DRAFT  (cycle DRAFT -> SUBMITTED -> DRAFT is legal)"
            - "after second submit: Admission.${a}.status == SUBMITTED"
            - "after admit: Admission.${a}.status == ADMITTED and Admission.${a}.admission_date == 2026-08-01T00:00:00Z (default logical clock)"
            - "Admission.${a}.version == 5 (create v1 + four transitions)"

      - name: withdrawal_consumption_export_fork
        grounds:
          - state_machines.Withdrawal.FILED_to_DUTY_PAID
          - state_machines.Withdrawal.FILED_to_EXPORTED
          - entities.Withdrawal.fields.duty_outcome
        distinguishing_aspect: |
          Branching fork on Withdrawal: from FILED the CONSUMPTION branch ends in
          DUTY_PAID with duty_outcome COLLECTED (Importer pays), while the EXPORT
          branch ends in EXPORTED with duty_outcome EXTINGUISHED (CustomsOfficer
          confirms; deferred duty dies without collection). Different entity and
          different shape from the sibling cycle instance.
        test_recipe:
          setup:
            - "Zone; one lot (HTS 8542.31 rate 0.04, qty 10, unit 2000, NPF) ADMITTED"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Fork Zone", zone_code: "Z-FRK", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 10, unit_value_cents: 2000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 5 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_c: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_c}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty_c: "$.data.assessed_duty_cents" }
            - call: "POST /zones/withdrawals/${w_c}/pay-duty"
              as: Importer
              as_user_id: "imp-1"
              captures: { st_c: $.data.status, out_c: "$.data.duty_outcome" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "EXPORT", quantity: 5 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_x: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_x}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty_x: "$.data.assessed_duty_cents" }
            - call: "POST /zones/withdrawals/${w_x}/confirm-export"
              as: CustomsOfficer
              captures: { st_x: $.data.status, out_x: "$.data.duty_outcome" }
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { lot_status: $.data.status, lot_onhand: "$.data.quantity_on_hand" }
          assert:
            - "Withdrawal.${w_c}.status == DUTY_PAID and duty_outcome == COLLECTED; assessed_duty_cents == 400 (5 x 2000 x 0.04)"
            - "Withdrawal.${w_x}.status == EXPORTED and duty_outcome == EXTINGUISHED; assessed_duty_cents == 400 but no duty is collected"
            - "InventoryLot.${lot}.quantity_on_hand == 0 and status == DEPLETED (5 + 5 = admitted 10)"
            - "the two fork branches share the FILED origin but carry divergent side-effect sets (COLLECTED vs EXTINGUISHED)"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_breach_cascade_freezes_entries
        grounds:
          - state_machines.Zone.NORMAL_to_AUDIT_HOLD
          - state_machines.WeeklyEntry.OPEN_to_FROZEN
          - state_machines.InventoryLot.DEPLETED_to_IN_ZONE
          - calculations.reconciliation_variance
        distinguishing_aspect: |
          Depth-4 cascade triggered by reconciliation submit: recon flagged ->
          zone posture AUDIT_HOLD (1) -> OPEN weekly entry FROZEN (2) -> its
          FILED withdrawal detached to DRAFT with lot quantity restored (3) ->
          lot DEPLETED -> IN_ZONE plus zone aggregates recomputed (4). Trigger
          differs from the sibling instance (recon submit vs withdrawal file).
        test_recipe:
          setup:
            - "Zone; lot from admission (HTS 0401.10 rate 0.05, qty 5, unit 1000, NPF); OPEN weekly entry for week [2026-07-27, 2026-08-03)"
            - "Withdrawal of all 5 units attached to the entry and FILED at the default clock -> lot DEPLETED, zone.active_lot_count == 0, exposure 0"
            - "DRAFT reconciliation for 2026 with beginning 0 and physical 1000 (book: receipts 5000 - withdrawals 5000 = 0; book==0 with physical!=0 pins discrepancy_pct = 100 > 0.5)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Cascade Zone", zone_code: "Z-CAS", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-07-27T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e: "$.data.id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 5, weekly_entry_id: "${e}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zv: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 0, physical_ending_value_cents: 1000, expected_zone_version: "${zv}" }
              as: ZoneOperator
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /zones/annual-reconciliations/${r}/submit"
              as: ZoneOperator
              captures: { r_flag: "$.data.audit_flagged" }
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { z_posture: $.data.compliance_posture, z_lots: $.data.active_lot_count, z_exp: "$.data.deferred_duty_exposure_cents" }
            - call: "GET /zones/weekly-entries/${e}"
              as: ZoneOperator
              captures: { e_status: "$.data.status" }
            - call: "GET /zones/withdrawals/${w}"
              as: ZoneOperator
              captures: { w_status: $.data.status, w_entry: "$.data.weekly_entry_id" }
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { lot_onhand: $.data.quantity_on_hand, lot_status: "$.data.status" }
          assert:
            - "AnnualReconciliation.${r}.audit_flagged == true (book_ending 0, physical 1000, discrepancy_pct == 100)"
            - "Zone.${z}.compliance_posture == AUDIT_HOLD                     (hop 1)"
            - "WeeklyEntry.${e}.status == FROZEN                              (hop 2)"
            - "Withdrawal.${w}.status == DRAFT and weekly_entry_id == null    (hop 3: detach + restore)"
            - "InventoryLot.${lot}.quantity_on_hand == 5 and status == IN_ZONE (hop 3/4: restored from DEPLETED)"
            - "Zone.${z}.active_lot_count == 1 and deferred_duty_exposure_cents == 250 (round(5 x 1000 x 0.05)) (hop 4)"

      - name: withdrawal_file_cascade_depletes_lot
        grounds:
          - state_machines.Withdrawal.DRAFT_to_FILED
          - state_machines.InventoryLot.IN_ZONE_to_DEPLETED
          - calculations.deferred_duty_exposure
          - entities.Zone.fields.active_lot_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by withdrawal filing (different trigger from
          the sibling recon-submit cascade): file -> lot debited (1) -> lot hits
          exactly 0 and auto-transitions DEPLETED (2) -> zone.active_lot_count
          and zone.deferred_duty_exposure_cents recomputed from lot states (3).
        test_recipe:
          setup:
            - "Zone; one lot (HTS 8542.31 rate 0.04, qty 3, unit 4000, NPF) ADMITTED; zone exposure 480, active_lot_count 1"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Deplete Zone", zone_code: "Z-DEP", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 3, unit_value_cents: 4000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "EXPORT", quantity: 3 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { lot_onhand: $.data.quantity_on_hand, lot_status: $.data.status, lot_withdrawn: "$.data.cumulative_withdrawn" }
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { z_lots: $.data.active_lot_count, z_exp: "$.data.deferred_duty_exposure_cents" }
          assert:
            - "InventoryLot.${lot}.quantity_on_hand == 0 and cumulative_withdrawn == 3  (hop 1)"
            - "InventoryLot.${lot}.status == DEPLETED                                    (hop 2)"
            - "Zone.${z}.active_lot_count == 0                                           (hop 3)"
            - "Zone.${z}.deferred_duty_exposure_cents == 0 (480 relieved by the export filing)"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: admit_state_error_beats_bond_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_ADMISSION_INVALID_TRANSITION]
          - errors[ERR_BOND_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the admission is still DRAFT
          (state violation) AND its admission would breach the 100-cent bond
          (fiscal violation: deferred estimate 250 > 100); priority 6 state must
          win over priority 11 fiscal. Sibling instance uses a different pair
          (business_safety, business_temporal).
        test_recipe:
          setup:
            - "Zone with bond_coverage_cents 100; admission (HTS 0401.10 rate 0.05, qty 5, unit 1000 -> deferred estimate 250) left in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Tiny Bond Zone", zone_code: "Z-TB", bond_coverage_cents: 100 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ADMISSION_INVALID_TRANSITION (http 409) — the priority-6 state check fires"
            - "error_id != ERR_BOND_CAPACITY_EXCEEDED — the priority-11 fiscal check is never reached even though 250 > 100 would breach the bond"
            - "Admission.${a}.status remains DRAFT and no lot is created (GET /zones/lots?zone_id=${z} total_count == 0)"

      - name: gate_badge_safety_beats_window_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_BADGE_ACCESS_DENIED]
          - errors[ERR_BADGE_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal): the badge is
          REVOKED (security violation) AND occurred_at falls outside its validity
          window (temporal violation); priority-7 safety must win over
          priority-8 temporal. Different pair from the sibling (state, fiscal).
        test_recipe:
          setup:
            - "Zone; badge for 'Grace Hopper' with validity [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z], subsequently REVOKED"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Gate Zone", zone_code: "Z-GTE", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Grace Hopper", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-08-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b: "$.data.id" }
            - call: "POST /zones/access-badges/${b}/transition"
              payload: { to_status: "REVOKED" }
              as: ZoneOperator
          trigger:
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "IN", occurred_at: "2026-09-05T09:00:00Z" }
              as: GateOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_BADGE_ACCESS_DENIED (http 422) — priority-7 security check fires on the revoked badge"
            - "error_id != ERR_BADGE_WINDOW_VIOLATION — priority-8 temporal check is masked even though 2026-09-05 is outside [2026-08-01, 2026-08-31]"
            - "no ZoneAccessEvent is persisted (GET /zones/access-events?badge_id=${b} total_count == 0)"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: mpf_max_cap_exact_boundary
        grounds:
          - calculations.weekly_entry_settlement
          - entities.WeeklyEntry.fields.mpf_uncapped_cents
          - entities.WeeklyEntry.fields.mpf_cents
        distinguishing_aspect: |
          Boundary on the MPF dollar metric via the weekly-entry file endpoint:
          entered value 17321000 rounds the raw fee to exactly MPF_MAX_CENTS
          60000 (cap NOT engaged, since the rule caps only when raw > MAX),
          while 17321300 rounds to 60001 and IS capped to 60000. Sibling
          instance is a zero-quantity boundary on a different metric (units) and
          a different endpoint (withdrawal file).
        test_recipe:
          setup:
            - "Zone; lot1 = 1 unit at 17321000 cents HTS 8708.29 NPF; lot2 = 1 unit at 17321300 cents HTS 8708.29 NPF"
            - "Entry E1 week [2026-08-03, 2026-08-10) with lot1's 1-unit CONSUMPTION withdrawal FILED at clock 2026-08-04; entry E2 week [2026-08-10, 2026-08-17) (half-open adjacency with E1 is legal) with lot2's withdrawal FILED at clock 2026-08-11"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Cap Zone", zone_code: "Z-CAP", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Bulk parts A", hts_code: "8708.29", quantity: 1, unit_value_cents: 17321000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
            - call: "POST /zones/admissions/${a1}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a1}"
              as: ZoneOperator
              captures: { lot1: "$.data[0].id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Bulk parts B", hts_code: "8708.29", quantity: 1, unit_value_cents: 17321300, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a2}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a2}"
              as: ZoneOperator
              captures: { lot2: "$.data[0].id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-08-03T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e1: "$.data.id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-08-10T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ZoneOperator
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot1}", withdrawal_type: "CONSUMPTION", quantity: 1, weekly_entry_id: "${e1}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w1: "$.data.id" }
            - call: "POST /zones/withdrawals/${w1}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ZoneOperator
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot2}", withdrawal_type: "CONSUMPTION", quantity: 1, weekly_entry_id: "${e2}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w2: "$.data.id" }
            - call: "POST /zones/withdrawals/${w2}/file"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/weekly-entries/${e1}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { mu1: $.data.mpf_uncapped_cents, mpf1: $.data.mpf_cents, dt1: "$.data.duty_total_cents" }
            - call: "POST /zones/weekly-entries/${e2}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { mu2: $.data.mpf_uncapped_cents, mpf2: $.data.mpf_cents, dt2: "$.data.duty_total_cents" }
          assert:
            - "WeeklyEntry.${e1}.mpf_uncapped_cents == 60000 and mpf_cents == 60000  (raw 59999.944 rounds to exactly MAX; cap not engaged because rule is raw > MAX)"
            - "WeeklyEntry.${e2}.mpf_uncapped_cents == 60001 and mpf_cents == 60000  (raw 60000.9832 rounds to 60001; cap engaged)"
            - "WeeklyEntry.${e1}.duty_total_cents == 433025   (round(17321000 x 0.025))"
            - "WeeklyEntry.${e2}.duty_total_cents == 433033   (round(17321300 x 0.025) = round(433032.5) half-up)"

      - name: lot_exact_depletion_boundary
        grounds:
          - state_machines.Withdrawal.DRAFT_to_FILED
          - errors[ERR_INSUFFICIENT_QUANTITY]
          - entities.InventoryLot.fields.quantity_on_hand
        distinguishing_aspect: |
          Boundary on the integer-units metric via the withdrawal file endpoint:
          quantity == on_hand - reserved (exactly 5) files successfully and
          depletes the lot, while quantity == available + 1 (6) is rejected —
          the availability rule is inclusive (<=). Different metric (units) and
          different endpoint from the sibling MPF dollar boundary.
        test_recipe:
          setup:
            - "Zone; one lot (HTS 0401.10, qty 5, unit 1000, NPF) ADMITTED with nothing reserved"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Edge Zone", zone_code: "Z-EDG", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 6 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_over: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_over}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { err_over: "$.data.error_id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 5 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w_exact: "$.data.id" }
            - call: "POST /zones/withdrawals/${w_exact}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { lot_onhand: $.data.quantity_on_hand, lot_status: "$.data.status" }
          assert:
            - "filing quantity 6 against 5 available -> ERR_INSUFFICIENT_QUANTITY (http 422)"
            - "filing quantity 5 (exact equality) succeeds: Withdrawal.${w_exact}.status == FILED"
            - "InventoryLot.${lot}.quantity_on_hand == 0 and status == DEPLETED"
            - "the failed over-quantity filing left the lot untouched (cumulative_withdrawn == 5 from the exact filing only)"

