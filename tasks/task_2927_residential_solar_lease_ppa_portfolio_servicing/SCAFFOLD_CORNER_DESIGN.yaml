  - section: validations
    instances:

      - name: duplicate_homeowner_email_differing_only_in_case_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13].duplicate_homeowner_email
          - errors[ERR_DUPLICATE_EMAIL]
          - endpoints[POST /servicing/homeowners]
        distinguishing_aspect: "Uniqueness on email is case-INSENSITIVE, so a second homeowner whose address differs from the first only in letter case is a duplicate; a byte-comparison implementation would create it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One Homeowner already registered as Dana.Reyes@Example.com."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "Dana.Reyes@Example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoV1_id: $.data.id }
          trigger:
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana R Reyes", email: "dana.reyes@example.com", state_code: "NV", fico_score: 700, dti_ratio: 0.30, monthly_income_cents: 900000 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_EMAIL"
            - "GET /servicing/homeowners?email=dana.reyes@example.com still reports total_count 1"
            - "a third create with dana.reyes+2@example.com returns 201, so only the collision is refused"

