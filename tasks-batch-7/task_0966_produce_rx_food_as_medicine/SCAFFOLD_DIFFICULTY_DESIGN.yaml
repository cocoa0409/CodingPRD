      - name: daily_match_cap_exact_boundary
        grounds:
          - calculations.daily_match_remaining
          - calculations.double_up_match
          - entities.Program.fields.double_up_daily_cap_cents
        distinguishing_aspect: |
          Boundary on a CENTS metric via POST /redemptions: cumulative daily
          match landing EXACTLY on the 1000-cent cap (600 + 400) is allowed
          (>= semantics — only exceeding is clamped); the next redemption's
          match clamps to exactly 0 rather than erroring.
