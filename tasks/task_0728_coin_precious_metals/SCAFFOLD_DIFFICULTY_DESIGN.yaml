scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sell_cogs_provisional_vs_final_diverge
        grounds:
          - calculations.sell_cogs_provisional
          - calculations.sell_cogs_final
          - state_machines.SellOrder.PLACED_to_SETTLED
          - entities.SellOrder.fields.provisional_cogs_cents
          - entities.SellOrder.fields.final_cogs_cents
        distinguishing_aspect: |
          On a SellOrder whose product has two lots at different acquisition costs,
          the weighted-average provisional COGS (660000) differs from the FIFO final
          COGS (620000) for identical order inputs — dual-variant on the SellOrder/inventory domain.
        test_recipe:
          setup:
            - "GOLD spot rate = 200000 cents/troy oz"
            - "one BULLION gold product: weight 1.0 oz, purity 1.0, min_sell_spread 0.05, buy_spread 0.04, no premium (unit_sell_price = 210000)"
            - "lot1 (older): qty 5 @ acquisition_unit_cost 100000; lot2 (newer): qty 5 @ 120000"
            - "a sell order for quantity 6 placed against this product"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-BULLION", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot1_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 120000 }
              as: Trader
              captures: { lot2_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Buyer One" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 6 }
              as: SalesAgent
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders/${so_id}/settle"
              payload: {}
              as: SalesAgent
          assert:
            - "SellOrder.${so_id}.provisional_cogs_cents == 660000"
            - "SellOrder.${so_id}.final_cogs_cents == 620000"
            - "SellOrder.${so_id}.total_price_cents == 1260000"
            - "SellOrder.${so_id}.realized_margin_cents == 640000"
            - "SellOrder.${so_id}.provisional_cogs_cents != SellOrder.${so_id}.final_cogs_cents"

      - name: hedge_unrealized_vs_realized_pnl
        grounds:
          - calculations.hedge_pnl
          - state_machines.HedgePosition.OPEN_to_CLOSED
          - entities.HedgePosition.fields.unrealized_pnl_cents
          - entities.HedgePosition.fields.realized_pnl_cents
        distinguishing_aspect: |
          On a HedgePosition, the live unrealized PnL (recomputed against current spot)
          and the realized PnL fixed at close are the two divergent variants — dual-variant
          on the HedgePosition domain, distinct from the SellOrder COGS domain.
        test_recipe:
          setup:
            - "GOLD spot rate = 200000 cents/troy oz at hedge open"
            - "a short hedge position of 10 troy oz (entry_spot 200000)"
            - "spot then moves down to 190000"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
              captures: { gold_rate_id: $.data.id }
            - call: "POST /api/hedge-positions"
              payload: { metal: "GOLD", short_troy_oz: 10 }
              as: Trader
              captures: { hedge_id: $.data.id }
            - call: "PUT /api/spot-rates/${gold_rate_id}"
              payload: { price_per_troy_oz_cents: 190000 }
              as: Trader
          trigger:
            - call: "GET /api/hedge-positions/${hedge_id}"
              payload: {}
              as: Trader
            - call: "POST /api/hedge-positions/${hedge_id}/close"
              payload: {}
              as: Trader
          assert:
            - "HedgePosition.${hedge_id}.entry_spot_cents == 200000"
            - "the GET before close returns unrealized_pnl_cents == 100000"
            - "after close, HedgePosition.${hedge_id}.realized_pnl_cents == 100000"
            - "after close, HedgePosition.${hedge_id}.exit_spot_cents == 190000"
            - "HedgePosition.${hedge_id}.status == CLOSED"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: numismatic_sell_price_premium_then_spread
        grounds:
          - calculations.unit_sell_price
          - calculations.unit_melt_value
          - entities.Product.fields.numismatic_premium_cents
          - entities.SellOrder.fields.quoted_unit_price_cents
        distinguishing_aspect: |
          Mode (a): unit_sell_price has ≥3 inputs (spot, weight, purity, premium, spread) with a
          conditional branch on product_type — the numismatic premium is added to melt BEFORE the
          spread multiplier, giving 225750 (not melt*(1.05)+premium).
        test_recipe:
          setup:
            - "GOLD spot rate = 200000 cents/troy oz"
            - "one NUMISMATIC gold product: weight 1.0, purity 1.0, premium 15000, min_sell_spread 0.05 (melt 200000, base 215000, sell 225750)"
            - "a sell order for quantity 1"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-NUM-01", product_type: "NUMISMATIC", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04, numismatic_premium_cents: 15000 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Collector" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAgent
              captures: { so_id: $.data.id }
          assert:
            - "SellOrder.${so_id}.quoted_unit_price_cents == 225750"
            - "SellOrder.${so_id}.total_price_cents == 225750"

      - name: settlement_round_each_component_then_sum
        grounds:
          - calculations.settlement_breakdown
          - entities.Settlement.fields.commission_cents
          - entities.Settlement.fields.buyer_premium_cents
          - entities.Settlement.fields.dealer_revenue_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters. hammer 100003, commission_pct 0.125, buyer_premium_pct 0.075.
          Rounding EACH component then summing gives dealer_revenue 20000; summing the two percentages
          then rounding would give 20001. The scaffold pins round-then-sum → 20000.
        test_recipe:
          setup:
            - "a consignor customer"
            - "a SCHEDULED auction session"
            - "a consignment: reserve_price 50000, commission_pct 0.125, buyer_premium_pct 0.075"
            - "consignment listed into the session, then sold at hammer 100003"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Consignor" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-A", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Rare eagle", reserve_price_cents: 50000, commission_pct: 0.125, buyer_premium_pct: 0.075 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
              captures: { cons_v_listed: $.data.version }
            - call: "POST /api/consignments/${cons_id}/record-sale"
              payload: { hammer_price_cents: 100003, expected_consignment_version: "${cons_v_listed}" }
              as: SalesAgent
          trigger:
            - call: "POST /api/settlements"
              payload: { consignment_id: "${cons_id}" }
              as: ComplianceOfficer
              captures: { settle_id: $.data.id }
          assert:
            - "Settlement.${settle_id}.commission_cents == 12500"
            - "Settlement.${settle_id}.buyer_premium_cents == 7500"
            - "Settlement.${settle_id}.dealer_revenue_cents == 20000"
            - "Settlement.${settle_id}.seller_proceeds_cents == 87503"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: layaway_cyclic_deposit_loop
        grounds:
          - state_machines.Layaway.ACTIVE_to_ACTIVE
          - entities.Layaway.fields.amount_paid_cents
          - entities.Layaway.fields.status
        distinguishing_aspect: |
          The Layaway deposit transition is a cyclic ACTIVE→ACTIVE self-loop: two successive
          deposits keep status ACTIVE while amount_paid_cents accumulates (100000 → 200000).
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product (unit_sell_price 210000)"
            - "lot qty 10 @ cost 100000"
            - "a customer; a layaway for quantity 2 (total_price 420000, version 1, status ACTIVE)"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B2", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 10, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Layaway Holder" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
          trigger:
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 100000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lay_v1: $.data.version }
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 100000, expected_layaway_version: "${lay_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Layaway.${lay_id}.status == ACTIVE"
            - "Layaway.${lay_id}.amount_paid_cents == 200000"

      - name: consignment_listed_branches_to_returned
        grounds:
          - state_machines.Consignment.LISTED_to_RETURNED
          - state_machines.Consignment.LISTED_to_SOLD
          - entities.Consignment.fields.status
          - entities.Consignment.fields.hammer_price_cents
        distinguishing_aspect: |
          The Consignment LISTED state forks to two terminal branches with divergent side effects:
          the RETURNED branch leaves hammer_price_cents null and creates no Settlement, unlike the SOLD branch.
        test_recipe:
          setup:
            - "a consignor; a SCHEDULED auction session"
            - "a consignment listed into the session (status LISTED, hammer null)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Consignor Two" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-B", scheduled_start: "2026-04-02T10:00:00Z", scheduled_end: "2026-04-02T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Silver bar", reserve_price_cents: 50000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
          trigger:
            - call: "POST /api/consignments/${cons_id}/return"
              payload: {}
              as: SalesAgent
          assert:
            - "Consignment.${cons_id}.status == RETURNED"
            - "Consignment.${cons_id}.hammer_price_cents == null"
            - "GET /api/settlements?consignment_id=${cons_id} returns an empty list (total_count == 0)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: layaway_complete_cascades_to_lot_depletion
        grounds:
          - state_machines.Layaway.ACTIVE_to_COMPLETED
          - entities.InventoryLot.fields.reserved_qty
          - entities.InventoryLot.fields.sold_qty
          - entities.InventoryLot.fields.available_qty
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          Depth ≥3: completing the layaway (A) mutates the Layaway to COMPLETED (B); that
          conversion mutates the InventoryLot's reserved_qty→sold_qty (C); the lot reaching
          available_qty==0 && sold_qty==total_qty then transitions the lot to DEPLETED (D).
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product (unit_sell_price 210000)"
            - "lot with total_qty 2 @ cost 100000 (so a qty-2 layaway reserves the whole lot)"
            - "a customer; a layaway for quantity 2 fully paid to 420000"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B3", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 2, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Full Payer" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 420000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/layaways/${lay_id}/complete"
              payload: {}
              as: SalesAgent
          assert:
            - "Layaway.${lay_id}.status == COMPLETED"
            - "InventoryLot.${lot_id}.reserved_qty == 0"
            - "InventoryLot.${lot_id}.sold_qty == 2"
            - "InventoryLot.${lot_id}.available_qty == 0"
            - "InventoryLot.${lot_id}.status == DEPLETED"

      - name: buy_settle_cascades_to_inventory_and_lifetime
        grounds:
          - state_machines.BuyOrder.PLACED_to_SETTLED
          - entities.Customer.fields.lifetime_buy_payout_cents
          - entities.InventoryLot.fields.total_qty
          - entities.InventoryLot.fields.available_qty
        distinguishing_aspect: |
          Depth ≥2 from a different trigger: settling a BuyOrder (A) creates a new InventoryLot
          for the product (B) AND increments the seller Customer's lifetime_buy_payout_cents (B'),
          each caused by the settle transition — distinct origin from the layaway-complete cascade.
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product (weight 1.0, purity 1.0, buy_spread 0.04 → unit_buy_payout 192000)"
            - "a customer (id on file) selling quantity 3 to the dealer (total_payout 576000, non-reportable)"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B4", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Seller", id_document_on_file: true }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/buy-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 3 }
              as: SalesAgent
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /api/buy-orders/${bo_id}/settle"
              payload: {}
              as: SalesAgent
          assert:
            - "BuyOrder.${bo_id}.status == SETTLED"
            - "BuyOrder.${bo_id}.total_payout_cents == 576000"
            - "Customer.${cust_id}.lifetime_buy_payout_cents == 576000"
            - "GET /api/inventory-lots?product_id=${prod_id} returns a lot with total_qty == 3 and available_qty == 3 and acquisition_unit_cost_cents == 192000"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_ira_sell_settle
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_IRA_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 8): a settle on an
          already-CANCELLED IRA-allocation SellOrder whose IRAAccount is also not ACTIVE returns
          ERR_INVALID_STATE (the higher-priority state check), not ERR_IRA_NOT_ACTIVE.
        test_recipe:
          setup:
            - "GOLD spot 200000; IRA-eligible BULLION product"
            - "a customer with id on file; an IRAAccount left PENDING (never approved)"
            - "an IRA-allocation sell order placed then CANCELLED"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-IRA-1", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04, ira_eligible: true }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
            - call: "POST /api/customers"
              payload: { full_name: "IRA Owner", id_document_on_file: true }
              as: ComplianceOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "${cust_id}", custodian_name: "Acme Trust", custodian_account_ref: "ACME-001" }
              as: ComplianceOfficer
              captures: { ira_id: $.data.id }
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1, ira_account_id: "${ira_id}" }
              as: SalesAgent
              captures: { so_id: $.data.id }
            - call: "POST /api/sell-orders/${so_id}/cancel"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/sell-orders/${so_id}/settle"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the settle response error_id == ERR_INVALID_STATE"
            - "the settle response error_id != ERR_IRA_NOT_ACTIVE"

      - name: reserve_business_constraint_beats_stale_version_business_constraint
        grounds:
          - validations[priority=11]
          - validations[priority=17]
          - errors[ERR_RESERVE_NOT_MET]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Two business_constraint checks at different priorities on record-sale: a below-reserve
          hammer price sent with a STALE expected_consignment_version returns the lower-priority-number
          winner. Reserve is priority 11, OCC stale-version priority 17 → ERR_RESERVE_NOT_MET wins.
        test_recipe:
          setup:
            - "a consignor; a SCHEDULED session"
            - "a consignment reserve 100000 listed (version captured), then version deliberately advanced by an unrelated no-op is not needed — we send a stale version AND a below-reserve price simultaneously"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Consignor Three" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-C", scheduled_start: "2026-04-03T10:00:00Z", scheduled_end: "2026-04-03T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Gold coin", reserve_price_cents: 100000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
              captures: { cons_v_listed: $.data.version }
          trigger:
            - call: "POST /api/consignments/${cons_id}/record-sale"
              payload: { hammer_price_cents: 50000, expected_consignment_version: "${cons_v_listed} - 1" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the record-sale response error_id == ERR_RESERVE_NOT_MET"
            - "the record-sale response error_id != ERR_STALE_VERSION"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reportable_threshold_exact_boundary
        grounds:
          - calculations.unit_buy_payout
          - entities.BuyOrder.fields.reportable
          - entities.BuyOrder.fields.total_payout_cents
        distinguishing_aspect: |
          Numeric >= boundary on the buy-order endpoint: total_payout exactly 1000000 (== REPORTABLE_THRESHOLD_CENTS)
          sets reportable=true (>=, not >). Uses a product priced so unit_buy_payout is 500000 with qty 2.
        test_recipe:
          setup:
            - "GOLD spot 500000; BULLION product weight 1.0 purity 1.0 buy_spread 0.0 → unit_buy_payout 500000"
            - "a customer; a buy order for quantity 2 → total_payout exactly 1000000"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 500000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-BOUND-1", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.0 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Boundary Seller" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/buy-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2 }
              as: SalesAgent
              captures: { bo_id: $.data.id }
          assert:
            - "BuyOrder.${bo_id}.total_payout_cents == 1000000"
            - "BuyOrder.${bo_id}.reportable == true"

      - name: insufficient_inventory_empty_and_zero_boundary
        grounds:
          - validations[priority=15]
          - errors[ERR_INSUFFICIENT_INVENTORY]
          - entities.InventoryLot.fields.available_qty
        distinguishing_aspect: |
          Empty/zero-count boundary on a different endpoint (sell-order settle): settling for
          quantity exactly one greater than aggregate available_qty (1 available, order 2) fails
          with ERR_INSUFFICIENT_INVENTORY — the zero-remaining edge, distinct from the numeric threshold above.
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product (unit_sell_price 210000)"
            - "a single lot with total_qty 1 @ cost 100000 (aggregate available 1)"
            - "a sell order for quantity 2 placed against the product"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B5", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 1, acquisition_unit_cost_cents: 100000 }
              as: Trader
            - call: "POST /api/customers"
              payload: { full_name: "Overreach Buyer" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2 }
              as: SalesAgent
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders/${so_id}/settle"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the settle response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "SellOrder.${so_id}.status == PLACED"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sell_settle_depends_on_ira_account_active
        grounds:
          - validations[priority=8]
          - state_machines.SellOrder.PLACED_to_SETTLED
          - state_machines.IRAAccount.PENDING_to_ACTIVE
          - errors[ERR_IRA_NOT_ACTIVE]
        distinguishing_aspect: |
          SellOrder→IRAAccount pair: a PLACED IRA-allocation SellOrder cannot settle while its
          referenced IRAAccount is still PENDING; settle succeeds only after the IRAAccount reaches ACTIVE.
        test_recipe:
          setup:
            - "GOLD spot 200000; IRA-eligible BULLION product; a lot qty 5 @ 100000"
            - "a customer with id on file; an IRAAccount created (PENDING)"
            - "an IRA-allocation sell order for quantity 1 (PLACED)"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-IRA-2", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04, ira_eligible: true }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
            - call: "POST /api/customers"
              payload: { full_name: "IRA Owner Two", id_document_on_file: true }
              as: ComplianceOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /api/ira-accounts"
              payload: { customer_id: "${cust_id}", custodian_name: "Vault Trust", custodian_account_ref: "VT-9" }
              as: ComplianceOfficer
              captures: { ira_id: $.data.id }
            - call: "POST /api/sell-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1, ira_account_id: "${ira_id}" }
              as: SalesAgent
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /api/sell-orders/${so_id}/settle"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the settle response error_id == ERR_IRA_NOT_ACTIVE"
            - "SellOrder.${so_id}.status == PLACED"

      - name: consignment_list_depends_on_session_scheduled
        grounds:
          - validations[priority=14]
          - state_machines.Consignment.INTAKE_to_LISTED
          - state_machines.AuctionSession.SCHEDULED_to_CLOSED
          - errors[ERR_SESSION_NOT_SCHEDULED]
        distinguishing_aspect: |
          Consignment→AuctionSession pair (different pair from SellOrder→IRAAccount): an INTAKE
          consignment cannot be listed into an AuctionSession that has been CLOSED; listing requires SCHEDULED.
        test_recipe:
          setup:
            - "a consignor; an auction session that is then CLOSED"
            - "a consignment in INTAKE"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Consignor Four" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-D", scheduled_start: "2026-04-04T10:00:00Z", scheduled_end: "2026-04-04T12:00:00Z" }
              as: SalesAgent
              captures: { sess_id: $.data.id }
            - call: "POST /api/auction-sessions/${sess_id}/close"
              payload: {}
              as: SalesAgent
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Platinum bar", reserve_price_cents: 50000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /api/consignments/${cons_id}/list"
              payload: { auction_session_id: "${sess_id}" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the list response error_id == ERR_SESSION_NOT_SCHEDULED"
            - "Consignment.${cons_id}.status == INTAKE"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auction_room_half_open_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.AuctionSession.fields.room
        distinguishing_aspect: |
          Half-open [start, end) semantics on AuctionSession.room: a session 11:00–13:00 overlapping
          an existing 10:00–12:00 in the same room is rejected, but a session starting exactly at 12:00
          (touching end==start) is allowed. Adjacency touching is NOT a collision here.
        test_recipe:
          setup:
            - "an existing SCHEDULED session in ROOM-X from 10:00 to 12:00"
          setup_api_calls:
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-X", scheduled_start: "2026-04-05T10:00:00Z", scheduled_end: "2026-04-05T12:00:00Z" }
              as: SalesAgent
          trigger:
            - call: "POST /api/auction-sessions"
              payload: { room: "ROOM-X", scheduled_start: "2026-04-05T11:00:00Z", scheduled_end: "2026-04-05T13:00:00Z" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the second create response error_id == ERR_ROOM_DOUBLE_BOOKED"

      - name: appraiser_closed_interval_adjacency_collision
        grounds:
          - validations[priority=13]
          - errors[ERR_APPRAISER_DOUBLE_BOOKED]
          - entities.AppraisalAppointment.fields.appraiser_id
        distinguishing_aspect: |
          CLOSED [start, end] semantics on AppraisalAppointment.appraiser_id (different resource, different
          interval arithmetic from the half-open room rule): an appointment starting exactly at the previous
          one's end (12:00 after 10:00–12:00) COLLIDES because endpoints are inclusive on both sides.
        test_recipe:
          setup:
            - "an appraiser; a consignment to appraise; an existing BOOKED appointment 10:00–12:00 for that appraiser"
            - "a second consignment for the touching appointment"
          setup_api_calls:
            - call: "POST /api/appraisers"
              payload: { name: "Grader Ann", specialty_metal: "GOLD" }
              as: SalesAgent
              captures: { appr_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Owner A" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Coin A", reserve_price_cents: 10000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons1_id: $.data.id }
            - call: "POST /api/consignments"
              payload: { customer_id: "${cust_id}", description: "Coin B", reserve_price_cents: 10000, commission_pct: 0.10, buyer_premium_pct: 0.05 }
              as: SalesAgent
              captures: { cons2_id: $.data.id }
            - call: "POST /api/appraisal-appointments"
              payload: { appraiser_id: "${appr_id}", consignment_id: "${cons1_id}", start_at: "2026-04-06T10:00:00Z", end_at: "2026-04-06T12:00:00Z" }
              as: SalesAgent
          trigger:
            - call: "POST /api/appraisal-appointments"
              payload: { appraiser_id: "${appr_id}", consignment_id: "${cons2_id}", start_at: "2026-04-06T12:00:00Z", end_at: "2026-04-06T13:00:00Z" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "the second appointment response error_id == ERR_APPRAISER_DOUBLE_BOOKED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: layaway_cancel_conserves_lot_total_qty
        grounds:
          - state_machines.Layaway.ACTIVE_to_CANCELLED
          - entities.InventoryLot.fields.available_qty
          - entities.InventoryLot.fields.reserved_qty
          - entities.InventoryLot.fields.sold_qty
          - entities.InventoryLot.fields.total_qty
        distinguishing_aspect: |
          Conserved quantity #1 = InventoryLot units: after opening a layaway (moves 2 units
          available→reserved) then cancelling it (moves them back), the invariant
          available_qty + reserved_qty + sold_qty == total_qty (10) holds with available_qty
          restored to its pre-layaway value.
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product; a lot total_qty 10 @ 100000"
            - "a customer; a layaway for quantity 2 (reserves 2 → available 8, reserved 2)"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B6", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 10, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Canceller" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id }
          trigger:
            - call: "POST /api/layaways/${lay_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Layaway.${lay_id}.status == CANCELLED"
            - "InventoryLot.${lot_id}.available_qty == 10"
            - "InventoryLot.${lot_id}.reserved_qty == 0"
            - "InventoryLot.${lot_id}.sold_qty == 0"

      - name: layaway_default_conserves_customer_value
        grounds:
          - state_machines.Layaway.ACTIVE_to_DEFAULTED
          - entities.Layaway.fields.amount_paid_cents
          - entities.Customer.fields.store_credit_cents
          - entities.InventoryLot.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity #2 = customer value (a different conserved type from inventory units):
          on default, every cent the customer paid in (amount_paid 150000) is conserved as
          store_credit_cents (150000), and the reserved units are released back to available.
        test_recipe:
          setup:
            - "GOLD spot 200000; BULLION product; a lot total_qty 5 @ 100000"
            - "a customer; a layaway for quantity 2 (total_price 420000) with a 150000 deposit applied"
          setup_api_calls:
            - call: "POST /api/spot-rates"
              payload: { metal: "GOLD", price_per_troy_oz_cents: 200000 }
              as: Trader
            - call: "POST /api/products"
              payload: { sku: "AU-1OZ-B7", product_type: "BULLION", metal: "GOLD", weight_troy_oz: 1.0, purity: 1.0, min_sell_spread_pct: 0.05, buy_spread_pct: 0.04 }
              as: Trader
              captures: { prod_id: $.data.id }
            - call: "POST /api/inventory-lots"
              payload: { product_id: "${prod_id}", total_qty: 5, acquisition_unit_cost_cents: 100000 }
              as: Trader
              captures: { lot_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Defaulter" }
              as: SalesAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/layaways"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", inventory_lot_id: "${lot_id}", quantity: 2 }
              as: SalesAgent
              captures: { lay_id: $.data.id, lay_v0: $.data.version }
            - call: "POST /api/layaways/${lay_id}/deposit"
              payload: { amount_cents: 150000, expected_layaway_version: "${lay_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/layaways/${lay_id}/default"
              payload: {}
              as: SalesAgent
          assert:
            - "Layaway.${lay_id}.status == DEFAULTED"
            - "Layaway.${lay_id}.amount_paid_cents == 150000"
            - "Customer.${cust_id}.store_credit_cents == 150000"
            - "InventoryLot.${lot_id}.available_qty == 5"
            - "InventoryLot.${lot_id}.reserved_qty == 0"
