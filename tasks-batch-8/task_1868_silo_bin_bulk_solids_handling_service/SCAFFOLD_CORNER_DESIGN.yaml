              payload: { site_id: "${spg}", vessel_id: "${vpg}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { tpg1: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${spg}", vessel_id: "${vpg}", job_type: "DIAGNOSIS", requires_entry: false, est_hours: 1, crew_size: 1 }
              as: ServiceManager
              captures: { tpg2: $.data.id }
          trigger:
            - call: "GET /service-tickets?limit=1&offset=0"
              payload: {}
              as: ServiceManager
            - call: "GET /service-tickets?limit=1&offset=1"
              payload: {}
              as: ServiceManager
          assert:
            - "page 1: data length 1, total_count == 2, has_more == true"
            - "page 2: data length 1, total_count == 2, has_more == false"
            - "the two pages return ${tpg1} and ${tpg2} with no overlap"

      - name: list_filter_returns_only_matching
        claim_type: listing
        grounds:
          - "endpoints GET /vessels"
        distinguishing_aspect: "GET /vessels?site_id filters to that site's vessels only; a second site's vessel is excluded."
        test_recipe:
          setup: ["Sites SF1 and SF2 each with one vessel."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "F1", state_code: "IA" }
              as: ServiceManager
              captures: { sf1: $.data.id }
            - call: "POST /sites"
              payload: { name: "F2", state_code: "IA" }
              as: ServiceManager
              captures: { sf2: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sf1}", name: "BIN-F1", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vf1: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sf2}", name: "BIN-F2", vessel_kind: "BIN", capacity_tons: 50, material_name: "sugar", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vf2: $.data.id }
          trigger:
            - call: "GET /vessels"
              payload: { site_id: "${sf1}" }
              as: ServiceManager
          assert:
            - "total_count == 1 and the only element id == ${vf1}"
            - "${vf2} is not present"

      - name: success_and_error_envelope_shape
        claim_type: retrieval
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp and response_type 'object'|'array'; error responses carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["One site exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "ENV Site", state_code: "IA" }
              as: ServiceManager
              captures: { senv: $.data.id }
          trigger:
            - call: "GET /sites/${senv}"
              payload: {}
              as: ServiceManager
            - call: "GET /sites/00000000-0000-0000-0000-000000000099"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data holds the site"
            - "error: response_type == 'error', data.error_id == ERR_SITE_NOT_FOUND, data.message present"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: capital_threshold_inclusive_boundary_routes_capital
        claim_type: constants_applied
        grounds:
          - "entities.CustomerSite.fields.capital_threshold_cents"
          - "entities.ServiceTicket.fields.commercial_track"
        distinguishing_aspect: "estimate_cents exactly equal to capital_threshold_cents routes CAPITAL_PROJECT (>= semantics): DIAGNOSIS 10 h x crew 2 on a FLOW_IMPAIRED vessel with multiplier 1.5 and discount 0 yields 285000 == threshold 285000."
        test_recipe:
          setup: ["Site with discount 0 and capital_threshold_cents 285000. Vessel FLOW_IMPAIRED via moisture report (15.0 > 12.0)."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "CAP Site", state_code: "IA", contract_discount_pct: 0, capital_threshold_cents: 285000 }
              as: ServiceManager
              captures: { scap: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${scap}", name: "SILO-CAP", vessel_kind: "SILO", capacity_tons: 100, material_name: "flour", reorder_point_pct: 30, moisture_limit_pct: 12.0 }
              as: ServiceManager
              captures: { vcap: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech CAP", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttcap: $.data.id }
            - call: "POST /quality-reports"
              payload: { vessel_id: "${vcap}", sampled_at: "2026-08-02T00:00:00Z", moisture_pct: 15.0, caking_index: 1 }
              as: Technician
              as_user_id: "${ttcap}"
          trigger:
            - call: "POST /service-tickets"
              payload: { site_id: "${scap}", vessel_id: "${vcap}", job_type: "DIAGNOSIS", requires_entry: false, est_hours: 10, crew_size: 2 }
              as: ServiceManager
              captures: { tcap: $.data.id, estcap: $.data.estimate_cents }
            - call: "POST /service-tickets/${tcap}/quote"
              payload: {}
              as: ServiceManager
              captures: { trackcap: $.data.commercial_track }
            - call: "POST /service-tickets/${tcap}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${scap}"
              captures: { errcap: $.data.error_id }
            - call: "POST /service-tickets/${tcap}/approve"
              payload: {}
              as: ServiceManager
          assert:
            - "estimate_cents == 285000 (9500 x 10 x 2 = 190000 x 1.5 FLOW_IMPAIRED; discount 0)"
            - "commercial_track == CAPITAL_PROJECT (285000 >= 285000, inclusive)"
            - "approve as PlantOperator is rejected: errcap == ERR_FORBIDDEN (capital track requires ServiceManager)"
            - "approve as ServiceManager then succeeds: ticket ${tcap} status == APPROVED"

      - name: estimate_emergency_multiplier_applies_on_impaired_vessel
        claim_type: correct_result
        grounds:
          - "calculations.service_estimate_cents"
        excluded_because:
          difficulty_instance: estimate_tiered_rate_crew_posture_discount
          rationale: "The multiplier branch is exercised with a literal in capital_threshold_inclusive_boundary_routes_capital; the NORMAL branch (mult 1.0) is asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: plant_operator_cannot_create_site_forbidden
        claim_type: rbac_denial
        grounds:
          - "roles ServiceManager.exclusive_operations"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /sites is ServiceManager-exclusive; PlantOperator gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Nope", state_code: "IA" }
              as: PlantOperator
              as_user_id: "00000000-0000-0000-0000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"

      - name: technician_cannot_quote_ticket_forbidden
        claim_type: rbac_denial
        grounds:
          - "roles ServiceManager.exclusive_operations"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /service-tickets/{id}/quote is ServiceManager-exclusive; Technician gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Site, vessel, technician; DRAFT ticket."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "RB Site", state_code: "IA" }
