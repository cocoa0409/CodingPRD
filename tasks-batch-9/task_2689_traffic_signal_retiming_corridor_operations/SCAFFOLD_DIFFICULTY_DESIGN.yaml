  # =============================================================================================
  # RULE 5 — priority_pair_validation_conflict
  # =============================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_gate_priority_40_beats_posture_gate_priority_55_rejected
        grounds:
          - validations[priority=40]
          - validations[priority=55]
          - errors.ERR_PLAN_NOT_SUBMITTED
          - errors.ERR_POSTURE_BLOCKS_CERTIFICATION
          - calculations.intersection_operational_posture
        distinguishing_aspect: |
          The SAME endpoint is fired twice against the SAME plan and the SAME intersection. Attempt 1
          violates both the priority-40 state gate (plan is COORDINATED, not SUBMITTED) and the
          priority-55 posture gate (detection_status FAILED => BLOCKED), and must surface
          ERR_PLAN_NOT_SUBMITTED. Attempt 2 repairs only the state gate, leaving the posture gate
          violated, and must surface ERR_POSTURE_BLOCKS_CERTIFICATION. An implementation that checks
          posture before state passes attempt 2 but fails attempt 1, so the pair pins the ordering
          rather than merely the existence of both errors.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection i1 starts READY (FULL detection, ONLINE comm) so that the coordinate pipeline can run."
            - "Project p1 on corridor c1 reaches PLAN_DEVELOPMENT and plan pl1 is COORDINATED (cycle 105, one PASS pedestrian check, ped_compliance_state COMPLIANT) but deliberately NOT submitted."
            - "i1 is then PATCHed to detection_status FAILED, driving operational_posture to BLOCKED."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, posture_ready: $.data.operational_posture }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FAILED" }
              as: SignalOpsAdmin
              captures: { posture_blocked: $.data.operational_posture }
          trigger:
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { err_both: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FULL" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_status_submitted: $.data.status }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FAILED" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { err_posture_only: $.data.error_id }
          assert:
            - "${posture_ready} == READY"
            - "${posture_blocked} == BLOCKED"
            - "attempt 1 (both gates violated) returns HTTP 409 with ${err_both} == ERR_PLAN_NOT_SUBMITTED, NOT ERR_POSTURE_BLOCKS_CERTIFICATION"
            - "${pl1_status_submitted} == SUBMITTED (submit is unaffected by posture; only certify carries the priority-55 gate)"
            - "attempt 2 (only the posture gate violated) returns HTTP 409 with ${err_posture_only} == ERR_POSTURE_BLOCKS_CERTIFICATION"
            - "TimingPlan.${pl1_id}.status == SUBMITTED after both failed attempts (no partial transition)"
            - "TimingPlan.${pl1_id}.certified_by_user_id == null"

      - name: advance_before_study_priority_60_beats_study_window_priority_65_rejected
        grounds:
          - validations[priority=60]
          - validations[priority=65]
          - errors.ERR_BEFORE_STUDY_INCOMPLETE
          - errors.ERR_STUDY_WINDOW_EXPIRED
          - state_machines.RetimingProject.DATA_COLLECTION_to_PLAN_DEVELOPMENT
        distinguishing_aspect: |
          A second, adjacent priority pair (60 vs 65) on a different endpoint, and this time the two
          rules are in different categories — business_referential (completeness of the collected data
          set) versus business_temporal (the study deadline). Both are violated on the first advance;
          only the temporal one is violated on the second. The naive implementation ordering
          "check the cheap date arithmetic first, then run the expensive completeness scan" produces
          ERR_STUDY_WINDOW_EXPIRED on attempt 1 and fails this instance.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z; it is never moved."
            - "Corridor c1 is SELECTED with a single READY member i1."
            - "Project p1 is created with study_window_start_at 2026-01-01T00:00:00Z and study_window_days 30, so its deadline (2026-01-31T00:00:00Z) is already long past."
            - "p1 has NO TurningMovementCount and NO TravelTimeRun at the moment of the first advance."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-01-01T00:00:00Z", study_window_days: 30, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id, p1_status_initial: $.data.status }
          trigger:
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_both: $.data.error_id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-01-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-01-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_window_only: $.data.error_id }
          assert:
            - "${p1_status_initial} == DATA_COLLECTION"
            - "attempt 1 (both rules violated) returns HTTP 409 with ${err_both} == ERR_BEFORE_STUDY_INCOMPLETE, NOT ERR_STUDY_WINDOW_EXPIRED"
            - "attempt 2 (only the temporal rule violated) returns HTTP 409 with ${err_window_only} == ERR_STUDY_WINDOW_EXPIRED"
            - "RetimingProject.${p1_id}.status == DATA_COLLECTION after both attempts"
            - "GET /signal-ops/retiming-projects/${p1_id}/turning-movement-counts returns exactly 1 row with study_role == BEFORE"
            - "GET /signal-ops/retiming-projects/${p1_id}/travel-time-runs returns exactly 1 row with study_role == BEFORE"
            - "the priority-40 state gate is satisfied throughout (the project really is in DATA_COLLECTION), so neither ERR_PROJECT_NOT_IN_DATA_COLLECTION nor any 4XX other than 409 may appear"

  # =============================================================================================
  # RULE 6 — boundary_precision_check
  # =============================================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pedestrian_clearance_tenth_of_a_second_equality_passes_one_tenth_below_fails
        grounds:
          - calculations.pedestrian_clearance_requirement
          - entities.PedestrianComplianceCheck.fields.result
          - entities.PedestrianComplianceCheck.fields.failure_reason
          - state_machines.TimingPlan.ped_compliance_axis
          - validations[priority=57]
        distinguishing_aspect: |
          METRIC 1 of 3 — a one-decimal-place ceiling threshold with >= semantics, reached through
          POST /signal-ops/retiming-projects/{id}/coordinate. 62.0 ft / 3.5 fps = 17.714285... which
          MUST ceil UP to 17.8, not round to 17.7 and not truncate to 17.7. Two pedestrian phases in
          the SAME plan then straddle that value by exactly one tenth: phase 4 provides 17.8 (equality,
          PASS) and phase 6 provides 17.7 (one tenth short, FAIL). An implementation that rounds
          instead of ceilings makes phase 6 pass; one that uses > instead of >= makes phase 4 fail.
          The FAIL is additionally pinned to failure_reason PED_CLEAR_SHORT even though phase 6's
          effective split (27) comfortably exceeds its required_phase_length_sec (25.8), which pins the
          sub-check ORDER as well as the boundary.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection i1 is STD_3_5_FPS with aps_installed false, so walking_speed_fps 3.5 and MIN_WALK_STD_SEC 4.0 apply."
            - "Project p1 reaches PLAN_DEVELOPMENT with a BEFORE count of phase_volumes {1:350, 2:500, 4:250, 6:180} (recommended cycle 105) and a BEFORE run."
            - "Plan pl1 is drafted at cycle 90 with splits {1:21, 2:21, 4:22, 6:22}; phases 4 AND 6 are both pedestrian phases with crosswalk_length_ft 62.0 and walk_sec 4.0, differing only in ped_clear_sec (17.8 vs 17.7)."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.7, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
