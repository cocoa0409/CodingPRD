- rule_id: resource_temporal_overlap
  instances:
  - name: ceremony_half_open_overlap_adjacency
    grounds:
    - validations[priority=11]
    - entities.Ceremony.fields.starts_at
    - entities.Ceremony.fields.ends_at
    distinguishing_aspect: 'Half-open interval semantics on Ceremony: a second ceremony [21:00, 23:00) touching the first''s end is accepted (adjacency is not overlap),
      while [20:59:59, 23:00) is rejected with ERR_CEREMONY_OVERLAP — interval geometry distinct from the buffered-gap sibling rule on ScoringRound.'
    test_recipe:
      setup:
      - Season with one PLANNING ceremony occupying [2026-10-01T19:00:00Z, 2026-10-01T21:00:00Z).
      setup_api_calls:
      - call: POST /awards/_clock/set_current_utc
        as: ProgramAdmin
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
