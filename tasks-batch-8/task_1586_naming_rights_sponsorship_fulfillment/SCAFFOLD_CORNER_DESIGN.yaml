            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d1_id: $.data.id } }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 4 }, as: ActivationManager, captures: { d2_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d1_id}", units_claimed: 7, evidence_uri: "s3://pop/d1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e1_id: $.data.id } }
