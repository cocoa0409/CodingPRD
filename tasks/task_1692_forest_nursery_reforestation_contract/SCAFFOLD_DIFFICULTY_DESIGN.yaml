            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 20000, placed_on: "2027-03-13" }, as: NurseryManager, captures: { p3: $.data.id } }
