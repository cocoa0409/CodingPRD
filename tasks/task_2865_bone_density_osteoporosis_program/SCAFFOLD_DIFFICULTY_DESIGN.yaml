  - rule_id: resource_temporal_overlap
    instances:
      - name: device_buffer_rejects_slots_inside_the_gap_but_admits_exact_adjacency
        grounds:
          - validations[priority=58]
          - errors[ERR_DEVICE_SLOT_CONFLICT]
          - entities.Densitometer.fields.appointment_buffer_minutes
          - entities.ScanAppointment.fields.slot_index
          - endpoints["POST /bone-density/scan-appointments"]
        distinguishing_aspect: |
          The device declares appointment_buffer_minutes 15 and the incumbent slot is 09:00-09:30, so
          the occupied region is effectively 08:45-09:45 on both sides. A request for 09:40-10:10 does
          not overlap the raw interval at all yet must be refused, and 09:45-10:15 touches the padded
          edge exactly and must be accepted, because the test is strict inequality on both halves of
          new.start < existing.end + buffer AND existing.start < new.end + buffer. The leading edge is
          probed the same way: 08:30-09:00 abuts the raw interval and must be refused, while
          08:15-08:45 sits exactly one buffer clear and must be accepted. Each probe uses a different
          patient so the same-day patient rule never fires, and the accepted early slot proves
          slot_index is a true derived field: the incumbent 09:00 slot moves from 1 to 2.
        test_recipe:
          setup:
            - "One ACTIVE Densitometer with appointment_buffer_minutes 15 and daily_scan_capacity 12."
            - "Three patients MRN-2001, MRN-2002, MRN-2003, each with one REQUESTED BASELINE_SCREENING order for 2026-03-10."
            - "Patient 1's order is already booked at 2026-03-10T09:00:00Z-09:30:00Z, slot_index 1."
