            - call: "POST /claims/${claim_j_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_j_id}/reprice"
              payload: { expected_claim_version: "${claim_j_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
