        claim_type: correct_result
        grounds: ["calculations.stock_cut_allocation", "entities.StockReservation.fields.scrap_charge_cents", "entities.InventoryItem.fields.status"]
        distinguishing_aspect: "Post-cut remainder of exactly min_remnant_mm (300) keeps the piece AVAILABLE; one millimetre less (299) depletes it and charges 299 x 42 = 12558 cents of scrap to the job."
        test_recipe:
          setup: ["shop; customer; cylinder; INTAKE work order; two 800mm rod pieces @42c/mm"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
