  - rule_id: compensating_invariant
    instances:
      - name: sale_reversal_returns_the_ledger_to_its_pre_sale_balance
        conserved_quantity: "money - Consignor.unclaimed_balance_cents, and the requirement that SALE_CREDIT + SALE_REVERSAL_DEBIT sum to exactly 0 for a given sale"
        grounds:
          - endpoints[POST /sales/{id}/reverse]
          - calculations.consignor_split
          - entities.PayoutLedgerEntry.fields.amount_cents
          - entities.PayoutLedgerEntry.fields.balance_after_cents
          - state_machines.Sale
          - state_machines.DeliveryOrder
        distinguishing_aspect: |
          The conserved quantity is money: the reversal must mint exactly
          -consignor_share_cents, never a recomputed split (the item's markdown_sequence
          could have moved in the meantime) and never a rounded percentage of the sale price,
          so the credit and the debit cancel to the cent and the balance lands back on the
          pre-sale -44000. The compensation is also partial by design: lifetime_credits_cents
