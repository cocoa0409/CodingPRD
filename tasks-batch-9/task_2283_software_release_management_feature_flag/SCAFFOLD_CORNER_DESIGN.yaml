            - "CR_L (40 lines, 1 subsystem, INTERNAL -> 9 LOW, customer_facing with a summary) is submitted and merged at 2026-08-01T00:00:00Z."
            - "Clock advanced to 2026-08-08T00:00:00Z and the release cut, which defers CR_M."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Retry policy rewrite", summary_internal: "internal M", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT", customer_facing: true, summary_customer_facing: "Fewer transient failures" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_m: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Faster checkout", summary_internal: "internal L", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL", customer_facing: true, summary_customer_facing: "Checkout is now faster" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: $.data.id }
            - call: "POST /change-requests/${cr_m}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
