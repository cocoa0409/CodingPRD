# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pass_fee_estimated_vs_final
        grounds:
          - calculations.pass_fee
          - entities.Pass.fields.estimated_fee_cents
          - entities.Pass.fields.final_fee_cents
          - state_machines.Pass.OFFSITE_to_ONSITE
          - state_machines.Pass.ONSITE_to_DEPARTED
        distinguishing_aspect: "pass_fee lives on the Pass domain; the estimated variant (planned window, no overstay) yields 2000 while the final variant (actual dwell + overstay) yields 5500 for the same pass."
        test_recipe:
          setup:
            - "Community + logical clock at 2026-06-01T08:00:00Z"
            - "Resident (ACTIVE, GOOD) sponsors a VENDOR pass with window [2026-06-01T09:00:00Z, 2026-06-01T13:00:00Z)"
            - "Pass authorized APPROVED -> estimated_fee_cents = ceil(4h)*500 = 2000"
            - "ENTRY gate read at 10:00 puts the pass ONSITE (entry_at=10:00)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest", timezone: "UTC" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Rita Owner", email: "rita@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "VENDOR", visitor_name: "Ace Plumbing", visitor_plate: "VEND01", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T13:00:00Z", vendor_company: "Ace" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/gate-events"
              payload: { community_id: "${comm_id}", gate_id: "G1", direction: "ENTRY", plate_read: "VEND01" }
              as: SecurityOfficer
          trigger:
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:30:00Z" }
              as: CommunityAdmin
            - call: "POST /access/gate-events"
              payload: { community_id: "${comm_id}", gate_id: "G1", direction: "EXIT", plate_read: "VEND01" }
              as: SecurityOfficer
          assert:
            - "Pass.${pass_id}.estimated_fee_cents == 2000"
            - "Pass.${pass_id}.final_fee_cents == 5500"
            - "Pass.${pass_id}.estimated_fee_cents != Pass.${pass_id}.final_fee_cents"
            - "Pass.${pass_id}.presence_status == DEPARTED"

      - name: amenity_settlement_quoted_vs_settled
        grounds:
          - calculations.amenity_settlement
          - entities.AmenityReservation.fields.quoted_fee_cents
          - entities.AmenityReservation.fields.settled_fee_cents
          - state_machines.AmenityReservation.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "amenity_settlement lives on the AmenityReservation/Amenity domain (distinct entity domain from pass_fee); quoted at booking = 7000 (planned 2h + deposit) while settled at checkout = 4000 (2h base + 1h overage, deposit released)."
        test_recipe:
          setup:
            - "Community + clock at 2026-06-02T08:00:00Z"
            - "Amenity POOL capacity 10, hourly_fee_cents 1000, deposit_cents 5000"
            - "Reservation window [10:00,12:00) party 2 -> quoted_fee_cents = ceil(2h)*1000 + 5000 = 7000"
            - "Check-in at 10:00"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Rita Owner", email: "rita@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Main Pool", amenity_type: "POOL", capacity: 10, hourly_fee_cents: 1000, deposit_cents: 5000, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-02T10:00:00Z", end_at: "2026-06-02T12:00:00Z", party_size: 2 }
              as: CommunityAdmin
              captures: { resv_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/amenity-reservations/${resv_id}/transition"
              payload: { to_status: "CHECKED_IN" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T13:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/amenity-reservations/${resv_id}/transition"
              payload: { to_status: "COMPLETED" }
              as: CommunityAdmin
          assert:
            - "AmenityReservation.${resv_id}.quoted_fee_cents == 7000"
            - "AmenityReservation.${resv_id}.settled_fee_cents == 4000"
            - "AmenityReservation.${resv_id}.quoted_fee_cents != AmenityReservation.${resv_id}.settled_fee_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: violation_fine_tiered_multiplier
        grounds:
          - calculations.violation_fine
          - entities.Violation.fields.assessed_fine_cents
          - entities.Violation.fields.repeat_index
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: assessed = min(FINE_CAP, round_half_up(base * tier_multiplier(repeat_index)) + standing_surcharge). A second SPEEDING citation (repeat_index=1, tier 1.5) yields 15000 from base 10000."
        test_recipe:
          setup:
            - "Community + resident (GOOD)"
            - "One prior SPEEDING violation (base 10000, repeat_index 0 -> assessed 10000, balance 10000, still GOOD)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Sam Speeder", email: "sam@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "SPEEDING", base_fine_cents: 10000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "SPEEDING", base_fine_cents: 10000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v2_id: $.data.id }
          assert:
            - "Violation.${v2_id}.repeat_index == 1"
            - "Violation.${v2_id}.assessed_fine_cents == 15000"

      - name: late_fee_per_line_rounding_order
        grounds:
          - calculations.resident_balance_and_late_fee
          - entities.Resident.fields.outstanding_balance_cents
        distinguishing_aspect: "Mode (b) rounding order: accrued_late_fee_cents rounds LATE_FEE_PCT per violation line then sums (150+226=376); sum-then-round would give 377. The scaffold pins per-line rounding."
        test_recipe:
          setup:
            - "Community + resident"
            - "Two open ISSUED violations of different types (base 10033 NOISE, base 15077 PARKING; both repeat_index 0, assessed == base)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Lena Line", email: "lena@x.com", resident_type: "TENANT" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "NOISE", base_fine_cents: 10033 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v1_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "PARKING", base_fine_cents: 15077 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v2_id: $.data.id }
          trigger:
            - call: "GET /access/residents/${res_id}/statement"
              payload: {}
              as: CommunityAdmin
              captures: { late_fee: $.data.accrued_late_fee_cents }
          assert:
            - "statement.accrued_late_fee_cents == 376"
            - "statement.accrued_late_fee_cents != 377"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pass_parallel_auth_and_presence_axes
        grounds:
          - state_machines.Pass.APPROVED_to_REVOKED
          - state_machines.Pass.OFFSITE_to_ONSITE
          - entities.Pass.fields.auth_status
          - entities.Pass.fields.presence_status
        distinguishing_aspect: "Pass carries two independent state axes: revoking the auth axis (APPROVED->REVOKED) leaves the presence axis (ONSITE) untouched, proving the axes evolve independently on one entity."
        test_recipe:
          setup:
            - "Community + clock 2026-06-01T09:00:00Z + resident"
            - "GUEST pass window [08:00,18:00) authorized APPROVED"
            - "ENTRY gate read at 10:00 -> presence ONSITE"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Gus Guest", email: "gus@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Vera Visitor", visitor_plate: "GUEST7", valid_from: "2026-06-01T08:00:00Z", valid_until: "2026-06-01T18:00:00Z" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/gate-events"
              payload: { community_id: "${comm_id}", gate_id: "G1", direction: "ENTRY", plate_read: "GUEST7" }
              as: SecurityOfficer
          trigger:
            - call: "POST /access/passes/${pass_id}/revoke"
              payload: {}
              as: SecurityOfficer
          assert:
            - "Pass.${pass_id}.auth_status == REVOKED"
            - "Pass.${pass_id}.presence_status == ONSITE"

      - name: violation_cyclic_appeal_withdraw_loop
        grounds:
          - state_machines.Violation.ISSUED_to_APPEALED
          - state_machines.Violation.APPEALED_to_ISSUED
        distinguishing_aspect: "Violation is cyclic on a different entity than Pass: ISSUED->APPEALED->ISSUED returns to the same state after an appeal is withdrawn, a genuine loop (not a linear pipeline)."
        test_recipe:
          setup:
            - "Community + resident + one ISSUED violation"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Cy Cyclic", email: "cy@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "PARKING", base_fine_cents: 8000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /access/violations/${v_id}/appeal"
              payload: { reason: "Was parked legally" }
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /access/violations/${v_id}/withdraw-appeal"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          assert:
            - "Violation.${v_id}.status == ISSUED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: delinquency_suspend_cancels_reservations_depth3
        grounds:
          - state_machines.Violation.ISSUED_to_APPEALED
          - calculations.resident_standing
          - state_machines.Resident.ACTIVE_to_SUSPENDED
          - state_machines.AmenityReservation.BOOKED_to_CANCELLED
        distinguishing_aspect: "Origin transition = Violation issuance. Depth-3 chain: issuing the violation recomputes outstanding_balance_cents (25000>=threshold) -> standing DELINQUENT -> resident auto-SUSPENDED -> the resident's BOOKED reservation is CANCELLED (each hop caused by the prior)."
        test_recipe:
          setup:
            - "Community + clock 2026-06-03T08:00:00Z + resident (GOOD, balance 0)"
            - "Amenity POOL cap 10; the resident holds a BOOKED reservation for a future window [2026-06-05T10:00,12:00)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Dee Delinquent", email: "dee@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Main Pool", amenity_type: "POOL", capacity: 10, hourly_fee_cents: 1000, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-05T10:00:00Z", end_at: "2026-06-05T12:00:00Z", party_size: 2 }
              as: CommunityAdmin
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "GATE_TAILGATING", base_fine_cents: 25000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
          assert:
            - "Resident.${res_id}.standing == DELINQUENT"
            - "Resident.${res_id}.status == SUSPENDED"
            - "AmenityReservation.${resv_id}.status == CANCELLED"

      - name: moveout_vehicle_decal_cascade_depth2
        grounds:
          - state_machines.Resident.ACTIVE_to_MOVED_OUT
          - state_machines.Vehicle.ACTIVE_to_INACTIVE
          - state_machines.Decal.ACTIVE_to_REVOKED
        distinguishing_aspect: "Origin transition = Resident MOVED_OUT (different trigger than the delinquency cascade). Depth-2 chain: Resident MOVED_OUT -> Vehicle INACTIVE -> that Vehicle's ACTIVE Decal REVOKED."
        test_recipe:
          setup:
            - "Community + resident + ACTIVE vehicle + ACTIVE decal on that vehicle"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Moe Mover", email: "moe@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/vehicles"
              payload: { resident_id: "${res_id}", plate: "CAR001", plate_state: "CA" }
              as: CommunityAdmin
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "RESIDENT", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: CommunityAdmin
              captures: { decal_id: $.data.id }
          trigger:
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "MOVED_OUT" }
              as: CommunityAdmin
          assert:
            - "Resident.${res_id}.status == MOVED_OUT"
            - "Vehicle.${veh_id}.status == INACTIVE"
            - "Decal.${decal_id}.status == REVOKED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reservation_checkin
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.AmenityReservation.BOOKED_to_CHECKED_IN
        distinguishing_aspect: "Dual failure on check-in: reservation is CANCELLED (state, priority 6) AND the amenity is at capacity (business_fiscal, priority 9). The state error ERR_INVALID_STATE wins over ERR_AMENITY_AT_CAPACITY."
        test_recipe:
          setup:
            - "Community + clock 2026-06-04T08:00:00Z + resident"
            - "Amenity cap 2. Reserve R2 (party 1) then CANCEL it. Reserve R1 (party 2, same window [10:00,12:00)) filling capacity."
            - "Clock moved to 10:30 (inside R2 window)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Cara Capacity", email: "cara@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Sauna", amenity_type: "CLUBHOUSE", capacity: 2, hourly_fee_cents: 500, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-04T10:00:00Z", end_at: "2026-06-04T12:00:00Z", party_size: 1 }
              as: CommunityAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /access/amenity-reservations/${r2_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: CommunityAdmin
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-04T10:00:00Z", end_at: "2026-06-04T12:00:00Z", party_size: 2 }
              as: CommunityAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T10:30:00Z" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/amenity-reservations/${r2_id}/transition"
              payload: { to_status: "CHECKED_IN" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: referential_beats_temporal_on_pass_authorize
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Pass.PENDING_to_APPROVED
        distinguishing_aspect: "Dual failure on authorize: sponsor Resident is SUSPENDED (business_referential, priority 7) AND the pass window is already past (business_temporal, priority 8). ERR_SPONSOR_NOT_ELIGIBLE wins over ERR_PASS_WINDOW_INVALID."
        test_recipe:
          setup:
            - "Community + clock 2026-06-01T08:00:00Z + resident"
            - "Pass created with window [2026-06-01T09:00,13:00); resident then admin-SUSPENDED; clock advanced to 2026-06-02T00:00:00Z (window now past)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Perry Past", email: "perry@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Late Larry", visitor_plate: "LATE01", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T13:00:00Z" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "SUSPENDED" }
              as: CommunityAdmin
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_SPONSOR_NOT_ELIGIBLE"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_threshold_inclusive_boundary
        grounds:
          - calculations.resident_standing
          - entities.Resident.fields.standing
          - entities.Resident.fields.outstanding_balance_cents
        distinguishing_aspect: "Metric = money threshold on POST /access/violations: balance exactly DELINQUENCY_THRESHOLD_CENTS (25000) flips standing to DELINQUENT (>= is inclusive) while 24999 stays GOOD."
        test_recipe:
          setup:
            - "Community + resident A (will reach 25000) + resident B (will reach 24999)"
            - "Resident B issued a single fine base 24999 (assessed 24999) -> standing GOOD"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Ann AtThreshold", email: "ann@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { resA_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Ben BelowThreshold", email: "ben@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { resB_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${resB_id}", violation_type: "PARKING", base_fine_cents: 24999 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { vB_id: $.data.id }
          trigger:
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${resA_id}", violation_type: "PARKING", base_fine_cents: 25000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { vA_id: $.data.id }
          assert:
            - "Resident.${resA_id}.outstanding_balance_cents == 25000"
            - "Resident.${resA_id}.standing == DELINQUENT"
            - "Resident.${resB_id}.outstanding_balance_cents == 24999"
            - "Resident.${resB_id}.standing == GOOD"

      - name: pass_window_half_open_at_gate_boundary
        grounds:
          - state_machines.Pass.OFFSITE_to_ONSITE
          - entities.GateEvent.fields.decision
          - entities.Pass.fields.presence_status
        distinguishing_aspect: "Metric = time boundary on POST /access/gate-events (distinct endpoint from the money boundary): ENTRY at event_at == valid_until (13:00) is DENIED (upper bound exclusive), while ENTRY at event_at == valid_from (09:00) is ALLOWED (lower bound inclusive)."
        test_recipe:
          setup:
            - "Community + clock 2026-06-01T08:00:00Z + resident"
            - "Pass A (plate GATEIN) and Pass B (plate GATEUP), each window [09:00,13:00), both APPROVED"
            - "Clock 09:00; ENTRY read GATEIN -> ALLOW, Pass A ONSITE (lower bound inclusive)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Hank HalfOpen", email: "hank@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Lower Bound", visitor_plate: "GATEIN", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T13:00:00Z" }
              as: CommunityAdmin
              captures: { passA_id: $.data.id }
            - call: "POST /access/passes/${passA_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Upper Bound", visitor_plate: "GATEUP", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T13:00:00Z" }
              as: CommunityAdmin
              captures: { passB_id: $.data.id }
            - call: "POST /access/passes/${passB_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/gate-events"
              payload: { community_id: "${comm_id}", gate_id: "G1", direction: "ENTRY", plate_read: "GATEIN" }
              as: SecurityOfficer
              captures: { in_decision: $.data.decision }
          trigger:
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T13:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/gate-events"
              payload: { community_id: "${comm_id}", gate_id: "G1", direction: "ENTRY", plate_read: "GATEUP" }
              as: SecurityOfficer
              captures: { up_decision: $.data.decision }
          assert:
            - "setup GATEIN gate-event decision == ALLOW"
            - "Pass.${passA_id}.presence_status == ONSITE"
            - "trigger GATEUP gate-event decision == DENY"
            - "Pass.${passB_id}.presence_status == OFFSITE"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pass_authorize_depends_on_sponsor_resident_state
        grounds:
          - state_machines.Pass.PENDING_to_APPROVED
          - entities.Resident.fields.status
          - validations[priority=7]
        distinguishing_aspect: "Entity pair Pass->Resident: a PENDING pass cannot be APPROVED when its sponsor Resident.status is SUSPENDED (window otherwise valid), yielding ERR_SPONSOR_NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "Community + clock 2026-06-01T08:00:00Z + resident, then admin-SUSPENDED"
            - "Pass window [09:00,18:00) still valid at clock 08:00 (only the referential gate fails)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Sue Suspended", email: "sue@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Blocked Bob", visitor_plate: "BLK001", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T18:00:00Z" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "SUSPENDED" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_SPONSOR_NOT_ELIGIBLE"
            - "Pass.${pass_id}.auth_status == PENDING"

      - name: decal_issue_depends_on_vehicle_state
        grounds:
          - entities.Vehicle.fields.status
          - state_machines.Vehicle.ACTIVE_to_INACTIVE
          - validations[priority=7]
        distinguishing_aspect: "Entity pair Decal->Vehicle (different pair than Pass->Resident): a Decal cannot be issued when the target Vehicle.status is INACTIVE, yielding ERR_VEHICLE_INACTIVE."
        test_recipe:
          setup:
            - "Community + resident + vehicle, then vehicle transitioned to INACTIVE (version bumps)"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Ivan Inactive", email: "ivan@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/vehicles"
              payload: { resident_id: "${res_id}", plate: "OLD999", plate_state: "CA" }
              as: CommunityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /access/vehicles/${veh_id}/transition"
              payload: { to_status: "INACTIVE" }
              as: CommunityAdmin
              captures: { veh_v: $.data.version }
          trigger:
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "RESIDENT", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_VEHICLE_INACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: amenity_reservation_capacity_overlap_half_open
        grounds:
          - calculations.amenity_concurrent_load
          - state_machines.AmenityReservation.BOOKED_to_CHECKED_IN
          - entities.Amenity.fields.capacity
        distinguishing_aspect: "Resource = Amenity, half-open aggregate-capacity semantics: an adjacent reservation (starts exactly at another's end_at) is allowed, but a truly overlapping reservation whose summed party_size exceeds capacity is rejected with ERR_AMENITY_AT_CAPACITY."
        test_recipe:
          setup:
            - "Community + clock 2026-06-06T08:00:00Z + resident"
            - "Amenity cap 2. R1 party 2 window [10:00,12:00) BOOKED. R3 party 2 window [12:00,14:00) BOOKED (adjacent, allowed)."
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Tim Tennis", email: "tim@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Court 1", amenity_type: "TENNIS", capacity: 2, hourly_fee_cents: 500, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-06T10:00:00Z", end_at: "2026-06-06T12:00:00Z", party_size: 2 }
              as: CommunityAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-06T12:00:00Z", end_at: "2026-06-06T14:00:00Z", party_size: 2 }
              as: CommunityAdmin
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-06T11:00:00Z", end_at: "2026-06-06T13:00:00Z", party_size: 1 }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "AmenityReservation.${r1_id}.status == BOOKED"
            - "AmenityReservation.${r3_id}.status == BOOKED"
            - "trigger error envelope error_id == ERR_AMENITY_AT_CAPACITY"

      - name: patrol_officer_buffer_overlap_closed
        grounds:
          - calculations.patrol_shift_overlap
          - entities.Patrol.fields.officer_id
          - entities.Patrol.fields.start_at
        distinguishing_aspect: "Resource = Patrol keyed by officer_id, closed-interval + buffer semantics (distinct from Amenity's half-open aggregate): a shift 60 min after another (== PATROL_BUFFER_MINUTES) is allowed, but a shift only 30 min after is rejected with ERR_PATROL_OVERLAP."
        test_recipe:
          setup:
            - "Community. Officer off-1 has P1 [08:00,12:00] and P3 [13:00,17:00] (60-min gap from P1, allowed)."
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/patrols"
              payload: { community_id: "${comm_id}", officer_id: "off-1", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T12:00:00Z", route: "North" }
              as: SecurityOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /access/patrols"
              payload: { community_id: "${comm_id}", officer_id: "off-1", start_at: "2026-06-01T13:00:00Z", end_at: "2026-06-01T17:00:00Z", route: "South" }
              as: SecurityOfficer
              captures: { p3_id: $.data.id }
          trigger:
            - call: "POST /access/patrols"
              payload: { community_id: "${comm_id}", officer_id: "off-1", start_at: "2026-06-01T12:30:00Z", end_at: "2026-06-01T12:50:00Z", route: "Gap" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Patrol.${p1_id}.status == SCHEDULED"
            - "Patrol.${p3_id}.status == SCHEDULED"
            - "trigger error envelope error_id == ERR_PATROL_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: amenity_slot_conservation_book_then_cancel
        grounds:
          - calculations.amenity_concurrent_load
          - state_machines.AmenityReservation.BOOKED_to_CANCELLED
          - entities.Amenity.fields.capacity
        distinguishing_aspect: "Conserved quantity = amenity concurrent slot capacity. Booking a full-capacity reservation (party 5 on cap 5) then CANCELLING it leaves the peak concurrent committed party_size at 0, so a fresh full-capacity booking for the same window succeeds."
        test_recipe:
          setup:
            - "Community + clock 2026-06-07T08:00:00Z + resident"
            - "Amenity cap 5. R1 party 5 window [10:00,12:00) BOOKED, then CANCELLED."
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Sal Slots", email: "sal@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Clubhouse", amenity_type: "CLUBHOUSE", capacity: 5, hourly_fee_cents: 0, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-07T10:00:00Z", end_at: "2026-06-07T12:00:00Z", party_size: 5 }
              as: CommunityAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /access/amenity-reservations/${r1_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-07T10:00:00Z", end_at: "2026-06-07T12:00:00Z", party_size: 5 }
              as: CommunityAdmin
              captures: { r2_id: $.data.id }
          assert:
            - "AmenityReservation.${r1_id}.status == CANCELLED"
            - "AmenityReservation.${r2_id}.status == BOOKED"
            - "AmenityReservation.${r2_id}.party_size == 5"

      - name: resident_balance_conservation_issue_then_dismiss
        grounds:
          - calculations.resident_balance_and_late_fee
          - state_machines.Violation.ISSUED_to_APPEALED
          - state_machines.Violation.APPEALED_to_DISMISSED
          - entities.Resident.fields.outstanding_balance_cents
        distinguishing_aspect: "Conserved quantity = resident ledger balance (money, distinct from slot capacity). Issuing a fine (+12000) then appealing and DISMISSING it (-12000) returns outstanding_balance_cents exactly to its pre-issue value of 0."
        test_recipe:
          setup:
            - "Community + resident (balance 0)"
            - "One violation base 12000 issued (by off-1), then appealed by the resident"
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Nora Neutral", email: "nora@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "NOISE", base_fine_cents: 12000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
            - call: "POST /access/violations/${v_id}/appeal"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /access/violations/${v_id}/resolve"
              payload: { resolution: "DISMISSED" }
              as: CommunityAdmin
              as_user_id: "admin-9"
          assert:
            - "Violation.${v_id}.status == DISMISSED"
            - "Resident.${res_id}.outstanding_balance_cents == 0"
            - "Resident.${res_id}.standing == GOOD"
