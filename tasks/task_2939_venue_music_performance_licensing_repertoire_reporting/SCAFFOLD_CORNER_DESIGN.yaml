            - "GET /licensing/licenses?renewal_of_license_id=${lic1_id} still returns exactly one row"
            - "License.${lic2_id} is still PENDING_ACTIVATION with term_start 2027-08-01T00:00:00Z and term_end 2028-08-01T00:00:00Z"

      - name: corner_validation_approve_without_effective_schedule_rejected
