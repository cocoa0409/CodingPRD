  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-Role fails priority-1 authentication with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ig/programs"
              payload: {}
              as: RecordsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "When the X-User-Role header is omitted by the test client, err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the trigger row documents intent; the test sends the call with the role header stripped)"

      - name: invalid_enum_on_resolve_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "strategy 'BEST_EFFORT' is outside the APPLY_LONGEST|APPLY_SHORTEST set -> ERR_INVALID_ENUM_VALUE (400) at priority 4, before the conflict-state check."
        test_recipe:
          setup: ["Program; class; jurisdiction; incumbent ACTIVE; challenger in PENDING_CONFLICT with OPEN conflict"]
          setup_api_calls:
            - call: "POST /ig/programs"
