            - "the response body does contain `created_at` and `occurred_at`, both 2026-08-01T00:00:00Z"
            - "§1.5 declares no PUT, PATCH or DELETE on /ledger-events or /ledger-events/{id}; the only mutation surface is POST /ledger-events/{id}/reverse"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 2 (ACTIVATION_LOAD then REDEMPTION), ordered created_at ASC"

