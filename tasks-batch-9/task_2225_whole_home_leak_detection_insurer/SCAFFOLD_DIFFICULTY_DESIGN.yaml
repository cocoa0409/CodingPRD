  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_pending_device_suppresses_alert
        grounds:
          - calculations.anomaly_classification
          - validations[priority=14]
          - validations[priority=23]
          - errors[ERR_DEVICE_TRANSFER_LOCKED]
          - state_machines.Device.lifecycle_state.ARMED_to_TRANSFER_PENDING
          - entities.TelemetryReading.fields.classification_at_ingest
        distinguishing_aspect: |
          ENTITY PAIR AnomalyEvent x Device: whether a burst reading mints an AnomalyEvent at all depends on the OTHER
          entity's lifecycle_state — anomaly_classification only runs when Device.lifecycle_state == ARMED, so the very
          same flow-12.0 / 6-minute / 72-gallon reading that mints a CATASTROPHIC_BURST in
          telemetry_burst_three_hop_cascade is ingested with classification_at_ingest NONE while the device sits in
          TRANSFER_PENDING, and the valve the homeowner would normally control is frozen with
          ERR_DEVICE_TRANSFER_LOCKED. This pair differs from the ReimbursementClaim x InsurancePolicy pair of
          terminated_policy_blocks_claim_submission.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "Buyer Homeowner ${h2} exists; DeviceTransfer ${tr1} for Device ${d1} to ${h2} is INITIATED, so Device ${d1}.lifecycle_state == TRANSFER_PENDING and Property ${p1}.property_state == TRANSFER_PENDING."
