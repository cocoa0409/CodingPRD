            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-H-0002", zone: 2, residential_declared: false, declared_length_in: 20, declared_width_in: 20, declared_height_in: 20, declared_weight_lbs: 50.1 }
