# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task 2767 Vineyard Management & Custom Farming
#
# Test-targeting index for SCAFFOLD.yaml. Every instance grounds in elements already
# declared in §1.1-§1.7 of SCAFFOLD.yaml; deleting this file leaves the scaffold's
# declared behaviour identical. 23 instances across the nine §0.5 Difficulty Rules
# (3 / 3 / 2 / 2 / 3 / 3 / 3 / 2 / 2).
#
# Logical clock: the server default is exactly 2026-08-01T00:00:00Z. Chains that depend
# on the clock set it explicitly via POST /_clock/set_current_utc.
#
# Recurring audit identities (opaque roles): u-vm-1 VineyardManager, u-ag-1 Agronomist,
# u-app-1 Applicator, u-co-1 ComplianceOfficer, u-ctl-1 Controller. Entity-backed roles
# carry the owning entity id: ClientOwner -> Vineyard.id, CrewSupervisor -> LaborCrew.id.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_labor_cost_estimated_vs_actual_divergence
        grounds:
          - calculations.work_order_labor_cost
          - calculations.farming_plan_committed_cost
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.WorkOrder.fields.estimated_labor_cost
          - entities.WorkOrder.fields.actual_labor_cost
        distinguishing_aspect: |
          The 'estimated' variant consumes planned_vines/planned_hours and is frozen at
          POST /work-orders, while the 'actual' variant consumes actual_vines/actual_hours at
          complete; on the same PIECE_RATE crew the two figures are 10858.25 and 4343.30, and
          the plan ledger swaps the estimate out for the actual rather than adding both.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (5.0 x 8.0 ft on 12.5 acres -> 1089 vines_per_acre, 13612 vine_count)."
            - "Contract C1 ACTIVE with B-12 enrolled at 12.5 contracted acres."
            - "FarmingPlan P1 for B-12 APPROVED, total_budget 14687.50, committed_cost 0.00."
            - "PIECE_RATE crew CR1 (crew_size 12, base_hourly_rate 19.50, piece_rate_per_vine 0.65) ACTIVE, pest_certified false."
            - "Logical clock at 2026-08-01T00:00:00Z; block has no re-entry or pre-harvest restriction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "2026 program for B-12" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/approve"
              payload: { approval_note: "Approved as submitted" }
              as: Controller
              as_user_id: "u-ctl-1"
            - call: "POST /crews"
              payload: { crew_name: "Cuadrilla Norte", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false, crew_status: "ACTIVE" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", crew_id: "${cr1_id}", task_type: "PRUNING", scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-04T00:00:00Z", planned_vines: 13000, planned_hours: 10.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { wo1_id: $.data.id, wo1_estimated: $.data.estimated_labor_cost }
            - call: "POST /work-orders/${wo1_id}/start"
              payload: {}
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
            - call: "POST /work-orders/${wo1_id}/complete"
              payload: { actual_vines: 5200, actual_hours: 12.0 }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
              captures: { wo1_actual: $.data.actual_labor_cost }
            - call: "GET /farming-plans/${p1_id}"
              payload: {}
              as: Controller
              captures: { p1_committed: $.data.committed_cost }
          assert:
            - "WorkOrder.${wo1_id}.estimated_labor_cost == 10858.25"
            - "WorkOrder.${wo1_id}.actual_labor_cost == 4343.30"
            - "WorkOrder.${wo1_id}.estimated_labor_cost != WorkOrder.${wo1_id}.actual_labor_cost (delta 6514.95)"
            - "WorkOrder.${wo1_id}.execution_status == COMPLETED"
            - "WorkOrder.${wo1_id}.payroll_status == PENDING"
            - "FarmingPlan.${p1_id}.total_budget == 14687.50"
            - "FarmingPlan.${p1_id}.committed_cost == 4343.30"
            - "FarmingPlan.${p1_id}.remaining_budget == 10344.20"
            - "FarmingPlan.${p1_id}.budget_posture == WITHIN_BUDGET"

      - name: yield_estimate_cluster_count_vs_berry_sample_divergence
        grounds:
          - calculations.block_yield_estimate_tons
          - calculations.governing_yield_estimate_selector
          - entities.YieldEstimate.fields.method
          - entities.YieldEstimate.fields.vine_count_at_estimate
          - entities.Block.fields.governing_estimate_tons
        distinguishing_aspect: |
          The cluster_count variant multiplies total_clusters by the supplied avg_cluster_weight_lb
          while the berry_sample variant derives cluster weight from berries_per_cluster *
          avg_berry_weight_g / G_PER_LB and inflates it by a days_to_harvest growth factor; on the
          identical 13612 vines at 32 clusters/vine the two variants land 22.50 tons apart (91.47
          vs 68.97) and the later sample_date governs the block.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (5.0 x 8.0 ft on 12.5 acres -> vine_count 13612)."
            - "Block has no yield estimate yet (harvest_posture NOT_ESTIMATED, governing_estimate_tons 0.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id, b1_vine_count: $.data.vine_count }
          trigger:
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-10", avg_clusters_per_vine: 32, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { ye_cc_id: $.data.id, ye_cc_tons: $.data.estimated_tons }
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "BERRY_SAMPLE", sample_date: "2026-08-20", avg_clusters_per_vine: 32, berries_per_cluster: 95, avg_berry_weight_g: 1.35, days_to_harvest: 30 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { ye_bs_id: $.data.id, ye_bs_tons: $.data.estimated_tons }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Agronomist
              captures: { b1_governing: $.data.governing_estimate_tons }
          assert:
            - "Block.${b1_id}.vine_count == 13612"
            - "YieldEstimate.${ye_cc_id}.vine_count_at_estimate == 13612"
            - "YieldEstimate.${ye_cc_id}.estimated_tons == 91.47"
            - "YieldEstimate.${ye_cc_id}.estimated_tons_per_acre == 7.32"
            - "YieldEstimate.${ye_bs_id}.vine_count_at_estimate == 13612"
            - "YieldEstimate.${ye_bs_id}.estimated_tons == 68.97"
            - "YieldEstimate.${ye_bs_id}.estimated_tons_per_acre == 5.52"
            - "YieldEstimate.${ye_cc_id}.estimated_tons - YieldEstimate.${ye_bs_id}.estimated_tons == 22.50"
            - "Block.${b1_id}.governing_estimate_tons == 68.97"
            - "Block.${b1_id}.remaining_estimated_tons == 68.97"
            - "Block.${b1_id}.harvest_posture == OPEN"

      - name: contract_settlement_provisional_vs_final_divergence
        grounds:
          - calculations.contract_period_settlement
          - calculations.contract_period_direct_cost
          - calculations.contract_management_fee_base
          - state_machines.CustomFarmingContract.ACTIVE_to_CLOSED
          - entities.CustomFarmingContract.fields.accrued_quality_incentive
          - entities.CustomFarmingContract.fields.last_settlement_total
        distinguishing_aspect: |
          On byte-identical stored data the provisional variant halves pass_through
          (PROVISIONAL_PASS_THROUGH_SHARE 0.50 -> 265.13) and forces quality_incentive to 0.00
          while leaving contract_status ACTIVE, whereas the final variant takes the full
          pass_through 530.26 plus accrued_quality_incentive 558.00 and closes the contract; the
          two total_billable figures diverge by exactly 823.13 (18787.28 vs 19610.41).
        test_recipe:
          setup:
            - "Contract C1 ACTIVE over three enrolled blocks at 12.5 / 4.0 / 3.6 contracted acres (total_contracted_acres 20.1), per_acre_annual_fee 950.00, cost_pass_through_pct 0.08, quality_incentive_per_ton 45.00, quality_brix_threshold 24.5, period_overhead_pool 1000.00, period 2026-01-01..2026-12-31."
            - "Block B-12 carries the only activity: one COMPLETED work order at actual_labor_cost 4343.30, one APPLIED spray at material_cost 812.50, one APPLIED irrigation event at water_cost 472.50."
            - "One RECEIVED harvest load off B-12 with net_tons 12.40 at brix 25.1, so accrued_quality_incentive is 558.00."
            - "management_fee_base is 19095.00 and direct_cost_total is 6628.29."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-14", variety: "CHARDONNAY", clone: "FPS-04", rootstock: "ROOTSTOCK_110R", trellis_system: "SPRAWL", planting_year: 2020, vine_spacing_ft: 6.0, row_spacing_ft: 10.0, acres: 4.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b2_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-16", variety: "SYRAH", clone: "FPS-07", rootstock: "ROOTSTOCK_SO4", trellis_system: "QUADRILATERAL_CORDON", planting_year: 2019, vine_spacing_ft: 7.0, row_spacing_ft: 9.0, acres: 3.6 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b3_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b2_id}", contracted_acres: 4.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b3_id}", contracted_acres: 3.6 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "2026 program for B-12" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/approve"
              payload: { approval_note: "Approved as submitted" }
              as: Controller
              as_user_id: "u-ctl-1"
            - call: "POST /crews"
              payload: { crew_name: "Cuadrilla Norte", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false, crew_status: "ACTIVE" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", crew_id: "${cr1_id}", task_type: "PRUNING", scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-04T00:00:00Z", planned_vines: 13000, planned_hours: 10.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/start"
              payload: {}
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
            - call: "POST /work-orders/${wo1_id}/complete"
              payload: { actual_vines: 5200, actual_hours: 12.0 }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
            - call: "POST /blocks/${b1_id}/pest-observations"
              payload: { pest_code: "POWDERY_MILDEW", incidence_pct: 12.0, severity_index: 3, scouting_note: "Cluster-zone colonies on east rows" }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { po1_id: $.data.id }
            - call: "POST /spray-records"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", pest_observation_id: "${po1_id}", product_name: "Sulfur 90WDG", active_ingredient: "sulfur", rei_hours: 72, phi_days: 21, rate_per_acre: 2.5, material_cost: 812.50 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { sr1_id: $.data.id }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Applicator
              captures: { b1_v: $.data.version }
            - call: "POST /spray-records/${sr1_id}/apply"
              payload: { applicator_license_no: "CA-PCA-88210", wind_speed_mph: 4.2, expected_block_version: "${b1_v}" }
              as: Applicator
              as_user_id: "u-app-1"
            - call: "POST /irrigation-events"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", scheduled_start: "2026-08-05T05:00:00Z", scheduled_end: "2026-08-05T07:00:00Z", et0_inches: 1.40, crop_coefficient: 0.72, soil_moisture_pct: 42, field_capacity_pct: 60, root_zone_depth_in: 36, effective_rain_inches: 0.10, water_unit_cost_per_acre_inch: 42.00 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { ie1_id: $.data.id }
            - call: "POST /irrigation-events/${ie1_id}/record-applied"
              payload: { applied_inches: 0.900 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-25", avg_clusters_per_vine: 32, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
            - call: "POST /delivery-windows"
              payload: { winery_name: "Coastal Cellars", window_start: "2026-09-14T06:00:00Z", window_end: "2026-09-14T18:00:00Z", capacity_tons: 40.00 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { dw1_id: $.data.id }
            - call: "GET /delivery-windows/${dw1_id}"
              payload: {}
              as: Controller
              captures: { dw1_v: $.data.version }
            - call: "POST /harvest-loads"
              payload: { block_id: "${b1_id}", crew_id: "${cr1_id}", delivery_window_id: "${dw1_id}", estimated_tons: 12.40, delivery_eta: "2026-09-14T09:00:00Z", expected_delivery_window_version: "${dw1_v}" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hl1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T07:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /harvest-loads/${hl1_id}/dispatch"
              payload: { gross_tons_at_dispatch: 13.10 }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
            - call: "POST /harvest-loads/${hl1_id}/receive"
              payload: { gross_tons: 13.10, tare_tons: 0.70, mog_deduct_pct: 0.00, brix_at_receipt: 25.1 }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "POST /contracts/${c1_id}/settle-period"
              payload: { settlement_mode: "PROVISIONAL", period_end_date: "2026-09-30" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { prov_direct: $.data.direct_cost_total, prov_pass: $.data.pass_through, prov_tier: $.data.tier_basis, prov_incentive: $.data.quality_incentive, prov_total: $.data.total_billable, prov_status: $.data.contract_status }
            - call: "POST /contracts/${c1_id}/settle-period"
              payload: { settlement_mode: "FINAL", period_end_date: "2026-12-31" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { final_direct: $.data.direct_cost_total, final_pass: $.data.pass_through, final_tier: $.data.tier_basis, final_incentive: $.data.quality_incentive, final_total: $.data.total_billable, final_status: $.data.contract_status }
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: Controller
              captures: { c1_last_total: $.data.last_settlement_total }
          assert:
            - "PROVISIONAL run: direct_cost_total == 6628.29"
            - "PROVISIONAL run: management_fee_base == 19095.00"
            - "PROVISIONAL run: pass_through == 265.13"
            - "PROVISIONAL run: tier_basis == 19360.13"
            - "PROVISIONAL run: volume_discount_pct == 0.03"
            - "PROVISIONAL run: volume_discount == 572.85"
            - "PROVISIONAL run: quality_incentive == 0.00"
            - "PROVISIONAL run: total_billable == 18787.28"
            - "PROVISIONAL run: contract_status == ACTIVE"
            - "FINAL run: direct_cost_total == 6628.29"
            - "FINAL run: pass_through == 530.26"
            - "FINAL run: tier_basis == 19625.26"
            - "FINAL run: volume_discount_pct == 0.03"
            - "FINAL run: volume_discount == 572.85"
            - "FINAL run: quality_incentive == 558.00"
            - "FINAL run: total_billable == 19610.41"
            - "FINAL run: contract_status == CLOSED"
            - "FINAL total_billable - PROVISIONAL total_billable == 823.13"
            - "CustomFarmingContract.${c1_id}.settled_period_count == 2"
            - "CustomFarmingContract.${c1_id}.last_settlement_total == 19610.41"
