  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: program_approve_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=29]
          - entities.PlacementProgram.fields.created_by_user_id
        distinguishing_aspect: "The same X-User-ID that created the program cannot approve it even when presenting the FinanceAdmin role; a different FinanceAdmin id approves cleanly."
        test_recipe:
          setup: ["account; program created and submitted by X-User-ID am-sod"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab SoD", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-sod"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-sod"
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "am-sod"
              captures: { err: $.data.error_id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-sod"
              captures: { st: $.data.program_state }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (http 409) — creator id am-sod cannot approve"
            - "st == ACTIVE after the fa-sod approval (the rejected attempt left the program PENDING_APPROVAL)"
      - name: amendment_approve_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=29]
          - entities.PlacementProgram.fields.pending_amendment
        distinguishing_aspect: "The segregation anchor for amendments is the AMENDMENT creator (pending_amendment.created_by_user_id), not the program creator: amendment author am-sod2 cannot approve their own amendment."
        test_recipe:
          setup: ["ACTIVE program (created am-sod2, approved fa-sod2); amendment CREATEd by am-sod2"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab SoD2", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-sod2"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-sod2"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-sod2"
              captures: { vprog: $.data.version }
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "CREATE", expected_program_version: "${vprog}", new_subsidy_pct: 0.15 }
              as: AccountManager
              as_user_id: "am-sod2"
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "am-sod2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (http 409); the program remains UNDER_AMENDMENT with subsidy_pct still 0.10"
      - name: lab_operator_cross_account_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - roles
        distinguishing_aspect: "LabOperator identity is entity_backed by Account: X-User-ID acctA creating an order whose account_id is acctB is ERR_FORBIDDEN."
        test_recipe:
          setup: ["accounts A and B; kit exists"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab XA", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acctA: $.data.id }
            - call: "POST /genomics/accounts"
              payload: { name: "Lab XB", regulatory_class: "RUO", region: "EU" }
              as: AccountManager
              captures: { acctB: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-XA", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
          trigger:
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acctB}", lines: [{ kit_code: "K-XA", quantity: 1 }] }
              as: LabOperator
              as_user_id: "${acctA}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403); no order is persisted"
      - name: fse_cannot_decommission
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - state_machines.Instrument
        distinguishing_aspect: "Per-action RBAC on the shared events endpoint: DECOMMISSION is AccountManager-only, so a FieldServiceEngineer firing it gets ERR_FORBIDDEN even though the role can use the endpoint."
        test_recipe:
          setup: ["account; OPERATIONAL instrument"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab FS", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-FS-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
          trigger:
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "DECOMMISSION" }
              as: FieldServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403); the instrument remains OPERATIONAL"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_amendment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[program-amendment-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Amendment CREATE carrying an expected_program_version one behind the current version (observed before another mutation) is rejected with 412; the same call at the current version succeeds."
        test_recipe:
          setup: ["account; program ACTIVE; version observed at approval time"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab OCC", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-occ"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-occ"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-occ"
              captures: { vprog: $.data.version }
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "CREATE", expected_program_version: "${vprog} - 1", new_subsidy_pct: 0.15 }
              as: AccountManager
              as_user_id: "am-occ"
              captures: { err: $.data.error_id }
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "CREATE", expected_program_version: "${vprog}", new_subsidy_pct: 0.15 }
              as: AccountManager
              as_user_id: "am-occ"
              captures: { st: $.data.program_state }
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the stale view"
            - "st == UNDER_AMENDMENT for the current version — the OCC gate, not the state, was what rejected the first call"
      - name: occ_stale_version_on_forecast_freeze
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[forecast-freeze-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Forecast FREEZE with an expected_forecast_version one behind current is rejected with 412 while the forecast is still SUBMITTED; re-freezing at the observed version succeeds."
        test_recipe:
          setup: ["account; kit; forecast DRAFT -> SUBMITTED, version captured at submit"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab OF", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-OF", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-OF", week_start: "2026-09-07T00:00:00Z", quantity: 10 }] }
              as: SupplyPlanner
              captures: { fc: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fc}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { fv: $.data.version }
          trigger:
            - call: "POST /genomics/supply-forecasts/${fc}/advance"
              payload: { action: "FREEZE", expected_forecast_version: "${fv} - 1" }
              as: SupplyPlanner
              captures: { err: $.data.error_id }
            - call: "POST /genomics/supply-forecasts/${fc}/advance"
              payload: { action: "FREEZE", expected_forecast_version: "${fv}" }
              as: SupplyPlanner
              captures: { st: $.data.forecast_state }
          assert:
            - "err == ERR_STALE_VERSION (http 412)"
            - "st == FROZEN after retrying with the observed version"
      - name: version_increments_and_updated_at_refreshes_on_patch
        claim_type: optimistic_concurrency
        grounds:
          - entities.ReagentKit
        distinguishing_aspect: "Every mutation bumps version by exactly 1 and re-stamps updated_at from the logical clock: a kit PATCHed after a one-hour clock advance shows version 2 and updated_at exactly 2026-09-01T01:00:00Z."
        test_recipe:
          setup: ["kit created at the default clock"]
          setup_api_calls:
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-VB", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id, v1: $.data.version, ca: $.data.created_at }
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /genomics/reagent-kits/${kit}"
              payload: { price_cents: 9000 }
              as: PlatformAdmin
              captures: { v2: $.data.version, ua: $.data.updated_at, price: $.data.price_cents }
          assert:
            - "v1 == 1 and v2 == 2 (exactly one increment)"
            - "ca == 2026-09-01T00:00:00Z and ua == 2026-09-01T01:00:00Z and price == 9000"
      - name: forecast_freeze_supersedes_prior_frozen
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SupplyForecast.SUBMITTED_to_FROZEN
          - state_machines.SupplyForecast.FROZEN_to_SUPERSEDED
        distinguishing_aspect: "Freezing forecast B cascades the account's earlier FROZEN forecast A to SUPERSEDED without any direct call on A."
        test_recipe:
          setup: ["account; kit; forecast A (week 2026-09-07, 10 units) SUBMITTED then FROZEN; forecast B (week 2026-09-14, 20 units) SUBMITTED"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab SF", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-SF", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-SF", week_start: "2026-09-07T00:00:00Z", quantity: 10 }] }
              as: SupplyPlanner
              captures: { fcA: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fcA}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { fvA: $.data.version }
            - call: "POST /genomics/supply-forecasts/${fcA}/advance"
              payload: { action: "FREEZE", expected_forecast_version: "${fvA}" }
              as: SupplyPlanner
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-SF", week_start: "2026-09-14T00:00:00Z", quantity: 20 }] }
              as: SupplyPlanner
              captures: { fcB: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fcB}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { fvB: $.data.version }
          trigger:
            - call: "POST /genomics/supply-forecasts/${fcB}/advance"
              payload: { action: "FREEZE", expected_forecast_version: "${fvB}" }
              as: SupplyPlanner
              captures: { stB: $.data.forecast_state }
            - call: "GET /genomics/supply-forecasts/${fcA}"
              as: SupplyPlanner
              captures: { stA: $.data.forecast_state }
          assert:
            - "stB == FROZEN and stA == SUPERSEDED (cascade of the second freeze)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a follow-up GET in the same session observes the just-written state (DRAFT, version 1) with no reconciliation lag."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab IV", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              captures: { prog: $.data.id }
            - call: "GET /genomics/placement-programs/${prog}"
              as: FinanceAdmin
              captures: { st: $.data.program_state, v: $.data.version }
          assert:
            - "st == DRAFT and v == 1 in the immediately following read"

