              payload: { name: "Cutoff Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l1_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l2_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T13:59:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /motion/order-lines/${l1_id}/place-factory-order"
              payload: {}
              as: CounterSalesRep
              captures: { st1: $.data.sourcing_status }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/order-lines/${l2_id}/place-factory-order"
