            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw B", birth_date: "2014-04-11", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_b: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_b}", seed_time_cs: 2910 }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
          trigger:
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_QUALIFICATION_UNDECIDED"
      - name: certification_expiry_equality_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CERTIFICATION_INVALID]", entities.Official.fields.certification_expires_on]
        distinguishing_aspect: "certification_expires_on == session_date (2026-08-15) is VALID (>= comparison); 2026-08-14 (one day before) is rejected with ERR_CERTIFICATION_INVALID."
        test_recipe:
          setup: ["meet with one event on session 2026-08-15; two REFEREE officials expiring 2026-08-15 and 2026-08-14"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "CE1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref Ok", lsc_membership_id: "LSC-ROK", certifications: ["REFEREE"], certification_expires_on: "2026-08-15" }, as: MeetDirector, captures: { off_ok: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref Ex", lsc_membership_id: "LSC-REX", certifications: ["REFEREE"], certification_expires_on: "2026-08-14" }, as: MeetDirector, captures: { off_ex: "$.data.id" } }
          trigger:
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ok}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ok: "$.data.id", oa_ok_st: "$.data.status" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ex}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${oa_ok_st} == PROPOSED  # expiry equal to session_date passes"
            - "${err} == ERR_CERTIFICATION_INVALID"
