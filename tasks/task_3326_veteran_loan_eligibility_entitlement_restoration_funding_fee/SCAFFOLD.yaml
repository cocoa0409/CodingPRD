  - { method: GET, path: "/va-loans/loans/{id}/refinance-requests", description: "List refinance requests of a loan", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "RefinanceRequest[]", side_effects: [] }
  - { method: POST, path: "/va-loans/refinance-requests/{id}/evaluate", description: "Evaluate seasoning then NTB; APPROVED or REJECTED", roles: [Underwriter], code: 200, input: [], output: RefinanceRequest, side_effects: ["computed seasoning_days, ntb_rate_satisfied, recoupment_months, ntb_satisfied", "AuditEvent appended"] }
  - { method: POST, path: "/va-loans/veterans/{id}/entitlement-restoration-requests", description: "Request entitlement restoration after payoff", roles: [LoanOfficer], code: 201, input: [loan_id, restoration_type], output: EntitlementRestorationRequest, side_effects: ["AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/entitlement-restoration-requests", description: "List a veteran's restoration requests", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "EntitlementRestorationRequest[]", side_effects: [] }
  - { method: GET, path: "/va-loans/loans/{id}/entitlement-restoration-requests", description: "List restoration requests citing this loan (FK reverse lookup)", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "EntitlementRestorationRequest[]", side_effects: [] }
  - { method: POST, path: "/va-loans/entitlement-restoration-requests/{id}/grant", description: "Grant restoration; restores the loan's charged entitlement", roles: [ProgramAdmin], code: 200, input: [], output: EntitlementRestorationRequest, side_effects: ["EntitlementAccount.total_restored_cents += restored_amount_cents; remaining recomputed", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/audit-events", description: "Filtered list of audit events", roles: [ProgramAdmin], code: 200, input: ['entity_type?', 'entity_id?', 'action?', 'limit?', 'offset?'], output: "AuditEvent[]", side_effects: [] }
  - { method: POST, path: "/va-loans/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default is 2026-09-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Veteran
    description: "Borrower acting on their own records; X-User-ID must equal the Veteran's id"
    identity: "entity_backed:Veteran"
    exclusive_operations: ["POST /va-loans/veterans/{id}/deployment-exceptions (self)"]
    shared_operations: ["GET endpoints for own veteran subtree (veteran, service periods, COEs, entitlement account, loans, appraisals, occupancy certificates, restoration requests)"]
  - name: LoanOfficer
    description: "Originates and shepherds loans; cannot underwrite own originations, waive repairs, or submit appraisal reports"
    identity: "opaque"
    exclusive_operations: ["create veterans/service-periods/COE requests/loans/appraisal requests/assumption requests/refinance requests/restoration requests", "POST close and record-payoff", "POST verify-occupancy", "POST repair-requirements/{id}/complete", "POST coe-requests/{id}/reconsider"]
    shared_operations: ["GET endpoints across the domain"]
  - name: Underwriter
    description: "Decides underwriting, evaluates refinances, approves assumptions; barred from deciding loans they originated"
    identity: "opaque"
    exclusive_operations: ["POST underwriting-decisions", "POST refinance-requests/{id}/evaluate", "POST assumption-requests/{id}/approve"]
    shared_operations: ["GET endpoints across the domain"]
  - name: Appraiser
    description: "Panel appraiser; X-User-ID must equal the Appraiser's id; acts only on own assignments"
    identity: "entity_backed:Appraiser"
    exclusive_operations: ["POST appraisal-requests/{id}/submit-report", "POST repair-requirements/{id}/verify"]
    shared_operations: ["GET appraisal requests and repair requirements"]
  - name: ProgramAdmin
    description: "Program operator: COE adjudication, appraiser pool, repair waivers, fee refunds, restoration grants, audit review, clock"
    identity: "opaque"
    exclusive_operations: ["POST coe-requests/{id}/issue and /deny", "POST appraisers", "POST repair-requirements/{id}/waive", "POST funding-fee-assessments/{id}/refund", "POST entitlement-restoration-requests/{id}/grant", "GET audit-events", "POST /va-loans/_clock/set_current_utc"]
    shared_operations: ["GET endpoints across the domain", "POST veterans", "POST coe-requests/{id}/reconsider"]
