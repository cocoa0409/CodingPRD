            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-RC2", site_address: "902 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p2: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-RC3", site_address: "903 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p3: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-RC4", site_address: "904 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p4: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-RC5", site_address: "905 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p5: $.data.id }
            - call: "POST /demolition-contractors"
              payload: { name: "Delta Demolition", license_no: "DEM-D", asbestos_certified: true, max_concurrent_work_orders: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ctr_d: $.data.id }
            - call: "POST /demolition-contractors"
              payload: { name: "Epsilon Demolition", license_no: "DEM-E", asbestos_certified: true, max_concurrent_work_orders: 1 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ctr_e: $.data.id }
            - call: "POST /parcels/${p1}/demolition-work-orders"
              payload: { parcel_id: "${p1}", contractor_id: "${ctr_d}", asbestos_survey_status: "NOT_PERFORMED", scheduled_start: "2026-10-05T08:00:00Z", scheduled_end: "2026-10-06T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { wo1: $.data.id }
            - call: "POST /parcels/${p4}/demolition-work-orders"
              payload: { parcel_id: "${p4}", contractor_id: "${ctr_e}", asbestos_survey_status: "NOT_PERFORMED", scheduled_start: "2026-11-05T08:00:00Z", scheduled_end: "2026-11-06T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { woe1: $.data.id }
          trigger:
            - call: "POST /parcels/${p2}/demolition-work-orders"
              payload: { parcel_id: "${p2}", contractor_id: "${ctr_d}", asbestos_survey_status: "NOT_PERFORMED", scheduled_start: "2026-10-08T09:00:00Z", scheduled_end: "2026-10-08T17:00:00Z" }
              as: SubrecipientCoordinator
