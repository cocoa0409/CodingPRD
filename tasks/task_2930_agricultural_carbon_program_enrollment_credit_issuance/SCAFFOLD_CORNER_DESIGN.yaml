            - call: "GET /fields/${f1_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /growers/${g1_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${e1_id}/data-packets"
              payload: { crop_year: 2026, source: "FARM_RECORD", reported_acres: 1000.00, coverage_pct: 92.00 }
