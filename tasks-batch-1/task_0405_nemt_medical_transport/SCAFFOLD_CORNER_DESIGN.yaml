# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — NEMT, Expert tier
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every active instance carries an executable test_recipe; corners already
# probed by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_minimal_returns_201_eligible
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with the four required fields returns 201; eligibility_status=ELIGIBLE, noshow_strike_count=0, standing_orders_paused=false, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { medicaid_id: "M-EN1", full_name: "Ent One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id, st: $.data.eligibility_status }
          assert:
            - "HTTP status == 201"
            - "Member.${mem_id}.eligibility_status == ELIGIBLE"
            - "Member.${mem_id}.noshow_strike_count == 0"
            - "Member.${mem_id}.standing_orders_paused == false"
            - "Member.${mem_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Member, "validations[priority=16]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members missing required mobility_level returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { medicaid_id: "M-MR1", full_name: "Miss Req", home_county: "C1" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_member_invalid_enum_returns_400
        claim_type: Type Constraints
        grounds: [entities.Member.fields.mobility_level, "validations[priority=16]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members with mobility_level outside {AMBULATORY,WHEELCHAIR,STRETCHER} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { medicaid_id: "M-EN2", full_name: "Bad Enum", mobility_level: "GURNEY", home_county: "C1" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: trip_default_is_round_trip_true
        claim_type: Defaults
        grounds: [entities.TripRequest.fields.is_round_trip]
        distinguishing_aspect: "POST /trips omitting is_round_trip applies the default true."
        test_recipe:
          setup: ["An ELIGIBLE AMBULATORY member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { medicaid_id: "M-DF1", full_name: "Def One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8 }
              as: Coordinator
              captures: { trip_id: $.data.id, rt: $.data.is_round_trip }
          assert:
            - "TripRequest.${trip_id}.is_round_trip == true (default applied)"

      - name: trip_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.TripRequest.fields.trip_status, entities.TripRequest.fields.billing_status]
        distinguishing_aspect: "POST /trips always initializes trip_status=DRAFT and billing_status=UNBILLED regardless of any client-supplied value."
        test_recipe:
          setup: ["An ELIGIBLE member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { medicaid_id: "M-SF1", full_name: "Sys One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
          assert:
            - "TripRequest.${trip_id}.trip_status == DRAFT"
            - "TripRequest.${trip_id}.billing_status == UNBILLED"
            - "TripRequest.${trip_id}.claimed_cost_cents == 0"

      - name: eligibility_span_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.EligibilitySpan]
        distinguishing_aspect: "EligibilitySpan has common_fields:false; its create response exposes id and created_at but no version field (immutable append-only record)."
        test_recipe:
          setup: ["A member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { medicaid_id: "M-IM1", full_name: "Imm One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { span_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "EligibilitySpan.${span_id} response has id and created_at; no version field present"

      - name: create_trip_fk_member_not_found_returns_422
        claim_type: Parent Relationships
        grounds: [entities.TripRequest.fields.member_id, "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /trips with a member_id that does not exist returns ERR_FK_NOT_FOUND (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trips"
              payload: { member_id: "00000000-0000-0000-0000-000000000000", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: list_members_trips_pagination_envelope
        claim_type: Listing
        grounds: [entities.TripRequest.fields.member_id, endpoints]
        distinguishing_aspect: "GET /members/{id}/trips returns an array response envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A member with two DRAFT trips."]
          setup_api_calls:
            - call: "POST /members"
              payload: { medicaid_id: "M-LS1", full_name: "Lst One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-03T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
          trigger:
            - call: "GET /members/${mem_id}/trips"
              payload: {}
              as: Coordinator
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_trip_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TripRequest.field.trip_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /trips/{id}/cancel on a COMPLETED trip fails ERR_INVALID_STATE (409); cancel is only defined from DRAFT/SCHEDULED/ASSIGNED."
        test_recipe:
          setup: ["A COMPLETED AMBULATORY one-way trip."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-IT1", full_name: "Inv One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerIT", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "It D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 8.0 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/cancel"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "TripRequest.${trip_id}.trip_status == COMPLETED (unchanged)"

      - name: terminate_member_with_in_flight_trip_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.ELIGIBLE_to_TERMINATED, "validations[priority=15]", "errors[ERR_DEPENDENCY_EXISTS]"]
        distinguishing_aspect: "POST /members/{id}/terminate fails ERR_DEPENDENCY_EXISTS (409) when the member has a trip in ASSIGNED."
        test_recipe:
          setup: ["An ELIGIBLE AMBULATORY member with one ASSIGNED trip."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-TM1", full_name: "Term One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerTM", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Tm D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
          trigger:
            - call: "POST /members/${mem_id}/terminate"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DEPENDENCY_EXISTS"
            - "Member.${mem_id}.eligibility_status == ELIGIBLE (unchanged)"

      - name: trip_bubble_up_completes_on_all_legs_dropped
        claim_type: Side Effect Execution
        grounds: [state_machines.TripRequest.IN_PROGRESS_to_COMPLETED, state_machines.Leg.PICKED_UP_to_DROPPED_OFF]
        distinguishing_aspect: "When the final non-CANCELLED Leg reaches DROPPED_OFF, the trip auto-transitions IN_PROGRESS->COMPLETED (bubble-up) and the Assignment is RELEASED."
        test_recipe:
          setup: ["A WHEELCHAIR round-trip (non-will-call) IN_PROGRESS with both legs about to be dropped."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-BU1", full_name: "Bub One", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerBU", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Bu D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id", rt_leg_id: "$.data[1].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /legs/${rt_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "TripRequest.${trip_id}.trip_status == COMPLETED"
            - "Driver.${drv_id}.status == AVAILABLE (Assignment RELEASED on completion)"

      - name: terminal_completed_no_outgoing_lifecycle_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TripRequest.field.trip_status]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_requires_trip_completed
          rationale: "Terminal-state lockdown of the lifecycle axis is exercised indirectly; invalid-from-COMPLETED for cancel is separately covered by cancel_trip_from_completed_returns_invalid_state above."

      - name: dispute_override_reconciles_when_variance_exceeds_tolerance
        claim_type: Valid Transition
        grounds: [state_machines.TripRequest.ENCOUNTERED_to_DISPUTED, state_machines.TripRequest.DISPUTED_to_RECONCILED, calculations.reconciliation_variance]
        distinguishing_aspect: "A trip with variance 780c (>500c tolerance) reconciles to DISPUTED, then /reconcile/override moves it to RECONCILED with both Claim and Encounter RECONCILED."
        test_recipe:
          setup: ["COMPLETED WHEELCHAIR will-call round-trip: claimed 7000c, encounter 7780c (variance 780 > 500 -> DISPUTED)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-DO1", full_name: "Disp One", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerDO", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Do D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: true }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id", rt_leg_id: "$.data[1].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.4 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T09:00:00Z" }
              as: Coordinator
            - call: "POST /legs/${rt_leg_id}/ready"
              payload: {}
              as: Coordinator
            - call: "POST /legs/${rt_leg_id}/depart"
              payload: {}
