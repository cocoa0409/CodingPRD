            - "Invoice.${va_id}.amount_due_cents != Invoice.${vb_id}.amount_due_cents for identical 10-day patterns (variant divergence)"
            - "Invoice.${vb_id}.sea_days_billed == 10 and Invoice.${va_id}.sea_days_billed == 10"

      - name: em_review_progress_pct_vs_catch_extrapolation_variants
        grounds:
          - calculations.em_review_progress_calculation
          - state_machines.EMTrip.IN_REVIEW_to_REVIEWED
          - state_machines.EMTrip.REVIEWED_to_ACCEPTED
          - entities.EMTrip.fields.reviewed_pct
          - entities.EMTrip.fields.estimated_total_catch_kg
        distinguishing_aspect: |
          The em_review_progress_calculation pins two output variants from the SAME
          accumulated inputs (reviewed_hours / sampled_catch_kg over video_hours):
          reviewed_pct (4-decimal ratio, round_half_up, drives the IN_REVIEW->REVIEWED
          threshold) vs estimated_total_catch_kg (2-decimal extrapolation
          round_half_up(sampled*video/reviewed), produced only at accept). The two
          outputs diverge in both precision and value for identical accumulations —
          a third entity domain (EMTrip), distinct from CoveragePlan and Invoice.
        test_recipe:
          setup:
            - "Fishery F (target 0.30), operator OP GOOD, vessel V length 50 ACTIVE with gear LONGLINE"
            - "EMEnrollment E for V approved and activated (V.monitoring_mode -> ELECTRONIC_MONITORING)"
            - "CoveragePlan P for F in SELECTION_COMPLETED containing [2026-10-01, 2026-10-08] (published with empty eligible pool since V is EM-mode, then selection run executed)"
            - "EMReviewer R ACTIVE"
            - "EMTrip T declared 2026-10-01..2026-10-08 (trip_sea_days=8), footage 100.00 hours submitted, reviewer assigned"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-EM", name: "BSAI EM Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "EM Ops LLC", license_number: "LIC-EM-1", contact_person_ref: "person-em-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Camera", permit_number: "PERMIT-EM-1", home_port: "Akutan", length_ft: 50, gear_type: "LONGLINE" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/em-enrollments"
              payload: { vessel_id: "${v_id}", equipment_vendor: "DeckCam Inc", equipment_install_date: "2026-08-15T00:00:00Z" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { em_id: $.data.id }
            - call: "POST /observer-program/em-enrollments/${em_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /observer-program/em-enrollments/${em_id}/activate"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 40 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-20T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "POST /observer-program/em-reviewers"
              payload: { person_ref: "person-rev-1", full_name: "Rita Reviewer" }
              as: ProgramAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /observer-program/em-trips"
              payload: { vessel_id: "${v_id}", departure_date: "2026-10-01T00:00:00Z", return_date: "2026-10-08T00:00:00Z" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /observer-program/em-trips/${trip_id}/submit-footage"
              payload: { video_hours: 100.00 }
              as: VesselOperator
              as_user_id: "${op_id}"
            - call: "POST /observer-program/em-trips/${trip_id}/assign-reviewer"
              payload: { reviewer_id: "${rev_id}" }
              as: ProgramCoordinator
            - call: "POST /observer-program/em-trips/${trip_id}/record-review"
              payload: { additional_reviewed_hours: 40.00, sampled_catch_kg_delta: 120.50 }
              as: EMReviewer
              as_user_id: "${rev_id}"
              captures: { pct: $.data.reviewed_pct, trip_status: $.data.status }
          trigger:
            - call: "POST /observer-program/em-trips/${trip_id}/accept"
              payload: {}
              as: ProgramCoordinator
              captures: { est: $.data.estimated_total_catch_kg, trip_status2: $.data.status }
            - call: "GET /observer-program/coverage-plans/${plan_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { em_days: $.data.actual_em_sea_days }
          assert:
            - "EMTrip.${trip_id}.reviewed_pct == 0.4000 after recording 40.00 of 100.00 hours (4-decimal round_half_up variant)"
            - "EMTrip.${trip_id}.status == REVIEWED after the record-review (auto-promotion at reviewed_pct >= 0.3000)"
            - "EMTrip.${trip_id}.estimated_total_catch_kg == 301.25 after accept (2-decimal extrapolation variant: round_half_up(120.50*100.00/40.00, 2))"
            - "EMTrip.${trip_id}.estimated_total_catch_kg != EMTrip.${trip_id}.reviewed_pct (the two variants diverge in value and precision from identical accumulated inputs)"
            - "CoveragePlan.${plan_id}.actual_em_sea_days == 8 (trip credited on accept)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two combinatorial formulas in DIFFERENT
  # modes from {(a) multi-input non-linear, (b) nested rounding order,
  # (c) circular-looking pinned evaluation order}. Instance 1 is mode (b)
  # (per-line rounding then sum vs sum-then-round on invoice lines).
  # Instance 2 is mode (a) (selection scoring with >=3 interacting inputs,
  # conditional gear-priority branch, min/max clamps).
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_line_rounding_order_per_line_then_sum
        grounds:
          - calculations.cost_recovery_fee_calculation
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the scaffold pins
          "round each line_total_cents to cents first, then sum the rounded lines"
          and explicitly marks sum-then-round as NON-CONFORMANT. With two CLOSED
          1-day deployments on the same STANDARD vessel the pinned order yields
          41,376 + 41,376 = 82,752 cents, whereas the forbidden sum-then-round
          order yields 82,753 cents — a 1-cent divergence that only the pinned
          order produces.
        test_recipe:
          setup:
            - "Fishery F (target 0.30), operator OP GOOD, observer OBS (LEAD), debriefer DEB"
            - "Vessel V length_ft 50 (STANDARD variant), ACTIVE in F"
            - "CoveragePlan P published; selection run creates a notice for V (accepted, allocated 30)"
            - "V completes TWO 1-day CLOSED deployments under the same plan: D1 2026-09-10..2026-09-10 and D2 2026-09-12..2026-09-12 (each: safety PASS, board, one haul sample 100/500, return on schedule, submit-data, assign debriefer, verify, validate, close)"
            - "Invoice generation over P for V"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-PLK", name: "BSAI Pollock", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Round Ops LLC", license_number: "LIC-RND-1", contact_person_ref: "person-rnd-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-rnd-obs", full_name: "Olga Observer", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/debriefers"
              payload: { person_ref: "person-rnd-deb", full_name: "Drew Debriefer" }
