# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Hospital Employee Health & Exposure Management
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: employee_create_success_defaults
        claim_type: creation
        grounds: ["entities.Employee"]
        distinguishing_aspect: "POST with all required fields returns 201 with system defaults: status PREPLACEMENT, posture CLEAR, both counts 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-EN1", full_name: "New Hire", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
          assert:
            - "response 201; Employee.${emp_id}.status == PREPLACEMENT"
            - "compliance_posture == CLEAR, active_hold_count == 0, open_restriction_count == 0"
            - "version == 1; id is a prefix-less UUID; created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: employee_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Employee.fields.employee_ref", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required employee_ref yields ERR_INVALID_REQUEST (400); no row is created."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employee-health/employees"
              payload: { full_name: "No Ref", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http 400"
            - "GET /employee-health/employees returns total_count 0"

      - name: employee_duplicate_ref_rejected
        claim_type: type_constraints
        grounds: ["entities.Employee.fields.employee_ref", "errors[ERR_DUPLICATE_EMPLOYEE_REF]"]
        distinguishing_aspect: "employee_ref uniqueness: second create with the same ref fails ERR_DUPLICATE_EMPLOYEE_REF (409)."
        test_recipe:
          setup: ["Employee E-DUP already registered"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-DUP", full_name: "First One", job_category: "TECH", department: "LAB", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-DUP", full_name: "Second One", job_category: "NURSE", department: "ED", hire_date: "2025-02-01T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_EMPLOYEE_REF and http 409"
            - "GET /employee-health/employees returns total_count 1"

      - name: employee_list_pagination_envelope
        claim_type: listing
        grounds: ["entities.Employee", "response_envelope"]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 rows, limit=2 -> 2 rows has_more true; offset=2 -> 1 row has_more false."
        test_recipe:
          setup: ["Three employees registered"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PG1", full_name: "Pg One", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PG2", full_name: "Pg Two", job_category: "TECH", department: "LAB", hire_date: "2025-01-06T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-PG3", full_name: "Pg Three", job_category: "OTHER", department: "ED", hire_date: "2025-01-07T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
          trigger:
            - call: "GET /employee-health/employees"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /employee-health/employees"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
          assert:
            - "Page 1: exactly 2 rows, total_count == 3, has_more == true"
            - "Page 2: exactly 1 row, total_count == 3, has_more == false"

      - name: titer_immunity_computed_server_side
        claim_type: computed_fields
        grounds: ["entities.TiterResult.fields.immunity_status", "calculations.immunity_interpretation"]
        distinguishing_aspect: "immunity_status is computed: a QUANTITATIVE HEP_B titer of 12.0 yields IMMUNE regardless of any client intent; the field is not an accepted input."
        test_recipe:
          setup: ["Employee exists"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-EN5", full_name: "Comp Uted", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 12.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
              captures: { t_id: $.data.id, t_status: $.data.immunity_status }
          assert:
            - "${t_status} == IMMUNE (12.0 >= 10.0 threshold)"
            - "GET /employee-health/titer-results/${t_id} returns immunity_status IMMUNE"

      - name: titer_result_immutable_record
        claim_type: immutability
        grounds: ["entities.TiterResult"]
        distinguishing_aspect: "TiterResult is append-only (common_fields false): the read carries id and created_at but no version/updated_at, and no PUT/PATCH/DELETE endpoint exists for it in §1.5."
        test_recipe:
          setup: ["Employee with one titer result"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-EN6", full_name: "Imm Utable", job_category: "TECH", department: "LAB", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 3.1, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /employee-health/titer-results/${t_id}"
              as: EmployeeHealthNurse
          assert:
            - "Response contains id and created_at; contains NO version and NO updated_at field"
            - "§1.5 declares no PUT/PATCH/DELETE for /employee-health/titer-results"

      - name: screening_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.PrePlacementScreening", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Single-resource GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /employee-health/pre-placement-screenings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http 404"

  - section: state_machines
    instances:
      - name: screening_clear_activates_employee
        claim_type: side_effect_execution
        grounds: ["state_machines.PrePlacementScreening.IN_PROGRESS_to_CLEARED", "state_machines.Employee.PREPLACEMENT_to_ACTIVE"]
        distinguishing_aspect: "The CLEARED decision bubbles up: employee auto-transitions PREPLACEMENT -> ACTIVE in the same request."
        test_recipe:
          setup: ["Employee E1 PREPLACEMENT with screening complete (PHYSICAL, TB_BASELINE; HEP_B and VARICELLA latest titers IMMUNE)"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM1", full_name: "Acti Vate", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/employees/${emp_id}"
              as: EmployeeHealthPhysician
          assert:
            - "PrePlacementScreening.${scr_id}.status == CLEARED with decided_at set"
            - "Employee.${emp_id}.status == ACTIVE (auto-transition side effect)"

      - name: screening_decide_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PrePlacementScreening", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding an already-decided (terminal) screening fails ERR_INVALID_STATE; terminal lockdown."
        test_recipe:
          setup: ["Employee with screening already FAILED"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM2", full_name: "Two Decide", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "FAILED" }
              as: EmployeeHealthPhysician
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; screening remains FAILED; employee remains PREPLACEMENT"

      - name: screening_component_repeat_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PrePlacementScreening", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing the same component (PHYSICAL) twice on one screening fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Employee with IN_PROGRESS screening, PHYSICAL already completed"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM3", full_name: "Rep Eat", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-25T09:00:00Z" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; physical_completed_at remains 2026-07-20T09:00:00Z"

      - name: cycle_completion_after_satisfied_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.AnnualRequirementCycle", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SATISFIED cycle is terminal: recording another TB completion fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE employee (no respirator requirement); 2026 CALENDAR_YEAR cycle; TB completed -> SATISFIED"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM4", full_name: "Term Inal", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "TB_SCREENING", completed_at: "2026-08-01T00:00:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "TB_SCREENING", completed_at: "2026-08-01T00:00:00Z" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; cycle stays SATISFIED with original tb_completed_at"
      - name: fit_test_completion_when_not_required_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=5]", "errors[ERR_FIT_TEST_NOT_REQUIRED]"]
        distinguishing_aspect: "FIT_TEST completion for an employee with requires_respirator == false fails ERR_FIT_TEST_NOT_REQUIRED; the conditional requirement depends on an entity flag."
        test_recipe:
          setup: ["ACTIVE employee with requires_respirator false; cycle OPEN"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM5", full_name: "No Resp", job_category: "OTHER", department: "ADM", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "FIT_TEST", completed_at: "2026-08-01T00:00:00Z" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FIT_TEST_NOT_REQUIRED (422); fit_test_completed_at remains null; cycle stays OPEN"

      - name: cycle_second_open_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=4]", "errors[ERR_CYCLE_ALREADY_OPEN]"]
        distinguishing_aspect: "Exactly one non-terminal cycle per employee: second create while OPEN fails ERR_CYCLE_ALREADY_OPEN (409)."
        test_recipe:
          setup: ["ACTIVE employee with an OPEN 2026 cycle"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM6", full_name: "One Cycle", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2027, cycle_mode: "ROLLING_ANNIVERSARY" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CYCLE_ALREADY_OPEN (409); only one cycle exists for the employee"

      - name: serology_result_while_scheduled_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SerologyFollowUp", "errors[ERR_FOLLOWUP_NOT_DUE]"]
        distinguishing_aspect: "WEEK_6 follow-up is SCHEDULED until its window_open; recording a result early fails ERR_FOLLOWUP_NOT_DUE (409)."
        test_recipe:
          setup: ["Employee with MEDIUM case (exposure 2026-07-30T10:00:00Z); clock 2026-08-01T12:00:00Z; PEP STARTED so WEEK_6 exists SCHEDULED (window_open 2026-09-03T10:00:00Z)"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-SM7", full_name: "Too Early", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-01T12:00:00Z" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/serology-follow-ups"
              payload: { exposure_case_id: "${case_id}", milestone: "WEEK_6" }
              as: EmployeeHealthNurse
              captures: { fu6: "$.data[0].id" }
          trigger:
            - call: "POST /employee-health/serology-follow-ups/${fu6}/transition"
              payload: { to_state: "RESULTED", result: "NEGATIVE", resulted_at: "2026-08-01T13:00:00Z" }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FOLLOWUP_NOT_DUE (409); follow-up stays SCHEDULED with result PENDING"

      - name: serology_waive_short_reason_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.SerologyFollowUp.DUE_to_WAIVED", "errors[ERR_INSUFFICIENT_JUSTIFICATION]"]
        distinguishing_aspect: "Waiving a DUE follow-up with a 5-character reason fails ERR_INSUFFICIENT_JUSTIFICATION (400); length threshold is 10."
