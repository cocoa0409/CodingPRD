          setup: ["Room CR-RB5; program PROG-RB5 ACTIVE; cycle cyc_rb5 performed by tech-rb5 (performed_by_user_id == 'tech-rb5')"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-RB5", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_rb5: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_rb5}", method_code: "MOP-RB5", required_consecutive_passes: 3 }
              as: QualityAssurance
              captures: { prog_rb5: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_rb5}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_rb5}/cycles"
              payload: { result: "PASS" }
