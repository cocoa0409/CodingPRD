              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: GENERAL, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 660, scope: MAIN_CONSTRUCTION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_a: $.data.id }
            - { call: "POST /crew-bookings/${bk_a}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 630, end_minute: 720, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_b: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /crew-bookings/${bk_b}/confirm"
              payload: {}
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 422 with error_id == ERR_DATE_IN_PAST — NOT 409 ERR_CREW_WINDOW_CONFLICT, though B (630–720) also collides with A (540–660) under the 30-minute buffer rule"
            - "business_temporal (priority 9) beats business_constraint (priority 10)"
