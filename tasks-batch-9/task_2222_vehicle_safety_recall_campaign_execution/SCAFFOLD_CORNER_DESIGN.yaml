            - "after the refusal remedy_status was still \"REMEDY_UNDER_DEVELOPMENT\" and remedy_released_at was null"
            - "the refreshed token satisfied the guard: the retry returned HTTP 200 with remedy_status == \"REMEDY_RELEASED\", remedy_released_by_user_id == \"u-eng-2\" and remedy_revision_count == 0"
            - "the failed attempt did not consume a version: fresh_v equals stale_v + 1"

      - name: parts_allocation_with_a_stale_part_version_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.RemedyPart
          - validations.priority_21
          - errors.ERR_STALE_PART_VERSION
        distinguishing_aspect: |
          Two allocations race for the same inventory: the first one succeeds and bumps the part version,
          so the second -- still carrying the version captured at part creation -- is refused with 412 and
          the part's unallocated_qty stays exactly where the first allocation left it.
        test_recipe:
          setup:
            - "Campaign 26V-343 is FILED and owns part P-88343 with 100 units; the version token is captured at part creation."
            - "Dealers D-NE-01 and D-NE-02 exist in NE with capacity 40 each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-343", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
