            - "DesignationReview.${rev_b}.volume_subscore == 100.00 — min(1, 300 / (300 / 2)) is capped at 1"
            - "DesignationReview.${rev_b}.staffing_subscore == 0.00 and equipment_subscore == 0.00 — Community Hospital B holds no RN_NICU_CORE credential and no ventilator"
            - "DesignationReview.${rev_b}.compliance_score == 20.00 (0.45*0 + 0.35*0 + 0.20*100)"
            - "Both reviews are SUBMITTED with submission_round == 1"

      - name: surveillance_period_before_the_unit_existed_is_refused
        claim_type: temporal_validation
        grounds:
          - validations.priority_13
          - errors[ERR_PERIOD_INVALID]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two temporal failures on the same endpoint are graded differently: an
          inverted period is a schema fault (400 at priority 5) while a
          well-formed period that reaches back before the unit's created_at is a
          business-temporal fault (409 at priority 13).
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A was created at 2026-08-01T00:00:00Z."
          setup_api_calls:
