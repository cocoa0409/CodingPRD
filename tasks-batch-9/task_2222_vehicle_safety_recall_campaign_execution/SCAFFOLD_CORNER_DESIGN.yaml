  - section: consistency_model
    instances:
      - name: population_run_response_reflects_the_new_counters_immediately
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - endpoints.POST_recall_campaigns_id_population_runs
          - calculations.population_match
        distinguishing_aspect: |
          The run's own response body already carries the derived counters, and a read issued right after
          it -- with no intervening write -- returns byte-identical figures plus the newly created
          population row, so nothing about the match is deferred to a later recomputation.
        test_recipe:
          setup:
            - "Campaign 26V-346 is DEFECT_DETERMINED with one inclusion rule for PLT1/MDLA/2024 and one matching NE build record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-346", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "GET /recall-campaigns/${camp_id}"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "GET /affected-vehicles"
              payload: { campaign_id: "${camp_id}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { av1_id: "$.data[0].id" }
          assert:
            - "the run returned HTTP 200 with matched_count == 1, excluded_count == 0, removed_count == 0, affected_vehicle_count == 1 and recall_population_count == 1"
            - "the campaign read immediately afterwards shows affected_vehicle_count == 1, recall_population_count == 1, remedied_count == 0 and completion_rate_pct == 0.00"
            - "the population read immediately afterwards returns total_count == 1 with vehicle_id == ${veh1_id}, remedy_status == \"UNREPAIRED\", notice_count == 0 and outreach_attempt_count == 0"
            - "no additional run is needed for the counters to appear: the same values are visible on the very next request"
