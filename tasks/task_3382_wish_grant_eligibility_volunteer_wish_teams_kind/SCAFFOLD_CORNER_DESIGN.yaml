            - "dob 2024-03-02 (29 months): err == ERR_CHILD_AGE_OUT_OF_RANGE"

      - name: territory_empty_candidate_set_returns_error
        claim_type: violation_to_error
        grounds: ["calculations.territory_assignment", "errors[ERR_NO_TERRITORY_CHAPTER]"]
        distinguishing_aspect: "Selector fallback: a child zip matching no chapter prefix fails the whole referral creation with 422 ERR_NO_TERRITORY_CHAPTER (no child or referral record is created)."
