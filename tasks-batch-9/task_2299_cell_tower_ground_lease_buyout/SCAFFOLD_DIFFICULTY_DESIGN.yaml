      - name: revenue_share_cumulative_reconciles_after_amendment_reversal
        grounds:
          - calculations.amendment_revenue_share_split
          - state_machines.AmendmentEvent.RECORDED_to_REVERSED
          - entities.LeaseStream.fields.cumulative_revenue_share_landowner_cents
          - entities.LeaseStream.fields.cumulative_revenue_share_acquirer_cents
        distinguishing_aspect: |
          The invariant is the revenue-share identity cumulative_landowner + cumulative_acquirer ==
          sum(net_amount_cents) over RECORDED events, and the compensation is the event reversal: two
          identical 1000002 cent colocations accumulate 500002 / 1500002 through per-event rounding, and
          reversing one subtracts exactly that event's 250001 / 750001 rather than half of the total,
          which is what a sum-then-round ledger would have stored.
