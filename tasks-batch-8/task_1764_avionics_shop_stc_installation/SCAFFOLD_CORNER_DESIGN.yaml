      - name: inspector_verify_own_performed_work_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.InstallTask.fields.performed_by_user_id"]
        distinguishing_aspect: "Segregation of duties: an Inspector whose X-User-ID equals performed_by_user_id (tech-1 completed it) cannot verify — ERR_SEGREGATION_OF_DUTIES; a different Inspector (insp-1) succeeds."
        test_recipe:
          setup: ["work order INSTALLATION; task COMPLETED with performed_by_user_id == tech-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Sod Sarah", contact_email: "s4@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N955SD", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "sod", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "t", estimated_hours: 2.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 2.0 }, as: Technician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "tech-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1", captures: { st: "$.data.status" } }
          assert:
            - "verify by tech-1 (same id as performed_by_user_id): error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "verify by insp-1 succeeds: status == VERIFIED and verified_by_user_id == insp-1"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: panel_design_create_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[panel-design-create-stale-work-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After revision 1 advances WorkOrder.version to 2, a second create still carrying expected_work_order_version 1 is rejected with ERR_STALE_VERSION (412) and supersedes nothing."
        test_recipe:
          setup: ["work order DRAFT with one DRAFT design (created with version 1); work order version now 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Occ Oscar", contact_email: "o3@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N960OC", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "occ", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "rev1", equipment_list: [] }, as: ShopManager, captures: { pd1: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "stale rev2", equipment_list: [] }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION and http status 412"
            - "PanelDesign.${pd1}.status remains DRAFT (rejected create has no supersede side effect)"
            - "WorkOrder.${wo_id}.version == 2 (unchanged by the rejected create)"

      - name: derived_field_reconciliation_covered
        claim_type: derived_field_consistency
        grounds: ["calculations.derived_counts_and_totals"]
        excluded_because:
          difficulty_instance: "compensating_invariant / labor_hours_restored_by_void"
          rationale: "total_actual_labor_hours and tasks_unverified_count reconciliation across complete+void is asserted with literals by the named §1.8 instance."

      - name: dual_variant_layer_covered
        claim_type: variant_divergence
        grounds: ["calculations.weight_balance_recompute", "calculations.labor_billing"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / weight_balance_incremental_vs_full_reweigh"
          rationale: "Both variant pairs (W&B methods, labor estimated-vs-actual) are asserted with computed literals by the two §1.8 dual_variant_calc instances."

      - name: cascading_side_effects_layer_covered
        claim_type: cascade_chain
        grounds: ["state_machines.TestEvent.SCHEDULED_to_FAILED", "state_machines.PanelDesign.SUBMITTED_to_APPROVED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / flight_fail_rework_regresses_work_order"
          rationale: "Both cascade chains (test-fail rework; approval-releases-procurement) are asserted end-to-end by the two §1.8 transitive_cascade instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: read_after_write_immediate_consistency
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "entities.Aircraft.fields.baseline_moment_lb_in"]
        distinguishing_aspect: "Immediate consistency: the POST response and a subsequent GET expose identical stored fields including the computed baseline_moment_lb_in (72000.0) and status AVAILABLE."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Cons Connie", contact_email: "c5@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N970IM", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id", mom: "$.data.baseline_moment_lb_in" } }
            - { call: "GET /avionics/aircraft/${ac_id}", as: Inspector }
          assert:
            - "POST response already carries baseline_moment_lb_in == 72000.0 and status == AVAILABLE (computed at write, visible in same response)"
            - "GET returns identical baseline_moment_lb_in == 72000.0, version == 1 — no lag between write and read"
