  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rights_window_sync_cooldown_buffer
        grounds:
          - validations[priority=14]
          - entities.RightsWindow.fields.term_start
          - entities.RightsWindow.fields.term_end
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          RightsWindow SYNC interval arithmetic uses a strict 1-day (86400s) cooldown buffer: a new
          SYNC window beginning exactly at the prior window's term_end (touching) is REJECTED
          because the buffer is not satisfied — distinct from plain half-open arithmetic.
        test_recipe:
          setup:
            - "A recording with an ACTIVE SYNC window [2026-01-01, 2026-02-01); a second SYNC window starting exactly at 2026-02-01 (touching, no 1-day gap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "Label V", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lv_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song O", iswc: "T-000000015-0", pro_affiliation: "NONE", duration_seconds: 200 }
              as: Administrator
              captures: { worko_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${worko_id}", rightsholder_id: "${lv_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${worko_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${worko_id}", isrc: "USAAA1500001", title: "Song O Master", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { reco_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${reco_id}", rightsholder_id: "${lv_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${reco_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${reco_id}", territory: "US", rights_type: "SYNC", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-02-01T00:00:00.000Z" }
              as: Administrator
          trigger:
            - call: "POST /rights-windows"
              payload: { recording_id: "${reco_id}", territory: "US", rights_type: "SYNC", term_start: "2026-02-01T00:00:00.000Z", term_end: "2026-03-01T00:00:00.000Z" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WINDOW_OVERLAP (SYNC requires a 1-day buffer; touching boundary rejected)"

      - name: statement_period_plain_half_open_overlap
        grounds:
          - validations[priority=15]
          - entities.Statement.fields.period_start
          - entities.Statement.fields.period_end
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          A DIFFERENT resource (Statement) with DIFFERENT interval arithmetic: plain half-open
          non-overlap with NO buffer — a second statement that TOUCHES the first at the boundary
          (period_start == prior period_end) is ALLOWED, while an interior overlap is REJECTED.
          Contrast with RightsWindow's buffered SYNC arithmetic.
        test_recipe:
          setup:
            - "R6 with a DRAFT statement [2026-01-01, 2026-02-01) and a touching DRAFT statement [2026-02-01, 2026-03-01). A third statement [2026-01-15, 2026-02-15) interior-overlaps the first."
          setup_api_calls:
            - call: "POST /rightsholders"
              payload: { legal_name: "R6", party_type: "WRITER", payee_country: "US" }
              as: Administrator
              captures: { r6_id: $.data.id }
            - call: "POST /statements"
              payload: { rightsholder_id: "${r6_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z" }
              as: RoyaltyOperator
            - call: "POST /statements"
              payload: { rightsholder_id: "${r6_id}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-03-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { touch_status: $.data.status }
          trigger:
            - call: "POST /statements"
              payload: { rightsholder_id: "${r6_id}", period_start: "2026-01-15T00:00:00.000Z", period_end: "2026-02-15T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { err: $.data.error_id }
          assert:
            - "the touching statement [2026-02-01, 2026-03-01) was created with status DRAFT (touching boundaries allowed — no buffer)"
            - "response error_id == ERR_STATEMENT_PERIOD_OVERLAP for the interior-overlapping [2026-01-15, 2026-02-15)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: finalize_then_reopen_conserves_advance_recoupment
        grounds:
          - state_machines.Statement.DRAFT_to_FINALIZED
          - state_machines.Statement.FINALIZED_to_DRAFT
          - state_machines.Advance.RECOUPED_to_ACTIVE
          - entities.Advance.fields.recouped_cents
        distinguishing_aspect: |
          Conserved quantity = advance outstanding principal (principal_cents - recouped_cents).
          finalize debits recouped_cents by 50000; reopen credits it back by exactly 50000, so
          (principal - recouped) returns to its pre-finalize value and the advance reverts ACTIVE.
        test_recipe:
          setup:
            - "R7 with ACTIVE advance principal 50000 pct 1.0; DRAFT statement gross 112000; finalize then reopen."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "R7", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { r7_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song P", iswc: "T-000000016-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { workp_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workp_id}", rightsholder_id: "${r7_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workp_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workp_id}", isrc: "USAAA1600001", title: "Song P Master", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { recp_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recp_id}", rightsholder_id: "${r7_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${recp_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recp_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-11-01T00:00:00.000Z", term_end: "2026-12-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /advances"
              payload: { rightsholder_id: "${r7_id}", principal_cents: 50000, recoupment_pct: 1.0 }
              as: Administrator
              captures: { advp_id: $.data.id }
            - call: "POST /statements"
              payload: { rightsholder_id: "${r7_id}", period_start: "2026-11-01T00:00:00.000Z", period_end: "2026-12-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmtp_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${recp_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-11-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { uep_id: $.data.id }
            - call: "POST /usage-events/${uep_id}/allocate"
              payload: {}
              as: RoyaltyOperator
            - call: "GET /statements/${stmtp_id}"
              as: RoyaltyOperator
              captures: { stmtp_v1: $.data.version }
            - call: "POST /statements/${stmtp_id}/finalize"
              payload: { expected_statement_version: "${stmtp_v1}" }
              as: RoyaltyOperator
              captures: { stmtp_v2: $.data.version }
          trigger:
            - call: "GET /advances/${advp_id}"
              as: RoyaltyOperator
              captures: { recouped_after_finalize: $.data.recouped_cents }
            - call: "POST /statements/${stmtp_id}/reopen"
              payload: { expected_statement_version: "${stmtp_v2}" }
              as: RoyaltyOperator
          assert:
            - "Advance.${advp_id}.recouped_cents == 50000 after finalize"
            - "Advance.${advp_id}.recouped_cents == 0 after reopen (compensated exactly; outstanding principal back to 50000)"
            - "Advance.${advp_id}.status == ACTIVE after reopen (reverted from RECOUPED)"

      - name: payout_then_reverse_conserves_statement_payable
        grounds:
          - state_machines.Statement.FINALIZED_to_PAID
          - state_machines.Payout.PENDING_to_REVERSED
          - entities.Statement.fields.net_payable_cents
          - entities.Statement.fields.status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = the statement's payable position (net_payable_cents and
          the FINALIZED status). Paying flips FINALIZED->PAID without changing net_payable; reverse
          flips PAID->FINALIZED, returning the statement to the exact payable state it held before
          the payout — net_payable_cents unchanged throughout.
        test_recipe:
          setup:
            - "R8 with a FINALIZED statement net 112000; create payout then reverse it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00.000Z" }
