          trigger:
            - { call: "POST /assistance/awards/${award}/adjust", payload: { new_awarded_amount_cents: 45000, expected_award_version: "${award_v}" }, as: ProgramManager, as_user_id: "pm-1" }
            - { call: "POST /assistance/awards/${award}/void", payload: {}, as: ProgramManager, as_user_id: "pm-1" }
            - call: "GET /assistance/households/${hh}/benefit-summary"
              payload: {}
              as: ProgramManager
              captures: { ytd: $.data.ytd_exposure_cents }
          assert:
            - "after approve: 25000 + 35000 == 60000 == award.awarded_amount_cents (identity at creation)"
            - "after adjust by 15000: allocation on ${sr} == 18750 (floor(25000*15000/60000) = 6250 released) and on ${ss} == 26250 (remainder 8750 released)"
            - "18750 + 26250 == 45000 == award.awarded_amount_cents (identity preserved through proration)"
            - "after void: ${ytd} == 0 (household YTD exposure returns to exact pre-approval baseline)"

      - name: waitlist_candidate_count_conserved
        grounds:
          - calculations.waitlist_promotion_sweep
          - entities.ReplenishmentRun.fields.remaining_waitlisted_count
        distinguishing_aspect: |
          Conserved quantity = waitlist candidate count: 3 candidates before the
          run and promoted (1) + denied (1) + remaining (1) == 3 after, with the
          denial caused by a mid-flight policy swap (ELIGIBILITY_LAPSED) and the
          survivor denied nothing yet still unpromoted for lack of funds.
