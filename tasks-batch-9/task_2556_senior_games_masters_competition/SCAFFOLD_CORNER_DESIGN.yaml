          assert:
            - "${e_slot} == \"ERR_SESSION_SLOT_NOT_FOUND\" and ${e_qual} == \"ERR_QUALIFYING_RESULT_NOT_FOUND\" and ${e_entry} == \"ERR_SPORT_ENTRY_NOT_FOUND\""
            - "${e_screen} == \"ERR_MEDICAL_SCREENING_NOT_FOUND\" and ${e_pers} == \"ERR_PERSONNEL_NOT_FOUND\" and ${e_asg} == \"ERR_PERSONNEL_ASSIGNMENT_NOT_FOUND\""
            - "${e_blk} == \"ERR_ACCOMMODATION_BLOCK_NOT_FOUND\" and ${e_stay} == \"ERR_VILLAGE_STAY_NOT_FOUND\" and ${e_spo} == \"ERR_SPONSORSHIP_COMMITMENT_NOT_FOUND\""
            - "all nine responses carry HTTP 404 and a data object holding exactly error_id and message"
            - "every one of the nine list endpoints called with no filter returns HTTP 200 with total_count == 0, so absence is a 404 only on the single-row path"

      - name: corner_error_missing_x_user_headers_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priorities 1 and 2 answer the same ERR_UNAUTHENTICATED at HTTP 401 for three distinct header defects — X-User-Role absent, X-User-ID empty, and X-User-Role naming a role that is not one of the seven declared names — and they run before the priority-14 path check, so an unknown id under a missing header still answers 401 rather than 404."
        test_recipe:
          setup:
            - "One edition exists so that a well-formed request would otherwise succeed."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
          trigger:
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              captures: { e_no_role: $.data.error_id }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: GamesAdmin
              as_user_id: ""
              captures: { e_empty_user: $.data.error_id }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: Bystander
              captures: { e_bad_role: $.data.error_id }
            - call: "GET /senior-games/games-editions/bbbbbbbb-0001-4000-8000-000000000000"
              payload: {}
              as: Bystander
              captures: { e_bad_role_ghost: $.data.error_id }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: GamesAdmin
              captures: { ok_status: $.data.status }
          assert:
            - "the call issued with no X-User-Role header at all returns HTTP 401 with ${e_no_role} == \"ERR_UNAUTHENTICATED\" (priority 1)"
            - "the call whose X-User-ID header is present but empty returns HTTP 401 with ${e_empty_user} == \"ERR_UNAUTHENTICATED\" (priority 1 requires both headers non-empty)"
            - "the call whose X-User-Role is the undeclared name \"Bystander\" returns HTTP 401 with ${e_bad_role} == \"ERR_UNAUTHENTICATED\" (priority 2), not HTTP 403"
            - "${e_bad_role_ghost} == \"ERR_UNAUTHENTICATED\" with HTTP 401 even though the path id does not exist, because priority 2 runs before the priority-14 path check"
            - "${ok_status} == \"DRAFT\": the same GET with a declared role and a non-empty user id succeeds, so the 401s came from the headers and nothing else"

      - name: corner_error_result_submission_and_reassignment_on_finished_slot_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=48]
          - validations[priority=22]
          - validations[priority=90]
          - errors[ERR_SLOT_NOT_COMPETED]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_RESULT_ALREADY_RECORDED]
          - errors[ERR_ASSIGNMENT_DUPLICATE]
        distinguishing_aspect: "Four otherwise-unreached codes on one slot lifecycle: submitting before the slot starts and verifying before it finishes both answer ERR_SLOT_NOT_COMPETED from the same rule with two different state sets, a foreign X-User-ID answers ERR_NOT_RESOURCE_OWNER, a second result on the same entry answers ERR_RESULT_ALREADY_RECORDED, and re-assigning the same official to the now-COMPLETED slot answers ERR_ASSIGNMENT_DUPLICATE — the conflict scan at priority 66 cannot see that pair because it skips COMPLETED assignments and non-live slots, so priority 90 is the rule that fires."
        test_recipe:
          setup:
            - "Standard fixture carried to a staged event: one 60-64 TRACK event with one ACCEPTED entry for Ada Fenn (paid 15500), the event SEEDED, one 09:00-10:00 slot at North Oval requiring one official, and official Dana Reyes (certification_level 3, certified for TRACK) assigned as JUDGE and CONFIRMED."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_id: $.data.id }
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 15500 }
              as: GamesAdmin
            - call: "POST /senior-games/medical-screenings"
