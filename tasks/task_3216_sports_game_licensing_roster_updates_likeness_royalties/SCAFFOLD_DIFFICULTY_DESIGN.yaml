              as_user_id: "op-42"
          trigger:
            - call: "POST /licensing/roster-batches/${b2_id}/publish"
              payload: { expected_season_version: "${sv1}" }
              as: RosterReviewer
              as_user_id: "op-42"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (priority 6 business_safety beats priority 10 OCC state)"
            - "HTTP status == 409 (not 412)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: audit_window_boundary_day_exactly_allowed
        grounds:
          - state_machines.RoyaltyStatement.FINALIZED_to_DISPUTED
          - errors[ERR_AUDIT_WINDOW_MISSED]
        distinguishing_aspect: |
          Numeric threshold metric: audit_window_days. Opening an audit exactly
          audit_window_days after finalization is allowed (<=), one day later
          returns ERR_AUDIT_WINDOW_MISSED — tested through POST /licensing/audit-cases.
        test_recipe:
          setup:
            - "Agreement ACTIVE with audit_window_days=30"
            - "Two statements S1 and S2 (same period 2026-08-01..2026-08-31, identical numbers) both FINALIZED at clock 2026-09-10"
            - "Clock advanced to exactly 2026-10-10 (30 days after finalization) for the first audit, then 2026-10-11 (31 days) for the second"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 30 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 500000, returns_cents: 0, pending_sales_cents: 0 }
              as: FinanceController
              captures: { stmt1_id: $.data.id }
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 500000, returns_cents: 0, pending_sales_cents: 0 }
              as: FinanceController
              captures: { stmt2_id: $.data.id }
            - call: "POST /licensing/royalty-statements/${stmt1_id}/compute-provisional"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/royalty-statements/${stmt2_id}/compute-provisional"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements/${stmt1_id}/finalize"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/royalty-statements/${stmt2_id}/finalize"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/audit-cases"
              payload: { agreement_id: "${agr_id}", statement_id: "${stmt1_id}", opened_by_role: "LEAGUE_AUDITOR" }
              as: LeagueAuditor
              captures: { case_id: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: LicensingAdmin
            - call: "POST /licensing/audit-cases"
              payload: { agreement_id: "${agr_id}", statement_id: "${stmt2_id}", opened_by_role: "UNION_AUDITOR" }
              as: UnionAuditor
              captures: { err: $.data.error_id }
          assert:
            - "First audit at exactly +30 days succeeds (201, audit_status == OPEN, statement S1 -> DISPUTED)"
            - "Second audit at +31 days against still-FINALIZED statement S2 fails with ERR_AUDIT_WINDOW_MISSED (boundary is inclusive at exactly audit_window_days)"

      - name: empty_roster_batch_rejected_at_validate
        grounds:
          - state_machines.RosterBatch.DRAFT_to_VALIDATED
          - errors[ERR_EMPTY_BATCH]
        distinguishing_aspect: |
          Empty-collection metric (count of entries == 0), distinct from the
          numeric audit-window threshold; reachable through a different endpoint
          (POST /licensing/roster-batches/{id}/validate).
        test_recipe:
          setup:
            - "Agreement ACTIVE; season PRELAUNCH; batch B with zero RosterEntry rows"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "EMPTY", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EMPTY_BATCH (count == 0 rejected; >= 1 required)"
            - "HTTP status == 409"
            - "RosterBatch.${batch_id}.batch_status remains DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: roster_entry_validation_depends_on_athlete_eligibility
        grounds:
          - state_machines.RosterBatch.DRAFT_to_VALIDATED
          - entities.Athlete.fields.athlete_status
          - errors[ERR_ATHLETE_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair RosterBatch -> Athlete: batch validate requires every ADD /
          UPDATE_ATTRIBUTE entry's athlete to have athlete_status == ELIGIBLE,
          which is itself derived from LikenessGrant state on a third entity.
        test_recipe:
          setup:
            - "Agreement ACTIVE; season PRELAUNCH; athlete registered WITHOUT any likeness grant (athlete_status == INELIGIBLE); batch contains an ADD entry for that athlete"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "No Grant", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "B", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
          trigger:
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ATHLETE_NOT_ELIGIBLE (409)"
            - "RosterBatch.${batch_id}.batch_status remains DRAFT"

      - name: season_launch_depends_on_agreement_active
        grounds:
          - state_machines.LiveSeason.PRELAUNCH_to_LIVE
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - errors[ERR_REFERENCE_STATE]
        distinguishing_aspect: |
          Pair LiveSeason -> LicenseAgreement (different pair than
          RosterBatch -> Athlete): launch requires the governing agreement to be
          ACTIVE; a SUSPENDED agreement blocks launch with ERR_REFERENCE_STATE
          even when a roster batch is published and the clock is in window.
        test_recipe:
          setup:
            - "Agreement created and then SUSPENDED before season launch; season PRELAUNCH with a PUBLISHED roster batch; clock in season window"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "Launch Back", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-escrow-9" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/agreements/${agr_id}/suspend"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_STATE (409) because LicenseAgreement is SUSPENDED, not ACTIVE"
            - "LiveSeason.${season_id}.season_status remains PRELAUNCH"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_agreement_overlap_shared_single_day_conflicts
        grounds:
          - calculations.license_exclusivity_overlap
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
          - errors[ERR_EXCLUSIVITY_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = closed date intervals on LicenseAgreement terms:
          two exclusive agreements in the same sport_category conflict when
          their [start, end] ranges share at least one calendar day; adjacent
          terms (end D, start D+1) do not conflict.
        test_recipe:
          setup:
            - "Agreement A ACTIVE, CATEGORY-exclusive, AMFOOT_PRO, 2026-01-01..2026-06-30"
            - "Agreement B DRAFT, CATEGORY-exclusive, AMFOOT_PRO, 2026-06-30..2026-12-31 (shares the single day 2026-06-30)"
            - "Agreement C DRAFT, CATEGORY-exclusive, AMFOOT_PRO, 2026-07-01..2026-12-31 (adjacent, zero shared days)"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "League A", exclusivity_scope: "CATEGORY", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-06-30", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { a_id: $.data.id }
            - call: "POST /licensing/agreements/${a_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "League B", exclusivity_scope: "CATEGORY", sport_category: "AMFOOT_PRO", term_start_on: "2026-06-30", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1100, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { b_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "League C", exclusivity_scope: "CATEGORY", sport_category: "AMFOOT_PRO", term_start_on: "2026-07-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1100, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements/${b_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { err_b: $.data.error_id }
            - call: "POST /licensing/agreements/${c_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { c_status: $.data.agreement_status }
          assert:
            - "Agreement B activation fails with ERR_EXCLUSIVITY_CONFLICT (shared day 2026-06-30 => intersection length 1 > 0)"
            - "Agreement C activation succeeds (adjacent, zero shared days) and agreement_status == ACTIVE"

      - name: edition_release_embargo_threshold_semantics
        grounds:
          - calculations.edition_embargo_window
          - state_machines.RegionalEdition.APPROVED_to_RELEASED
          - errors[ERR_TEMPORAL_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics than agreement overlap: the embargo is a
          single-sided threshold with an inclusive >= boundary (release allowed
          exactly ON embargo_until_on), not a pairwise interval intersection;
          it sits on RegionalEdition, a different resource than LicenseAgreement.
        test_recipe:
          setup:
            - "Agreement ACTIVE; season LIVE; edition APPROVED with embargo_until_on=2026-10-01; clock first at 2026-09-30 (before), then exactly 2026-10-01 (boundary)"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "BASKET_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "HOOPS26", sport_category: "BASKET_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "Embargo Guard", sport_category: "BASKET_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-escrow-10" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/editions"
              payload: { season_id: "${season_id}", region_code: "CN", censorship_flags: ["NO_REAL_PLAYER_NAMES"], embargo_until_on: "2026-10-01" }
              as: LiveOpsManager
              captures: { ed_id: $.data.id }
            - call: "POST /licensing/editions/${ed_id}/submit-review"
              payload: {}
              as: LiveOpsManager
              as_user_id: "ops-7"
            - call: "POST /licensing/editions/${ed_id}/approve"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "cr-1"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/editions/${ed_id}/release"
              payload: {}
              as: LiveOpsManager
              captures: { err_early: $.data.error_id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: LicensingAdmin
            - call: "POST /licensing/editions/${ed_id}/release"
              payload: {}
              as: LiveOpsManager
              captures: { st_ok: $.data.edition_status }
          assert:
            - "Release one day before embargo fails with ERR_TEMPORAL_CONFLICT"
            - "Release exactly ON embargo_until_on succeeds (>= inclusive): edition_status == RELEASED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
