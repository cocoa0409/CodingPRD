# =============================================================================
# Task 1139 — Contingent Labor Rate Card & Statement-of-Work Management
# Scaffold seed tables (single source of truth for PRD / tests / implementation)
# =============================================================================

scenario: |
  1139. Contingent Labor Rate Card & Statement-of-Work Management (contingent
  workforce program office): rate card by role/skill/geography & markup
  transparency, requisition vs SOW classification & misclassification risk,
  supplier tiering & distribution rules, milestone/deliverable acceptance &
  payment, tenure limits & conversion-to-employee fees, timesheet approval &
  rate compliance audit, worker onboarding/offboarding coordination, spend
  visibility & consolidation savings

domain_name: contingent-labor-rate-card-sow
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All dates are ISO strings YYYY-MM-DD; all datetimes ISO 8601 UTC.
# All money is integer cents.
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal supplier name" }
      - { name: supplier_code, type: string, source: input, description: "Unique short code; used as deterministic tie-break after created_at", constraints: "unique across suppliers" }
      - { name: tier, type: enum, source: input, description: "PREFERRED | APPROVED | PROBATION; initial tier at onboarding, later recomputed by supplier_tier_score evaluation", constraints: "enum {PREFERRED, APPROVED, PROBATION}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; lifecycle state", default: ACTIVE }
      - { name: tier_score, type: integer, source: computed, description: "0-100 score from supplier_tier_score calculation; null until first scored evaluation", default: null }
      - { name: offers_made_count, type: integer, source: system, description: "Total DistributionOffers ever created for this supplier", default: 0 }
      - { name: offers_filled_count, type: integer, source: system, description: "Offers that reached CONSUMED (assignment created)", default: 0 }
      - { name: open_offers_count, type: integer, source: system, description: "Offers currently OFFERED (outstanding distribution slots)", default: 0 }
      - { name: completed_assignments_count, type: integer, source: system, description: "Assignments that reached COMPLETED", default: 0 }
      - { name: open_violation_count, type: integer, source: system, description: "ComplianceAudits in OPEN or ACKNOWLEDGED linked to this supplier", default: 0 }
      - { name: milestones_delivered_count, type: integer, source: system, description: "Milestones delivered by this supplier (incremented on each deliver transition)", default: 0 }
      - { name: milestones_accepted_count, type: integer, source: system, description: "Milestones of this supplier ever accepted", default: 0 }
      - { name: spend_ytd_cents, type: integer, source: computed, description: "Sum of SpendLedgerEntry.delta_cents for this supplier (approved spend, net of voids)", default: 0 }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: role_code, type: string, source: input, description: "Role key, e.g. SOFTWARE_ENGINEER" }
      - { name: skill_code, type: string, source: input, description: "Skill key, e.g. JAVA" }
      - { name: geo_code, type: string, source: input, description: "Geography key, e.g. US-CA" }
      - { name: currency, type: string, source: input, description: "ISO 4217 currency code" }
      - { name: pay_rate_floor_cents, type: integer, source: input, description: "Minimum allowed pay rate per hour" }
      - { name: bill_rate_ceiling_cents, type: integer, source: input, description: "Maximum allowed bill rate per hour" }
      - { name: max_markup_pct, type: number, source: input, description: "Maximum markup fraction allowed by this card, e.g. 0.25" }
      - { name: effective_from, type: string, source: input, description: "Window start date YYYY-MM-DD; half-open window [effective_from, effective_to)" }
      - { name: effective_to, type: string, source: input, description: "Window end date YYYY-MM-DD, exclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }
      - { name: supersedes_id, type: string, source: system, description: "FK -> RateCard.id; set on a revision card pointing to the card it revises; null on originals", default: null }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Engagement title" }
      - { name: engagement_type, type: enum, source: input, description: "REQUISITION (staff augmentation, timesheet-billed) | SOW (milestone-billed); immutable after creation", constraints: "enum {REQUISITION, SOW}" }
      - { name: role_code, type: string, source: input, description: "Role key used to resolve the governing RateCard" }
      - { name: skill_code, type: string, source: input, description: "Skill key used to resolve the governing RateCard" }
      - { name: geo_code, type: string, source: input, description: "Geography key used to resolve the governing RateCard" }
      - { name: payment_basis, type: enum, source: input, description: "HOURLY | FIXED", constraints: "enum {HOURLY, FIXED}" }
      - { name: supervision_level, type: enum, source: input, description: "DAILY (client supervises daily work) | MILESTONE (supplier self-manages to deliverables)", constraints: "enum {DAILY, MILESTONE}" }
      - { name: duration_months, type: integer, source: input, description: "Expected engagement duration in whole months" }
      - { name: budget_cents, type: integer, source: input, description: "Total authorized spend for this engagement" }
      - { name: prorata_conversion, type: boolean, source: input, description: "When true and supplier tier is PREFERRED, conversion fee uses PRORATA variant", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | OPEN | FILLING | ACTIVE | CLOSED", default: DRAFT }
      - { name: misclassification_risk, type: enum, source: computed, description: "LOW | HIGH; computed at submit-review per misclassification_risk rule; null before first review", default: null }
      - { name: classification_note, type: string, source: system, description: "Note from latest classification decision (rework reason or override rationale)", default: null }
      - { name: awarded_supplier_id, type: string, source: system, description: "FK -> Supplier.id; first supplier whose offer was ACCEPTED; null until then", default: null }
      - { name: committed_spend_cents, type: integer, source: computed, description: "Approved spend: sum of APPROVED timesheet final_amount_cents + ACCEPTED milestone amount_cents (committed_spend calc)", default: 0 }
      - { name: budget_audit_raised, type: boolean, source: system, description: "True once the >=95% budget-utilization audit has been auto-created; prevents duplicates", default: false }

  - name: DistributionOffer
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement being staffed" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; supplier selected by distribution_selector" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | CONSUMED | WITHDRAWN | EXPIRED", default: OFFERED }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp when the offer was created" }
      - { name: response_due_at, type: datetime, source: system, description: "offered_at + RESPONSE_WINDOW_DAYS (7 days); offers past due become EXPIRED via expire-sweep" }
      - { name: responded_at, type: datetime, source: system, description: "Logical-clock timestamp of supplier response; null until ACCEPTED/DECLINED", default: null }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; employing supplier (must equal X-User-ID when created by SupplierCoordinator)" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: email, type: string, source: input, description: "Worker email", constraints: "unique across workers" }
      - { name: tenure_carryover_days, type: integer, source: input, description: "Prior-service days credited toward tenure limit", default: 0 }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | OFFBOARDING | EXITED", default: ONBOARDING }
      - { name: conversion_status, type: enum, source: system, description: "NONE | REQUESTED | APPROVED | CONVERTED | DECLINED", default: NONE }
      - { name: cumulative_tenure_days, type: integer, source: computed, description: "tenure_accumulation calc: carryover + inclusive day-spans of non-terminal assignments, ACTIVE assignments counted through the logical clock date" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; must be engagement_type REQUISITION" }
      - { name: offer_id, type: string, source: input, description: "FK -> DistributionOffer.id; must be ACCEPTED and match engagement/supplier" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; copied from the offer" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; must be ACTIVE and match engagement role/skill/geo" }
      - { name: bill_rate_cents, type: integer, source: input, description: "Hourly bill rate charged to client" }
      - { name: pay_rate_cents, type: integer, source: input, description: "Hourly pay rate to worker; markup transparency derives from bill vs pay" }
      - { name: start_date, type: string, source: input, description: "Inclusive start date YYYY-MM-DD (closed interval)" }
      - { name: end_date, type: string, source: input, description: "Inclusive end date YYYY-MM-DD (closed interval)" }
      - { name: actual_end_date, type: string, source: system, description: "Date the assignment reached COMPLETED/TERMINATED; null while PENDING/ACTIVE", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | COMPLETED | TERMINATED", default: PENDING }
      - { name: termination_reason, type: enum, source: system, description: "MANUAL | ENGAGEMENT_CLOSED | CONVERTED; null unless TERMINATED", default: null }

  - name: Timesheet
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: period_start, type: string, source: input, description: "Period start date YYYY-MM-DD; unique per assignment", constraints: "one timesheet per assignment per period_start" }
      - { name: period_end, type: string, source: input, description: "Period end date YYYY-MM-DD, inclusive" }
      - { name: submitted_hours, type: number, source: input, description: "Hours submitted, 2 decimal places, <= 60.00" }
      - { name: approved_hours, type: number, source: system, description: "Hours approved; set at approval (defaults to submitted_hours when not supplied)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED", default: DRAFT }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "timesheet_billing PROVISIONAL variant, computed at submit", default: null }
      - { name: final_amount_cents, type: integer, source: computed, description: "timesheet_billing FINAL variant, computed at approve", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at reject", default: null }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void", default: null }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the Worker who submitted (segregation-of-duties anchor)", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the HiringManager who approved", default: null }

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; SOW engagement only (nested path)" }
      - { name: name, type: string, source: input, description: "Milestone name" }
      - { name: amount_cents, type: integer, source: input, description: "Fixed price paid on acceptance" }
      - { name: due_date, type: string, source: input, description: "Contractual due date YYYY-MM-DD" }
      - { name: acceptance_status, type: enum, source: system, description: "PENDING | DELIVERED | ACCEPTED | REJECTED — parallel dimension 1", default: PENDING }
      - { name: payment_status, type: enum, source: system, description: "UNINVOICED | INVOICED | PAID — parallel dimension 2, driven by Invoice events", default: UNINVOICED }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at milestone reject", default: null }
      - { name: delivered_by_supplier_id, type: string, source: system, description: "Supplier id (X-User-ID) that delivered", default: null }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of the HiringManager who accepted", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; one OPEN invoice per supplier at a time (auto-created on first billable event, or manually created)", default: null }
      - { name: period_start, type: string, source: system, description: "First day of the month of the first attached line's event date (or input on manual create)" }
      - { name: period_end, type: string, source: system, description: "Last day of that month (or input on manual create)" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | PAID | VOIDED", default: OPEN }
      - { name: line_count, type: integer, source: computed, description: "Number of InvoiceLines currently attached", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "invoice_consolidation: integer sum of per-line rounded amounts", default: 0 }
      - { name: processing_fee_cents, type: integer, source: computed, description: "invoice_processing_fee: tiered on pre-fee subtotal", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + processing_fee_cents", default: 0 }
      - { name: consolidation_savings_cents, type: integer, source: computed, description: "(line_count - 1) * LINE_INVOICE_FEE_CENTS when line_count >= 1 else 0", default: 0 }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst who finalized (SoD anchor)", default: null }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst who marked paid; must differ from finalized_by_user_id", default: null }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void", default: null }

  - name: InvoiceLine
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: timesheet_id, type: string, source: system, description: "FK -> Timesheet.id; set when the line sources a timesheet (XOR with milestone_id)", default: null }
      - { name: milestone_id, type: string, source: system, description: "FK -> Milestone.id; set when the line sources a milestone (XOR with timesheet_id)", default: null }
      - { name: amount_cents, type: integer, source: system, description: "Per-line rounded amount in whole cents (rounding happens per line, before invoice summation)" }

  - name: ConversionRequest
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the ACTIVE assignment being converted" }
      - { name: tenure_days_at_request, type: integer, source: computed, description: "tenure_accumulation evaluated at request creation" }
      - { name: fee_variant, type: enum, source: computed, description: "SCHEDULE | PRORATA; conversion_fee variant selection" }
      - { name: fee_cents, type: integer, source: computed, description: "conversion_fee result for the selected variant" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DECLINED | WITHDRAWN | COMPLETED", default: REQUESTED }
      - { name: decline_reason, type: string, source: system, description: "Reason recorded at decline", default: null }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; derived from the audited subject" }
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; set for engagement-level findings (BUDGET_UTILIZATION)", default: null }
      - { name: timesheet_id, type: string, source: system, description: "FK -> Timesheet.id; set when subject is a timesheet", default: null }
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; set when subject is an assignment", default: null }
      - { name: finding, type: enum, source: system, description: "OVER_RATE | MARKUP_EXCEEDED | TENURE_RISK | BUDGET_UTILIZATION", constraints: "enum {OVER_RATE, MARKUP_EXCEEDED, TENURE_RISK, BUDGET_UTILIZATION}" }
      - { name: severity, type: enum, source: system, description: "LOW | HIGH", default: HIGH }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED | DISMISSED", default: OPEN }
      - { name: details, type: string, source: system, description: "Machine-generated explanation of the finding" }
      - { name: resolution_note, type: string, source: system, description: "Note recorded at resolve/dismiss", default: null }

  - name: SpendLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id" }
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: timesheet_id, type: string, source: system, description: "FK -> Timesheet.id; set for TIMESHEET_APPROVED/TIMESHEET_VOIDED entries", default: null }
      - { name: milestone_id, type: string, source: system, description: "FK -> Milestone.id; set for MILESTONE_ACCEPTED entries", default: null }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; reserved for invoice-level entries", default: null }
      - { name: entry_type, type: enum, source: system, description: "TIMESHEET_APPROVED | TIMESHEET_VOIDED | MILESTONE_ACCEPTED", constraints: "enum {TIMESHEET_APPROVED, TIMESHEET_VOIDED, MILESTONE_ACCEPTED}" }
      - { name: delta_cents, type: integer, source: system, description: "Signed amount applied to supplier spend (positive on approve/accept, negative on void)" }
      - { name: running_balance_cents, type: integer, source: system, description: "Supplier spend balance after this entry (chronological by created_at)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/suppliers/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "supplier.status == ACTIVE"
        side_effects:
          - "Every DistributionOffer of this supplier in OFFERED becomes WITHDRAWN (cascade down)"
          - "supplier.open_offers_count decremented once per withdrawn offer"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/suppliers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "supplier.status == SUSPENDED"
        side_effects: []

  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/rate-cards/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "rate_card.status == DRAFT"
          - "no other ACTIVE RateCard with identical (role_code, skill_code, geo_code) whose half-open window [effective_from, effective_to) overlaps this card's window; windows touching at exactly one endpoint (adjacent, gap=0) do NOT overlap"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/rate-cards/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "rate_card.status == ACTIVE"
        side_effects: []
      - from: DRAFT
        to: DRAFT
        trigger: "POST /v1/rate-cards/{id}/revisions (OCC supersede)"
        actor: ProgramAdmin
        preconditions:
          - "source rate_card.status == ACTIVE or DRAFT"
          - "expected_rate_card_version matches rate_card.version"
        side_effects:
          - "Creates a new RateCard in DRAFT copying source fields with request overrides; new card's supersedes_id = source id"
          - "increments source RateCard.version by 1"

  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /v1/engagements/{id}/submit-review"
        actor: HiringManager
        preconditions:
          - "engagement.status == DRAFT"
        side_effects:
          - "misclassification_risk computed per misclassification_risk rule and stored"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /v1/engagements/{id}/classification-decision with decision=REWORK"
        actor: ProgramAdmin
        preconditions:
          - "engagement.status == IN_REVIEW"
        side_effects:
          - "classification_note set from request note (cyclic rework loop: DRAFT -> IN_REVIEW -> DRAFT is legal and repeatable)"
      - from: IN_REVIEW
        to: OPEN
        trigger: "POST /v1/engagements/{id}/classification-decision with decision=APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "engagement.status == IN_REVIEW"
          - "misclassification_risk == LOW, OR risk_override_rationale provided (conditional validation)"
        side_effects:
          - "classification_note set from risk_override_rationale when override used"
      - from: OPEN
        to: FILLING
        trigger: "POST /v1/engagements/{id}/distribute"
        actor: ProgramAdmin
        preconditions:
          - "engagement.status == OPEN"
          - "distribution_selector candidate pool non-empty (else ERR_NO_ELIGIBLE_SUPPLIER)"
        side_effects:
          - "Creates one DistributionOffer per selected supplier (top 3 by distribution_selector), offered_at = logical clock, response_due_at = offered_at + 7 days"
          - "For each selected supplier: offers_made_count += 1 and open_offers_count += 1"
      - from: FILLING
        to: ACTIVE
        trigger: "system bubble-up: first DistributionOffer of this engagement becomes ACCEPTED"
        actor: system
        preconditions:
          - "engagement.status == FILLING"
        side_effects:
          - "engagement.awarded_supplier_id set to the accepting supplier (only when currently null)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/engagements/{id}/close"
        actor: HiringManager
        preconditions:
          - "engagement.status == OPEN"
        side_effects:
          - "All OFFERED/ACCEPTED DistributionOffers of this engagement become WITHDRAWN; each supplier.open_offers_count decremented per OFFERED offer withdrawn"
      - from: FILLING
        to: CLOSED
        trigger: "POST /v1/engagements/{id}/close"
        actor: HiringManager
        preconditions:
          - "engagement.status == FILLING"
        side_effects:
          - "All OFFERED/ACCEPTED DistributionOffers of this engagement become WITHDRAWN; supplier.open_offers_count adjusted as above"
          - "All PENDING Assignments of this engagement become TERMINATED with termination_reason=ENGAGEMENT_CLOSED; workers with no remaining PENDING/ACTIVE assignment become OFFBOARDING"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/engagements/{id}/close"
        actor: HiringManager
        preconditions:
          - "engagement.status == ACTIVE"
        side_effects:
          - "Link 1: every PENDING/ACTIVE Assignment of this engagement becomes TERMINATED with termination_reason=ENGAGEMENT_CLOSED, actual_end_date = logical clock date"
          - "Link 2: for each terminated assignment, if its Worker has no remaining assignment in {PENDING, ACTIVE}, worker.status becomes OFFBOARDING (Assignment -> Worker cascade)"
          - "All OFFERED/ACCEPTED DistributionOffers become WITHDRAWN; supplier.open_offers_count adjusted as above"

  - entity: DistributionOffer
    initial_state: OFFERED
    terminal_states: [DECLINED, CONSUMED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/distribution-offers/{id}/respond with action=ACCEPT"
        actor: SupplierCoordinator
        preconditions:
          - "offer.status == OFFERED"
          - "X-User-ID == offer.supplier_id"
          - "supplier.status == ACTIVE"
        side_effects:
          - "supplier.open_offers_count -= 1"
          - "responded_at = logical clock"
          - "bubble-up: if engagement.status == FILLING then engagement becomes ACTIVE and awarded_supplier_id = offer.supplier_id (when null)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /v1/distribution-offers/{id}/respond with action=DECLINE"
        actor: SupplierCoordinator
        preconditions:
          - "offer.status == OFFERED"
          - "X-User-ID == offer.supplier_id"
        side_effects:
          - "supplier.open_offers_count -= 1"
          - "responded_at = logical clock"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /v1/distribution-offers/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "offer.status == OFFERED"
        side_effects:
          - "supplier.open_offers_count -= 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /v1/distribution-offers/expire-sweep (ops-run checkpoint over all offers)"
        actor: ProgramAdmin
        preconditions:
          - "offer.status == OFFERED"
          - "logical clock > offer.response_due_at"
        side_effects:
          - "supplier.open_offers_count -= 1"
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system: POST /v1/assignments succeeds referencing this offer"
        actor: system
        preconditions:
          - "offer.status == ACCEPTED"
        side_effects:
          - "supplier.offers_filled_count += 1"

  - entity: Worker
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system bubble-up: first Assignment of this worker becomes ACTIVE"
        actor: system
        preconditions:
          - "worker.status == ONBOARDING"
        side_effects: []
      - from: ACTIVE
        to: OFFBOARDING
        trigger: "system cascade: worker's last assignment in {PENDING, ACTIVE} reaches a terminal state (also via POST /v1/engagements/{id}/close chain)"
        actor: system
        preconditions:
          - "worker.status == ACTIVE"
          - "no remaining assignment in {PENDING, ACTIVE}"
        side_effects: []
      - from: OFFBOARDING
        to: ACTIVE
        trigger: "system bubble-up: a new Assignment of this worker becomes ACTIVE (cyclic return)"
        actor: system
        preconditions:
          - "worker.status == OFFBOARDING"
        side_effects: []
      - from: OFFBOARDING
        to: EXITED
        trigger: "POST /v1/workers/{id}/offboard-complete"
        actor: ProgramAdmin
        preconditions:
          - "worker.status == OFFBOARDING"
        side_effects: []
      - from: EXITED
        to: ONBOARDING
        trigger: "POST /v1/workers/{id}/rehire"
        actor: ProgramAdmin
        preconditions:
          - "worker.status == EXITED"
        side_effects: []
      - from: ACTIVE
        to: EXITED
        trigger: "system cascade: POST /v1/conversion-requests/{id}/complete converts the worker to employee (offboarding bypassed)"
        actor: system
        preconditions:
          - "worker.status == ACTIVE"
        side_effects:
          - "worker.conversion_status becomes CONVERTED"

  - entity: Assignment
    initial_state: PENDING
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /v1/assignments/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "assignment.status == PENDING"
          - "engagement.status in {FILLING, ACTIVE}"
          - "worker.status in {ONBOARDING, OFFBOARDING, ACTIVE}"
        side_effects:
          - "bubble-up: worker.status becomes ACTIVE when it was ONBOARDING or OFFBOARDING"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/assignments/{id}/extend (in-place extension of end_date)"
        actor: ProgramAdmin
        preconditions:
          - "assignment.status == ACTIVE"
          - "new_end_date > current end_date"
          - "tenure_accumulation projected to new_end_date < TENURE_LIMIT_DAYS (730)"
        side_effects:
          - "assignment.end_date = new_end_date"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /v1/assignments/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "actual_end_date = logical clock date"
          - "supplier.completed_assignments_count += 1"
          - "cascade: if worker has no remaining {PENDING, ACTIVE} assignment, worker.status becomes OFFBOARDING"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/assignments/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "actual_end_date = logical clock date; termination_reason = MANUAL"
          - "cascade: if worker has no remaining {PENDING, ACTIVE} assignment, worker.status becomes OFFBOARDING"

  - entity: Timesheet
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/timesheets/{id}/submit"
        actor: Worker
        preconditions:
          - "timesheet.status in {DRAFT, REJECTED} (resubmission loop: REJECTED -> SUBMITTED is legal)"
          - "assignment.status == ACTIVE"
          - "X-User-ID == assignment.worker_id"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "provisional_amount_cents computed (timesheet_billing PROVISIONAL variant)"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /v1/timesheets/{id}/submit (resubmission)"
        actor: Worker
        preconditions:
          - "timesheet.status == REJECTED"
          - "assignment.status == ACTIVE"
          - "X-User-ID == assignment.worker_id"
        side_effects:
          - "submitted_by_user_id = X-User-ID; rejection_reason cleared"
          - "provisional_amount_cents recomputed"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/timesheets/{id}/approve"
        actor: HiringManager
        preconditions:
          - "timesheet.status == SUBMITTED"
          - "engagement.committed_spend_cents + final_amount_cents <= engagement.budget_cents (exact fit allowed)"
        side_effects:
          - "approved_by_user_id = X-User-ID; approved_hours set (request value or submitted_hours)"
          - "final_amount_cents computed (timesheet_billing FINAL variant with ceiling clamp)"
          - "Cascade link 1: SpendLedgerEntry created (TIMESHEET_APPROVED, +final_amount_cents) and supplier.spend_ytd_cents recomputed"
          - "InvoiceLine created on the supplier's single OPEN invoice (auto-created when none exists); invoice.line_count and subtotal_cents recomputed (invoice_consolidation)"
          - "Cascade link 2: engagement.committed_spend_cents recomputed (committed_spend calc)"
          - "Cascade link 3: when committed_spend_cents crosses to >= 95% of budget_cents and budget_audit_raised is false, a ComplianceAudit (BUDGET_UTILIZATION, severity HIGH) is created with budget_audit_raised set true"
          - "Cascade link 4: that ComplianceAudit creation increments supplier.open_violation_count by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/timesheets/{id}/reject"
        actor: HiringManager
        preconditions:
          - "timesheet.status == SUBMITTED"
        side_effects:
          - "rejection_reason set from request"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /v1/timesheets/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "timesheet.status == APPROVED"
          - "the InvoiceLine sourcing this timesheet sits on an Invoice with status == OPEN"
        side_effects:
          - "void_reason set; compensation: SpendLedgerEntry created (TIMESHEET_VOIDED, -final_amount_cents), supplier.spend_ytd_cents recomputed"
          - "compensation: sourcing InvoiceLine deleted; invoice.line_count and subtotal_cents recomputed"
          - "compensation: engagement.committed_spend_cents recomputed"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /v1/milestones/{id}/deliver"
        actor: SupplierCoordinator
        preconditions:
          - "milestone.acceptance_status in {PENDING, REJECTED} (redelivery loop: REJECTED -> DELIVERED is legal)"
          - "engagement.status == ACTIVE"
          - "X-User-ID == engagement.awarded_supplier_id"
        side_effects:
          - "delivered_by_supplier_id = X-User-ID; rejection_reason cleared; supplier.milestones_delivered_count += 1"
      - from: REJECTED
        to: DELIVERED
        trigger: "POST /v1/milestones/{id}/deliver (redelivery)"
        actor: SupplierCoordinator
        preconditions:
          - "milestone.acceptance_status == REJECTED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == engagement.awarded_supplier_id"
        side_effects:
          - "delivered_by_supplier_id = X-User-ID; rejection_reason cleared; supplier.milestones_delivered_count += 1"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /v1/milestones/{id}/accept"
        actor: HiringManager
        preconditions:
          - "milestone.acceptance_status == DELIVERED"
          - "engagement.committed_spend_cents + milestone.amount_cents <= engagement.budget_cents"
        side_effects:
          - "accepted_by_user_id = X-User-ID (payment_status stays UNINVOICED — parallel dimension unchanged); supplier.milestones_accepted_count += 1"
          - "Cascade link 1: SpendLedgerEntry created (MILESTONE_ACCEPTED, +amount_cents); supplier.spend_ytd_cents recomputed"
          - "InvoiceLine created on supplier's OPEN invoice (auto-created when none); invoice subtotal/line_count recomputed"
          - "Cascade link 2: engagement.committed_spend_cents recomputed"
          - "Cascade link 3: crossing to >= 95% budget utilization auto-creates ComplianceAudit (BUDGET_UTILIZATION) when budget_audit_raised is false"
          - "Cascade link 4: that audit creation increments supplier.open_violation_count by 1"
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /v1/milestones/{id}/reject"
        actor: HiringManager
        preconditions:
          - "milestone.acceptance_status == DELIVERED"
        side_effects:
          - "rejection_reason set from request (payment_status unchanged)"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /v1/invoices/{id}/finalize"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == OPEN"
          - "invoice.line_count >= 1 (empty invoice cannot finalize)"
        side_effects:
          - "invoice_consolidation recomputes subtotal_cents; invoice_processing_fee computes processing_fee_cents and total_cents; consolidation_savings computed"
          - "finalized_by_user_id = X-User-ID"
          - "every Milestone whose line is attached moves payment_status UNINVOICED -> INVOICED (cross-entity)"
      - from: FINALIZED
        to: PAID
        trigger: "POST /v1/invoices/{id}/mark-paid"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == FINALIZED"
          - "X-User-ID != invoice.finalized_by_user_id (segregation of duties)"
        side_effects:
          - "paid_by_user_id = X-User-ID"
          - "every Milestone whose line is attached moves payment_status INVOICED -> PAID"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /v1/invoices/{id}/void"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == FINALIZED"
        side_effects:
          - "void_reason set; every attached InvoiceLine is detached and re-attached to a fresh OPEN invoice for the supplier (auto-created when none)"
          - "every Milestone whose line was attached moves payment_status INVOICED -> UNINVOICED (compensation)"

  - entity: ConversionRequest
    initial_state: REQUESTED
    terminal_states: [DECLINED, WITHDRAWN, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/conversion-requests/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "conversion_request.status == REQUESTED"
        side_effects:
          - "worker.conversion_status becomes APPROVED"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /v1/conversion-requests/{id}/decline"
        actor: ProgramAdmin
        preconditions:
          - "conversion_request.status == REQUESTED"
        side_effects:
          - "decline_reason set; worker.conversion_status becomes DECLINED"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /v1/conversion-requests/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "conversion_request.status == APPROVED"
        side_effects:
          - "the referenced ACTIVE assignment becomes TERMINATED with termination_reason=CONVERTED, actual_end_date = logical clock date"
          - "worker.status becomes EXITED (offboarding bypassed) and worker.conversion_status becomes CONVERTED"

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /v1/compliance-audits/{id}/acknowledge"
        actor: ProgramAdmin
        preconditions:
          - "audit.status == OPEN"
        side_effects: []
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /v1/compliance-audits/{id}/resolve"
        actor: ProgramAdmin
        preconditions:
          - "audit.status == ACKNOWLEDGED"
        side_effects:
          - "resolution_note set; compensation: supplier.open_violation_count -= 1"
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /v1/compliance-audits/{id}/dismiss"
        actor: ProgramAdmin
        preconditions:
          - "audit.status == ACKNOWLEDGED"
        side_effects:
          - "resolution_note set; compensation: supplier.open_violation_count -= 1"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: engagement-amend-stale-version
    parent_entity: Engagement
    write_endpoint: "POST /v1/engagements/{id}/amendments"
    occ_field: expected_engagement_version
    description: |
      Amending an Engagement whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just amended the engagement (a legitimate superseding edit under this
      contract) and the current writer's view of the engagement is stale.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: rate-card-revision-stale-version
    parent_entity: RateCard
    write_endpoint: "POST /v1/rate-cards/{id}/revisions"
    occ_field: expected_rate_card_version
    description: |
      Creating a revision of a RateCard whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just revised the same card and the current writer's view of
      the card is stale.
    error_id: ERR_STALE_RATE_CARD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: markup_transparency_check
    trigger: "POST /v1/assignments (create); also re-evaluated by POST /v1/compliance-audits/run"
    algorithm: threshold
    formula: |
      cap_pct = min(rate_card.max_markup_pct, TIER_MARKUP_CAP[supplier.tier])
      allowed iff bill_rate_cents * 10000 <= pay_rate_cents * (10000 + round(cap_pct * 10000))
      (cross-multiplied integer comparison — no float rounding anywhere)
      markup_pct displayed as (bill_rate_cents - pay_rate_cents) / pay_rate_cents
    input_set: "the assignment's RateCard (as of evaluation time for audits: the ACTIVE card for the engagement key whose window contains the logical clock date) and Supplier"
    constants:
      TIER_MARKUP_CAP_PREFERRED: 0.25
      TIER_MARKUP_CAP_APPROVED: 0.20
      TIER_MARKUP_CAP_PROBATION: 0.15
    precision: "integer cross-multiplication; no rounding"

  - name: timesheet_billing
    trigger: "PROVISIONAL variant at POST /v1/timesheets/{id}/submit; FINAL variant at POST /v1/timesheets/{id}/approve"
    algorithm: aggregation
    formula: |
      PROVISIONAL: provisional_amount_cents = round_half_up(submitted_hours * assignment.bill_rate_cents)
      FINAL:       effective_rate_cents = min(assignment.bill_rate_cents, governing_rate_card.bill_rate_ceiling_cents)
                   final_amount_cents   = round_half_up(approved_hours * effective_rate_cents)
      governing_rate_card = ACTIVE card for the engagement (role_code, skill_code, geo_code)
      whose half-open window contains the logical clock date at approval time.
    input_set: "the single Timesheet being submitted/approved; its Assignment; the governing ACTIVE RateCard"
    constants: {}
    precision: "whole cents, round_half_up applied per timesheet at submit (provisional) and at approve (final)"
    variants:
      - name: PROVISIONAL
        when: "timesheet submit (including resubmission from REJECTED)"
        difference: "uses submitted_hours and the unclamped assignment bill rate; never ledgered"
      - name: FINAL
        when: "timesheet approve"
        difference: "uses approved_hours and min(bill_rate_cents, governing ceiling) — ceiling clamp binds when the governing card changed between submit and approve; only the FINAL amount enters the spend ledger"

  - name: invoice_consolidation
    trigger: "InvoiceLine attach/detach (timesheet approve/void, milestone accept, invoice void) and POST /v1/invoices/{id}/finalize"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED: each line's amount_cents is already a whole-cent
      integer (timesheet finals are rounded per timesheet at approval; milestone
      amounts are integers by definition). The invoice subtotal is the plain
      integer sum of line amounts — never round again at invoice level.
      subtotal_cents = SUM(line.amount_cents)
      line_count     = COUNT(lines)
      The counterfactual "sum raw fractional amounts then round once" is
      FORBIDDEN: it yields different cents (e.g. 22502.5 + 40504.5 -> 63007 vs
      pinned per-line 22503 + 40505 = 63008).
    input_set: "InvoiceLines currently attached to the invoice (voided timesheets' lines are detached, hence excluded)"
    constants: {}
    precision: "integer cents; rounding occurs exclusively per line upstream"

  - name: invoice_processing_fee
    trigger: "POST /v1/invoices/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency made explicit):
      step 1: subtotal = invoice.subtotal_cents              (pre-fee subtotal)
      step 2: fee_rate = 0.015 if subtotal < FEE_TIER_THRESHOLD_CENTS else 0.010
              (the tier is keyed on the PRE-fee subtotal, never on the post-fee
              total — an implementation keying on the post-fee total diverges:
              subtotal 9,999,999 -> fee 150,000 -> total 10,149,999 which crosses
              the threshold, yet the 1.5% rate still applies)
      step 3: processing_fee_cents = round_half_up(subtotal * fee_rate)
      step 4: total_cents = subtotal + processing_fee_cents
    input_set: "the invoice being finalized"
    constants:
      FEE_TIER_THRESHOLD_CENTS: 10000000
      FEE_RATE_BELOW: 0.015
      FEE_RATE_AT_OR_ABOVE: 0.010
    precision: "whole cents, round_half_up on the fee only"

  - name: consolidation_savings
    trigger: "POST /v1/invoices/{id}/finalize"
    algorithm: aggregation
    formula: |
      consolidation_savings_cents = (line_count - 1) * LINE_INVOICE_FEE_CENTS  when line_count >= 1
      (baseline: each line invoiced separately would incur one fee per invoice;
      consolidation incurs exactly one fee for the whole batch)
    input_set: "the invoice being finalized"
    constants:
      LINE_INVOICE_FEE_CENTS: 5000
    precision: "integer cents"

  - name: supplier_tier_score
    trigger: "POST /v1/suppliers/{id}/tier-evaluation (ops-run checkpoint, per supplier)"
    algorithm: weighted_scoring
    formula: |
      if completed_assignments_count < MIN_PLACEMENTS_FOR_SCORING:
          tier_score = null   # insufficient-data branch: tier left unchanged
      else:
          fill_component       = min(1.0, offers_filled_count / max(1, offers_made_count))
          compliance_component = max(0.0, 1 - open_violation_count / max(1, completed_assignments_count))
          acceptance_component = min(1.0, milestones_accepted_count / max(1, milestones_delivered_count))
          (a supplier with no delivered milestones scores 0/1 = 0 on this
           component — the empty-pool branch is pinned, not skipped)
          tier_score = round_half_up(100 * (0.4*fill_component + 0.4*compliance_component + 0.2*acceptance_component))
          tier = PREFERRED if tier_score >= 85
                 APPROVED  if 70 <= tier_score <= 84
                 PROBATION if tier_score < 70
    input_set: "the supplier's own counters: offers_made_count, offers_filled_count, completed_assignments_count, open_violation_count, milestones_delivered_count, milestones_accepted_count"
    constants:
      MIN_PLACEMENTS_FOR_SCORING: 3
      TIER_BAND_PREFERRED_MIN: 85
      TIER_BAND_APPROVED_MIN: 70
    precision: "score rounded to integer, round_half_up; band boundaries are >= (exactly 85 is PREFERRED, exactly 70 is APPROVED)"

  - name: conversion_fee
    trigger: "POST /v1/conversion-requests (computed at request creation; immutable thereafter)"
    algorithm: tiered_pricing
    formula: |
      tenure = tenure_days_at_request (tenure_accumulation at the logical clock date)
      variant selection (pinned):
        PRORATA  iff engagement.prorata_conversion == true AND supplier.tier == PREFERRED
        SCHEDULE otherwise
      SCHEDULE: fee_cents = CONVERSION_BASE_FEE_CENTS * band(tenure)
        band: tenure < 180 -> 1.00 | 180..364 -> 0.75 | 365..544 -> 0.50 | tenure >= 545 -> 0.00
      PRORATA:  fee_cents = round_half_up(CONVERSION_BASE_FEE_CENTS * max(0, 1 - tenure / PRORATA_HORIZON_DAYS))
    input_set: "the ConversionRequest's worker (tenure), assignment's engagement (prorata_conversion) and supplier (tier)"
    constants:
      CONVERSION_BASE_FEE_CENTS: 2500000
      PRORATA_HORIZON_DAYS: 730
    precision: "whole cents, round_half_up (PRORATA); SCHEDULE bands are exact integer multiples"
    variants:
      - name: SCHEDULE
        when: "default — engagement.prorata_conversion false or supplier tier not PREFERRED"
        difference: "flat tiered fee by tenure band (step function)"
      - name: PRORATA
        when: "engagement.prorata_conversion == true AND supplier.tier == PREFERRED"
        difference: "linearly decaying fee; identical tenure yields a different fee than SCHEDULE (e.g. tenure 62: SCHEDULE 2,500,000 vs PRORATA 2,287,671)"

  - name: tenure_accumulation
    trigger: "assignment create, assignment extend, conversion-request create, compliance audit run; also exposed as Worker.cumulative_tenure_days on read"
    algorithm: chronological
    formula: |
      span(a, through_date) = min(a.effective_end, through_date) - a.start_date + 1
        where effective_end = actual_end_date for COMPLETED/TERMINATED,
        end_date for PENDING, and min(end_date, logical clock date) for ACTIVE.
      cumulative_tenure_days = worker.tenure_carryover_days
        + SUM over the worker's assignments with status in {PENDING, ACTIVE, COMPLETED, TERMINATED}
          of max(0, span(assignment, logical clock date))
      Day spans are CLOSED intervals (both endpoints inclusive).
      Extension/create gate: projected = same sum but with the subject
      assignment's end_date replaced by the requested new_end_date; allowed iff
      projected < TENURE_LIMIT_DAYS (exactly 730 is REJECTED — boundary is >=).
    input_set: "all of the worker's assignments in {PENDING, ACTIVE, COMPLETED, TERMINATED}; double-booking prevention guarantees spans never overlap, so plain summation is well-defined"
    constants:
      TENURE_LIMIT_DAYS: 730
    precision: "whole days"

  - name: committed_spend
    trigger: "timesheet approve/void, milestone accept; engagement read"
    algorithm: aggregation
    formula: |
      committed_spend_cents =
          SUM(timesheet.final_amount_cents for timesheets of the engagement's assignments where timesheet.status == APPROVED)
        + SUM(milestone.amount_cents for milestones of the engagement where milestone.acceptance_status == ACCEPTED)
      (SUBMITTED/REJECTED/DRAFT timesheets contribute 0; VOIDED contribute 0;
       DELIVERED/REJECTED milestones contribute 0 — state filter is explicit)
      utilization_pct = committed_spend_cents * 100 / budget_cents
      >=95% crossing (from below to at-or-above) with budget_audit_raised == false
      auto-creates a BUDGET_UTILIZATION ComplianceAudit and sets the flag.
    input_set: "timesheets via assignment.engagement_id with status filter {APPROVED}; milestones via milestone.engagement_id with acceptance filter {ACCEPTED}"
    constants:
      BUDGET_AUDIT_THRESHOLD_PCT: 95
    precision: "integer cents"

  - name: distribution_selector
    trigger: "POST /v1/engagements/{id}/distribute"
    algorithm: weighted_scoring
    formula: |
      eligibility: supplier.status == ACTIVE
                   AND supplier.tier in {PREFERRED, APPROVED}
                   AND supplier.open_offers_count < PARALLEL_CAP[tier]   (PREFERRED 5, APPROVED 3)
      ranking:     (1) tier rank — PREFERRED before APPROVED
                   (2) tier_score DESC, with null treated as 70
                   (3) created_at ASC
                   (4) supplier_code ASC
      selection:   top 3 of the ranked pool; response ordered by selection rank
      empty pool -> ERR_NO_ELIGIBLE_SUPPLIER (no offer created)
    input_set: "all Suppliers"
    constants:
      DISTRIBUTION_FANOUT: 3
      PARALLEL_CAP_PREFERRED: 5
      PARALLEL_CAP_APPROVED: 3
      NULL_SCORE_AS: 70
      RESPONSE_WINDOW_DAYS: 7
    precision: "deterministic total order; id never participates in ranking"

  - name: misclassification_risk
    trigger: "POST /v1/engagements/{id}/submit-review"
    algorithm: threshold
    formula: |
      risk = HIGH when
        (engagement_type == SOW AND (payment_basis == HOURLY OR supervision_level == DAILY))
        OR (engagement_type == REQUISITION AND payment_basis == FIXED)
      else LOW
      HIGH risk blocks classification-decision APPROVE unless risk_override_rationale is provided.
    input_set: "the engagement's own declared fields"
    constants: {}
    precision: "boolean rule, no rounding"

  - name: compliance_audit_evaluation
    trigger: "POST /v1/compliance-audits/run"
    algorithm: threshold
    formula: |
      subject = the given timesheet or assignment (exactly one required)
      governing card = ACTIVE RateCard matching the engagement's
        (role_code, skill_code, geo_code) whose half-open window contains the
        logical clock date (for a timesheet subject: its assignment's card key)
      findings (each produced at most once per run, one ComplianceAudit row each):
        OVER_RATE        when assignment.bill_rate_cents > governing.bill_rate_ceiling_cents   (severity HIGH)
        MARKUP_EXCEEDED  when markup_transparency_check fails against the governing card       (severity HIGH)
        TENURE_RISK      when the assignment is ACTIVE and worker.cumulative_tenure_days
                         >= TENURE_RISK_WARN_DAYS                                              (severity LOW)
      supplier_id on each finding = subject's supplier (assignment.supplier_id, or
      timesheet's assignment's supplier). Each created finding increments
      supplier.open_violation_count by 1.
    input_set: "the single subject; its assignment, worker, engagement and governing rate card"
    constants:
      TENURE_RISK_WARN_DAYS: 700
    precision: "integer comparisons; no rounding"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present, role is a declared role other than Anonymous; missing/unknown/Anonymous role is unauthenticated", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is listed for the endpoint; for entity-backed roles X-User-ID must equal the owning entity id (SupplierCoordinator acts only on its own supplier's offers/milestones/workers; Worker only on own timesheets)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "request shape: required fields present, types valid, enum values in declared sets, dates YYYY-MM-DD, hours <= 2dp; unknown computed/system fields in input are ignored (not an error)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: existence, check: "path identifiers resolve left-to-right (engagement id, then nested id); missing resource", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: state, check: "target resource is in a valid from-state for the requested transition (all action endpoints)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "milestone deliver requires engagement.status == ACTIVE", error_id: ERR_ENGAGEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/milestones/{id}/deliver" }
  - { priority: 6, category: state, check: "timesheet create/submit requires assignment.status == ACTIVE", error_id: ERR_ASSIGNMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/timesheets, POST /v1/timesheets/{id}/submit" }
  - { priority: 7, category: business_safety, check: "supplier.status != SUSPENDED for offer respond/accept, assignment create, milestone deliver", error_id: ERR_SUPPLIER_SUSPENDED, http_status: 422, applies_to: "POST /v1/distribution-offers/{id}/respond, POST /v1/assignments, POST /v1/milestones/{id}/deliver" }
  - { priority: 7, category: business_safety, check: "tenure_accumulation projection below TENURE_LIMIT_DAYS (730) — projected == 730 is rejected", error_id: ERR_TENURE_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /v1/assignments, POST /v1/assignments/{id}/extend" }
  - { priority: 7, category: business_safety, check: "classification APPROVE blocked when misclassification_risk == HIGH unless risk_override_rationale provided", error_id: ERR_MISCLASSIFICATION_RISK, http_status: 422, applies_to: "POST /v1/engagements/{id}/classification-decision" }
  - { priority: 7, category: business_safety, check: "segregation of duties: mark-paid X-User-ID must differ from invoice.finalized_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /v1/invoices/{id}/mark-paid" }
  - { priority: 8, category: business_constraint, check: "no ACTIVE RateCard with same (role_code, skill_code, geo_code) whose half-open window overlaps; adjacency (gap 0) allowed", error_id: ERR_RATE_CARD_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /v1/rate-cards/{id}/activate" }
  - { priority: 8, category: business_constraint, check: "worker's non-terminal assignments use closed inclusive intervals; any shared day (even a single touching day) conflicts", error_id: ERR_WORKER_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /v1/assignments" }
  - { priority: 8, category: business_constraint, check: "one timesheet per assignment per period_start", error_id: ERR_DUPLICATE_TIMESHEET_PERIOD, http_status: 409, applies_to: "POST /v1/timesheets" }
  - { priority: 8, category: business_constraint, check: "no second ConversionRequest for a worker while one is REQUESTED or APPROVED", error_id: ERR_CONVERSION_ALREADY_REQUESTED, http_status: 409, applies_to: "POST /v1/conversion-requests" }
  - { priority: 8, category: business_constraint, check: "manual invoice create requires no existing OPEN invoice for the supplier", error_id: ERR_INVOICE_ALREADY_OPEN, http_status: 409, applies_to: "POST /v1/invoices" }
  - { priority: 8, category: business_constraint, check: "submitted_hours <= 60.00 (exactly 60.00 allowed)", error_id: ERR_HOURS_EXCEED_MAX, http_status: 422, applies_to: "POST /v1/timesheets" }
  - { priority: 8, category: business_constraint, check: "distribution_selector pool non-empty", error_id: ERR_NO_ELIGIBLE_SUPPLIER, http_status: 422, applies_to: "POST /v1/engagements/{id}/distribute" }
  - { priority: 9, category: business_temporal, check: "timesheet [period_start, period_end] inside assignment [start_date, end_date]", error_id: ERR_PERIOD_OUTSIDE_ASSIGNMENT, http_status: 422, applies_to: "POST /v1/timesheets" }
  - { priority: 9, category: business_temporal, check: "governing rate card's half-open window contains assignment start_date", error_id: ERR_CARD_NOT_EFFECTIVE, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 10, category: business_referential, check: "rate_card.status == ACTIVE and card key matches engagement (role_code, skill_code, geo_code)", error_id: ERR_RATE_CARD_INACTIVE, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 10, category: business_referential, check: "engagement_type gate: assignments only on REQUISITION, milestones only on SOW", error_id: ERR_ENGAGEMENT_TYPE_MISMATCH, http_status: 422, applies_to: "POST /v1/assignments, POST /v1/engagements/{id}/milestones" }
  - { priority: 10, category: business_referential, check: "offer.status == ACCEPTED and offer.engagement_id == engagement_id", error_id: ERR_OFFER_NOT_ACCEPTED, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 10, category: business_referential, check: "worker.supplier_id == offer.supplier_id", error_id: ERR_WORKER_SUPPLIER_MISMATCH, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 11, category: business_fiscal, check: "bill_rate_cents <= rate_card.bill_rate_ceiling_cents (exactly equal allowed)", error_id: ERR_RATE_ABOVE_CEILING, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 11, category: business_fiscal, check: "markup_transparency_check passes against min(card cap, tier cap)", error_id: ERR_MARKUP_ABOVE_CAP, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 11, category: business_fiscal, check: "pay_rate_cents >= rate_card.pay_rate_floor_cents", error_id: ERR_PAY_BELOW_FLOOR, http_status: 422, applies_to: "POST /v1/assignments" }
  - { priority: 11, category: business_fiscal, check: "engagement.committed_spend_cents + new amount <= budget_cents (exact fit allowed)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /v1/timesheets/{id}/approve, POST /v1/milestones/{id}/accept" }
  - { priority: 11, category: business_fiscal, check: "invoice.line_count >= 1 at finalize", error_id: ERR_INVOICE_EMPTY, http_status: 422, applies_to: "POST /v1/invoices/{id}/finalize" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Sets the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. All server-stamped timestamps (created_at, updated_at, offered_at, responded_at, etc.) read this logical clock, so entities created under a frozen clock share identical created_at values.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["all time-dependent rules (tenure, windows, offer expiry) evaluate against this clock"] }

  # --- rate cards ---
  - { method: POST, path: "/v1/rate-cards", description: "Create a rate card in DRAFT", roles: [ProgramAdmin], code: 201, input: [role_code, skill_code, geo_code, currency, pay_rate_floor_cents, bill_rate_ceiling_cents, max_markup_pct, effective_from, effective_to], output: RateCard, side_effects: [] }
  - { method: GET, path: "/v1/rate-cards", description: "List rate cards with filters", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["role_code?", "skill_code?", "geo_code?", "status?", "supersedes_id?", "limit?", "offset?"], output: "RateCard[]", side_effects: [] }
  - { method: GET, path: "/v1/rate-cards/{id}", description: "Get one rate card", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: RateCard, side_effects: [] }
  - { method: POST, path: "/v1/rate-cards/{id}/activate", description: "DRAFT -> ACTIVE; enforces half-open window non-overlap per key", roles: [ProgramAdmin], code: 200, input: [], output: RateCard, side_effects: ["status transition"] }
  - { method: POST, path: "/v1/rate-cards/{id}/retire", description: "ACTIVE -> RETIRED", roles: [ProgramAdmin], code: 200, input: [], output: RateCard, side_effects: ["status transition"] }
  - { method: POST, path: "/v1/rate-cards/{id}/revisions", description: "OCC supersede: creates a new DRAFT card copying this card with overrides; new card supersedes_id = this id", roles: [ProgramAdmin], code: 201, input: [expected_rate_card_version, "pay_rate_floor_cents?", "bill_rate_ceiling_cents?", "max_markup_pct?", "effective_from?", "effective_to?"], output: RateCard, side_effects: ["creates new RateCard DRAFT", "increments RateCard.version by 1"] }

  # --- suppliers ---
  - { method: POST, path: "/v1/suppliers", description: "Onboard a supplier with an initial tier", roles: [ProgramAdmin], code: 201, input: [name, supplier_code, tier], output: Supplier, side_effects: [] }
  - { method: GET, path: "/v1/suppliers", description: "List suppliers", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["tier?", "status?", "limit?", "offset?"], output: "Supplier[]", side_effects: [] }
  - { method: GET, path: "/v1/suppliers/{id}", description: "Get one supplier (includes computed tier_score, counters, spend_ytd_cents)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Supplier, side_effects: [] }
  - { method: POST, path: "/v1/suppliers/{id}/suspend", description: "ACTIVE -> SUSPENDED; withdraws its OFFERED offers", roles: [ProgramAdmin], code: 200, input: [], output: Supplier, side_effects: ["offers OFFERED -> WITHDRAWN", "open_offers_count decremented"] }
  - { method: POST, path: "/v1/suppliers/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Supplier, side_effects: [] }
  - { method: POST, path: "/v1/suppliers/{id}/tier-evaluation", description: "Ops-run checkpoint: recompute supplier_tier_score and tier band from counters; insufficient data leaves tier unchanged", roles: [ProgramAdmin], code: 200, input: [], output: Supplier, side_effects: ["supplier_tier_score calc", "tier may change"] }

  # --- engagements ---
  - { method: POST, path: "/v1/engagements", description: "Create an engagement in DRAFT", roles: [HiringManager], code: 201, input: [title, engagement_type, role_code, skill_code, geo_code, payment_basis, supervision_level, duration_months, budget_cents, "prorata_conversion?"], output: Engagement, side_effects: [] }
  - { method: GET, path: "/v1/engagements", description: "List engagements", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["status?", "engagement_type?", "awarded_supplier_id?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/v1/engagements/{id}", description: "Get one engagement (includes committed_spend_cents, misclassification_risk)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/v1/engagements/{id}/submit-review", description: "DRAFT -> IN_REVIEW; computes misclassification_risk", roles: [HiringManager], code: 200, input: [], output: Engagement, side_effects: ["misclassification_risk computed"] }
  - { method: POST, path: "/v1/engagements/{id}/classification-decision", description: "IN_REVIEW -> OPEN (APPROVE, blocked on HIGH risk without override) or IN_REVIEW -> DRAFT (REWORK)", roles: [ProgramAdmin], code: 200, input: [decision, "risk_override_rationale?", "note?"], output: Engagement, side_effects: ["status transition", "classification_note set"] }
  - { method: POST, path: "/v1/engagements/{id}/distribute", description: "OPEN -> FILLING; runs distribution_selector and creates offers for the top 3 suppliers, response ordered by selection rank", roles: [ProgramAdmin], code: 201, input: [], output: "DistributionOffer[]", side_effects: ["offers created", "supplier offers_made_count/open_offers_count incremented"] }
  - { method: POST, path: "/v1/engagements/{id}/amendments", description: "OCC amendment of budget_cents/duration_months/title on non-terminal engagements", roles: [HiringManager], code: 200, input: [expected_engagement_version, "budget_cents?", "duration_months?", "title?"], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/v1/engagements/{id}/close", description: "OPEN/FILLING/ACTIVE -> CLOSED; cascades assignment termination and worker offboarding", roles: [HiringManager], code: 200, input: [], output: Engagement, side_effects: ["assignments TERMINATED (ENGAGEMENT_CLOSED)", "workers with no open assignment -> OFFBOARDING", "offers withdrawn"] }

  # --- distribution offers ---
  - { method: GET, path: "/v1/distribution-offers", description: "List offers (reverse reachability for engagement_id and supplier_id)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: ["engagement_id?", "supplier_id?", "status?", "limit?", "offset?"], output: "DistributionOffer[]", side_effects: [] }
  - { method: GET, path: "/v1/distribution-offers/{id}", description: "Get one offer", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: [], output: DistributionOffer, side_effects: [] }
  - { method: POST, path: "/v1/distribution-offers/{id}/respond", description: "Supplier responds ACCEPT or DECLINE; first ACCEPT bubbles engagement to ACTIVE and sets awarded_supplier_id", roles: [SupplierCoordinator], code: 200, input: [action], output: DistributionOffer, side_effects: ["open_offers_count decremented", "engagement bubble-up on first ACCEPT"] }
  - { method: POST, path: "/v1/distribution-offers/{id}/withdraw", description: "ProgramAdmin withdraws an OFFERED offer", roles: [ProgramAdmin], code: 200, input: [], output: DistributionOffer, side_effects: ["open_offers_count decremented"] }
  - { method: POST, path: "/v1/distribution-offers/expire-sweep", description: "Ops-run checkpoint: every OFFERED offer with response_due_at < logical clock becomes EXPIRED; returns count", roles: [ProgramAdmin], code: 200, input: [], output: { expired_count: integer }, side_effects: ["offers OFFERED -> EXPIRED", "open_offers_count decremented per expired offer"] }

  # --- workers ---
  - { method: POST, path: "/v1/workers", description: "Register a worker employed by a supplier (SupplierCoordinator may only register under its own supplier id)", roles: [SupplierCoordinator, ProgramAdmin], code: 201, input: [supplier_id, full_name, email, "tenure_carryover_days?"], output: Worker, side_effects: [] }
  - { method: GET, path: "/v1/workers", description: "List workers", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["supplier_id?", "status?", "limit?", "offset?"], output: "Worker[]", side_effects: [] }
  - { method: GET, path: "/v1/workers/{id}", description: "Get one worker (includes cumulative_tenure_days)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Worker, side_effects: [] }
  - { method: POST, path: "/v1/workers/{id}/offboard-complete", description: "OFFBOARDING -> EXITED", roles: [ProgramAdmin], code: 200, input: [], output: Worker, side_effects: ["status transition"] }
  - { method: POST, path: "/v1/workers/{id}/rehire", description: "EXITED -> ONBOARDING (cyclic rehire)", roles: [ProgramAdmin], code: 200, input: [], output: Worker, side_effects: ["status transition"] }

  # --- assignments ---
  - { method: POST, path: "/v1/assignments", description: "Book a worker onto a REQUISITION engagement via an ACCEPTED offer; runs markup/ceiling/floor, double-booking, tenure and referential checks; offer becomes CONSUMED", roles: [ProgramAdmin], code: 201, input: [worker_id, engagement_id, offer_id, rate_card_id, bill_rate_cents, pay_rate_cents, start_date, end_date], output: Assignment, side_effects: ["offer ACCEPTED -> CONSUMED", "supplier.offers_filled_count += 1"] }
  - { method: GET, path: "/v1/assignments", description: "List assignments", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["worker_id?", "engagement_id?", "supplier_id?", "rate_card_id?", "offer_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/v1/assignments/{id}", description: "Get one assignment", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/v1/assignments/{id}/activate", description: "PENDING -> ACTIVE; bubbles worker to ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Assignment, side_effects: ["worker ONBOARDING/OFFBOARDING -> ACTIVE"] }
  - { method: POST, path: "/v1/assignments/{id}/extend", description: "Extend end_date; tenure projection must stay < 730 days", roles: [ProgramAdmin], code: 200, input: [new_end_date], output: Assignment, side_effects: ["end_date updated"] }
  - { method: POST, path: "/v1/assignments/{id}/terminate", description: "ACTIVE -> TERMINATED (MANUAL)", roles: [ProgramAdmin], code: 200, input: [], output: Assignment, side_effects: ["worker OFFBOARDING when no open assignment remains"] }
  - { method: POST, path: "/v1/assignments/{id}/complete", description: "ACTIVE -> COMPLETED; sets actual_end_date from logical clock", roles: [ProgramAdmin], code: 200, input: [], output: Assignment, side_effects: ["supplier.completed_assignments_count += 1", "worker OFFBOARDING when no open assignment remains"] }

  # --- timesheets ---
  - { method: POST, path: "/v1/timesheets", description: "Worker creates a DRAFT timesheet for own ACTIVE assignment", roles: [Worker], code: 201, input: [assignment_id, period_start, period_end, submitted_hours], output: Timesheet, side_effects: [] }
  - { method: GET, path: "/v1/timesheets", description: "List timesheets", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["assignment_id?", "status?", "limit?", "offset?"], output: "Timesheet[]", side_effects: [] }
  - { method: GET, path: "/v1/timesheets/{id}", description: "Get one timesheet", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Timesheet, side_effects: [] }
  - { method: POST, path: "/v1/timesheets/{id}/submit", description: "DRAFT/REJECTED -> SUBMITTED; computes provisional_amount_cents", roles: [Worker], code: 200, input: [], output: Timesheet, side_effects: ["provisional variant computed", "submitted_by_user_id set"] }
  - { method: POST, path: "/v1/timesheets/{id}/approve", description: "SUBMITTED -> APPROVED; FINAL variant with ceiling clamp; ledger + invoice line + committed spend cascades", roles: [HiringManager], code: 200, input: ["approved_hours?"], output: Timesheet, side_effects: ["final_amount_cents computed", "SpendLedgerEntry TIMESHEET_APPROVED", "InvoiceLine attached to supplier OPEN invoice", "engagement.committed_spend_cents recomputed", ">=95% budget crossing auto-creates BUDGET_UTILIZATION audit"] }
  - { method: POST, path: "/v1/timesheets/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [HiringManager], code: 200, input: [reason], output: Timesheet, side_effects: ["rejection_reason set"] }
  - { method: POST, path: "/v1/timesheets/{id}/void", description: "APPROVED -> VOIDED with full compensation (ledger reversal, invoice line removal, committed spend recompute); only while the sourcing invoice is OPEN", roles: [FinanceAnalyst], code: 200, input: [reason], output: Timesheet, side_effects: ["SpendLedgerEntry TIMESHEET_VOIDED (-final)", "InvoiceLine deleted", "invoice subtotal recomputed", "committed_spend recomputed"] }

  # --- milestones ---
  - { method: POST, path: "/v1/engagements/{id}/milestones", description: "Create a milestone on a SOW engagement (status OPEN/FILLING/ACTIVE)", roles: [HiringManager], code: 201, input: [name, amount_cents, due_date], output: Milestone, side_effects: [] }
  - { method: GET, path: "/v1/engagements/{id}/milestones", description: "List milestones of an engagement (reverse reachability)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: ["limit?", "offset?"], output: "Milestone[]", side_effects: [] }
  - { method: GET, path: "/v1/milestones/{id}", description: "Get one milestone (both parallel status dimensions)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst, Worker], code: 200, input: [], output: Milestone, side_effects: [] }
  - { method: POST, path: "/v1/milestones/{id}/deliver", description: "PENDING/REJECTED -> DELIVERED; requires engagement ACTIVE and caller is awarded supplier", roles: [SupplierCoordinator], code: 200, input: ["delivery_note?"], output: Milestone, side_effects: ["delivered_by_supplier_id set"] }
  - { method: POST, path: "/v1/milestones/{id}/accept", description: "DELIVERED -> ACCEPTED; ledger + invoice line + committed spend cascades; payment dimension unchanged", roles: [HiringManager], code: 200, input: [], output: Milestone, side_effects: ["SpendLedgerEntry MILESTONE_ACCEPTED", "InvoiceLine attached", "engagement.committed_spend_cents recomputed", ">=95% budget crossing auto-creates BUDGET_UTILIZATION audit"] }
  - { method: POST, path: "/v1/milestones/{id}/reject", description: "DELIVERED -> REJECTED (redelivery loop stays open)", roles: [HiringManager], code: 200, input: [reason], output: Milestone, side_effects: ["rejection_reason set"] }

  # --- invoices ---
  - { method: POST, path: "/v1/invoices", description: "Manually create an empty OPEN invoice for a supplier (blocked when one is already OPEN)", roles: [FinanceAnalyst], code: 201, input: [supplier_id, period_start, period_end], output: Invoice, side_effects: [] }
  - { method: GET, path: "/v1/invoices", description: "List invoices", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: ["supplier_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/v1/invoices/{id}", description: "Get one invoice (subtotal, fee, total, savings, line_count)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/v1/invoices/{id}/finalize", description: "OPEN -> FINALIZED; computes subtotal, processing fee (tier on pre-fee subtotal), consolidation savings; attached milestones become INVOICED", roles: [FinanceAnalyst], code: 200, input: [], output: Invoice, side_effects: ["invoice_consolidation + invoice_processing_fee + consolidation_savings", "milestones UNINVOICED -> INVOICED", "finalized_by_user_id set"] }
  - { method: POST, path: "/v1/invoices/{id}/mark-paid", description: "FINALIZED -> PAID; SoD: payer must differ from finalizer", roles: [FinanceAnalyst], code: 200, input: [], output: Invoice, side_effects: ["milestones INVOICED -> PAID", "paid_by_user_id set"] }
  - { method: POST, path: "/v1/invoices/{id}/void", description: "FINALIZED -> VOIDED; lines migrate to a fresh OPEN invoice and milestones revert to UNINVOICED", roles: [FinanceAnalyst], code: 200, input: [reason], output: Invoice, side_effects: ["lines re-attached to new OPEN invoice", "milestones INVOICED -> UNINVOICED"] }

  # --- invoice lines ---
  - { method: GET, path: "/v1/invoice-lines", description: "List invoice lines (reverse reachability for invoice_id, timesheet_id, milestone_id)", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: ["invoice_id?", "timesheet_id?", "milestone_id?", "limit?", "offset?"], output: "InvoiceLine[]", side_effects: [] }
  - { method: GET, path: "/v1/invoice-lines/{id}", description: "Get one invoice line", roles: [ProgramAdmin, HiringManager, SupplierCoordinator, FinanceAnalyst], code: 200, input: [], output: InvoiceLine, side_effects: [] }

  # --- conversion requests ---
  - { method: POST, path: "/v1/conversion-requests", description: "Request conversion-to-employee for a worker on an ACTIVE assignment; fee computed at creation per conversion_fee variant selection", roles: [HiringManager], code: 201, input: [worker_id, assignment_id], output: ConversionRequest, side_effects: ["conversion_fee computed", "worker.conversion_status -> REQUESTED"] }
  - { method: GET, path: "/v1/conversion-requests", description: "List conversion requests", roles: [ProgramAdmin, HiringManager, FinanceAnalyst], code: 200, input: ["worker_id?", "assignment_id?", "status?", "limit?", "offset?"], output: "ConversionRequest[]", side_effects: [] }
  - { method: GET, path: "/v1/conversion-requests/{id}", description: "Get one conversion request", roles: [ProgramAdmin, HiringManager, FinanceAnalyst], code: 200, input: [], output: ConversionRequest, side_effects: [] }
  - { method: POST, path: "/v1/conversion-requests/{id}/approve", description: "REQUESTED -> APPROVED", roles: [ProgramAdmin], code: 200, input: [], output: ConversionRequest, side_effects: ["worker.conversion_status -> APPROVED"] }
  - { method: POST, path: "/v1/conversion-requests/{id}/decline", description: "REQUESTED -> DECLINED", roles: [ProgramAdmin], code: 200, input: [reason], output: ConversionRequest, side_effects: ["worker.conversion_status -> DECLINED"] }
  - { method: POST, path: "/v1/conversion-requests/{id}/complete", description: "APPROVED -> COMPLETED; assignment TERMINATED (CONVERTED); worker EXITED/CONVERTED", roles: [ProgramAdmin], code: 200, input: [], output: ConversionRequest, side_effects: ["assignment TERMINATED", "worker EXITED + CONVERTED"] }

  # --- compliance audits ---
  - { method: POST, path: "/v1/compliance-audits/run", description: "Run rate-compliance audit on one subject (exactly one of timesheet_id, assignment_id). Re-evaluates markup and ceiling against the rate card currently governing the logical clock date, plus tenure: OVER_RATE when bill_rate_cents exceeds the governing ceiling; MARKUP_EXCEEDED when markup exceeds min(card cap, tier cap); TENURE_RISK (severity LOW) when the assignment is ACTIVE and its worker's cumulative_tenure_days >= TENURE_RISK_WARN_DAYS (700, i.e. within 30 days of the 730-day limit). Creates 0..n ComplianceAudit findings and returns them.", roles: [ProgramAdmin], code: 201, input: ["timesheet_id?", "assignment_id?"], output: "ComplianceAudit[]", side_effects: ["findings created", "supplier.open_violation_count += number of new findings"] }
  - { method: GET, path: "/v1/compliance-audits", description: "List audits", roles: [ProgramAdmin, HiringManager, FinanceAnalyst], code: 200, input: ["supplier_id?", "engagement_id?", "timesheet_id?", "assignment_id?", "finding?", "status?", "limit?", "offset?"], output: "ComplianceAudit[]", side_effects: [] }
  - { method: GET, path: "/v1/compliance-audits/{id}", description: "Get one audit", roles: [ProgramAdmin, HiringManager, FinanceAnalyst], code: 200, input: [], output: ComplianceAudit, side_effects: [] }
  - { method: POST, path: "/v1/compliance-audits/{id}/acknowledge", description: "OPEN -> ACKNOWLEDGED", roles: [ProgramAdmin], code: 200, input: [], output: ComplianceAudit, side_effects: [] }
  - { method: POST, path: "/v1/compliance-audits/{id}/resolve", description: "ACKNOWLEDGED -> RESOLVED; decrements supplier.open_violation_count", roles: [ProgramAdmin], code: 200, input: [resolution_note], output: ComplianceAudit, side_effects: ["supplier.open_violation_count -= 1"] }
  - { method: POST, path: "/v1/compliance-audits/{id}/dismiss", description: "ACKNOWLEDGED -> DISMISSED; decrements supplier.open_violation_count", roles: [ProgramAdmin], code: 200, input: [resolution_note], output: ComplianceAudit, side_effects: ["supplier.open_violation_count -= 1"] }

  # --- spend ledger & visibility ---
  - { method: GET, path: "/v1/spend-ledger-entries", description: "List ledger entries (reverse reachability for supplier_id, engagement_id, timesheet_id, milestone_id, invoice_id)", roles: [ProgramAdmin, FinanceAnalyst], code: 200, input: ["supplier_id?", "engagement_id?", "timesheet_id?", "milestone_id?", "invoice_id?", "entry_type?", "limit?", "offset?"], output: "SpendLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/v1/spend-ledger-entries/{id}", description: "Get one ledger entry", roles: [ProgramAdmin, FinanceAnalyst], code: 200, input: [], output: SpendLedgerEntry, side_effects: [] }
  - { method: GET, path: "/v1/spend/summary", description: "Computed spend visibility read across all suppliers (or one when filtered)", roles: [ProgramAdmin, FinanceAnalyst], code: 200, input: ["supplier_id?"], output: { total_committed_cents: integer, total_invoiced_cents: integer, total_paid_cents: integer, consolidation_savings_cents: integer, open_violations_count: integer }, side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers, or role is Anonymous/undeclared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not permitted on endpoint, or entity-backed ownership mismatch (wrong supplier / wrong worker)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, invalid enum value, bad date format, both/neither audit subject given" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve to an existing resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-from-state transition rejection on any state machine" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE, http: 409, condition: "Milestone deliver while engagement not ACTIVE" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "Timesheet create/submit while assignment not ACTIVE" }
  - { id: ERR_SUPPLIER_SUSPENDED, http: 422, condition: "Operation blocked because supplier.status == SUSPENDED (business_safety; outranks referential and fiscal failures)" }
  - { id: ERR_TENURE_LIMIT_EXCEEDED, http: 422, condition: "Projected tenure >= TENURE_LIMIT_DAYS (730); exactly 730 is rejected" }
  - { id: ERR_MISCLASSIFICATION_RISK, http: 422, condition: "Classification APPROVE blocked: misclassification_risk HIGH without risk_override_rationale" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: mark-paid caller equals invoice.finalized_by_user_id" }
  - { id: ERR_RATE_CARD_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE card with same key has an overlapping half-open effective window" }
  - { id: ERR_WORKER_DOUBLE_BOOKED, http: 409, condition: "New assignment's closed inclusive date interval shares at least one day with another non-terminal assignment of the worker" }
  - { id: ERR_DUPLICATE_TIMESHEET_PERIOD, http: 409, condition: "A timesheet already exists for this assignment and period_start" }
  - { id: ERR_CONVERSION_ALREADY_REQUESTED, http: 409, condition: "Worker already has a ConversionRequest in REQUESTED or APPROVED" }
  - { id: ERR_INVOICE_ALREADY_OPEN, http: 409, condition: "Manual invoice create while the supplier already has an OPEN invoice" }
  - { id: ERR_HOURS_EXCEED_MAX, http: 422, condition: "submitted_hours > 60.00 (exactly 60.00 allowed)" }
  - { id: ERR_NO_ELIGIBLE_SUPPLIER, http: 422, condition: "distribution_selector pool is empty (no ACTIVE, PREFERRED/APPROVED supplier under its parallel cap)" }
  - { id: ERR_PERIOD_OUTSIDE_ASSIGNMENT, http: 422, condition: "Timesheet period not contained in assignment [start_date, end_date]" }
  - { id: ERR_CARD_NOT_EFFECTIVE, http: 422, condition: "Governing rate card's half-open window does not contain assignment start_date" }
  - { id: ERR_RATE_CARD_INACTIVE, http: 422, condition: "Referenced rate card is not ACTIVE or its key does not match the engagement" }
  - { id: ERR_ENGAGEMENT_TYPE_MISMATCH, http: 422, condition: "Assignment on a SOW engagement, or milestone on a REQUISITION engagement" }
  - { id: ERR_OFFER_NOT_ACCEPTED, http: 422, condition: "Assignment references an offer not in ACCEPTED state, or offer belongs to another engagement" }
  - { id: ERR_WORKER_SUPPLIER_MISMATCH, http: 422, condition: "worker.supplier_id differs from offer.supplier_id" }
  - { id: ERR_RATE_ABOVE_CEILING, http: 422, condition: "bill_rate_cents > rate_card.bill_rate_ceiling_cents" }
  - { id: ERR_MARKUP_ABOVE_CAP, http: 422, condition: "Markup exceeds min(rate card max_markup_pct, supplier tier cap)" }
  - { id: ERR_PAY_BELOW_FLOOR, http: 422, condition: "pay_rate_cents < rate_card.pay_rate_floor_cents" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Approval would push committed_spend_cents above budget_cents" }
  - { id: ERR_INVOICE_EMPTY, http: 422, condition: "Finalize requested on an invoice with zero lines" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not match Engagement.version (OCC)" }
  - { id: ERR_STALE_RATE_CARD_VERSION, http: 412, condition: "expected_rate_card_version does not match RateCard.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Contingent workforce program office administrator; owns rate cards, supplier governance, classification decisions, distribution, bookings, conversions and audits"
    identity: opaque
    exclusive_operations: ["rate card create/activate/retire/revise", "supplier create/suspend/reinstate/tier-evaluation", "classification-decision", "distribute", "offer withdraw", "expire-sweep", "assignment create/activate/extend/terminate/complete", "conversion approve/decline/complete", "audit run/acknowledge/resolve/dismiss", "worker offboard-complete/rehire", "clock set"]
    shared_operations: ["read endpoints", "spend summary", "ledger list"]
  - name: HiringManager
    description: "Client-side manager owning engagements; approves timesheets and milestones; requests conversions"
    identity: opaque
    exclusive_operations: ["engagement create/submit-review/amendments/close", "milestone create/accept/reject", "timesheet approve/reject", "conversion-request create"]
    shared_operations: ["read endpoints"]
  - name: SupplierCoordinator
    description: "Staffing supplier account; X-User-ID equals the Supplier id"
    identity: "entity_backed:Supplier"
    exclusive_operations: ["offer respond (own supplier only)", "milestone deliver (awarded supplier only)", "worker registration (own supplier only)"]
    shared_operations: ["read endpoints"]
  - name: Worker
    description: "Contingent worker; X-User-ID equals the Worker id"
    identity: "entity_backed:Worker"
    exclusive_operations: ["timesheet create/submit (own assignments only)"]
    shared_operations: ["read endpoints"]
  - name: FinanceAnalyst
    description: "Finance operations; finalizes and pays invoices with segregation of duties"
    identity: opaque
    exclusive_operations: ["invoice create/finalize/mark-paid/void", "timesheet void"]
    shared_operations: ["read endpoints", "spend summary", "ledger list"]
  - name: Anonymous
    description: "Unauthenticated caller; every request maps to ERR_UNAUTHENTICATED"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
