        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[period-close-stale-household]"
          - state_machines.BudgetPeriod.OPEN_to_CLOSED
        distinguishing_aspect: "Closing the current period with the exact observed expected_household_version succeeds (CLOSED), and Household.version increments by 1."
        test_recipe:
          setup: ["Household with a zero-based current period P1 (income 0, allocated 0)"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /households/${hh_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { hv: $.data.version }
          trigger:
