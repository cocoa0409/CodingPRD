            - { call: "POST /poultry/finished-lots/${fl1}/trace-lock", as: QATechnician, payload: {}, captures: { route0: $.data.routing_status } }
            - { call: "POST /poultry/flock-lots/${f1}/advance", payload: { to_status: "REOPENED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "POST /poultry/condemnation-records", payload: { line_run_id: "${r1}", condemnation_code: "BRUISING", carcass_count: 100 }, as: QATechnician, as_user_id: "qa-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /poultry/condemnation-records/${c1}/advance", payload: { to_status: "CERTIFIED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "GET /poultry/flock-lots/${f1}", as: PlantManager }
            - { call: "GET /poultry/finished-lots/${fl1}", as: QATechnician }
          assert:
            - "pre-cascade: settled yield ${y0} == 72.0 and routing ${route0} == FRESH"
            - "link 1+2: FlockLot.${f1}.condemned_accounted == 100 and certified_yield_pct == 71.28 (recomputed from the run totals mutation)"
            - "link 3: FinishedLot.${fl1}.routing_status == FROZEN (71.28 < 72.0 flips TRACE_LOCKED FLEXIBLE lots FRESH -> FROZEN)"
            - "FinishedLot.${fl1}.status stays TRACE_LOCKED (flip does not unlock)"

      - name: water_breach_suspend_pause_hold_cascade
        grounds:
          - calculations.shift_water_intensity
          - state_machines.ProductionShift.RUNNING_to_SUSPENDED
          - state_machines.LineRun.RUNNING_to_PAUSED
          - state_machines.DeboningBatch.IN_PROGRESS_to_ON_HOLD
        distinguishing_aspect: |
          Depth-2 primary chain with an extra branch, from a different trigger than
          the certification cascade: a single POST utility-readings mutates the
          shift (RUNNING -> SUSPENDED, link 1); the shift's suspension itself pauses
          the RUNNING run of lot FL-200 (link 2) and independently holds the
          IN_PROGRESS deboning batch — two hop-2 effects caused by the hop-1
          suspension, not by the reading directly.
        test_recipe:
          setup:
            - "EV-1 + DB-1; shift RUNNING fully staffed; lot FL-100 processed (run completed 9950/36000) and CHILLED; batch B1 IN_PROGRESS on DB-1; lot FL-200 received with run R2 RUNNING on EV-1"
