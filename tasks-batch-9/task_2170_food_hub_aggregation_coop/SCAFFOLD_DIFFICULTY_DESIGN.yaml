- rule_id: boundary_precision_check
  instances:
  - name: document_expiry_boundary_is_strict_at_the_equal_instant
    grounds:
    - calculations.producer_compliance_evaluation
    - state_machines.ProducerDocument.VERIFIED_to_EXPIRED
    - state_machines.Producer.ACTIVE_to_SUSPENDED
    - entities.ProducerDocument.fields.expires_on
    distinguishing_aspect: Boundary metric 1 — a datetime threshold reached through POST /_clock/set_current_utc. The compliance predicate is expires_on > now with a strict greater-than, so at 2026-09-30T23:59:59.999Z
      the GAP_AUDIT is still VERIFIED and P1 stays ACTIVE, while at exactly 2026-10-01T00:00:00Z it becomes EXPIRED and P1 is auto-suspended.
    test_recipe:
      setup:
      - Producer P1 is ACTIVE with compliance_ok true and food_safety_tier TIER_BASIC.
      - P1's GAP_AUDIT document is VERIFIED with expires_on exactly 2026-10-01T00:00:00Z; its LIABILITY_INSURANCE and HACCP_PLAN expire 2027-01-01T00:00:00Z.
      - The logical clock sits at 2026-09-30T23:59:59.999Z, one millisecond before the expiry instant, and P1 is still ACTIVE with compliance_ok true.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
