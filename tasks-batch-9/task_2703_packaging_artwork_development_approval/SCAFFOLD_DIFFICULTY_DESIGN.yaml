            - "the second POST /artwork-versions/${v1_id}/submit returns 200, ArtworkVersion.${v1_id}.state == IN_REVIEW and route_count == 1"
            - "a ReviewRoute for ${v1_id} now exists with current_stage_no == 1 and status == IN_PROGRESS"

