  - rule_id: transitive_cascade
    instances:

      - name: weather_wind_hold_cascade_depth_four_to_season_water_ledger
        grounds:
          - state_machines.Lift.OPEN_to_WIND_HOLD
          - state_machines.TerrainArea.OPEN_to_PATROL_HOLD
          - state_machines.GroomingTask.PLANNED_to_DEFERRED
          - state_machines.SnowmakingSession.SCHEDULED_to_ABORTED
          - calculations.snowmaking_water_volume
          - entities.SeasonConfig.fields.water_reserved_af
          - entities.Lift.fields.wind_hold_since
        distinguishing_aspect: |
          One weather POST propagates four entity hops deep: Lift (OPEN -> WIND_HOLD) -> TerrainArea
          (OPEN -> PATROL_HOLD) -> SnowmakingSession (SCHEDULED -> ABORTED, abort_reason TERRAIN_HOLD) ->
          SeasonConfig (water_reserved_af released back to 0.000), with GroomingTask (PLANNED -> DEFERRED)
          branching off the third hop. Nothing in the request names a lift, an area, a session or the season
          ledger. The wind is chosen at 55.0 mph: strictly above the lift's 40.0 threshold so the hold fires,
          but below 60.0 so the DayPlan does NOT enter WEATHER_HOLD - the posture change to PUBLISHED_PARTIAL
          must therefore come from the terrain hop, not from the weather hop.
        test_recipe:
          setup:
            - "Open-mountain bootstrap: lift L1 OPEN with wind_hold_threshold_mph 40.0, terrain area T1 OPEN, day plan PUBLISHED_FULL, season OPERATING with water_right_seasonal_af 250.000."
            - "A second grooming task on route R1 with sequence_index 2 exists in state PLANNED and is never dispatched; the sequence_index 1 task is already COMPLETED."
            - "One SCHEDULED session on T1/PH1 over [2026-08-01T05:00:00Z, 2026-08-01T12:00:00Z) at 1200 gpm holds water_af_reserved 1.547, so SeasonConfig.water_reserved_af is 1.547 before the trigger."
            - "The logical clock stays at 2026-08-01T00:00:00Z, so wind_hold_since is stamped with that instant."
