            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: [] }, as: Manager }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit: "$.data[0].id", pv: "$.data[0].version" } }
          trigger:
            - { call: "POST /arc/permits/${permit}/contractor-change", payload: { contractor_name: "Ace Roofing", contractor_license: "LIC-1", expected_permit_version: "${pv}" }, as: Manager, captures: { v2: $.data.version } }
            - { call: "POST /arc/permits/${permit}/contractor-change", payload: { contractor_name: "Beta Builders", contractor_license: "LIC-2", expected_permit_version: "${pv}" }, as: Manager, captures: { err: $.data.error_id } }
            - { call: "GET /arc/permits/${permit}", as: Manager, captures: { final_contractor: $.data.contractor_name, final_v: $.data.version } }
          assert:
            - "first change: succeeds, version == 2"
            - "replay with stale version: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "permit afterwards: contractor_name == 'Ace Roofing' (first write retained), version == 2"

      - name: sweep_idempotent_same_day
        claim_type: idempotency
        grounds: [calculations.fine_accrual, "endpoints.POST /arc/_sweeps/daily"]
        distinguishing_aspect: "Running the daily sweep twice at the same logical date accrues each fine once: the first sweep reports fines_accrued == 1 and sets accrued to 11000; the second reports fines_accrued == 0 and accrued stays 11000."
        test_recipe:
          setup: ["Association SIMPLE base 10000 daily 1000; violation created at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Idem HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "ID-1", address: "1 Idem Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "shed" }, as: Manager, captures: { vio: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: Manager }
          trigger:
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { accrued_count1: $.data.fines_accrued } }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { accrued_count2: $.data.fines_accrued } }
            - { call: "GET /arc/violations/${vio}/fines", as: Manager, captures: { acc: "$.data[0].accrued_cents" } }
          assert:
            - "first sweep at 2026-05-02: fines_accrued == 1"
            - "second sweep same date: fines_accrued == 0 (idempotent per date)"
            - "accrued_cents == 11000 after both sweeps"

      - name: lien_auto_files_at_exact_threshold
        claim_type: rate_threshold_triggers
        grounds: [calculations.property_outstanding_balance, state_machines.Lien, entities.Association.fields.lien_threshold_cents]
        distinguishing_aspect: "Lien auto-file boundary: balance 18000 (< 20000 threshold) files nothing; the next day's accrual lands exactly on 20000 (>= threshold) and files the lien for 20000 with posture LIENED."
        test_recipe:
          setup: ["Association SIMPLE base 10000 daily 2000, lien_threshold_cents 20000, lien_min_age_days 0; violation at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Lien HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 2000, lien_threshold_cents: 20000, lien_min_age_days: 0, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "LN-1", address: "1 Lien Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "shed" }, as: Manager }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { filed_d4: $.data.liens_filed } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { filed_d5: $.data.liens_filed } }
            - { call: "GET /arc/properties/${prop}/liens", as: Manager, captures: { lien_amount: "$.data[0].amount_at_filing_cents", lien_status: "$.data[0].status" } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { posture: $.data.compliance_posture } }
          assert:
            - "at balance 18000 (2026-05-05): liens_filed == 0"
            - "at balance exactly 20000 (2026-05-06): liens_filed == 1 (>= boundary files)"
            - "Lien: status == FILED, amount_at_filing_cents == 20000; Property.compliance_posture == LIENED"

      - name: decide_approval_cascade_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Application.UNDER_REVIEW_to_APPROVED_WITH_CONDITIONS]
        excluded_because:
          difficulty_instance: approval_cascade_application_to_permit_to_property
          rationale: "The Application -> Permit -> Property chain is asserted end-to-end by the named §1.8 instance."

      - name: inspection_fail_cascade_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Inspection.SCHEDULED_to_FAILED_REMEDIATION]
        excluded_because:
          difficulty_instance: inspection_fail_cascade_to_violation_fine_property
          rationale: "The Inspection -> Violation -> Fine -> Property chain is asserted end-to-end by the named §1.8 instance."

      - name: dual_variant_calculations_excluded
        claim_type: dual_variant_calculation
        grounds: [calculations.statutory_deadline_check, calculations.fine_accrual]
        excluded_because:
          difficulty_instance: deemed_approval_calendar_vs_business_deadline
          rationale: "Both dual-variant calculations (deadline counting, fine accrual) are asserted by the named §1.8 instance and fine_accrual_simple_vs_tiered_totals."

