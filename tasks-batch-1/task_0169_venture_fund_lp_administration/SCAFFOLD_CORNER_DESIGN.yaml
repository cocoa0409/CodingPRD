scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_fund_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Fund.fields.status", "entities.Fund.fields.version"]
        distinguishing_aspect: "POST /funds with all required fields -> 201, status FORMING, version 1, server-minted id/created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Greenfield Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { gf_id: "$.data.id", gf_status: "$.data.status", gf_ver: "$.data.version" }
          assert:
            - "response.status == 201"
            - "Fund.${gf_id}.status == FORMING"
            - "Fund.${gf_id}.version == 1"

      - name: get_fund_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /funds/{nonexistent-uuid} -> ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FundManager
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_fund_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /funds missing carry_rate_bps -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Incomplete Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, pref_rate_bps: 800 }
              as: FundManager
              captures: { ir_err: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_fund_default_gp_catchup_applied
        claim_type: Defaults
        grounds: ["entities.Fund.fields.gp_catchup_rate_bps"]
        distinguishing_aspect: "Omitting gp_catchup_rate_bps -> default 10000 applied on the created Fund."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Default Catchup Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { dc_id: "$.data.id", dc_catchup: "$.data.gp_catchup_rate_bps" }
          assert:
            - "Fund.${dc_id}.gp_catchup_rate_bps == 10000"

      - name: fund_computed_totals_ignore_input
        claim_type: Computed Fields
        grounds: ["entities.Fund.fields.total_committed_cents"]
        distinguishing_aspect: "Fund.total_committed_cents is computed from ACTIVE commitments; client cannot set it (no such input field) and it equals 6000000 after one accepted 6000000 commitment."
        test_recipe:
          setup: ["Fund with one ACTIVE commitment of 6000000."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP CF", lp_type: "INSTITUTION", tax_id_last4: "1212" }
              as: FundAdministrator
              captures: { cflp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Totals Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { tf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${tf_id}", lp_id: "${cflp_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { tfc_id: "$.data.id" }
            - call: "POST /commitments/${tfc_id}/accept"
              payload: {}
              as: FundManager
          trigger:
            - call: "GET /funds/${tf_id}"
              payload: {}
              as: FundManager
              captures: { tf_total: "$.data.total_committed_cents" }
          assert:
            - "Fund.${tf_id}.total_committed_cents == 6000000"

      - name: create_fund_invalid_enum_carry_out_of_range
        claim_type: Type Constraints
        grounds: ["errors[ERR_VALIDATION_LIMIT]", "entities.Fund.fields.carry_rate_bps"]
        distinguishing_aspect: "carry_rate_bps 6000 exceeds the 0..5000 range -> ERR_VALIDATION_LIMIT (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "BadCarry Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 6000, pref_rate_bps: 800 }
              as: FundManager
              captures: { vl_err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_LIMIT"

      - name: list_funds_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.GET /funds"]
        distinguishing_aspect: "GET /funds returns a paginated array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two funds created."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Page Fund A", vintage_year: 2024, target_size_cents: 1000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
            - call: "POST /funds"
              payload: { name: "Page Fund B", vintage_year: 2024, target_size_cents: 1000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
          trigger:
            - call: "GET /funds?limit=1&offset=0"
              payload: {}
              as: FundManager
          assert:
            - "response.data is an array of length 1"
            - "pagination total_count == 2 and has_more == true"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: commitment_starts_pending
        claim_type: Initial State
        grounds: ["entities.Commitment.fields.status", "state_machines.Commitment"]
        distinguishing_aspect: "A newly created Commitment has status PENDING."
        test_recipe:
          setup: ["A fund and an LP exist."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP IS", lp_type: "INSTITUTION", tax_id_last4: "1313" }
              as: FundAdministrator
              captures: { islp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Init Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { isf_id: "$.data.id" }
          trigger:
            - call: "POST /commitments"
              payload: { fund_id: "${isf_id}", lp_id: "${islp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { isc_id: "$.data.id", isc_status: "$.data.status" }
          assert:
            - "Commitment.${isc_id}.status == PENDING"

      - name: accept_already_active_commitment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Commitment.PENDING_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a commitment already ACTIVE -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A commitment already accepted (ACTIVE)."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP AA", lp_type: "INSTITUTION", tax_id_last4: "1414" }
              as: FundAdministrator
              captures: { aalp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "AA Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { aaf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${aaf_id}", lp_id: "${aalp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { aac_id: "$.data.id" }
            - call: "POST /commitments/${aac_id}/accept"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /commitments/${aac_id}/accept"
              payload: {}
              as: FundManager
              captures: { aa_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: wind_down_blocked_by_active_investment
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Fund.HARVESTING_to_WOUND_DOWN", "errors[ERR_WIND_DOWN_BLOCKED]"]
        distinguishing_aspect: "Fund wind-down with an ACTIVE investment outstanding -> ERR_WIND_DOWN_BLOCKED (409)."
        test_recipe:
          setup: ["Fund HARVESTING with one ACTIVE investment still held."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP WD", lp_type: "INSTITUTION", tax_id_last4: "1515" }
              as: FundAdministrator
              captures: { wdlp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "WindDown Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { wdf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${wdf_id}", lp_id: "${wdlp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { wdc_id: "$.data.id" }
            - call: "POST /commitments/${wdc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${wdf_id}/activate"
              payload: {}
              as: FundManager
            - call: "POST /portfolio-companies"
              payload: { name: "Kappa", sector: "Logistics" }
              as: FundManager
              captures: { wdpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${wdf_id}", portfolio_company_id: "${wdpc_id}", cost_basis_cents: 3000000, ownership_pct_bps: 1000 }
              as: FundManager
            - call: "POST /funds/${wdf_id}/begin-harvest"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /funds/${wdf_id}/wind-down"
              payload: {}
              as: FundManager
              captures: { wd_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WIND_DOWN_BLOCKED"

      - name: terminal_wound_down_fund_rejects_activate
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Fund", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WOUND_DOWN fund cannot be activated again -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Fund driven FORMING->INVESTING->HARVESTING->WOUND_DOWN with no blockers."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP TM", lp_type: "INSTITUTION", tax_id_last4: "1616" }
              as: FundAdministrator
              captures: { tmlp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Terminal Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { tmf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${tmf_id}", lp_id: "${tmlp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { tmc_id: "$.data.id" }
            - call: "POST /commitments/${tmc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${tmf_id}/activate"
              payload: {}
              as: FundManager
            - call: "POST /funds/${tmf_id}/begin-harvest"
              payload: {}
              as: FundManager
            - call: "POST /funds/${tmf_id}/wind-down"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /funds/${tmf_id}/activate"
              payload: {}
              as: FundManager
              captures: { tm_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: wind_down_cascade_closes_active_commitments
        claim_type: Side Effect Execution
        grounds: ["state_machines.Fund.HARVESTING_to_WOUND_DOWN", "state_machines.Commitment.ACTIVE_to_CLOSED"]
        distinguishing_aspect: "Cascade down: wind-down sets every ACTIVE Commitment on the fund to CLOSED."
        test_recipe:
          setup: ["Fund HARVESTING with one ACTIVE commitment and no ACTIVE investment / ISSUED call."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP WC", lp_type: "INSTITUTION", tax_id_last4: "1717" }
              as: FundAdministrator
              captures: { wclp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Cascade Close Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { wcf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${wcf_id}", lp_id: "${wclp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { wcc_id: "$.data.id" }
            - call: "POST /commitments/${wcc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${wcf_id}/activate"
              payload: {}
              as: FundManager
            - call: "POST /funds/${wcf_id}/begin-harvest"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /funds/${wcf_id}/wind-down"
              payload: {}
              as: FundManager
              captures: { wc_status: "$.data.status" }
          assert:
            - "Fund.${wcf_id}.status == WOUND_DOWN"
            - "Commitment.${wcc_id}.status == CLOSED"

      - name: cancel_call_waives_allocations_compensation
        claim_type: Compensation
        grounds: ["state_machines.CapitalCall.ISSUED_to_CANCELLED", "entities.CapitalCallAllocation.fields.status"]
        distinguishing_aspect: "Cancelling an ISSUED call with no PAID allocations sets the call CANCELLED and every allocation to WAIVED."
        test_recipe:
          setup: ["Fund INVESTING with an ISSUED call across two PENDING allocations."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP CW", lp_type: "INSTITUTION", tax_id_last4: "1818" }
              as: FundAdministrator
              captures: { cwlp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Cancel Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { cwf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${cwf_id}", lp_id: "${cwlp_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { cwc_id: "$.data.id" }
            - call: "POST /commitments/${cwc_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${cwf_id}"
              payload: {}
              as: FundManager
              captures: { cwf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${cwf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${cwf_v1}" }
              as: FundManager
              captures: { cw_call_id: "$.data.id" }
            - call: "GET /capital-calls/${cw_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { cw_alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /capital-calls/${cw_call_id}/cancel"
              payload: {}
              as: FundManager
              captures: { cw_status: "$.data.status" }
          assert:
            - "CapitalCall.${cw_call_id}.status == CANCELLED"
            - "CapitalCallAllocation.${cw_alloc_id}.status == WAIVED"

      - name: finalize_mark_supersedes_prior_final
        claim_type: Side Effect Execution
        grounds: ["state_machines.ValuationMark.FINAL_to_SUPERSEDED", "entities.Investment.fields.current_mark_cents"]
        distinguishing_aspect: "Finalizing a newer mark supersedes the prior FINAL mark and updates Investment.current_mark_cents to the new value."
        test_recipe:
          setup: ["Investment with a FINAL mark dated 2024-03-31 valued 3500000; a newer DRAFT mark dated 2024-06-30 valued 4200000."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP SU", lp_type: "INSTITUTION", tax_id_last4: "1919" }
              as: FundAdministrator
              captures: { sulp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Supersede Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { suf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${suf_id}", lp_id: "${sulp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { suc_id: "$.data.id" }
            - call: "POST /commitments/${suc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /portfolio-companies"
              payload: { name: "Lambda", sector: "Edu" }
              as: FundManager
              captures: { supc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${suf_id}", portfolio_company_id: "${supc_id}", cost_basis_cents: 3000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { suinv_id: "$.data.id" }
            - call: "POST /valuation-marks"
              payload: { investment_id: "${suinv_id}", as_of_date: "2024-03-31T00:00:00Z", fair_value_cents: 3500000, methodology: "LAST_ROUND" }
              as: FundAdministrator
              captures: { sumark1_id: "$.data.id" }
            - call: "POST /valuation-marks/${sumark1_id}/finalize"
              payload: {}
              as: FundAdministrator
            - call: "POST /valuation-marks"
              payload: { investment_id: "${suinv_id}", as_of_date: "2024-06-30T00:00:00Z", fair_value_cents: 4200000, methodology: "DCF" }
              as: FundAdministrator
              captures: { sumark2_id: "$.data.id" }
          trigger:
            - call: "POST /valuation-marks/${sumark2_id}/finalize"
              payload: {}
              as: FundAdministrator
              captures: { su_status: "$.data.status" }
          assert:
            - "ValuationMark.${sumark1_id}.status == SUPERSEDED"
            - "ValuationMark.${sumark2_id}.status == FINAL"
            - "Investment.${suinv_id}.current_mark_cents == 4200000"

      - name: fund_partially_defaulted_to_settled_after_remaining_funded
        claim_type: Valid Transition
        grounds: ["state_machines.CapitalCall.PARTIALLY_DEFAULTED_to_SETTLED"]
        distinguishing_aspect: "A PARTIALLY_DEFAULTED call where the remaining non-defaulted allocation is funded transitions to SETTLED."
        test_recipe:
          setup: ["An ISSUED call across two PENDING allocations; one allocation is defaulted (call PARTIALLY_DEFAULTED)."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP PS1", lp_type: "INSTITUTION", tax_id_last4: "2020" }
              as: FundAdministrator
              captures: { ps1lp_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP PS2", lp_type: "INSTITUTION", tax_id_last4: "2121" }
              as: FundAdministrator
              captures: { ps2lp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "PartSettle Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { psf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${psf_id}", lp_id: "${ps1lp_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { psc1_id: "$.data.id" }
            - call: "POST /commitments/${psc1_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${psf_id}", lp_id: "${ps2lp_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { psc2_id: "$.data.id" }
            - call: "POST /commitments/${psc2_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${psf_id}"
              payload: {}
              as: FundManager
              captures: { psf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${psf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${psf_v1}" }
              as: FundManager
              captures: { ps_call_id: "$.data.id" }
            - call: "GET /capital-call-allocations?commitment_id=${psc1_id}&capital_call_id=${ps_call_id}"
              payload: {}
              as: FundAdministrator
              captures: { ps_alloc1_id: "$.data[0].id" }
            - call: "GET /capital-call-allocations?commitment_id=${psc2_id}&capital_call_id=${ps_call_id}"
              payload: {}
              as: FundAdministrator
              captures: { ps_alloc2_id: "$.data[0].id", ps_alloc2_amt: "$.data[0].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${ps_alloc1_id}/default"
              payload: {}
              as: FundAdministrator
          trigger:
            - call: "POST /capital-call-allocations/${ps_alloc2_id}/fund"
              payload: { paid_amount_cents: "${ps_alloc2_amt}" }
              as: FundAdministrator
              captures: { ps_alloc2_status: "$.data.status" }
          assert:
            - "CapitalCall.${ps_call_id}.status == SETTLED"
            - "CapitalCallAllocation.${ps_alloc2_id}.status == PAID"

      - name: distribution_default_branch_all_allocations_defaulted
        claim_type: Valid Transition
        grounds: ["state_machines.CapitalCall.ISSUED_to_DEFAULTED"]
        distinguishing_aspect: "A single-allocation ISSUED call whose only allocation is defaulted transitions fully to DEFAULTED."
        test_recipe:
          setup: ["Fund with one ACTIVE commitment; an ISSUED call with a single PENDING allocation."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP FD", lp_type: "INSTITUTION", tax_id_last4: "2222" }
              as: FundAdministrator
              captures: { fdlp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "FullDefault Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { fdf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${fdf_id}", lp_id: "${fdlp_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { fdc_id: "$.data.id" }
            - call: "POST /commitments/${fdc_id}/accept"
              payload: {}
