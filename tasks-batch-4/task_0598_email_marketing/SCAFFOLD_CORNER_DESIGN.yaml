            - "Account.${acct}.send_credit_balance == 100"

      - name: author_cannot_schedule_other_accounts_campaign
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_CROSS_ACCOUNT_ACCESS]"]
        distinguishing_aspect: "Multi-tenancy isolation: an AccountUser of account B calling POST /campaigns/{id}/submit-review on account A's campaign gets 403 ERR_CROSS_ACCOUNT_ACCESS, and A's campaign stays in DRAFT."
        test_recipe:
          setup: ["Account A owns campaign C1 in DRAFT; account B has its own CAMPAIGN_AUTHOR user."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "A" }
              as: PlatformAdmin
              captures: { acctA: $.data.id }
            - call: "POST /accounts/${acctA}/users"
              payload: { email: "a@a.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { authorA: $.data.id }
            - call: "POST /accounts"
              payload: { name: "B" }
              as: PlatformAdmin
              captures: { acctB: $.data.id }
            - call: "POST /accounts/${acctB}/users"
              payload: { email: "b@b.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { authorB: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acctA}", name: "Main", default_from_email: "hi@a.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${authorA}"
