      - name: plan_not_approved_on_release
        claim_type: cross_entity_validation
        grounds: ["validations[priority=21]", "errors[ERR_PLAN_NOT_APPROVED]"]

        distinguishing_aspect: "The budget plan's own state gates release: with the plan merely PROPOSED (never approved), an APPROVED disbursement cannot release."
        test_recipe:
