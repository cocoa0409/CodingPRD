        claim_type: input_set_filtering
        grounds:
          - calculations.acuity_score_and_tier
          - entities.EmergencyEvaluation.fields.prior_admission_count_30d
        distinguishing_aspect: "prior_admission_count_30d counts only admissions whose placement_status is PLACED, DISCHARGE_READY or DISCHARGED and whose admitted_at falls in the half-open window [evaluation_started_at - 30 days, evaluation_started_at): one prior sits exactly on the inclusive lower edge and counts, its twin one millisecond earlier does not, and a PENDING_PLACEMENT and a CANCELLED admission inside the window are ignored - so the score is 9/MODERATE where a naive count of all four priors would produce 13/HIGH."
