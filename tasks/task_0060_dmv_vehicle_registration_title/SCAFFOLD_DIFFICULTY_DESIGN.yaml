# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0060_dmv_vehicle_registration_title  (Expert)
# 9 rule_ids x >=2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: use_tax_initial_vs_transfer_cap_divergence
        grounds:
          - calculations.use_tax
          - entities.FeeAssessment.fields.use_tax_cents
          - entities.Registration.fields.registration_type
        distinguishing_aspect: |
          Same Vehicle (price 5,000,000c, KING county, combined rate 0.090) priced through an
          INITIAL registration yields use_tax_cents 450000, but through a TRANSFER registration the
          private-party cap clamps it to 150000 — the dual-variant subject is fiscal use-tax on a
          FeeAssessment/Registration domain.
        test_recipe:
          setup:
            - "Two owners in KING county; two identical vehicles priced 5,000,000c, msrp 5,000,000c, PASSENGER, model_year 2024."
            - "Vehicle V1 registered INITIAL; vehicle V2 has an issued CLEAR title and is registered TRANSFER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "King Owner A", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_a_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_a_id}", vin: "1HGCM82633A000001", model_year: 2024, purchase_price_cents: 5000000, msrp_cents: 5000000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { v1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_a_id}", vin: "1HGCM82633A000002", model_year: 2024, purchase_price_cents: 5000000, msrp_cents: 5000000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { v2_id: $.data.id }
            # V2 gets a CLEAR title so a TRANSFER application is legal
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${v2_id}", submitted_vin: "1HGCM82633A000002", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${v2_id}", applicant_owner_id: "${owner_a_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_v2_init_id: $.data.id }
            - call: "POST /title-applications/${ta_v2_init_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_v2_init_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_v2_init_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${v1_id}", owner_id: "${owner_a_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_init_id: $.data.id }
            - call: "POST /registrations"
              payload: { vehicle_id: "${v2_id}", owner_id: "${owner_a_id}", registration_type: "TRANSFER" }
              as: ClerkAgent
              captures: { reg_transfer_id: $.data.id }
          trigger:
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_init_id}" }
              as: ClerkAgent
              captures: { fa_init_id: $.data.id, init_use_tax: $.data.use_tax_cents }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_transfer_id}" }
              as: ClerkAgent
              captures: { fa_transfer_id: $.data.id, transfer_use_tax: $.data.use_tax_cents }
          assert:
            - "FeeAssessment.${fa_init_id}.use_tax_cents == 450000"
            - "FeeAssessment.${fa_transfer_id}.use_tax_cents == 150000"

      - name: title_brand_clear_vs_rebuilt_on_issue
        grounds:
          - state_machines.TitleApplication.APPROVED_to_ISSUED
          - entities.TitleApplication.fields.issued_title_brand
          - entities.Vehicle.fields.title_status
        distinguishing_aspect: |
          The second dual-variant subject is title BRANDING (a different entity domain than fiscal
          pricing): an ordinary application issues issued_title_brand CLEAR, while a salvage-branded
          application that passed rebuild inspection issues issued_title_brand REBUILT — same issue
          action, divergent brand on the TitleApplication/Vehicle domain.
        test_recipe:
          setup:
            - "Vehicle VC: ordinary (not salvage), VIN verified; Vehicle VS: salvage-branded, VIN verified, passed SalvageInspection."
            - "Both have an INITIAL title application driven to APPROVED."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Brand Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000010", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER", is_salvage_branded: false }
              as: ClerkAgent
              captures: { vc_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000011", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER", is_salvage_branded: true }
              as: ClerkAgent
              captures: { vs_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${vc_id}", submitted_vin: "1HGCM82633A000010", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${vs_id}", submitted_vin: "1HGCM82633A000011", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${vc_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_clear_id: $.data.id }
            - call: "POST /title-applications/${ta_clear_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_clear_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${vs_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_salvage_id: $.data.id }
            - call: "POST /title-applications/${ta_salvage_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /salvage-inspections"
              payload: { title_application_id: "${ta_salvage_id}", result: "PASS" }
              as: InspectionStation
            - call: "POST /title-applications/${ta_salvage_id}/approve"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /title-applications/${ta_clear_id}/issue"
              payload: {}
              as: ClerkAgent
              captures: { clear_brand: $.data.issued_title_brand }
            - call: "POST /title-applications/${ta_salvage_id}/issue"
              payload: {}
              as: ClerkAgent
              captures: { salvage_brand: $.data.issued_title_brand }
          assert:
            - "TitleApplication.${ta_clear_id}.issued_title_brand == CLEAR"
            - "TitleApplication.${ta_salvage_id}.issued_title_brand == REBUILT"
            - "Vehicle.${vc_id}.title_status == CLEAR"
            - "Vehicle.${vs_id}.title_status == REBUILT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_round_then_add_order
        grounds:
          - calculations.registration_fee
          - entities.FeeAssessment.fields.registration_fee_cents
          - entities.Vehicle.fields.msrp_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: registration_fee rounds the MSRP*dep_rate product to the
          nearest cent FIRST, THEN adds the integer weight fee. For msrp 3,200,000c at age 2 (rate
          0.0090) the dep component is round(28800.0)=28800 plus PASSENGER weight 4300 = 33100; the
          pinned round-then-add order is what makes 33100 well-defined.
        test_recipe:
          setup:
            - "Owner KING; vehicle msrp 3,200,000c, price 3,000,000c, PASSENGER, model_year 2024 (age 2 -> band 1, rate 0.0090); INITIAL registration."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Fee Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000020", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.registration_fee_cents == 33100"

      - name: use_tax_three_input_nonlinear_cap_branch
        grounds:
          - calculations.use_tax
          - entities.Owner.fields.residence_county_code
          - entities.Registration.fields.registration_type
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: use_tax combines purchase_price_cents, a
          county-rate lookup (Owner.residence_county_code -> {KING 0.025, PIERCE 0.014, default
          0.010}), the STATE base 0.065, and a conditional min() cap branch on registration_type —
          a different combinatorial axis than the registration_fee round-then-add (mode b) instance.
        test_recipe:
          setup:
            - "Owner in PIERCE county (combined rate 0.079); vehicle price 2,000,000c; INITIAL registration (no cap reached)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Pierce Owner", residence_county_code: "PIERCE" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000021", model_year: 2024, purchase_price_cents: 2000000, msrp_cents: 2000000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.use_tax_cents == 158000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: title_application_branch_fork_salvage_hold
        grounds:
          - state_machines.TitleApplication.DRAFT_to_SUBMITTED
          - state_machines.TitleApplication.SALVAGE_HOLD_to_APPROVED
          - entities.TitleApplication.fields.status
        distinguishing_aspect: |
          TitleApplication is a branching (fork-join) machine: submit forks a salvage-branded vehicle
          to SALVAGE_HOLD (not SUBMITTED) and the two branches rejoin at APPROVED only after the
          salvage branch posts a PASS SalvageInspection — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Salvage-branded vehicle, VIN verified; INITIAL title application in DRAFT."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Salvage Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000030", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER", is_salvage_branded: true }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000030", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
          trigger:
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
              captures: { status_after_submit: $.data.status }
          assert:
            - "TitleApplication.${ta_id}.status == SALVAGE_HOLD"
            - "TitleApplication.${ta_id}.requires_salvage_path == true"

      - name: real_id_application_review_revert_cycle
        grounds:
          - state_machines.RealIdApplication.UNDER_REVIEW_to_SUBMITTED
          - state_machines.RealIdApplication.SUBMITTED_to_UNDER_REVIEW
          - entities.RealIdApplication.fields.status
        distinguishing_aspect: |
          RealIdApplication (a different entity than TitleApplication) is a cyclic machine:
          SUBMITTED -> UNDER_REVIEW -> SUBMITTED via return-for-documents, allowing the review loop
          to repeat — the A->B->A cycle the linear pipelines lack.
        test_recipe:
          setup:
            - "Owner with a REAL ID application advanced to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "RealId Owner", residence_county_code: "KING", identity_documents_verified: true }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /real-id-applications"
              payload: { owner_id: "${owner_id}", documents_complete: true }
              as: ClerkAgent
              captures: { rid_id: $.data.id }
            - call: "POST /real-id-applications/${rid_id}/begin-review"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /real-id-applications/${rid_id}/return-for-documents"
              payload: {}
              as: ClerkAgent
              captures: { status_after_return: $.data.status }
            - call: "POST /real-id-applications/${rid_id}/begin-review"
              payload: {}
              as: ClerkAgent
              captures: { status_second_review: $.data.status }
          assert:
            - "RealIdApplication.${rid_id}.status == UNDER_REVIEW"
            - "Owner.${owner_id}.real_id_status == PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: transfer_issue_releases_perfected_lien_chain
        grounds:
          - state_machines.TitleApplication.APPROVED_to_ISSUED
          - state_machines.Lien.PERFECTED_to_RELEASED
          - entities.Vehicle.fields.active_lien_count
          - entities.Lien.fields.status
        distinguishing_aspect: |
          Depth-4 chain from the title-issue trigger: issue mutates TitleApplication (ISSUED) ->
          that reassigns Vehicle.owner_id (hop 2) -> the owner change releases the prior owner's
          PERFECTED Lien (hop 3) -> that release decrements Vehicle.active_lien_count to 0 (hop 4).
          Each hop is caused by the prior, not by the original action.
        test_recipe:
          setup:
            - "Vehicle owned by O1 with a CLEAR title and one PERFECTED lien (active_lien_count == 1)."
            - "A TRANSFER title application to O2 driven to APPROVED."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner One", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner Two", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { o2_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1_id}", vin: "1HGCM82633A000040", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000040", outcome: "MATCH" }
              as: ClerkAgent
            # Issue an INITIAL CLEAR title to O1 first so a title exists and a lien can perfect
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${o1_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_init_id: $.data.id }
            - call: "POST /title-applications/${ta_init_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_init_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_init_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /liens"
              payload: { vehicle_id: "${veh_id}", lien_holder_name: "First Bank", principal_cents: 1000000 }
              as: ClerkAgent
              captures: { lien_id: $.data.id }
            - call: "POST /liens/${lien_id}/perfect"
              payload: {}
              as: ClerkAgent
            # Now build the TRANSFER application to O2, driven to APPROVED
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${o2_id}", application_type: "TRANSFER" }
              as: ClerkAgent
              captures: { ta_transfer_id: $.data.id }
            - call: "POST /title-applications/${ta_transfer_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_transfer_id}/approve"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /title-applications/${ta_transfer_id}/issue"
              payload: {}
              as: ClerkAgent
          assert:
            - "Vehicle.${veh_id}.owner_id == ${o2_id}"
            - "Lien.${lien_id}.status == RELEASED"
            - "Vehicle.${veh_id}.active_lien_count == 0"

      - name: suspend_cascades_electronic_plate_deactivation
        grounds:
          - state_machines.Registration.ACTIVE_to_SUSPENDED
          - state_machines.LicensePlate.ACTIVE_to_DEACTIVATED
          - entities.LicensePlate.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (registration suspend): suspending the Registration
          (hop 1) deactivates its ELECTRONIC ACTIVE plate (hop 2, caused by the suspend) — a distinct
          propagation pattern (Registration -> LicensePlate) from the title-issue lien chain.
        test_recipe:
          setup:
            - "An ACTIVE registration with one ELECTRONIC plate in status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Plate Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000050", model_year: 2008, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000050", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fee-assessments/${fa_id}/pay"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /license-plates"
              payload: { registration_id: "${reg_id}", plate_number: "ELEC-0050", plate_type: "ELECTRONIC", expected_registration_version: "${reg_v}" }
              as: ClerkAgent
              captures: { plate_id: $.data.id }
            - call: "POST /license-plates/${plate_id}/activate"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /registrations/${reg_id}/suspend"
              payload: {}
              as: DmvAdmin
          assert:
            - "Registration.${reg_id}.status == SUSPENDED"
            - "LicensePlate.${plate_id}.status == DEACTIVATED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: emissions_safety_beats_fees_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 7, ERR_EMISSIONS_REQUIRED) vs business_fiscal
          (priority 13, ERR_FEES_UNPAID): a >=2010 non-motorcycle registration activated with NEITHER
          paid fees NOR an emissions inspection returns the higher-priority safety error
          ERR_EMISSIONS_REQUIRED, not ERR_FEES_UNPAID.
        test_recipe:
          setup:
            - "Registration in PENDING_FEES for a 2024 PASSENGER vehicle with an ISSUED title, but NO PASS emissions inspection AND its FeeAssessment unpaid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Conflict Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000060", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000060", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMISSIONS_REQUIRED"
            - "response.http_status == 409"

      - name: vin_referential_beats_transfer_referential_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=4]
        distinguishing_aspect: |
          Error-category pair state (priority 4, ERR_INVALID_STATE) vs business_referential (priority
          5, ERR_VIN_NOT_VERIFIED): submitting an already-SUBMITTED application whose vehicle VIN is
          ALSO unverified returns the higher-priority state error ERR_INVALID_STATE (the second submit
          is an invalid transition), distinct from the emissions-vs-fees pairing above.
        test_recipe:
