      - name: child_cluster_slot_shadows_the_ancestor_slot_of_the_same_daypart_code
        claim_type: interval_merge
        grounds:
          - calculations.daypart_resolution.formula
          - calculations.daypart_resolution.input_set
          - entities.StoreCluster.fields.parent_cluster_id
        distinguishing_aspect: "Slot inheritance is by daypart_code, not by interval: the child's narrower LUNCH [690, 900) fully replaces the ancestor's LUNCH [660, 960), which is why minute 920 resolves to FALLBACK even though the ancestor slot would have covered it, while the ancestor's DINNER slot remains additive."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A; cluster CL_NATL (tier CHAIN) is the parent of CL_WEST (tier REGION); store S001 belongs to CL_WEST with offset -300."
            - "CL_NATL has a PUBLISHED bundle with LUNCH [660, 960) layout NATL_LUNCH and DINNER [960, 1320) layout NATL_DINNER."
            - "CL_WEST has a PUBLISHED bundle with only LUNCH [690, 900) layout WEST_LUNCH, buffer 15."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
