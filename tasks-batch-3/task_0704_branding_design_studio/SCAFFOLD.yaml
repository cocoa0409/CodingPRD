    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: ["project_id?", "milestone_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/invoices/{invoiceId}/mark-overdue"
    description: "Mark an invoice OVERDUE after due_date; applies tiered late fee"
    roles: [BillingOps]
    code: 200
    input: []
