      - name: sm_open_on_wrong_stage_gate_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GateReview.SCHEDULED_to_IN_SESSION
          - validations[priority 6]
          - errors[ERR_PROJECT_INVALID_STATE]
        distinguishing_aspect: |
          Opening a stage-3 review from dev_status SCREENED fails on the priority-6 stage match
          with ERR_PROJECT_INVALID_STATE, not on the priority-9 sequence rule, and the review row
          stays SCHEDULED with its computed fields untouched.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "SNACK gates 2 and 3 with empty checklists."
            - "One screened SNACK project with a SCHEDULED gate-3 review already booked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 3, category: "SNACK", stage_from: "PILOT_QUALIFIED", stage_to: "LAUNCH_READY", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { ws_g3_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-ws"
              captures: { ws_p_id: $.data.id }
            - call: "POST /innovation-projects/${ws_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-ws"
            - call: "POST /innovation-projects/${ws_p_id}/gate-reviews"
              payload: { gate_id: "${ws_g3_id}", scheduled_at: "2026-08-20T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-ws"
              captures: { ws_gr3_id: $.data.id }
          trigger:
            - call: "POST /gate-reviews/${ws_gr3_id}/open"
              as: GateChair
              as_user_id: "chair-ws"
          assert:
            - "the response is 409 with data.error_id == ERR_PROJECT_INVALID_STATE"
            - "the error is not ERR_GATE_SEQUENCE_VIOLATION, because priority 6 precedes priority 9"
            - "GateReview.${ws_gr3_id}.status == SCHEDULED with deliverable_completeness_pct == 0.00 and readiness_index == 0.00"
            - "InnovationProject.${ws_p_id}.dev_status == SCREENED and next_gate_number == 2"

      - name: sm_run_and_study_commitments_sync_the_project_ledger
        claim_type: ledger_sync
        grounds:
          - calculations.committed_development_budget
          - entities.InnovationProject.fields.development_budget_committed_usd
          - endpoints[POST /formulations/{id}/pilot-runs]
          - endpoints[POST /formulations/{id}/shelf-life-studies]
        distinguishing_aspect: |
          The ancestor ledger is re-derived from its live contributors on every child write: it
          reads 0.00, then 60000.00 after the run, then 100000.00 after the study, with each value
          observable on the project row rather than only inside the children.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK project in dev_status IDEA with a 500000.00 development budget cap."
            - "One DRAFT formulation on that project and one NONE-regime pilot line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo", line_code: "TOL-7", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 500.00 }
              as: PortfolioAdmin
              captures: { lg_line_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-lg"
              captures: { lg_p_id: $.data.id, lg_p_v1: $.data.version }
            - call: "POST /innovation-projects/${lg_p_id}/formulations"
              payload: { expected_project_version: "${lg_p_v1}", spec_summary: "Toffee inclusion at 12 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 3.2000 }
              as: RnDLead
              captures: { lg_f_id: $.data.id, lg_f_v1: $.data.version }
          trigger:
            - call: "POST /formulations/${lg_f_id}/pilot-runs"
              payload: { pilot_line_id: "${lg_line_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T20:00:00Z", planned_units: 10000, committed_cost_usd: 60000.00 }
              as: RnDLead
              captures: { lg_run_id: $.data.id }
            - call: "GET /innovation-projects/${lg_p_id}"
              as: RnDLead
            - call: "POST /formulations/${lg_f_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${lg_f_v1}", duration_days: 180, committed_cost_usd: 40000.00, start_at: "2026-08-11T00:00:00Z" }
              as: RnDLead
              captures: { lg_study_id: $.data.id }
            - call: "GET /innovation-projects/${lg_p_id}"
              as: RnDLead
          assert:
            - "after the run create, InnovationProject.${lg_p_id}.development_budget_committed_usd == 60000.00"
            - "after the study create, InnovationProject.${lg_p_id}.development_budget_committed_usd == 100000.00"
            - "PilotRun.${lg_run_id}.status == SCHEDULED with committed_cost_usd 60000.00 and effective_buffer_minutes == 240"
            - "ShelfLifeStudy.${lg_study_id}.status == ACTIVE with timepoints == [] and verdict null"
            - "Formulation.${lg_f_id}.status == DRAFT throughout, so the ledger moved without a formulation transition"
            - "InnovationProject.${lg_p_id}.development_budget_cap_usd == 500000.00, so neither write was near the cap"

      - name: sm_screening_rejection_creates_no_checklist
        claim_type: side_effect_execution
        grounds:
          - state_machines.InnovationProject.dev_status.IDEA_to_KILLED
        excluded_because:
          difficulty_instance: boundary_precision_check / screening_score_at_pass_floor_versus_one_hundredth_below
          rationale: "That instance already asserts the rejected project reaches KILLED with a deliverable list of total_count 0 while the passing twin gets total_count 1."

      - name: sm_parallel_dev_and_commercial_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.InnovationProject.dev_status
          - state_machines.InnovationProject.commercial_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_commercial_track_cycles_while_dev_track_holds
          rationale: "That instance cycles commercial_status through SELL_IN_REJECTED and back while dev_status is pinned, and asserts the combined pair at every step."

      - name: sm_deliverable_reject_resubmit_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Deliverable.REJECTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deliverable_reject_resubmit_revision_cycle
          rationale: "That instance drives PENDING to SUBMITTED to REJECTED to SUBMITTED to APPROVED and asserts submission_count 2."

      - name: sm_gate_close_branching_fork
        claim_type: branching
        grounds:
          - state_machines.GateReview.IN_SESSION_to_RECYCLED
          - state_machines.GateReview.IN_SESSION_to_KILLED
        excluded_because:
          difficulty_instance: non_linear_state_machine / gate_review_veto_fork_divergent_project_outcomes
          rationale: "That instance sends one REJECT vote down both forks and asserts the divergent project outcomes and cascades."

      - name: sm_formulation_supersede_cascade_down
        claim_type: cascade_down
        grounds:
          - state_machines.Formulation.SHELF_LIFE_CLEARED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / formulation_supersede_four_level_lock_slip_cascade
          rationale: "That instance walks the four-level cascade from the new revision to study abandonment, label invalidation, deliverable regression and the commercial lock slip."

      - name: sm_kill_cascade_bubbles_to_presentations
        claim_type: cross-entity
        grounds:
          - state_machines.InnovationProject.dev_status.SCREENED_to_KILLED
        excluded_because:
          difficulty_instance: transitive_cascade / gate_kill_cascade_releases_retailer_slot
          rationale: "That instance asserts the kill cascade withdrawing presentations, releasing the reset-window slot and resetting authorized_acv_pct."

      - name: sm_pilot_run_cancel_compensation
        claim_type: compensation
        grounds:
          - state_machines.PilotRun.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / dev_budget_ledger_restored_after_pilot_run_cancel
          rationale: "That instance asserts the ledger returning to its pre-write value with no drift and the window becoming re-bookable."

  # -------------------------------------------------------- Calculations ----
  - section: calculations
    instances:
      - name: calc_concept_score_confidence_tiers_at_sample_boundaries
        claim_type: tier_lookup
        grounds:
          - calculations.concept_score.CONFIDENCE_TIERS
          - entities.ConceptTest.fields.is_authoritative
        distinguishing_aspect: |
          The confidence multiplier is a step function on sample_size, so one extra respondent at
          99 to 100 moves the score by 6.40 while the 199 respondents from 100 to 299 move it by
          nothing at all; only the newest test stays authoritative.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK project in dev_status IDEA; no gate is needed because the project is never screened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-ct"
              captures: { ct_p_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${ct_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 99, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-01T00:00:00Z" }
              as: InnovationLead
              captures: { ct_t99_id: $.data.id }
            - call: "POST /innovation-projects/${ct_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 100, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-02T00:00:00Z" }
              as: InnovationLead
              captures: { ct_t100_id: $.data.id }
            - call: "POST /innovation-projects/${ct_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 299, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-03T00:00:00Z" }
              as: InnovationLead
              captures: { ct_t299_id: $.data.id }
            - call: "POST /innovation-projects/${ct_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 300, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-04T00:00:00Z" }
              as: InnovationLead
              captures: { ct_t300_id: $.data.id }
          assert:
            - "ConceptTest.${ct_t99_id}.concept_score == 54.40 at confidence 0.85"
            - "ConceptTest.${ct_t100_id}.concept_score == 60.80 and ConceptTest.${ct_t299_id}.concept_score == 60.80"
            - "ConceptTest.${ct_t300_id}.concept_score == 64.00 at confidence 1.00"
            - "one respondent moves the score 54.40 to 60.80 while 199 respondents inside the same tier move it not at all"
            - "ConceptTest.${ct_t300_id}.is_authoritative == true while ${ct_t99_id}, ${ct_t100_id} and ${ct_t299_id} are all false"
            - "GET /innovation-projects/${ct_p_id}/concept-tests returns total_count 4"

      - name: calc_readiness_index_reads_the_authoritative_concept_test
        claim_type: input_selection
        grounds:
          - calculations.gate_readiness_index
          - entities.ConceptTest.fields.is_authoritative
        distinguishing_aspect: |
          The readiness index consumes the authoritative concept test and not the first one on
          file, so a weak early read of 40.00 is displaced by a later 64.00 and the index lands on
          46.00 rather than 40.00 even though both rows are still stored.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist, quorum 1, no veto functions and readiness floor 0.00."
            - "One SNACK LINE_EXTENSION project carrying two concept tests and no business case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { ac_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-ac"
              captures: { ac_p_id: $.data.id }
            - call: "POST /innovation-projects/${ac_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 300, purchase_intent_top2_pct: 50.00, uniqueness_pct: 25.00, fielded_at: "2026-06-10T00:00:00Z" }
              as: InnovationLead
              captures: { ac_weak_id: $.data.id }
            - call: "POST /innovation-projects/${ac_p_id}/concept-tests"
              payload: { test_type: "SEQUENTIAL_MONADIC", sample_size: 300, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-15T00:00:00Z" }
              as: InnovationLead
              captures: { ac_strong_id: $.data.id }
            - call: "POST /innovation-projects/${ac_p_id}/screen"
              payload: { screening_notes: "Second concept read is the one to bank on." }
              as: GateChair
              as_user_id: "chair-ac"
            - call: "POST /innovation-projects/${ac_p_id}/gate-reviews"
              payload: { gate_id: "${ac_g2_id}", scheduled_at: "2026-08-12T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-ac"
              captures: { ac_gr_id: $.data.id }
          trigger:
            - call: "POST /gate-reviews/${ac_gr_id}/open"
              as: GateChair
              as_user_id: "chair-ac"
          assert:
            - "ConceptTest.${ac_weak_id}.concept_score == 40.00 with is_authoritative false"
            - "ConceptTest.${ac_strong_id}.concept_score == 64.00 with is_authoritative true"
            - "GateReview.${ac_gr_id}.deliverable_completeness_pct == 100.00 from EMPTY_CHECKLIST_RESULT"
            - "GateReview.${ac_gr_id}.readiness_index == 46.00, being 0.30 * 100.00 plus 0.25 * 64.00 with hurdle and yield both 0.00"
            - "GateReview.${ac_gr_id}.readiness_index != 40.00, the value the superseded first concept test would have produced"
            - "GET /innovation-projects/${ac_p_id}/concept-tests returns total_count 2, so the weak row was displaced rather than deleted"

      - name: calc_readiness_index_capped_at_one_hundred
        claim_type: cap_application
        grounds:
          - calculations.gate_readiness_index.INDEX_CAP
          - calculations.gate_readiness_index.CATEGORY_FACTOR
        distinguishing_aspect: |
          A perfect RENOVATION project in HOUSEHOLD multiplies a base of 100.00 by the 1.05
          category factor, so the cap is the only thing standing between the stored 100.00 and an
          out-of-range 105.00 on a field declared 0.00..100.00.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A HOUSEHOLD gate 2 with an empty checklist, quorum 1, no veto functions, zero hurdles and readiness floor 0.00."
            - "One NONE-regime pilot line."
            - "One HOUSEHOLD RENOVATION project screened at 77.00, with a perfect concept test, a hurdle-clearing business case and a 100 percent pilot yield."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "HOUSEHOLD", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
