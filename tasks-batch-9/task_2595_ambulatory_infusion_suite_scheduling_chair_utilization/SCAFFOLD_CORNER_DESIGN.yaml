            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: Scheduler
            - call: "POST /appointments/${ap1}/start-infusion"
              payload: {}
              as: InfusionNurse
