  - rule_id: boundary_precision_check
    instances:

      - name: cfi_exactly_at_clear_boundary_flags_review
        grounds:
          - calculations.composite_financial_index
          - state_machines.IndicatorReport.SUBMITTED_to_FLAGGED_REVIEW
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Boundary on the CFI ratio metric reached via the EVALUATE endpoint:
          CFI == 1.10 exactly is NOT > 1.10, so the report lands FLAGGED_REVIEW
          (not CLEARED) and no sanction outcome is created; one cent of ratio
          precision decides the band.
        test_recipe:
          setup:
            - "PRIVATE_NONPROFIT institution with a DUE 2026 indicator report; ratios prr 0.05, vr 0.05, nor 0.07 chosen so CFI == 1.10 exactly (0.40*1.00 + 0.35*1.00 + 0.25*1.40)."
            - "EMI inputs are neutral (enrollment -9.0, completion 51.0, retention 71.0 -> EMI -4.00, not flagging)."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_rep1_new
            - call: "POST /accreditation/indicator-reports/${rep1_id}/submit"
              payload: { primary_reserve_ratio: 0.05, viability_ratio: 0.05, net_operating_ratio: 0.07, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 800 }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { cfi_at_boundary: $.data.cfi_value }
          trigger:
            - *a_rep1_eval
            - *a_outs_inst
          assert:
            - "cfi_at_boundary == 1.10 exactly"
            - "IndicatorReport.${rep1_id}.status == FLAGGED_REVIEW (1.10 is not strictly greater than CFI_CLEAR_ABOVE 1.10)"
            - "no ActionOutcome exists for the institution (GET outcomes returns an empty array) and sanction_status remains NONE — REVIEW band never cascades"

