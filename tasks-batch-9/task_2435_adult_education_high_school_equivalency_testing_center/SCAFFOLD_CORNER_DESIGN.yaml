              payload: { current_utc: "2026-08-20T15:30:00Z" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-registrations/${g4}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "${p}"
            - call: "POST /exam-registrations/${g4}/result"
              payload: { scale_score: 150 }
              as: Proctor
              as_user_id: "${p}"
            - call: "POST /credentials"
              payload: { student_id: "${s}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { cred: $.data.id }
            - call: "POST /students/${s}/transcript-orders"
              payload: { credential_issuance_id: "${cred}", copies: 2, delivery: "STANDARD", destination_type: "EMPLOYER" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { ord: $.data.id }
            - call: "POST /funding-periods"
              payload: { label: "FY27-CASCADE", start_date: "2026-08-01", end_date: "2026-12-01", rate_cents_per_weight: 10000, total_cents: 500000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "CREDENTIAL_ATTAINMENT", evidence_ref: "ev-mira-cred", credential_issuance_id: "${cred}" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o: $.data.id }
            - call: "POST /outcome-records/${o}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "GET /funding-periods/${fp}"
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fpv: $.data.version }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fpv}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { committed_before: $.data.committed_cents }
          trigger:
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "REVOKE" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { revoked: $.data.certification_status }
            - call: "POST /students/${s}/transcript-orders"
              payload: { credential_issuance_id: "${cred}", copies: 1, delivery: "STANDARD", destination_type: "SELF" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { e1: $.data.error_id }
          assert:
            - "before the revocation: GET /credentials/${cred} reports data.status == 'ISSUED' and data.composite_score == 600, GET /transcript-orders/${ord} reports data.status == 'QUEUED', GET /outcome-records/${o} reports data.status == 'CERTIFIED' with data.weight == 1.50, data.allocated_cents == 15000 and data.allocation_status == 'COMMITTED', and the allocation run reported data.committed_cents == 15000 with data.available_cents == 485000"
            - "the revocation returns 200 with data.certification_status == 'REVOKED' and data.assigned_session_count == 0"
            - "link 1 and 2a are no-ops: GET /exam-sessions?proctor_id=${p}&limit=10&offset=0 returns total_count == 4 with every row still status 'COMPLETED'"
            - "link 2b: GET /exam-registrations?student_id=${s}&registration_status=RESULT_INVALIDATED&limit=10&offset=0 returns total_count == 4, and each row retains its result_outcome 'PASSED' and scale_score 150 for audit"
            - "link 3: GET /credentials/${cred} reports data.status == 'VOIDED' with data.void_reason == 'PROCTOR_REVOKED', and GET /students/${s} reports data.credential_status == 'REVOKED'"
            - "link 4: GET /transcript-orders/${ord} reports data.status == 'HELD' with data.hold_reason == 'CREDENTIAL_VOIDED' and data.fulfilled_at == null, and GET /outcome-records/${o} reports data.status == 'RESCINDED' with data.rescission_reason == 'CREDENTIAL_VOIDED'"
            - "link 5: GET /outcome-records/${o} reports data.allocation_status == 'REVOKED' and data.allocated_cents == 0, and GET /funding-periods/${fp} reports data.committed_cents == 0 and data.available_cents == 500000 - the money is returned to the pool, not merely marked"
            - "the new transcript order against the voided credential returns 409 with data.error_id == 'ERR_CREDENTIAL_NOT_ISSUED' and GET /transcript-orders?credential_issuance_id=${cred}&limit=10&offset=0 still returns total_count == 1"

  - section: consistency model
    instances:
      - name: derived_fields_are_visible_immediately_in_the_same_request_cycle
        claim_type: immediate_visibility
        grounds:
          - complexity_profile[consistency_model=immediate]
          - entities[ClassSection.seats_taken]
          - entities[Enrollment.posted_hours]
        distinguishing_aspect: |
          Under an immediate consistency model no derived value may lag: the response of the write that
          caused it must already carry the new figure, and any read issued straight afterwards must agree
          with that response. The instance checks three different shapes of derivation in one pass - a
          parent counter (ClassSection.seats_taken), a same-entity accumulator (Enrollment.posted_hours),
          and a cascade result (the CLOSED transition withdrawing an under-hours enrollment) - and in each
          case compares the writing response against an immediately following read, with no intervening
          clock move that could excuse a stale value.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one PLACED student and one OPEN class section with 10 seats."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Sol Aguirre", email: "sol.aguirre@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "Immediate Section", instructor_user_id: "instructor-51", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id, entry_level: $.data.entry_efl_level }
            - call: "GET /class-sections/${sec}"
              as: ProgramCoordinator
              captures: { seats_now: $.data.seats_taken }
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-02", hours: 3.25 }
              as: Instructor
              captures: { entry: $.data.id }
            - call: "GET /enrollments/${e}"
              as: Instructor
              captures: { hours_now: $.data.posted_hours }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "IN_SESSION" }
              as: ProgramCoordinator
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "CLOSED" }
              as: ProgramCoordinator
              captures: { closed: $.data.status }
            - call: "GET /enrollments/${e}"
              as: ProgramCoordinator
              captures: { final_status: $.data.status }
          assert:
            - "the enrollment response already carries data.status == 'ACTIVE' and data.entry_efl_level == 2, and the immediately following section read reports data.seats_taken == 1 - the parent counter does not lag"
            - "the attendance response is accepted and the immediately following enrollment read reports data.posted_hours == 3.25 and data.post_test_eligible == false"
            - "the CLOSED transition returns 200 with data.status == 'CLOSED' and the immediately following enrollment read reports data.status == 'WITHDRAWN' with data.withdrawn_at set to the current logical clock - the cascade is applied inside the transition, not afterwards"
            - "no read in this instance is preceded by a clock move, so every agreement above is same-request-cycle visibility rather than eventual convergence"
