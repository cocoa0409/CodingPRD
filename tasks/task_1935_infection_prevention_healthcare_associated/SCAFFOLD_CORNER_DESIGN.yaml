- section: endpoints
  instances:
  - name: response_envelope_shape_on_success_and_error
    claim_type: standard_crud
    grounds:
    - response_envelope
    distinguishing_aspect: Every response carries meta.api_request_id + meta.api_request_timestamp + response_type + data; success object responses use response_type 'object', lists 'array', errors 'error'
      with data.error_id + data.message.
    test_recipe:
      setup:
      - facility + unit exist; one bogus id for the error path
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
