              as_user_id: "officer-1"
              captures: { filing1_id: $.data.id }
          trigger:
            - call: "POST /compliance-obligations/${ob_id}/filings"
              payload: { filing_kind: "ANNUAL_REPORT", expected_compliance_obligation_version: "${ob_v_stale}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 412 with error_id 'ERR_STALE_VERSION'"
            - "GET /filings with compliance_obligation_id=${ob_id} returns exactly 1 row"
            - "ComplianceObligation.${ob_id}.version is greater than the captured stale value by exactly 1"

      - name: corner_occ_stale_registration_version_rejects_second_appointment_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agent-appointment-create-stale-registration]
          - validations[priority=15]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating the first appointment bumps Registration.version; a second create replaying the pre-bump version is rejected with 412 ERR_STALE_VERSION and the registration keeps exactly one appointment."
        test_recipe:
          setup:
            - "A DE StateRule; one client, one DE entity, one PENDING DE registration whose version is captured at creation."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v_stale: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v_stale}" }
              as: ComplianceOfficer
              captures: { appt_a_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Keystone Agent Services", appointed_on: "2026-05-02", expected_registration_version: "${reg_v_stale}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 412 with error_id 'ERR_STALE_VERSION'"
            - "GET /agent-appointments with registration_id=${reg_id} returns exactly 1 row whose id is ${appt_a_id}"

      - name: corner_occ_stale_entity_version_rejects_second_boi_report_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[boi-report-create-stale-entity]
          - validations[priority=15]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating the first BOI report bumps LegalEntity.version; a second create replaying the pre-bump version is rejected with 412 ERR_STALE_VERSION and the entity keeps exactly one report."
        test_recipe:
          setup:
            - "One client and one DE entity formed 2026-02-10 with one beneficial owner; the entity version is captured after the owner is added."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-02-10" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/beneficial-owners"
              payload: { full_name: "Ada Mercer", date_of_birth: "1980-04-02", residential_address: "12 Pier Rd", id_document_number: "P4471190", ownership_pct: 60, is_company_applicant: true }
              as: ComplianceOfficer
            - call: "GET /legal-entities/${ent_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ent_v_stale: $.data.version }
            - call: "POST /legal-entities/${ent_id}/boi-reports"
              payload: { report_kind: "INITIAL", includes_company_applicant: true, expected_legal_entity_version: "${ent_v_stale}" }
              as: ComplianceOfficer
              captures: { boi1_id: $.data.id }
          trigger:
            - call: "POST /legal-entities/${ent_id}/boi-reports"
              payload: { report_kind: "INITIAL", includes_company_applicant: true, expected_legal_entity_version: "${ent_v_stale}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 412 with error_id 'ERR_STALE_VERSION'"
            - "GET /legal-entities/${ent_id}/boi-reports returns exactly 1 row whose id is ${boi1_id}"

      - name: corner_version_increments_by_one_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.LegalEntity.fields.legal_name
          - entities.Registration.fields.status
        distinguishing_aspect: "LegalEntity.version is 1 at creation, 2 after a PATCH and 3 after a second PATCH; a plain GET never advances it."
        test_recipe:
          setup:
            - "One client and one DE entity."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
          trigger:
            - call: "PATCH /legal-entities/${ent_id}"
              payload: { authorized_shares: 8000 }
              as: ComplianceOfficer
            - call: "GET /legal-entities/${ent_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "PATCH /legal-entities/${ent_id}"
              payload: { issued_shares: 4000 }
              as: ComplianceOfficer
          assert:
            - "LegalEntity.${ent_id}.version == 1 immediately after creation"
            - "LegalEntity.${ent_id}.version == 2 after the first PATCH"
            - "The intervening GET leaves version at 2"
            - "LegalEntity.${ent_id}.version == 3 after the second PATCH"
            - "LegalEntity.${ent_id}.authorized_shares == 8000 and issued_shares == 4000"

      - name: corner_ops_run_advances_every_open_obligation_in_one_pass
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints["POST /_ops/advance-calendar"]
          - calculations.obligation_status_advance
          - calculations.portfolio_rollup
        distinguishing_aspect: "A single ops-run at clock 2027-04-01 moves both the ANNUAL_REPORT 2027 and FRANCHISE_TAX 2027 obligations to DELINQUENT, reports obligations_advanced 2, and leaves the ANNUAL_REPORT 2028 obligation SCHEDULED."
        test_recipe:
          setup:
            - "A DE StateRule; one client, one DE entity, one ACTIVE DE registration."
            - "Three obligations: ANNUAL_REPORT 2027, FRANCHISE_TAX 2027 (both due 2027-03-01, grace end 2027-03-31) and ANNUAL_REPORT 2028 (due 2028-03-01)."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000, franchise_tax_filing_fee_cents: 5000, grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob_ar27_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob_ft27_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2028 }
              as: ComplianceOfficer
              captures: { ob_ar28_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/advance-calendar"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ComplianceObligation.${ob_ar27_id}.status == 'DELINQUENT' and late_fee_cents == 20000 and total_due_cents == 29900"
            - "ComplianceObligation.${ob_ft27_id}.status == 'DELINQUENT' and late_fee_cents == 20000 and total_due_cents == 29900"
            - "ComplianceObligation.${ob_ar28_id}.status == 'SCHEDULED' and late_fee_cents == 0 and total_due_cents == 9900"
            - "The ops-run response reports obligations_advanced == 2"
            - "Registration.${reg_id}.status == 'DELINQUENT' and delinquency_rank == 3"
            - "Client.${client_id}.portfolio_open_obligation_count == 3"
            - "Client.${client_id}.portfolio_outstanding_cents == 69700"

