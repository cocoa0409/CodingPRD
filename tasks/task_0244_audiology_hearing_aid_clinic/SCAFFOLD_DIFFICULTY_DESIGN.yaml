  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trial_window_inclusive_deadline_purchase_on_last_day
        grounds:
          - entities.FittingOrder.fields.trial_deadline_at
          - validations[priority=9]
          - state_machines.FittingOrder.TRIAL_to_PURCHASED
        distinguishing_aspect: |
          FittingOrder trial window is a half-open-from-start, inclusive-at-deadline interval: a purchase
          AT trial_deadline_at (clock == deadline) succeeds (now <= deadline), but one second past fails.
          Interval semantics = inclusive upper boundary on the order resource.
        test_recipe:
          setup:
            - "TRIAL_PERIOD_DAYS=30. Trial started 2026-03-01T00:00:00Z, deadline 2026-03-31T00:00:00Z."
            - "Clock set exactly to the deadline 2026-03-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Deadline Pt", date_of_birth: "1958-06-06" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-DDL-1", name: "DeadlineModel", list_price_cents: 300000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
