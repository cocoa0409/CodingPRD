            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - *c_batch_full
            - *c_assign_full
            - *c_start_full
            - *c_priv1
            - *c_priv2
            - *c_progress_full
            - *c_submit_full
            - *c_rev_c
            - *c_sample_full
            - *c_sample_full_pass
            - *c_priv1_validate
            - *c_priv2_validate
            - *c_release
            - *c_close
          trigger:
