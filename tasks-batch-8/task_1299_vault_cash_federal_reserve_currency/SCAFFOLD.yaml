# =============================================================================
# Scaffold: Vault Cash & Federal Reserve Currency Ordering (bank cash management)
# =============================================================================

scenario: |
  Vault Cash & Federal Reserve Currency Ordering (bank cash management): cash-in-transit schedule & armored carrier coordination, fed order/deposit cycle & denomination mix, vault limit & insurance coverage constraint, fitness sorting & unfit currency return, counterfeit detection, seizure & reporting, ATM cash forecasting & residual balance, cash inventory reconciliation across locations, holiday/seasonal demand planning

domain_name: vault-cash-fed-ordering
api_prefix: /vault-cash

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching   # plus cyclic (FedOrder, FitnessBatch) and parallel (AtmMachine) per-machine
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# All money is integer cents. All dates are "YYYY-MM-DD"; all datetimes ISO8601 UTC.
# Logical clock: POST /vault-cash/_clock/set_current_utc drives all time rules;
# server default before any set call is exactly 2026-08-01T00:00:00Z.
# =============================================================================
entities:
  - name: VaultSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: site_type, type: enum, source: input, description: "CENTRAL | BRANCH" }
      - { name: vault_limit_cents, type: integer, source: input, description: "Regulatory vault holding cap; on_hand_total_cents >= this freezes the site" }
      - { name: insurance_coverage_cents, type: integer, source: input, description: "Insurance policy ceiling for cash on premises plus committed inbound exposure" }
      - { name: dock_capacity, type: integer, source: input, constraints: ">= 1", description: "Max number of inbound shipments whose arrival instant may coincide (dock window +/-30 min)" }
      - { name: opening_fit_cents, type: integer, source: input, default: 0, description: "Opening fit-cash balance seeded at creation; system posts OPENING_BALANCE ledger entries" }
      - { name: opening_unfit_cents, type: integer, source: input, default: 0, description: "Opening unfit-cash balance seeded at creation" }
      - { name: on_hand_fit_cents, type: integer, source: computed, description: "Fit cash on hand; mutated only via ledger-driven recompute" }
      - { name: on_hand_unfit_cents, type: integer, source: computed, description: "Unfit cash on hand (excludes fitness-batch escrow)" }
      - { name: reserved_out_cents, type: integer, source: computed, description: "Value reserved by SCHEDULED/LOADED outbound shipments, not yet departed" }
      - { name: in_transit_inbound_cents, type: integer, source: computed, description: "Declared value of inbound shipments in LOADED/IN_TRANSIT" }
      - { name: pending_inbound_order_cents, type: integer, source: computed, description: "Face value of FedOrders direction=ORDER in SUBMITTED/ACKNOWLEDGED/IN_TRANSIT" }
      - { name: on_hand_total_cents, type: integer, source: computed, description: "= on_hand_fit_cents + on_hand_unfit_cents" }
      - { name: insurance_headroom_cents, type: integer, source: computed, description: "= insurance_coverage_cents - (on_hand_total_cents + in_transit_inbound_cents + pending_inbound_order_cents); may go negative only via advice variance, never via a guarded write" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | ELEVATED | FROZEN — derived per calculations.vault_posture_derivation; re-derived on every ledger/case/recon event" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff display name" }
      - { name: home_site_id, type: string, source: input, description: "FK -> VaultSite.id; scopes all site-scoped roles (custodian, fed coordinator, atm analyst, compliance officer)" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive staff identity is rejected at auth" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Armored carrier company name" }
      - { name: liability_cap_per_truck_cents, type: integer, source: input, description: "Max declared value one truck may carry" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — set via PATCH /carriers/{id}" }

  - name: AtmMachine
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id; vault that services this ATM" }
      - { name: terminal_code, type: string, source: input, description: "Unique terminal code" }
      - { name: cash_capacity_cents, type: integer, source: input, description: "Physical cassette capacity" }
      - { name: opening_balance_cents, type: integer, source: input, default: 0, description: "Balance seeded at creation" }
      - { name: current_balance_cents, type: integer, source: computed, description: "opening + loads - settled withdrawals; zeroed at settle (residual returns to vault)" }
      - { name: cash_posture, type: enum, source: computed, description: "NORMAL | LOW | CRITICAL — vs capacity: CRITICAL if balance*20 < capacity; LOW if balance*5 < capacity; else NORMAL" }
      - { name: service_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OUT_OF_SERVICE — independent axis from cash_posture" }
      - { name: current_forecast_id, type: string, source: system, description: "Forecast currently PUBLISHED for this ATM, or null" }

  - name: SeasonalWindow
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id" }
      - { name: name, type: string, source: input, description: "Holiday/season label" }
      - { name: start_date, type: string, source: input, description: "Inclusive first date (YYYY-MM-DD)" }
      - { name: end_date, type: string, source: input, description: "Inclusive last date; must be >= start_date" }
      - { name: multiplier_bps, type: integer, source: input, constraints: "> 10000", description: "Demand multiplier in basis points applied by SEASONAL forecast variant" }

  - name: FedOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id; destination for ORDER, origin for DEPOSIT" }
      - { name: direction, type: enum, source: input, description: "ORDER (cash in from Fed) | DEPOSIT (cash out to Fed)" }
      - { name: business_date, type: string, source: input, description: "Value date (YYYY-MM-DD) the order settles" }
      - { name: face_total_cents, type: integer, source: computed, description: "Sum of DenominationLine.line_cents" }
      - { name: fee_total_cents, type: integer, source: computed, description: "Sum of DenominationLine.fee_cents (per-line round_half_up then sum — pinned order)" }
      - { name: grand_total_cents, type: integer, source: computed, description: "= face_total_cents + fee_total_cents" }
      - { name: advice_count, type: integer, source: system, default: 0, description: "Number of Fed advices recorded" }
      - { name: settled_basis_cents, type: integer, source: system, description: "Booked value basis for advice deltas: null until a linked shipment exception-accept sets it to counted_value_cents; each advice resets it to counted_total_cents. Effective basis = settled_basis_cents if set else face_total_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | IN_TRANSIT | RECEIVED | DISPUTED | RECONCILED | CANCELLED" }

  - name: DenominationLine
    parent: FedOrder
    common_fields: false
    fields:
      - { name: fed_order_id, type: string, source: system, description: "FK -> FedOrder.id; set from path" }
      - { name: denomination_cents, type: integer, source: input, constraints: "one of 100|200|500|1000|2000|5000|10000", description: "Note face value in cents" }
      - { name: strap_count, type: integer, source: input, constraints: ">= 1", description: "Number of 100-note straps; ORDER direction requires multiple of 10 for denom <= 2000 and multiple of 5 for denom >= 5000" }
      - { name: line_cents, type: integer, source: computed, description: "= denomination_cents * 100 * strap_count" }
      - { name: fee_cents, type: integer, source: computed, description: "= round_half_up(line_cents / 160); summed per line into FedOrder.fee_total_cents" }

  - name: CashShipment
    parent: null
    common_fields: true
    fields:
      - { name: fed_order_id, type: string, source: input, description: "FK -> FedOrder.id; null for inter-site transfers" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: origin_site_id, type: string, source: system, description: "FK -> VaultSite.id; null when origin is the Fed (inbound ORDER); derived from linked order for order shipments, else from request" }
      - { name: destination_site_id, type: string, source: system, description: "FK -> VaultSite.id; null when destination is the Fed (outbound DEPOSIT); derived like origin" }
      - { name: declared_value_cents, type: integer, source: computed, description: "= linked FedOrder.face_total_cents when fed_order_id set; otherwise client-supplied declared_value_cents input is stored verbatim" }
      - { name: counted_value_cents, type: integer, source: system, description: "Value counted at destination verify; null until first verify" }
      - { name: scheduled_departure_at, type: datetime, source: input, description: "Scheduled departure instant (ISO8601 UTC)" }
      - { name: scheduled_arrival_at, type: datetime, source: input, description: "Scheduled arrival instant; must be > scheduled_departure_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LOADED | IN_TRANSIT | EXCEPTION | VERIFIED | CANCELLED" }

  - name: FitnessBatch
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id" }
      - { name: input_unfit_cents, type: integer, source: input, description: "Unfit value escrowed from the site at creation" }
      - { name: fit_recovered_cents, type: integer, source: system, default: 0, description: "Fit value determined by latest sort-results" }
      - { name: unfit_remaining_cents, type: integer, source: system, default: 0, description: "Unfit value remaining after latest sort-results" }
      - { name: counterfeit_face_cents, type: integer, source: system, default: 0, description: "Face value of notes determined counterfeit" }
      - { name: shrink_cents, type: integer, source: computed, description: "= input_unfit_cents - (fit_recovered_cents + unfit_remaining_cents + counterfeit_face_cents)" }
      - { name: status, type: enum, source: system, description: "OPEN | SORTED | SETTLED" }

  - name: CounterfeitCase
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> VaultSite.id; from request or from linked fitness batch" }
      - { name: fitness_batch_id, type: string, source: input, description: "FK -> FitnessBatch.id; null for direct detection" }
      - { name: denomination_cents, type: integer, source: input, constraints: "one of 100|200|500|1000|2000|5000|10000", description: "Note face value" }
      - { name: note_count, type: integer, source: input, constraints: ">= 1", description: "Number of suspect notes" }
      - { name: face_value_cents, type: integer, source: computed, description: "= denomination_cents * note_count" }
      - { name: seized_by_staff_id, type: string, source: system, description: "X-User-ID recorded at seize" }
      - { name: seized_at, type: datetime, source: system, description: "Logical clock at seize" }
      - { name: reported_by_staff_id, type: string, source: system, description: "X-User-ID recorded at report; must differ from seized_by_staff_id (SoD)" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at report" }
      - { name: status, type: enum, source: system, description: "DETECTED | SEIZED | REPORTED | SETTLED_WITH_FED | RELEASED" }

  - name: CashLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id" }
      - { name: business_date, type: string, source: input, description: "Value date (YYYY-MM-DD); may be earlier than today for late/backdated adjustments" }
      - { name: entry_type, type: enum, source: system, description: "OPENING_BALANCE | FED_RECEIPT | FED_DEPOSIT | SHIPMENT_IN | SHIPMENT_OUT | ATM_LOAD | ATM_RESIDUAL_RETURN | FITNESS_RECLASS | COUNTERFEIT_SEIZURE | COUNTERFEIT_RELEASE | ADJUSTMENT — manual posts are always ADJUSTMENT" }
      - { name: signed_amount_cents, type: integer, source: input, description: "Signed cents applied to the bucket" }
      - { name: bucket, type: enum, source: input, default: FIT, description: "FIT | UNFIT" }
      - { name: note, type: string, source: input, description: "Free-text memo", default: "" }

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> VaultSite.id" }
      - { name: business_date, type: string, source: input, description: "Reconciled value date; unique per site" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Declared opening on-hand total for the date" }
      - { name: counted_on_hand_cents, type: integer, source: system, description: "Physical count submitted via count action" }
      - { name: counted_by_staff_id, type: string, source: system, description: "X-User-ID of counter" }
      - { name: provisional_expected_cents, type: integer, source: computed, description: "opening + sum of ledger entries with business_date = recon date AND created_at <= recon opened_at; frozen at creation" }
      - { name: final_expected_cents, type: integer, source: computed, description: "opening + sum of ALL ledger entries with business_date = recon date regardless of created_at; refreshed on every matching ledger append" }
      - { name: variance_cents, type: integer, source: computed, description: "= counted_on_hand_cents - final_expected_cents" }
      - { name: approved_by_staff_id, type: string, source: system, description: "X-User-ID of approver; must differ from counted_by_staff_id (SoD)" }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTED | BALANCED | VARIANCE_PENDING | ESCALATED | APPROVED | LOCKED" }

  - name: AtmForecast
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> AtmMachine.id" }
      - { name: forecast_date, type: string, source: input, description: "Date being forecast (YYYY-MM-DD)" }
      - { name: w1_cents, type: integer, source: input, description: "Withdrawals same weekday 1 week prior" }
      - { name: w2_cents, type: integer, source: input, description: "Withdrawals same weekday 2 weeks prior" }
      - { name: w3_cents, type: integer, source: input, description: "Withdrawals same weekday 3 weeks prior" }
      - { name: variant_applied, type: enum, source: computed, description: "TRAILING | SEASONAL — SEASONAL iff forecast_date inside a SeasonalWindow of the ATM's site" }
      - { name: projected_base_cents, type: integer, source: computed, description: "Trailing weighted average: round_half_up(0.5*w1 + 0.3*w2 + 0.2*w3)" }
      - { name: projected_final_cents, type: integer, source: computed, description: "SEASONAL: round_half_up(base * multiplier_bps / 10000); TRAILING: = base" }
      - { name: recommended_load_cents, type: integer, source: computed, description: "= ceil(projected_final_cents / 200000) * 200000; exact multiples stay unchanged" }
      - { name: residual_target_cents, type: integer, source: computed, description: "per calculations.atm_residual_target" }
      - { name: actual_withdrawals_cents, type: integer, source: system, description: "Set at settle" }
      - { name: residual_balance_cents, type: integer, source: computed, description: "ATM balance remaining at settle after withdrawals; returned to vault" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOADED | SETTLED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FedOrder
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vault-cash/fed-orders/{orderId}/submit"
        actor: FedCoordinator
        preconditions:
          - "Order in DRAFT (ERR_FED_ORDER_INVALID_STATE)"
          - "At least one DenominationLine exists (ERR_ORDER_HAS_NO_LINES)"
          - "Site posture != FROZEN (ERR_VAULT_FROZEN) [cross-entity guard]"
          - "Cutoff: current clock < (business_date - 1 day)T18:00:00Z (ERR_ORDER_CUTOFF_PASSED)"
          - "direction=ORDER: face_total_cents <= site.insurance_headroom_cents (ERR_INSURANCE_HEADROOM_EXCEEDED)"
          - "direction=ORDER: site.on_hand_total_cents + face_total_cents <= site.vault_limit_cents (ERR_VAULT_LIMIT_EXCEEDED)"
          - "direction=DEPOSIT: face_total_cents <= site.on_hand_unfit_cents + site.on_hand_fit_cents available for deposit; pinned: deposits draw UNFIT first then FIT — face_total_cents <= on_hand_unfit_cents + on_hand_fit_cents (ERR_INSUFFICIENT_CASH_FOR_DEPOSIT)"
        side_effects:
          - "status → SUBMITTED; increments FedOrder.version"
          - "direction=ORDER: site.pending_inbound_order_cents += face_total_cents; site derived fields + posture re-derived; site.version increments"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /vault-cash/fed-orders/{orderId}/recall"
        actor: FedCoordinator
        preconditions:
          - "Order in SUBMITTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → DRAFT (cycle: order may be edited and resubmitted); increments version"
          - "direction=ORDER: site.pending_inbound_order_cents -= face_total_cents; site re-derived"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /vault-cash/fed-orders/{orderId}/acknowledge"
        actor: FedCoordinator
        preconditions:
          - "Order in SUBMITTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → ACKNOWLEDGED; increments version"
      - from: ACKNOWLEDGED
        to: IN_TRANSIT
        trigger: "system (when a linked CashShipment departs)"
        actor: system
        preconditions: []
        side_effects:
          - "status → IN_TRANSIT; increments version"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "system (when the linked CashShipment is verified, matched or exception-accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "status → RECEIVED; increments version"
          - "direction=ORDER: site.pending_inbound_order_cents -= face_total_cents"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /vault-cash/fed-orders/{orderId}/record-fed-advice with counted_total_cents == face_total_cents"
        actor: FedCoordinator
        preconditions:
          - "Order in RECEIVED or DISPUTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → RECONCILED; advice_count += 1; increments version"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /vault-cash/fed-orders/{orderId}/record-fed-advice with counted_total_cents != face_total_cents"
        actor: FedCoordinator
        preconditions:
          - "Order in RECEIVED or DISPUTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → DISPUTED; advice_count += 1; increments version"
          - "delta = counted_total_cents - effective basis (settled_basis_cents if set, else face_total_cents); settled_basis_cents = counted_total_cents"
          - "CASCADE link 1: delta != 0 posts CashLedgerEntry ADJUSTMENT (signed = delta, bucket FIT, business_date = clock date)"
          - "CASCADE link 2: ledger append triggers VaultSite on_hand recompute (fit += delta) and derived fields"
          - "CASCADE link 3: site recompute triggers matching OPEN/COUNTED Reconciliation refresh (final_expected, variance, possible status flip) and site posture re-derivation"
      - from: DISPUTED
        to: DISPUTED
        trigger: "POST /vault-cash/fed-orders/{orderId}/record-fed-advice with counted_total_cents still != face_total_cents"
        actor: FedCoordinator
        preconditions:
          - "Order in RECEIVED or DISPUTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "Self-loop; advice_count += 1; delta = counted_total_cents - settled_basis_cents; nonzero delta posts ADJUSTMENT (delta) FIT ledger entry; settled_basis_cents updated; cascades as above"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vault-cash/fed-orders/{orderId}/cancel"
        actor: FedCoordinator
        preconditions:
          - "Order in DRAFT or SUBMITTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → CANCELLED; increments version"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /vault-cash/fed-orders/{orderId}/cancel"
        actor: FedCoordinator
        preconditions:
          - "Order in DRAFT or SUBMITTED (ERR_FED_ORDER_INVALID_STATE)"
        side_effects:
          - "status → CANCELLED; direction=ORDER: site.pending_inbound_order_cents -= face_total_cents; site re-derived"

  - entity: CashShipment
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/load"
        actor: FedCoordinator
        preconditions:
          - "Shipment in SCHEDULED (ERR_SHIPMENT_INVALID_STATE)"
          - "Carrier status == ACTIVE (ERR_CARRIER_SUSPENDED) [cross-entity guard]"
          - "If fed_order_id set: linked order status == ACKNOWLEDGED (ERR_LINKED_ORDER_NOT_ACKNOWLEDGED) [cross-entity guard]"
          - "Outbound (origin_site_id set): origin site posture != FROZEN (ERR_VAULT_FROZEN)"
        side_effects:
          - "status → LOADED; increments version"
          - "Outbound: origin.reserved_out_cents -= declared; origin.on_hand_fit_cents -= declared (pins: all outbound value drawn from FIT bucket); posts SHIPMENT_OUT ledger entry (FED_DEPOSIT when fed_order_id set and direction=DEPOSIT), business_date = clock date; site re-derived; recon refresh cascade"
          - "Inbound: destination.in_transit_inbound_cents += declared; site re-derived"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/depart"
        actor: CarrierDispatcher
        preconditions:
          - "Shipment in LOADED (ERR_SHIPMENT_INVALID_STATE)"
          - "Acting carrier must own shipment: shipment.carrier_id == X-User-ID (ERR_RESOURCE_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status → IN_TRANSIT; increments version"
          - "If fed_order_id set: linked order → IN_TRANSIT"
      - from: IN_TRANSIT
        to: VERIFIED
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/verify with counted_value_cents == declared_value_cents"
        actor: CarrierDispatcher
        preconditions:
          - "Shipment in IN_TRANSIT (ERR_SHIPMENT_INVALID_STATE)"
          - "Acting carrier must own shipment (ERR_RESOURCE_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status → VERIFIED; counted_value_cents recorded; increments version"
          - "Inbound: destination.in_transit_inbound_cents -= declared; destination.on_hand_fit_cents += declared; posts SHIPMENT_IN (or FED_RECEIPT when fed_order_id set and direction=ORDER) ledger entry on clock date"
          - "If fed_order_id set: order.settled_basis_cents = declared_value_cents (booked basis)"
          - "CASCADE: ledger append → destination site totals re-derive → matching OPEN/COUNTED Reconciliation final_expected/variance refresh with possible status flip (COUNTED↔BALANCED/VARIANCE_PENDING) and posture re-derivation"
          - "If fed_order_id set: linked order → RECEIVED"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/verify with counted_value_cents != declared_value_cents"
        actor: CarrierDispatcher
        preconditions:
          - "Shipment in IN_TRANSIT (ERR_SHIPMENT_INVALID_STATE)"
          - "Acting carrier must own shipment (ERR_RESOURCE_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status → EXCEPTION; counted_value_cents recorded; increments version"
      - from: EXCEPTION
        to: VERIFIED
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/verify with accept_variance: true"
        actor: CarrierDispatcher
        preconditions:
          - "Shipment in EXCEPTION (ERR_SHIPMENT_INVALID_STATE)"
          - "Acting carrier must own shipment (ERR_RESOURCE_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status → VERIFIED; increments version"
          - "Inbound: destination.in_transit_inbound_cents -= declared; destination.on_hand_fit_cents += counted; posts SHIPMENT_IN or FED_RECEIPT (+counted) ledger entry on clock date; cascades to site totals, posture, recon refresh"
          - "Outbound: posts ADJUSTMENT (declared - counted) FIT ledger entry returning undelivered value to origin fit"
          - "If fed_order_id set: linked order → RECEIVED and order.settled_basis_cents = counted_value_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/cancel"
        actor: FedCoordinator
        preconditions:
          - "Shipment in SCHEDULED or LOADED (ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "status → CANCELLED; increments version"
          - "COMPENSATION: outbound reservation released — origin.reserved_out_cents -= declared (created reservation fully restored)"
          - "From LOADED: outbound value returns — origin.on_hand_fit_cents += declared; posts SHIPMENT_IN reversal ledger entry; recon refresh cascade"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /vault-cash/cash-shipments/{shipmentId}/cancel"
        actor: FedCoordinator
        preconditions:
          - "Shipment in SCHEDULED or LOADED (ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "Same compensation as SCHEDULED→CANCELLED plus LOADED-value return above"

  - entity: AtmMachine
    initial_state: "service_status=ACTIVE, cash_posture derived from opening balance"
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /vault-cash/atm-machines/{atmId}/set-service-status {service_status: OUT_OF_SERVICE}"
        actor: AtmAnalyst
        preconditions:
          - "service_status currently ACTIVE (ERR_ATM_INVALID_STATE)"
        side_effects:
          - "service_status → OUT_OF_SERVICE; cash_posture UNCHANGED (parallel axes); increments version"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /vault-cash/atm-machines/{atmId}/set-service-status {service_status: ACTIVE}"
        actor: AtmAnalyst
        preconditions:
          - "service_status currently OUT_OF_SERVICE (ERR_ATM_INVALID_STATE)"
        side_effects:
          - "service_status → ACTIVE; cash_posture UNCHANGED; increments version"
      - from: "*"
        to: "cash_posture re-derivation"
        trigger: "system (on forecast load/settle and any balance mutation)"
        actor: system
        preconditions: []
        side_effects:
          - "cash_posture = CRITICAL if current_balance_cents*20 < cash_capacity_cents; LOW else if current_balance_cents*5 < cash_capacity_cents; else NORMAL — independent of service_status"
        note: "cash_posture and service_status are parallel state dimensions on one entity; neither gates the other except publish requiring service ACTIVE"

  - entity: FitnessBatch
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SORTED
        trigger: "POST /vault-cash/fitness-batches/{batchId}/sort-results"
        actor: VaultCustodian
        preconditions:
          - "Batch in OPEN (ERR_BATCH_INVALID_STATE)"
          - "fit_recovered_cents + unfit_remaining_cents + counterfeit_face_cents <= input_unfit_cents (ERR_SORT_EXCEEDS_INPUT)"
        side_effects:
          - "status → SORTED; buckets recorded; shrink_cents computed; increments version"
      - from: SORTED
        to: OPEN
        trigger: "POST /vault-cash/fitness-batches/{batchId}/reopen"
        actor: VaultCustodian
        preconditions:
          - "Batch in SORTED (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "status → OPEN (recount cycle); buckets reset to 0; increments version"
      - from: SORTED
        to: SETTLED
        trigger: "POST /vault-cash/fitness-batches/{batchId}/settle"
        actor: VaultCustodian
        preconditions:
          - "Batch in SORTED (ERR_BATCH_INVALID_STATE)"
          - "shrink_cents <= 500 (SHRINK_TOLERANCE_CENTS) (ERR_SHRINK_TOLERANCE_EXCEEDED)"
        side_effects:
          - "status → SETTLED; increments version"
          - "site.on_hand_fit_cents += fit_recovered_cents; site.on_hand_unfit_cents += unfit_remaining_cents"
          - "posts FITNESS_RECLASS ledger entries (+fit bucket FIT, +unfit bucket UNFIT) and ADJUSTMENT (-shrink bucket FIT) when shrink > 0, business_date = clock date"
          - "If counterfeit_face_cents > 0: auto-create CounterfeitCase (status DETECTED, fitness_batch_id = batch, denomination_cents=100, note_count = counterfeit_face_cents/100 must divide evenly else ERR_SORT_EXCEEDS_INPUT at sort time)"
          - "CASCADE: ledger appends → site totals re-derive → recon refresh + posture re-derivation"

  - entity: CounterfeitCase
    initial_state: DETECTED
    terminal_states: [SETTLED_WITH_FED, RELEASED]
    transitions:
      - from: DETECTED
        to: SEIZED
        trigger: "POST /vault-cash/counterfeit-cases/{caseId}/seize"
        actor: VaultCustodian
        preconditions:
          - "Case in DETECTED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "status → SEIZED; seized_by_staff_id/seized_at recorded; increments version"
          - "CASCADE link 1: posts COUNTERFEIT_SEIZURE ledger entry (-face_value_cents, bucket FIT, business_date = clock date)"
          - "CASCADE link 2: ledger append triggers site on_hand_fit_cents -= face; derived fields + posture re-derived; recon refresh"
      - from: SEIZED
        to: REPORTED
        trigger: "POST /vault-cash/counterfeit-cases/{caseId}/report"
        actor: ComplianceOfficer
        preconditions:
          - "Case in SEIZED (ERR_CASE_INVALID_STATE)"
          - "SoD: X-User-ID != seized_by_staff_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status → REPORTED; reported_by_staff_id/reported_at recorded; increments version"
          - "Site posture re-derived (overdue-report ELEVATED pressure lifts once no SEIZED case is past deadline)"
      - from: SEIZED
        to: RELEASED
        trigger: "POST /vault-cash/counterfeit-cases/{caseId}/release"
        actor: ComplianceOfficer
        preconditions:
          - "Case in SEIZED (ERR_CASE_INVALID_STATE)"
          - "SoD: X-User-ID != seized_by_staff_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status → RELEASED (notes determined genuine); increments version"
          - "posts COUNTERFEIT_RELEASE ledger entry (+face_value_cents, bucket FIT); site totals re-derived; recon refresh"
      - from: REPORTED
        to: SETTLED_WITH_FED
        trigger: "POST /vault-cash/counterfeit-cases/{caseId}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "Case in REPORTED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "status → SETTLED_WITH_FED; increments version; no cash movement (seized face is a permanent loss already booked at seize)"

  - entity: Reconciliation
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: COUNTED
        trigger: "POST /vault-cash/reconciliations/{reconId}/count"
        actor: VaultCustodian
        preconditions:
          - "Recon in OPEN (ERR_RECON_INVALID_STATE)"
        side_effects:
          - "counted_on_hand_cents + counted_by_staff_id recorded; variance_cents computed vs final_expected_cents"
          - "Auto-fork: if |variance_cents| <= 1000 (RECON_TOLERANCE_CENTS) → status BALANCED else → VARIANCE_PENDING"
      - from: COUNTED
        to: BALANCED
        trigger: "system (auto-fork at count when |variance| <= tolerance)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTED
        to: VARIANCE_PENDING
        trigger: "system (auto-fork at count when |variance| > tolerance)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTED
        to: BALANCED
        trigger: "system (re-derivation when a late ledger append moves variance into tolerance)"
        actor: system
        preconditions: []
        side_effects: ["status flips VARIANCE_PENDING→BALANCED or BALANCED→VARIANCE_PENDING per current |variance| vs tolerance"]
      - from: VARIANCE_PENDING
        to: BALANCED
        trigger: "system (same re-derivation sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALANCED
        to: VARIANCE_PENDING
        trigger: "system (same re-derivation sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALANCED
        to: LOCKED
        trigger: "POST /vault-cash/reconciliations/{reconId}/lock"
        actor: VaultCustodian
        preconditions:
          - "Recon in BALANCED or APPROVED (ERR_RECON_INVALID_STATE)"
          - "SoD: X-User-ID != counted_by_staff_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status → LOCKED; approved_by_staff_id recorded; increments version"
      - from: VARIANCE_PENDING
        to: ESCALATED
        trigger: "POST /vault-cash/reconciliations/{reconId}/escalate"
        actor: VaultCustodian
        preconditions:
          - "Recon in VARIANCE_PENDING (ERR_RECON_INVALID_STATE)"
        side_effects:
          - "status → ESCALATED; increments version; site posture re-derived (ESCALATED recon pressures ELEVATED)"
      - from: VARIANCE_PENDING
        to: APPROVED
        trigger: "POST /vault-cash/reconciliations/{reconId}/approve"
        actor: CashOperationsAdmin
        preconditions:
          - "Recon in VARIANCE_PENDING or ESCALATED (ERR_RECON_INVALID_STATE)"
        side_effects:
          - "status → APPROVED; approved_by_staff_id recorded; increments version"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /vault-cash/reconciliations/{reconId}/approve"
        actor: CashOperationsAdmin
        preconditions:
          - "Recon in VARIANCE_PENDING or ESCALATED (ERR_RECON_INVALID_STATE)"
        side_effects:
          - "status → APPROVED; approved_by_staff_id recorded; increments version"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /vault-cash/reconciliations/{reconId}/lock"
        actor: VaultCustodian
        preconditions:
          - "Recon in BALANCED or APPROVED (ERR_RECON_INVALID_STATE)"
          - "SoD: X-User-ID != counted_by_staff_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status → LOCKED; increments version"

  - entity: AtmForecast
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /vault-cash/atm-forecasts/{forecastId}/publish"
        actor: AtmAnalyst
        preconditions:
          - "Forecast in DRAFT (ERR_FORECAST_INVALID_STATE)"
          - "ATM service_status == ACTIVE (ERR_ATM_OUT_OF_SERVICE) [cross-entity guard]"
          - "OCC: expected_atm_version matches AtmMachine.version (ERR_STALE_ATM_VERSION)"
        side_effects:
          - "status → PUBLISHED; increments version"
          - "Any other PUBLISHED forecast for same atm_id + forecast_date → SUPERSEDED"
          - "atm.current_forecast_id = this forecast; atm.version increments"
      - from: PUBLISHED
        to: LOADED
        trigger: "POST /vault-cash/atm-forecasts/{forecastId}/load"
        actor: AtmAnalyst
        preconditions:
          - "Forecast in PUBLISHED (ERR_FORECAST_INVALID_STATE)"
          - "atm.site.on_hand_fit_cents >= recommended_load_cents (ERR_INSUFFICIENT_FIT_BALANCE)"
        side_effects:
          - "status → LOADED; atm.current_balance_cents += recommended_load_cents; atm cash_posture re-derived; both versions increment"
          - "site.on_hand_fit_cents -= recommended_load_cents; posts ATM_LOAD ledger entry (clock date); site re-derived; recon refresh cascade"
      - from: LOADED
        to: SETTLED
        trigger: "POST /vault-cash/atm-forecasts/{forecastId}/settle"
        actor: AtmAnalyst
        preconditions:
          - "Forecast in LOADED (ERR_FORECAST_INVALID_STATE)"
          - "actual_withdrawals_cents <= atm.current_balance_cents (ERR_WITHDRAWAL_EXCEEDS_BALANCE)"
        side_effects:
          - "status → SETTLED; residual_balance_cents = atm.current_balance_cents - actual_withdrawals_cents"
          - "atm.current_balance_cents → 0 (residual cassette returns to vault); atm cash_posture re-derived"
          - "site.on_hand_fit_cents += residual_balance_cents; posts ATM_RESIDUAL_RETURN ledger entry (clock date) when residual > 0; site re-derived; recon refresh cascade"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (when another forecast for same atm_id + forecast_date publishes)"
        actor: system
        preconditions: []
        side_effects: ["status → SUPERSEDED; increments version"]

# =============================================================================
# Concurrency Rules (OCC only — see SKILL §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: forecast-publish-stale-atm
    parent_entity: AtmMachine
    write_endpoint: "POST /vault-cash/atm-forecasts/{forecastId}/publish"
    occ_field: expected_atm_version
    description: |
      Publishing an AtmForecast supersedes any currently PUBLISHED forecast for the
      same atm_id + forecast_date and bumps AtmMachine.version. A publish carrying an
      expected_atm_version older than the ATM's current version reflects a stale view
      (another publish has legitimately advanced it) and is rejected with 412.
    error_id: ERR_STALE_ATM_VERSION
    http_status: 412
  - rule_id: vault-site-patch-stale
    parent_entity: VaultSite
    write_endpoint: "PATCH /vault-cash/vault-sites/{siteId}"
    occ_field: expected_vault_site_version
    description: |
      Patching vault limits is not state-gated; two sequential patches would each
      legitimately succeed. A patch whose expected_vault_site_version is older than
      the site's current version (any mutation — patch, ledger-driven recompute,
      posture flip — advanced it) is rejected with 412.
    error_id: ERR_STALE_VAULT_SITE_VERSION
    http_status: 412
  - rule_id: fed-order-line-add-stale
    parent_entity: FedOrder
    write_endpoint: "POST /vault-cash/fed-orders/{orderId}/lines"
    occ_field: expected_fed_order_version
    description: |
      Adding a denomination line to a DRAFT order mutates the order (totals recompute,
      version increments). A line-add carrying an expected_fed_order_version older than
      the order's current version is rejected with 412 so draft edits serialize.
    error_id: ERR_STALE_FED_ORDER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: fed_order_face_total
    trigger: "on DenominationLine add (and on any line change while DRAFT)"
    algorithm: aggregation
    formula: |
      line_cents  = denomination_cents * STRAP_NOTES * strap_count        # per line, exact integer
      face_total  = sum(line_cents over all lines of the order)
      grand_total = face_total + fee_total
    input_set: "all DenominationLine rows of the order (any count incl. 0 → face 0)"
    constants:
      STRAP_NOTES: 100
    precision: "integer cents; no rounding"

  - name: fed_service_fee
    trigger: "with fed_order_face_total"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER (mode b): round per line, then sum.
      fee_cents(line) = round_half_up(line_cents * FEE_NUM / FEE_DEN)     # 1/160 = 0.625%
      fee_total = sum(fee_cents over all lines)
      Counter-example the scaffold forbids: round_half_up(sum(line_cents) / 160).
      E.g. two lines of 10,000 cents each: per-line 63 + 63 = 126; sum-then-round gives 125.
    input_set: "all DenominationLine rows of the order"
    constants:
      FEE_NUM: 1
      FEE_DEN: 160
    precision: "round_half_up to integer cents per line, then integer sum"

  - name: atm_forecast_projection
    trigger: "AtmForecast creation"
    algorithm: weighted_scoring
    formula: |
      base  = round_half_up(0.5*w1_cents + 0.3*w2_cents + 0.2*w3_cents)
      if exists SeasonalWindow w of atm.site with w.start_date <= forecast_date <= w.end_date:
        variant = SEASONAL
        final = round_half_up(base * w.multiplier_bps / 10000)
      else:
        variant = TRAILING
        final = base
      recommended_load_cents = ceil(final / ATM_LOAD_STRAP_CENTS) * ATM_LOAD_STRAP_CENTS
      (exact multiple of the strap stays unchanged: final=2,000,000 → load=2,000,000)
    input_set: "the three trailing withdrawal inputs; seasonal windows of the ATM's site covering forecast_date"
    constants:
      W1: 0.5
      W2: 0.3
      W3: 0.2
      ATM_LOAD_STRAP_CENTS: 200000
    precision: "round_half_up to integer cents at each starred rounding; load rounding is exact ceiling division"
    variants:
      - name: TRAILING
        when: "forecast_date not inside any SeasonalWindow of the ATM's site"
        difference: "projected_final_cents = projected_base_cents (no multiplier)"
      - name: SEASONAL
        when: "forecast_date inside a SeasonalWindow of the ATM's site"
        difference: "projected_final_cents = round_half_up(base * multiplier_bps / 10000) > base"

  - name: atm_residual_target
    trigger: "AtmForecast creation (after atm_forecast_projection)"
    algorithm: constraint_propagation
    formula: |
      Mode (a) combinatorial: 3+ inputs, nested min/max, state-conditional branch.
      if atm.cash_posture == CRITICAL: residual_target_cents = 0
      else:
        raw     = max(MIN_RESIDUAL_CENTS, round_half_up(projected_final_cents * RESIDUAL_PCT_BPS / 10000))
        headroom = max(0, atm.cash_capacity_cents - recommended_load_cents)
        residual_target_cents = min(raw, headroom)
    input_set: "projected_final_cents, recommended_load_cents, atm.cash_capacity_cents, atm.cash_posture"
    constants:
      MIN_RESIDUAL_CENTS: 100000
      RESIDUAL_PCT_BPS: 1500
    precision: "round_half_up integer cents"

  - name: vault_posture_derivation
    trigger: "every mutation that changes on_hand_*, in_transit_inbound_cents, pending_inbound_order_cents, insurance fields; counterfeit case seize/report/release/settle; recon escalate/lock"
    algorithm: threshold
    formula: |
      Integer cross-multiplication — no percentage rounding anywhere.
      FROZEN  if on_hand_total_cents >= vault_limit_cents                       # >= boundary, inclusive
             or insurance_headroom_cents <= 0
             or exists CounterfeitCase of site in SEIZED with seized_at + 10 days < clock now
      ELEVATED else if on_hand_total_cents * 10 >= vault_limit_cents * 9        # exactly 90.000% trips ELEVATED
             or exists CounterfeitCase of site in SEIZED with seized_at + 5 days < clock now
             or exists Reconciliation of site in ESCALATED
      NORMAL otherwise
      Boundary proof: limit 10,000,000, on_hand 8,999,999 → 89,999,990 < 90,000,000 → NORMAL;
      on_hand 9,000,000 → 90,000,000 >= 90,000,000 → ELEVATED.
    input_set: "site totals; site's SEIZED CounterfeitCases; site's ESCALATED Reconciliations"
    constants:
      ELEVATED_NUM: 9
      ELEVATED_DEN: 10
      REPORT_OVERDUE_DAYS: 5
      SEIZED_FREEZE_DAYS: 10
    precision: "integer cents comparison only"

  - name: insurance_headroom_evaluation
    trigger: "FedOrder submit (direction=ORDER) and CashShipment create (inbound)"
    algorithm: constraint_propagation
    formula: |
      Mode (c) circular-looking, evaluation order PINNED:
      1. committed = on_hand_total_cents + in_transit_inbound_cents + pending_inbound_order_cents
         (candidate order/shipment itself is EXCLUDED — it is not yet committed)
      2. headroom  = insurance_coverage_cents - committed
      3. admit candidate iff candidate_value <= headroom                        # <= boundary, inclusive
      Never re-derive headroom after admitting the candidate inside the same request.
    input_set: "site committed exposure fields; candidate face/declared value"
    precision: "integer cents"

  - name: reconciliation_expected_balance
    trigger: "Reconciliation creation (provisional snapshot) and every CashLedgerEntry append matching (site_id, business_date) (final refresh)"
    algorithm: projection
    formula: |
      Chronological replay over the append-only ledger.
      provisional_expected_cents = opening_balance_cents
        + sum(signed_amount_cents of entries where site_id = recon.site_id
              AND business_date = recon.business_date AND created_at <= recon.created_at)   # frozen at open
      final_expected_cents = opening_balance_cents
        + sum(signed_amount_cents of entries where site_id = recon.site_id
              AND business_date = recon.business_date)                                        # late entries INCLUDED
      variance_cents = counted_on_hand_cents - final_expected_cents
      Both sums are order-insensitive (pure sums); entry inclusion differs only on created_at.
    input_set: "CashLedgerEntry rows of the site on the recon business_date; split by created_at vs recon.created_at"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "snapshot at recon creation"
        difference: "excludes entries created after recon.created_at even if backdated to the recon date"
      - name: final
        when: "refreshed on every matching ledger append"
        difference: "includes late-arriving backdated entries; diverges from provisional exactly by their sum"

  - name: fitness_settlement
    trigger: "FitnessBatch sort-results and settle"
    algorithm: waterfall_allocation
    formula: |
      Conservation invariant (pinned): after every sort-results and after settle,
        input_unfit_cents == fit_recovered_cents + unfit_remaining_cents + counterfeit_face_cents + shrink_cents
      Buckets are allocated from the sort declaration; shrink is the residual plug:
        shrink_cents = input_unfit_cents - (fit + unfit + counterfeit), must satisfy 0 <= shrink_cents
      Settle gate: shrink_cents <= SHRINK_TOLERANCE_CENTS (boundary: == 500 settles, == 501 rejected)
      Counterfeit notes are denominated in 100-cent notes for case creation: counterfeit_face_cents % 100 == 0 enforced at sort.
    input_set: "the batch's declared sort buckets"
    constants:
      SHRINK_TOLERANCE_CENTS: 500
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID resolves to an existing, active StaffMember (or Carrier for CarrierDispatcher)", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Site-scoped staff roles (VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer): acting staff's home_site_id must equal the target resource's site; CarrierDispatcher: shipment.carrier_id == X-User-ID", error_id: ERR_SITE_SCOPE_VIOLATION, http_status: 403, applies_to: "all site-scoped write/read endpoints; carrier ownership on shipment depart/verify" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: existence, check: "Body-referenced FKs exist (site_id, atm_id, carrier_id, fed_order_id, fitness_batch_id)", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "create/action endpoints with body FKs" }
  - { priority: 6, category: existence, check: "Uniqueness: Reconciliation (site_id, business_date); SeasonalWindow dates valid; required fields present and well-typed; enum members valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 7, category: state, check: "Target resource's own state machine permits the transition", error_id: "ERR_FED_ORDER_INVALID_STATE | ERR_SHIPMENT_INVALID_STATE | ERR_BATCH_INVALID_STATE | ERR_CASE_INVALID_STATE | ERR_RECON_INVALID_STATE | ERR_FORECAST_INVALID_STATE | ERR_ATM_INVALID_STATE", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Cross-entity state guards: site posture != FROZEN (order submit, shipment load, fitness-batch create); carrier ACTIVE (shipment create/load); ATM service ACTIVE (forecast publish); linked order ACKNOWLEDGED (shipment load)", error_id: "ERR_VAULT_FROZEN | ERR_CARRIER_SUSPENDED | ERR_ATM_OUT_OF_SERVICE | ERR_LINKED_ORDER_NOT_ACKNOWLEDGED", http_status: 409, applies_to: "guarded endpoints" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: counterfeit report/release actor != seizer; recon lock/approve actor != counter", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "counterfeit report/release; recon lock/approve" }
  - { priority: 10, category: business_safety, check: "Insurance headroom: candidate inbound value <= insurance_headroom_cents (candidate excluded from committed)", error_id: ERR_INSURANCE_HEADROOM_EXCEEDED, http_status: 402, applies_to: "fed order submit (ORDER); shipment create (inbound)" }
  - { priority: 11, category: business_temporal, check: "Fed order submit cutoff: clock < (business_date - 1 day)T18:00:00Z", error_id: ERR_ORDER_CUTOFF_PASSED, http_status: 422, applies_to: "fed order submit" }
  - { priority: 12, category: business_temporal, check: "Carrier turnaround: new shipment's [departure, arrival] expanded by +/-45 min must not overlap any non-cancelled shipment of the same carrier (half-open; gap exactly 45 min is allowed)", error_id: ERR_CARRIER_TURNAROUND_CONFLICT, http_status: 409, applies_to: "shipment create" }
  - { priority: 13, category: business_temporal, check: "Dock capacity: count of inbound shipments (SCHEDULED/LOADED/IN_TRANSIT) whose arrival +/-30 min window contains the new arrival instant must be < destination dock_capacity", error_id: ERR_DOCK_CAPACITY_EXCEEDED, http_status: 409, applies_to: "shipment create (inbound)" }
  - { priority: 14, category: business_temporal, check: "Seasonal windows of one site: closed intervals [start_date, end_date] must be disjoint; adjacency (next.start = prev.end + 1 day) is allowed", error_id: ERR_SEASONAL_WINDOW_OVERLAP, http_status: 409, applies_to: "seasonal window create" }
  - { priority: 15, category: business_constraint, check: "Denomination mix: denomination_cents in {100,200,500,1000,2000,5000,10000}; strap_count >= 1; ORDER direction: strap_count % 10 == 0 for denom <= 2000, % 5 == 0 for denom >= 5000; DEPOSIT: any strap_count >= 1", error_id: ERR_INVALID_DENOMINATION_MIX, http_status: 422, applies_to: "fed order line add" }
  - { priority: 16, category: business_constraint, check: "Duplicate reconciliation for (site_id, business_date)", error_id: ERR_DUPLICATE_RECONCILIATION, http_status: 409, applies_to: "recon create" }
  - { priority: 17, category: business_constraint, check: "Sort buckets must not exceed escrowed input; counterfeit face must be a multiple of 100", error_id: ERR_SORT_EXCEEDS_INPUT, http_status: 422, applies_to: "fitness sort-results" }
  - { priority: 18, category: business_fiscal, check: "Carrier liability: declared_value_cents <= carrier.liability_cap_per_truck_cents", error_id: ERR_CARRIER_LIABILITY_EXCEEDED, http_status: 402, applies_to: "shipment create" }
  - { priority: 19, category: business_fiscal, check: "Vault limit: submit(ORDER) would push on_hand_total over vault_limit_cents", error_id: ERR_VAULT_LIMIT_EXCEEDED, http_status: 402, applies_to: "fed order submit (ORDER)" }
  - { priority: 20, category: business_fiscal, check: "Deposit sufficiency: face_total_cents <= on_hand_unfit_cents + on_hand_fit_cents", error_id: ERR_INSUFFICIENT_CASH_FOR_DEPOSIT, http_status: 422, applies_to: "fed order submit (DEPOSIT)" }
  - { priority: 21, category: business_fiscal, check: "Fitness batch input <= site on_hand_unfit_cents", error_id: ERR_INSUFFICIENT_UNFIT_BALANCE, http_status: 422, applies_to: "fitness batch create" }
  - { priority: 22, category: business_fiscal, check: "Shrink within tolerance at settle", error_id: ERR_SHRINK_TOLERANCE_EXCEEDED, http_status: 422, applies_to: "fitness settle" }
  - { priority: 23, category: business_fiscal, check: "ATM load affordability: site on_hand_fit_cents >= recommended_load_cents", error_id: ERR_INSUFFICIENT_FIT_BALANCE, http_status: 422, applies_to: "forecast load" }
  - { priority: 24, category: business_fiscal, check: "Settle withdrawals <= current ATM balance", error_id: ERR_WITHDRAWAL_EXCEEDS_BALANCE, http_status: 422, applies_to: "forecast settle" }
  - { priority: 25, category: business_constraint, check: "Fed order has at least one line at submit", error_id: ERR_ORDER_HAS_NO_LINES, http_status: 422, applies_to: "fed order submit" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/vault-cash/_clock/set_current_utc", description: "Advance the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z; never falls back to wall clock.", roles: [CashOperationsAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["posture re-derivation at sites with SEIZED counterfeit cases (deadline pressure)"] }

  # --- VaultSite ---
  - { method: POST, path: "/vault-cash/vault-sites", description: "Create a vault site with opening balances", roles: [CashOperationsAdmin], code: 201, input: [name, site_type, vault_limit_cents, insurance_coverage_cents, dock_capacity, "opening_fit_cents?", "opening_unfit_cents?"], output: VaultSite, side_effects: ["posts OPENING_BALANCE ledger entries (business_date = clock date) for nonzero openings", "posture derived at creation", "version = 1"] }
  - { method: GET, path: "/vault-cash/vault-sites", description: "List vault sites", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_type?", "posture?", "limit?", "offset?"], output: "VaultSite[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/vault-sites/{siteId}", description: "Get one site incl. all computed totals and posture", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: VaultSite, side_effects: [] }
  - { method: PATCH, path: "/vault-cash/vault-sites/{siteId}", description: "Update limits/capacity (OCC)", roles: [CashOperationsAdmin], code: 200, input: [expected_vault_site_version, "vault_limit_cents?", "insurance_coverage_cents?", "dock_capacity?", "name?"], output: VaultSite, side_effects: ["increments VaultSite.version by 1", "posture + insurance_headroom_cents re-derived"] }

  # --- StaffMember ---
  - { method: POST, path: "/vault-cash/staff-members", description: "Register a staff member (identity anchor for site-scoped roles)", roles: [CashOperationsAdmin], code: 201, input: [full_name, home_site_id, "active?"], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/vault-cash/staff-members", description: "List staff", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["home_site_id?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/staff-members/{staffId}", description: "Get one staff member", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: StaffMember, side_effects: [] }

  # --- Carrier ---
  - { method: POST, path: "/vault-cash/carriers", description: "Register an armored carrier", roles: [CashOperationsAdmin], code: 201, input: [name, liability_cap_per_truck_cents], output: Carrier, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/vault-cash/carriers", description: "List carriers", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["status?", "limit?", "offset?"], output: "Carrier[]", side_effects: [] }
  - { method: PATCH, path: "/vault-cash/carriers/{carrierId}", description: "Suspend or reinstate a carrier", roles: [CashOperationsAdmin], code: 200, input: [status], output: Carrier, side_effects: ["increments Carrier.version by 1"] }

  # --- AtmMachine ---
  - { method: POST, path: "/vault-cash/atm-machines", description: "Register an ATM", roles: [CashOperationsAdmin], code: 201, input: [site_id, terminal_code, cash_capacity_cents, "opening_balance_cents?"], output: AtmMachine, side_effects: ["current_balance_cents = opening; cash_posture derived; service_status = ACTIVE"] }
  - { method: GET, path: "/vault-cash/atm-machines", description: "List ATMs", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "service_status?", "limit?", "offset?"], output: "AtmMachine[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/atm-machines/{atmId}", description: "Get one ATM incl. both state axes and version", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: AtmMachine, side_effects: [] }
  - { method: POST, path: "/vault-cash/atm-machines/{atmId}/set-service-status", description: "Toggle service axis (ACTIVE <-> OUT_OF_SERVICE)", roles: [AtmAnalyst, CashOperationsAdmin], code: 200, input: [service_status], output: AtmMachine, side_effects: ["increments AtmMachine.version by 1", "cash_posture unchanged"] }

  # --- SeasonalWindow ---
  - { method: POST, path: "/vault-cash/seasonal-windows", description: "Create a holiday/seasonal demand window", roles: [CashOperationsAdmin], code: 201, input: [site_id, name, start_date, end_date, multiplier_bps], output: SeasonalWindow, side_effects: [] }
  - { method: GET, path: "/vault-cash/seasonal-windows", description: "List seasonal windows", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "limit?", "offset?"], output: "SeasonalWindow[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/seasonal-windows/{windowId}", description: "Get one seasonal window", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: SeasonalWindow, side_effects: [] }

  # --- FedOrder + DenominationLine ---
  - { method: POST, path: "/vault-cash/fed-orders", description: "Create an empty DRAFT Fed order/deposit", roles: [FedCoordinator], code: 201, input: [site_id, direction, business_date], output: FedOrder, side_effects: ["status = DRAFT", "version = 1"] }
  - { method: GET, path: "/vault-cash/fed-orders", description: "List Fed orders", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "status?", "direction?", "limit?", "offset?"], output: "FedOrder[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/fed-orders/{orderId}", description: "Get one order incl. computed totals", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: FedOrder, side_effects: [] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/lines", description: "Add a denomination line to a DRAFT order (OCC on order version)", roles: [FedCoordinator], code: 201, input: [denomination_cents, strap_count, expected_fed_order_version], output: DenominationLine, side_effects: ["order must be DRAFT (ERR_FED_ORDER_INVALID_STATE)", "order face/fee/grand totals recomputed", "increments FedOrder.version by 1"] }
  - { method: GET, path: "/vault-cash/fed-orders/{id}/lines", description: "List an order's denomination lines", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["limit?", "offset?"], output: "DenominationLine[]", side_effects: [] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/submit", description: "Submit order to the Fed", roles: [FedCoordinator], code: 200, input: [], output: FedOrder, side_effects: ["DRAFT → SUBMITTED", "direction=ORDER: site.pending_inbound_order_cents += face", "site posture re-derived", "increments FedOrder.version by 1"] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/recall", description: "Recall a submitted order back to DRAFT (cycle)", roles: [FedCoordinator], code: 200, input: [], output: FedOrder, side_effects: ["SUBMITTED → DRAFT", "pending_inbound_order_cents released", "increments FedOrder.version by 1"] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/acknowledge", description: "Record Fed acknowledgement", roles: [FedCoordinator], code: 200, input: [], output: FedOrder, side_effects: ["SUBMITTED → ACKNOWLEDGED", "increments FedOrder.version by 1"] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/cancel", description: "Cancel a DRAFT or SUBMITTED order", roles: [FedCoordinator], code: 200, input: [], output: FedOrder, side_effects: ["→ CANCELLED", "pending inbound released if SUBMITTED ORDER", "increments FedOrder.version by 1"] }
  - { method: POST, path: "/vault-cash/fed-orders/{orderId}/record-fed-advice", description: "Record a Fed settlement advice (both directions); variance drives DISPUTED self-loop or RECONCILED", roles: [FedCoordinator], code: 200, input: [counted_total_cents], output: FedOrder, side_effects: ["advice_count += 1", "variance == 0 → RECONCILED else DISPUTED (self-loop on repeat)", "nonzero variance posts ADJUSTMENT ledger entry → site recompute → recon refresh cascade", "increments FedOrder.version by 1"] }

  # --- CashShipment ---
  - { method: POST, path: "/vault-cash/cash-shipments", description: "Schedule a shipment (Fed-order-linked or inter-site)", roles: [FedCoordinator], code: 201, input: [carrier_id, scheduled_departure_at, scheduled_arrival_at, "fed_order_id?", "origin_site_id?", "destination_site_id?", "declared_value_cents?"], output: CashShipment, side_effects: ["status = SCHEDULED", "if fed_order_id set: linked order must be SUBMITTED or ACKNOWLEDGED (ERR_LINKED_ORDER_NOT_ACKNOWLEDGED)", "outbound: origin.reserved_out_cents += declared; site re-derived", "turnaround + dock-capacity + liability + insurance-headroom guards"] }
  - { method: GET, path: "/vault-cash/cash-shipments", description: "List shipments", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["carrier_id?", "origin_site_id?", "destination_site_id?", "fed_order_id?", "status?", "limit?", "offset?"], output: "CashShipment[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/cash-shipments/{shipmentId}", description: "Get one shipment", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: CashShipment, side_effects: [] }
  - { method: POST, path: "/vault-cash/cash-shipments/{shipmentId}/load", description: "Load truck at origin", roles: [FedCoordinator], code: 200, input: [], output: CashShipment, side_effects: ["SCHEDULED → LOADED", "outbound debit + SHIPMENT_OUT ledger entry (FED_DEPOSIT instead when fed_order_id set and direction=DEPOSIT)", "inbound: destination.in_transit_inbound_cents += declared", "recon refresh cascade", "increments CashShipment.version by 1"] }
  - { method: POST, path: "/vault-cash/cash-shipments/{shipmentId}/depart", description: "Depart origin", roles: [CarrierDispatcher], code: 200, input: [], output: CashShipment, side_effects: ["LOADED → IN_TRANSIT", "linked order → IN_TRANSIT", "increments CashShipment.version by 1"] }
  - { method: POST, path: "/vault-cash/cash-shipments/{shipmentId}/verify", description: "Verify delivery count; mismatch → EXCEPTION; exception + accept_variance → VERIFIED with adjustment", roles: [CarrierDispatcher], code: 200, input: [counted_value_cents, "accept_variance?"], output: CashShipment, side_effects: ["IN_TRANSIT → VERIFIED (match) or EXCEPTION (mismatch); EXCEPTION → VERIFIED when accept_variance true", "inbound credit + ledger entries (SHIPMENT_IN/FED_RECEIPT ± ADJUSTMENT)", "linked order → RECEIVED", "site totals + posture + recon cascade", "increments CashShipment.version by 1"] }
  - { method: POST, path: "/vault-cash/cash-shipments/{shipmentId}/cancel", description: "Cancel a SCHEDULED or LOADED shipment (compensating release)", roles: [FedCoordinator], code: 200, input: [], output: CashShipment, side_effects: ["→ CANCELLED", "reserved_out released; LOADED value returned with reversal ledger entry", "recon refresh cascade", "increments CashShipment.version by 1"] }

  # --- FitnessBatch ---
  - { method: POST, path: "/vault-cash/fitness-batches", description: "Open a fitness sorting batch; escrows unfit cash", roles: [VaultCustodian], code: 201, input: [site_id, input_unfit_cents], output: FitnessBatch, side_effects: ["site.on_hand_unfit_cents -= input (escrow)", "site re-derived", "status = OPEN"] }
  - { method: GET, path: "/vault-cash/fitness-batches", description: "List fitness batches", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "FitnessBatch[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/fitness-batches/{batchId}", description: "Get one fitness batch", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: FitnessBatch, side_effects: [] }
  - { method: POST, path: "/vault-cash/fitness-batches/{batchId}/sort-results", description: "Record sort outcome buckets (OPEN → SORTED)", roles: [VaultCustodian], code: 200, input: [fit_recovered_cents, unfit_remaining_cents, counterfeit_face_cents], output: FitnessBatch, side_effects: ["shrink_cents computed", "increments FitnessBatch.version by 1"] }
  - { method: POST, path: "/vault-cash/fitness-batches/{batchId}/settle", description: "Settle a SORTED batch (shrink gate)", roles: [VaultCustodian], code: 200, input: [], output: FitnessBatch, side_effects: ["SORTED → SETTLED", "buckets returned to site fit/unfit", "FITNESS_RECLASS + ADJUSTMENT ledger entries", "auto-create CounterfeitCase when counterfeit_face_cents > 0", "recon refresh cascade", "increments FitnessBatch.version by 1"] }
  - { method: POST, path: "/vault-cash/fitness-batches/{batchId}/reopen", description: "Reopen a SORTED batch for recount (cycle)", roles: [VaultCustodian], code: 200, input: [], output: FitnessBatch, side_effects: ["SORTED → OPEN", "buckets reset to 0", "increments FitnessBatch.version by 1"] }

  # --- CounterfeitCase ---
  - { method: POST, path: "/vault-cash/counterfeit-cases", description: "Record a direct counterfeit detection", roles: [VaultCustodian, ComplianceOfficer], code: 201, input: [site_id, denomination_cents, note_count, "fitness_batch_id?"], output: CounterfeitCase, side_effects: ["status = DETECTED", "face_value_cents computed"] }
  - { method: GET, path: "/vault-cash/counterfeit-cases", description: "List counterfeit cases", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "fitness_batch_id?", "status?", "limit?", "offset?"], output: "CounterfeitCase[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/counterfeit-cases/{caseId}", description: "Get one counterfeit case", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: CounterfeitCase, side_effects: [] }
  - { method: POST, path: "/vault-cash/counterfeit-cases/{caseId}/seize", description: "Seize suspect notes", roles: [VaultCustodian], code: 200, input: [], output: CounterfeitCase, side_effects: ["DETECTED → SEIZED", "COUNTERFEIT_SEIZURE ledger entry", "site totals + posture + recon cascade", "increments CounterfeitCase.version by 1"] }
  - { method: POST, path: "/vault-cash/counterfeit-cases/{caseId}/report", description: "Report seizure to the Fed/Secret Service (SoD: reporter != seizer)", roles: [ComplianceOfficer], code: 200, input: [], output: CounterfeitCase, side_effects: ["SEIZED → REPORTED", "posture re-derived", "increments CounterfeitCase.version by 1"] }
  - { method: POST, path: "/vault-cash/counterfeit-cases/{caseId}/release", description: "Release notes determined genuine (SoD: releaser != seizer)", roles: [ComplianceOfficer], code: 200, input: [], output: CounterfeitCase, side_effects: ["SEIZED → RELEASED", "COUNTERFEIT_RELEASE ledger entry (+face)", "site totals + posture + recon cascade", "increments CounterfeitCase.version by 1"] }
  - { method: POST, path: "/vault-cash/counterfeit-cases/{caseId}/settle", description: "Mark case settled with the Fed", roles: [ComplianceOfficer], code: 200, input: [], output: CounterfeitCase, side_effects: ["REPORTED → SETTLED_WITH_FED", "increments CounterfeitCase.version by 1"] }

  # --- CashLedgerEntry ---
  - { method: POST, path: "/vault-cash/cash-ledger-entries", description: "Post a manual ADJUSTMENT entry; business_date may be backdated (late event)", roles: [VaultCustodian, CashOperationsAdmin], code: 201, input: [site_id, business_date, signed_amount_cents, "bucket?", "note?"], output: CashLedgerEntry, side_effects: ["entry_type forced ADJUSTMENT", "site totals re-derived", "matching recon final_expected/variance refresh + possible status flip", "posture re-derived"] }
  - { method: GET, path: "/vault-cash/cash-ledger-entries", description: "List ledger entries", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "business_date?", "entry_type?", "limit?", "offset?"], output: "CashLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/cash-ledger-entries/{entryId}", description: "Get one ledger entry", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: CashLedgerEntry, side_effects: [] }

  # --- Reconciliation ---
  - { method: POST, path: "/vault-cash/reconciliations", description: "Open a daily reconciliation; provisional snapshot frozen at open", roles: [VaultCustodian], code: 201, input: [site_id, business_date, opening_balance_cents], output: Reconciliation, side_effects: ["provisional_expected_cents frozen; final_expected_cents computed", "status = OPEN"] }
  - { method: GET, path: "/vault-cash/reconciliations", description: "List reconciliations", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["site_id?", "business_date?", "status?", "limit?", "offset?"], output: "Reconciliation[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/reconciliations/{reconId}", description: "Get one reconciliation", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: Reconciliation, side_effects: [] }
  - { method: POST, path: "/vault-cash/reconciliations/{reconId}/count", description: "Submit physical count; auto-forks BALANCED vs VARIANCE_PENDING", roles: [VaultCustodian], code: 200, input: [counted_on_hand_cents], output: Reconciliation, side_effects: ["OPEN → COUNTED → BALANCED | VARIANCE_PENDING", "increments Reconciliation.version by 1"] }
  - { method: POST, path: "/vault-cash/reconciliations/{reconId}/escalate", description: "Escalate a variance to ops", roles: [VaultCustodian], code: 200, input: [], output: Reconciliation, side_effects: ["VARIANCE_PENDING → ESCALATED", "posture pressure", "increments Reconciliation.version by 1"] }
  - { method: POST, path: "/vault-cash/reconciliations/{reconId}/approve", description: "Admin approval of a variance", roles: [CashOperationsAdmin], code: 200, input: [], output: Reconciliation, side_effects: ["VARIANCE_PENDING | ESCALATED → APPROVED", "increments Reconciliation.version by 1"] }
  - { method: POST, path: "/vault-cash/reconciliations/{reconId}/lock", description: "Lock a BALANCED or APPROVED recon (SoD: locker != counter)", roles: [VaultCustodian, CashOperationsAdmin], code: 200, input: [], output: Reconciliation, side_effects: ["→ LOCKED", "increments Reconciliation.version by 1"] }

  # --- AtmForecast ---
  - { method: POST, path: "/vault-cash/atm-forecasts", description: "Create a DRAFT forecast; all projections computed", roles: [AtmAnalyst], code: 201, input: [atm_id, forecast_date, w1_cents, w2_cents, w3_cents], output: AtmForecast, side_effects: ["projections computed per calculations.atm_forecast_projection + atm_residual_target", "status = DRAFT"] }
  - { method: GET, path: "/vault-cash/atm-forecasts", description: "List forecasts", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: ["atm_id?", "status?", "forecast_date?", "limit?", "offset?"], output: "AtmForecast[]", side_effects: [] }
  - { method: GET, path: "/vault-cash/atm-forecasts/{forecastId}", description: "Get one forecast", roles: [CashOperationsAdmin, VaultCustodian, FedCoordinator, AtmAnalyst, ComplianceOfficer, CarrierDispatcher], code: 200, input: [], output: AtmForecast, side_effects: [] }
  - { method: POST, path: "/vault-cash/atm-forecasts/{forecastId}/publish", description: "Publish forecast (OCC on ATM version; supersedes prior PUBLISHED)", roles: [AtmAnalyst], code: 200, input: [expected_atm_version], output: AtmForecast, side_effects: ["DRAFT → PUBLISHED", "prior PUBLISHED same atm+date → SUPERSEDED", "atm.current_forecast_id set", "increments AtmMachine.version by 1"] }
  - { method: POST, path: "/vault-cash/atm-forecasts/{forecastId}/load", description: "Load recommended cash into the ATM from its vault", roles: [AtmAnalyst], code: 200, input: [], output: AtmForecast, side_effects: ["PUBLISHED → LOADED", "site fit debited, ATM balance credited", "ATM_LOAD ledger entry", "recon refresh cascade", "increments forecast + atm version by 1"] }
  - { method: POST, path: "/vault-cash/atm-forecasts/{forecastId}/settle", description: "Settle actual withdrawals; residual returns to vault", roles: [AtmAnalyst], code: 200, input: [actual_withdrawals_cents], output: AtmForecast, side_effects: ["LOADED → SETTLED", "residual_balance_cents computed; ATM balance zeroed", "site fit credited residual via ATM_RESIDUAL_RETURN ledger entry", "recon refresh cascade", "increments forecast + atm version by 1"] }

