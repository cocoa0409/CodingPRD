  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_promotes_waitlist_to_order
        grounds:
          - state_machines.DeliveryBooking.CONFIRMED_to_CANCELLED
          - state_machines.DeliveryBooking.WAITLISTED_to_CONFIRMED
          - calculations.waitlist_promotion
          - calculations.slot_capacity_consumption
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by booking cancel: cancel frees
          slot capacity (hop 1: DeliverySlot mutation), which promotes the
          oldest fitting WAITLISTED booking (hop 2: caused by hop 1, not by the
          cancel directly), which flips that booking's order delivery_status
          WAITLISTED -> SCHEDULED and reserves its stock (hop 3). A parallel
          fan-out would not order the promotions by created_at.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Non-member customer N. Three FULL_SERVE articles W60 (carton 60 kg / 1.0 m3), W40 (40 kg / 0.8 m3), W30 (30 kg / 0.1 m3), stock 2 each. ZONE_A slot 2026-09-10, capacity 100 kg / 2.0 m3. Three DELIVERY orders, one line qty 1 each; bookings: B1 (W60) CONFIRMED, B2 (W40) CONFIRMED (slot full at 100 kg), B3 (W30) WAITLISTED."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - call: "POST /api/articles"
              payload: { article_number: "W60", name: "Desk", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 1000 }
