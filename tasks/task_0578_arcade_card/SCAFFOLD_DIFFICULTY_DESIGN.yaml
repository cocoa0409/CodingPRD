# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: party_charge_provisional_vs_final
        grounds:
          - calculations.party_booking_charge
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - state_machines.PartyBooking.CHECKED_IN_to_COMPLETED
          - entities.PartyBooking.provisional_total_cents
          - entities.PartyBooking.final_total_cents
        distinguishing_aspect: "Same booking yields provisional_total_cents=23000 (planned 12 guests / 2h) at confirm but final_total_cents=32500 (actual 13 guests / 3h) at complete — a PartyBooking-domain provisional-vs-final divergence."
        test_recipe:
          setup:
            - "Room A (capacity 20, hourly_rate 8000), GOLD package (base 20000, included_guests 10, included_hours 2, included_chip 1000), host member, booking of 12 guests for 14:00-16:00 confirmed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: Manager
            - call: "POST /rooms"
              payload: { name: "Room A", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Pizza Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host1@x.com", full_name: "Host One", promo_opt_in: false }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 12 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T14:00:00Z" }
              as: Manager
            - call: "POST /party-bookings/${bid}/check-in"
              payload: {}
              as: Cashier
            - call: "GET /party-bookings/${bid}"
              payload: {}
              as: Coordinator
              captures: { bv1: $.data.version, prov: $.data.provisional_total_cents }
            - call: "POST /party-bookings/${bid}/wristbands"
              payload: { expected_booking_version: "${bv1}" }
              as: Cashier
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T17:00:00Z" }
              as: Manager
            - call: "POST /party-bookings/${bid}/complete"
              payload: {}
              as: Coordinator
              captures: { fin: $.data.final_total_cents }
          assert:
            - "PartyBooking.${bid}.provisional_total_cents == 23000"
            - "PartyBooking.${bid}.final_total_cents == 32500"
            - "PartyBooking.${bid}.actual_guest_count == 13"
            - "PartyBooking.${bid}.provisional_total_cents != PartyBooking.${bid}.final_total_cents"

      - name: redemption_hold_vs_settled
        grounds:
          - calculations.redemption_points_valuation
          - state_machines.Redemption.RESERVED_to_FULFILLED
          - entities.Redemption.points_hold
          - entities.Redemption.points_settled
          - entities.PrizeItem.points_price
        distinguishing_aspect: "A repriced prize makes points_hold=1000 (price 500 at reserve) diverge from points_settled=1200 (price 600 at fulfill) — a Redemption/PrizeItem-domain provisional-vs-final divergence, a different entity domain than party_charge_provisional_vs_final."
        test_recipe:
          setup:
            - "Attraction (cost 100, award 1000), prize Teddy (price 500, stock 100), member+card funded to 2000 points via two plays, a RESERVED redemption of qty 2 at price 500 (hold 1000), then prize repriced to 600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: Manager
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 1000 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /prize-items"
              payload: { name: "Teddy", points_price: 500, stock_qty: 100 }
              as: Manager
              captures: { prize_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r1@x.com", full_name: "R One" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 1000 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c_id}"
              payload: {}
              as: Attendant
              captures: { cv: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c_id}", prize_item_id: "${prize_id}", quantity: 2, expected_card_version: "${cv}" }
              as: Attendant
              captures: { red_id: $.data.id }
            - call: "PATCH /prize-items/${prize_id}"
              payload: { points_price: 600 }
              as: Manager
          trigger:
            - call: "POST /redemptions/${red_id}/fulfill"
              payload: {}
              as: Attendant
              captures: { settled: $.data.points_settled }
          assert:
            - "Redemption.${red_id}.points_hold == 1000"
            - "Redemption.${red_id}.points_settled == 1200"
            - "Redemption.${red_id}.points_hold != Redemption.${red_id}.points_settled"
            - "GameCard.${c_id}.ticket_points_balance == 800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: party_charge_three_input_nonlinear
        grounds:
          - calculations.party_booking_charge
          - entities.PartyBooking.provisional_total_cents
          - entities.Room.hourly_rate_cents
          - entities.PartyPackage.included_guests
        distinguishing_aspect: "Mode (a): provisional_total_cents=35500 combines base + max(0,guest-included)*rate_per_guest + max(0,hours-included)*room_rate — >=3 inputs with two independent nested-max branches active at once."
        test_recipe:
          setup:
            - "Room B (capacity 30, hourly_rate 8000), GOLD package (base 20000, included_guests 10, included_hours 2), booking of 15 guests for 13:00-16:00 (3h)."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room B", capacity: 30, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host2@x.com", full_name: "Host Two" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T13:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 15 }
              as: Coordinator
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "PartyBooking.${bid}.provisional_total_cents == 35500"
            - "PartyBooking.${bid}.status == CONFIRMED"

      - name: reload_bonus_pinned_eval_order
        grounds:
          - calculations.card_reload_credit
          - entities.Member.lifetime_spend_cents
          - entities.Member.membership_tier
          - entities.GameCard.bonus_chip_balance_cents
        distinguishing_aspect: "Mode (c): the reload crossing 50000 grants bonus_chip=0 (PRE-reload tier NONE) while the stored membership_tier becomes SILVER (POST-reload spend) — proving the pinned tier-before-accrual evaluation order on a circular-looking dependency."
        test_recipe:
          setup:
            - "Member+card activated, one reload of 44000 (chip 44000, lifetime 44000, tier still NONE)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "tier@x.com", full_name: "Tier Test" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 44000 }
              as: Cashier
          trigger:
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
          assert:
            - "GameCard.${c_id}.bonus_chip_balance_cents == 0"
            - "GameCard.${c_id}.chip_balance_cents == 50000"
            - "Member.${m_id}.lifetime_spend_cents == 50000"
            - "Member.${m_id}.membership_tier == SILVER"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_cycle_confirm_revert_confirm
        grounds:
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - state_machines.PartyBooking.CONFIRMED_to_DRAFT
          - entities.PartyBooking.provisional_total_cents
        distinguishing_aspect: "PartyBooking loops CONFIRMED->DRAFT->CONFIRMED (a cycle, not a linear pipeline): after revert provisional_total_cents is null, and a second confirm recomputes it to 20000."
        test_recipe:
          setup:
            - "Room, package (included_guests 10, included_hours 2, included_chip 1000), host, booking of 2 guests 14:00-16:00 confirmed once."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room C", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host3@x.com", full_name: "Host Three" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /party-bookings/${bid}/revert-to-draft"
              payload: {}
              as: Coordinator
              captures: { prov_after_revert: $.data.provisional_total_cents }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
          assert:
            - "PartyBooking.${bid}.provisional_total_cents == 20000 after the second confirm"
            - "PartyBooking.${bid}.status == CONFIRMED after the second confirm"
            - "provisional_total_cents == null immediately after revert-to-draft"

      - name: redemption_fork_fulfill_vs_cancel
        grounds:
          - state_machines.Redemption.RESERVED_to_FULFILLED
          - state_machines.Redemption.RESERVED_to_CANCELLED
          - entities.PrizeItem.stock_qty
          - entities.PrizeItem.reserved_qty
        distinguishing_aspect: "Two RESERVED redemptions on the same prize fork to divergent side-effect sets: FULFILLED decrements stock_qty (10->9) permanently, CANCELLED restores reserved_qty with stock unchanged — a branching state machine on Redemption, a different entity than PartyBooking."
        test_recipe:
          setup:
            - "Prize (price 500, stock 10), two cards each funded to 1000 points via one play, each holding one RESERVED redemption of qty 1."
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 1000 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /prize-items"
              payload: { name: "Teddy", points_price: 500, stock_qty: 10 }
              as: Manager
              captures: { prize_id: $.data.id }
            - call: "POST /members"
              payload: { email: "fk@x.com", full_name: "Fork" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c1: $.data.id }
            - call: "POST /game-cards/${c1}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c1}/reload"
              payload: { amount_cents: 200 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c1}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c1}"
              payload: {}
              as: Attendant
              captures: { cv1: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c1}", prize_item_id: "${prize_id}", quantity: 1, expected_card_version: "${cv1}" }
              as: Attendant
              captures: { red1: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c2: $.data.id }
            - call: "POST /game-cards/${c2}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c2}/reload"
              payload: { amount_cents: 200 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c2}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c2}"
              payload: {}
              as: Attendant
              captures: { cv2: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c2}", prize_item_id: "${prize_id}", quantity: 1, expected_card_version: "${cv2}" }
              as: Attendant
              captures: { red2: $.data.id }
          trigger:
            - call: "POST /redemptions/${red1}/fulfill"
              payload: {}
              as: Attendant
            - call: "POST /redemptions/${red2}/cancel"
              payload: {}
              as: Attendant
          assert:
            - "Redemption.${red1}.status == FULFILLED"
            - "Redemption.${red2}.status == CANCELLED"
            - "PrizeItem.${prize_id}.stock_qty == 9"
            - "PrizeItem.${prize_id}.reserved_qty == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_cascade_wristband_card_ledger
        grounds:
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - entities.Wristband.card_id
          - entities.GameCard.bonus_chip_balance_cents
          - entities.CardLedgerEntry.entry_type
        distinguishing_aspect: "Depth-3 chain caused link-by-link: confirm creates a Wristband (hop1); that Wristband provisions a GameCard (hop2); that GameCard's bonus grant appends a BONUS_GRANT CardLedgerEntry of +1000 (hop3)."
        test_recipe:
          setup:
            - "Room, package (included_chip 1000), host, DRAFT booking of 2 guests."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room D", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host4@x.com", full_name: "Host Four" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /wristbands"
              payload: { booking_id: "${bid}" }
              as: Coordinator
              captures: { w0_card: "$.data[0].card_id" }
          assert:
            - "GET /wristbands?booking_id=${bid} returns an array of length 2, each with a non-null card_id (hop1+hop2)"
            - "GameCard.${w0_card}.bonus_chip_balance_cents == 1000 (hop2 provisioned card + hop3 grant)"
            - "GET /game-cards/${w0_card}/ledger includes an entry with entry_type == BONUS_GRANT and bonus_delta_cents == 1000 (hop3)"

      - name: cancel_cascade_void_clawback_ledger
        grounds:
          - state_machines.PartyBooking.CONFIRMED_to_CANCELLED
          - entities.Wristband.status
          - entities.GameCard.bonus_chip_balance_cents
          - entities.CardLedgerEntry.entry_type
        distinguishing_aspect: "Depth-3 chain from a DIFFERENT trigger (cancel): cancel voids each Wristband (hop1); each VOID Wristband claws back its GameCard's bonus (hop2); that clawback appends a BONUS_CLAWBACK CardLedgerEntry of -1000 leaving bonus 0 (hop3)."
        test_recipe:
          setup:
            - "Room, package (included_chip 1000), host, booking of 2 guests confirmed (2 wristbands + 2 provisioned cards each bonus 1000)."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room E", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host5@x.com", full_name: "Host Five" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /wristbands"
              payload: { booking_id: "${bid}" }
              as: Coordinator
              captures: { w0_id: "$.data[0].id", w0_card: "$.data[0].card_id" }
          trigger:
            - call: "POST /party-bookings/${bid}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "Wristband.${w0_id}.status == VOID (hop1)"
            - "GameCard.${w0_card}.bonus_chip_balance_cents == 0 (hop2 clawback)"
            - "GET /game-cards/${w0_card}/ledger includes an entry with entry_type == BONUS_CLAWBACK and bonus_delta_cents == -1000 (hop3)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_beats_balance_cap
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_CARD_FROZEN]
          - errors[ERR_CARD_BALANCE_CAP_EXCEEDED]
        distinguishing_aspect: "A reload that is BOTH on a FROZEN card AND would push chip_balance past the 100000 cap returns ERR_CARD_FROZEN (state, priority 5) — not ERR_CARD_BALANCE_CAP_EXCEEDED (business_fiscal, priority 11); the pair is state vs business_fiscal."
        test_recipe:
          setup:
            - "Member+card activated, reloaded to chip 96000, then frozen."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "frz@x.com", full_name: "Frozen" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 96000 }
              as: Cashier
            - call: "POST /game-cards/${c_id}/freeze"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CARD_FROZEN"
            - "trigger response HTTP status == 409"
            - "GameCard.${c_id}.chip_balance_cents == 96000 (reload rejected, no mutation)"

      - name: room_conflict_beats_guest_cap
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_ROOM_TIME_CONFLICT]
          - errors[ERR_GUEST_COUNT_EXCEEDS_ROOM]
        distinguishing_aspect: "A confirm that BOTH overlaps another booking on the same room AND has guest_count>room.capacity returns ERR_ROOM_TIME_CONFLICT (business_temporal, priority 9) — not ERR_GUEST_COUNT_EXCEEDS_ROOM (business_constraint, priority 10); the pair is business_temporal vs business_constraint, distinct from frozen_beats_balance_cap."
        test_recipe:
          setup:
            - "Room (capacity 20), booking A of 10 guests 14:00-16:00 confirmed; booking B of 25 guests 15:00-17:00 same room in DRAFT."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room F", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host6@x.com", full_name: "Host Six" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 10 }
              as: Coordinator
              captures: { bid_a: $.data.id }
            - call: "POST /party-bookings/${bid_a}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T15:00:00Z", end_at: "2026-05-01T17:00:00Z", guest_count: 25 }
              as: Coordinator
              captures: { bid_b: $.data.id }
          trigger:
            - call: "POST /party-bookings/${bid_b}/confirm"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ROOM_TIME_CONFLICT"
            - "trigger response HTTP status == 409"
            - "PartyBooking.${bid_b}.status == DRAFT (confirm rejected)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: gameplay_exact_balance_boundary
        grounds:
          - calculations.gameplay_settlement
          - validations[priority=11]
          - entities.GameCard.chip_balance_cents
          - errors[ERR_INSUFFICIENT_CHIP_BALANCE]
        distinguishing_aspect: "With chip_balance exactly 200 and attraction cost 200, the play SUCCEEDS (>= is inclusive) leaving chip_balance 0; a second play at balance 0 fails ERR_INSUFFICIENT_CHIP_BALANCE — a chip-balance-vs-cost boundary on POST /game-plays."
        test_recipe:
          setup:
            - "Attraction (cost 200, award 10), member+card activated and reloaded to exactly 200 chip."
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Exact", chip_cost_cents: 200, points_award: 10 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b1@x.com", full_name: "Bound One" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 200 }
              as: Cashier
          trigger:
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
              captures: { stored1: $.data.chip_from_stored_cents, pts1: $.data.points_awarded }
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
              captures: { err: $.data.error_id }
          assert:
            - "first GamePlay.chip_from_stored_cents == 200"
            - "first GamePlay.points_awarded == 10"
            - "GameCard.${c_id}.chip_balance_cents == 0 after the first play"
            - "second POST /game-plays response error_id == ERR_INSUFFICIENT_CHIP_BALANCE (402)"

      - name: tier_threshold_exact_50000
        grounds:
          - calculations.card_reload_credit
          - entities.Member.membership_tier
          - entities.Member.lifetime_spend_cents
        distinguishing_aspect: "A reload bringing lifetime_spend to exactly 50000 flips membership_tier NONE->SILVER (>= threshold is inclusive) — a cumulative-spend threshold on POST /game-cards/{id}/reload, a different metric and endpoint than gameplay_exact_balance_boundary."
        test_recipe:
          setup:
            - "Member+card activated, reloaded 44000 (lifetime 44000, tier NONE)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "b2@x.com", full_name: "Bound Two" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 44000 }
              as: Cashier
          trigger:
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
          assert:
            - "Member.${m_id}.lifetime_spend_cents == 50000"
            - "Member.${m_id}.membership_tier == SILVER"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_room_available
        grounds:
          - state_machines.PartyBooking.CONFIRMED_to_CHECKED_IN
          - validations[priority=7]
          - entities.Room.status
          - errors[ERR_ROOM_UNAVAILABLE]
        distinguishing_aspect: "A CONFIRMED booking cannot check in while its Room.status==MAINTENANCE (ERR_ROOM_UNAVAILABLE); after PATCHing the room back to AVAILABLE the same check-in succeeds — PartyBooking transition gated on Room state."
        test_recipe:
          setup:
            - "Room, package, host, booking of 2 guests 14:00-16:00 confirmed; clock set to 14:30 (inside window); room set to MAINTENANCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: Manager
            - call: "POST /rooms"
              payload: { name: "Room G", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host7@x.com", full_name: "Host Seven" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T14:30:00Z" }
              as: Manager
            - call: "PATCH /rooms/${room_id}"
              payload: { status: "MAINTENANCE" }
              as: Manager
          trigger:
            - call: "POST /party-bookings/${bid}/check-in"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
            - call: "PATCH /rooms/${room_id}"
              payload: { status: "AVAILABLE" }
              as: Manager
            - call: "POST /party-bookings/${bid}/check-in"
              payload: {}
              as: Cashier
          assert:
            - "first check-in response error_id == ERR_ROOM_UNAVAILABLE (409)"
            - "PartyBooking.${bid}.status == CHECKED_IN after room set AVAILABLE and re-check-in"

      - name: gameplay_requires_attraction_open
        grounds:
          - calculations.gameplay_settlement
          - validations[priority=7]
          - entities.Attraction.status
          - errors[ERR_ATTRACTION_NOT_OPEN]
        distinguishing_aspect: "A gameplay is rejected with ERR_ATTRACTION_NOT_OPEN while Attraction.status==MAINTENANCE; after PATCHing it back to OPEN the same play succeeds — GamePlay gated on Attraction state, a different entity pair than checkin_requires_room_available."
        test_recipe:
          setup:
            - "Attraction (cost 100, award 10), member+card activated+reloaded 500, attraction set to MAINTENANCE."
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 10 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ce@x.com", full_name: "Cross Ent" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 500 }
              as: Cashier
            - call: "PATCH /attractions/${attr_id}"
              payload: { status: "MAINTENANCE" }
              as: Manager
          trigger:
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
              captures: { err: $.data.error_id }
            - call: "PATCH /attractions/${attr_id}"
              payload: { status: "OPEN" }
              as: Manager
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
          assert:
            - "first play response error_id == ERR_ATTRACTION_NOT_OPEN (409)"
            - "GameCard.${c_id}.chip_balance_cents == 400 after the attraction is reopened and the play succeeds"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_pairwise_halfopen_overlap
        grounds:
          - validations[priority=9]
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - entities.PartyBooking.start_at
          - errors[ERR_ROOM_TIME_CONFLICT]
        distinguishing_aspect: "Pairwise half-open [start,end) semantics on one Room: an adjacent booking (16:00-18:00 after 14:00-16:00) confirms fine, but an overlapping booking (15:00-17:00) is rejected ERR_ROOM_TIME_CONFLICT — geometry is exclusive-pairwise with adjacency allowed."
        test_recipe:
          setup:
            - "Room (capacity 30), booking A 14:00-16:00 confirmed, booking B 16:00-18:00 (adjacent) confirmed, booking C 15:00-17:00 same room in DRAFT."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room H", capacity: 30, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host8@x.com", full_name: "Host Eight" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 5 }
              as: Coordinator
              captures: { bid_a: $.data.id }
            - call: "POST /party-bookings/${bid_a}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T16:00:00Z", end_at: "2026-05-01T18:00:00Z", guest_count: 5 }
              as: Coordinator
              captures: { bid_b: $.data.id }
            - call: "POST /party-bookings/${bid_b}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T15:00:00Z", end_at: "2026-05-01T17:00:00Z", guest_count: 5 }
              as: Coordinator
              captures: { bid_c: $.data.id }
          trigger:
            - call: "POST /party-bookings/${bid_c}/confirm"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "PartyBooking.${bid_b}.status == CONFIRMED (adjacent 16:00 boundary allowed)"
            - "trigger response error_id == ERR_ROOM_TIME_CONFLICT (409)"
            - "PartyBooking.${bid_c}.status == DRAFT (overlap rejected)"

      - name: venue_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - entities.PartyBooking.guest_count
          - errors[ERR_VENUE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Aggregate-capacity semantics across DIFFERENT rooms: two overlapping bookings summing 150+60=210 guests exceed MAX_VENUE_OCCUPANCY=200 and the second confirm fails ERR_VENUE_CAPACITY_EXCEEDED — a summed-occupancy overlap on the venue, not the pairwise room geometry of room_pairwise_halfopen_overlap."
        test_recipe:
          setup:
            - "Room1 and Room2 (capacity 200 each), booking A of 150 guests in Room1 14:00-16:00 confirmed, booking B of 60 guests in Room2 15:00-17:00 in DRAFT."
