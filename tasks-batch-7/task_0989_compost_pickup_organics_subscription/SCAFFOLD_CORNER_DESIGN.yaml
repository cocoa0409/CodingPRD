  # ============================================================ validations ==
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED even when the path target does not exist (auth precedes existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "when the test harness strips both auth headers: status 401 and error_id == ERR_UNAUTHENTICATED"

      - name: tagging_driver_cannot_confirm_own_tag
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: an OperationsManager call whose X-User-ID equals tagged_by_driver_id is rejected even though the role is otherwise privileged."
        test_recipe:
          setup: ["RES subscription; week 2026-06-01 generated; pickup tagged by X-User-ID 'shared-1' acting as Driver"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/contamination-tags", payload: { severity: "LOW", category: "PLASTIC" }, as: Driver, as_user_id: "shared-1", captures: { tag1: $.data.id } }
          trigger:
            - { call: "POST /contamination-tags/${tag1}/confirm", payload: {}, as: OperationsManager, as_user_id: "shared-1", captures: { err: $.data.error_id } }
            - { call: "POST /contamination-tags/${tag1}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-2" }
          assert:
            - "confirm by 'shared-1' (the tagger): error_id == ERR_SEGREGATION_OF_DUTIES, tag stays TAGGED"
            - "confirm by 'ops-2' succeeds: ContaminationTag.${tag1}.status == CONFIRMED, surcharge_cents == 500, resolved_by == 'ops-2'"

