  - rule_id: transitive_cascade
    instances:
      - name: incident_confirmation_cascades_score_to_provider_engagement_and_cycle
        grounds:
          - state_machines.SlaIncident.OPEN_to_CONFIRMED
          - calculations.provider_service_score
          - state_machines.Provider.ACTIVE_to_PROBATION
          - state_machines.Engagement.ACTIVE_to_REMEDIATION_REQUIRED
          - state_machines.PayrollCycle.DRAFT_to_ON_HOLD
        distinguishing_aspect: |
          Trigger is a service-level incident confirmation. The chain is four links deep and
          every link is caused strictly by the previous one: confirming the second SEV1
          gives it weight_points 25.00, which drops Provider.service_score to 50.00, which
          drops the provider into PROBATION, which drops the engagement into
          REMEDIATION_REQUIRED, which puts the engagement's DRAFT cycle ON_HOLD with
          hold_reason PROVIDER_PROBATION. No penalty is involved anywhere in the chain.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE, closed_cycle_count 0 so the ENGAGEMENT_TO_DATE score variant is in force"
            - "one CONFIRMED SEV1 SlaIncident, so Provider.service_score is 75.00 and Provider.status is ACTIVE"
            - "a second SEV1 SlaIncident raised but still OPEN, contributing weight_points 0.00"
            - "one PayrollCycle 2026-09 for the engagement, still in DRAFT with hold_reason null"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-09", period_start_date: "2026-09-01", period_end_date: "2026-10-01", pay_date: "2026-09-30", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c_draft: "$.data.id" }
            - call: "POST /payroll/sla-incidents"
              payload: { engagement_id: "${eng_de}", incident_type: "LATE_GTN_DELIVERY", severity: "SEV1", occurred_at: "2026-07-01T09:00:00Z", note: "results delivered two days after the agreed slot" }
              as: PayrollController
              as_user_id: "ctrl-01"
              captures: { inc1: "$.data.id" }
            - call: "POST /payroll/sla-incidents/${inc1}/confirm"
              payload: {}
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/sla-incidents"
              payload: { engagement_id: "${eng_de}", incident_type: "DATA_INCIDENT", severity: "SEV1", occurred_at: "2026-07-15T09:00:00Z", note: "employee bank details mailed to the wrong distribution list" }
              as: PayrollController
              as_user_id: "ctrl-01"
              captures: { inc2: "$.data.id" }
          trigger:
            - call: "POST /payroll/sla-incidents/${inc2}/confirm"
              payload: {}
              as: PayrollController
              as_user_id: "ctrl-01"
          assert:
            - "SlaIncident.${inc2}.status == CONFIRMED and SlaIncident.${inc2}.weight_points == 25.00 (link 1)"
            - "Provider.${prov_p1}.service_score == 50.00 (link 2)"
            - "Provider.${prov_p1}.score_variant_applied == ENGAGEMENT_TO_DATE"
            - "Provider.${prov_p1}.status == PROBATION (link 3)"
            - "Engagement.${eng_de}.status == REMEDIATION_REQUIRED (link 4)"
            - "Engagement.${eng_de}.transition_required == true"
            - "PayrollCycle.${c_draft}.status == ON_HOLD (link 5)"
            - "PayrollCycle.${c_draft}.hold_reason == PROVIDER_PROBATION"
            - "Provider.${prov_p1}.open_penalty_minor == 0 (the cascade was driven purely by the score)"

      - name: filing_sweep_cascades_penalty_exposure_to_provider_probation_and_hold
        grounds:
          - calculations.filing_penalty_allocation
          - state_machines.StatutoryFiling.PENDING_to_LATE
          - entities.Provider.fields.open_penalty_minor
          - state_machines.Provider.ACTIVE_to_PROBATION
          - state_machines.Engagement.ACTIVE_to_REMEDIATION_REQUIRED
          - state_machines.PayrollCycle.DRAFT_to_ON_HOLD
        distinguishing_aspect: |
          Trigger is a statutory filing sweep, a different trigger from the incident
          confirmation instance, and the causal chain runs through penalty money rather
          than through the score: the sweep assesses 246000, which lifts
          Provider.open_penalty_minor above the 100000 probation threshold, which drops
          the provider into PROBATION while service_score stays at 100.00, which drops the
          engagement into REMEDIATION_REQUIRED, which holds the DRAFT cycle. The unchanged
          service_score is what proves the chain used the penalty link.
        test_recipe:
          setup:
            - "CountryProfile PL with a single required filing type, statutory_filing_deadline_days 10 and penalty_daily_rate_minor 60000"
            - "Provider VistulaPay Sp z oo with annual_fee_minor 6000000 and indemnity_cap_pct 25.00, so its indemnity cap of 1500000 never binds"
            - "ACTIVE Engagement for PL with filing_responsibility PROVIDER and no SlaIncident at all, so service_score is 100.00"
            - "PayrollCycle 2026-08 in RESULTS_APPROVED with one PENDING filing due 2026-09-10T23:59:59.999Z, and PayrollCycle 2026-09 still in DRAFT"
            - "logical clock advanced to 2026-09-13T12:00:00Z, which is 3 whole late days past the due instant"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "PL", local_currency: "PLN", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 60000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
