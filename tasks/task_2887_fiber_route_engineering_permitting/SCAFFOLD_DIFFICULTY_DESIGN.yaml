            - "PermitApplication.${p1_id}.submitted_at == 2026-08-20T00:00:00Z"
            - "raw_days for round 1 is 21 + 14 = 35 and AUTHORITY_CAP_DAYS[MUNICIPAL_ROW] is 35, so review_days sits exactly on the cap and a round-2 resubmission would still be 35"
            - "RouteSegment.${seg_id}.permit_status == PENDING"
            - "Route.${route_id}.status == PERMITTING"

  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: permit_denial_five_hop_cascade_voids_stamp_and_reopens_route
        grounds:
          - state_machines.PermitApplication.transitions.UNDER_REVIEW_to_DENIED
          - state_machines.RouteSegment.transitions.permit_status_PENDING_to_BLOCKED
          - state_machines.RouteSegment.transitions.engineering_status_DESIGN_LOCKED_to_METHOD_SELECTED
          - state_machines.DesignPackage.transitions.STAMPED_to_DRAFT
          - state_machines.Route.transitions.CONSTRUCTION_READY_to_PERMITTING
          - entities.DesignPackage.fields.stamp_voided_at
          - entities.RouteSegment.fields.bid_ready_cost_cents
        distinguishing_aspect: |
          Trigger is a permit DENIAL and the chain runs PermitApplication -> RouteSegment.permit_status ->
          RouteSegment.engineering_status -> DesignPackage -> Route, five distinct entities deep, with hop 4 conditional
          on the stamped design owning a PLACED SplicePoint on the denied segment.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z, later advanced to 2026-08-12T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000"
            - "one RouteSegment: sequence_index 1, length_feet 1250, terrain_class URBAN_PAVED, engineering_status DESIGN_LOCKED with construction_method AERIAL and bid_ready_cost_cents 1971475, permit_status CLEARED"
            - "one MUNICIPAL_ROW PermitApplication already APPROVED on that segment"
            - "one DesignPackage revision 1 on the route with fiber_count_allocated 288 and express_fiber_count 48, status STAMPED, owning one PLACED SplicePoint at station 0 on that segment"
            - "the Route is CONSTRUCTION_READY and total_bid_ready_cost_cents is 1971475"
            - "a second MUNICIPAL_ROW PermitApplication on the same segment is UNDER_REVIEW (a supplemental permit filed after construction-ready), which moved permit_status CLEARED -> PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 1250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-25", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "aerial run confirmed" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv1}" }
              as: RouteEngineer
            - call: "POST /segments/${seg_id}/bid-ready-estimate"
              payload: {}
              as: RouteEngineer
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-25" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /permit-applications/${p1_id}/review"
              payload: { decision: "APPROVED", decision_note: "aerial attachment approved" }
              as: AuthorityReviewer
              as_user_id: "city-reviewer-1"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv2: $.data.version }
            - call: "POST /design-packages"
              payload: { route_id: "${route_id}", fiber_count_allocated: 288, express_fiber_count: 48, expected_route_version: "${rv2}" }
              as: RouteEngineer
              captures: { dp_id: $.data.id, dp_rev: $.data.revision }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { sp_id: $.data.id }
            - call: "POST /design-packages/${dp_id}/submit-for-review"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /design-packages/${dp_id}/stamp"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-bob"
