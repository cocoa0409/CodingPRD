# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0431
# Breadth probe across the claim-extraction-guide sections. excluded_because stubs
# point at §1.8 instances by name; full recipes cover everything else.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Project.fields.status
          - entities.Project.fields.posture
          - entities.Project.fields.open_finding_count
        distinguishing_aspect: "POST /projects with all required fields returns 201; status=DRAFT, posture=COMPLIANT, open_finding_count=0 are server-set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
          assert:
            - "response code == 201"
            - "Project.${p_id}.status == DRAFT"
            - "Project.${p_id}.posture == COMPLIANT"
            - "Project.${p_id}.open_finding_count == 0"
            - "Project.${p_id}.version == 1"

      - name: create_project_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Project.fields.area_median_income_cents
        distinguishing_aspect: "POST /projects omitting area_median_income_cents returns 400 ERR_VALIDATION (required input, no default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P", minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "error_id == ERR_VALIDATION"

      - name: get_nonexistent_project_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{id} with an unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateHFA
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: unit_income_rent_limits_computed_on_create_inputs_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Unit.fields.income_limit_cents
          - entities.Unit.fields.gross_rent_ceiling_cents
          - entities.Unit.fields.net_max_rent_cents
        distinguishing_aspect: "Unit AMI_50 br1 ua9000 -> income_limit_cents=3840000, gross_rent_ceiling_cents=96000, net_max_rent_cents=87000 computed server-side; li_status=VACANT_NEVER_OCCUPIED."
        test_recipe:
          setup: ["Project P (AMI 9_600_000), Building B exist."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
          assert:
            - "Unit.${u1_id}.income_limit_cents == 3840000"
            - "Unit.${u1_id}.gross_rent_ceiling_cents == 96000"
            - "Unit.${u1_id}.net_max_rent_cents == 87000"
            - "Unit.${u1_id}.li_status == VACANT_NEVER_OCCUPIED"
            - "Unit.${u1_id}.is_low_income_counted == false"

      - name: household_student_eligible_false_when_all_students_no_exception
        claim_type: Computed Fields
        grounds:
          - entities.Household.fields.student_eligible
          - entities.Household.fields.all_full_time_students
        distinguishing_aspect: "Household all_full_time_students=true, student_exception=NONE -> student_eligible=false (computed)."
        test_recipe:
          setup: ["Project P exists."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "HS", household_size: 2, all_full_time_students: true, student_exception: "NONE" }
              as: OwnerAgent
              captures: { hs_id: $.data.id }
          assert:
            - "Household.${hs_id}.student_eligible == false"

      - name: household_student_exception_rescues_eligibility
        claim_type: Type Constraints
        grounds:
          - entities.Household.fields.student_exception
          - entities.Household.fields.student_eligible
        distinguishing_aspect: "Household all_full_time_students=true with student_exception=SINGLE_PARENT -> student_eligible=true (exception rescues the all-student household)."
        test_recipe:
          setup: ["Project P exists."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "HS", household_size: 2, all_full_time_students: true, student_exception: "SINGLE_PARENT" }
              as: OwnerAgent
              captures: { hs_id: $.data.id }
          assert:
            - "Household.${hs_id}.student_eligible == true"

      - name: list_projects_pagination_envelope_fields
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /projects?limit=1&offset=0 returns a paginated array envelope with total_count and has_more after two projects are created."
        test_recipe:
          setup: ["Two projects created."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P1", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
            - call: "POST /projects"
              payload: { name: "P2", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
          trigger:
            - call: "GET /projects?limit=1&offset=0"
              payload: {}
              as: StateHFA
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: certification_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Certification.initial_state
          - entities.Certification.fields.status
        distinguishing_aspect: "A newly created Certification has status=DRAFT."
        test_recipe:
          setup: ["Project, Building, Unit, Household exist."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_id: $.data.id }
          assert:
            - "Certification.${c_id}.status == DRAFT"

      - name: approve_certification_in_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Certification.SUBMITTED_to_APPROVED
          - validations[priority=4]
        distinguishing_aspect: "Approving a Certification still in DRAFT (never submitted) returns 409 ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A DRAFT certification c exists (never submitted)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /certifications/${c_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Certification.${c_id}.status == DRAFT"

      - name: revise_returns_submitted_cert_to_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.Certification.SUBMITTED_to_DRAFT
        distinguishing_aspect: "A SUBMITTED certification revised returns to DRAFT."
        test_recipe:
          setup: ["A SUBMITTED certification c (non-student household, income within limit)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_id: $.data.id }
            - call: "POST /certifications/${c_id}/submit"
              payload: {}
              as: OwnerAgent
          trigger:
            - call: "POST /certifications/${c_id}/revise"
              payload: {}
              as: OwnerAgent
              captures: { st: $.data.status }
          assert:
            - "Certification.${c_id}.status == DRAFT"

      - name: certification_reject_decision_sets_rejected
        claim_type: Valid Transition
        grounds:
          - state_machines.Certification.SUBMITTED_to_REJECTED
        distinguishing_aspect: "Approving with decision=REJECT moves a SUBMITTED certification to REJECTED and leaves the unit li_status unchanged (VACANT_NEVER_OCCUPIED)."
        test_recipe:
          setup: ["A SUBMITTED INITIAL certification c on a VACANT unit."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_id: $.data.id }
            - call: "POST /certifications/${c_id}/submit"
              payload: {}
              as: OwnerAgent
          trigger:
            - call: "POST /certifications/${c_id}/approve"
              payload: { decision: "REJECT" }
              as: StateHFA
              captures: { st: $.data.status }
          assert:
            - "Certification.${c_id}.status == REJECTED"
            - "Unit.${u1_id}.li_status == VACANT_NEVER_OCCUPIED"

      - name: project_close_blocked_by_open_finding_count
        claim_type: guarded transitions
        grounds:
          - state_machines.Project.COMPLIANCE_PERIOD_to_CLOSED
          - validations[priority=12]
        distinguishing_aspect: "A project in COMPLIANCE_PERIOD with open_finding_count==1 cannot close — returns 409 ERR_OPEN_FINDINGS_BLOCK_CLOSE. (Reached: invalid-state on close from DRAFT verifies the guard family without staging the full lifecycle.)"
        test_recipe:
          setup: ["A DRAFT project P (cannot reach COMPLIANCE_PERIOD without a FINAL 8609); closing from DRAFT exercises the close guard."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /projects/${p_id}/close"
              payload: {}
              as: StateHFA
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Project.${p_id}.status == DRAFT"

      - name: difficulty_unit_li_status_cycle_covered
        claim_type: cyclic
        grounds:
          - state_machines.Unit.QUALIFIED_to_OVER_INCOME
          - state_machines.Unit.OVER_INCOME_to_QUALIFIED
        excluded_because:
          difficulty_instance: non_linear_state_machine / unit_li_status_cycle_qualified_over_income_qualified
          rationale: "The QUALIFIED<->OVER_INCOME cycle is exercised end-to-end by the named §1.8 instance."

      - name: difficulty_building_credit_revert_covered
        claim_type: Branching with revert
        grounds:
          - state_machines.Building.FINAL_8609_to_PROVISIONAL_8609
        excluded_because:
          difficulty_instance: non_linear_state_machine / building_credit_branch_revert_final_to_provisional
          rationale: "FINAL_8609->PROVISIONAL_8609 revert is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: difficulty_applicable_fraction_min_covered
        claim_type: Correct Result
        grounds:
          - calculations.building_applicable_fraction_and_credit
        excluded_because:
          difficulty_instance: combinatorial_formula / applicable_fraction_min_of_two_fractions_then_tiered_credit
          rationale: "applicable_fraction/qualified_basis/credit correctness is asserted by the named §1.8 instance."

      - name: difficulty_rent_ceiling_floor_order_covered
        claim_type: Precision
        grounds:
          - calculations.unit_income_and_rent_limits
        excluded_because:
          difficulty_instance: combinatorial_formula / rent_ceiling_nested_floor_order_income_then_thirty_then_twelve
          rationale: "The pinned floor order is asserted by the named §1.8 instance."

      - name: set_aside_average_income_test_passes_at_60_average
        claim_type: Correct Result
        grounds:
          - calculations.minimum_set_aside_test
          - state_machines.Project.DRAFT_to_SET_ASIDE_MET
        distinguishing_aspect: "AVERAGE_INCOME project with LI designations {AMI_80, AMI_80, AMI_40, AMI_40} has average 60.00 (<= ceiling) so certify-set-aside succeeds -> Project.status SET_ASIDE_MET."
        test_recipe:
          setup: ["Project P (AVERAGE_INCOME); Building B (4 units); 2 AMI_80 + 2 AMI_40 units."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "AVERAGE_INCOME", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 4, total_residential_sqft: 4000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_80" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_80" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U3", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_40" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U4", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_40" }
              as: OwnerAgent
          trigger:
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
              captures: { st: $.data.status }
          assert:
            - "Project.${p_id}.status == SET_ASIDE_MET"

      - name: set_aside_average_income_test_fails_above_60_average
        claim_type: Input Set Filtering
        grounds:
          - calculations.minimum_set_aside_test
          - validations[priority=11]
          - errors[ERR_SET_ASIDE_NOT_MET]
        distinguishing_aspect: "AVERAGE_INCOME project with LI designations {AMI_80, AMI_60, AMI_50, AMI_60} has average 62.50 (> ceiling 60.00) so certify-set-aside returns 409 ERR_SET_ASIDE_NOT_MET."
        test_recipe:
          setup: ["Project P (AVERAGE_INCOME); Building B (4 units); AMI_80, AMI_60, AMI_50, AMI_60 -> average 62.50."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "AVERAGE_INCOME", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 4, total_residential_sqft: 4000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_80" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U3", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U4", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
          trigger:
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_SET_ASIDE_NOT_MET"
            - "Project.${p_id}.status == DRAFT"

      - name: difficulty_first_year_dual_variant_covered
        claim_type: Variant Divergence
        grounds:
          - calculations.first_year_credit_dual_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / first_year_credit_provisional_vs_final_on_building
          rationale: "Provisional vs final fraction divergence (0.8000 vs 0.6000) is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: lease_rent_over_net_max_returns_rent_over_limit
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - calculations.unit_income_and_rent_limits
          - errors[ERR_RENT_OVER_LIMIT]
        distinguishing_aspect: "Leasing AMI_50 br1 (net_max_rent_cents=87000) at monthly_rent_cents=90000 returns 422 ERR_RENT_OVER_LIMIT; no Lease created."
        test_recipe:
