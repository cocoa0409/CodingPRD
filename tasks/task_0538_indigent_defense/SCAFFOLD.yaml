    path: "/defender-offices"
    description: "Create a defender office / funding unit"
    roles: [SupervisingAttorney]
    code: 201
    input: [name, annual_voucher_budget_cents, "recoupment_basis?"]
    output: DefenderOffice
    side_effects: ["voucher_spent_cents=0, budget_status=OPEN"]

  - method: GET
    path: "/defender-offices/{officeId}"
    description: "Get a defender office"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: DefenderOffice
    side_effects: []

  # ---- Attorney ----
  - method: POST
    path: "/attorneys"
    description: "Register a staff or panel attorney"
    roles: [SupervisingAttorney]
    code: 201
    input: [office_id, name, attorney_type, bar_number, hourly_rate_cents, max_weighted_caseload]
    output: Attorney
    side_effects: ["current_weighted_load=0, status=ACTIVE"]

  - method: GET
    path: "/attorneys/{attorneyId}"
    description: "Get an attorney"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: Attorney
    side_effects: []

  - method: GET
    path: "/attorneys"
    description: "List attorneys; filter by office_id/status (reverse-reachability for Attorney.office_id)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["office_id?", "status?", "limit?", "offset?"]
    output: "Attorney[]"
    side_effects: []

  - method: POST
    path: "/attorneys/{attorneyId}/suspend"
    description: "Suspend an attorney"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: Attorney
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/attorneys/{attorneyId}/reactivate"
    description: "Reactivate a suspended attorney"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: Attorney
    side_effects: ["status -> ACTIVE or AT_CAPACITY depending on current load"]

  # ---- Courtroom ----
  - method: POST
    path: "/courtrooms"
    description: "Create a courtroom"
    roles: [SupervisingAttorney]
    code: 201
    input: [name, courthouse]
    output: Courtroom
    side_effects: []

  - method: GET
    path: "/courtrooms/{courtroomId}"
    description: "Get a courtroom"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: Courtroom
    side_effects: []

  # ---- Case ----
  - method: POST
    path: "/cases"
    description: "Refer a new case (intake)"
    roles: [IntakeClerk]
    code: 201
    input: [office_id, defendant_name, charge_class]
    output: Case
    side_effects: ["status=REFERRED, eligibility_status=PENDING, case_weight=0"]

  - method: GET
    path: "/cases/{caseId}"
    description: "Get a case"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases; filter by office_id/status (reverse-reachability for Case.office_id)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["office_id?", "status?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/reassign"
    description: "Reassign a case to a new attorney (supersedes prior assignment; OCC on Case.version)"
    roles: [AssignmentCoordinator]
    code: 200
    input: [new_attorney_id, expected_case_version]
    output: Case
    side_effects:
      - "prior Assignment -> REASSIGNED (prior attorney load -=), new Assignment ACTIVE (new attorney load +=)"
      - "increments Case.version by 1"

  - method: POST
    path: "/cases/{caseId}/adjust-weight"
    description: "Recompute case weight to ACTUAL basis"
    roles: [AssignmentCoordinator]
    code: 200
    input: [complexity_tier, co_defendant_count]
    output: Case
    side_effects:
      - "case_weight recomputed (ACTUAL), weight_basis=ACTUAL"
      - "ACTIVE Assignment.assigned_weight updated; attorney current_weighted_load recomputed (capacity re-checked)"

  - method: POST
    path: "/cases/{caseId}/dispose"
    description: "Record disposition and close the case"
    roles: [AssignmentCoordinator]
    code: 200
    input: [disposition_type]
    output: Case
    side_effects:
      - "status -> DISPOSED; cascade closes Assignment, decrements attorney load, may flip attorney AT_CAPACITY->ACTIVE"
      - "if screening PARTIAL: RecoupmentOrder auto-created"

  # ---- FinancialScreening ----
  - method: POST
    path: "/financial-screenings"
    description: "Submit a financial-eligibility screening for a case"
    roles: [IntakeClerk]
    code: 201
    input: [case_id, household_income_cents, household_size, asset_value_cents]
    output: FinancialScreening
    side_effects: ["status=SUBMITTED, result=PENDING"]

  - method: GET
    path: "/financial-screenings/{screeningId}"
    description: "Get a financial screening"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: FinancialScreening
    side_effects: []

  - method: GET
    path: "/financial-screenings"
    description: "List screenings; filter by case_id (reverse-reachability for FinancialScreening.case_id)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: "FinancialScreening[]"
    side_effects: []

  - method: POST
    path: "/financial-screenings/{screeningId}/decide"
    description: "Decide eligibility (computes result + contribution; drives Case fork)"
    roles: [ScreeningOfficer]
    code: 200
    input: []
    output: FinancialScreening
    side_effects:
      - "result, contribution_amount_cents computed; decided_by_user_id set; parent Case -> SCREENED or DENIED"

  # ---- ConflictCheck ----
  - method: POST
    path: "/conflict-checks"
    description: "Run a conflict-of-interest check for (case, attorney); result computed at creation"
    roles: [AssignmentCoordinator]
    code: 201
    input: [case_id, attorney_id, "co_defendant_names?"]
    output: ConflictCheck
    side_effects: ["result computed CLEAR/CONFLICT"]

  - method: GET
    path: "/conflict-checks/{conflictCheckId}"
    description: "Get a conflict check"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: ConflictCheck
    side_effects: []

  - method: GET
    path: "/conflict-checks"
    description: "List conflict checks; filter by case_id/attorney_id (reverse-reachability for both FKs)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["case_id?", "attorney_id?", "limit?", "offset?"]
    output: "ConflictCheck[]"
    side_effects: []

  # ---- Assignment ----
  - method: POST
    path: "/assignments"
    description: "Assign a screened case to an attorney"
    roles: [AssignmentCoordinator]
    code: 201
    input: [case_id, attorney_id]
    output: Assignment
    side_effects:
      - "Case -> ASSIGNED, provisional case_weight set, assigned_attorney_id set"
      - "attorney current_weighted_load += assigned_weight; may flip attorney -> AT_CAPACITY"

  - method: GET
    path: "/assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments; filter by case_id/attorney_id/status (reverse-reachability for both FKs)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["case_id?", "attorney_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  # ---- CourtEvent ----
  - method: POST
    path: "/court-events"
    description: "Calendar a court event for an assigned case"
    roles: [AssignmentCoordinator]
    code: 201
    input: [case_id, courtroom_id, event_type, scheduled_start, scheduled_end]
    output: CourtEvent
    side_effects: ["attorney_id copied from case's assigned_attorney_id; overlap/buffer/past checks enforced"]

