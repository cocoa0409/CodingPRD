              payload: {}
              as: PlatformAdmin
              captures: { life_before_void: $.data.lifetime_billed_cents }
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: PlatformAdmin
            - call: "GET /shows/${show_id}"
              payload: {}
