  # =========================================================================
  # RULE 8 — resource_temporal_overlap with DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_booking_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.Meeting.fields.starts_at
        distinguishing_aspect: |
          Interval semantics = half-open [starts_at, ends_at) on resource Room. Two meetings that
          merely touch (first ends 19:00, second starts 19:00) do NOT overlap and both succeed;
          a genuinely overlapping meeting is rejected with ERR_ROOM_CONFLICT. This is adjacency-tolerant
          half-open interval arithmetic.
        test_recipe:
          setup:
            - "A Room and one SCHEDULED meeting 18:00-19:00 in it"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Ironwood 4-H", county_code: "IW" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol M", email: "vm@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/rooms"
              payload: { name: "Hall A", capacity: 50 }
              as: ProgramAdmin
              captures: { room_id: $.data.id }
            - call: "POST /api/meetings"
              payload: { club_id: "${club_id}", starts_at: "2026-06-01T18:00:00Z", ends_at: "2026-06-01T19:00:00Z", room_id: "${room_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /api/meetings"
              payload: { club_id: "${club_id}", starts_at: "2026-06-01T19:00:00Z", ends_at: "2026-06-01T20:00:00Z", room_id: "${room_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { adjacent_ok: $.data.id }
            - call: "POST /api/meetings"
              payload: { club_id: "${club_id}", starts_at: "2026-06-01T18:30:00Z", ends_at: "2026-06-01T19:30:00Z", room_id: "${room_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent meeting (19:00-20:00) created successfully  # half-open: touching is allowed"
            - "overlapping meeting (18:30-19:30) error_id == ERR_ROOM_CONFLICT"

      - name: pen_capacity_aggregate_count
        grounds:
          - validations[priority=9]
          - entities.Pen.fields.animal_capacity
        distinguishing_aspect: |
          Interval semantics = aggregate-count capacity on resource Pen, NOT interval arithmetic.
          A pen with animal_capacity == 2 accepts two ASSIGNED stall assignments and rejects the
          third with ERR_PEN_CAPACITY_EXCEEDED regardless of any time interval. This differs from
          the room rule in both resource entity and geometric treatment (count vs half-open interval).
        test_recipe:
          setup:
            - "A Pen with animal_capacity == 2 and two ENTERED fair entries already ASSIGNED to it (stall assignment does not require confirmation)"
            - "A third ENTERED fair entry awaiting assignment"
          setup_api_calls:
