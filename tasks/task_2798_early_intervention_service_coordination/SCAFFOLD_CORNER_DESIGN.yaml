            - call: "GET /ei/service-coordinators/${coord_2}/caseload-summary"
              as: ProgramAdmin
          assert:
            - "Trigger 1: HTTP 200 with response.data.coordinator_id == \"${coord_3}\" — projected ratios are 1.50/6.00 == 0.2500 for coord_1 and coord_2 against 1.50/12.00 == 0.1250 for coord_3, and coord_4 is filtered out on county"
            - "Trigger 2: HTTP 200 with response.data.coordinator_id == \"${coord_1}\" — coord_1, coord_2 and coord_3 all project to exactly 0.2500 (1.50/6.00, 1.50/6.00, 3.00/12.00) and the oldest created_at wins"
            - "Trigger 3: HTTP 200 with response.data.coordinator_id == \"${coord_2}\" — coord_1 now projects to 3.00/6.00 == 0.5000 while coord_2 and coord_3 tie at 0.2500, and coord_2 is the older of the two"
            - "Trigger 4: HTTP 200 with response.data.coordinator_id == \"${coord_2}\" and case_weight_points == 2.00 — only coord_2 lists ES, so it is selected at a projected 3.50/6.00 == 0.5833 even though coord_3 would project to 5.00/12.00 == 0.4167"
            - "Trigger 5: HTTP 200 with active_case_count == 2, weighted_caseload_points == 3.50, utilization_ratio == 0.5833, caseload_posture == \"OPEN\" and headroom_points == 2.50"
            - "coord_4 holds no cases: it has the lowest projected utilization at every step and loses only on county_code"

      - name: cascading_side_effects_layer_provider_suspension_reaches_the_service_line
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: provider_suspension_cascade_to_service_at_risk
          rationale: >-
            §1.8 already drives the full three-hop cascade from a provider suspension through every
            ACTIVE authorization to the affected IfspService.delivery_risk_status and the referral's
            service_gap_flag, and asserts that untouched lines on the same plan are unchanged. A
            §1.9 restatement of the layer would repeat the same trigger and the same assertions.
      - name: dual_variant_calculation_layer_timeline_gross_and_net_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: timeline_gross_vs_net_divergence
          rationale: >-
            §1.8 already asserts both variants of the statutory-timeline calculation from one
            referral — gross_elapsed_days over the raw interval versus net_elapsed_days after the
            family-unavailable exclusion — and pins the verdict flip that only the net variant
            produces. The second dual-variant pair (PROVISIONAL versus FINAL cost share) is
            likewise covered by cost_share_provisional_vs_final_fee_divergence.

  # ---------------------------------------------------------------------------
  # claim-extraction-guide.md -> "Consistency model"
  # §1.1 declares consistency_model: immediate.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: assignment_aggregates_are_visible_immediately_in_the_same_request_sequence
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Referral[INTAKE -> EVALUATION_PENDING].side_effects
          - calculations.coordinator_caseload_aggregates
          - endpoints[GET /ei/service-coordinators/{coordinatorId}/caseload-summary]
        distinguishing_aspect: |
          The aggregates the assignment recomputes on a different entity are readable on the very
          next request with nothing in between — no polling, no retry, no eventual-consistency
          window. Both the referral written by the transition and the coordinator's derived
          weighted_caseload_points, active_case_count, utilization_ratio and caseload_posture are
          already final in the assignment's own response envelope and identical when read back.
        test_recipe:
          setup:
            - "One ACTIVE coordinator in CNT_A with max_weighted_caseload_points 3.20 and no cases."
            - "One INTAKE referral for a child in CNT_A whose third birthday is far beyond the 180-day bonus."
            - "Logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 3.20 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
            - call: "GET /ei/referrals/${ref_id}"
              as: ServiceCoordinator
              as_user_id: "${coord_id}"
          assert:
            - "Trigger 1: HTTP 200 with active_case_count == 0, weighted_caseload_points == 0.00, utilization_ratio == 0.0000, caseload_posture == \"OPEN\" and headroom_points == 3.20"
            - "Trigger 2: HTTP 200 with status == \"EVALUATION_PENDING\", coordinator_id == \"${coord_id}\", assignment_date == \"2026-03-02\" and case_weight_points == 1.50 — all in the transition's own response"
            - "Trigger 3: HTTP 200 with active_case_count == 1, weighted_caseload_points == 1.50, utilization_ratio == 0.4688, caseload_posture == \"OPEN\" and headroom_points == 1.70, with no call between it and trigger 2"
            - "Trigger 4: the referral read back reports the same status, coordinator_id, assignment_date, case_weight_points and version as trigger 2's response body"
