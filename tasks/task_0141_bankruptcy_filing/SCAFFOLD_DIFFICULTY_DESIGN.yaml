# =============================================================================
# task_0141_bankruptcy_filing — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Test Targeting Index (§1.8). Every grounds entry resolves into SCAFFOLD.yaml.
# All numeric literals in assert: lines were computed by running the
# §1.3 formulas in cents against the constants table.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: means_test_chapter7_vs_chapter13_variants
        grounds:
          - calculations.means_test
          - calculations.means_test.variants[chapter_7_gate]
          - calculations.means_test.variants[chapter_13_plan_floor]
          - entities.MeansTestResult.fields.presumption_of_abuse
          - entities.MeansTestResult.fields.minimum_plan_total_cents
          - validations[priority=11]
          - validations[priority=12]
        distinguishing_aspect: |
          Both variants take the same Schedule I/J inputs but consult DIFFERENT
          output fields on MeansTestResult — chapter_7_gate reads only
          presumption_of_abuse (and ignores disposable_monthly_income_cents);
          chapter_13_plan_floor reads only minimum_plan_total_cents (and
          ignores presumption_of_abuse). The two variants operate on different
          entity DOMAINS: Case lifecycle (file_case) vs Plan lifecycle
          (plan confirmation).
        test_recipe:
          setup:
            - "POST /debtors {full_name='Alice', household_size=1, state_code='TX'}"
            - "POST /cases {debtor_id=alice.id, chapter_requested='CHAPTER_7'}"
            - "POST /cases/{c}/schedules schedule_type='I', line_items=six months each amount_cents=510000 (CMI=510000)"
            - "POST /cases/{c}/schedules schedule_type='J', line_items=[{label='expenses', amount_cents=300000}]"
            - "POST /cases/{c}/schedules for each of A,B,C,D,E,F,G,H (line_items empty)"
            - "POST /cases/{c}/means-test"
          trigger:
            - "POST /cases/{c}/file (chapter_requested=CHAPTER_7 → triggers chapter_7_gate variant)"
          assert:
            - "Response error_id == 'ERR_PRESUMPTION_OF_ABUSE' (variant chapter_7_gate fired)"
            - "MeansTestResult.cmi_annualized_cents == 6120000"
            - "MeansTestResult.state_median_annual_cents == 6000000"
            - "MeansTestResult.presumption_of_abuse == true"
            - "MeansTestResult.minimum_plan_total_cents == 12600000 (= max(0,510000-300000)*60); but this field is IGNORED in chapter_7_gate variant"

      - name: claim_dischargeable_vs_nondischargeable_partition
        grounds:
          - calculations.discharge_exemption_partition
          - entities.Claim.fields.is_dischargeable
          - entities.Claim.fields.status
          - state_machines.Claim.ALLOWED_to_DISCHARGED
          - state_machines.Claim.ALLOWED_to_NON_DISCHARGEABLE_REMAINS
          - state_machines.Case.MEETING_HELD_to_DISCHARGED
        distinguishing_aspect: |
          Same input set (ALLOWED claims at moment of discharge) produces two
          disjoint output partitions on a DIFFERENT entity domain than the
          means-test rule: this lives on Claim (a creditor-facing entity),
          not on Case or Plan. The two variants are 'is_dischargeable=true →
          DISCHARGED' vs 'is_dischargeable=false → NON_DISCHARGEABLE_REMAINS',
          producing different final balances summed across claims.
        test_recipe:
          setup:
            - "Bring Case through Ch7 path: DRAFT→FILED→MEETING_SCHEDULED→MEETING_HELD"
            - "Two ALLOWED claims on the case: Claim X amount_cents=500000 is_dischargeable=true; Claim Y amount_cents=200000 is_dischargeable=false (e.g., child support)"
          trigger:
            - "POST /cases/{c}/discharge (as Judge)"
          assert:
            - "Claim X.status == 'DISCHARGED'"
            - "Claim Y.status == 'NON_DISCHARGEABLE_REMAINS'"
            - "sum(claim.amount_cents for claim in {X,Y} where status in {DISCHARGED, NON_DISCHARGEABLE_REMAINS}) == 700000 (preserved partition)"
            - "Case.automatic_stay_active == false (stay lifted on discharge)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes (>=2, different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: means_test_multistep_with_conditional_branch
        # Mode (a): formula with >=3 inputs and non-linear interaction
        grounds:
          - calculations.means_test
          - entities.Debtor.fields.state_code
          - entities.Debtor.fields.household_size
          - entities.Schedule.fields.line_items
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of >=3 inputs. Means-test formula
          combines: (i) six-month Schedule I average via division then
          round_half_up (rounding-position pinned), (ii) state+household lookup
          into STATE_MEDIAN_TABLE (conditional branch), (iii) Schedule J
          summation, (iv) conditional branch on presumption_of_abuse to choose
          required_plan_months from {36, 60}, (v) multiplication.
          Reordering rounding (e.g., dividing AFTER multiplying by 12) gives a
          different annualized value at off-by-one boundaries.
        test_recipe:
          setup:
            - "POST /debtors {household_size=1, state_code='CA'}"
            - "POST /cases {chapter_requested='CHAPTER_13'}"
            - "POST /cases/{c}/schedules schedule_type='I' with six line_items, amount_cents per month: [500000, 500000, 500000, 500000, 500000, 500005]"
            - "POST /cases/{c}/schedules schedule_type='J' line_items=[{amount_cents=350000}]"
            - "POST /cases/{c}/schedules for A,B,C,D,E,F,G,H"
          trigger:
            - "POST /cases/{c}/means-test"
          assert:
            - "MeansTestResult.current_monthly_income_cents == 500001 (= round_half_up(3000005/6) = round_half_up(500000.833) = 500001)"
            - "MeansTestResult.cmi_annualized_cents == 6000012 (= 500001 * 12, NOT round_half_up(3000005*12/6) which would give 6000010)"
            - "MeansTestResult.state_median_annual_cents == 6500000 (CA, hh=1)"
            - "MeansTestResult.presumption_of_abuse == false (6000012 < 6500000)"
            - "MeansTestResult.allowed_monthly_expenses_cents == 350000"
            - "MeansTestResult.disposable_monthly_income_cents == 150001 (= max(0, 500001-350000))"
            - "MeansTestResult.required_plan_months == 36 (presumption_of_abuse=false branch)"
            - "MeansTestResult.minimum_plan_total_cents == 5400036 (= 150001 * 36)"

      - name: trustee_payment_waterfall_round_per_share_then_sum
        # Mode (b): nested rounding where order matters; scaffold pins order
        grounds:
          - calculations.trustee_payment_waterfall
          - entities.Plan.fields.paid_to_date_cents
          - entities.Claim.fields.amount_cents
          - entities.Claim.fields.claim_class
          - state_machines.Case.IN_REPAYMENT_to_DISCHARGED
        distinguishing_aspect: |
          Mode (b) — nested rounding where 'round per pro-rata share then sum'
          vs 'sum then round' produce different cents. The scaffold pins
          'round per share' and adds the residual cent(s) to the smallest
          Claim.id. With pool=900,000 and three GENERAL_UNSECURED claims of
          (333,333,334), per-share rounding yields (299700, 299700, 300600);
          sum-then-round on the same total would yield (300000, 300000, 300000)
          — a 600-cent divergence even though both 'sum to 900000'.
        test_recipe:
          setup:
            - "Build Ch13 case through PLAN_CONFIRMED → IN_REPAYMENT"
            - "Set Plan.paid_to_date_cents = 1000000 (via APPLIED TrusteePayment rows summing to 1,000,000)"
            - "Three ALLOWED GENERAL_UNSECURED claims (sorted by Claim.id ascending) with amount_cents = [333, 333, 334]"
            - "Zero PRIORITY claims, zero SECURED claims"
          trigger:
            - "POST /cases/{c}/discharge (as Judge) — triggers final waterfall"
          assert:
            - "Admin fee deducted == 100000 (= round_half_up(1000000 * 0.10))"
            - "Per-claim recovered cents (in Claim.id ascending order) == [299700, 299700, 300600]"
            - "sum of admin_fee + recovered_cents == 1000000 (no drift left)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state machines on different entities (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_branching_chapter7_vs_chapter13_paths
        grounds:
          - state_machines.Case
          - state_machines.Case.MEETING_HELD_to_DISCHARGED
          - state_machines.Case.MEETING_HELD_to_PLAN_PROPOSED
          - entities.Case.fields.chapter_effective
        distinguishing_aspect: |
          Case state machine has a BRANCHING (fork) at MEETING_HELD: Ch7 cases
          branch to DISCHARGED directly; Ch13 cases branch through
          PLAN_PROPOSED → PLAN_CONFIRMED → IN_REPAYMENT → DISCHARGED. The two
          branches carry divergent side-effect sets (Ch13 also runs the
          trustee_payment_waterfall; Ch7 does not).
        test_recipe:
          setup:
            - "Build two cases identical except chapter_effective: Case A=CHAPTER_7, Case B=CHAPTER_13"
            - "Both reach MEETING_HELD with one ALLOWED is_dischargeable=true claim of 500,000 cents"
          trigger:
            - "POST /cases/{A}/discharge (succeeds from MEETING_HELD)"
            - "POST /cases/{B}/discharge (must fail with ERR_PLAN_NOT_COMPLETE — Ch13 branch requires a confirmed completed plan)"
          assert:
            - "Case A.status == 'DISCHARGED' (Ch7 branch taken)"
            - "Case B response.error_id == 'ERR_PLAN_NOT_COMPLETE' (Ch13 branch enforces extra preconditions)"
            - "Case A.automatic_stay_active == false; Case B.automatic_stay_active == true (still under stay)"

      - name: plan_cyclic_propose_withdraw_repropose
        grounds:
          - state_machines.Plan
          - state_machines.Plan.PROPOSED_to_WITHDRAWN
          - state_machines.Case.PLAN_PROPOSED_to_(reverts_to_MEETING_HELD)
          - state_machines.Case.MEETING_HELD_to_PLAN_PROPOSED
        distinguishing_aspect: |
          Plan state machine permits a CYCLE: when a PROPOSED plan is
          withdrawn (DELETE), Case.status reverts MEETING_HELD; debtor can
          POST a new Plan → MEETING_HELD → PLAN_PROPOSED again. This is on a
          DIFFERENT entity than the Case branching above (Plan, not Case),
          and the cycle shape itself differs (loop, not fork).
        test_recipe:
          setup:
            - "Build Ch13 case to MEETING_HELD"
            - "POST /cases/{c}/plans → Plan P1 created PROPOSED, Case=PLAN_PROPOSED"
          trigger:
            - "DELETE /cases/{c}/plans/{P1} → Plan P1=WITHDRAWN, Case reverts to MEETING_HELD"
            - "POST /cases/{c}/plans with new figures → Plan P2 PROPOSED, Case=PLAN_PROPOSED again"
          assert:
            - "After DELETE: Plan P1.status == 'WITHDRAWN', Case.status == 'MEETING_HELD'"
            - "After second POST: Plan P2.status == 'PROPOSED', Case.status == 'PLAN_PROPOSED'"
            - "Plan P1 and Plan P2 have different ids; the loop visited PLAN_PROPOSED state twice"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers (>=2, depths >=3 and >=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: ch13_discharge_three_hop_cascade
        # Depth >= 3 hops: discharge → plan waterfall → claim partition → stay lift
        grounds:
          - state_machines.Case.IN_REPAYMENT_to_DISCHARGED
          - calculations.trustee_payment_waterfall
          - calculations.discharge_exemption_partition
          - entities.Plan.fields.status
          - entities.Claim.fields.status
          - entities.Case.fields.automatic_stay_active
        distinguishing_aspect: |
          Trigger: POST /cases/{c}/discharge on a Ch13 case in IN_REPAYMENT.
          Hop 1 (caused by trigger): Plan.status = COMPLETED.
          Hop 2 (caused by hop 1, NOT by trigger): the COMPLETED Plan's
          paid_to_date_cents is fed into trustee_payment_waterfall, mutating
          each ALLOWED Claim's recovered_cents.
          Hop 3 (caused by hop 2): discharge_exemption_partition reads each
          Claim's is_dischargeable and flips Claim.status to DISCHARGED or
          NON_DISCHARGEABLE_REMAINS; this flip then bubbles back up:
          Case.automatic_stay_active flips false ONLY after all claim flips
          settle.
        test_recipe:
          setup:
            - "Ch13 case through PLAN_CONFIRMED → IN_REPAYMENT with paid_to_date_cents == planned_total_cents, missed_payment_count=0"
            - "Two ALLOWED GENERAL_UNSECURED claims: X is_dischargeable=true amount=400000, Y is_dischargeable=false amount=600000"
          trigger:
            - "POST /cases/{c}/discharge (as Judge)"
          assert:
            - "Plan.status == 'COMPLETED' (hop 1)"
            - "Claim X.status == 'DISCHARGED' (hop 3 via partition)"
            - "Claim Y.status == 'NON_DISCHARGEABLE_REMAINS' (hop 3 via partition)"
            - "Case.automatic_stay_active == false (final hop)"
            - "Each Claim.recovered_cents has been written by the waterfall (hop 2)"

      - name: case_file_two_hop_stay_then_collection_rejection
        # Depth >= 2: file → automatic_stay_active=true → CollectionAction.outcome=REJECTED_STAY
        grounds:
          - state_machines.Case.DRAFT_to_FILED
          - state_machines.CollectionAction.PROCESSED_to_REJECTED_STAY
          - entities.Case.fields.automatic_stay_active
          - entities.CollectionAction.fields.outcome
        distinguishing_aspect: |
          DIFFERENT trigger than the discharge cascade: trigger is
          POST /cases/{c}/file. Hop 1 (caused by trigger): Case.status=FILED,
          automatic_stay_active flips true. Hop 2 (caused by hop 1, not by
          the trigger): any subsequently inserted CollectionAction reads the
          now-true automatic_stay_active flag and is recorded with
          outcome=REJECTED_STAY. This is a propagation across the
          cross-aggregate boundary (Case → CollectionAction).
        test_recipe:
          setup:
            - "Build Case to DRAFT with all schedules and a means-test result that does NOT trigger presumption (e.g., income below median)"
            - "POST /creditors → Creditor row"
            - "Before filing: POST /collection-actions on the DRAFT case → outcome=PROCESSED (control)"
          trigger:
            - "POST /cases/{c}/file"
            - "After filing: POST /collection-actions on the same case (same creditor, same action_kind)"
          assert:
            - "Case.automatic_stay_active == true after file (hop 1)"
            - "Pre-filing CollectionAction.outcome == 'PROCESSED'"
            - "Post-filing CollectionAction.outcome == 'REJECTED_STAY' (hop 2 via stay flag)"
            - "Post-filing CollectionAction.rejected_reason == 'AUTOMATIC_STAY_ACTIVE'"

  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different error-category pairs (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_at_collection_insert
        grounds:
          - validations[priority=4]   # state
          - validations[priority=5]   # business_safety (automatic_stay_violation)
        distinguishing_aspect: |
          Error categories conflicted: `state` (Case in non-DRAFT state for a
          state-changing endpoint) vs `business_safety`
          (ERR_AUTOMATIC_STAY_VIOLATION). When a Creditor POSTs a
          CollectionAction against a Case whose status is DISCHARGED (no
          stay anymore — automatic_stay_active=false), the
          business_safety check would PASS but no state validation is
          relevant either; conversely, against a FILED case the
          business_safety check fires before any state validation would
          (priority 4 < 5, BUT since CollectionAction insert has no resource
          state to mismatch, the rule pair winner is `business_safety` here).
          Priority 4 is the category that would otherwise win — the scaffold
          pins business_safety FIRST on this endpoint by explicit
          applies_to.
        test_recipe:
          setup:
            - "Build Case A to FILED state with stay active"
            - "Build Case B to DISCHARGED state (stay lifted)"
            - "POST /creditors with creditor_type='GENERAL_UNSECURED'"
          trigger:
            - "POST /collection-actions {case_id=A.id, action_kind='GARNISH'}"
            - "POST /collection-actions {case_id=B.id, action_kind='GARNISH'}"
          assert:
            - "Case A response: HTTP 409, error_id == 'ERR_AUTOMATIC_STAY_VIOLATION' (priority 5 fires)"
            - "Case B response: HTTP 201, outcome == 'PROCESSED' (no stay to invoke priority 5; priority 4 doesn't apply)"

      - name: business_temporal_vs_business_constraint_at_dismiss
        grounds:
          - validations[priority=15]  # business_constraint (dismissal_not_warranted, >=3)
          - validations[priority=4]   # state
        distinguishing_aspect: |
          Error categories conflicted: `state` (Case not in IN_REPAYMENT) vs
          `business_constraint` (missed_payment_count < 3). This is a
          DIFFERENT category pair than instance #1 (which was state vs
          business_safety). When a Ch13 case in PLAN_CONFIRMED (not yet
          IN_REPAYMENT) is dismissed with missed_payment_count=0, BOTH
          checks would 'fail' the dismissal preconditions; the priority
          ordering says state (priority 4) wins → ERR_INVALID_STATE returned,
          NOT ERR_DISMISSAL_NOT_WARRANTED.
        test_recipe:
          setup:
            - "Build Ch13 case to PLAN_CONFIRMED (one Plan, but no APPLIED payments yet, so still PLAN_CONFIRMED not IN_REPAYMENT)"
            - "Case has missed_payment_count == 0 (well below the >=3 threshold)"
          trigger:
            - "POST /cases/{c}/dismiss (as Trustee)"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (state priority 4 wins over business_constraint priority 15)"
            - "Response NOT 'ERR_DISMISSAL_NOT_WARRANTED' (business_constraint did not fire because priority 4 short-circuited first)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary precision checks on different metrics/endpoints (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: presumption_of_abuse_strict_greater_than
        grounds:
          - calculations.means_test
          - entities.MeansTestResult.fields.presumption_of_abuse
          - validations[priority=11]
        distinguishing_aspect: |
          Metric: cmi_annualized_cents vs state_median_annual_cents. Boundary
          is STRICT `>` (not `>=`). At exact equality, presumption_of_abuse
          is false and Ch7 file_case succeeds. Endpoint reached:
          POST /cases/{c}/file.
        test_recipe:
          setup:
            - "POST /debtors {household_size=1, state_code='TX'} (median=6000000 cents)"
            - "POST /cases {chapter_requested='CHAPTER_7'}"
            - "POST /cases/{c}/schedules schedule_type='I' with 6 line_items each amount_cents=500000 → CMI=500000 → annualized=6000000 exactly equal to median"
            - "POST /cases/{c}/schedules schedule_type='J' line_items=[{amount_cents=100000}]"
            - "POST /cases/{c}/schedules for A,B,C,D,E,F,G,H"
            - "POST /cases/{c}/means-test"
          trigger:
            - "POST /cases/{c}/file"
          assert:
            - "MeansTestResult.cmi_annualized_cents == 6000000"
            - "MeansTestResult.state_median_annual_cents == 6000000"
            - "MeansTestResult.presumption_of_abuse == false (6000000 > 6000000 is false)"
            - "Case.status == 'FILED' (Ch7 filing succeeded at exact boundary)"

      - name: dismissal_three_strikes_strict_greater_or_equal
        grounds:
          - validations[priority=15]
          - state_machines.Case.IN_REPAYMENT_to_DISMISSED
          - entities.Plan.fields.missed_payment_count
        distinguishing_aspect: |
          DIFFERENT metric and DIFFERENT endpoint than the means-test boundary.
          Metric: Plan.missed_payment_count. Boundary is `>=3` (inclusive).
          At exactly 2 missed payments dismissal must be REJECTED with
          ERR_DISMISSAL_NOT_WARRANTED; at 3 it must succeed. Endpoint
          reached: POST /cases/{c}/dismiss when Case.status=IN_REPAYMENT.
        test_recipe:
          setup:
            - "Build Ch13 case to IN_REPAYMENT"
            - "Record TrusteePayment rows: sequence 1=APPLIED, sequence 2=MISSED, sequence 3=MISSED (missed_payment_count=2)"
          trigger:
            - "POST /cases/{c}/dismiss (first attempt — count is 2)"
            - "Record TrusteePayment sequence 4=MISSED (missed_payment_count=3)"
            - "POST /cases/{c}/dismiss (second attempt — count is 3)"
          assert:
            - "First attempt: error_id == 'ERR_DISMISSAL_NOT_WARRANTED' (count=2 < 3, strict)"
            - "After recording fourth missed payment: Plan.missed_payment_count == 3"
            - "Second attempt: Case.status == 'DISMISSED' (count=3 hits the >=3 boundary inclusively)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_confirm_requires_case_means_test_result
        grounds:
          - state_machines.Plan.PROPOSED_to_CONFIRMED
          - entities.Plan.fields.plan_months
          - entities.Plan.fields.planned_total_cents
          - entities.MeansTestResult.fields.required_plan_months
          - entities.MeansTestResult.fields.minimum_plan_total_cents
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair: Plan ↔ MeansTestResult (via Case.means_test_result_id).
          Plan.PROPOSED→CONFIRMED transition depends on MeansTestResult
          fields (required_plan_months, minimum_plan_total_cents) which live
          on a different entity altogether. The 'valid next state' of Plan
          is therefore a function of the most recent MeansTestResult, not
          of Plan alone.
        test_recipe:
          setup:
            - "Ch13 case to MEETING_HELD with MeansTestResult having required_plan_months=36 and minimum_plan_total_cents=6840000 (disposable=190000, presumption_of_abuse=false)"
            - "POST /cases/{c}/plans {proposed_monthly_payment_cents=180000, plan_months=36} → Plan in PROPOSED with planned_total_cents=6480000"
          trigger:
            - "POST /cases/{c}/plans/{p}/confirm (as Judge)"
          assert:
            - "Response error_id == 'ERR_PLAN_UNDERFUNDED' (Plan.planned_total_cents=6480000 < MeansTestResult.minimum_plan_total_cents=6840000)"
            - "Plan.status remains 'PROPOSED' (no transition occurred)"

      - name: collection_action_outcome_depends_on_case_stay
        grounds:
          - state_machines.CollectionAction.PROCESSED_to_REJECTED_STAY
          - entities.Case.fields.automatic_stay_active
          - entities.CollectionAction.fields.outcome
          - validations[priority=5]
        distinguishing_aspect: |
          DIFFERENT entity pair than instance #1: CollectionAction ↔ Case
          (cross-aggregate, since CollectionAction has no parent and Case is
          a top-level peer). The valid outcome of CollectionAction insert
          depends on Case.automatic_stay_active flag computed elsewhere.
          Same Creditor + same Case can produce 'PROCESSED' or
          'REJECTED_STAY' depending solely on Case.status.
        test_recipe:
          setup:
            - "POST /creditors → Creditor row"
            - "Case A in DRAFT status (automatic_stay_active=false)"
            - "Case B in FILED status (automatic_stay_active=true)"
          trigger:
            - "POST /collection-actions {creditor_id, case_id=A, action_kind='LIEN'}"
            - "POST /collection-actions {creditor_id, case_id=B, action_kind='LIEN'}"
          assert:
            - "Case A's CollectionAction.outcome == 'PROCESSED' (Case in DRAFT → stay false)"
            - "Case B response error_id == 'ERR_AUTOMATIC_STAY_VIOLATION' (Case in FILED → stay true)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_341_minimum_gap_after_filing
        grounds:
          - state_machines.Case.FILED_to_MEETING_SCHEDULED
          - validations[priority=7]
          - entities.Case.fields.filing_date
          - entities.Case.fields.meeting_341_date
        distinguishing_aspect: |
          Resource: Case.filing_date interval boundary. Interval semantics:
          INCLUSIVE-START offset — meeting_341_date must be >= filing_date
          + 21 days (closed-on-left, no buffer beyond 21). The 'overlap'
          here is the gap between two date points on the same Case timeline,
          rejected if the gap is too short.
        test_recipe:
          setup:
            - "Build Case to FILED with filing_date=T0 (recorded by server clock at file_case)"
          trigger:
            - "POST /cases/{c}/schedule-341 with meeting_date = T0 + 20 days (one day short)"
            - "POST /cases/{c}/schedule-341 with meeting_date = T0 + 21 days (exactly at boundary)"
          assert:
            - "First call: error_id == 'ERR_MEETING_TOO_EARLY'"
            - "Second call: Case.status == 'MEETING_SCHEDULED' (boundary is inclusive at exactly 21 days)"

      - name: trustee_payment_sequence_no_duplicate_per_plan
        grounds:
          - validations[priority=18]
          - entities.TrusteePayment.fields.sequence_number
          - entities.TrusteePayment.fields.plan_id
          - concurrency_rules[payment_sequence_duplicate]
        distinguishing_aspect: |
          DIFFERENT resource and DIFFERENT interval semantics than the
          meeting-gap rule. Resource: Plan's per-sequence_number ledger
          slots. Interval semantics: POINT collision on the integer index
          (sequence_number) — not a date range, but a discrete-slot
          uniqueness rule. Two TrusteePayment rows attempting the same
          (plan_id, sequence_number) collide regardless of their amount or
          timing.
        test_recipe:
          setup:
            - "Ch13 case to PLAN_CONFIRMED"
            - "POST /cases/{c}/plans/{p}/payments {sequence_number=1, amount_cents=200000, status='APPLIED'} → success (201)"
          trigger:
            - "POST /cases/{c}/plans/{p}/payments {sequence_number=1, amount_cents=200000, status='APPLIED'} (same slot)"
          assert:
            - "Response error_id == 'ERR_PAYMENT_SEQUENCE_DUPLICATE', HTTP 409"
            - "Plan.paid_to_date_cents == 200000 (second row did NOT increment the total)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across different conserved quantities (>=2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: discharge_partition_preserves_claim_amount_total
        grounds:
          - calculations.discharge_exemption_partition
          - state_machines.Claim.ALLOWED_to_DISCHARGED
          - state_machines.Claim.ALLOWED_to_NON_DISCHARGEABLE_REMAINS
          - entities.Claim.fields.amount_cents
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Conserved quantity (named): total claim amount face value =
          sum(Claim.amount_cents) for the case. The forward action (Case
          discharge) re-partitions ALLOWED claims into DISCHARGED +
          NON_DISCHARGEABLE_REMAINS; the compensating invariant is that the
          SUM of amount_cents across all post-discharge claims equals the
          sum across pre-discharge ALLOWED claims — partition only, no value
          creation or destruction.
        test_recipe:
          setup:
            - "Ch7 case to MEETING_HELD with three ALLOWED claims: amounts=[100000, 200000, 300000]; mix of is_dischargeable"
          trigger:
            - "POST /cases/{c}/discharge (as Judge)"
          assert:
            - "sum(c.amount_cents for c in claims where status=='DISCHARGED') + sum(c.amount_cents for c in claims where status=='NON_DISCHARGEABLE_REMAINS') == 600000"
            - "No claim was deleted or had its amount_cents mutated"

      - name: plan_withdraw_repropose_preserves_paid_to_date_zero
        grounds:
          - state_machines.Plan.PROPOSED_to_WITHDRAWN
          - state_machines.Case.PLAN_PROPOSED_to_(reverts_to_MEETING_HELD)
          - entities.Plan.fields.paid_to_date_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity than instance #1. Conserved quantity
          (named): total paid_to_date_cents across all Plan rows on the
          case (not amount_cents). Forward action = withdraw a PROPOSED
          Plan (no payments yet). Compensating constraint: paid_to_date_cents
          for the case (summed over all plans, including withdrawn) must
          remain 0 after withdraw + repropose. Because TrusteePayment is
          append-only and a PROPOSED Plan has none, withdraw produces no
          payment drift.
        test_recipe:
          setup:
            - "Ch13 case to PLAN_PROPOSED with Plan P1 PROPOSED (no TrusteePayment rows yet — Plan.paid_to_date_cents=0)"
          trigger:
            - "DELETE /cases/{c}/plans/{P1} (Plan→WITHDRAWN, Case reverts to MEETING_HELD)"
            - "POST /cases/{c}/plans → new Plan P2 PROPOSED"
          assert:
            - "Plan P1.paid_to_date_cents == 0 (unchanged by withdraw)"
            - "Plan P2.paid_to_date_cents == 0 (no payments yet)"
            - "sum(plan.paid_to_date_cents for plan in case.plans) == 0 (conserved across the compensating action)"
