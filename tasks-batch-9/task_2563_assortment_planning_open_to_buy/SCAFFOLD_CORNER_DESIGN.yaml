              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { vendor_bad_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2027-02-01T00:00:00Z", ship_window_end: "2027-02-15T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
