              as: NetworkPlanner
              captures: { inv_s2: "$.data.id" }
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s2}", package_type: "MEDIUM_BOX", on_hand_units: 4, reorder_point_units: 1 }
              as: NetworkPlanner
              captures: { pk_s2: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-M001", customer_ref: "C-990", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a2: "$.data[0].id" }
            - call: "GET /fulfillment-network/store-inventories/${inv_s2}"
              payload: {}
              as: NetworkPlanner
              captures: { inv_s2_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/assignments/${a2}/accept"
