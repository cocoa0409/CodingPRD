          sourcing_path: BUY_AND_BILL
          j_code_billed: J5501
          billed_units: 10
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          err_1: $.data.error_id
      - call: POST /api/claims
        payload:
