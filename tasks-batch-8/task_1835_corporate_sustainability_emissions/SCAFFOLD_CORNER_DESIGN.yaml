scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: site_creation_defaults_and_envelope
        claim_type: creation
        grounds:
          - entities.Site
          - endpoints[POST /sustainability/sites]
        distinguishing_aspect: "Creating a Site returns 201 with system defaults applied (status ACTIVE, version 1) inside the fixed success envelope (meta.api_request_id present, response_type object)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "create response status == ACTIVE and version == 1 (system-managed defaults)"
            - "response envelope carries meta.api_request_id and response_type == object"
            - "GET /sustainability/sites/${site} returns name == Alpha, country_code == US, grid_region_code == CA (retrieval matches stored data)"

      - name: engagement_creation_defaults_round_one
        claim_type: defaults
        grounds: [entities.SupplierEngagement.fields.round, state_machines.SupplierEngagement]
        distinguishing_aspect: "A new SupplierEngagement starts INVITED with round == 1 and supplier_tco2e null — system defaults the client does not supply."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st: $.data.status, rd: $.data.round, tco: $.data.supplier_tco2e } }
          assert:
            - "create response status == INVITED, round == 1, supplier_tco2e == null"

      - name: target_creation_defaults_provisional
        claim_type: defaults
        grounds: [entities.EmissionTarget.fields.baseline_source, entities.EmissionTarget.fields.trajectory_status]
        distinguishing_aspect: "A new EmissionTarget starts DRAFT with baseline_source PROVISIONAL and trajectory_status NOT_EVALUATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/targets", payload: { name: "50-by-2030", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { st: $.data.status, src: $.data.baseline_source, traj: $.data.trajectory_status } }
          assert:
            - "status == DRAFT, baseline_source == PROVISIONAL, trajectory_status == NOT_EVALUATED"

      - name: record_create_computed_tco2e_input_ignored
        claim_type: computed_fields
        grounds: [entities.ActivityRecord.fields.tco2e, entities.ActivityRecord.fields.factor_value_snapshot]
        distinguishing_aspect: "tco2e and factor_value_snapshot are computed at approval; a client-supplied tco2e at creation is ignored and the stored value stays null until APPROVED."
        test_recipe:
          setup: ["site active; SCOPE1_STATIONARY factor PUBLISHED covering 2026; cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", tco2e: 999 }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id, tco: $.data.tco2e } }
          assert:
            - "create succeeds (201) and stored tco2e == null — the client-supplied 999 is ignored"
            - "GET /sustainability/activity-records/${rec} still shows tco2e == null and factor_value_snapshot == null before approval"

      - name: site_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Site]
        distinguishing_aspect: "Client-supplied id/created_at/version on creation are ignored; the server mints a UUID id and version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/sites", payload: { id: "client-chosen-id", created_at: "1999-01-01T00:00:00Z", version: 42, name: "Beta", country_code: "US", grid_region_code: "TX" }, as: SustainabilityManager, captures: { sid: $.data.id, v: $.data.version } }
          assert:
            - "response id != client-chosen-id and matches UUID shape; version == 1; created_at != 1999-01-01T00:00:00Z"

      - name: cycle_transition_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An unknown to_state enum member on the cycle transition endpoint is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["cycle FY2026 in DRAFT"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "EXPLODED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and cycle remains DRAFT"

      - name: site_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sustainability/sites/00000000-0000-0000-0000-000000000000", as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: site_create_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Site.fields.name
        distinguishing_aspect: "Omitting the required input field name on site creation fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sustainability/sites", payload: { country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: record_create_with_unknown_site_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - entities.ActivityRecord.fields.site_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A body FK (site_id) that does not resolve is rejected with ERR_NOT_FOUND before any business rule runs."
        test_recipe:
          setup: ["PUBLISHED SCOPE1_STATIONARY factor covering 2026; cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "00000000-0000-0000-0000-000000000000", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (body FK resolution)"

      - name: activity_records_list_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /sustainability/activity-records]
          - response_envelope
        distinguishing_aspect: "The list endpoint honors limit/offset and reports total_count and has_more per the fixed pagination envelope."
        test_recipe:
          setup: ["site, PUBLISHED factor, cycle FY2026 in DATA_COLLECTION; three SUBMITTED records with non-overlapping monthly periods"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 2, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 3, unit: "therm", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1" }
          trigger:
            - { call: "GET /sustainability/activity-records", payload: { cycle_id: "${cyc}", limit: 2, offset: 0 }, as: SustainabilityManager, captures: { first_id: "$.data[0].id" } }
          assert:
            - "page 1 returns exactly 2 records with total_count == 3 and has_more == true"
            - "page 2 (limit 2, offset 2) returns exactly 1 record with total_count == 3 and has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cycle_lock_rejected_with_open_records
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReportingCycle.UNDER_REVIEW_to_LOCKED
          - errors[ERR_OPEN_RECORDS_REMAIN]
        distinguishing_aspect: "Locking is refused while any record of the cycle is still SUBMITTED or UNDER_REVIEW; the open-record gate fires before lock side effects."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION with one record still SUBMITTED; inventory CURRENT (recalc after open-close path)"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_RECORDS_REMAIN; cycle stays UNDER_REVIEW"

      - name: cycle_lock_rejected_with_open_engagements
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReportingCycle.UNDER_REVIEW_to_LOCKED
          - errors[ERR_OPEN_ENGAGEMENTS_REMAIN]
        distinguishing_aspect: "Locking is refused while any engagement is not yet ACCEPTED or CLOSED_NO_DATA (here: still INVITED)."
        test_recipe:
          setup: ["cycle FY2026 in UNDER_REVIEW; one engagement INVITED (no records at all, inventory CURRENT)"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_ENGAGEMENTS_REMAIN; cycle stays UNDER_REVIEW"

      - name: cycle_lock_rejected_when_inventory_stale
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReportingCycle.UNDER_REVIEW_to_LOCKED
          - errors[ERR_INVENTORY_STALE]
        distinguishing_aspect: "Locking with zero open records/engagements but a STALE inventory (approval happened, recalc skipped) fails with ERR_INVENTORY_STALE."
        test_recipe:
          setup: ["cycle FY2026; one record APPROVED (inventory auto-marked STALE); NO recalculate performed; cycle moved to UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVENTORY_STALE (InventoryResult not CURRENT); cycle stays UNDER_REVIEW"

      - name: cycle_lock_pins_max_published_library_version
        claim_type: side_effect_execution
        grounds: [state_machines.ReportingCycle.UNDER_REVIEW_to_LOCKED, entities.ReportingCycle.fields.pinned_library_version]
        distinguishing_aspect: "At LOCKED the cycle pins pinned_library_version = max library_version across PUBLISHED factors (here 2), and the InventoryResult flips to FROZEN."
        test_recipe:
          setup: ["PUBLISHED factors with library_version 1 and 2; empty cycle FY2026 recalculated CURRENT and moved to UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f1: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f1}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE3_EEIO_SPEND", region_code: "GLOBAL", unit: "USD", value_tco2e_per_unit: 0.0005, library_version: 2, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f2: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f2}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager, captures: { st: $.data.status, pin: $.data.pinned_library_version } }
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc}" }, as: SustainabilityManager, captures: { inv_status: "$.data[0].status" } }
          assert:
            - "lock response status == LOCKED and pinned_library_version == 2 (max over PUBLISHED library versions 1 and 2)"
            - "InventoryResult.status == FROZEN after lock"

      - name: attest_requires_provider_role_and_statement_then_stores_it
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReportingCycle.UNDER_ASSURANCE_to_ASSURED
          - roles[AssuranceProvider]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The ASSURED transition enforces actor AssuranceProvider (Manager gets ERR_UNAUTHORIZED) and a non-empty assurance_statement (ERR_INVALID_REQUEST); on success the statement is stored."
        test_recipe:
          setup: ["cycle FY2026 fully prepared: one APPROVED record qty 100 with VERIFIED evidence (readiness 100.0), inventory CURRENT, cycle in UNDER_ASSURANCE"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
