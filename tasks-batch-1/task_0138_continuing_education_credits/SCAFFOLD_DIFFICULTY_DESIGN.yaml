  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: renewal_cycle_overlap_closed_open_adjacency
        grounds:
          - validations[priority=9]
          - entities.RenewalCycle.fields.cycle_start
          - entities.RenewalCycle.fields.cycle_end
          - errors[ERR_CYCLE_OVERLAP]
        distinguishing_aspect: |
          RenewalCycle interval semantics are closed-open with adjacency allowed: a second cycle whose
          cycle_start (2027-06-01) lands strictly inside the first cycle's [2026-01-01, 2028-01-01)
          window is rejected with ERR_CYCLE_OVERLAP, whereas a start exactly at 2028-01-01 would be OK.
        test_recipe:
          setup:
            - "Board CA (cycle_length 24mo). Licensee L has one cycle [2026-01-01, 2028-01-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Fifteen", home_board_id: "${board_id}", license_number: "L-015" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle1_id: $.data.id }
          trigger:
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2027-06-01T00:00:00Z" }
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CYCLE_OVERLAP (2027-06-01 is inside [2026-01-01, 2028-01-01))"
            - "HTTP status == 409"

      - name: audit_cooldown_buffer_gap_on_same_licensee
        grounds:
          - validations[priority=10]
          - entities.Audit.fields.closed_at
          - entities.LicenseBoard.fields.audit_cooldown_days
          - errors[ERR_AUDIT_COOLDOWN_ACTIVE]
        distinguishing_aspect: |
          Audit interval semantics are buffer-gap (not adjacency): a new audit on the same licensee is
          rejected unless (now) >= (prior audit.closed_at + audit_cooldown_days). With closed_at
          2026-03-01 and cooldown 365 days, an attempt at 2026-06-01 (only ~92 days later) is rejected
          with ERR_AUDIT_COOLDOWN_ACTIVE — a different geometry than the RenewalCycle adjacency rule.
        test_recipe:
          setup:
            - "Board CA (cooldown 365 days). Licensee L cycle reaches PASSED audit closed at 2026-03-01."
            - "Clock advanced to 2026-06-01 (< 365 days after close); cycle is renewable again (PASSED audit left it REQUIREMENTS_MET)."
          setup_api_calls:
