              payload: { site_id: "${p2_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${sv2a}" }
              as: SettlementClerk
              as_user_id: "${p2_id}"
              captures: { sb2_id: $.data.id }
            - call: "POST /settlement-batches/${sb2_id}/submit"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p2_id}"
            - call: "POST /settlement-batches/${sb2_id}/reject"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /fuel-redemptions/${r6_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p2_id}"
              captures: { settle_after_reject: $.data.settlement_status, auth_after_reject: $.data.authorization_status }
            - call: "GET /sites/${p2_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p2_id}"
