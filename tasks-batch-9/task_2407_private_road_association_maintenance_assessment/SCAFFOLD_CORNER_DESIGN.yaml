              as_user_id: "sec-1"
            - call: "POST /associations"
              payload: { name: "Deed Book Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Deed Book Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB150-P01", frontage_feet: 240, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 4, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pa_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${pa_id}", owner_name: "A. Whitcomb", deed_book_page: "DB150-P01", deed_recorded_date: "2019-04-11" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { ma_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB150-P02", frontage_feet: 200, usage_class: "SEASONAL", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${pb_id}", owner_name: "B. Okafor", deed_book_page: "DB150-P02X", deed_recorded_date: "2020-06-02" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { mb_id: $.data.id }
          trigger:
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P09" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_neither: $.data.error_id }
            - call: "POST /members/${mb_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P02X" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_member_only: $.data.error_id }
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P01" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P01" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_repeat: $.data.error_id }
          assert:
            - "the DB150-P09 attempt returns HTTP 409 with error_id ERR_DEED_MISMATCH and MA stays PENDING_DEED_VERIFICATION with deed_verified_at null"
            - "MB's DB150-P02X attempt returns HTTP 409 with error_id ERR_DEED_MISMATCH even though it equals MB.deed_book_page, because the parcel's recorded page is DB150-P02"
            - "the DB150-P01 attempt returns HTTP 200 with standing_status GOOD_STANDING, deed_verified_at 2026-08-01T00:00:00Z, access_status UNRESTRICTED and version 2"
            - "the repeated DB150-P01 attempt returns HTTP 409 with error_id ERR_MEMBER_ALREADY_VERIFIED, so the guard at priority 16 now precedes the deed comparison at priority 30"
            - "MA still reads deed_verified_at 2026-08-01T00:00:00Z and version 2 after the rejected repeat"

      - name: restriction_dates_are_required_and_bounded_only_for_access_restriction
        claim_type: conditional_validation
        grounds:
          - validations[priority=49]
          - calculations.restriction_day_accrual
          - entities.DelinquencyAction.fields.restriction_days
        distinguishing_aspect: "The date-range rule is conditional on action_type: a NOTICE with no dates is accepted with restriction_days 0, while an ACCESS_RESTRICTION is rejected when dates are absent, inverted, or outside the charge roll's fiscal interval, and a 2026-11-01..2026-11-16 window accrues 15 half-open days."
