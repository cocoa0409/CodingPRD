          transition is blocked with ERR_PROJECTS_UNINSPECTED while any CONFIRMED
          project still has inspection_status == NOT_SCHEDULED — the edition's state
          machine depends on the aggregate state of child projects' inspection
          dimension. Distinct pair from Project→ResearchPlan.
        test_recipe:
          setup:
