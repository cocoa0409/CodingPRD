  - rule_id: non_linear_state_machine
    instances:
      - name: bottle_design_changes_requested_resubmit_cycle_relengthens_lead_time
        grounds:
          - state_machines.BottleDesign.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.BottleDesign.CHANGES_REQUESTED_to_SUBMITTED
          - calculations.design_lead_time_days
          - entities.BottleDesign.fields.revision_count
        distinguishing_aspect: |
          The design loops SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED on the same submit trigger and
          the loop is not idempotent: revision_count goes 0 -> 1 and lead_time_days is recomputed
          from 60 to 67, and risk-signoff is legal only from the second SUBMITTED visit.
        test_recipe:
          setup:
            - "Customer FOX-01 in quality_standing GOOD"
            - "BottleDesign BD-06 DRAFT with cavity_count 10, capacity_ml 500.00, nominal_weight_g 190.00, min_wall_thickness_mm 1.80, target_line_speed_bpm 500.00, no supersedes_design_id"
