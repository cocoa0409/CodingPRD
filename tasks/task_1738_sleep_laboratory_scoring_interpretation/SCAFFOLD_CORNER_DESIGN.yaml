            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1", titration_capable: true }, as: LabDirector, captures: { bed1: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-01", patient_capacity: 2 }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /staffing-assignments/${sa1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "TITRATION_PAP", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "TITRATION_PAP", scheduled_date: "2026-08-01", bed_id: "${bed1}" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 420, titration_final_pressure_cm: 10.0, leak_95th_l_min: 30.0 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 12, central_apneas: 0, mixed_apneas: 0, hypopneas: 12, reras: 0, epochs_total: 720, total_sleep_time_minutes: 240, total_recording_time_minutes: 420 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
          trigger:
            - { call: "GET /sleep-studies/${st1}/titration-recommendation", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
          assert:
            - "response.recommended_cpap_cm == 11.0 (raw 10.0 LOW band: leak 30.0 > 24.0 -> +0.5; residual_ahi 6.0 -> +0.5; 10.0 + 1.0 = 11.0)"
            - "response.raw_pressure_cm == 10.0 and response.residual_ahi == 6.0 and response.leak_95th_l_min == 30.0"
            - "recommended_cpap_cm != 10.5 (the re-banded-after-adjustment value is the forbidden evaluation order)"

