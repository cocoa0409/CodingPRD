        excluded_because:
          difficulty_instance: cross_entity_state_dependency / contract_creation_is_gated_on_the_parent_authority_status
          rationale: "The §1.8 instance tests contract creation against PENDING, ACTIVE and SUSPENDED parents in one chain."

