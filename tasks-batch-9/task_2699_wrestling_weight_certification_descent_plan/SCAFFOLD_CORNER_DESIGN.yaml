          assert:
            - "${e_occ} == 'ERR_STALE_WRESTLER_VERSION' with HTTP 412 — the payload was otherwise entirely valid, so only the version comparison can have rejected it"
            - "The rejected call created nothing: GET /descent-plans?wrestler_id=${wrestler_a} returns total_count == 1 after the successful retry, never 2"
            - "${v_fresh} == ${v_stale} + 1 — finalizing the second assessment incremented Wrestler.version exactly once (state_machines.Assessment DRAFT->VALIDATED side effect)"
            - "${alpha_stale} == 159.6 but ${alpha_fresh} == 158.0 and ${a2_min} == 146.1: the wrestler's descent baseline moved under the stale writer, which is precisely the silent-discard the rule prevents"
            - "The accepted retry returns 201 and certifies: ${plan_status} == 'CERTIFIED' with ${plan_milestones} == 5 (WEEKLY_STEP from alpha 158.0: 158.0, 155.6, 153.3, 151.0, 148.7 — total_weeks 4)"
            - "${m0_weight} == 158.0 and ${m4_weight} == 148.7 — the schedule is anchored on the NEW assessment, so had the stale write been accepted it would have projected from 159.6 and produced 6 milestones"
            - "Assessment ${assess_1}.status == 'SUPERSEDED' and Wrestler A source_assessment_id == the ${assess_2} id"

