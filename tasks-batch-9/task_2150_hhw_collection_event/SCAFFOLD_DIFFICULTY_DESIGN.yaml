# =============================================================================
# task_2150 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: resident_reserved_versus_settled_quota_divergence
        grounds:
          - calculations.appointment_quota_ledger
          - entities.Resident.fields.annual_quantity_reserved_kg
          - entities.Resident.fields.annual_quantity_settled_kg
          - state_machines.Appointment.UNLOADING_to_COMPLETED
        distinguishing_aspect: |
          This dual variant lives on the Resident/Appointment quota domain: provisional_reservation
          holds the whole operator-declared 18.5 kg while final_settlement counts only the 4.5 kg of
          weighed ACCEPTED DropoffLine mass, so at that same instant the resident row reads
          annual_quantity_reserved_kg == 18.5 and annual_quantity_settled_kg == 4.5.
        test_recipe:
          setup:
            - "Program 'Jeffco HHW Program' with budget 40000000 cents, ceiling 500000 cents, staff rate 4200 cents/h, eligible jurisdictions [CO-DEN, CO-ARV]"
            - "Site with impervious pad, 2000 L secondary containment, storm drain 15.0 m, 4 lanes, APPROVED by inspector user 'insp-site-approver'"
            - "CollectionEvent 2026-09-12T08:00Z..20:00Z, lifecycle IN_PROGRESS, containment COMPLIANT, one ACTIVE 12.00 h lane assignment (slot_capacity 48)"
            - "MaterialCategory LATEX_PAINT, ACCEPTED_WITH_LIMIT, class TOXIC, 25.0 kg/event, 60.0 kg/year, 155 cents/kg"
            - "Resident Ana Ruiz verified ELIGIBLE in CO-ARV, holding one appointment declared_total_kg 18.5 that is CHECKED_IN then UNLOADING"
            - "Three ACCEPTED dropoff lines weighing 1.5, 2.5 and 0.5 kg (4.5 kg total) recorded against that appointment"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "LATEX_PAINT", display_name: "Latex Paint", acceptance_policy: "ACCEPTED_WITH_LIMIT", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 25.0, max_kg_per_resident_per_year: 60.0, disposal_rate_cents_per_kg: 155 }
              as: ProgramAdmin
              captures: { cat_latex: $.data.id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
              captures: { la_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ana Ruiz", street_address: "12 Elm Street", claimed_jurisdiction_code: "CO-ARV" }
              as: Anonymous
              captures: { res_id: $.data.id }
            - call: "POST /hhw/residents/${res_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 18.5, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt_id: $.data.id }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
            - call: "POST /hhw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "START" }
              as: EventCoordinator
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CHECK_IN" }
              as: UnloadTech
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "START_UNLOAD" }
              as: UnloadTech
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 6.0, net_weight_kg: 1.5 }
              as: UnloadTech
              captures: { dl1: $.data.id }
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 8.0, net_weight_kg: 2.5 }
              as: UnloadTech
              captures: { dl2: $.data.id }
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 4.5, net_weight_kg: 0.5 }
              as: UnloadTech
              captures: { dl3: $.data.id }
          trigger:
            - call: "GET /hhw/residents/${res_id}"
              as: EligibilityClerk
              captures: { reserved_mid: $.data.annual_quantity_reserved_kg, settled_mid: $.data.annual_quantity_settled_kg }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "COMPLETE_UNLOAD" }
              as: UnloadTech
            - call: "GET /hhw/residents/${res_id}"
              as: EligibilityClerk
              captures: { reserved_post: $.data.annual_quantity_reserved_kg, settled_post: $.data.annual_quantity_settled_kg }
          assert:
            - "${reserved_mid} == 18.5"
            - "${settled_mid} == 4.5"
            - "${reserved_mid} != ${settled_mid} — the provisional_reservation and final_settlement variants disagree on identical data"
            - "${reserved_post} == 0.0"
            - "${settled_post} == 4.5"
            - "Appointment.${appt_id}.status == COMPLETED"
            - "Appointment.${appt_id}.settled_kg == 4.5"
            - "Appointment.${appt_id}.reserved_kg == 0.0"
            - "Resident.${res_id}.completed_visit_count == 1"

      - name: container_estimate_versus_manifest_invoice_divergence
        grounds:
          - calculations.disposal_cost_valuation
          - entities.PackedContainer.fields.estimated_disposal_cost_cents
          - entities.Manifest.fields.invoiced_disposal_cost_cents
          - entities.Manifest.fields.blended_rate_cents_per_kg
          - state_machines.Manifest.SHIPPED_to_RECEIVED
        distinguishing_aspect: |
          This dual variant lives on the PackedContainer/Manifest disposal-cost domain — a different
          entity domain from the resident quota ledger: round-per-line-then-sum yields
          estimated_disposal_cost_cents == 699 while sum-then-round with a blended rate yields
          invoiced_disposal_cost_cents == 698 for exactly the same 4.5 kg of latex paint.
        test_recipe:
          setup:
            - "Same program/site/event/category/resident/appointment as resident_reserved_versus_settled_quota_divergence, with the appointment driven all the way to COMPLETED"
            - "Three ACCEPTED lines of 1.5, 2.5 and 0.5 kg LATEX_PAINT at 155 cents/kg, all packed into one TOXIC container"
            - "The container SEALED and carried on a manifest that is SIGNED then SHIPPED"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "LATEX_PAINT", display_name: "Latex Paint", acceptance_policy: "ACCEPTED_WITH_LIMIT", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 25.0, max_kg_per_resident_per_year: 60.0, disposal_rate_cents_per_kg: 155 }
              as: ProgramAdmin
              captures: { cat_latex: $.data.id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ana Ruiz", street_address: "12 Elm Street", claimed_jurisdiction_code: "CO-ARV" }
              as: Anonymous
              captures: { res_id: $.data.id }
            - call: "POST /hhw/residents/${res_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 18.5, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt_id: $.data.id }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
            - call: "POST /hhw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "START" }
              as: EventCoordinator
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CHECK_IN" }
              as: UnloadTech
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "START_UNLOAD" }
              as: UnloadTech
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 6.0, net_weight_kg: 1.5 }
              as: UnloadTech
              captures: { dl1: $.data.id }
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 8.0, net_weight_kg: 2.5 }
              as: UnloadTech
              captures: { dl2: $.data.id }
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_latex}", declared_kg: 4.5, net_weight_kg: 0.5 }
              as: UnloadTech
              captures: { dl3: $.data.id }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "COMPLETE_UNLOAD" }
              as: UnloadTech
            - call: "POST /hhw/containers"
              payload: { event_id: "${ev_id}", container_code: "DRUM-A1", compatibility_class: "TOXIC", capacity_kg: 200.0 }
              as: PackingContractor
              captures: { cont_id: $.data.id }
            - call: "POST /hhw/containers/${cont_id}/lines"
              payload: { dropoff_line_id: "${dl1}" }
              as: PackingContractor
            - call: "POST /hhw/containers/${cont_id}/lines"
              payload: { dropoff_line_id: "${dl2}" }
              as: PackingContractor
            - call: "POST /hhw/containers/${cont_id}/lines"
              payload: { dropoff_line_id: "${dl3}" }
              as: PackingContractor
              captures: { cont_estimate: $.data.estimated_disposal_cost_cents }
            - call: "POST /hhw/containers/${cont_id}/transitions"
              payload: { action: "SEAL" }
              as: PackingContractor
            - call: "GET /hhw/events/${ev_id}"
              as: PackingContractor
              captures: { ev_v: $.data.version }
            - call: "POST /hhw/manifests"
              payload: { event_id: "${ev_id}", manifest_tracking_number: "MAN-0001", tsdf_epa_id: "COD991300484", container_ids: ["${cont_id}"], expected_event_version: "${ev_v}" }
              as: PackingContractor
              captures: { man_id: $.data.id }
            - call: "POST /hhw/manifests/${man_id}/transitions"
              payload: { action: "SIGN" }
              as: ProgramAdmin
            - call: "POST /hhw/manifests/${man_id}/transitions"
              payload: { action: "SHIP" }
              as: PackingContractor
          trigger:
            - call: "POST /hhw/manifests/${man_id}/transitions"
              payload: { action: "RECEIVE", invoice_reference: "INV-77" }
              as: ProgramAdmin
              captures: { invoiced: $.data.invoiced_disposal_cost_cents, blended: $.data.blended_rate_cents_per_kg, man_net: $.data.net_weight_kg }
          assert:
            - "${cont_estimate} == 699"
            - "PackedContainer.${cont_id}.estimated_disposal_cost_cents == 699"
            - "PackedContainer.${cont_id}.net_weight_kg == 4.5"
            - "${blended} == 155.0"
            - "${man_net} == 4.5"
            - "${invoiced} == 698"
            - "${cont_estimate} - ${invoiced} == 1 — the two rounding orders differ by exactly one cent"
            - "Program.${prog_id}.budget_spent_cents == 698"
            - "Program.${prog_id}.budget_encumbered_cents == 0"
            - "Program.${prog_id}.budget_in_transit_cents == 0"
            - "PackedContainer.${cont_id}.status == DISPOSED"
            - "CollectionEvent.${ev_id}.tonnage_reported_kg == 4.5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: slot_capacity_three_leg_minimum_mode_a
        grounds:
          - calculations.event_slot_capacity
          - entities.CollectionEvent.fields.slot_capacity
          - entities.CollectionEvent.fields.containment_status
          - state_machines.CollectionEvent.containment_status.COMPLIANT_to_DEFICIENT
          - state_machines.CollectionEvent.containment_status.DEFICIENT_to_REMEDIATED
        distinguishing_aspect: |
          Mode (a): slot_capacity is the minimum of three independently derived legs
          (lane_throughput 144, staffing_capacity 48, containment_capacity 50) where the third leg
          additionally branches on CollectionEvent.containment_status, so the same lanes and hours
          yield 48 while COMPLIANT, 0 while DEFICIENT and 25 while REMEDIATED.
        test_recipe:
          setup:
            - "Program with staff rate 4200 cents/h and ceiling 500000 cents"
            - "Site with 2000 L secondary containment and 4 lanes, APPROVED"
            - "CollectionEvent 2026-09-12T08:00Z..20:00Z (12.00 h) in SITE_CONFIRMED, one ACTIVE 12.00 h lane assignment on lane 1 by a staffer whose HAZWOPER expires 2027-06-30"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
          trigger:
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cap_compliant: $.data.slot_capacity, hours_compliant: $.data.certified_staff_hours }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "FAIL", finding_code: "BERM-CRACK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cap_deficient: $.data.slot_capacity }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "BERM-PATCHED", remediation_note: "Berm re-sealed and pressure tested" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cap_remediated: $.data.slot_capacity, status_remediated: $.data.containment_status }
          assert:
            - "${hours_compliant} == 12.0"
            - "${cap_compliant} == 48 — min(lane_throughput 144, staffing_capacity 48, containment_capacity 50)"
            - "${cap_deficient} == 0 — the containment leg collapses to 0 while DEFICIENT"
            - "${status_remediated} == REMEDIATED"
            - "${cap_remediated} == 25 — min(144, 48, floor(50 * 0.5))"
            - "CollectionEvent.${ev_id}.staffing_cost_cents == 50400"
            - "CollectionEvent.${ev_id}.lifecycle_status == SITE_CONFIRMED after all three inspections"

      - name: disposal_blended_rate_rounding_order_mode_b
        grounds:
          - calculations.disposal_cost_valuation
          - entities.Manifest.fields.blended_rate_cents_per_kg
          - entities.PackedContainer.fields.estimated_disposal_cost_cents
          - state_machines.Manifest.SHIPPED_to_RECEIVED
        distinguishing_aspect: |
          Mode (b): with two containers of different compatibility classes and rates
          (155 cents/kg TOXIC and 480 cents/kg CORROSIVE_ACID), round-per-line-then-sum gives a
          manifest estimate of 819 cents while sum-then-round through one blended rate of
          172.1053 cents/kg gives an invoice of 818 cents — the pinned rounding ORDER, not the
          inputs, is what separates the two figures.
        test_recipe:
          setup:
            - "Program, APPROVED site, event driven to IN_PROGRESS with a 12.00 h lane assignment"
            - "Two categories: LATEX_PAINT (TOXIC, 155 cents/kg) and POOL_ACID (CORROSIVE_ACID, 480 cents/kg)"
            - "One resident's appointment COMPLETED with four ACCEPTED lines: 1.5, 2.5, 0.5 kg latex and 0.25 kg pool acid"
            - "Two containers, DRUM-A1 (TOXIC) holding the three latex lines and DRUM-B1 (CORROSIVE_ACID) holding the acid line, both SEALED and both carried on one SHIPPED manifest"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "LATEX_PAINT", display_name: "Latex Paint", acceptance_policy: "ACCEPTED_WITH_LIMIT", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 25.0, max_kg_per_resident_per_year: 60.0, disposal_rate_cents_per_kg: 155 }
              as: ProgramAdmin
              captures: { cat_latex: $.data.id }
