            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2027-01-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", host_share_base_bps: 2600 }, as: PlatformOps, captures: { ag2: $.data.id } }
