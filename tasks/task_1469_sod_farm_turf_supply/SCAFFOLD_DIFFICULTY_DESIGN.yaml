              as: FleetManager
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T10:00:00Z", reason: "maint-4" }
              as: FleetManager
            - call: "POST /_clock/set_current_utc"
