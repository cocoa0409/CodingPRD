        claim_type: Aggregate validation
        grounds: ["validations[priority=13]", "errors[ERR_INSUFFICIENT_STOCK]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / reserve_exact_available_succeeds_one_more_fails
          rationale: "The ERR_INSUFFICIENT_STOCK availability boundary is exercised by the named §1.8 instance."

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: restock_increases_on_hand_and_version
        claim_type: Action endpoint
        grounds: ["endpoints", "entities.Sku.fields.on_hand"]
        distinguishing_aspect: "POST /shop/skus/{id}/restock units=5 raises on_hand from 2 to 7 and increments Sku.version from 1 to 2."
        test_recipe:
          setup: ["A Sku on_hand 2, version 1."]
          setup_api_calls:
            - call: "POST /shop/skus"
              payload: { name: "Restock Sku", category: "PART", list_price_cents: 1000, on_hand: 2 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /shop/skus/${sku_id}/restock"
              payload: { units: 5 }
              as: ShopManager
              captures: { oh: $.data.on_hand, v: $.data.version }
          assert:
            - "Sku.${sku_id}.on_hand == 7"
            - "Sku.${sku_id}.version == 2"

      - name: reservations_subresource_lists_active_reservation
        claim_type: Computed read
        grounds: ["endpoints", "entities.Reservation.fields.sku_id"]
        distinguishing_aspect: "GET /shop/skus/{id}/reservations returns the ACTIVE Reservation created by a reserve as an array of length 1 (total_count 1)."
        test_recipe:
          setup: ["A reserved order for qty 1 of a Sku."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Res List", email: "rl@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Listed Sku", category: "PART", list_price_cents: 2000, on_hand: 4 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
          trigger:
            - call: "GET /shop/skus/${sku_id}/reservations?status=ACTIVE"
              payload: {}
              as: SalesAssociate
          assert:
            - "response.response_type == array"
            - "response.total_count == 1"

  # =========================================================================
  # Errors (residual triggerability — most covered above / in §1.8)
  # =========================================================================
  - section: errors
    instances:
      - name: stale_sku_version_on_reserve
        claim_type: violation_to_error
        grounds: ["concurrency_rules[order-reserve-stale-sku]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reserving with expected_sku_version one behind the current Sku.version (after a prior reserve bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A Sku on_hand 10; order A reserved (bumps Sku.version); order B carrying the pre-reserve version."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Stale Ver", email: "sv@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Contended Sku", category: "PART", list_price_cents: 3000, on_hand: 10 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v0: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ordA_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ordA_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ordA_id}/reserve"
              payload: { expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ordB_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ordB_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ordB_id}/reserve"
              payload: { expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: stale_sku_version_on_layaway_open
        claim_type: violation_to_error
        grounds: ["concurrency_rules[layaway-open-stale-sku]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Opening a layaway with expected_sku_version one behind the current Sku.version (after a prior reserve) returns ERR_STALE_VERSION (412) — second OCC-guarded write endpoint, distinct from reserve."
        test_recipe:
          setup: ["A Sku on_hand 5; an order A reserved (bumps Sku.version); a layaway-open carrying the pre-reserve version."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Lay Stale", email: "ls@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Lay Contended", category: "BIKE", list_price_cents: 40000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v0: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ordA_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ordA_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ordA_id}/reserve"
              payload: { expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/layaway-plans"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1, expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: sales_associate_cannot_create_sku
        claim_type: forbidden_operation
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /shop/skus is a ShopManager-exclusive operation; a SalesAssociate calling it gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/skus"
              payload: { name: "Sneaky Sku", category: "PART", list_price_cents: 1000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_approve_other_customers_ticket
        claim_type: forbidden_operation
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Customer approving a ticket whose customer_id != X-User-ID gets ERR_NOT_RESOURCE_OWNER (403); ownership is enforced via entity_backed identity."
        test_recipe:
          setup: ["Two customers; a quoted (AWAITING_APPROVAL) ticket owned by customer 1."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Owner One", email: "o1@x.com" }
              as: ShopManager
              captures: { owner_id: $.data.id }
            - call: "POST /shop/customers"
              payload: { full_name: "Intruder Two", email: "o2@x.com" }
              as: ShopManager
              captures: { intruder_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${owner_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-tickets/${ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${intruder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_unauthenticated
        claim_type: forbidden_operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shop/skus"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: shop_manager_override_can_create_sales_order
        claim_type: shared_operation
        grounds: ["roles"]
        distinguishing_aspect: "ShopManager is a hierarchical override and may perform the SalesAssociate-shared POST /shop/sales-orders, returning 201."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Mgr Sale", email: "ms@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: ShopManager
              captures: { ord_id: $.data.id }
          assert:
            - "response.status == 201"
            - "SalesOrder.${ord_id}.fulfillment_status == PENDING"
            - "SalesOrder.${ord_id}.payment_status == UNPAID"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_reserve_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-reserve-stale-sku]", "entities.Sku.fields.reserved"]
        distinguishing_aspect: "Reserving with the correct expected_sku_version succeeds and bumps Sku.version from 1 to 2 (the positive OCC path)."
        test_recipe:
          setup: ["A Sku on_hand 5 version 1; a PENDING order with one line."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "OCC OK", email: "occ@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "OCC Sku", category: "PART", list_price_cents: 3000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
          assert:
            - "Sku.${sku_id}.version == 2"
            - "Sku.${sku_id}.reserved == 1"

      - name: derived_reserved_field_reconciled_after_release
        claim_type: derived_field_reconciliation
        grounds: ["calculations.sku_available_units", "entities.Sku.fields.reserved"]
        distinguishing_aspect: "Sku.reserved is reconciled from ACTIVE reservations: after reserve (reserved=2) then layaway cancel/order cancel release, reserved returns to 0."
        test_recipe:
          setup: ["A Sku on_hand 8; an order reserved for qty 2."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Recon Ciled", email: "rec2@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Recon Sku", category: "PART", list_price_cents: 2000, on_hand: 8 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
          trigger:
            - call: "GET /shop/skus/${sku_id}"
              payload: {}
              as: ShopManager
              captures: { reserved: $.data.reserved }
          assert:
            - "Sku.${sku_id}.reserved == 2"

      - name: cascade_deliver_endtoend
        claim_type: cascading_side_effects
        grounds: ["state_machines.SalesOrder.fulfillment_RESERVED_to_DELIVERED"]
        excluded_because:
          difficulty_instance: transitive_cascade / deliver_commits_reservation_decrements_sku
          rationale: "The deliver -> reservation commit -> Sku ledger cascade is exercised end-to-end by the named §1.8 instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: deliver_response_shows_updated_totals_immediately
        claim_type: immediate
        grounds: ["calculations.order_total", "entities.SalesOrder.fields.total_due_cents"]
        distinguishing_aspect: "Under the immediate consistency model, the deliver response itself shows fulfillment_status=DELIVERED and the final total_due_cents without any re-read."
        test_recipe:
          setup: ["A reserved, fully-paid order, no store credit, subtotal 5000."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Imm Ediate", email: "imm@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Imm Sku", category: "ACCESSORY", list_price_cents: 5000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 5000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
              captures: { fs: $.data.fulfillment_status, due: $.data.total_due_cents }
          assert:
            - "SalesOrder.${ord_id}.fulfillment_status == DELIVERED"
            - "SalesOrder.${ord_id}.total_due_cents == 5000"
            - "SalesOrder.${ord_id}.store_credit_applied_cents == 0"
