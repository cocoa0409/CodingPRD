              as_user_id: "${g1}"
              captures: { loadB: $.data.id }
            - call: "POST /buying-points/loads/${loadB}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { lb_v: $.data.version }
            - call: "POST /buying-points/loads/${loadB}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${lb_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsB: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsB}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadB}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-B1" }
              as: LabTechnician
