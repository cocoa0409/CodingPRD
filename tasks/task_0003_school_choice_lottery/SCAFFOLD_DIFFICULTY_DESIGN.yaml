scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lottery_weight_provisional_vs_final_diverge_on_sibling_status
        grounds:
          - calculations.lottery_weight_total
          - calculations.lottery_weight_total.variants.provisional
          - calculations.lottery_weight_total.variants.final
          - state_machines.Application.SUBMITTED_to_ACCEPTED
          - entities.Application.fields.lottery_weight
        distinguishing_aspect: |
          Both variants compute lottery_weight for the SAME Application with the SAME input data; provisional includes a sibling whose status is ACCEPTED (boost 0.500 fires) while final requires the sibling to be ENROLLED (no boost fires). Same Application -> provisional=2.000, final=1.500. Subject domain: Application.
        test_recipe:
          setup:
            - "Two applications under one family. The 'sibling' application is ACCEPTED (offered but not yet accepted into ENROLLED). The 'new' application is SUBMITTED to the same school in the SAME window. Provisional reads ACCEPTED sibling boost; final (lottery run) requires ENROLLED only."
            - "District D01 (poverty 0%, no boundary boost, family poverty_flag=false). School S01 total_seats=1 (so the new app will be evaluated alone in seat assignment context). Two students under one family."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D01", name: "Central", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { d01_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d01_id}", code: "S01", name: "Hill School", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
              captures: { s01_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d01_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "f1@x.com", residence_zone_code: "Z99", residence_district_id: "${d01_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam1_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam1_id}", full_name: "Sibling Student", grade_for_cycle: 3 }
              as: Guardian
              as_user_id: "${fam1_id}"
              captures: { sib_stu_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam1_id}", full_name: "Applying Student", grade_for_cycle: 1 }
              as: Guardian
              as_user_id: "${fam1_id}"
              captures: { new_stu_id: $.data.id }
            - call: "POST /lottery/sibling-bonds"
              payload: { student_id: "${new_stu_id}", sibling_student_id: "${sib_stu_id}", school_id: "${s01_id}" }
              as: Guardian
              as_user_id: "${fam1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w1_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${w1_id}", student_id: "${sib_stu_id}", school_id: "${s01_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam1_id}"
              captures: { sib_app_id: $.data.id }
            - call: "POST /lottery/applications/${sib_app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam1_id}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w1_id}", student_id: "${new_stu_id}", school_id: "${s01_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam1_id}"
              captures: { new_app_id: $.data.id }
            - call: "POST /lottery/applications/${new_app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam1_id}"
          trigger:
            - call: "GET /lottery/applications/${new_app_id}/weight-preview"
              payload: {}
              as: Guardian
              as_user_id: "${fam1_id}"
          assert:
            - "Application.${new_app_id}.status == SUBMITTED"
            - "GET weight-preview returns lottery_weight == 1.500 and variant == 'provisional' (sibling's app status SUBMITTED counts under provisional → 1.000 base + 0.500 sibling + 0 boundary + 0 poverty + 0 flag = 1.500)"
            - "If lottery were to run NOW at this instant on this window, final lottery_weight on new_app_id would be 1.000 (sibling not ENROLLED → no boost). Same inputs, different result: 1.500 (provisional) vs 1.000 (final)."

      - name: family_risk_provisional_vs_final_diverge_on_declined_count
        grounds:
          - calculations.family_risk_score
          - calculations.family_risk_score.variants.provisional
          - calculations.family_risk_score.variants.final
          - entities.Family
        distinguishing_aspect: |
          Family with 2 DECLINED applications (0 WAITLISTED, 0 ENROLLED): provisional=0.000 (excludes DECLINED), final=0.700 (round(0.35*2,3)). Same Family, same inputs, different result; subject domain Family (different from lottery_weight_total's Application domain).
        test_recipe:
          setup:
            - "One family with two ENROLLED→DECLINED applications across one finalized window. Family.risk_preview returns provisional=0.000; risk-final returns 0.700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D02", name: "East", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { d02_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d02_id}", code: "S02A", name: "East A", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 1 }
              as: DistrictAdmin
              captures: { sA_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d02_id}", code: "S02B", name: "East B", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 1 }
              as: DistrictAdmin
              captures: { sB_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d02_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "f2@x.com", residence_zone_code: "ZZZ", residence_district_id: "${d02_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam2_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam2_id}", full_name: "Stu A", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { stuA_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam2_id}", full_name: "Stu B", grade_for_cycle: 6 }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { stuB_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w2_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${w2_id}", student_id: "${stuA_id}", school_id: "${sA_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { appA_id: $.data.id }
            - call: "POST /lottery/applications/${appA_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w2_id}", student_id: "${stuB_id}", school_id: "${sB_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { appB_id: $.data.id }
            - call: "POST /lottery/applications/${appB_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w2_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${w2_id}"
              payload: {}
              as: DistrictAdmin
              captures: { w2_v_pre: $.data.version }
            - call: "POST /lottery/windows/${w2_id}/run-lottery"
              payload: { expected_window_version: "${w2_v_pre}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
            - call: "GET /lottery/offers"
              payload: { application_id: "${appA_id}" }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { offA_id: $.data.0.id }
            - call: "GET /lottery/offers"
              payload: { application_id: "${appB_id}" }
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { offB_id: $.data.0.id }
            - call: "POST /lottery/offers/${offA_id}/decline"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
            - call: "POST /lottery/offers/${offB_id}/decline"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
          trigger:
            - call: "GET /lottery/families/${fam2_id}/risk-preview"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { risk_prev: $.data.risk_score }
            - call: "GET /lottery/families/${fam2_id}/risk-final"
              payload: {}
              as: Guardian
              as_user_id: "${fam2_id}"
              captures: { risk_fin: $.data.risk_score }
          assert:
            - "GET risk-preview returns risk_score == 0.000 (provisional excludes DECLINED apps)"
            - "GET risk-final returns risk_score == 0.700 (final counts 2 DECLINED * 0.35 = 0.700)"

  # =============================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lottery_weight_round_per_term_then_sum_mode_b
        grounds:
          - calculations.lottery_weight_total
          - calculations.lottery_weight_total.precision
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. lottery_weight_total pins: round poverty_boost to 3 decimals BEFORE summing, then NO further rounding on the final sum. With poverty_index_pct=37.50: round(37.50/100*0.400, 3) = round(0.150, 3) = 0.150 — but with poverty_index_pct=33.33: round(33.33/100*0.400, 3) = round(0.13332, 3) = 0.133. Final sum is 0.133, NOT the alternative round(1.000 + 0.133320, 3) = 1.133. Same digit either way HERE but the discipline of which rounding fires first must be pinned.
        test_recipe:
          setup:
            - "District D03 with poverty_index_pct=33.33. Single family, single school, single SUBMITTED application. The poverty_boost intermediate=0.133320; pinned rule says round THIS term to 3 decimals first (=0.133), then sum into base. Lottery runs; persisted lottery_weight=1.133."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D03", name: "Poverty33", poverty_index_pct: 33.33 }
              as: DistrictAdmin
              captures: { d03_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d03_id}", code: "S03", name: "Combo", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 5 }
              as: DistrictAdmin
              captures: { s03_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d03_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w3_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "f3@x.com", residence_zone_code: "Z3", residence_district_id: "${d03_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam3_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam3_id}", full_name: "Stu 3", grade_for_cycle: 7 }
              as: Guardian
              as_user_id: "${fam3_id}"
              captures: { stu3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w3_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${w3_id}", student_id: "${stu3_id}", school_id: "${s03_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam3_id}"
              captures: { app3_id: $.data.id }
            - call: "POST /lottery/applications/${app3_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam3_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w3_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${w3_id}"
              payload: {}
              as: DistrictAdmin
              captures: { w3_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${w3_id}/run-lottery"
              payload: { expected_window_version: "${w3_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications/${app3_id}"
              payload: {}
              as: DistrictAdmin
              captures: { final_weight: $.data.lottery_weight }
          assert:
            - "Application.${app3_id}.lottery_weight == 1.133 (1.000 base + 0.000 sibling + 0.000 boundary + round(33.33/100*0.400,3)=0.133 + 0.000 flag)"
            - "Application.${app3_id}.status == ACCEPTED"

      - name: lottery_seat_assignment_circular_eval_order_mode_c
        grounds:
          - calculations.lottery_seat_assignment
          - calculations.lottery_seat_assignment.formula
          - state_machines.Application.SUBMITTED_to_ACCEPTED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency where evaluation order is pinned. Seat assignment depends on IDT cap which depends on count of ACCEPTED-IDT applications which depends on seat assignment itself. The scaffold pins top-down traversal: admit until capacity, skip IDT exceeding cap to waitlist, in-district next-ranked replaces. School total_seats=2 (IDT cap = floor(0.10*2) = 0). With 3 SUBMITTED apps (1 in-district top rank, 1 IDT mid rank, 1 in-district bottom rank): the IDT app would be in top-2 by rank but is forced to waitlist because IDT cap is 0; the bottom in-district app takes the seat. Final: 2 ACCEPTED (both in-district), 1 WAITLISTED (the IDT app).
        test_recipe:
          setup:
            - "Two districts D04 (residence for in-district fams) and D04X (school's district). Wait — invert: school S04 in D04X with total_seats=2 and IDT cap floor(0.10*2)=0. Three students: two in-district (poverty 0 vs poverty 100 to control rank), one IDT student in D05. Lottery runs; the IDT app is forced to WAITLISTED even though its weight would otherwise put it in seat 1 or 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D04X", name: "School Host", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { d04x_id: $.data.id }
            - call: "POST /lottery/districts"
              payload: { code: "D05", name: "Other District", poverty_index_pct: 100.00 }
              as: DistrictAdmin
              captures: { d05_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d04x_id}", code: "S04", name: "Two-seat", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 2 }
              as: DistrictAdmin
              captures: { s04_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d04x_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w4_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "in1@x.com", residence_zone_code: "Z4", residence_district_id: "${d04x_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_in1_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "in2@x.com", residence_zone_code: "Z4", residence_district_id: "${d04x_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_in2_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "idt@x.com", residence_zone_code: "Z5", residence_district_id: "${d05_id}", poverty_flag: true }
              as: Anonymous
              captures: { fam_idt_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_in1_id}", full_name: "In One", grade_for_cycle: 6 }
              as: Guardian
              as_user_id: "${fam_in1_id}"
              captures: { stu_in1_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_in2_id}", full_name: "In Two", grade_for_cycle: 6 }
              as: Guardian
              as_user_id: "${fam_in2_id}"
              captures: { stu_in2_id: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_idt_id}", full_name: "Idt One", grade_for_cycle: 6 }
              as: Guardian
              as_user_id: "${fam_idt_id}"
              captures: { stu_idt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w4_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${w4_id}", student_id: "${stu_idt_id}", school_id: "${s04_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_idt_id}"
              captures: { app_idt_id: $.data.id }
            - call: "POST /lottery/applications/${app_idt_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_idt_id}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w4_id}", student_id: "${stu_in1_id}", school_id: "${s04_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_in1_id}"
              captures: { app_in1_id: $.data.id }
            - call: "POST /lottery/applications/${app_in1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_in1_id}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w4_id}", student_id: "${stu_in2_id}", school_id: "${s04_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_in2_id}"
              captures: { app_in2_id: $.data.id }
            - call: "POST /lottery/applications/${app_in2_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_in2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w4_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${w4_id}"
              payload: {}
              as: DistrictAdmin
              captures: { w4_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${w4_id}/run-lottery"
              payload: { expected_window_version: "${w4_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications/${app_idt_id}"
              payload: {}
              as: DistrictAdmin
              captures: { idt_status: $.data.status }
            - call: "GET /lottery/applications/${app_in1_id}"
              payload: {}
              as: DistrictAdmin
              captures: { in1_status: $.data.status }
            - call: "GET /lottery/applications/${app_in2_id}"
              payload: {}
              as: DistrictAdmin
              captures: { in2_status: $.data.status }
          assert:
            - "Application.${app_idt_id}.status == WAITLISTED (IDT app forced off seat because IDT cap = floor(0.10*2) = 0)"
            - "Application.${app_in1_id}.status == ACCEPTED"
            - "Application.${app_in2_id}.status == ACCEPTED"
            - "Application.${app_idt_id}.inter_district_transfer == false (computed at acceptance time only; waitlisted apps not flagged)"

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branching_lottery_run_produces_two_branches
        grounds:
          - state_machines.Application.SUBMITTED_to_ACCEPTED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
          - state_machines.EnrollmentWindow.CLOSED_to_LOTTERY_RUN
        distinguishing_aspect: |
          Application SUBMITTED is a branching fork: one transition spawns ACCEPTED + Offer (one set of side effects), the other spawns WAITLISTED + WaitlistEntry (a different set of side effects). Both fire as cascades of the same LOTTERY_RUN trigger. Non-linear by branching shape on entity Application.
        test_recipe:
          setup:
            - "School S05 total_seats=1; 2 SUBMITTED apps. Lottery runs; one becomes ACCEPTED+Offer, the other WAITLISTED+WaitlistEntry. Two distinct side-effect sets from the same trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
