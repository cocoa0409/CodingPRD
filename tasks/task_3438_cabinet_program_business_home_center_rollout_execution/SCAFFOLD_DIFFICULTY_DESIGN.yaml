      - name: referential_beats_temporal_on_order_create
        grounds:
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "errors[ERR_LINE_NOT_COVERED]"
          - "errors[ERR_DELIVERY_WEEK_INVALID]"
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal: one order
          create carries a family_code absent from the ACTIVE line AND a
          requested_delivery_week whose production window already passed. Priority
