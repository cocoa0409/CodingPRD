  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_add_gated_by_trailer_posture
        grounds:
          - state_machines.Shipment.ON_DOCK_to_MANIFESTED
          - state_machines.OutboundTrailer
        distinguishing_aspect: |
          Pair Shipment -> OutboundTrailer: manifest-add is legal only while the trailer's
          posture == LOADING; the same call against a READY trailer fails with
          ERR_INVALID_STATE until the trailer is reopened.
        test_recipe:
          setup:
            - "Trailer READY (one manifested shipment, utilization 65.0); second shipment RATED and ON_DOCK"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 31, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 1000, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/shipments/${s_a}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_b}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 560 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_a}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_b}", load_position: 2, expected_trailer_version: "${tr_v1}" }, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE while trailer posture == READY (Shipment->Trailer gate)"
            - "After reopen, same payload succeeds: POST /ltl/trailers/${tr_id}/reopen then manifest-add moves Shipment.${s_b} to MANIFESTED"

      - name: leg_depart_gated_by_prior_relay_leg
        grounds:
          - state_machines.LinehaulLeg.PLANNED_to_EN_ROUTE
          - validations[priority=18]
        distinguishing_aspect: |
          Pair LinehaulLeg -> LinehaulLeg (same trailer, prior relay_sequence): leg 2 cannot
          depart while leg 1 is EN_ROUTE — its valid transition depends on a DIFFERENT leg
          entity's state, distinct from the Shipment->Trailer pair.
        test_recipe:
          setup:
            - "Two-leg relay planned for one trailer (CHI->KC->DEN); leg1 EN_ROUTE, leg2 PLANNED"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "KCY", name: "Kansas City", dock_doors: 8 }, as: TerminalAdmin, captures: { t_kc: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "DEN", name: "Denver", dock_doors: 8 }, as: TerminalAdmin, captures: { t_den: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 32, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s1}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_kc}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T10:00:00Z", planned_arrival_utc: "2026-08-02T14:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_kc}", destination_terminal_id: "${t_den}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T15:00:00Z", planned_arrival_utc: "2026-08-02T19:00:00Z", relay_sequence: 2 }, as: Dispatcher, captures: { leg2: $.data.id } }
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /ltl/linehaul-legs/${leg2}/depart", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RELAY_SEQUENCE_VIOLATION while leg1 is EN_ROUTE (leg2's transition depends on leg1's state)"
            - "LinehaulLeg.${leg2}.status remains PLANNED; LinehaulLeg.${leg2}.actual_departure_utc is null"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: relay_connect_buffer_window_semantics
        grounds:
          - validations[priority=12]
          - calculations.relay_feasibility_and_eta
        distinguishing_aspect: |
          Resource = trailer relay slot; semantics = buffered adjacency — two legs on the same
          trailer must be separated by >= MIN_CONNECT_MINUTES (45). Planning leg2 departing at
          14:44 after a 14:00 arrival (44 min gap) is rejected with
          ERR_RELAY_CONNECT_INFEASIBLE; 14:45 exactly is accepted (>= inclusive boundary).
        test_recipe:
          setup:
            - "Trailer sealed with freight; leg1 CHI->KC planned arr 2026-08-02T14:00:00Z"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "KCY", name: "Kansas City", dock_doors: 8 }, as: TerminalAdmin, captures: { t_kc: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "DEN", name: "Denver", dock_doors: 8 }, as: TerminalAdmin, captures: { t_den: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 33, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
