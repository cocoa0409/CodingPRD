              captures: { st: $.data.status }
          assert:
            - "Part.${pid}.on_hand_qty == 4 (ship took 1 of 5; REPLACE -1 and restock +1 net zero)"
            - "WarrantyClaim.${claim_id}.credit_cents == 0"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cm_allocate_totals_visible_same_response
        claim_type: immediate
        grounds: [calculations.order_rollup, entities.SalesOrder.fields.order_total_cents]
        distinguishing_aspect: "After allocate, the returned SalesOrder already reflects the recomputed order_total_cents including the hotshot fee in the same response (immediate consistency)."
        test_recipe:
          setup: ["hotshot order with one special-order line qty1 (fee 3250) and totals computed at allocate"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CM-1", description: "Special", list_price_cents: 10000, cost_cents: 4000, stockable: false, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { total: $.data.order_total_cents, fee: $.data.hotshot_fee_cents }
          assert:
            - "SalesOrder.${order_id}.hotshot_fee_cents == 3250"
            - "SalesOrder.${order_id}.order_total_cents == 10250 (merch 7000 + core 0 + hotshot 3250)"

  # ===========================================================================
  # excluded_because stubs — corners already covered by §1.8 instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: stub_line_pricing_dual_variant
        claim_type: Variant Divergence
        grounds: [calculations.line_net_pricing]
        excluded_because:
          difficulty_instance: dvc_line_pricing_retail_vs_wholesale_on_part
          rationale: "Retail-vs-wholesale unit_merch_price divergence is the asserted outcome of this §1.8 dual_variant_calc instance."
      - name: stub_warranty_credit_dual_variant
        claim_type: Variant Divergence
        grounds: [calculations.warranty_credit]
        excluded_because:
          difficulty_instance: dvc_warranty_refund_vs_replace_on_claim
          rationale: "REFUND-vs-REPLACE credit_cents divergence is the asserted outcome of this §1.8 dual_variant_calc instance."
      - name: stub_reorder_suggestion_boundary
        claim_type: Constants Applied
        grounds: [calculations.reorder_suggestion]
        excluded_because:
          difficulty_instance: bpc_reorder_point_at_or_below_boundary
          rationale: "The <= reorder-point comparator boundary is the asserted outcome of this §1.8 boundary_precision_check instance."

  - section: state_machines
    instances:
      - name: stub_reorder_partial_receipt_loop
        claim_type: cyclic
        grounds: [state_machines.ReorderRequest]
        excluded_because:
          difficulty_instance: nlsm_reorder_cyclic_partial_receipt_loop
          rationale: "The PARTIALLY_RECEIVED self-loop accumulation is the asserted outcome of this §1.8 non_linear_state_machine instance."
      - name: stub_allocate_then_cancel_release
        claim_type: Compensation
        grounds: [state_machines.SalesOrder.fulfillment_status.ALLOCATED_to_CANCELLED]
        excluded_because:
          difficulty_instance: ci_inventory_units_conserved_allocate_then_cancel
          rationale: "Reservation release / inventory conservation on cancel is the asserted outcome of this §1.8 compensating_invariant instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: stub_ship_part_reorder_cascade
        claim_type: cascading_side_effects
        grounds: [calculations.reorder_suggestion]
        excluded_because:
          difficulty_instance: tc_ship_decrements_part_autosuggests_reorder
          rationale: "The ship -> part-decrement -> reorder auto-suggest 3-hop cascade is the asserted outcome of this §1.8 transitive_cascade instance."
