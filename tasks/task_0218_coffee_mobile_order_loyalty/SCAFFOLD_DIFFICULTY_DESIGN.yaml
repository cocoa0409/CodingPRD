            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}", captures: { se: $.data.stars_earned } }
            - { call: "GET /members/${mem_id}", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { lt: $.data.lifetime_stars, tr: $.data.tier } }
