# =============================================================================
# Scaffold Difficulty Design — Test Targeting Index (§1.8)
# Cross-references the nine §0.5 Difficulty Rules to declared elements in
# SCAFFOLD.yaml §1.1–§1.7. Every literal value below was computed by executing
# the relevant calculations[] formula against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (≥ 2 instances on different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: objective_progress_provisional_vs_locked
        grounds:
          - calculations.objective_progress
          - calculations.objective_final_score
          - calculations.kr_score
          - state_machines.ReviewScore.PENDING_CALIBRATION_to_LOCKED
          - entities.Objective.fields.progress
          - entities.Objective.fields.final_score
        distinguishing_aspect: |
          The dual variant operates on the Objective entity domain. The provisional
          variant (Objective.progress) is computed live from KR scores via
          objective_progress and remains live after lock; the locked variant
          (Objective.final_score) is the calibration_score snapshot frozen at lock.
          For identical KR data and review inputs, the two values diverge.
        test_recipe:
          setup:
            - "Cycle C in OPEN; PlatformAdmin creates 1 Objective O at INDIVIDUAL level (Employee E owns it, manager M)"
            - "O has 2 KRs: KR1 NUMERIC start=0 target=100 weight=0.5; KR2 PERCENTAGE start=0.0 target=1.0 weight=0.5"
            - "Publish O (DRAFT→ACTIVE)"
            - "POST progress on KR1 with new_value=50 (KR1.score=0.5000); POST progress on KR2 with new_value=0.8 (KR2.score=0.8000)"
            - "PlatformAdmin POST /cycles/{C.id}/start-review (cycle→IN_REVIEW; ReviewScore R created at PENDING_SELF for O)"
          trigger:
            - "GET /objectives/{O.id} (read provisional progress before lock)"
            - "POST /reviews/{R.id}/self-submit {self_score: 0.7000}"
            - "POST /reviews/{R.id}/manager-submit {manager_score: 0.6000}"
            - "POST /reviews/{R.id}/calibrate {calibration_score: 0.4500}"
            - "POST /reviews/{R.id}/lock"
            - "GET /objectives/{O.id} (read after lock)"
          assert:
            - "Before lock: Objective.progress == 0.6500 AND Objective.final_score is null"
            - "After lock: Objective.progress == 0.6500 AND Objective.final_score == 0.4500"
            - "Objective.progress != Objective.final_score (0.6500 != 0.4500)"

      - name: alignment_impact_forward_vs_backward
        grounds:
          - calculations.alignment_impact_score
          - state_machines.AlignmentLink.PENDING_to_ACCEPTED
          - entities.AlignmentLink.fields.forward_impact_score
          - entities.AlignmentLink.fields.backward_impact_score
          - endpoints./objectives/{id}/impact-graph
        distinguishing_aspect: |
          The dual variant operates on the AlignmentLink entity domain (different
          domain from the Objective dual-variant above). forward_impact_score uses
          upstream.progress * ATTENUATION; backward_impact_score uses
          downstream.progress * UPSTREAM_INFLUENCE / count(accepted upstreams).
          Same link, different formula, different number.
        test_recipe:
          setup:
            - "Cycle C in OPEN; two ACTIVE Objectives A (upstream, progress=0.8000) and B (downstream, progress=0.5000)"
            - "A has 1 KR NUMERIC start=0 target=100 weight=1.0, current_value=80; B has 1 KR NUMERIC start=0 target=100 weight=1.0, current_value=50"
            - "PENDING AlignmentLink L from A to B (dependency_type=SUPPORTS), declared by upstream owner of A"
            - "B has exactly one accepted upstream after acceptance (count_accepted_upstreams(B)==1)"
          trigger:
            - "POST /alignment-links/{L.id}/accept (acting as B's owner)"
            - "GET /objectives/{B.id}/impact-graph"
          assert:
            - "AlignmentLink L.status == \"ACCEPTED\""
            - "L.forward_impact_score == 0.5600   # 0.8000 * 0.7 (ATTENUATION)"
            - "L.backward_impact_score == 0.2500   # 0.5000 * 0.5 (UPSTREAM_INFLUENCE) / 1"
            - "L.forward_impact_score != L.backward_impact_score (0.5600 != 0.2500)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (≥ 2 instances on different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: kr_score_branched_clamp_three_inputs
        grounds:
          - calculations.kr_score
          - entities.KeyResult.fields.measurement_type
          - entities.KeyResult.fields.start_value
          - entities.KeyResult.fields.target_value
          - entities.KeyResult.fields.current_value
          - entities.KeyResult.fields.milestones
        distinguishing_aspect: |
          MODE (a): formula has ≥3 inputs (start, target, current OR milestone array)
          and non-linear interaction — conditional branching on measurement_type
          (NUMERIC | PERCENTAGE | MILESTONE), nested min/max for the [0,1] CLAMP,
          plus measurement-specific input handling (PERCENTAGE uses start_value
          rather than treating zero as baseline; MILESTONE uses array cardinality).
        test_recipe:
          setup:
            - "Cycle C in OPEN; three Objectives O1, O2, O3 in DRAFT (one per measurement_type), each owned by Employee E"
            - "O1 has 1 KR NUMERIC start=0 target=100 weight=1.0, will receive current_value=150 (over target → exercises CLAMP at 1.0)"
            - "O2 has 1 KR PERCENTAGE start=0.2 target=0.8 weight=1.0, will receive current_value=0.5 (exercises non-zero start_value baseline)"
            - "O3 has 1 KR MILESTONE with milestones=[{label:'a',completed:false},{label:'b',completed:false},{label:'c',completed:false}] weight=1.0"
            - "Publish O1, O2, O3 (DRAFT→ACTIVE)"
          trigger:
            - "POST /key-results/{KR1.id}/progress {update_type:VALUE_CHANGE, new_value:150}  -- expects ERR_PROGRESS_OUT_OF_RANGE since 150 is outside [0,100]"
            - "POST /key-results/{KR1.id}/progress {update_type:VALUE_CHANGE, new_value:100}  -- exactly target, score=1.0000"
            - "POST /key-results/{KR2.id}/progress {update_type:VALUE_CHANGE, new_value:0.5}  -- score=(0.5-0.2)/(0.8-0.2)=0.5000"
            - "POST /key-results/{KR3.id}/progress {update_type:MILESTONE_TOGGLE, milestone_index:0, milestone_completed:true}"
            - "POST /key-results/{KR3.id}/progress {update_type:MILESTONE_TOGGLE, milestone_index:1, milestone_completed:true}  -- 2 of 3 completed, score=round(2/3,4)=0.6667"
          assert:
            - "First trigger returns ERR_PROGRESS_OUT_OF_RANGE (NUMERIC range gate, not score-clamp gate)"
            - "After second trigger: KR1.score == 1.0000   # (100-0)/(100-0) = 1.0, clamped"
            - "After third trigger: KR2.score == 0.5000    # (0.5-0.2)/(0.8-0.2)"
            - "After fifth trigger: KR3.score == 0.6667    # round(2/3, 4) with round_half_up"
            - "All three branches converge on the SAME [0,1] clamp via different inputs"

      - name: objective_progress_round_per_kr_then_sum
        grounds:
          - calculations.objective_progress
          - calculations.kr_score
          - entities.Objective.fields.progress
          - entities.KeyResult.fields.weight
          - entities.KeyResult.fields.score
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The pinned order is
          ROUND-PER-KR-FIRST → weighted-sum → round result. With KR1 raw score
          1/3 ≈ 0.333333 and KR2 raw score 2/7 ≈ 0.285714 at weights 0.4 / 0.6,
          per-KR-first yields 0.3333*0.4 + 0.2857*0.6 = 0.30474 → 0.3047
          (round_half_up). Sum-then-round (the WRONG order) would yield 0.3048.
          The PRD-faithful answer is 0.3047 because the scaffold pins per-KR-first.
        test_recipe:
          setup:
            - "Cycle C in OPEN; one Objective O at INDIVIDUAL level owned by Employee E"
            - "O has 2 KRs: KR1 NUMERIC start=0 target=3 weight=0.4; KR2 NUMERIC start=0 target=7 weight=0.6"
            - "Publish O (DRAFT→ACTIVE)"
          trigger:
            - "POST /key-results/{KR1.id}/progress {update_type:VALUE_CHANGE, new_value:1}   -- raw=1/3, KR1.score=round(1/3, 4)=0.3333"
            - "POST /key-results/{KR2.id}/progress {update_type:VALUE_CHANGE, new_value:2}   -- raw=2/7, KR2.score=round(2/7, 4)=0.2857"
            - "GET /objectives/{O.id}"
          assert:
            - "KR1.score == 0.3333   # round(1/3, 4) = 0.3333"
            - "KR2.score == 0.2857   # round(2/7, 4) = 0.2857"
            - "Objective.progress == 0.3047   # per-KR-first: round(0.3333*0.4 + 0.2857*0.6, 4) = round(0.30474, 4) = 0.3047"
            - "Objective.progress != 0.3048   # rejects sum-then-round; that path would yield 0.3048"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (≥ 2 instances on different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: review_score_revision_cycle
        grounds:
          - state_machines.ReviewScore.PENDING_SELF_to_PENDING_MANAGER
          - state_machines.ReviewScore.PENDING_MANAGER_to_PENDING_SELF
          - entities.ReviewScore.fields.revision_count
          - entities.ReviewScore.fields.self_score
          - entities.ReviewScore.fields.self_submitted_at
        distinguishing_aspect: |
          ReviewScore (entity #1) has a CYCLE: PENDING_SELF → PENDING_MANAGER → PENDING_SELF
          via manager-return. Each loop traversal increments revision_count and resets
          self_score / self_submitted_at to null. Linear pipeline cannot model this.
        test_recipe:
          setup:
            - "Cycle C in IN_REVIEW after start-review; Objective O in IN_REVIEW; ReviewScore R in PENDING_SELF (owner E, manager M)"
          trigger:
            - "POST /reviews/{R.id}/self-submit {self_score: 0.6000}  -- as Owner E"
            - "GET /reviews/{R.id}"
            - "POST /reviews/{R.id}/manager-return  -- as Manager M"
            - "GET /reviews/{R.id}"
            - "POST /reviews/{R.id}/self-submit {self_score: 0.7000}  -- as Owner E (resubmit after revision)"
            - "GET /reviews/{R.id}"
          assert:
            - "After self-submit #1: R.status == \"PENDING_MANAGER\" AND R.self_score == 0.6000 AND R.self_submitted_at != null AND R.revision_count == 0"
            - "After manager-return: R.status == \"PENDING_SELF\" AND R.self_score == null AND R.self_submitted_at == null AND R.revision_count == 1"
            - "After self-submit #2: R.status == \"PENDING_MANAGER\" AND R.self_score == 0.7000 AND R.revision_count == 1   # revision_count NOT incremented by self-submit"

      - name: alignment_link_branching_fork
        grounds:
          - state_machines.AlignmentLink.PENDING_to_ACCEPTED
          - state_machines.AlignmentLink.PENDING_to_REJECTED
          - entities.AlignmentLink.fields.status
          - entities.AlignmentLink.fields.accepted_at
          - entities.AlignmentLink.fields.rejection_reason
          - entities.AlignmentLink.fields.forward_impact_score
        distinguishing_aspect: |
          AlignmentLink (entity #2, different from ReviewScore) has BRANCHING state
          machine: PENDING → {ACCEPTED, REJECTED} with divergent side effects per
          branch. ACCEPT computes forward_impact_score and backward_impact_score and
          sets accepted_at; REJECT requires non-empty rejection_reason and leaves
          impact scores null.
        test_recipe:
          setup:
            - "Two ACTIVE Objectives A and B in cycle C (OPEN), with KRs giving A.progress=0.8000 and B.progress=0.5000"
            - "Two ACTIVE Objectives X and Y in same cycle, X.progress=0.6000, Y.progress=0.4000"
            - "PENDING AlignmentLink L1 A→B (will be accepted by B's owner)"
            - "PENDING AlignmentLink L2 X→Y (will be rejected by Y's owner)"
          trigger:
            - "POST /alignment-links/{L1.id}/accept   -- as B's owner"
            - "POST /alignment-links/{L2.id}/reject {rejection_reason: \"out of scope\"}   -- as Y's owner"
          assert:
            - "L1.status == \"ACCEPTED\" AND L1.accepted_at != null AND L1.forward_impact_score == 0.5600 AND L1.backward_impact_score == 0.2500 AND L1.rejection_reason == null"
            - "L2.status == \"REJECTED\" AND L2.accepted_at == null AND L2.forward_impact_score == null AND L2.backward_impact_score == null AND L2.rejection_reason == \"out of scope\""

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (≥ 2 instances; one of depth ≥ 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: progress_rollup_three_levels
        grounds:
          - calculations.kr_score
          - calculations.objective_progress
          - state_machines.Objective.DRAFT_to_ACTIVE
          - endpoints./key-results/{id}/progress
          - entities.KeyResult.fields.score
          - entities.Objective.fields.progress
          - entities.Objective.fields.parent_objective_id
        distinguishing_aspect: |
          Cascade depth = 4. Each link is caused by the previous link, not the
          original action: ProgressUpdate → KR.current_value (link 1) → KR.score
          recomputed (link 2) → leaf Objective.progress recomputed (link 3) →
          parent Objective.progress recomputed (link 4) → grandparent
          Objective.progress recomputed (link 5). Different triggering transition
          from cycle_archive_cascade_to_links below (POST progress vs POST archive).
        test_recipe:
          setup:
            - "Cycle C in OPEN"
            - "Grandparent objective G at COMPANY level, weight=1.0, owned by company-level owner"
            - "Parent objective P at DEPARTMENT level, parent_objective_id=G.id, weight=1.0, owned by department-level owner"
            - "Leaf objective L at TEAM level, parent_objective_id=P.id, weight=1.0, owned by team-level owner"
            - "L has 1 KR_L NUMERIC start=0 target=100 weight=1.0 current_value=0"
            - "Publish L (DRAFT→ACTIVE), then P (P needs L as ACTIVE child), then G"
            - "Initial state: KR_L.score=0.0000, L.progress=0.0000, P.progress=0.0000, G.progress=0.0000"
          trigger:
            - "POST /key-results/{KR_L.id}/progress {update_type:VALUE_CHANGE, new_value:50}"
            - "GET /objectives/{G.id} (read grandparent after cascade)"
          assert:
            - "KR_L.score == 0.5000"
            - "L.progress == 0.5000   # leaf updated"
            - "P.progress == 0.5000   # parent rolled up from L"
            - "G.progress == 0.5000   # grandparent rolled up from P (depth-4 cascade reached top)"

      - name: cycle_archive_cascade_to_links
        grounds:
          - state_machines.OKRCycle.LOCKED_to_ARCHIVED
          - state_machines.Objective.LOCKED_to_ARCHIVED
          - state_machines.AlignmentLink.ACCEPTED_to_BROKEN
          - endpoints./cycles/{id}/archive
          - entities.OKRCycle.fields.status
          - entities.Objective.fields.status
          - entities.AlignmentLink.fields.status
        distinguishing_aspect: |
          Cascade depth = 2. Different triggering transition from progress_rollup
          (POST /cycles/{id}/archive vs POST /key-results/{id}/progress). Each
          link is caused by the previous: cycle.archive → objective LOCKED→ARCHIVED
          (link 1) → ACCEPTED AlignmentLink → BROKEN (link 2). Not a fan-out: the
          link break is caused by the objective archive, not directly by the cycle
          archive.
        test_recipe:
          setup:
            - "Cycle C in LOCKED state with 2 Objectives A and B both in LOCKED state"
            - "1 ACCEPTED AlignmentLink L from A to B"
          trigger:
            - "POST /cycles/{C.id}/archive  -- as PlatformAdmin"
            - "GET /cycles/{C.id}; GET /objectives/{A.id}; GET /objectives/{B.id}; GET /alignment-links?upstream_objective_id={A.id}"
          assert:
            - "C.status == \"ARCHIVED\""
            - "A.status == \"ARCHIVED\" AND B.status == \"ARCHIVED\"   # link 1 of cascade"
            - "L.status == \"BROKEN\"   # link 2 of cascade — caused by objective archive, not directly by cycle archive"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances on different pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_vs_state_objective_create
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors.ERR_USER_NOT_FOUND
          - errors.ERR_CYCLE_NOT_OPEN
          - endpoints./objectives
        distinguishing_aspect: |
          Pair: existence (priority 9, ERR_USER_NOT_FOUND) vs state (priority 15,
          ERR_CYCLE_NOT_OPEN). Both checks fail simultaneously; existence wins
          because lower-priority numbers run first. Different category PAIR from
          state_vs_business_constraint_progress_update below.
        test_recipe:
          setup:
            - "Cycle C in DRAFT (created but never opened — fails priority 15 state check)"
            - "Department D exists; bogus_user_id is a fresh UUID not present in any User row (fails priority 9 existence)"
            - "Acting role is PlatformAdmin (passes auth)"
          trigger:
            - "POST /objectives {cycle_id: C.id, level: COMPANY, department_id: D.id, owner_user_id: bogus_user_id, title: 't', weight: 1.0}"
          assert:
            - "Response status == 404 AND data.error_id == \"ERR_USER_NOT_FOUND\""
            - "data.error_id != \"ERR_CYCLE_NOT_OPEN\"   # state check at priority 15 NEVER runs because priority-9 existence fails first"

      - name: state_vs_business_constraint_progress_update
        grounds:
          - validations[priority=16]
          - validations[priority=26]
          - errors.ERR_OBJECTIVE_NOT_ACTIVE
          - errors.ERR_PROGRESS_OUT_OF_RANGE
          - endpoints./key-results/{id}/progress
        distinguishing_aspect: |
          Pair: state (priority 16, ERR_OBJECTIVE_NOT_ACTIVE) vs business_constraint
          (priority 26, ERR_PROGRESS_OUT_OF_RANGE). Different category PAIR from
          existence_vs_state above (existence/state vs state/business_constraint).
          Both fail simultaneously; state wins.
        test_recipe:
          setup:
            - "Cycle C in OPEN; Objective O in DRAFT (never published — fails priority 16 state check)"
            - "O has KR_X NUMERIC start=0 target=100 weight=1.0 (range [0,100], so new_value=200 fails priority 26 business_constraint)"
            - "Acting role is Employee, X-User-ID == O.owner_user_id"
          trigger:
            - "POST /key-results/{KR_X.id}/progress {update_type: VALUE_CHANGE, new_value: 200}"
          assert:
            - "Response status == 409 AND data.error_id == \"ERR_OBJECTIVE_NOT_ACTIVE\""
            - "data.error_id != \"ERR_PROGRESS_OUT_OF_RANGE\"   # constraint check at priority 26 NEVER runs because priority-16 state fails first"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (≥ 2 instances on different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: kr_weight_sum_inclusive_tolerance_at_publish
        grounds:
          - validations[priority=22]
          - calculations.objective_progress
          - errors.ERR_KR_WEIGHTS_INVALID
          - endpoints./objectives/{id}/publish
          - entities.KeyResult.fields.weight
        distinguishing_aspect: |
          Metric: sum-of-KR-weights, tolerance ≤ 1e-4. Boundary semantic:
          INCLUSIVE — |sum - 1.0| <= 0.0001 passes; |sum - 1.0| > 0.0001 fails.
          Different metric and different endpoint from calibration_delta below.
        test_recipe:
          setup:
            - "Cycle C in OPEN; two DRAFT objectives O_A and O_B at INDIVIDUAL level, owners E_A and E_B"
            - "O_A: 2 KRs with weights 0.5000 and 0.4998 (sum=0.9998, |sum-1.0|=0.0002 → outside tolerance)"
            - "O_B: 2 KRs with weights 0.5000 and 0.4999 (sum=0.9999, |sum-1.0|=0.0001 → exactly at inclusive tolerance)"
          trigger:
            - "POST /objectives/{O_A.id}/publish   -- as E_A"
            - "POST /objectives/{O_B.id}/publish   -- as E_B"
          assert:
            - "Publish on O_A: status==422 AND data.error_id == \"ERR_KR_WEIGHTS_INVALID\"   # 0.9998 outside tolerance"
            - "Publish on O_B: status==200 AND O_B.status == \"ACTIVE\"   # 0.9999 INCLUSIVE at 1e-4 boundary, passes"

      - name: calibration_delta_strict_greater_than_boundary
        grounds:
          - validations[priority=28]
          - calculations.review_aggregate_score
          - errors.ERR_DELTA_TOO_SMALL
          - endpoints./reviews/{id}/calibrate
          - entities.ReviewScore.fields.calibration_score
          - entities.ReviewScore.fields.manager_score
        distinguishing_aspect: |
          Metric: |calibration_score - manager_score|, threshold = MIN_CALIBRATION_DELTA = 0.05.
          Boundary semantic: STRICT GREATER-THAN — delta == 0.05 EXACTLY fails;
          delta > 0.05 passes. Different metric (calibration delta vs weight sum)
          and different endpoint (/reviews/{id}/calibrate vs /objectives/{id}/publish)
          from kr_weight_sum_inclusive_tolerance.
        test_recipe:
          setup:
            - "Cycle C in IN_REVIEW; ReviewScore R in PENDING_CALIBRATION with manager_score=0.5000"
            - "Acting role is HRBP"
          trigger:
            - "POST /reviews/{R.id}/calibrate {calibration_score: 0.5500}   -- delta == 0.0500 exactly"
            - "POST /reviews/{R.id}/calibrate {calibration_score: 0.5501}   -- delta == 0.0501, > 0.05"
          assert:
            - "First trigger: status==422 AND data.error_id == \"ERR_DELTA_TOO_SMALL\"   # 0.05 EXCLUSIVE at strict-greater boundary"
            - "Second trigger: status==200 AND R.calibration_score == 0.5501   # 0.0501 > 0.05, passes"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (≥ 2 instances on different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: kr_progress_requires_objective_active
        grounds:
          - validations[priority=16]
          - state_machines.Objective.DRAFT_to_ACTIVE
          - errors.ERR_OBJECTIVE_NOT_ACTIVE
          - endpoints./key-results/{id}/progress
          - entities.Objective.fields.status
          - entities.KeyResult.fields.objective_id
        distinguishing_aspect: |
          Entity pair: (KeyResult, Objective). KR's transition POST progress is
          gated by parent Objective's status: KR-progress is only valid when
          Objective.status == ACTIVE. Different entity pair from
          objective_create_requires_cycle_open below.
        test_recipe:
          setup:
            - "Cycle C in OPEN; Objective O in DRAFT (never published)"
            - "KR_Q on O: NUMERIC start=0 target=100 weight=1.0"
            - "Acting role is Employee, X-User-ID == O.owner_user_id"
          trigger:
            - "POST /key-results/{KR_Q.id}/progress {update_type: VALUE_CHANGE, new_value: 50}"
            - "POST /objectives/{O.id}/publish   -- now O.status==ACTIVE"
            - "POST /key-results/{KR_Q.id}/progress {update_type: VALUE_CHANGE, new_value: 50}   -- now allowed"
          assert:
            - "First trigger: status==409 AND data.error_id == \"ERR_OBJECTIVE_NOT_ACTIVE\"   # KR action gated by Objective state"
            - "Third trigger: status==201   # same KR, same payload, different parent Objective status → different outcome"

      - name: objective_create_requires_cycle_open
        grounds:
          - validations[priority=15]
          - state_machines.OKRCycle.DRAFT_to_OPEN
          - errors.ERR_CYCLE_NOT_OPEN
          - endpoints./objectives
          - entities.OKRCycle.fields.status
          - entities.Objective.fields.cycle_id
        distinguishing_aspect: |
          Entity pair: (Objective, OKRCycle). Objective creation is gated by
          OKRCycle.status == OPEN. Different entity pair from kr_progress above
          (KR-Objective vs Objective-Cycle).
        test_recipe:
          setup:
            - "Cycle C in DRAFT (never opened)"
            - "Department D exists; User E exists in ACTIVE role_type=EMPLOYEE; acting role is PlatformAdmin"
          trigger:
            - "POST /objectives {cycle_id: C.id, level: INDIVIDUAL, department_id: D.id, owner_user_id: E.id, title: 't', weight: 1.0}"
            - "POST /cycles/{C.id}/open   -- now C.status==OPEN"
            - "POST /objectives {cycle_id: C.id, level: INDIVIDUAL, department_id: D.id, owner_user_id: E.id, title: 't', weight: 1.0}   -- same payload, retried"
          assert:
            - "First trigger: status==409 AND data.error_id == \"ERR_CYCLE_NOT_OPEN\""
            - "Third trigger: status==201   # identical request now succeeds because Cycle.status changed"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (≥ 2 instances with different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_half_open_interval_overlap
        grounds:
          - validations[priority=30]
          - errors.ERR_CYCLE_OVERLAP
          - endpoints./cycles
          - entities.OKRCycle.fields.start_date
          - entities.OKRCycle.fields.end_date
        distinguishing_aspect: |
          Resource: OKRCycle. Interval semantics: HALF-OPEN [start_date, end_date).
          Adjacent intervals (A.end_date == B.start_date) DO NOT overlap. Strict
          interior intersection IS overlap. Different interval semantics from
          external_event_dedup_closed_window below (closed delta vs half-open
          calendar interval).
        test_recipe:
          setup:
            - "Existing cycle C1 in OPEN: start_date=2026-01-01T00:00:00Z, end_date=2026-04-01T00:00:00Z"
            - "Acting role is PlatformAdmin"
          trigger:
            - "POST /cycles {cycle_code: \"2026-Q2\", year: 2026, quarter: 2, start_date: \"2026-04-01T00:00:00Z\", end_date: \"2026-07-01T00:00:00Z\"}   -- adjacent, A.end == B.start"
            - "POST /cycles {cycle_code: \"2026-Q1B\", year: 2026, quarter: 1, start_date: \"2026-03-15T00:00:00Z\", end_date: \"2026-06-15T00:00:00Z\"}   -- overlaps interior"
          assert:
            - "First trigger: status==201   # adjacent half-open intervals do NOT overlap (B.start == A.end is allowed)"
            - "Second trigger: status==409 AND data.error_id == \"ERR_CYCLE_OVERLAP\"   # interior intersection rejected"

      - name: external_event_dedup_closed_window
        grounds:
          - validations[priority=31]
          - errors.ERR_DUPLICATE_EVENT
          - endpoints./external-events
          - endpoints./_clock/advance
          - entities.ExternalEvent.fields.source_system
          - entities.ExternalEvent.fields.external_event_id
          - entities.ExternalEvent.fields.received_at
        distinguishing_aspect: |
          Resource: ExternalEvent. Interval semantics: CLOSED time-delta window
          [0, DEDUP_WINDOW_MINUTES] = [0, 60] minutes. Equality at 60 min IS
          duplicate (closed inclusion); 61+ min is NOT duplicate. Different
          interval semantics from cycle_half_open above (closed time-delta vs
          half-open calendar range).
        test_recipe:
          setup:
            - "Acting role is PlatformAdmin; system clock at fixed t0"
          trigger:
            - "POST /external-events {source_system: \"HR\", external_event_id: \"evt-001\", event_type: \"EMPLOYEE_TRANSFERRED\", payload: {}}   -- baseline at t0"
            - "POST /_clock/advance {seconds: 3600}   -- advance exactly 60 min"
            - "POST /external-events {source_system: \"HR\", external_event_id: \"evt-001\", event_type: \"EMPLOYEE_TRANSFERRED\", payload: {}}   -- delta == 60 min, AT closed boundary"
            - "POST /_clock/advance {seconds: 60}   -- now total delta from baseline is 61 min"
            - "POST /external-events {source_system: \"HR\", external_event_id: \"evt-001\", event_type: \"EMPLOYEE_TRANSFERRED\", payload: {}}   -- delta == 61 min"
          assert:
            - "First trigger: status==201"
            - "Third trigger: status==409 AND data.error_id == \"ERR_DUPLICATE_EVENT\"   # delta exactly 60 min INCLUDED in closed dedup window"
            - "Fifth trigger: status==201   # delta 61 min OUTSIDE dedup window"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (≥ 2 instances on different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: co_owner_add_remove_weight_sum_invariant
        grounds:
          - state_machines.Objective.DRAFT_to_ACTIVE
          - endpoints./objectives/{id}/co-owners
          - entities.CoOwnership.fields.contribution_weight
          - entities.CoOwnership.fields.status
          - validations[priority=23]
        distinguishing_aspect: |
          Conserved quantity: REAL-VALUED weight-sum (Σ ACTIVE
          CoOwnership.contribution_weight on the Objective). Forward action POST
          adds a co-owner with weight 0.3 (sum 0.0 → 0.3); compensating action
          DELETE removes the co-owner (sum 0.3 → 0.0). After forward + compensating,
          the conserved quantity returns to its baseline value 0.0. Different
          conserved-quantity TYPE from access_grant_count_invariant below
          (real-valued sum vs integer count).
        test_recipe:
          setup:
            - "Cycle C in OPEN; Objective O in ACTIVE owned by Employee E_owner"
            - "User E_collab is another Employee (separate User row, distinct id from E_owner)"
            - "Initial: zero ACTIVE CoOwnership rows for O; sum_of_contribution_weight = 0.0"
          trigger:
            - "GET /objectives/{O.id}/co-owners   -- baseline"
            - "POST /objectives/{O.id}/co-owners {co_owner_user_id: E_collab.id, contribution_weight: 0.3000}   -- forward"
            - "GET /objectives/{O.id}/co-owners   -- after forward"
            - "DELETE /objectives/{O.id}/co-owners/{E_collab.id}   -- compensating"
            - "GET /objectives/{O.id}/co-owners   -- after compensating"
          assert:
            - "Baseline: list has 0 ACTIVE rows; sum_of_contribution_weight == 0.0"
            - "After forward: list has 1 ACTIVE row; sum_of_contribution_weight == 0.3"
            - "After compensating: list has 0 ACTIVE rows; sum_of_contribution_weight == 0.0   # invariant restored"
            - "Conserved quantity sum_of_contribution_weight is exactly equal across baseline and post-compensating reads"

      - name: access_grant_grant_revoke_count_invariant
        grounds:
          - endpoints./objectives/{id}/access-grants
          - entities.AccessGrant.fields.status
          - entities.AccessGrant.fields.user_id
          - entities.Objective.fields.confidential
        distinguishing_aspect: |
          Conserved quantity: INTEGER count (count of ACTIVE AccessGrant rows for
          the Objective). Forward action POST grants access (count 0 → 1);
          compensating action DELETE revokes (count 1 → 0). Different conserved-
          quantity TYPE from co_owner_weight_sum_invariant above (integer count
          vs real-valued sum).
        test_recipe:
          setup:
            - "Cycle C in OPEN; Objective O in ACTIVE with confidential=true, owned by Employee E_owner"
            - "User E_reader is a distinct Employee (not initially in the access list)"
            - "Initial: count of ACTIVE AccessGrant rows for O is 0"
          trigger:
            - "GET /objectives/{O.id}/access-grants   -- baseline"
            - "POST /objectives/{O.id}/access-grants {user_id: E_reader.id}   -- forward"
            - "GET /objectives/{O.id}/access-grants   -- after forward"
            - "DELETE /objectives/{O.id}/access-grants/{E_reader.id}   -- compensating"
            - "GET /objectives/{O.id}/access-grants   -- after compensating"
          assert:
            - "Baseline: count of ACTIVE rows == 0"
            - "After forward: count of ACTIVE rows == 1"
            - "After compensating: count of ACTIVE rows == 0   # invariant restored"
            - "Conserved quantity access_grant_count is exactly equal across baseline and post-compensating reads"
