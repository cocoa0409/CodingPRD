            - call: "POST /api/stay-requests/${r_mn}/decisions"
              payload: { decision: "CONFIRM", site_id: "N1", expected_host_version: "${h_mn_v2}" }
              as: HostOperator
              as_user_id: "${h_mn}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stay-requests/${r_mn}/check_ins"
              payload: {}
              as: HostOperator
              as_user_id: "${h_mn}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stay-requests/${r_mn}/check_outs"
              payload: {}
              as: HostOperator
              as_user_id: "${h_mn}"
            - call: "POST /api/reviews"
              payload: { author_member_id: "${m18}", subject_host_id: "${h_mn}", rating: 5, public_note: "lovely", advance_notice_hours: 240 }
              as: Member
              as_user_id: "${m18}"
              captures: { rev_a: $.data.id }
          trigger:
            - call: "POST /api/reviews"
              payload: { author_member_id: "${m18}", subject_host_id: "${h_mn}", rating: 4, public_note: "good", advance_notice_hours: 12 }
              as: Member
              as_user_id: "${m18}"
              captures: { rev_b: $.data.id }
            - call: "GET /api/members/${m18}"
              payload: {}
              as: PlatformAdmin
              captures: { avg_with_two: $.data.member_rating_average }
            - call: "POST /api/reviews/${rev_b}/withdrawals"
              payload: {}
              as: Member
              as_user_id: "${m18}"
              captures: { rev_b_status: $.data.review_status }
            - call: "GET /api/members/${m18}"
              payload: {}
              as: PlatformAdmin
              captures: { avg_restored: $.data.member_rating_average }
          assert:
            - "Member.${m18}.member_rating_average == 4.50 with both reviews published"
            - "Member.${m18}.member_rating_average == 5.00 after withdrawing exactly one of the two, a net change of 0 against the starting value"
            - "HostReview.${rev_a}.review_status is still \"PUBLISHED\" and HostReview.${rev_b}.review_status == \"WITHDRAWN\", so the denominator fell by exactly one"
            - "a second POST /api/reviews/${rev_b}/withdrawals returns error_id ERR_REVIEW_ALREADY_WITHDRAWN with http 409 and member_rating_average stays 5.00"
