  # =======================================================================
  - rule_id: boundary_precision_check
    mechanism: |
      Four different metrics are walked across their exact decision edge, each on
      a DIFFERENT endpoint, and each with a different precision rule:
        * waste_intensity_kg_per_1k_meals, 3 decimals, INCLUSIVE >= threshold,
          on POST /waste-entries;
        * variance_pct, 2 decimals, STRICTLY > tolerance, on POST /hauler-tickets;
        * the empty-set guard plus the inclusive end_date of a baseline window, on
          POST /baseline-periods/{id}/submit;
        * the inclusive shelf-life endpoint at one-second resolution, on
          POST /consignment-lines.
      Two of the four edges are inclusive and two are exclusive, so a single
      comparison convention cannot pass all four.
    instances:

      - name: intensity_at_exactly_twelve_point_zero_zero_zero_fires_the_coaching_alert
        grounds: "§1.3 calculations.coaching_alert_trigger Rule A with COACHING_INTENSITY_THRESHOLD 12.000 / HIGH_SEVERITY_INTENSITY 18.000 (comparison on the 3-decimal rounded value, inclusive); §1.3 calculations.shift_waste_intensity; §1.3 calculations.site_waste_aggregates."
        distinguishing_aspect: "Metric: shift intensity at 3 decimals, on POST /waste-entries. The edge is INCLUSIVE, and the fixture straddles it by ONE GRAM: 2999 g over 250 meals is 11.996 and creates nothing, while 3000 g is exactly 12.000 and creates the alert. Because the comparison is made on the rounded value, an implementation using a strict > or comparing unrounded floats produces a different alert count for the same two captures."
        test_recipe:
          setup: |
            Site with target_intensity_kg_per_1k_meals 10.000 and ONE ACTIVE PREP station,
            FT_PREP, and an OPEN shift 2026-06-10 AM with meals_served 250. Two captures of
            1200 g and 1000 g are already recorded (2200 g, intensity 8.800, no alert).
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE", target_intensity_kg_per_1k_meals: 10.000 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1200, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 799, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:10:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { below_entry_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:15:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { edge_entry_id: "$.data.id" }
          assert:
            - "After the FIRST trigger call, GET /shifts/${shift_id} returns shift_waste_grams == 2999 and waste_intensity_kg_per_1k_meals == 11.996 — one thousandth below the threshold."
            - "After the FIRST trigger call, GET /coaching-alerts?shift_id=${shift_id} returns total_count == 0 and GET /sites/${site_id} returns open_alert_count == 0 with coaching_posture == MONITORING."
            - "After the SECOND trigger call (a single gram), GET /shifts/${shift_id} returns shift_waste_grams == 3000 and waste_intensity_kg_per_1k_meals == 12.000."
            - "After the SECOND trigger call, GET /coaching-alerts?shift_id=${shift_id} returns total_count == 1 with alert_type INTENSITY_BREACH, status OPEN, observed_intensity == 12.000, waste_entry_id == ${edge_entry_id} and severity MEDIUM (12.000 is below HIGH_SEVERITY_INTENSITY 18.000, whose edge is also inclusive)."
            - "After the SECOND trigger call, GET /sites/${site_id} returns open_alert_count == 1 and coaching_posture == INTERVENTION (1 is below ESCALATION_ALERT_COUNT 3)."
            - "A third capture would NOT create a second INTENSITY_BREACH alert for this shift while the first is OPEN, so total_count stays 1."

      - name: ticket_variance_at_exactly_five_percent_earns_no_credit_but_five_point_four_two_does
        grounds: "§1.3 calculations.hauler_ticket_settlement STEP 6 with VARIANCE_TOLERANCE_PCT 5.00 and VARIANCE_CREDIT_RATE 0.10, comparison strictly greater; §1.6 HaulerTicket money fields."
