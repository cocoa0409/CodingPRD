  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: single_accepted_measurement_invariant_on_remeasure
        grounds:
          - state_machines.Measurement.ACCEPTED_to_SUPERSEDED
          - state_machines.Project.DESIGNED_to_MEASURED
          - entities.Measurement.fields.status
        distinguishing_aspect: |
          Conserved quantity Q1 = count(Measurement WHERE project_id=P AND status==ACCEPTED). The
          forward action (accept a new measurement) paired with its compensating action (supersede the
          prior ACCEPTED measurement) leaves Q1 == 1 exactly — never 0, never 2.
        test_recipe:
          setup:
            - "A DESIGNED project with exactly one ACCEPTED measurement (120x144); a new PENDING measurement (130x144) recorded."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r9a@x.com", full_name: "R9A", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "18 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 130, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /measurements/${m2}/accept"
              payload: {}
              as: SalesDesigner
            - call: "GET /projects/${pj}/measurements"
              payload: {}
              as: SalesDesigner
          assert:
            - "Measurement.${m1}.status == SUPERSEDED and Measurement.${m2}.status == ACCEPTED"
            - "count of measurements on project ${pj} with status==ACCEPTED == 1 (Q1 conserved)"

      - name: single_accepted_quote_invariant_on_final_supersede
        grounds:
          - state_machines.ManufactureOrder.QUEUED_to_IN_PRODUCTION
          - state_machines.Quote.ISSUED_to_SUPERSEDED
          - entities.Quote.fields.status
        distinguishing_aspect: |
          Conserved quantity Q2 = count(Quote WHERE project_id=P AND status==ACCEPTED). The forward
          action (manufacture start creates+accepts a FINAL quote) paired with its compensating action
          (supersede the prior ACCEPTED ESTIMATE) leaves Q2 == 1 — a different conserved quantity
          (quotes, not measurements).
        test_recipe:
          setup:
            - "A THREE_SEASON project approved-to-build with exactly one ACCEPTED ESTIMATE quote, manufacture order QUEUED."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r9b@x.com", full_name: "R9B", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "19 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
          trigger:
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "GET /projects/${pj}/quotes"
              payload: {}
              as: SalesDesigner
          assert:
