    input: []
    output: CommunityPreschoolSite
    side_effects: []

  - method: GET
    path: "/child-find/providers/{id}"
    description: "Fetch one provider with both capacity dimensions recomputed."
    roles: [ChildFindCoordinator, EvaluationChair, Evaluator, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/child-find/screening-events/{id}"
    description: "Fetch one screening event with effective_slot_capacity and booked_slot_count."
    roles: [ChildFindCoordinator, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: []
