            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000001302", item_description: "Butter 1lb", category_code: "DAIRY", old_retail_cents: 549, new_retail_cents: 499, net_content_qty: 1, net_content_uom: "LB" }
              as: PricingAdmin
