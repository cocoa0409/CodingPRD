            - "the inverted run window returns HTTP 400 with error_id ERR_WINDOW_ORDER_INVALID"
            - "the inverted yard window returns HTTP 400 with error_id ERR_WINDOW_ORDER_INVALID"
            - "the single-instant yard window with yard_window_end == yard_window_start returns HTTP 201 with status PLANNED and order_count 0, because the yard comparison is at-or-after rather than strict"
