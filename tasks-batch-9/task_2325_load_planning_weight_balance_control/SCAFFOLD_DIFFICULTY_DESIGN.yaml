  - rule_id: priority_pair_validation_conflict
    instances:

      - name: sheet_state_beats_lmc_allowance
        conflicting_priorities: [11, 36]
        category_pair: "state (priority 11, ERR_SHEET_INVALID_STATE, 409) vs business_fiscal (priority 36, ERR_LMC_ALLOWANCE_EXCEEDED, 422)"
        grounds:
          - validations.priority_11
          - validations.priority_36
          - state_machines.LoadSheet.transitions.ISSUED_to_REJECTED_BY_CAPTAIN
        distinguishing_aspect: |
          A single request violates both rules: the target sheet has been
          rejected by the captain (so LastMinuteChange creation is illegal at all)
          AND the requested 5000.00 kg change is ten times the 500.00 kg allowance.
          The lower priority number must win, so the caller sees the 409 state
          error, never the 422 fiscal one. The reissued sheet proves rule 36 is
          live on exactly the same payload.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H4; runway LSGG/04 with the [15,30) band; STANDARD program; one flight 10:00-12:30 UTC."
            - "Plan: OC 4650.00 kg, H1 1450.00 kg of bags, one 400.00 kg GENERAL consignment in H4 -> base_payload_kg 6500.00, underload_kg 13680.00, so every issued sheet gets lmc_allowance_kg 500.00 (the hard cap)."
            - "Sheet 1 is issued by lc-01 and then rejected by cpt-01, which returns the plan to COMPUTED and leaves sheet 1 in REJECTED_BY_CAPTAIN."
