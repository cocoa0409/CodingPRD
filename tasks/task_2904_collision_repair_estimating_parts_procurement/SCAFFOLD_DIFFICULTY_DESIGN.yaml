              captures: { ro_ver_consented: $.data.version }
            - call: "POST /repair-orders/${ro_id}/supplements"
              payload: { reason_code: "HIDDEN_DAMAGE", requested_amount_cents: 24000, expected_repair_order_version: "${ro_ver_consented}" }
