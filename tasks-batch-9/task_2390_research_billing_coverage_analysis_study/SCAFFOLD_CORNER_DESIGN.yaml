              captures: { visit_id: "$.data.id", visit_total_before: "$.data.expected_charge_total_cents" }
          trigger:
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_id}", coverage_item_id: "${item_infusion_id}", occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { route_id: "$.data.id" }
          assert:
            - "setup: visit_total_before == 0 and the visit's window_start_day == 0 / window_end_day == 3"
            - "trigger response 201 with calendar_visit_id == ${visit_id}, coverage_item_id == ${item_infusion_id}, occurrences == 2, routing_target == \"SPONSOR\", expected_amount_cents == 80000"
            - "GET /research-billing/visit-charge-routes/${route_id} returns the same row; GET /research-billing/visit-charge-routes?coverage_item_id=${item_infusion_id} returns total_count == 1"
            - "GET /research-billing/study-calendars/${calendar_id} shows routed_item_count == 1 and unrouted_per_patient_item_count == 0 - the INVOICEABLE milestone is not counted"
            - "posting the identical body again returns 409 ERR_DUPLICATE_VISIT_ROUTE"
            - "routing ${item_milestone_id} onto the same visit returns 422 ERR_INVOICEABLE_ITEM_NOT_VISIT_ROUTABLE"
            - "routing an unknown coverage_item_id returns 404 ERR_COVERAGE_ITEM_NOT_FOUND, and an unknown calendar_visit_id returns 404 ERR_CALENDAR_VISIT_NOT_FOUND"

      - name: accrual_opening_is_conditional_on_a_published_calendar
        claim_type: conditional_action
        grounds:
          - state_machines.Study.transitions[LC-3].preconditions
          - endpoints[POST /research-billing/studies/{id}/accrual]
          - validations[priority 10]
        distinguishing_aspect: "Four of LC-3's five preconditions hold - COVERAGE_APPROVED, budget EXECUTED, a qualifying QCT and a well-formed registry number - and the request is still refused 409 because the only calendar is DRAFT; publishing it (nothing else) turns the identical request into a 200."
        test_recipe:
          setup:
            - "One study at COVERAGE_APPROVED with a DEEMED_QUALIFYING determination, registry NCT10000144, budget EXECUTED, and a calendar generation 1 left in DRAFT with one fully routed visit."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
