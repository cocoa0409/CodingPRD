              as: CompositionOperator
              as_user_id: "op-1"
              captures: { e6_job_2: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${e6_job_2}/presort"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs/${e6_job_1}/schedule"
              payload: { window_start: "2026-08-05T09:00:00Z", press_line_id: "${e6_line_id}" }
              as: ProductionScheduler
              captures: { e6_mode_explicit: "$.data.selection_mode", e6_score_explicit: "$.data.selection_score", e6_line_explicit: "$.data.press_line_id" }
            - call: "POST /bureau/composition-jobs/${e6_job_2}/schedule"
