              captures: { ob_gross: $.data.gross_revenue_cents, ob_charged: $.data.charged_penalty_cents, ob_forgiven: $.data.forgiven_penalty_cents, ob_status: $.data.status, ob_accrued: $.data.accrued_penalty_cents }
          assert:
            - "CapacityObligation.${ob_id}.accrued_penalty_cents == 400000 before close semantics are applied"
            - "CapacityObligation.${ob_id}.gross_revenue_cents == 10000 (step 1: 10 × 1000, computed BEFORE penalty offset)"
            - "CapacityObligation.${ob_id}.charged_penalty_cents == 15000 (step 3: min(400000, 1.5 × 10000))"
            - "CapacityObligation.${ob_id}.forgiven_penalty_cents == 385000 and status == CLOSED"

  - rule_id: non_linear_state_machine
    instances:
      - name: offer_submit_withdraw_cycle
        grounds:
          - state_machines.DayAheadOffer.DRAFT_to_SUBMITTED
          - state_machines.DayAheadOffer.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on DayAheadOffer: DRAFT → SUBMITTED → DRAFT →
          SUBMITTED is legal while the day is DA_OPEN, and the cycle then
          terminates into CLEARED at the DA run — not a linear pipeline.
        test_recipe:
          setup:
            - "Participant with 10 MW generator; day 2026-08-03, gate 2026-08-02T10:30:00Z, clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Cyc Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id, o_st0: $.data.status }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "GET /market/offers/${o_id}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_st1: $.data.status }
          trigger:
            - { call: "POST /market/offers/${o_id}/withdraw", as: Trader, as_user_id: "${p_id}" }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "GET /market/offers/${o_id}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_stf: $.data.status, o_cm: $.data.cleared_mw }
          assert:
            - "DayAheadOffer.${o_id}.status == DRAFT at creation (initial state)"
            - "status == SUBMITTED after first submit, == DRAFT after withdraw (cycle), == SUBMITTED after second submit"
            - "DayAheadOffer.${o_id}.status == CLEARED and cleared_mw == 10 after the DA run — cycle terminates into clearing"

      - name: statement_dispute_reinstatement_cycle
        grounds:
          - state_machines.SettlementStatement.ISSUED_to_UNDER_DISPUTE
          - state_machines.SettlementStatement.UNDER_DISPUTE_to_ISSUED
        distinguishing_aspect: |
          Cyclic machine on SettlementStatement (different entity than the
          offer cycle): ISSUED → UNDER_DISPUTE → ISSUED (withdraw) →
          UNDER_DISPUTE (refile) → ISSUED (reject) — the statement re-enters
          ISSUED repeatedly rather than progressing linearly.
        test_recipe:
          setup:
            - "Settled FINAL statement for a participant (cleared 10 MW offer, telemetry 10 MW uniform → dev 0; net −1128000)"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Stmt Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload:
                operating_day_id: "${d_id}"
                expected_generator_asset_version: "${g_v}"
                readings: [ { interval_index: 1, actual_mw: 10 }, { interval_index: 2, actual_mw: 10 }, { interval_index: 3, actual_mw: 10 }, { interval_index: 4, actual_mw: 10 }, { interval_index: 5, actual_mw: 10 }, { interval_index: 6, actual_mw: 10 }, { interval_index: 7, actual_mw: 10 }, { interval_index: 8, actual_mw: 10 }, { interval_index: 9, actual_mw: 10 }, { interval_index: 10, actual_mw: 10 }, { interval_index: 11, actual_mw: 10 }, { interval_index: 12, actual_mw: 10 }, { interval_index: 13, actual_mw: 10 }, { interval_index: 14, actual_mw: 10 }, { interval_index: 15, actual_mw: 10 }, { interval_index: 16, actual_mw: 10 }, { interval_index: 17, actual_mw: 10 }, { interval_index: 18, actual_mw: 10 }, { interval_index: 19, actual_mw: 10 }, { interval_index: 20, actual_mw: 10 }, { interval_index: 21, actual_mw: 10 }, { interval_index: 22, actual_mw: 10 }, { interval_index: 23, actual_mw: 10 }, { interval_index: 24, actual_mw: 10 } ]
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - call: "POST /market/operating-days/${d_id}/run-final-settlement"
              payload: { rt_node_prices_final: [ { node_name: "WEST_HUB", rt_final_energy_cents_per_mwh: 4000, rt_final_congestion_cents_per_mwh: 50, rt_final_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "FINAL" }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { s_id: "$.data[0].id" }
            - call: "GET /market/statements/${s_id}/lines"
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { ln_id: "$.data[0].id" }
          trigger:
            - call: "POST /market/statements/${s_id}/disputes"
              payload: { dispute_reason: "PRICE_ERROR", disputed_line_ids: ["${ln_id}"] }
              as: SettlementAnalyst
