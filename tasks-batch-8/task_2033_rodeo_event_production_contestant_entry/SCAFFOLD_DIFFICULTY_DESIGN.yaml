            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: FINAL }, as: CommitteeAdmin, captures: { pay_id: $.data.id } }
          assert:
            - "GO_ROUND_1 place_lines: two lines with place 1, tied_count 2, contestants ${c_a} and ${c_d}, each amount_cents == 36624"
            - "No GO_ROUND_1 line exists for ${c_b} or ${c_c} (tie absorbs both paid places)"
            - "AVERAGE place_lines: ${c_a} and ${c_d} each receive 15696 (tied split of 18835+12557=31392), tied_count 2"
            - "Payout.purse_cents == 104640"

      - name: entry_fee_split_rounding_order_per_entry
        grounds: [calculations.entry_fee_split, entities.Entry.fields.committee_retention_cents]
        distinguishing_aspect: "Mode (b): nested rounding order is pinned per-entry — fees 2005 and 2030 round retentions to 241 and 244 individually (contributions 1164 and 1186, sum 2350); rounding the aggregate fee sum instead would yield retention 484 and contribution sum 2351."
        test_recipe:
          setup:
            - "Rodeo ENTRIES_OPEN with two BAREBACK events: E1 entry_fee 2005 (added 0), E2 entry_fee 2030 (added 0)"
            - "Two contestants, one entry in each event"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Pendleton Round-Up", city: "Pendleton", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BAREBACK, go_rounds: 1, entry_fee_cents: 2005, added_money_cents: 0, per_performance_slots: 10, payout_places: 1 }, as: CommitteeAdmin, captures: { ev1_id: $.data.id } }
