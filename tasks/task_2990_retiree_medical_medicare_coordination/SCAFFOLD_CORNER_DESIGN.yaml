            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", covered_months: 7 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra2_id: $.data.id, hra2_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
