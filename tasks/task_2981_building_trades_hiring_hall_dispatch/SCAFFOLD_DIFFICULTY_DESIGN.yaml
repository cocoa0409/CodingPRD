            - "Exactly one ACTIVE RatioPolicy: first_apprentice_at_jw_count 1, then_every_n_jw 4, effective_from 2026-01-01T00:00:00.000Z — so the cap is 0 accepted journeyworkers -> 0 apprentices, 1 accepted journeyworker -> 1 apprentice."
            - "Cy Boyd, journeyworker, 9000 h, registered on GROUP_1. Dee Kwan, apprentice period 2, 500 h, registered on GROUP_3."
