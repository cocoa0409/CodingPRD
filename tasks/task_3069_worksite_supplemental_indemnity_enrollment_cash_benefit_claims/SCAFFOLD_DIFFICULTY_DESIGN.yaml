    instances:
      - name: campaign_lock_at_exact_window_end_succeeds
        grounds:
          - state_machines.EnrollmentCampaign.OPEN_to_LOCKED
          - errors[ERR_WINDOW_NOT_CLOSED]
          - validations[priority=8]
        distinguishing_aspect: |
          Numeric threshold metric (clock vs window_end): lock requires
          current_time >= window_end with >= pinned — locking at the exact
          window_end instant succeeds, while one millisecond before fails with
          ERR_WINDOW_NOT_CLOSED. Reached via POST /enrollment-campaigns/{id}/lock.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G11 ACTIVE (0/0.0, DAILY); counselor C11; campaign CAM11 OPEN with window_end 2026-09-15T00:00:00Z."
            - "Probe A: clock at 2026-09-14T23:59:59Z -> lock must fail."
            - "Probe B: clock at exactly 2026-09-15T00:00:00Z -> lock must succeed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G11", group_code: "G11", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g11: $.data.id } }
