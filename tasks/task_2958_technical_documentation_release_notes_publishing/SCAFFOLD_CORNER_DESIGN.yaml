              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_a: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_a}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-0", title: "Level 0" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t0: "$.data.id" }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-1", title: "Level 1", parent_topic_id: "${t0}" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t1: "$.data.id" }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-2", title: "Level 2", parent_topic_id: "${t1}" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t2: "$.data.id" }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-3", title: "Level 3", parent_topic_id: "${t2}" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t3: "$.data.id" }
          trigger:
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-4", title: "Level 4", parent_topic_id: "${t3}" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t4: "$.data.id", d4: "$.data.ia_depth" }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-level-5", title: "Level 5", parent_topic_id: "${t4}" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { e_depth: "$.data.error_id" }
          assert:
            - "the fifth topic is created with HTTP 201 and ${d4} == 4 — exactly MAX_IA_DEPTH, which is allowed"
            - "${e_depth} == ERR_IA_DEPTH_EXCEEDED with HTTP 409 for the sixth topic (would-be ia_depth 5)"
            - "GET /topics?plan_item_id=${pi_id} returns total_count == 5 and no topic with slug atlas-level-5 exists"

