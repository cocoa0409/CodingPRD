              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v_fresh: $.data.version }
          trigger:
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v_stale}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_stale: $.data.error_id }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v_fresh}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v_after: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v_fresh}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_replay: $.data.error_id }
          assert:
            - "${e_stale} == ERR_STALE_BAKE_DAY_VERSION with HTTP 412 and plan_posture is still DRAFT with zero runs"
            - "${bd_v_fresh} == ${bd_v_stale} + 1 — the second forecast append advanced the version the first reader held"
            - "the fresh call returns 200 with plan_posture PLANNED and ${bd_v_after} == ${bd_v_fresh} + 1"
            - "${e_replay} == ERR_STALE_BAKE_DAY_VERSION with HTTP 412 — a successful generation consumes its own version"
            - "GET /bakery/production-runs?bake_day_id=${bd_id} returns exactly the runs minted by the single accepted generation, none duplicated by the two rejections"

      - name: ingredient_order_creation_rejects_a_stale_department_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ingredient-order-create-stale-department
          - errors.ERR_STALE_DEPARTMENT_VERSION
          - endpoints.POST_/bakery/ingredient-orders
        distinguishing_aspect: "Posting an order bumps BakeryDepartment.version because it moves open_purchase_commitment_cents, so a second order sent with the version read before the first is ERR_STALE_DEPARTMENT_VERSION (412) and the commitment stays at the first order's 945 cents until the caller re-reads and retries."
        test_recipe:
          setup:
            - "Department with 5% freight surcharge and Bread Flour at 10 cents in 45-unit cases; department version captured before any order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v_stale: $.data.version }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v_stale}", lines: [{ ingredient_id: "${flour_id}", required_units: 90 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { first_order: $.data.id }
          trigger:
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v_stale}", lines: [{ ingredient_id: "${flour_id}", required_units: 45 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_stale_dept: $.data.error_id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v_fresh: $.data.version }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v_fresh}", lines: [{ ingredient_id: "${flour_id}", required_units: 45 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { second_order: $.data.id }
          assert:
            - "${e_stale_dept} == ERR_STALE_DEPARTMENT_VERSION with HTTP 412 and GET /bakery/ingredient-orders?department_id=${dept_id} still returns total_count == 1"
            - "IngredientOrder.${first_order}.order_total_cents == 945 (2 cases * 45 units * 10 cents = 900, plus 5% freight = 945)"
            - "${dept_v_fresh} == ${dept_v_stale} + 1 — only the accepted first order advanced the version"
            - "IngredientOrder.${second_order} is created with 1 case, ordered_units 45 and order_total_cents 473 (450 + 22.5 rounded half-up)"
            - "BakeryDepartment.${dept_id}.open_purchase_commitment_cents == 1418 (945 + 473) — the rejected attempt committed nothing"

      - name: run_completion_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.ProductionRun.BAKING_to_COMPLETED
        excluded_because:
          difficulty_instance: run_completion_cascades_consumption_reorder_and_commitment
          rationale: >-
            That §1.8 instance already walks the full four-hop chain from one
            complete call — ingredient consumption, replenishment_state re-derivation,
            AUTO_REORDER draft creation and the department commitment move — with
            every hop asserted as a literal. A second end-to-end walk would add no
            ordering or partial-failure dimension.

      - name: both_labor_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.run_labor_minutes.variants
        excluded_because:
          difficulty_instance: run_labor_planned_vs_actual_diverges_on_allergen_changeover
          rationale: >-
            The rule-1 instance computes both the PLANNED and the ACTUAL variant on
            one run and asserts the exact delta introduced by the changeover factor,
            which is the whole content of this layer's claim.

      - name: shrink_threshold_trigger_fires_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.bake_day_shrink_rates
        excluded_because:
          difficulty_instance: shrink_ratio_exactly_at_budget_leaves_markdown_on_auto
          rationale: >-
            The boundary instance holds the cost-basis shrink ratio exactly at
            shrink_budget_pct (authorization stays AUTO) and then one cent past it
            (authorization flips to MANAGER_REQUIRED), covering both sides of the
            cumulative threshold.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: run_completion_effects_are_visible_in_the_same_response_and_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/bakery/production-runs/{runId}/complete
          - calculations.bake_day_rollups
        distinguishing_aspect: "Nothing lags: the complete response itself already carries final_labor_minutes 27.00, on_shelf_units 80 and unit_cost_basis_cents 8, and the very next reads of the BakeDay, the Ingredient and the ingredient-order list show the rolled-up actuals, the decremented on-hand and the AUTO_REORDER draft with no intervening call."
        test_recipe:
          setup:
            - "PLANNED BakeDay with one BAKING 2-rack PAR-CROIS run consuming 30 flour units per rack; flour on_hand 100 with reorder_point 120."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 100, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T04:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_id: $.data.id }
            - call: "POST /bakery/production-runs/${run_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
          trigger:
            - call: "POST /bakery/production-runs/${run_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
            - call: "GET /bakery/bake-days/${bd_id}"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "GET /bakery/ingredients/${flour_id}"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "GET /bakery/ingredient-orders?department_id=${dept_id}&origin=AUTO_REORDER"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { auto_order_id: "$.data[0].id" }
          assert:
            - "the complete response itself already shows execution_status COMPLETED, disposition_status ON_SHELF, actual_units 80, on_shelf_units 80, final_labor_minutes 27.00 and unit_cost_basis_cents 8"
            - "the immediately following bake-day read shows actual_labor_minutes 27.00, produced_units_total 81 and production_cost_cents 600 — no second read was needed"
            - "the ingredient read shows on_hand_units 40 (100 - 60) and replenishment_state ON_ORDER, both already settled by the completing call"
            - "the auto-reorder listing returns total_count == 1 and IngredientOrder.${auto_order_id}.origin == AUTO_REORDER with order_status DRAFT"
