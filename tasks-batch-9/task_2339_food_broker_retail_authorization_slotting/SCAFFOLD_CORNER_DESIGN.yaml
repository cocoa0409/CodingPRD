              as: BrokerAdmin
            - call: "GET /category-reviews/${rev}"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_v: $.data.version }
            - call: "POST /category-reviews/${rev}/decide"
              payload: { expected_review_version: "${rev_v}", authorized_item_ids: ["${i1}"], default_store_count: 400 }
              as: RetailerBuyer
