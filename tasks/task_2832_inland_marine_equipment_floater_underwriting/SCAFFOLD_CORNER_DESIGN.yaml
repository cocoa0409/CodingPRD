          assert:
            - "after setup: CoveragePart.${cp}.aggregate_limit_cents == 2000000, aggregate_available_cents == 2000000 and aggregate_paid_net_cents == 0"
            - "after setup: Claim.${clm}.adjustment_status == REPAIR_APPROVED and settlement_amount_cents == 2900000"
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_AGGREGATE_LIMIT_EXHAUSTED"
            - "after trigger[0]: Claim.${clm}.adjustment_status == REPAIR_APPROVED, settlement_paid_cents is null and settled_by_user_id is null"
            - "after trigger[0]: CoveragePart.${cp}.aggregate_available_cents == 2000000 and aggregate_paid_net_cents == 0, and no CLAIM_SETTLEMENT LedgerEntry exists for the claim"
            - "after trigger[0]: Policy.${pol}.incurred_loss_cents == 0"
