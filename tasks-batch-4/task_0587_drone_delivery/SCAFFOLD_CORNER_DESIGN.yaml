          setup: ["Clock 2026-06-01T09:00:00Z; Bay + nest N1 (3 pads); three drones at N1: N101 (100% pack, 20 h), N102 (100% pack, 5 h), N103 (90% pack, 0 h); one 2000 g order (required_energy_pct 38.6, so all three clear the energy filter)."]
