          rationale: "PriorityConfig is the scaffold's one two-axis machine (approval_status x deployment_status). The `parallel` shape claim — independent dimensions, correct combined state — is the whole premise of that §1.8 instance, which cycles NOT_DEPLOYED -> DEPLOYED -> SUSPENDED -> DEPLOYED while approval_status stays pinned at APPROVED."

  # =============================================================================================
  # SECTION 3 — calculations
  # Walks Table-3 rows (Correct Result, Input Set Filtering, Constants Applied, Precision), the
  # per-algorithm boundary rows for `threshold`, `aggregation`, `chronological`,
  # `weighted_scoring`, `waterfall_allocation` and `constraint_propagation`, and the
  # dual-variant rows, against §1.3's twelve calculations.
  # =============================================================================================
  - section: calculations
    instances:
      - name: operational_posture_threshold_ladder_including_its_precedence
        claim_type: correct_result
        grounds:
          - calculations.intersection_operational_posture
          - entities.Intersection.fields.operational_posture
          - endpoints[PATCH /signal-ops/intersections/{id}]
        distinguishing_aspect: "The posture ladder is evaluated top-down, not as an independent per-field mapping: OFFLINE comm or FAILED detection forces BLOCKED even when the other field is healthy, INTERMITTENT/PARTIAL/NONE degrade only to RESTRICTED, and a row that is simultaneously OFFLINE and PARTIAL is BLOCKED (the first branch wins) rather than RESTRICTED."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One intersection is created healthy and then walked through the ladder with PATCH."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, p_ready: $.data.operational_posture }
          trigger:
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { comm_status: "INTERMITTENT" }
              as: SignalOpsAdmin
              captures: { p_intermittent: $.data.operational_posture }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { comm_status: "ONLINE", detection_status: "PARTIAL" }
              as: SignalOpsAdmin
              captures: { p_partial: $.data.operational_posture }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "NONE" }
              as: SignalOpsAdmin
              captures: { p_none: $.data.operational_posture }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FAILED" }
              as: SignalOpsAdmin
              captures: { p_failed: $.data.operational_posture }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "PARTIAL", comm_status: "OFFLINE" }
              as: SignalOpsAdmin
              captures: { p_offline_partial: $.data.operational_posture }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FULL", comm_status: "ONLINE" }
              as: SignalOpsAdmin
              captures: { p_back_to_ready: $.data.operational_posture, i1_v_last: $.data.version }
          assert:
            - "${p_ready} == READY (ONLINE + FULL)"
            - "${p_intermittent} == RESTRICTED"
            - "${p_partial} == RESTRICTED (detection PARTIAL with healthy comm)"
            - "${p_none} == RESTRICTED (detection NONE is a degrade, not a block)"
            - "${p_failed} == BLOCKED (detection FAILED blocks even with comm ONLINE)"
            - "${p_offline_partial} == BLOCKED — the OFFLINE branch is tested before the PARTIAL branch, so the answer is BLOCKED and never RESTRICTED"
            - "${p_back_to_ready} == READY — the posture is a pure function of the two current fields, with no latching"
            - "${i1_v_last} == 7 — six PATCH writes on top of the create, each bumping Intersection.version by exactly 1"

