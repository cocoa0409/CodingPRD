              as_user_id: "${p1}"
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-08-10T00:00:00Z", focus_area: "ENVIRONMENT" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /fccn/coaching-visits/${v1}/conduct"
              payload: { visit_conducted_on: "2026-08-10T00:00:00Z", observation_score: 88, findings: "Strong routines, minor labelling gaps", critical_finding: false }
              as: QualityCoach
              as_user_id: "coach-b"
              captures: { vst: $.data.status }
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { qs1: $.data.quality_score, qt1: $.data.quality_tier, qv1: $.data.quality_variant_applied }
            - call: "POST /fccn/coaching-visits/${v1}/conduct"
              payload: { visit_conducted_on: "2026-08-10T00:00:00Z", observation_score: 40, findings: "Duplicate submission", critical_finding: false }
              as: QualityCoach
              as_user_id: "coach-b"
              captures: { err: $.data.error_id }
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { qs2: $.data.quality_score }
          assert:
            - "${vst} == COMPLETED"
            - "${qs1} == 88.00 (single completed visit; renormalised weight 0.5/0.5 = the score itself) and ${qt1} == TIER_1 and ${qv1} == COACHING_WEIGHTED"
            - "${err} == ERR_INVALID_VISIT_STATE with HTTP 409"
            - "${qs2} == 88.00 (unchanged — the refused call did not re-score with observation_score 40)"
            - "CoachingVisit.${v1}.observation_score == 88 and findings == 'Strong routines, minor labelling gaps'"

      - name: escalate_review_before_two_cap_rejections_returns_cap_rejection_limit_not_reached
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ComplianceReview.CAP_REJECTED_to_ESCALATED_TO_LICENSING
          - validations[priority=15]
          - errors[ERR_CAP_REJECTION_LIMIT_NOT_REACHED]
          - entities.ComplianceReview.fields.cap_rejection_count
        distinguishing_aspect: "The escalate transition's cap_rejection_count >= 2 precondition is enforced independently of the from-state: with the review already in CAP_REJECTED but cap_rejection_count == 1, escalate returns ERR_CAP_REJECTION_LIMIT_NOT_REACHED at HTTP 409 and no cascade fires."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract."
            - "One ComplianceReview in CAP_REJECTED after exactly one submit-cap / reject-cap round, so cap_rejection_count == 1."
          setup_api_calls:
