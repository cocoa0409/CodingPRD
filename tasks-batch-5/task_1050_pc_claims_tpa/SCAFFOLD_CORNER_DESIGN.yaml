      - name: reserve_change_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-change-stale-claim]", "validations[priority=6]"]
        distinguishing_aspect: "After reserve change A bumps the claim from version v1, a second reserve change still carrying expected_claim_version=v1 is rejected ERR_STALE_VERSION (412)."
