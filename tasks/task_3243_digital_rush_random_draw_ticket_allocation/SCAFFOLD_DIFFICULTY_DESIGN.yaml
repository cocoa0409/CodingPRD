        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${a_src}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
