              payload: { title_product_id: "${trk_id}", chart_week_id: "${wk_id}", component_kind: "STREAM_ON_DEMAND_AD", quantity: 7500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "cf-a" }
