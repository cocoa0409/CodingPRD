              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /retail-programs"
              payload: { retailer_name: "Northline Grocers", program_code: "NL-TOV-A", grade_spec: "A_ONLY", weekly_commitment_lbs: 1000.00, price_per_lb_usd: 1.85, shortfall_penalty_per_lb_usd: 0.40, priority_rank: 1, status: "ACTIVE" }
              as: GrowerManager
              captures: { prog1: $.data.id }
            - call: "POST /commitment-weeks"
              payload: { program_id: "${prog1}", iso_week: "2026-W35", week_start_date: "2026-08-24" }
              as: GrowerManager
              captures: { wk35: $.data.id, wk35_committed: $.data.committed_lbs }
            - call: "POST /commitment-weeks"
              payload: { program_id: "${prog1}", iso_week: "2026-W36", week_start_date: "2026-08-31" }
              as: GrowerManager
              captures: { wk36: $.data.id }
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-31", gross_weight_lbs: 2000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { lot_edge: $.data.id }
            - call: "POST /harvest-lots/${lot_edge}/grade"
              payload: { grade_a_lbs: 1200.00, grade_b_lbs: 700.00, cull_lbs: 100.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
            - call: "POST /harvest-lots/${lot_edge}/cold-chain-events"
              payload: { to_status: "PRECOOLED", pulp_temp_c: 10.0 }
              as: QualityInspector
