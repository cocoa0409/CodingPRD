            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_id: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a.jpg", captured_at: "2026-08-05T09:35:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /retail-reset/assignments/${asg_id}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
          assert:
            - "response error_id == ERR_INVALID_STATE (409): BEFORE photo missing"
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.Project, state_machines.ProjectStore, state_machines.Assignment, state_machines.Invoice]
        distinguishing_aspect: "Newly created Project is DRAFT, ProjectStore is PENDING, Assignment is SCHEDULED, manual Invoice is OPEN."
        test_recipe:
          setup: ["client, store, project, project-store, rep, assignment created in order"]
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Init Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "IN1", name: "Init Store", address: "34 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Init Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version", project_status: "$.data.status" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id: "$.data.id", ps_status: "$.data.status" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Init Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id", asg_status: "$.data.status" }
            - call: "POST /retail-reset/invoices"
              payload: { client_id: "${client_id}", project_id: "${project_id}" }
              as: BillingClerk
              captures: { inv_id: "$.data.id", inv_status: "$.data.status" }
          trigger:
            - call: "GET /retail-reset/projects/${project_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "Project initial status == DRAFT (captured at creation)"
            - "ProjectStore initial status == PENDING"
            - "Assignment initial status == SCHEDULED"
            - "Invoice initial status == OPEN"
      - name: terminal_invoice_void_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VOID invoice accepts no further transitions: finalize on VOID fails ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "OPEN invoice exists, then voided"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Void Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Void Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id" }
            - call: "POST /retail-reset/invoices"
              payload: { client_id: "${client_id}", project_id: "${project_id}" }
              as: BillingClerk
              captures: { inv_id: "$.data.id", inv_ver: "$.data.version" }
            - call: "POST /retail-reset/invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /retail-reset/invoices/${inv_id}/finalize"
              payload: { expected_invoice_version: "${inv_ver}" }
              as: BillingClerk
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
      - name: project_cancel_cascades_assignments
        claim_type: side_effect_execution
        grounds: [state_machines.Project.IN_FIELD_to_CANCELLED, state_machines.Assignment.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an IN_FIELD project cascades: SCHEDULED/EN_ROUTE assignments become CANCELLED and their stores become DROPPED."
        test_recipe:
          setup:
            - "project IN_FIELD with one SCHEDULED assignment"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Cx Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Cx Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "CX1", name: "Cx Store", address: "35 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Cx Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "POST /retail-reset/projects/${project_id}/cancel"
              payload: {}
