              payload: { unit_id: "${unit_id}", agreement_code: "AGR-AT-LIMIT", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-01-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
