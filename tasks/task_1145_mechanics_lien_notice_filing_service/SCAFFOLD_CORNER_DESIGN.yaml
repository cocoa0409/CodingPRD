            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-01", end_date: "2026-05-20", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n1_id: $.data.id, n1_dl: $.data.service_deadline } }
