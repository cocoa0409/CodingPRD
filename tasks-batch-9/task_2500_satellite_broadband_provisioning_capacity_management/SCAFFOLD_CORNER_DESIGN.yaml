        grounds:
          - calculations.beam_weighted_oversubscription
          - calculations.cell_slot_availability
          - 'endpoints["POST /satellite-broadband/subscriptions/{id}/suspend"]'
        distinguishing_aspect: "The two capacity ledgers use different input sets on the same event: suspension drops the subscription out of the beam's sold_set (weighted 200 -> 0) while it stays inside the cell's committed count (still 1), so a suspended service cannot be resold at the cell but its Mbps are reusable at the beam."
