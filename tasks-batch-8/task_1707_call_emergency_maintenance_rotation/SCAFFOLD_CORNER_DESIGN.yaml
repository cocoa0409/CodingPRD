            - { call: "POST /v1/pay-periods", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }, as: PropertyAdmin, captures: { pp: $.data.id } }
          trigger:
            - { call: "POST /v1/pay-periods/${pp}/close", as: PropertyAdmin }
            - { call: "GET /v1/pay-statements?pay_period_id=${pp}", as: PropertyAdmin, captures: { fin: "$.data[0].standby_pay_final_cents", mins: "$.data[0].standby_minutes_total" } }
          assert:
            - "provisional per-shift: 161000 (1400 min) and 126500 (1100 min) — sum 287500"
            - "standby_minutes_total == 2500"
            - "standby_pay_final_cents == 286750 (161000 + 1000 min full-tier 115000 + 100 min half-tier 10750)"
            - "final (286750) != provisional sum (287500) — cap tier, not rounding, drives this divergence"

