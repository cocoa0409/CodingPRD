scenario: "1003. Sneaker Drop, Raffle & Resale Authentication (StockX/GOAT style): release calendar & raffle entry, bot/fairness & purchase limit, consignment intake & authentication, condition/box grading, bid-ask or fixed pricing, payout & fee, buyer verification, dispute"
domain_name: "sneaker-raffle-resale"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"        # finite drop inventory competed for via fairness-weighted raffle draw
  secondary_archetype: "Pricing engine"          # bid-ask / fixed marketplace with tiered fees, payout, downgrade adjustments
  complexity_layers:
    - optimistic_concurrency                     # OCC on Listing.version for reprice-supersede
    - cascading_side_effects                     # verify -> payout -> account credit -> level/trust recompute (depth 3)
    - dual_variant_calculation                   # provisional vs final payout (Order); declared vs authenticated grade (ConsignmentItem)
    - rate_threshold_triggers                    # per-account purchase limit, seller-level thresholds, bot-risk breakpoint

  entity_topology: flat                          # peer entities linked by foreign keys; no nested ownership URLs
  state_machine_shape: parallel                  # Order carries independent payment_status x fulfillment_status axes
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # Order references Listing/Bid/RaffleEntry across aggregate boundaries
    - polymorphic                                # Order.source_type in {RAFFLE, FIXED, BID_MATCH} with different origin FK set
  role_model: peer_roles                         # Buyer/Seller own disjoint resource types; Authenticator/Admin/CS operate
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email; unique per account."
      - name: full_name
        type: string
        source: input
        description: "Account holder legal name (used for buyer verification / KYC)."
      - name: verification_status
        type: enum
        source: system
        description: "KYC / buyer-verification state."
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED}"
      - name: trust_score
        type: number
        source: system
        description: "0..1 reputation used in fairness scoring; starts at 0.5, recomputed on sale completion and dispute outcome."
        default: 0.5
        constraints: "0.0 <= trust_score <= 1.0"
      - name: completed_sales_count
        type: integer
        source: system
        description: "Number of orders this account has completed as SELLER; drives seller_level. Incremented on buyer verify, decremented on refund clawback."
        default: 0
      - name: seller_level
        type: enum
        source: computed
        description: "Derived from completed_sales_count: STANDARD [0,5), PRO [5,20), ELITE [20,inf). Sets transaction-fee tier."
        default: STANDARD
        constraints: "one of {STANDARD, PRO, ELITE}"
      - name: balance_cents
        type: integer
        source: system
        description: "Seller payout ledger in integer cents; credited on buyer verify, debited on refund clawback."
        default: 0
      - name: strikes
        type: integer
        source: system
        description: "Authentication-failure penalty counter; incremented when a shipped item FAILS inspection."
        default: 0

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: style_code
        type: string
        source: input
        description: "Manufacturer style code (e.g., DZ5485-612)."
      - name: name
        type: string
        source: input
        description: "Display name of the shoe model."
      - name: brand
        type: string
        source: input
        description: "Brand label."
      - name: retail_price_cents
        type: integer
        source: input
        description: "MSRP in integer cents."
        constraints: "retail_price_cents > 0"
      - name: release_category
        type: enum
        source: input
        description: "LIMITED = raffle-gated drop; GENERAL = open."
        default: GENERAL
        constraints: "one of {LIMITED, GENERAL}"

  - name: Release
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the model being dropped."
      - name: allocated_quantity
        type: integer
        source: input
        description: "Number of pairs available in this drop."
        constraints: "allocated_quantity >= 1"
      - name: release_price_cents
        type: integer
        source: input
        description: "Fixed retail price a winner pays when claiming, integer cents."
        constraints: "release_price_cents > 0"
      - name: entry_opens_at
        type: datetime
        source: input
        description: "Raffle entry window open (inclusive)."
      - name: entry_closes_at
        type: datetime
        source: input
        description: "Raffle entry window close (exclusive)."
      - name: purchase_opens_at
        type: datetime
        source: input
        description: "Claim/purchase window open (inclusive)."
      - name: purchase_closes_at
        type: datetime
        source: input
        description: "Claim/purchase window close (exclusive)."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, DRAWN, SETTLED, CANCELLED}"
      - name: entry_count
        type: integer
        source: system
        description: "Number of RaffleEntry rows created for this release."
        default: 0
      - name: winner_count
        type: integer
        source: system
        description: "Number of entries set WON by the draw."
        default: 0
      - name: reserved_units
        type: integer
        source: system
        description: "Units held for winners who have not yet claimed."
        default: 0
      - name: sold_units
        type: integer
        source: system
        description: "Units converted into claimed orders."
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: "allocated_quantity - reserved_units - sold_units (conserved-quantity invariant holds)."

  - name: RaffleEntry
    parent: null
    common_fields: true
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the entrant."
      - name: bot_risk_score
        type: number
        source: computed
        description: "0..1 bot-likelihood at entry time = min(1.0, 0.2 * max(0, entries_by_account_same_sku_last_24h - 2))."
      - name: bot_flag
        type: boolean
        source: computed
        description: "true when bot_risk_score >= BOT_RISK_THRESHOLD (0.6); flagged entries are excluded from the draw."
        default: false
      - name: fairness_score
        type: number
        source: computed
        description: "Weighted eligibility score snapshot at entry; drives draw ranking (see calculations.fairness_score)."
      - name: result
        type: enum
        source: system
        description: "Draw outcome."
        default: PENDING
        constraints: "one of {PENDING, WON, LOST}"
      - name: claim_status
        type: enum
        source: system
        description: "Post-win claim state."
        default: NONE
        constraints: "one of {NONE, CLAIMED, EXPIRED}"
      - name: claim_deadline
        type: datetime
        source: system
        description: "Set to release.purchase_closes_at when the entry is set WON; null otherwise."

  - name: Authenticator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Authentication-center or authenticator staff label."
      - name: location_code
        type: string
        source: input
        description: "Facility code."
      - name: daily_capacity
        type: integer
        source: input
        description: "Informational max inspections per day."
        default: 8
        constraints: "daily_capacity >= 1"

  - name: ConsignmentItem
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the resale order this physical item fulfills."
      - name: seller_account_id
        type: string
        source: input
        description: "FK -> Account.id; the shipping seller."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id."
      - name: authenticator_id
        type: string
        source: system
        description: "FK -> Authenticator.id; assigned when an inspection is scheduled (null until then)."
      - name: declared_condition_grade
        type: enum
        source: input
        description: "Seller-declared shoe condition."
        constraints: "one of {DEADSTOCK, VNDS, USED}"
      - name: declared_box_grade
        type: enum
        source: input
        description: "Seller-declared box condition."
        constraints: "one of {PERFECT, GOOD, DAMAGED, MISSING}"
      - name: declared_accessories_complete
        type: boolean
        source: input
        description: "Seller-declared: all extra laces/tags present."
      - name: authenticated_condition_grade
        type: enum
        source: system
        description: "Authenticator-verified shoe condition (null until inspection completed)."
        constraints: "one of {DEADSTOCK, VNDS, USED}"
      - name: authenticated_box_grade
        type: enum
        source: system
        description: "Authenticator-verified box condition (null until inspection completed)."
        constraints: "one of {PERFECT, GOOD, DAMAGED, MISSING}"
      - name: authenticated_accessories_complete
        type: boolean
        source: system
        description: "Authenticator-verified accessories completeness (null until inspection completed)."
      - name: declared_grade_score
        type: number
        source: computed
        description: "grade_score variant DECLARED computed from declared_* fields at intake."
      - name: authenticated_grade_score
        type: number
        source: computed
        description: "grade_score variant AUTHENTICATED computed from authenticated_* fields at inspection completion (null until then)."
      - name: inspection_window_start
        type: datetime
        source: input
        description: "Scheduled inspection slot start (inclusive); set on schedule-inspection."
      - name: inspection_window_end
        type: datetime
        source: input
        description: "Scheduled inspection slot end (exclusive); set on schedule-inspection."
      - name: inspection_result
        type: enum
        source: system
        description: "Inspection verdict."
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: status
        type: enum
        source: system
        description: "Physical-item lifecycle."
        default: INTAKE_PENDING
        constraints: "one of {INTAKE_PENDING, RECEIVED, UNDER_AUTHENTICATION, AUTHENTICATED, REJECTED}"

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id."
      - name: seller_account_id
        type: string
        source: input
        description: "FK -> Account.id; must equal X-User-ID of the acting Seller."
      - name: size
        type: string
        source: input
        description: "US size string (e.g., '10.5')."
      - name: condition
        type: enum
        source: input
        description: "Listed condition of the pair."
        constraints: "one of {DEADSTOCK, VNDS, USED}"
      - name: pricing_mode
        type: enum
        source: input
        description: "FIXED = buy-now only; BID_ASK = also matchable against buyer bids."
        constraints: "one of {FIXED, BID_ASK}"
      - name: ask_price_cents
        type: integer
        source: input
        description: "Ask / buy-now price in integer cents; mutated by reprice."
        constraints: "ask_price_cents > 0"
      - name: expires_at
        type: datetime
        source: input
        description: "Optional listing expiry; null = good-till-cancelled."
      - name: status
        type: enum
        source: system
        description: "Listing lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, MATCHED}"

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id."
      - name: buyer_account_id
        type: string
        source: input
        description: "FK -> Account.id; must equal X-User-ID of the acting Buyer."
      - name: size
        type: string
        source: input
        description: "Requested US size string; must match a listing's size to match."
      - name: amount_cents
        type: integer
        source: input
        description: "Bid amount in integer cents."
        constraints: "amount_cents > 0"
      - name: expires_at
        type: datetime
        source: input
        description: "Optional bid expiry; null = good-till-cancelled."
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle."
        default: OPEN
        constraints: "one of {OPEN, MATCHED}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: buyer_account_id
        type: string
        source: input
        description: "FK -> Account.id; the purchaser."
      - name: sku_id
        type: string
        source: system
        description: "FK -> Sku.id; copied from the originating listing/release/bid."
      - name: seller_account_id
        type: string
        source: system
        description: "FK -> Account.id; the seller (null for RAFFLE orders sold by the platform)."
      - name: listing_id
        type: string
        source: system
        description: "FK -> Listing.id; set for FIXED and BID_MATCH orders, null for RAFFLE."
      - name: bid_id
        type: string
        source: system
        description: "FK -> Bid.id; set for BID_MATCH orders, null otherwise."
      - name: raffle_entry_id
        type: string
        source: system
        description: "FK -> RaffleEntry.id; set for RAFFLE orders, null otherwise."
      - name: source_type
        type: enum
        source: system
        description: "Origin of the order."
        constraints: "one of {RAFFLE, FIXED, BID_MATCH}"
      - name: size
        type: string
        source: system
        description: "Size copied from origin."
      - name: sale_price_cents
        type: integer
        source: system
        description: "Agreed sale price (release_price for RAFFLE, ask for FIXED, bid amount for BID_MATCH)."
      - name: shipping_fee_cents
        type: integer
        source: system
        description: "Buyer-paid shipping, fixed at SHIPPING_FEE_CENTS."
        default: 1500
      - name: transaction_fee_cents
        type: integer
        source: computed
        description: "Platform commission; provisional at creation, recomputed final at buyer verify (see calculations.transaction_fee)."
      - name: payment_processing_fee_cents
        type: integer
        source: computed
        description: "Buyer payment processing fee (see calculations.buyer_charge_breakdown)."
      - name: buyer_total_cents
        type: integer
        source: computed
        description: "sale_price + shipping + processing, evaluation order pinned (see calculations.buyer_charge_breakdown)."
      - name: downgrade_adjustment_cents
        type: integer
        source: computed
        description: "Seller deduction applied at verify when authenticated condition is worse than listed; 0 otherwise."
        default: 0
      - name: provisional_payout_cents
        type: integer
        source: computed
        description: "Estimated seller net at order creation (see calculations.seller_payout variant PROVISIONAL)."
      - name: final_payout_cents
        type: integer
        source: computed
        description: "Settled seller net at buyer verify (see calculations.seller_payout variant FINAL); null until verify."
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (parallel dimension)."
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, CAPTURED, VOIDED, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis (parallel dimension)."
        default: AWAITING_SHIPMENT
        constraints: "one of {AWAITING_SHIPMENT, IN_AUTHENTICATION, AUTHENTICATED, FAILED_AUTH, SHIPPED_TO_BUYER, VERIFIED}"
      - name: dispute_deadline
        type: datetime
        source: system
        description: "Set to ship time + DISPUTE_WINDOW_DAYS when the order ships to buyer; null until then."

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the disputed order."
      - name: filed_by_account_id
        type: string
        source: input
        description: "FK -> Account.id; must equal the order's buyer_account_id."
      - name: reason
        type: enum
        source: input
        description: "Dispute reason."
        constraints: "one of {NOT_AS_DESCRIBED, NOT_RECEIVED, INAUTHENTIC}"
      - name: resolution_note
        type: string
        source: input
        description: "CustomerService note captured at resolution; null while OPEN."
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle."
        default: OPEN
        constraints: "one of {OPEN, RESOLVED_REFUND, RESOLVED_DENIED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Release
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /releases/{id}/open"
        actor: PlatformAdmin
        preconditions:
          - "logical clock >= entry_opens_at"
        side_effects:
          - "release accepts raffle entries"
      - from: OPEN
        to: DRAWN
        trigger: "POST /releases/{id}/draw"
        actor: PlatformAdmin
        preconditions:
          - "logical clock >= entry_closes_at"
          - "expected_release_version matches release.version"
          - "at least one eligible entry exists (result=PENDING AND bot_flag=false); else ERR_NO_ELIGIBLE_ENTRIES"
        side_effects:
          - "run calculations.raffle_allocation: rank eligible entries, set up to allocated_quantity to WON, remainder to LOST"
          - "each newly WON RaffleEntry: claim_deadline = release.purchase_closes_at (transitive cascade link)"
          - "reserved_units += winner_count; winner_count set"
          - "increments Release.version by 1"
      - from: DRAWN
        to: SETTLED
        trigger: "POST /releases/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "logical clock >= purchase_closes_at"
        side_effects:
          - "every WON RaffleEntry with claim_status=NONE -> claim_status=EXPIRED (compensating release)"
          - "reserved_units -= count(expired winners); freed units return to available_units (unit-conservation invariant)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /releases/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "no entries can be created"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /releases/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "all PENDING RaffleEntry rows -> LOST (cascade down)"

  - entity: RaffleEntry
    initial_state: PENDING
    terminal_states: [LOST]
    transitions:
      - from: PENDING
        to: WON
        trigger: "system: POST /releases/{id}/draw selection"
        actor: system
        preconditions:
          - "entry ranked within allocated_quantity by fairness_score DESC, created_at ASC"
          - "bot_flag = false"
        side_effects:
          - "claim_deadline = release.purchase_closes_at"
      - from: PENDING
        to: LOST
        trigger: "system: POST /releases/{id}/draw non-selection OR POST /releases/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: WON
        to: WON
        trigger: "POST /raffle-entries/{id}/claim (claim_status NONE -> CLAIMED)"
        actor: Buyer
        preconditions:
          - "release.status = DRAWN (cross-entity dependency on Release)"
          - "purchase_opens_at <= clock < purchase_closes_at; else ERR_PURCHASE_WINDOW_CLOSED"
          - "claim_status = NONE; else ERR_ENTRY_ALREADY_CLAIMED"
        side_effects:
          - "claim_status = CLAIMED"
          - "create Order(source_type=RAFFLE, sale_price=release.release_price_cents)"
          - "release.reserved_units -= 1; release.sold_units += 1 (unit-conservation invariant)"
    note: "WON is not terminal: claim (WON->WON with claim_status flip) and settle-driven expiry both act on it."

  - entity: ConsignmentItem
    initial_state: INTAKE_PENDING
    terminal_states: [AUTHENTICATED, REJECTED]
    transitions:
      - from: INTAKE_PENDING
        to: RECEIVED
        trigger: "POST /consignment-items/{id}/receive"
        actor: Authenticator
        preconditions: []
        side_effects:
          - "order.fulfillment_status = IN_AUTHENTICATION (cross-entity)"
      - from: RECEIVED
        to: UNDER_AUTHENTICATION
        trigger: "POST /consignment-items/{id}/schedule-inspection"
        actor: Authenticator
        preconditions:
          - "requested [inspection_window_start, inspection_window_end) does not overlap another UNDER_AUTHENTICATION item on the same authenticator_id (half-open; back-to-back allowed); else ERR_AUTHENTICATOR_UNAVAILABLE"
        side_effects:
          - "authenticator_id, inspection_window_start, inspection_window_end set"
      - from: UNDER_AUTHENTICATION
        to: AUTHENTICATED
        trigger: "POST /consignment-items/{id}/complete-inspection (inspection_result=PASS)"
        actor: Authenticator
        preconditions:
          - "inspection_result = PASS"
        side_effects:
          - "authenticated_* fields set; authenticated_grade_score computed (calculations.grade_score variant AUTHENTICATED)"
          - "order.fulfillment_status = AUTHENTICATED (cross-entity)"
      - from: UNDER_AUTHENTICATION
        to: REJECTED
        trigger: "POST /consignment-items/{id}/complete-inspection (inspection_result=FAIL)"
        actor: Authenticator
        preconditions:
          - "inspection_result = FAIL"
        side_effects:
          - "order.fulfillment_status = FAILED_AUTH; order.payment_status = VOIDED (cross-entity, divergent branch)"
          - "seller Account.strikes += 1"
    note: "Fork at UNDER_AUTHENTICATION -> {AUTHENTICATED, REJECTED} with divergent side-effect sets (non-linear shape); both are terminal for the item."

  - entity: Order
    initial_state: AWAITING_SHIPMENT
    terminal_states: []
    transitions:
      - from: AWAITING_SHIPMENT
        to: IN_AUTHENTICATION
        trigger: "system: POST /consignment-items/{id}/receive on the item for this order"
        actor: system
        preconditions:
          - "source_type in {FIXED, BID_MATCH}"
        side_effects:
          - "fulfillment_status advances on the fulfillment axis; payment_status stays AUTHORIZED (parallel axes)"
      - from: IN_AUTHENTICATION
        to: AUTHENTICATED
        trigger: "system: ConsignmentItem PASS"
        actor: system
        preconditions:
          - "ConsignmentItem.status = AUTHENTICATED (cross-entity dependency)"
        side_effects: []
      - from: IN_AUTHENTICATION
        to: FAILED_AUTH
        trigger: "system: ConsignmentItem FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status = VOIDED"
      - from: AUTHENTICATED
        to: SHIPPED_TO_BUYER
        trigger: "POST /orders/{id}/ship-to-buyer"
        actor: PlatformAdmin
        preconditions:
          - "for FIXED/BID_MATCH: linked ConsignmentItem.status = AUTHENTICATED; else ERR_ITEM_NOT_AUTHENTICATED"
        side_effects:
          - "dispute_deadline = clock + DISPUTE_WINDOW_DAYS"
      - from: AWAITING_SHIPMENT
        to: SHIPPED_TO_BUYER
        trigger: "POST /orders/{id}/ship-to-buyer"
        actor: PlatformAdmin
        preconditions:
          - "source_type = RAFFLE (platform ships new pair directly; no authentication)"
        side_effects:
          - "dispute_deadline = clock + DISPUTE_WINDOW_DAYS"
      - from: SHIPPED_TO_BUYER
        to: VERIFIED
        trigger: "POST /orders/{id}/verify"
        actor: Buyer
        preconditions:
          - "payment_status = AUTHORIZED"
        side_effects:
          - "payment_status = CAPTURED (parallel axis advance)"
          - "compute downgrade_adjustment_cents and final_payout_cents (calculations.seller_payout variant FINAL)"
          - "for FIXED/BID_MATCH: seller Account.balance_cents += final_payout_cents; seller Account.completed_sales_count += 1 (cascade link 1)"
          - "recompute seller Account.seller_level from completed_sales_count (cascade link 2)"
          - "recompute seller Account.trust_score (cascade link 3)"
      - from: VERIFIED
        to: VERIFIED
        trigger: "system: POST /disputes/{id}/resolve (RESOLVED_REFUND) — compensation, no fulfillment change"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status = REFUNDED"
    note: "payment_status and fulfillment_status are independent parallel dimensions on the same row."

  - entity: Listing
    initial_state: ACTIVE
    terminal_states: [MATCHED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /listings/{id}/reprice (ask_price_cents supersede)"
        actor: Seller
        preconditions:
          - "expected_listing_version matches listing.version; else ERR_STALE_VERSION"
        side_effects:
          - "ask_price_cents = new_ask_price_cents"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: MATCHED
        trigger: "POST /listings/{id}/buy OR POST /listings/{id}/match"
        actor: Buyer
        preconditions:
          - "listing.status = ACTIVE; else ERR_LISTING_NOT_ACTIVE"
          - "buy only: buyer's count of FIXED buys of this sku_id in the last 24h < BUY_LIMIT_PER_SKU_24H (2); else ERR_PURCHASE_LIMIT_REACHED"
        side_effects:
          - "create Order; if matched via bid, set the Bid MATCHED"
          - "increments Listing.version by 1"
    note: "reprice is a self-loop supersede guarded by OCC on version."

  - entity: Bid
    initial_state: OPEN
    terminal_states: [MATCHED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "system: POST /listings/{id}/match with bid_id"
        actor: system
        preconditions:
          - "bid.sku_id = listing.sku_id AND bid.size = listing.size; else ERR_SKU_MISMATCH"
          - "bid.amount_cents >= listing.ask_price_cents; else ERR_BID_BELOW_ASK"
        side_effects:
          - "create Order(source_type=BID_MATCH, sale_price=bid.amount_cents)"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_REFUND, RESOLVED_DENIED]
    transitions:
      - from: OPEN
        to: RESOLVED_REFUND
        trigger: "POST /disputes/{id}/resolve (outcome=REFUND)"
        actor: CustomerService
        preconditions:
          - "dispute.status = OPEN; else ERR_DISPUTE_ALREADY_RESOLVED"
        side_effects:
          - "order.payment_status = REFUNDED (cascade link 1)"
          - "for FIXED/BID_MATCH: seller Account.balance_cents -= order.final_payout_cents; seller Account.completed_sales_count -= 1 (cascade link 2)"
          - "recompute seller Account.seller_level and trust_score (cascade link 3)"
      - from: OPEN
        to: RESOLVED_DENIED
        trigger: "POST /disputes/{id}/resolve (outcome=DENY)"
        actor: CustomerService
        preconditions:
          - "dispute.status = OPEN; else ERR_DISPUTE_ALREADY_RESOLVED"
        side_effects:
          - "no ledger change; order unchanged"
    note: "Branching fork at resolve with divergent side-effect sets (REFUND vs DENY)."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: listing-reprice-stale
    parent_entity: Listing
    write_endpoint: "POST /listings/{id}/reprice"
    occ_field: "expected_listing_version"
    description: |
      Repricing an ACTIVE Listing whose version has advanced since the seller
      last observed it is rejected. Repricing is always permitted while a
      listing is ACTIVE, so a reprice that carries a stale version would
      otherwise succeed and clobber an intervening price supersede; the OCC
      check reduces this to a stale-version comparison and rejects the loser.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: transaction_fee
    trigger: "on Order creation (provisional) and on POST /orders/{id}/verify (final)"
    algorithm: tiered_pricing
    formula: |
      base_rate = { STANDARD: 0.09, PRO: 0.07, ELITE: 0.05 }[seller_level]
      band_adj  = 0.01 if sale_price_cents >= HIGH_VALUE_CENTS else 0.00
      eff_rate  = base_rate - band_adj
      raw       = round_half_up(sale_price_cents * eff_rate)     # to integer cents
      transaction_fee_cents = max(MIN_FEE_CENTS, min(MAX_FEE_CENTS, raw))
    input_set: "single Order; seller_level read from the seller Account at the moment of evaluation"
    constants:
      HIGH_VALUE_CENTS: 50000
      MIN_FEE_CENTS: 500
      MAX_FEE_CENTS: 10000
    precision: "integer cents, round_half_up before clamping"
    variants:
      - name: PROVISIONAL
        when: "computed at order creation using seller_level at creation time"
        difference: "may differ from FINAL if seller_level changes before verify"
      - name: FINAL
        when: "recomputed at buyer verify using seller_level at verify time"
        difference: "re-reads seller_level; drives final_payout"

  - name: buyer_charge_breakdown
    trigger: "on Order creation"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED to break the circular-looking definition:
      # processing fee is charged on the PRE-FEE subtotal, never on the grand total.
      subtotal_cents  = sale_price_cents + shipping_fee_cents
      payment_processing_fee_cents = round_half_up(PROCESSING_PCT * subtotal_cents + PROCESSING_FLAT_CENTS)
      buyer_total_cents = sale_price_cents + shipping_fee_cents + payment_processing_fee_cents
    input_set: "single Order"
    constants:
      PROCESSING_PCT: 0.029
      PROCESSING_FLAT_CENTS: 30
      SHIPPING_FEE_CENTS: 1500
    precision: "integer cents, round_half_up on the processing fee only; buyer_total is an exact sum of integer cents"

  - name: seller_payout
    trigger: "on Order creation (provisional) and on POST /orders/{id}/verify (final)"
    algorithm: aggregation
    formula: |
      # Nested-rounding order PINNED: transaction_fee is rounded to whole cents
      # FIRST (see transaction_fee), THEN subtracted; do NOT round the net again.
      downgrade_adjustment_cents =
        round_half_up(DOWNGRADE_PENALTY_PCT * sale_price_cents)
          if rank(authenticated_condition_grade) < rank(declared_condition_grade)
          else 0
      # rank: DEADSTOCK=3, VNDS=2, USED=1
      net = sale_price_cents - transaction_fee_cents - downgrade_adjustment_cents
    input_set: "single Order plus its linked ConsignmentItem for the authenticated grade"
    constants:
      DOWNGRADE_PENALTY_PCT: 0.15
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "at order creation; downgrade_adjustment_cents forced to 0 (item not yet inspected)"
        difference: "provisional_payout_cents = sale_price_cents - transaction_fee_cents(PROVISIONAL)"
      - name: FINAL
        when: "at buyer verify; downgrade_adjustment_cents computed from the authenticated grade"
        difference: "final_payout_cents = sale_price_cents - transaction_fee_cents(FINAL) - downgrade_adjustment_cents; diverges from provisional whenever a downgrade applies or seller_level changed"

  - name: grade_score
    trigger: "declared: on ConsignmentItem intake; authenticated: on inspection completion (PASS)"
    algorithm: weighted_scoring
    formula: |
      cond_val = { DEADSTOCK: 1.0, VNDS: 0.85, USED: 0.6 }[condition_grade]
      box_val  = { PERFECT: 1.0, GOOD: 0.8, DAMAGED: 0.5, MISSING: 0.0 }[box_grade]
      acc_val  = 1.0 if accessories_complete else 0.0
      # Sum weighted terms at full precision, THEN round the total to 4 places.
      grade_score = round_half_up(0.6*cond_val + 0.25*box_val + 0.15*acc_val, 4)
    input_set: "single ConsignmentItem; DECLARED variant reads declared_* fields, AUTHENTICATED reads authenticated_* fields"
    constants:
      W_CONDITION: 0.60
      W_BOX: 0.25
      W_ACCESSORIES: 0.15
    precision: "4 decimal places, round_half_up on the summed total"
    variants:
      - name: DECLARED
        when: "at intake from seller-declared fields"
        difference: "declared_grade_score"
      - name: AUTHENTICATED
        when: "at inspection completion from authenticator-verified fields"
        difference: "authenticated_grade_score; diverges from DECLARED when inspection downgrades condition/box/accessories"

  - name: fairness_score
    trigger: "on POST /releases/{id}/enter (snapshot at entry)"
    algorithm: weighted_scoring
    formula: |
      tenure_days = floor((clock_now - account.created_at) / 86400 seconds)
      tenure_factor = 1.0 if tenure_days >= 30 else (0.5 if tenure_days >= 7 else 0.0)
      bot_risk_score = min(1.0, 0.2 * max(0, entries_by_account_same_sku_last_24h - 2))
      fairness_score = round_half_up(0.5*account.trust_score + 0.3*tenure_factor + 0.2*(1 - bot_risk_score), 4)
    input_set: "one RaffleEntry at entry time; account trust/tenure read from Account and logical clock"
    constants:
      W_TRUST: 0.5
      W_TENURE: 0.3
      W_BOTRISK: 0.2
      BOT_RISK_THRESHOLD: 0.6
    precision: "4 decimal places, round_half_up on the summed total"

  - name: raffle_allocation
    trigger: "on POST /releases/{id}/draw"
    algorithm: waterfall_allocation
    formula: |
      eligible = [ e for e in release.entries if e.result == PENDING and e.bot_flag == false ]
      if len(eligible) == 0: raise ERR_NO_ELIGIBLE_ENTRIES
      ranked = sort(eligible, key = (-fairness_score, created_at ASC))    # id NEVER used
      winners = ranked[0 : min(allocated_quantity, len(ranked))]
      set winners.result = WON; set all other eligible.result = LOST
    input_set: "all RaffleEntry rows of the release; eligibility filter = result PENDING AND bot_flag false"
    constants: {}
    precision: "integer unit counts"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires PlatformAdmin"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path/body-referenced Account exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing an account id"
  - priority: 4
    category: existence
    check: "path/body-referenced Sku exists"
    error_id: ERR_SKU_NOT_FOUND
    http_status: 404
    applies_to: "POST /releases, POST /listings, POST /bids"
  - priority: 5
    category: existence
    check: "path Release exists"
    error_id: ERR_RELEASE_NOT_FOUND
    http_status: 404
    applies_to: "/releases/{id}/*"
  - priority: 6
    category: existence
    check: "path RaffleEntry exists"
    error_id: ERR_RAFFLE_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "/raffle-entries/{id}/*"
  - priority: 7
    category: existence
    check: "path ConsignmentItem exists"
    error_id: ERR_CONSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "/consignment-items/{id}/*"
  - priority: 8
    category: existence
    check: "path/body Authenticator exists"
    error_id: ERR_AUTHENTICATOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /consignment-items/{id}/schedule-inspection"
  - priority: 9
    category: existence
    check: "path Listing (and body bid for match) exists"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "/listings/{id}/*"
  - priority: 10
    category: existence
    check: "body Bid exists"
    error_id: ERR_BID_NOT_FOUND
    http_status: 404
    applies_to: "POST /listings/{id}/match"
  - priority: 11
    category: existence
    check: "path/body Order exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "/orders/{id}/*, POST /consignment-items, POST /disputes"
  - priority: 12
    category: existence
    check: "path Dispute exists"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "/disputes/{id}/*"
  - priority: 13
    category: state
    check: "request body conforms to endpoint input schema (required fields present, enums valid, integers > 0 where noted, window start < end)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 14
    category: state
    check: "OCC: expected_listing_version equals listing.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /listings/{id}/reprice"
  - priority: 15
    category: state
    check: "Release is OPEN for entry"
    error_id: ERR_RELEASE_NOT_OPEN
    http_status: 409
    applies_to: "POST /releases/{id}/enter"
  - priority: 16
    category: state
    check: "Release is DRAWN for a claim / draw not repeated"
    error_id: ERR_RELEASE_NOT_DRAWN
    http_status: 409
    applies_to: "POST /raffle-entries/{id}/claim, POST /releases/{id}/draw"
  - priority: 17
    category: state
    check: "RaffleEntry.result = WON before claim"
    error_id: ERR_ENTRY_NOT_WON
    http_status: 409
    applies_to: "POST /raffle-entries/{id}/claim"
  - priority: 18
    category: state
    check: "RaffleEntry.claim_status = NONE (not already claimed)"
    error_id: ERR_ENTRY_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /raffle-entries/{id}/claim"
  - priority: 19
    category: state
    check: "Listing.status = ACTIVE before buy/match/reprice"
    error_id: ERR_LISTING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /listings/{id}/buy, POST /listings/{id}/match, POST /listings/{id}/reprice"
  - priority: 20
    category: state
    check: "ConsignmentItem.status = RECEIVED before scheduling / = UNDER_AUTHENTICATION before completion / = INTAKE_PENDING before receive"
    error_id: ERR_CONSIGNMENT_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/receive, /schedule-inspection, /complete-inspection"
  - priority: 21
    category: state
    check: "For FIXED/BID_MATCH orders, linked ConsignmentItem.status = AUTHENTICATED before ship-to-buyer"
    error_id: ERR_ITEM_NOT_AUTHENTICATED
    http_status: 409
    applies_to: "POST /orders/{id}/ship-to-buyer"
  - priority: 22
    category: state
    check: "Order in AUTHENTICATED (resale) or AWAITING_SHIPMENT (raffle) before ship-to-buyer; in SHIPPED_TO_BUYER before verify"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /orders/{id}/ship-to-buyer, POST /orders/{id}/verify"
  - priority: 23
    category: state
    check: "Order fulfillment in {SHIPPED_TO_BUYER, VERIFIED} to be disputable"
    error_id: ERR_ORDER_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 24
    category: state
    check: "Dispute.status = OPEN before resolve"
    error_id: ERR_DISPUTE_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 25
    category: business_safety
    check: "acting Account.verification_status = VERIFIED"
    error_id: ERR_ACCOUNT_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /releases/{id}/enter, POST /listings/{id}/buy, POST /listings/{id}/match"
  - priority: 26
    category: business_safety
    check: "account tenure_days >= MIN_ACCOUNT_AGE_DAYS (3) at entry"
    error_id: ERR_BOT_FLAGGED
    http_status: 403
    applies_to: "POST /releases/{id}/enter"
  - priority: 27
    category: business_safety
    check: "buyer_account_id != listing.seller_account_id"
    error_id: ERR_SELF_PURCHASE
    http_status: 403
    applies_to: "POST /listings/{id}/buy, POST /listings/{id}/match"
  - priority: 28
    category: business_temporal
    check: "same-sku release windows [entry_opens_at, purchase_closes_at] keep >= RELEASE_COOLDOWN_HOURS (24) gap from any non-CANCELLED release of that sku"
    error_id: ERR_RELEASE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /releases"
  - priority: 29
    category: business_temporal
    check: "entry_opens_at <= clock < entry_closes_at at entry"
    error_id: ERR_ENTRY_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /releases/{id}/enter"
  - priority: 30
    category: business_temporal
    check: "purchase_opens_at <= clock < purchase_closes_at at claim"
    error_id: ERR_PURCHASE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /raffle-entries/{id}/claim"
  - priority: 31
    category: business_temporal
    check: "requested inspection slot does not overlap another UNDER_AUTHENTICATION slot on same authenticator (half-open)"
    error_id: ERR_AUTHENTICATOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /consignment-items/{id}/schedule-inspection"
  - priority: 32
    category: business_temporal
    check: "clock <= order.dispute_deadline at filing"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 33
    category: business_referential
    check: "bid.sku_id = listing.sku_id AND bid.size = listing.size"
    error_id: ERR_SKU_MISMATCH
    http_status: 422
    applies_to: "POST /listings/{id}/match"
  - priority: 34
    category: business_constraint
    check: "account has not already entered this release"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /releases/{id}/enter"
  - priority: 35
    category: business_constraint
    check: "buyer's count of FIXED buys of this sku_id in the trailing 24h window (measured against the logical clock) < BUY_LIMIT_PER_SKU_24H (2)"
    error_id: ERR_PURCHASE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /listings/{id}/buy"
  - priority: 36
    category: business_constraint
    check: "at least one eligible entry (result PENDING, bot_flag false) at draw"
    error_id: ERR_NO_ELIGIBLE_ENTRIES
    http_status: 422
    applies_to: "POST /releases/{id}/draw"
  - priority: 37
    category: business_fiscal
    check: "bid.amount_cents >= listing.ask_price_cents at match"
    error_id: ERR_BID_BELOW_ASK
    http_status: 422
    applies_to: "POST /listings/{id}/match"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- setup / configuration ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/accounts"
    description: "Create an account (operator onboarding)."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name]
    output: Account
    side_effects: ["Account created UNVERIFIED, trust_score 0.5, seller_level STANDARD"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account."
    roles: [Buyer, Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/accounts/{id}/verify"
    description: "Mark an account VERIFIED (buyer/seller KYC)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["verification_status = VERIFIED"]

  - method: POST
    path: "/skus"
    description: "Create a SKU."
    roles: [PlatformAdmin]
    code: 201
    input: [style_code, name, brand, retail_price_cents, "release_category?"]
    output: Sku
    side_effects: []
  - method: GET
    path: "/skus/{id}"
    description: "Fetch a SKU."
    roles: [Buyer, Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Sku
    side_effects: []

  - method: POST
    path: "/authenticators"
    description: "Register an authentication center/staff."
    roles: [PlatformAdmin]
    code: 201
    input: [name, location_code, "daily_capacity?"]
    output: Authenticator
    side_effects: []
  - method: GET
    path: "/authenticators/{id}"
    description: "Fetch an authenticator."
    roles: [Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Authenticator
    side_effects: []

  # --- releases & raffle ---
  - method: POST
    path: "/releases"
    description: "Schedule a drop for a SKU."
    roles: [PlatformAdmin]
    code: 201
    input: [sku_id, allocated_quantity, release_price_cents, entry_opens_at, entry_closes_at, purchase_opens_at, purchase_closes_at]
    output: Release
    side_effects: ["Release SCHEDULED; ERR_RELEASE_WINDOW_OVERLAP if it violates same-sku cooldown"]
  - method: GET
    path: "/releases/{id}"
    description: "Fetch a release."
    roles: [Buyer, Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: GET
    path: "/releases"
    description: "List releases, optionally filtered by sku (reverse-reachability for Release.sku_id)."
    roles: [Buyer, Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: ["sku_id?", "status?", "limit?", "offset?"]
    output: Release[]
    side_effects: []
  - method: POST
    path: "/releases/{id}/open"
    description: "Open the raffle entry window."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Release
    side_effects: ["status SCHEDULED -> OPEN"]
  - method: POST
    path: "/releases/{id}/draw"
    description: "Run the fairness-weighted draw."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_release_version]
    output: Release
    side_effects: ["raffle_allocation runs; winners WON, losers LOST; reserved_units/winner_count set; increments Release.version by 1"]
  - method: POST
    path: "/releases/{id}/settle"
    description: "Close the purchase window; expire unclaimed winners."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Release
    side_effects: ["unclaimed WON entries -> EXPIRED; reserved_units freed to available_units; status DRAWN -> SETTLED"]
  - method: POST
    path: "/releases/{id}/cancel"
    description: "Cancel a scheduled/open release."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> CANCELLED; PENDING entries -> LOST"]
  - method: POST
    path: "/releases/{id}/enter"
    description: "Enter the raffle (acting Buyer)."
    roles: [Buyer]
    code: 201
    input: []
    output: RaffleEntry
    side_effects: ["RaffleEntry created; fairness_score, bot_risk_score, bot_flag computed; release.entry_count += 1"]

  - method: GET
    path: "/raffle-entries/{id}"
    description: "Fetch a raffle entry."
    roles: [Buyer, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: RaffleEntry
    side_effects: []
  - method: GET
    path: "/raffle-entries"
    description: "List raffle entries filtered by release and/or account (reverse-reachability for RaffleEntry.release_id and RaffleEntry.account_id)."
    roles: [Buyer, PlatformAdmin, CustomerService]
    code: 200
    input: ["release_id?", "account_id?", "result?", "limit?", "offset?"]
    output: RaffleEntry[]
    side_effects: []
  - method: POST
    path: "/raffle-entries/{id}/claim"
    description: "Claim a won entry, creating a RAFFLE order."
    roles: [Buyer]
    code: 201
    input: []
    output: Order
    side_effects: ["claim_status CLAIMED; Order(source RAFFLE) created; reserved_units -= 1; sold_units += 1"]

  # --- listings, bids, orders (resale) ---
  - method: POST
    path: "/listings"
    description: "Create a resale ask (acting Seller)."
    roles: [Seller]
    code: 201
    input: [sku_id, seller_account_id, size, condition, pricing_mode, ask_price_cents, "expires_at?"]
    output: Listing
    side_effects: ["Listing ACTIVE"]
  - method: GET
    path: "/listings/{id}"
    description: "Fetch a listing."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: GET
    path: "/listings"
    description: "List listings filtered by sku and/or seller (reverse-reachability for Listing.sku_id and Listing.seller_account_id)."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: ["sku_id?", "seller_account_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []
  - method: POST
    path: "/listings/{id}/reprice"
    description: "Reprice an ACTIVE listing (OCC on version)."
    roles: [Seller]
    code: 200
    input: [new_ask_price_cents, expected_listing_version]
    output: Listing
    side_effects: ["ask_price_cents updated; increments Listing.version by 1"]
  - method: POST
    path: "/listings/{id}/buy"
    description: "Buy-now at the ask (acting Buyer)."
    roles: [Buyer]
    code: 201
    input: []
    output: Order
    side_effects: ["Order(source FIXED) created; listing MATCHED; increments Listing.version by 1; provisional fees/payout computed"]
  - method: POST
    path: "/listings/{id}/match"
    description: "Seller matches this listing to an existing buyer bid (OCC on listing version)."
    roles: [Seller]
    code: 201
    input: [bid_id, expected_listing_version]
    output: Order
    side_effects: ["Bid MATCHED; Order(source BID_MATCH) created; listing MATCHED; increments Listing.version by 1"]

  - method: POST
    path: "/bids"
    description: "Place a buyer bid on a SKU/size (acting Buyer)."
    roles: [Buyer]
    code: 201
    input: [sku_id, buyer_account_id, size, amount_cents, "expires_at?"]
    output: Bid
    side_effects: ["Bid OPEN"]
  - method: GET
    path: "/bids/{id}"
    description: "Fetch a bid."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/bids"
    description: "List bids filtered by sku and/or buyer (reverse-reachability for Bid.sku_id and Bid.buyer_account_id)."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: ["sku_id?", "buyer_account_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders filtered by buyer/seller/sku/listing/bid/raffle-entry (reverse-reachability for all Order FKs)."
    roles: [Buyer, Seller, PlatformAdmin, CustomerService]
    code: 200
    input: ["buyer_account_id?", "seller_account_id?", "sku_id?", "listing_id?", "bid_id?", "raffle_entry_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/ship-to-buyer"
    description: "Platform ships the authenticated pair (resale) or the new pair (raffle) to the buyer."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status -> SHIPPED_TO_BUYER; dispute_deadline set"]
  - method: POST
    path: "/orders/{id}/verify"
    description: "Buyer verification: confirm receipt/authenticity, capturing payment and finalizing payout."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["payment CAPTURED; final payout computed; seller credited; seller completed_sales_count/level/trust recomputed"]

  # --- consignment intake & authentication ---
  - method: POST
    path: "/consignment-items"
    description: "Seller ships the sold item in for authentication (creates the ConsignmentItem for a resale order)."
    roles: [Seller]
    code: 201
    input: [order_id, seller_account_id, sku_id, declared_condition_grade, declared_box_grade, declared_accessories_complete]
    output: ConsignmentItem
    side_effects: ["ConsignmentItem INTAKE_PENDING; declared_grade_score computed"]
  - method: GET
    path: "/consignment-items/{id}"
    description: "Fetch a consignment item."
    roles: [Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: ConsignmentItem
    side_effects: []
  - method: GET
    path: "/consignment-items"
    description: "List consignment items filtered by order/seller/sku/authenticator (reverse-reachability for ConsignmentItem.order_id, .seller_account_id, .sku_id, .authenticator_id)."
    roles: [Seller, Authenticator, PlatformAdmin, CustomerService]
    code: 200
    input: ["order_id?", "seller_account_id?", "sku_id?", "authenticator_id?", "status?", "limit?", "offset?"]
    output: ConsignmentItem[]
    side_effects: []
  - method: POST
    path: "/consignment-items/{id}/receive"
    description: "Authenticator confirms physical receipt."
    roles: [Authenticator]
    code: 200
    input: []
    output: ConsignmentItem
    side_effects: ["status INTAKE_PENDING -> RECEIVED; order.fulfillment_status -> IN_AUTHENTICATION"]
  - method: POST
    path: "/consignment-items/{id}/schedule-inspection"
    description: "Book an inspection slot on an authenticator (half-open interval; overlap rejected)."
    roles: [Authenticator]
    code: 200
    input: [authenticator_id, inspection_window_start, inspection_window_end]
    output: ConsignmentItem
    side_effects: ["status RECEIVED -> UNDER_AUTHENTICATION; authenticator_id and window set"]
  - method: POST
    path: "/consignment-items/{id}/complete-inspection"
    description: "Record the inspection verdict and authenticated grades."
    roles: [Authenticator]
    code: 200
    input: [inspection_result, "authenticated_condition_grade?", "authenticated_box_grade?", "authenticated_accessories_complete?"]
    output: ConsignmentItem
    side_effects: ["PASS -> AUTHENTICATED + order AUTHENTICATED + authenticated_grade_score; FAIL -> REJECTED + order FAILED_AUTH/payment VOIDED + seller strike"]

  # --- disputes ---
  - method: POST
    path: "/disputes"
    description: "Buyer files a dispute on a shipped/verified order."
    roles: [Buyer]
    code: 201
    input: [order_id, filed_by_account_id, reason]
    output: Dispute
    side_effects: ["Dispute OPEN"]
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch a dispute."
    roles: [Buyer, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes filtered by order and/or filer (reverse-reachability for Dispute.order_id and Dispute.filed_by_account_id)."
    roles: [Buyer, PlatformAdmin, CustomerService]
    code: 200
    input: ["order_id?", "filed_by_account_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "CustomerService resolves a dispute (REFUND clawback or DENY)."
    roles: [CustomerService]
    code: 200
    input: [outcome, "resolution_note?"]
    output: Dispute
    side_effects: ["REFUND: order REFUNDED, seller payout clawed back, level/trust recomputed; DENY: no ledger change"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation (or acting entity_backed id not the resource owner)"
  - id: ERR_VALIDATION
    http: 422
    condition: "malformed body: missing required field, bad enum, non-positive amount, or window start >= end"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "referenced account id does not exist"
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "referenced sku id does not exist"
  - id: ERR_RELEASE_NOT_FOUND
    http: 404
    condition: "referenced release id does not exist"
  - id: ERR_RAFFLE_ENTRY_NOT_FOUND
    http: 404
    condition: "referenced raffle entry id does not exist"
  - id: ERR_CONSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced consignment item id does not exist"
  - id: ERR_AUTHENTICATOR_NOT_FOUND
    http: 404
    condition: "referenced authenticator id does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "referenced listing id does not exist"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "referenced bid id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "referenced order id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "referenced dispute id does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_listing_version does not match the current Listing.version"
  - id: ERR_RELEASE_NOT_OPEN
    http: 409
    condition: "entering a release that is not OPEN"
  - id: ERR_RELEASE_NOT_DRAWN
    http: 409
    condition: "claiming before draw, or drawing a release not in OPEN"
  - id: ERR_ENTRY_NOT_WON
    http: 409
    condition: "claiming an entry whose result is not WON"
  - id: ERR_ENTRY_ALREADY_CLAIMED
    http: 409
    condition: "claiming an entry already CLAIMED or EXPIRED"
  - id: ERR_LISTING_NOT_ACTIVE
    http: 409
    condition: "buy/match/reprice on a listing not ACTIVE"
  - id: ERR_CONSIGNMENT_NOT_RECEIVED
    http: 409
    condition: "consignment transition attempted from the wrong status (receive/schedule/complete out of order)"
  - id: ERR_ITEM_NOT_AUTHENTICATED
    http: 409
    condition: "shipping a resale order whose linked consignment item is not AUTHENTICATED"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "order not in a valid fulfillment state for ship-to-buyer or verify"
  - id: ERR_ORDER_NOT_DISPUTABLE
    http: 409
    condition: "filing a dispute on an order not in SHIPPED_TO_BUYER or VERIFIED"
  - id: ERR_DISPUTE_ALREADY_RESOLVED
    http: 409
    condition: "resolving a dispute not in OPEN"
  - id: ERR_ACCOUNT_NOT_VERIFIED
    http: 403
    condition: "entering/buying/matching with an UNVERIFIED account"
  - id: ERR_BOT_FLAGGED
    http: 403
    condition: "entering with an account younger than MIN_ACCOUNT_AGE_DAYS (bot heuristic)"
  - id: ERR_SELF_PURCHASE
    http: 403
    condition: "buyer_account_id equals the listing's seller_account_id"
  - id: ERR_RELEASE_WINDOW_OVERLAP
    http: 409
    condition: "new release window collides with a same-sku release inside the cooldown buffer"
  - id: ERR_ENTRY_WINDOW_CLOSED
    http: 422
    condition: "clock outside [entry_opens_at, entry_closes_at) at entry"
  - id: ERR_PURCHASE_WINDOW_CLOSED
    http: 422
    condition: "clock outside [purchase_opens_at, purchase_closes_at) at claim"
  - id: ERR_AUTHENTICATOR_UNAVAILABLE
    http: 409
    condition: "requested inspection slot overlaps another scheduled slot on the same authenticator"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "clock past order.dispute_deadline at filing"
  - id: ERR_SKU_MISMATCH
    http: 422
    condition: "bid sku/size does not match the listing on match"
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "account already has a raffle entry for this release"
  - id: ERR_PURCHASE_LIMIT_REACHED
    http: 409
    condition: "buyer already made BUY_LIMIT_PER_SKU_24H (2) FIXED buys of this sku in the trailing 24h window"
  - id: ERR_NO_ELIGIBLE_ENTRIES
    http: 422
    condition: "draw invoked with zero eligible entries"
  - id: ERR_BID_BELOW_ASK
    http: 422
    condition: "bid amount below the listing ask on match"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Buyer
    description: "Enters raffles, claims wins, places bids, buys, verifies receipt, files disputes."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /releases/{id}/enter"
      - "POST /raffle-entries/{id}/claim"
      - "POST /bids"
      - "POST /listings/{id}/buy"
      - "POST /orders/{id}/verify"
      - "POST /disputes"
    shared_operations:
      - "GET reads on own/visible resources"
  - name: Seller
    description: "Creates and reprices listings, matches listings to bids, ships items in for authentication, receives payouts."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /listings"
      - "POST /listings/{id}/reprice"
      - "POST /listings/{id}/match"
      - "POST /consignment-items"
    shared_operations:
      - "GET reads on own/visible resources"
  - name: Authenticator
    description: "Receives, schedules, and completes physical authentication and grading."
    identity: "entity_backed:Authenticator"
    exclusive_operations:
      - "POST /consignment-items/{id}/receive"
      - "POST /consignment-items/{id}/schedule-inspection"
      - "POST /consignment-items/{id}/complete-inspection"
    shared_operations:
      - "GET reads on consignment/authenticator resources"
  - name: PlatformAdmin
    description: "Operator: manages SKUs, accounts, authenticators, releases, the draw lifecycle, shipping, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/verify"
      - "POST /skus"
      - "POST /authenticators"
      - "POST /releases"
      - "POST /releases/{id}/open"
      - "POST /releases/{id}/draw"
      - "POST /releases/{id}/settle"
      - "POST /releases/{id}/cancel"
      - "POST /orders/{id}/ship-to-buyer"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: CustomerService
    description: "Resolves disputes (refund clawback or deny)."
    identity: "opaque"
    exclusive_operations:
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "GET reads on disputes/orders"
