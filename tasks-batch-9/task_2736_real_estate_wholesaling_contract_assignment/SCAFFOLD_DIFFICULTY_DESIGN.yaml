            - "Trigger returns 200: DisputeCase.${dc_id}.status == ADJUDICATED, award == SPLIT_50_50, award_seller_cents == 250000, award_wholesaler_cents == 250001, adjudicated_at == 2026-08-18T00:00:00Z"
            - "EarnestMoneyDeposit.${emd_id}.forfeited_to_seller_cents == 250000 and refunded_to_wholesaler_cents == 250001 (the extra cent of the odd amount stays with the wholesaler)"
            - "EarnestMoneyDeposit.${emd_id}.held_cents == 0 and applied_at_closing_cents == 0, and Q1 holds exactly: 0 + 250001 + 250000 + 0 == 500001 == amount_cents"
            - "EarnestMoneyDeposit.${emd_id}.status == SPLIT_SETTLED and disposition_event_count == 2, one increment per applied disposition event (forfeit, then award)"
            - "Every bucket is >= 0 at every checkpoint, so the compensation moved money without minting or destroying any"

