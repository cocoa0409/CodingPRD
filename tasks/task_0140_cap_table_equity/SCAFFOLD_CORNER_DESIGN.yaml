              payload: { cap_table_id: "${ct}", legal_name: "Fnd", holder_type: "FOUNDER", email: "f@im.com" }
              as: Administrator
              captures: { sh: $.data.id }
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ct}", security_class_id: "${common}", shareholder_id: "${sh}", share_count: 250, price_paid_cents: 0 }
              as: Administrator
          trigger:
            - call: "GET /cap-tables/${ct}"
              payload: {}
              as: Administrator
              captures: { issued: $.data.issued_shares }
          assert:
            - "CapTable.${ct}.issued_shares == 250 immediately (no eventual lag)"
