      - name: bog_renovation_cycle_quota_exclusion_and_return
        claim_type: side_effect_execution
        grounds: ["state_machines.Bog", "calculations.quota_base_barrels"]
        distinguishing_aspect: "Full renovation cycle ACTIVE->RENOVATION_PLANNED->UNDER_RENOVATION->REPLANTED->ACTIVE: while out of ACTIVE the bog drops out of the quota input set (base falls 2000 -> 0), and re-certification restores it (0 -> 2000)."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE 10-acre bog, season OPEN (baseline 200 -> quota base 2000)"]
          setup_api_calls:
            - call: "POST /coop/members"
