            - { call: "POST /work-orders/${wo1}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo1}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc1: $.data.id } }
            - { call: "POST /cure-cycles/${cc1}/start", payload: {}, as: CureTechnician }
