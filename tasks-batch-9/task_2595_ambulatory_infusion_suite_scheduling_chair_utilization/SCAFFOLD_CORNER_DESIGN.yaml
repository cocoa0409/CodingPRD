              captures: { err_cutoff: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_u}", treatment_plan_id: "${pl_u}", template_id: "${tp1}", service_date: "2026-08-01", requested_start_minute: 870, cycle_number: 1, booking_class: "URGENT" }
