            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "DAY_7_CONTACT", severity_grade: 0, description: "Day-7 contact by the registry liaison; donor reports transient bone pain, resolved." }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
