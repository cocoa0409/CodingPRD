              as: ComplianceOfficer
            - call: "POST /ale-reporting/controlled-groups/${group_id}/ale-determination"
              payload: { basis: "AGGREGATED", expected_controlled_group_version: "${group_v1}" }
              as: ComplianceOfficer
            - call: "POST /ale-reporting/measurement-cycles"
