            - "ShiftAssignment.${sh1}.status == CANCELLED (hop 3)"

      - name: docent_decertification_cascade
        grounds:
          - state_machines.Docent.CERTIFIED_to_INACTIVE
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
          - entities.TourSlot.fields.staffing_status
        distinguishing_aspect: |
          Depth-2 chain triggered by docent deactivation (different trigger than
          incident creation): Docent -> INACTIVE cancels the docent's future
          ASSIGNED/CONFIRMED shifts (hop 1); each cancelled shift recomputes its
          slot's staffing_status, dropping the STAFFED slot to UNSTAFFED (hop 2).
        test_recipe:
          setup:
            - "CERTIFIED docent ${d1} with a CONFIRMED LEAD shift on SCHEDULED (not yet opened) slot ${slot1}; slot staffing_status == STAFFED"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
