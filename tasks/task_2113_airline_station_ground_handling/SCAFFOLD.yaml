scenario: "desgin task harder than expert level.!!!! 2113. Airline Station Ground Handling Contract (Swissport/Menzies station): staffing plan by flight bank & turn requirement, ground support equipment allocation & maintenance, on-time performance & damage penalties, training/certification currency by station, incident (damage/injury) reporting & investigation, service-level billing by turn type, station opening/closure & seasonal schedule, subcontractor oversight"
domain_name: "airline-station-ground-handling"
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Eleven peer entities linked exclusively by foreign keys. No entity is
  # addressed through a nested URL path; every collection sits at the API root
  # and every parent/child relationship is expressed as an `FK -> X.id` field
  # plus a filtered-list GET.

  state_machine_shape: cyclic
  # Incident CLOSED -> REOPENED -> UNDER_INVESTIGATION, BillingPeriod
  # PENDING_APPROVAL -> OPEN, Station OPEN <-> SUSPENDED, FlightBank
  # REVISION_REQUIRED -> DRAFT -> SUBMITTED. FlightBank additionally carries
  # two independent state axes (bank_status x staffing_status) on one row.

  relationship_patterns:
    - one_to_many          # Station -> FlightBank/Turn/Agent/GseUnit/BillingPeriod
    - self_referential     # Subcontractor.parent_subcontractor_id -> Subcontractor.id
    - polymorphic          # TurnResource points at either an Agent or a GseUnit
    - cross_aggregate      # BillingLine spans BillingPeriod and Turn; Incident spans 5 aggregates

  role_model: segregation_of_duties
  # The SafetyOfficer who issued findings may not close the same Incident; the
  # reporter may not investigate it; the user who finalized a BillingPeriod may
  # not approve it. Enforced on X-User-ID, not on role name.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Scenario explicitly asked for "harder than expert level". Entity count (11)
  # sits inside the Expert band; endpoint count (46) and error count (44) sit
  # above it because eleven flat entities each owe the test layer a
  # single-resource GET plus an FK-filtered list (SKILL.md 1.5
  # reverse-reachability) and eleven entities owe eleven domain-specific 404s.
  # The extra surface is reachability plumbing, not extra mechanics.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: "Three-letter IATA station code"
        constraints: "exactly 3 characters, A-Z uppercase, unique across all Stations"
      - name: name
        type: string
        source: input
        description: "Human-readable station name"
      - name: handler_code
        type: string
        source: input
        description: "Ground handling company code operating the station contract"
      - name: status
        type: enum
        source: system
        description: "Station contract lifecycle state"
        default: PLANNED
        constraints: "PLANNED | OPEN | SUSPENDED | CLOSED"
      - name: season_code
        type: enum
        source: input
        description: "Currently active IATA scheduling season at this station"
        default: SUMMER
        constraints: "SUMMER | WINTER"
      - name: season_start_date
        type: datetime
        source: input
        description: "Informational start of the active season window; not validated against turn dates"
        default: null
      - name: season_end_date
        type: datetime
        source: input
        description: "Informational end of the active season window; not validated against turn dates"
        default: null
      - name: otp_target_pct
        type: number
        source: input
        description: "Contractual on-time-performance target percentage"
        default: 85.00
        constraints: "0.00 <= otp_target_pct <= 100.00, 2 decimal places"
      - name: otp_tolerance_minutes
        type: integer
        source: input
        description: "Departure delay in whole minutes that still counts as ON_TIME (inclusive)"
        default: 15
        constraints: ">= 0"
      - name: gse_reposition_buffer_minutes
        type: integer
        source: input
        description: "Minutes of repositioning time appended to the end of every GSE occupation before the unit may be occupied again"
        default: 20
        constraints: ">= 0"
      - name: penalty_cap_cents
        type: integer
        source: input
        description: "Maximum combined OTP + damage penalty a BillingPeriod may carry before finalize is refused"
        default: 5000000
        constraints: ">= 0"
      - name: damage_penalty_multiplier
        type: number
        source: input
        description: "Multiplier applied to the severity damage-penalty table for this station"
        default: 1.00
        constraints: "> 0, 2 decimal places"
      - name: oversight_posture
        type: enum
        source: computed
        description: "Derived gate over child operations; recomputed on every Incident status change and Turn completion"
        constraints: "NORMAL | ENHANCED | RESTRICTED"
      - name: open_critical_incident_count
        type: integer
        source: computed
        description: "Count of Incidents at this station with severity CRITICAL and status != CLOSED"
      - name: open_major_incident_count
        type: integer
        source: computed
        description: "Count of Incidents at this station with severity MAJOR and status != CLOSED"
      - name: completed_turn_count
        type: integer
        source: computed
        description: "Count of Turns at this station with status COMPLETED and otp_result IN {ON_TIME, DELAYED}"
      - name: on_time_turn_count
        type: integer
        source: computed
        description: "Count of Turns at this station with status COMPLETED and otp_result == ON_TIME"
      - name: otp_rolling_pct
        type: number
        source: computed
        description: "Station on-time performance percentage; 100.00 when completed_turn_count == 0"
        constraints: "2 decimal places"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the station transitioned PLANNED -> OPEN"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the station transitioned to CLOSED"
        default: null

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station whose contract this subcontractor works under"
      - name: parent_subcontractor_id
        type: string
        source: input
        description: "FK -> Subcontractor.id; the tier-1 sponsor of a tier-2 subcontractor; null for tier-1"
        default: null
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the subcontracting firm"
      - name: tier
        type: enum
        source: computed
        description: "TIER_2 when parent_subcontractor_id is non-null, otherwise TIER_1"
        constraints: "TIER_1 | TIER_2"
      - name: status
        type: enum
        source: system
        description: "Oversight lifecycle state"
        default: PENDING_VETTING
        constraints: "PENDING_VETTING | APPROVED | PROBATION | SUSPENDED | TERMINATED"
      - name: closed_liable_incident_count
        type: integer
        source: computed
        description: "Count of Incidents with subcontractor_id == this id, status CLOSED and liability_party SUBCONTRACTOR"
      - name: total_incident_count
        type: integer
        source: computed
        description: "Count of all Incidents with subcontractor_id == this id, any status, any liability_party"
      - name: compliance_score
        type: number
        source: computed
        description: "ROLLING variant of subcontractor_compliance_score (age-decayed, closed+liable only)"
        constraints: "0.00 - 100.00, 2 decimal places"
      - name: audit_compliance_score
        type: number
        source: computed
        description: "AUDIT variant of subcontractor_compliance_score (no decay, every linked incident)"
        constraints: "0.00 - 100.00, 2 decimal places"
      - name: oversight_flag
        type: boolean
        source: computed
        description: "True when compliance_score < 60.00"
        default: false

  - name: FlightBank
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station this bank of flights belongs to"
      - name: bank_code
        type: string
        source: input
        description: "Operator code for the bank"
        constraints: "unique per station_id"
      - name: season_code
        type: enum
        source: input
        description: "Scheduling season this bank is published for"
        constraints: "SUMMER | WINTER; must equal Station.season_code at creation"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the bank window; every Turn must sit inside it"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the bank window"
      - name: bank_status
        type: enum
        source: system
        description: "Schedule-publication axis; evolves independently of staffing_status"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | LOCKED | ARCHIVED"
      - name: staffing_status
        type: enum
        source: system
        description: "Staffing-plan approval axis; evolves independently of bank_status"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUIRED"
      - name: planned_headcount
        type: integer
        source: input
        description: "Agent headcount the station plans to roster for this bank"
        default: 0
        constraints: ">= 0"
      - name: required_headcount
        type: integer
        source: computed
        description: "Sum of REQUIRED_AGENTS[turn_type] over Turns in this bank with status IN {SCHEDULED, RESOURCED, IN_PROGRESS, COMPLETED}"
      - name: turn_count
        type: integer
        source: computed
        description: "Count of Turns with flight_bank_id == this id and status != CANCELLED"
      - name: staffing_coverage_pct
        type: number
        source: computed
        description: "100.00 when required_headcount == 0, else round_half_up(100 * planned_headcount / required_headcount, 2)"
        constraints: "2 decimal places"
      - name: last_staffing_decision_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who last approved or rejected the staffing plan"
        default: null

  - name: Turn
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station where the turnaround is handled"
      - name: flight_bank_id
        type: string
        source: input
        description: "FK -> FlightBank.id; bank this turnaround is scheduled inside"
      - name: flight_number
        type: string
        source: input
        description: "Carrier flight designator for the turnaround"
      - name: turn_type
        type: enum
        source: input
        description: "Service level of the turnaround; drives headcount, GSE count, base rate and standard ground time"
        constraints: "TOWING_ONLY | NARROWBODY_QUICK | NARROWBODY_STANDARD | FREIGHTER | WIDEBODY"
      - name: scheduled_in
        type: datetime
        source: input
        description: "Scheduled on-block time (STA)"
      - name: scheduled_out
        type: datetime
        source: input
        description: "Scheduled off-block time (STD)"
      - name: actual_in
        type: datetime
        source: system
        description: "Actual on-block time recorded by the START action"
        default: null
      - name: actual_out
        type: datetime
        source: system
        description: "Actual off-block time recorded by the COMPLETE action"
        default: null
      - name: scheduled_ground_minutes
        type: integer
        source: computed
        description: "Whole minutes between scheduled_in and scheduled_out"
      - name: actual_ground_minutes
        type: integer
        source: computed
        description: "Whole minutes between actual_in and actual_out; null until COMPLETE"
        default: null
      - name: delay_minutes
        type: integer
        source: computed
        description: "max(0, whole minutes of actual_out minus scheduled_out); null until COMPLETE"
        default: null
      - name: delay_code
        type: enum
        source: system
        description: "Delay attribution recorded by the COMPLETE action"
        default: null
        constraints: "GH_STAFFING | GH_EQUIPMENT | GH_LOADING | CARRIER | ATC | WEATHER | NONE"
      - name: otp_result
        type: enum
        source: computed
        description: "On-time classification decided at COMPLETE"
        default: PENDING
        constraints: "PENDING | ON_TIME | DELAYED | EXCLUDED"
      - name: status
        type: enum
        source: system
        description: "Turnaround lifecycle state"
        default: SCHEDULED
        constraints: "SCHEDULED | RESOURCED | IN_PROGRESS | COMPLETED | CANCELLED | DISRUPTED"
      - name: required_agent_count
        type: integer
        source: computed
        description: "REQUIRED_AGENTS[turn_type] from the turn_requirement_matrix constants"
      - name: required_gse_count
        type: integer
        source: computed
        description: "REQUIRED_GSE[turn_type] from the turn_requirement_matrix constants"
      - name: assigned_agent_count
        type: integer
        source: computed
        description: "Count of TurnResource rows on this turn with resource_kind AGENT and status IN {RESERVED, COMMITTED}"
      - name: assigned_gse_count
        type: integer
        source: computed
        description: "Count of TurnResource rows on this turn with resource_kind GSE and status IN {RESERVED, COMMITTED}"
      - name: billed
        type: boolean
        source: computed
        description: "True when a BillingLine with status IN {PROVISIONAL, FINAL} references this turn"
        default: false

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; home station of the ground handling agent"
      - name: subcontractor_id
        type: string
        source: input
        description: "FK -> Subcontractor.id; employing subcontractor, null for directly-employed agents"
        default: null
      - name: employee_code
        type: string
        source: input
        description: "Roster code for the agent"
        constraints: "unique per station_id"
      - name: full_name
        type: string
        source: input
        description: "Agent full name"
      - name: employment_type
        type: enum
        source: computed
        description: "SUBCONTRACTED when subcontractor_id is non-null, otherwise DIRECT"
        constraints: "DIRECT | SUBCONTRACTED"
      - name: status
        type: enum
        source: system
        description: "Duty eligibility state"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: certification_posture
        type: enum
        source: computed
        description: "Currency of the agent's RAMP_SAFETY endorsement at the current logical clock"
        constraints: "CURRENT | EXPIRING | LAPSED"
      - name: assigned_duty_minutes
        type: integer
        source: computed
        description: "Ledger: sum of occupied_minutes over TurnResource rows for this agent with status IN {RESERVED, COMMITTED}"
        default: 0

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; agent holding the endorsement"
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station the endorsement is valid at; certifications do not travel between stations"
      - name: cert_type
        type: enum
        source: input
        description: "Training endorsement type"
        constraints: "RAMP_SAFETY | PUSHBACK | BELT_LOADER | GPU | DEICING | LOADMASTER"
      - name: issued_at
        type: datetime
        source: input
        description: "Instant the endorsement became effective (inclusive)"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant the endorsement stops being effective (exclusive)"
        constraints: "must be strictly after issued_at"
      - name: status
        type: enum
        source: system
        description: "Administrative state of the endorsement"
        default: VALID
        constraints: "VALID | REVOKED"
      - name: currency_state
        type: enum
        source: computed
        description: "Currency evaluated against the current logical clock"
        constraints: "CURRENT | EXPIRING | LAPSED | REVOKED"
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of revocation"
        default: null
      - name: revoked_reason
        type: string
        source: system
        description: "Free-text reason supplied to the revoke action"
        default: null

  - name: GseUnit
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station the equipment is based at"
      - name: asset_tag
        type: string
        source: input
        description: "Asset tag of the ground support equipment unit"
        constraints: "unique per station_id"
      - name: gse_type
        type: enum
        source: input
        description: "Equipment class"
        constraints: "PUSHBACK_TUG | BELT_LOADER | GPU | DEICER | STAIRS"
      - name: status
        type: enum
        source: system
        description: "Serviceability state"
        default: AVAILABLE
        constraints: "AVAILABLE | IN_MAINTENANCE | QUARANTINED | RETIRED"
      - name: condition_score
        type: integer
        source: input
        description: "Engineering condition rating, second sort key of the GSE selector"
        default: 100
        constraints: "0 <= condition_score <= 100"
      - name: service_interval_cycles
        type: integer
        source: input
        description: "Turn cycles between scheduled services"
        default: 25
        constraints: ">= 1"
      - name: cycles_since_service
        type: integer
        source: input
        description: "Turn cycles accumulated since the last completed service; increments on turn completion"
        default: 0
        constraints: ">= 0"
      - name: service_hold_start
        type: datetime
        source: system
        description: "Inclusive start of the scheduled maintenance hold window"
        default: null
      - name: service_hold_end
        type: datetime
        source: system
        description: "Inclusive end of the scheduled maintenance hold window"
        default: null
      - name: committed_occupation_minutes
        type: integer
        source: computed
        description: "Ledger: sum of occupied_minutes over TurnResource rows for this unit with status IN {RESERVED, COMMITTED}"
        default: 0
      - name: last_service_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last SERVICE_COMPLETED event"
        default: null

  - name: TurnResource
    parent: null
    common_fields: true
    fields:
      - name: turn_id
        type: string
        source: input
        description: "FK -> Turn.id; turnaround the resource is committed to"
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; populated exactly when resource_kind == AGENT"
        default: null
      - name: gse_unit_id
        type: string
        source: input
        description: "FK -> GseUnit.id; populated exactly when resource_kind == GSE; may be omitted so the server runs the gse_unit_selector"
        default: null
      - name: resource_kind
        type: enum
        source: input
        description: "Which resource family this row occupies"
        constraints: "AGENT | GSE"
      - name: role_on_turn
        type: enum
        source: input
        description: "Ramp role the agent performs; required when resource_kind == AGENT, forbidden otherwise"
        default: null
        constraints: "LEAD | RAMP | LOADER | PUSHBACK_OPERATOR | DEICER"
      - name: gse_type
        type: enum
        source: input
        description: "Requested equipment class when the server must select the unit; required when resource_kind == GSE and gse_unit_id is omitted"
        default: null
        constraints: "PUSHBACK_TUG | BELT_LOADER | GPU | DEICER | STAIRS"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the occupation interval"
      - name: window_end
        type: datetime
        source: input
        description: "End of the occupation interval; must be strictly after window_start"
      - name: occupied_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start and window_end"
      - name: status
        type: enum
        source: system
        description: "Occupation lifecycle state"
        default: RESERVED
        constraints: "RESERVED | COMMITTED | RELEASED | CANCELLED"
      - name: cancel_reason
        type: string
        source: system
        description: "Machine reason recorded when a cascade cancelled the occupation"
        default: null

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station the event occurred at"
      - name: turn_id
        type: string
        source: input
        description: "FK -> Turn.id; turnaround involved, null when the event is not turn-linked"
        default: null
      - name: gse_unit_id
        type: string
        source: input
        description: "FK -> GseUnit.id; equipment involved, null when no equipment is implicated"
        default: null
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; agent involved, null when no agent is implicated"
        default: null
      - name: subcontractor_id
        type: string
        source: system
        description: "FK -> Subcontractor.id; snapshot of Agent.subcontractor_id taken at report time, null when the agent is DIRECT or absent"
        default: null
      - name: incident_type
        type: enum
        source: input
        description: "Event class"
        constraints: "AIRCRAFT_DAMAGE | GSE_DAMAGE | PERSONAL_INJURY | NEAR_MISS"
      - name: severity
        type: enum
        source: input
        description: "Assessed severity at report time"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: occurred_at
        type: datetime
        source: input
        description: "Instant the event happened; must not be after the current logical clock"
      - name: description
        type: string
        source: input
        description: "Free-text narrative supplied by the reporter"
        default: null
      - name: status
        type: enum
        source: system
        description: "Investigation lifecycle state; CLOSED is re-openable while reopen_count < 2"
        default: REPORTED
        constraints: "REPORTED | UNDER_INVESTIGATION | FINDINGS_ISSUED | CLOSED | REOPENED"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who created the report"
      - name: investigator_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who took the investigation"
        default: null
      - name: findings_issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who issued findings"
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who closed the investigation"
        default: null
      - name: root_cause_code
        type: string
        source: system
        description: "Root cause recorded with the findings"
        default: null
      - name: liability_party
        type: enum
        source: system
        description: "Party held liable by the findings"
        default: null
        constraints: "HANDLER | SUBCONTRACTOR | CARRIER | THIRD_PARTY"
      - name: assessed_damage_cents
        type: integer
        source: system
        description: "Damage valuation recorded with the findings; required when incident_type IN {AIRCRAFT_DAMAGE, GSE_DAMAGE}"
        default: null
        constraints: ">= 0"
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times the investigation has been reopened; capped at 2"
        default: 0

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station being invoiced"
      - name: period_code
        type: string
        source: input
        description: "Billing period label"
        constraints: "unique per station_id"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the billed window"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the billed window"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state"
        default: OPEN
        constraints: "OPEN | PENDING_APPROVAL | APPROVED"
      - name: line_count
        type: integer
        source: computed
        description: "Count of BillingLine rows in this period with status IN {PROVISIONAL, FINAL}"
      - name: accrued_cents
        type: integer
        source: computed
        description: "Ledger: sum of net_amount_cents over BillingLine rows in this period with status IN {PROVISIONAL, FINAL}"
        default: 0
      - name: gross_total_cents
        type: integer
        source: computed
        description: "Sum of gross_amount_cents over non-VOID lines"
        default: 0
      - name: otp_penalty_cents
        type: integer
        source: computed
        description: "Sum of per-line otp_penalty_cents (round-per-line-then-sum order is pinned)"
        default: 0
      - name: damage_penalty_cents
        type: integer
        source: computed
        description: "Sum of per-line damage_penalty_cents"
        default: 0
      - name: rebate_tier
        type: enum
        source: computed
        description: "Volume rebate tier selected from gross_total_cents"
        default: NONE
        constraints: "NONE | TIER_A | TIER_B"
      - name: rebate_cents
        type: integer
        source: computed
        description: "round_half_up(gross_total_cents * REBATE_PCT[rebate_tier])"
        default: 0
      - name: net_total_cents
        type: integer
        source: computed
        description: "gross_total_cents - otp_penalty_cents - damage_penalty_cents + rebate_cents; always equal to accrued_cents"
        default: 0
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who finalized the period; cleared on REJECT"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who approved the period"
        default: null
      - name: reject_count
        type: integer
        source: system
        description: "Number of times the finalized period has been sent back to OPEN"
        default: 0

  - name: BillingLine
    parent: null
    common_fields: true
    fields:
      - name: billing_period_id
        type: string
        source: input
        description: "FK -> BillingPeriod.id; period the line is accrued into"
      - name: turn_id
        type: string
        source: input
        description: "FK -> Turn.id; turnaround being charged"
      - name: turn_type_snapshot
        type: enum
        source: system
        description: "Copy of Turn.turn_type at line creation; the rate table is read from this snapshot, not from the live turn"
        constraints: "TOWING_ONLY | NARROWBODY_QUICK | NARROWBODY_STANDARD | FREIGHTER | WIDEBODY"
      - name: status
        type: enum
        source: system
        description: "Line state; also selects which turn_service_charge variant produced the amounts"
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL | VOID"
      - name: base_rate_cents
        type: integer
        source: computed
        description: "BASE_RATE_CENTS[turn_type_snapshot]"
      - name: charged_ground_minutes
        type: integer
        source: computed
        description: "Ground minutes fed into the charge; scheduled_ground_minutes for PROVISIONAL, actual_ground_minutes for FINAL"
      - name: excess_minutes
        type: integer
        source: computed
        description: "max(0, charged_ground_minutes - STD_GROUND_MIN[turn_type_snapshot])"
      - name: ground_time_tier
        type: enum
        source: computed
        description: "TIER_1 when excess_minutes <= 15, TIER_2 when <= 45, TIER_3 above"
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Output of turn_service_charge for the line's current variant"
      - name: otp_penalty_cents
        type: integer
        source: computed
        description: "Output of line_penalties; always 0 for PROVISIONAL"
        default: 0
      - name: damage_penalty_cents
        type: integer
        source: computed
        description: "Output of line_penalties; always 0 for PROVISIONAL"
        default: 0
      - name: rebate_alloc_cents
        type: integer
        source: computed
        description: "This line's share of the period volume rebate under the largest-remainder allocation; 0 for PROVISIONAL"
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "gross_amount_cents - otp_penalty_cents - damage_penalty_cents + rebate_alloc_cents"
      - name: void_reason
        type: string
        source: system
        description: "Reason recorded when the line was voided"
        default: null

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: Station
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /stations/{stationId}/lifecycle with action=OPEN"
        actor: StationManager
        preconditions:
          - "Station.status == PLANNED"
        side_effects:
          - "opened_at = current logical clock"
          - "recompute Station.oversight_posture (NORMAL on a fresh station)"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /stations/{stationId}/lifecycle with action=SUSPEND"
        actor: StationManager
        preconditions:
          - "Station.status == OPEN"
        side_effects:
          - "CASCADE HOP 1: every FlightBank with station_id == this station and bank_status == PUBLISHED moves to LOCKED"
          - "CASCADE HOP 2: because those banks became LOCKED, each of them whose staffing_status == APPROVED moves to REVISION_REQUIRED"
          - "CASCADE HOP 3: because those banks moved to REVISION_REQUIRED, every Turn in them with status IN {SCHEDULED, RESOURCED} moves to DISRUPTED"
          - "CASCADE HOP 4: because those Turns became DISRUPTED, every TurnResource on them with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=STATION_SUSPENDED, decrementing GseUnit.committed_occupation_minutes and Agent.assigned_duty_minutes by that row's occupied_minutes"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /stations/{stationId}/lifecycle with action=RESUME"
        actor: StationManager
        preconditions:
          - "Station.status == SUSPENDED"
          - "Station.open_critical_incident_count == 0"
        side_effects:
          - "recompute Station.oversight_posture"
        note: "OPEN <-> SUSPENDED is the station cycle; DISRUPTED turns are NOT restored by RESUME."
      - from: OPEN
        to: CLOSED
        trigger: "POST /stations/{stationId}/lifecycle with action=CLOSE"
        actor: StationManager
        preconditions:
          - "Station.status == OPEN"
          - "no Turn at this station with status IN {SCHEDULED, RESOURCED, IN_PROGRESS}"
          - "no BillingPeriod at this station with status IN {OPEN, PENDING_APPROVAL}"
        side_effects:
          - "closed_at = current logical clock"
          - "every FlightBank at the station with bank_status != ARCHIVED moves to ARCHIVED"
          - "every GseUnit at the station with status != RETIRED moves to RETIRED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /stations/{stationId}/lifecycle with action=CLOSE"
        actor: StationManager
        preconditions:
          - "Station.status == SUSPENDED"
          - "no Turn at this station with status IN {SCHEDULED, RESOURCED, IN_PROGRESS}"
          - "no BillingPeriod at this station with status IN {OPEN, PENDING_APPROVAL}"
        side_effects:
          - "closed_at = current logical clock"
          - "every FlightBank at the station with bank_status != ARCHIVED moves to ARCHIVED"
          - "every GseUnit at the station with status != RETIRED moves to RETIRED"
      - from: OPEN
        to: OPEN
        trigger: "POST /stations/{stationId}/season-rollovers"
        actor: StationManager
        preconditions:
          - "Station.status == OPEN"
          - "to_season_code != Station.season_code"
        side_effects:
          - "Station.season_code = to_season_code; season_start_date and season_end_date replaced"
          - "CASCADE HOP 1: every FlightBank at the station whose season_code equals the OUTGOING season and whose bank_status IN {DRAFT, PUBLISHED, LOCKED} moves to ARCHIVED"
          - "CASCADE HOP 2: because those banks became ARCHIVED, every Turn in them with status IN {SCHEDULED, RESOURCED} moves to CANCELLED"
          - "CASCADE HOP 3: because those Turns became CANCELLED, every TurnResource on them with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=SEASON_ROLLOVER, decrementing GseUnit.committed_occupation_minutes and Agent.assigned_duty_minutes"
        note: "Status stays OPEN; the rollover is a same-state transition whose entire value is the cascade."

  - entity: Subcontractor
    initial_state: PENDING_VETTING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VETTING
        to: APPROVED
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=APPROVE"
        actor: StationManager
        preconditions:
          - "Subcontractor.status == PENDING_VETTING"
          - "when tier == TIER_2, the parent Subcontractor.status == APPROVED"
        side_effects:
          - "recompute compliance_score and audit_compliance_score"
      - from: APPROVED
        to: PROBATION
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=PLACE_ON_PROBATION, or system cascade on Incident CLOSE"
        actor: StationManager | system
        preconditions:
          - "Subcontractor.status == APPROVED"
        side_effects:
          - "recompute compliance_score and audit_compliance_score"
      - from: PROBATION
        to: APPROVED
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=REINSTATE"
        actor: StationManager
        preconditions:
          - "Subcontractor.status == PROBATION"
          - "Subcontractor.audit_compliance_score >= 40.00"
        side_effects:
          - "recompute compliance_score and audit_compliance_score"
        note: "PROBATION <-> APPROVED is a cycle."
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=SUSPEND"
        actor: StationManager
        preconditions:
          - "Subcontractor.status IN {APPROVED, PROBATION}"
        side_effects:
          - "no new TurnResource may be created for Agents employed by this subcontractor"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=SUSPEND"
        actor: StationManager
        preconditions:
          - "Subcontractor.status IN {APPROVED, PROBATION}"
        side_effects:
          - "no new TurnResource may be created for Agents employed by this subcontractor"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /subcontractors/{subcontractorId}/oversight-decisions with decision=TERMINATE"
        actor: StationManager
        preconditions:
          - "Subcontractor.status == SUSPENDED"
        side_effects:
          - "every Agent with subcontractor_id == this id and status != TERMINATED moves to TERMINATED"
          - "because those Agents became TERMINATED, every TurnResource for them with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=SUBCONTRACTOR_TERMINATED and Agent.assigned_duty_minutes is decremented"

  - entity: FlightBank
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /flight-banks/{flightBankId}/lifecycle with action=PUBLISH"
        actor: DutyOfficer
        preconditions:
          - "FlightBank.bank_status == DRAFT"
          - "Station.status == OPEN"
          - "FlightBank.turn_count >= 1"
        side_effects:
          - "recompute required_headcount and staffing_coverage_pct"
        note: "bank_status axis only; staffing_status is untouched."
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /flight-banks/{flightBankId}/lifecycle with action=LOCK"
        actor: StationManager
        preconditions:
          - "FlightBank.bank_status == PUBLISHED"
          - "FlightBank.staffing_status == APPROVED"
        side_effects:
          - "no further Turn may be created in this bank"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /flight-banks/{flightBankId}/lifecycle with action=ARCHIVE, or system cascade on station CLOSE / season rollover"
        actor: StationManager | system
        preconditions:
          - "FlightBank.bank_status IN {DRAFT, PUBLISHED, LOCKED}"
          - "no Turn in this bank with status IN {SCHEDULED, RESOURCED, IN_PROGRESS} (waived when the cascade originates from station CLOSE or season rollover)"
        side_effects:
          - "bank becomes read-only"
      - from: LOCKED
        to: ARCHIVED
        trigger: "POST /flight-banks/{flightBankId}/lifecycle with action=ARCHIVE"
        actor: StationManager
        preconditions:
          - "FlightBank.bank_status == LOCKED"
          - "no Turn in this bank with status IN {SCHEDULED, RESOURCED, IN_PROGRESS}"
        side_effects:
          - "bank becomes read-only"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /flight-banks/{flightBankId}/staffing-transitions with action=SUBMIT"
        actor: DutyOfficer
        preconditions:
          - "FlightBank.staffing_status == DRAFT"
          - "FlightBank.bank_status == PUBLISHED"
        side_effects:
          - "recompute required_headcount and staffing_coverage_pct"
        note: "staffing_status axis only; bank_status is untouched. The from/to pair names the staffing axis."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /flight-banks/{flightBankId}/staffing-transitions with action=APPROVE"
        actor: StationManager
        preconditions:
          - "FlightBank.staffing_status == SUBMITTED"
          - "Station.status == OPEN"
          - "FlightBank.staffing_coverage_pct >= 100.00"
        side_effects:
          - "last_staffing_decision_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /flight-banks/{flightBankId}/staffing-transitions with action=REJECT"
        actor: StationManager
        preconditions:
          - "FlightBank.staffing_status == SUBMITTED"
        side_effects:
          - "last_staffing_decision_by_user_id = X-User-ID"
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "POST /flight-banks/{flightBankId}/staffing-transitions with action=REVISE"
        actor: DutyOfficer
        preconditions:
          - "FlightBank.staffing_status == REVISION_REQUIRED"
        side_effects:
          - "planned_headcount replaced when supplied; recompute staffing_coverage_pct"
        note: "DRAFT -> SUBMITTED -> REVISION_REQUIRED -> DRAFT is the staffing revision cycle."
      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "system: a Turn in this bank demotes RESOURCED -> SCHEDULED, or a new Turn drops staffing_coverage_pct below 100.00, or the station is suspended"
        actor: system
        preconditions:
          - "FlightBank.staffing_status == APPROVED"
        side_effects:
          - "recompute required_headcount and staffing_coverage_pct"

  - entity: Turn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESOURCED
        trigger: "system: a TurnResource create brings assigned_agent_count >= required_agent_count AND assigned_gse_count >= required_gse_count"
        actor: system
        preconditions:
          - "Turn.status == SCHEDULED"
          - "Turn.assigned_agent_count >= Turn.required_agent_count"
          - "Turn.assigned_gse_count >= Turn.required_gse_count"
        side_effects:
          - "no ledger movement; only Turn.status and Turn.version change"
      - from: RESOURCED
        to: SCHEDULED
        trigger: "system: a TurnResource release/cancel drops assigned_agent_count or assigned_gse_count below requirement"
        actor: system
        preconditions:
          - "Turn.status == RESOURCED"
          - "Turn.assigned_agent_count < Turn.required_agent_count OR Turn.assigned_gse_count < Turn.required_gse_count"
        side_effects:
          - "because the turn demoted, its FlightBank with staffing_status == APPROVED moves to REVISION_REQUIRED"
      - from: RESOURCED
        to: IN_PROGRESS
        trigger: "POST /turns/{turnId}/lifecycle with action=START"
        actor: DutyOfficer
        preconditions:
          - "Turn.status == RESOURCED"
          - "Station.status == OPEN"
          - "FlightBank.bank_status IN {PUBLISHED, LOCKED}"
          - "FlightBank.staffing_status == APPROVED"
        side_effects:
          - "actual_in = supplied actual_in, or the current logical clock when omitted"
          - "every TurnResource on this turn with status RESERVED moves to COMMITTED (ledgers unchanged: both statuses count)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /turns/{turnId}/lifecycle with action=COMPLETE"
        actor: DutyOfficer
        preconditions:
          - "Turn.status == IN_PROGRESS"
          - "supplied actual_out is not before Turn.actual_in"
        side_effects:
          - "actual_out recorded; actual_ground_minutes, delay_minutes and otp_result computed by turn_otp_classification"
          - "every TurnResource on this turn with status COMMITTED moves to RELEASED, decrementing GseUnit.committed_occupation_minutes and Agent.assigned_duty_minutes"
          - "each released GSE row increments its GseUnit.cycles_since_service by 1"
          - "any GseUnit whose cycles_since_service >= service_interval_cycles moves AVAILABLE -> IN_MAINTENANCE and receives a service hold of [clock, clock + 240 minutes]"
          - "Station.completed_turn_count, on_time_turn_count, otp_rolling_pct and oversight_posture recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /turns/{turnId}/lifecycle with action=CANCEL, or system cascade on season rollover"
        actor: DutyOfficer | system
        preconditions:
          - "Turn.status IN {SCHEDULED, RESOURCED, DISRUPTED}"
          - "Turn.billed == false"
        side_effects:
          - "every TurnResource on this turn with status IN {RESERVED, COMMITTED} moves to CANCELLED, decrementing GseUnit.committed_occupation_minutes and Agent.assigned_duty_minutes"
          - "FlightBank.required_headcount and staffing_coverage_pct recomputed"
      - from: RESOURCED
        to: CANCELLED
        trigger: "POST /turns/{turnId}/lifecycle with action=CANCEL"
        actor: DutyOfficer
        preconditions:
          - "Turn.status IN {SCHEDULED, RESOURCED, DISRUPTED}"
          - "Turn.billed == false"
        side_effects:
          - "every TurnResource on this turn with status IN {RESERVED, COMMITTED} moves to CANCELLED with ledger decrements"
          - "FlightBank.required_headcount and staffing_coverage_pct recomputed"
      - from: DISRUPTED
        to: CANCELLED
        trigger: "POST /turns/{turnId}/lifecycle with action=CANCEL"
        actor: DutyOfficer
        preconditions:
          - "Turn.status == DISRUPTED"
          - "Turn.billed == false"
        side_effects:
          - "FlightBank.required_headcount and staffing_coverage_pct recomputed"
      - from: SCHEDULED
        to: DISRUPTED
        trigger: "system: the owning Station transitions OPEN -> SUSPENDED"
        actor: system
        preconditions:
          - "Turn.status IN {SCHEDULED, RESOURCED}"
        side_effects:
          - "every TurnResource on this turn with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=STATION_SUSPENDED and ledger decrements"
      - from: RESOURCED
        to: DISRUPTED
        trigger: "system: the owning Station transitions OPEN -> SUSPENDED"
        actor: system
        preconditions:
          - "Turn.status IN {SCHEDULED, RESOURCED}"
        side_effects:
          - "every TurnResource on this turn with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=STATION_SUSPENDED and ledger decrements"

  - entity: TurnResource
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "system: the owning Turn transitions RESOURCED -> IN_PROGRESS"
        actor: system
        preconditions:
          - "TurnResource.status == RESERVED"
        side_effects:
          - "ledgers unchanged - RESERVED and COMMITTED both count toward GseUnit.committed_occupation_minutes and Agent.assigned_duty_minutes"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /turn-resources/{turnResourceId}/release"
        actor: DutyOfficer
        preconditions:
          - "TurnResource.status IN {RESERVED, COMMITTED}"
        side_effects:
          - "GseUnit.committed_occupation_minutes -= occupied_minutes (GSE rows) or Agent.assigned_duty_minutes -= occupied_minutes (AGENT rows)"
          - "owning Turn recomputes assigned_agent_count / assigned_gse_count and may demote RESOURCED -> SCHEDULED"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /turn-resources/{turnResourceId}/release, or system on Turn IN_PROGRESS -> COMPLETED"
        actor: DutyOfficer | system
        preconditions:
          - "TurnResource.status IN {RESERVED, COMMITTED}"
        side_effects:
          - "ledger decrement as above"
          - "when released by turn completion, the GseUnit's cycles_since_service increments by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "system: GSE quarantine, agent suspension, subcontractor termination, turn cancel, turn disruption or season rollover"
        actor: system
        preconditions:
          - "TurnResource.status IN {RESERVED, COMMITTED}"
        side_effects:
          - "cancel_reason recorded; ledger decrement as above"
          - "owning Turn recomputes coverage and may demote RESOURCED -> SCHEDULED"
      - from: COMMITTED
        to: CANCELLED
        trigger: "system: GSE quarantine, agent suspension, subcontractor termination or station suspension"
        actor: system
        preconditions:
          - "TurnResource.status IN {RESERVED, COMMITTED}"
        side_effects:
          - "cancel_reason recorded; ledger decrement as above"

  - entity: GseUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /gse-units/{gseUnitId}/service-events with event_type=HOLD_SCHEDULED and hold_start at or before the current logical clock, or system when cycles_since_service reaches service_interval_cycles on turn completion"
        actor: StationManager | SafetyOfficer | system
        preconditions:
          - "GseUnit.status == AVAILABLE"
          - "hold_start <= current logical clock (a hold whose hold_start is strictly in the future is BOOKED but does not change status)"
        side_effects:
          - "service_hold_start / service_hold_end recorded (supplied window, or [clock, clock + 240 minutes] for the system path)"
          - "the unit is no longer eligible for the gse_unit_selector"
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /gse-units/{gseUnitId}/service-events with event_type=HOLD_SCHEDULED and hold_start strictly after the current logical clock"
        actor: StationManager | SafetyOfficer
        preconditions:
          - "GseUnit.status == AVAILABLE"
          - "hold_start > current logical clock"
        side_effects:
          - "service_hold_start / service_hold_end recorded; status stays AVAILABLE so the unit can still work turns before the booked window"
          - "any GSE occupation whose interval touches the booked closed hold window is refused with ERR_GSE_SERVICE_HOLD_CONFLICT"
        note: "This same-state edge is what makes the closed-interval service-hold test reachable: a unit can be AVAILABLE and still carry a future hold."
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /gse-units/{gseUnitId}/service-events with event_type=SERVICE_COMPLETED"
        actor: StationManager | SafetyOfficer
        preconditions:
          - "GseUnit.status IN {IN_MAINTENANCE, QUARANTINED}"
        side_effects:
          - "cycles_since_service = 0; last_service_at = current logical clock; service_hold_start and service_hold_end cleared"
        note: "AVAILABLE <-> IN_MAINTENANCE is a cycle."
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system: an Incident with severity CRITICAL and a non-null gse_unit_id is reported against this unit"
        actor: system
        preconditions:
          - "GseUnit.status IN {AVAILABLE, IN_MAINTENANCE}"
        side_effects:
          - "CASCADE HOP 2: because the unit became QUARANTINED, every TurnResource with gse_unit_id == this unit and status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=GSE_QUARANTINED and committed_occupation_minutes is decremented to the new ledger value"
      - from: IN_MAINTENANCE
        to: QUARANTINED
        trigger: "system: an Incident with severity CRITICAL and a non-null gse_unit_id is reported against this unit"
        actor: system
        preconditions:
          - "GseUnit.status IN {AVAILABLE, IN_MAINTENANCE}"
        side_effects:
          - "every TurnResource with gse_unit_id == this unit and status IN {RESERVED, COMMITTED} moves to CANCELLED with ledger decrement"
      - from: QUARANTINED
        to: IN_MAINTENANCE
        trigger: "system: the quarantining Incident transitions FINDINGS_ISSUED -> CLOSED"
        actor: system
        preconditions:
          - "GseUnit.status == QUARANTINED"
        side_effects:
          - "service_hold_start / service_hold_end set to [clock, clock + 240 minutes]"
      - from: AVAILABLE
        to: RETIRED
        trigger: "system: the owning Station transitions to CLOSED"
        actor: system
        preconditions:
          - "GseUnit.status != RETIRED"
        side_effects:
          - "unit permanently ineligible for assignment"

  - entity: Agent
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: the agent's RAMP_SAFETY Certification at this station is revoked"
        actor: system
        preconditions:
          - "Agent.status == ACTIVE"
          - "the agent holds no Certification with cert_type RAMP_SAFETY, station_id == Agent.station_id and status VALID after the revocation"
        side_effects:
          - "certification_posture = LAPSED"
          - "CASCADE HOP 3: because the agent became SUSPENDED, every TurnResource for this agent with status IN {RESERVED, COMMITTED} moves to CANCELLED with cancel_reason=AGENT_SUSPENDED and Agent.assigned_duty_minutes is decremented to the new ledger value"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: a new VALID RAMP_SAFETY Certification is created for the agent at the agent's station"
        actor: system
        preconditions:
          - "Agent.status == SUSPENDED"
          - "the new Certification has cert_type RAMP_SAFETY, station_id == Agent.station_id and currency_state == CURRENT"
        side_effects:
          - "certification_posture recomputed"
        note: "ACTIVE <-> SUSPENDED is a cycle driven entirely by certification currency."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: the employing Subcontractor transitions SUSPENDED -> TERMINATED"
        actor: system
        preconditions:
          - "Agent.status != TERMINATED"
        side_effects:
          - "every TurnResource for this agent with status IN {RESERVED, COMMITTED} moves to CANCELLED with ledger decrement"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system: the employing Subcontractor transitions SUSPENDED -> TERMINATED"
        actor: system
        preconditions:
          - "Agent.status != TERMINATED"
        side_effects:
          - "no further assignment is possible"

  - entity: Certification
    initial_state: VALID
    terminal_states: [REVOKED]
    transitions:
      - from: VALID
        to: REVOKED
        trigger: "POST /certifications/{certificationId}/revoke"
        actor: SafetyOfficer | StationManager
        preconditions:
          - "Certification.status == VALID"
        side_effects:
          - "CASCADE HOP 1: revoked_at = current logical clock; currency_state = REVOKED"
          - "CASCADE HOP 2: because this endorsement is no longer VALID, the owning Agent recomputes certification_posture and, when the revoked endorsement was the agent's only VALID RAMP_SAFETY at that station, moves ACTIVE -> SUSPENDED"
          - "the agent-suspension hop then fires its own TurnResource cancellation cascade (HOP 3) and Turn demotion (HOP 4)"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /incidents/{incidentId}/transitions with action=INVESTIGATE"
        actor: SafetyOfficer
        preconditions:
          - "Incident.status IN {REPORTED, REOPENED}"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "investigator_user_id = X-User-ID"
      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /incidents/{incidentId}/transitions with action=INVESTIGATE"
        actor: SafetyOfficer
        preconditions:
          - "Incident.status IN {REPORTED, REOPENED}"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "investigator_user_id = X-User-ID"
        note: "This edge closes the investigation cycle CLOSED -> REOPENED -> UNDER_INVESTIGATION."
      - from: UNDER_INVESTIGATION
        to: FINDINGS_ISSUED
        trigger: "POST /incidents/{incidentId}/transitions with action=ISSUE_FINDINGS"
        actor: SafetyOfficer
        preconditions:
          - "Incident.status == UNDER_INVESTIGATION"
          - "root_cause_code supplied"
          - "liability_party supplied"
          - "assessed_damage_cents supplied when incident_type IN {AIRCRAFT_DAMAGE, GSE_DAMAGE}"
        side_effects:
          - "root_cause_code, liability_party, assessed_damage_cents recorded"
          - "findings_issued_by_user_id = X-User-ID"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /incidents/{incidentId}/transitions with action=CLOSE"
        actor: SafetyOfficer
        preconditions:
          - "Incident.status == FINDINGS_ISSUED"
          - "X-User-ID != Incident.findings_issued_by_user_id"
        side_effects:
          - "closed_by_user_id = X-User-ID"
          - "Station.open_critical_incident_count / open_major_incident_count and oversight_posture recomputed"
          - "when gse_unit_id is non-null and the unit is QUARANTINED, the unit moves QUARANTINED -> IN_MAINTENANCE"
          - "when subcontractor_id is non-null, that Subcontractor recomputes compliance_score and audit_compliance_score; if audit_compliance_score < 40.00 and its status is APPROVED it moves to PROBATION"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /incidents/{incidentId}/transitions with action=REOPEN"
        actor: SafetyOfficer
        preconditions:
          - "Incident.status == CLOSED"
          - "Incident.reopen_count < 2"
        side_effects:
          - "reopen_count += 1"
          - "Station.open_critical_incident_count / open_major_incident_count and oversight_posture recomputed (the incident counts as open again)"
          - "when subcontractor_id is non-null, that Subcontractor recomputes both compliance variants"
        note: "CLOSED is only effectively terminal once reopen_count == 2."

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [APPROVED]
    transitions:
      - from: OPEN
        to: PENDING_APPROVAL
        trigger: "POST /billing-periods/{billingPeriodId}/transitions with action=FINALIZE"
        actor: BillingController
        preconditions:
          - "BillingPeriod.status == OPEN"
          - "BillingPeriod.line_count >= 1"
          - "every Turn referenced by a non-VOID line has status IN {COMPLETED, CANCELLED}"
          - "the station has no Incident with severity CRITICAL and status != CLOSED"
          - "otp_penalty_cents + damage_penalty_cents <= Station.penalty_cap_cents"
        side_effects:
          - "every non-VOID BillingLine moves PROVISIONAL -> FINAL and is recomputed under the FINAL variant of turn_service_charge and line_penalties"
          - "period_billing_rollup runs: gross_total_cents, otp_penalty_cents, damage_penalty_cents, rebate_tier, rebate_cents, per-line rebate_alloc_cents, net_amount_cents, accrued_cents and net_total_cents"
          - "finalized_by_user_id = X-User-ID"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /billing-periods/{billingPeriodId}/transitions with action=APPROVE"
        actor: ContractAuditor
        preconditions:
          - "BillingPeriod.status == PENDING_APPROVAL"
          - "X-User-ID != BillingPeriod.finalized_by_user_id"
        side_effects:
          - "approved_by_user_id = X-User-ID; the period becomes read-only"
      - from: PENDING_APPROVAL
        to: OPEN
        trigger: "POST /billing-periods/{billingPeriodId}/transitions with action=REJECT"
        actor: ContractAuditor
        preconditions:
          - "BillingPeriod.status == PENDING_APPROVAL"
        side_effects:
          - "COMPENSATION: every FINAL BillingLine moves back to PROVISIONAL and is recomputed under the PROVISIONAL variant, so otp_penalty_cents, damage_penalty_cents and rebate_alloc_cents all return to 0"
          - "gross_total_cents, otp_penalty_cents, damage_penalty_cents, rebate_tier, rebate_cents, accrued_cents and net_total_cents recomputed from the reverted lines"
          - "finalized_by_user_id cleared; reject_count += 1"
        note: "OPEN -> PENDING_APPROVAL -> OPEN is the approval revision cycle."

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: turn-resource-create-stale-turn
    parent_entity: Turn
    write_endpoint: "POST /turn-resources"
    occ_field: "expected_turn_version"
    description: |
      Committing a resource to a Turn whose version has advanced since the
      client last read it is rejected. Adding a second, third or fourth
      resource to the same Turn is a legitimately repeatable operation - a
      request that repeats with a fresh version succeeds - so this is not a
      state precondition in disguise: it is a stale-view check on the Turn
      aggregate, whose coverage counters and status the previous write already
      moved.
    error_id: ERR_STALE_TURN_VERSION
    http_status: 412

  - rule_id: billing-line-create-stale-period
    parent_entity: BillingPeriod
    write_endpoint: "POST /billing-lines"
    occ_field: "expected_billing_period_version"
    description: |
      Accruing a BillingLine into a BillingPeriod whose version has advanced
      since the client last read it is rejected. Adding further lines to an
      OPEN period is legitimate and repeatable, but each accrual moves
      gross_total_cents and can move rebate_tier, so a writer holding a stale
      view of the period would accrue against a superseded rebate basis.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: turn_requirement_matrix
    trigger: "On Turn creation and on every recomputation of Turn.required_agent_count / required_gse_count and FlightBank.required_headcount"
    algorithm: lookup
    formula: |
      REQUIRED_AGENTS = { TOWING_ONLY: 1, NARROWBODY_QUICK: 2,
                          NARROWBODY_STANDARD: 3, FREIGHTER: 3, WIDEBODY: 4 }
      REQUIRED_GSE    = { TOWING_ONLY: 1, NARROWBODY_QUICK: 1,
                          NARROWBODY_STANDARD: 1, FREIGHTER: 2, WIDEBODY: 2 }
      BASE_RATE_CENTS = { TOWING_ONLY: 18000, NARROWBODY_QUICK: 42000,
                          NARROWBODY_STANDARD: 58000, FREIGHTER: 110000,
                          WIDEBODY: 145000 }
      STD_GROUND_MIN  = { TOWING_ONLY: 20, NARROWBODY_QUICK: 30,
                          NARROWBODY_STANDARD: 45, FREIGHTER: 120, WIDEBODY: 90 }
      Turn.required_agent_count = REQUIRED_AGENTS[turn_type]
      Turn.required_gse_count   = REQUIRED_GSE[turn_type]
      FlightBank.required_headcount =
        sum over Turn t where t.flight_bank_id == bank.id
                          and t.status IN {SCHEDULED, RESOURCED, IN_PROGRESS, COMPLETED}
        of REQUIRED_AGENTS[t.turn_type]
    input_set: "Turns in status SCHEDULED, RESOURCED, IN_PROGRESS or COMPLETED; CANCELLED and DISRUPTED turns are excluded from required_headcount"
    constants:
      REQUIRED_AGENTS: "{TOWING_ONLY:1, NARROWBODY_QUICK:2, NARROWBODY_STANDARD:3, FREIGHTER:3, WIDEBODY:4}"
      REQUIRED_GSE: "{TOWING_ONLY:1, NARROWBODY_QUICK:1, NARROWBODY_STANDARD:1, FREIGHTER:2, WIDEBODY:2}"
      BASE_RATE_CENTS: "{TOWING_ONLY:18000, NARROWBODY_QUICK:42000, NARROWBODY_STANDARD:58000, FREIGHTER:110000, WIDEBODY:145000}"
      STD_GROUND_MIN: "{TOWING_ONLY:20, NARROWBODY_QUICK:30, NARROWBODY_STANDARD:45, FREIGHTER:120, WIDEBODY:90}"
    precision: "integer counts and integer cents"

  - name: staffing_coverage
    trigger: "On FlightBank creation, Turn creation, Turn cancellation, staffing SUBMIT/REVISE, and before every staffing APPROVE"
    algorithm: aggregation
    formula: |
      required = FlightBank.required_headcount   # see turn_requirement_matrix
      if required == 0:
          staffing_coverage_pct = 100.00         # empty-set convention
      else:
          staffing_coverage_pct = round_half_up(100 * planned_headcount / required, 2)
      APPROVE is admissible only when staffing_coverage_pct >= 100.00
    input_set: "Turns in the bank with status IN {SCHEDULED, RESOURCED, IN_PROGRESS, COMPLETED}; tie-breaking is not applicable because the aggregate is a plain sum"
    constants:
      EMPTY_BANK_COVERAGE_PCT: 100.00
      APPROVE_MIN_COVERAGE_PCT: 100.00
    precision: "2 decimal places, round_half_up"

  - name: turn_otp_classification
    trigger: "On the Turn transition IN_PROGRESS -> COMPLETED"
    algorithm: threshold
    formula: |
      actual_ground_minutes = floor((actual_out - actual_in) / 60 seconds)
      delay_minutes         = max(0, floor((actual_out - scheduled_out) / 60 seconds))
      if delay_minutes <= Station.otp_tolerance_minutes:
          otp_result = ON_TIME                       # inclusive boundary
      elif delay_code IN {CARRIER, ATC, WEATHER}:
          otp_result = EXCLUDED
      else:
          otp_result = DELAYED
      Station.completed_turn_count = count(Turn at station, status COMPLETED, otp_result IN {ON_TIME, DELAYED})
      Station.on_time_turn_count   = count(Turn at station, status COMPLETED, otp_result == ON_TIME)
      Station.otp_rolling_pct = 100.00 if completed_turn_count == 0
                                else round_half_up(100 * on_time_turn_count / completed_turn_count, 2)
    input_set: "Only COMPLETED turns whose otp_result is ON_TIME or DELAYED enter the station OTP ratio; EXCLUDED and PENDING turns are omitted from both numerator and denominator"
    constants:
      EXCLUDED_DELAY_CODES: "{CARRIER, ATC, WEATHER}"
      HANDLER_DELAY_CODES: "{GH_STAFFING, GH_EQUIPMENT, GH_LOADING}"
      EMPTY_OTP_PCT: 100.00
    precision: "delay_minutes is a whole minute floor; otp_rolling_pct is 2 decimal places, round_half_up"
    note: "The tolerance test runs FIRST, so a turn inside tolerance is ON_TIME even when delay_code is WEATHER."

  - name: turn_service_charge
    trigger: "On BillingLine creation (PROVISIONAL variant) and on the BillingPeriod transition OPEN -> PENDING_APPROVAL (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_RATE_CENTS[line.turn_type_snapshot]
      std  = STD_GROUND_MIN[line.turn_type_snapshot]

      # --- input 1: which ground time enters the charge (variant-dependent)
      charged_ground_minutes = scheduled_ground_minutes           (PROVISIONAL)
                             = actual_ground_minutes              (FINAL, turn COMPLETED)
                             = scheduled_ground_minutes           (FINAL, turn CANCELLED - no actuals exist)

      # --- input 2: marginal tiered excess-time rate
      excess_minutes = max(0, charged_ground_minutes - std)
      excess_charge  = 900  * min(excess_minutes, 15)
                     + 1400 * min(max(excess_minutes - 15, 0), 30)
                     + 2100 * max(excess_minutes - 45, 0)
      ground_time_tier = TIER_1 if excess_minutes <= 15
                         else TIER_2 if excess_minutes <= 45
                         else TIER_3

      # --- input 3: seasonal de-icing / winter-ops surcharge on the whole station
      season_multiplier = 1.15 if Station.season_code == WINTER else 1.00

      # --- input 4: subcontract dilution
      subcontract_factor = 0.965 if AT LEAST ONE TurnResource r exists with
                                    r.turn_id == line.turn_id,
                                    r.resource_kind == AGENT,
                                    r.status IN {RESERVED, COMMITTED, RELEASED},
                                    and Agent(r.agent_id).employment_type == SUBCONTRACTED
                           else 1.00

      raw = (base + excess_charge) * season_multiplier * subcontract_factor
      gross_amount_cents = min(max(round_half_up(raw), base), base * 3)   # floor at base, cap at 3x base
    input_set: "TurnResource rows in status RESERVED, COMMITTED or RELEASED decide subcontract_factor; CANCELLED rows are ignored, so a subcontracted agent whose assignment was cancelled does not dilute the charge"
    constants:
      EXCESS_TIER_1_RATE_CENTS_PER_MIN: 900
      EXCESS_TIER_1_MINUTES: 15
      EXCESS_TIER_2_RATE_CENTS_PER_MIN: 1400
      EXCESS_TIER_2_MINUTES: 30
      EXCESS_TIER_3_RATE_CENTS_PER_MIN: 2100
      WINTER_MULTIPLIER: 1.15
      SUMMER_MULTIPLIER: 1.00
      SUBCONTRACT_FACTOR: 0.965
      DIRECT_FACTOR: 1.00
      GROSS_CAP_MULTIPLE: 3
    precision: "integer cents; the product is evaluated in exact decimal arithmetic and rounded ROUND_HALF_UP exactly once, at the end, before the clamp. Binary floating point is not acceptable: (18000 + 23300) * 1.00 * 0.965 is exactly 39854.5 and must round UP to 39855."
    variants:
      - name: PROVISIONAL
        when: "BillingLine.status == PROVISIONAL - i.e. from line creation until the owning period is finalized"
        difference: "Uses Turn.scheduled_ground_minutes, never Turn.actual_ground_minutes; line_penalties returns 0 for both penalty components; rebate_alloc_cents stays 0"
      - name: FINAL
        when: "BillingLine.status == FINAL - set by the BillingPeriod OPEN -> PENDING_APPROVAL transition"
        difference: "Uses Turn.actual_ground_minutes; line_penalties computes real OTP and damage penalties; the line participates in the period rebate allocation"

  - name: line_penalties
    trigger: "On the BillingPeriod transition OPEN -> PENDING_APPROVAL, per non-VOID BillingLine"
    algorithm: threshold
    formula: |
      if line.status == PROVISIONAL:
          otp_penalty_cents = 0 ; damage_penalty_cents = 0
      else:  # FINAL
          otp_penalty_cents =
            round_half_up(line.gross_amount_cents * 0.12)
              if Turn.otp_result == DELAYED and Turn.delay_code IN {GH_STAFFING, GH_EQUIPMENT, GH_LOADING}
              else 0
          damage_penalty_cents =
            sum over Incident i where i.turn_id == line.turn_id
                                  and i.status == CLOSED
                                  and i.liability_party == HANDLER
                                  and i.incident_type IN {AIRCRAFT_DAMAGE, GSE_DAMAGE}
            of round_half_up(DAMAGE_PENALTY_CENTS[i.severity] * Station.damage_penalty_multiplier)
      # ROUNDING ORDER IS PINNED: the 12% OTP penalty is rounded PER LINE and the
      # rounded per-line values are then summed into
      # BillingPeriod.otp_penalty_cents. Summing the gross amounts first and
      # rounding 12% of the sum is FORBIDDEN and gives a different answer: two
      # delayed lines of 39855 and 18239 cents yield 4783 + 2189 = 6972 under
      # the pinned order, but round_half_up(58094 * 0.12) = 6971 under the
      # forbidden order.
    input_set: "Only Incidents already CLOSED with liability_party HANDLER contribute damage penalties; REPORTED / UNDER_INVESTIGATION / FINDINGS_ISSUED / REOPENED incidents and SUBCONTRACTOR/CARRIER/THIRD_PARTY liability contribute nothing. incident_type PERSONAL_INJURY and NEAR_MISS are equally reportable and equally drive the station oversight_posture and the subcontractor compliance scores, but they never contribute a damage penalty however severe they are."
    constants:
      OTP_PENALTY_PCT: 0.12
      DAMAGE_PENALTY_CENTS: "{MINOR: 25000, MAJOR: 250000, CRITICAL: 900000}"
      HANDLER_DELAY_CODES: "{GH_STAFFING, GH_EQUIPMENT, GH_LOADING}"
    precision: "integer cents, round_half_up, applied per line before any summation"

  - name: period_billing_rollup
    trigger: "On the BillingPeriod transitions OPEN -> PENDING_APPROVAL and PENDING_APPROVAL -> OPEN, and on every BillingLine create and void"
    algorithm: waterfall_allocation
    formula: |
      # The rebate looks circular: a line's net depends on the rebate, the
      # rebate depends on the period gross, and the period gross is the sum of
      # the lines. The evaluation order below is PINNED and makes the value
      # well-defined. Steps must run in this exact sequence.
      #
      # STEP 1 - recompute every non-VOID line's gross under its current variant
      #          (turn_service_charge). Each line's gross is rounded to whole
      #          cents HERE, once.
      # STEP 2 - gross_total_cents = sum of the already-rounded line grosses.
      #          (round-per-line-then-sum; never sum-then-round)
      # STEP 3 - select the rebate tier from the STEP 2 total:
      #            rebate_tier = TIER_B if gross_total_cents >= 150000
      #                          TIER_A if gross_total_cents >=  60000
      #                          NONE   otherwise
      #            REBATE_PCT  = { NONE: 0.00, TIER_A: 0.03, TIER_B: 0.06 }
      #          The tier is NONE while any line in the period is still
      #          PROVISIONAL, because the rebate only exists in the FINAL
      #          variant; a period that has never been finalized therefore
      #          reports rebate_tier NONE and rebate_cents 0 regardless of size.
      # STEP 4 - rebate_cents = round_half_up(gross_total_cents * REBATE_PCT[rebate_tier])
      # STEP 5 - allocate rebate_cents across the non-VOID FINAL lines by the
      #          LARGEST-REMAINDER method:
      #            raw_i       = rebate_cents * line_i.gross_amount_cents / gross_total_cents
      #                          (exact rational, NOT rounded)
      #            floor_i     = floor(raw_i)
      #            remainder_i = raw_i - floor_i
      #            leftover    = rebate_cents - sum(floor_i)
      #            rank the lines by remainder_i DESC,
      #                 tie-break 1: gross_amount_cents DESC,
      #                 tie-break 2: created_at ASC
      #            give one extra cent to each of the first `leftover` lines
      #            line_i.rebate_alloc_cents = floor_i (+1 when it won a leftover cent)
      #          Independently rounding each raw_i is FORBIDDEN: it can make the
      #          allocations sum to rebate_cents +/- 1 and break the ledger identity.
      # STEP 6 - otp_penalty_cents / damage_penalty_cents per line come from
      #          line_penalties; period.otp_penalty_cents and
      #          period.damage_penalty_cents are the sums of those per-line values.
      # STEP 7 - line_i.net_amount_cents = line_i.gross_amount_cents
      #                                   - line_i.otp_penalty_cents
      #                                   - line_i.damage_penalty_cents
      #                                   + line_i.rebate_alloc_cents
      # STEP 8 - accrued_cents   = sum(line_i.net_amount_cents) over lines with
      #                            status IN {PROVISIONAL, FINAL}
      #          net_total_cents = gross_total_cents - otp_penalty_cents
      #                            - damage_penalty_cents + rebate_cents
      #          These two MUST be equal; the largest-remainder allocation in
      #          STEP 5 is what guarantees it.
      #
      # On PENDING_APPROVAL -> OPEN the same eight steps run with every line back
      # in the PROVISIONAL variant, which drives penalties, rebate_tier, rebate
      # and every rebate_alloc_cents back to 0 / NONE.
    input_set: "BillingLine rows in the period with status IN {PROVISIONAL, FINAL}; VOID lines are excluded from every step including the rebate basis"
    constants:
      REBATE_TIER_A_MIN_CENTS: 60000
      REBATE_TIER_B_MIN_CENTS: 150000
      REBATE_PCT_NONE: 0.00
      REBATE_PCT_TIER_A: 0.03
      REBATE_PCT_TIER_B: 0.06
    precision: "integer cents throughout; round_half_up only at STEP 1 (per line) and STEP 4 (period rebate). STEP 5 uses exact rational remainders and integer floors."

  - name: subcontractor_compliance_score
    trigger: "On Subcontractor creation, on every Incident transition into or out of CLOSED, and on every read of a Subcontractor"
    algorithm: weighted_scoring
    formula: |
      SEVERITY_WEIGHT = { MINOR: 5, MAJOR: 15, CRITICAL: 40 }

      # --- ROLLING variant -> Subcontractor.compliance_score
      rolling_set = Incidents i with i.subcontractor_id == S.id
                                 and i.status == CLOSED
                                 and i.liability_party == SUBCONTRACTOR
      for each i in rolling_set:
          age_days = floor((current_logical_clock - i.occurred_at) / 86400 seconds)
          decay    = 1.0 if age_days <= 90
                     0.5 if 90 < age_days <= 180
                     0.0 if age_days > 180
          penalty_i = SEVERITY_WEIGHT[i.severity] * decay
      compliance_score = max(0.00, round_half_up(100 - sum(penalty_i), 2))

      # --- AUDIT variant -> Subcontractor.audit_compliance_score
      audit_set = Incidents i with i.subcontractor_id == S.id      # ANY status,
                                                                  # ANY liability_party
      audit_penalty = sum over audit_set of SEVERITY_WEIGHT[i.severity]   # no decay
      audit_compliance_score = max(0.00, round_half_up(100 - audit_penalty, 2))

      oversight_flag = (compliance_score < 60.00)
    input_set: "ROLLING filters to CLOSED + liability SUBCONTRACTOR and decays by incident age; AUDIT takes every incident whose subcontractor_id snapshot points at S regardless of status or liability and applies no decay"
    constants:
      SEVERITY_WEIGHT: "{MINOR: 5, MAJOR: 15, CRITICAL: 40}"
      DECAY_FULL_MAX_AGE_DAYS: 90
      DECAY_HALF_MAX_AGE_DAYS: 180
      OVERSIGHT_FLAG_THRESHOLD: 60.00
      AUTO_PROBATION_THRESHOLD: 40.00
    precision: "2 decimal places, round_half_up, floored at 0.00"
    variants:
      - name: ROLLING
        when: "Read as Subcontractor.compliance_score; drives oversight_flag"
        difference: "Only CLOSED incidents with liability_party SUBCONTRACTOR count, and each is age-decayed against the logical clock"
      - name: AUDIT
        when: "Read as Subcontractor.audit_compliance_score; drives the automatic APPROVED -> PROBATION move on incident close and gates PROBATION -> APPROVED reinstatement"
        difference: "Every linked incident counts at full weight regardless of investigation status or liability party, and nothing decays"

  - name: gse_occupation_overlap
    trigger: "Before creating a TurnResource with resource_kind == GSE, for the chosen or selected unit"
    algorithm: interval_merge
    formula: |
      buffer = Station.gse_reposition_buffer_minutes
      # Every GSE occupation is HALF-OPEN [window_start, window_end) and is
      # extended by `buffer` minutes of repositioning time at its END.
      effective(r) = [ r.window_start , r.window_end + buffer )
      CONFLICT with an existing row r (status IN {RESERVED, COMMITTED}) iff
          new.window_start <  r.window_end   + buffer
        AND r.window_start <  new.window_end + buffer
      -> ERR_GSE_WINDOW_CONFLICT
      # Separately, the maintenance hold is a CLOSED interval with NO buffer:
      CONFLICT with the unit's service hold iff service_hold_start is not null
        AND new.window_start <= service_hold_end
        AND service_hold_start <= new.window_end
      -> ERR_GSE_SERVICE_HOLD_CONFLICT
    input_set: "TurnResource rows on the same gse_unit_id with status IN {RESERVED, COMMITTED}; RELEASED and CANCELLED rows never conflict"
    constants:
      DEFAULT_BUFFER_MINUTES: 20
    precision: "whole-minute instants; comparisons are strict (<) for the buffered occupation test and inclusive (<=) for the service-hold test"
    note: "Boundary: an occupation starting exactly buffer minutes after another one ends is ADMISSIBLE, because the half-open comparison is strict. The service-hold test uses different arithmetic on purpose - a CLOSED interval with no buffer - and it is reachable on an AVAILABLE unit because a hold booked for a future hold_start does not change the unit's status."

  - name: agent_duty_overlap_and_cap
    trigger: "Before creating a TurnResource with resource_kind == AGENT"
    algorithm: aggregation
    formula: |
      # Agent duty intervals are CLOSED [window_start, window_end] with NO buffer.
      CONFLICT with an existing row r (status IN {RESERVED, COMMITTED}) iff
          new.window_start <= r.window_end
        AND r.window_start <= new.window_end
      -> ERR_AGENT_DUTY_OVERLAP
      # Aggregate cap, evaluated per UTC calendar date of window_start:
      duty_date = utc_date(new.window_start)
      same_day  = TurnResource rows for this agent with status IN {RESERVED, COMMITTED}
                  and utc_date(window_start) == duty_date
      projected = sum(same_day.occupied_minutes) + new.occupied_minutes
      if projected > MAX_DUTY_MINUTES_PER_DAY -> ERR_AGENT_DUTY_LIMIT_EXCEEDED
    input_set: "TurnResource rows for the same agent_id with status IN {RESERVED, COMMITTED}; RELEASED and CANCELLED rows are excluded from both the overlap scan and the daily sum"
    constants:
      MAX_DUTY_MINUTES_PER_DAY: 600
    precision: "whole minutes; the cap comparison is strictly greater-than, so exactly 600 minutes is admissible"
    note: "Interval semantics differ deliberately from gse_occupation_overlap: agents use a bare CLOSED interval (touching endpoints DO conflict) plus a calendar-day aggregate cap; GSE uses a buffered HALF-OPEN interval (touching at end+buffer does NOT conflict) with no aggregate cap."

  - name: certification_currency
    trigger: "On every Certification read, on Agent.certification_posture recomputation, and before creating an AGENT TurnResource"
    algorithm: threshold
    formula: |
      # Assignment-time evaluation is anchored on the OCCUPATION's start instant:
      is_current_for(cert, at_instant) =
            cert.status == VALID
        AND cert.issued_at <= at_instant
        AND cert.expires_at >  at_instant          # STRICTLY greater - exclusive upper bound
      REQUIRED_CERTS_BY_ROLE = {
        LEAD:               [RAMP_SAFETY, LOADMASTER],
        RAMP:               [RAMP_SAFETY],
        LOADER:             [RAMP_SAFETY, BELT_LOADER],
        PUSHBACK_OPERATOR:  [RAMP_SAFETY, PUSHBACK],
        DEICER:             [RAMP_SAFETY, DEICING] }
      An AGENT TurnResource is admissible only when, for every cert_type in
      REQUIRED_CERTS_BY_ROLE[role_on_turn], the agent holds a Certification with
      that cert_type, station_id == Turn.station_id and
      is_current_for(cert, TurnResource.window_start) == true.
      Otherwise -> ERR_CERT_NOT_CURRENT.

      # Display state, anchored on the CURRENT LOGICAL CLOCK:
      currency_state = REVOKED   if status == REVOKED
                       LAPSED    if not is_current_for(cert, clock)
                       EXPIRING  if expires_at - clock <= 30 days
                       CURRENT   otherwise
      Agent.certification_posture = LAPSED   if the agent holds no CURRENT
                                              RAMP_SAFETY at Agent.station_id
                                    EXPIRING if the agent's RAMP_SAFETY is
                                              CURRENT but EXPIRING
                                    CURRENT  otherwise
    input_set: "Certifications with station_id equal to the Turn's station; endorsements issued at another station never satisfy a requirement"
    constants:
      EXPIRING_WINDOW_DAYS: 30
      REQUIRED_CERTS_BY_ROLE: "{LEAD:[RAMP_SAFETY,LOADMASTER], RAMP:[RAMP_SAFETY], LOADER:[RAMP_SAFETY,BELT_LOADER], PUSHBACK_OPERATOR:[RAMP_SAFETY,PUSHBACK], DEICER:[RAMP_SAFETY,DEICING]}"
    precision: "instant comparison to the second; expires_at is an EXCLUSIVE bound, so expires_at == window_start means LAPSED"

  - name: gse_unit_selector
    trigger: "On POST /turn-resources with resource_kind == GSE and gse_unit_id omitted"
    algorithm: constraint_propagation
    formula: |
      # (a) ELIGIBILITY FILTER - candidate set
      candidates = GseUnit g where
            g.station_id == Turn.station_id
        AND g.gse_type   == request.gse_type
        AND g.status     == AVAILABLE
        AND gse_occupation_overlap(g, [window_start, window_end]) reports NO conflict
        AND the service-hold test reports NO conflict
      # (b) RANKING EXPRESSION
      rank key 1: (g.service_interval_cycles - g.cycles_since_service) DESC
      rank key 2: g.condition_score DESC
      # (c) TIE-BREAK
      rank key 3: g.created_at ASC
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty -> ERR_NO_ELIGIBLE_GSE (409)
      selected = first candidate under the ranking above
    input_set: "GseUnit rows at the turn's station in status AVAILABLE only; IN_MAINTENANCE, QUARANTINED and RETIRED units are never candidates"
    constants: {}
    precision: "integer comparisons; created_at compared to millisecond precision"
    note: "GseUnit.id never participates in eligibility, ranking or tie-break. created_at is the only common-field fallback."

  - name: station_oversight_posture
    trigger: "On every Incident status change, on Turn completion and on station RESUME"
    algorithm: threshold
    formula: |
      open_critical_incident_count = count(Incident at station,
                                           severity == CRITICAL, status != CLOSED)
      open_major_incident_count    = count(Incident at station,
                                           severity == MAJOR,    status != CLOSED)
      oversight_posture =
        RESTRICTED if open_critical_incident_count >= 1
        else ENHANCED if open_major_incident_count >= 1
                      or (completed_turn_count >= 3 and otp_rolling_pct < otp_target_pct)
        else NORMAL
      # GATES
      #  RESTRICTED -> POST /turns and POST /flight-banks are refused with
      #                ERR_STATION_POSTURE_RESTRICTED
      #  ENHANCED   -> POST /turn-resources for an Agent whose employment_type
      #                is SUBCONTRACTED is refused with
      #                ERR_STATION_POSTURE_RESTRICTED
      #  NORMAL     -> no additional gate
    input_set: "Incidents at the station in status REPORTED, UNDER_INVESTIGATION, FINDINGS_ISSUED or REOPENED count as open; CLOSED does not"
    constants:
      ENHANCED_MIN_COMPLETED_TURNS: 3
    precision: "integer counts; otp_rolling_pct compared at 2 decimal places"

  - name: resource_ledgers
    trigger: "On every TurnResource create, release, cancel and on Turn completion"
    algorithm: aggregation
    formula: |
      TurnResource.occupied_minutes = floor((window_end - window_start) / 60 seconds)
      GseUnit.committed_occupation_minutes =
        sum of occupied_minutes over TurnResource r with r.gse_unit_id == g.id
                                                     and r.status IN {RESERVED, COMMITTED}
      Agent.assigned_duty_minutes =
        sum of occupied_minutes over TurnResource r with r.agent_id == a.id
                                                     and r.status IN {RESERVED, COMMITTED}
      # CONSERVED-QUANTITY INVARIANTS
      #  I1 (minutes): creating a GSE TurnResource of d minutes and then
      #     releasing or cancelling it MUST return
      #     GseUnit.committed_occupation_minutes to its pre-create value.
      #  I2 (minutes): the same holds for Agent.assigned_duty_minutes on AGENT rows.
      #  I3 (cents):  creating a BillingLine of n net cents and then voiding it
      #     MUST return BillingPeriod.accrued_cents and line_count to their
      #     pre-create values (see period_billing_rollup).
    input_set: "Only RESERVED and COMMITTED rows are summed; RELEASED and CANCELLED rows contribute zero"
    constants: {}
    precision: "whole minutes"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role is listed on the endpoint AND, for multi-action endpoints, is permitted for the requested action (staffing SUBMIT/REVISE are DutyOfficer-only, staffing APPROVE/REJECT are StationManager-only, billing FINALIZE is BillingController-only, billing APPROVE/REJECT are ContractAuditor-only, bank LOCK/ARCHIVE are StationManager-only, bank PUBLISH is DutyOfficer-only)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named in the URL path exists, validated left to right"
    error_id: "ERR_STATION_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_FLIGHT_BANK_NOT_FOUND | ERR_TURN_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_GSE_UNIT_NOT_FOUND | ERR_TURN_RESOURCE_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_BILLING_PERIOD_NOT_FOUND | ERR_BILLING_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: business_constraint
    check: "Request shape: every required body field is present; enum fields carry a declared member; numeric fields are inside their declared range; window_end is strictly after window_start; Certification.expires_at is strictly after issued_at; Incident.occurred_at is not after the current logical clock; an AGENT TurnResource carries agent_id and role_on_turn and neither gse_unit_id nor gse_type; a GSE TurnResource carries exactly one of gse_unit_id or gse_type and neither agent_id nor role_on_turn"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_STATION_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_FLIGHT_BANK_NOT_FOUND | ERR_TURN_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_GSE_UNIT_NOT_FOUND | ERR_BILLING_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /subcontractors, POST /flight-banks, POST /turns, POST /agents, POST /certifications, POST /gse-units, POST /turn-resources, POST /incidents, POST /billing-periods, POST /billing-lines"

  - priority: 6
    category: business_referential
    check: "Station-scope coherence: FlightBank.station_id == Turn.station_id; Agent.station_id == Turn.station_id; GseUnit.station_id == Turn.station_id; Certification.station_id == Agent.station_id; Subcontractor.station_id == Agent.station_id; parent Subcontractor.station_id == child station_id; the BillingLine's Turn.station_id == BillingPeriod.station_id; an Incident's turn / gse unit / agent all belong to Incident.station_id"
    error_id: ERR_STATION_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /subcontractors, POST /flight-banks, POST /turns, POST /agents, POST /certifications, POST /turn-resources, POST /incidents, POST /billing-lines"

  - priority: 7
    category: state
    check: "The supplied expected_<parent>_version equals the live parent version (optimistic concurrency control)"
    error_id: "ERR_STALE_TURN_VERSION | ERR_STALE_PERIOD_VERSION"
    http_status: 412
    applies_to: "POST /turn-resources, POST /billing-lines"

  - priority: 8
    category: state
    check: "Acting-entity ownership: when X-User-Role is SubcontractorAdmin, the resource being written must belong to the Subcontractor whose id equals X-User-ID (POST /agents requires subcontractor_id == X-User-ID; POST /certifications requires the target agent's subcontractor_id == X-User-ID)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /agents, POST /certifications"

  - priority: 9
    category: business_safety
    check: "Segregation of duties on X-User-ID: the incident reporter may not INVESTIGATE; the user who issued findings may not CLOSE; the user who finalized a BillingPeriod may not APPROVE it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incidents/{incidentId}/transitions, POST /billing-periods/{billingPeriodId}/transitions"

  - priority: 10
    category: state
    check: "The target resource's own status admits the requested transition (state-machine from-state check), including terminal-state lockdown, the Incident reopen cap, the billing-period-must-be-OPEN rule for line writes, and the turn-must-be-SCHEDULED-or-RESOURCED rule for resource writes"
    error_id: "ERR_INVALID_STATE | ERR_TURN_NOT_ASSIGNABLE | ERR_PERIOD_NOT_OPEN | ERR_REOPEN_LIMIT_REACHED | ERR_TURN_NOT_BILLABLE"
    http_status: 409
    applies_to: "all action endpoints, POST /turn-resources, POST /billing-lines"

  - priority: 11
    category: state
    check: "Cross-entity state gates: Station.status must be OPEN for POST /flight-banks, POST /turns, POST /turn-resources and Turn START; FlightBank.bank_status must be PUBLISHED for staffing SUBMIT and IN {PUBLISHED, LOCKED} for Turn START; FlightBank.staffing_status must be APPROVED for Turn START; the assigned Agent.status must be ACTIVE; the agent's Subcontractor.status must be IN {APPROVED, PROBATION}; an explicitly named GseUnit.status must be AVAILABLE"
    error_id: "ERR_STATION_NOT_OPEN | ERR_BANK_NOT_PUBLISHED | ERR_STAFFING_NOT_APPROVED | ERR_AGENT_NOT_ACTIVE | ERR_SUBCONTRACTOR_NOT_APPROVED | ERR_GSE_NOT_SERVICEABLE"
    http_status: 409
    applies_to: "POST /flight-banks, POST /turns, POST /turn-resources, POST /turns/{turnId}/lifecycle, POST /flight-banks/{flightBankId}/staffing-transitions"

  - priority: 12
    category: business_safety
    check: "Safety gates: the station's oversight_posture must permit the operation (RESTRICTED blocks POST /turns and POST /flight-banks; ENHANCED blocks assigning a SUBCONTRACTED agent); the assigned agent must hold every certification REQUIRED_CERTS_BY_ROLE demands, current at the occupation's window_start; a BillingPeriod may not be finalized while the station carries an Incident with severity CRITICAL and status != CLOSED"
    error_id: "ERR_STATION_POSTURE_RESTRICTED | ERR_CERT_NOT_CURRENT | ERR_OPEN_CRITICAL_INCIDENT"
    http_status: "409 for the posture and open-incident gates, 422 for certification currency"
    applies_to: "POST /turns, POST /flight-banks, POST /turn-resources, POST /billing-periods/{billingPeriodId}/transitions"

  - priority: 13
    category: business_temporal
    check: "Interval geometry: a Turn's [scheduled_in, scheduled_out] must sit inside its FlightBank's [window_start, window_end]; a GSE occupation must not collide with another occupation on the same unit under the buffered half-open test; a GSE occupation must not collide with the unit's closed service-hold window; an AGENT occupation must not collide with another occupation for the same agent under the bare closed-interval test"
    error_id: "ERR_TURN_WINDOW_OUTSIDE_BANK | ERR_GSE_WINDOW_CONFLICT | ERR_GSE_SERVICE_HOLD_CONFLICT | ERR_AGENT_DUTY_OVERLAP"
    http_status: 409
    applies_to: "POST /turns, POST /turn-resources"

  - priority: 14
    category: business_constraint
    check: "Aggregates and uniqueness: an agent's projected same-UTC-day duty must not exceed 600 minutes; a staffing plan may only be APPROVED at staffing_coverage_pct >= 100.00; iata_code is unique globally and bank_code / employee_code / asset_tag / period_code are unique per station; the GSE selector's candidate pool must be non-empty"
    error_id: "ERR_AGENT_DUTY_LIMIT_EXCEEDED | ERR_STAFFING_COVERAGE_INSUFFICIENT | ERR_DUPLICATE_CODE | ERR_NO_ELIGIBLE_GSE"
    http_status: "422 for the duty cap and coverage shortfall, 409 for duplicates and the empty selector pool"
    applies_to: "POST /stations, POST /flight-banks, POST /agents, POST /gse-units, POST /billing-periods, POST /turn-resources, POST /flight-banks/{flightBankId}/staffing-transitions"

  - priority: 15
    category: business_fiscal
    check: "Fiscal gates: a Turn may carry at most one non-VOID BillingLine across all periods; a BillingPeriod may only be finalized when otp_penalty_cents + damage_penalty_cents <= Station.penalty_cap_cents; a station may not be CLOSED while it holds live turns or a BillingPeriod in status OPEN or PENDING_APPROVAL"
    error_id: "ERR_DUPLICATE_BILLING_LINE | ERR_PENALTY_CAP_BREACHED | ERR_STATION_HAS_ACTIVE_WORK"
    http_status: "409 for duplicates and active work, 422 for the penalty cap"
    applies_to: "POST /billing-lines, POST /billing-periods/{billingPeriodId}/transitions, POST /stations/{stationId}/lifecycle"

  - priority: 16
    category: business_constraint
    check: "Season coherence: FlightBank.season_code must equal Station.season_code at creation, and a season rollover must name a season different from the one already in force"
    error_id: ERR_SEASON_MISMATCH
    http_status: 409
    applies_to: "POST /flight-banks, POST /stations/{stationId}/season-rollovers"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:

  # ---------------------------------------------------------------- Station
  - method: POST
    path: "/stations"
    description: "Register a ground handling station contract in PLANNED status"
    roles: [StationManager]
    code: 201
    input: [iata_code, name, handler_code, season_code, "season_start_date?", "season_end_date?", "otp_target_pct?", "otp_tolerance_minutes?", "gse_reposition_buffer_minutes?", "penalty_cap_cents?", "damage_penalty_multiplier?"]
    output: Station
    side_effects:
      - "status=PLANNED, oversight_posture=NORMAL, otp_rolling_pct=100.00"
      - "completed_turn_count=0, on_time_turn_count=0, open_critical_incident_count=0, open_major_incident_count=0"

  - method: GET
    path: "/stations/{stationId}"
    description: "Read one station including its computed posture and OTP roll-up"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "List stations with pagination"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["status?", "season_code?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  - method: POST
    path: "/stations/{stationId}/lifecycle"
    description: "Drive the station lifecycle: OPEN, SUSPEND, RESUME or CLOSE"
    roles: [StationManager]
    code: 200
    input: [action, "reason?"]
    output: Station
    side_effects:
      - "OPEN: opened_at stamped from the logical clock"
      - "SUSPEND: four-hop cascade - published banks LOCKED, their APPROVED staffing plans to REVISION_REQUIRED, their live turns to DISRUPTED, their reserved/committed resources CANCELLED with ledger decrements"
      - "RESUME: oversight_posture recomputed"
      - "CLOSE: closed_at stamped, all banks ARCHIVED, all GSE units RETIRED"

  - method: POST
    path: "/stations/{stationId}/season-rollovers"
    description: "Roll the station to the other IATA scheduling season and archive the outgoing season's banks"
    roles: [StationManager]
    code: 200
    input: [to_season_code, season_start_date, season_end_date]
    output: Station
    side_effects:
      - "season_code, season_start_date and season_end_date replaced"
      - "three-hop cascade - outgoing-season banks ARCHIVED, their live turns CANCELLED, their reserved/committed resources CANCELLED with ledger decrements"

  # --------------------------------------------------------- Subcontractor
  - method: POST
    path: "/subcontractors"
    description: "Register a subcontracting firm at a station in PENDING_VETTING status"
    roles: [StationManager]
    code: 201
    input: [station_id, legal_name, "parent_subcontractor_id?"]
    output: Subcontractor
    side_effects:
      - "status=PENDING_VETTING; tier derived from parent_subcontractor_id"
      - "compliance_score=100.00, audit_compliance_score=100.00, oversight_flag=false"

  - method: GET
    path: "/subcontractors/{subcontractorId}"
    description: "Read one subcontractor including both compliance-score variants"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: GET
    path: "/subcontractors"
    description: "List subcontractors, filterable by station and by tier-1 sponsor"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "parent_subcontractor_id?", "status?", "limit?", "offset?"]
    output: Subcontractor[]
    side_effects: []

  - method: POST
    path: "/subcontractors/{subcontractorId}/oversight-decisions"
    description: "Record an oversight decision: APPROVE, PLACE_ON_PROBATION, REINSTATE, SUSPEND or TERMINATE"
    roles: [StationManager]
    code: 200
    input: [decision, "note?"]
    output: Subcontractor
    side_effects:
      - "status transition per the Subcontractor state machine"
      - "TERMINATE cascades: agents TERMINATED, their reserved/committed resources CANCELLED with ledger decrements"

  # ------------------------------------------------------------ FlightBank
  - method: POST
    path: "/flight-banks"
    description: "Create a flight bank window at an open station"
    roles: [DutyOfficer, StationManager]
    code: 201
    input: [station_id, bank_code, season_code, window_start, window_end, "planned_headcount?"]
    output: FlightBank
    side_effects:
      - "bank_status=DRAFT, staffing_status=DRAFT"
      - "required_headcount=0, turn_count=0, staffing_coverage_pct=100.00"

  - method: GET
    path: "/flight-banks/{flightBankId}"
    description: "Read one flight bank with both status axes and the staffing roll-up"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: FlightBank
    side_effects: []

  - method: GET
    path: "/flight-banks"
    description: "List flight banks, filterable by station and season"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "season_code?", "bank_status?", "staffing_status?", "limit?", "offset?"]
    output: FlightBank[]
    side_effects: []

  - method: POST
    path: "/flight-banks/{flightBankId}/lifecycle"
    description: "Move the bank_status axis: PUBLISH (DutyOfficer), LOCK or ARCHIVE (StationManager)"
    roles: [DutyOfficer, StationManager]
    code: 200
    input: [action]
    output: FlightBank
    side_effects:
      - "bank_status transition only; staffing_status is untouched"
      - "required_headcount and staffing_coverage_pct recomputed"

  - method: POST
    path: "/flight-banks/{flightBankId}/staffing-transitions"
    description: "Move the staffing_status axis: SUBMIT or REVISE (DutyOfficer), APPROVE or REJECT (StationManager)"
    roles: [DutyOfficer, StationManager]
    code: 200
    input: [action, "planned_headcount?"]
    output: FlightBank
    side_effects:
      - "staffing_status transition only; bank_status is untouched"
      - "REVISE replaces planned_headcount when supplied and recomputes staffing_coverage_pct"
      - "APPROVE and REJECT stamp last_staffing_decision_by_user_id"

  # ------------------------------------------------------------------ Turn
  - method: POST
    path: "/turns"
    description: "Schedule an aircraft turnaround inside a flight bank"
    roles: [DutyOfficer]
    code: 201
    input: [station_id, flight_bank_id, flight_number, turn_type, scheduled_in, scheduled_out]
    output: Turn
    side_effects:
      - "status=SCHEDULED, otp_result=PENDING, version=1"
      - "required_agent_count and required_gse_count derived from turn_requirement_matrix"
      - "FlightBank.required_headcount, turn_count and staffing_coverage_pct recomputed; an APPROVED staffing plan whose coverage drops below 100.00 moves to REVISION_REQUIRED"

  - method: GET
    path: "/turns/{turnId}"
    description: "Read one turnaround including coverage counters, OTP result and the current version for optimistic concurrency"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Turn
    side_effects: []

  - method: GET
    path: "/turns"
    description: "List turnarounds, filterable by station, bank and status"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "flight_bank_id?", "status?", "otp_result?", "limit?", "offset?"]
    output: Turn[]
    side_effects: []

  - method: POST
    path: "/turns/{turnId}/lifecycle"
    description: "Drive the turnaround: START, COMPLETE or CANCEL"
    roles: [DutyOfficer]
    code: 200
    input: [action, "actual_in?", "actual_out?", "delay_code?", "reason?"]
    output: Turn
    side_effects:
      - "START: actual_in recorded and reserved resources moved to COMMITTED"
      - "COMPLETE: actual_out recorded; turn_otp_classification runs; committed resources RELEASED with ledger decrements; GSE cycles incremented and units at their service interval moved to IN_MAINTENANCE; station OTP roll-up and oversight_posture recomputed"
      - "CANCEL: reserved and committed resources CANCELLED with ledger decrements; the bank staffing roll-up is recomputed"

  # ----------------------------------------------------------------- Agent
  - method: POST
    path: "/agents"
    description: "Register a ground handling agent at a station, optionally employed through a subcontractor"
    roles: [StationManager, SubcontractorAdmin]
    code: 201
    input: [station_id, employee_code, full_name, "subcontractor_id?"]
    output: Agent
    side_effects:
      - "status=ACTIVE, assigned_duty_minutes=0"
      - "employment_type derived from subcontractor_id; certification_posture=LAPSED until a RAMP_SAFETY endorsement exists"

  - method: GET
    path: "/agents/{agentId}"
    description: "Read one agent including the duty-minute ledger and certification posture"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents"
    description: "List agents, filterable by station and employing subcontractor"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "subcontractor_id?", "status?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  # --------------------------------------------------------- Certification
  - method: POST
    path: "/certifications"
    description: "Issue a station-scoped training endorsement to an agent"
    roles: [StationManager, SubcontractorAdmin]
    code: 201
    input: [agent_id, station_id, cert_type, issued_at, expires_at]
    output: Certification
    side_effects:
      - "status=VALID; currency_state computed against the logical clock"
      - "the owning Agent recomputes certification_posture and, when SUSPENDED and this is a CURRENT RAMP_SAFETY at its own station, returns to ACTIVE"

  - method: GET
    path: "/certifications/{certificationId}"
    description: "Read one endorsement including its computed currency state"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/certifications"
    description: "List endorsements, filterable by agent, station and type"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["agent_id?", "station_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/certifications/{certificationId}/revoke"
    description: "Revoke a training endorsement and cascade through agent suspension"
    roles: [SafetyOfficer, StationManager]
    code: 200
    input: [reason]
    output: Certification
    side_effects:
      - "status=REVOKED, currency_state=REVOKED, revoked_at stamped"
      - "four-hop cascade - the agent's posture becomes LAPSED and ACTIVE moves to SUSPENDED, that agent's reserved and committed resources are CANCELLED with duty-minute decrements, any turn that loses coverage demotes RESOURCED to SCHEDULED, and that demotion moves an APPROVED bank staffing plan to REVISION_REQUIRED"

  # --------------------------------------------------------------- GseUnit
  - method: POST
    path: "/gse-units"
    description: "Register a ground support equipment unit at a station"
    roles: [StationManager]
    code: 201
    input: [station_id, asset_tag, gse_type, "condition_score?", "service_interval_cycles?", "cycles_since_service?"]
    output: GseUnit
    side_effects:
      - "status=AVAILABLE, committed_occupation_minutes=0, service hold cleared"

  - method: GET
    path: "/gse-units/{gseUnitId}"
    description: "Read one GSE unit including its occupation-minute ledger and service hold"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: GseUnit
    side_effects: []

  - method: GET
    path: "/gse-units"
    description: "List GSE units, filterable by station, type and status"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "gse_type?", "status?", "limit?", "offset?"]
    output: GseUnit[]
    side_effects: []

  - method: POST
    path: "/gse-units/{gseUnitId}/service-events"
    description: "Schedule a maintenance hold (HOLD_SCHEDULED) or record a completed service (SERVICE_COMPLETED)"
    roles: [StationManager, SafetyOfficer]
    code: 200
    input: [event_type, "hold_start?", "hold_end?"]
    output: GseUnit
    side_effects:
      - "HOLD_SCHEDULED with hold_start at or before the logical clock: the closed service-hold window is recorded and status moves AVAILABLE to IN_MAINTENANCE"
      - "HOLD_SCHEDULED with hold_start strictly after the logical clock: the closed window is recorded as a BOOKED future hold and status stays AVAILABLE"
      - "SERVICE_COMPLETED: status back to AVAILABLE, cycles_since_service reset to 0, last_service_at stamped, hold cleared"

  # ---------------------------------------------------------- TurnResource
  - method: POST
    path: "/turn-resources"
    description: "Commit an agent or a GSE unit to a turnaround. Optimistically concurrent on the Turn: expected_turn_version must match the live Turn.version. When resource_kind is GSE and gse_unit_id is omitted, the server runs gse_unit_selector over the requested gse_type."
    roles: [DutyOfficer]
    code: 201
    input: [turn_id, resource_kind, window_start, window_end, expected_turn_version, "agent_id?", "gse_unit_id?", "gse_type?", "role_on_turn?"]
    output: TurnResource
    side_effects:
      - "status=RESERVED; occupied_minutes computed"
      - "GseUnit.committed_occupation_minutes or Agent.assigned_duty_minutes incremented by occupied_minutes"
      - "Turn.assigned_agent_count and assigned_gse_count recomputed; a fully covered SCHEDULED turn auto-promotes to RESOURCED"
      - "increments Turn.version by 1"

  - method: GET
    path: "/turn-resources/{turnResourceId}"
    description: "Read one resource occupation"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: TurnResource
    side_effects: []

  - method: GET
    path: "/turn-resources"
    description: "List resource occupations, filterable by turn, agent and GSE unit"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["turn_id?", "agent_id?", "gse_unit_id?", "status?", "resource_kind?", "limit?", "offset?"]
    output: TurnResource[]
    side_effects: []

  - method: POST
    path: "/turn-resources/{turnResourceId}/release"
    description: "Release a reserved or committed occupation ahead of turn completion"
    roles: [DutyOfficer]
    code: 200
    input: ["reason?"]
    output: TurnResource
    side_effects:
      - "status=RELEASED"
      - "GseUnit.committed_occupation_minutes or Agent.assigned_duty_minutes decremented by occupied_minutes"
      - "the owning Turn recomputes coverage and may demote RESOURCED to SCHEDULED, which moves an APPROVED bank staffing plan to REVISION_REQUIRED"

  # -------------------------------------------------------------- Incident
  - method: POST
    path: "/incidents"
    description: "Report a damage, injury or near-miss event at a station"
    roles: [DutyOfficer, SafetyOfficer, StationManager]
    code: 201
    input: [station_id, incident_type, severity, occurred_at, "turn_id?", "gse_unit_id?", "agent_id?", "description?"]
    output: Incident
    side_effects:
      - "status=REPORTED, reopen_count=0, reported_by_user_id taken from X-User-ID"
      - "subcontractor_id snapshotted from the referenced Agent"
      - "station open-incident counters and oversight_posture recomputed"
      - "severity CRITICAL with a gse_unit_id starts a four-hop cascade - the unit is QUARANTINED, its reserved and committed occupations are CANCELLED with ledger decrements, affected turns demote RESOURCED to SCHEDULED, and their APPROVED bank staffing plans move to REVISION_REQUIRED"

  - method: GET
    path: "/incidents/{incidentId}"
    description: "Read one incident file"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/incidents"
    description: "List incidents, filterable by station, turn, GSE unit, agent and subcontractor"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "turn_id?", "gse_unit_id?", "agent_id?", "subcontractor_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/incidents/{incidentId}/transitions"
    description: "Drive the investigation: INVESTIGATE, ISSUE_FINDINGS, CLOSE or REOPEN"
    roles: [SafetyOfficer]
    code: 200
    input: [action, "root_cause_code?", "liability_party?", "assessed_damage_cents?", "note?"]
    output: Incident
    side_effects:
      - "INVESTIGATE: investigator_user_id stamped; the reporter is refused"
      - "ISSUE_FINDINGS: root cause, liability party and damage valuation recorded; findings_issued_by_user_id stamped"
      - "CLOSE: closed_by_user_id stamped and the findings issuer is refused; station counters and oversight_posture recomputed; a quarantined unit moves to IN_MAINTENANCE; the linked subcontractor recomputes both compliance variants and may drop from APPROVED to PROBATION"
      - "REOPEN: reopen_count incremented and capped at 2; station counters, posture and subcontractor scores recomputed"

  # --------------------------------------------------------- BillingPeriod
  - method: POST
    path: "/billing-periods"
    description: "Open a service-level billing period for a station"
    roles: [BillingController]
    code: 201
    input: [station_id, period_code, window_start, window_end]
    output: BillingPeriod
    side_effects:
      - "status=OPEN, line_count=0, accrued_cents=0, rebate_tier=NONE, reject_count=0"

  - method: GET
    path: "/billing-periods/{billingPeriodId}"
    description: "Read one billing period including the rebate tier, both total ledgers and the version for optimistic concurrency"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []

  - method: GET
    path: "/billing-periods"
    description: "List billing periods, filterable by station and status"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []

  - method: POST
    path: "/billing-periods/{billingPeriodId}/transitions"
    description: "Drive the invoice: FINALIZE (BillingController), APPROVE or REJECT (ContractAuditor)"
    roles: [BillingController, ContractAuditor]
    code: 200
    input: [action, "note?"]
    output: BillingPeriod
    side_effects:
      - "FINALIZE: every non-VOID line flips PROVISIONAL to FINAL and is recomputed under the FINAL variant; period_billing_rollup runs all eight steps; finalized_by_user_id stamped"
      - "APPROVE: approved_by_user_id stamped and the period becomes read-only; refused when the approver is the finalizer"
      - "REJECT: compensating recomputation - every FINAL line reverts to PROVISIONAL, penalties and rebate allocations return to 0, finalized_by_user_id is cleared and reject_count is incremented"

  # ----------------------------------------------------------- BillingLine
  - method: POST
    path: "/billing-lines"
    description: "Accrue a provisional service charge for a turnaround into an open billing period. Optimistically concurrent on the BillingPeriod: expected_billing_period_version must match the live BillingPeriod.version."
    roles: [BillingController]
    code: 201
    input: [billing_period_id, turn_id, expected_billing_period_version]
    output: BillingLine
    side_effects:
      - "status=PROVISIONAL; turn_type_snapshot copied from the turn; turn_service_charge runs in the PROVISIONAL variant"
      - "period line_count, gross_total_cents, accrued_cents and net_total_cents recomputed; rebate_tier stays NONE while every line is PROVISIONAL"
      - "Turn.billed = true"
      - "increments BillingPeriod.version by 1"

  - method: GET
    path: "/billing-lines/{billingLineId}"
    description: "Read one billing line including its variant-dependent amounts"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: []
    output: BillingLine
    side_effects: []

  - method: GET
    path: "/billing-lines"
    description: "List billing lines, filterable by period and turn"
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: ["billing_period_id?", "turn_id?", "status?", "limit?", "offset?"]
    output: BillingLine[]
    side_effects: []

  - method: POST
    path: "/billing-lines/{billingLineId}/void"
    description: "Void an accrued line; the compensating action for line creation"
    roles: [BillingController]
    code: 200
    input: [reason]
    output: BillingLine
    side_effects:
      - "status=VOID and void_reason recorded"
      - "period line_count, gross_total_cents, accrued_cents, rebate_tier, rebate_cents and net_total_cents recomputed without this line"
      - "Turn.billed = false"

  # ------------------------------------------------------- test-driving API
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock may be moved forward or backward to any instant."
    roles: [StationManager, DutyOfficer, SafetyOfficer, BillingController, ContractAuditor, SubcontractorAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "every currency_state, certification_posture and compliance-score read recomputes against the new instant"
      - "no entity status is changed by moving the clock"

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed on the endpoint, or is not permitted for the specific action on a multi-action endpoint"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "A SubcontractorAdmin writes a resource that does not belong to the Subcontractor whose id equals X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The incident reporter tries to INVESTIGATE, the findings issuer tries to CLOSE, or the period finalizer tries to APPROVE"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, undeclared enum member, out-of-range number, window_end not after window_start, expires_at not after issued_at, occurred_at after the logical clock, or an inconsistent AGENT/GSE resource payload"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "No Station with the referenced id"
  - id: ERR_SUBCONTRACTOR_NOT_FOUND
    http: 404
    condition: "No Subcontractor with the referenced id"
  - id: ERR_FLIGHT_BANK_NOT_FOUND
    http: 404
    condition: "No FlightBank with the referenced id"
  - id: ERR_TURN_NOT_FOUND
    http: 404
    condition: "No Turn with the referenced id"
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "No Agent with the referenced id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No Certification with the referenced id"
  - id: ERR_GSE_UNIT_NOT_FOUND
    http: 404
    condition: "No GseUnit with the referenced id"
  - id: ERR_TURN_RESOURCE_NOT_FOUND
    http: 404
    condition: "No TurnResource with the referenced id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No Incident with the referenced id"
  - id: ERR_BILLING_PERIOD_NOT_FOUND
    http: 404
    condition: "No BillingPeriod with the referenced id"
  - id: ERR_BILLING_LINE_NOT_FOUND
    http: 404
    condition: "No BillingLine with the referenced id"
  - id: ERR_STATION_SCOPE_MISMATCH
    http: 409
    condition: "Two referenced resources belong to different stations, or a certification / subcontractor is attached across a station boundary"
  - id: ERR_STALE_TURN_VERSION
    http: 412
    condition: "expected_turn_version does not equal the live Turn.version on POST /turn-resources"
  - id: ERR_STALE_PERIOD_VERSION
    http: 412
    condition: "expected_billing_period_version does not equal the live BillingPeriod.version on POST /billing-lines"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested action is not an edge out of the resource's current state, including any action attempted on a terminal state"
  - id: ERR_STATION_NOT_OPEN
    http: 409
    condition: "An operation that requires Station.status == OPEN is attempted while the station is PLANNED, SUSPENDED or CLOSED"
  - id: ERR_STATION_POSTURE_RESTRICTED
    http: 409
    condition: "oversight_posture is RESTRICTED and a Turn or FlightBank creation is attempted, or oversight_posture is ENHANCED and a SUBCONTRACTED agent is being assigned"
  - id: ERR_BANK_NOT_PUBLISHED
    http: 409
    condition: "A staffing SUBMIT is attempted while bank_status is not PUBLISHED, or a Turn START is attempted while bank_status is neither PUBLISHED nor LOCKED"
  - id: ERR_STAFFING_NOT_APPROVED
    http: 409
    condition: "A Turn START is attempted while the owning FlightBank.staffing_status is not APPROVED"
  - id: ERR_STAFFING_COVERAGE_INSUFFICIENT
    http: 422
    condition: "A staffing APPROVE is attempted while staffing_coverage_pct is below 100.00"
  - id: ERR_TURN_NOT_ASSIGNABLE
    http: 409
    condition: "A TurnResource is created against a Turn whose status is not SCHEDULED or RESOURCED"
  - id: ERR_AGENT_NOT_ACTIVE
    http: 409
    condition: "The agent being assigned has status SUSPENDED or TERMINATED"
  - id: ERR_SUBCONTRACTOR_NOT_APPROVED
    http: 409
    condition: "The agent being assigned is employed by a Subcontractor whose status is neither APPROVED nor PROBATION, or a tier-2 subcontractor is approved while its sponsor is not APPROVED"
  - id: ERR_CERT_NOT_CURRENT
    http: 422
    condition: "The agent lacks a station-scoped, VALID, unexpired endorsement for at least one cert_type required by role_on_turn, evaluated at the occupation's window_start"
  - id: ERR_GSE_NOT_SERVICEABLE
    http: 409
    condition: "The explicitly named GSE unit is IN_MAINTENANCE, QUARANTINED or RETIRED"
  - id: ERR_GSE_WINDOW_CONFLICT
    http: 409
    condition: "The requested GSE occupation collides with another occupation on the same unit under the buffered half-open interval test"
  - id: ERR_GSE_SERVICE_HOLD_CONFLICT
    http: 409
    condition: "The requested GSE occupation collides with the unit's closed maintenance-hold window"
  - id: ERR_AGENT_DUTY_OVERLAP
    http: 409
    condition: "The requested agent occupation collides with another occupation for the same agent under the bare closed-interval test"
  - id: ERR_AGENT_DUTY_LIMIT_EXCEEDED
    http: 422
    condition: "The agent's projected duty minutes for the UTC calendar day of window_start would exceed 600"
  - id: ERR_TURN_WINDOW_OUTSIDE_BANK
    http: 409
    condition: "scheduled_in is before the bank's window_start or scheduled_out is after the bank's window_end"
  - id: ERR_NO_ELIGIBLE_GSE
    http: 409
    condition: "gse_unit_selector produced an empty candidate pool for the requested gse_type and window"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "iata_code already exists globally, or bank_code / employee_code / asset_tag / period_code already exists at that station"
  - id: ERR_DUPLICATE_BILLING_LINE
    http: 409
    condition: "The turn already carries a BillingLine with status PROVISIONAL or FINAL"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "REOPEN is attempted on an Incident whose reopen_count is already 2"
  - id: ERR_OPEN_CRITICAL_INCIDENT
    http: 409
    condition: "A BillingPeriod FINALIZE is attempted while the station holds an Incident with severity CRITICAL and status != CLOSED"
  - id: ERR_PENALTY_CAP_BREACHED
    http: 422
    condition: "A BillingPeriod FINALIZE would produce otp_penalty_cents + damage_penalty_cents greater than Station.penalty_cap_cents"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "A BillingLine create or void is attempted against a BillingPeriod whose status is not OPEN"
  - id: ERR_TURN_NOT_BILLABLE
    http: 422
    condition: "A BillingLine is created for a Turn whose status is CANCELLED or DISRUPTED, or a Turn CANCEL is attempted while the turn carries a non-VOID line"
  - id: ERR_SEASON_MISMATCH
    http: 409
    condition: "FlightBank.season_code differs from Station.season_code at creation, or a season rollover names the season already in force"
  - id: ERR_STATION_HAS_ACTIVE_WORK
    http: 409
    condition: "A station CLOSE is attempted while live turns or non-approved billing periods remain"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: StationManager
    description: "Owns the station contract: opening, suspension, closure, seasonal rollover, GSE fleet registration, subcontractor oversight and staffing-plan approval"
    identity: "opaque"
    exclusive_operations:
      - "POST /stations"
      - "POST /stations/{stationId}/lifecycle"
      - "POST /stations/{stationId}/season-rollovers"
      - "POST /subcontractors"
      - "POST /subcontractors/{subcontractorId}/oversight-decisions"
      - "POST /gse-units"
      - "staffing APPROVE and REJECT on POST /flight-banks/{flightBankId}/staffing-transitions"
      - "bank LOCK and ARCHIVE on POST /flight-banks/{flightBankId}/lifecycle"
    shared_operations:
      - "POST /flight-banks (with DutyOfficer)"
      - "POST /agents (with SubcontractorAdmin)"
      - "POST /certifications (with SubcontractorAdmin)"
      - "POST /certifications/{certificationId}/revoke (with SafetyOfficer)"
      - "POST /gse-units/{gseUnitId}/service-events (with SafetyOfficer)"
      - "POST /incidents (with DutyOfficer and SafetyOfficer)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: DutyOfficer
    description: "Runs the ramp: builds and publishes flight banks, schedules turnarounds, commits agents and equipment, records actual times and reports events"
    identity: "opaque"
    exclusive_operations:
      - "POST /turns"
      - "POST /turns/{turnId}/lifecycle"
      - "POST /turn-resources"
      - "POST /turn-resources/{turnResourceId}/release"
      - "staffing SUBMIT and REVISE on POST /flight-banks/{flightBankId}/staffing-transitions"
      - "bank PUBLISH on POST /flight-banks/{flightBankId}/lifecycle"
    shared_operations:
      - "POST /flight-banks (with StationManager)"
      - "POST /incidents (with SafetyOfficer and StationManager)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: SafetyOfficer
    description: "Owns investigations and airworthiness holds: drives the incident file, revokes endorsements and schedules equipment maintenance"
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{incidentId}/transitions"
    shared_operations:
      - "POST /certifications/{certificationId}/revoke (with StationManager)"
      - "POST /gse-units/{gseUnitId}/service-events (with StationManager)"
      - "POST /incidents (with DutyOfficer and StationManager)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: BillingController
    description: "Prepares the service-level invoice: opens periods, accrues per-turn lines, voids lines and finalizes the period"
    identity: "opaque"
    exclusive_operations:
      - "POST /billing-periods"
      - "POST /billing-lines"
      - "POST /billing-lines/{billingLineId}/void"
      - "billing FINALIZE on POST /billing-periods/{billingPeriodId}/transitions"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ContractAuditor
    description: "Independent contract control: approves or rejects a finalized billing period. May never be the same X-User-ID that finalized it."
    identity: "opaque"
    exclusive_operations:
      - "billing APPROVE and REJECT on POST /billing-periods/{billingPeriodId}/transitions"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: SubcontractorAdmin
    description: "Acts on behalf of one subcontracting firm; X-User-ID is that Subcontractor's id. May register and certify only its own agents."
    identity: "entity_backed:Subcontractor"
    exclusive_operations: []
    shared_operations:
      - "POST /agents (with StationManager; subcontractor_id must equal X-User-ID)"
      - "POST /certifications (with StationManager; the target agent must belong to X-User-ID)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
