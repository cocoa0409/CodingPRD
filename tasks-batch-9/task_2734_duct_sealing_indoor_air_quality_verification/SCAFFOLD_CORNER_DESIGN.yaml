        grounds:
          - endpoints[GET /duct-sealing/projects/{id}/comfort-complaints]
          - endpoints[GET /duct-sealing/comfort-complaints/{id}/airflow-readings]
          - entities.AirflowReading
        distinguishing_aspect: "Two complaints on one project sit in different states and one of them holds readings for two different rooms, so the status filter and the room_label filter must cut independently — and the second complaint's reading collection must come back empty rather than borrowing its sibling's rows."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one programme, technician and project"
            - "Complaint 1 (room Den, TOO_COLD) is diagnosed with tolerance_pct 10.00 and carries three readings: Den seq 1 (110.0/100.0), Den seq 2 (105.0/100.0) and Attic seq 1 (80.0/100.0)"
            - "Complaint 2 (room Attic, NOISE) is left OPEN with no readings"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints"
              payload: { project_id: "${proj_id}", room_label: "Den", complaint_type: "TOO_COLD", reported_by: "Alice Nguyen" }
              as: ProgramAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints"
              payload: { project_id: "${proj_id}", room_label: "Attic", complaint_type: "NOISE", reported_by: "Alice Nguyen" }
              as: ProgramAdmin
              captures: { c2_id: $.data.id, c2_status: $.data.status }
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/diagnose"
              payload: { diagnosis_code: "DAMPER_MISADJUSTED", tolerance_pct: 10.00 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/airflow-readings"
              payload: { room_label: "Den", reading_seq: 1, measured_cfm: 110.0, design_cfm: 100.0, damper_position_pct: 60.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/airflow-readings"
              payload: { room_label: "Den", reading_seq: 2, measured_cfm: 105.0, design_cfm: 100.0, damper_position_pct: 55.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
