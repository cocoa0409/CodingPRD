          assert:
            - "RenewalOffer.${ro}.status == ACCEPTED after exactly two counter/revise laps"
            - "RenewalOffer.${ro}.round_index == 5 (initial 1 + 2 COUNTERED + 2 REVISED)"
            - "RenewalOffer.${ro}.proposed_fee_cents == 12650000 (final revised value)"
            - "A DRAFT renewal agreement exists with start_season_id == ${s3} and base_annual_fee_cents == 12650000"
            - "Original agreement ${ag}.renewal_agreement_id == the new DRAFT agreement's id"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade (different triggers; depths 4 and 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_clear_four_link_cascade_reinstates_account_and_agreement
        grounds:
          - state_machines.Payment.INITIATED_to_CLEARED
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - state_machines.LicenseAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /api/payments/{id}/set_status {CLEARED}:
          payment clear mutates Invoice (link 1) -> invoice PAID recomputes
          Account.balance_due_cents (link 2) -> balance 0 with nothing past due
          auto-reinstates Account SUSPENDED->ACTIVE (link 3) -> account reinstate
          auto-cures ACCOUNT_DEFAULT-suspended LicenseAgreement (link 4). Each link
          is caused by the previous link's mutation, not by the original trigger.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1+S2 PUBLISHED with all S1 events COMPLETED, account ACTIVE, agreement ACTIVE (term 2), license fee invoice PAID"
            - "Manual invoice M (subtotal 100000, due 2026-08-20) left unpaid; at settle clock 2027-02-20 M is 184 days past due -> late fee 9000 -> amount_due 109000"
            - "Season settle created F_B_SHORTFALL invoice S == 4000000 (no catering accruals) and suspended the account (HOLD) and the agreement (ACCOUNT_DEFAULT, suspension_count 1)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2027-28", starts_on: "2027-09-01T00:00:00Z", ends_on: "2028-02-15T00:00:00Z", renewal_window_opens_on: "2027-12-01T00:00:00Z", renewal_window_closes_on: "2028-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s2: $.data.id } }
            - { call: "POST /api/seasons/${s2}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 2, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "GET /api/invoices", payload: { agreement_id: "${ag}", invoice_type: "LICENSE_FEE" }, as: FinanceController, captures: { invl: "$.data[0].id "} }
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 12000000, method: ACH, allocations: [ { invoice_id: "${invl}", amount_cents: 12000000 } ] }, as: FinanceController, captures: { p0: $.data.id } }
            - { call: "POST /api/payments/${p0}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Suite signage", quantity: 1, unit_price_cents: 100000 } ], due_on: "2026-08-20T00:00:00Z" }, as: FinanceController, captures: { invm: $.data.id } }
            - { call: "POST /api/invoices/${invm}/issue", payload: {}, as: FinanceController }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-16T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/events/${e1}/set_status", payload: { target_status: "COMPLETED" }, as: StadiumAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/seasons/${s1}/settle", payload: {}, as: FinanceController }
            - { call: "GET /api/invoices", payload: { agreement_id: "${ag}", invoice_type: "F_B_SHORTFALL" }, as: FinanceController, captures: { invs: "$.data[0].id "} }
          trigger:
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 4109000, method: WIRE, allocations: [ { invoice_id: "${invm}", amount_cents: 109000 }, { invoice_id: "${invs}", amount_cents: 4000000 } ] }, as: FinanceController, captures: { p1: $.data.id } }
            - { call: "POST /api/payments/${p1}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController }
          assert:
            - "Invoice.${invm}.status == PAID (link 1: allocation 109000 == amount_due 109000 incl. 9000 late fee)"
            - "Invoice.${invs}.status == PAID"
            - "Account.${ac}.balance_due_cents == 0 (link 2: ledger recompute)"
            - "Account.${ac}.status == ACTIVE (link 3: auto-reinstate on zero balance with nothing past due)"
            - "LicenseAgreement.${ag}.status == ACTIVE and suspension_reason == null (link 4: auto-cure of ACCOUNT_DEFAULT suspension)"
            - "LicenseAgreement.${ag}.suspension_count == 1"
            - "Account.${ac}.lifetime_spend_cents == 16109000 (12000000 + 4109000)"

      - name: season_settle_shortfall_invoice_balance_standing_cascade
        grounds:
          - state_machines.Season.PUBLISHED_to_SETTLED
          - calculations.f_b_minimum_accrual
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST /api/seasons/{id}/settle):
          settle runs f_b_minimum_accrual over the season's catering orders (link 1)
          -> shortfall 3990600 creates an ISSUED F_B_SHORTFALL invoice which recomputes
          Account.balance_due_cents upward (link 2) -> the balance recompute drives the
          credit_standing/term evaluation (link 3: standing stays GOOD because the new
          invoice is not yet past due; agreement enters EXPIRING since S2 is its last
          covered season).
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1+S2 PUBLISHED, all S1 events COMPLETED, agreement ACTIVE (term 2, fb minimum 4000000), license fee invoice PAID"
            - "One CONFIRMED catering order on E1 with subtotal 9400 (net accrual 9400)"
