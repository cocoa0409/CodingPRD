          - "calculations.buyout_savings_vs_estimate"
        distinguishing_aspect: "Summary roll-up under FINAL basis: one package budget 10000000 with a PENDING_AWARD subcontract 9500000 -> total_estimated_cents 10000000, total_awarded_cents 9500000, total_savings_cents 500000."
        test_recipe:
          setup: ["one package with a PENDING_AWARD subcontract at 9500000"]
          setup_api_calls:
            - call: "POST /projects"
