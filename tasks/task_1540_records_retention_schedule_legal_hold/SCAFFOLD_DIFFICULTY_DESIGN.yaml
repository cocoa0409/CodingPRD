              payload: {}
              as: RecordsManager
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-ADJ", retention_months: 48, trigger_basis: "EVENT_DATE", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { adj: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-OVR", retention_months: 48, trigger_basis: "EVENT_DATE", effective_from: "2024-06-01T00:00:00Z", effective_to: "2024-12-01T00:00:00Z" }
              as: RecordsManager
              captures: { ovr: "$.data.id" }
          trigger:
            - call: "POST /ig/retention-rules/${adj}/activate"
              payload: {}
              as: RecordsManager
              captures: { adj_st: "$.data.status" }
            - call: "POST /ig/retention-rules/${ovr}/activate"
              payload: {}
              as: RecordsManager
