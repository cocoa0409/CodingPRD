          - state_machines.Admission.discharge_home
          - calculations.followup_eligibility
          - errors[ERR_DEPENDENT_STATE_INVALID]
        distinguishing_aspect: |
          A different entity pair (FollowUpEnrollment -> Admission.care_status):
          the enrollment payload is fully valid and inside the window, but the
          admission is still STABILIZED. The same payload succeeds the moment the
