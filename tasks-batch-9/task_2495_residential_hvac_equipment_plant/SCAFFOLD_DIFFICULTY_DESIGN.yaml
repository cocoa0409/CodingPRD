          - calculations.platform_warranty_posture
          - calculations.supply_derate_plan
          - entities.ProductPlatform.fields.warranty_posture
        distinguishing_aspect: |
          Three counted claims on 60 released units is exactly 5.00 percent, sitting on the inclusive
          CAPA_THRESHOLD_PCT edge and on the bottom edge of the 5.00-to-7.49 derate band. A strict
          greater-than comparison leaves the posture at OK and opens no corrective action; an
          off-by-one band lookup derates 50 instead of 25. Both threshold and band edge are exercised
          by one claim, and the MIN_CLAIMS_FOR_POSTURE gate means the identical rate one claim
          earlier was still OK.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform with one lot of 60 units at RELEASED_TO_STOCK, so units_built_released == 60, above MIN_UNITS_FOR_POSTURE."
            - "Compressor lot LOT-CMP-51 for month 2026-11 with 100 allocatable units, ACTIVE and unreserved."
            - "Two OPEN claims naming COMPRESSOR / LOT-CMP-51: at 2 claims the rate is 3.33 percent and the claim count is below MIN_CLAIMS_FOR_POSTURE, so warranty_posture is OK."
