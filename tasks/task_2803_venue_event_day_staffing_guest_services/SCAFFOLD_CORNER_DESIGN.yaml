              captures: { gi_1: $.data.id, reporter: $.data.reported_by_user_id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_1}/refund-request"
              payload: { refund_requested_cents: 1500 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { requester: $.data.refund_requested_by_user_id }
          trigger:
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { err_reporter: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "sup-9"
              captures: { err_reporter_as_director: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "DENY" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_requester: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "sup-2"
              captures: { final_status: $.data.refund_status, final_cents: $.data.refund_approved_cents, final_decider: $.data.refund_decided_by_user_id }
          assert:
            - "${reporter} == 'sup-9' and ${requester} == 'sup-1'"
            - "${err_reporter} == 'ERR_SEGREGATION_OF_DUTIES' with HTTP 403 - the reporter prong"
            - "${err_reporter_as_director} == 'ERR_SEGREGATION_OF_DUTIES' - the same user with a higher role is still refused, so the rule keys on X-User-ID and not on the role header"
            - "${err_requester} == 'ERR_SEGREGATION_OF_DUTIES' - the requester prong, and DENY is blocked exactly like APPROVE"
            - "${final_status} == 'APPROVED', ${final_cents} == 1500 and ${final_decider} == 'sup-2' - min(1500, supervisor cap 5000 with 0 bp MEDIUM uplift, available 100000)"
            - "Event.${ev_id}.refund_budget_remaining_cents == 98500 and refund_approved_total_cents == 1500 only after the third user acted; all three refusals left the ledger at 100000 / 0"

  # ===================================================================================
  # 8. From Cross-Cutting Complexity Layers - the four active layers are
  #    optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  #    rate_threshold_triggers
  # ===================================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_expected_event_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-activate-stale-event]
          - endpoints[POST /staffing-plans/{id}/activate]
          - errors[ERR_STALE_EVENT_VERSION]
          - errors[ERR_PLAN_STATE_INVALID]
        distinguishing_aspect: >-
          The single declared OCC rule, tested on its own endpoint and its own occ_field: a version
          that a concurrent PATCH has already invalidated is refused with ERR_STALE_EVENT_VERSION at
          412 and mutates absolutely nothing, and because the rule is checked_before the state checks,
          a stale token on an already-ACTIVE plan still reports the version error rather than
          ERR_PLAN_STATE_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One PLANNED Event at version 1 with two DRAFT plans, plan_a and plan_b, each carrying one TICKET_TAKER slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "OCC Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_b: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_b}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
            - call: "PATCH /events/${ev_id}"
              payload: { name: "OCC Fixture Renamed" }
              as: GuestExperienceDirector
              captures: { ev_v2: $.data.version }
          trigger:
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
              captures: { err_stale: $.data.error_id }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { ev_v_after_refusal: $.data.version }
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
              captures: { ev_v3: $.data.version }
            - call: "POST /staffing-plans/${plan_b}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
              captures: { err_replay: $.data.error_id }
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
              captures: { err_stale_beats_state: $.data.error_id }
          assert:
            - "${ev_v1} == 1 and ${ev_v2} == 2 - the PATCH is the concurrent write that invalidated the caller's token"
            - "${err_stale} == 'ERR_STALE_EVENT_VERSION' with HTTP 412 (not 409 and not 422)"
            - "${ev_v_after_refusal} == 2, StaffingPlan.${plan_a}.status is still 'DRAFT' and activated_at is null - the refusal mutated nothing at all"
            - "the activate with the fresh token returns 200 with ${ev_v3} == 3 and StaffingPlan.${plan_a}.status == 'ACTIVE'"
            - "${err_replay} == 'ERR_STALE_EVENT_VERSION' with HTTP 412 - replaying a token that was fresh one call ago now fails, and StaffingPlan.${plan_b} stays DRAFT while ${plan_a} stays ACTIVE"
            - "${err_stale_beats_state} == 'ERR_STALE_EVENT_VERSION' and NOT 'ERR_PLAN_STATE_INVALID', even though plan_a is already ACTIVE - the OCC rule is checked before the state checks"
            - "Event.${ev_id}.version is still 3 after both 412s"

      - name: occ_version_token_round_trips_through_the_read_endpoint
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-activate-stale-event]
          - endpoints[GET /events/{id}]
          - endpoints[PATCH /events/{id}]
          - endpoints[POST /events/{id}/lifecycle]
        distinguishing_aspect: >-
          The declared version_source is GET /events/{id}, and the token it hands back is exactly what
          the activate accepts: every successful write to the event bumps it by exactly one, refused
          writes leave it untouched so a token read before a failed call is still usable afterwards,
          and the read itself never bumps it.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One PLANNED Event with one DRAFT plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Token Round Trip", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { read_1: $.data.version }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { read_2: $.data.version }
            - call: "PATCH /events/${ev_id}"
              payload: { expected_attendance: -1 }
              as: GuestExperienceDirector
              captures: { err_bad_patch: $.data.error_id }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { read_3: $.data.version }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${read_1}" }
              as: StaffingCoordinator
              captures: { activate_version: $.data.version, plan_status: $.data.status }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { read_4: $.data.version }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
              captures: { lifecycle_version: $.data.version }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { read_5: $.data.version }
          assert:
            - "${read_1} == 1 and ${read_2} == 1 - two consecutive reads return the same token, so reading does not consume or bump the version"
            - "${err_bad_patch} == 'ERR_VALIDATION_FAILED' with HTTP 422 and ${read_3} == 1 - a refused write does not burn the caller's token"
            - "the activate carrying ${read_1} succeeds because that token is still current: ${plan_status} == 'ACTIVE'"
            - "${activate_version} == 2 == ${read_4} - the version the write returns is the same one the read endpoint now serves"
            - "${lifecycle_version} == 3 == ${read_5}, exactly one increment for one write"
            - "at no point does the version jump by more than 1 or move on a read"

      - name: probation_threshold_holds_at_exactly_sixty_five
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.staff_member_reliability_score
          - state_machines.StaffMember.ACTIVE_to_PROBATION
          - constants[RELIABILITY_PROBATION_FLOOR]
        distinguishing_aspect: >-
          The instantaneous threshold is a strict less-than against the rolling window: a window of
          {NO_SHOW, late COMPLETED, late COMPLETED} scores exactly 100 - 25 - 16 + 6 = 65 and the
          member stays ACTIVE, and only when a second no-show pushes the window to 100 - 50 - 8 + 3 =
          53 does the demotion fire - 65 and 53 being the two reachable values on either side of the
          floor.
