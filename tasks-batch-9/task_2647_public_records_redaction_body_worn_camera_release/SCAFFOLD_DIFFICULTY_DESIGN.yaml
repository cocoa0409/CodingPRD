          Resource entity = ResponsiveRecord's clip timeline, with HALF-OPEN [start,end) interval
          semantics and NO buffer: touching intervals (one ends at 30000 ms, the next starts at
          30000 ms) are both accepted, one millisecond of penetration (29999) conflicts, and the
          conflict is scoped per target_type so a LICENSE_PLATE task may occupy the identical
          range as a FACE task.
