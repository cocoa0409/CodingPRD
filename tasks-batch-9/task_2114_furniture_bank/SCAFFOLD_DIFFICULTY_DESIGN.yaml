  - rule_id: transitive_cascade
    instances:

      - name: live_pest_intake_cascades_truck_run_stop_voucher_crew
        grounds:
          - state_machines.DonationOffer.PICKUP_SCHEDULED_to_QUARANTINED
          - state_machines.DeliveryRun.CREWED_to_CANCELLED
          - state_machines.DeliveryStop.SCHEDULED_to_CANCELLED
          - state_machines.Voucher.SCHEDULED_to_ALLOCATED
          - state_machines.CrewAssignment.CONFIRMED_to_RELEASED
          - entities.Truck.fields.bed_bug_lockout_until
          - entities.Volunteer.fields.assigned_hours_month
        distinguishing_aspect: |
          A five-link chain fired by a live-pest intake: the offer quarantines, which locks the
          truck, which cancels that truck's same-day CREWED run, which cancels that run's stop,
          which reverts that stop's voucher to ALLOCATED and releases that run's crew - each link
          caused strictly by the previous one, none of them a direct effect of the intake call.
