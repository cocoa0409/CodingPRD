# =============================================================================
# Scaffold: Calibration & Gage Management (task_0439) — Expert difficulty band
# =============================================================================
# Scenario 439. Calibration & Gage Management: instrument/asset register,
# calibration interval & due/recall, standard traceability (NIST), as-found/
# as-left & tolerance, out-of-tolerance impact (recall affected product),
# external cal vendor & certificate, gage R&R study, drift/history trend.
# =============================================================================

scenario: |
  439. Calibration & Gage Management: instrument/asset register, calibration
  interval & due/recall, standard traceability (NIST), as-found/as-left &
  tolerance, out-of-tolerance impact (recall affected product), external cal
  vendor & certificate, gage R&R study, drift/history trend.

domain_name: calibration-gage
api_prefix: ""   # flat top-level collections (/instruments, /calibration-standards, ...); no single shared path root

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects        # OOT calibration → quarantine → recall affected products
    - dual_variant_calculation      # drift trend (regression vs delta); OOT exposure (conservative vs measured)
    - derived_field_reconciliation  # instrument.calibration_status / next_due_epoch from latest event
    - optimistic_concurrency        # OCC on Instrument.version for supersede-style cal record creation

  entity_topology: graph
  # Instruments calibrate against CalibrationStandards (many-to-many over time
  # via CalibrationEvent.standard_id); a CalibrationStandard is itself an
  # Instrument-like asset that must be calibrated against a higher standard —
  # forming a traceability DAG up to the NIST anchor. Peer entities linked by FK.

  state_machine_shape: parallel
  # Instrument carries two independent state axes: lifecycle_status
  # (ACTIVE/QUARANTINED/RETIRED) × calibration_status (UNCALIBRATED/IN_TOLERANCE/
  # OUT_OF_TOLERANCE/OVERDUE). CalibrationEvent and GageRRStudy add cyclic
  # (revision-loop) machines; OutOfToleranceImpact adds branching fork-join.

  relationship_patterns:
    - one_to_many          # Instrument → CalibrationEvent; CalibrationEvent → MeasurementPoint
    - many_to_many         # Instrument ↔ CalibrationStandard via CalibrationEvent.standard_id
    - self_referential     # CalibrationStandard.parent_standard_id → CalibrationStandard.id (traceability DAG)
    - cross_aggregate      # OutOfToleranceImpact references CalibrationEvent + Instrument + AffectedProduct

  role_model: segregation_of_duties
  # The technician who performs a calibration (CalEvent author) cannot be the
  # quality engineer who dispositions its out-of-tolerance impact, and the
  # metrologist who issues a certificate verification is distinct again.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CalibrationStandard
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Reference standard name (e.g. 'Gauge Block Set A')" }
      - { name: nist_test_number, type: string, source: input, description: "NIST traceability test number; '' permitted only when parent_standard_id set" }
      - { name: parent_standard_id, type: string, source: input, required: false, description: "FK -> CalibrationStandard.id; null means this standard is traced directly to NIST (the anchor). Non-null builds the traceability DAG; self-reference and cycles are rejected." }
      - { name: nominal_value, type: number, source: input, description: "Certified nominal value of the standard, in standard_unit" }
      - { name: standard_unit, type: string, source: input, description: "Unit of nominal_value (e.g. 'mm')" }
      - { name: uncertainty, type: number, source: input, description: "Expanded calibration uncertainty (k=2) of this standard, >= 0" }
      - { name: certified_through_epoch, type: integer, source: input, description: "Logical epoch (inclusive) through which the standard's own calibration is valid" }
      - { name: traceability_depth, type: integer, source: computed, description: "0 when parent_standard_id is null (NIST anchor); else parent.traceability_depth + 1" }
      - { name: is_traceable, type: boolean, source: computed, description: "True iff every standard on the path to the NIST anchor has certified_through_epoch >= clock.current_epoch" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED. Constraints: status IN {ACTIVE, RETIRED}" }

  - name: CalibrationVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "External calibration laboratory name" }
      - { name: accreditation_body, type: enum, source: input, description: "Accreditation body. Constraints: accreditation_body IN {A2LA, NVLAP, UKAS, NONE}" }
      - { name: accreditation_number, type: string, source: input, required: false, description: "Accreditation certificate number; required (non-empty) unless accreditation_body == NONE" }
      - { name: accredited_through_epoch, type: integer, source: input, description: "Logical epoch (inclusive) through which the vendor accreditation is valid" }
      - { name: is_accreditation_current, type: boolean, source: computed, description: "True iff accreditation_body != NONE AND accredited_through_epoch >= clock.current_epoch" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED. Constraints: status IN {ACTIVE, SUSPENDED}" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Unique human-readable asset tag; unique among Instrument rows with status != RETIRED" }
      - { name: description, type: string, source: input, description: "Instrument description" }
      - { name: nominal_value, type: number, source: input, description: "Nominal/full-scale reading used as tolerance reference, in measurement_unit" }
      - { name: tolerance_plus, type: number, source: input, description: "Upper tolerance offset from nominal (>= 0), in measurement_unit" }
      - { name: tolerance_minus, type: number, source: input, description: "Lower tolerance offset from nominal (>= 0), in measurement_unit" }
      - { name: measurement_unit, type: string, source: input, description: "Unit of nominal_value/tolerances (e.g. 'mm')" }
      - { name: calibration_interval_epochs, type: integer, source: input, description: "Interval between calibrations, in epochs; >= 1" }
      - { name: criticality, type: enum, source: input, description: "Impact tier. Constraints: criticality IN {CRITICAL, MAJOR, MINOR}" }
      - { name: last_calibration_epoch, type: integer, source: computed, required: false, description: "Epoch of the most recent PASSED/CONDITIONAL CalibrationEvent (null if never calibrated)" }
      - { name: next_due_epoch, type: integer, source: computed, required: false, description: "= last_calibration_epoch + calibration_interval_epochs (null until first calibration)" }
      - { name: lifecycle_status, type: enum, source: system, default: ACTIVE, description: "Availability axis. Constraints: lifecycle_status IN {ACTIVE, QUARANTINED, RETIRED}" }
      - { name: calibration_status, type: enum, source: system, default: UNCALIBRATED, description: "Calibration axis (independent of lifecycle_status). Constraints: calibration_status IN {UNCALIBRATED, IN_TOLERANCE, OUT_OF_TOLERANCE, OVERDUE}" }
      - { name: open_oot_count, type: integer, source: computed, default: 0, description: "Count of OutOfToleranceImpact rows for this instrument whose status NOT IN {DISPOSITIONED, CANCELLED}" }

  - name: CalibrationEvent
    parent: Instrument
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; the instrument under calibration" }
      - { name: standard_id, type: string, source: input, description: "FK -> CalibrationStandard.id; reference standard used (the traceability link for this event)" }
      - { name: vendor_id, type: string, source: input, required: false, description: "FK -> CalibrationVendor.id; null for in-house calibration, set for external" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the Technician who created the event (segregation-of-duties anchor)" }
      - { name: scheduled_epoch, type: integer, source: input, description: "Logical epoch at which the calibration is performed" }
      - { name: result, type: enum, source: computed, required: false, description: "Computed at finalize. Constraints: result IN {PASS, CONDITIONAL, FAIL} (null while not finalized)" }
      - { name: as_found_in_tolerance, type: boolean, source: computed, required: false, description: "True iff every MeasurementPoint passes its tolerance on the as_found reading" }
      - { name: as_left_in_tolerance, type: boolean, source: computed, required: false, description: "True iff every MeasurementPoint passes its tolerance on the as_left reading" }
      - { name: max_abs_deviation, type: number, source: computed, required: false, description: "Max over points of abs(as_found_value - point.nominal); drives drift trend" }
      - { name: tur, type: number, source: computed, required: false, description: "Test Uncertainty Ratio = instrument tolerance band width / (2 * standard.uncertainty); see calculation tur_ratio" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_PROGRESS | PASSED | CONDITIONAL_PASS | FAILED | CANCELLED. Constraints: status IN {DRAFT, IN_PROGRESS, PASSED, CONDITIONAL_PASS, FAILED, CANCELLED}" }

  - name: MeasurementPoint
    parent: CalibrationEvent
    common_fields: true
    fields:
      - { name: calibration_event_id, type: string, source: system, description: "FK -> CalibrationEvent.id; owning event" }
      - { name: point_label, type: string, source: input, description: "Label for this measurement point (e.g. '25%FS')" }
      - { name: nominal, type: number, source: input, description: "Nominal/target value at this point, in instrument measurement_unit" }
      - { name: tol_plus, type: number, source: input, description: "Upper tolerance offset for this point (>= 0)" }
      - { name: tol_minus, type: number, source: input, description: "Lower tolerance offset for this point (>= 0)" }
      - { name: as_found_value, type: number, source: input, description: "Reading taken before any adjustment" }
      - { name: as_left_value, type: number, source: input, required: false, description: "Reading after adjustment; defaults to as_found_value when omitted (no adjustment made)" }
      - { name: as_found_pass, type: boolean, source: computed, description: "True iff nominal - tol_minus <= as_found_value <= nominal + tol_plus (closed interval)" }
      - { name: as_left_pass, type: boolean, source: computed, description: "True iff nominal - tol_minus <= as_left_value <= nominal + tol_plus (closed interval)" }

  - name: CalibrationCertificate
    parent: CalibrationEvent
    common_fields: true
    fields:
      - { name: calibration_event_id, type: string, source: system, description: "FK -> CalibrationEvent.id; the event this certificate documents" }
      - { name: vendor_id, type: string, source: input, description: "FK -> CalibrationVendor.id; issuing vendor (must equal the event's vendor_id)" }
      - { name: certificate_number, type: string, source: input, description: "Vendor-issued certificate number; unique per vendor among non-REJECTED certificates" }
      - { name: issued_epoch, type: integer, source: input, description: "Epoch the certificate was issued" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | VERIFIED | REJECTED. Constraints: status IN {ISSUED, VERIFIED, REJECTED}" }

  - name: OutOfToleranceImpact
    parent: Instrument
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; the instrument found out of tolerance" }
      - { name: triggering_event_id, type: string, source: system, description: "FK -> CalibrationEvent.id; the FAILED/CONDITIONAL event that opened this impact" }
      - { name: prior_calibration_epoch, type: integer, source: computed, required: false, description: "Epoch of the previous PASSED/CONDITIONAL event before the trigger (null if none); start of the suspect window" }
      - { name: suspect_window_start_epoch, type: integer, source: computed, description: "Inclusive start of the suspect window (= prior_calibration_epoch, or instrument.created_at epoch when null)" }
      - { name: suspect_window_end_epoch, type: integer, source: computed, description: "Inclusive end of suspect window (= triggering event scheduled_epoch)" }
      - { name: dispositioned_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the QualityEngineer who dispositioned (must differ from triggering event performed_by_user_id)" }
      - { name: disposition, type: enum, source: system, required: false, description: "Set on disposition. Constraints: disposition IN {USE_AS_IS, REWORK, RECALL, SCRAP} (null while open)" }
      - { name: affected_product_count, type: integer, source: computed, default: 0, description: "Count of AffectedProduct rows attached to this impact" }
      - { name: recalled_product_count, type: integer, source: computed, default: 0, description: "Count of AffectedProduct rows whose status == RECALLED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | INVESTIGATING | DISPOSITIONED | ESCALATED | CANCELLED. Constraints: status IN {OPEN, INVESTIGATING, DISPOSITIONED, ESCALATED, CANCELLED}" }

  - name: AffectedProduct
    parent: OutOfToleranceImpact
    common_fields: true
    fields:
      - { name: impact_id, type: string, source: system, description: "FK -> OutOfToleranceImpact.id; owning impact record" }
      - { name: product_serial, type: string, source: input, description: "Serial/lot identifier of the product measured by the suspect instrument" }
      - { name: measured_epoch, type: integer, source: input, description: "Epoch the product was measured by the instrument" }
      - { name: in_suspect_window, type: boolean, source: computed, description: "True iff suspect_window_start_epoch <= measured_epoch <= suspect_window_end_epoch (closed)" }
      - { name: status, type: enum, source: system, default: FLAGGED, description: "FLAGGED | RECALLED | CLEARED. Constraints: status IN {FLAGGED, RECALLED, CLEARED}" }

  - name: GageRRStudy
    parent: Instrument
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; instrument whose repeatability/reproducibility is studied" }
      - { name: operator_count, type: integer, source: input, description: "Number of distinct operators; 2 <= operator_count <= 4" }
      - { name: part_count, type: integer, source: input, description: "Number of distinct parts; 2 <= part_count <= 10" }
      - { name: trial_count, type: integer, source: input, description: "Number of repeated trials per operator-part; 2 <= trial_count <= 4" }
      - { name: process_tolerance, type: number, source: input, description: "Total process tolerance used as the %GRR denominator (> 0)" }
      - { name: ev_repeatability, type: number, source: computed, required: false, description: "Equipment variation (repeatability) std-dev estimate; see calculation gage_rr_metrics" }
      - { name: av_reproducibility, type: number, source: computed, required: false, description: "Appraiser variation (reproducibility) std-dev estimate" }
      - { name: grr, type: number, source: computed, required: false, description: "Combined Gage R&R = sqrt(ev^2 + av^2)" }
      - { name: pct_grr, type: number, source: computed, required: false, description: "= 100 * (6 * grr) / process_tolerance, round_half_up 2dp" }
      - { name: acceptability, type: enum, source: computed, required: false, description: "ACCEPTABLE | MARGINAL | UNACCEPTABLE per %GRR thresholds (null until analyzed)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | COLLECTING | ANALYZED | ACCEPTED | REJECTED | CANCELLED. Constraints: status IN {DRAFT, COLLECTING, ANALYZED, ACCEPTED, REJECTED, CANCELLED}" }

  - name: GageRRTrial
    parent: GageRRStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> GageRRStudy.id; owning study" }
      - { name: operator_index, type: integer, source: input, description: "1-based operator index (1..operator_count)" }
      - { name: part_index, type: integer, source: input, description: "1-based part index (1..part_count)" }
      - { name: trial_index, type: integer, source: input, description: "1-based trial index (1..trial_count)" }
      - { name: measured_value, type: number, source: input, description: "Measured value for this operator-part-trial cell" }

  - name: ClockState
    parent: null
    common_fields: false   # id, created_at only — singleton logical clock
    fields:
      - { name: current_epoch, type: integer, source: system, default: 0, description: "Logical epoch counter. Server boots at default UTC 2026-01-01T00:00:00Z which maps to current_epoch = 0; advances only via the clock endpoint." }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Instrument: PARALLEL state dimensions (lifecycle_status × calibration_status) ----
  - entity: Instrument
    initial_state: "lifecycle_status=ACTIVE / calibration_status=UNCALIBRATED"
    terminal_states: ["lifecycle_status=RETIRED"]
    note: |
      Two independent axes evolve on the same row. lifecycle_status controls
      availability (ACTIVE/QUARANTINED/RETIRED). calibration_status is derived
      from calibration history and clock position. RETIRED is the only terminal
      combination; calibration_status keeps no terminal of its own.
    transitions:
      - from: "calibration_status=UNCALIBRATED|IN_TOLERANCE|OUT_OF_TOLERANCE|OVERDUE"
        to: "calibration_status=IN_TOLERANCE"
        trigger: "POST /instruments/{id}/calibration-events/{id}/finalize → result PASS or CONDITIONAL"
        actor: system
        preconditions:
          - "instrument.lifecycle_status != RETIRED (ERR_INSTRUMENT_RETIRED)"
        side_effects:
          - "Set last_calibration_epoch = event.scheduled_epoch; next_due_epoch = last_calibration_epoch + calibration_interval_epochs (calc next_due_epoch)"
          - "calibration_status := IN_TOLERANCE"
          - "increments Instrument.version by 1"
      - from: "calibration_status=UNCALIBRATED|IN_TOLERANCE|OVERDUE"
        to: "calibration_status=OUT_OF_TOLERANCE / lifecycle_status=QUARANTINED"
        trigger: "POST /instruments/{id}/calibration-events/{id}/finalize → result FAIL"
        actor: system
        preconditions:
          - "instrument.lifecycle_status == ACTIVE (ERR_INSTRUMENT_NOT_ACTIVE)"
        side_effects:
          - "calibration_status := OUT_OF_TOLERANCE"
          - "lifecycle_status := QUARANTINED (cascade hop 1)"
          - "Auto-create OutOfToleranceImpact in OPEN with triggering_event_id=event.id; compute suspect window (calc suspect_window) (cascade hop 2)"
          - "open_oot_count := open_oot_count + 1"
          - "increments Instrument.version by 1"
      - from: "calibration_status=IN_TOLERANCE / next_due_epoch < clock.current_epoch"
        to: "calibration_status=OVERDUE"
        trigger: "POST /_clock/advance (recall sweep) — recomputed for every ACTIVE instrument after the clock moves"
        actor: system
        preconditions:
          - "instrument.lifecycle_status == ACTIVE"
          - "next_due_epoch is not null AND next_due_epoch < clock.current_epoch"
        side_effects:
          - "calibration_status := OVERDUE"
          - "increments Instrument.version by 1"
      - from: "lifecycle_status=QUARANTINED"
        to: "lifecycle_status=ACTIVE"
        trigger: "POST /instruments/{id}/release"
        actor: QualityEngineer
        preconditions:
          - "instrument.lifecycle_status == QUARANTINED (ERR_INVALID_STATE)"
          - "open_oot_count == 0 — every OutOfToleranceImpact is DISPOSITIONED or CANCELLED (ERR_OPEN_IMPACT_EXISTS)"
          - "Latest finalized CalibrationEvent has result IN {PASS, CONDITIONAL} (ERR_LATEST_CAL_NOT_PASSING)"
        side_effects:
          - "lifecycle_status := ACTIVE"
          - "increments Instrument.version by 1"
      - from: "lifecycle_status=ACTIVE|QUARANTINED"
        to: "lifecycle_status=RETIRED"
        trigger: "POST /instruments/{id}/retire"
        actor: QualityEngineer
        preconditions:
          - "No CalibrationEvent in DRAFT or IN_PROGRESS (ERR_OPEN_CALIBRATION_EXISTS)"
          - "open_oot_count == 0 (ERR_OPEN_IMPACT_EXISTS)"
        side_effects:
          - "lifecycle_status := RETIRED (asset_tag uniqueness no longer reserved)"
          - "increments Instrument.version by 1"

  # ---- CalibrationEvent: CYCLIC (FAILED → reopen → IN_PROGRESS revision loop) + branching ----
  - entity: CalibrationEvent
    initial_state: DRAFT
    terminal_states: [PASSED, CONDITIONAL_PASS, CANCELLED]
    note: "FAILED is non-terminal: a failed event may be reopened for re-measurement, forming a revision cycle FAILED→IN_PROGRESS→{PASSED,CONDITIONAL_PASS,FAILED}."
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "POST /instruments/{id}/calibration-events/{id}/start"
        actor: Technician
        preconditions:
          - "Owning instrument.lifecycle_status == ACTIVE (ERR_INSTRUMENT_NOT_ACTIVE) [cross-entity: Instrument]"
          - "At least one MeasurementPoint exists (ERR_NO_MEASUREMENT_POINTS)"
          - "event.standard_id refers to a CalibrationStandard with is_traceable == true (ERR_STANDARD_NOT_TRACEABLE) [cross-entity: CalibrationStandard]"
          - "If vendor_id set: vendor.status == ACTIVE AND vendor.is_accreditation_current == true (ERR_VENDOR_NOT_ELIGIBLE) [cross-entity: CalibrationVendor]"
        side_effects:
          - "status := IN_PROGRESS"
          - "increments CalibrationEvent.version by 1"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /instruments/{id}/calibration-events/{id}/finalize"
        actor: Technician
        preconditions:
          - "Every MeasurementPoint has as_found_pass == true AND as_left_pass == true (else branch to CONDITIONAL_PASS or FAILED)"
          - "tur >= MIN_TUR (4.0) (else result downgraded — see calc tur_ratio)"
        side_effects:
          - "Compute as_found_in_tolerance, as_left_in_tolerance, max_abs_deviation, tur, result (calc cal_result, tur_ratio, drift_deviation)"
          - "result := PASS; status := PASSED"
          - "Bubble up: instrument calibration_status := IN_TOLERANCE; recompute next_due_epoch (cross-entity cascade to Instrument)"
          - "increments CalibrationEvent.version by 1"
      - from: IN_PROGRESS
        to: CONDITIONAL_PASS
        trigger: "POST /instruments/{id}/calibration-events/{id}/finalize"
        actor: Technician
        preconditions:
          - "Some point fails as_found but every point passes as_left (was adjusted into tolerance) AND tur >= MIN_TUR"
        side_effects:
          - "result := CONDITIONAL; status := CONDITIONAL_PASS"
          - "Bubble up: instrument calibration_status := IN_TOLERANCE; recompute next_due_epoch"
          - "increments CalibrationEvent.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /instruments/{id}/calibration-events/{id}/finalize"
        actor: Technician
        preconditions:
          - "Some MeasurementPoint has as_left_pass == false, OR tur < MIN_TUR (4.0)"
        side_effects:
          - "result := FAIL; status := FAILED"
          - "Cascade: instrument calibration_status := OUT_OF_TOLERANCE; lifecycle_status := QUARANTINED; auto-create OutOfToleranceImpact(OPEN) (cross-entity cascade chain — see Instrument machine)"
          - "increments CalibrationEvent.version by 1"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /instruments/{id}/calibration-events/{id}/reopen"
        actor: Technician
        preconditions:
          - "The auto-created OutOfToleranceImpact for this event has status == CANCELLED (ERR_IMPACT_NOT_CANCELLED) [cross-entity: OutOfToleranceImpact]"
          - "Owning instrument.lifecycle_status == QUARANTINED (ERR_INVALID_STATE)"
        side_effects:
          - "status := IN_PROGRESS (revision cycle); result := null"
          - "increments CalibrationEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /instruments/{id}/calibration-events/{id}/cancel"
        actor: Technician
        preconditions:
          - "event.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "status := CANCELLED"
          - "increments CalibrationEvent.version by 1"

  # ---- OutOfToleranceImpact: BRANCHING fork-join with divergent side-effects ----
  - entity: OutOfToleranceImpact
    initial_state: OPEN
    terminal_states: [DISPOSITIONED, CANCELLED]
    note: "Branch at disposition: RECALL fans out a recall cascade over AffectedProduct; ESCALATED is a non-terminal hold awaiting re-disposition."
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /impacts/{id}/investigate"
        actor: QualityEngineer
        preconditions:
          - "impact.status == OPEN (ERR_INVALID_STATE)"
          - "Acting QualityEngineer X-User-ID != triggering CalibrationEvent.performed_by_user_id (ERR_SEGREGATION_OF_DUTIES) [cross-entity: CalibrationEvent]"
        side_effects:
          - "status := INVESTIGATING"
          - "increments OutOfToleranceImpact.version by 1"
      - from: INVESTIGATING
        to: DISPOSITIONED
        trigger: "POST /impacts/{id}/disposition (disposition IN {USE_AS_IS, REWORK, RECALL, SCRAP})"
        actor: QualityEngineer
        preconditions:
          - "impact.status == INVESTIGATING (ERR_INVALID_STATE)"
          - "If disposition == RECALL: at least one AffectedProduct with in_suspect_window == true exists (ERR_NO_RECALLABLE_PRODUCT)"
          - "Acting X-User-ID != triggering CalibrationEvent.performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "disposition := <chosen>; dispositioned_by_user_id := X-User-ID; status := DISPOSITIONED"
          - "If disposition == RECALL: every AffectedProduct with in_suspect_window==true → status RECALLED; recalled_product_count recomputed (calc recall_exposure) (branch-specific cascade)"
          - "If disposition IN {USE_AS_IS, REWORK, SCRAP}: every FLAGGED AffectedProduct → status CLEARED (divergent branch side-effects)"
          - "instrument.open_oot_count := open_oot_count - 1 (cross-entity bubble up to Instrument)"
          - "increments OutOfToleranceImpact.version by 1"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /impacts/{id}/escalate"
        actor: QualityEngineer
        preconditions:
          - "impact.status == INVESTIGATING (ERR_INVALID_STATE)"
        side_effects:
          - "status := ESCALATED"
          - "increments OutOfToleranceImpact.version by 1"
      - from: ESCALATED
        to: INVESTIGATING
        trigger: "POST /impacts/{id}/investigate"
        actor: QualityEngineer
        preconditions:
          - "impact.status == ESCALATED (ERR_INVALID_STATE)"
        side_effects:
          - "status := INVESTIGATING (re-entry for re-disposition)"
          - "increments OutOfToleranceImpact.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /impacts/{id}/cancel"
        actor: QualityEngineer
        preconditions:
          - "impact.status == OPEN (ERR_INVALID_STATE)"
          - "No AffectedProduct with status == RECALLED (ERR_RECALL_ALREADY_ISSUED)"
        side_effects:
          - "status := CANCELLED"
          - "instrument.open_oot_count := open_oot_count - 1 (cross-entity bubble up to Instrument)"
          - "increments OutOfToleranceImpact.version by 1"

  # ---- GageRRStudy: CYCLIC revision loop (REJECTED → COLLECTING) ----
  - entity: GageRRStudy
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED]
    note: "REJECTED loops back to COLLECTING for re-measurement; ANALYZED is reachable only when the full trial matrix is populated."
    transitions:
      - from: DRAFT
        to: COLLECTING
        trigger: "POST /instruments/{id}/gage-rr-studies/{id}/open"
        actor: QualityEngineer
        preconditions:
          - "Owning instrument.lifecycle_status == ACTIVE (ERR_INSTRUMENT_NOT_ACTIVE) [cross-entity: Instrument]"
          - "study.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "status := COLLECTING"
          - "increments GageRRStudy.version by 1"
      - from: COLLECTING
        to: ANALYZED
        trigger: "POST /instruments/{id}/gage-rr-studies/{id}/analyze"
        actor: QualityEngineer
        preconditions:
          - "Exactly operator_count * part_count * trial_count GageRRTrial rows exist, one per (operator,part,trial) cell with no gaps or duplicates (ERR_INCOMPLETE_TRIAL_MATRIX)"
        side_effects:
          - "Compute ev_repeatability, av_reproducibility, grr, pct_grr, acceptability (calc gage_rr_metrics)"
          - "status := ANALYZED"
          - "increments GageRRStudy.version by 1"
      - from: ANALYZED
        to: ACCEPTED
        trigger: "POST /instruments/{id}/gage-rr-studies/{id}/accept"
        actor: QualityEngineer
        preconditions:
          - "study.acceptability != UNACCEPTABLE (ERR_GAGE_RR_UNACCEPTABLE)"
        side_effects:
          - "status := ACCEPTED"
          - "increments GageRRStudy.version by 1"
      - from: ANALYZED
        to: COLLECTING
        trigger: "POST /instruments/{id}/gage-rr-studies/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - "study.status == ANALYZED (ERR_INVALID_STATE)"
        side_effects:
          - "status := COLLECTING (revision cycle); ev_repeatability/av_reproducibility/grr/pct_grr/acceptability reset to null"
          - "increments GageRRStudy.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /instruments/{id}/gage-rr-studies/{id}/cancel"
        actor: QualityEngineer
        preconditions:
          - "study.status IN {DRAFT, COLLECTING} (ERR_INVALID_STATE)"
        side_effects:
          - "status := CANCELLED"
          - "increments GageRRStudy.version by 1"

  # ---- CalibrationCertificate: branching with revert ----
  - entity: CalibrationCertificate
    initial_state: ISSUED
    terminal_states: [VERIFIED]
    note: "REJECTED reverts to ISSUED on re-issue; VERIFIED is terminal."
    transitions:
      - from: ISSUED
        to: VERIFIED
        trigger: "POST /certificates/{id}/verify"
        actor: Metrologist
        preconditions:
          - "Owning CalibrationEvent.status IN {PASSED, CONDITIONAL_PASS} (ERR_EVENT_NOT_FINALIZED) [cross-entity: CalibrationEvent]"
          - "certificate.vendor_id == owning event.vendor_id (ERR_CERT_VENDOR_MISMATCH)"
          - "issuing vendor.is_accreditation_current == true (ERR_VENDOR_NOT_ELIGIBLE) [cross-entity: CalibrationVendor]"
        side_effects:
          - "status := VERIFIED"
          - "increments CalibrationCertificate.version by 1"
      - from: ISSUED
        to: REJECTED
        trigger: "POST /certificates/{id}/reject"
        actor: Metrologist
        preconditions:
          - "certificate.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "status := REJECTED (certificate_number freed for reuse)"
          - "increments CalibrationCertificate.version by 1"
      - from: REJECTED
        to: ISSUED
        trigger: "POST /certificates/{id}/reissue"
        actor: Metrologist
        preconditions:
          - "certificate.status == REJECTED (ERR_INVALID_STATE)"
          - "certificate_number unique among non-REJECTED certificates of the vendor (ERR_DUPLICATE_CERTIFICATE_NUMBER)"
        side_effects:
          - "status := ISSUED (revert)"
          - "increments CalibrationCertificate.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cal-event-create-stale-instrument
    parent_entity: Instrument
    write_endpoint: "POST /instruments/{id}/calibration-events"
    occ_field: "expected_instrument_version"
    description: |
      Creating a CalibrationEvent against an Instrument whose version has
      advanced since the client last observed it is rejected as a stale write.
      A finalize on a prior event (PASS/FAIL) bumps the instrument's version
      and changes its calibration_status/next_due_epoch; a new calibration
      event opened against the pre-finalize view is therefore based on a stale
      instrument and is rejected on the version mismatch.
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412

  - rule_id: gage-rr-open-stale-instrument
    parent_entity: Instrument
    write_endpoint: "POST /instruments/{id}/gage-rr-studies"
    occ_field: "expected_instrument_version"
    description: |
      Creating a GageRRStudy against an Instrument whose version has advanced
      since the client last read it is rejected. Another writer may have just
      retired or quarantined the instrument (each bumps version), so the study
      created against the stale view would attach to an instrument that is no
      longer ACTIVE; the version mismatch rejects it deterministically.
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # ---- Rule 1 dual-variant instance A: drift trend on CalibrationEvent history ----
  - name: drift_trend
    trigger: "GET /instruments/{id}/drift-trend"
    algorithm: dual_variant
    formula: |
      Inputs: the chronological series of finalized CalibrationEvents for the
      instrument with status IN {PASSED, CONDITIONAL_PASS, FAILED}, ordered by
      (scheduled_epoch ASC, created_at ASC) as tie-break. Let the series be
      points (x_i = scheduled_epoch, y_i = max_abs_deviation), i = 1..n.

      Variant LSQ (default): ordinary least-squares slope over ALL n points:
        slope = ( n*Σ(x_i*y_i) - Σx_i*Σy_i ) / ( n*Σ(x_i^2) - (Σx_i)^2 )
      Variant ENDPOINT: simple endpoint delta over the FIRST and LAST points only:
        slope = (y_n - y_1) / (x_n - x_1)
      Both: projected_breach_epoch = smallest integer e > x_n such that
        y_n + slope*(e - x_n) > instrument tolerance half-band
        (= max(tolerance_plus, tolerance_minus)); null if slope <= 0.
    input_set: "Finalized events only (PASSED, CONDITIONAL_PASS, FAILED); DRAFT/IN_PROGRESS/CANCELLED excluded"
    constants:
      MIN_POINTS_FOR_LSQ: 2
    precision: "slope rounded to 6 decimals round_half_up; projected_breach_epoch is an integer"
    variants:
      - name: lsq
        when: "default; requested with ?method=LSQ or omitted"
        difference: "Least-squares slope over all n points; sensitive to every reading"
      - name: endpoint
        when: "requested with ?method=ENDPOINT"
        difference: "Slope from first/last reading only; ignores intermediate drift"

  # ---- Rule 1 dual-variant instance B: recall exposure on OutOfToleranceImpact (different entity domain) ----
  - name: recall_exposure
    trigger: "GET /impacts/{id}/exposure ; recomputed on disposition==RECALL"
    algorithm: dual_variant
    formula: |
      Conservative variant (default): count ALL AffectedProduct rows whose
      measured_epoch falls in the CLOSED suspect window
      [suspect_window_start_epoch, suspect_window_end_epoch].
      Measured variant: count only AffectedProduct rows whose measured_epoch
      is STRICTLY AFTER the prior_calibration_epoch and <= suspect_window_end
      (half-open (prior_calibration_epoch, end]) — products measured exactly at
      the prior good calibration are deemed conforming and excluded.
      recalled_product_count (persisted on disposition==RECALL) uses the
      CONSERVATIVE variant.
    input_set: "AffectedProduct rows attached to the impact; filtered by measured_epoch against window"
    constants: {}
    precision: "integer counts"
    variants:
      - name: conservative
        when: "default; the variant persisted to recalled_product_count on RECALL disposition"
        difference: "Closed window includes products measured exactly at prior_calibration_epoch"
      - name: measured
        when: "requested with ?basis=MEASURED"
        difference: "Half-open window excludes the boundary epoch; yields <= conservative count"

  # ---- Rule 2 combinatorial mode (a): TUR with >=3 inputs and nested min/branching ----
  - name: tur_ratio
    trigger: "CalibrationEvent finalize"
    algorithm: threshold
    formula: |
      tolerance_band_width = instrument.tolerance_plus + instrument.tolerance_minus
      std_unc = standard.uncertainty                       # expanded, k=2
      IF std_unc == 0: tur = INFINITY (treated as >= MIN_TUR)
      ELSE: tur = tolerance_band_width / (2 * std_unc)
      result downgrade rule (branch on entity state):
        base_result = PASS  if all points as_found_pass AND as_left_pass
                    = CONDITIONAL if any as_found fails but all as_left pass
                    = FAIL  if any as_left fails
        IF tur < MIN_TUR (4.0) AND base_result != FAIL:
            result := FAIL    # insufficient measurement capability forces failure
        ELSE: result := base_result
    input_set: "instrument tolerances, standard.uncertainty, all MeasurementPoint pass flags"
    constants:
      MIN_TUR: 4.0
    precision: "tur rounded to 2 decimals round_half_up"

  # ---- Rule 2 combinatorial mode (b): %GRR nested rounding order pinned ----
  - name: gage_rr_metrics
    trigger: "GageRRStudy analyze"
    algorithm: weighted_scoring
    formula: |
      Trials form a matrix M[o][p][t] of measured_value.
      Step 1 (repeatability EV): for each (o,p) compute range R_op = max_t - min_t.
        Rbar = mean over all (o,p) of R_op.
        EV = Rbar * K1, where K1 is the AIAG constant for trial_count.
      Step 2 (reproducibility AV): for each operator o compute its grand mean
        Obar_o = mean over (p,t). Xdiff = max_o Obar_o - min_o Obar_o.
        AV = sqrt( max(0, (Xdiff * K2)^2 - (EV^2 / (part_count * trial_count)) ) )
        where K2 is the AIAG constant for operator_count.
      Step 3: GRR = sqrt(EV^2 + AV^2).
      Step 4 (rounding order — PIN: round ONLY at the final %GRR, never the
        intermediate EV/AV/GRR; carry full precision through steps 1-3):
        pct_grr = round_half_up( 100 * (6 * GRR) / process_tolerance , 2 )
      acceptability = ACCEPTABLE   if pct_grr <= 10.00
                    = MARGINAL     if 10.00 < pct_grr <= 30.00
                    = UNACCEPTABLE if pct_grr > 30.00
    input_set: "All GageRRTrial rows for the study"
    constants:
      K1_BY_TRIAL_COUNT: { 2: 4.56, 3: 3.05, 4: 2.50 }
      K2_BY_OPERATOR_COUNT: { 2: 3.65, 3: 2.70, 4: 2.30 }
      ACCEPT_PCT: 10.0
      MARGINAL_PCT: 30.0
    precision: "Carry full float precision through EV/AV/GRR; round ONLY pct_grr to 2dp round_half_up. ev_repeatability/av_reproducibility/grr stored at 6dp round_half_up for display."

  # ---- Rule 2 combinatorial mode (c): next_due ordered evaluation chain ----
  - name: next_due_epoch
    trigger: "CalibrationEvent finalize (PASS/CONDITIONAL); clock advance recall sweep"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (circular-looking; resolve in this order):
        1. last_calibration_epoch := max over instrument's events with result IN
           {PASS, CONDITIONAL} of scheduled_epoch (tie-break created_at ASC).
        2. next_due_epoch := last_calibration_epoch + calibration_interval_epochs.
        3. recall flag (OVERDUE) is derived FROM next_due_epoch and the clock,
           NOT the other way round:
             is_overdue = (next_due_epoch is not null) AND
                          (next_due_epoch < clock.current_epoch)
        4. calibration_status := OVERDUE iff is_overdue AND lifecycle ACTIVE AND
           current calibration_status == IN_TOLERANCE.
      Step 3 must read the next_due_epoch produced by step 2 within the same
      finalize/sweep; do not use a stale persisted next_due_epoch.
    input_set: "Instrument's finalized events; calibration_interval_epochs; clock.current_epoch"
    constants: {}
    precision: "integer epochs"

  # ---- suspect window for OOT impact ----
  - name: suspect_window
    trigger: "OutOfToleranceImpact auto-create on FAIL finalize"
    algorithm: chronological
    formula: |
      prior_calibration_epoch := max scheduled_epoch over the instrument's events
        with result IN {PASS, CONDITIONAL} AND scheduled_epoch < triggering
        event.scheduled_epoch (tie-break created_at ASC); null if none.
      suspect_window_start_epoch := prior_calibration_epoch when non-null,
        else the integer epoch of instrument.created_at (0 at boot default).
      suspect_window_end_epoch := triggering event.scheduled_epoch.
    input_set: "Instrument's finalized events before the trigger; instrument.created_at"
    constants: {}
    precision: "integer epochs"

  # ---- drift_deviation per-event helper ----
  - name: drift_deviation
    trigger: "CalibrationEvent finalize"
    algorithm: aggregation
    formula: |
      max_abs_deviation := max over the event's MeasurementPoints of
        abs(as_found_value - nominal). Empty point set is impossible at
        finalize (start precondition guarantees >=1 point).
    input_set: "MeasurementPoints of the event"
    constants: {}
    precision: "6 decimals round_half_up"

  # ---- cal_result (delegates final result to tur_ratio downgrade) ----
  - name: cal_result
    trigger: "CalibrationEvent finalize"
    algorithm: threshold
    formula: |
      as_found_in_tolerance := every point as_found_pass == true.
      as_left_in_tolerance  := every point as_left_pass == true.
      base_result per tur_ratio; final result := tur_ratio output.
      Point pass test uses CLOSED interval: pass iff
        nominal - tol_minus <= value <= nominal + tol_plus.
    input_set: "MeasurementPoints; tur_ratio output"
    constants: {}
    precision: "boolean / enum"

  # ---- traceability_depth & is_traceable over the standard DAG ----
  - name: standard_traceability
    trigger: "CalibrationStandard create/update; read on event start precondition"
    algorithm: topological
    formula: |
      Walk parent_standard_id links to the NIST anchor (parent_standard_id null).
      traceability_depth := 0 at the anchor, else parent.traceability_depth + 1.
      Cycle/self-reference in the chain → reject at write (ERR_TRACEABILITY_CYCLE).
      is_traceable := for EVERY standard s on the path (including self and
        anchor): s.status == ACTIVE AND s.certified_through_epoch >=
        clock.current_epoch. A single expired/retired link anywhere on the
        path makes the leaf not traceable.
    input_set: "The standard and its ancestor chain"
    constants:
      MAX_DEPTH: 10
    precision: "integer depth; boolean is_traceable"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles AND permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource IDs in the path exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "Body foreign keys (standard_id, vendor_id, parent_standard_id) reference existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT endpoints carrying FK fields"

  - priority: 5
    category: business_constraint
    check: "Request body required fields present and well-typed; enum members valid; numeric ranges (tolerances >= 0, counts within stated bounds) satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 6
    category: business_referential
    check: "asset_tag is unique among Instrument rows whose lifecycle_status != RETIRED"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: "POST /instruments"

  - priority: 7
    category: business_referential
    check: "certificate_number unique among the vendor's certificates whose status != REJECTED"
    error_id: ERR_DUPLICATE_CERTIFICATE_NUMBER
    http_status: 409
    applies_to: "POST /events/{id}/certificates, POST /certificates/{id}/reissue"

  - priority: 8
    category: business_referential
    check: "parent_standard_id chain contains no cycle and no self-reference; depth <= MAX_DEPTH"
    error_id: ERR_TRACEABILITY_CYCLE
    http_status: 409
    applies_to: "POST /calibration-standards, PUT /calibration-standards/{id}"

  - priority: 9
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 10
    category: state
    check: "Owning Instrument.lifecycle_status == ACTIVE where the operation requires an active instrument (event start, gage-rr open)"
    error_id: ERR_INSTRUMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST .../calibration-events/{id}/start, POST .../gage-rr-studies/{id}/open"

  - priority: 11
    category: state
    check: "Owning Instrument.lifecycle_status != RETIRED for any write to its children"
    error_id: ERR_INSTRUMENT_RETIRED
    http_status: 409
    applies_to: "all writes to Instrument children"

  - priority: 12
    category: business_safety
    check: "On event start, event.standard_id resolves to a CalibrationStandard with is_traceable == true"
    error_id: ERR_STANDARD_NOT_TRACEABLE
    http_status: 409
    applies_to: "POST .../calibration-events/{id}/start"

  - priority: 13
    category: business_safety
    check: "When vendor_id is set, vendor.status == ACTIVE AND vendor.is_accreditation_current == true at event start and certificate verify"
    error_id: ERR_VENDOR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST .../calibration-events/{id}/start, POST /certificates/{id}/verify"

  - priority: 14
    category: business_safety
    check: "QualityEngineer acting X-User-ID differs from the triggering CalibrationEvent.performed_by_user_id on impact investigate/disposition (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /impacts/{id}/investigate, POST /impacts/{id}/disposition"

  - priority: 15
    category: business_constraint
    check: "Event start requires at least one MeasurementPoint on the event"
    error_id: ERR_NO_MEASUREMENT_POINTS
    http_status: 409
    applies_to: "POST .../calibration-events/{id}/start"

  - priority: 16
    category: business_constraint
    check: "Gage-RR analyze requires exactly operator_count*part_count*trial_count trials, one per cell, no gaps/duplicates"
    error_id: ERR_INCOMPLETE_TRIAL_MATRIX
    http_status: 409
    applies_to: "POST .../gage-rr-studies/{id}/analyze"

  - priority: 17
    category: business_constraint
    check: "RECALL disposition requires at least one AffectedProduct with in_suspect_window == true"
    error_id: ERR_NO_RECALLABLE_PRODUCT
    http_status: 409
    applies_to: "POST /impacts/{id}/disposition"

  - priority: 18
    category: business_safety
    check: "Instrument release requires open_oot_count == 0 and latest finalized event result IN {PASS, CONDITIONAL}"
    error_id: ERR_OPEN_IMPACT_EXISTS
    http_status: 409
    applies_to: "POST /instruments/{id}/release, POST /instruments/{id}/retire"

  - priority: 19
    category: business_temporal
    check: "GageRRTrial operator_index/part_index/trial_index within the study's declared bounds AND the (operator,part,trial) cell is not already populated"
    error_id: ERR_DUPLICATE_TRIAL_CELL
    http_status: 409
    applies_to: "POST .../gage-rr-studies/{id}/trials"

  - priority: 20
    category: business_constraint
    check: "GageRRStudy accept requires acceptability != UNACCEPTABLE"
    error_id: ERR_GAGE_RR_UNACCEPTABLE
    http_status: 409
    applies_to: "POST .../gage-rr-studies/{id}/accept"

  - priority: 21
    category: business_referential
    check: "expected_instrument_version (when supplied for OCC-guarded creates) matches current Instrument.version"
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412
    applies_to: "POST /instruments/{id}/calibration-events, POST /instruments/{id}/gage-rr-studies"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the logical clock by N epochs and run the recall sweep. Server boots with current_epoch = 0 mapped to default UTC 2026-01-01T00:00:00Z; the clock never reads wall-clock time."
    roles: [QualityEngineer]
    code: 200
    input: [by_epochs]
    output: ClockState
    side_effects:
      - "current_epoch += by_epochs"
      - "Recall sweep: every ACTIVE instrument with calibration_status==IN_TOLERANCE and next_due_epoch < current_epoch → OVERDUE (calc next_due_epoch step 3-4)"
  - method: GET
    path: "/_clock"
    description: "Read current logical clock"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: ClockState
    side_effects: []

  # ---- Calibration Standards (self-referential DAG) ----
  - method: POST
    path: "/calibration-standards"
    description: "Register a reference standard (NIST anchor when parent_standard_id null)"
    roles: [Metrologist]
    code: 201
    input: [name, nist_test_number, "parent_standard_id?", nominal_value, standard_unit, uncertainty, certified_through_epoch]
    output: CalibrationStandard
    side_effects: ["compute traceability_depth, is_traceable (calc standard_traceability)"]
  - method: GET
    path: "/calibration-standards"
    description: "List standards; filter children by parent via parent_standard_id"
    roles: [Metrologist, Technician, QualityEngineer]
    code: 200
    input: ["parent_standard_id?", "limit?", "offset?"]
    output: "CalibrationStandard[]"
    side_effects: []
  - method: GET
    path: "/calibration-standards/{id}"
    description: "Get a standard with computed traceability fields"
    roles: [Metrologist, Technician, QualityEngineer]
    code: 200
    input: []
    output: CalibrationStandard
    side_effects: []
  - method: PUT
    path: "/calibration-standards/{id}"
    description: "Update a standard's parent/certification (re-validates traceability DAG)"
    roles: [Metrologist]
    code: 200
    input: ["parent_standard_id?", "certified_through_epoch?", "uncertainty?", "status?"]
    output: CalibrationStandard
    side_effects: ["recompute traceability_depth, is_traceable for this standard"]

  # ---- Calibration Vendors ----
  - method: POST
    path: "/calibration-vendors"
    description: "Register an external calibration vendor"
    roles: [Metrologist]
    code: 201
    input: [name, accreditation_body, "accreditation_number?", accredited_through_epoch]
    output: CalibrationVendor
    side_effects: ["compute is_accreditation_current"]
  - method: GET
    path: "/calibration-vendors"
    description: "List vendors"
    roles: [Metrologist, Technician, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CalibrationVendor[]"
    side_effects: []
  - method: GET
    path: "/calibration-vendors/{id}"
    description: "Get a vendor"
    roles: [Metrologist, Technician, QualityEngineer]
    code: 200
    input: []
    output: CalibrationVendor
    side_effects: []
  - method: PATCH
    path: "/calibration-vendors/{id}"
    description: "Update vendor accreditation/status"
    roles: [Metrologist]
    code: 200
    input: ["accredited_through_epoch?", "status?"]
    output: CalibrationVendor
    side_effects: ["recompute is_accreditation_current"]

  # ---- Instruments (asset register) ----
  - method: POST
    path: "/instruments"
    description: "Register an instrument/asset"
    roles: [QualityEngineer]
    code: 201
    input: [asset_tag, description, nominal_value, tolerance_plus, tolerance_minus, measurement_unit, calibration_interval_epochs, criticality]
    output: Instrument
    side_effects: ["lifecycle_status=ACTIVE, calibration_status=UNCALIBRATED"]
  - method: GET
    path: "/instruments"
    description: "List instruments; filter by lifecycle_status/calibration_status"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["lifecycle_status?", "calibration_status?", "limit?", "offset?"]
    output: "Instrument[]"
    side_effects: []
  - method: GET
    path: "/instruments/{id}"
    description: "Get an instrument with computed due/recall fields"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/instruments/{id}/release"
    description: "Release a QUARANTINED instrument back to ACTIVE"
    roles: [QualityEngineer]
    code: 200
    input: [expected_instrument_version]
    output: Instrument
    side_effects: ["lifecycle_status QUARANTINED→ACTIVE", "increments Instrument.version by 1"]
  - method: POST
    path: "/instruments/{id}/retire"
    description: "Retire an instrument (terminal)"
    roles: [QualityEngineer]
    code: 200
    input: [expected_instrument_version]
    output: Instrument
    side_effects: ["lifecycle_status→RETIRED", "increments Instrument.version by 1"]
  - method: GET
    path: "/instruments/{id}/drift-trend"
    description: "Computed drift trend over the instrument's finalized calibration history (dual-variant)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["method?"]
    output: "{ slope: number, projected_breach_epoch: integer, point_count: integer, method: string }"
    side_effects: []

  # ---- Calibration Events (child of Instrument) ----
  - method: POST
    path: "/instruments/{id}/calibration-events"
    description: "Open a DRAFT calibration event (OCC-guarded on the instrument version)"
    roles: [Technician]
    code: 201
    input: [standard_id, "vendor_id?", scheduled_epoch, expected_instrument_version]
    output: CalibrationEvent
    side_effects:
      - "status=DRAFT; performed_by_user_id set from X-User-ID"
      - "increments Instrument.version by 1 (registering calibration activity mutates the instrument's calibration record and advances the OCC guard)"
  - method: GET
    path: "/instruments/{id}/calibration-events"
    description: "List an instrument's calibration events (reverse-reachability for instrument_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CalibrationEvent[]"
    side_effects: []
  - method: GET
    path: "/calibration-events/{id}"
    description: "Get a calibration event with computed result/tur/deviation"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: CalibrationEvent
    side_effects: []
  - method: GET
    path: "/calibration-events"
    description: "List calibration events filtered by standard_id or vendor_id (reverse-reachability for standard_id and vendor_id FKs)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["standard_id?", "vendor_id?", "limit?", "offset?"]
    output: "CalibrationEvent[]"
    side_effects: []
  - method: POST
    path: "/calibration-events/{id}/start"
    description: "Move event DRAFT→IN_PROGRESS (validates traceability + vendor eligibility)"
    roles: [Technician]
    code: 200
    input: []
    output: CalibrationEvent
    side_effects: ["status=IN_PROGRESS", "increments CalibrationEvent.version by 1"]
  - method: POST
    path: "/calibration-events/{id}/finalize"
    description: "Finalize event → PASS/CONDITIONAL/FAIL; cascades to instrument + impact"
    roles: [Technician]
    code: 200
    input: []
    output: CalibrationEvent
    side_effects:
      - "compute result, tur, max_abs_deviation, as_found/as_left_in_tolerance (calc cal_result, tur_ratio, drift_deviation)"
      - "PASS/CONDITIONAL: instrument calibration_status=IN_TOLERANCE; recompute next_due_epoch (calc next_due_epoch)"
      - "FAIL: instrument calibration_status=OUT_OF_TOLERANCE; lifecycle_status=QUARANTINED; auto-create OutOfToleranceImpact(OPEN) with suspect window (calc suspect_window); open_oot_count += 1"
      - "increments CalibrationEvent.version by 1; increments Instrument.version by 1"
  - method: POST
    path: "/calibration-events/{id}/reopen"
    description: "Reopen a FAILED event back to IN_PROGRESS after its impact is CANCELLED (revision cycle)"
    roles: [Technician]
    code: 200
    input: []
    output: CalibrationEvent
    side_effects: ["status FAILED→IN_PROGRESS; result=null", "increments CalibrationEvent.version by 1"]
  - method: POST
    path: "/calibration-events/{id}/cancel"
    description: "Cancel a DRAFT event"
    roles: [Technician]
    code: 200
    input: []
    output: CalibrationEvent
    side_effects: ["status DRAFT→CANCELLED", "increments CalibrationEvent.version by 1"]

  # ---- Measurement Points (child of CalibrationEvent) ----
  - method: POST
    path: "/calibration-events/{id}/measurement-points"
    description: "Add a measurement point to a DRAFT/IN_PROGRESS event"
    roles: [Technician]
    code: 201
    input: [point_label, nominal, tol_plus, tol_minus, as_found_value, "as_left_value?"]
    output: MeasurementPoint
    side_effects: ["compute as_found_pass, as_left_pass (closed-interval test)"]
  - method: GET
    path: "/calibration-events/{id}/measurement-points"
    description: "List measurement points of an event (reverse-reachability for calibration_event_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["limit?", "offset?"]
    output: "MeasurementPoint[]"
    side_effects: []

  # ---- Certificates (child of CalibrationEvent) ----
  - method: POST
    path: "/calibration-events/{id}/certificates"
    description: "Issue a vendor certificate for the event"
    roles: [Metrologist]
    code: 201
    input: [vendor_id, certificate_number, issued_epoch]
    output: CalibrationCertificate
    side_effects: ["status=ISSUED"]
  - method: GET
    path: "/calibration-events/{id}/certificates"
    description: "List certificates of an event (reverse-reachability for calibration_event_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["limit?", "offset?"]
    output: "CalibrationCertificate[]"
    side_effects: []
  - method: GET
    path: "/certificates/{id}"
    description: "Get a certificate"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: CalibrationCertificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List certificates filtered by vendor_id (reverse-reachability for certificate vendor_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: "CalibrationCertificate[]"
    side_effects: []
  - method: POST
    path: "/certificates/{id}/verify"
    description: "Verify an ISSUED certificate (Metrologist)"
    roles: [Metrologist]
    code: 200
    input: []
    output: CalibrationCertificate
    side_effects: ["status ISSUED→VERIFIED", "increments CalibrationCertificate.version by 1"]
  - method: POST
    path: "/certificates/{id}/reject"
    description: "Reject an ISSUED certificate"
    roles: [Metrologist]
    code: 200
    input: []
    output: CalibrationCertificate
    side_effects: ["status ISSUED→REJECTED", "increments CalibrationCertificate.version by 1"]
  - method: POST
    path: "/certificates/{id}/reissue"
    description: "Re-issue a REJECTED certificate (revert to ISSUED)"
    roles: [Metrologist]
    code: 200
    input: ["certificate_number?"]
    output: CalibrationCertificate
    side_effects: ["status REJECTED→ISSUED", "increments CalibrationCertificate.version by 1"]

  # ---- Out-of-Tolerance Impacts (child of Instrument; auto-created) ----
  - method: GET
    path: "/instruments/{id}/impacts"
    description: "List an instrument's OOT impacts (reverse-reachability for OutOfToleranceImpact.instrument_id FK; auto-created records discoverable only here)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "OutOfToleranceImpact[]"
    side_effects: []
  - method: GET
    path: "/impacts/{id}"
    description: "Get an OOT impact with computed window + counts"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: OutOfToleranceImpact
    side_effects: []
  - method: GET
    path: "/impacts"
    description: "List impacts filtered by triggering_event_id (reverse-reachability for OutOfToleranceImpact.triggering_event_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["triggering_event_id?", "limit?", "offset?"]
    output: "OutOfToleranceImpact[]"
    side_effects: []
  - method: GET
    path: "/impacts/{id}/exposure"
    description: "Computed recall exposure count (dual-variant conservative/measured)"
    roles: [QualityEngineer, Metrologist]
    code: 200
    input: ["basis?"]
    output: "{ exposure_count: integer, basis: string, suspect_window_start_epoch: integer, suspect_window_end_epoch: integer }"
    side_effects: []
  - method: POST
    path: "/impacts/{id}/investigate"
    description: "Move impact OPEN/ESCALATED → INVESTIGATING (segregation of duties enforced)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: OutOfToleranceImpact
    side_effects: ["status→INVESTIGATING", "increments OutOfToleranceImpact.version by 1"]
  - method: POST
    path: "/impacts/{id}/disposition"
    description: "Disposition impact INVESTIGATING→DISPOSITIONED; RECALL fans out recall cascade"
    roles: [QualityEngineer]
    code: 200
    input: [disposition]
    output: OutOfToleranceImpact
    side_effects:
      - "set disposition, dispositioned_by_user_id; status→DISPOSITIONED"
      - "RECALL: in-window AffectedProducts → RECALLED; recompute recalled_product_count (calc recall_exposure)"
      - "USE_AS_IS/REWORK/SCRAP: FLAGGED AffectedProducts → CLEARED"
      - "instrument open_oot_count -= 1"
      - "increments OutOfToleranceImpact.version by 1"
  - method: POST
    path: "/impacts/{id}/escalate"
    description: "Escalate INVESTIGATING→ESCALATED (hold)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: OutOfToleranceImpact
    side_effects: ["status→ESCALATED", "increments OutOfToleranceImpact.version by 1"]
  - method: POST
    path: "/impacts/{id}/cancel"
    description: "Cancel an OPEN impact (only when no product already RECALLED)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: OutOfToleranceImpact
    side_effects: ["status OPEN→CANCELLED", "instrument open_oot_count -= 1", "increments OutOfToleranceImpact.version by 1"]

  # ---- Affected Products (child of OutOfToleranceImpact) ----
  - method: POST
    path: "/impacts/{id}/affected-products"
    description: "Attach a product measured by the suspect instrument to the impact"
    roles: [QualityEngineer]
    code: 201
    input: [product_serial, measured_epoch]
    output: AffectedProduct
    side_effects: ["compute in_suspect_window (closed-interval test); affected_product_count += 1"]
  - method: GET
    path: "/impacts/{id}/affected-products"
    description: "List affected products of an impact (reverse-reachability for impact_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AffectedProduct[]"
    side_effects: []

  # ---- Gage R&R Studies (child of Instrument) ----
  - method: POST
    path: "/instruments/{id}/gage-rr-studies"
    description: "Create a DRAFT gage R&R study (OCC-guarded on instrument version)"
    roles: [QualityEngineer]
    code: 201
    input: [operator_count, part_count, trial_count, process_tolerance, expected_instrument_version]
    output: GageRRStudy
    side_effects:
      - "status=DRAFT"
      - "increments Instrument.version by 1 (attaching a study mutates the instrument's measurement-system record and advances the OCC guard)"
  - method: GET
    path: "/instruments/{id}/gage-rr-studies"
    description: "List an instrument's gage R&R studies (reverse-reachability for instrument_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GageRRStudy[]"
    side_effects: []
  - method: GET
    path: "/gage-rr-studies/{id}"
    description: "Get a gage R&R study with computed %GRR/acceptability"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: []
  - method: POST
    path: "/gage-rr-studies/{id}/trials"
    description: "Record one operator-part-trial measurement cell"
    roles: [QualityEngineer, Technician]
    code: 201
    input: [operator_index, part_index, trial_index, measured_value]
    output: GageRRTrial
    side_effects: []
  - method: GET
    path: "/gage-rr-studies/{id}/trials"
    description: "List a study's trial cells (reverse-reachability for study_id FK)"
    roles: [QualityEngineer, Technician, Metrologist]
    code: 200
    input: ["limit?", "offset?"]
    output: "GageRRTrial[]"
    side_effects: []
  - method: POST
    path: "/gage-rr-studies/{id}/open"
    description: "Open study DRAFT→COLLECTING"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: ["status DRAFT→COLLECTING", "increments GageRRStudy.version by 1"]
  - method: POST
    path: "/gage-rr-studies/{id}/analyze"
    description: "Analyze a complete trial matrix → ANALYZED; compute %GRR"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: ["compute ev/av/grr/pct_grr/acceptability (calc gage_rr_metrics)", "status COLLECTING→ANALYZED", "increments GageRRStudy.version by 1"]
  - method: POST
    path: "/gage-rr-studies/{id}/accept"
    description: "Accept an ANALYZED study (acceptability != UNACCEPTABLE)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: ["status ANALYZED→ACCEPTED", "increments GageRRStudy.version by 1"]
  - method: POST
    path: "/gage-rr-studies/{id}/reject"
    description: "Reject an ANALYZED study back to COLLECTING (revision cycle)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: ["status ANALYZED→COLLECTING; computed metrics reset to null", "increments GageRRStudy.version by 1"]
  - method: POST
    path: "/gage-rr-studies/{id}/cancel"
    description: "Cancel a DRAFT/COLLECTING study"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: GageRRStudy
    side_effects: ["status→CANCELLED", "increments GageRRStudy.version by 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header absent/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign key (standard_id/vendor_id/parent_standard_id) references a non-existent row" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, or out-of-range numeric (negative tolerance, count out of bounds)" }
  - { id: ERR_DUPLICATE_ASSET_TAG, http: 409, condition: "asset_tag already used by a non-RETIRED instrument" }
  - { id: ERR_DUPLICATE_CERTIFICATE_NUMBER, http: 409, condition: "certificate_number already used by a non-REJECTED certificate of the vendor" }
  - { id: ERR_TRACEABILITY_CYCLE, http: 409, condition: "parent_standard_id chain forms a cycle/self-reference or exceeds MAX_DEPTH" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_INSTRUMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the owning instrument lifecycle_status == ACTIVE" }
  - { id: ERR_INSTRUMENT_RETIRED, http: 409, condition: "Write attempted against a RETIRED instrument or its children" }
  - { id: ERR_STANDARD_NOT_TRACEABLE, http: 409, condition: "Event start: standard_id is not currently traceable to NIST" }
  - { id: ERR_VENDOR_NOT_ELIGIBLE, http: 409, condition: "Vendor suspended or accreditation lapsed at event start / certificate verify" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "QualityEngineer X-User-ID equals the triggering event performed_by_user_id on impact investigate/disposition" }
  - { id: ERR_NO_MEASUREMENT_POINTS, http: 409, condition: "Event start with zero MeasurementPoints" }
  - { id: ERR_INCOMPLETE_TRIAL_MATRIX, http: 409, condition: "Gage-RR analyze with a trial matrix that is not exactly operator*part*trial complete" }
  - { id: ERR_NO_RECALLABLE_PRODUCT, http: 409, condition: "RECALL disposition with no in-window AffectedProduct" }
  - { id: ERR_OPEN_IMPACT_EXISTS, http: 409, condition: "Instrument release/retire with open_oot_count > 0" }
  - { id: ERR_LATEST_CAL_NOT_PASSING, http: 409, condition: "Instrument release while latest finalized event result not IN {PASS, CONDITIONAL}" }
  - { id: ERR_OPEN_CALIBRATION_EXISTS, http: 409, condition: "Instrument retire while a DRAFT/IN_PROGRESS event exists" }
  - { id: ERR_DUPLICATE_TRIAL_CELL, http: 409, condition: "GageRRTrial cell already populated or index out of declared bounds" }
  - { id: ERR_GAGE_RR_UNACCEPTABLE, http: 409, condition: "Gage-RR accept with acceptability == UNACCEPTABLE" }
  - { id: ERR_IMPACT_NOT_CANCELLED, http: 409, condition: "Event reopen while its auto-created impact is not CANCELLED" }
  - { id: ERR_RECALL_ALREADY_ISSUED, http: 409, condition: "Impact cancel after a product has already been RECALLED" }
  - { id: ERR_CERT_VENDOR_MISMATCH, http: 409, condition: "Certificate vendor_id differs from the owning event vendor_id on verify" }
  - { id: ERR_EVENT_NOT_FINALIZED, http: 409, condition: "Certificate verify while owning event not PASSED/CONDITIONAL_PASS" }
  - { id: ERR_STALE_INSTRUMENT_VERSION, http: 412, condition: "expected_instrument_version != current Instrument.version on OCC-guarded create/transition" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Technician
    description: "Performs calibrations: opens events, records measurement points, starts/finalizes/reopens/cancels events. Cannot disposition the OOT impacts arising from its own calibrations (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /instruments/{id}/calibration-events"
      - "POST /calibration-events/{id}/start"
      - "POST /calibration-events/{id}/finalize"
      - "POST /calibration-events/{id}/reopen"
      - "POST /calibration-events/{id}/cancel"
      - "POST /calibration-events/{id}/measurement-points"
    shared_operations:
      - "GET (read) endpoints"
      - "POST /gage-rr-studies/{id}/trials"

  - name: QualityEngineer
    description: "Owns the asset register and OOT impact lifecycle: registers/releases/retires instruments, investigates/dispositions/escalates impacts, manages affected products and gage R&R studies."
    identity: opaque
    exclusive_operations:
      - "POST /instruments"
      - "POST /instruments/{id}/release"
      - "POST /instruments/{id}/retire"
      - "POST /instruments/{id}/gage-rr-studies"
      - "POST /gage-rr-studies/{id}/open|analyze|accept|reject|cancel"
      - "POST /impacts/{id}/investigate|disposition|escalate|cancel"
      - "POST /impacts/{id}/affected-products"
      - "POST /_clock/advance"
    shared_operations:
      - "GET (read) endpoints"
      - "POST /gage-rr-studies/{id}/trials"

  - name: Metrologist
    description: "Owns standards, vendors, and certificates: registers standards (traceability DAG) and vendors, issues/verifies/rejects/reissues certificates."
    identity: opaque
    exclusive_operations:
      - "POST /calibration-standards"
      - "PUT /calibration-standards/{id}"
      - "POST /calibration-vendors"
      - "PATCH /calibration-vendors/{id}"
      - "POST /calibration-events/{id}/certificates"
      - "POST /certificates/{id}/verify|reject|reissue"
    shared_operations:
      - "GET (read) endpoints"
