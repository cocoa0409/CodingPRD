  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: price_response_reflects_debit_immediately
        claim_type: immediate
        grounds: [state_machines.TollTransaction.PENDING_to_PRICED, entities.TollTransaction.fields.toll_cents]
        distinguishing_aspect: "The price response itself returns the final toll_cents and PRICED status in the same request (immediate consistency); a follow-up GET on the account shows the debited balance."
        test_recipe:
