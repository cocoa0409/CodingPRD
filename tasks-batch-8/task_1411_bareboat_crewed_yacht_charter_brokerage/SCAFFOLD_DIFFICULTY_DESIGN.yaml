            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1 }, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (state priority 4 beats business_fiscal priority 8 even though amount 1 != signing_due_cents 1500000)"
            - "EscrowAccount for ${ag_id}: total_funded_cents == 0 (no movement posted)"

      - name: safety_beats_temporal_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CLIENT_NOT_QUALIFIED]
          - errors[ERR_AVAILABILITY_CONFLICT]
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): submit by an UNVERIFIED
          client whose dates truly overlap an ACTIVE block violates both; the
          qualification error ERR_CLIENT_NOT_QUALIFIED must win over
          ERR_AVAILABILITY_CONFLICT.
        test_recipe:
          setup:
            - "Yacht A with ACTIVE MAINTENANCE block [2026-10-30, 2026-11-09) created pre-listing (expected_yacht_version 1), then LISTED"
            - "client created but resume never submitted (UNVERIFIED)"
            - "request 2026-11-01..2026-11-08 overlaps the block"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "UnQ Client", email: "un@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id, ya_v: $.data.version } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-10-30", end_date: "2026-11-09", expected_yacht_version: "${ya_v}" }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-11-01", end_date: "2026-11-08", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CLIENT_NOT_QUALIFIED (business_safety priority 5 beats business_temporal priority 6 despite the true interval overlap)"
            - "CharterRequest.${rq_id}.status == DRAFT (no transition on rejection)"

      - name: safety_beats_fiscal_on_start_prep
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_PERMIT_NOT_GRANTED]
          - errors[ERR_ESCROW_INSUFFICIENT]
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): start-prep with a leg whose
          permit is missing AND funds only DEPOSIT_HELD violates both gates; the
          regulatory error ERR_PERMIT_NOT_GRANTED must win over
          ERR_ESCROW_INSUFFICIENT.
        test_recipe:
          setup:
            - "Yacht A, 2026-10-30..2026-11-19 (fee 2000000); accepted, insured VERIFIED, SIGNED, only SIGNING funded (1500000)"
            - "one ItineraryLeg 2026-11-02..2026-11-04 with NO permit (leg PLANNED)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 2000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1500000 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/itinerary-legs", payload: { port_name: "Mykonos", arrival_date: "2026-11-02", departure_date: "2026-11-04" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { leg_id: $.data.id } }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/start-prep", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PERMIT_NOT_GRANTED (business_safety priority 5 beats business_fiscal priority 8 even though funds_status DEPOSIT_HELD != FULLY_FUNDED)"
            - "CharterAgreement.${ag_id}.status == SIGNED and funds_status == DEPOSIT_HELD (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_day_boundary_60_vs_59
        grounds:
          - calculations.cancellation_penalty
          - entities.CharterAgreement.fields.days_before_start
        distinguishing_aspect: |
          Metric: days_before_start (integer days) on POST /cancel. The tier
          boundary is inclusive from above: exactly 60 days lands in the 0.30
          tier (penalty 600000) while 59 days drops to the 0.50 tier
          (penalty 1000000) on an identical fee of 2000000.
        test_recipe:
          setup:
            - "Yacht A; client QUALIFIED; TWO sequential agreements on the same dates 2026-10-30..2026-11-19 (the first is CANCELLED — terminal — before the second is created, so no duplicate-active conflict and its block is released)"
            - "first agreement cancelled at clock 2026-08-31 (60 days out); second at 2026-09-01 (59 days out)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
