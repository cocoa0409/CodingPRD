  - rule_id: cross_entity_state_dependency
    instances:
      - name: special_claim_payment_requires_the_covering_monthly_voucher_to_be_paid_first
        grounds:
          - validations[priority=41]
          - errors[ERR_COVERING_VOUCHER_NOT_PAID]
          - state_machines.SpecialClaim.APPROVED_to_PAID
          - state_machines.VoucherSubmission.SUBMITTED_to_PAID
          - calculations.special_claim_amount
          - calculations.subsidy_reconciliation
        distinguishing_aspect: |
          The gate on POST /pbra/special-claims/{id}/pay does not read anything on the claim: the
          claim is already APPROVED and its amount is fixed. It reads the state of a *different*
          entity — the VoucherSubmission for the same contract_id and the same period_month — and
          refuses until that row reaches PAID. The blocking entity is discovered by matching a
          value field (period_month == claim_period_month), not by a foreign key on the claim.
        test_recipe:
          setup:
            - "Owner, IL property, HapContract with authorized_hap_budget_cents 30000000, two certified households, clock at the default 2026-08-01."
            - "A 2026-07 voucher submission worth 211500, SUBMITTED but not paid."
            - "An APPROVED UNPAID_RENT claim for unit 101 and claim_period_month 2026-07 worth 70000 (min(90000, 1 x 118000) less a 20000 security deposit)."
