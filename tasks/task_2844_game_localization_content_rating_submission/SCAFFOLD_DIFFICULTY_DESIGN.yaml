# ===========================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2844_game_localization_content_rating_submission
#
# Every instance grounds only in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7. Nine rule_id blocks, 23 instances.
#
# Numeric literals in `assert:` were computed by executing the §1.3 formulas.
# The logical clock starts at 2026-08-01T00:00:00Z; every title in this file
# targets 2026-12-01T00:00:00Z, i.e. days_to_release == 122 unless the clock
# is explicitly moved.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: localization_effort_scope_estimate_vs_delivered_actual
        grounds:
          - calculations.market_text_effort_units
          - calculations.market_localization_cost_cents
          - entities.MarketPlan.fields.text_effort_units
          - entities.MarketPlan.fields.text_effort_variant
          - entities.StringKey.fields.tm_match_pct
          - entities.TranslationUnit.fields.applied_tm_match_pct
          - state_machines.MarketPlan.DRAFT_to_SCOPED
          - state_machines.MarketPlan.IN_LOCALIZATION_to_LQA
        distinguishing_aspect: |
          This instance lives in the MarketPlan effort domain: the SCOPE_ESTIMATE variant reads
          StringKey.tm_match_pct over all non-retired keys and yields 4.30 units, while the
          DELIVERED_ACTUAL variant reads TranslationUnit.applied_tm_match_pct over DELIVERED units
          only and yields 5.20 units from the byte-identical key set, because the vendor reused a
          60% match on sub.intro where extraction had predicted 80%.
        test_recipe:
          setup:
            - "One STAGGERED title NOVA-7 targeting 2026-12-01T00:00:00Z, clock left at its 2026-08-01T00:00:00Z default."
            - "Four string keys: menu.start (125 chars, MENU, tm 96), sub.intro (250, SUBTITLE, tm 80), legal.eula (90, LEGAL, tm 40), hud.ammo (175, HUD, tm 60)."
            - "One JP market plan, TEXT_ONLY, budget cap 5000000 cents, no voice quota."
            - "Strings locked, market scoped, localization started, all four units drafted with applied TM 96/60/40/60 and delivered."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-7", name: "Nova Drift 7", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "sub.intro", source_text: "The colony fell before dawn.", source_char_count: 250, ui_surface: "SUBTITLE", display_char_limit: 260, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_sub: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "legal.eula", source_text: "By continuing you accept the licence.", source_char_count: 90, ui_surface: "LEGAL", display_char_limit: 100, tm_match_pct: 40 }
              as: LocalizationProducer
              captures: { k_legal: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 175, ui_surface: "HUD", display_char_limit: 180, tm_match_pct: 60 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { scope_units: "$.data.text_effort_units", scope_cost: "$.data.localization_cost_cents" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_jp}"
              payload: {}
              as: TranslationVendor
              captures: { u_menu: "$.data[0].id", u_sub: "$.data[1].id", u_legal: "$.data[2].id", u_hud: "$.data[3].id" }
            - call: "PUT /translation-units/${u_menu}"
              payload: { target_text: "ゲーム開始", target_char_count: 120, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "PUT /translation-units/${u_sub}"
              payload: { target_text: "コロニーは夜明け前に陥落した。", target_char_count: 240, applied_tm_match_pct: 60 }
              as: TranslationVendor
            - call: "PUT /translation-units/${u_legal}"
              payload: { target_text: "続行すると使用許諾に同意したものとみなされます。", target_char_count: 95, applied_tm_match_pct: 40 }
              as: TranslationVendor
            - call: "PUT /translation-units/${u_hud}"
              payload: { target_text: "残弾", target_char_count: 170, applied_tm_match_pct: 60 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_menu}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /translation-units/${u_sub}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /translation-units/${u_legal}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /translation-units/${u_hud}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { lqa_units: "$.data.text_effort_units", lqa_cost: "$.data.localization_cost_cents" }
          assert:
            - "after scope: MarketPlan.${mp_jp}.text_effort_units == 4.30"
            - "after scope: MarketPlan.${mp_jp}.text_effort_variant == SCOPE_ESTIMATE"
            - "after scope: MarketPlan.${mp_jp}.localization_cost_cents == 18060"
            - "after scope: MarketPlan.${mp_jp}.required_unit_count == 4"
            - "after enter-lqa: MarketPlan.${mp_jp}.text_effort_units == 5.20"
            - "after enter-lqa: MarketPlan.${mp_jp}.text_effort_variant == DELIVERED_ACTUAL"
            - "after enter-lqa: MarketPlan.${mp_jp}.localization_cost_cents == 21840"
            - "the two variants differ by exactly 0.90 units and 3780 cents on identical key data"
            - "MarketPlan.${mp_jp}.overage_cents == 0 in both variants"

      - name: rating_risk_self_assessed_vs_board_adjusted
        grounds:
          - calculations.rating_risk_score
          - calculations.submission_fee_cents
          - entities.RatingSubmission.fields.self_assessed_risk_score
          - entities.RatingSubmission.fields.board_adjusted_risk_score
          - entities.RatingSubmission.fields.projected_rating_band
          - entities.LqaBug.fields.bug_class
          - state_machines.RatingSubmission.DRAFT_to_SUBMITTED
          - state_machines.RatingSubmission.SUBMITTED_to_UNDER_REVIEW
          - concurrency_rules[submission-create-stale-market-plan]
        distinguishing_aspect: |
          This instance lives in the RatingSubmission compliance domain, not the effort domain:
          the SELF_ASSESSED variant sums descriptor weights only and scores 37 (band TEEN_12),
          while the BOARD_ADJUSTED variant adds 6 for the one unresolved LEGAL_TEXT bug and scores
          43 (band MATURE_15) from the same disclosed_content_codes array.
        test_recipe:
          setup:
            - "Title NOVA-8 with a single string key, JP market plan TEXT_ONLY at LQA with its one unit delivered."
            - "One OPEN LINGUISTIC QaPass over 100 inspected units carrying one TRIAGED S2 LEGAL_TEXT bug."
            - "One DRAFT rating submission disclosing VIOLENCE_STYLIZED, BLOOD and LANGUAGE_STRONG with one footage asset."
            - "Clock left at 2026-08-01T00:00:00Z so days_to_release is 122 and no expedite fee applies."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-8", name: "Nova Drift 8", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "MATURE_15", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_jp}"
              payload: {}
              as: TranslationVendor
              captures: { u_menu: "$.data[0].id" }
            - call: "PUT /translation-units/${u_menu}"
              payload: { target_text: "ゲーム開始", target_char_count: 120, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_menu}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
            - call: "POST /qa-passes"
              payload: { market_plan_id: "${mp_jp}", pass_type: "LINGUISTIC", inspected_unit_count: 100 }
              as: LqaTester
              as_user_id: "lqa-opener-1"
              captures: { qp_ling: "$.data.id" }
            - call: "POST /lqa-bugs"
              payload: { qa_pass_id: "${qp_ling}", bug_class: "LEGAL_TEXT", severity: "S2", summary: "Mandatory age notice omitted from the JP legal screen." }
              as: LqaTester
              as_user_id: "lqa-logger-1"
              captures: { bug_legal: "$.data.id" }
            - call: "POST /lqa-bugs/${bug_legal}/triage"
              payload: { triage_action: "ACCEPT" }
              as: LqaTester
              as_user_id: "lqa-logger-1"
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { mp_jp_v: "$.data.version" }
            - call: "POST /rating-submissions"
              payload: { market_plan_id: "${mp_jp}", disclosed_content_codes: ["VIOLENCE_STYLIZED", "BLOOD", "LANGUAGE_STRONG"], footage_asset_count: 1, target_rating: "MATURE_15", expected_market_plan_version: "${mp_jp_v}" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { sub1: "$.data.id" }
          trigger:
            - call: "POST /rating-submissions/${sub1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { self_score: "$.data.self_assessed_risk_score", fee: "$.data.fee_cents" }
            - call: "POST /rating-submissions/${sub1}/begin-review"
              payload: {}
              as: RatingBoardLiaison
              as_user_id: "board-1"
              captures: { board_score: "$.data.board_adjusted_risk_score", band: "$.data.projected_rating_band" }
          assert:
            - "RatingSubmission.${sub1}.submission_round == 1"
            - "RatingSubmission.${sub1}.self_assessed_risk_score == 37"
            - "RatingSubmission.${sub1}.fee_cents == 456000"
            - "RatingSubmission.${sub1}.board_adjusted_risk_score == 43"
            - "RatingSubmission.${sub1}.projected_rating_band == MATURE_15"
            - "the two variants differ by exactly 6 points from one unresolved LEGAL_TEXT bug and land in different bands (TEEN_12 vs MATURE_15)"
            - "QaPass.${qp_ling}.defect_density == 0.0400"

  - rule_id: combinatorial_formula
    instances:
      - name: cultural_cost_conditional_branch_floor_and_budget_clamp
        grounds:
          - calculations.market_localization_cost_cents
          - entities.MarketPlan.fields.scope_tier
          - entities.MarketPlan.fields.budget_cap_cents
          - entities.MarketPlan.fields.overage_cents
          - entities.TalentContract.fields.per_line_rate_cents
          - state_machines.VoiceSession.IN_PROGRESS_to_RECORDED
        distinguishing_aspect: |
          Mode (a) - multi-operator composition: this formula combines a scope multiplier, a
          conditional FULL_CULTURAL branch, a nested max() floor of 150000 against 15% of the
          text+voice base, and a final min()/max() budget clamp, so the 150000 floor wins over the
          6502-cent percentage at scope time and still wins over 11002 after 30000 cents of voice
          cost, while the clamp splits the 223344 subtotal into 200000 cost + 23344 overage.
        test_recipe:
          setup:
            - "Title NOVA-9 with the same four string keys (125/MENU/96, 250/SUBTITLE/80, 90/LEGAL/40, 175/HUD/60)."
            - "One DE market plan, FULL_CULTURAL, budget cap 200000 cents, voice quota 100 lines."
            - "One booth with the default 30-minute turnaround buffer, one DE voice talent, one SIGNED ALL_MEDIA contract covering DE at 250 cents per line with a 500000-cent buyout."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-9", name: "Nova Drift 9", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "sub.intro", source_text: "The colony fell before dawn.", source_char_count: 250, ui_surface: "SUBTITLE", display_char_limit: 260, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_sub: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "legal.eula", source_text: "By continuing you accept the licence.", source_char_count: 90, ui_surface: "LEGAL", display_char_limit: 100, tm_match_pct: 40 }
              as: LocalizationProducer
              captures: { k_legal: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 175, ui_surface: "HUD", display_char_limit: 180, tm_match_pct: 60 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "FULL_CULTURAL", cultural_adaptation_required: true, budget_cap_cents: 200000, required_voice_line_count: 100 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /booths"
              payload: { booth_code: "BER-A", studio_city: "Berlin" }
              as: LocalizationProducer
              captures: { booth_a: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Anke Roth", language_code: "DE", union_flag: true }
              as: LocalizationProducer
              captures: { talent_de: "$.data.id", talent_de_v: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_de}", title_id: "${title_id}", territory_scope: ["DE"], media_scope: "ALL_MEDIA", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_de_v}" }
              as: LocalizationProducer
              captures: { contract_de: "$.data.id" }
            - call: "POST /talent-contracts/${contract_de}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_de}"
          trigger:
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { scope_cost: "$.data.localization_cost_cents", scope_overage: "$.data.overage_cents" }
            - call: "POST /market-plans/${mp_de}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_de}", voice_talent_id: "${talent_de}", recording_booth_id: "${booth_a}", talent_contract_id: "${contract_de}", start_utc: "2026-09-10T09:00:00Z", end_utc: "2026-09-10T12:00:00Z", planned_line_count: 120 }
              as: LocalizationProducer
              captures: { sess_1: "$.data.id" }
            - call: "POST /voice-sessions/${sess_1}/start"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_de}"
            - call: "POST /voice-sessions/${sess_1}/complete"
              payload: { recorded_line_count: 120 }
              as: TalentAgent
              as_user_id: "${talent_de}"
              captures: { line_fee: "$.data.line_fee_cents" }
          assert:
            - "after scope: MarketPlan.${mp_de}.text_effort_units == 4.30"
            - "after scope: MarketPlan.${mp_de}.localization_cost_cents == 193344 (text 43344 + cultural floor 150000, not the 6502-cent 15% reading)"
            - "after scope: MarketPlan.${mp_de}.overage_cents == 0"
            - "VoiceSession.${sess_1}.line_fee_cents == 30000"
            - "after complete: MarketPlan.${mp_de}.localization_cost_cents == 200000 (subtotal 223344 clamped to the 200000 cap)"
            - "after complete: MarketPlan.${mp_de}.overage_cents == 23344"
            - "the cultural surcharge stays at the 150000 floor rather than 11002 == round(0.15 * 73344)"
            - "MarketPlan.${mp_de}.voice_recorded_line_count == 120"

      - name: effort_rounding_pinned_per_key_then_sum
        grounds:
          - calculations.market_text_effort_units
          - entities.StringKey.fields.ui_surface
          - entities.StringKey.fields.source_char_count
          - state_machines.MarketPlan.DRAFT_to_SCOPED
        distinguishing_aspect: |
          Mode (b) - pinned rounding order: the four keys round per key to 1 decimal
          (0.1 + 1.4 + 1.4 + 1.4) and only then sum to 4.30; summing the unrounded raw values
          (0.125 + 1.35 + 1.35 + 1.44375 = 4.26875) and rounding once at the end yields 4.27, a
          different observable number, so the assertion falsifies the wrong order outright.
        test_recipe:
          setup:
            - "Title NOVA-10 with exactly the four keys whose raw unit values are 0.125, 1.35, 1.35 and 1.44375 - every one of them lands on a rounding decision."
            - "One US market plan, TEXT_ONLY, budget cap 5000000, no voice quota, left in DRAFT until the trigger."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-10", name: "Nova Drift 10", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "sub.intro", source_text: "The colony fell before dawn.", source_char_count: 250, ui_surface: "SUBTITLE", display_char_limit: 260, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_sub: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "legal.eula", source_text: "By continuing you accept the licence.", source_char_count: 90, ui_surface: "LEGAL", display_char_limit: 100, tm_match_pct: 40 }
              as: LocalizationProducer
              captures: { k_legal: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 175, ui_surface: "HUD", display_char_limit: 180, tm_match_pct: 60 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "US", rating_board: "ESRB", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_us: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_us}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { units: "$.data.text_effort_units", cost: "$.data.localization_cost_cents" }
          assert:
            - "MarketPlan.${mp_us}.text_effort_units == 4.30"
            - "MarketPlan.${mp_us}.text_effort_units != 4.27 (the sum-then-round reading is wrong)"
            - "MarketPlan.${mp_us}.localization_cost_cents == 18060"
            - "MarketPlan.${mp_us}.localization_cost_cents != 17934 (which is what 4.27 units would have produced)"

      - name: submission_fee_discount_tier_keyed_on_pre_discount_subtotal
        grounds:
          - calculations.submission_fee_cents
          - entities.RatingSubmission.fields.submission_round
          - entities.RatingSubmission.fields.fee_cents
          - state_machines.RatingSubmission.UNDER_REVIEW_to_EDITS_REQUIRED
          - state_machines.RatingSubmission.EDITS_REQUIRED_to_WITHDRAWN
          - calculations.title_release_gate_state
        distinguishing_aspect: |
          Mode (c) - pinned evaluation order: the volume discount tier is keyed on the
          pre_discount_subtotal of 555000 (giving 5% = 27750) and NOT on the post-expedite total
          of 721500 (which would give 10% = 72150), so the correct round-2 expedited CERO fee is
          693750 rather than the 649350 the wrong keying produces.
        test_recipe:
          setup:
            - "Title NOVA-11, one string key, JP market plan TEXT_ONLY at LQA with its one unit delivered."
            - "Round 1 submission filed, reviewed and sent back with board_decision REQUIRE_EDITS."
            - "Clock advanced to 2026-11-05T00:00:00Z, i.e. 26 days before the 2026-12-01 release, so the expedite surcharge applies."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-11", name: "Nova Drift 11", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
