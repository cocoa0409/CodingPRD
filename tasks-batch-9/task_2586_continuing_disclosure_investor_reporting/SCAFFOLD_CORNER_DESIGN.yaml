              captures: { g_id: "$.data.id", g_created: "$.data.created_at", g_kind: "$.data.kind", g_weight: "$.data.weight_bp", g_waivable: "$.data.waivable", g_opinion: "$.data.requires_audit_opinion" }
          assert:
            - "${g_id} == \"${req_id}\" and ${g_created} == \"${req_created}\""
            - "the response object has NO `version` key and NO `updated_at` key — common_fields is false for this entity"
            - "${g_kind} == OPERATING_DATA_TABLE, ${g_weight} == 10000, ${g_waivable} == false, ${g_opinion} == false"
            - "§1.5 declares exactly two endpoints whose path starts /disclosure/content-requirements — the POST collection and the two GETs; there is no PATCH, no DELETE and no action sub-path, so the row cannot be mutated after creation"

      - name: dissemination_engagement_creation_with_unknown_undertaking_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4_ERR_<ENTITY>_NOT_FOUND
          - endpoints.POST_/disclosure/dissemination-engagements
          - entities.DisseminationEngagement.fields.undertaking_id
        distinguishing_aspect: >-
          Priority 4 validates body FKs BEFORE priority 7's OCC check, so a request naming a
          non-existent undertaking_id returns ERR_UNDERTAKING_NOT_FOUND (404) rather than
          ERR_UNDERTAKING_VERSION_STALE (412) — you cannot compare a version against a row that
          does not exist. The probe deliberately carries the CORRECT version of the other,
          genuinely existing undertaking, so the 404 cannot be explained away as an OCC failure
          and an implementation that resolves the FK only after the version check is exposed.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with one ACTIVE Undertaking exists, so the endpoint itself is reachable; the probe simply names a different, non-existent undertaking."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 75000000 }
