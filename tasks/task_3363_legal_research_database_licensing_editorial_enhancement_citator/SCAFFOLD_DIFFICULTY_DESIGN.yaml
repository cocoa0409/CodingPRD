            - {call: "GET /legal-research/users", payload: {account_id: "${a_x}"}, as: FirmAdmin, as_user_id: "${a_x}", captures: {u_x: "$.data[0].id"}}
            - {call: "POST /legal-research/subscriptions/${s_y}/seats", payload: {action: ASSIGN, user_email: "y@bb.com", user_full_name: "Y One"}, as: FirmAdmin, as_user_id: "${a_y}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_y}"}, as: FirmAdmin, as_user_id: "${a_y}", captures: {u_y: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_x}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_x}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_x}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_y}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_y}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_y}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_y}"}
          trigger:
