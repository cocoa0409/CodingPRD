  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: gear_fail_inspection_cascades_four_hops_to_review_supersede
        grounds:
          - state_machines.RiggingGear.SERVICEABLE_to_QUARANTINED
          - state_machines.LiftPlan.APPROVED_to_SURVEYED
          - state_machines.EngineeringReview.STAMPED_to_SUPERSEDED
          - entities.GearAssignment.fields.status
          - entities.LiftPlan.fields.rigging_verified
          - calculations.crane_reserved_hours
        distinguishing_aspect: |
          A single FAIL inspection propagates through four causally chained hops —
          RiggingGear SERVICEABLE->QUARANTINED, which voids the GearAssignment, which demotes
          the LiftPlan APPROVED->SURVEYED, which supersedes the STAMPED EngineeringReview.
          The trigger is a gear inspection, structurally distinct from the plan-cancel cascade.
        test_recipe:
          setup:
            - "A CRITICAL plan has been configured, stamped by a second engineer and is APPROVED with field_status NOT_MOBILIZED."
            - "The plan holds exactly one ACTIVE GearAssignment on a SERVICEABLE sling and reserves 10.0 crane hours."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
