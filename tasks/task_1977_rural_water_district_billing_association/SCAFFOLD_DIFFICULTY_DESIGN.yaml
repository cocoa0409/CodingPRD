      - call: POST /districts/${d4_id}/board-resolutions/${res4_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d4_id}/board-resolutions/${res4_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d4_id}/service-areas
