          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "A Guest calling POST /tour-products (Operator-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a registered guest acts"]
          setup_api_calls:
            - call: "POST /guests"
