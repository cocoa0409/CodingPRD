  - rule_id: resource_temporal_overlap
    instances:

      - name: ship_slot_buffered_aggregate_capacity_two_day_geometry
        grounds:
          - calculations.ship_slot_capacity
          - state_machines.Order.transitions.FULFILLING_to_SHIPPED
          - errors[ERR_SHIP_SLOT_CONFLICT]
          - validations[priority=8.5]
          - endpoints.POST_/orders/{id}/shipping
        distinguishing_aspect: >
          This overlap rule uses buffered aggregate capacity geometry: each dispatch
          occupies its own calendar day AND the preceding day as a quarantine buffer,
          and a dispatch is refused when either of those two days already carries two
          shipments of the same drug, so shipments one day apart still collide while
          shipments two days apart never do.
