  - section: endpoints
    instances:
      - name: site_listing_combines_filters_with_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /monitoring-sites]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Across three sites in one network the status, site_type and limit/offset parameters each narrow the same result set, and total_count keeps reporting the filtered population - 3, 1, 1 - while has_more flips with the page."
        test_recipe:
          setup:
            - "one network with an OPERATING POPULATION_ORIENTED site, a PROPOSED BACKGROUND site and a SITING_APPROVED SOURCE_ORIENTED site, created in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-002", site_type: "BACKGROUND", latitude: 40.10, longitude: -105.30, population_served: 0, probe_height_m: 4.0, distance_to_roadway_m: 150.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_b_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-003", site_type: "SOURCE_ORIENTED", latitude: 39.60, longitude: -104.80, population_served: 12000, probe_height_m: 4.0, distance_to_roadway_m: 40.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 300.0 }
              as: NetworkAdmin
              captures: { site_c_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_c_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
          trigger:
            - call: "GET /monitoring-sites"
              payload: { network_id: "${net_id}" }
              as: ProgramManager
              captures: { first_id: "$.data[0].id" }
            - call: "GET /monitoring-sites"
              payload: { network_id: "${net_id}", status: "PROPOSED" }
              as: ProgramManager
              captures: { proposed_id: "$.data[0].id" }
            - call: "GET /monitoring-sites"
              payload: { network_id: "${net_id}", site_type: "SOURCE_ORIENTED" }
              as: ProgramManager
              captures: { source_id: "$.data[0].id" }
            - call: "GET /monitoring-sites"
              payload: { network_id: "${net_id}", limit: 2, offset: 0 }
              as: ProgramManager
            - call: "GET /monitoring-sites"
              payload: { network_id: "${net_id}", limit: 2, offset: 2 }
              as: ProgramManager
              captures: { page2_id: "$.data[0].id" }
          assert:
            - "the unfiltered call returns total_count == 3, has_more == false and ${first_id} == ${site_a_id}"
            - "the status filter returns total_count == 1 with ${proposed_id} == ${site_b_id}"
            - "the site_type filter returns total_count == 1 with ${source_id} == ${site_c_id}"
            - "limit 2 offset 0 returns 2 rows with total_count == 3 and has_more == true"
            - "limit 2 offset 2 returns 1 row with total_count == 3, has_more == false and ${page2_id} == ${site_c_id}"

