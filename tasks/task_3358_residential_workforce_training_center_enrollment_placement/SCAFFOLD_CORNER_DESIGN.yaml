          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "NoAssign Center", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "NoAsg Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICANT_NOT_ELIGIBLE (assignment gate is separate from eligibility)"

      - name: wage_below_agreement_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_WAGE_BELOW_FLOOR]"]
        distinguishing_aspect: "Placement wage 150000 against an agreement floor of 160000 fails at create with ERR_WAGE_BELOW_FLOOR; the floor is inclusive — 160000 exactly is accepted."
        test_recipe:
          setup: ["TRAINING enrollment; ACTIVE agreement with hourly_wage_floor_cents 160000"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Wage Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Wage Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "FloorCo", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 2, hourly_wage_floor_cents: 160000, effective_start: "2026-01-01", effective_end: "2026-12-31" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
          trigger:
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 150000 }, as: TransitionSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 160000 }, as: TransitionSpecialist, captures: { w_ok: $.data.id } }
            - { call: "GET /jc/enrollments/${e1}/wbl-placements", as: TransitionSpecialist, captures: { w_st: "$.data[0].status" } }
          assert:
            - "150000 < floor 160000: error_id == ERR_WAGE_BELOW_FLOOR"
            - "160000 == floor: accepted, placement created in PROPOSED"
            - "GET wbl-placements sub-resource lists exactly 1 row (the accepted placement), status PROPOSED — the rejected create persisted nothing"

      - name: hours_cap_and_duplicate_workdate_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "validations[priority=13]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Two shape-level hours rules: 11 hours exceeds MAX_DAILY_HOURS (10) and a second entry on an already-recorded work_date duplicates — both rejected with ERR_INVALID_REQUEST while a 10-hour fresh-date entry passes."
        test_recipe:
          setup: ["clock 2026-08-25; TRAINING enrollment; ACTIVE placement started 2026-08-25"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Cap Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Cap Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "CapCo", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 2, hourly_wage_floor_cents: 100000, effective_start: "2026-01-01", effective_end: "2026-12-31" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { w1: $.data.id } }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "activate" }, as: TransitionSpecialist }
          trigger:
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "record_hours", work_date: "2026-08-25", hours: 11, verified: true }, as: TransitionSpecialist, captures: { err_cap: $.data.error_id } }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "record_hours", work_date: "2026-08-25", hours: 10, verified: true }, as: TransitionSpecialist, captures: { ok_tot: $.data.verified_hours_total } }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "record_hours", work_date: "2026-08-25", hours: 2, verified: true }, as: TransitionSpecialist, captures: { err_dup: $.data.error_id } }
          assert:
            - "hours 11: error_id == ERR_INVALID_REQUEST (daily cap 10 exceeded)"
            - "hours 10 on a fresh date: accepted, verified_hours_total == 10"
            - "second entry on the same work_date: error_id == ERR_INVALID_REQUEST (duplicate work_date)"

      - name: transition_service_after_window_expired
        claim_type: temporal_validation
        grounds: ["validations[priority=16]", "errors[ERR_TRANSITION_WINDOW_EXPIRED]", entities.TransitionPlan.fields.expires_at]
        distinguishing_aspect: "Clock-driven window: a plan separated on 2026-09-01 expires 2027-09-01; a service recorded with the clock at 2027-09-02 is rejected with ERR_TRANSITION_WINDOW_EXPIRED and the plan reads EXPIRED."
        test_recipe:
          setup: ["one COMPLETED graduate (plan ACTIVE, expires 2027-09-01); clock advanced past the window"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "WinSvc Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Late Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/enrollments/${e1}/transition", payload: { action: "complete" }, as: EnrollmentManager }
            - { call: "GET /jc/enrollments/${e1}/transition-plan", as: TransitionSpecialist, captures: { tp1: "$.data[0].id", tp_exp: "$.data[0].expires_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-02T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/transition-plans/${tp1}/services", payload: { service_type: "HOUSING", outcome: "COMPLETED" }, as: TransitionSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /jc/enrollments/${e1}/transition-plan", as: TransitionSpecialist, captures: { tp_status: "$.data[0].status" } }
          assert:
            - "expires_at == 2027-09-01 (separation 2026-09-01 + 12 months)"
            - "service at clock 2027-09-02: error_id == ERR_TRANSITION_WINDOW_EXPIRED"
            - "plan status now reads EXPIRED (clock past expiry with PENDING tracks)"

      - name: close_period_same_day_not_closable
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_PERIOD_NOT_CLOSABLE]"]
        distinguishing_aspect: "A period cannot close on the day it opened: closing while the clock date equals current_period_start fails with ERR_PERIOD_NOT_CLOSABLE; advancing the clock one day makes the identical call succeed."
        test_recipe:
          setup: ["center; contract created at clock 2026-09-01 (period opens that date)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Close Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/operator-contracts", payload: { center_id: "${c1}", operator_name: "CloseCo", contract_code: "K-500" }, as: OperatorAdmin, captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /jc/operator-contracts/${k1}/close-period", as: OperatorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/operator-contracts/${k1}/close-period", as: OperatorAdmin, captures: { snap: $.data.variant } }
            - { call: "GET /jc/centers/${c1}/operator-contracts", as: OperatorAdmin, captures: { k_st: "$.data[0].status" } }
          assert:
            - "same-day close: error_id == ERR_PERIOD_NOT_CLOSABLE"
            - "next-day close: succeeds and persists a FINAL snapshot (empty cohort -> graduation_rate 0.0)"
            - "GET operator-contracts sub-resource for the center lists exactly 1 row, status PROBATION (FK reverse-reachability)"

      - name: invalid_request_shape_violations
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Shape layer rejects before any state or business rule: an unknown transition action enum and a missing required field both return ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["one applicant (for the enum case) — no application needed since shape fails first"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Shape Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
          trigger:
            - { call: "POST /jc/applicants", payload: { full_name: "No Dob", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { err_missing: $.data.error_id } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "fast_track" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { err_enum: $.data.error_id } }
          assert:
            - "missing date_of_birth on create: error_id == ERR_INVALID_REQUEST"
            - "unknown action fast_track: error_id == ERR_INVALID_REQUEST (enum membership is shape-level, priority 5)"

      - name: patch_program_immutable_field_rejected
        claim_type: immutability
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "PATCH /jc/trade-programs/{id} accepts only capacity and status; an attempt to rewrite center_id is rejected with ERR_INVALID_REQUEST and the program is unchanged."
        test_recipe:
          setup: ["two centers; one program under center A"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Imm A", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /jc/centers", payload: { name: "Imm B", region_code: "R-SOUTH", total_beds: 2 }, as: OperatorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "PATCH /jc/trade-programs/${p1}", payload: { center_id: "${cb}" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (undeclared PATCH field); program still belongs to center A"

