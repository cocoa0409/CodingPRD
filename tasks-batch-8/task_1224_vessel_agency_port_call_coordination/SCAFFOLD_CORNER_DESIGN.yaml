  instances:
  - name: error_invalid_state_trigger
    claim_type: error_triggerable
    grounds:
    - errors[ERR_INVALID_STATE]
    excluded_because:
      difficulty_instance: sailing_state_vs_funding_priority
      rationale: ERR_INVALID_STATE is the asserted outcome of the named §1.8 instance (and of several §1.9 invalid-transition instances).
  - name: error_funding_shortfall_trigger
    claim_type: error_triggerable
    grounds:
    - errors[ERR_FUNDING_SHORTFALL]
    excluded_because:
      difficulty_instance: funding_gate_exact_equality
      rationale: Asserted at 5465 vs 5466 in the named §1.8 instance.
  - name: error_overlap_triggers
    claim_type: error_triggerable
    grounds:
    - errors[ERR_BERTH_WINDOW_OVERLAP]
    - errors[ERR_RESOURCE_UNIT_OVERLAP]
    excluded_because:
      difficulty_instance: berth_half_open_overlap_rejected
      rationale: Both overlap errors asserted in the named §1.8 instance and service_order_buffer_inflated_overlap.
  - name: error_safety_trigger
    claim_type: error_triggerable
    grounds:
    - errors[ERR_OPEN_CRITICAL_HUSBANDRY]
    excluded_because:
      difficulty_instance: sailing_safety_vs_referential_priority
      rationale: Asserted as the winning error of the named §1.8 priority instance.
  - name: error_da_not_sent_trigger
    claim_type: error_triggerable
    grounds:
    - errors[ERR_DA_NOT_SENT]
    excluded_because:
      difficulty_instance: sailing_blocked_until_da_sent
      rationale: Asserted as the first-attempt error of the named §1.8 instance.
  - name: error_hm_ack_trigger
    claim_type: error_triggerable
    grounds:
    - errors[ERR_HM_ACK_OUTSTANDING]
    excluded_because:
      difficulty_instance: berth_occupy_requires_harbor_master_ack
      rationale: Asserted as the first-attempt error of the named §1.8 instance.
- section: rbac
  instances:
  - name: ops_cannot_create_principal_forbidden
    claim_type: rbac_deny
    grounds:
    - roles[AgencyAdmin]
    - roles[AgencyOps]
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: Principal registry is AgencyAdmin-exclusive; AgencyOps gets ERR_FORBIDDEN_ROLE (403).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE with http 403
  - name: vendor_rep_cannot_finalize_da
    claim_type: rbac_deny
    grounds:
    - roles[AgencyFinance]
    - roles[VendorRep]
    distinguishing_aspect: DA finalize is AgencyFinance-exclusive; VendorRep is rejected with ERR_FORBIDDEN_ROLE before any state check.
    test_recipe:
      setup:
      - DA PRO_FORMA
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
          pc_v: $.data.version
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v}
        as: AgencyOps
        as_user_id: ops-1
        captures:
          da_id: $.data.id
      - call: POST /vendors
        payload:
          name: ChandlerCo
          categories:
          - PROVISIONS
          contact_email: c@x.example
        as: AgencyAdmin
        captures:
          v_id: $.data.id
      trigger:
      - call: POST /disbursement-accounts/${da_id}/finalize
        as: VendorRep
        as_user_id: ${v_id}
        captures:
          err: $.data.error_id
      assert:
      - 'error_id == ERR_FORBIDDEN_ROLE with http 403 (role check precedes state check: DA is PRO_FORMA yet the error is not ERR_INVALID_STATE)'
  - name: finance_cannot_grant_visa_forbidden
    claim_type: rbac_deny
    grounds:
    - roles[PortAuthority]
    - roles[AgencyFinance]
    distinguishing_aspect: Visa grant is PortAuthority-exclusive.
    test_recipe:
      setup:
      - crew change in VISA_PENDING
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /crew-changes
        payload:
          port_call_id: ${pc_id}
          full_name: A. Ng
          nationality: IN
          passport_no: S1
          passport_expiry: '2027-01-01T00:00:00Z'
          direction: ON_SIGNER
          requires_visa: true
        as: CrewingAgent
        captures:
          cc_id: $.data.id
      - call: POST /crew-changes/${cc_id}/verify-docs
        as: CrewingAgent
      - call: POST /crew-changes/${cc_id}/request-visa
        as: CrewingAgent
      trigger:
      - call: POST /crew-changes/${cc_id}/grant-visa
        payload:
          visa_reference: V-1
        as: AgencyFinance
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE with http 403; status stays VISA_PENDING
  - name: pilot_confirm_by_vendor_rep_forbidden
    claim_type: rbac_conditional
    grounds:
    - errors[ERR_CONFIRM_ROLE_MISMATCH]
    - state_machines.ServiceOrder.ORDERED_to_CONFIRMED
    distinguishing_aspect: 'Conditional actor rule: the same confirm endpoint requires PortAuthority for PILOT but the owning VendorRep for TUG — both mismatches yield ERR_CONFIRM_ROLE_MISMATCH.'
    test_recipe:
      setup:
      - one PILOT order (no vendor) and one TUG order (vendor V), both ORDERED
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-04T08:00:00Z'
          etd: '2026-06-05T08:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /vendors
        payload:
          name: TugCo
          categories:
          - STORES
          contact_email: t@x.example
        as: AgencyAdmin
        captures:
          v_id: $.data.id
      - call: POST /service-orders
        payload:
          port_call_id: ${pc_id}
          kind: PILOT
          resource_unit: PILOT-BOAT-1
          window_start: '2026-06-04T10:00:00Z'
          window_end: '2026-06-04T11:00:00Z'
          estimated_cents: 8000
        as: AgencyOps
        captures:
          so_pilot: $.data.id
      - call: POST /service-orders
        payload:
          port_call_id: ${pc_id}
          kind: TUG
          vendor_id: ${v_id}
          resource_unit: TUG-3
          window_start: '2026-06-04T10:00:00Z'
          window_end: '2026-06-04T11:00:00Z'
          estimated_cents: 8000
        as: AgencyOps
        captures:
          so_tug: $.data.id
      trigger:
      - call: POST /service-orders/${so_pilot}/confirm
        as: VendorRep
        as_user_id: ${v_id}
        captures:
          err1: $.data.error_id
      - call: POST /service-orders/${so_tug}/confirm
        as: PortAuthority
        captures:
          err2: $.data.error_id
      assert:
      - 'PILOT confirmed by VendorRep: err1 == ERR_CONFIRM_ROLE_MISMATCH (403); stays ORDERED'
      - 'TUG confirmed by PortAuthority: err2 == ERR_CONFIRM_ROLE_MISMATCH (403); stays ORDERED'
  - name: principal_rep_cannot_advance_foreign_da
    claim_type: rbac_deny
    grounds:
    - roles[PrincipalRep]
    - errors[ERR_NOT_RESOURCE_OWNER]
    distinguishing_aspect: 'Entity-backed ownership: PrincipalRep of principal B cannot post an advance against a DA whose call belongs to principal A.'
    test_recipe:
      setup:
      - principal A with call + SENT DA; principal B exists
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex A
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          pa_id: $.data.id
      - call: POST /principals
        payload:
          name: Borealis B
          contact_email: b@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          pb_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${pa_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
          pc_v: $.data.version
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v}
        as: AgencyOps
        as_user_id: ops-1
        captures:
          da_id: $.data.id
      - call: POST /disbursement-accounts/${da_id}/send
        as: AgencyOps
      trigger:
      - call: POST /disbursement-accounts/${da_id}/advances
        payload:
          amount_cents: 1000
        as: PrincipalRep
        as_user_id: ${pb_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_RESOURCE_OWNER with http 403; no advance created
  - name: missing_auth_headers_unauthenticated
    claim_type: rbac_deny
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: Requests without X-User-Role/X-User-ID are rejected 401 before any role or resource check.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /port-calls
        as: Anonymous
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHENTICATED with http 401
- section: cross_cutting_layers
  instances:
  - name: occ_portcall_patch_stale_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[portcall-patch-stale]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: PATCH carries expected_port_call_version; a second patch replaying the pre-first-patch version fails 412 while the first succeeded and bumped version 1 -> 2.
    test_recipe:
      setup:
      - port call NOMINATED at version 1
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
          pc_v: $.data.version
      trigger:
      - call: PATCH /port-calls/${pc_id}
        payload:
          expected_port_call_version: ${pc_v}
          eta: '2026-06-01T12:00:00Z'
        as: AgencyOps
      - call: PATCH /port-calls/${pc_id}
        payload:
          expected_port_call_version: ${pc_v}
          etd: '2026-06-03T12:00:00Z'
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - 'first PATCH: 200, version == 2, eta == 2026-06-01T12:00:00Z'
      - 'second PATCH with the stale captured version: error_id == ERR_STALE_VERSION with http 412; etd unchanged'
  - name: occ_da_create_stale_and_supersede
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[da-create-stale-portcall]
    - state_machines.DisbursementAccount.PRO_FORMA_to_SUPERSEDED
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: DA create supersedes the prior PRO_FORMA account; replaying the pre-supersede PortCall version fails 412, while re-reading and posting the fresh version succeeds and flips DA1
      to SUPERSEDED.
    test_recipe:
      setup:
      - port call at version 1
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
          pc_v: $.data.version
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v}
        as: AgencyOps
        as_user_id: ops-1
        captures:
          da1: $.data.id
      trigger:
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v}
        as: AgencyOps
        as_user_id: ops-2
        captures:
          err: $.data.error_id
      - call: GET /port-calls/${pc_id}
        as: AgencyOps
        captures:
          pc_v2: $.data.version
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v2}
        as: AgencyOps
        as_user_id: ops-2
        captures:
          da2: $.data.id
      assert:
      - 'stale create: error_id == ERR_STALE_VERSION with http 412 (version advanced 1 -> 2 by the first create)'
      - 'fresh create: 201; DisbursementAccount.${da1}.status == SUPERSEDED; ${da2}.status == PRO_FORMA'
      - PortCall.${pc_id}.version == 3
  - name: clock_default_is_fixed_epoch
    claim_type: scheduled_actions
    grounds:
    - 'endpoints: POST /_clock/set_current_utc'
    distinguishing_aspect: 'Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z (never wall-clock): filing for a June ETA succeeds, and occupy of a June window fails ERR_WINDOW_NOT_STARTED
      — both deterministic regardless of the host date.'
    test_recipe:
      setup:
      - no clock call ever issued; call with eta 2026-06-10; four notifications submitted; window CONFIRMED starting 2026-06-10T18:00
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-10T20:00:00Z'
          etd: '2026-06-13T01:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: PORT_STATE_CONTROL
          payload_summary: p
        as: AgencyOps
        captures:
          n1: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: IMMIGRATION
          payload_summary: i
        as: AgencyOps
        captures:
          n2: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: CUSTOMS
          payload_summary: c
        as: AgencyOps
        captures:
          n3: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: HARBOR_MASTER
          payload_summary: h
        as: AgencyOps
        captures:
          n4: $.data.id
      - call: POST /authority-notifications/${n1}/submit
        as: AgencyOps
      - call: POST /authority-notifications/${n2}/submit
        as: AgencyOps
      - call: POST /authority-notifications/${n3}/submit
        as: AgencyOps
      - call: POST /authority-notifications/${n4}/submit
        as: AgencyOps
      - call: POST /berth-windows
        payload:
          port_call_id: ${pc_id}
          berth_code: B22
          start_at: '2026-06-10T18:00:00Z'
          end_at: '2026-06-14T06:00:00Z'
        as: AgencyOps
        captures:
          bw: $.data.id
      - call: POST /berth-windows/${bw}/confirm
        as: PortAuthority
      trigger:
      - call: POST /port-calls/${pc_id}/file-pre-arrival
        as: AgencyOps
      - call: POST /berth-windows/${bw}/occupy
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - file-pre-arrival succeeds under the default clock (2026-05-01 <= eta - 24h)
      - 'occupy fails: err == ERR_WINDOW_NOT_STARTED (422) — the default epoch precedes the June window even if the host wall clock is later'
  - name: cascading_side_effects_claim
    claim_type: cascading_side_effects
    grounds:
    - state_machines.PortCall.NOMINATED_to_CANCELLED
    excluded_because:
      difficulty_instance: port_call_cancel_depth3_cascade
      rationale: N-level cascade ordering and per-hop effects asserted in the named §1.8 instance.
  - name: dual_variant_calculation_claim
    claim_type: dual_variant_calculation
    grounds:
    - calculations.port_dues_calc
    - calculations.principal_exposure_calc
    excluded_because:
      difficulty_instance: da_estimate_vs_final_tariff_supersede
      rationale: Both dual-variant calculations asserted with literal deltas in the named §1.8 instance and principal_exposure_forward_vs_cash.
  - name: version_pinning_claim
    claim_type: version_pinning_on_approval
    grounds:
    - entities.DALine.fields.tariff_id
    - state_machines.Tariff
    excluded_because:
      difficulty_instance: da_estimate_vs_final_tariff_supersede
      rationale: Pinned estimate vs superseded tariff asserted in the named §1.8 instance.
- section: consistency_model
  instances:
  - name: immediate_visibility_after_cascade
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    excluded_because:
      difficulty_instance: po_create_cancel_estimate_invariant
      rationale: Post-mutation reads in the same test observe fully reconciled totals immediately after the cancel cascade (no lag), asserted in the named §1.8 instance.
