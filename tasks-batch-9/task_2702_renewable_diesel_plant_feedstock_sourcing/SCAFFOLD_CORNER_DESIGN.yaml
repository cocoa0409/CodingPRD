          - entities.Supplier.fields.is_high_risk_origin
        distinguishing_aspect: "Two valid document types clear the bar for an ordinary origin but not for is_high_risk_origin true, which needs three including a THIRD_PARTY_AUDIT: the first verification attempt is refused with 409 and the same call succeeds once the audit is filed."
        test_recipe:
          setup:
            - "One high-risk supplier holding ORIGIN_ATTESTATION and MASS_BALANCE_STATEMENT, both valid until 2027-12-31."
