        distinguishing_aspect: |
          id, created_at, updated_at and version are stamped by the server on
          every create: version is exactly 1 and created_at equals updated_at
          on a freshly created row, and the two rows created in one run carry
          different ids.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-15T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
          trigger:
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
