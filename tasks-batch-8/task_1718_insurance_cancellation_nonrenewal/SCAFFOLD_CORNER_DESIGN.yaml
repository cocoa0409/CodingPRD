# =============================================================================
# Task 1718 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over claim-extraction-guide sections. §1.8-covered corners are
# emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:

  # ==============================================================
  # Section: entities
  # ==============================================================
  - section: entities
    instances:
      - name: create_policy_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Policy.fields.total_premium_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /carrier/policies without total_premium_cents (required input) is rejected ERR_INVALID_REQUEST 400; no Policy row created."
        test_recipe:
          setup: ["ACTIVE AK profile and a policyholder exist"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "AK", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ak: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ak}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ak Insured", mailing_address: "1 Ak St", email: "ak@x.com" }
              as: Underwriter
              captures: { ph_ak: $.data.id }
          trigger:
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ak}", state_profile_id: "${prof_ak}", policy_number: "P-AK-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01" }
              as: Underwriter
              captures: { err_ak: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"
            - "GET /carrier/policies?policyholder_id=${ph_ak} returns empty list"

      - name: policy_default_fields_applied_on_creation
        claim_type: defaults
        grounds: [entities.Policy.fields.reinstatements_used, entities.Policy.fields.lapse_flag, entities.Policy.fields.status]
        distinguishing_aspect: "Newly issued Policy has status ACTIVE, reinstatements_used 0, lapse_flag false, cancellation_effective_date null, version 1."
        test_recipe:
          setup: ["ACTIVE HI profile and a policyholder exist"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "HI", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_hi: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_hi}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Hi Insured", mailing_address: "1 Hi St", email: "hi@x.com" }
              as: Underwriter
              captures: { ph_hi: $.data.id }
          trigger:
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_hi}", state_profile_id: "${prof_hi}", policy_number: "P-HI-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_hi: $.data.id, pol_hi_status: $.data.status, pol_hi_used: $.data.reinstatements_used, pol_hi_lapse: $.data.lapse_flag, pol_hi_eff: $.data.cancellation_effective_date, pol_hi_v: $.data.version }
          assert:
            - "captured status == ACTIVE, reinstatements_used == 0, lapse_flag == false, cancellation_effective_date == null, version == 1"

      - name: computed_fields_ignore_client_input_on_create
        claim_type: computed_fields
        grounds: [entities.CancellationCase.fields.earliest_effective_date, entities.CancellationCase.fields.return_method]
        distinguishing_aspect: "Client cannot inject computed values: POST /carrier/cancellation-cases with extra earliest_effective_date / return_method keys is rejected ERR_INVALID_REQUEST (payload not in input schema) or the values are ignored; the stored case carries server-computed values."
        test_recipe:
          setup: ["ACTIVE AL profile; ACTIVE AL policy"]
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "AL", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_al: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_al}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Al Insured", mailing_address: "1 Al St", email: "al@x.com" }
              as: Underwriter
              captures: { ph_al: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_al}", state_profile_id: "${prof_al}", policy_number: "P-AL-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_al: $.data.id, pol_al_v: $.data.version }
          trigger:
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_al}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_al_v}", earliest_effective_date: "2026-01-01", return_method: "SHORT_RATE" }
              as: Underwriter
              captures: { err_al: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400 (unknown payload keys rejected)"

      - name: ledger_entry_is_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.PremiumLedgerEntry]
        distinguishing_aspect: "PremiumLedgerEntry has common_fields: false (append-only): no PUT/PATCH/DELETE endpoint exists; GET by nonexistent id under ledger list returns empty; entity carries id + created_at only."
        test_recipe:
          setup: ["ACTIVE AR profile; ACTIVE AR policy"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "AR", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ar: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ar}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ar Insured", mailing_address: "1 Ar St", email: "ar@x.com" }
              as: Underwriter
              captures: { ph_ar: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ar}", state_profile_id: "${prof_ar}", policy_number: "P-AR-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_ar: $.data.id }
          trigger:
            - call: "GET /carrier/policies/${pol_ar}/ledger-entries"
              payload: {}
              as: ComplianceOfficer
              captures: { entries_ar: $.data }
          assert:
            - "Exactly one entry exists with entry_kind == WRITTEN and amount_cents == 30000"
            - "Entry exposes id and created_at but no version field"

      - name: get_nonexistent_policy_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /carrier/policies/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /carrier/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceOfficer
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: list_policies_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /carrier/policies with 12 policies and limit=10 returns 10 rows, total_count 12, has_more true; offset=10 returns 2 rows, has_more false."
        test_recipe:
          setup: ["ACTIVE CT profile; one policyholder; 12 policies created"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "CT", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ct: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ct}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ct Insured", mailing_address: "1 Ct St", email: "ct@x.com" }
              as: Underwriter
              captures: { ph_ct: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-01", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-02", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-03", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-04", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-05", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-06", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-07", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-08", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-09", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-10", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-11", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ct}", state_profile_id: "${prof_ct}", policy_number: "P-CT-12", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
          trigger:
            - call: "GET /carrier/policies?policyholder_id=${ph_ct}&limit=10&offset=0"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /carrier/policies?policyholder_id=${ph_ct}&limit=10&offset=10"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Page 1: response_type == array, len(data) == 10, total_count == 12, has_more == true"
            - "Page 2: len(data) == 2, total_count == 12, has_more == false"

      - name: invalid_enum_on_interest_type_rejected
        claim_type: type_constraints
        grounds: [entities.InsuredInterest.fields.interest_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /carrier/policies/{id}/interests with interest_type = FRIEND (not an enum member) is rejected ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["ACTIVE DE profile; ACTIVE DE policy"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "DE", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_de: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_de}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "De Insured", mailing_address: "1 De St", email: "de@x.com" }
              as: Underwriter
              captures: { ph_de: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_de}", state_profile_id: "${prof_de}", policy_number: "P-DE-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_de: $.data.id }
          trigger:
            - call: "POST /carrier/policies/${pol_de}/interests"
              payload: { interest_type: "FRIEND", institution_name: "Buddy", mailing_address: "1 F St" }
              as: Underwriter
              captures: { err_de: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"
            - "GET /carrier/policies/${pol_de}/interests returns empty list"

      - name: term_end_not_after_start_rejected
        claim_type: type_constraints
        grounds: [entities.Policy.fields.term_end_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /carrier/policies with term_end_date == term_start_date (not strictly after) is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["ACTIVE FL profile; policyholder"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "FL", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_fl: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_fl}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Fl Insured", mailing_address: "1 Fl St", email: "fl@x.com" }
              as: Underwriter
              captures: { ph_fl: $.data.id }
          trigger:
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_fl}", state_profile_id: "${prof_fl}", policy_number: "P-FL-1", term_start_date: "2026-06-01", term_end_date: "2026-06-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { err_fl: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: fk_reverse_reachability_interests_under_policy
        claim_type: parent_relationships
        grounds: [entities.InsuredInterest.fields.policy_id]
        distinguishing_aspect: "Creating an interest under policy A and listing GET /carrier/policies/{A}/interests returns it; listing under a different policy B returns empty — FK scoping is enforced."
        test_recipe:
          setup: ["ACTIVE MD profile; two ACTIVE MD policies A and B"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "MD", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_md: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_md}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Md Insured", mailing_address: "1 Md St", email: "md@x.com" }
              as: Underwriter
              captures: { ph_md: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_md}", state_profile_id: "${prof_md}", policy_number: "P-MD-A", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_mda: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_md}", state_profile_id: "${prof_md}", policy_number: "P-MD-B", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_mdb: $.data.id }
            - call: "POST /carrier/policies/${pol_mda}/interests"
              payload: { interest_type: "MORTGAGEE", institution_name: "Bank A", mailing_address: "9 Bank Rd" }
              as: Underwriter
              captures: { int_mda: $.data.id }
          trigger:
            - call: "GET /carrier/policies/${pol_mda}/interests"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_mdb}/interests"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Policy A interests list length == 1 and contains ${int_mda}"
            - "Policy B interests list length == 0"

  # ==============================================================
  # Section: state_machines
  # ==============================================================
  - section: state_machines
    instances:
      - name: policy_initial_state_active
        claim_type: initial_state
        grounds: [state_machines.Policy]
        distinguishing_aspect: "Newly issued Policy starts in ACTIVE."
        test_recipe:
          setup: ["ACTIVE IN profile; policyholder"]
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "IN", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_in: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_in}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "In Insured", mailing_address: "1 In St", email: "in@x.com" }
              as: Underwriter
              captures: { ph_in: $.data.id }
          trigger:
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_in}", state_profile_id: "${prof_in}", policy_number: "P-IN-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_in_status: $.data.status }
          assert:
            - "captured status == ACTIVE"

      - name: cancel_case_approve_from_draft_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CancellationCase.PENDING_APPROVAL_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second approve on an already-APPROVED case is rejected ERR_INVALID_STATE 409; case remains APPROVED."
        test_recipe:
          setup: ["ACTIVE KY profile; policy with APPROVED cancellation case"]
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "KY", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ky: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ky}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ky Insured", mailing_address: "1 Ky St", email: "ky@x.com" }
              as: Underwriter
              captures: { ph_ky: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ky}", state_profile_id: "${prof_ky}", policy_number: "P-KY-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_ky: $.data.id, pol_ky_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ky}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_ky_v}" }
              as: Underwriter
              captures: { case_ky: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_ky}/approve"
              payload: { scheduled_effective_date: "2026-08-20" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /carrier/cancellation-cases/${case_ky}/approve"
              payload: { scheduled_effective_date: "2026-08-21" }
              as: ComplianceOfficer
              captures: { err_ky: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "CancellationCase.${case_ky}.status == APPROVED and scheduled_effective_date == 2026-08-20 (unchanged)"

      - name: terminal_cancelled_policy_rejects_new_cancellation_case
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Policy, "errors[ERR_POLICY_NOT_ACTIVE]"]
        distinguishing_aspect: "Once a policy is CANCELLED (terminal), opening another CancellationCase is rejected ERR_POLICY_NOT_ACTIVE."
        test_recipe:
          setup: ["ACTIVE LA profile; policy cancelled EFFECTIVE 2026-08-20"]
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
