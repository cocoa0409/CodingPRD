      - name: courthouse_vri_capacity_uses_closed_intervals_and_frees_on_decline
        grounds:
          - calculations.vri_capacity_occupancy
          - validations[priority=29]
          - errors[ERR_VRI_CAPACITY_EXCEEDED]
          - entities.Courthouse.vri_concurrent_capacity
          - state_machines.Assignment.PROPOSED_to_DECLINED
        distinguishing_aspect: |
          The courthouse VRI cart is the occupied resource and it uses CLOSED
          intervals, the opposite convention from the interpreter check in the same
          request pipeline: a 10:00-11:00 VRI session collides with a 09:00-10:00
