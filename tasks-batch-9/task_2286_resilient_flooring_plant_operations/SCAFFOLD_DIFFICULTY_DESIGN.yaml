              payload: { run_code: "RUN-R2", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T07:00:00Z", planned_quantity_sqm: 12.00 }
              as: ProductionPlanner
