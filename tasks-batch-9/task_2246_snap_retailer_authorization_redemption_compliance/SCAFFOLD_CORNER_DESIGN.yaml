          assert:
            - "both responses are 404"
            - "${unknown_app_error_id} == ERR_APPLICATION_NOT_FOUND"
            - "${unknown_case_error_id} == ERR_SANCTION_CASE_NOT_FOUND"
            - "neither response is ERR_INVALID_STATE or ERR_INVALID_REQUEST"

      - name: every_write_and_read_returns_the_declared_envelope
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_fields
        distinguishing_aspect: "The envelope contract holds across all three response shapes in one pass: an object write carries response_type object, a list read carries response_type array plus the four pagination fields, and a 404 carries response_type error with data.error_id and data.message - every one of them with meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup:
            - "One owner and one store."
          setup_api_calls:
            - *k_owner
            - *k_store
          trigger:
            - call: "GET /stores?limit=1&offset=0"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "GET /stores/00000000-0000-4000-8000-0000000000c3"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { envelope_error_id: $.data.error_id, envelope_message: $.data.message }
          assert:
            - "the create returned 201 with response_type == object and data.id present"
            - "the list is 200 with response_type == array and data carrying limit == 1, offset == 0, total_count == 1, has_more == false"
            - "the 404 carries response_type == error, ${envelope_error_id} == ERR_STORE_NOT_FOUND and a non-empty ${envelope_message}"
            - "all three responses carry meta.api_request_id and meta.api_request_timestamp"

  - section: errors
    instances:
      - name: read_endpoints_return_their_own_not_found_code_for_every_entity
