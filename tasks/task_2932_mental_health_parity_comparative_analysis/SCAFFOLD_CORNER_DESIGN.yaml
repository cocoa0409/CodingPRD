          rationale: "The same-user-across-two-steps refusal (determiner then approver) is asserted there, together with the second officer succeeding."

  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_expected_parent_versions_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.determination-stale-plan-year
          - concurrency_rules.analysis-create-stale-nqtl-item
          - validations.priority_17_ERR_STALE_PLAN_YEAR_VERSION
        distinguishing_aspect: "Both declared OCC rules on one timeline: a version read before a validated data submission is stale for the analysis create, and a plan-year version read before the item's own writes is stale for the determination — each with its own 412 code, and each succeeding after a re-read."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY."
            - "The plan year's version is captured at creation (before the item and the submission move its derived fields) and the item's version at its own creation (before the submission recomputes its index)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id, py_v_old: $.data.version }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization imposed on MH/SUD outpatient visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v_old: $.data.version }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v_old}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v_new: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v_new}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Determination written from a stale reading of the plan year.", expected_plan_year_version: "${py_v_old}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v_new: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Determination rewritten after re-reading the plan year.", expected_plan_year_version: "${py_v_new}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          assert:
            - "the first analysis create -> 412 with data.error_id == ERR_STALE_NQTL_ITEM_VERSION (the validated submission had already moved the item)"
            - "${item_v_new} is greater than ${item_v_old} and the retry with it -> 201"
            - "the first determination -> 412 with data.error_id == ERR_STALE_PLAN_YEAR_VERSION"
            - "${py_v_new} is greater than ${py_v_old} and the retry with it -> 200 with NqtlItem.${item_id}.status == VIOLATION"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 10.00 and stringency_flag == true"
            - "PlanYear.${py_id}.open_violation_count == 1, status == REMEDIATION, compliance_posture == VIOLATION"
            - "GET /parity/comparative-analyses?nqtl_item_id=${item_id} returns total_count == 1 (the refused create stored nothing)"

      - name: version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.NqtlItem
          - entities.PlanYear
          - response_envelope.success
        distinguishing_aspect: "The version counter is the OCC currency: it advances on writes that touch the row only indirectly (a child data submission recomputing the index) and stays put across repeated reads."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NETWORK_ADMISSION NqtlItem, one vendor request."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "NETWORK_ADMISSION", applied_to: "BOTH", description: "Provider network admission standards for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, v_at_create: $.data.version }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
          trigger:
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
              captures: { v_read_1: $.data.version }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
              captures: { v_read_2: $.data.version }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
              captures: { v_after_submission: $.data.version }
          assert:
            - "${v_read_1} == ${v_at_create} and ${v_read_2} == ${v_at_create} — reads never advance the counter"
            - "${v_after_submission} is greater than ${v_at_create}: a submission on a sibling aggregate that recomputes the item's index is still a write to the item"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 0.55 (0.3 * 0.9235 * 10, no documentation credit yet) and stringency_flag == false"
            - "every response carries created_at and updated_at, and updated_at advances with the version"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 1 and fulfillment_status == FULFILLED"

      - name: four_level_cascade_from_one_determination
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / violation_determination_cascades_four_levels_to_plan_year_status"
          rationale: "The N-level chain end-to-end, including the level-4 proof via ERR_PLAN_YEAR_NOT_OPEN, is asserted there."

      - name: both_calculation_variants_and_the_delta_between_them
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / qtl_predominant_level_plan_payments_versus_claims_count_diverge"
          rationale: "Both variants over one data set, and the divergence they produce, are asserted there."

      - name: threshold_triggers_at_their_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: "boundary_precision_check / disparity_ratio_exactly_at_threshold_versus_one_ten_thousandth_below"
          rationale: "The as-applied rate threshold is asserted at exactly 2.0000 and one ten-thousandth below there; the stringency threshold at 5.0 is asserted by the determination instances."

  # ===========================================================================
  # 9. From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.denial_rate_disparity_index
          - calculations.nqtl_stringency_in_operation_index
        distinguishing_aspect: "Nothing lags: the submission's own 201 body already carries the validated status and the ratio, and the item's recomputed index is observable on the very next read with no second write and no retry."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY, one vendor request for 1 DENIAL_RATES item."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
