              payload: { disposition: "ORDER_WITHDRAWAL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Opening case1 moves ONLY the compliance axis: CertificationListing.${listing_id}.compliance_status == UNDER_INVESTIGATION while publication_status is still PUBLISHED and published_at is unchanged"
            - "ORDER_REMEDIATION moves ONLY the publication axis: publication_status == SUPPRESSED while compliance_status is still UNDER_INVESTIGATION; NoncomplianceCase.${case1_id}.remediation_deadline_at == \"2026-09-23T00:00:00Z\" (2026-09-03 + 20 days)"
            - "CONFIRM_REMEDIATION moves ONLY the compliance axis: compliance_status == REMEDIATED while publication_status stays SUPPRESSED"
            - "The re-publish succeeds (SUPPRESSED -> PUBLISHED is a real cycle): publication_status == PUBLISHED, compliance_status stays REMEDIATED, published_at == \"2026-09-03T00:00:00Z\""
            - "NoncomplianceCase.${case1_id}: state == REMEDIATED, assessment_subtotal_cents == 50000, surcharge_cents == 5000, penalty_total_cents == 55000"
            - "NoncomplianceCase.${case2_id}: state == WITHDRAWAL_ORDERED, assessment_subtotal_cents == 350000, surcharge_cents == 122500, penalty_total_cents == 472500"
            - "ORDER_WITHDRAWAL moves BOTH axes plus a third entity: publication_status == WITHDRAWN, compliance_status == NONCOMPLIANT, and CertificationSubmission.${sub_id}.dac_state == REVOKED"
            - "The final publish returns 409 ERR_INVALID_LISTING_STATE - WITHDRAWN is terminal on the publication axis and no compliance-axis value can reopen it"

  - rule_id: transitive_cascade
    instances:
      - name: ip_withdrawal_cascades_four_hops_into_an_auto_opened_case
        grounds:
          - state_machines.Member.TOOLS_GRANTED_to_IP_WITHDRAWN
          - state_machines.CertificationListing#publication_status.PUBLISHED_to_SUPPRESSED
          - state_machines.CertificationSubmission#dac_state.ISSUED_to_REVOKED
          - entities.NoncomplianceCase.fields.auto_opened
          - endpoints[POST /members/{member_id}/ip-commitment/withdraw]
        distinguishing_aspect: |
          DEPTH 4, triggered by Member TOOLS_GRANTED -> IP_WITHDRAWN. Each link is CAUSED BY the
          previous one, not by the request: hop 1 recomputes good_standing to false; hop 2 suppresses
          the listing BECAUSE the member lost good standing; hop 3 revokes the device attestation
          credential BECAUSE the listing was suppressed; hop 4 auto-opens a NoncomplianceCase BECAUSE
          the credential was revoked. The control submission left in DRAFT proves the chain is
          conditional rather than a fan-out: it has no listing, so hop 2 never reaches it, and neither
          hop 3 (its dac_state stays NOT_ISSUED) nor hop 4 (no case) fires for it.
        test_recipe:
          setup:
            - "The canonical certified chain with the CertificationListing PUBLISHED and CertificationSubmission.dac_state == ISSUED."
            - "A control CertificationSubmission left in DRAFT for the same member, with no listing and dac_state NOT_ISSUED."
            - "Logical clock at 2026-09-04T00:00:00Z at trigger time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
