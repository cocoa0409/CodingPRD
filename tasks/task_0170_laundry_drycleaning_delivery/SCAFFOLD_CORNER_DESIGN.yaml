# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Laundry & Dry-Cleaning Pickup/Delivery — breadth probe over §1.1-§1.7.
# Sections/claim_types drawn from references/claim-extraction-guide.md.
# Every active instance carries an executable setup_api_calls chain.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Order
          - endpoints
        distinguishing_aspect: "POST /orders with valid body returns 201 + id, created_at, version=1, status=CREATED, estimate_total_cents=0."
        test_recipe:
          setup:
            - "A customer in zone Z1 and a PICKUP + DELIVERY window in Z1 exist."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_c1@x.com", full_name: "E C1", default_address: "1 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Order.${order_id}.status == CREATED"
            - "Order.${order_id}.version == 1"
            - "Order.${order_id}.estimate_total_cents == 0"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Order
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{nonexistent} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no order with the queried id)."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_orders_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Order
          - response_envelope
        distinguishing_aspect: "GET /orders returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one customer + one order exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_c2@x.com", full_name: "E C2", default_address: "2 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array"
            - "meta has total_count and has_more present"

      - name: create_order_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Order
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /orders omitting required handoff_method returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A customer + pickup/delivery windows exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_c3@x.com", full_name: "E C3", default_address: "3 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: rush_default_false_applied
        claim_type: Defaults
        grounds:
          - entities.Order.fields.rush
        distinguishing_aspect: "Omitting rush on POST /orders applies default false."
        test_recipe:
          setup: ["A customer + windows exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_c4@x.com", full_name: "E C4", default_address: "4 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, rush: $.data.rush }
          assert:
            - "Order.${order_id}.rush == false"

      - name: customer_system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Customer.fields.risk_score
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "POST /customers ignores any client-supplied wallet_credit_cents/risk_score; both initialize to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "e_c5@x.com", full_name: "E C5", default_address: "5 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, w: $.data.wallet_credit_cents, r: $.data.risk_score }
          assert:
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.risk_score == 0"

      - name: garmentnote_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.GarmentNote
        distinguishing_aspect: "GarmentNote (common_fields:false) is append-only: it carries id + created_at only, no version field, and no update endpoint exists."
        test_recipe:
          setup: ["An order in IN_PROCESSING with a garment; a note logged."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "e_c6@x.com", full_name: "E C6", default_address: "6 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 2000 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/garments/${g1_id}/notes"
              payload: { note_kind: "STAIN", severity: 3, description: "spot" }
              as: PlantOperator
              captures: { note_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "GarmentNote response has id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_from_created_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.SCHEDULED_to_PICKED_UP
          - errors[ERR_INVALID_ORDER_STATE]
        distinguishing_aspect: "POST /orders/{id}/pickup on a CREATED (not SCHEDULED) order returns ERR_INVALID_ORDER_STATE (409)."
        test_recipe:
          setup: ["A CREATED order with one garment, not yet scheduled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_s1@x.com", full_name: "E S1", default_address: "7 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ORDER_STATE"
            - "HTTP status == 409"

      - name: cancel_delivered_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.OUT_FOR_DELIVERY_to_DELIVERED
          - errors[ERR_INVALID_ORDER_STATE]
        distinguishing_aspect: "Cancelling a DELIVERED (terminal) order is rejected with ERR_INVALID_ORDER_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A DOORSTEP order driven all the way to DELIVERED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "e_s2@x.com", full_name: "E S2", default_address: "8 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 2000 }
              as: PlantOperator
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/garments/${g1_id}/finish-clean"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/qc-hold"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/qc-pass"
              payload: {}
              as: PlantOperator
            - call: "POST /orders/${order_id}/dispatch-delivery"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/confirm-delivery"
              payload: {}
              as: DispatchAgent
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ORDER_STATE"
            - "HTTP status == 409"

      - name: order_initial_state_is_created
        claim_type: Initial State
        grounds:
          - state_machines.Order.initial_state
        distinguishing_aspect: "A freshly created order has status CREATED."
        test_recipe:
          setup: ["A customer + windows."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_s3@x.com", full_name: "E S3", default_address: "9 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, st: $.data.status }
          assert:
            - "Order.${order_id}.status == CREATED"

      - name: garment_intake_logged_cascades_to_cleaning
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.PICKED_UP_to_IN_PROCESSING
          - state_machines.Garment.INTAKE_LOGGED_to_CLEANING
        distinguishing_aspect: "start-processing (Order PICKED_UP->IN_PROCESSING) bubbles a CLEANING state onto every INTAKE_LOGGED garment."
        test_recipe:
          setup: ["A PICKED_UP order with one garment INTAKE_LOGGED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "e_s4@x.com", full_name: "E S4", default_address: "10 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/pickup"
              payload: {}
              as: DispatchAgent
            - call: "POST /orders/${order_id}/garments/${g1_id}/log-intake"
              payload: { actual_weight_grams: 2000 }
              as: PlantOperator
          trigger:
            - call: "POST /orders/${order_id}/start-processing"
              payload: {}
              as: PlantOperator
            - call: "GET /orders/${order_id}/garments/${g1_id}"
              payload: {}
              as: PlantOperator
              captures: { gst: $.data.status }
          assert:
            - "Garment.${g1_id}.status == CLEANING"

      - name: appeal_limit_reached_blocks_further_appeal
        claim_type: cyclic
        grounds:
          - state_machines.Claim.REJECTED_to_INVESTIGATING
          - errors[ERR_APPEAL_LIMIT_REACHED]
        distinguishing_aspect: "After MAX_APPEALS (2) appeals, a further appeal on a REJECTED claim returns ERR_APPEAL_LIMIT_REACHED (409); the cycle's termination condition is respected."
        test_recipe:
          setup:
            - "An ORDER claim rejected, appealed twice (appeal_count=2) and rejected again; MAX_APPEALS=2 reached."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_s5@x.com", full_name: "E S5", default_address: "11 B St", zone_code: "Z1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "PICKUP", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { pw_id: $.data.id }
            - call: "POST /route-windows"
              payload: { zone_code: "Z1", window_kind: "DELIVERY", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T11:00:00Z", stop_capacity: 5 }
              as: DispatchAgent
              captures: { dw_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", pickup_window_id: "${pw_id}", delivery_window_id: "${dw_id}", handoff_method: "DOORSTEP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/garments"
              payload: { service_type: "WASH_FOLD", declared_weight_grams: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov: $.data.version }
            - call: "POST /claims"
              payload: { order_id: "${order_id}", subject_kind: "ORDER", declared_value_cents: 5000, expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/investigate"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/reject"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/appeal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /claims/${claim_id}/reject"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/appeal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /claims/${claim_id}/reject"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/appeal"
              payload: {}
              as: Customer
