          declarations stowed in the same compartment: a FLAMMABLE consignment
          is accepted in H4, and the OXIDISER consignment beside it is then
          refused with ERR_DG_SEGREGATION_CONFLICT (409). The rejected
          declaration stays SUBMITTED, so the flight keeps one open hold and
          remains HELD_FOR_DG.
