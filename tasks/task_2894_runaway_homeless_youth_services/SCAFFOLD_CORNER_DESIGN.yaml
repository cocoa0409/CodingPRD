              captures: { sod_waive_err: $.data.error_id }
            - call: "POST /ryhs/guardian-notifications/${sod_gn_id}/resolve"
              payload: { outcome: "WAIVED", waiver_reason: "ABUSE_DISCLOSED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/reunification-cases/${sod_case_id}/decision"
              payload: { decision: "APPROVE" }
              as: ReunificationSpecialist
              as_user_id: "spec-7"
              captures: { sod_dec_err: $.data.error_id }
            - call: "POST /ryhs/reunification-cases/${sod_case_id}/decision"
              payload: { decision: "APPROVE" }
              as: ReunificationSpecialist
              as_user_id: "spec-8"
          assert:
            - "the disposition by worker-7 returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES and SafetyScreening.${sod_s1_id}.status stays SUBMITTED"
            - "the same disposition by admin-1 returns HTTP 200 and SafetyScreening.${sod_s1_id}.status == CLEARED"
            - "the WAIVED resolution by cm-7, the admitting user, returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES and GuardianNotification.${sod_gn_id}.status stays ATTEMPTED"
            - "the same WAIVED resolution by admin-1 returns HTTP 200 and GuardianNotification.${sod_gn_id}.status == WAIVED"
            - "the APPROVE decision by spec-7, the recording user, returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES and ReunificationCase.${sod_case_id}.status stays HOME_ASSESSMENT"
            - "the same decision by spec-8 returns HTTP 200 and ReunificationCase.${sod_case_id}.status == APPROVED"
            - "MediationSession.${sod_sess_id}.recorded_by_user_id == spec-7 and ReunificationCase.${sod_case_id}.decision_user_id == spec-8"

      - name: every_role_can_perform_its_own_exclusive_operations
