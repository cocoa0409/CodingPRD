            - "the report for ${c5} with min_score 0.8000 returns 0 rows and total_count 0 (its own code 93460 matches nothing, so every sibling scores 0.5000 or less)"
            - "Facility.${fac}.active_item_count == 6"
            - "Facility.${fac}.aggregate_gross_charge_cents == 1440000 and Facility.${fac}.aggregate_markup_ratio_bp == 24000"
            - "Facility.${fac}.stale_price_item_count == 0 and Facility.${fac}.chargemaster_posture == OPEN"
      - name: analysis_sign_off_only_while_computed_and_version_matched_and_never_twice
        claim_type: conditional_action
        grounds:
          - endpoints[POST /chargemaster/price-change-analyses/{analysis_id}/sign-off]
          - state_machines.PriceChangeImpactAnalysis
          - validations[priority=22]
          - validations[priority=13]
          - calculations.payer_impact_delta.variants[FORWARD_PROJECTED]
        distinguishing_aspect: "Sign-off is gated on TWO conjuncts that share one error id, and the system-driven COMPUTED -> STALE cascade fires on ANY mutation of the target item — so the second conjunct (analysed_charge_item_version != live version while still COMPUTED) is structurally masked: every mutation that desynchronises the version also flips the status. The instance proves the masking by repricing and by deactivating, shows a freshly recomputed analysis signs off, and shows the terminal SIGNED_OFF analysis is immune to the later cascade and rejects a second sign-off with ERR_INVALID_ANALYSIS_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT), revenue code 0300, department CC-100 (manager mgr_cath), COST_PLUS_MARKUP rule with the default tiers."
            - "Item CDM-1001 driven to ACTIVE at version 5 with cost 100000 and gross 240000."
            - "One ACTIVE contract AETNA/COMMERCIAL PERCENT_OF_CHARGE 6000 bp, trailing_units 100, term 2026-01-01 .. 2027-12-31 — created BEFORE any analysis, because contract creation stales COMPUTED analyses."
            - "Change request cr1 PRICE_CHANGE proposed_cost_basis_cents 200000 (projected gross 480000: tier 24000 bp, floor 60000, cap 990000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { v_active: $.data.version, gross0: $.data.gross_charge_cents }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 6000, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-12-31T00:00:00Z", trailing_units: 100 }
              as: ContractManager
              captures: { ct: $.data.id, ct_status: $.data.status }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Reagent cost increase confirmed by supply chain", proposed_cost_basis_cents: 200000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr: $.data.id, cr_proj: $.data.projected_gross_charge_cents, cr_ratio: $.data.projected_markup_ratio_bp }
            - call: "POST /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr}", variant: "FORWARD_PROJECTED" }
              as: ContractManager
              captures: { a1: $.data.id, a1_status: $.data.status, a1_ver: $.data.analysed_charge_item_version, a1_old: $.data.old_gross_charge_cents, a1_new: $.data.new_gross_charge_cents, a1_total: $.data.total_reimbursement_delta_cents }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { v_repriced: $.data.version, gross1: $.data.gross_charge_cents, prior1: $.data.prior_gross_charge_cents }
            - call: "GET /chargemaster/price-change-analyses/${a1}"
              payload: {}
              as: ComplianceOfficer
              captures: { a1_after: $.data.status, a1_ver_after: $.data.analysed_charge_item_version }
            - call: "POST /chargemaster/price-change-analyses/${a1}/sign-off"
              payload: { signoff_note: "Reviewed against contract exposure" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { e_stale: $.data.error_id }
            - call: "POST /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr}", variant: "FORWARD_PROJECTED" }
              as: RevenueIntegrityAnalyst
              captures: { a2: $.data.id, a2_ver: $.data.analysed_charge_item_version, a2_total: $.data.total_reimbursement_delta_cents }
            - call: "POST /chargemaster/price-change-analyses/${a2}/sign-off"
              payload: { signoff_note: "Exposure accepted" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { a2_status: $.data.status, a2_signer: $.data.signed_off_by_user_id, a2_version: $.data.version }
            - call: "POST /chargemaster/price-change-analyses/${a2}/sign-off"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { e_terminal: $.data.error_id }
            - call: "POST /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr}", variant: "FORWARD_PROJECTED" }
              as: ContractManager
              captures: { a3: $.data.id, a3_ver: $.data.analysed_charge_item_version }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "DEACTIVATE" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { life_after: $.data.lifecycle_status, v_deact: $.data.version }
            - call: "GET /chargemaster/price-change-analyses/${a3}"
              payload: {}
              as: ComplianceOfficer
              captures: { a3_status: $.data.status }
            - call: "POST /chargemaster/price-change-analyses/${a3}/sign-off"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr}", status: "STALE" }
              as: ComplianceOfficer
              captures: { stale_first: "$.data[0].id" }
          assert:
            - "${v_active} == 5 and ${gross0} == 240000 and ${ct_status} == ACTIVE"
            - "${cr_proj} == 480000 and ${cr_ratio} == 24000 (exclusive snapshot: the ACTIVE item is removed before the proposal is added)"
            - "${a1_status} == COMPUTED and ${a1_ver} == 5"
            - "${a1_old} == 240000 and ${a1_new} == 480000"
            - "${a1_total} == 15120000 (105 projected units at a per-unit delta of 144000, i.e. 288000 minus 144000)"
            - "${v_repriced} == 6 and ${gross1} == 240000 and ${prior1} == 240000 (an idempotent reprice still bumps the version)"
            - "${a1_after} == STALE while ${a1_ver_after} == 5 (the snapshot is never refreshed)"
            - "${e_stale} == ERR_ANALYSIS_SIGNOFF_STALE with HTTP 409 (status branch)"
            - "${a2_ver} == 6 and ${a2_total} == 15120000"
            - "${a2_status} == SIGNED_OFF and ${a2_signer} == co_1 and ${a2_version} == 2"
            - "${e_terminal} == ERR_INVALID_ANALYSIS_STATE with HTTP 409 (SIGNED_OFF is terminal; priority 13 fires before priority 22)"
            - "PriceChangeImpactAnalysis.${a2}.signed_off_by_user_id == co_1 (unchanged by the rejected second sign-off)"
            - "${a3_ver} == 6"
            - "${life_after} == INACTIVE and ${v_deact} == 7"
            - "${a3_status} == STALE — the item mutation that desynchronised the version ALSO flipped the status, which is why a COMPUTED-with-mismatched-version sign-off is unreachable"
            - "PriceChangeImpactAnalysis.${a2}.status == SIGNED_OFF (the cascade only touches COMPUTED rows)"
            - "${e_stale2} == ERR_ANALYSIS_SIGNOFF_STALE with HTTP 409"
            - "the STALE listing for ${cr} returns total_count 2 and both ${a1} and ${a3} appear in it (${stale_first} is one of them); ${a2} does not"
            - "Facility.${fac}.active_item_count == 0 and Facility.${fac}.aggregate_gross_charge_cents == 0"
            - "ChangeRequest.${cr}.status == SUBMITTED (analyses never move the request)"
      - name: reference_data_reads_retirement_and_clock_driven_contract_expiry
        claim_type: standard_crud
        grounds:
          - endpoints[GET /chargemaster/departments/{department_id}]
          - endpoints[GET /chargemaster/departments]
          - endpoints[GET /chargemaster/revenue-codes]
          - endpoints[GET /chargemaster/revenue-codes/{revenue_code_id}]
          - endpoints[POST /chargemaster/revenue-codes/{revenue_code_id}/retire]
          - endpoints[GET /chargemaster/price-rules]
          - endpoints[GET /chargemaster/price-rules/{price_rule_id}]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Sweeps the read side of the reference-data families in one pass: RevenueCode is the only immutable entity (no version field, status settable at creation), retire is a one-field write, PriceRule.applied_item_count is a computed reverse count, and the clock endpoint carries a real side effect — advancing logical now past a term_end_date expires the contract, and winding the clock BACK does not un-expire it because no EXPIRED -> ACTIVE transition exists."
