              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
