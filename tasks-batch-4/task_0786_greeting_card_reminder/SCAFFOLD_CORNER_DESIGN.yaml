            - call: "POST /gift-items"
              payload: { sku: "GVV5", title: "Choc", kind: "CHOCOLATE", price_cents: 800, weight_grams: 40 }
              as: PlatformAdmin
              captures: { gift_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z", gift_item_id: "${gift_id}", gift_quantity: 0 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GIFT_QUANTITY_INVALID"
            - "HTTP status == 422"

      - name: reminder_window_overlap_excluded
        claim_type: temporal_validation
        grounds:
          - validations[priority=13]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reminder_window_closed_buffer_overlap
          rationale: "Reminder-window overlap is asserted in that §1.8 instance."

