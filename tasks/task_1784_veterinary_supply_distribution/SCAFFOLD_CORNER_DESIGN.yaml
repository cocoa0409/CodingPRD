          product_name: Baytril 68mg
          manufacturer_code: ZOETIS
          product_type: RX_PHARMACEUTICAL
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-AX
          expiry_date: '2027-06-30'
          qty_on_hand: 10
        as: SupplyChainPlanner
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-01-01'
          valid_until: '2026-08-31'
          approved_ship_to_address: 59 Exp Exd
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          a_id: $.data.id
      - call: POST /vet/manufacturer-authorizations/${a_id}/approve
        as: ComplianceOfficer
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 59 Exp Exd
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      trigger:
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemAdmin
      - call: GET /vet/manufacturer-authorizations/${a_id}
        as: ComplianceOfficer
        captures:
          a_st: $.data.status
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
        captures:
          err: $.data.error_id
      assert:
      - 'after sweep: authorization status == EXPIRED (valid_until 2026-08-31 < 2026-09-01)'
      - approve -> error_id == ERR_RX_AUTHORIZATION_REQUIRED (EXPIRED no longer satisfies the Rx gate); order stays SUBMITTED
- section: rbac
