  - rule_id: non_linear_state_machine
    instances:
      - name: applicant_ineligible_redetermination_cycle
        grounds:
          - state_machines.Applicant.INELIGIBLE_to_SUBMITTED
          - state_machines.Applicant.SUBMITTED_to_INELIGIBLE
          - entities.Applicant.fields.redetermination_count
          - entities.Applicant.fields.eligibility_reason_code
          - validations[priority=60,ERR_REDETERMINATION_LIMIT]
          - errors.ERR_REDETERMINATION_LIMIT
        distinguishing_aspect: |
          INELIGIBLE is a re-enterable non-terminal state: the applicant loops
          INELIGIBLE -> SUBMITTED -> INELIGIBLE twice inside single requests, bumping version by TWO
          per redetermination call (2 -> 4 -> 6) and cycling eligibility_reason_code through three
          distinct codes, then the loop is closed by MAX_REDETERMINATIONS rather than by reaching a
          terminal state. The third call also proves the pinned reason-code order, because discharge
          and residency both fail and DISCHARGE_CHARACTER_DISQUALIFYING must win.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit."
            - "One Applicant in SUBMITTED with discharge_character HONORABLE, service_days 60 (below MIN_SERVICE_DAYS 90), state_residency_years 3, nursing_care_for_service_connected false, so only the service-days criterion fails."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Granite Falls State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Faye Lindqvist", date_of_birth: "1955-09-30", service_days: 60, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 0, nursing_care_for_service_connected: false, state_residency_years: 3, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: { review_note: "initial adjudication" }
              as: AdmissionsCoordinator
              captures: { v_after_d1: "$.data.version", reason_d1: "$.data.eligibility_reason_code" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: { amended_service_days: 200, amended_state_residency_years: 0, review_note: "corrected DD-214 service days" }
              as: AdmissionsCoordinator
              captures: { v_after_d2: "$.data.version", reason_d2: "$.data.eligibility_reason_code" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: { amended_discharge_character: "DISHONORABLE", review_note: "discharge upgrade denied" }
              as: AdmissionsCoordinator
              captures: { v_after_d3: "$.data.version", reason_d3: "$.data.eligibility_reason_code" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: { amended_state_residency_years: 5, review_note: "fourth attempt" }
              as: AdmissionsCoordinator
          assert:
            - "reason_d1 == SERVICE_DAYS_INSUFFICIENT"
            - "v_after_d1 == 2"
            - "reason_d2 == RESIDENCY_INSUFFICIENT"
            - "v_after_d2 == 4"
            - "reason_d3 == DISCHARGE_CHARACTER_DISQUALIFYING"
            - "v_after_d3 == 6"
            - "fourth call returns HTTP 409 with data.error_id == ERR_REDETERMINATION_LIMIT"
            - "Applicant.${app_id}.status == INELIGIBLE"
            - "Applicant.${app_id}.redetermination_count == 2"
            - "Applicant.${app_id}.service_days == 200"
            - "Applicant.${app_id}.state_residency_years == 0"
            - "Applicant.${app_id}.discharge_character == DISHONORABLE"
            - "Applicant.${app_id}.priority_class == null"
            - "Applicant.${app_id}.priority_score == 0"
            - "Applicant.${app_id}.version == 6"

      - name: resident_parallel_occupancy_and_billing_dimensions
        grounds:
          - state_machines.Resident.ADMITTED_to_HOSPITALIZED
          - state_machines.Resident.HOSPITALIZED_to_ADMITTED
          - state_machines.Resident.PROVISIONAL_COST_SHARE_to_FINAL_COST_SHARE
          - entities.Resident.fields.occupancy_status
          - entities.Resident.fields.billing_status
          - calculations.resident_cost_share_monthly
        distinguishing_aspect: |
          Resident carries two independent state dimensions. Advancing the billing dimension
          PROVISIONAL_COST_SHARE -> FINAL_COST_SHARE while the occupancy dimension sits in
          HOSPITALIZED must leave occupancy at HOSPITALIZED, and the later readmission must move
          occupancy back to ADMITTED without resetting billing to PROVISIONAL_COST_SHARE. The
          combined state (ADMITTED, FINAL_COST_SHARE) is only reachable if the dimensions are truly
          independent, and the determination's resident_day_count of 15 proves the billing math read
          census rows rather than the occupancy flag.
