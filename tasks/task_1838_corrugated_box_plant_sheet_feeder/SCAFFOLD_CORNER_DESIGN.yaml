            - { call: "POST /api/quality-claims/${clm_id}/start-review", payload: {}, as: ClaimsAdjuster, as_user_id: "adj-200" }
          trigger:
            - { call: "POST /api/quality-claims/${clm_id}/resolve", payload: { outcome: "CREDIT", defective_qty_verified: 400, actual_return_freight_dollars: 620.00 }, as: ClaimsAdjuster, as_user_id: "cs-100", captures: { err: $.data.error_id } }
            - { call: "POST /api/quality-claims/${clm_id}/resolve", payload: { outcome: "CREDIT", defective_qty_verified: 400, actual_return_freight_dollars: 620.00 }, as: ClaimsAdjuster, as_user_id: "adj-200", captures: { clm_st: $.data.status, clm_final: $.data.final_credit_dollars } }
          assert:
            - "filed_by_user_id == cs-100 (stamped from the filer's X-User-ID)"
            - "Self-adjudication fails: err == ERR_SOD_CLAIM_SELF_ADJUDICATION, HTTP 422; claim stays UNDER_REVIEW"
            - "Different adjudicator succeeds: RESOLVED_CREDIT with final_credit_dollars 704.64 and adjudicated_by_user_id adj-200"

      - name: run_outside_shift_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_OUTSIDE_SHIFT_WINDOW]
        distinguishing_aspect: "A run window must lie inside its shift window: [950,1000) on a [480,960) shift fails ERR_OUTSIDE_SHIFT_WINDOW (inclusive containment, end <= 960)."
        test_recipe:
          setup: ["Grade 32C; CORRUGATOR shift [480,960)"]
          setup_api_calls:
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 950, end_minute: 1000, web_width_in: 87.0 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 780, end_minute: 960, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_ok: $.data.id } }
          assert:
            - "[950,1000) fails: err == ERR_OUTSIDE_SHIFT_WINDOW, HTTP 422"
            - "[780,960) succeeds — end exactly at shift end is inside the inclusive window"

      - name: board_source_mismatch_both_directions
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_BOARD_SOURCE_MISMATCH]
        distinguishing_aspect: "board_source is enforced downstream in both directions: mark-sheets-received on an INTERNAL order fails, and attaching a SHEET_FEEDER order to a corrugator run fails, both ERR_BOARD_SOURCE_MISMATCH."
        test_recipe:
          setup: ["ORD-I (INTERNAL) ACCEPTED; ORD-S (SHEET_FEEDER) ACCEPTED; a SCHEDULED run on grade 32C"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_i: $.data.id, ord_i_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_i}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_i_v}" }, as: SalesRep, captures: { quo_i: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_i}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", sheet_supplier_name: "SheetCo", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_s: $.data.id, ord_s_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_s}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_s_v}" }, as: SalesRep, captures: { quo_s: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_s}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders/${ord_i}/mark-sheets-received", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_s}", outs: 1 }, as: ProductionPlanner, captures: { err2: $.data.error_id } }
          assert:
            - "INTERNAL order to mark-sheets-received: err == ERR_BOARD_SOURCE_MISMATCH, HTTP 422; order stays ACCEPTED"
            - "SHEET_FEEDER order attached to a run: err2 == ERR_BOARD_SOURCE_MISMATCH, HTTP 422; order stays ACCEPTED, run consumed stays 0"

      - name: quote_expired_accept_marks_expired
        claim_type: temporal_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_QUOTE_EXPIRED]
          - state_machines.PriceQuote.OPEN_to_EXPIRED
        distinguishing_aspect: "Expiry is judged against the logical clock (default 2026-08-01T00:00:00Z): an accept on 2026-08-01 for a quote expiring 2026-12-31 succeeds; after the clock is set to 2027-01-02, accepting a quote that expired 2026-12-31 fails ERR_QUOTE_EXPIRED and the quote is marked EXPIRED."
        test_recipe:
          setup: ["Customer Acme, grade 32C; ORD-1 with quote expiring 2026-12-31 accepted under the default clock; ORD-2 with quote expiring 2026-12-31 left OPEN"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_1: $.data.id, ord_1_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_1}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_1_v}" }, as: SalesRep, captures: { quo_1: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_1}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_2: $.data.id, ord_2_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_2}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_2_v}" }, as: SalesRep, captures: { quo_2: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/price-quotes/${quo_2}/accept", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "Under the default clock (2026-08-01T00:00:00Z) the first accept succeeded"
            - "After the clock advances past expires_on: err == ERR_QUOTE_EXPIRED, HTTP 409"
            - "Quote ${quo_2}.status == EXPIRED (via GET /api/box-orders/${ord_2}/quotes); order 2 stays QUOTED"

  # ---------------------------------------------------------------------------
  # From Table 5 (Endpoints)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: children_reverse_reachable_via_subresource_lists
        claim_type: standard_crud
        grounds:
          - endpoints
          - entities.PriceQuote.fields.order_id
          - entities.ReleaseOrder.fields.program_id
        distinguishing_aspect: "FK reverse-reachability: the created quote appears in GET /api/box-orders/{id}/quotes and the created release in GET /api/inventory-programs/{id}/release-orders, each as a 1-element array."
        test_recipe:
          setup: ["Customer Acme, grade 32C; order with one quote; program (stocked 100) with one release"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 100 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 10, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
          trigger:
            - { call: "GET /api/box-orders/${ord_id}/quotes", as: SalesRep, captures: { quo_list_0: "$.data[0].id" } }
            - { call: "GET /api/inventory-programs/${prog_id}/release-orders", as: SalesRep, captures: { rel_list_0: "$.data[0].id" } }
          assert:
            - "GET /api/box-orders/${ord_id}/quotes returns total_count 1 and data[0].id == ${quo_id}"
            - "GET /api/inventory-programs/${prog_id}/release-orders returns total_count 1 and data[0].id == ${rel_id}"

