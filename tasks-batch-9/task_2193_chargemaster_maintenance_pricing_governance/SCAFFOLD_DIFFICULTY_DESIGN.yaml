- rule_id: priority_pair_validation_conflict
  instances:
  - name: priority_pair_validation_conflict__state_facility_frozen_beats_constraint_price_frozen_and_fiscal_no_rule
    grounds:
    - validations[priority=14]
    - validations[priority=50]
    - validations[priority=53]
    - state_machines.TransparencyFile.BUILDING_to_VALIDATED
    - state_machines.TransparencyFile.VALIDATED_to_FAILED
    - state_machines.ChargeItem.PRICED_CURRENT_to_PRICE_FROZEN
    - calculations.transparency_file_build
    - calculations.price_rule_selector
    - concurrency_rules[transparency-build-stale-facility]
    distinguishing_aspect: 'A single POST /chargemaster/charge-items/{id}/reprice simultaneously violates the

      `state` row at priority 14 (Facility.chargemaster_posture == FROZEN), the

      `business_constraint` row at priority 50 (ChargeItem.price_status == PRICE_FROZEN) and

      the `business_fiscal` row at priority 53 (empty price_rule_selector candidate set), and

      the response MUST carry ERR_FACILITY_FROZEN — the `state` category at priority 14 —

      never ERR_ITEM_PRICE_FROZEN (business_constraint) and never

      ERR_NO_APPLICABLE_PRICE_RULE (business_fiscal).

      '
    test_recipe:
      setup:
      - Logical clock starts at 2026-08-01T00:00:00Z.
      - Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000, one department, one ACTIVE revenue code 0300.
      - One ACTIVE PriceRule PR1 on (facility, 0300) over the half-open interval [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z).
      - One ACTIVE PayerContract over closed [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z] so transparency_file_build finds payer_column_count == 1.
      - One ChargeItem repriced to gross_charge_cents 240000 and driven DRAFT -> PENDING_REVIEW -> APPROVED -> ACTIVE.
      - One TransparencyFile driven BUILDING -> VALIDATED, which freezes the item (price_status PRICE_FROZEN) and forces Facility.chargemaster_posture = FROZEN.
      - Clock then advanced to 2026-09-15T00:00:00Z, past PR1.effective_to, so the price-rule candidate set is also empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-FROZEN
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory - general
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          rc_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Clinical Laboratory
          cost_center_code: CC-0300
          manager_user_id: dept_mgr_1
          allowed_revenue_code_values: []
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 50000
          effective_from: '2026-08-01T00:00:00Z'
          effective_to: '2026-09-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr1_id: $.data.id
      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: BCBS_STATE
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          percent_of_charge_bp: 4500
          term_start_date: '2026-08-01T00:00:00Z'
          term_end_date: '2027-08-01T00:00:00Z'
          trailing_units: 10
          renegotiation_notice_days: 30
        as: ContractManager
        as_user_id: contract_mgr_1
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-5001
          description: Comprehensive metabolic panel
          code_type: CDM_INTERNAL
          cost_basis_cents: 100000
          medicare_rate_cents: 10000
          market_p75_cents: 5000000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          item_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
          note: ready for committee
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: APPROVE
          note: priced within limit
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: ACTIVATE
          note: go live
