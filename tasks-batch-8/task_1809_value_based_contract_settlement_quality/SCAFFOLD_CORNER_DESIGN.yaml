scaffold_corner_design:
- section: entities
  instances:
  - name: program_create_applies_system_defaults
    claim_type: creation
    grounds:
    - entities.Program.fields.program_status
    distinguishing_aspect: New program starts DRAFT with version 1 and server-minted id; client cannot set program_status.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /vbc/programs
        payload:
          program_name: MA Value
          line_of_business: MEDICARE_ADVANTAGE
        as: PayerAdmin
        captures:
          pg: $.data.id
          st: $.data.program_status
          v: $.data.version
      assert:
      - program_status == DRAFT (default applied)
      - version == 1 and id is a server-minted UUID
      - created_at/updated_at present in ISO8601 UTC with millisecond precision
  - name: contract_create_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.Contract.fields.benchmark_pmpm_cents
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required benchmark_pmpm_cents fails with ERR_INVALID_REQUEST (400); the entity is not created.
    test_recipe:
      setup:
      - Program ACTIVE and group G1 exist
      setup_api_calls:
      - call: POST /vbc/programs
        payload:
          program_name: MA Value
          line_of_business: MEDICARE_ADVANTAGE
        as: PayerAdmin
        captures:
          pg: $.data.id
      - call: POST /vbc/programs/${pg}/activate
        payload: {}
        as: PayerAdmin
      - call: POST /vbc/practice-groups
        payload:
          group_name: G1
          tin: '100000001'
        as: PayerAdmin
        captures:
          g1: $.data.id
      trigger:
      - call: POST /vbc/contracts
        payload:
          program_id: ${pg}
          practice_group_id: ${g1}
          contract_ref: C-1
          effective_start: '2026-01-01'
          effective_end: '2027-01-01'
          risk_track: ONE_SIDED_UPSIDE
          risk_model: PROSPECTIVE
          shared_savings_rate_bp: 5000
          min_savings_rate_bp: 200
          savings_cap_bp: 1000
          stop_loss_cents: 2000000
          withhold_rate_bp: 500
          quality_gate_floor_points: 30
          quality_gate_excellence_points: 80
          estimate_method: ANNUALIZATION
          quality_measures:
          - measure_code: HBA1C
            weight_bp: 10000
            decile_thresholds_bp:
            - 1000
            - 2000
            - 3000
            - 4000
            - 5000
            - 6000
            - 7000
            - 8000
            - 9000
        as: ContractManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (http 400) — benchmark_pmpm_cents missing
  - name: member_duplicate_ref_rejected
    claim_type: type_constraints
    grounds:
    - entities.Member.fields.member_ref
    - errors[ERR_DUPLICATE_MEMBER_REF]
    distinguishing_aspect: member_ref is unique per program; second create with the same ref in the same program fails 409; same ref in a DIFFERENT program is allowed.
    test_recipe:
      setup:
      - Programs P1 and P2 ACTIVE
      setup_api_calls:
      - call: POST /vbc/programs
        payload:
          program_name: P1
          line_of_business: MEDICARE_ADVANTAGE
        as: PayerAdmin
        captures:
          p1: $.data.id
      - call: POST /vbc/programs
        payload:
          program_name: P2
          line_of_business: MEDICAID_MANAGED_CARE
        as: PayerAdmin
        captures:
          p2: $.data.id
      - call: POST /vbc/members
        payload:
          program_id: ${p1}
          member_ref: M-001
          birth_year: 1980
        as: PayerAdmin
        captures:
          m1: $.data.id
      trigger:
      - call: POST /vbc/members
        payload:
          program_id: ${p1}
          member_ref: M-001
          birth_year: 1981
        as: PayerAdmin
        captures:
          err: $.data.error_id
      - call: POST /vbc/members
        payload:
          program_id: ${p2}
          member_ref: M-001
          birth_year: 1981
        as: PayerAdmin
        captures:
          m2: $.data.id
      assert:
      - Same program + same member_ref -> ERR_DUPLICATE_MEMBER_REF (409)
      - Different program + same member_ref -> 201 created
  - name: claim_get_nonexistent_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND (not 400, not empty).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /vbc/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: ClaimsProcessor
        captures:
          err: $.data.error_id
      assert:
      - http 404 and error_id == ERR_NOT_FOUND
