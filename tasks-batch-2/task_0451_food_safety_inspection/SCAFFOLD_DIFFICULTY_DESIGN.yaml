# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_inspection_as_observed_vs_final_score_diverge
        grounds:
          - calculations.inspection_scoring
          - entities.Inspection.fields.as_observed_score
          - entities.Inspection.fields.final_score
          - state_machines.Inspection.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: >
          On the Inspection domain, as_observed_score ignores on-site corrections while
          final_score halves (ceil) corrected violations: two corrected violations
          (base 12 CRITICAL + base 9 NON_CRITICAL) yield as_observed_score 79 but
          final_score 89 — the two variants differ by 10 points on the same row.
        test_recipe:
          setup:
            - "One CRITICAL code base_demerit_points=12 and one NON_CRITICAL code base_demerit_points=9 exist."
            - "Inspector i1 registered; establishment e1 PERMITTED; ROUTINE inspection in IN_PROGRESS with both violations recorded corrected_on_site=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 10 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.16", title: "Cold holding", classification: "CRITICAL", base_demerit_points: 12 }
              as: HealthDirector
              captures: { code_crit: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "6-301.11", title: "Handwash signage", classification: "NON_CRITICAL", base_demerit_points: 9 }
              as: HealthDirector
              captures: { code_nc: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 10 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_crit}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_nc}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { obs: $.data.as_observed_score, fin: $.data.final_score }
          assert:
            - "Inspection.${insp1}.as_observed_score == 79"
            - "Inspection.${insp1}.final_score == 89"
            - "Inspection.${insp1}.as_observed_score != Inspection.${insp1}.final_score"

      - name: dv_enforcement_penalty_reduced_vs_settle_full
        grounds:
          - calculations.penalty_assessment
          - entities.EnforcementCase.fields.assessed_penalty_cents
          - state_machines.EnforcementCase.HEARING_SCHEDULED_to_HEARD
          - state_machines.EnforcementCase.OPENED_to_CLOSED
        distinguishing_aspect: >
          On the EnforcementCase domain (a different entity than Inspection), the ruled
          variant REDUCED assesses floor(alleged*0.5)=25000 on alleged_penalty_cents=50000
          while the settle variant assesses the full 50000 — same alleged input, two assessment paths.
        test_recipe:
          setup:
            - "Establishment e1 PERMITTED."
            - "Two enforcement cases opened against e1 each with alleged_penalty_cents=50000; one ruled REDUCED after hearing, the other settled directly."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 20 }
              as: HealthDirector
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 50000 }
              as: EnforcementOfficer
              captures: { case_ruled: $.data.id }
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 50000 }
              as: EnforcementOfficer
              captures: { case_settled: $.data.id }
            - call: "POST /enforcement-cases/${case_ruled}/schedule-hearing"
              payload: { hearing_index: 25 }
              as: EnforcementOfficer
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 25 }
              as: HealthDirector
          trigger:
            - call: "POST /enforcement-cases/${case_ruled}/rule"
              payload: { ruling: "REDUCED" }
              as: HealthDirector
              captures: { ruled_amt: $.data.assessed_penalty_cents }
            - call: "POST /enforcement-cases/${case_settled}/settle"
              payload: {}
              as: EnforcementOfficer
              captures: { settled_amt: $.data.assessed_penalty_cents }
          assert:
            - "EnforcementCase.${case_ruled}.assessed_penalty_cents == 25000"
            - "EnforcementCase.${case_settled}.assessed_penalty_cents == 50000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combo_grade_worst_of_band_and_critical_cap
        grounds:
          - calculations.grade_assignment
          - entities.Inspection.fields.grade
          - entities.Inspection.fields.critical_count
          - state_machines.Inspection.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: >
          Mode (a): grade = worst_of(score_band, critical-count cap) with a CLOSED override —
          a >=3-input non-linear combination. final_score 95 alone yields band A, but a single
          CRITICAL violation caps the letter at B, so grade resolves to B (not A) — the cap
          dominates the score band.
        test_recipe:
          setup:
            - "One CRITICAL code base_demerit_points=5 exists; inspector i1; establishment e1 PERMITTED."
            - "ROUTINE inspection IN_PROGRESS with a single CRITICAL violation, not corrected."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 10 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.16", title: "Cold holding", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { code_crit: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 10 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_crit}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { g: $.data.grade, fs: $.data.final_score, cc: $.data.critical_count }
          assert:
            - "Inspection.${insp1}.final_score == 95"
            - "Inspection.${insp1}.critical_count == 1"
            - "Inspection.${insp1}.grade == B"
            - "Inspection.${insp1}.placard_color == YELLOW"

      - name: combo_scoring_per_line_ceil_then_sum_rounding_order
        grounds:
          - calculations.inspection_scoring
          - entities.Inspection.fields.final_score
          - entities.Violation.fields.demerit_points_final
        distinguishing_aspect: >
          Mode (b): the pinned rounding order is halve-then-ceil PER violation, THEN sum.
          Two corrected NON_CRITICAL violations of base 9 each give ceil(9/2)=5 twice,
          summing to 10, so final_score=90 (grade A). The forbidden sum-then-halve order
          ceil(18/2)=9 would give final_score=91 — the scaffold pins 90.
        test_recipe:
          setup:
            - "Two NON_CRITICAL codes each base_demerit_points=9 exist; inspector i1; establishment e1 PERMITTED."
            - "ROUTINE inspection IN_PROGRESS with one violation per code, both corrected_on_site=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 10 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "6-301.11", title: "Handwash signage", classification: "NON_CRITICAL", base_demerit_points: 9 }
              as: HealthDirector
              captures: { code_a: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "6-501.12", title: "Cleaning", classification: "NON_CRITICAL", base_demerit_points: 9 }
              as: HealthDirector
              captures: { code_b: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 10 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_a}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { vfin_a: $.data.demerit_points_final }
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_b}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { fs: $.data.final_score }
          assert:
            - "Violation.demerit_points_final == 5  # ceil(9/2) per violation, not 4 or 9"
            - "Inspection.${insp1}.final_score == 90"
            - "Inspection.${insp1}.grade == A"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nls_inspection_complete_amend_complete_cycle
        grounds:
          - state_machines.Inspection.COMPLETED_to_AMENDING
          - state_machines.Inspection.AMENDING_to_COMPLETED
          - entities.Inspection.fields.status
        distinguishing_aspect: >
          The Inspection machine is cyclic: COMPLETED -> AMENDING (reopen) -> COMPLETED
          (re-complete) returns to the same state, and re-completion recomputes final_score
          from the now-edited violation set (89 -> 95 after removing the 9-pt violation).
        test_recipe:
          setup:
            - "Inspector i1; establishment e1 PERMITTED."
            - "ROUTINE inspection COMPLETED with two corrected violations (CRIT base 12 + NC base 9), final_score 89."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 10 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.16", title: "Cold holding", classification: "CRITICAL", base_demerit_points: 12 }
              as: HealthDirector
              captures: { code_crit: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "6-301.11", title: "Signage", classification: "NON_CRITICAL", base_demerit_points: 9 }
              as: HealthDirector
              captures: { code_nc: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 10 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_crit}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${code_nc}", corrected_on_site: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { v_nc: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /inspections/${insp1}/reopen"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { st_amend: $.data.status }
            - call: "DELETE /violations/${v_nc}"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { st_done: $.data.status, fs2: $.data.final_score }
          assert:
            - "Inspection.${insp1}.status == COMPLETED  # returned to COMPLETED after the cycle"
            - "Inspection.${insp1}.final_score == 94  # recomputed: only CRIT-12 corrected remains -> 100-ceil(12/2)=94"
            - "Inspection.${insp1}.critical_count == 1"
            - "Inspection.${insp1}.grade == B  # band A(94) capped at B by 1 critical"

      - name: nls_enforcement_branch_hearing_vs_settle
        grounds:
          - state_machines.EnforcementCase.OPENED_to_HEARING_SCHEDULED
          - state_machines.EnforcementCase.OPENED_to_CLOSED
          - state_machines.EnforcementCase.HEARING_SCHEDULED_to_HEARD
          - entities.EnforcementCase.fields.status
        distinguishing_aspect: >
          On a different entity (EnforcementCase), OPENED branches to two divergent paths:
          the settle branch jumps OPENED->CLOSED setting assessed_penalty_cents=alleged in one
          step, while the hearing branch goes OPENED->HEARING_SCHEDULED->HEARD with a ruling-driven
          assessment — fork with divergent side-effect sets.
        test_recipe:
          setup:
            - "Establishment e1 PERMITTED; two OPENED cases each alleged_penalty_cents=40000."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 30 }
              as: HealthDirector
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 40000 }
              as: EnforcementOfficer
              captures: { c_settle: $.data.id }
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 40000 }
              as: EnforcementOfficer
              captures: { c_hear: $.data.id }
          trigger:
            - call: "POST /enforcement-cases/${c_settle}/settle"
              payload: {}
              as: EnforcementOfficer
              captures: { s_settle: $.data.status }
            - call: "POST /enforcement-cases/${c_hear}/schedule-hearing"
              payload: { hearing_index: 35 }
              as: EnforcementOfficer
              captures: { s_hear: $.data.status }
          assert:
            - "EnforcementCase.${c_settle}.status == CLOSED"
            - "EnforcementCase.${c_settle}.assessed_penalty_cents == 40000"
            - "EnforcementCase.${c_hear}.status == HEARING_SCHEDULED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_finalize_closed_grade_creates_closure_suspends_establishment
        grounds:
          - state_machines.Inspection.COMPLETED_to_FINALIZED
          - state_machines.Establishment.PERMITTED_to_SUSPENDED
          - calculations.grade_assignment
          - calculations.closure_trigger
          - entities.ClosureOrder.fields.reason_code
          - entities.Establishment.fields.status
        distinguishing_aspect: >
          Depth-3 cascade from the Inspection finalize trigger: finalizing computes grade=CLOSED
          (link A on Inspection) -> that CLOSED grade creates a ClosureOrder reason CRITICAL_THRESHOLD
          (link B on ClosureOrder) -> the new ACTIVE ClosureOrder suspends the establishment to
          SUSPENDED (link C on Establishment). Each link is caused by the prior, not the original action.
        test_recipe:
          setup:
            - "Three CRITICAL codes base 5 exist; inspector i1; establishment e1 PERMITTED."
            - "ROUTINE inspection COMPLETED with three uncorrected CRITICAL violations -> final_score 85, critical_count 3, grade CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 40 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.16", title: "Cold holding", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { c1: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.17", title: "Date marking", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { c2: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "3-302.11", title: "Cross contamination", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { c3: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 40 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c1}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c2}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c3}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /inspections/${insp1}/finalize"
              payload: { expected_inspection_version: "${v_pre}" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { g: $.data.grade }
          assert:
            - "Inspection.${insp1}.grade == CLOSED"
            - "Establishment.${e1}.status == SUSPENDED"
            - "Establishment.${e1}.current_grade == CLOSED"
            - "ClosureOrder.establishment_id==${e1}.reason_code == CRITICAL_THRESHOLD  # one ACTIVE closure created"
            - "Establishment.${e1}.active_closure_order_id != null"

      - name: tc_reinspection_pass_resolves_violations_lifts_closure_reinstates
        grounds:
          - state_machines.Inspection.COMPLETED_to_FINALIZED
          - state_machines.Establishment.SUSPENDED_to_PERMITTED
          - entities.Violation.fields.resolution_status
          - entities.ClosureOrder.fields.status
          - entities.Establishment.fields.open_critical_count
        distinguishing_aspect: >
