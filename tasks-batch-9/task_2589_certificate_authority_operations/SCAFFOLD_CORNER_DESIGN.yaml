          - state_machines.KeyCeremony.transitions.ATTESTED_to_ATTESTATION_REVOKED
        excluded_because:
          difficulty_instance: attestation_repudiation_four_hop_cascade
          rationale: "The §1.8 transitive_cascade instance already walks all four hops of the deepest chain in the scaffold (ceremony attestation lost -> partition quarantined -> every certificate of the partition pending revocation -> subscriber suspended) and asserts each hop's fields, including the ordering by Certificate.created_at."

      - name: the_revocation_execution_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Certificate.revocation_status.transitions.REVOCATION_PENDING_to_REVOKED
        excluded_because:
          difficulty_instance: revocation_execution_three_hop_posture_cascade
          rationale: "The §1.8 transitive_cascade instance already verifies the three-hop execution chain (certificate revoked -> profile pending CRL queue and posture -> queued requests blocked) with ordering sensitivity, which is the second cascading-side-effects claim for this layer."

