      - name: certification_of_results_on_a_decert_petition_ends_the_bargaining_duty
        claim_type: Variant Divergence
        grounds:
          - calculations.certification_timeline
          - entities.Petition.fields.election_bar_end_at
          - entities.Petition.fields.bargaining_obligation_end_at
          - constants.ELECTION_BAR_DAYS
          - entities.Petition.fields.petition_type
        distinguishing_aspect: |
          Same arc, opposite variant: resolving all three challenges AGAINST gives 42/42/1, so
          valid_votes_cast 84 lifts majority_threshold to 43 and 42 < 43 selects RESULTS. On an RD petition
          that must write election_bar_end_at = certified_at + 365 days AND
