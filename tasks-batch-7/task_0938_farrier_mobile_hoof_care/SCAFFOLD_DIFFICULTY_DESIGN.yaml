          assert:
            - "Appointment.${ap1}.estimated_total_cents == 37200"
            - "Appointment.${ap1}.rate_card_id == ${rc2}"
            - "GET /invoices?appointment_id=${ap1} returns exactly 1 row"
            - "that Invoice.labor_subtotal_cents == 28000"
            - "that Invoice.product_subtotal_cents == 11200"
            - "that Invoice.tax_cents == 812"
            - "that Invoice.total_cents == 40012"

  # =========================================================================
  # Rule 2 — combinatorial formulas in DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: labor_subtotal_rounds_the_sedation_surcharge_per_line_then_sums
        grounds:
          - calculations.service_line_labor_amount
          - calculations.invoice_labor_subtotal
          - calculations.appointment_service_minutes
          - entities.Invoice.fields.labor_subtotal_cents
          - entities.Horse.fields.requires_sedation
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents. Four NEW_SHOES lines at
          6524 each on a sedated horse give 4 * round_half_up(6524 * 0.125) = 4 * 816 = 3264
          of surcharge and a labor subtotal of 29360, whereas rounding one combined surcharge
          round_half_up(26096 * 0.125) = 3262 gives 29358. The scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Rate card with price_new_shoes_cents 6524 effective 2026-01-01."
            - "A sedated horse (requires_sedation true) whose appointment carries vet_present true and four NEW_SHOES lines."
            - "Route on 2026-05-06 at a zone A barn, dispatched and arrived; the visit is then completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}", tax_exempt: false }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Nervy", routine_cycle_weeks: 6, shoe_size_code: "1", requires_sedation: true }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id", rf: "$.data[1].id", lh: "$.data[2].id", rh: "$.data[3].id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
            - call: "GET /inventory-buckets"
              payload: { farrier_id: "${fr1}", sku_id: "${sku1}", location_kind: "VAN" }
              as: PlatformAdmin
              captures: { van1: "$.data[0].id" }
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: 10 }
              as: PlatformAdmin
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6524, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06", vet_present: true }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${lh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { sl_lf: "$.data[0].id", sl_rf: "$.data[1].id", sl_lh: "$.data[2].id", sl_rh: "$.data[3].id" }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt1}/plan"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
