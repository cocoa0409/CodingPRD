          setup:
            - "One OPEN PracticeGroup with guarantee_budget_total_usd 5000000.00 and onboarding_capacity 1."
            - "Candidate 1 'Dana Whitfield' HIRED on an ACCEPTED offer of 400000.00 + 40000.00, with an ACTIVE IntegrationPlan over [2026-10-01, 2027-06-30], so active_onboarding_count == 1."
            - "Candidate 2 'Priya Raghavan' HIRED on her own ACCEPTED offer of 400000.00 + 40000.00, with no IntegrationPlan yet."
