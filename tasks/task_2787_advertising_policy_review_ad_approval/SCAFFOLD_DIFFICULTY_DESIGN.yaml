              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${wpn_id}", confidence: 0.95, matched_snippet: "rifles, optics and cases" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id" }
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
              captures: { act_id: "$.data[0].id" }
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice_id}", justification: "Swedish targeting was added by mistake and the campaign is US only." }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { appeal_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/appeals/${appeal_id}/decision"
              payload: { outcome: "GRANTED", note: "Targeting corrected; reinstating for manual review." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions/${act_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/disapproval-notices/${notice_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}", status: "QUEUED" }
              as: PolicyAdmin
              captures: { new_task_id: "$.data[0].id" }
          assert:
            - "Before the trigger: ScreeningRun.${run_id}.outcome == AUTO_DISAPPROVED with provisional_risk_score == 22.80, DisapprovalNotice.${notice_id}.assessed_points == 19.20 and decided_by_reviewer_id == null"
            - "Before the trigger: exactly 1 ViolationLedgerEntry exists with entry_index 1, reason DISAPPROVAL_ASSESSED, delta_points 19.20, balance_after 19.20"
            - "Before the trigger: Advertiser.${adv_id}.violation_points_raw == 19.20, severity_index == 19.20, account_status == WARNED; EnforcementAction.${act_id}.action_type == WARNING with status ACTIVE"
            - "After the trigger: exactly 2 ViolationLedgerEntry rows exist with contiguous entry_index 1 and 2; entry 1 is unchanged and entry 2 has reason APPEAL_REVERSAL, delta_points == -19.20 and balance_after == 0.00"
            - "After the trigger: Advertiser.${adv_id}.violation_points_raw == 0.00, violation_points_decayed == 0.00 and severity_index == 0.00, exactly the pre-disapproval values"
            - "After the trigger: EnforcementAction.${act_id}.status == LIFTED (not deleted) and Advertiser.${adv_id}.account_status == ACTIVE"
            - "After the trigger: DisapprovalNotice.${notice_id}.status == APPEAL_GRANTED and Appeal.${appeal_id}.status == GRANTED with decided_by_reviewer_id == ${rev_id} and reinstated_review_status == PENDING_MANUAL_REVIEW"
            - "After the trigger: AdCreative.${cr_id}.review_status == PENDING_MANUAL_REVIEW and destination_status == DESTINATION_PENDING (it was never MISMATCH_FLAGGED, so the reset is a no-op)"
            - "After the trigger: ReviewTask.${new_task_id} exists in status QUEUED with cycle_count == 0"
            - "Zero EnforcementAction rows were created or destroyed by the grant: total_count for the advertiser is still 1"

      - name: release_and_escalate_conserve_the_reviewer_claim_slot_counter
        grounds:
          - state_machines.ReviewTask.status.CLAIMED_to_QUEUED
          - state_machines.ReviewTask.status.CLAIMED_to_ESCALATED
          - validations[priority=66].ERR_REVIEWER_CAPACITY_EXCEEDED
          - entities.Reviewer.fields.claimed_task_count
        distinguishing_aspect: |
          Conserved quantity: a capacity counter rather than a monetary balance.
          claimed_task_count must equal the number of tasks currently in CLAIMED status
          held by that reviewer after every single operation, and both compensating
          operations must decrement it: release (which returns the task to QUEUED) and
          ESCALATE (which parks the task without touching the creative). The ceiling is
          re-checked against the live counter, so a claim that is refused at 2/2 succeeds
          immediately after a release, and no path leaks a slot.
        test_recipe:
          setup:
            - "Rule SUPPLEMENTS_CLAIMS (REGULATED, weight 4.02, requires_certification false, auto 0.90, manual 0.50, sla 48, default_queue STANDARD) with a DE override ALLOWED_WITH_DISCLAIMER 1.15."
            - "One advertiser and one reviewer with queue_specialties [STANDARD], country_authorizations [DE] and max_concurrent_claims 2."
            - "Three creatives, each declaring SUPPLEMENTS_CLAIMS and targeting DE only, each submitted and screened at confidence 0.60 so that three STANDARD tasks t1, t2 and t3 sit in QUEUED."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUPPLEMENTS_CLAIMS", title: "Supplement health claims", category_class: "REGULATED", base_severity_weight: 4.02, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${sup_id}/country-overrides"
              payload: { country_code: "DE", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.15 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Alpenkraft Nutrition GmbH", country_code: "DE", industry_code: "SUPPLEMENTS" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Capacity Two", queue_specialties: ["STANDARD"], country_authorizations: ["DE"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Daily greens one", body_text: "Daily greens powder for steady energy.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.alpenkraft.example/1", display_url: "https://www.alpenkraft.example/1" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Daily greens two", body_text: "Second daily greens blend with extra fibre.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.alpenkraft.example/2", display_url: "https://www.alpenkraft.example/2" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Daily greens three", body_text: "Third daily greens pack with citrus flavour.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.alpenkraft.example/3", display_url: "https://www.alpenkraft.example/3" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "steady energy" }], expected_ad_creative_version: "${cr1_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "extra fibre" }], expected_ad_creative_version: "${cr2_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "citrus flavour" }], expected_ad_creative_version: "${cr3_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr1_id}" }
              as: PolicyAdmin
              captures: { t1_id: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr2_id}" }
              as: PolicyAdmin
              captures: { t2_id: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr3_id}" }
              as: PolicyAdmin
              captures: { t3_id: "$.data[0].id" }
          trigger:
            - call: "POST /ad-policy/review-tasks/${t1_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t2_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t3_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t1_id}/release"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t3_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t2_id}/decision"
              payload: { resolution: "ESCALATE", note: "Sending the health claim to the medical desk." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { assigned_reviewer_id: "${rev_id}", status: "CLAIMED" }
              as: PolicyAdmin
          assert:
            - "After claiming t1: Reviewer.${rev_id}.claimed_task_count == 1 and exactly 1 task is CLAIMED"
            - "After claiming t2: Reviewer.${rev_id}.claimed_task_count == 2 and exactly 2 tasks are CLAIMED"
            - "The first attempt on t3 returns 409 with error_id ERR_REVIEWER_CAPACITY_EXCEEDED and ReviewTask.${t3_id}.status stays QUEUED with assigned_reviewer_id == null"
            - "The rejected claim leaves Reviewer.${rev_id}.claimed_task_count == 2, so no slot was consumed by the failure"
            - "After releasing t1: ReviewTask.${t1_id}.status == QUEUED, assigned_reviewer_id == null, claimed_at == null and Reviewer.${rev_id}.claimed_task_count == 1"
            - "ReviewTask.${t1_id}.priority_score and sla_deadline_at are unchanged by the release (a release is not a requeue and does not touch cycle_count, which stays 0)"
            - "The second attempt on t3 returns 200 and Reviewer.${rev_id}.claimed_task_count == 2 again"
            - "After the ESCALATE on t2: ReviewTask.${t2_id}.status == ESCALATED with assigned_reviewer_id == null, AdCreative.${cr2_id}.review_status still PENDING_MANUAL_REVIEW, and Reviewer.${rev_id}.claimed_task_count == 1"
            - "Final state: t1 QUEUED, t2 ESCALATED, t3 CLAIMED; GET /ad-policy/review-tasks filtered by assigned_reviewer_id and status CLAIMED returns total_count == 1, exactly matching claimed_task_count"
