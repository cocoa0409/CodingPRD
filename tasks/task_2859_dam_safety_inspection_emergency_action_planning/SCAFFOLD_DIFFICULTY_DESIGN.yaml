  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_threshold_is_inclusive_at_exactly_25000_cents
        grounds:
          - calculations.owner_fee_balance_and_delinquency
          - entities.Owner.fields.delinquency_status
          - entities.FeeLedgerEntry.fields.balance_after_cents
          - entities.FeeLedgerEntry.fields.sequence_no
        distinguishing_aspect: |
          Metric: the owner's fee balance in whole cents, on POST /owners/{id}/fee-adjustments. The
          threshold comparison is >=, so 24999 is CURRENT and 25000 - one single cent later - is
          DELINQUENT. An implementation using a strict > flips at 25001 and reports CURRENT at the
          exact boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner with an empty ledger (fee_balance_cents 0, delinquency_status CURRENT)."
            - "A first ANNUAL_REGISTRATION_FEE of 24999 cents lands one cent below the threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "ANNUAL_REGISTRATION_FEE", amount_cents: 24999, memo: "2026 registration fee." }
              as: ProgramAdmin
              captures: { entry1_id: "$.data.id", entry1_balance: "$.data.balance_after_cents" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 1, memo: "One-cent administrative penalty." }
              as: ProgramAdmin
              captures: { entry2_id: "$.data.id" }
          assert:
            - "before the trigger: Owner.${owner_id}.fee_balance_cents == 24999 and delinquency_status == CURRENT"
            - "the first entry has sequence_no == 1 and balance_after_cents == 24999"
            - "after the trigger: Owner.${owner_id}.fee_balance_cents == 25000 and delinquency_status == DELINQUENT"
            - "the second entry has sequence_no == 2 and balance_after_cents == 25000"
            - "GET /owners?delinquency_status=DELINQUENT returns exactly this owner"
            - "a strict > threshold would still report CURRENT at 25000, which is wrong"

      - name: first_event_reading_has_no_predecessor_so_it_cannot_escalate
        grounds:
          - calculations.reading_freeboard_and_alert
          - state_machines.HighWaterEvent.MONITORING_to_EMERGENCY
          - entities.ElevationReading.fields.rising
          - entities.ElevationReading.fields.freeboard_ft
          - entities.HighWaterEvent.fields.current_alert_level
        distinguishing_aspect: |
          A different metric on a different endpoint: freeboard in feet on
          POST /high-water-events/{id}/readings. Two boundaries at once - the prior-reading set of the
          FIRST reading is empty, so rising is false and a CRITICAL reading cannot escalate the event,
          and freeboard exactly 1.00 ft is CRITICAL because CRITICAL_MAX_FT is inclusive. The second
          reading (freeboard round_half_up(1042.5 - 1041.6) = 0.90) does have a predecessor, is rising,
          and escalates.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-01T02:00:00Z and then 2026-08-01T04:00:00Z."
            - "One dam with crest_elevation_ft 1042.5 (hazard classification is irrelevant here - the high-water endpoints do not require it)."
            - "One HighWaterEvent declared at 2026-08-01T00:00:00Z in status MONITORING with no readings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /high-water-events"
              payload: { dam_id: "${dam_id}", declared_at: "2026-08-01T00:00:00Z", trigger_description: "Forecast 6-inch rainfall on a saturated basin.", declared_inflow_cfs: 950 }
              as: EmergencyCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /high-water-events/${event_id}/readings"
              payload: { reading_at: "2026-08-01T02:00:00Z", pool_elevation_ft: 1041.5, observed_inflow_cfs: 1100 }
              as: EmergencyCoordinator
              captures: { reading1_id: "$.data.id", reading1_freeboard: "$.data.freeboard_ft" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: ProgramAdmin
            - call: "POST /high-water-events/${event_id}/readings"
              payload: { reading_at: "2026-08-01T04:00:00Z", pool_elevation_ft: 1041.6, observed_inflow_cfs: 1250 }
              as: EmergencyCoordinator
              captures: { reading2_id: "$.data.id" }
          assert:
            - "reading 1: freeboard_ft == 1.00, alert_level == CRITICAL (the 1.0 ft bound is inclusive), rising == false"
            - "after reading 1 the event is still MONITORING with escalated_at == null, current_alert_level == CRITICAL, reading_count == 1, peak_pool_elevation_ft == 1041.5"
            - "reading 2: freeboard_ft == 0.90, alert_level == CRITICAL, rising == true"
            - "after reading 2: HighWaterEvent.${event_id}.status == EMERGENCY and escalated_at == 2026-08-01T04:00:00Z"
            - "HighWaterEvent.${event_id}.reading_count == 2 and peak_pool_elevation_ft == 1041.6"
            - "an implementation that treats a missing predecessor as rising escalates on reading 1, which is wrong"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: drawdown_activation_rejected_until_its_high_water_event_reaches_emergency
        grounds:
          - state_machines.DrawdownOrder.COORDINATED_to_ACTIVE
          - state_machines.HighWaterEvent.MONITORING_to_EMERGENCY
          - validations[priority=24]
          - errors[ERR_EVENT_NOT_IN_EMERGENCY]
          - calculations.reading_freeboard_and_alert
