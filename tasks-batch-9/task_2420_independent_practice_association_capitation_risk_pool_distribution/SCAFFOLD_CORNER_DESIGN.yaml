# =============================================================================
# Scaffold Corner Design — §1.9 breadth probe
# Task 2420 — Independent Practice Association Capitation & Risk Pool Distribution
#
# Sections and claim_type values are taken from
# references/claim-extraction-guide.md; no categories are invented here.
# Instances whose corner is already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub and deliberately have no test_recipe.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_delegation_agreement_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.DelegationAgreement
          - endpoints.POST_/ipa/delegation-agreements
          - response_envelope.success
        distinguishing_aspect: |
          A create with every required input present returns 201 and echoes all
          declared fields, with the system-initialised ledger fields at their
          declared zero values and status DRAFT — not ACTIVE. Falsified if any
          declared field is absent from the response or if the ledger counters
          start at anything other than 0.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Creation Health", payer_tax_id: "94-3000031", delegation_scope: "CLAIMS_AND_UM", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_e1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "DelegationAgreement.${agr_e1}.status == \"DRAFT\" and capitation_posture == \"CURRENT\""
            - "payer_name == \"Corner Creation Health\", payer_tax_id == \"94-3000031\", delegation_scope == \"CLAIMS_AND_UM\", base_pmpm_cents == 30000, quality_withhold_bps == 700"
            - "accrued_capitation_cents == 0 and withheld_balance_cents == 0 and forfeited_withhold_cents == 0 and total_assigned_members == 0"
            - "id, created_at, updated_at and version are present; version == 1"
            - "the envelope has meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_delegation_agreement_returns_stored_data
        claim_type: retrieval
        grounds:
          - endpoints.GET_/ipa/delegation-agreements/{id}
          - entities.DelegationAgreement
        distinguishing_aspect: |
          A GET by id returns exactly the persisted row, including the fields
          mutated by the DRAFT → ACTIVE activation, and does not mutate version.
          Falsified if the read reports pre-activation values or bumps version.
        test_recipe:
          setup:
            - "Agreement AGR_E2 exists and has been activated, so status is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Retrieval Health", payer_tax_id: "94-3000032", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e2: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e2}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
              captures: { agr_e2_v_after_activate: "$.data.version" }
          trigger:
            - call: "GET /ipa/delegation-agreements/${agr_e2}"
              as: PayerRepresentative
              as_user_id: "${agr_e2}"
              captures: { agr_e2_status: "$.data.status", agr_e2_v_read: "$.data.version" }
          assert:
            - "HTTP 200 and ${agr_e2_status} == \"ACTIVE\""
            - "${agr_e2_v_read} == ${agr_e2_v_after_activate} — a read does not bump version"
            - "the response id equals ${agr_e2} and base_pmpm_cents == 20000"

      - name: list_enrollees_paginates_and_filters_by_agreement
        claim_type: listing
        grounds:
          - endpoints.GET_/ipa/enrollees
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint applies the agreement_id filter and the
          limit/offset window together, and reports total_count for the FILTERED
          set (3), not for the whole table (4 enrollees exist across two
          agreements). Falsified if total_count counts the other agreement's
          enrollee or if has_more ignores the window.
        test_recipe:
          setup:
            - "Agreement AGR_E3 is ACTIVE and holds three enrollees created in order E3-0001, E3-0002, E3-0003."
            - "A second ACTIVE agreement AGR_E3B holds one unrelated enrollee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Listing Health", payer_tax_id: "94-3000033", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e3: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e3}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e3}/enrollees"
              payload: { external_member_id: "E3-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e3}/enrollees"
              payload: { external_member_id: "E3-0002", age_band: "SENIOR", benefit_tier: "POS", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e3}/enrollees"
              payload: { external_member_id: "E3-0003", age_band: "PEDIATRIC", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Listing Other Health", payer_tax_id: "94-3000034", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e3b: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e3b}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e3b}/enrollees"
              payload: { external_member_id: "E3-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_e3}", limit: 2, offset: 0 }
              as: IpaAdmin
              captures: { page1_first: "$.data[0].external_member_id" }
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_e3}", limit: 2, offset: 2 }
              as: IpaAdmin
              captures: { page2_first: "$.data[0].external_member_id" }
          assert:
            - "call 1 returns HTTP 200 with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "${page1_first} == \"E3-0001\""
            - "call 2 returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${page2_first} == \"E3-0003\""
            - "neither page contains the AGR_E3B enrollee, even though it shares the external_member_id \"E3-0001\""
            - "response_type == \"array\" on both calls"

      - name: get_enrollee_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_path_id_resolution
          - errors.ERR_ENROLLEE_NOT_FOUND
          - endpoints.GET_/ipa/enrollees/{id}
        distinguishing_aspect: |
          An id that is well-formed but absent yields the entity-specific 404
          ERR_ENROLLEE_NOT_FOUND, not a generic 404 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "GET /ipa/enrollees/00000000-0000-4000-8000-0000000000e4"
              as: IpaAdmin
              captures: { e4_error: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${e4_error} == \"ERR_ENROLLEE_NOT_FOUND\""
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: create_physician_missing_npi_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/ipa/delegation-agreements/{id}/physicians
        distinguishing_aspect: |
          npi has source input with no default, so omitting it is a 400
          ERR_INVALID_REQUEST at priority 3 — ahead of every business rule and
          ahead of the agreement-state check at priority 8. Falsified if the
          server invents a blank npi or returns a business error instead.
        test_recipe:
          setup:
            - "Agreement AGR_E5 is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Required Health", payer_tax_id: "94-3000035", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e5: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e5}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_e5}/physicians"
              payload: { full_name: "No Npi Provided", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { e5_error: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${e5_error} == \"ERR_INVALID_REQUEST\""
            - "GET /ipa/delegation-agreements/${agr_e5}/physicians returns zero rows — nothing was persisted"

      - name: create_agreement_omitting_continuity_days_applies_default_90
        claim_type: defaults
        grounds:
          - entities.DelegationAgreement.fields.continuity_of_care_days
          - endpoints.POST_/ipa/delegation-agreements
        distinguishing_aspect: |
          continuity_of_care_days is the one optional input with a declared
          default of 90; omitting it must persist 90 and that 90 must be the
          value the NOTICE_GIVEN side effect later uses. Falsified if the field
          persists as null and the exit notice then computes no
          continuity_of_care_until.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Default Health", payer_tax_id: "94-3000036", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e6: "$.data.id", agr_e6_days: "$.data.continuity_of_care_days" }
            - call: "POST /ipa/delegation-agreements/${agr_e6}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e6}/physicians"
              payload: { npi: "3100000001", full_name: "Dara Okonkwo", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_e6: "$.data.id" }
            - call: "POST /ipa/physicians/${p_e6}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e6}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e6}/state"
              payload: { to_state: "NOTICE_GIVEN" }
              as: NetworkManager
              captures: { p_e6_until: "$.data.continuity_of_care_until" }
          assert:
            - "${agr_e6_days} == 90 — the default was applied, not null"
            - "${p_e6_until} == \"2026-05-30T00:00:00Z\" — 2026-03-01T00:00:00Z plus the defaulted 90 days"
            - "PhysicianMember.${p_e6}.exit_notice_at == \"2026-03-01T00:00:00Z\""

      - name: enrollee_computed_pmpm_ignores_extra_field_in_payload
        claim_type: computed_fields
        grounds:
          - entities.Enrollee.fields.gross_pmpm_cents
          - entities.Enrollee.fields.withhold_cents
          - entities.Enrollee.fields.net_pmpm_cents
          - calculations.member_pmpm_components
        distinguishing_aspect: |
          The three PMPM fields have source computed; a client-supplied
          net_pmpm_cents in the body is not part of the endpoint's input schema
          and can never reach the row. The server must return 37500 / 2625 /
          34875 for ADULT / HMO / risk 12500 at base 30000 with withhold 700
          bps, never the submitted 1.
        test_recipe:
          setup:
            - "Agreement AGR_E7 is ACTIVE with base_pmpm_cents 30000 and quality_withhold_bps 700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Computed Health", payer_tax_id: "94-3000037", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e7: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e7}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_e7}/enrollees"
              payload: { external_member_id: "E7-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z", net_pmpm_cents: 1 }
              as: IpaAdmin
              captures: { e_e7: "$.data.id" }
          assert:
            - "Enrollee.${e_e7}.gross_pmpm_cents == 37500 and withhold_cents == 2625 and net_pmpm_cents == 34875"
            - "net_pmpm_cents is NOT 1 — the client-supplied value is not accepted for a computed field"
            - "Enrollee.${e_e7}.assigned_physician_id == null and cumulative_paid_claims_cents == 0"

      - name: agreement_system_fields_generated_not_client_supplied_input_ignored
        claim_type: system_fields
        grounds:
          - entities.DelegationAgreement
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version have source system: a body that
          carries an id and a created_at must not overwrite them, created_at
          must equal the pinned logical clock instant, and version must start
          at 1. Falsified if the response echoes the client's id.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner System Health", payer_tax_id: "94-3000038", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, id: "00000000-0000-4000-8000-0000000000e8", created_at: "1999-01-01T00:00:00Z", version: 77 }
              as: IpaAdmin
              captures: { agr_e8: "$.data.id", agr_e8_created: "$.data.created_at", agr_e8_v: "$.data.version" }
          assert:
            - "${agr_e8} != \"00000000-0000-4000-8000-0000000000e8\" — the id is server-minted"
            - "${agr_e8_created} == \"2026-08-01T00:00:00Z\" — stamped from the logical clock, not from the body"
            - "${agr_e8_v} == 1 — not 77"
            - "GET /ipa/delegation-agreements/00000000-0000-4000-8000-0000000000e8 returns 404 ERR_AGREEMENT_NOT_FOUND"

      - name: create_enrollee_with_unknown_age_band_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Enrollee.fields.age_band
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          age_band is constrained to {PEDIATRIC, ADULT, SENIOR}; a fourth value
          is rejected at priority 3 with 400 ERR_INVALID_REQUEST rather than
          silently defaulting to ADULT or reaching the PMPM calculation, where
          AGE_BAND_FACTOR_BPS has no key for it.
        test_recipe:
          setup:
            - "Agreement AGR_E9 is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Enum Health", payer_tax_id: "94-3000039", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e9: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e9}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_e9}/enrollees"
              payload: { external_member_id: "E9-0001", age_band: "GERIATRIC", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e9_error: "$.data.error_id" }
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_e9}", limit: 10, offset: 0 }
              as: IpaAdmin
          assert:
            - "call 1 returns HTTP 400 and ${e9_error} == \"ERR_INVALID_REQUEST\""
            - "call 2 returns zero rows and total_count == 0"

      - name: enrollment_file_row_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.EnrollmentFileRow
          - endpoints.POST_/ipa/enrollment-files/{id}/rows
          - endpoints.GET_/ipa/enrollment-files/{id}/rows
        distinguishing_aspect: |
          EnrollmentFileRow declares common_fields false, so its rows carry no
          version and no updated_at and §1.5 exposes no update or delete route
          for them; the only field that ever changes is match_status, and that
          changes through the file's PARSED transition, never through a row
          write. Falsified if the row response carries a version field.
        test_recipe:
          setup:
            - "Agreement AGR_E10 is ACTIVE with one ACTIVE physician (npi 3200000001) and one enrollee E10-0001."
            - "A 2026-07 EnrollmentFile has been opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Immutable Health", payer_tax_id: "94-3000040", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e10: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e10}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e10}/physicians"
              payload: { npi: "3200000001", full_name: "Imani Rocha", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_e10: "$.data.id" }
            - call: "POST /ipa/physicians/${p_e10}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e10}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
