      - name: corner_pending_accreditation_cannot_act_as_a_county_officer
        claim_type: error_triggerable
        grounds:
          - validations[priority=42]
          - errors[ERR_REPRESENTATIVE_NOT_ACCREDITED]
        distinguishing_aspect: "The acting representative's accreditation is checked independently of the addressed row's state: a PENDING representative reviewing a PENDING_VERIFICATION discharge document gets ERR_REPRESENTATIVE_NOT_ACCREDITED (403), and the same call from an ACTIVE representative verifies the document."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_pending left in PENDING and rep_active activated."
            - "Veteran vet with a PENDING_VERIFICATION DD214."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-611", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_pending: $.data.id }
            - call: "POST /cvso/representatives"
              payload: { full_name: "Ingrid Osei", accreditation_number: "ACC-2849-612", accreditation_type: "VSO_ORG", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_active: $.data.id }
            - call: "POST /cvso/representatives/${rep_active}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
