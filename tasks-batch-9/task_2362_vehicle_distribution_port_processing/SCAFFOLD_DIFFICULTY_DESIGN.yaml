              as: PortOperationsPlanner
              captures: { gridlock_error: $.data.error_id }
          assert:
            - "${posture_at_3} == OPEN and ${free_at_3} == 2 (3/5 = 0.60 < 0.80)"
            - "${posture_at_4} == CONSTRAINED and ${occupied_at_4} == 4 — 4/5 is exactly 0.80, the inclusive CONSTRAINED boundary"
            - "${veh_5} is created — a CONSTRAINED yard still admits units because 0.80 < GRIDLOCK_RATIO 0.95"
            - "${posture_at_5} == GRIDLOCK and ${free_at_5} == 0 (5/5 = 1.00 >= 0.95)"
