  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_modification_revision_cycle
        entity: ColocationApplication
        shape: cyclic
        grounds:
          - state_machines.ColocationApplication.UNDER_STRUCTURAL_REVIEW_to_MODIFICATION_REQUIRED
          - state_machines.ColocationApplication.MODIFICATION_REQUIRED_to_UNDER_STRUCTURAL_REVIEW
          - endpoints.POST_/tower-colo/colocation-applications/{id}/revise
        distinguishing_aspect: |
          Non-linearity of ColocationApplication is a genuine CYCLE: the application returns to a
          state it already occupied (UNDER_STRUCTURAL_REVIEW) after being pushed out of it, the
          loop counter revision_count advances, the tower's open_review_count is decremented on
          the way out and re-incremented on the way back in, and the analysis that caused the
          exit is invalidated (SUPERSEDED) rather than deleted.
        test_recipe:
          setup:
            - "Tower T2 rated 4000 load units with 3000 baseline reserved load units (posture OPEN)."
            - "Tenant EEE with an ACTIVE master lease and an application carrying one 800.1-load-unit line."
            - "The application is submitted and a PRELIMINARY analysis returns 95.003% -> MODIFICATION_REQUIRED."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T2 Crest", structure_type: "SELF_SUPPORT", rated_capacity_load_units: 4000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 10000, baseline_reserved_load_units: 3000, baseline_reserved_ground_sqft: 0 }
