              as: ClinicalOps
              captures: { dana_id: $.data.id }
          trigger:
            - call: "POST /msk/transition-reviews/00000000-0000-4000-8000-000000000000/deny"
              payload: { approving_clinician_id: "${dana_id}" }
              as: ClinicalReviewService
              captures: { deny_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "the response is not ERR_TRANSITION_REVIEWER_MISMATCH, even though the acting clinician matches nothing on a non-existent enrollment"
            - "the response is not ERR_TRANSITION_NOT_PENDING either: existence outranks the state precondition"

