      - name: shipment_receive_guards_chain
        claim_type: precondition_enforcement
        grounds: ["state_machines.Shipment.IN_TRANSIT_to_RECEIVED", "errors[ERR_SHIPMENT_NOT_IN_TRANSIT]", "errors[ERR_NO_RECEIPTS_POSTED]", "errors[ERR_DRAFT_EVENTS_OUTSTANDING]"]
        distinguishing_aspect: "The RECEIVED transition enforces a three-part guard in order: events may only post while IN_TRANSIT; at least one POSTED event must exist; and no DRAFT event may remain."
        test_recipe:
          setup: ["Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 10 x 10000c cube 5 awarded/ordered; PO attached; shipment SEALED"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-N4", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
