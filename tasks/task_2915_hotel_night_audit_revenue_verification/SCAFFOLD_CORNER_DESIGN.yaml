      - name: error_triggerable_tie_out_failure_and_attempt_limit_codes
        claim_type: error_triggerable
        grounds: ["errors[ERR_TIE_OUT_ATTEMPT_LIMIT_REACHED]", "errors[ERR_PERIOD_NOT_OPEN]", "calculations.period_tie_out", "state_machines.AccountingPeriod.status"]
        distinguishing_aspect: "The tie-out tolerance is exactly zero, so a single cent drives the period into TIE_OUT_FAILED, and the retry counter is the only thing that ends the loop - three consumed attempts wedge the month permanently, and while it sits in TIE_OUT_FAILED the CLOSED date underneath cannot be reopened either."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01 walked all the way to CLOSED with total_revenue_amount 217.75 and a DISTRIBUTED revenue report; its AccountingPeriod is OPEN with tie_out_attempt_count 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
