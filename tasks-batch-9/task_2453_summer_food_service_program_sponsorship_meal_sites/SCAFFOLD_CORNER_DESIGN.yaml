      - name: voiding_a_planned_day_zeroes_it_and_bumps_the_site_void_counter
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /sfsp/meal-service-days/{day_id}/void].side_effects
          - state_machines.MealServiceDay.transitions[PLANNED->VOIDED]
          - entities.Site.fields.voided_day_count
        distinguishing_aspect: "A sponsor-initiated void is the only non-cascade path into VOIDED: it zeroes reimbursable_meals, stamps the caller's reason (not a system reason like SITE_DENIED), increments only Site.voided_day_count — leaving finalized_day_count alone — and the voided day is invisible to the FINALIZED-day filter that claims aggregate over."
        test_recipe:
          setup:
            - "APPROVED sponsor with an APPROVED, OPERATING rural SELF_PREP site."
            - "The 2026-06-08 day is already FINALIZED with 47 LUNCH meals; a second day for 2026-06-09 is still PLANNED."
