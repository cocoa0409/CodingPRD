# =============================================================================
# Scaffold: credit-counseling-dmp benchmark seed tables (v1)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Credit Counseling & Debt Management Plan (Money Management International/GreenPath
  style): budget & DTI intake, creditor proposal & concession (rate/fee waiver),
  consolidated single-payment disbursement, monthly proration across creditors,
  drop/default & re-age, completion graduation, bankruptcy pre-filing/pre-discharge
  counseling certificate, HUD housing counseling.

domain_name: credit-counseling-dmp
api_prefix: /agencies

# Structural DNA -- §0.1-§0.3
complexity_profile:
  primary_archetype: multi_party_negotiation        # client agency proposes concessions; each creditor independently accepts/counters/rejects
  secondary_archetype: ledger_reconciliation         # consolidated deposit prorated and disbursed across creditor ledgers; provisional vs settled balances
  complexity_layers:
    - optimistic_concurrency                          # OCC on Client.version for DMP activation / supersede
    - cascading_side_effects                          # disbursement run -> creditor ledger -> client balance -> graduation
    - dual_variant_calculation                        # projected payoff (forward) vs settled payoff (chronological); proposed vs effective concession
    - rate_threshold_triggers                          # missed-deposit streak -> default; DTI thresholds gate enrollment
    - derived_field_reconciliation                     # client total_enrolled_balance / dti reconciled from children

  entity_topology: hybrid                              # Agency tree + cross-cutting Creditor catalog referenced by DebtAccount
  state_machine_shape: cyclic                          # CounselingSession revision loop; CreditorProposal negotiation rounds; DMP default->re-age->active cycle
  relationship_patterns:
    - one_to_many                                      # Agency->Client->DebtAccount
    - cross_aggregate                                  # DebtAccount -> Creditor (catalog), DisbursementLine -> DebtAccount
    - many_to_many                                     # DisbursementRun fans out to many DebtAccounts via DisbursementLine
  role_model: peer_roles                               # Counselor vs CreditorRep vs AgencyAdmin own different surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED -- EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Counseling agency name" }
      - { name: setup_fee_cents, type: integer, source: input, default: 5000, description: "One-time DMP setup fee charged to client deposit on activation; must be <= SETUP_FEE_CAP_CENTS", constraints: "0..5000" }
      - { name: monthly_fee_cents, type: integer, source: input, default: 3500, description: "Monthly agency fee deducted from each deposit before proration; must be <= MONTHLY_FEE_CAP_CENTS", constraints: "0..7500" }
      - { name: current_cycle_index, type: integer, source: system, default: 0, description: "Disbursement cycle counter, increments on each run_disbursement" }

  - name: Counselor
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id" }
      - { name: full_name, type: string, source: input, description: "Counselor display name" }
      - { name: hud_certified, type: boolean, source: input, default: false, description: "Whether counselor may issue HUD housing counseling sessions" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Always ACTIVE on create; counselors have no deactivation lifecycle in this scaffold", constraints: "ACTIVE" }

  - name: Creditor
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id" }
      - { name: name, type: string, source: input, description: "Creditor (lender) name" }
      - { name: default_concession_apr, type: number, source: input, description: "Standard concession APR this creditor grants on DMP enrollment (e.g., 0.0699)", constraints: "0.0..1.0" }
      - { name: waives_late_fees, type: boolean, source: input, default: true, description: "Whether creditor waives accrued late fees on proposal acceptance" }
      - { name: min_proposed_payment_pct, type: number, source: input, default: 0.02, description: "Minimum monthly payment as fraction of enrolled balance this creditor will accept", constraints: "0.0..1.0" }

  - name: Client
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id" }
      - { name: counselor_id, type: string, source: input, description: "FK -> Counselor.id; assigned counselor" }
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Verified gross monthly income", constraints: ">0" }
      - { name: housing_payment_cents, type: integer, source: input, default: 0, description: "Monthly housing (rent/mortgage) payment, excluded from DMP proration" }
      - { name: monthly_deposit_cents, type: integer, source: computed, description: "Required single consolidated monthly deposit = monthly_fee + sum of enrolled DebtAccount.proposed_monthly_payment_cents" }
      - { name: front_end_dti, type: number, source: computed, description: "housing_payment_cents / gross_monthly_income_cents * 100, round_half_up 2dp" }
      - { name: back_end_dti, type: number, source: computed, description: "(housing + sum of all DebtAccount.min_payment_cents) / gross_monthly_income_cents * 100, round_half_up 2dp" }
      - { name: total_enrolled_balance_cents, type: integer, source: computed, description: "Sum of current_balance_cents over DebtAccount in ENROLLED or SETTLED-pending states" }
      - { name: projected_payoff_months, type: integer, source: computed, description: "Forward-looking max payoff months over ENROLLED accounts; surfaced by payoff_projection endpoint" }
      - { name: missed_deposit_streak, type: integer, source: system, default: 0, description: "Consecutive disbursement cycles with no recorded deposit; reset on deposit or re-age" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "INTAKE | ACTIVE | DEFAULTED | GRADUATED | WITHDRAWN", constraints: "INTAKE,ACTIVE,DEFAULTED,GRADUATED,WITHDRAWN" }

  - name: CounselingSession
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: counselor_id, type: string, source: input, description: "FK -> Counselor.id; conductor of the session" }
      - { name: session_type, type: enum, source: input, description: "BUDGET_INTAKE | BANKRUPTCY_PREFILING | BANKRUPTCY_PREDISCHARGE | HUD_HOUSING", constraints: "BUDGET_INTAKE,BANKRUPTCY_PREFILING,BANKRUPTCY_PREDISCHARGE,HUD_HOUSING" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | NEEDS_REVISION | COMPLETED | CERTIFIED", constraints: "OPEN,NEEDS_REVISION,COMPLETED,CERTIFIED" }
      - { name: certificate_number, type: string, source: system, description: "Issued only on CERTIFIED for bankruptcy/HUD types; null otherwise" }

  - name: DebtAccount
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: creditor_id, type: string, source: input, description: "FK -> Creditor.id; cross-aggregate reference to creditor catalog" }
      - { name: account_ref, type: string, source: input, description: "Masked account number; unique per client among non-DROPPED accounts" }
      - { name: original_balance_cents, type: integer, source: input, description: "Balance at enrollment", constraints: ">0" }
      - { name: current_balance_cents, type: integer, source: computed, description: "Remaining balance; decremented by disbursed principal each cycle" }
      - { name: original_apr, type: number, source: input, description: "Pre-DMP APR", constraints: "0.0..1.0" }
      - { name: concession_apr, type: number, source: computed, description: "Effective APR after creditor accepts proposal; null until ACCEPTED" }
      - { name: min_payment_cents, type: integer, source: input, description: "Pre-DMP minimum monthly payment; used in back_end_dti", constraints: ">0" }
      - { name: proposed_monthly_payment_cents, type: integer, source: input, description: "Proposed single-plan monthly payment toward this account; proration weight", constraints: ">0" }
      - { name: proposal_id, type: string, source: computed, description: "Convenience back-reference to the latest (highest round_index) CreditorProposal.id for this account; surfaced on create/get. Discoverable canonically via GET .../debt-accounts/{id}/proposals" }
      - { name: original_monthly_interest_cents, type: integer, source: computed, description: "floor(current_balance_cents * original_apr / 12); surfaced by savings endpoint" }
      - { name: concession_monthly_interest_cents, type: integer, source: computed, description: "floor(current_balance_cents * concession_apr / 12); surfaced by savings endpoint; null until concession_apr set" }
      - { name: monthly_interest_savings_cents, type: integer, source: computed, description: "original_monthly_interest_cents - concession_monthly_interest_cents; surfaced by savings endpoint" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | COUNTERED | ACCEPTED | ENROLLED | DROPPED | SETTLED", constraints: "PROPOSED,COUNTERED,ACCEPTED,ENROLLED,DROPPED,SETTLED" }

  - name: CreditorProposal
    parent: DebtAccount
    common_fields: true
    fields:
      - { name: debt_account_id, type: string, source: system, description: "FK -> DebtAccount.id" }
      - { name: creditor_id, type: string, source: system, description: "FK -> Creditor.id" }
      - { name: round_index, type: integer, source: system, default: 1, description: "Negotiation round number; increments each counter" }
      - { name: requested_concession_apr, type: number, source: input, description: "APR the agency requests for this account", constraints: "0.0..1.0" }
      - { name: requested_waive_late_fees, type: boolean, source: input, default: true, description: "Whether agency requests late-fee waiver" }
      - { name: countered_concession_apr, type: number, source: input, description: "APR the creditor counters with; null unless COUNTERED" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | COUNTERED | ACCEPTED | REJECTED", constraints: "SUBMITTED,COUNTERED,ACCEPTED,REJECTED" }

  - name: DepositRecord
    parent: Client
    common_fields: false
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: cycle_index, type: integer, source: system, description: "Agency cycle_index at which the deposit was recorded" }
      - { name: amount_cents, type: integer, source: input, description: "Deposited amount; must equal Client.monthly_deposit_cents at record time", constraints: ">0" }
      - { name: posted, type: boolean, source: system, default: true, description: "Always true; append-only event of a received deposit" }

  - name: DisbursementRun
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id" }
      - { name: cycle_index, type: integer, source: system, description: "Agency cycle_index this run executed at" }
      - { name: clients_processed, type: integer, source: computed, description: "Count of ACTIVE clients processed in this run" }
      - { name: clients_defaulted, type: integer, source: computed, description: "Count of clients pushed to DEFAULTED in this run" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum of all DisbursementLine.amount_cents in this run" }
      - { name: status, type: enum, source: system, default: "COMPLETED", description: "COMPLETED", constraints: "COMPLETED" }

  - name: DisbursementLine
    parent: DisbursementRun
    common_fields: false
    fields:
      - { name: disbursement_run_id, type: string, source: system, description: "FK -> DisbursementRun.id" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: debt_account_id, type: string, source: system, description: "FK -> DebtAccount.id" }
      - { name: amount_cents, type: integer, source: system, description: "Prorated principal applied to this DebtAccount this cycle" }
      - { name: balance_after_cents, type: integer, source: system, description: "DebtAccount.current_balance_cents after this line applied" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CounselingSession
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    transitions:
      - from: OPEN
        to: NEEDS_REVISION
        trigger: "POST /agencies/sessions/{sessionId}/request_revision"
        actor: Counselor
        preconditions:
          - "Session in OPEN (ERR_INVALID_STATE)"
        side_effects: []
        note: "Revision loop -- OPEN<->NEEDS_REVISION can cycle multiple rounds."
      - from: NEEDS_REVISION
        to: OPEN
        trigger: "POST /agencies/sessions/{sessionId}/resume"
        actor: Counselor
        preconditions:
          - "Session in NEEDS_REVISION (ERR_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST /agencies/sessions/{sessionId}/complete"
        actor: Counselor
        preconditions:
          - "Session in OPEN (ERR_INVALID_STATE)"
          - "For BUDGET_INTAKE: Client.back_end_dti >= MIN_ENROLL_DTI (ERR_DTI_BELOW_THRESHOLD)"
        side_effects:
          - "If session_type == BUDGET_INTAKE: no certificate"
      - from: COMPLETED
        to: CERTIFIED
        trigger: "POST /agencies/sessions/{sessionId}/certify"
        actor: Counselor
        preconditions:
          - "Session in COMPLETED (ERR_INVALID_STATE)"
          - "session_type IN {BANKRUPTCY_PREFILING, BANKRUPTCY_PREDISCHARGE, HUD_HOUSING} (ERR_SESSION_NOT_CERTIFIABLE)"
          - "For HUD_HOUSING: conducting Counselor.hud_certified == true (ERR_COUNSELOR_NOT_HUD_CERTIFIED)"
        side_effects:
          - "Mint certificate_number"

  - entity: CreditorProposal
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /agencies/proposals/{proposalId}/counter"
        actor: CreditorRep
        preconditions:
          - "Proposal in SUBMITTED (ERR_INVALID_STATE)"
          - "countered_concession_apr provided and < DebtAccount.original_apr (ERR_INVALID_CONCESSION)"
        side_effects:
          - "Set countered_concession_apr"
          - "DebtAccount.status PROPOSED -> COUNTERED"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /agencies/proposals/{proposalId}/resubmit"
        actor: Counselor
        preconditions:
          - "Proposal in COUNTERED (ERR_INVALID_STATE)"
          - "new requested_concession_apr provided (ERR_INVALID_CONCESSION)"
        side_effects:
          - "round_index += 1"
          - "DebtAccount.status COUNTERED -> PROPOSED"
        note: "Negotiation cycle SUBMITTED<->COUNTERED across rounds."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /agencies/proposals/{proposalId}/accept"
        actor: CreditorRep
        preconditions:
          - "Proposal in SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "DebtAccount.concession_apr = requested_concession_apr"
          - "DebtAccount.status PROPOSED -> ACCEPTED"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /agencies/proposals/{proposalId}/accept_counter"
        actor: Counselor
        preconditions:
          - "Proposal in COUNTERED (ERR_INVALID_STATE)"
        side_effects:
          - "DebtAccount.concession_apr = countered_concession_apr"
          - "DebtAccount.status COUNTERED -> ACCEPTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /agencies/proposals/{proposalId}/reject"
        actor: CreditorRep
        preconditions:
          - "Proposal in SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "DebtAccount.status PROPOSED -> DROPPED"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /agencies/proposals/{proposalId}/reject"
        actor: CreditorRep
        preconditions:
          - "Proposal in COUNTERED (ERR_INVALID_STATE)"
        side_effects:
          - "DebtAccount.status COUNTERED -> DROPPED"

  - entity: DebtAccount
    initial_state: PROPOSED
    terminal_states: [DROPPED, SETTLED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "system (CreditorProposal SUBMITTED->COUNTERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: PROPOSED
        trigger: "system (CreditorProposal COUNTERED->SUBMITTED via resubmit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: ACCEPTED
        trigger: "system (CreditorProposal -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set concession_apr; if Creditor.waives_late_fees, accrued late fees zeroed (no-op on balance here)"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "system (CreditorProposal COUNTERED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["Set concession_apr"]
      - from: ACCEPTED
        to: ENROLLED
        trigger: "system (Client INTAKE->ACTIVE activation)"
        actor: system
        preconditions:
          - "DebtAccount.status == ACCEPTED"
        side_effects:
          - "current_balance_cents initialized to original_balance_cents"
      - from: PROPOSED
        to: DROPPED
        trigger: "system (CreditorProposal SUBMITTED/COUNTERED -> REJECTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: DROPPED
        trigger: "system (CreditorProposal COUNTERED -> REJECTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /agencies/debt-accounts/{debtAccountId}/drop"
        actor: Counselor
        preconditions:
          - "DebtAccount.status == ENROLLED (ERR_INVALID_STATE)"
          - "Owning Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "Recompute Client.monthly_deposit_cents excluding this account"
          - "Next disbursement run re-prorates among remaining ENROLLED accounts"
      - from: ENROLLED
        to: SETTLED
        trigger: "system (disbursement run reduces current_balance_cents to 0)"
        actor: system
        preconditions:
          - "current_balance_cents reaches 0"
        side_effects:
          - "If all of a client's ENROLLED accounts are SETTLED: Client ACTIVE -> GRADUATED (bubble-up)"

  - entity: Client
    initial_state: INTAKE
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /agencies/clients/{clientId}/activate"
        actor: Counselor
        preconditions:
          - "expected_client_version matches Client.version (ERR_STALE_VERSION)"
          - "A CERTIFIED-or-COMPLETED BUDGET_INTAKE CounselingSession exists for client (ERR_INTAKE_NOT_COMPLETE)"
          - "At least one DebtAccount in ACCEPTED (ERR_NO_ACCEPTED_ACCOUNTS)"
          - "back_end_dti >= MIN_ENROLL_DTI (ERR_DTI_BELOW_THRESHOLD)"
          - "Agency.setup_fee_cents <= SETUP_FEE_CAP_CENTS and monthly_fee_cents <= MONTHLY_FEE_CAP_CENTS (ERR_FEE_CAP_EXCEEDED)"
        side_effects:
          - "All ACCEPTED DebtAccounts -> ENROLLED (cascade), current_balance_cents = original_balance_cents"
          - "Compute monthly_deposit_cents = monthly_fee_cents + sum(ENROLLED proposed_monthly_payment_cents)"
          - "Client.version += 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (disbursement run; missed_deposit_streak reaches MISSED_DEPOSIT_LIMIT)"
        actor: system
        preconditions:
          - "missed_deposit_streak >= MISSED_DEPOSIT_LIMIT after this cycle"
        side_effects:
          - "Client held; no disbursements while DEFAULTED"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /agencies/clients/{clientId}/re_age"
        actor: Counselor
        preconditions:
          - "Client.status == DEFAULTED (ERR_INVALID_STATE)"
          - "A DepositRecord exists at Agency.current_cycle_index for this client (ERR_NO_CURRENT_DEPOSIT)"
        side_effects:
          - "missed_deposit_streak reset to 0 (re-age)"
      - from: ACTIVE
        to: GRADUATED
        trigger: "system (all ENROLLED DebtAccounts SETTLED -- bubble-up)"
        actor: system
        preconditions:
          - "Every DebtAccount of client in {SETTLED, DROPPED} with >=1 SETTLED"
        side_effects: []
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /agencies/clients/{clientId}/withdraw"
        actor: Counselor
        preconditions:
          - "Client.status IN {INTAKE, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "All non-terminal DebtAccounts -> DROPPED (cascade down)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /agencies/clients/{clientId}/withdraw"
        actor: Counselor
        preconditions:
          - "Client.status IN {INTAKE, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "All non-terminal DebtAccounts -> DROPPED (cascade down)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: client-activate-stale-version
    parent_entity: Client
    write_endpoint: "POST /agencies/clients/{clientId}/activate"
    occ_field: "expected_client_version"
    description: |
      Activating a Client whose version has advanced since the client last
      observed it is rejected. A new DebtAccount enrollment or a proposal
      acceptance recorded after the caller read the Client legitimately changes
      the enrollment set the activation would lock; the caller's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: client_dti
    trigger: "Client create/update; DebtAccount create/drop; GET client"
    algorithm: aggregation
    formula: |
      front_end_dti = round_half_up( housing_payment_cents / gross_monthly_income_cents * 100, 2 )
      back_debts_cents = sum( DebtAccount.min_payment_cents
                              for accounts with status IN {PROPOSED, COUNTERED, ACCEPTED, ENROLLED} )
      back_end_dti = round_half_up( (housing_payment_cents + back_debts_cents)
                                    / gross_monthly_income_cents * 100, 2 )
    input_set: "DebtAccount with status IN {PROPOSED,COUNTERED,ACCEPTED,ENROLLED}; DROPPED and SETTLED excluded"
    constants:
      MIN_ENROLL_DTI: 15.0     # back_end_dti must be >= this percentage to enroll
    precision: "2 decimal places, round_half_up"

  - name: monthly_deposit
    trigger: "Client activation; DebtAccount drop; enrolled-set change"
    algorithm: aggregation
    formula: |
      monthly_deposit_cents = Agency.monthly_fee_cents
                            + sum( DebtAccount.proposed_monthly_payment_cents
                                   for accounts with status == ENROLLED )
    input_set: "ENROLLED DebtAccounts only"
    precision: "integer cents"

  - name: disbursement_proration
    trigger: "POST /agencies/agencies/{agencyId}/run_disbursement (per ACTIVE client with a current-cycle deposit)"
    algorithm: waterfall_allocation
    formula: |
      # Per ACTIVE client that has a DepositRecord at Agency.current_cycle_index:
      disbursable_cents = deposit.amount_cents - Agency.monthly_fee_cents
      eligible = [ a for a in client DebtAccounts if a.status == ENROLLED and a.current_balance_cents > 0 ]
      weights = { a: a.proposed_monthly_payment_cents for a in eligible }
      W = sum(weights.values())
      # Largest-remainder (Hamilton) apportionment, capped by balance:
      exact[a]   = disbursable_cents * weights[a] / W
      target[a]  = floor(exact[a])
      remainder  = disbursable_cents - sum(target.values())
      # distribute remainder one cent at a time, ordered by descending fractional part
      # of exact[a]; tie-break by DebtAccount.created_at ASC:
      order = sort(eligible, key = (-(exact[a] - floor(exact[a])), DebtAccount.created_at ASC))
      for i in 0..remainder-1: target[order[i]] += 1
      # Cap each line by remaining balance; any overflow re-flows to the next
      # eligible account by created_at ASC until exhausted or all capped:
      line[a]    = min(target[a], a.current_balance_cents)
      overflow   = sum(target[a] - line[a])
      redistribute overflow to under-cap eligible accounts by created_at ASC
      a.current_balance_cents -= line[a]
      if a.current_balance_cents == 0: a -> SETTLED
    input_set: "ENROLLED DebtAccounts with current_balance_cents > 0 for the client"
    precision: "integer cents; round_half_up only inside Hamilton fractional ordering, never on the cent amounts themselves"
    variants:
      - name: full_enrolled_set
        when: "no account DROPPED since activation"
        difference: "weights span every originally ENROLLED account"
      - name: post_drop_reproration
        when: "one or more accounts DROPPED before this run"
        difference: "DROPPED accounts excluded from weights; W shrinks so survivors absorb the freed cents"

  - name: projected_payoff_months
    trigger: "GET /agencies/clients/{clientId}/payoff_projection"
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate assuming concession APR accrues monthly on balance
      # and the full proposed_monthly_payment_cents is applied each cycle.
      For each ENROLLED account a:
        monthly_interest = floor( a.current_balance_cents * (a.concession_apr / 12) )
        net_principal    = a.proposed_monthly_payment_cents - monthly_interest
        if net_principal <= 0: account is non-amortizing -> ERR_NON_AMORTIZING_PLAN
        months_a = ceil( a.current_balance_cents / net_principal )
      projected_payoff_months = max(months_a over ENROLLED accounts)
    input_set: "ENROLLED accounts with current_balance_cents > 0"
    precision: "integer months, ceil"
    variants:
      - name: projected_forward
        when: "payoff_projection endpoint"
        difference: "Forward estimate; ignores rounding drift of actual disbursements; uses concession_apr accrual"
      - name: settled_actual
        when: "graduation occurs"
        difference: "Settled actual = count of DisbursementRun cycles the client actually consumed to reach all-SETTLED; chronological, no interest model"

  - name: concession_savings
    trigger: "GET /agencies/debt-accounts/{debtAccountId}/savings"
    algorithm: threshold
    formula: |
      # basis = current_balance_cents when ENROLLED, else original_balance_cents (ACCEPTED, not yet enrolled)
      basis = current_balance_cents if status == ENROLLED else original_balance_cents
      original_monthly_interest_cents   = floor( basis * (original_apr / 12) )
      concession_monthly_interest_cents = floor( basis * (concession_apr / 12) )
      monthly_interest_savings_cents    = original_monthly_interest_cents - concession_monthly_interest_cents
      # late_fee_waiver_savings is creditor-flag-gated:
      late_fee_waiver_applied           = (Creditor.waives_late_fees == true) and (DebtAccount.status IN {ACCEPTED, ENROLLED})
    input_set: "Single DebtAccount in {ACCEPTED, ENROLLED} (requires concession_apr non-null)"
    constants:
      LATE_FEE_THRESHOLD_APR: 0.10   # accounts whose original_apr > this are flagged high_interest
    precision: "integer cents, floor on monthly interest"

  - name: missed_deposit_tracking
    trigger: "POST /agencies/agencies/{agencyId}/run_disbursement (per ACTIVE client)"
    algorithm: threshold
    formula: |
      # Evaluated for each ACTIVE client at run time:
      if exists DepositRecord with cycle_index == Agency.current_cycle_index for this client:
        missed_deposit_streak stays as set on deposit (already 0)   # deposit recording resets it to 0
      else:
        missed_deposit_streak += 1
      if missed_deposit_streak >= MISSED_DEPOSIT_LIMIT:
        Client.status ACTIVE -> DEFAULTED
    input_set: "ACTIVE clients only"
    constants:
      MISSED_DEPOSIT_LIMIT: 3        # streak at or above this triggers DEFAULTED
      SETUP_FEE_CAP_CENTS: 5000      # regulatory cap on Agency.setup_fee_cents
      MONTHLY_FEE_CAP_CENTS: 7500    # regulatory cap on Agency.monthly_fee_cents
    precision: "integer streak"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path-referenced resources exist within agency, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Body FK references (counselor_id, creditor_id, debt_account_id) resolve within agency"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "create Client, create DebtAccount, create CounselingSession, create CreditorProposal"

  - priority: 5
    category: state
    check: "Target resource in a state where the operation/transition is allowed; record-deposit and drop require the owning Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE), checked before any fiscal/amount validation"
    error_id: "ERR_INVALID_STATE / ERR_CLIENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "all transition endpoints, record deposit, drop account"

  - priority: 6
    category: business_constraint
    check: "DebtAccount.account_ref unique per client among status != DROPPED"
    error_id: ERR_DUPLICATE_ACCOUNT_REF
    http_status: 409
    applies_to: "create DebtAccount"

  - priority: 7
    category: business_safety
    check: "HUD_HOUSING session may only be CERTIFIED by a hud_certified counselor"
    error_id: ERR_COUNSELOR_NOT_HUD_CERTIFIED
    http_status: 409
    applies_to: "certify session"

  - priority: 8
    category: business_constraint
    check: "Counter/resubmit concession APR must be a strict reduction below DebtAccount.original_apr; proposed_monthly_payment must be >= Creditor.min_proposed_payment_pct * original_balance"
    error_id: ERR_INVALID_CONCESSION
    http_status: 422
    applies_to: "create CreditorProposal, counter, resubmit, create DebtAccount"

  - priority: 9
    category: business_constraint
    check: "Activation requires >=1 ACCEPTED DebtAccount and a completed BUDGET_INTAKE session"
    error_id: ERR_NO_ACCEPTED_ACCOUNTS
    http_status: 409
    applies_to: "activate client"

  - priority: 10
    category: business_fiscal
    check: "Agency setup_fee_cents <= SETUP_FEE_CAP_CENTS and monthly_fee_cents <= MONTHLY_FEE_CAP_CENTS"
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "create Agency, activate client"

  - priority: 11
    category: business_fiscal
    check: "back_end_dti >= MIN_ENROLL_DTI to complete BUDGET_INTAKE / activate"
    error_id: ERR_DTI_BELOW_THRESHOLD
    http_status: 409
    applies_to: "complete BUDGET_INTAKE session, activate client"

  - priority: 12
    category: business_fiscal
    check: "Recorded deposit amount must equal Client.monthly_deposit_cents exactly"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "record deposit"

  - priority: 13
    category: business_temporal
    check: "Cycle-slot occupation: at most one DepositRecord per client per Agency.current_cycle_index (point-interval, exact-index collision)"
    error_id: ERR_DUPLICATE_CYCLE_DEPOSIT
    http_status: 409
    applies_to: "record deposit"

  - priority: 14
    category: business_temporal
    check: "Lifecycle-window occupation: a client may not open a second CounselingSession of the same session_type while an existing one of that type occupies an in-flight window (status IN {OPEN, NEEDS_REVISION}); the window is half-open, freed on COMPLETED/CERTIFIED"
    error_id: ERR_SESSION_TYPE_IN_FLIGHT
    http_status: 409
    applies_to: "open session"

  - priority: 15
    category: business_constraint
    check: "Concurrency: expected_client_version must match Client.version on activation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "activate client"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Flat topology: api_prefix is /agencies; every entity is a flat collection
  # addressed as /agencies/<segment>/{id}. Cross-aggregate links (agency_id,
  # client_id, creditor_id, counselor_id, debt_account_id) are carried in the
  # request body or as query filters. Action endpoints sit on their own resource.

  # --- Agency ---
  - method: POST
    path: "/agencies/agencies"
    description: "Create a counseling Agency"
    roles: [AgencyAdmin]
    code: 201
    input: [name, "setup_fee_cents?", "monthly_fee_cents?"]
    output: Agency
    side_effects: ["current_cycle_index=0; validate fee caps (ERR_FEE_CAP_EXCEEDED)"]

  - method: GET
    path: "/agencies/agencies/{agencyId}"
    description: "Get an Agency"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/agencies/agencies/{agencyId}/run_disbursement"
    description: "Execute one consolidated disbursement cycle across all ACTIVE clients of this agency"
    roles: [AgencyAdmin]
    code: 201
    input: []
    output: DisbursementRun
    side_effects:
      - "Agency.current_cycle_index += 1"
      - "For each ACTIVE client: if deposit at cycle -> prorate & disburse (disbursement_proration), else missed_deposit_streak += 1"
      - "DebtAccount.current_balance_cents decremented; reaches 0 -> SETTLED; all settled -> Client GRADUATED (cascade)"
      - "missed_deposit_streak >= MISSED_DEPOSIT_LIMIT -> Client DEFAULTED"
      - "Create DisbursementLine per disbursed account"

  # --- DisbursementRun (segment: disbursement-runs) ---
  - method: GET
    path: "/agencies/disbursement-runs/{runId}"
    description: "Get a DisbursementRun"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: DisbursementRun
    side_effects: []

  - method: GET
    path: "/agencies/disbursement-runs"
    description: "List DisbursementRuns (filtered-list reverse-reachability for DisbursementRun.agency_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["agency_id?", "cycle_index?"]
    output: "DisbursementRun[]"
    side_effects: []

  # --- DisbursementLine (segment: disbursement-lines) ---
  - method: GET
    path: "/agencies/disbursement-lines/{lineId}"
    description: "Get a DisbursementLine"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: DisbursementLine
    side_effects: []

  - method: GET
    path: "/agencies/disbursement-lines"
    description: "List DisbursementLines (filtered-list reverse-reachability for DisbursementLine.disbursement_run_id, client_id, debt_account_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["disbursement_run_id?", "client_id?", "debt_account_id?"]
    output: "DisbursementLine[]"
    side_effects: []

  # --- Counselor (segment: counselors) ---
  - method: POST
    path: "/agencies/counselors"
    description: "Create a Counselor"
    roles: [AgencyAdmin]
    code: 201
    input: [agency_id, full_name, "hud_certified?"]
    output: Counselor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/agencies/counselors/{counselorId}"
    description: "Get a Counselor"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: Counselor
    side_effects: []

  - method: GET
    path: "/agencies/counselors"
    description: "List Counselors (filtered-list reverse-reachability for Counselor.agency_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["agency_id?", "hud_certified?"]
    output: "Counselor[]"
    side_effects: []

  # --- Creditor (segment: creditors) ---
  - method: POST
    path: "/agencies/creditors"
    description: "Create a Creditor in the catalog"
    roles: [AgencyAdmin]
    code: 201
    input: [agency_id, name, default_concession_apr, "waives_late_fees?", "min_proposed_payment_pct?"]
    output: Creditor
    side_effects: []

  - method: GET
    path: "/agencies/creditors/{creditorId}"
    description: "Get a Creditor"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: []
    output: Creditor
    side_effects: []

  - method: GET
    path: "/agencies/creditors"
    description: "List Creditors (filtered-list reverse-reachability for Creditor.agency_id)"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: ["agency_id?"]
    output: "Creditor[]"
    side_effects: []

  # --- Client (segment: clients) ---
  - method: POST
    path: "/agencies/clients"
    description: "Create a Client (intake)"
    roles: [Counselor]
    code: 201
    input: [agency_id, counselor_id, full_name, gross_monthly_income_cents, "housing_payment_cents?"]
    output: Client
    side_effects: ["status=INTAKE; compute front_end_dti, back_end_dti (0 debts yet)"]

  - method: GET
    path: "/agencies/clients/{clientId}"
    description: "Get a Client with computed deposit/dti/balance"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/agencies/clients"
    description: "List Clients (filtered-list reverse-reachability for Client.agency_id and Client.counselor_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["agency_id?", "counselor_id?", "status?"]
    output: "Client[]"
    side_effects: []

  - method: POST
    path: "/agencies/clients/{clientId}/activate"
    description: "Activate DMP: enroll accepted accounts, lock monthly deposit"
    roles: [Counselor]
    code: 200
    input: [expected_client_version]
    output: Client
    side_effects:
      - "ACCEPTED DebtAccounts -> ENROLLED (cascade); current_balance_cents=original_balance_cents"
      - "Compute monthly_deposit_cents; status INTAKE->ACTIVE"
      - "increments Client.version by 1"

  - method: POST
    path: "/agencies/clients/{clientId}/re_age"
    description: "Re-age a DEFAULTED client back to ACTIVE after a current-cycle deposit"
    roles: [Counselor]
    code: 200
    input: []
    output: Client
    side_effects: ["status DEFAULTED->ACTIVE; missed_deposit_streak reset to 0"]

  - method: POST
    path: "/agencies/clients/{clientId}/withdraw"
    description: "Withdraw a client; drop all non-terminal debt accounts"
    roles: [Counselor]
    code: 200
    input: []
    output: Client
    side_effects: ["status->WITHDRAWN; non-terminal DebtAccounts -> DROPPED (cascade down)"]

  - method: POST
    path: "/agencies/clients/{clientId}/deposits"
    description: "Record a single consolidated deposit for the current cycle"
    roles: [Counselor, AgencyAdmin]
    code: 201
    input: [amount_cents]
    output: DepositRecord
    side_effects:
      - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE) -- checked before amount match"
      - "cycle_index = Agency.current_cycle_index"
      - "amount must equal Client.monthly_deposit_cents (ERR_DEPOSIT_AMOUNT_MISMATCH)"
      - "Reset Client.missed_deposit_streak to 0"

  - method: POST
    path: "/agencies/clients/{clientId}/sessions"
    description: "Open a counseling session for this client"
    roles: [Counselor]
    code: 201
    input: [counselor_id, session_type]
    output: CounselingSession
    side_effects:
      - "status=OPEN"
      - "Reject if same-type session already in-flight (OPEN/NEEDS_REVISION) for client (ERR_SESSION_TYPE_IN_FLIGHT)"

  - method: POST
    path: "/agencies/clients/{clientId}/debt-accounts"
    description: "Add a debt account for this client (auto-creates first CreditorProposal)"
    roles: [Counselor]
    code: 201
    input: [creditor_id, account_ref, original_balance_cents, original_apr, min_payment_cents, proposed_monthly_payment_cents, "requested_concession_apr?"]
    output: DebtAccount
    side_effects:
      - "status=PROPOSED; recompute Client.back_end_dti, monthly_deposit_cents"
      - "Create CreditorProposal SUBMITTED (round_index=1) with requested_concession_apr (default Creditor.default_concession_apr)"

  - method: GET
    path: "/agencies/clients/{clientId}/payoff_projection"
    description: "Forward-looking projected payoff months (projected_payoff_months calc)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: Client
    side_effects: ["ERR_NON_AMORTIZING_PLAN if any ENROLLED account net principal <= 0"]

  # --- DepositRecord (segment: deposits) ---
  - method: GET
    path: "/agencies/deposits/{depositId}"
    description: "Get a DepositRecord"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: DepositRecord
    side_effects: []

  - method: GET
    path: "/agencies/deposits"
    description: "List DepositRecords (filtered-list reverse-reachability for DepositRecord.client_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["client_id?", "cycle_index?"]
    output: "DepositRecord[]"
    side_effects: []

  # --- CounselingSession (segment: sessions) ---
  - method: GET
    path: "/agencies/sessions/{sessionId}"
    description: "Get a CounselingSession"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: []

  - method: GET
    path: "/agencies/sessions"
    description: "List sessions (filtered-list reverse-reachability for CounselingSession.client_id and counselor_id)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: ["client_id?", "counselor_id?", "session_type?", "status?"]
    output: "CounselingSession[]"
    side_effects: []

  - method: POST
    path: "/agencies/sessions/{sessionId}/request_revision"
    description: "Send session back for revision"
    roles: [Counselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status OPEN->NEEDS_REVISION"]

  - method: POST
    path: "/agencies/sessions/{sessionId}/resume"
    description: "Resume a session under revision"
    roles: [Counselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status NEEDS_REVISION->OPEN"]

  - method: POST
    path: "/agencies/sessions/{sessionId}/complete"
    description: "Complete a session"
    roles: [Counselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status OPEN->COMPLETED; BUDGET_INTAKE checks DTI floor"]

  - method: POST
    path: "/agencies/sessions/{sessionId}/certify"
    description: "Issue a certificate for bankruptcy/HUD sessions"
    roles: [Counselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status COMPLETED->CERTIFIED; mint certificate_number"]

  # --- DebtAccount (segment: debt-accounts) ---
  - method: GET
    path: "/agencies/debt-accounts/{debtAccountId}"
    description: "Get a DebtAccount"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: []
    output: DebtAccount
    side_effects: []

  - method: GET
    path: "/agencies/debt-accounts"
    description: "List debt accounts (filtered-list reverse-reachability for DebtAccount.client_id and creditor_id)"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: ["client_id?", "creditor_id?", "status?"]
    output: "DebtAccount[]"
    side_effects: []

  - method: POST
    path: "/agencies/debt-accounts/{debtAccountId}/drop"
    description: "Drop an enrolled debt account from the plan"
    roles: [Counselor]
    code: 200
    input: []
    output: DebtAccount
    side_effects: ["status ENROLLED->DROPPED; recompute Client.monthly_deposit_cents; re-prorate next run"]

  - method: GET
    path: "/agencies/debt-accounts/{debtAccountId}/savings"
    description: "Concession savings breakdown (concession_savings calc)"
    roles: [AgencyAdmin, Counselor]
    code: 200
    input: []
    output: DebtAccount
    side_effects: ["ERR_INVALID_STATE if account lacks concession_apr (not ACCEPTED/ENROLLED)"]

  # --- CreditorProposal (segment: proposals) ---
  - method: GET
    path: "/agencies/proposals/{proposalId}"
    description: "Get a CreditorProposal"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: []
    output: CreditorProposal
    side_effects: []

  - method: GET
    path: "/agencies/proposals"
    description: "List proposals (filtered-list reverse-reachability for CreditorProposal.debt_account_id and creditor_id)"
    roles: [AgencyAdmin, Counselor, CreditorRep]
    code: 200
    input: ["debt_account_id?", "creditor_id?", "status?"]
    output: "CreditorProposal[]"
    side_effects: []

  - method: POST
    path: "/agencies/proposals/{proposalId}/counter"
    description: "Creditor counters with a different concession APR"
    roles: [CreditorRep]
    code: 200
    input: [countered_concession_apr]
    output: CreditorProposal
    side_effects: ["status SUBMITTED->COUNTERED; DebtAccount PROPOSED->COUNTERED"]

  - method: POST
    path: "/agencies/proposals/{proposalId}/resubmit"
    description: "Counselor resubmits a revised concession request (new round)"
    roles: [Counselor]
    code: 200
    input: [requested_concession_apr]
    output: CreditorProposal
    side_effects: ["status COUNTERED->SUBMITTED; round_index += 1; DebtAccount COUNTERED->PROPOSED"]

  - method: POST
    path: "/agencies/proposals/{proposalId}/accept"
    description: "Creditor accepts the agency's submitted proposal"
    roles: [CreditorRep]
    code: 200
    input: []
    output: CreditorProposal
    side_effects: ["status SUBMITTED->ACCEPTED; DebtAccount.concession_apr=requested; DebtAccount PROPOSED->ACCEPTED"]

  - method: POST
    path: "/agencies/proposals/{proposalId}/accept_counter"
    description: "Counselor accepts the creditor's counter"
    roles: [Counselor]
    code: 200
    input: []
    output: CreditorProposal
    side_effects: ["status COUNTERED->ACCEPTED; DebtAccount.concession_apr=countered; DebtAccount COUNTERED->ACCEPTED"]

  - method: POST
    path: "/agencies/proposals/{proposalId}/reject"
    description: "Creditor rejects the proposal; debt account is dropped"
    roles: [CreditorRep]
    code: 200
    input: []
    output: CreditorProposal
    side_effects: ["status ->REJECTED; DebtAccount ->DROPPED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role valid but not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist in this agency"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body FK (counselor_id/creditor_id/debt_account_id) does not resolve within agency"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, negative/zero amount"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state where this transition/operation is allowed"
  - id: ERR_DUPLICATE_ACCOUNT_REF
    http: 409
    condition: "account_ref already used by a non-DROPPED DebtAccount for this client"
  - id: ERR_INVALID_CONCESSION
    http: 422
    condition: "Concession APR not a strict reduction below original_apr, or proposed_monthly_payment below creditor minimum"
  - id: ERR_SESSION_NOT_CERTIFIABLE
    http: 409
    condition: "Certify attempted on a BUDGET_INTAKE session (only bankruptcy/HUD types are certifiable)"
  - id: ERR_COUNSELOR_NOT_HUD_CERTIFIED
    http: 409
    condition: "HUD_HOUSING certification attempted by a non-hud_certified counselor"
  - id: ERR_DTI_BELOW_THRESHOLD
    http: 409
    condition: "back_end_dti below MIN_ENROLL_DTI at intake-complete or activation"
  - id: ERR_NO_ACCEPTED_ACCOUNTS
    http: 409
    condition: "Activation attempted with no ACCEPTED DebtAccount"
  - id: ERR_INTAKE_NOT_COMPLETE
    http: 409
    condition: "Activation attempted without a completed BUDGET_INTAKE session"
  - id: ERR_FEE_CAP_EXCEEDED
    http: 422
    condition: "setup_fee_cents or monthly_fee_cents exceeds the regulatory cap"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "Operation requires Client.status == ACTIVE"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "Recorded deposit amount_cents != Client.monthly_deposit_cents"
  - id: ERR_DUPLICATE_CYCLE_DEPOSIT
    http: 409
    condition: "A DepositRecord already exists for this client at the current cycle_index"
  - id: ERR_SESSION_TYPE_IN_FLIGHT
    http: 409
    condition: "An in-flight CounselingSession of the same session_type (OPEN/NEEDS_REVISION) already occupies the window for this client"
  - id: ERR_NO_CURRENT_DEPOSIT
    http: 409
    condition: "Re-age attempted without a DepositRecord at the current cycle_index"
  - id: ERR_NON_AMORTIZING_PLAN
    http: 409
    condition: "Payoff projection: an ENROLLED account's monthly payment does not cover concession interest"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_client_version does not match Client.version on activation"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic semantic validation failure (out-of-range numeric, bad enum value)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency operator: creates agencies, counselors, creditors; runs disbursement cycles"
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies/agencies -- Create agency"
      - "POST /agencies/counselors -- Create counselor"
      - "POST /agencies/creditors -- Create creditor"
      - "POST /agencies/agencies/{id}/run_disbursement -- Run disbursement cycle"
    shared_operations:
      - "POST /agencies/clients/{id}/deposits -- Record deposit (with Counselor)"
      - "GET endpoints across agency, clients, runs, accounts"

  - name: Counselor
    description: "Conducts intake/counseling, manages clients, debt accounts, proposals (agency side), activation, drop, re-age, withdraw"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /agencies/clients -- Create client"
      - "POST /agencies/clients/{id}/activate -- Activate DMP"
      - "POST /agencies/clients/{id}/re_age -- Re-age client"
      - "POST /agencies/clients/{id}/withdraw -- Withdraw client"
      - "POST /agencies/clients/{id}/sessions -- Open session"
      - "POST /agencies/sessions/{id}/request_revision|resume|complete|certify -- Session lifecycle"
      - "POST /agencies/clients/{id}/debt-accounts -- Add debt account"
      - "POST /agencies/debt-accounts/{id}/drop -- Drop account"
      - "POST /agencies/proposals/{id}/resubmit -- Resubmit proposal (agency side)"
      - "POST /agencies/proposals/{id}/accept_counter -- Accept creditor counter"
    shared_operations:
      - "POST /agencies/clients/{id}/deposits -- Record deposit (with AgencyAdmin)"
      - "GET endpoints across clients, sessions, accounts, proposals, projections"

  - name: CreditorRep
    description: "Acts on behalf of a Creditor: counters, accepts, or rejects agency proposals"
    identity: "entity_backed:Creditor"
    exclusive_operations:
      - "POST /agencies/proposals/{id}/counter -- Counter a proposal"
      - "POST /agencies/proposals/{id}/accept -- Accept a submitted proposal"
      - "POST /agencies/proposals/{id}/reject -- Reject a proposal"
    shared_operations:
      - "GET endpoints across creditors, debt-accounts, proposals"
