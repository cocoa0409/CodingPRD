          assert:
            - "Store.${sid}.format_type == DG_MARKET"
            - "Store.${sid}.projected_revenue_cents == 448000000 and build_cost_cents == 700000000 and weekly_case_volume_base == 2600"
            - "TradeArea.${tab}.projected_revenue_cents == 448000000 (copied up)"

