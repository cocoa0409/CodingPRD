# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: medicare-enrollment. 9 rules x 2 instances = 18 instances.
# Every instance is independently constructible from an empty DB via its
# setup_api_calls chain; all literals precomputed from §1.3 formulas.
# Rate schedules used below:
#   RS2026: B=18500, D=3450; surcharges t1 7400/1370, t2 18500/3530,
#           t3 29590/5680, t4 40680/7850, t5 44390/8580
#   RS2027: B=19000, D=3600; surcharges t1 7600/1400, t2 19000/3620,
#           t3 30400/5830, t4 41800/8060, t5 45600/8810
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_irmaa_basis
        grounds:
          - calculations.calc_total_premium
          - calculations.calc_irmaa_tier
          - state_machines.PremiumDetermination.PROVISIONAL_to_FINAL
          - entities.PremiumDetermination.fields.tax_year_used
        distinguishing_aspect: |
          Same beneficiary, same coverage_year/part: the provisional variant
          (basis coverage_year-3 = 2024, MAGI 9000000 -> tier 0) yields total
          19000, while the final variant (basis coverage_year-2 = 2025,
          MAGI 15000000 -> tier 2) yields 38000. Entity domain:
          PremiumDetermination — distinct from the PenaltyAssessment domain of
          part_d_lep_aggregate_rounding_half_up.
        test_recipe:
          setup:
            - "Rate schedules for 2026 and 2027 published"
            - "Beneficiary DOB 1960-01-15 (attainment 2025-01, IEP [2024-10, 2025-04])"
            - "PART_B enrollment created at clock 2025-01-10 (IEP month M == T -> effective 2025-02)"
            - "Tax record for 2024 present (MAGI 9000000 SINGLE); tax year 2025 initially ABSENT"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Ann Provisional", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 9000000, filing_status: "SINGLE" }
              as: IrsDataAgent
          trigger:
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_id: $.data.id, det_status_1: $.data.status, det_total_1: $.data.total_premium_cents }
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2025, magi_cents: 15000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "GET /medicare/premium-determinations/${det_id}"
              as: FieldOfficer
              captures: { det_status_2: $.data.status, det_total_2: $.data.total_premium_cents, det_tier_2: $.data.irmaa_tier, det_ty_2: $.data.tax_year_used }
          assert:
            - "trigger[0] response: status == PROVISIONAL, tax_year_used == 2024, irmaa_tier == 0, base_premium_cents == 19000, irmaa_surcharge_cents == 0, lep_cents == 0, total_premium_cents == 19000"
            - "after the 2025 tax record arrives: PremiumDetermination.${det_id}.status == FINAL, tax_year_used == 2025, irmaa_tier == 2, irmaa_surcharge_cents == 19000, total_premium_cents == 38000"
            - "19000 != 38000 for identical (beneficiary, coverage_year, part) — the two variants genuinely diverge"
      - name: part_d_lep_aggregate_rounding_half_up
        grounds:
          - calculations.calc_part_d_lep
          - calculations.calc_lep_gap_months
          - entities.PenaltyAssessment.fields.gap_months
        distinguishing_aspect: |
          Identical inputs (13 uncovered months, 2026 national base 3450) admit
          two defensible roundings of 448.5: half-up-to-dime 450 (PINNED) vs
          truncate-to-dime 440. Entity domain: PenaltyAssessment/Part-D penalty
          — distinct from the PremiumDetermination domain of the other
          dual_variant_calc instance.
        test_recipe:
          setup:
            - "Rate schedule 2026 published (part_d_national_base_cents 3450)"
            - "Beneficiary DOB 1959-11-20 (attainment 2024-11, IEP end 2025-02), no employer coverage"
            - "Clock at 2026-03-10 (GEP season); PART_D enrollment -> effective 2026-04, gap = [2025-03 .. 2026-03] = 13 months"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Dee Ellep", date_of_birth: "1959-11-20" }
              as: FieldOfficer
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 5000000, filing_status: "SINGLE" }
              as: IrsDataAgent
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}/penalties"
              as: FieldOfficer
              captures: { pen_gap: "$.data[0].gap_months", pen_status: "$.data[0].status" }
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2026, part: "PART_D" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_lep: $.data.lep_cents, det_total: $.data.total_premium_cents }
          assert:
            - "PenaltyAssessment gap_months == 13 (span 2025-03..2026-03), status == ACTIVE, full_12month_periods == null (PART_D)"
            - "PremiumDetermination.lep_cents == 450 — round_dime(13 * 0.01 * 3450) = round_dime(448.5) = 450 half-up, NOT 440 (truncate)"
            - "PremiumDetermination.total_premium_cents == 3900 (base 3450 + irmaa 0 + lep 450)"

  - rule_id: combinatorial_formula
    instances:
      - name: iep_coverage_start_four_way_branch
        grounds:
          - calculations.calc_coverage_effective_month
          - calculations.calc_attainment_month
          - entities.CoverageEnrollment.fields.effective_month
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (window type, attainment month T, enrollment
          clock month M) with a 4-way conditional branch. Same attainment
          T = 2026-12: enrolling at M == T yields effective 2027-01 (branch 2),
          while enrolling at M == T+2 yields 2027-05 (branch 4) — branch
          selection, not rounding or evaluation order (contrast with the
          mode-(b) instance).
        test_recipe:
          setup:
            - "Two beneficiaries X and Y, both DOB 1961-12-14 (T = 2026-12, IEP [2026-09, 2027-03])"
            - "X enrolls PART_B at clock 2026-12-10 (M == T); Y enrolls PART_B at clock 2027-02-10 (M == T+2)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "X Branch", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { bx_id: "$.data.id" }
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Y Branch", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { by_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${bx_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${bx_id}"
              captures: { x_eff: "$.data.effective_month", x_via: "$.data.enrolled_via_window" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${by_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${by_id}"
              captures: { y_eff: "$.data.effective_month", y_via: "$.data.enrolled_via_window" }
          assert:
            - "X enrollment: enrolled_via_window == IEP, effective_month == \"2027-01\" (M == T branch: add_months(M, 1))"
            - "Y enrollment: enrolled_via_window == IEP, effective_month == \"2027-05\" (M == T+2 branch: add_months(M, 3))"
            - "identical attainment month, different enrollment months -> 4-month effective-date spread (2027-01 vs 2027-05)"
      - name: part_d_lep_aggregate_vs_per_month_rounding
        grounds:
          - calculations.calc_part_d_lep
          - entities.PremiumDetermination.fields.lep_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the ORDER matters — aggregate-then-
          round gives round_dime(7 x 34.5) = round_dime(241.5) = 240, while
          round-per-month-then-sum gives 7 x round_dime(34.5) = 7 x 30 = 210.
          The scaffold pins aggregate-then-round. Distinct mode from the
          mode-(a) branch-formula instance.
        test_recipe:
          setup:
            - "Rate schedule 2026 (part_d_national_base_cents 3450)"
            - "Beneficiary DOB 1960-05-22 (attainment 2025-05, IEP end 2025-08)"
            - "Clock 2026-03-10 (GEP): PART_D enrollment -> effective 2026-04, gap = [2025-09 .. 2026-03] = 7 months"
            - "Tax record 2024 (MAGI 5000000 SINGLE) for a FINAL 2026 determination"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Dee Seven", date_of_birth: "1960-05-22" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 5000000, filing_status: "SINGLE" }
              as: IrsDataAgent
          trigger:
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2026, part: "PART_D" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_lep: "$.data.lep_cents", det_total: "$.data.total_premium_cents" }
          assert:
            - "PremiumDetermination.lep_cents == 240 — round_dime(7 x 0.01 x 3450) = round_dime(241.5) = 240"
            - "lep_cents != 210 (per-month rounding 7 x 30) and != 241/242 — aggregate-then-round-half-up is the pinned order"
            - "PremiumDetermination.total_premium_cents == 3690 (3450 + 0 + 240)"

  - rule_id: non_linear_state_machine
    instances:
      - name: coverage_enrollment_parallel_status_dimensions
        grounds:
          - state_machines.CoverageEnrollment.enrollment_status
          - state_machines.CoverageEnrollment.collection_status
          - calculations.calc_delinquency
          - entities.CoverageEnrollment.fields.collection_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: after the first past-due invoice,
          enrollment_status stays ACTIVE while collection_status has moved to
          DELINQUENT — the two axes evolve independently on the same row.
          Distinct non-linear shape from the AppealCase review cycle.
        test_recipe:
          setup:
            - "Rate schedule 2026 published"
            - "Beneficiary DOB 1961-04-12 (attainment 2026-04, IEP [2026-01, 2026-07])"
            - "PART_B enrollment created at clock 2026-05-10 -> effective 2026-06 (M == T+1 branch)"
            - "Cycle at 2026-06-15 activates the enrollment (DIRECT_BILL, no arrangement) and issues invoice for 2026-06 (fallback amount 18500, due 2026-06-30)"
            - "Cycle at 2026-07-15 marks invoice 2026-06 PAST_DUE"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Pat Parallel", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
          trigger:
            - call: "GET /medicare/enrollments/${e_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_enroll_status: "$.data.enrollment_status", e_coll_status: "$.data.collection_status" }
          assert:
            - "CoverageEnrollment.${e_id}.enrollment_status == ACTIVE (coverage dimension untouched by billing)"
            - "CoverageEnrollment.${e_id}.collection_status == DELINQUENT (billing dimension moved independently)"
            - "invoices: 2026-06 invoice is PAST_DUE, 2026-07 invoice is ISSUED (GET /medicare/beneficiaries/${b_id}/invoices shows both)"
      - name: appeal_more_info_review_cycle
        grounds:
          - state_machines.AppealCase.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - state_machines.AppealCase.MORE_INFO_REQUESTED_to_UNDER_REVIEW
          - calculations.calc_appeal_redetermination
        distinguishing_aspect: |
          Cyclic machine on AppealCase (UNDER_REVIEW -> MORE_INFO_REQUESTED ->
          UNDER_REVIEW -> APPROVED): a genuine A->B->A loop on a different
          entity than the parallel-dimension CoverageEnrollment instance, and
          approval fans out a supersede cascade on PremiumDetermination.
        test_recipe:
          setup:
            - "Rate schedules 2026 + 2027; beneficiary DOB 1960-01-15; PART_B enrolled 2025-01-10; tax records 2024 (9000000) and 2025 (15000000 SINGLE)"
            - "FINAL determination for 2027/PART_B authored by FieldOfficer 'fo-100': tier 2, total 38000"
            - "Appeal filed by the beneficiary (WORK_STOPPAGE, claimed MAGI 9000000)"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Ann Provisional", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 9000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2025, magi_cents: 15000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_id: "$.data.id" }
            - call: "POST /medicare/appeals"
              payload: { premium_determination_id: "${det_id}", life_event_type: "WORK_STOPPAGE", event_date: "2026-11-02", claimed_magi_cents: 9000000 }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ap_id: "$.data.id", ap_status_0: "$.data.status" }
          trigger:
            - call: "POST /medicare/appeals/${ap_id}/adjudicate"
              payload: { decision: "MORE_INFO_REQUESTED" }
              as: AppealsOfficer
              as_user_id: "ao-200"
              captures: { ap_status_1: "$.data.status" }
            - call: "POST /medicare/appeals/${ap_id}/respond"
              payload: { note: "award letter attached" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ap_status_2: "$.data.status" }
            - call: "POST /medicare/appeals/${ap_id}/adjudicate"
