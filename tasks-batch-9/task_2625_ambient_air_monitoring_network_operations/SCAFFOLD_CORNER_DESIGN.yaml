            - "MonitoringSite.${site_a_id}.version == 2"
            - "MonitoringNetwork.${net_id}.proposed_site_count == 0, approved_site_count == 1, operating_site_count == 0, total_site_count == 1"

      - name: commence_operations_on_a_proposed_site_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MonitoringSite.SITING_APPROVED_to_OPERATING
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "commence-operations declares from SITING_APPROVED only, so invoking it on a PROPOSED site returns ERR_INVALID_STATE 409 and leaves operations_start_at null."
        test_recipe:
          setup:
            - "one PROPOSED site that has never been siting-approved"
          setup_api_calls:
