  # Errors - the catalog rule is "every declared error id must be triggerable".
  # Most ids are already triggered by the instances above and by the §1.8
  # difficulty instances; these three cover the existence family, the
  # left-to-right resolution order and the envelope shape itself.
  # =========================================================================
  - section: errors
    instances:
      - name: every_unknown_path_id_returns_its_own_entity_not_found_error
        claim_type: Error Triggerability
        grounds:
          - "validations[priority 4]"
          - "errors.ERR_ADVERTISER_NOT_FOUND"
          - "errors.ERR_CAMPAIGN_NOT_FOUND"
          - "errors.ERR_ALLOCATION_NOT_FOUND"
          - "errors.ERR_SELLER_NOT_FOUND"
          - "errors.ERR_FORECAST_NOT_FOUND"
          - "errors.ERR_NEGOTIATION_NOT_FOUND"
          - "errors.ERR_BUY_NOT_FOUND"
          - "errors.ERR_BUY_UNIT_NOT_FOUND"
          - "errors.ERR_REPORT_NOT_FOUND"
          - "errors.ERR_MAKE_GOOD_NOT_FOUND"
          - "errors.ERR_RIGHTS_EXERCISE_NOT_FOUND"
          - "errors.ERR_RECONCILIATION_RUN_NOT_FOUND"
          - "errors.ERR_INVOICE_NOT_FOUND"
        distinguishing_aspect: |
          The catalog declares thirteen distinct not-found ids, one per entity, and priority 4 says the
          id reported is the one for the failing path segment. Reading each of the thirteen collections
          with the same unknown uuid must therefore produce thirteen different error_id values, all at
          404. An implementation that collapses the family into a single generic ERR_NOT_FOUND, or that
          returns 200 with a null payload for an unknown id, fails here.
        test_recipe:
          setup:
            - "an empty store; no fixture rows are required to miss on every collection"
          setup_api_calls:
            - call: "GET /upfront/advertisers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/campaigns/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/channel-allocations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/sellers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/inventory-forecasts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/negotiations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/buys/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/buy-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/delivery-reports/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/make-goods/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/rights-exercises/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/reconciliation-runs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
            - call: "GET /upfront/invoices/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AgencyController
              as_user_id: "controller-01"
          trigger:
            - "each of the thirteen reads above is itself the trigger, all with the unknown id 00000000-0000-0000-0000-0000000000ff"
          assert:
            - "every response has status 404, response_type error and a data.error_id"
            - "the advertiser read returns ERR_ADVERTISER_NOT_FOUND"
            - "the campaign read returns ERR_CAMPAIGN_NOT_FOUND"
            - "the channel-allocation read returns ERR_ALLOCATION_NOT_FOUND"
            - "the seller read returns ERR_SELLER_NOT_FOUND"
            - "the inventory-forecast read returns ERR_FORECAST_NOT_FOUND"
            - "the negotiation read returns ERR_NEGOTIATION_NOT_FOUND"
            - "the buy read returns ERR_BUY_NOT_FOUND"
            - "the buy-unit read returns ERR_BUY_UNIT_NOT_FOUND"
            - "the delivery-report read returns ERR_REPORT_NOT_FOUND"
            - "the make-good read returns ERR_MAKE_GOOD_NOT_FOUND"
            - "the rights-exercise read returns ERR_RIGHTS_EXERCISE_NOT_FOUND"
            - "the reconciliation-run read returns ERR_RECONCILIATION_RUN_NOT_FOUND"
            - "the invoice read returns ERR_INVOICE_NOT_FOUND"
            - "the thirteen error_id values are pairwise distinct"

      - name: unknown_body_foreign_keys_are_resolved_in_declared_input_order_and_not_found
        claim_type: Error Triggerability
        grounds:
          - "validations[priority 5]"
          - "endpoints[POST /upfront/negotiations]"
          - "errors.ERR_CAMPAIGN_NOT_FOUND"
          - "errors.ERR_ADVERTISER_NOT_FOUND"
        distinguishing_aspect: |
          Priority 5 pins body foreign keys to the field order declared by the endpoint's input list,
          which for POST /upfront/negotiations is campaign_id, seller_id, channel_allocation_id. With
          all three unknown the reported id must be ERR_CAMPAIGN_NOT_FOUND - not the seller or
          allocation id, and not a merged multi-error payload. The second call proves the same rule for
          a body FK on a different collection.
        test_recipe:
          setup:
            - "no fixture rows; every referenced id is deliberately unknown"
          setup_api_calls: []
          trigger:
            - "POST /upfront/negotiations with campaign_id, seller_id and channel_allocation_id all set to 00000000-0000-0000-0000-0000000000ff as AgencyBuyer"
            - "POST /upfront/campaigns with advertiser_id set to the same unknown id as AgencyPlanner"
          assert:
            - "the negotiation create returns 404 with data.error_id == \"ERR_CAMPAIGN_NOT_FOUND\""
            - "the campaign create returns 404 with data.error_id == \"ERR_ADVERTISER_NOT_FOUND\""
            - "neither response contains a list of errors; data carries exactly error_id and message"
            - "no Negotiation and no Campaign row is created: GET /upfront/negotiations returns meta.total_count == 0"

      - name: the_error_envelope_is_identical_whichever_rule_rejects_the_request
        claim_type: Error Triggerability
        grounds:
          - "response_envelope.error"
          - "errors.ERR_INVALID_REQUEST"
          - "errors.ERR_INVOICE_NOT_FOUND"
          - "errors.ERR_FORECAST_NOT_IN_EXPECTED_STATE"
          - "errors.ERR_ALLOCATION_PCT_SUM_INVALID"
        distinguishing_aspect: |
          Four different rule categories - request shape (400), existence (404), state (409) and
          business constraint (422) - must all serialise the same envelope: meta.api_request_id present,
          response_type exactly "error", and data holding only error_id and message. An implementation
          that returns bare framework errors for 400 (for example a validation array at the top level)
          or that omits response_type on 404 fails, even though each individual status code is right.
        test_recipe:
          setup:
            - "an advertiser, a campaign with one 100.00 percent allocation, and a published avail"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
          trigger:
            - "POST /upfront/advertisers with credit_limit_cents -5 as AgencyController (400)"
            - "GET /upfront/invoices/00000000-0000-0000-0000-0000000000ff as AgencyController (404)"
            - "POST /upfront/inventory-forecasts/${f_id}/publish a second time as SellerRep (409)"
            - "POST /upfront/channel-allocations adding 0.01 percent to a campaign already at 100.00 as AgencyPlanner (422)"
          assert:
            - "the four statuses are 400, 404, 409 and 422 in that order"
            - "the four error_id values are ERR_INVALID_REQUEST, ERR_INVOICE_NOT_FOUND, ERR_FORECAST_NOT_IN_EXPECTED_STATE and ERR_ALLOCATION_PCT_SUM_INVALID"
            - "all four responses carry response_type == \"error\""
            - "all four responses carry a non-empty meta.api_request_id and meta.api_request_timestamp"
            - "in all four responses data has exactly the keys error_id and message"

  # =========================================================================
  # RBAC - per-role allow and deny plus the segregation-of-duties rule.
  # =========================================================================
  - section: rbac
    instances:
      - name: a_request_without_a_declared_role_header_is_unauthenticated_and_rejected
        claim_type: Role Denied
        grounds:
          - "roles"
          - "validations[priority 1]"
          - "errors.ERR_UNAUTHENTICATED"
        distinguishing_aspect: |
          Authentication is checked before anything else (priority 1), so a request with no X-User-Role,
          a request with no X-User-ID and a request naming a role outside the declared six must all be
          401 ERR_UNAUTHENTICATED - not 403, and not 400 for the malformed body they also carry. An
          implementation that defaults a missing role to a permissive one, or that validates the body
          first, fails.
        test_recipe:
          setup:
            - "an empty store; the request never reaches a handler"
          setup_api_calls: []
          trigger:
            - "POST /upfront/advertisers with a valid body but no X-User-Role header"
            - "POST /upfront/advertisers with X-User-Role AgencyController but no X-User-ID header"
            - "POST /upfront/advertisers with X-User-Role AgencyIntern, a role outside the declared six"
            - "GET /upfront/advertisers with no X-User-Role header"
          assert:
            - "all four responses are 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "all four carry response_type == \"error\""
            - "no Advertiser row is created: a later authenticated GET /upfront/advertisers returns meta.total_count == 0"

      - name: a_seller_rep_cannot_place_a_buy_reserved_to_the_agency_buyer
        claim_type: Role Denied
        grounds:
          - "roles.AgencyBuyer.exclusive_operations"
          - "roles.SellerRep"
          - "endpoints[POST /upfront/buys/{buyId}/place]"
          - "errors.ERR_ROLE_NOT_PERMITTED"
        distinguishing_aspect: |
          Placement is an AgencyBuyer exclusive, and the seller is the counterparty with the strongest
          incentive to force it: a SellerRep who owns the avail behind every unit of the buy must still
          be refused with 403 ERR_ROLE_NOT_PERMITTED, and the refusal must leave no partial cascade -
          the buy stays PENDING_PLACEMENT and Campaign.version stays where the buyer last read it.
        test_recipe:
          setup:
            - "a fully covered buy ready for placement, with the seller owning its only avail"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "POST /upfront/campaigns/${c_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/campaigns/${c_id}/approve-plan"
              payload: {}
              as: AdvertiserClient
              as_user_id: "${adv_id}"
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c_id}", seller_id: "${sel_id}", channel_allocation_id: "${al_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 1000000, opening_cpm_cents: 2000, guarantee_pct: 100, make_good_provision: "MAKE_GOOD_UNITS", option_pct_ceiling: 25 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n_id: $.data.id, n_v1: $.data.version }
            - call: "POST /upfront/negotiations/${n_id}/counter"
              payload: { expected_negotiation_version: "${n_v1}", counter_cpm_cents: 2200, counter_impressions: 1000000 }
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations/${n_id}/accept"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { b_id: $.data.id }
            - call: "POST /upfront/buys/${b_id}/units"
              payload: { forecast_id: "${f_id}", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", units: 1, unit_rate_cents: 2200000, projected_impressions: 1000000, air_window_start: "2026-11-02T00:00:00Z", air_window_end: "2026-11-30T23:59:59Z", exclusive: false }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { u_id: $.data.id }
            - call: "GET /upfront/campaigns/${c_id}"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { c_v: $.data.version }
          trigger:
            - "POST /upfront/buys/${b_id}/place with expected_campaign_version ${c_v} as SellerRep acting as ${sel_id}"
          assert:
            - "status 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /upfront/buys/${b_id} shows buy_status == \"PENDING_PLACEMENT\" and placed_by_user_id == null"
            - "GET /upfront/campaigns/${c_id} shows version == 4, committed_gross_cents == 0 and uncommitted_budget_cents == 10000000"
            - "GET /upfront/channel-allocations/${al_id} shows committed_cents == 0 and posture WITHIN_PLAN"
            - "the same call repeated as AgencyBuyer returns 200 with buy_status PLACED"

      - name: a_foreign_seller_rep_cannot_publish_another_sellers_avail
        claim_type: Role Denied
        grounds:
          - "roles.SellerRep.identity"
          - "validations[priority 6]"
          - "endpoints[POST /upfront/inventory-forecasts/{forecastId}/publish]"
          - "errors.ERR_NOT_RESOURCE_OWNER"
        distinguishing_aspect: |
          SellerRep is entity_backed:Seller, so the role check passes and the ownership check must still
          fail: a second seller's rep carrying the right role but the wrong X-User-ID gets 403
          ERR_NOT_RESOURCE_OWNER, distinct from the 403 ERR_ROLE_NOT_PERMITTED a non-seller role would
          get. The avail stays DRAFT at version 1, and the owner's identical call then succeeds.
        test_recipe:
          setup:
            - "two sellers, with a DRAFT avail filed by the first"
          setup_api_calls:
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Summit Cable", platform_types: ["CTV"], make_good_capacity_impressions: 20000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel2_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
          trigger:
            - "POST /upfront/inventory-forecasts/${f_id}/publish as SellerRep acting as ${sel2_id}"
          assert:
            - "status 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\""
            - "GET /upfront/inventory-forecasts/${f_id} shows status == \"DRAFT\" and version == 1"
            - "the same publish call as SellerRep acting as ${sel_id} returns 200 with status PUBLISHED and version 2"
            - "the same publish call as AgencyController returns 403 ERR_ROLE_NOT_PERMITTED, a different id from the ownership failure"

      - name: reconciliation_is_shared_by_planner_and_controller_and_closed_to_the_buyer
        claim_type: Role Allowed
        grounds:
          - "roles.AgencyPlanner.shared_operations"
          - "roles.AgencyController.shared_operations"
          - "endpoints[POST /upfront/reconciliation-runs]"
          - "errors.ERR_ROLE_NOT_PERMITTED"
        distinguishing_aspect: |
          Cross-platform reconciliation is the one mutation shared by two roles, so both AgencyPlanner
          and AgencyController must be able to create a run (each producing its own immutable row),
          while AgencyBuyer - who may steward delivery and accept reports - is refused. An
          implementation that hard-codes a single owning role for the endpoint fails one of the three.
        test_recipe:
          setup:
            - "an advertiser and a campaign with no accepted delivery, so each run completes with no data"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
          trigger:
            - "POST /upfront/reconciliation-runs for ${c_id} with dedup_method AGGREGATE_DEDUP and aggregate_duplication_pct 10.00 as AgencyPlanner"
            - "the same body as AgencyController"
            - "the same body as AgencyBuyer"
          assert:
            - "the planner run returns 201 with status == \"COMPLETED_NO_DATA\""
            - "the controller run returns 201 with status == \"COMPLETED_NO_DATA\""
            - "the buyer run returns 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /upfront/reconciliation-runs?campaign_id=${c_id} returns meta.total_count == 2 with two distinct ids"

      - name: a_measurement_provider_cannot_accept_the_delivery_it_filed
        claim_type: Role Denied
        grounds:
          - "roles.MeasurementProvider.shared_operations"
          - "roles.AgencyBuyer.exclusive_operations"
          - "endpoints[POST /upfront/delivery-reports/{deliveryReportId}/accept]"
          - "errors.ERR_ROLE_NOT_PERMITTED"
        distinguishing_aspect: |
          Filing delivery is shared between SellerRep and MeasurementProvider, but acceptance is an
          AgencyBuyer exclusive: the vendor that filed the numbers cannot also bless them. The report
          must therefore still be SUBMITTED after the refusal, with the buy still PLACED and its FINAL
          delivery index still 0.0000, and only the buyer's call may move it.
        test_recipe:
          setup:
            - "a placed buy with one SUBMITTED report filed by the measurement vendor"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "POST /upfront/campaigns/${c_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/campaigns/${c_id}/approve-plan"
              payload: {}
              as: AdvertiserClient
