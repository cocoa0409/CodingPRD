              payload: {}
              as: ChannelManager
              captures: { dist2_v: $.data.version }
          trigger:
            - call: "POST /brand-ops/distributors/${dist2_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: false, starts_on: "2026-09-01", ends_on: "2027-08-31", annual_quota_units: 200, expected_distributor_version: "${dist2_v}" }
              as: ChannelManager
              captures: { p2_id: $.data.id, p2_sup: $.data.supersedes_assignment_id }
            - call: "GET /brand-ops/coverage-assignments/${p1_id}"
              payload: {}
              as: ChannelManager
              captures: { p1_status: $.data.status }
          assert:
            - "the second create returns 201 and its supersedes_assignment_id == ${p1_id}"
            - "CoverageAssignment.${p1_id}.status == SUPERSEDED"
            - "Distributor.${dist_id} was version-bumped by its own proposal; the supersede of P1 by D2's proposal is a cell-level rule, not a write conflict"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: use_case_reject_and_retract_paths
        claim_type: valid_transition
        grounds:
          - state_machines.UseCaseSubmission.SUBMITTED_to_REJECTED
          - state_machines.UseCaseSubmission.PUBLISHED_to_RETRACTED
          - calculations.genericization_risk
        distinguishing_aspect: "The two terminal exits behave differently: a REJECTED submission never touches genericization risk, while a RETRACTED one first contributed and then returns its contribution to zero."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand with LAUNCHED core line."
          setup_api_calls:
            - *k_brand
            - *k_market
            - *k_mfr1
            - *k_mfr1q
            - *k_mfr2
            - *k_mfr2q
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_g1
            - *k_g1g
            - *k_g1a
            - *k_g2
            - *k_g2g
            - *k_g2a
            - *k_review
            - *k_pack
            - *k_tool
            - *k_price
            - *k_enterprod
            - *k_launch
            - call: "POST /brand-ops/product-lines/${line_id}/use-cases"
              payload: { submitter_ref: "consumer-1", title: "Weak use", description: "Marginal application." }
              as: Consumer
              as_user_id: "consumer-1"
              captures: { uc1: $.data.id }
            - call: "POST /brand-ops/product-lines/${line_id}/use-cases"
              payload: { submitter_ref: "consumer-2", title: "Generic mention", description: "Used the brand as a noun." }
              as: Consumer
              as_user_id: "consumer-2"
              captures: { uc2: $.data.id }
          trigger:
            - call: "POST /brand-ops/use-cases/${uc1}/review"
              payload: { decision: "REJECT", generic_use_flag: false }
              as: MarketingManager
              captures: { uc1_status: $.data.status }
            - call: "POST /brand-ops/use-cases/${uc2}/review"
              payload: { decision: "VERIFY", generic_use_flag: true }
              as: MarketingManager
            - call: "POST /brand-ops/use-cases/${uc2}/publish"
              payload: {}
              as: MarketingManager
            - call: "GET /brand-ops/brands/${brand_id}"
              payload: {}
              as: MarketingManager
              captures: { risk_mid: $.data.genericization_risk_bps }
            - call: "POST /brand-ops/use-cases/${uc2}/retract"
              payload: {}
              as: MarketingManager
              captures: { uc2_status: $.data.status }
            - call: "GET /brand-ops/brands/${brand_id}"
              payload: {}
              as: MarketingManager
              captures: { risk_end: $.data.genericization_risk_bps }
          assert:
            - "uc1 review with decision REJECT lands in REJECTED and never contributes to risk"
            - "uc2 published flagged: risk == 100"
            - "uc2 retracted: status RETRACTED and risk returns to exactly 0"

