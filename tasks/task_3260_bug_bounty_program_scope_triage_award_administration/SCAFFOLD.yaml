scenario: |
  Bug Bounty Program Scope, Triage & Award Administration (HackerOne): program setup
  with asset scope definitions, out-of-scope exclusions and safe harbor terms for
  researchers, submission intake with duplicate detection, reproduction verification
  and severity scoring, triage service levels with initial response, validation and
  resolution targets communicated to researchers, bounty tables by severity and asset
  criticality with bonus and retest awards, disclosure policy governing when a report
  may be published and coordinated timelines, researcher reputation, invitation-only
  program access and code of conduct enforcement, payment processing with tax
  documentation and sanctioned-country restrictions, vulnerability remediation
  tracking back into the customer's engineering workflow.

domain_name: bug-bounty-admin
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: visibility, type: enum, source: input, default: PUBLIC, constraints: "PUBLIC | PRIVATE", description: "PRIVATE = invitation-only; only researchers holding an ACCEPTED invitation may submit" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | ACTIVE | PAUSED | CLOSED", description: "Program lifecycle posture" }
      - { name: min_reputation, type: integer, source: input, description: "Minimum researcher reputation_lifetime required for invitation issuance" }
      - { name: response_sla_hours, type: integer, source: input, description: "Hours from report submission to first triage response" }
      - { name: resolution_sla_days, type: integer, source: input, description: "Days from validation to resolution (remediation VERIFIED)" }
      - { name: disclosure_window_days, type: integer, source: input, description: "Days after resolution before a report may be published" }
      - { name: first_report_bonus_pct, type: number, source: input, default: 0.10, description: "Bonus fraction of raw bounty when report is researcher's first VALIDATED report in this program" }
      - { name: retest_award_cents, type: integer, source: input, default: 50000, description: "Flat retest award amount" }
      - { name: bonus_cap_cents, type: integer, source: input, default: 100000, description: "Maximum discretionary BONUS award amount" }
      - { name: exposure_modifier, type: number, source: input, default: 1.0, description: "Program-wide environmental severity multiplier" }
      - { name: bounty_pool_cents, type: integer, source: input, description: "Total bounty budget; may be raised (never below reserved+paid) via PATCH" }
      - { name: bounty_reserved_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents of Awards in APPROVED or BLOCKED status" }
      - { name: bounty_paid_cents, type: integer, source: computed, default: 0, description: "Sum of gross amount_cents of Awards in PAID status" }
      - { name: total_withheld_cents, type: integer, source: computed, default: 0, description: "Sum of per-award withheld_cents across PAID awards (each award rounded individually)" }
      - { name: available_pool_cents, type: integer, source: computed, description: "bounty_pool_cents - bounty_reserved_cents - bounty_paid_cents" }
      - { name: blackout_windows, type: array, source: input, default: [], description: "Array of {starts_at, ends_at} closed-interval ISO8601 windows during which disclosure publication is forbidden; pairwise non-overlapping with >= 3600s gap between any two windows" }

  - name: ScopeAsset
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Asset display name" }
      - { name: asset_identifier, type: string, source: input, description: "Domain, CIDR, package name, etc." }
      - { name: criticality, type: enum, source: input, constraints: "CRITICAL | HIGH | MEDIUM | LOW", description: "Asset criticality driving the bounty multiplier and environmental severity factor" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | RETIRED", description: "RETIRED assets reject new submissions (out of scope)" }

  - name: ScopeVersion
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Half-open interval end (exclusive); null = open-ended" }
      - { name: in_scope_asset_ids, type: array, source: input, description: "Array of ScopeAsset.id values in scope for this version; assets not listed are out-of-scope exclusions" }
      - { name: safe_harbor_text, type: string, source: input, description: "Safe harbor terms communicated to researchers for this scope window" }
      - { name: version_seq, type: integer, source: system, description: "Per-program monotonically increasing sequence assigned at creation" }

  - name: Researcher
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Unique researcher handle" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 residence country; sanctioned set {KP, IR, CU, SY} blocks payment" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUSPENDED | BANNED", description: "Conduct standing" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "Count of unreversed STRIKE conduct actions" }
      - { name: suspension_ends_at, type: datetime, source: computed, description: "Set when SUSPENDED: last strike time + 14 days * strike_count; null otherwise" }
      - { name: reputation_lifetime, type: integer, source: computed, default: 100, description: "100 + sum of all unreversed report/conduct deltas, floor 0" }
      - { name: reputation_rolling180, type: integer, source: computed, default: 100, description: "100 + sum of unreversed deltas with occurred_at >= now - 180 days (boundary inclusive), floor 0" }
      - { name: tier, type: enum, source: computed, constraints: "NOVICE | ESTABLISHED | ELITE", description: "From reputation_rolling180: ELITE >= 500, ESTABLISHED >= 250, else NOVICE (thresholds inclusive)" }
      - { name: tax_document_status, type: enum, source: system, constraints: "MISSING | SUBMITTED | VERIFIED", default: MISSING, description: "Tax documentation state" }
      - { name: tax_document_type, type: string, source: system, description: "W9 | W8BEN | other; null until submitted" }
      - { name: conduct_log, type: array, source: system, default: [], description: "Append-only list of {seq, action, reason, applied_at, reversed} conduct events; REVERSE_LAST sets reversed=true on the latest unreversed entry" }

  - name: ProgramInvitation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: researcher_id, type: string, source: input, description: "FK -> Researcher.id" }
      - { name: status, type: enum, source: system, constraints: "PENDING | ACCEPTED | DECLINED | EXPIRED", description: "Invitation lifecycle" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time of issuance" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 7 days; clock sweep flips PENDING -> EXPIRED when now > expires_at" }
      - { name: reputation_at_issue, type: integer, source: system, description: "Snapshot of researcher reputation_lifetime at issuance" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> ScopeAsset.id" }
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; set from X-User-ID of the submitting Researcher" }
      - { name: duplicate_of_id, type: string, source: system, description: "FK -> Report.id; self-referential duplicate anchor, null unless DUPLICATE" }
      - { name: scope_version_id, type: string, source: system, description: "FK -> ScopeVersion.id; scope version pinned at submission (effective_from <= submitted_at < effective_to)" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: description, type: string, source: input, description: "Reproduction steps and impact narrative" }
      - { name: vulnerability_class, type: enum, source: input, constraints: "XSS | SQLI | CSRF | SSRF | AUTHZ | RCE | OTHER", description: "Vulnerability category used for duplicate matching" }
      - { name: status, type: enum, source: system, constraints: "NEW | TRIAGED | NEEDS_INFO | VALIDATED | RESOLVED | DUPLICATE | NOT_APPLICABLE | INFORMATIVE", description: "Report lifecycle" }
      - { name: impact, type: integer, source: system, description: "Validation input 0-10, null until validated" }
      - { name: exploitability, type: integer, source: system, description: "Validation input 0-10, null until validated" }
      - { name: affected_scope, type: integer, source: system, description: "Validation input 0-10, null until validated" }
      - { name: severity_score_base, type: number, source: computed, description: "Unweighted-environment base score, 1 decimal" }
      - { name: severity_score_adjusted, type: number, source: computed, description: "Environmentally adjusted score, 1 decimal" }
      - { name: severity_final, type: enum, source: computed, constraints: "NONE | LOW | MEDIUM | HIGH | CRITICAL", description: "Band of severity_score_adjusted" }
      - { name: tier_at_validation, type: enum, source: system, constraints: "NOVICE | ESTABLISHED | ELITE", description: "Researcher tier snapshot taken at validation time; bounty math reads this snapshot" }
      - { name: is_first_validated_report, type: boolean, source: system, description: "True iff no prior VALIDATED/RESOLVED report by this researcher in this program existed at validation time" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock submission time" }
      - { name: first_response_at, type: datetime, source: system, description: "First triage action time; null until first triage" }
      - { name: triaged_at, type: datetime, source: system, description: "Time of latest triage transition" }
      - { name: validated_at, type: datetime, source: system, description: "Validation time" }
      - { name: resolved_at, type: datetime, source: system, description: "Set when cascaded to RESOLVED by remediation verification" }
      - { name: response_due_at, type: datetime, source: computed, description: "submitted_at + program.response_sla_hours" }
      - { name: resolution_due_at, type: datetime, source: computed, description: "validated_at + program.resolution_sla_days; null until validated" }
      - { name: response_breached, type: boolean, source: computed, description: "first_response_at == null ? now > response_due_at : first_response_at > response_due_at (strictly greater; at exact deadline not breached)" }
      - { name: resolution_breached, type: boolean, source: computed, description: "resolved_at == null ? now > resolution_due_at : resolved_at > resolution_due_at (strictly greater)" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> Report.id" }
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; denormalized from report at creation" }
      - { name: award_type, type: enum, source: input, constraints: "BOUNTY | BONUS | RETEST", description: "BOUNTY computed from severity/criticality; BONUS discretionary input amount; RETEST flat program.retest_award_cents" }
      - { name: status, type: enum, source: system, constraints: "PROPOSED | APPROVED | BLOCKED | PAID | VOID", description: "Award lifecycle" }
      - { name: amount_cents, type: integer, source: computed, description: "BOUNTY: computed and pool-capped at creation; BONUS: echo of input; RETEST: program.retest_award_cents snapshot" }
      - { name: capped_by_pool, type: boolean, source: computed, default: false, description: "True when the BOUNTY pool cap reduced the amount below raw+bonus" }
      - { name: block_reason, type: enum, source: system, constraints: "SANCTIONED_COUNTRY | TAX_DOCUMENT", description: "Set when APPROVED -> BLOCKED; null otherwise" }
      - { name: withheld_cents, type: integer, source: computed, default: 0, description: "Per-award withholding, round_half_up(amount_cents * rate) computed at pay time" }
      - { name: net_paid_cents, type: integer, source: computed, default: 0, description: "amount_cents - withheld_cents, set at pay time" }
      - { name: proposed_at, type: datetime, source: system, description: "Creation time" }
      - { name: approved_at, type: datetime, source: system, description: "Approval time" }
      - { name: paid_at, type: datetime, source: system, description: "Payment time" }

  - name: DisclosureRequest
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> Report.id" }
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; denormalized from report" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | UNDER_NEGOTIATION | AGREED | PUBLISHED | DENIED", description: "Coordinated disclosure lifecycle" }
      - { name: proposed_publish_at, type: datetime, source: input, description: "Researcher's requested publication time" }
      - { name: agreed_publish_at, type: datetime, source: system, description: "Set on AGREE (defaults to latest proposed); publication allowed only when now >= agreed_publish_at" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Increments per COUNTER; COUNTER rejected when negotiation_round == 3" }

  - name: RemediationTicket
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> Report.id; report must be VALIDATED" }
      - { name: external_ref, type: string, source: input, description: "Reference into the customer's engineering tracker (e.g. JIRA key)" }
      - { name: status, type: enum, source: system, constraints: "OPEN | IN_PROGRESS | FIXED | VERIFIED | WONT_FIX", description: "Engineering remediation lifecycle" }
      - { name: due_at, type: datetime, source: system, description: "created_at + program.resolution_sla_days" }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFY" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "At least one ScopeVersion with effective_from <= now AND (effective_to IS NULL OR now < effective_to)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "At least one ScopeVersion effective at now"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/programs/{id}/pause"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "New report submissions rejected with ERR_PROGRAM_NOT_ACTIVE while PAUSED"
      - from: [DRAFT, ACTIVE, PAUSED]
        to: CLOSED
        trigger: "POST /api/programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "No Report in NEW, TRIAGED, NEEDS_INFO, or VALIDATED"
          - "No Award in PROPOSED, APPROVED, or BLOCKED"
        side_effects:
          - "All PENDING ProgramInvitations for this program -> DECLINED"
  - entity: Report
    initial_state: NEW
    terminal_states: [RESOLVED, NOT_APPLICABLE, INFORMATIVE]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /api/reports/{id}/triage with action=TRIAGE"
        actor: Triager
        preconditions: []
        side_effects:
          - "first_response_at set if null; triaged_at set"
      - from: TRIAGED
        to: NEEDS_INFO
        trigger: "POST /api/reports/{id}/triage with action=REQUEST_INFO"
        actor: Triager
        preconditions: []
        side_effects: ["triaged_at set"]
      - from: NEEDS_INFO
        to: TRIAGED
        trigger: "POST /api/reports/{id}/provide-info"
        actor: Researcher
        preconditions:
          - "X-User-ID == report.researcher_id"
        side_effects: ["triaged_at set"]
      - from: [NEW, TRIAGED, NEEDS_INFO, VALIDATED]
        to: DUPLICATE
        trigger: "POST /api/reports/{id}/triage with action=MARK_DUPLICATE"
        actor: Triager
        preconditions:
          - "duplicate_of_id references a Report in the same program with same vulnerability_class, status VALIDATED or RESOLVED, and id != this report"
        side_effects:
          - "duplicate_of_id set; researcher reputation delta -10 applied (lifetime and rolling180)"
      - from: [DUPLICATE, NOT_APPLICABLE]
        to: TRIAGED
        trigger: "POST /api/reports/{id}/triage with action=REOPEN"
        actor: Triager
        preconditions: []
        side_effects:
          - "duplicate_of_id cleared to null"
          - "Compensation: if prior state was DUPLICATE, +10 reputation restores the -10; if NOT_APPLICABLE, +15 restores the -15"
      - from: [NEW, TRIAGED, NEEDS_INFO]
        to: NOT_APPLICABLE
        trigger: "POST /api/reports/{id}/triage with action=MARK_NOT_APPLICABLE"
        actor: Triager
        preconditions: []
        side_effects:
          - "first_response_at set if null; researcher reputation delta -15"
      - from: [NEW, TRIAGED]
        to: INFORMATIVE
        trigger: "POST /api/reports/{id}/triage with action=MARK_INFORMATIVE"
        actor: Triager
        preconditions: []
        side_effects:
          - "first_response_at set if null; researcher reputation delta +2"
      - from: TRIAGED
        to: VALIDATED
        trigger: "POST /api/reports/{id}/validate"
        actor: Triager
        preconditions: []
        side_effects:
          - "severity_score_base / severity_score_adjusted / severity_final computed (calculation severity_score)"
          - "tier_at_validation snapshot of researcher.tier; is_first_validated_report snapshot"
          - "validated_at set; resolution_due_at = validated_at + program.resolution_sla_days"
      - from: VALIDATED
        to: RESOLVED
        trigger: "system (RemediationTicket transition action=VERIFY on a ticket whose report_id == this report)"
        actor: system
        preconditions:
          - "Report still VALIDATED at ticket VERIFY time"
        side_effects:
          - "resolved_at = now"
          - "Researcher reputation delta by severity_final: CRITICAL +100, HIGH +50, MEDIUM +20, LOW +5, NONE +0 (lifetime and rolling180); tier recomputed"

  - entity: Researcher
    initial_state: ACTIVE
    terminal_states: [BANNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (POST /api/researchers/{id}/conduct-actions with action=STRIKE brings unreversed strike_count to exactly 2)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_ends_at = now + 14 days * strike_count"
          - "All PENDING ProgramInvitations for this researcher -> DECLINED (cascade hop 2)"
      - from: [ACTIVE, SUSPENDED]
        to: BANNED
        trigger: "system (conduct action=BAN, or STRIKE brings unreversed strike_count to >= 3)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING ProgramInvitations for this researcher -> DECLINED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (clock sweep: now >= suspension_ends_at, OR conduct REVERSE_LAST drops unreversed strike_count below 2 with no unreversed BAN)"
        actor: system
        preconditions: []
        side_effects: ["suspension_ends_at cleared to null"]

  - entity: Award
    initial_state: PROPOSED
    terminal_states: [PAID, VOID]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/awards/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "program.bounty_reserved_cents + amount_cents <= program.bounty_pool_cents - program.bounty_paid_cents (else ERR_POOL_EXHAUSTED)"
        side_effects:
          - "program.bounty_reserved_cents += amount_cents; available_pool_cents recomputed"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/awards/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "researcher.country_code not in {KP, IR, CU, SY}"
          - "NOT (researcher.tax_document_status == MISSING AND amount_cents >= 60000)"
        side_effects:
          - "withheld_cents = round_half_up(amount_cents * withholding_rate); net_paid_cents = amount_cents - withheld_cents"
          - "program.bounty_reserved_cents -= amount_cents; bounty_paid_cents += amount_cents; total_withheld_cents += withheld_cents"
      - from: APPROVED
        to: BLOCKED
        trigger: "POST /api/awards/{id}/pay when a blocking precondition fails"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "block_reason = SANCTIONED_COUNTRY (researcher sanctioned) or TAX_DOCUMENT (MISSING and amount >= 60000); reservation retained; error returned to caller"
      - from: BLOCKED
        to: PAID
        trigger: "POST /api/awards/{id}/pay (retry)"
        actor: PlatformAdmin
        preconditions:
          - "block_reason == TAX_DOCUMENT"
          - "researcher.tax_document_status in {SUBMITTED, VERIFIED} at retry time"
        side_effects:
          - "Same ledger effects as APPROVED -> PAID; block_reason cleared"
      - from: [PROPOSED, APPROVED]
        to: VOID
        trigger: "POST /api/awards/{id}/void"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "If prior state APPROVED: program.bounty_reserved_cents -= amount_cents (compensation)"

  - entity: DisclosureRequest
    initial_state: REQUESTED
    terminal_states: [PUBLISHED, DENIED]
    transitions:
      - from: [REQUESTED, UNDER_NEGOTIATION]
        to: UNDER_NEGOTIATION
        trigger: "POST /api/disclosure-requests/{id}/respond with decision=COUNTER"
        actor: "Researcher (owner) or ProgramAdmin"
        preconditions:
          - "negotiation_round < 3 (else ERR_NEGOTIATION_EXHAUSTED)"
        side_effects: ["negotiation_round += 1"]
      - from: [REQUESTED, UNDER_NEGOTIATION]
        to: AGREED
        trigger: "POST /api/disclosure-requests/{id}/respond with decision=AGREE"
        actor: "Researcher (owner) or ProgramAdmin"
        preconditions: []
        side_effects: ["agreed_publish_at set (payload agreed_publish_at, else latest proposed_publish_at)"]
      - from: [REQUESTED, UNDER_NEGOTIATION]
        to: DENIED
        trigger: "POST /api/disclosure-requests/{id}/respond with decision=DENY"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: AGREED
        to: PUBLISHED
        trigger: "POST /api/disclosure-requests/{id}/respond with decision=PUBLISH"
        actor: ProgramAdmin
        preconditions:
          - "report.status == RESOLVED"
          - "now >= agreed_publish_at AND now >= report.resolved_at + program.disclosure_window_days (else ERR_DISCLOSURE_TOO_EARLY)"
          - "No blackout window with starts_at <= now <= ends_at (closed interval) on the program (else ERR_BLACKOUT_ACTIVE)"
        side_effects: []

  - entity: RemediationTicket
    initial_state: OPEN
    terminal_states: [VERIFIED, WONT_FIX]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /api/remediation-tickets/{id}/transition with action=START"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: [IN_PROGRESS, FIXED]
        to: FIXED
        trigger: "POST /api/remediation-tickets/{id}/transition with action=FIX (from IN_PROGRESS) or action=REOPEN rejected; REOPEN maps FIXED -> IN_PROGRESS"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: FIXED
        to: IN_PROGRESS
        trigger: "POST /api/remediation-tickets/{id}/transition with action=REOPEN"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: FIXED
        to: VERIFIED
        trigger: "POST /api/remediation-tickets/{id}/transition with action=VERIFY"
        actor: ProgramAdmin
        preconditions:
          - "ticket.report.status == VALIDATED (else ERR_INVALID_STATE)"
        side_effects:
          - "verified_at set"
          - "Cascade hop 1: Report VALIDATED -> RESOLVED (resolved_at set)"
          - "Cascade hop 2: Researcher reputation delta by severity_final applied; hop 3: tier recomputed"
      - from: [OPEN, IN_PROGRESS]
        to: WONT_FIX
        trigger: "POST /api/remediation-tickets/{id}/transition with action=WONT_FIX"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: ProgramInvitation
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /api/invitations/{id}/respond with decision=ACCEPT"
        actor: Researcher
        preconditions:
          - "X-User-ID == invitation.researcher_id"
          - "now <= expires_at (else ERR_INVITATION_EXPIRED)"
        side_effects: []
      - from: PENDING
        to: DECLINED
        trigger: "POST /api/invitations/{id}/respond with decision=DECLINE, or system (researcher suspended/banned, or program closed)"
        actor: "Researcher or system"
        preconditions: []
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (clock sweep: now > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScopeAsset
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/assets/{id}/retire"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "New submissions referencing this asset rejected with ERR_OUT_OF_SCOPE; pinned scope versions unaffected for existing reports"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-patch-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /api/programs/{program_id}"
    occ_field: expected_program_version
    description: |
      Updating a Program whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just modified the program's bounty policy, SLA targets, or blackout
      windows and the current writer's view of the program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: severity_score
    trigger: "POST /api/reports/{id}/validate"
    algorithm: weighted_scoring
    formula: |
      base = 0.5 * impact + 0.3 * exploitability + 0.2 * affected_scope
      severity_score_base = round_half_up(base, 1 decimal)
      severity_score_adjusted = round_half_up(severity_score_base * ENV_FACTOR[asset.criticality] * program.exposure_modifier, 1 decimal)
      severity_final = band(severity_score_adjusted):
        CRITICAL if adjusted >= 9.0; HIGH if >= 7.0; MEDIUM if >= 4.0; LOW if >= 0.1; NONE if == 0.0
      Both variants are stored; severity_final derives from the environmental variant only.
    input_set: "Report.impact/exploitability/affected_scope (0-10 ints), ScopeAsset.criticality, Program.exposure_modifier"
    constants:
      ENV_FACTOR_CRITICAL: 1.2
      ENV_FACTOR_HIGH: 1.1
      ENV_FACTOR_MEDIUM: 1.0
      ENV_FACTOR_LOW: 0.8
    precision: "1 decimal place, round_half_up"
    variants:
      - name: raw_base
        when: "stored on severity_score_base; reported to researchers as the unadjusted CVSS-like base"
        difference: "No environmental factor; may band lower than severity_final (e.g. 7.9 HIGH vs 9.5 CRITICAL)"
      - name: environmental
        when: "stored on severity_score_adjusted; drives severity_final and therefore bounty tier"
        difference: "Multiplies base by asset criticality factor and program exposure_modifier"

  - name: bounty_amount
    trigger: "POST /api/awards with award_type=BOUNTY"
    algorithm: tiered_pricing
    formula: |
      raw = SEVERITY_BASE[report.severity_final] * CRIT_MULT[asset.criticality]
      combined_pct = (report.is_first_validated_report ? program.first_report_bonus_pct : 0) + TIER_BONUS[report.tier_at_validation]
      bonus = round_half_up(raw * combined_pct, 0 decimals)
      uncapped = raw + bonus
      available = program.bounty_pool_cents - program.bounty_reserved_cents - program.bounty_paid_cents
      amount_cents = min(uncapped, available); capped_by_pool = (amount_cents < uncapped)
    input_set: "Report severity_final, is_first_validated_report, tier_at_validation; ScopeAsset.criticality; Program bounty config; pool ledger"
    constants:
      SEVERITY_BASE_CRITICAL: 1000000
      SEVERITY_BASE_HIGH: 500000
      SEVERITY_BASE_MEDIUM: 150000
      SEVERITY_BASE_LOW: 30000
      SEVERITY_BASE_NONE: 0
      CRIT_MULT_CRITICAL: 2.0
      CRIT_MULT_HIGH: 1.5
      CRIT_MULT_MEDIUM: 1.0
      CRIT_MULT_LOW: 0.5
      TIER_BONUS_NOVICE: 0.0
      TIER_BONUS_ESTABLISHED: 0.10
      TIER_BONUS_ELITE: 0.25
    precision: "integer cents, round_half_up"
    note: "Combinatorial: >= 3 inputs with non-linear interaction (severity tier x criticality multiplier x additive first-report+tier bonus x nested min against remaining pool)"

  - name: withholding_amount
    trigger: "POST /api/awards/{id}/pay (successful path)"
    algorithm: aggregation
    formula: |
      rate = 0.00 if researcher.tax_document_status == VERIFIED and researcher.country_code == "US"
           = 0.30 if researcher.tax_document_status == VERIFIED and researcher.country_code != "US"
           = 0.24 if researcher.tax_document_status in {SUBMITTED} OR (MISSING and amount_cents < 60000)
      withheld_cents = round_half_up(amount_cents * rate, 0 decimals)   # ROUNDING ORDER PINNED: per-award
      net_paid_cents = amount_cents - withheld_cents
      program.total_withheld_cents = SUM of per-award withheld_cents over PAID awards
      # Explicitly NOT round_half_up(sum(amount_cents) * rate): per-award rounding then summation
      # differs from aggregate rounding (e.g. 10101 + 10202 @0.24 -> 2424 + 2448 = 4872 per-award
      # vs round(20303 * 0.24) = 4873 aggregate).
    input_set: "Award.amount_cents; Researcher.tax_document_status, country_code"
    constants:
      RATE_BACKUP_WITHHOLDING: 0.24
      RATE_TREATY_FOREIGN: 0.30
      TAX_BLOCK_THRESHOLD_CENTS: 60000
    precision: "integer cents, round_half_up per award"

  - name: reputation_delta
    trigger: "report triage outcomes, resolution cascade, conduct actions, and their reversals"
    algorithm: aggregation
    formula: |
      Deltas: DUPLICATE -10; NOT_APPLICABLE -15; INFORMATIVE +2 (applied at triage).
      REOPEN from DUPLICATE +10; REOPEN from NOT_APPLICABLE +15 (exact compensation).
      Report RESOLVED: +100 CRITICAL / +50 HIGH / +20 MEDIUM / +5 LOW / +0 NONE.
      Conduct: WARNING -5; STRIKE -50; BAN -200; REVERSE_LAST undoes the latest unreversed delta exactly.
      reputation_lifetime = max(0, 100 + SUM(all unreversed deltas))
      reputation_rolling180 = max(0, 100 + SUM(unreversed deltas with occurred_at >= now - 180 days))
      tier = ELITE if reputation_rolling180 >= 500; ESTABLISHED if >= 250; else NOVICE
    input_set: "All reputation-affecting events for the researcher; clock for the 180-day window"
    precision: "integer points"
    variants:
      - name: lifetime
        when: "Used for invitation eligibility (>= program.min_reputation) and reputation_at_issue snapshots"
        difference: "Never expires deltas"
      - name: rolling_180
        when: "Used for tier assignment (which drives TIER_BONUS in bounty_amount)"
        difference: "Deltas older than 180 days drop out at clock-sweep/read time; may differ sharply from lifetime"

  - name: sla_breach_flags
    trigger: "read of Report, and clock sweep"
    algorithm: threshold
    formula: |
      response_due_at = submitted_at + program.response_sla_hours hours
      response_breached = first_response_at == null ? (now > response_due_at) : (first_response_at > response_due_at)
      resolution_due_at = validated_at + program.resolution_sla_days days (null until validated)
      resolution_breached = resolved_at == null ? (now > resolution_due_at) : (resolved_at > resolution_due_at)
      # Boundary pinned: strictly greater; at the exact deadline instant NOT breached.
    input_set: "Report timestamps; program SLA config; logical clock"

  - name: invitation_expiry
    trigger: "clock sweep on POST /api/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      ProgramInvitation PENDING with now > expires_at -> EXPIRED
      expires_at = issued_at + 7 days
      Researcher SUSPENDED with now >= suspension_ends_at -> ACTIVE (suspension_ends_at cleared)
      reputation_rolling180 recomputed for all researchers on sweep
    constants:
      INVITATION_TTL_DAYS: 7
      SUSPENSION_DAYS_PER_STRIKE: 14

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Researcher may only act on own reports (provide-info), own invitations (respond), own tax documents, and creates reports as self"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/reports/{id}/provide-info, POST /api/invitations/{id}/respond, POST /api/researchers/{id}/tax-documents"
  - priority: 4
    category: existence
    check: "Path resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body foreign-key references exist (program_id, asset_id, researcher_id, report_id, duplicate_of_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "creation and reference-bearing endpoints"
  - priority: 6
    category: state
    check: "Target resource state machine permits the transition from its current state; specific variants: ERR_AWARD_NOT_PAYABLE (pay from PROPOSED), ERR_REPORT_NOT_RESOLVED (RETEST award or disclosure publish gating), ERR_NEGOTIATION_EXHAUSTED (COUNTER at round 3), ERR_INVITATION_EXPIRED (respond on EXPIRED/past-expiry invitation)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "Program posture: report submission, invitation issuance require program ACTIVE; activation requires a ScopeVersion effective at now (ERR_SCOPE_VERSION_REQUIRED); CLOSED rejects all mutations"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/reports, POST /api/invitations, POST /api/programs/{id}/activate"
  - priority: 8
    category: business_safety
    check: "Researcher standing: SUSPENDED researcher may not submit reports (ERR_RESEARCHER_SUSPENDED); BANNED researcher may not submit, provide info, or receive new invitations (ERR_RESEARCHER_BANNED)"
    error_id: ERR_RESEARCHER_SUSPENDED
    http_status: 403
    applies_to: "POST /api/reports, POST /api/reports/{id}/provide-info, POST /api/invitations"
  - priority: 9
    category: business_safety
    check: "Sanctions: researcher.country_code in {KP, IR, CU, SY} blocks award payment and transitions the award APPROVED -> BLOCKED(SANCTIONED_COUNTRY)"
    error_id: ERR_SANCTIONED_COUNTRY
    http_status: 403
    applies_to: "POST /api/awards/{id}/pay"
  - priority: 10
    category: business_constraint
    check: "Scope: asset belongs to the program, asset.status == ACTIVE, and asset.id is in the ScopeVersion effective at submission time"
    error_id: ERR_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /api/reports"
  - priority: 11
    category: business_constraint
    check: "Invitation-only access: PRIVATE program submission requires an ACCEPTED invitation for (program, researcher); invitation issuance (any visibility) requires researcher.status == ACTIVE and researcher.reputation_lifetime >= program.min_reputation (ERR_REPUTATION_TOO_LOW, inclusive boundary)"
    error_id: ERR_INVITATION_REQUIRED
    http_status: 403
    applies_to: "POST /api/reports, POST /api/invitations"
  - priority: 12
    category: business_constraint
    check: "Uniqueness and duplicate rules: at most one non-VOID BOUNTY award per report (ERR_BOUNTY_ALREADY_EXISTS); at most one non-VOID RETEST award per report; MARK_DUPLICATE anchor validity (ERR_DUPLICATE_OF_INVALID); BONUS amount <= program.bonus_cap_cents (ERR_AWARD_AMOUNT_CAP); BOUNTY requires report VALIDATED or RESOLVED with severity_final != NONE; at most one non-terminal RemediationTicket per report"
    error_id: ERR_DUPLICATE_OF_INVALID
    http_status: 422
    applies_to: "POST /api/awards, POST /api/reports/{id}/triage, POST /api/remediation-tickets"
  - priority: 13
    category: business_temporal
    check: "Temporal windows: disclosure publish timing (ERR_DISCLOSURE_TOO_EARLY) checked before blackout (ERR_BLACKOUT_ACTIVE); ScopeVersion half-open interval overlap (ERR_SCOPE_WINDOW_OVERLAP); Program blackout_windows closed-interval overlap with >= 3600s gap (ERR_BLACKOUT_OVERLAP); OCC version match (ERR_STALE_VERSION)"
    error_id: ERR_DISCLOSURE_TOO_EARLY
    http_status: 409
    applies_to: "POST /api/disclosure-requests/{id}/respond, POST /api/scope-versions, PATCH /api/programs/{id}"
  - priority: 14
    category: business_fiscal
    check: "Fiscal: tax documentation threshold at pay (ERR_TAX_DOC_REQUIRED, MISSING and amount >= 60000, transitions APPROVED -> BLOCKED(TAX_DOCUMENT)); pool sufficiency at award approve and at PATCH bounty_pool_cents lowering (ERR_POOL_EXHAUSTED)"
    error_id: ERR_TAX_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /api/awards/{id}/pay, POST /api/awards/{id}/approve, PATCH /api/programs/{id}"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/api/programs", description: "Create program (status DRAFT, posture counters 0)", roles: [PlatformAdmin], code: 201, input: [name, bounty_pool_cents, min_reputation, response_sla_hours, resolution_sla_days, disclosure_window_days, "visibility?", "first_report_bonus_pct?", "retest_award_cents?", "bonus_cap_cents?", "exposure_modifier?", "blackout_windows?"], output: Program, side_effects: [] }
  - { method: GET, path: "/api/programs/{program_id}", description: "Read program including pool ledger fields", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: Program, side_effects: [] }
  - { method: PATCH, path: "/api/programs/{program_id}", description: "Update program config; OCC via expected_program_version; blackout_windows validated as closed intervals with >= 3600s pairwise gap; bounty_pool_cents may not drop below reserved+paid; failed validation does not bump version", roles: [ProgramAdmin], code: 200, input: [expected_program_version, "name?", "bounty_pool_cents?", "min_reputation?", "response_sla_hours?", "resolution_sla_days?", "disclosure_window_days?", "first_report_bonus_pct?", "retest_award_cents?", "bonus_cap_cents?", "exposure_modifier?", "blackout_windows?"], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/api/programs/{program_id}/activate", description: "DRAFT|PAUSED -> ACTIVE; requires a ScopeVersion effective at now", roles: [ProgramAdmin], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/api/programs/{program_id}/pause", description: "ACTIVE -> PAUSED", roles: [ProgramAdmin], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/api/programs/{program_id}/close", description: "-> CLOSED when no in-flight reports or awards; PENDING invitations -> DECLINED", roles: [ProgramAdmin], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1", "cascade: PENDING ProgramInvitations -> DECLINED"] }
  - { method: POST, path: "/api/assets", description: "Create a scope asset (status ACTIVE)", roles: [ProgramAdmin], code: 201, input: [program_id, name, asset_identifier, criticality], output: ScopeAsset, side_effects: [] }
  - { method: GET, path: "/api/assets", description: "List assets filtered by program_id and/or status", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["program_id?", "status?"], output: "ScopeAsset[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{asset_id}", description: "Read a scope asset", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: ScopeAsset, side_effects: [] }
  - { method: POST, path: "/api/assets/{asset_id}/retire", description: "ACTIVE -> RETIRED (soft delete; excluded from new scope)", roles: [ProgramAdmin], code: 200, input: [], output: ScopeAsset, side_effects: [] }
  - { method: POST, path: "/api/scope-versions", description: "Create scope version; half-open [effective_from, effective_to) intervals per program must not overlap; adjacency (to == next from) allowed; safe harbor terms attached", roles: [ProgramAdmin], code: 201, input: [program_id, effective_from, in_scope_asset_ids, "effective_to?", "safe_harbor_text?"], output: ScopeVersion, side_effects: [] }
  - { method: GET, path: "/api/scope-versions/{scope_version_id}", description: "Read a scope version", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: ScopeVersion, side_effects: [] }
  - { method: GET, path: "/api/scope-versions", description: "List scope versions filtered by program_id", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["program_id?"], output: "ScopeVersion[]", side_effects: [] }
  - { method: POST, path: "/api/researchers", description: "Register researcher (status ACTIVE, reputation 100, tax MISSING)", roles: [Anonymous], code: 201, input: [handle, email, country_code], output: Researcher, side_effects: [] }
  - { method: GET, path: "/api/researchers/{researcher_id}", description: "Read researcher including reputation_lifetime, reputation_rolling180, tier, strike_count", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: Researcher, side_effects: [] }
  - { method: POST, path: "/api/researchers/{researcher_id}/tax-documents", description: "Researcher submits tax document (-> SUBMITTED); PlatformAdmin verifies (mark_verified=true -> VERIFIED)", roles: [Researcher, PlatformAdmin], code: 200, input: ["document_type?", "mark_verified?"], output: Researcher, side_effects: [] }
  - { method: POST, path: "/api/researchers/{researcher_id}/conduct-actions", description: "Code-of-conduct enforcement: WARNING (-5), STRIKE (-50, strike_count+1; 2nd strike -> SUSPENDED, 3rd -> BANNED), BAN (-200, -> BANNED), REVERSE_LAST (compensation: undoes latest unreversed action; status recomputed)", roles: [ProgramAdmin, Triager], code: 200, input: [action, "reason?"], output: Researcher, side_effects: ["conduct_log append/reverse; reputation deltas; strike_count; status recompute; on SUSPENDED/BANNED cascade: PENDING invitations -> DECLINED"] }
  - { method: POST, path: "/api/invitations", description: "Issue invitation for PRIVATE program; requires researcher ACTIVE and reputation_lifetime >= program.min_reputation (inclusive)", roles: [ProgramAdmin], code: 201, input: [program_id, researcher_id], output: ProgramInvitation, side_effects: ["issued_at/expires_at stamped; reputation_at_issue snapshot"] }
  - { method: GET, path: "/api/invitations/{invitation_id}", description: "Read invitation", roles: [PlatformAdmin, ProgramAdmin, Researcher], code: 200, input: [], output: ProgramInvitation, side_effects: [] }
  - { method: GET, path: "/api/invitations", description: "List invitations filtered by program_id and/or researcher_id", roles: [PlatformAdmin, ProgramAdmin, Researcher], code: 200, input: ["program_id?", "researcher_id?", "status?"], output: "ProgramInvitation[]", side_effects: [] }
  - { method: POST, path: "/api/invitations/{invitation_id}/respond", description: "Researcher accepts or declines a PENDING invitation (owner only; expired rejected)", roles: [Researcher], code: 200, input: [decision], output: ProgramInvitation, side_effects: [] }
  - { method: POST, path: "/api/reports", description: "Submit vulnerability report; pins scope_version_id at submission; Researcher acts as self", roles: [Researcher], code: 201, input: [program_id, asset_id, title, description, vulnerability_class], output: Report, side_effects: ["status NEW; submitted_at/response_due_at stamped"] }
  - { method: GET, path: "/api/reports/{report_id}", description: "Read report including computed SLA breach flags", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: Report, side_effects: [] }
  - { method: GET, path: "/api/reports", description: "List reports with filters and envelope pagination (limit/offset/total_count/has_more)", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["program_id?", "researcher_id?", "asset_id?", "status?", "duplicate_of_id?", "scope_version_id?", "limit?", "offset?"], output: "Report[]", side_effects: [] }
  - { method: POST, path: "/api/reports/{report_id}/triage", description: "Triager action: TRIAGE | REQUEST_INFO | MARK_DUPLICATE (duplicate_of_id) | MARK_NOT_APPLICABLE | MARK_INFORMATIVE | REOPEN", roles: [Triager], code: 200, input: [action, "duplicate_of_id?", "note?"], output: Report, side_effects: ["status transition per machine; first_response_at; reputation deltas and their REOPEN compensation"] }
  - { method: POST, path: "/api/reports/{report_id}/provide-info", description: "Researcher (owner) answers NEEDS_INFO; report returns to TRIAGED", roles: [Researcher], code: 200, input: [info], output: Report, side_effects: [] }
  - { method: POST, path: "/api/reports/{report_id}/validate", description: "Reproduction verified: computes severity variants, bands severity_final, snapshots tier and first-report flag", roles: [Triager], code: 200, input: [impact, exploitability, affected_scope], output: Report, side_effects: ["severity_score calculation; VALIDATED; resolution_due_at set"] }
  - { method: POST, path: "/api/awards", description: "Propose award (PROPOSED). BOUNTY: computed + pool-capped; BONUS: amount_cents input, cap-checked; RETEST: flat program.retest_award_cents, requires report RESOLVED", roles: [Triager], code: 201, input: [report_id, award_type, "amount_cents?"], output: Award, side_effects: [] }
  - { method: GET, path: "/api/awards/{award_id}", description: "Read award", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: Award, side_effects: [] }
  - { method: GET, path: "/api/awards", description: "List awards by report_id and/or researcher_id", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["report_id?", "researcher_id?", "status?"], output: "Award[]", side_effects: [] }
  - { method: POST, path: "/api/awards/{award_id}/approve", description: "PROPOSED -> APPROVED; reserves pool; ERR_POOL_EXHAUSTED if reserved+amount > pool-paid", roles: [ProgramAdmin], code: 200, input: [], output: Award, side_effects: ["bounty_reserved_cents += amount_cents"] }
  - { method: POST, path: "/api/awards/{award_id}/pay", description: "APPROVED|BLOCKED -> PAID; sanctions/tax blockers transition to BLOCKED with block_reason; per-award withholding computed", roles: [PlatformAdmin], code: 200, input: [], output: Award, side_effects: ["ledger: reserved -= amount; paid += amount; total_withheld += withheld_cents"] }
  - { method: POST, path: "/api/awards/{award_id}/void", description: "PROPOSED|APPROVED -> VOID; releases reservation (compensation)", roles: [ProgramAdmin], code: 200, input: [], output: Award, side_effects: ["if APPROVED: bounty_reserved_cents -= amount_cents"] }
  - { method: POST, path: "/api/disclosure-requests", description: "Researcher (report owner) requests permission to publish a report", roles: [Researcher], code: 201, input: [report_id, proposed_publish_at], output: DisclosureRequest, side_effects: [] }
  - { method: GET, path: "/api/disclosure-requests/{disclosure_request_id}", description: "Read disclosure request", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: DisclosureRequest, side_effects: [] }
  - { method: GET, path: "/api/disclosure-requests", description: "List disclosure requests by report_id and/or researcher_id", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["report_id?", "researcher_id?", "status?"], output: "DisclosureRequest[]", side_effects: [] }
  - { method: POST, path: "/api/disclosure-requests/{disclosure_request_id}/respond", description: "Negotiation: COUNTER (round+1, max 3) | AGREE (sets agreed_publish_at) | DENY (ProgramAdmin) | PUBLISH (ProgramAdmin; window + blackout gated)", roles: [Researcher, ProgramAdmin], code: 200, input: [decision, "agreed_publish_at?", "note?"], output: DisclosureRequest, side_effects: [] }
  - { method: POST, path: "/api/remediation-tickets", description: "Create engineering remediation ticket for a VALIDATED report; at most one non-terminal ticket per report", roles: [ProgramAdmin], code: 201, input: [report_id, external_ref], output: RemediationTicket, side_effects: ["due_at = now + resolution_sla_days"] }
  - { method: GET, path: "/api/remediation-tickets/{remediation_ticket_id}", description: "Read remediation ticket", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: [], output: RemediationTicket, side_effects: [] }
  - { method: GET, path: "/api/remediation-tickets", description: "List remediation tickets by report_id", roles: [PlatformAdmin, ProgramAdmin, Triager, Researcher], code: 200, input: ["report_id?", "status?"], output: "RemediationTicket[]", side_effects: [] }
  - { method: POST, path: "/api/remediation-tickets/{remediation_ticket_id}/transition", description: "START | FIX | REOPEN | VERIFY (cascades report -> RESOLVED + reputation) | WONT_FIX", roles: [ProgramAdmin], code: 200, input: [action], output: RemediationTicket, side_effects: ["VERIFY: Report VALIDATED -> RESOLVED; reputation delta; tier recompute"] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving logical clock. Server starts at exactly 2026-09-01T00:00:00Z before any call; never falls back to wall-clock. Sweep on set: PENDING invitations past expiry -> EXPIRED; SUSPENDED researchers past suspension_ends_at -> ACTIVE; reputation_rolling180 recomputed", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { now: string, invitations_expired: integer, researchers_reinstated: integer }, side_effects: ["clock sweep auto-transitions"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-ID / X-User-Role headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint, or entity-backed ownership check failed (researcher acting on another researcher's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign-key reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, unknown/read-only field in payload, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine rejects the transition from the resource's current state (incl. ticket VERIFY while report not VALIDATED, retest/bounty sequencing, second non-terminal ticket)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program is DRAFT, PAUSED, or CLOSED where ACTIVE is required (report submission, invitation issuance)" }
  - { id: ERR_SCOPE_VERSION_REQUIRED, http: 409, condition: "Program activation (or report submission) with no ScopeVersion effective at the current logical time" }
  - { id: ERR_RESEARCHER_SUSPENDED, http: 403, condition: "SUSPENDED researcher attempts report submission" }
  - { id: ERR_RESEARCHER_BANNED, http: 403, condition: "BANNED researcher attempts submission, provide-info, or receives an invitation" }
  - { id: ERR_SANCTIONED_COUNTRY, http: 403, condition: "Award payment to researcher resident in {KP, IR, CU, SY}; award transitions to BLOCKED(SANCTIONED_COUNTRY)" }
  - { id: ERR_TAX_DOC_REQUIRED, http: 422, condition: "Award payment with tax_document_status MISSING and amount_cents >= 60000; award transitions to BLOCKED(TAX_DOCUMENT)" }
  - { id: ERR_OUT_OF_SCOPE, http: 422, condition: "Asset not owned by program, RETIRED, or absent from the ScopeVersion effective at submission" }
  - { id: ERR_INVITATION_REQUIRED, http: 403, condition: "PRIVATE program submission without an ACCEPTED invitation for (program, researcher)" }
  - { id: ERR_INVITATION_EXPIRED, http: 409, condition: "Respond to an EXPIRED invitation or one whose expires_at has passed" }
  - { id: ERR_REPUTATION_TOO_LOW, http: 422, condition: "Invitation issuance where researcher.reputation_lifetime < program.min_reputation (strictly below; equality passes)" }
  - { id: ERR_DUPLICATE_OF_INVALID, http: 422, condition: "MARK_DUPLICATE anchor missing, self-referential, different program, different vulnerability_class, or not VALIDATED/RESOLVED" }
  - { id: ERR_BOUNTY_ALREADY_EXISTS, http: 409, condition: "Second non-VOID BOUNTY award on the same report" }
  - { id: ERR_AWARD_AMOUNT_CAP, http: 422, condition: "BONUS amount_cents > program.bonus_cap_cents" }
  - { id: ERR_POOL_EXHAUSTED, http: 422, condition: "Award approve would push reserved above pool-paid; or PATCH lowers bounty_pool_cents below reserved+paid" }
  - { id: ERR_AWARD_NOT_PAYABLE, http: 409, condition: "Pay attempted from PROPOSED (must be APPROVED or BLOCKED-with-cured-reason)" }
  - { id: ERR_DISCLOSURE_TOO_EARLY, http: 409, condition: "PUBLISH before agreed_publish_at or before resolved_at + disclosure_window_days (checked before blackout)" }
  - { id: ERR_BLACKOUT_ACTIVE, http: 409, condition: "PUBLISH while now falls inside a program blackout window (closed interval)" }
  - { id: ERR_SCOPE_WINDOW_OVERLAP, http: 409, condition: "ScopeVersion half-open interval intersects an existing one for the same program (adjacency allowed)" }
  - { id: ERR_BLACKOUT_OVERLAP, http: 409, condition: "PATCH blackout_windows contains overlapping closed intervals or a pairwise gap < 3600 seconds" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "PATCH program expected_program_version does not match current Program.version (OCC)" }
  - { id: ERR_REPORT_NOT_RESOLVED, http: 409, condition: "RETEST award or other resolution-gated operation on a report not yet RESOLVED" }
  - { id: ERR_REPORT_NOT_VALIDATED, http: 409, condition: "Remediation ticket creation for a report not in VALIDATED status" }
  - { id: ERR_NEGOTIATION_EXHAUSTED, http: 409, condition: "Disclosure COUNTER when negotiation_round == 3" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registrant; only researcher self-registration"
    identity: opaque
    exclusive_operations:
      - "POST /api/researchers — register as a new researcher"
    shared_operations: []
  - name: Researcher
    description: "Security researcher; submits reports, answers info requests, negotiates disclosure, manages own tax documents"
    identity: "entity_backed:Researcher"
    exclusive_operations:
      - "POST /api/reports — submit report as self"
      - "POST /api/reports/{id}/provide-info — owner answers NEEDS_INFO"
      - "POST /api/invitations/{id}/respond — owner accepts/declines"
      - "POST /api/disclosure-requests — request publication of own report"
    shared_operations:
      - "Read endpoints for programs, assets, scope versions, reports, awards, invitations, disclosure requests, remediation tickets, researchers"
      - "POST /api/researchers/{id}/tax-documents — submit own tax document"
      - "POST /api/disclosure-requests/{id}/respond — COUNTER/AGREE as owner"
  - name: Triager
    description: "Program triage staff; first response, reproduction validation, severity scoring, award proposal, conduct filing"
    identity: opaque
    exclusive_operations:
      - "POST /api/reports/{id}/triage — triage actions incl. duplicate marking and reopen"
      - "POST /api/reports/{id}/validate — reproduction verification and severity scoring"
      - "POST /api/awards — propose award"
    shared_operations:
      - "POST /api/researchers/{id}/conduct-actions — file conduct action"
      - "Read endpoints"
  - name: ProgramAdmin
    description: "Customer-side program owner; scope, posture, invitations, award approval/void, remediation tracking, disclosure policy"
    identity: opaque
    exclusive_operations:
      - "PATCH /api/programs/{id} — config + blackout windows (OCC)"
      - "POST /api/programs/{id}/activate|pause|close"
      - "POST /api/assets, POST /api/assets/{id}/retire, POST /api/scope-versions"
      - "POST /api/invitations — issue invitation"
      - "POST /api/awards/{id}/approve, POST /api/awards/{id}/void — approval step of the award chain"
      - "POST /api/remediation-tickets, POST /api/remediation-tickets/{id}/transition"
    shared_operations:
      - "POST /api/researchers/{id}/conduct-actions"
      - "POST /api/disclosure-requests/{id}/respond — COUNTER/AGREE/DENY/PUBLISH as program side"
      - "Read endpoints"
  - name: PlatformAdmin
    description: "Platform operator; program creation, payment execution, tax verification, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs — create program"
      - "POST /api/awards/{id}/pay — execute payment (final step of award chain; segregation from propose/approve)"
      - "POST /api/_clock/set_current_utc — logical clock"
    shared_operations:
      - "POST /api/researchers/{id}/tax-documents — mark_verified"
      - "Read endpoints"
