      - name: inspection_reassignment_cycle_resets_file_review
        grounds:
          - state_machines.Inspection.FILE_REVIEWED_to_ASSIGNED
          - state_machines.Inspection.ASSIGNED_to_ASSIGNED
          - entities.Inspection.fields.file_reviewed_at
        distinguishing_aspect: |
          Non-linear shape = a true cycle on Inspection: ASSIGNED ->
          FILE_REVIEWED -> ASSIGNED (reassign) -> FILE_REVIEWED (redo) ->
          IN_PROGRESS, with the reassignment side effect provably wiping
          file_reviewed_at — the loop is observable because the first
          inspector's completed review no longer authorizes entry.
        test_recipe:
          setup:
