  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: outage_start_cascades_five_levels_to_storage_position
        grounds:
          - state_machines.Turnaround.APPROVED_to_IN_PROGRESS
          - state_machines.ReformerTrain.RUNNING_to_DOWN_FOR_TURNAROUND
          - state_machines.ProductionRun.RUNNING_to_ABORTED
          - state_machines.ProductionRun.APPROVED_to_PLANNED
          - state_machines.ProductionOrder.A_RESERVED_to_A_RELEASED
          - state_machines.Shipment.BOOKED_to_CANCELLED
          - state_machines.TurnaroundTask.PENDING_to_READY
          - calculations.storage_position
        distinguishing_aspect: |
          One POST /turnarounds/{id}/start propagates through five entity hops in a single request —
          Turnaround -> ReformerTrain (DOWN_FOR_TURNAROUND) -> ProductionRun (one RUNNING run ABORTED
          and one unrelated APPROVED run reverted to PLANNED with its provisional cost cleared) ->
          ProductionOrder (RELEASED with release_reason RUN_ABORTED) -> Shipment (CANCELLED with
          cancel_reason UPSTREAM_ALLOCATION_RELEASED) -> StorageAsset (reserved_tons back to 0.000) —
          and the depth is observable because the last hop is a recomputed tonnage, not a status.
        test_recipe:
          setup:
            - "One plant with a UREA product line, a reformer train and a zero-hour catalyst charge."
            - "Two UREA storage assets: a 20000-ton tank UT-A with an opening balance of 5000 tons and a 20000-ton terminal UT-B."
            - "ProductionRun PR-B over 2026-09-01 -> 2026-09-11 (target 5000) is APPROVED and then STARTED with the clock at 2026-09-01, so the train is RUNNING."
            - "ProductionRun PR-C over 2026-10-05 -> 2026-10-10 (target 3000) is APPROVED on the same train and left untouched — it is the collateral hop."
            - "Production order PO-B1 for 1000 UREA tons on PR-B is RESERVED (allocated_ammonia_tons 580.000), and shipment SH-B1 for 1000 tons from UT-A to UT-B is BOOKED against it."
            - "A COMBINED turnaround TA-1 on the same train over 2026-11-01 -> 2026-11-27 carries TK-A 7 days, TK-B 14 days after TK-A and TK-C 5 days after TK-B (critical_path_days 26 == window_days 26); it is SUBMITTED, ENDORSED and APPROVED, and the clock is then advanced to 2026-11-01."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Geismar Works", site_code: "GSM-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
