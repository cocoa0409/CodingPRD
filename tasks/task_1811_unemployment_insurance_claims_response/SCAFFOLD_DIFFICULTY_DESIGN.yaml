          - entities.TpaEngagement.fields.effective_from
          - entities.TpaEngagement.fields.effective_to
          - errors[ERR_TPA_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: closed-closed intersection on engagement windows — an
          existing engagement [2026-01-01T00:00:00Z, 2026-06-30T23:59:59Z] and a new
          one starting exactly at 2026-06-30T23:59:59Z DO intersect (shared endpoint
          counts under closed-closed semantics, unlike half-open booking rules), so
          the second engagement is rejected; starting one microsecond-equivalent
          second later (2026-07-01T00:00:00Z) succeeds. Resource: TpaEngagement —
          a third resource entity with a third interval geometry (buffered-adjacency
          for referees, containment for witnesses, closed-interval intersection here).
        test_recipe:
          setup:
            - "Employer E; engagement G1 [2026-01-01, 2026-06-30T23:59:59Z] ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "WinCo", fein: "123456707", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/tpa-engagements"
              payload: { employer_id: "${emp_id}", tpa_name: "FirstTpa", authority_scope: "FULL", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T23:59:59Z" }
              as: TpaManager
              captures: { eng1: $.data.id }
          trigger:
            - call: "POST /ui/tpa-engagements"
              payload: { employer_id: "${emp_id}", tpa_name: "TouchTpa", authority_scope: "RESPONSE_ONLY", effective_from: "2026-06-30T23:59:59Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TpaManager
              captures: { err: $.data.error_id }
            - call: "POST /ui/tpa-engagements"
              payload: { employer_id: "${emp_id}", tpa_name: "CleanTpa", authority_scope: "RESPONSE_ONLY", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TpaManager
              captures: { eng2: $.data.id }
          assert:
            - "error_id == 'ERR_TPA_WINDOW_OVERLAP'"
            - "TpaEngagement.${eng2}.oversight_status == 'ACTIVE'"
            - "TpaEngagement.${eng1}.oversight_status == 'ACTIVE'"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: protest_withdrawal_restores_line_and_totals
        grounds:
          - state_machines.ChargeProtest.FILED_to_WITHDRAWN
          - state_machines.ChargeLineItem.transitions
          - calculations.charge_audit_variance
        distinguishing_aspect: |
          Conserved quantity: ChargeStatement.total_charged_cents. Filing a protest
          (line PENDING -> PROTESTED) then withdrawing it (line PROTESTED ->
          PENDING) must leave total_charged_cents unchanged at 400000 — the forward
          and compensating actions cancel with zero drift in the statement total.
        test_recipe:
          setup:
            - "Statement with one line 400000 cents; protest filed then withdrawn"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "InvCo", fein: "123456705", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Ann", ssn_last4: "9004", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-804", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/charge-statements"
              payload: { employer_id: "${emp_id}", state_code: "XX", quarter: "2026Q3", issued_at: "2026-08-03T09:00:00Z" }
              as: AgencyLiaison
              captures: { stmt_id: $.data.id }
            - call: "POST /ui/charge-statements/${stmt_id}/line-items"
              payload: { claim_id: "${claim_id}", amount_cents: 400000, benefit_weeks: 4, erroneous_reason: "WRONG_EMPLOYER" }
              as: AgencyLiaison
              captures: { line_id: $.data.id }
            - call: "GET /ui/charge-statements/${stmt_id}"
              payload: {}
              as: ChargeAuditor
              captures: { stmt_v0: $.data.version }
            - call: "POST /ui/charge-line-items/${line_id}/protests"
              payload: { protest_basis: "WRONG_EMPLOYER", expected_statement_version: "${stmt_v0}" }
              as: ChargeAuditor
              captures: { protest_id: $.data.id }
          trigger:
            - call: "POST /ui/charge-protests/${protest_id}/withdraw"
              payload: {}
              as: ChargeAuditor
          assert:
            - "ChargeProtest.${protest_id}.status == 'WITHDRAWN'"
            - "ChargeLineItem.${line_id}.status == 'PENDING'"
            - "ChargeStatement.${stmt_id}.total_charged_cents == 400000"
            - "UiClaim.${claim_id}.charged_amount_cents == 400000"

      - name: appeal_reverse_credits_reserve_invariant
        grounds:
          - state_machines.Appeal.HEARD_to_DECIDED_REVERSED
          - calculations.experience_rating_projection
          - entities.EmployerAccount.fields.reserve_balance_cents
        distinguishing_aspect: |
          Conserved quantity: EmployerAccount.reserve_balance_cents across a
          determination-then-reversal cycle. Benefits charged under an ALLOWED
          determination debit the reserve; when the appeal decision REVERSES that
          determination the reserve is credited back, so reserve after the full
          cycle equals reserve before the charge posted (30000000) — a different
          conserved quantity (employer ledger) than the statement total invariant.
        test_recipe:
          setup:
            - "Employer reserve_balance_cents 30000000; claim determined ALLOWED; charge line 200000 posted (reserve debited to 29800000); appeal filed, heard; decide REVERSE auto-reverses the line and credits the reserve back to 30000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "Res2Co", fein: "123456706", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000, reserve_balance_cents: 30000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Bob", ssn_last4: "9005", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "DISCHARGE_MISCONDUCT" }
