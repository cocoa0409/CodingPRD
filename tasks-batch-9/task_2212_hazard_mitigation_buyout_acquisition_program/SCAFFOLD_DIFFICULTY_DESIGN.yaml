              payload: { parcel_id: "${p1}", appraisal_type: "REVIEW", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-RA-1", effective_date: "2026-07-05", indicated_value_cents: 20000000, reviewed_appraisal_id: "${ap1}" }
