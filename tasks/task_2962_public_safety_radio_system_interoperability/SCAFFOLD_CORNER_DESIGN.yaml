            - "data.billable_subscriber_count == 0 and data.governance_vote_weight == 1 and data.voting_eligible == true"
            - "data.total_eligible_weight == 3 (all three agencies are eligible and weigh 1 each)"
            - "data.quorum_weight_required == 2 (ceil(3 * 3 / 5) == ceil(1.8))"

