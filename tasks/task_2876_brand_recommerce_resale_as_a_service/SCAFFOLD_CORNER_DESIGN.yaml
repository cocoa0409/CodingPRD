            - call: "GET /recommerce/resale-units/${unit_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { life_after_stale: "$.data.lifecycle_state" }
            - call: "GET /recommerce/credit-grants/${grant_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { grant_after_stale: "$.data.remaining_minor", grant_status_after_stale: "$.data.status" }
            - call: "POST /recommerce/resale-orders"
              payload: { customer_id: "${cust_id}", channel_id: "${chan_id}", resale_unit_id: "${unit_id}", requested_credit_minor: 5000, expected_customer_version: "${ver_after_patch}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: "$.data.id", ord_total: "$.data.order_total_minor", ord_credit: "$.data.credit_applied_minor", ord_cash: "$.data.cash_due_minor" }
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ver_after_order: "$.data.version", bal_after_order: "$.data.credit_balance_minor" }
          assert:
            - "${grant_issued} == 11000, ${bal_read} == 11000 and ${lp} == 19500 before the probe"
            - "${tier_after_patch} == PLUS and ${ver_after_patch} == ${ver_read} + 1 — an unrelated PATCH is enough to invalidate the caller's view"
            - "${e_stale} == ERR_STALE_CUSTOMER_VERSION with HTTP 412"
            - "${life_after_stale} == LISTED, ${grant_after_stale} == 11000 and ${grant_status_after_stale} == ISSUED — the refused order reserved nothing and redeemed nothing"
            - "the retry with the refreshed version returns 201 with ${ord_total} == 21255, ${ord_credit} == 5000 and ${ord_cash} == 16255"
            - "${bal_after_order} == 6000 and ${ver_after_order} == ${ver_after_patch} + 1 — the accepted order is the only write that moved the balance"

      - name: ops_run_checkpoint_counters_are_per_campaign_and_survive_empty_runs
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_profile.complexity_layers[ops_run_checkpoint]
          - endpoints[POST /recommerce/markdown-campaigns/{id}/cadence-runs]
          - state_machines.MarkdownCampaign[SCHEDULED -> ACTIVE]
          - state_machines.MarkdownCampaign[ACTIVE -> ACTIVE]
        distinguishing_aspect: "Two campaigns on two channels keep independent checkpoints: campaign A's second run reports run_sequence_no 2 while campaign B's first run reports 1, and both counters advance on runs that mark down nothing at all — a global run counter or a counter that only advances on non-empty runs both fail."
        test_recipe:
          setup:
            - "Two ACTIVE resale channels exist, each carrying one OUTERWEAR campaign over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); no unit is listed anywhere, so every run evaluates an empty set."
          setup_api_calls:
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-A", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_a: "$.data.id" }
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-B", channel_type: "OUTLET", allowed_assortment: "BOTH", max_resale_price_ratio_bp: 7000, region_code: "US-NY" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_b: "$.data.id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_a}", product_category: "OUTERWEAR", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { camp_a: "$.data.id", camp_a_status: "$.data.status", camp_a_runs: "$.data.run_count" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_b}", product_category: "OUTERWEAR", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { camp_b: "$.data.id", camp_b_runs: "$.data.run_count" }
          trigger:
            - call: "POST /recommerce/markdown-campaigns/${camp_a}/cadence-runs"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { a_seq_1: "$.data.run_sequence_no", a_eval_1: "$.data.evaluated_unit_count", a_md_1: "$.data.marked_down_unit_count", a_skip_1: "$.data.skipped_at_floor_count", a_wd_1: "$.data.written_down_unit_count", a_total_1: "$.data.total_markdown_minor" }
            - call: "POST /recommerce/markdown-campaigns/${camp_a}/cadence-runs"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { a_seq_2: "$.data.run_sequence_no", a_eval_2: "$.data.evaluated_unit_count" }
            - call: "POST /recommerce/markdown-campaigns/${camp_b}/cadence-runs"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { b_seq_1: "$.data.run_sequence_no", b_eval_1: "$.data.evaluated_unit_count" }
            - call: "GET /recommerce/markdown-campaigns/${camp_a}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { a_status: "$.data.status", a_runs: "$.data.run_count", a_last: "$.data.last_run_at", a_ver: "$.data.version" }
            - call: "GET /recommerce/markdown-campaigns/${camp_b}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { b_status: "$.data.status", b_runs: "$.data.run_count", b_last: "$.data.last_run_at", b_ver: "$.data.version" }
            - call: "GET /recommerce/channels/${chan_b}/markdown-campaigns?product_category=OUTERWEAR"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { b_list_id: "$.data[0].id" }
          assert:
            - "${camp_a_status} == SCHEDULED with ${camp_a_runs} == 0 and ${camp_b_runs} == 0 before any run"
            - "${a_seq_1} == 1 with ${a_eval_1} == 0, ${a_md_1} == 0, ${a_skip_1} == 0, ${a_wd_1} == 0 and ${a_total_1} == 0 — an empty run is still a checkpoint"
            - "${a_seq_2} == 2 and ${a_eval_2} == 0 — campaign A's counter advanced across a different caller role"
            - "${b_seq_1} == 1 and ${b_eval_1} == 0 — campaign B is on its own counter and is unaffected by A's two runs"
            - "${a_status} == ACTIVE, ${a_runs} == 2, ${a_last} == 2026-08-01T00:00:00Z and ${a_ver} == 3"
            - "${b_status} == ACTIVE, ${b_runs} == 1, ${b_last} == 2026-08-01T00:00:00Z and ${b_ver} == 2"
            - "channel B's OUTERWEAR subresource listing returns total_count 1 with ${b_list_id} == ${camp_b} — the listing is scoped to the path channel"

      - name: cascading_side_effects_across_the_acceptance_chain
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers[cascading_side_effects]"]
        excluded_because:
          difficulty_instance: transitive_cascade / acceptance_cascades_trade_in_to_grant_to_ledger_to_customer_balance
          rationale: "The named §1.8 instance verifies the four-link chain end-to-end (TradeIn → CreditGrant → CreditLedgerEntry → Customer.credit_balance_minor), and its sibling refund_cascades_order_to_release_entry_to_grant_status_to_balance covers the reverse direction."

      - name: dual_variant_calculation_on_appraised_credit
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers[dual_variant_calculation]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / trade_in_credit_quote_versus_issuance_diverges_on_identical_grade
          rationale: "The named §1.8 instance asserts both variants of trade_in_appraised_credit on identical data (11000 quote_provisional versus 11500 issuance_final) and the delta on the switch; return_refund_remorse_versus_warranty_diverges_on_identical_order covers the second dual-variant rule."

  - section: consistency_model
    instances:
      - name: redemption_is_visible_in_the_same_request_and_in_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.resale_order_settlement
        distinguishing_aspect: "The placement response itself already carries the settled money fields, and reads issued with no intervening write see the decremented grant, the recomputed customer balance, the appended REDEEM ledger row and the RESERVED unit — nothing lags a beat behind, so an implementation that recomputes derived fields on a later pass fails immediately."
        test_recipe:
          setup:
            - "Ava (STANDARD) holds one 11000 MAIL_IN grant and her refurbished unit is LISTED on RESALE-MP at 19500."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-1", bay_type: "CLEANING" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_1: "$.data.id" }
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { acc_credit: "$.data.appraised_credit_minor" }
            - call: "GET /recommerce/credit-grants?trade_in_id=${ti_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { grant_id: "$.data[0].id" }
            - call: "GET /recommerce/resale-units?trade_in_id=${ti_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { unit_id: "$.data[0].id", unit_ver: "$.data[0].version" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_1}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${unit_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_id: "$.data.id" }
            - call: "POST /recommerce/refurb-orders/${ro_id}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro_id}/submit-qc"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro_id}/qc-decision"
              payload: { decision: "PASS" }
              as: RefurbTechnician
              as_user_id: "tech-002"
            - call: "POST /recommerce/resale-units/${unit_id}/list"
              payload: { channel_id: "${chan_id}" }
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ver_before: "$.data.version", bal_before: "$.data.credit_balance_minor" }
          trigger:
            - call: "POST /recommerce/resale-orders"
              payload: { customer_id: "${cust_id}", channel_id: "${chan_id}", resale_unit_id: "${unit_id}", requested_credit_minor: 5000, expected_customer_version: "${ver_before}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: "$.data.id", ord_status: "$.data.status", ord_gross: "$.data.gross_price_minor", ord_fee: "$.data.channel_fee_minor", ord_total: "$.data.order_total_minor", ord_credit: "$.data.credit_applied_minor", ord_cash: "$.data.cash_due_minor" }
            - call: "GET /recommerce/credit-grants/${grant_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { g_remaining: "$.data.remaining_minor", g_status: "$.data.status", g_issued: "$.data.issued_amount_minor" }
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bal_after: "$.data.credit_balance_minor", ver_after: "$.data.version" }
            - call: "GET /recommerce/resale-orders/${ord_id}/ledger-entries?entry_type=REDEEM"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { led_type: "$.data[0].entry_type", led_amount: "$.data[0].amount_minor", led_after: "$.data[0].balance_after_minor", led_at: "$.data[0].occurred_at", led_grant: "$.data[0].credit_grant_id" }
            - call: "GET /recommerce/resale-units/${unit_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { u_life: "$.data.lifecycle_state", u_price: "$.data.current_price_minor" }
          assert:
            - "${acc_credit} == 11000 and ${bal_before} == 11000 before placement"
            - "the placement response itself is complete: ${ord_status} == PLACED, ${ord_gross} == 19500, ${ord_fee} == 1755, ${ord_total} == 21255, ${ord_credit} == 5000 and ${ord_cash} == 16255"
            - "${g_issued} == 11000, ${g_remaining} == 6000 and ${g_status} == PARTIALLY_REDEEMED on the very next read"
            - "${bal_after} == 6000 and ${ver_after} == ${ver_before} + 1 — the denormalized balance does not lag"
            - "the entry_type=REDEEM listing returns total_count 1 with ${led_type} == REDEEM, ${led_amount} == -5000, ${led_after} == 6000, ${led_at} == 2026-08-01T00:00:00Z and ${led_grant} == ${grant_id}"
            - "${u_life} == RESERVED and ${u_price} == 19500 — the unit moved inside the same request that created the order"
