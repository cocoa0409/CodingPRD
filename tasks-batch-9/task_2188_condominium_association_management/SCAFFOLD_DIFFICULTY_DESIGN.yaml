  # =====================================================================
  # Rule 9 — Compensating invariants (distinct conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_vacatur_restores_owner_ledger_cents_invariant_l_exactly
        grounds:
          - calculations.unit_ledger_conservation_invariant
          - state_machines.ViolationCase.HEARING_SCHEDULED_to_FINE_VACATED
          - state_machines.ViolationCase.FINE_ASSESSED_to_APPEALED
          - calculations.fine_tier_selection
          - calculations.unit_aging_and_balance
        distinguishing_aspect: |
          CONSERVED QUANTITY: owner ledger cents per Unit (INVARIANT L) — balance_due_cents must
          equal the signed sum of every LedgerEntry of the unit, POSTED and REVERSED alike. The
          forward action (FINE_ASSESSED, +5000) pushes the unit across a lowered
          lien_threshold_cents of 12000 into LIEN_FILED, and the compensating action (FINE_VACATED
          on appeal round 2) must return balance_due_cents to EXACTLY its pre-fine value of 8000
          and unwind every derived consequence: delinquency_stage back to LATE_NOTICE,
          lien_recorded_at back to null, voting_eligible back to true and the BALLOTING
          assessment's eligible_weight_bp back to 10000 with the owner's ballot counted again. A
          FINE_UPHELD twin must leave all of it untouched, and the vacated case must never enter
          a later case's repeat chain.
        test_recipe:
          setup:
            - "Association with lien_threshold_cents PATCHed to 12000; defaults late_fee_grace_days 10, cure_period_days 14, appeal_window_days 30, fine tiers 5000 / 10000 / 25000-daily, fine_cap_cents 250000, board_quorum_seats 3, hearing_docket_capacity 6."
            - "Three seated directors: d1 (PRESIDENT), d2 (DIRECTOR), tr (TREASURER). tr is the reporter, d1 decides round 1, d2 decides the appeal — satisfying both segregation-of-duties clauses."
            - "Owners A and B hold units A (6000 bp) and B (4000 bp); total_interest_bp == 10000."
            - "Unit A already carries a single COLLECTION_COST LedgerEntry of 8000 due 2026-04-01, so its pre-fine balance_due_cents is 8000."
            - "SpecialAssessment sa1 is left in approval_status BALLOTING with one YES owner ballot from owner A, so eligible_weight_bp and Vote.counted are live recomputation targets."
            - "case1 (unit A, rule_code PARKING) is noticed 2026-08-01 (cure_deadline_at 2026-08-15), docketed to mtg_h1 on 2026-10-20T18:00:00Z, fined at that meeting, appealed, then re-docketed to mtg_h2 on 2026-11-10T18:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
              payload: { legal_name: "Fernwood Condominium Association" }
              as: CommunityManager
              captures: { assoc_id: "$.data.id" }
            - call: "PATCH /associations/${assoc_id}"
              payload: { lien_threshold_cents: 12000 }
              as: CommunityManager
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Dana Reyes", email: "dana@fw.test", board_role: "PRESIDENT", is_seated: true }
              as: CommunityManager
              captures: { d1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Elliot Shaw", email: "elliot@fw.test", board_role: "DIRECTOR", is_seated: true }
              as: CommunityManager
              captures: { d2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Priya Nandan", email: "priya@fw.test", board_role: "TREASURER", is_seated: true }
              as: CommunityManager
              captures: { tr: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner A", email: "oa@fw.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { oa: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner B", email: "ob@fw.test", board_role: "NONE", is_seated: false }
