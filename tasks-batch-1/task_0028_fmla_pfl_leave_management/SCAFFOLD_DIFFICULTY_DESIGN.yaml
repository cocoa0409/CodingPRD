              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certI1_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseI1_id}/approve"
              payload: { expected_leave_case_version: "${caseI1_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_intervals/seed-historic"
              payload: { leave_case_id: "${caseI1_id}", start_datetime: "2026-02-01T00:00:00.000Z", end_datetime: "2026-04-30T00:00:00.000Z", hours_taken: 479, fmla_hours_charged: 479, pfl_hours_charged: 0 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/intervals"
