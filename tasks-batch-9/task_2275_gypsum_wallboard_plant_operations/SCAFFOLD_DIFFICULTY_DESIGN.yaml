  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: stucco_commitment_conservation_across_schedule_cancel
        grounds:
          - state_machines.ProductionRun.status.SCHEDULED_to_CANCELLED
          - entities.Plant.fields.stucco_committed_tons
          - entities.Plant.fields.stucco_available_tons
          - calculations.run_line_capacity_and_reservation
          - endpoints[POST /plant-ops/production-runs/{runId}/cancel]
        distinguishing_aspect: |
          Conserved quantity: silo stucco tonnage, where stucco_available_tons must always equal
          stucco_on_hand_tons - stucco_committed_tons. Scheduling moves 202.500 t from available into
          committed and cancelling must move exactly that amount back, zeroing the run's
          stucco_reserved_tons, so the plant ledger returns bit-for-bit to its pre-schedule values
          while the version counter still advances.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1, REGULAR SKU; batch B1 COMPLETED crediting 204.530 t with nothing committed."
            - "Run R1 drafted for 06:00Z-10:00Z requesting 300.000 MSF."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
