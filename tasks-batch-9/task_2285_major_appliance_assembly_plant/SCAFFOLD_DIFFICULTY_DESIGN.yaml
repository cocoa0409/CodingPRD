  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: station_saturation_derives_line_posture_and_blocks_slot_release
        grounds:
          - calculations.line_posture
          - entities.Station.fields.presentation_slots_used
          - validations[priority=28]
          - state_machines.BuildSlot.SEQUENCED_to_RELEASED
        distinguishing_aspect: |
          The BuildSlot release verdict is not a function of the slot at all: it
          depends on a THIRD entity's counter (Station.presentation_slots_used ==
          presentation_slot_capacity) propagating into Line.posture. The same
          slot that may be sequenced under CONSTRAINED cannot be released, and a
          sibling slot that leaves one free unit of station capacity releases
          fine.
        test_recipe:
          setup:
            - "Line L2 (takt 120, option_load_limit_pct 63.00, baseline_headcount 20, current_family_code FAM_A) with exactly one station ST-A, presentation_slot_capacity 2"
            - "Parts P-SMALL (line_side_max_units 10) and P-BIG (line_side_max_units 20) from SUP1"
            - "ModelVariant WM-C RELEASED: FAM_A, 1 option point, 100 labour minutes, POS-BODY on P-SMALL at ST-A qty 1 -> ceil(1 * 20 / 10) = 2 slot units, exactly ST-A's capacity"
            - "ModelVariant WM-D RELEASED: FAM_A, 1 option point, 100 labour minutes, POS-BODY on P-BIG at ST-A qty 1 -> ceil(1 * 20 / 20) = 1 slot unit"
            - "ShiftPlan A 06:00-14:00 headcount 20 on L2; BuildSlots slotC (index 1, 07:00, WM-C) and slotD (index 2, 07:30, WM-D) both PLANNED"
          setup_api_calls:
            - *k_clock
            - *k_sup1
            - call: "POST /lines"
              payload: { line_code: "L2", takt_seconds: 120, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /stations"
              payload: { line_id: "${l2_id}", station_code: "ST-A", position_index: 10, presentation_slot_capacity: 2, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { sta_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "P-SMALL", supplier_id: "${sup1_id}", is_sequenced_module: false, line_side_max_units: 10 }
              as: PlantAdmin
              captures: { p_small_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "P-BIG", supplier_id: "${sup1_id}", is_sequenced_module: false, line_side_max_units: 20 }
              as: PlantAdmin
              captures: { p_big_id: $.data.id }
            - call: "POST /model-variants"
              payload: { model_code: "WM-C", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 1, labor_minutes: 100, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmc_id: $.data.id, wmc_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmc_id}", part_id: "${p_small_id}", station_id: "${sta_id}", bom_position_code: "POS-BODY", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmc_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmc_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /model-variants"
              payload: { model_code: "WM-D", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 1, labor_minutes: 100, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmd_id: $.data.id, wmd_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmd_id}", part_id: "${p_big_id}", station_id: "${sta_id}", bom_position_code: "POS-BODY", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmd_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmd_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "GET /lines/${l2_id}"
              payload: {}
              as: ProductionPlanner
              captures: { l2_v: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${l2_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${l2_v}" }
              as: ProductionPlanner
              captures: { shift_l2_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${l2_id}", model_variant_id: "${wmc_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slotc_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${l2_id}", model_variant_id: "${wmd_id}", sequence_index: 2, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { slotd_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${slotc_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slotc_id}/release"
              payload: {}
              as: LineOperator
            - call: "POST /build-slots/${slotc_id}/de-sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slotd_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slotd_id}/release"
              payload: {}
              as: LineOperator
          assert:
            - "After trigger 1: Station.${sta_id}.presentation_slots_used == 2 == its capacity, Line.${l2_id}.free_slot_pct == 0.00 and posture == CONSTRAINED while operating_mode is still RUNNING"
            - "Trigger 2 returns 409 ERR_LINE_POSTURE_BLOCKED and BuildSlot.${slotc_id}.status is still SEQUENCED — CONSTRAINED permits sequencing but not release"
            - "After trigger 3: Station.${sta_id}.presentation_slots_used == 0, Line.${l2_id}.free_slot_pct == 100.00 and posture == OPEN"
            - "After trigger 4: Station.${sta_id}.presentation_slots_used == 1, free_slot_pct == 50.00 and posture == OPEN (1 < 2, no saturated station)"
            - "Trigger 5 succeeds: a ProductionUnit is created with assembly_status IN_STATION, quality_status PENDING, built_at_sequence_index == 2 and serial_number 'L2-000001'; BuildSlot.${slotd_id}.status == RELEASED and Line.${l2_id}.max_released_sequence_index == 2"

      - name: obsoleting_the_variant_blocks_certification_but_not_assembly
        grounds:
          - state_machines.ModelVariant.RELEASED_to_OBSOLETE
          - state_machines.ProductionUnit.GATED_to_CERTIFIED
          - state_machines.ProductionUnit.IN_STATION_to_ASSEMBLED
          - validations[priority=14]
        distinguishing_aspect: |
          A different pair of entities and the opposite outcome per dimension:
          the ProductionUnit's QUALITY dimension is gated by ModelVariant.status
          (certify -> ERR_MODEL_NOT_RELEASED once OBSOLETE) while its ASSEMBLY
          dimension is not gated by it at all, so complete-assembly still
          succeeds on the same unit in the same state.
        test_recipe:
          setup:
            - "Base fixture: clock 2026-08-03T06:00:00Z, Line L1, ST10/ST20, SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A headcount 20"
            - "unit1 released from BuildSlot index 1 and driven to GATED with ELECTRICAL_SAFETY 0.30, FUNCTIONAL_CYCLE 3, LEAK 1.10, ENERGY 380.00, WATER 184.00"
            - "ModelVariant WM-X then obsoleted by the plant admin"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - call: "POST /model-variants/${wmx_id}/obsolete"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
          assert:
            - "Trigger 1 returns 409 ERR_MODEL_NOT_RELEASED — the gate lives on ModelVariant.${wmx_id}, whose status == OBSOLETE"
            - "ProductionUnit.${unit1_id}.quality_status is still GATED with efficiency_index null and certification_tier null"
            - "ProductionUnit.${unit1_id}.provisional_efficiency_index == 0.94 — the AS_TESTED read is unaffected by the variant's status"
            - "Trigger 2 succeeds: ProductionUnit.${unit1_id}.assembly_status == ASSEMBLED and BuildSlot.${slot1_id}.status == BUILT (bubble-up), so the assembly dimension carries no variant-status precondition"
            - "Station.${st10_id}.presentation_slots_used == 2 — the slots stay committed because the unit has not shipped"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dock_window_buffer_padded_on_both_ends_and_station_scoped
        grounds:
          - validations[priority=22]
          - errors.ERR_DOCK_WINDOW_CONFLICT
          - entities.DeliveryCall.fields.window_start
        distinguishing_aspect: |
          Interval semantics A: a SYMMETRIC 10-minute pad on the CANDIDATE's
          half-open window tested against the raw existing window, scoped per
          Station and restricted to live calls. A 9-minute gap conflicts, an
          exactly-10-minute gap does not, the same window is free at another
          station, and cancelling the incumbent frees the dock.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1 with stations ST10 and ST20, SUP1, part P-DOOR-A"
            - "DeliveryCall C1 for P-DOOR-A at ST10 with window 07:00-07:30 is SCHEDULED"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T07:30:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T07:39:00Z", window_end: "2026-08-03T08:09:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T07:40:00Z", window_end: "2026-08-03T08:10:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { d2_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st20_id}", window_start: "2026-08-03T07:39:00Z", window_end: "2026-08-03T08:09:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { d3_id: $.data.id }
            - call: "POST /delivery-calls/${d1_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T07:30:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { d4_id: $.data.id }
          assert:
            - "Trigger 1 returns 409 ERR_DOCK_WINDOW_CONFLICT: the padded candidate [07:29, 08:19) intersects C1's [07:00, 07:30) on the single minute 07:29-07:30"
            - "Trigger 2 returns 201: the padded candidate [07:30, 08:20) only touches C1's end at 07:30, and the windows are half-open, so exactly DOCK_BUFFER_MINUTES of clear dock is enough"
            - "Trigger 3 returns 201 — the identical rejected window is free at ST20 because the rule is scoped to one station"
            - "Trigger 5 returns 201: with C1 CANCELLED only the live call C2 [07:40, 08:10) is compared, and the padded candidate [06:50, 07:40) merely touches it"
            - "GET /delivery-calls?station_id=${st10_id} returns total_count == 3 (C1 CANCELLED, ${d2_id} SCHEDULED, ${d4_id} SCHEDULED) — the rejected attempt created nothing"

      - name: shift_plan_overlap_measured_on_the_overtime_extended_end
        grounds:
          - validations[priority=23]
          - errors.ERR_SHIFT_WINDOW_OVERLAP
          - entities.ShiftPlan.fields.overtime_minutes
          - concurrency_rules[shift-plan-create-stale-line]
        distinguishing_aspect: |
          Interval semantics B, the opposite shape from the dock rule: no
          symmetric buffer, but an ASYMMETRIC extension of the candidate's END by
          overtime_minutes, compared against another plan's own extended window
          on the same line. The identical 06:00-14:00 plan is rejected with 60
          overtime minutes and accepted with 0.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1 with stations ST10 and ST20"
            - "ShiftPlan B for 2026-08-03 runs 14:00-22:00 with overtime_minutes 0 and is ACTIVE"
            - "The planner re-reads Line.version before each attempt because every accepted plan bumps it"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_b0: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "B", planned_headcount: 18, shift_start: "2026-08-03T14:00:00Z", shift_end: "2026-08-03T22:00:00Z", overtime_minutes: 0, expected_line_version: "${line_v_b0}" }
              as: ProductionPlanner
              captures: { shift_b_id: $.data.id }
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_b1: $.data.version }
          trigger:
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", overtime_minutes: 60, expected_line_version: "${line_v_b1}" }
              as: ProductionPlanner
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_b2: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", overtime_minutes: 0, expected_line_version: "${line_v_b2}" }
              as: ProductionPlanner
              captures: { shift_a2_id: $.data.id }
          assert:
            - "Trigger 1 returns 409 ERR_SHIFT_WINDOW_OVERLAP: the candidate's effective window [06:00, 15:00) intersects plan B's [14:00, 22:00) for a full hour"
            - "Trigger 2 shows Line.${line_id}.version == ${line_v_b1} — the rejected create bumped nothing, so the same expected_line_version is still current"
            - "Trigger 3 returns 201 with available_labor_minutes == 480 (SHIFT_MINUTES 480 + 0) and status ACTIVE: [06:00, 14:00) only touches plan B's start"
            - "ShiftPlan.${shift_b_id}.status is still ACTIVE and its available_labor_minutes == 480 — a legal neighbour does not supersede it (different shift_code)"
            - "GET /shift-plans?line_id=${line_id} returns total_count == 2 and Line.${line_id}.version == ${line_v_b2} + 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: presentation_slot_units_and_shift_labour_conserved_across_de_sequence
        grounds:
          - state_machines.BuildSlot.SEQUENCED_to_PLANNED
          - calculations.presentation_slot_allocation
          - calculations.shift_committed_labor_minutes
          - entities.Station.fields.presentation_slots_used
        distinguishing_aspect: |
          Conserved quantities: presentation slot units at each Station (and the
          Line's committed total) plus the ShiftPlan's labour minutes. Sequencing
          charges 2 units at ST10 and 150 minutes; de-sequencing must return
          every counter to its pre-sequence value with no drift, and a second
          sequence must re-charge exactly the same amounts.
        test_recipe:
          setup:
            - "Base fixture: clock 2026-08-03T06:00:00Z, Line L1 (ST10 and ST20 both capacity 40, presentation_slots_total 80), SUP1, P-DOOR-A (line_side_max_units 24)"
            - "WM-X RELEASED: 4 option points, 150 labour minutes, POS-DOOR on P-DOOR-A at ST10 qty 2"
            - "ShiftPlan A 06:00-14:00 headcount 20 (available_labor_minutes 480); BuildSlot index 1 (07:00) PLANNED"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
          trigger:
            - call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slot1_id}/de-sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "After trigger 1: Station.${st10_id}.presentation_slots_used == 2, Station.${st20_id}.presentation_slots_used == 0, Line.${line_id}.presentation_slots_committed == 2 and free_slot_pct == 97.50; ShiftPlan.${shift_a_id}.unit_labor_minutes == 150, changeover_minutes == 0 and committed_labor_minutes == 150; BuildSlot.${slot1_id}.allocated_slot_units == 2 with option_points_snapshot 4 and labor_minutes_snapshot 150"
            - "After trigger 2 every charged counter is back to its pre-sequence value: Station.${st10_id}.presentation_slots_used == 0, Line.${line_id}.presentation_slots_committed == 0, free_slot_pct == 100.00, posture == OPEN, ShiftPlan.${shift_a_id}.unit_labor_minutes == 0 and committed_labor_minutes == 0"
            - "After trigger 2 the slot's snapshots are cleared: BuildSlot.${slot1_id}.status == PLANNED with shift_plan_id null, sync_delivery_call_id null, option_points_snapshot null, labor_minutes_snapshot null, presentation_allocations == [] and allocated_slot_units == 0"
            - "After trigger 3 the counters are exactly the trigger-1 values again (ST10 2, committed 2, free_slot_pct 97.50, committed_labor_minutes 150) — release and re-charge are symmetric, with no accumulated drift"

      - name: defect_attribution_conserved_across_warranty_withdrawal
        grounds:
          - state_machines.WarrantyReturn.ANALYZED_SUPPLIER_to_CLOSED_withdraw
          - calculations.warranty_failure_rate
          - calculations.supplier_on_time_score
          - entities.Part.fields.field_failure_count
        distinguishing_aspect: |
          A different conserved quantity from the slot/labour ledger: field
          failure attribution. The SUPPLIER_DEFECT branch charges
          Part.field_failure_count, the cohort rate and the supplier's quality
          penalty and score; withdrawing the return must unwind all four and
          rewrite the disposition to NO_FAULT_FOUND while keeping
          root_cause_part_id for audit.
        test_recipe:
          setup:
            - "Base fixture with unit1 certified, assembled and SHIPPED from BuildSlot index 1 (a shipped cohort of exactly 1 for P-DOOR-A)"
            - "Clock at 2026-08-03T12:00:00Z; WarrantyReturn WR1 on unit1 (field_hours 500) is in TEARDOWN"
            - "WR1 analysed as SUPPLIER_DEFECT against P-DOOR-A, charging SUP1"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
            - *k_clock12
            - *k_wr1
            - *k_wr1_teardown
            - call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "SUPPLIER_DEFECT", root_cause_part_id: "${p_door_id}" }
