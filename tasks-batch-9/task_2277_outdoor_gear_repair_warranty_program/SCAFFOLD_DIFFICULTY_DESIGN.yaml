# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Outdoor Gear Repair & Warranty Program — 25 instances across the nine §0.5 rules
# Every numeric literal below was computed by executing the §1.3 formulas.
# ============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: gear_item_replacement_value_variant_divergence
        grounds:
          - calculations.replacement_value
          - entities.GearItem.fields.replacement_value_depreciated_cents
          - entities.GearItem.fields.replacement_value_successor_cents
          - entities.GearModel.fields.successor_model_id
        distinguishing_aspect: |
          On the GearItem valuation domain the same unit stores two coexisting
          valuations derived from the same inputs: DEPRECIATED_PURCHASE walks the
          74900-cent purchase price down 10% per completed year (3 years -> 52430)
          while SUCCESSOR_MSRP prices 90% of the successor model's 99900-cent MSRP
          (89910) — a 37480-cent divergence on one row.
        test_recipe:
          setup:
            - "logical clock at 2026-06-15T09:00:00Z"
            - "GearModel TNT-ASCENT-2 (TENT_SHELTER, msrp 79900, warranty 5y) discontinued 2024-03-01 with successor TNT-ASCENT-3 (msrp 99900)"
            - "GearItem serial AS2-00417 purchased 2023-05-10 for 74900 by a PRO customer; age_months == 37, completed_years == 3"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-3", name: "Ascent 3P Tent", category: "TENT_SHELTER", msrp_cents: 99900, release_year: 2024, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm3_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5, discontinued_at: "2024-03-01T00:00:00Z", successor_model_id: "${gm3_id}" }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
          assert:
            - "GearItem.${item_id}.age_months == 37"
            - "GearItem.${item_id}.warranty_state == IN_WARRANTY"
            - "GearItem.${item_id}.replacement_value_depreciated_cents == 52430"
            - "GearItem.${item_id}.replacement_value_successor_cents == 89910"
            - "GearItem.${item_id}.replacement_value_successor_cents - GearItem.${item_id}.replacement_value_depreciated_cents == 37480"
            - "the residual floor round_half_up(79900 * 0.25) == 19975 did NOT bind (52430 > 19975)"

      - name: repair_order_provisional_quote_vs_final_invoice_divergence
        grounds:
          - calculations.paid_repair_pricing
          - entities.RepairEstimate.fields.variant
          - entities.RepairOrder.fields.provisional_estimate_total_cents
          - entities.RepairOrder.fields.final_invoice_total_cents
          - state_machines.RepairEstimate.SENT_to_INVOICED
        distinguishing_aspect: |
          On the RepairEstimate pricing domain (a different entity domain from the
          GearItem valuation instance) the PROVISIONAL quote reads typed bench-standard
          minutes and quoted part prices for 11223 cents, while the FINAL invoice reads
          the technician's logged actual_minutes, the CONSUMED reservation's real lot
          price and the expedite fee for 17842 cents — a 6619-cent reconciliation delta.
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; center Cascade Service Hub (cap 5000000, bench 24)"
            - "PRO customer Rowan owns AS2-00417 (TNT-ASCENT-2); zipper-slider lot AS2-ZIP-SLIDER stocked at 3100 cents/unit"
            - "PAID_REPAIR_REQUEST claim assessed USER_DAMAGE for FABRIC+ZIPPER work, decided PAID_REPAIR_OFFERED, order opened with expedite_requested true"
            - "PROVISIONAL quote issued for FABRIC 25 min + ZIPPER 35 min plus a 1800-cent quoted slider, then approved by the owner"
            - "bench work logged as FABRIC 30 min + ZIPPER 40 min, one slider unit reserved and CONSUMED, QC passed by the non-assessing technician"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000, bench_capacity_blocks_per_day: 24 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-3", name: "Ascent 3P Tent", category: "TENT_SHELTER", msrp_cents: 99900, release_year: 2024, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm3_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5, discontinued_at: "2024-03-01T00:00:00Z", successor_model_id: "${gm3_id}" }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/part-lots"
              payload: { gear_model_id: "${gm2_id}", part_code: "AS2-FLOOR-PANEL", part_kind: "FABRIC_PANEL", on_hand_units: 5, unit_price_cents: 4200, low_watermark_units: 2 }
              as: PartsCoordinator
              captures: { lot_panel_id: $.data.id }
            - call: "POST /gear-service/part-lots"
              payload: { gear_model_id: "${gm2_id}", part_code: "AS2-ZIP-SLIDER", part_kind: "ZIPPER_SLIDER", on_hand_units: 4, unit_price_cents: 3100, low_watermark_units: 1 }
              as: PartsCoordinator
              captures: { lot_zip_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-101", full_name: "Ines Park", certifications: [{ work_type: "FABRIC", level: 3 }, { work_type: "ZIPPER", level: 2 }, { work_type: "FRAME", level: 2 }] }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-102", full_name: "Dev Osei", certifications: [{ work_type: "FABRIC", level: 1 }, { work_type: "ZIPPER", level: 3 }] }
              as: ProgramAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "PAID_REPAIR_REQUEST", reported_defect_type: "ZIPPER_FAILURE", customer_narrative: "Door zipper torn after a snag; also a scuffed floor patch." }
              as: ServiceAgent
              captures: { claim_id: $.data.id }
            - call: "POST /gear-service/warranty-claims/${claim_id}/submit"
              payload: {}
              as: ServiceAgent
              captures: { claim_v1: $.data.version }
            - call: "POST /gear-service/warranty-claims/${claim_id}/assessments"
              payload: { expected_claim_version: "${claim_v1}", determination: "USER_DAMAGE", required_work_types: ["FABRIC", "ZIPPER"], estimated_labor_lines: [{ work_type: "FABRIC", minutes: 25 }, { work_type: "ZIPPER", minutes: 35 }], estimated_parts_cents: 1800, defect_notes: "Snag damage, not a defect: zipper tape torn, floor abrasion." }
              as: RepairTechnician
              as_user_id: "${t1_id}"
            - call: "POST /gear-service/warranty-claims/${claim_id}/decision"
              payload: { decision_note: "User damage: quote as paid repair." }
              as: ServiceAgent
            - call: "POST /gear-service/repair-orders"
              payload: { warranty_claim_id: "${claim_id}", expedite_requested: true }
              as: ServiceAgent
              captures: { ro_id: $.data.id, ro_v1: $.data.version }
            - call: "POST /gear-service/repair-orders/${ro_id}/estimates"
              payload: { expected_repair_order_version: "${ro_v1}", labor_lines: [{ work_type: "FABRIC", minutes: 25 }, { work_type: "ZIPPER", minutes: 35 }], parts_lines: [{ part_code: "AS2-ZIP-SLIDER", units: 1, unit_price_cents: 1800 }] }
              as: ServiceAgent
              captures: { est_prov_id: $.data.id, prov_total: $.data.total_cents }
            - call: "POST /gear-service/repair-estimates/${est_prov_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /gear-service/work-blocks"
              payload: { repair_order_id: "${ro_id}", work_type: "FABRIC", start_at: "2026-06-16T09:00:00Z", end_at: "2026-06-16T11:00:00Z", technician_id: "${t1_id}" }
              as: ServiceAgent
              captures: { wb_fabric_id: $.data.id }
            - call: "POST /gear-service/work-blocks"
              payload: { repair_order_id: "${ro_id}", work_type: "ZIPPER", start_at: "2026-06-16T11:00:00Z", end_at: "2026-06-16T13:00:00Z", technician_id: "${t1_id}" }
              as: ServiceAgent
              captures: { wb_zip_id: $.data.id }
            - call: "POST /gear-service/repair-orders/${ro_id}/parts-reservations"
              payload: { part_lot_id: "${lot_zip_id}", required_part_code: "AS2-ZIP-SLIDER", units: 1 }
              as: PartsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /gear-service/parts-reservations/${res_id}/consume"
              payload: {}
              as: RepairTechnician
              as_user_id: "${t1_id}"
            - call: "POST /gear-service/repair-orders/${ro_id}/bench-complete"
              payload: { work_log: [{ work_block_id: "${wb_fabric_id}", actual_minutes: 30 }, { work_block_id: "${wb_zip_id}", actual_minutes: 40 }] }
              as: RepairTechnician
              as_user_id: "${t1_id}"
            - call: "POST /gear-service/repair-orders/${ro_id}/qc-inspections"
              payload: { outcome: "PASS", notes: "Zipper runs clean, patch bonded." }
              as: RepairTechnician
              as_user_id: "${t2_id}"
          trigger:
            - call: "POST /gear-service/repair-orders/${ro_id}/invoice"
              payload: {}
              as: ServiceAgent
              captures: { est_final_id: $.data.id, final_total: $.data.total_cents }
          assert:
            - "RepairEstimate.${est_prov_id}.variant == PROVISIONAL and RepairEstimate.${est_prov_id}.total_cents == 11223"
            - "RepairEstimate.${est_prov_id}.labor_subtotal_cents == 9084 and parts_subtotal_cents == 1800 and shop_supply_fee_cents == 636 and subtotal_cents == 11520 and loyalty_discount_cents == 1152 and expedite_fee_cents == 0 and tax_cents == 855"
            - "RepairEstimate.${est_final_id}.variant == FINAL and RepairEstimate.${est_final_id}.status == INVOICED and total_cents == 17842"
            - "RepairEstimate.${est_final_id}.labor_subtotal_cents == 10583 and parts_subtotal_cents == 3100 and shop_supply_fee_cents == 741 and subtotal_cents == 14424 and loyalty_discount_cents == 1442 and expedite_fee_cents == 3500 and tax_cents == 1360"
            - "RepairOrder.${ro_id}.provisional_estimate_total_cents == 11223 and RepairOrder.${ro_id}.final_invoice_total_cents == 17842"
            - "final minus provisional == 6619"
            - "the FINAL parts line is priced at the lot's 3100 cents, NOT the 1800 cents quoted on the PROVISIONAL row"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: repair_versus_replace_threshold_nonlinear_branching
        grounds:
          - calculations.repair_versus_replace
          - entities.WarrantyClaim.fields.decision_threshold_pct
          - entities.WarrantyClaim.fields.repair_ratio_pct
          - state_machines.WarrantyClaim.UNDER_ASSESSMENT_to_WARRANTY_APPROVED
        distinguishing_aspect: |
          MODE (a): threshold_pct combines four inputs non-linearly —
          max(30, min(90, CATEGORY_REPAIR_CAP_PCT[TENT_SHELTER]=70 + lifetime bonus 0
          - 5 * floor(37/12)=15)) == 55 — and the branch additionally short-circuits on
          determination and parts_support_status before any ratio comparison happens.
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; center cap 5000000 so posture stays OPEN"
            - "TNT-ASCENT-2 TENT_SHELTER, lifetime_warranty false, with an AVAILABLE floor-panel lot so parts_support_status == SUPPORTED"
            - "claim on AS2-00417 (age_months 37) assessed MANUFACTURING_DEFECT, FABRIC 120 min, parts 4200 -> estimated_repair_cost_cents 22390"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-3", name: "Ascent 3P Tent", category: "TENT_SHELTER", msrp_cents: 99900, release_year: 2024, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm3_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5, discontinued_at: "2024-03-01T00:00:00Z", successor_model_id: "${gm3_id}" }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/part-lots"
              payload: { gear_model_id: "${gm2_id}", part_code: "AS2-FLOOR-PANEL", part_kind: "FABRIC_PANEL", on_hand_units: 5, unit_price_cents: 4200, low_watermark_units: 2 }
              as: PartsCoordinator
              captures: { lot_panel_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-101", full_name: "Ines Park", certifications: [{ work_type: "FABRIC", level: 3 }, { work_type: "ZIPPER", level: 2 }, { work_type: "FRAME", level: 2 }] }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "WARRANTY_CLAIM", reported_defect_type: "SEAM_FAILURE", customer_narrative: "Floor seam split along the taped edge on first trip." }
              as: ServiceAgent
              captures: { claim_id: $.data.id }
            - call: "POST /gear-service/warranty-claims/${claim_id}/submit"
              payload: {}
              as: ServiceAgent
              captures: { claim_v1: $.data.version }
            - call: "POST /gear-service/warranty-claims/${claim_id}/assessments"
              payload: { expected_claim_version: "${claim_v1}", determination: "MANUFACTURING_DEFECT", required_work_types: ["FABRIC"], estimated_labor_lines: [{ work_type: "FABRIC", minutes: 120 }], estimated_parts_cents: 4200, defect_notes: "Seam tape delaminated at the factory bond line." }
              as: RepairTechnician
              as_user_id: "${t1_id}"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /gear-service/warranty-claims/${claim_id}/decision"
              payload: { decision_note: "Manufacturing defect confirmed." }
              as: ServiceAgent
          assert:
            - "ClaimAssessment.${asmt_id}.estimated_repair_cost_cents == 22390 (labor 17000 + parts 4200 + supply fee 1190)"
            - "WarrantyClaim.${claim_id}.decision_threshold_pct == 55"
            - "WarrantyClaim.${claim_id}.repair_ratio_pct == 24.90"
            - "WarrantyClaim.${claim_id}.decision == WARRANTY_REPAIR"
            - "WarrantyClaim.${claim_id}.status == WARRANTY_APPROVED"
            - "the FLOOR_PCT 30 and CEILING_PCT 90 clamps did NOT bind (raw_cap 55 sits inside them)"

      - name: final_invoice_per_line_rounding_before_sum
        grounds:
          - calculations.paid_repair_pricing
          - entities.RepairEstimate.fields.labor_subtotal_cents
          - entities.RepairEstimate.fields.shop_supply_fee_cents
        distinguishing_aspect: |
          MODE (b): FABRIC 25 min (8500*25/60 = 3541.67 -> 3542) plus ZIPPER 35 min
          (9500*35/60 = 5541.67 -> 5542) sums to 9084, while the sum-then-round reading
          (545000/60 = 9083.33 -> 9083) yields 9083; the scaffold pins per-line rounding,
          and the 1-cent divergence propagates into the supply fee input.
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; PAID_REPAIR order on AS2-00417 for a PRO customer, billing_status ESTIMATE_PENDING"
            - "no surge window, queue empty"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/part-lots"
              payload: { gear_model_id: "${gm2_id}", part_code: "AS2-FLOOR-PANEL", part_kind: "FABRIC_PANEL", on_hand_units: 5, unit_price_cents: 4200, low_watermark_units: 2 }
              as: PartsCoordinator
              captures: { lot_panel_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-101", full_name: "Ines Park", certifications: [{ work_type: "FABRIC", level: 3 }, { work_type: "ZIPPER", level: 2 }] }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "PAID_REPAIR_REQUEST", reported_defect_type: "ZIPPER_FAILURE", customer_narrative: "Zipper snagged and the floor is scuffed." }
              as: ServiceAgent
              captures: { claim_id: $.data.id }
            - call: "POST /gear-service/warranty-claims/${claim_id}/submit"
              payload: {}
              as: ServiceAgent
              captures: { claim_v1: $.data.version }
            - call: "POST /gear-service/warranty-claims/${claim_id}/assessments"
              payload: { expected_claim_version: "${claim_v1}", determination: "USER_DAMAGE", required_work_types: ["FABRIC", "ZIPPER"], estimated_labor_lines: [{ work_type: "FABRIC", minutes: 25 }, { work_type: "ZIPPER", minutes: 35 }], estimated_parts_cents: 1800, defect_notes: "Abrasion and snag damage." }
              as: RepairTechnician
              as_user_id: "${t1_id}"
            - call: "POST /gear-service/warranty-claims/${claim_id}/decision"
              payload: {}
              as: ServiceAgent
            - call: "POST /gear-service/repair-orders"
              payload: { warranty_claim_id: "${claim_id}" }
              as: ServiceAgent
              captures: { ro_id: $.data.id, ro_v1: $.data.version }
          trigger:
            - call: "POST /gear-service/repair-orders/${ro_id}/estimates"
              payload: { expected_repair_order_version: "${ro_v1}", labor_lines: [{ work_type: "FABRIC", minutes: 25 }, { work_type: "ZIPPER", minutes: 35 }], parts_lines: [{ part_code: "AS2-ZIP-SLIDER", units: 1, unit_price_cents: 1800 }] }
              as: ServiceAgent
              captures: { est_id: $.data.id }
          assert:
            - "RepairEstimate.${est_id}.labor_subtotal_cents == 9084 (per-line 3542 + 5542), NOT 9083"
            - "RepairEstimate.${est_id}.shop_supply_fee_cents == 636 (round_half_up(0.07 * 9084) = 636, and the cap 2500 did not bind)"
            - "RepairEstimate.${est_id}.subtotal_cents == 11520"
            - "RepairEstimate.${est_id}.total_cents == 11223"
            - "RepairEstimate.${est_id}.status == SENT and variant == PROVISIONAL"

      - name: turnaround_commitment_queue_snapshot_evaluation_order
        grounds:
          - calculations.turnaround_commitment
          - entities.RepairOrder.fields.queue_depth_snapshot
          - entities.RepairOrder.fields.surge_multiplier_applied
          - entities.RepairOrder.fields.promised_days
          - entities.ServiceCenter.fields.active_queue_depth
          - entities.SurgeWindow.fields.multiplier
        distinguishing_aspect: |
          MODE (c): the commitment looks circular — the multiplier depends on the queue
          depth, yet this order joins that queue — so the scaffold pins the order:
          snapshot the depth BEFORE insert (0 -> tier 1.00), take max(tier, ACTIVE window
          1.50) == 1.50, ceil(14 * 1.50) == 21 BEFORE adding parts_wait_days 0, then
