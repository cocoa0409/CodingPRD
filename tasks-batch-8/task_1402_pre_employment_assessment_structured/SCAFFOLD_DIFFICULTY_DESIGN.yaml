            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
          trigger:
            - { call: "POST /talent/cycles/${cy}/freeze", payload: { reason_note: "Manual compliance hold for review." }, as: ComplianceOfficer, captures: { p1: $.data.posture, ff1: $.data.frozen_from_posture, fr1: $.data.frozen_reason } }
            - { call: "POST /talent/cycles/${cy}/unfreeze", payload: { resolution_note: "Reviewed and cleared by compliance." }, as: ComplianceOfficer, captures: { p2: $.data.posture, ff2: $.data.frozen_from_posture } }
            - { call: "POST /talent/cycles/${cy}/begin-scoring", as: HiringManager, as_user_id: hm-1, captures: { p3: $.data.posture } }
            - { call: "POST /talent/cycles/${cy}/freeze", payload: { reason_note: "Second manual hold for audit." }, as: ComplianceOfficer, captures: { p4: $.data.posture, ff4: $.data.frozen_from_posture } }
            - { call: "POST /talent/cycles/${cy}/unfreeze", payload: { resolution_note: "Audit complete; resume scoring." }, as: ComplianceOfficer, captures: { p5: $.data.posture, ff5: $.data.frozen_from_posture, fr5: $.data.frozen_reason } }
          assert:
            - "First freeze: posture == FROZEN, frozen_from_posture == ACTIVE, frozen_reason == MANUAL"
            - "First unfreeze: posture == ACTIVE (restored), frozen_from_posture == null"
            - "begin-scoring: posture == SCORING"
            - "Second freeze: posture == FROZEN, frozen_from_posture == SCORING"
            - "Second unfreeze: posture == SCORING (restored, NOT ACTIVE), frozen fields cleared"
