          The three common_fields false entities are append-only evidence: their rows carry id and
          created_at but no version or updated_at, no endpoint updates or deletes them, and a second
          attempt of results adds a new attempt_index rather than mutating the first. The first
          attempt's rows remain byte-identical and readable after the second attempt.
