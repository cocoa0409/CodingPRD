  - method: POST
    path: /watch/watch-groups/{id}/certification-suspend
    description: "Suspend a group's program standing (certification_status UNCERTIFIED|PROVISIONAL|CERTIFIED -> SUSPENDED). Administrative action by program staff. No-op-free: calling it on SUSPENDED/REVOKED fails ERR_INVALID_STATE."
    roles: [ProgramCoordinator]
