        distinguishing_aspect: "The SUBMITTED ↔ CHANGES_REQUESTED loop increments revision_round on the REVIEW leg only (never on the revision leg), so the third change request lands on round 3 and the next resubmission is refused with ERR_ADAPTATION_ROUND_LIMIT — an implementation that counted both legs would stop a round early."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a school; an applicant artist tagged DANCE / G3_5 / en; a DRAFT residency; one DANCE / G3_5 / CREATING standard; one lesson plan authored by that artist."
