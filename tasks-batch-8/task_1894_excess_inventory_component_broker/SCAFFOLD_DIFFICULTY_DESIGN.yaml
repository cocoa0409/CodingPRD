              as: BrokerOps
            - call: "POST /buy-offers/${o14_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o14_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin14_id}" }
              as: BrokerOps
              captures: { lot14_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot14_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { lst14_id: $.data.id }
            - call: "POST /listings/${lst14_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c14_id}", listing_id: "${lst14_id}", quantity: 2 }
              as: Customer
              as_user_id: "${c14_id}"
              captures: { ord14_id: $.data.id }
            - call: "POST /sales-orders/${ord14_id}/escrow/deposit"
              payload: { amount_cents: 10000 }
              as: Customer
              as_user_id: "${c14_id}"
            - call: "POST /sales-orders/${ord14_id}/fulfill"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord14_id}/ship"
              payload: {}
