# =============================================================================
# Task 1887 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances each. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and drives empty-DB -> precondition via §1.5 calls only.
# Logical clock default: 2026-08-01T00:00:00Z (set explicitly where relied on).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: income_tier_provisional_vs_final
        grounds:
          - calculations.income_tier_determination
          - entities.AssistanceApplication.fields.provisional_benefit_tier
          - entities.AssistanceApplication.fields.benefit_tier
        distinguishing_aspect: |
          Income-eligibility domain (AssistanceApplication): identical submitted
          income data yields TIER_1 under the ANNUALIZED_CURRENT_MONTH variant
          (250000*12 = 3000000 <= 150% FPL(2) = 3172500) but TIER_2 under the
          ANNUAL_GROSS variant (4000000 > 3172500, <= 200% FPL(2) = 4230000).
        test_recipe:
          setup:
            - "Account exists; application submitted with household_size=2, gross_annual_income_cents=4000000, current_month_income_cents=250000; application reaches UNDER_REVIEW held by a different user than the submitter."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "100 Elm St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 4000000, current_month_income_cents: 250000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id", prov_tier: "$.data.provisional_benefit_tier" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { final_tier: "$.data.benefit_tier", measure: "$.data.income_measure_used", app_status: "$.data.status" }
          assert:
            - "captured provisional tier at creation == TIER_1 (ANNUALIZED_CURRENT_MONTH variant)"
            - "AssistanceApplication.${app_id}.benefit_tier == TIER_2 (ANNUAL_GROSS variant on identical inputs)"
            - "AssistanceApplication.${app_id}.income_measure_used == ANNUAL_GROSS"
            - "AssistanceApplication.${app_id}.status == VERIFIED"
            - "provisional and final tiers differ: TIER_1 != TIER_2"

      - name: forgiveness_projected_vs_posted
        grounds:
          - calculations.forgiveness_accrual
          - entities.DeferredPaymentAgreement.fields.projected_forgiveness_cents
          - entities.DeferredPaymentAgreement.fields.forgiven_posted_cents
        distinguishing_aspect: |
          DPA/forgiveness domain (DeferredPaymentAgreement), a different entity
          domain from income eligibility: at activation PROJECTED forgiveness is
          the full pool (40000) while POSTED is 0; after one on-time installment
          POSTED becomes 10000 while PROJECTED remains 40000 — same ledger, two
          valid algorithms, divergent values.
        test_recipe:
          setup:
            - "Account with arrearage 120000 cents and an ACTIVE TIER_2 enrollment; DPA created with installment_count=4 (down=6000, pool=40000, installment=18500); down payment 6000 posted so the DPA is ACTIVE (activated 2026-08-01, first installment due 2026-08-31)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "200 Oak Ave" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id", pool: "$.data.forgiveness_pool_cents", projected0: "$.data.projected_forgiveness_cents", posted0: "$.data.forgiven_posted_cents" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 6000, tender_type: "CASH" }
              as: CustomerServiceRep
              captures: { pay_down: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 18500, tender_type: "CARD" }
              as: CustomerServiceRep
              captures: { credit_amt: "$.data.credit_accrued_cents", settled: "$.data.installments_settled_count", on_time: "$.data.on_time" }
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { posted1: "$.data.forgiven_posted_cents", projected1: "$.data.projected_forgiveness_cents", remaining1: "$.data.remaining_balance_cents" }
          assert:
            - "at activation: DPA.${dpa_id}.projected_forgiveness_cents == 40000 AND forgiven_posted_cents == 0"
            - "Payment.credit_accrued_cents == 10000 (round_half_up(40000/4)); on_time == true; installments_settled_count == 1"
            - "after payment: DPA.forgiven_posted_cents == 10000 while DPA.projected_forgiveness_cents == 40000 (variants diverge)"
            - "DPA.remaining_balance_cents == 85500 (120000 - 24500 paid - 10000 posted)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dpa_down_payment_tiered_terms
        grounds:
          - calculations.dpa_terms_computation
          - entities.DeferredPaymentAgreement.fields.down_payment_required_cents
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs (tier, covered arrearage,
          installment_count) and non-linear interaction (conditional tier
          branches over nested max/round): identical covered=120000, n=4 yields
          down=6000/pool=40000/installment=18500 for a TIER_2-enrolled account
          but down=12000/pool=0/installment=27000 with no enrollment.
        test_recipe:
          setup:
            - "Account X: arrearage 120000, ACTIVE TIER_2 enrollment. Account Y: arrearage 120000, no enrollment. Both have a freshly captured version for OCC."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "10 Tier Lane X" }
              as: ProgramAdmin
              captures: { acct_x: "$.data.id", acct_x_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_x}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_x}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_x_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_x: "$.data.id" }
            - call: "POST /assistance/applications/${app_x}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_x}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_x: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_x}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/accounts"
              payload: { service_address: "11 Tier Lane Y" }
              as: ProgramAdmin
              captures: { acct_y: "$.data.id", acct_y_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_y}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_x}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_x_v2: "$.data.version" }
            - call: "GET /assistance/accounts/${acct_y}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_y_v2: "$.data.version" }
          trigger:
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_x}", installment_count: 4, expected_account_version: "${acct_x_v2}" }
              as: CustomerServiceRep
              captures: { dpa_x: "$.data.id", x_down: "$.data.down_payment_required_cents", x_pool: "$.data.forgiveness_pool_cents", x_inst: "$.data.installment_amount_cents" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_y}", installment_count: 4, expected_account_version: "${acct_y_v2}" }
              as: CustomerServiceRep
              captures: { dpa_y: "$.data.id", y_down: "$.data.down_payment_required_cents", y_pool: "$.data.forgiveness_pool_cents", y_inst: "$.data.installment_amount_cents" }
          assert:
            - "DPA.${dpa_x}.down_payment_required_cents == 6000 (max(round_half_up(120000*0.05)=6000, 2500))"
            - "DPA.${dpa_x}.forgiveness_pool_cents == 40000 AND installment_amount_cents == 18500 ((120000-6000-40000)/4)"
            - "DPA.${dpa_y}.down_payment_required_cents == 12000 (max(round_half_up(120000*0.10)=12000, 5000))"
            - "DPA.${dpa_y}.forgiveness_pool_cents == 0 (NONE tier share) AND installment_amount_cents == 27000 ((120000-12000-0)/4)"
            - "identical covered arrearage and n produce different schedules purely from the tier branch"

      - name: reconnection_fee_nested_rounding
        grounds:
          - calculations.reconnection_fee_computation
          - entities.CustomerAccount.fields.reconnection_fee_due_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different from mode
          (a) above): each fee component is rounded BEFORE summation, so a
          TIER_2 (waiver 30%) after-hours reconnect costs round(3325*0.7)=2328
          plus round(round(3325*0.5)=1663 * 0.7)=1164, total 3492 — the
          unpinned sum-then-round order would yield 3491.
        test_recipe:
          setup:
            - "Account with deposit_held_cents=7500, ACTIVE TIER_2 enrollment, arrearage 120000 aged DELINQUENT; manual shutoff order scheduled 2026-09-30 created at clock 2026-09-15; clock advanced to 2026-09-30; order executed (account DISCONNECTED, fee base 2328 snapshotted, deposit top-up 0)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "55 Pine Rd", deposit_held_cents: 7500 }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders/${order_id}/execute"
              payload: {}
              as: FieldCrew
          trigger:
            - call: "POST /assistance/accounts/${acct_id}/reconnect"
              payload: { after_hours: true }
              as: FieldCrew
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: FieldCrew
              captures: { fee_due: "$.data.reconnection_fee_due_cents", fee_base: "$.data.reconnection_fee_base_cents", fee_sur: "$.data.reconnection_fee_surcharge_cents", topup: "$.data.reconnection_deposit_topup_cents", sur_applied: "$.data.reconnection_surcharge_applied" }
          assert:
            - "at execution: reconnection_fee_base_cents == 2328 (round_half_up(3325*0.7)); reconnection_fee_surcharge_cents == 1164; reconnection_deposit_topup_cents == 0 (deposit_held 7500 covers requirement)"
            - "reconnect attempt with after_hours=true fails: error_id == ERR_RECONNECTION_FEE_UNPAID (fee unpaid)"
            - "after the attempt: CustomerAccount.${acct_id}.reconnection_fee_due_cents == 3492 (2328 + 1164 — pinned per-component rounding, NOT 3491)"
            - "reconnection_surcharge_applied == true (fold-in happens exactly once)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_docs_request_cycle
        grounds:
          - state_machines.AssistanceApplication.UNDER_REVIEW_to_DOCS_PENDING
          - state_machines.AssistanceApplication.DOCS_PENDING_to_UNDER_REVIEW
        distinguishing_aspect: |
          AssistanceApplication is cyclic: UNDER_REVIEW -> DOCS_PENDING ->
          UNDER_REVIEW can repeat; two full loop iterations complete and the
          machine still reaches VERIFIED with flags docs_requested and
          documents_received accumulated across loops.
        test_recipe:
          setup:
            - "Account exists; application (household_size=1, gross_annual_income_cents=1000000) UNDER_REVIEW held by es_1 (submitter csr_1)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "7 Cycle Ct" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 1000000, current_month_income_cents: 90000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/request-documents"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { s1: "$.data.status" }
            - call: "POST /assistance/applications/${app_id}/submit-documents"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { s2: "$.data.status", docs_rec: "$.data.documents_received" }
            - call: "POST /assistance/applications/${app_id}/request-documents"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { s3: "$.data.status" }
            - call: "POST /assistance/applications/${app_id}/submit-documents"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { s4: "$.data.status" }
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { s5: "$.data.status", tier: "$.data.benefit_tier" }
          assert:
            - "loop 1: status DOCS_PENDING then UNDER_REVIEW with documents_received == true"
            - "loop 2 repeats: status DOCS_PENDING then UNDER_REVIEW again (cycle, not terminal)"
            - "final verify succeeds: status VERIFIED, benefit_tier == TIER_1 (1000000*100 <= 150*1565000)"

      - name: dpa_default_reinstate_cycle
        grounds:
          - state_machines.DeferredPaymentAgreement.ACTIVE_to_DEFAULTED
          - state_machines.DeferredPaymentAgreement.DEFAULTED_to_ACTIVE
        distinguishing_aspect: |
          DeferredPaymentAgreement is cyclic on a different entity: ACTIVE ->
          DEFAULTED via sweep when installment 1 (due 2026-08-31 + 5 grace) is
          unsettled at clock 2026-09-06, then DEFAULTED -> ACTIVE via reinstate
          after the missed installment is settled inside the 15-day cure window.
        test_recipe:
          setup:
            - "Account with arrearage 120000 (no enrollment); DPA n=4 created and activated by 12000 down payment on 2026-08-01 (installment 27000, first due 2026-08-31); clock advanced to 2026-09-06 (past due+grace)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "8 Default Dr" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { defaulted: "$.data.dpas_defaulted" }
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { mid_status: "$.data.status", mid_missed: "$.data.missed_payment_count" }
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 27000, tender_type: "CHECK" }
              as: CustomerServiceRep
              captures: { pay_on_time: "$.data.on_time", pay_settled: "$.data.installments_settled_count" }
            - call: "POST /assistance/dpas/${dpa_id}/reinstate"
              payload: {}
              as: CustomerServiceRep
              captures: { final_status: "$.data.status", final_defaulted_on: "$.data.defaulted_on" }
          assert:
            - "after sweep: DPA.${dpa_id}.status == DEFAULTED, missed_payment_count == 1 (sweep count dpas_defaulted == 1)"
            - "catch-up payment settles installment 1: installments_settled_count == 1, on_time == false (2026-09-06 > 2026-08-31 + 5)"
            - "reinstate inside cure window (2026-09-06 <= defaulted_on + 15): status == ACTIVE, defaulted_on == null — cycle closed"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: certificate_expiry_cascade
        grounds:
          - state_machines.MedicalCertificate.ACTIVE_to_EXPIRED
          - state_machines.CustomerAccount.MEDICAL_MORATORIUM_to_UNPROTECTED
          - state_machines.CustomerAccount.CONNECTED_to_DISCONNECT_PENDING
          - calculations.protection_gate
        distinguishing_aspect: |
          Depth-4 cascade triggered by the daily sweep: certificate EXPIRED ->
          protection recomputed UNPROTECTED -> ShutoffOrder auto-created
          SCHEDULED -> account service_status DISCONNECT_PENDING; each link is
          caused by the previous one, not by the sweep directly.
        test_recipe:
          setup:
            - "Account with arrearage 150000 charged 2026-08-01; at clock 2026-09-15 a medical certificate with window [2026-09-10, 2026-10-10) is registered (protection MEDICAL_MORATORIUM, no shutoff order exists); clock advanced to 2026-10-10 — the half-open window no longer covers the clock date."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "21 Cascade Way" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 150000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. A", physician_license_number: "L-1", condition_class: "SERIOUS", effective_from: "2026-09-10" }
              as: CustomerServiceRep
              captures: { cert_id: "$.data.id", cert_status: "$.data.status" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { certs_expired: "$.data.certificates_expired", orders_made: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_prot: "$.data.protection_status", acct_svc: "$.data.service_status" }
            - call: "GET /assistance/shutoff-orders"
              payload: {}
              as: ProgramAdmin
              captures: { ord_status: "$.data[0].status", ord_origin: "$.data[0].origin", ord_sched: "$.data[0].scheduled_date" }
          assert:
            - "sweep: certificates_expired == 1 and orders_created == 1"
            - "MedicalCertificate.${cert_id}.status == EXPIRED (link 1: clock 2026-10-10 >= effective_to, half-open)"
            - "CustomerAccount.${acct_id}.protection_status == UNPROTECTED (link 2: caused by link 1)"
            - "ShutoffOrder auto-created: status == SCHEDULED, origin == AUTO, scheduled_date == 2026-10-25 (clock + 15 notice) (link 3: caused by link 2 — account is SEVERELY_DELINQUENT, balance 150000 >= 10000)"
            - "CustomerAccount.${acct_id}.service_status == DISCONNECT_PENDING (link 4: caused by link 3)"

      - name: payment_activates_dpa_cancels_shutoff
        grounds:
          - state_machines.DeferredPaymentAgreement.DRAFT_to_ACTIVE
          - state_machines.ShutoffOrder.SCHEDULED_to_CANCELLED
          - state_machines.CustomerAccount.DISCONNECT_PENDING_to_CONNECTED
          - calculations.payment_application_waterfall
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (payment posting, not the
          sweep): payment -> waterfall completes down payment -> DPA DRAFT ->
          ACTIVE -> open ShutoffOrder auto-CANCELLED (kept-current DPA) ->
          account service_status returns to CONNECTED.
        test_recipe:
          setup:
            - "Account with arrearage 120000 charged 2026-08-01; at clock 2026-09-15 a manual shutoff order is SCHEDULED for 2026-09-30 (account DISCONNECT_PENDING); a DRAFT DPA (n=4, no enrollment, down 12000) exists on the account."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "22 Cascade Way" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "MONEY_ORDER" }
              as: CustomerServiceRep
              captures: { pay_breakdown: "$.data.applied_breakdown", pay_dpa: "$.data.dpa_id" }
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { dpa_status: "$.data.status", dpa_first_due: "$.data.first_installment_due_on" }
            - call: "GET /assistance/shutoff-orders/${order_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { ord_status: "$.data.status" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_svc: "$.data.service_status", acct_arr: "$.data.arrearage_balance_cents" }
          assert:
            - "Payment.applied_breakdown.down_payment_cents == 12000 and Payment.dpa_id == DPA.${dpa_id}.id (link 1)"
            - "DPA.${dpa_id}.status == ACTIVE, first_installment_due_on == 2026-10-15 (activation 2026-09-15 + 30 days) (link 2)"
            - "ShutoffOrder.${order_id}.status == CANCELLED (link 3: kept-current ACTIVE DPA auto-cancels the open order)"
            - "CustomerAccount.${acct_id}.service_status == CONNECTED and arrearage_balance_cents == 108000 (120000 - 12000)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shutoff_create_state_beats_moratorium_safety
        grounds:
          - validations[priority=8]
          - validations[priority=17]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a manual shutoff create
          on an already-DISCONNECTED account during an active WEATHER_MORATORIUM
          violates priority 8 (ERR_ACCOUNT_NOT_CONNECTED, 409) and priority 17
          (ERR_SHUTOFF_BLOCKED_BY_MORATORIUM, 422); the state error wins.
        test_recipe:
          setup:
            - "Account already DISCONNECTED (prior order executed 2026-09-30); clock advanced to 2026-11-15 (winter season); a daily sweep has run so protection_status == WEATHER_MORATORIUM."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "31 Priority Pl" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders/${order_id}/execute"
              payload: {}
              as: FieldCrew
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-11-30" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_CONNECTED (state, priority 8) — NOT ERR_SHUTOFF_BLOCKED_BY_MORATORIUM (business_safety, priority 17), although both conditions hold"
            - "HTTP status 409 (the state category's status), proving the priority ordering not just the id"

      - name: allocation_referential_beats_fiscal
        grounds:
          - validations[priority=19]
          - validations[priority=32]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal (different
          from state vs safety above): allocation on an account whose enrollment
          LAPSED violates priority 19 (ERR_ENROLLMENT_REQUIRED) while the
          requested amount also exceeds every eligible fund (priority 32,
          ERR_INSUFFICIENT_ASSISTANCE_FUNDS); the referential error wins.
        test_recipe:
          setup:
            - "Account with TIER_1 enrollment ACTIVATED 2026-08-01 (recert_due 2027-08-01); an OPEN funding source FY2026 appropriated 50000; clock advanced to 2027-08-01 and swept, so the enrollment is LAPSED and the fund's fiscal_year no longer matches the clock year."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "32 Priority Pl" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "Utility Trust 2026", funder_type: "UTILITY_TRUST", fiscal_year: 2026, appropriated_cents: 50000, priority_rank: 1, eligible_tiers: ["TIER_1", "TIER_2", "TIER_3"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { lapsed: "$.data.enrollments_lapsed" }
          trigger:
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 100000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "setup confirms enrollments_lapsed == 1 (enrollment LAPSED at recert date)"
            - "error_id == ERR_ENROLLMENT_REQUIRED (business_referential, priority 19) — NOT ERR_INSUFFICIENT_ASSISTANCE_FUNDS (business_fiscal, priority 32), although amount 100000 exceeds the fund's 50000 and the fund is also FY-ineligible"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: income_exactly_150pct_fpl_qualifies_tier1
        grounds:
          - calculations.income_tier_determination
          - validations[priority=4]
        distinguishing_aspect: |
          Metric: income ratio. gross_annual_income_cents == 2347500 is exactly
          150% of FPL(1) (1565000 * 150% = 2347500); the pinned <= comparison
          qualifies TIER_1 at the exact boundary (verify endpoint).
        test_recipe:
          setup:
            - "Account; application with household_size=1 and gross_annual_income_cents=2347500, UNDER_REVIEW by es_1."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "41 Boundary Blvd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 2347500, current_month_income_cents: 100000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { tier: "$.data.benefit_tier", st: "$.data.status" }
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_tier: "$.data[0].tier", enr_disc: "$.data[0].discount_pct", enr_status: "$.data[0].status" }
          assert:
            - "2347500 * 100 == 150 * 1565000 exactly -> boundary qualifies: benefit_tier == TIER_1, status == VERIFIED"
            - "created enrollment: tier == TIER_1, discount_pct == 50, status == PENDING"

      - name: cold_moratorium_boundary_exactly_32f
        grounds:
          - calculations.protection_gate
          - state_machines.CustomerAccount.UNPROTECTED_to_WEATHER_MORATORIUM
        distinguishing_aspect: |
          Metric: temperature in whole degrees F (different metric from income
          ratio), reached through the daily-sweep endpoint (different endpoint
          from verify): observed_low_f == 32 triggers WEATHER_MORATORIUM (<=),
          while 33 does not and the shutoff auto-creation fires.
        test_recipe:
          setup:
            - "Account with arrearage 120000 charged 2026-08-01; clock 2026-09-15 (DELINQUENT, eligible for auto shutoff); no certificates; no open order."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "42 Boundary Blvd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_low_f: 32 }
              as: ProgramAdmin
              captures: { made_32: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot_32: "$.data.protection_status" }
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_low_f: 33 }
              as: ProgramAdmin
              captures: { made_33: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot_33: "$.data.protection_status", svc_33: "$.data.service_status" }
          assert:
            - "at exactly 32F: protection_status == WEATHER_MORATORIUM and orders_created == 0 (inclusive <= boundary)"
            - "at 33F (one degree above): protection_status == UNPROTECTED, orders_created == 1, service_status == DISCONNECT_PENDING"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shutoff_create_blocked_by_active_medical_certificate
        grounds:
          - validations[priority=16]
          - state_machines.MedicalCertificate
          - entities.CustomerAccount.fields.protection_status
        distinguishing_aspect: |
          Entity pair ShutoffOrder x MedicalCertificate: a valid manual shutoff
          create is rejected solely because a different entity — an ACTIVE
          MedicalCertificate whose window covers the clock date — exists on the
          account (ERR_SHUTOFF_BLOCKED_BY_MEDICAL).
        test_recipe:
          setup:
            - "Account with arrearage 120000 charged 2026-08-01; clock 2026-09-15 (DELINQUENT, shutoff-eligible); certificate window [2026-09-01, 2026-10-01) covers the clock date."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "51 Cross St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. B", physician_license_number: "L-2", condition_class: "LIFE_THREATENING", effective_from: "2026-09-01" }
              as: CustomerServiceRep
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot: "$.data.protection_status", svc: "$.data.service_status" }
          assert:
            - "error_id == ERR_SHUTOFF_BLOCKED_BY_MEDICAL (422) despite delinquency, notice period, and no-open-order all being satisfied"
            - "CustomerAccount.${acct_id}.protection_status == MEDICAL_MORATORIUM and service_status remains CONNECTED (no order created)"

      - name: allocation_requires_completed_referral
        grounds:
          - calculations.fund_waterfall_allocation
          - state_machines.AssistanceReferral.INITIATED_to_COMPLETED
        distinguishing_aspect: |
          Entity pair FundAllocation x AssistanceReferral (different from
          ShutoffOrder x MedicalCertificate): a LIHEAP fund with
          requires_completed_referral=true is invisible to the waterfall while
          the account's referral is INITIATED, and becomes eligible only after
          the referral transitions to COMPLETED.
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_1 enrollment; LIHEAP fund FY2026 appropriated 100000 requires_completed_referral=true; referral INITIATED but not completed."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "52 Cross St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "LIHEAP 2026", funder_type: "LIHEAP", fiscal_year: 2026, appropriated_cents: 100000, priority_rank: 1, eligible_tiers: ["TIER_1"], requires_completed_referral: true }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/referrals"
              payload: { account_id: "${acct_id}", agency_code: "COMM_ACTION" }
              as: CustomerServiceRep
              captures: { ref_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 50000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /assistance/referrals/${ref_id}/complete"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 50000 }
              as: ProgramAdmin
              captures: { alloc_id: "$.data[0].id", alloc_fund: "$.data[0].funding_source_id", alloc_amt: "$.data[0].amount_cents", alloc_status: "$.data[0].status" }
          assert:
            - "while referral INITIATED: error_id == ERR_INSUFFICIENT_ASSISTANCE_FUNDS (referral-gated fund excluded from the eligible pool)"
            - "after referral COMPLETED: allocation created — funding_source_id == FundingSource.${fund_id}.id, amount_cents == 50000, status == PLEDGED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: certificate_window_overlap_half_open_adjacency
        grounds:
          - calculations.certificate_window_arithmetic
          - validations[priority=26]
        distinguishing_aspect: |
          Interval semantics: half-open windows — a new certificate overlapping
          an ACTIVE one is rejected, but a new certificate starting exactly at
          the existing window's effective_to (adjacency, zero gap) is accepted.
        test_recipe:
          setup:
            - "Account with ACTIVE certificate C1 covering [2026-01-05, 2026-02-04); clock 2026-01-10."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "61 Interval Ave" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. C", physician_license_number: "L-3", condition_class: "SERIOUS", effective_from: "2026-01-05" }
              as: CustomerServiceRep
              captures: { cert1_id: "$.data.id", cert1_to: "$.data.effective_to" }
          trigger:
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. D", physician_license_number: "L-4", condition_class: "SERIOUS", effective_from: "2026-01-20" }
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. E", physician_license_number: "L-5", condition_class: "SERIOUS", effective_from: "2026-02-04" }
              as: CustomerServiceRep
              captures: { cert2_id: "$.data.id", cert2_to: "$.data.effective_to", cert2_status: "$.data.status" }
          assert:
            - "overlapping create (from 2026-01-20 < C1.effective_to 2026-02-04): error_id == ERR_CERTIFICATE_WINDOW_OVERLAP (422)"
            - "adjacent create (from == C1.effective_to == 2026-02-04): accepted — half-open semantics treat adjacency as non-overlap"
            - "new certificate effective_to == 2026-03-06 (2026-02-04 + 30 days), status == ACTIVE"

      - name: dpa_single_active_capacity_per_account
        grounds:
          - validations[priority=24]
          - state_machines.DeferredPaymentAgreement
        distinguishing_aspect: |
          Interval semantics: aggregate capacity (different from half-open
          adjacency) — the account's DPA slot holds at most one ACTIVE|DEFAULTED
          agreement over its occupancy interval; a DRAFT is superseded (not an
          error), the ACTIVE blocks a successor, and a terminal agreement frees
          the slot for an immediate successor.
        test_recipe:
          setup:
            - "Account with arrearage 120000 charged 2026-08-01; DPA-1 (DRAFT) exists; DPA-2 created (supersedes DPA-1) and activated via its 12000 down payment."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "62 Interval Ave" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { v1: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${v1}" }
              as: CustomerServiceRep
              captures: { dpa1: "$.data.id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { v2: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${v2}" }
              as: CustomerServiceRep
              captures: { dpa2: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
          trigger:
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { v3: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 6, expected_account_version: "${v3}" }
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
            - call: "POST /assistance/dpas/${dpa2}/cancel"
              payload: {}
              as: CustomerServiceRep
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { v4: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 6, expected_account_version: "${v4}" }
              as: CustomerServiceRep
              captures: { dpa4: "$.data.id", dpa4_status: "$.data.status" }
            - call: "GET /assistance/dpas/${dpa1}"
              payload: {}
              as: CustomerServiceRep
              captures: { dpa1_status: "$.data.status" }
          assert:
            - "while DPA-2 ACTIVE: create fails with error_id == ERR_OPEN_DPA_EXISTS (422) — capacity occupied"
            - "after DPA-2 CANCELLED: create succeeds (capacity freed at terminal state), new DPA status == DRAFT"
            - "DPA-1 status == CANCELLED (superseded DRAFT did not count against capacity)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fund_conservation_allocate_release_roundtrip
        grounds:
          - calculations.funding_report_aggregation
          - state_machines.FundAllocation.PLEDGED_to_RELEASED
          - entities.FundingSource.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: fund money pool — available_cents ==
          appropriated_cents - pledged_cents - disbursed_cents at every step;
          allocate (60000) followed by its compensating release returns
          available_cents to exactly the pre-allocate value (100000).
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_2 enrollment; fund FY2026 appropriated 100000 (clock year 2026)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "71 Ledger Ln" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "State Grant 2026", funder_type: "STATE_GRANT", fiscal_year: 2026, appropriated_cents: 100000, priority_rank: 1, eligible_tiers: ["TIER_1", "TIER_2", "TIER_3"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 60000 }
              as: ProgramAdmin
              captures: { alloc_id: "$.data[0].id" }
            - call: "GET /assistance/funding-sources/${fund_id}/report"
              payload: {}
              as: ProgramAdmin
              captures: { rep_pledged: "$.data.pledged_cents", rep_avail: "$.data.available_cents", rep_disb: "$.data.disbursed_cents", rep_rel: "$.data.released_cents" }
            - call: "POST /assistance/fund-allocations/${alloc_id}/release"
              payload: {}
              as: ProgramAdmin
            - call: "GET /assistance/funding-sources/${fund_id}/report"
              payload: {}
              as: ProgramAdmin
              captures: { rep2_pledged: "$.data.pledged_cents", rep2_avail: "$.data.available_cents", rep2_rel: "$.data.released_cents" }
          assert:
            - "after allocate: pledged_cents == 60000, available_cents == 40000, disbursed_cents == 0, released_cents == 0"
            - "invariant holds mid-flight: available == appropriated - pledged - disbursed == 100000 - 60000 - 0 == 40000"
            - "after compensating release: pledged_cents == 0, available_cents == 100000 (exactly restored), released_cents == 60000"
            - "invariant holds after round-trip: pledged + disbursed + released == total ever allocated == 60000; available back to the pre-allocate 100000"

      - name: dpa_ledger_conservation_through_break
        grounds:
          - calculations.forgiveness_accrual
          - state_machines.DeferredPaymentAgreement.DEFAULTED_to_BROKEN
          - state_machines.ForgivenessCredit.POSTED_to_REVERSED
          - entities.DeferredPaymentAgreement.fields.remaining_balance_cents
        distinguishing_aspect: |
          Conserved quantity: the DPA-covered arrearage ledger (different from
          the fund money pool) — covered_arrearage_cents (120000) ==
          paid_to_arrearage_cents + forgiven_posted_cents +
          remaining_balance_cents at every step; the BROKEN transition's credit
          reversal restores account arrearage by exactly the reversed sum
          (85500 -> 95500) with zero drift.
        test_recipe:
          setup:
            - "Account with arrearage 120000 and ACTIVE TIER_2 enrollment; DPA n=4 (down 6000, pool 40000, installment 18500) activated 2026-08-01; one on-time installment payment 18500 posted 2026-08-05 (credit 10000 POSTED); clock 2026-10-06 sweep defaults the DPA (installment 2 due 2026-09-30 + grace 5 missed)."
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "72 Ledger Ln" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 6000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 18500, tender_type: "CARD" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { mid_paid: "$.data.paid_to_arrearage_cents", mid_forgiven: "$.data.forgiven_posted_cents", mid_remaining: "$.data.remaining_balance_cents", mid_status: "$.data.status" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { broken: "$.data.dpas_broken" }
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { end_status: "$.data.status", end_paid: "$.data.paid_to_arrearage_cents", end_forgiven: "$.data.forgiven_posted_cents", end_remaining: "$.data.remaining_balance_cents" }
            - call: "GET /assistance/dpas/${dpa_id}/forgiveness-credits"
              payload: {}
              as: CustomerServiceRep
              captures: { credit_status: "$.data[0].status" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { end_arrearage: "$.data.arrearage_balance_cents" }
          assert:
            - "mid-flight (DEFAULTED): paid_to_arrearage_cents == 24500 (6000 + 18500), forgiven_posted_cents == 10000, remaining_balance_cents == 85500 — 120000 == 24500 + 10000 + 85500"
            - "sweep at 2026-10-22 (past defaulted_on 2026-10-06 + 15): dpas_broken == 1, DPA status == BROKEN"
            - "compensating reversal: forgiven_posted_cents == 0, remaining_balance_cents == 95500 — 120000 == 24500 + 0 + 95500 (invariant restored)"
            - "ForgivenessCredit[0].status == REVERSED"
            - "CustomerAccount.${acct_id}.arrearage_balance_cents == 95500 (85500 + 10000 reversed — no drift)"
