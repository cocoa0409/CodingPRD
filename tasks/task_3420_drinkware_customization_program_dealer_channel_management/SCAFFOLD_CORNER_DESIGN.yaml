          assert:
            - "err_window45 == ERR_RETURN_WINDOW_CLOSED (422) at exactly completed_at + 45 days"
            - "one second earlier the same request succeeds: return_status == RETURN_REQUESTED"

      - name: buyers_remorse_approval_rejected_but_deny_allowed
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_PERSONALIZED_NOT_RETURNABLE
          - state_machines.CustomizationOrder.return_status
        distinguishing_aspect: "Personalized goods cannot be restocked: a BUYERS_REMORSE return can be requested but NEVER approved — decide APPROVE is 422 ERR_PERSONALIZED_NOT_RETURNABLE regardless of resolution, while DENY closes it normally."
        test_recipe:
          setup:
            - "Canonical order driven to COMPLETE/CAPTURED; BUYERS_REMORSE return requested."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
            - *c_reserve
            - *c_proof
            - *c_approve
            - *c_lock
            - *c_start
            - *c_complete
            - call: "POST /drinkware/customization-orders/${c_order}/request-return"
              payload: { reason: "BUYERS_REMORSE", affected_unit_count: 2 }
              as: Buyer
              as_user_id: "buyer-std"
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/decide-return"
              payload: { decision: "APPROVE", resolution: "FULL_REFUND", decision_notes: "feeling generous" }
              as: CustomerCare
              as_user_id: "cc-1"
              captures: { err_restock: $.data.error_id }
            - call: "POST /drinkware/customization-orders/${c_order}/decide-return"
              payload: { decision: "DENY", decision_notes: "personalized goods are final sale" }
              as: CustomerCare
              as_user_id: "cc-1"
          assert:
            - "err_restock == ERR_PERSONALIZED_NOT_RETURNABLE (422) — even FULL_REFUND cannot approve a remorse return"
            - "after denial: return_status == RETURN_DENIED and refund_cents == 0"
            - "payment_status stays CAPTURED (no refund leaked)"

      - name: return_resolution_mismatch_cases
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_RETURN_RESOLUTION_MISMATCH
          - state_machines.CustomizationOrder.return_status
        distinguishing_aspect: "Resolution consistency is two-sided: ARTWORK_MISMATCH rejects PARTIAL_CREDIT (all-or-nothing fault), and PARTIAL_CREDIT with affected_unit_count == quantity (10 of 10) is rejected — a full refund is the correct instrument, which then settles at exactly final_quote_cents 38000c."
        test_recipe:
          setup:
            - "Two canonical orders (buyer-m1, buyer-q1) both driven to COMPLETE/CAPTURED on the canonical slot; returns requested: order M as ARTWORK_MISMATCH (5 units), order Q as DEFECT (all 10 units)."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-m1", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-m1"
              captures: { order_m: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-q1", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-q1"
              captures: { order_q: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_m}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-m1"
            - call: "POST /drinkware/customization-orders/${order_q}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-q1"
            - call: "POST /drinkware/customization-orders/${order_m}/reserve-slot"
              payload: { slot_id: "${c_slot}" }
              as: Buyer
              as_user_id: "buyer-m1"
            - call: "POST /drinkware/customization-orders/${order_q}/reserve-slot"
              payload: { slot_id: "${c_slot}" }
              as: Buyer
              as_user_id: "buyer-q1"
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${order_m}", artwork_file_ref: "s3://art/m1.ai", color_count: 1, placement_count: 1, pantone_codes: ["PMS 533"] }
              as: Buyer
              as_user_id: "buyer-m1"
              captures: { proof_m: $.data.id }
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${order_q}", artwork_file_ref: "s3://art/q1.ai", color_count: 1, placement_count: 1, pantone_codes: ["PMS 533"] }
              as: Buyer
              as_user_id: "buyer-q1"
