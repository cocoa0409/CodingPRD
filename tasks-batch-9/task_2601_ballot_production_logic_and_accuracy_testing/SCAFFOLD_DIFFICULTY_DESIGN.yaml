          assert:
            - "After call 1: PrintJob.${job}.sample_size == 400, defect_count == 6, inspection_count == 1, defect_rate_bp == 150 (round_half_up(6 * 10000 / 400) = 150.0) and status == QC_HOLD - a rate exactly at QC_HOLD_THRESHOLD_BP holds the job because the comparison is >=."
            - "After call 2: PrintJob.${job}.sample_size == 1000, defect_count == 6, inspection_count == 2, defect_rate_bp == 60 and status == QC_PASSED - the second sample was folded into the cumulative totals (1000/6), it did not replace the first sample's rate."
            - "After call 3: PrintJob.${job2}.sample_size == 10000, defect_count == 149, inspection_count == 1, defect_rate_bp == 149 and status == QC_PASSED - one basis point below the threshold releases the job."
            - "PrintVendor.${vend}.quality_defect_rate_bp == 141 at the end (round_half_up((6 + 149) * 10000 / (1000 + 10000)) = round_half_up(140.909...) = 141), which is neither of the two job rates and not their average 105."
            - "PrintJob.${job}.invoice_basis is still ESTIMATE with invoice_total_cents 150625 throughout: inspection changes quality state only, never the invoice."
            - "No BallotLot rows exist for either job at the end of the recipe, and Election.${el}.total_ballots_received is still 0."

  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_print_job_legality_depends_on_style_state_and_pinned_revision
        grounds:
          - validations.style-state-permits-operation
          - validations.ballot-style-version-current
          - validations.proof-pinned-to-style-revision
          - concurrency_rules
          - entities.PrintJob.fields.style_version_at_creation
        distinguishing_aspect: |
          Nothing about the PrintJob itself changes across the four rejected/accepted calls - what
          changes is the state and the version of a DIFFERENT entity, the BallotStyle. A job cannot be
          placed against a DRAFT style (ERR_STYLE_STATE_INVALID) even though the job payload is
          perfect; a job placed against an APPROVED style becomes unapprovable the moment
          POST /elections/{id}/lock-styles bumps that style's version, because approve-proof compares
          the job's frozen style_version_at_creation against the style's CURRENT version
          (ERR_PROOF_VERSION_STALE, 409); and re-placing the job with the pre-lock version now trips
          the OCC guard instead (ERR_STALE_BALLOT_STYLE_VERSION, 412). Three different errors from
          one unchanged job payload, each keyed on the style rather than the job.
        test_recipe:
          setup:
            - "An election in CONTESTS_CERTIFIED with two styles over D-12: S-100 (language-certified, proofed, APPROVED, assigned to precinct P-001) and S-200 (still DRAFT, no precinct)."
            - "A secure vendor Ridgeline Secure Print with 2 press lines."
            - "PrintJob JOB-1 already placed against S-100 while it was APPROVED, pinning style_version_at_creation to the style's then-current version; JOB-1 is PROOF_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
