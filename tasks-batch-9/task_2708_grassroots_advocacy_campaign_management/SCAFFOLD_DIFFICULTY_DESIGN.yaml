  - rule_id: compensating_invariant
    instances:
      - name: touch_reservation_ledger_conserved_across_wave_abort
        grounds:
          - calculations.campaign_outcome_analysis
          - entities.Supporter.fields.touches_reserved
          - state_machines.Activation.SCHEDULED_to_ABORTED
          - endpoints.GET_advocacy_campaigns_id_outcome_report
        distinguishing_aspect: |
          Conserved quantity: the touch-reservation ledger, asserted through touch_ledger_balanced
          (sum of Supporter.touches_reserved == sum of projected_reach over SCHEDULED/SENDING waves).
          The abort is the compensating action: three reservations are released in one call, so the
          ledger must land back on 0 == 0 rather than leaking three orphaned reservations.
        test_recipe:
          setup:
