              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 1.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 1500000, planned_control_population: 1500000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_both: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-10-12T00:00:00Z", end_date: "2026-11-09T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 1500000, planned_control_population: 1500000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_share: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-11-16T00:00:00Z", end_date: "2026-12-14T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 1000000, planned_control_population: 1000000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_ok: "$.data.id" }
          trigger:
            - call: "POST /mmm/experiments/${exp_both}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { err_safety: "$.data.error_id" }
            - call: "POST /mmm/experiments/${exp_share}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { err_constraint: "$.data.error_id" }
            - call: "POST /mmm/experiments/${exp_ok}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "FIRST CALL: HTTP 422 with data.error_id == ERR_EXPERIMENT_UNDERPOWERED"
            - "FIRST CALL: data.error_id != ERR_HOLDOUT_SHARE_EXCEEDED even though 3000000 * 100 > 20 * 10000000"
            - "FIRST CALL: Experiment.${exp_both}.status is still DRAFT with computed_power null and power_index null - the power figure is not persisted on the failing path"
            - "SECOND CALL: HTTP 422 with data.error_id == ERR_HOLDOUT_SHARE_EXCEEDED"
            - "SECOND CALL: Experiment.${exp_share}.status is still DRAFT with computed_power null"
            - "THIRD CALL: HTTP 200, Experiment.${exp_ok}.status == DESIGN_LOCKED, power_index == 5.0508 and computed_power == 0.9500"
            - "THIRD CALL sits exactly on the cap: (0 + 1000000 + 1000000) * 100 == 20 * 10000000, and the comparison is <="
            - "THIRD CALL leaves Market.${mkt}.held_out_population == 0 - lock-design reserves nothing, only assign-cells consumes population"
            - "Experiment.${exp_ok}.treatment_population == 0 and control_population == 0 because design_type is GEO_HOLDOUT"
            - "category pair exercised: business_safety (52) versus business_constraint (60), distinct from the state-versus-business_fiscal pair"
  - rule_id: boundary_precision_check
    note: >-
      Two boundaries on DIFFERENT metrics and DIFFERENT endpoints: the power_index -> computed_power step rung on lock-design, and the exact-integer holdout-share ceiling on assign-cells.
    instances:
      - name: power_index_exact_boundary_on_lock_design
        grounds:
          - "calculations.experiment_power - power_index formula, POWER_INDEX_TABLE with STRICT < upper bounds, and the precision note pinning power_index == 2.5000 to the 0.8000 row"
          - "global_constants.MIN_EXPERIMENT_POWER == 0.80"
          - "validations priority 52 (business_safety) - computed_power >= MIN_EXPERIMENT_POWER else ERR_EXPERIMENT_UNDERPOWERED (422) on POST /mmm/experiments/{id}/lock-design"
          - "state_machines Experiment DRAFT -> DESIGN_LOCKED, side effect: power_index and computed_power recomputed and frozen"
          - "endpoints POST /mmm/experiments/{id}/lock-design (200, ExperimentDesigner)"
        distinguishing_aspect: |
          The metric under test is the power_index -> computed_power step lookup at its exact rung
          boundary: power_index == 2.5000 is NOT < 2.5000, so it falls into the 0.8000 row and locks,
          while power_index == 2.0000 falls into the 0.7500 row and is rejected - an implementation
          that writes the table with <= bounds, or that compares power_index itself against 0.80,
          locks the 4.0 pct design and therefore fails this test.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000. No DataWindow exists yet, so Market.data_posture is RESTRICTED, which is != FROZEN and therefore does not block lock-design."
            - "One media channel A_SEARCH on that market."
            - "Three AUDIENCE_SPLIT / DIFF_IN_DIFF experiments on A_SEARCH, all with baseline_conversion_rate 0.0200 and planned arms 245000 / 245000, placed on three disjoint intervals so the priority-65 interval rule never fires: exp_at [2026-09-07, 2026-10-05) with mde 5.0, exp_below [2026-10-12, 2026-11-09) with mde 4.0, exp_above [2026-11-16, 2026-12-14) with mde 6.0."
            - "n = min(245000, 245000) = 245000 and sqrt(245000 * 0.02 / (2 * 0.98)) = sqrt(2500) = 50 exactly, so power_index = (mde / 100) * 50 gives 2.5000, 2.0000 and 3.0000 - three values sitting exactly ON, just BELOW and well ABOVE the 2.5000 rung."
            - "design_type is AUDIENCE_SPLIT for all three, so the priority-60 holdout-share ceiling (which the state machine scopes to GEO_HOLDOUT) is not in play and the power gate is the only thing being measured."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_at: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-10-12T00:00:00Z", end_date: "2026-11-09T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 4.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_below: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-11-16T00:00:00Z", end_date: "2026-12-14T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 6.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_above: "$.data.id" }
          trigger:
            - call: "POST /mmm/experiments/${exp_at}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_below}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_above}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Call 1 (lock exp_at) returns 200 with power_index == 2.5000 and computed_power == 0.8000 - the exact-boundary design PASSES the >= 0.80 gate."
            - "Call 1 leaves status == DESIGN_LOCKED with treatment_population == 245000 and control_population == 245000 (an AUDIENCE_SPLIT lock copies the planned arms into the realised ones)."
            - "Call 2 (lock exp_below) returns 422 with error_id ERR_EXPERIMENT_UNDERPOWERED: power_index would be 2.0000, which is not < 2.0000 and so lands on the 0.7500 row, and 0.7500 < 0.80."
            - "GET /mmm/experiments/${exp_below} still shows status == DRAFT with power_index == null, computed_power == null, treatment_population == 0 and control_population == 0 - the rejected transition wrote nothing."
            - "Call 3 (lock exp_above) returns 200 with power_index == 3.0000, computed_power == 0.9000 (the < 3.2400 row) and status == DESIGN_LOCKED."
            - "The three power_index values are 0.5000 and 1.0000 of index apart with every other input held identical, so the single rejection is attributable to the rung boundary alone and not to any other field."
            - "GET /mmm/experiments?channel_id=${cha}&status=DESIGN_LOCKED returns total_count 2 (exp_at and exp_above)."
      - name: holdout_share_exact_integer_ceiling_on_assign_cells
        grounds:
          - "validations priority 60 (business_constraint) - (Market.held_out_population + the population this call would add) * 100 <= MAX_HOLDOUT_POPULATION_PCT * Market.total_population, compared as EXACT INTEGERS and never via the 2-decimal held_out_population_pct, else ERR_HOLDOUT_SHARE_EXCEEDED (422)"
          - "global_constants.MAX_HOLDOUT_POPULATION_PCT == 20"
          - "entities Market.celled_population, Market.held_out_population, Market.held_out_population_pct (all computed)"
          - "state_machines Experiment DESIGN_LOCKED -> CELLS_ASSIGNED and GeoCell UNASSIGNED -> TREATMENT / CONTROL"
          - "endpoints POST /mmm/experiments/{id}/assign-cells (200, ExperimentDesigner)"
        distinguishing_aspect: |
          The metric is the integer holdout-share ceiling and the endpoint is assign-cells rather than
          lock-design: a 2000100-person pair is 20.001 pct of a 10000000-person market, which rounds to
          exactly 20.00 at two decimals, so any implementation that compares the rounded
          held_out_population_pct against MAX_HOLDOUT_POPULATION_PCT accepts it, while the required
          exact-integer comparison 200010000 > 200000000 rejects it and admits only the 2000000-person
          pair that lands dead on the cap.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000, so the integer ceiling is 20 * 10000000 == 200000000."
            - "Three GeoCells on that market: GC01 population 1000000, GC02 population 1000000, GC03 population 1000100 - exactly 100 people more than its twin."
            - "One media channel A_SEARCH."
            - "One GEO_HOLDOUT / DIFF_IN_DIFF experiment on A_SEARCH, [2026-09-07, 2026-10-05), washout_days 7, mde 5.0, baseline_conversion_rate 0.0200, planned arms 1000000 / 1000000: power_index = 0.05 * sqrt(1000000 * 0.02 / 1.96) = 5.0508, which is >= 3.2400 and so yields computed_power 0.9500, clearing the priority-52 power gate."
            - "lock-design succeeds because (0 + 1000000 + 1000000) * 100 == 200000000 sits exactly ON the ceiling, and a GEO_HOLDOUT lock deliberately leaves treatment_population and control_population at 0, so Market.held_out_population is still 0 when the trigger runs - no cell has been consumed yet."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01", population: 1000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc1: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC02", population: 1000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc2: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC03", population: 1000100 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc3: "$.data.id" }
            - call: "POST /mmm/media-channels"
