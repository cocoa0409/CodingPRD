        test_recipe:
          setup:
            - "Base fixture plus the MPD room with its own bin, technician and case 26-90001; one MPD item is logged, giving barcode MPD-26-90001-0001-5."
            - "An audit session is scheduled and started on the CPD bin G-09."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g9
            - *c_tech
            - *c_aud
            - *c_case1
            - *c_room2
            - *c_loc_g2
            - *c_tech_m
            - *c_case_m
            - call: "POST /evidence-items"
              payload: { case_id: "${case_m_id}", item_description: "Other agency toolbox", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 7000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_m_id}"
              captures: { foreign_item: $.data.id, foreign_barcode: $.data.barcode }
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g9_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g9_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audit-sessions/${sess_id}/scan"
              payload: { barcode: "${foreign_barcode}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${foreign_barcode} == 'MPD-26-90001-0001-5'"
            - "Responds 409 with ${err} == 'ERR_BARCODE_FOREIGN_ROOM' — the barcode resolves (so priority 7 passes) but the item belongs to another property room"
            - "GET /audit-sessions/${sess_id} shows scanned_item_count == 0 and scanned_evidence_item_ids == []: the rejected scan is not recorded"
            - "No MISPLACED discrepancy is raised, and GET /chain-events?evidence_item_id=${foreign_item} contains no AUDIT_SCAN entry"

      - name: discrepancy_written_off_on_misplaced_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=29]"
          - "entities.Discrepancy.fields.kind"
          - "state_machines.Discrepancy.OPEN_to_RESOLVED_WRITTEN_OFF"
          - "errors[ERR_DISCREPANCY_RESOLUTION_NOT_PERMITTED]"
        test_recipe:
          setup:
            - "Base fixture plus the spare bin G-02; one GENERAL item is stored in G-02."
            - "An audit session on the empty bin G-09 is started, the G-02 item is scanned into it (raising a MISPLACED discrepancy) and the session is reconciled."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g9
            - *c_tech
            - *c_aud
            - *c_case1
            - *c_loc_g2_spare
