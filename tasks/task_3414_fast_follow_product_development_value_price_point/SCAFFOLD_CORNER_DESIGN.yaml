      - name: product_advance_referential_gates_fire_in_chain_order
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_CONCEPT_NOT_SELECTED
          - errors.ERR_FORMULA_NOT_APPROVED
          - errors.ERR_QUOTE_NOT_ACCEPTED
        distinguishing_aspect: "Three distinct referential gates on the product's advance path, each observed at its own step: product creation on a PITCHED concept (ERR_CONCEPT_NOT_SELECTED), SOURCING without an APPROVED formula (ERR_FORMULA_NOT_APPROVED), COMPLIANCE_GATE without an ACCEPTED quote (ERR_QUOTE_NOT_ACCEPTED)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend SELECTED; concept PITCHED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_cm
          trigger:
            - call: "POST /products"
              payload: { concept_id: "${concept_id}", sku_name: "TOO-EARLY-01" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_g1: $.data.error_id }
            - *c_concept_select
            - *c_product
            - call: "PATCH /products/${product_id}"
              payload: { status: "SOURCING" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_g2: $.data.error_id }
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - call: "PATCH /products/${product_id}"
              payload: { status: "COMPLIANCE_GATE" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_g3: $.data.error_id }
          assert:
            - "err_g1 == ERR_CONCEPT_NOT_SELECTED (422) and no product was created by the first attempt"
            - "err_g2 == ERR_FORMULA_NOT_APPROVED (422) with the product still FORMULATION"
            - "after approving the formula, SOURCING succeeds; then err_g3 == ERR_QUOTE_NOT_ACCEPTED (422) with the product still SOURCING"

      - name: suspended_cm_blocks_formula_create_and_quote_create
        claim_type: Conditional Validation
