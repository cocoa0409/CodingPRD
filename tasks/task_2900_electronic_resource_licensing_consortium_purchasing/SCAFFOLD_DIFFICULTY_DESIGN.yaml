scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trial_provisional_and_final_scores_diverge_on_post_close_feedback
        grounds:
          - calculations.trial_endorsement_score
          - state_machines.Trial.ACTIVE_to_CLOSED
          - state_machines.Trial.CLOSED_to_ENDORSED
          - entities.Trial.fields.provisional_score
          - entities.Trial.fields.final_score
          - entities.FeedbackEntry.fields.submitted_during_status
        distinguishing_aspect: |
          This instance is the dual-variant pair on the Trial evaluation domain: the same four
          FeedbackEntry rows produce provisional_score 78.73 (provisional_at_close counts only
          submitted_during_status == ACTIVE) and final_score 72.06 (final_at_evaluation also counts
          the CLOSED-window row), so the two stored fields on one Trial row differ by 6.67 points.
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly with vpat_on_file true; Product Atlas Humanities Collection under it."
            - "Member Alpha College (fte_count 4000, BACCALAUREATE, budget_ceiling_cents 9000000)."
            - "Trial on the product for Alpha College with criteria CONTENT_FIT 60 / INTERFACE 40, opened, three feedback rows accepted while ACTIVE, then closed (provisional_score stamped), then one more feedback row accepted while CLOSED."
            - "Logical clock still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 60 }, { code: "INTERFACE", weight_pct: 40 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_id: $.data.id }
            - call: "POST /erm/trials/${trial_id}/open"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "FACULTY", criterion_code: "CONTENT_FIT", score: 80 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "GRADUATE", criterion_code: "INTERFACE", score: 70 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "LIBRARIAN", criterion_code: "CONTENT_FIT", score: 90 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/close"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "UNDERGRADUATE", criterion_code: "INTERFACE", score: 20 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { late_feedback_id: $.data.id }
          trigger:
            - call: "POST /erm/trials/${trial_id}/evaluate"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          assert:
            - "Trial.${trial_id}.provisional_score == 78.73"
            - "Trial.${trial_id}.final_score == 72.06"
            - "Trial.${trial_id}.status == ENDORSED"
            - "Trial.${trial_id}.quorum_penalty_applied == false"
            - "Trial.${trial_id}.feedback_count == 4"
            - "Trial.${trial_id}.distinct_stakeholder_group_count == 4"
            - "FeedbackEntry.${late_feedback_id}.submitted_during_status == CLOSED"

      - name: commitment_projected_price_diverges_from_settled_price_at_signing
        grounds:
          - calculations.member_tier_price_cents
          - state_machines.Commitment.PLEDGED_to_CONFIRMED
          - entities.Commitment.fields.projected_price_cents
          - entities.Commitment.fields.tier_price_cents
          - entities.Commitment.fields.participant_count_at_pricing
        distinguishing_aspect: |
          This instance is the dual-variant pair on the Commitment pricing domain (a different
          entity domain from the Trial scoring pair): Alpha College's row keeps
          projected_price_cents 4500000 from the committed_projection variant it saw as the sole
          participant, while the settled_invoice variant run inside the signing cascade prices the
          same row at 4050000 because three CONFIRMED rows select the 10 percent tier band.
        test_recipe:
          setup:
            - "Vendor, Product (base_list_price_cents 10000000, tier bands 1/0 percent, 3/10 percent, 5/20 percent) and three members Alpha (fte 4000), Bravo (fte 4600), Charlie (fte 4900), all BACCALAUREATE with budget_ceiling_cents 9000000."
            - "A DRAFT trial exists only to satisfy the negotiation foreign key; the negotiation is driven to AGREED at 9000000 cents by a vendor ACCEPT."
            - "Alpha pledges first (participant count 1), Bravo second (count 2), Charlie third (count 3) - so the three projected prices are 4500000, 4500000 and 4050000."
            - "The endorsed trial required by the sign gate is the same trial, evaluated to ENDORSED before signing."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Bravo College", fte_count: 4600, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_b_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Charlie College", fte_count: 4900, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_c_id: $.data.id }
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 60 }, { code: "INTERFACE", weight_pct: 40 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_id: $.data.id }
            - call: "POST /erm/trials/${trial_id}/open"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "FACULTY", criterion_code: "CONTENT_FIT", score: 80 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "GRADUATE", criterion_code: "INTERFACE", score: 70 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "LIBRARIAN", criterion_code: "CONTENT_FIT", score: 90 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/close"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/evaluate"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
            - call: "POST /erm/negotiations"
              payload: { product_id: "${product_id}", trial_id: "${trial_id}", target_term_start: "2027-01-01", target_term_end: "2027-12-31", requested_ill_mode: "SECURE_ELECTRONIC", requested_text_mining: true, requested_accessibility_conformance: "WCAG_2_1_AA", requested_perpetual_access: "FULL_ARCHIVE" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { negotiation_id: $.data.id }
            - call: "POST /erm/negotiations/${negotiation_id}/submit"
              payload: {}
              as: LicenseNegotiator
              as_user_id: "neg-1"
            - call: "POST /erm/negotiations/${negotiation_id}/vendor-response"
              payload: { disposition: "ACCEPT", accepted_price_cents: 9000000, granted_ill_mode: "SECURE_ELECTRONIC", granted_text_mining: true, granted_accessibility_conformance: "WCAG_2_1_AA", granted_perpetual_access: "FULL_ARCHIVE" }
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /erm/products/${product_id}/commitments"
              payload: { member_id: "${m_a_id}" }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /erm/products/${product_id}/commitments"
              payload: { member_id: "${m_b_id}" }
              as: MemberLibrarian
              as_user_id: "${m_b_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /erm/products/${product_id}/commitments"
              payload: { member_id: "${m_c_id}" }
              as: MemberLibrarian
              as_user_id: "${m_c_id}"
              captures: { c_c_id: $.data.id }
          trigger:
            - call: "POST /erm/negotiations/${negotiation_id}/sign"
              payload: { activation_start_date: "2027-01-01" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
          assert:
            - "Commitment.${c_a_id}.projected_price_cents == 4500000"
            - "Commitment.${c_a_id}.tier_price_cents == 4050000"
            - "Commitment.${c_a_id}.participant_count_at_pricing == 3"
            - "Commitment.${c_a_id}.applied_discount_pct == 10"
            - "Commitment.${c_b_id}.projected_price_cents == 4500000"
            - "Commitment.${c_b_id}.tier_price_cents == 4050000"
            - "Commitment.${c_c_id}.projected_price_cents == 4050000"
            - "Commitment.${c_c_id}.tier_price_cents == 4050000"
            - "Member.${m_a_id}.annual_committed_cents == 4050000"
            - "Member.${m_a_id}.standing == IN_GOOD_STANDING"
            - "Subscription.${sub_id}.negotiated_price_cents == 9000000"

  - rule_id: combinatorial_formula
    instances:
      - name: member_price_nested_clamp_selects_ceiling_for_one_member_and_floor_for_another
        grounds:
          - calculations.member_tier_price_cents
          - entities.Member.fields.fte_count
          - entities.Member.fields.carnegie_class
          - entities.Product.fields.tier_bands
          - entities.Commitment.fields.projected_price_cents
        distinguishing_aspect: |
          Mode (a): five inputs (base_list_price_cents, FTE band factor, Carnegie factor, tier band
          discount, and the MAX_MEMBER_SHARE_PCT ceiling) interact non-linearly through
          max(MIN_MEMBER_PRICE_CENTS, min(round_half_up(gross), ceiling)) - the same formula returns
          the ceiling 6000000 for the 15000-FTE pledge (gross 6375000) and the floor 150000 for the
          3000-FTE pledge on the small package (gross 90000, ceiling 120000), so neither clamp can
          be dropped and the floor outranks the ceiling.
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly; Product Atlas Humanities Collection (base_list_price_cents 10000000) and Product Atlas Regional Newspapers (base_list_price_cents 200000, single tier band 1/0 percent)."
            - "Member Metro University (fte_count 15000, BACCALAUREATE, budget_ceiling_cents 9000000) and Member Tiny Seminary (fte_count 3000, BACCALAUREATE, budget_ceiling_cents 500000)."
            - "No commitments exist on either product, so each trigger pledge is the sole participant and selects the 0 percent band."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { p1_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Regional Newspapers", base_list_price_cents: 200000, title_count: 12, inflation_cap_pct: 3.00, cancellation_notice_days: 60, perpetual_access_mode_offered: "POST_CANCELLATION_SUBSET", ill_mode_offered: "PRINT_ONLY", text_mining_offered: false, tier_bands: [{ min_participants: 1, discount_pct: 0 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { p2_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Metro University", fte_count: 15000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_med_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Tiny Seminary", fte_count: 3000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 500000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_tiny_id: $.data.id }
          trigger:
            - call: "POST /erm/products/${p1_id}/commitments"
              payload: { member_id: "${m_med_id}" }
              as: MemberLibrarian
              as_user_id: "${m_med_id}"
              captures: { c_med_id: $.data.id }
            - call: "POST /erm/products/${p2_id}/commitments"
              payload: { member_id: "${m_tiny_id}" }
              as: MemberLibrarian
              as_user_id: "${m_tiny_id}"
              captures: { c_tiny_id: $.data.id }
          assert:
            - "Commitment.${c_med_id}.projected_price_cents == 6000000"
            - "Commitment.${c_med_id}.applied_discount_pct == 0"
            - "Commitment.${c_med_id}.participant_count_at_pricing == 1"
            - "Commitment.${c_tiny_id}.projected_price_cents == 150000"
            - "Commitment.${c_tiny_id}.applied_discount_pct == 0"
            - "Member.${m_med_id}.annual_committed_cents == 0"
            - "Member.${m_tiny_id}.annual_committed_cents == 0"

      - name: invoice_allocation_rounds_each_line_then_assigns_residual_by_member_created_at
        grounds:
          - calculations.consortium_invoice_allocation
          - endpoints[GET /erm/subscriptions/{id}/invoice-allocation]
          - entities.Member.fields.fte_count
          - state_machines.Commitment.PLEDGED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b): the pinned ROUNDING_ORDER per_line_then_reconcile is observable because
          9000000 cents split by FTE weights 4000/4600/4900 (W = 13500) gives three raw shares
          whose fractional parts are all exactly 0.6667 - rounding each line first yields
          2666667 + 3066667 + 3266667 = 9000001, i.e. residual_cents -1, which the reconcile step
          charges to Alpha College's line (earliest Member.created_at) leaving 2666666; summing the
          exact shares and rounding once would leave all three lines untouched and residual 0.
        test_recipe:
          setup:
            - "Vendor, Product (base_list_price_cents 10000000) and three members Alpha (fte 4000), Bravo (fte 4600), Charlie (fte 4900), created in that order, all BACCALAUREATE with budget_ceiling_cents 9000000."
            - "A trial on the product for Alpha is driven to ENDORSED; a negotiation on the product is driven to AGREED at 9000000 cents."
            - "All three members pledge, then signing confirms all three commitments, so the subscription carries negotiated_price_cents 9000000 and three CONFIRMED commitments."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so the subscription is PENDING_ACTIVATION - the allocation read does not depend on the contract axis."
