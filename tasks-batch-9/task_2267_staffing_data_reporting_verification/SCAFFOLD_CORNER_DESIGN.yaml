              as_user_id: "auditor-read-01"
          assert:
            - "HourEntry.${e_unv}.direct_care_hours == 12.00 and HourEntry.${e_798}.raw_hours == 7.98 from 479 minutes divided by 60 rounded half up"
            - "the 2026Q2 read returns considered_hours == 20.00, supported_hours == 8.00, support_ratio == 0.4000, score == 70.00 and at_risk == false, since 100 * (0.5 * 0.4000 + 0.3 * 1.0000 + 0.2 * 1.0000) == 70.00 and the comparison is strict"
            - "the 2026Q3 read returns considered_hours == 19.98, supported_hours == 7.98, support_ratio == 0.3994 and score == 69.97, since 0.5 * 0.3994 == 0.1997 and 100 * 0.6997 == 69.97"
            - "the 2026Q3 read returns at_risk == true, so a 0.02-hour swing in supported hours crosses the floor"

      - name: worker_and_facility_derived_totals_track_create_update_and_void
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Worker.reported_hours_total
          - entities.Facility.latest_staffing_rating
          - endpoints[POST /hour-entries/{id}/void]
        distinguishing_aspect: "The two ancestor rollups are keyed on different quantities: Worker.reported_hours_total tracks raw_hours and is therefore unmoved by an allocation replacement, while the submission's credited totals halve; and Facility.latest_staffing_rating stays null until a measure is actually published."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission with a payroll-supported 8.00-hour RN shift on 2026-04-01, one census day at 5 residents, and a second 12.00-hour RN shift on 2026-04-02"
