  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_revision_cycle_with_bounded_termination
        grounds:
          - state_machines.Invoice.PENDING_CLIENT_REVIEW_to_REVISION_REQUESTED
          - state_machines.Invoice.REVISION_REQUESTED_to_DRAFT
          - validations[priority=68]
          - entities.Invoice.fields.revision_round
          - calculations.invoice_totals_computation
        distinguishing_aspect: |
          A cyclic path (DRAFT -> PENDING_CLIENT_REVIEW -> REVISION_REQUESTED -> DRAFT) whose
          loop counter is bounded: each traversal increments revision_round, the totals are
          re-swept on re-entry to DRAFT so the same entity leaves the loop with a different
          gross_billed than it entered with, and the fourth REQUEST_REVISION is refused with
          ERR_REVISION_LIMIT_EXCEEDED while APPROVE from the same state still succeeds.
