scaffold_difficulty_design:

  # =====================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: csed_provisional_vs_final
        grounds:
          - calculations.csed_calculation
          - state_machines.OfferInCompromise.SUBMITTED_to_UNDER_REVIEW
          - state_machines.OfferInCompromise.UNDER_REVIEW_to_REJECTED
          - entities.TaxLiability.fields.csed_effective_date
        distinguishing_aspect: |
          csed_calculation has variant provisional_with_open_tolling (open OIC_PENDING event => end_date treated as NOW(), value drifts forward each call) versus variant final_after_close (all CSEDTollingEvent rows have end_date set, value is fixed). Two reads of TaxLiability.csed_effective_date with identical CSED inputs return different ISO-8601 timestamps depending only on whether the OIC tolling event is open or closed. Domain: TaxLiability (temporal statute).
        test_recipe:
          setup:
            - "Clock at 2020-01-01T00:00:00Z."
            - "Create Taxpayer T1 with monthly_disposable_income_cents=200000."
            - "Create TaxLiability L1 for T1 with assessment_date=2020-01-01T00:00:00Z, original_assessed_amount_cents=1000000."
            - "csed_base_date computed = 2030-01-01T00:00:00Z; csed_effective_date == csed_base_date at this point."
            - "Create Payment OIC_DEPOSIT for $3000 (300000c) against new OIC O1 covering L1, offer_amount_cents=1500000, schedule_months=5."
          trigger:
            - "POST /collections/offers-in-compromise/{O1}/submit at 2020-01-01T00:00:00Z."
            - "POST /_clock/advance to 2020-04-01T00:00:00Z (90 days later)."
            - "GET /collections/tax-liabilities/{L1} (read csed_effective_date — provisional, open tolling)."
            - "POST /collections/offers-in-compromise/{O1}/take-up by officer OICO_A."
            - "POST /collections/offers-in-compromise/{O1}/decide by officer OICO_B with decision=REJECT (closes OIC_PENDING tolling at 2020-04-01)."
            - "GET /collections/tax-liabilities/{L1} (read csed_effective_date — final, closed tolling)."
          assert:
            - "First GET: TaxLiability.csed_effective_date == 2030-04-01T00:00:00Z (provisional: csed_base 2030-01-01 + 90 days open tolling)."
            - "Second GET: TaxLiability.csed_effective_date == 2030-04-01T00:00:00Z (final: same 90 days, now frozen)."
            - "Advance clock another 30 days, GET L1 again: csed_effective_date is STILL 2030-04-01T00:00:00Z (final value does not drift, proving the variant difference)."

      - name: rcp_lump_sum_vs_periodic
        grounds:
          - calculations.rcp_calculation
          - entities.OfferInCompromise.fields.rcp_cents
          - entities.Taxpayer.fields.monthly_disposable_income_cents
        distinguishing_aspect: |
          rcp_calculation has variant lump_sum_offer (schedule <= 5 months => FACTOR=12) versus variant periodic_offer (schedule 6-24 months => FACTOR=24). For Taxpayer with MDI=200000 cents/month, rcp_cents = 2,400,000 (lump-sum) vs 4,800,000 (periodic) — exactly 2x. Domain: OfferInCompromise (compromise valuation), structurally different from csed_calculation's TaxLiability temporal domain.
        test_recipe:
          setup:
            - "Create Taxpayer T2 with monthly_disposable_income_cents=200000."
            - "Create TaxLiability L2 for T2 with original_assessed_amount_cents=5000000."
          trigger:
            - "POST /collections/offers-in-compromise covering L2, offer_amount_cents=3000000, schedule_months=5 — call this OIC A."
            - "POST /collections/offers-in-compromise covering L2, offer_amount_cents=5000000, schedule_months=24 — call this OIC B."
            - "GET /collections/offers-in-compromise/{A}."
            - "GET /collections/offers-in-compromise/{B}."
          assert:
            - "OfferInCompromise A.rcp_cents == 2400000 (MDI 200000 * FACTOR 12 + equity 0)."
            - "OfferInCompromise B.rcp_cents == 4800000 (MDI 200000 * FACTOR 24 + equity 0)."
            - "B.rcp_cents / A.rcp_cents == 2 exactly (variant boundary; no rounding drift because rounding is applied once at final sum)."

  # =====================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_accrual_status_branching     # Mode (a): >=3 inputs, conditional branching on entity state
        grounds:
          - calculations.monthly_accrual
          - entities.TaxLiability.fields.accrued_interest_cents
          - entities.TaxLiability.fields.accrued_penalty_cents
          - entities.TaxLiability.fields.status
        distinguishing_aspect: |
          Mode (a): monthly_accrual has 3 inputs (base, MONTHLY_INTEREST_RATE, status-conditional penalty rate) and branches non-linearly on liability.status — OPEN uses MONTHLY_FTP_RATE_NON_IA=0.005, IN_AGREEMENT uses MONTHLY_FTP_RATE_IA=0.0025, CNC uses penalty rate 0. Same dollar base + same cycle yields three different penalty values because of the conditional branch on entity state.
        test_recipe:
          setup:
            - "Clock at 2020-01-01T00:00:00Z."
            - "Create Taxpayer T3 with MDI=-100 (i.e., -100 cents, negative, CNC-eligible)."
            - "Create TaxLiability L3a (OPEN), L3b (will be put into IN_AGREEMENT), L3c (will be put into CNC), each original_assessed_amount_cents=1000000."
            - "Activate an InstallmentAgreement covering L3b with DDIA, proposed_monthly_payment_cents=50000."
            - "Place L3c into CNCStatus."
          trigger:
            - "POST /_clock/advance to 2020-01-31T23:59:59Z (one EOM cycle)."
            - "POST /_sweep/run."
            - "GET /collections/tax-liabilities/{L3a}, {L3b}, {L3c}."
          assert:
            - "L3a (OPEN): accrued_interest_cents == 6667 AND accrued_penalty_cents == 5000."
            - "L3b (IN_AGREEMENT): accrued_interest_cents == 6667 AND accrued_penalty_cents == 2500."
            - "L3c (CNC): accrued_interest_cents == 6667 AND accrued_penalty_cents == 0."
            - "Penalty values differ by exactly 2500 cents (OPEN vs IA) and by 5000 cents (OPEN vs CNC) for identical base, proving the branch."

      - name: payoff_projection_rounding_order    # Mode (b): nested rounding where order matters
        grounds:
          - calculations.payoff_projection
          - calculations.monthly_accrual
          - entities.InstallmentAgreement.fields.planned_payoff_date
        distinguishing_aspect: |
          Mode (b): payoff_projection pins the rounding order — round interest first (round_half_up), THEN round penalty (round_half_up), THEN sum — and explicitly forbids rounding (interest+penalty) as a combined sum. If a divergent implementation computed `round_half_up(balance * (MIR + IA))` it would produce a different planned_payoff_date by one or more months on long simulations. The scaffold pins the order so the planned_payoff_date literal is well-defined.
        test_recipe:
          setup:
            - "Create Taxpayer T4 with MDI=300000."
            - "Create TaxLiability L4 with assessment_date=2020-01-01T00:00:00Z, original_assessed_amount_cents=1000000."
            - "Create InstallmentAgreement A4 covering L4, proposed_monthly_payment_cents=200000, payment_method=DDIA."
          trigger:
            - "POST /collections/installment-agreements/{A4}/activate at 2020-01-01T00:00:00Z."
            - "GET /collections/installment-agreements/{A4}."
          assert:
            - "InstallmentAgreement.planned_payoff_date == 2020-07-01T00:00:00Z (6 months from activation; pinned per-component round_half_up monthly simulation reaches balance==0 in month 6)."
            - "InstallmentAgreement.agreement_type == LONG_TERM."

  # =====================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ia_default_reinstate_cycle
        grounds:
          - state_machines.InstallmentAgreement.ACTIVE_to_DEFAULTED
          - state_machines.InstallmentAgreement.DEFAULTED_to_ACTIVE
          - state_machines.ReconsiderationRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          InstallmentAgreement has a cycle ACTIVE -> DEFAULTED -> ACTIVE (gated through a PENDING ReconsiderationRequest decided APPROVED by a different officer). This is a true revision-loop cycle on a single entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Activate InstallmentAgreement A5 for Taxpayer T5 covering one liability L5; activator IRSO_A."
            - "Clock at 2020-02-01."
          trigger:
            - "Advance clock to 2020-05-15 (skipping 3 monthly due dates — 03/03, 04/02, 05/02 — without any payment)."
            - "POST /_sweep/run (missed_payment_count becomes 3; A5 ACTIVE -> DEFAULTED)."
            - "POST /collections/reconsideration-requests with agreement_id=A5, reason=MISSED_PAYMENT_CURE."
            - "POST /collections/reconsideration-requests/{R5}/decide by IRSO_B with status=APPROVED (must differ from IRSO_A)."
          assert:
            - "After sweep: InstallmentAgreement.status == DEFAULTED."
            - "After decide: InstallmentAgreement.status == ACTIVE (cycle closed)."
            - "InstallmentAgreement.missed_payment_count == 0 (reset on cycle return)."

      - name: oic_fork_join_branching
        grounds:
          - state_machines.OfferInCompromise.UNDER_REVIEW_to_ACCEPTED
          - state_machines.OfferInCompromise.UNDER_REVIEW_to_REJECTED
          - state_machines.OfferInCompromise.UNDER_REVIEW_to_WITHDRAWN
        distinguishing_aspect: |
          OfferInCompromise UNDER_REVIEW branches to three terminal states with structurally different side-effect sets: ACCEPTED cascades liabilities to IN_COMPROMISE and terminates covering IAs; REJECTED only closes tolling and forfeits deposit; WITHDRAWN is the same closure pattern but originates from the taxpayer actor. Different entity from Rule 3 instance 1 (OIC vs IA).
        test_recipe:
          setup:
            - "Create Taxpayer T6 with monthly_disposable_income_cents=30000."
            - "Create three independent TaxLiabilities L6a, L6b, L6c for T6, each with current_balance_cents=1500000."
            - "Create OICs O6a (covers L6a), O6b (covers L6b), O6c (covers L6c). Each offer_amount_cents=1500000, schedule_months=5, with a Payment OIC_DEPOSIT of 300000 cents posted first."
            - "Submit all three OICs; OICO_A takes up each one (separate cases)."
          trigger:
            - "POST /collections/offers-in-compromise/{O6a}/decide by OICO_B with decision=ACCEPT (rcp = 30000*12 = 360000 <= offer 1,500,000 — passes)."
            - "POST /collections/offers-in-compromise/{O6b}/decide by OICO_B with decision=REJECT."
            - "POST /collections/offers-in-compromise/{O6c}/withdraw by Taxpayer T6."
            - "GET each OIC and each liability."
          assert:
            - "OIC O6a.status == ACCEPTED AND TaxLiability L6a.status == IN_COMPROMISE."
            - "OIC O6b.status == REJECTED AND TaxLiability L6b.payments_applied_cents == 300000 (deposit allocated as LUMP_SUM)."
            - "OIC O6c.status == WITHDRAWN AND TaxLiability L6c.payments_applied_cents == 300000."

  # =====================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_to_paid_to_lien_release_depth3
        grounds:
          - state_machines.InstallmentAgreement.ACTIVE_to_COMPLETED
          - state_machines.TaxLiability.IN_AGREEMENT_to_PAID
          - state_machines.FederalTaxLien.FILED_to_RELEASED
          - calculations.payment_allocation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /collections/installment-agreements/{id}/record-payment: Payment ALLOCATION applies cents -> TaxLiability.current_balance_cents reaches 0 -> TaxLiability transitions IN_AGREEMENT->PAID (caused by the allocation, not the payment endpoint directly) -> InstallmentAgreement transitions ACTIVE->COMPLETED (caused by the liability becoming PAID, not by the payment) -> FederalTaxLien transitions FILED->RELEASED with release_reason=PAID_IN_FULL (caused by the liability state, not by the payment). Each hop is caused by the previous hop's outcome.
        test_recipe:
          setup:
            - "Activate IA A7 for Taxpayer T7 covering single TaxLiability L7 (current_balance_cents=300000 after pre-charged accruals)."
            - "File a FederalTaxLien FL7 covering L7."
          trigger:
            - "POST /collections/installment-agreements/{A7}/record-payment with amount_cents=300000, received_at=2020-02-01."
          assert:
            - "TaxLiability L7.status == PAID AND L7.current_balance_cents == 0."
            - "InstallmentAgreement A7.status == COMPLETED."
            - "FederalTaxLien FL7.status == RELEASED AND FL7.release_reason == PAID_IN_FULL."

      - name: oic_accept_to_ia_terminate_to_liability_revert_depth3
        grounds:
          - state_machines.OfferInCompromise.UNDER_REVIEW_to_ACCEPTED
          - state_machines.InstallmentAgreement.ACTIVE_to_TERMINATED
          - state_machines.TaxLiability.IN_AGREEMENT_to_OPEN
          - state_machines.FederalTaxLien.FILED_to_RELEASED
        distinguishing_aspect: |
          Depth-3+ chain triggered by POST /collections/offers-in-compromise/{id}/decide ACCEPT: OIC ACCEPTED -> covered liabilities IN_AGREEMENT->IN_COMPROMISE (caused by OIC) -> covering IA cascades ACTIVE->TERMINATED (caused by liability state divergence) -> NON-OIC liabilities under the same IA revert IN_AGREEMENT->OPEN (caused by IA termination). Different triggering transition from instance 1 (OIC accept vs IA payment).
        test_recipe:
          setup:
            - "Taxpayer T8; TaxLiabilities L8a (in-OIC) and L8b (not in OIC), each balance 500000."
            - "Activate IA A8 covering BOTH L8a and L8b, monthly_payment=100000, DDIA."
            - "Create OIC O8 covering ONLY L8a, offer_amount_cents=400000, schedule_months=5; deposit 80000; submit; take-up by OICO_A."
          trigger:
            - "POST /collections/offers-in-compromise/{O8}/decide by OICO_B with decision=ACCEPT (rcp 2,400,000 <= offer? No, but adjust MDI to 30000 => rcp=360000 <= 400000)."
          assert:
            - "OIC O8.status == ACCEPTED."
            - "TaxLiability L8a.status == IN_COMPROMISE."
            - "InstallmentAgreement A8.status == TERMINATED."
            - "TaxLiability L8b.status == OPEN (reverted, not in OIC)."

  # =====================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_overpayment
        grounds:
          - validations[priority=6]    # state: ERR_INVALID_STATE
          - validations[priority=20]   # business_fiscal: ERR_OVERPAYMENT
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 20, ERR_OVERPAYMENT). Recording a payment against an IA that is in DEFAULTED status AND with amount exceeding total balance must fail with ERR_INVALID_STATE (state check at priority 6 fires first), not ERR_OVERPAYMENT.
        test_recipe:
          setup:
            - "Activate IA A9 for T9 covering L9 (balance 200000); transition A9 to DEFAULTED via missed-payment sweep."
          trigger:
            - "POST /collections/installment-agreements/{A9}/record-payment with amount_cents=500000 (> balance 200000)."
          assert:
            - "HTTP status == 409."
            - "Response data.error_id == 'ERR_INVALID_STATE' (state wins over fiscal)."

      - name: business_safety_vs_business_constraint_oic_decide
        grounds:
          - validations[priority=8]    # business_safety: ERR_SEGREGATION_OF_DUTIES
          - validations[priority=18]   # business_constraint: ERR_OIC_BELOW_RCP
        distinguishing_aspect: |
          Pair: business_safety (priority 8, ERR_SEGREGATION_OF_DUTIES) vs business_constraint (priority 18, ERR_OIC_BELOW_RCP). Different error-category pair from instance 1. An OIC accept attempted by the SAME officer who took the case AND with offer < rcp must fail with ERR_SEGREGATION_OF_DUTIES (priority 8 wins), not ERR_OIC_BELOW_RCP.
        test_recipe:
          setup:
            - "Taxpayer T10 with MDI=200000, TaxLiability L10 (balance 1000000)."
            - "OIC O10 with offer_amount_cents=1000000, schedule_months=5; deposit 200000; submit; take-up by OICO_A."
          trigger:
            - "POST /collections/offers-in-compromise/{O10}/decide by OICO_A (SAME officer) with decision=ACCEPT (offer 1,000,000 < rcp 2,400,000 — both checks fail)."
          assert:
            - "HTTP status == 422."
            - "Response data.error_id == 'ERR_SEGREGATION_OF_DUTIES' (safety wins over constraint)."

  # =====================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ddia_threshold_25k_strict_greater_than
        grounds:
          - validations[priority=13]   # ERR_DDIA_REQUIRED
          - entities.InstallmentAgreement.fields.payment_method
        distinguishing_aspect: |
          Threshold: aggregate covered debt > 2,500,000 cents requires DDIA; the comparator is strictly greater-than. Numeric boundary on a debt-aggregate metric, exercised via POST /collections/installment-agreements.
        test_recipe:
          setup:
            - "Taxpayer T11; TaxLiability L11 with current_balance_cents == 2500000 EXACTLY."
            - "Taxpayer T12; TaxLiability L12 with current_balance_cents == 2500001 EXACTLY."
          trigger:
            - "POST /collections/installment-agreements covering L11, payment_method=CHECK, proposed_monthly_payment_cents=50000 — expect success."
            - "POST /collections/installment-agreements covering L12, payment_method=CHECK, proposed_monthly_payment_cents=50000 — expect failure."
          assert:
            - "First request: HTTP 201, InstallmentAgreement created with payment_method=CHECK (boundary 2,500,000 does NOT trigger DDIA)."
            - "Second request: HTTP 422, data.error_id == 'ERR_DDIA_REQUIRED' (2,500,001 strictly > triggers)."

      - name: cnc_eligibility_mdi_zero_inclusive
        grounds:
          - validations[priority=22]   # ERR_CNC_NOT_ELIGIBLE
          - calculations.cnc_eligibility
          - entities.Taxpayer.fields.monthly_disposable_income_cents
        distinguishing_aspect: |
          Boundary on a different metric (taxpayer MDI vs debt aggregate) and a different endpoint (POST /collections/cnc-statuses vs POST /collections/installment-agreements). MDI <= 0 is eligible (inclusive); MDI == 0 succeeds, MDI == 1 fails. This is an inclusive boundary, structurally distinct from instance 1's strict-greater-than boundary.
        test_recipe:
          setup:
            - "Taxpayer T13 with monthly_disposable_income_cents=0."
            - "Taxpayer T14 with monthly_disposable_income_cents=1."
            - "TaxLiability L13 for T13 (balance > 0); L14 for T14 (balance > 0)."
          trigger:
            - "POST /collections/cnc-statuses covering L13, hardship_reason=NEGATIVE_DISPOSABLE_INCOME — expect success."
            - "POST /collections/cnc-statuses covering L14, hardship_reason=NEGATIVE_DISPOSABLE_INCOME — expect failure."
          assert:
            - "First request: HTTP 201, CNCStatus.status == ACTIVE; TaxLiability L13.status == CNC."
            - "Second request: HTTP 422, data.error_id == 'ERR_CNC_NOT_ELIGIBLE'."

  # =====================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ia_activate_depends_on_liability_status
        grounds:
          - state_machines.InstallmentAgreement.PENDING_to_ACTIVE
          - validations[priority=7]    # ERR_LIABILITY_NOT_ELIGIBLE
          - entities.TaxLiability.fields.status
        distinguishing_aspect: |
          Entity pair: InstallmentAgreement -> TaxLiability. IA cannot activate (PENDING->ACTIVE) when any covered liability is in {CNC, IN_COMPROMISE, EXPIRED, PAID}. The IA's valid transitions depend on the partner entity's state.
        test_recipe:
          setup:
            - "Taxpayer T15 with MDI=200000."
            - "TaxLiability L15 (balance 500000); place into CNCStatus (L15.status=CNC)."
            - "Create PENDING IA A15 covering L15, payment_method=DDIA, monthly_payment=50000."
          trigger:
            - "POST /collections/installment-agreements/{A15}/activate."
          assert:
            - "HTTP status == 409."
            - "Response data.error_id == 'ERR_LIABILITY_NOT_ELIGIBLE'."
            - "InstallmentAgreement A15.status remains PENDING."

      - name: lien_withdraw_depends_on_agreement_method
        grounds:
          - state_machines.FederalTaxLien.FILED_to_WITHDRAWN
          - validations[priority=19]   # ERR_LIEN_WITHDRAWAL_NOT_ELIGIBLE
          - entities.InstallmentAgreement.fields.payment_method
        distinguishing_aspect: |
          Different entity pair: FederalTaxLien -> InstallmentAgreement. The lien's WITHDRAW transition requires the covering IA to be DDIA AND aggregate debt <= 25k. The lien depends on the partner IA's payment_method field and aggregate debt — a different cross-entity relationship from instance 1's IA->Liability pair.
        test_recipe:
          setup:
            - "Taxpayer T16; TaxLiability L16 (balance 1,500,000 — under 25k)."
            - "Activate IA A16 covering L16 with payment_method=CHECK (not DDIA), monthly_payment=100000."
            - "File FederalTaxLien FL16 covering L16."
          trigger:
            - "POST /collections/liens/{FL16}/withdraw."
          assert:
            - "HTTP status == 422."
            - "Response data.error_id == 'ERR_LIEN_WITHDRAWAL_NOT_ELIGIBLE'."
            - "FederalTaxLien FL16.status remains FILED."

  # =====================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: csed_tolling_half_open_overlap
        grounds:
          - validations[priority=11]   # ERR_OVERLAPPING_TOLLING
          - calculations.csed_calculation
          - entities.CSEDTollingEvent
        distinguishing_aspect: |
          Interval semantics: CSEDTollingEvent rows use half-open intervals [start_date, end_date). On a single liability and single event_kind, two simultaneously-OPEN events (each treated as [start, NOW())) are forbidden. Geometric treatment: adjacency at the boundary (event_1.end_date == event_2.start_date) does NOT count as overlap because the right endpoint is open. Resource: TaxLiability CSEDTollingEvent stream.
        test_recipe:
          setup:
            - "Create TaxLiability L17 for T17 with assessment_date=2020-01-01."
            - "Clock at 2020-01-01T00:00:00Z."
            - "Create OIC O17a covering L17 (deposit posted, submitted at 2020-01-01) — opens an OIC_PENDING CSEDTollingEvent with start_date=2020-01-01, end_date=null."
          trigger:
            - "POST /_clock/advance to 2020-04-01T00:00:00Z."
            - "POST /collections/offers-in-compromise/{O17a}/withdraw at 2020-04-01 (closes its tolling: end_date=2020-04-01)."
            - "Create + submit OIC O17b covering L17 at 2020-04-01 (opens new OIC_PENDING with start_date=2020-04-01) — boundary-adjacent to the just-closed interval."
            - "GET /collections/tax-liabilities/{L17}."
          assert:
            - "Both submits succeed because half-open semantics treat a.end_date == b.start_date as non-overlapping; csed_effective_date reflects exactly the sum of the closed first interval (90 days) plus the currently-open second interval treated as [2020-04-01, NOW()) — at NOW() == 2020-04-01 the open interval is zero-length so csed_effective_date == 2030-04-01T00:00:00Z."
            - "L17 has exactly two CSEDTollingEvent rows of event_kind=OIC_PENDING; the FIRST has end_date=2020-04-01, the SECOND has end_date=null."

      - name: ia_oic_simultaneous_lock_overlap
        grounds:
          - concurrency_rules[oic-pending-ia-overlap]
          - validations[priority=12]   # ERR_LIABILITY_LOCKED
          - entities.TaxLiability.fields.status
        distinguishing_aspect: |
          Different interval semantics: instead of CSEDTollingEvent half-open arithmetic, this overlap rule treats the liability's WORKFLOW lock as a closed-on-both-sides occupation — while liability is IN_AGREEMENT (under any ACTIVE IA), it CANNOT also be in an UNDER_REVIEW OIC; the lock is symmetric. Different resource (workflow lock on TaxLiability vs CSEDTollingEvent stream) and different geometric treatment (closed-closed vs half-open).
        test_recipe:
          setup:
            - "Activate IA A18 for T18 covering L18; A18.status == ACTIVE."
            - "Create OIC O18 covering L18, schedule_months=5, deposit 20%, offer_amount_cents valid."
          trigger:
            - "POST /collections/offers-in-compromise/{O18}/submit."
            - "POST /collections/offers-in-compromise/{O18}/take-up by OICO_A."
          assert:
            - "Submit succeeds (workflow allows OIC SUBMITTED concurrent with IA ACTIVE; the lock applies only at UNDER_REVIEW)."
            - "Take-up: HTTP 409, data.error_id == 'ERR_LIABILITY_LOCKED' (the closed-closed lock activates at UNDER_REVIEW)."

  # =====================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_allocation_total_invariant
        grounds:
          - calculations.payment_allocation
          - entities.Payment.fields.allocation
          - entities.TaxLiability.fields.payments_applied_cents
        distinguishing_aspect: |
          Conserved quantity: SUM(allocation.applied_cents) == Payment.amount_cents, AND SUM(TaxLiability.payments_applied_cents across all liabilities for taxpayer) increases by exactly Payment.amount_cents on each successful payment. Compensating action: a rejected payment (ERR_OVERPAYMENT) leaves payments_applied_cents unchanged. The invariant: SUM(payments_applied_cents) BEFORE + amount_cents_of_successful_payments == SUM(payments_applied_cents) AFTER.
        test_recipe:
          setup:
            - "Activate IA A19 for T19 covering L19a (balance 400000) and L19b (balance 600000)."
            - "Record initial SUM(payments_applied_cents) = 0."
          trigger:
            - "POST /collections/installment-agreements/{A19}/record-payment with amount_cents=500000 — succeeds."
            - "Read SUM(payments_applied_cents) across L19a, L19b."
            - "POST /collections/installment-agreements/{A19}/record-payment with amount_cents=1000000 — fails (would exceed remaining 500000 by 500000)."
            - "Read SUM(payments_applied_cents) again — must equal previous read (unchanged)."
          assert:
            - "After first payment: L19a.payments_applied_cents == 400000 AND L19b.payments_applied_cents == 100000 (waterfall: csed-soonest first, here L19a first)."
            - "SUM == 500000 (== Payment.amount_cents — perfect allocation conservation)."
            - "After failed payment: SUM(payments_applied_cents) still == 500000 (unchanged — compensating-action invariant holds: rejected payment does NOT mutate the conserved quantity)."

      - name: csed_tolling_balance_invariant
        grounds:
          - calculations.csed_calculation
          - state_machines.OfferInCompromise.SUBMITTED_to_WITHDRAWN
          - entities.CSEDTollingEvent
        distinguishing_aspect: |
          Different conserved quantity: csed_effective_date - csed_base_date == SUM(tolling intervals) at all times. Compensating action: opening a CSEDTollingEvent at T0 and then closing it at T0 (zero-length interval) leaves csed_effective_date unchanged from its pre-open value. Type of conserved quantity is structurally different from instance 1's monetary sum — this is a time-duration accumulator.
        test_recipe:
          setup:
            - "TaxLiability L20 with assessment_date=2020-01-01; csed_base_date=2030-01-01; csed_effective_date initially 2030-01-01."
            - "Read csed_effective_date as VALUE_PRE."
          trigger:
            - "Submit OIC O20 covering L20 at clock-time 2021-06-15T00:00:00Z (opens OIC_PENDING tolling at 2021-06-15)."
            - "Withdraw O20 at same clock-time 2021-06-15T00:00:00Z (closes tolling end_date=2021-06-15)."
            - "Read csed_effective_date as VALUE_POST."
          assert:
            - "VALUE_POST == VALUE_PRE == 2030-01-01T00:00:00Z (zero-length tolling interval leaves csed_effective_date untouched — compensating invariant holds on time duration)."
            - "Any subsequent tolling event of non-zero length will move csed_effective_date by exactly that duration; the invariant is delta(csed_effective_date) == SUM(closed interval durations on this liability)."
