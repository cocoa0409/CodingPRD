              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_n_id}/reprice"
              payload: { expected_claim_version: "${claim_n_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_n_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_id: $.data.id, case_n_v: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/offer"
              payload: { offer_cents: 30000, expected_case_version: "${case_n_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_v1: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 50000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_n_id}/offer"
              payload: { offer_cents: 40000, expected_case_version: "${case_n_v1} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_v2: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 49000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_n_id}/offer"
              payload: { offer_cents: 41000, expected_case_version: "${case_n_v2} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_v3: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 48000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_n_id}/offer"
              payload: { offer_cents: 42000, expected_case_version: "${case_n_v3} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_v4: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 47000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
          trigger:
            - call: "POST /negotiation-cases/${case_n_id}/offer"
              payload: { offer_cents: 43000, expected_case_version: "${case_n_v4} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_n_v5: $.data.version }
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 46000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_n_id}/counter"
              payload: { counter_cents: 45000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { err6: $.data.error_id }
          assert:
            - "after the fifth counter NegotiationCase.${case_n_id}.status == EXPIRED and round_count == 5"
            - "the sixth counter is rejected 409 with error_id ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_blocked_while_appeal_under_review
        grounds:
          - state_machines.Claim.PRICED_to_FINALIZED
          - state_machines.ProviderAppeal
          - errors[ERR_APPEAL_IN_PROGRESS]
        distinguishing_aspect: |
          Pair Claim <- ProviderAppeal: the Claim finalize transition is valid
          from PRICED only when no ProviderAppeal for the claim sits in SUBMITTED
          or UNDER_REVIEW; the dependency crosses from Claim into the appeal
          entity's state set, and clears once the appeal reaches a terminal state.
        test_recipe:
          setup:
            - "Claim O PRICED (33000 fixture). Appeal AO SUBMITTED then moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000013", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "O1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_o_id: $.data.id, claim_o_v: $.data.version }
            - call: "POST /claims/${claim_o_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_o_id}/reprice"
              payload: { expected_claim_version: "${claim_o_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { det_o_id: $.data.id }
            - call: "POST /claims/${claim_o_id}/appeals"
              payload: { determination_id: "${det_o_id}", appeal_reason: "rate dispute" }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { ap_o_id: $.data.id }
            - call: "POST /appeals/${ap_o_id}/start-review"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_o_id}/finalize"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /appeals/${ap_o_id}/resolve"
              payload: { outcome: "UPHELD" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_o_id}/finalize"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "first finalize rejected 409 ERR_APPEAL_IN_PROGRESS while appeal UNDER_REVIEW"
            - "after resolve UPHELD, finalize succeeds and Claim.${claim_o_id}.status == FINALIZED"
            - "Claim.${claim_o_id}.allowed_amount_cents == 33000 (UPHELD keeps the original determination)"

      - name: in_network_pricing_depends_on_agreement_effective_state
        grounds:
          - state_machines.Claim.PENDING_LINES_to_PRICED
          - state_machines.NetworkAgreement
          - errors[ERR_NO_CONTRACTED_AGREEMENT]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair Claim <- NetworkAgreement (different pair than Claim/Appeal): an
          IN_NETWORK claim can only price while an ACTIVE NetworkAgreement covers
          (provider_id, service_date); suspending the agreement flips the same
          reprice call from success to ERR_NO_CONTRACTED_AGREEMENT without any
          change on the claim itself.
        test_recipe:
          setup:
            - "Payer P1, Provider PR1, ACTIVE agreement (discount 0.40, interval covering 2026-09-10)."
            - "Claim P: IN_NETWORK FACILITY, one line 99283 qty 2 unit 30000 (billed 60000), patient 0."
            - "First reprice succeeds at allowed 36000; agreement suspended; second claim Q identical but reprice attempted while agreement SUSPENDED."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000014", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /network-agreements"
              payload: { network_name: "N1", provider_id: "${pr1_id}", discount_percent: 0.40, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "P1", claim_type: "FACILITY", network_status: "IN_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_p_id: $.data.id, claim_p_v: $.data.version }
            - call: "POST /claims/${claim_p_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_p_id}/reprice"
              payload: { expected_claim_version: "${claim_p_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "Q1", claim_type: "FACILITY", network_status: "IN_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_q_id: $.data.id, claim_q_v: $.data.version }
            - call: "POST /claims/${claim_q_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /network-agreements/${ag_id}/suspend"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /claims/${claim_q_id}/reprice"
              payload: { expected_claim_version: "${claim_q_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${claim_p_id}.status == PRICED and allowed_amount_cents == 36000 (agreement was ACTIVE)"
            - "Claim Q reprice rejected 422 ERR_NO_CONTRACTED_AGREEMENT while the same agreement is SUSPENDED"
            - "Claim.${claim_q_id}.status remains PENDING_LINES"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_interval_half_open_adjacency
        grounds:
          - validations[priority=14]
          - errors[ERR_AGREEMENT_OVERLAP]
          - entities.NetworkAgreement.fields.effective_end
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on NetworkAgreement: a new
          agreement whose effective_start equals the existing agreement's
          effective_end does NOT overlap (adjacent is allowed), while starting
          one second earlier does — occupancy touches but never shares an instant.
        test_recipe:
          setup:
            - "Provider PR1. Existing agreement A: [2026-01-01T00:00:00Z, 2026-07-01T00:00:00Z), ACTIVE."
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000015", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /network-agreements"
              payload: { network_name: "A", provider_id: "${pr1_id}", discount_percent: 0.40, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /network-agreements"
              payload: { network_name: "B", provider_id: "${pr1_id}", discount_percent: 0.35, effective_start: "2026-06-30T23:59:59Z", effective_end: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /network-agreements"
              payload: { network_name: "C", provider_id: "${pr1_id}", discount_percent: 0.35, effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { ag_c_id: $.data.id }
          assert:
            - "agreement B rejected 409 ERR_AGREEMENT_OVERLAP (one second of shared occupancy)"
            - "agreement C returns 201 (adjacent at the half-open boundary is not an overlap)"
            - "NetworkAgreement.${ag_c_id}.status == ACTIVE"

      - name: negotiation_case_single_active_occupancy_per_claim
        grounds:
          - state_machines.NegotiationCase
          - errors[ERR_CASE_ALREADY_OPEN]
        distinguishing_aspect: |
          Different interval semantics on a different resource: a claim admits at
          most one non-terminal NegotiationCase — a point-occupancy rule (the
          claim is occupied for the whole lifespan of the case) rather than an
          interval-overlap rule; a second case is rejected while the first is
          OPEN and succeeds once the first is WITHDRAWN (terminal).
        test_recipe:
          setup:
            - "Claim R PRICED (33000 fixture). NegotiationCase NC1 OPEN on claim R."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000016", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "R1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_r_id: $.data.id, claim_r_v: $.data.version }
            - call: "POST /claims/${claim_r_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_r_id}/reprice"
              payload: { expected_claim_version: "${claim_r_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_r_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_r_id: $.data.id }
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_r_id}" }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /negotiation-cases/${case_r_id}/withdraw"
              payload: {}
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_r_id}" }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { case_r2_id: $.data.id }
          assert:
            - "second case rejected 409 ERR_CASE_ALREADY_OPEN while NC1 is OPEN"
            - "after withdraw, NegotiationCase.${case_r_id}.status == WITHDRAWN"
            - "third create returns 201 with NegotiationCase.${case_r2_id}.status == OPEN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settle_and_void_invoice_leave_aggregate_fees_unchanged
        grounds:
          - calculations.fee_invoice
          - state_machines.FeeInvoice
          - entities.FeeInvoice.fields.aggregate_fee_cents
        distinguishing_aspect: |
          Conserved quantity = payer-level aggregate fees: issuing invoice FI1
          (gross 5000) then FI2 (gross 1250) and then VOIDING FI2 must leave the
          aggregate exactly as it was after FI1 alone — sum over non-voided
          invoices of gross_fee_cents == 5000, with zero drift from the void
          compensation.
        test_recipe:
          setup:
            - "Payer P1 with fee_cap 5000; transparency enabled."
            - "Claim S FINALIZED: billed 60000, allowed 33000, patient 5000 -> savings 32000 -> fee raw min(20000,32000)*0.25 + 12000*0.20 = 7400 -> capped 5000."
            - "Claim T FINALIZED: billed 20000, allowed 15000, patient 0 -> savings 5000 -> fee 1250."
            - "FI1 over [S] issued (gross 5000, aggregate 5000); FI2 over [T] issued (gross 1250, aggregate 6250)."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000, transparency_reporting_enabled: true }
              as: OpsAdmin
