              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "RETIRE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "RETIRE" }
              as: PlatformAdmin
          assert:
            - "the RETIRE from MAPPED returns 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "the APPROVE from MAPPED returns 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "SidewalkSegment.${s1}.status == MAPPED and SidewalkSegment.${s1}.version == 1 after both refusals"
            - "the SURVEY returns 200 with SidewalkSegment.${s1}.status == SURVEYED and crossing_risk_score == 0.0"
            - "the second RETIRE returns 200 and SidewalkSegment.${s1}.status == RETIRED"
            - "SidewalkSegment.${s1}.version == 3"
      - name: duty_make_available_from_offline_is_invalid
        claim_type: invalid_transitions
        grounds:
          - "state_machines.Robot.OFFLINE_to_STAGING"
          - "state_machines.Robot.STAGING_to_AVAILABLE"
