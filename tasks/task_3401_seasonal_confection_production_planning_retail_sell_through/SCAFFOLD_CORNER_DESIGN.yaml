              as: ClaimsAdjuster
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "error_id != ERR_SHIPMENT_NOT_FOUND — priority 2 beats priority 3"

      - name: retailer_cannot_submit_another_retailers_commitment
        claim_type: ownership_denial
        grounds:
