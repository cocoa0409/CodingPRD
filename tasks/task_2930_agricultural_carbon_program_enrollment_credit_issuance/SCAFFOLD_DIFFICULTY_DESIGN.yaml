            - "first call: the error is NOT ERR_DUPLICATE_ENROLLMENT (the practice_code differs) and NOT ERR_PRACTICE_COOLDOWN_ACTIVE (nothing was terminated)"
            - "second call: HTTP 201 with Enrollment.${e15_id}.start_crop_year == 2031 and commitment_years == 4 (adjacency at the exclusive end year is legal)"
