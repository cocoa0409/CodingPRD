      - name: the_effectuation_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: |
          The deepest chain in the scaffold runs case → parcels → utility accounts → commitment
          counters → plan readiness → accounts again, and must be verified at every link in one
          request.
        excluded_because:
          difficulty_instance: effectuate_six_link_cutover_annexes_parcels_accounts_and_plan
          rationale: |
            That §1.8 instance asserts all six links of the effectuate cascade — including the
            second visit to the utility accounts once the plan flips to READY — from a single call.

      - name: a_compensating_transition_reverses_its_own_side_effects
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: |
          Undoing a commitment must release exactly the capacity and cost it added, with no drift
          in the provider or plan ledgers.
        excluded_because:
          difficulty_instance: commitment_void_releases_exactly_the_encumbrance_and_cost_it_added
          rationale: |
            That §1.8 instance records both ledgers before and after the void and asserts the
            release is exact, which is the compensation claim for this layer.

      - name: both_fiscal_variants_produce_their_own_result_on_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: |
          The AVERAGE_COST and MARGINAL_COST variants of the fiscal projection must diverge on
          identical territory data, and the protest basis variants must diverge on identical filings.
        excluded_because:
          difficulty_instance: fiscal_variant_average_vs_marginal_diverge_on_identical_territory
          rationale: |
            That §1.8 instance runs both variants over the same territory under two statutes and
            asserts each cost base, each overhead tier and the sign flip between them.

