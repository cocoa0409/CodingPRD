# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (task_1019)
# Breadth probe over §1.1–§1.7. section/claim_type per references/claim-extraction-guide.md.
# Clock default = 2026-07-01T00:00:00Z. excluded_because stubs cite §1.8 instance names.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_customer_create_defaults
        claim_type: Defaults
        grounds: [entities.Customer.fields.wholesale_tier, entities.Customer.fields.status, entities.Customer.fields.store_credit_cents]
        distinguishing_aspect: "Creating a customer without wholesale_tier/store_credit_cents applies defaults NONE and 0; status initializes to ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Default Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
          assert:
            - "Customer.${c}.wholesale_tier == NONE"
            - "Customer.${c}.store_credit_cents == 0"
            - "Customer.${c}.status == ACTIVE"

      - name: corner_get_lot_not_found
        claim_type: Not Found
        grounds: [entities.Lot, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/lots/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/lots/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"

      - name: corner_product_missing_pricing_mode_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.pricing_mode, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Creating a product without the required pricing_mode field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { name: "No Mode", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL" }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_VALIDATION"

      - name: corner_product_by_weight_without_price_invalid_config
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_PRICING_CONFIG]"]
        distinguishing_aspect: "A BY_WEIGHT product with price_per_kg_cents 0 is rejected with ERR_INVALID_PRICING_CONFIG (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { name: "Bad Price", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 0 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_INVALID_PRICING_CONFIG"

      - name: corner_lot_receive_sets_system_fields
        claim_type: System Fields
        grounds: [entities.Lot.fields.current_weight_g, entities.Lot.fields.status, entities.Lot.fields.projected_ready_weight_g]
        distinguishing_aspect: "On receive, current_weight_g == received_weight_g, status == AGING, and projected_ready_weight_g = round(1000*(1-0.001*100)) = 900."
        test_recipe:
          setup: ["Clock 2026-07-01; product shrink 0.001/day, target_aging_days 100, min_aging 0; cave capacity 100000."]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ShopManager }
            - { call: "POST /api/products", payload: { name: "Recv Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 100, shrink_pct_per_day: 0.001 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave R", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cv: "$.data.id" } }
          trigger:
            - { call: "POST /api/lots", payload: { product_id: "${p}", cave_id: "${cv}", received_weight_g: 1000 }, as: ShopManager, captures: { l: "$.data.id" } }
          assert:
            - "Lot.${l}.current_weight_g == 1000"
            - "Lot.${l}.status == AGING"
            - "Lot.${l}.projected_ready_weight_g == 900"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_byunit_line_price
        claim_type: Correct Result
        grounds: [calculations.line_price, entities.OrderLine.fields.provisional_price_cents]
        distinguishing_aspect: "A BY_UNIT charcuterie line with requested_qty 3 at unit_price_cents 700 prices at 2100 (qty * unit_price)."
        test_recipe:
          setup: ["A RETAIL customer and a BY_UNIT charcuterie product at 700 cents/unit; a DRAFT order."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Unit Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Saucisson", category: "CHARCUTERIE", milk_type: "NONE", pasteurized: true, form: "WHOLE_MUSCLE", pricing_mode: "BY_UNIT", unit_price_cents: 700, allergens: ["PORK"], min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_qty: 3 }, as: CounterStaff, captures: { ln: "$.data.id" } }
          assert:
            - "OrderLine.${ln}.provisional_price_cents == 2100"

      - name: corner_cave_usage_after_receive
        claim_type: Correct Result
        grounds: [calculations.cave_usage, entities.Cave.fields.used_g, entities.Cave.fields.available_g]
        distinguishing_aspect: "After receiving a 4000g lot into a 10000g cave, used_g == 4000 and available_g == 6000."
        test_recipe:
          setup: ["Product min_aging 0 shrink 0; cave capacity 10000."]
          setup_api_calls:
            - { call: "POST /api/products", payload: { name: "Usage Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave U", temp_c: 12, humidity_pct: 85, capacity_g: 10000 }, as: ShopManager, captures: { cv: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${p}", cave_id: "${cv}", received_weight_g: 4000 }, as: ShopManager, captures: { l: "$.data.id" } }
          trigger:
            - { call: "GET /api/caves/${cv}", payload: {}, as: ShopManager }
          assert:
            - "Cave.${cv}.used_g == 4000"
            - "Cave.${cv}.available_g == 6000"

      - name: corner_order_label_allergen_union
        claim_type: Correct Result
        grounds: [calculations.order_allergen_label, entities.Product.fields.allergens, entities.Product.fields.pasteurized]
        distinguishing_aspect: "The label aggregates allergens across lines (MILK from cheese, PORK from charcuterie) and flags contains_raw_milk true when any line product is unpasteurized."
        test_recipe:
          setup: ["A RETAIL customer; an unpasteurized cheese product [MILK] and a charcuterie product [PORK]; a DRAFT order with one BY_UNIT line of each."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Label Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Raw Blue", category: "CHEESE", milk_type: "COW", pasteurized: false, form: "WEDGE", pricing_mode: "BY_UNIT", unit_price_cents: 900, allergens: ["MILK"], min_aging_days: 0 }, as: ShopManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Prosciutto", category: "CHARCUTERIE", milk_type: "NONE", pasteurized: true, form: "SLICED", pricing_mode: "BY_UNIT", unit_price_cents: 1200, allergens: ["PORK"], min_aging_days: 0 }, as: ShopManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p1}", requested_qty: 1 }, as: CounterStaff }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p2}", requested_qty: 1 }, as: CounterStaff }
          trigger:
            - { call: "GET /api/orders/${o}/label", payload: {}, as: CounterStaff }
          assert:
            - "label.allergens == [MILK, PORK]"
            - "label.contains_raw_milk == true"
            - "label.line_count == 2"

      - name: corner_wholesale_discount_tier_boundary_5000
        claim_type: Constants Applied
        grounds: [calculations.order_totals, entities.Order.fields.discount_cents]
        distinguishing_aspect: "billable_weight_g exactly 5000 selects the 0.08 tier (>= boundary is inclusive): subtotal 25000 -> discount 2000 -> total 23000."
        test_recipe:
          setup: ["WHOLESALE customer; BY_WEIGHT product at 5000 cents/kg, min_aging 0 shrink 0; READY lot 10000g; DRAFT WHOLESALE order with one 5000g line allocated."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Bistro Z", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Tier Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 5000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave T", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cv: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${p}", cave_id: "${cv}", received_weight_g: 10000 }, as: ShopManager, captures: { l: "$.data.id" } }
            - { call: "POST /api/caves/${cv}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "WHOLESALE", customer_id: "${c}" }, as: WholesaleCustomer, as_user_id: "${c}", captures: { o: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_weight_g: 5000 }, as: CounterStaff, captures: { ln: "$.data.id" } }
            - { call: "GET /api/lots/${l}", payload: {}, as: CounterStaff, captures: { lv: "$.data.version" } }
            - { call: "POST /api/order-lines/${ln}/allocate", payload: { lot_id: "${l}", expected_lot_version: "${lv}" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: CounterStaff }
          assert:
            - "Order.${o}.billable_weight_g == 5000"
            - "Order.${o}.discount_cents == 2000"
            - "Order.${o}.total_cents == 23000"

      - name: corner_catering_delivery_fee_applied
        claim_type: Correct Result
        grounds: [calculations.order_totals, entities.Order.fields.delivery_fee_cents]
        distinguishing_aspect: "A CATERING order adds DELIVERY_FEE_CENTS (2500): subtotal 2000 (BY_UNIT qty 2 @ 1000) -> total 4500; discount 0 for non-WHOLESALE."
        test_recipe:
          setup: ["A RETAIL customer, a prep station, a BY_UNIT product; a CATERING order with a prep window and one qty-2 line."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "Cater Host", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/prep-stations", payload: { name: "Station D" }, as: ShopManager, captures: { ps: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "Pate", category: "CHARCUTERIE", milk_type: "NONE", pasteurized: true, form: "SLICED", pricing_mode: "BY_UNIT", unit_price_cents: 1000, allergens: ["PORK"], min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "CATERING", customer_id: "${c}", prep_station_id: "${ps}", prep_window_start: "2026-08-05T09:00:00Z", prep_window_end: "2026-08-05T12:00:00Z", event_date: "2026-08-05T18:00:00Z" }, as: CounterStaff, captures: { o: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_qty: 2 }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: CounterStaff }
          assert:
            - "Order.${o}.delivery_fee_cents == 2500"
            - "Order.${o}.subtotal_cents == 2000"
            - "Order.${o}.total_cents == 4500"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_pay_before_submit_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.UNPAID_to_PAID, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a DRAFT (not yet SUBMITTED) order is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A RETAIL customer and a DRAFT order (no submit)."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "PS Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${o}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"

      - name: corner_fulfill_before_pay_returns_not_paid
        claim_type: invalid_transition
        grounds: [state_machines.Order.SUBMITTED_to_FULFILLED, "errors[ERR_ORDER_NOT_PAID]"]
        distinguishing_aspect: "Fulfilling a SUBMITTED but UNPAID order is rejected with ERR_ORDER_NOT_PAID."
        test_recipe:
          setup: ["RETAIL customer; pasteurized product min_aging 0 shrink 0; READY lot 1000g; order with a 200g line allocated then SUBMITTED (still UNPAID)."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "FP Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "FP Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave FP", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cv: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${p}", cave_id: "${cv}", received_weight_g: 1000 }, as: ShopManager, captures: { l: "$.data.id" } }
            - { call: "POST /api/caves/${cv}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_weight_g: 200 }, as: CounterStaff, captures: { ln: "$.data.id" } }
            - { call: "GET /api/lots/${l}", payload: {}, as: CounterStaff, captures: { lv: "$.data.version" } }
            - { call: "POST /api/order-lines/${ln}/allocate", payload: { lot_id: "${l}", expected_lot_version: "${lv}" }, as: CounterStaff }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${o}/fulfill", payload: { line_actuals: [ { line_id: "${ln}", actual_cut_weight_g: 200 } ] }, as: CounterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_ORDER_NOT_PAID"

      - name: corner_return_non_fulfilled_returns_not_fulfilled
        claim_type: invalid_transition
        grounds: [state_machines.Order.FULFILLED_to_RETURNED, "errors[ERR_ORDER_NOT_FULFILLED]"]
        distinguishing_aspect: "Returning a DRAFT order (never FULFILLED) is rejected with ERR_ORDER_NOT_FULFILLED."
        test_recipe:
          setup: ["A RETAIL customer and a DRAFT order."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "RN Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${o}/return", payload: {}, as: CounterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_ORDER_NOT_FULFILLED"

      - name: corner_pay_twice_returns_already_paid
        claim_type: Idempotency
        grounds: [state_machines.Order.UNPAID_to_PAID, "errors[ERR_ALREADY_PAID]"]
        distinguishing_aspect: "A second pay on an already-PAID order is rejected with ERR_ALREADY_PAID."
        test_recipe:
          setup: ["RETAIL customer; pasteurized product min_aging 0 shrink 0; READY lot 1000g; order with a 200g line allocated, SUBMITTED, then PAID once."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "PT Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "PT Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave PT", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cv: "$.data.id" } }
            - { call: "POST /api/lots", payload: { product_id: "${p}", cave_id: "${cv}", received_weight_g: 1000 }, as: ShopManager, captures: { l: "$.data.id" } }
            - { call: "POST /api/caves/${cv}/rotate", payload: {}, as: ShopManager }
            - { call: "POST /api/orders", payload: { order_type: "RETAIL", customer_id: "${c}" }, as: CounterStaff, captures: { o: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_weight_g: 200 }, as: CounterStaff, captures: { ln: "$.data.id" } }
            - { call: "GET /api/lots/${l}", payload: {}, as: CounterStaff, captures: { lv: "$.data.version" } }
            - { call: "POST /api/order-lines/${ln}/allocate", payload: { lot_id: "${l}", expected_lot_version: "${lv}" }, as: CounterStaff }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: CounterStaff }
            - { call: "POST /api/orders/${o}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff }
          trigger:
            - { call: "POST /api/orders/${o}/pay", payload: { payment_method: "EXTERNAL" }, as: CounterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_ALREADY_PAID"

      - name: corner_resume_active_subscription_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Subscription.PAUSED_to_ACTIVE, "errors[ERR_SUBSCRIPTION_INVALID_STATE]"]
        distinguishing_aspect: "Resuming an already-ACTIVE subscription is rejected with ERR_SUBSCRIPTION_INVALID_STATE."
        test_recipe:
          setup: ["A WHOLESALE customer, a board, and an ACTIVE subscription."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "RS Cust", region_code: "NY" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "RS Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/boards", payload: { name: "RS Board", components: [ { product_id: "${p}", portion_g: 100 } ] }, as: ShopManager, captures: { b: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${c}", board_id: "${b}", tier: "CLASSIC", monthly_price_cents: 5000, cadence_days: 30 }, as: WholesaleCustomer, as_user_id: "${c}", captures: { s: "$.data.id" } }
          trigger:
            - { call: "POST /api/subscriptions/${s}/resume", payload: {}, as: WholesaleCustomer, as_user_id: "${c}", captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_SUBSCRIPTION_INVALID_STATE"

      - name: corner_cancel_terminal_subscription_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_SUBSCRIPTION_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED subscription (terminal) is rejected with ERR_SUBSCRIPTION_INVALID_STATE."
        test_recipe:
          setup: ["A WHOLESALE customer, a board, and a subscription already cancelled."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "CT Cust", region_code: "NY" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "CT Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
            - { call: "POST /api/boards", payload: { name: "CT Board", components: [ { product_id: "${p}", portion_g: 100 } ] }, as: ShopManager, captures: { b: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${c}", board_id: "${b}", tier: "PREMIUM", monthly_price_cents: 9000, cadence_days: 30 }, as: WholesaleCustomer, as_user_id: "${c}", captures: { s: "$.data.id" } }
            - { call: "POST /api/subscriptions/${s}/cancel", payload: {}, as: WholesaleCustomer, as_user_id: "${c}" }
          trigger:
            - { call: "POST /api/subscriptions/${s}/cancel", payload: {}, as: WholesaleCustomer, as_user_id: "${c}", captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_SUBSCRIPTION_INVALID_STATE"

      - name: corner_add_line_after_submit_not_draft
        claim_type: invalid_transition
        grounds: ["validations[priority=7]", "errors[ERR_ORDER_NOT_DRAFT]"]
