              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-12", amount_cents: 4000 }
              as: EnrollmentSpecialist
              captures: { c_ok: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-27T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/enrollment-records/${rec}"
              as: EnrollmentSpecialist
              captures: { rec_st: $.data.status }
            - call: "GET /api/claims/${c_old}"
              as: EnrollmentSpecialist
              captures: { c_old_st: $.data.status, c_old_reason: $.data.denial_reason }
            - call: "GET /api/claims/${c_ok}"
              as: EnrollmentSpecialist
              captures: { c_ok_st: $.data.status }
          assert:
            - "${rec_st} == DEACTIVATED (2027-02-27 > due 2027-02-26 without revalidation)"
            - "${c_old_st} == DENIED and ${c_old_reason} == ENROLLMENT_DEACTIVATED"
            - "${c_ok_st} == RELEASED (deactivation is not retroactive)"

      - name: roster_supersede_replaces_prior_submission
        claim_type: side_effect_execution
        grounds:
          - state_machines.RosterFile.SUBMITTED_to_SUPERSEDED
          - state_machines.RosterLine.PENDING_to_SUPERSEDED
          - concurrency_rules[roster-submit-stale-agreement]
        distinguishing_aspect: "Submitting a second roster for the same agreement with the current OCC version supersedes the prior SUBMITTED file and flips its PENDING lines to SUPERSEDED; the new file is the only SUBMITTED one."
        test_recipe:
          setup: ["Agreement ACTIVE (version 1); roster A submitted (agreement version advances to 2) with one PENDING ADD line"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf_a: $.data.id }
            - call: "GET /api/delegation-agreements/${ag}"
              as: ComplianceOfficer
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v2}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-09-01" }
              as: EnrollmentSpecialist
              captures: { rf_b: $.data.id, rf_b_st: $.data.status }
            - call: "GET /api/roster-files/${rf_a}"
              as: EnrollmentSpecialist
              captures: { rf_a_st: $.data.status, rf_a_sup: $.data.superseded_count }
          assert:
            - "${rf_b_st} == SUBMITTED and ${rf_b} != ${rf_a}"
            - "${rf_a_st} == SUPERSEDED and ${rf_a_sup} == 1 (its PENDING line moved to SUPERSEDED)"
            - "DelegatedCredentialingAgreement.${ag}.version == 3 after both submissions"

      - name: roster_file_all_confirmed_compound_status
        claim_type: valid_transition
        grounds:
          - state_machines.RosterFile.SUBMITTED_to_CONFIRMED
          - calculations.roster_line_rollup
        distinguishing_aspect: "Compound derivation: when the last PENDING line is confirmed with a matching date, the file auto-transitions SUBMITTED -> CONFIRMED with confirmed_count == total_lines — no explicit file-level call."
        test_recipe:
          setup: ["Agreement ACTIVE; single-line ADD roster submitted"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf: $.data.id, st0: $.data.status }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
            - call: "GET /api/roster-files/${rf}"
              as: EnrollmentSpecialist
              captures: { st1: $.data.status, conf: $.data.confirmed_count, tot: $.data.total_lines }
          assert:
            - "${st0} == SUBMITTED at creation"
            - "${st1} == CONFIRMED with ${conf} == 1 == ${tot}"

      - name: agreement_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds:
          - state_machines.DelegatedCredentialingAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "An agreement whose expiry_date passes under the logical clock becomes EXPIRED automatically; expiry is strictly after expiry_date (still ACTIVE on the expiry date itself)."
        test_recipe:
          setup: ["Agreement [2026-01-01, 2026-12-31] ACTIVE"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/delegation-agreements/${ag}"
              as: ComplianceOfficer
              captures: { st_on: $.data.status }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/delegation-agreements/${ag}"
              as: ComplianceOfficer
              captures: { st_after: $.data.status }
          assert:
            - "${st_on} == ACTIVE (expiry is strictly greater-than; the expiry date itself is still covered)"
            - "${st_after} == EXPIRED"

      - name: approve_from_wrong_state_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.EnrollmentApplication.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Approve is defined only from SUBMITTED: calling it on a DRAFT application (submit step skipped) fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Attested provider; application in DRAFT"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "EnrollmentApplication.${app}.status remains DRAFT; no EnrollmentRecord created"

      - name: cyclic_machines_covered_by_difficulty
        claim_type: invalid_transition
        grounds:
          - state_machines.EnrollmentApplication.PENDING_INFO_to_SUBMITTED
          - state_machines.CAQHProfile.LAPSED_to_ATTESTED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / application_info_request_cycle and caqh_relapse_reattest_cycle"
          rationale: "The cyclic loops (info-request resubmission, attestation re-attestation after lapse) are asserted by the two named §1.8 instances."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: claim_release_filters_by_service_date
        claim_type: input_set_filtering
        grounds:
          - calculations.claim_hold_evaluation
          - state_machines.Claim.HELD_to_RELEASED
        distinguishing_aspect: "The release cascade includes only HELD claims with service_date >= the new record's effective_date: the 2026-08-01 claim releases, the 2026-07-20 claim stays HELD."
        test_recipe:
          setup:
            - "Attested provider; payer hold-enabled; two HELD claims (2026-07-20 and 2026-08-01) created before approval; approval at default clock yields effective_date 2026-08-01"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-07-20", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { c_early: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { c_late: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/claims/${c_early}"
              as: EnrollmentSpecialist
              captures: { st_early: $.data.status }
            - call: "GET /api/claims/${c_late}"
              as: EnrollmentSpecialist
              captures: { st_late: $.data.status }
          assert:
            - "${st_late} == RELEASED (service_date 2026-08-01 >= effective_date 2026-08-01)"
            - "${st_early} == HELD (service_date 2026-07-20 before effective date — excluded from the release set)"

      - name: attestation_due_window_entry_boundary
        claim_type: constants_applied
        grounds:
          - calculations.caqh_attestation_cycle
          - state_machines.CAQHProfile.ATTESTED_to_DUE
        distinguishing_aspect: "The DUE warning window opens at due_at - 30 days inclusive: at 2026-10-29T00:00:00Z the profile is still ATTESTED; at 2026-10-30T00:00:00Z it is DUE."
        test_recipe:
          setup: ["Provider attested at 2026-08-01T00:00:00Z (due_at 2026-11-29T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
