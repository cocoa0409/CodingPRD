# =============================================================================
# §1.9 Scaffold Corner Design — task_1488_public_refrigerated_warehousing
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_defaults_and_open_invoice_side_effect
        claim_type: defaults
        grounds:
          - "entities.Customer.fields.status"
          - "entities.Invoice.fields.status"
          - "endpoints[POST /api/customers]"
        distinguishing_aspect: "A new customer starts ACTIVE with version 1, and the creation side effect materializes exactly one OPEN invoice for the clock's calendar month (default clock 2026-08-01 -> period [2026-08-01, 2026-09-01))."
        test_recipe:
          setup: ["Empty DB; logical clock untouched (defaults to 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "New Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cN: $.data.id, cN_v: $.data.version, cN_st: $.data.status } }
          trigger:
            - { call: "GET /api/invoices?customer_id=${cN}&status=OPEN", as: BillingAdmin, captures: { invN: "$.data[0].id", invN_ps: "$.data[0].period_start", invN_pe: "$.data[0].period_end", invN_tot: "$.data[0].total_cents" } }
          assert:
            - "Customer.${cN}.status == ACTIVE and version == 1"
            - "Exactly one OPEN invoice exists for the customer"
            - "Invoice.${invN}.period_start == 2026-08-01T00:00:00Z and period_end == 2026-09-01T00:00:00Z"
            - "Invoice.${invN}.total_cents == 0 and all component fields == 0"

      - name: receipt_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - "entities.InboundReceipt.fields.zone_id"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required zone_id from receipt creation is rejected with ERR_VALIDATION (400) before any existence or business check."
        test_recipe:
          setup: ["Customer exists (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Req Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cReq: $.data.id } }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cReq}", product_code: "PEAS", lot_code: "L1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cReq}", captures: { errReq: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status 400 (missing zone_id)"

      - name: zone_invalid_enum_temp_class_rejected
        claim_type: type_constraints
        grounds:
          - "entities.TemperatureZone.fields.temp_class"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "temp_class is a closed enum {FROZEN, CHILLED}; ARCTIC is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/zones", payload: { zone_code: "ZX-1", temp_class: ARCTIC, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { errZ: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status 400"

      - name: zone_computed_fields_system_derived_on_create
        claim_type: computed_fields
        grounds:
          - "entities.TemperatureZone.fields.free_pallets"
          - "entities.TemperatureZone.fields.posture"
          - "calculations.zone_free_pallets"
        distinguishing_aspect: "free_pallets, in_use_pallets, reserved_pallets and posture are server-computed: a fresh zone reports in_use 0, reserved 0, free == capacity, posture OPEN."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/zones", payload: { zone_code: "ZC-1", temp_class: FROZEN, capacity_pallets: 7, dock_doors: 1 }, as: WarehouseOperator, captures: { zC: $.data.id } }
          trigger:
            - { call: "GET /api/zones/${zC}", as: WarehouseOperator, captures: { zC_use: $.data.in_use_pallets, zC_res: $.data.reserved_pallets, zC_free: $.data.free_pallets, zC_post: $.data.posture } }
          assert:
            - "TemperatureZone.${zC}.in_use_pallets == 0 and reserved_pallets == 0"
            - "TemperatureZone.${zC}.free_pallets == 7 and posture == OPEN"

      - name: get_nonexistent_pallet_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "GET with a well-formed but unknown pallet id returns 404 ERR_NOT_FOUND in the standard error envelope (data.error_id, response_type error)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/pallets/00000000-0000-4000-8000-000000000000", as: WarehouseOperator, captures: { errNF: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"
            - "Error envelope: response_type == 'error', data.error_id present, meta.api_request_id present"

      - name: pallet_list_pagination_defaults_and_filter
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
          - "endpoints[GET /api/pallets]"
        distinguishing_aspect: "Default pagination (limit 10, offset 0) applies to filtered lists: 12 pallets under one lot return 10 entries with total_count 12 and has_more true; offset 10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["Customer with card A; FROZEN zone cap 20; one lot PG with 12 pallets (received 2026-08-02)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Page Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cPg: $.data.id, cPg_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cPg}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cPg_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-PG", temp_class: FROZEN, capacity_pallets: 20, dock_doors: 2 }, as: WarehouseOperator, captures: { zPg: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cPg}", zone_id: "${zPg}", product_code: "PEAS", lot_code: "PG", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 12, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cPg}", captures: { rPg: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rPg}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rPg}/complete", payload: { actual_pallets: 12 }, as: WarehouseOperator, captures: { lotPg: $.data.lot_id } }
          trigger:
            - { call: "GET /api/pallets?lot_id=${lotPg}", as: WarehouseOperator, captures: { pg1_first: "$.data[0].id" } }
            - { call: "GET /api/pallets?lot_id=${lotPg}&offset=10", as: WarehouseOperator, captures: { pg2_first: "$.data[0].id" } }
          assert:
            - "Page 1: exactly 10 entries, total_count == 12, has_more == true (default limit 10)"
            - "Page 2 (offset 10): exactly 2 entries, total_count == 12, has_more == false"
            - "Pages are disjoint and together cover all 12 pallets"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: receipt_initial_state_scheduled
        claim_type: initial_state
        grounds:
          - "state_machines.InboundReceipt"
        distinguishing_aspect: "A freshly created receipt is SCHEDULED with actual_pallets null and lot_id null (lot linkage happens only at completion)."
        test_recipe:
          setup: ["Customer (ACTIVE) and a FROZEN zone exist"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Init Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cIn: $.data.id } }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-IN", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { zIn: $.data.id } }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cIn}", zone_id: "${zIn}", product_code: "PEAS", lot_code: "IN", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cIn}", captures: { rIn: $.data.id, rIn_st: $.data.status, rIn_ap: $.data.actual_pallets, rIn_lot: $.data.lot_id } }
          assert:
            - "InboundReceipt.${rIn}.status == SCHEDULED"
            - "InboundReceipt.${rIn}.actual_pallets is null and lot_id is null"

      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.OutboundOrder"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal: submit, allocate, ship, amend, and a second cancel on a cancelled order all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer with card A; order created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Term Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cTm: $.data.id, cTm_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cTm}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cTm_v}" }, as: BillingAdmin }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cTm}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${cTm}", captures: { oTm: $.data.id, oTm_v: $.data.version } }
            - { call: "POST /api/outbound-orders/${oTm}/cancel", payload: {}, as: CustomerAdmin, as_user_id: "${cTm}" }
          trigger:
            - { call: "POST /api/outbound-orders/${oTm}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${cTm}", captures: { errTm1: $.data.error_id } }
            - { call: "POST /api/outbound-orders/${oTm}/ship", payload: {}, as: WarehouseOperator, captures: { errTm2: $.data.error_id } }
            - { call: "POST /api/outbound-orders/${oTm}/cancel", payload: {}, as: CustomerAdmin, as_user_id: "${cTm}", captures: { errTm3: $.data.error_id } }
          assert:
            - "submit on CANCELLED: error_id == ERR_INVALID_STATE"
            - "ship on CANCELLED: error_id == ERR_INVALID_STATE"
            - "second cancel: error_id == ERR_INVALID_STATE (idempotency via terminal lockdown)"

      - name: dispute_open_invoice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Invoice"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "dispute is defined only from FINALIZED; an OPEN invoice rejects dispute with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer exists (auto-created OPEN invoice)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Disp2 Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cD2: $.data.id } }
            - { call: "GET /api/invoices?customer_id=${cD2}&status=OPEN", as: BillingAdmin, captures: { invD2: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/invoices/${invD2}/dispute", payload: {}, as: CustomerAdmin, as_user_id: "${cD2}", captures: { errD2: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Invoice.${invD2}.status remains OPEN"

      - name: excursion_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - "state_machines.TemperatureExcursion.REPORTED_to_CONFIRMED_BREACH"
        excluded_because:
          difficulty_instance: excursion_confirm_four_hop_cascade
          rationale: "All four hop side effects (quarantine, lot recompute, allocation release, order demotion) asserted there."

      - name: ship_side_effects_inventory_and_fee
        claim_type: side_effect_execution
        grounds:
          - "state_machines.OutboundOrder.ALLOCATED_to_SHIPPED"
        distinguishing_aspect: "Ship executes the full side-effect set at once: pallets -> SHIPPED with out_at, allocations -> FULFILLED, zone in_use decremented, lot recomputed to DEPLETED, final fee accrued to the OPEN invoice."
        test_recipe:
          setup: ["Customer with card A; zone cap 5 with 2 pallets lot SH; order for 2 ALLOCATED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Ship Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cSh: $.data.id, cSh_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cSh}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cSh_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-SH", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zSh: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cSh}", zone_id: "${zSh}", product_code: "PEAS", lot_code: "SH", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cSh}", captures: { rSh: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rSh}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rSh}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotSh: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cSh}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${cSh}", captures: { oSh: $.data.id } }
            - { call: "POST /api/outbound-orders/${oSh}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${cSh}" }
            - { call: "POST /api/outbound-orders/${oSh}/allocate", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/outbound-orders/${oSh}/ship", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/zones/${zSh}", as: WarehouseOperator, captures: { zSh_use: $.data.in_use_pallets } }
            - { call: "GET /api/lots/${lotSh}", as: WarehouseOperator, captures: { lotSh_st: $.data.status, lotSh_on: $.data.on_hand_pallets } }
            - { call: "GET /api/invoices?customer_id=${cSh}&status=OPEN", as: BillingAdmin, captures: { invSh_ho: "$.data[0].handling_out_cents" } }
            - { call: "GET /api/outbound-orders/${oSh}", as: WarehouseOperator, captures: { oSh_st: $.data.status, oSh_fin: $.data.final_handling_out_cents } }
          assert:
            - "OutboundOrder.${oSh}.status == SHIPPED and final_handling_out_cents == 1000 (2 * 500, no discount at volume 2)"
            - "TemperatureZone.${zSh}.in_use_pallets == 0"
            - "InventoryLot.${lotSh}.on_hand_pallets == 0 and status == DEPLETED"
            - "OPEN invoice.handling_out_cents == 1000 (accrued immediately at ship)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: fifo_allocation_oldest_production_date_first
        claim_type: correct_result
        grounds:
          - "calculations.fifo_allocation"
        distinguishing_aspect: "FIFO ranks by lot.production_date ASC before pallet.received_at: an order for 3 draws both pallets of the older-production lot (2026-01-05, received LATER on 08-03) before touching the newer lot (2026-01-10, received 08-02)."
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone cap 10"
            - "Lot NEWA: 2 pallets, production 2026-01-10, received 2026-08-02; lot OLDB: 2 pallets, production 2026-01-05, received 2026-08-03"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Fifo Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cFf: $.data.id, cFf_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cFf}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cFf_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-FF", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zFf: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cFf}", zone_id: "${zFf}", product_code: "PEAS", lot_code: "NEWA", production_date: "2026-01-10", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cFf}", captures: { rFfA: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cFf}", zone_id: "${zFf}", product_code: "PEAS", lot_code: "OLDB", production_date: "2026-01-05", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cFf}", captures: { rFfB: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFfA}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFfA}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotFfA: $.data.lot_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFfB}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFfB}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotFfB: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cFf}", product_code: "PEAS", requested_pallets: 3 }, as: CustomerAdmin, as_user_id: "${cFf}", captures: { oFf: $.data.id } }
            - { call: "POST /api/outbound-orders/${oFf}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${cFf}" }
          trigger:
            - { call: "POST /api/outbound-orders/${oFf}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/allocations?order_id=${oFf}", as: WarehouseOperator, captures: { alFf1: "$.data[0].lot_id", alFf2: "$.data[1].lot_id", alFf3: "$.data[2].lot_id" } }
          assert:
            - "OutboundOrder.${oFf}.status == ALLOCATED with allocated_pallets == 3"
            - "Exactly 2 of the 3 allocations reference lot ${lotFfB} (OLDB, production 2026-01-05) — the older-production lot drains first"
            - "Exactly 1 allocation references lot ${lotFfA} (NEWA) despite NEWA being received a day earlier"
            - "Allocations sorted created_at ASC: the first two are OLDB pallets"

      - name: blast_fee_constants_applied
        claim_type: constants_applied
        grounds:
          - "calculations.blast_freeze_fee"
        distinguishing_aspect: "fee = blast_base_cents + pallet_count * blast_per_pallet_cents with card constants 2000 and 300: a 2-pallet completion charges exactly 2600 onto the OPEN invoice."
        test_recipe:
          setup: ["Customer with card A; zone with 2 pallets lot BC; cell capacity 5; booking (pallet_count 2) started inside its window"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Fee Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cFe: $.data.id, cFe_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cFe}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cFe_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-FE", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zFe: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cFe}", zone_id: "${zFe}", product_code: "PEAS", lot_code: "BC", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cFe}", captures: { rFe: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFe}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rFe}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotFe: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-FE", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellFe: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellFe}", lot_id: "${lotFe}", pallet_count: 2, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: WarehouseOperator, captures: { bkFe: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bkFe}/start", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/blast-freeze-bookings/${bkFe}/complete", payload: {}, as: WarehouseOperator, captures: { bkFe_fee: $.data.fee_cents } }
            - { call: "GET /api/invoices?customer_id=${cFe}&status=OPEN", as: BillingAdmin, captures: { invFe_bl: "$.data[0].blast_freeze_cents" } }
          assert:
            - "BlastFreezeBooking.${bkFe}.fee_cents == 2600  # 2000 + 2*300"
            - "OPEN invoice.blast_freeze_cents == 2600"

      - name: zone_posture_tight_threshold_boundary
        claim_type: correct_result
        grounds:
          - "calculations.zone_posture"
        distinguishing_aspect: "TIGHT band: free == max(1, floor(capacity*0.10)) yields TIGHT while free one above yields OPEN — capacity 10 -> threshold 1, so 9 stored pallets (free 1) is TIGHT and 8 stored (free 2) is OPEN."
        test_recipe:
          setup: ["Customer with card A; zone cap 10 dock_doors 2; receipt R9 (9 pallets) completed; zone Z2 cap 10 with receipt R8 (8 pallets) completed"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Tight Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cTi: $.data.id, cTi_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cTi}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cTi_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-T9", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zT9: $.data.id } }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-T8", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zT8: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cTi}", zone_id: "${zT9}", product_code: "PEAS", lot_code: "T9", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 9, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cTi}", captures: { rT9: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cTi}", zone_id: "${zT8}", product_code: "PEAS", lot_code: "T8", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 8, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cTi}", captures: { rT8: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT9}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT9}/complete", payload: { actual_pallets: 9 }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT8}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT8}/complete", payload: { actual_pallets: 8 }, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/zones/${zT9}", as: WarehouseOperator, captures: { zT9_p: $.data.posture, zT9_f: $.data.free_pallets } }
            - { call: "GET /api/zones/${zT8}", as: WarehouseOperator, captures: { zT8_p: $.data.posture, zT8_f: $.data.free_pallets } }
          assert:
            - "TemperatureZone.${zT9}.free_pallets == 1 and posture == TIGHT  # free <= max(1, floor(10*0.10)) == 1"
            - "TemperatureZone.${zT8}.free_pallets == 2 and posture == OPEN"

      - name: storage_mid_period_ship_day_counting
        claim_type: input_set_filtering
        grounds:
          - "calculations.storage_charge"
        excluded_because:
          difficulty_instance: storage_per_pallet_round_then_sum_order
          rationale: "That instance's fixture (received 08-30, shipped 08-31 -> exactly 1 chargeable day) is precisely the presence-window input-set rule; storage_cents == 99 asserts it."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: temp_class_mismatch_rejected_at_receipt_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_TEMP_CLASS_MISMATCH]"
        distinguishing_aspect: "A CHILLED receipt pre-assigned to a FROZEN zone is rejected at creation with ERR_TEMP_CLASS_MISMATCH — product temperature class must equal zone class."
        test_recipe:
          setup: ["Customer (ACTIVE); FROZEN zone exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Temp Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cTc: $.data.id } }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-TC", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { zTc: $.data.id } }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cTc}", zone_id: "${zTc}", product_code: "MILK", lot_code: "TC", production_date: "2026-01-15", temp_class: CHILLED, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cTc}", captures: { errTc: $.data.error_id } }
          assert:
            - "error_id == ERR_TEMP_CLASS_MISMATCH (409); no receipt persisted"

      - name: claim_exceeds_quarantined_count_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT]"
        distinguishing_aspect: "affected_pallet_count is bounded by the excursion's recorded quarantined_pallet_count: claiming 5 against an excursion that quarantined 2 is rejected with ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT (422)."
        test_recipe:
          setup: ["Customer with card A; zone with 2 pallets; excursion confirmed (quarantined_pallet_count == 2)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Exceed Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cXc: $.data.id, cXc_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cXc}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cXc_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-XC", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zXc: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cXc}", zone_id: "${zXc}", product_code: "PEAS", lot_code: "XC", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cXc}", captures: { rXc: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rXc}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rXc}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zXc}", observed_temp_c: -2.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exXc: $.data.id } }
            - { call: "POST /api/temperature-excursions/${exXc}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /api/claims", payload: { customer_id: "${cXc}", excursion_id: "${exXc}", affected_pallet_count: 5, declared_value_cents: 9000 }, as: CustomerAdmin, as_user_id: "${cXc}", captures: { errXc: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT and HTTP status 422 (5 > quarantined 2)"

      - name: zone_capacity_exceeded_on_over_receipt_putaway
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_ZONE_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Putaway is the hard capacity gate: with free 1 after reservation release, completing with actual_pallets 2 fails ERR_ZONE_CAPACITY_EXCEEDED — distinct from the FULL-posture arrival gate."
        test_recipe:
          setup: ["Customer with card A; zone cap 4: receipt A (3 pallets) COMPLETED; receipt B (expected 1) ARRIVED (reserved 1, free 0)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Over Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cOv: $.data.id, cOv_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cOv}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cOv_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-OV", temp_class: FROZEN, capacity_pallets: 4, dock_doors: 2 }, as: WarehouseOperator, captures: { zOv: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cOv}", zone_id: "${zOv}", product_code: "PEAS", lot_code: "O1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 3, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cOv}", captures: { rOv1: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cOv}", zone_id: "${zOv}", product_code: "PEAS", lot_code: "O2", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z" }, as: CustomerAdmin, as_user_id: "${cOv}", captures: { rOv2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rOv1}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rOv1}/complete", payload: { actual_pallets: 3 }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rOv2}/arrive", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/inbound-receipts/${rOv2}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { errOv: $.data.error_id } }
          assert:
            - "error_id == ERR_ZONE_CAPACITY_EXCEEDED (after reservation release free == 1 < actual 2)"
            - "Receipt B stays ARRIVED; its reservation is retained (reserved_pallets == 1)"
            - "Zone in_use_pallets == 3 (unchanged by the failed putaway)"

      - name: lot_production_date_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOT_PRODUCTION_DATE_MISMATCH]"
          - "entities.InventoryLot.fields.production_date"
        distinguishing_aspect: "Lot continuity: completing a receipt whose (customer, product, lot_code) already exists with a different production_date is rejected — a lot cannot blend two production dates."
        test_recipe:
          setup: ["Customer with card A; lot PD (PEAS, production 2026-01-15) already has 1 pallet; second receipt same keys but production 2026-02-20 ARRIVED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Lot Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cLm: $.data.id, cLm_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cLm}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cLm_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-LM", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zLm: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cLm}", zone_id: "${zLm}", product_code: "PEAS", lot_code: "PD", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cLm}", captures: { rLm1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rLm1}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rLm1}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cLm}", zone_id: "${zLm}", product_code: "PEAS", lot_code: "PD", production_date: "2026-02-20", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cLm}", captures: { rLm2: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rLm2}/arrive", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/inbound-receipts/${rLm2}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator, captures: { errLm: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_PRODUCTION_DATE_MISMATCH (existing lot PD has production_date 2026-01-15 != 2026-02-20)"
            - "Receipt stays ARRIVED; no pallet created; lot on_hand still 1"

      - name: booking_start_outside_window_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_OUTSIDE_WINDOW]"
        distinguishing_aspect: "Starting a booking before window_start (or after window_end) is rejected ERR_OUTSIDE_WINDOW — the logical clock must be inside the booked window."
        test_recipe:
          setup: ["Customer with card A; 2 pallets lot OW; cell; booking window 2026-08-10T10:00-12:00 SCHEDULED; clock parked at 2026-08-10T09:00 (before window)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Win Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cWn: $.data.id, cWn_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cWn}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cWn_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-WN", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zWn: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cWn}", zone_id: "${zWn}", product_code: "PEAS", lot_code: "OW", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cWn}", captures: { rWn: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rWn}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rWn}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotWn: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-WN", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellWn: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellWn}", lot_id: "${lotWn}", pallet_count: 1, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkWn: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/blast-freeze-bookings/${bkWn}/start", payload: {}, as: WarehouseOperator, captures: { errWn: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bkWn}/start", payload: {}, as: WarehouseOperator, captures: { bkWn_st: $.data.status } }
          assert:
            - "Start at 09:00 (before window): error_id == ERR_OUTSIDE_WINDOW; booking stays SCHEDULED"
            - "Start at exactly window_start 10:00 succeeds (inclusive boundary): status == IN_PROGRESS"

      - name: insufficient_freezable_stock_at_booking_start
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSUFFICIENT_FREEZABLE_STOCK]"
          - "state_machines.BlastFreezeBooking.SCHEDULED_to_IN_PROGRESS"
        distinguishing_aspect: "The start-time selector requires pallet_count pallets with status STORED and quality OK on the lot; with only 1 eligible of 2 requested, start fails ERR_INSUFFICIENT_FREEZABLE_STOCK."
        test_recipe:
          setup: ["Customer with card A; lot IS with 2 pallets, one quarantined via confirmed excursion (1 eligible); booking pallet_count 2 inside window"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Ins Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cIs: $.data.id, cIs_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cIs}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cIs_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-IS", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zIs: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cIs}", zone_id: "${zIs}", product_code: "PEAS", lot_code: "IS", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cIs}", captures: { rIs: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rIs}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rIs}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotIs: $.data.lot_id } }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zIs}", observed_temp_c: -2.0, window_start: "2026-08-02T12:00:00Z", window_end: "2026-08-02T13:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exIs: $.data.id } }
            - { call: "POST /api/temperature-excursions/${exIs}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /api/pallets?lot_id=${lotIs}", as: QualityManager, captures: { pIs1: "$.data[0].id" } }
            - { call: "POST /api/pallets/${pIs1}/release-quarantine", payload: {}, as: QualityManager }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-IS", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellIs: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellIs}", lot_id: "${lotIs}", pallet_count: 2, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: WarehouseOperator, captures: { bkIs: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/blast-freeze-bookings/${bkIs}/start", payload: {}, as: WarehouseOperator, captures: { errIs: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_FREEZABLE_STOCK (only 1 of 2 lot pallets is STORED+OK after one release)"
            - "BlastFreezeBooking.${bkIs}.status remains SCHEDULED"

      - name: cell_capacity_exceeded_on_booking_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CELL_CAPACITY_EXCEEDED]"
          - "entities.BlastFreezeCell.fields.capacity_pallets"
        distinguishing_aspect: "pallet_count above the cell's capacity_pallets is rejected at booking creation (ERR_CELL_CAPACITY_EXCEEDED); equal-to-capacity passes."
        test_recipe:
          setup: ["Customer with card A; lot CC2 with 4 pallets; cell capacity 3"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Cell Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cCe: $.data.id, cCe_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cCe}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cCe_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-CE", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zCe: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cCe}", zone_id: "${zCe}", product_code: "PEAS", lot_code: "CC2", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cCe}", captures: { rCe: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCe}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCe}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator, captures: { lotCe: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-CE", capacity_pallets: 3, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellCe: $.data.id } }
          trigger:
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCe}", lot_id: "${lotCe}", pallet_count: 4, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: WarehouseOperator, captures: { errCe: $.data.error_id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCe}", lot_id: "${lotCe}", pallet_count: 3, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: WarehouseOperator, captures: { bkCe: $.data.id } }
          assert:
            - "pallet_count 4 > capacity 3: error_id == ERR_CELL_CAPACITY_EXCEEDED"
            - "pallet_count 3 == capacity 3: booking ${bkCe} created SCHEDULED (boundary inclusive)"

      - name: recall_complete_blocked_by_undispositioned_stock
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RECALL_HAS_UNDISPOSITIONED_STOCK]"
          - "state_machines.RecallEvent.ACTIVE_to_COMPLETED"
        distinguishing_aspect: "Recall completion requires every present RECALLED pallet to be DISPOSITIONED first; completing early fails, and succeeds after disposal of the last recalled pallet."
        test_recipe:
          setup: ["Customer with card A; lot RC with 2 pallets; recall ACTIVATED (both pallets RECALLED)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Rec2 Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cR2: $.data.id, cR2_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cR2}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cR2_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-R2", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zR2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cR2}", zone_id: "${zR2}", product_code: "PEAS", lot_code: "RC", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cR2}", captures: { rR2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rR2}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rR2}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotR2: $.data.lot_id } }
            - { call: "POST /api/recalls", payload: { customer_id: "${cR2}", product_code: "PEAS", lot_code: "RC", reason: "salmonella" }, as: QualityManager, captures: { rcR2: $.data.id } }
            - { call: "POST /api/recalls/${rcR2}/activate", payload: {}, as: QualityManager }
            - { call: "GET /api/pallets?lot_id=${lotR2}", as: QualityManager, captures: { pR2a: "$.data[0].id", pR2b: "$.data[1].id" } }
          trigger:
            - { call: "POST /api/recalls/${rcR2}/complete", payload: {}, as: QualityManager, captures: { errR2: $.data.error_id } }
            - { call: "POST /api/pallets/${pR2a}/dispose", payload: {}, as: QualityManager }
            - { call: "POST /api/pallets/${pR2b}/dispose", payload: {}, as: QualityManager }
            - { call: "POST /api/recalls/${rcR2}/complete", payload: {}, as: QualityManager, captures: { rcR2_st: $.data.status } }
          assert:
            - "Early complete: error_id == ERR_RECALL_HAS_UNDISPOSITIONED_STOCK"
            - "After disposing both recalled pallets: complete succeeds, RecallEvent.${rcR2}.status == COMPLETED"
            - "InventoryLot.${lotR2}.status == DEPLETED after disposals (on_hand 0, none left RECALLED-present)"

      - name: sod_reporter_cannot_confirm_own_excursion
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SOD_VIOLATION]"
        distinguishing_aspect: "Segregation of duties: the X-User-ID that reported an excursion may not confirm or clear it, even holding the QualityManager role; a different QualityManager succeeds."
        test_recipe:
          setup: ["Zone with an excursion reported by X-User-ID 'op-7'"]
          setup_api_calls:
            - { call: "POST /api/zones", payload: { zone_code: "FZ-SOD", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { zSod: $.data.id } }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zSod}", observed_temp_c: -2.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-7", captures: { exSod: $.data.id } }
          trigger:
            - { call: "POST /api/temperature-excursions/${exSod}/confirm", payload: {}, as: QualityManager, as_user_id: "op-7", captures: { errSod: $.data.error_id } }
            - { call: "POST /api/temperature-excursions/${exSod}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-9", captures: { exSod_st: $.data.status } }
          assert:
            - "Same X-User-ID as reporter: error_id == ERR_SOD_VIOLATION (403); excursion stays REPORTED"
            - "Different QualityManager: confirm succeeds, status == CONFIRMED_BREACH"

      - name: suspended_customer_blocked_from_new_work
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_CUSTOMER_SUSPENDED]"
          - "state_machines.Customer"
        distinguishing_aspect: "A SUSPENDED customer cannot create receipts or orders (ERR_CUSTOMER_SUSPENDED); reactivation restores the ability immediately."
        test_recipe:
          setup: ["Customer with card A, then PATCHed to SUSPENDED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Susp Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cSu: $.data.id, cSu_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cSu}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cSu_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-SU", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zSu: $.data.id } }
            - { call: "PATCH /api/customers/${cSu}", payload: { status: SUSPENDED }, as: BillingAdmin }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cSu}", zone_id: "${zSu}", product_code: "PEAS", lot_code: "SU", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cSu}", captures: { errSu1: $.data.error_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cSu}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${cSu}", captures: { errSu2: $.data.error_id } }
            - { call: "PATCH /api/customers/${cSu}", payload: { status: ACTIVE }, as: BillingAdmin }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cSu}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${cSu}", captures: { oSu: $.data.id } }
          assert:
            - "While SUSPENDED: receipt create -> ERR_CUSTOMER_SUSPENDED; order create -> ERR_CUSTOMER_SUSPENDED"
            - "After reactivation: order create succeeds (${oSu} exists, DRAFT)"

      - name: charging_without_active_rate_card_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_NO_ACTIVE_RATE_CARD]"
        distinguishing_aspect: "A charging event (receipt completion) with no ACTIVE rate card on the customer is rejected ERR_NO_ACTIVE_RATE_CARD; installing a card unblocks it."
        test_recipe:
          setup: ["Customer WITHOUT any rate card; receipt ARRIVED for 1 pallet"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Nocard Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cNc: $.data.id, cNc_v: $.data.version } }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-NC", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zNc: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cNc}", zone_id: "${zNc}", product_code: "PEAS", lot_code: "NC", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cNc}", captures: { rNc: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rNc}/arrive", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/inbound-receipts/${rNc}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator, captures: { errNc: $.data.error_id } }
            - { call: "GET /api/customers/${cNc}", as: BillingAdmin, captures: { cNc_v2: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cNc}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cNc_v2}" }, as: BillingAdmin }
            - { call: "POST /api/inbound-receipts/${rNc}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator, captures: { rNc_st: $.data.status } }
          assert:
            - "Without card: error_id == ERR_NO_ACTIVE_RATE_CARD; receipt stays ARRIVED"
            - "After card creation: complete succeeds (COMPLETED)"

      - name: window_end_before_start_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Schema-level temporal sanity: window_end <= window_start on receipt creation is a 400 ERR_VALIDATION, evaluated before any business rule."
        test_recipe:
          setup: ["Customer and zone exist"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Winv Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cWv: $.data.id } }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-WV", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { zWv: $.data.id } }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cWv}", zone_id: "${zWv}", product_code: "PEAS", lot_code: "WV", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T08:00:00Z" }, as: CustomerAdmin, as_user_id: "${cWv}", captures: { errWv: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400)"

      - name: priority_conflicts_covered_by_difficulty_design
        claim_type: priority_ordering
        grounds:
          - "validations[priority=7]"
          - "validations[priority=11]"
          - "validations[priority=6]"
          - "validations[priority=9]"
        excluded_because:
          difficulty_instance: safety_recall_beats_fiscal_credit_on_submit
          rationale: "Dual-failure priority (safety>fiscal, state>constraint, authz>state) is exercised by the three priority_pair_validation_conflict instances in §1.8."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: customer_outstanding_balance_computed_read
        claim_type: computed_read
        grounds:
          - "entities.Customer.fields.outstanding_balance_cents"
          - "calculations.outstanding_balance"
        distinguishing_aspect: "GET /api/customers/{id} surfaces the derived outstanding_balance_cents: after a 2-pallet completion (handling_in 1000 each) it reads exactly 2000 with no FINALIZED invoices."
        test_recipe:
          setup: ["Customer with card A; 2-pallet receipt completed"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Bal Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cBa: $.data.id, cBa_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cBa}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cBa_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-BA", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zBa: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cBa}", zone_id: "${zBa}", product_code: "PEAS", lot_code: "BA", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cBa}", captures: { rBa: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rBa}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rBa}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/customers/${cBa}", as: BillingAdmin, captures: { cBa_out: $.data.outstanding_balance_cents } }
          assert:
