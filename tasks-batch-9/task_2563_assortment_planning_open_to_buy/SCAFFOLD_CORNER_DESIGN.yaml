            - "GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count 0"

      - name: size_curve_put_replaces_the_whole_set
        claim_type: bulk_action
        grounds:
          - endpoints[PUT /otb/option-plans/{id}/size-curve]
          - endpoints[GET /otb/option-plans/{id}/size-curve-cells]
          - calculations.cluster_size_allocation
        distinguishing_aspect: "The PUT is a wholesale set replacement, not a merge: submitting three cells over a stored four-cell curve leaves exactly three rows, the dropped size_label XL disappears entirely, and the two labels that survive come back with allocated_units recomputed from their NEW pct_bps (S moves 69 -> 83, L moves 69 -> 83, M 69 -> 110) rather than retaining their old numbers. Because the replacement is all-or-nothing there is no partial-success shape to report: either every submitted cell lands or none does."
        test_recipe:
          setup:
            - "an OPEN OptionPlan (depth 6, 40 stores, sales_index 11500) carrying a four-cell curve of 2500 bps each"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { first_last_label: "$.data[3].size_label", first_first_units: "$.data[0].allocated_units" }
          trigger:
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 3000 }, { size_label: "M", size_sort_order: 2, pct_bps: 4000 }, { size_label: "L", size_sort_order: 3, pct_bps: 3000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { n0_label: "$.data[0].size_label", n0_raw: "$.data[0].raw_units_x10000", n0_units: "$.data[0].allocated_units", n1_units: "$.data[1].allocated_units", n2_units: "$.data[2].allocated_units" }
            - call: "GET /otb/option-plans/${op_id}/size-curve-cells"
              payload: {}
