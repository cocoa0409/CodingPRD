    - name: provider_referral_reschedule_cycle_hits_reschedule_cap
      grounds:
        - "state_machines.ProviderReferral.OPEN_to_SCHEDULED"
        - "state_machines.ProviderReferral.SCHEDULED_to_OPEN"
        - "validations[priority=48]"
        - "entities.ProviderReferral.fields.reschedule_count"
      distinguishing_aspect: >-
        CYCLE: the referral returns to a state it already occupied. OPEN -> SCHEDULED
        -> OPEN is traversed twice through two DIFFERENT exits (a no-show and a
        cancel), each incrementing reschedule_count and clearing provider_id, and
        the third OPEN -> SCHEDULED attempt is refused with
        ERR_MAX_RESCHEDULES_EXCEEDED. A DAG model either forbids the second OPEN
        or loses the reschedule_count monotonicity across the loop.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with referral_validity_days 180, so the referral's expires_at is 2027-01-28T00:00:00Z and never expires during this scenario."
          - "One LICENSED_AUDIOLOGIST Provider licensed in CA, daily_capacity_minutes 480, buffer_minutes 10."
          - "Patient age 64 screens with symptom_codes ['VERTIGO'] -> RED_FLAG, which opens exactly one ProviderReferral in OPEN with provider_id null."
          - "No CarePlanSubscription exists, so the no-show fee is 0."
          - "Loop pass 1: book 2026-08-05T10:00:00Z-11:00:00Z, then no-show it at 2026-08-05T11:00:00Z (referral back to OPEN, reschedule_count 1)."
          - "Loop pass 2: book 2026-08-06T10:00:00Z-11:00:00Z, then cancel it while the clock is still 2026-08-05T11:00:00Z (referral back to OPEN, reschedule_count 2)."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
