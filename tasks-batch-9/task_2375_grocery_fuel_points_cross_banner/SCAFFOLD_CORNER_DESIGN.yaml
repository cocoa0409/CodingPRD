      - name: a_pump_terminal_cannot_authorize_a_redemption_for_another_site
        claim_type: Violation → Error
        grounds:
          - validations[priority=34]
          - rbac.PumpTerminal.scope
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "The entity_backed scope is checked against the BODY's site_id, not merely against the URL: a PumpTerminal whose X-User-ID is the grocery site is refused 403 ERR_NOT_RESOURCE_OWNER when it authorises at the fuel centre, while the identical body sent with X-User-ID == the fuel centre succeeds."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cg_id}"
              captures: { owner_err: $.data.error_id }
            - *cx_redeem
          assert:
            - "the mis-scoped call returned HTTP 403 with ${owner_err} == \"ERR_NOT_RESOURCE_OWNER\""
            - "Member.${cm_id}.available_points was still 300 after the refusal"
            - "the correctly scoped call returned HTTP 201 and FuelRedemption.${cr_id}.points_debited_at_auth == 300"

      - name: alt_id_at_the_pump_must_match_the_stored_string_exactly
        claim_type: Violation → Error
        grounds:
          - validations[priority=52]
          - entities.Member.fields.alt_id
          - errors[ERR_ALT_ID_MISMATCH]
        distinguishing_aspect: "Alternate-ID lookup does no normalisation: presenting \"06660000001\" for the member stored as \"6660000001\" is refused 422 ERR_ALT_ID_MISMATCH even though both are legal 10-to-12 digit strings and differ only by a leading zero, and the exact string then succeeds against the same unchanged member version."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and member CM (alt_id 6660000001) holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "06660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { alt_err: $.data.error_id }
            - *cx_redeem
          assert:
            - "the padded presentation returned HTTP 422 with ${alt_err} == \"ERR_ALT_ID_MISMATCH\""
            - "Member.${cm_id}.version did not change during the refusal, so the retry with ${cmv} was accepted"
            - "the exact presentation returned HTTP 201 and Member.${cm_id}.available_points == 0"

      - name: minimum_redemption_boundary_refuses_ninety_nine_and_accepts_one_hundred
        claim_type: Violation → Error
        grounds:
