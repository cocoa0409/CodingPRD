scaffold_corner_design:
- section: entities
  instances:
  - name: team_create_copies_plan_limits_and_zeroes_counters
    claim_type: creation_with_computed_fields
    grounds:
    - entities.Team.fields.seat_limit
    - entities.Team.fields.seats_used
    - entities.Team.fields.prorated_charges_cents
    distinguishing_aspect: Team creation copies plan limits verbatim and initializes computed counters; input cannot override them.
    test_recipe:
      setup:
      - PRO plan exists
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 2000
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      trigger:
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      assert:
      - Team.seat_limit == 10 and build_concurrency_limit == 2 and included_build_minutes == 300
      - Team.seats_used == 0 and prorated_charges_cents == 0
      - Team.version == 1
  - name: team_create_with_unknown_plan_returns_not_found
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PLAN_NOT_FOUND]
    distinguishing_aspect: plan_tier referencing no PlanCatalogEntry is a 404 on team creation.
    test_recipe:
      setup:
      - no plan catalog entries
      setup_api_calls: []
      trigger:
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: NOPE
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_PLAN_NOT_FOUND and HTTP 404
  - name: env_var_secret_value_masked_on_read
    claim_type: computed_field_masking
    grounds:
    - entities.EnvironmentVariable.fields.is_secret, entities.EnvironmentVariable.fields.value
    distinguishing_aspect: is_secret=true env vars return value=null on every read; non-secret vars return the stored value.
    test_recipe:
      setup:
      - Project with one secret env var and one plain env var
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/projects/${project_id}/env-vars
        payload:
          key: SECRET_KEY
          value: s3cr3t
          scopes:
          - PRODUCTION
          is_secret: true
        as: Developer
        captures:
          sec_id: $.data.id
      - call: POST /v1/projects/${project_id}/env-vars
        payload:
          key: PUBLIC_URL
          value: https://x
          scopes:
          - PREVIEW
        as: Developer
        captures:
          pub_id: $.data.id
      trigger:
      - call: GET /v1/env-vars/${sec_id}
        as: Viewer
        captures:
          sec_val: $.data.value
      - call: GET /v1/env-vars/${pub_id}
        as: Viewer
      assert:
      - 'GET secret: value == null and is_secret == true'
      - 'GET plain: value == ''https://x'''
  - name: deployment_preview_protection_default_from_project
    claim_type: defaults_applied
    grounds:
    - entities.Deployment.fields.access_protection, entities.Project.fields.preview_protection
    distinguishing_aspect: PREVIEW deployment with no explicit access_protection inherits project.preview_protection; explicit input overrides
      the project default.
    test_recipe:
      setup:
      - Project with preview_protection=TEAM_ONLY
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
          preview_protection: TEAM_ONLY
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      trigger:
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-a
          git_ref: refs/heads/feat-a
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          d1: $.data.id
          d1_ap: $.data.access_protection
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-b
          git_ref: refs/heads/feat-b
          commit_sha: bbb222
          region: IAD
          access_protection: NONE
        as: SystemWebhook
        captures:
          d2: $.data.id
      assert:
      - Deployment.${d1}.access_protection == TEAM_ONLY (inherited)
      - Deployment.${d2}.access_protection == NONE (explicit override)
  - name: usage_event_immutability_no_update_endpoint
    claim_type: immutability
    grounds:
    - entities.UsageEvent
    distinguishing_aspect: 'UsageEvent is append-only (common_fields: false): no PATCH/PUT endpoint exists; writes only via ingest.'
    test_recipe:
      setup:
      - PRO team, OPEN period, one ingested event
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-a
          git_ref: refs/heads/feat-a
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          dep_id: $.data.id
      trigger:
      - call: POST /v1/teams/${team_id}/usage-events
        payload:
          deployment_id: ${dep_id}
          event_type: BANDWIDTH
          bandwidth_bytes: 1000
          region: IAD
        as: SystemWebhook
        captures:
          ev_id: $.data.id
      assert:
      - 'UsageEvent response has id and created_at but no updated_at and no version field (common_fields: false)'
  - name: list_pagination_defaults_and_envelope
    claim_type: listing_pagination
    grounds:
    - response_envelope
    distinguishing_aspect: List endpoints default limit=10 offset=0 and return total_count + has_more in the data payload per the fixed envelope.
    test_recipe:
      setup:
      - PRO team with 3 projects
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: p1
          production_branch: main
        as: TeamOwner
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: p2
          production_branch: main
        as: TeamOwner
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: p3
          production_branch: main
        as: TeamOwner
      trigger:
      - call: GET /v1/teams/${team_id}/projects
        as: Viewer
      assert:
      - response envelope contains meta.api_request_id and response_type == 'array'
      - data list length == 3 and total_count == 3 and has_more == false with default limit=10, offset=0
- section: state_machines
  instances:
  - name: cancel_canceled_deployment_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Deployment.QUEUED_to_CANCELED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: CANCEL is terminal; a second cancel on a CANCELED deployment fails with ERR_INVALID_STATE and no side effects.
    test_recipe:
      setup:
      - QUEUED deployment canceled once
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-a
          git_ref: refs/heads/feat-a
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          dep_id: $.data.id
      - call: POST /v1/deployments/${dep_id}/cancel
        payload: {}
        as: Developer
      trigger:
      - call: POST /v1/deployments/${dep_id}/cancel
        payload: {}
        as: Developer
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE, HTTP 409
      - Deployment.${dep_id}.status == CANCELED still
  - name: cancel_promoted_deployment_returns_cannot_cancel_production
    claim_type: invalid_transition
    grounds:
    - state_machines.Deployment
    - errors[ERR_CANNOT_CANCEL_PRODUCTION]
    distinguishing_aspect: Cancel on a PROMOTED production deployment uses the domain-specific ERR_CANNOT_CANCEL_PRODUCTION, not the generic state
      error.
    test_recipe:
      setup:
      - Deployment built READY and promoted to production
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: main
          git_ref: refs/heads/main
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          dep_id: $.data.id
      - call: POST /v1/deployments/${dep_id}/build-start
        payload: {}
        as: SystemWebhook
      - call: POST /v1/deployments/${dep_id}/build-complete
        payload:
          outcome: SUCCESS
          build_duration_seconds: 60
        as: SystemWebhook
      - call: POST /v1/deployments/${dep_id}/promote
        payload: {}
        as: TeamOwner
      trigger:
      - call: POST /v1/deployments/${dep_id}/cancel
        payload: {}
        as: Developer
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_CANNOT_CANCEL_PRODUCTION, HTTP 409
      - Deployment.${dep_id}.status == PROMOTED still
  - name: build_start_on_building_deployment_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Deployment.QUEUED_to_BUILDING
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: build-start requires QUEUED; a deployment already BUILDING rejects a second build-start.
    test_recipe:
      setup:
      - Deployment in BUILDING
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-a
          git_ref: refs/heads/feat-a
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          dep_id: $.data.id
      - call: POST /v1/deployments/${dep_id}/build-start
        payload: {}
        as: SystemWebhook
      trigger:
      - call: POST /v1/deployments/${dep_id}/build-start
        payload: {}
        as: SystemWebhook
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE
  - name: usage_period_invoice_requires_closed_state
    claim_type: invalid_transition
    grounds:
    - state_machines.UsagePeriod.CLOSED_to_INVOICED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Invoicing an OPEN period is rejected; only CLOSED periods can be invoiced.
    test_recipe:
      setup:
      - OPEN usage period
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
        captures:
          period_id: $.data.id
      trigger:
      - call: POST /v1/usage-periods/${period_id}/invoice
        payload: {}
        as: TeamBillingManager
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE
      - UsagePeriod.${period_id}.status == OPEN still
  - name: promote_already_promoted_is_idempotent_noop
    claim_type: idempotency
    grounds:
    - state_machines.Deployment.PROMOTED_to_PROMOTED
    distinguishing_aspect: 'Re-promoting a PROMOTED deployment is a self-loop no-op: state and project pointer unchanged, HTTP 200.'
    test_recipe:
      setup:
      - Deployment PROMOTED to production
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: main
          git_ref: refs/heads/main
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          dep_id: $.data.id
      - call: POST /v1/deployments/${dep_id}/build-start
        payload: {}
        as: SystemWebhook
      - call: POST /v1/deployments/${dep_id}/build-complete
        payload:
          outcome: SUCCESS
          build_duration_seconds: 60
        as: SystemWebhook
      - call: POST /v1/deployments/${dep_id}/promote
        payload: {}
        as: TeamOwner
      trigger:
      - call: POST /v1/deployments/${dep_id}/promote
        payload: {}
        as: TeamOwner
      assert:
      - HTTP 200; Deployment.${dep_id}.status == PROMOTED; Project.production_deployment_id == ${dep_id} unchanged
  - name: certificate_terminal_revoked_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Certificate
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'REVOKED is terminal: complete on a REVOKED certificate fails; no transitions out.'
    test_recipe:
      setup:
      - Domain VERIFIED with certificate ACTIVE then revoked
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/projects/${project_id}/domains
        payload:
          name: example.com
        as: TeamOwner
        captures:
          dom_id: $.data.id
      - call: POST /v1/domains/${dom_id}/verify
        payload:
          outcome: SUCCESS
        as: Developer
      - call: GET /v1/domains/${dom_id}/certificates
        as: TeamOwner
        captures:
          cert_id: $.data.0.id
      - call: POST /v1/certificates/${cert_id}/complete
        payload: {}
        as: SystemWebhook
      - call: POST /v1/certificates/${cert_id}/revoke
        payload: {}
        as: TeamOwner
      trigger:
      - call: POST /v1/certificates/${cert_id}/complete
        payload: {}
        as: SystemWebhook
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE
      - Certificate.${cert_id}.status == REVOKED still
  - name: rollback_without_prior_deployment_returns_no_prior
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Deployment.PROMOTED_to_ROLLED_BACK
    - errors[ERR_NO_PRIOR_DEPLOYMENT]
    distinguishing_aspect: Rollback on a project whose production history has exactly one PROMOTED deployment (no prior) fails with ERR_NO_PRIOR_DEPLOYMENT.
    test_recipe:
      setup:
      - Project with exactly one PROMOTED deployment, no prior
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
