scenario: "1817. Industrial Fastener Distribution & VMI Bin Program (Fastenal VMI program): bin sizing & min/max by consumption, scan-based replenishment route & count accuracy, part cross-reference & substitution rules, lot traceability & certification for critical fasteners, kitting/bagging & assembly packaging, cost-per-bin pricing vs unit price, dock-to-stock & line-side delivery, obsolescence & bin retirement"
domain_name: industrial-fastener-vmi
api_prefix: /vmi

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: CustomerSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable site name
      - name: ship_to_code
        type: string
        source: input
        description: Unique shipping-location code for the site
        constraints: unique across all sites (any status)
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the site
        constraints: one of {ACTIVE, RETIRED}
        default: ACTIVE
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding confirmed-order value allowed for this site, in cents
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Sum of total_price_cents over ReplenishmentOrder rows for this site whose status is CONFIRMED or IN_TRANSIT; recomputed on every order transition
        default: 0
      - name: delivery_mode
        type: enum
        source: input
        description: Default fulfilment mode for replenishment at this site
        constraints: one of {DOCK_TO_STOCK, LINE_SIDE}

  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Distributor stock-keeping unit code
        constraints: unique across all parts (any status)
      - name: description
        type: string
        source: input
        description: Free-text part description
      - name: status
        type: enum
        source: system
        description: Lifecycle state; OBSOLETE parts cannot be added to new agreements or kits
        constraints: one of {ACTIVE, OBSOLETE}
        default: ACTIVE
      - name: is_critical
        type: boolean
        source: input
        description: True when the fastener requires lot traceability and certification on every delivery
        default: false
      - name: unit_price_cents
        type: integer
        source: input
        description: Catalogue unit price in cents used by UNIT_PRICE-mode agreements
        constraints: ">= 1"
      - name: total_stock_qty
        type: integer
        source: input
        description: Physical distributor stock on hand for this part
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        description: Sum of quantities reserved by KitJob rows in PICKING or ON_HOLD status; invariant reserved_qty + available_qty == total_stock_qty
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: total_stock_qty - reserved_qty; recomputed on every reservation or release
        default: 0

  - name: PartCrossReference
    parent: null
    common_fields: false
    fields:
      - name: from_part_id
        type: string
        source: input
        description: FK -> Part.id; the requested part that may be substituted
      - name: to_part_id
        type: string
        source: input
        description: FK -> Part.id; the substitute part that may ship instead
      - name: priority_rank
        type: integer
        source: input
        description: Substitution preference; lower rank is tried first. Ties broken by created_at ASC
        constraints: ">= 1"
      - name: is_active
        type: boolean
        source: input
        description: Inactive cross-references are never selected by substitution
        default: true

  - name: BinAgreement
    parent: CustomerSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CustomerSite.id; the site whose bin this agreement manages
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; the fastener stocked in this bin
      - name: bin_location
        type: string
        source: input
        description: Free-text bin label at the site (aisle/shelf)
      - name: pricing_mode
        type: enum
        source: input
        description: How replenishment orders for this bin are priced
        constraints: one of {UNIT_PRICE, COST_PER_BIN}
      - name: flat_bin_price_cents
        type: integer
        source: input
        description: Flat price charged per replenishment order when pricing_mode is COST_PER_BIN; ignored otherwise
        constraints: ">= 0; required iff pricing_mode == COST_PER_BIN"
        default: 0
      - name: min_qty
        type: integer
        source: input
        description: Reorder point; a scan count strictly below min_qty triggers replenishment
        constraints: ">= 0 and < max_qty"
      - name: max_qty
        type: integer
        source: input
        description: Bin capacity; replenishment fills up to max_qty
        constraints: ">= 1"
      - name: on_hand_qty
        type: integer
        source: computed
        description: Last scanned quantity, adjusted downward by deliveries is not allowed — set only by RouteStop submission and ReplenishmentOrder delivery
        default: 0
      - name: open_order_qty
        type: integer
        source: computed
        description: Sum of ordered_qty over ReplenishmentOrder rows for this agreement in CONFIRMED or IN_TRANSIT status
        default: 0
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle; RETIRED bins accept no new stops or orders
        constraints: one of {ACTIVE, AT_CAPACITY, RETIRED}
        default: ACTIVE
      - name: compliance_flag
        type: enum
        source: system
        description: Certification posture for critical parts; BLOCKED freezes new confirmations
        constraints: one of {CLEAR, BLOCKED}
        default: CLEAR

  - name: ReplenishmentRoute
    parent: CustomerSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CustomerSite.id; the site this route visits
      - name: route_date
        type: datetime
        source: input
        description: Calendar date (ISO 8601, time midnight UTC) on which the route runs
      - name: window_start
        type: datetime
        source: input
        description: Start of the dock-receiving window for this route
      - name: window_end
        type: datetime
        source: input
        description: End of the dock-receiving window; intervals are half-open [window_start, window_end) so a route ending at T does not overlap one starting at T
      - name: status
        type: enum
        source: system
        description: Route lifecycle
        constraints: one of {SCHEDULED, IN_PROGRESS, CLOSED, CANCELLED}
        default: SCHEDULED

  - name: RouteStop
    parent: ReplenishmentRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: FK -> ReplenishmentRoute.id; the route this scan belongs to
      - name: bin_agreement_id
        type: string
        source: input
        description: FK -> BinAgreement.id; the bin scanned at this stop
      - name: counted_qty
        type: integer
        source: input
        description: Physical count recorded by the route driver
        constraints: ">= 0 and <= the agreement's max_qty"
      - name: status
        type: enum
        source: system
        description: Stop lifecycle; SUBMITTED stops may have generated an order
        constraints: one of {PENDING, SUBMITTED}
        default: PENDING
      - name: generated_order_id
        type: string
        source: system
        description: FK -> ReplenishmentOrder.id; set when this stop's count triggered an order, null otherwise
        constraints: nullable

  - name: ReplenishmentOrder
    parent: BinAgreement
    common_fields: true
    fields:
      - name: bin_agreement_id
        type: string
        source: input
        description: FK -> BinAgreement.id; the bin being replenished
      - name: site_id
        type: string
        source: computed
        description: FK -> CustomerSite.id; denormalized from the agreement for balance rollups
      - name: part_id
        type: string
        source: computed
        description: FK -> Part.id; the part actually ordered (post-substitution)
      - name: ordered_qty
        type: integer
        source: computed
        description: max_qty - counted_qty at trigger time (fill-to-max policy)
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: Price per piece applied to this order after pricing-mode resolution
      - name: total_price_cents
        type: integer
        source: computed
        description: Order total per the agreement's pricing_mode (see calculation order_pricing)
      - name: delivery_mode
        type: enum
        source: computed
        description: Copied from CustomerSite.delivery_mode at confirmation
        constraints: one of {DOCK_TO_STOCK, LINE_SIDE}
      - name: status
        type: enum
        source: system
        description: Order lifecycle with a dispute loop after delivery
        constraints: one of {DRAFT, CONFIRMED, ON_HOLD, IN_TRANSIT, DELIVERED, DISPUTED, CANCELLED}
        default: DRAFT

  - name: LotCertificate
    parent: Part
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; the critical part this lot certifies
      - name: lot_number
        type: string
        source: input
        description: Manufacturer lot code
        constraints: unique per part (part_id, lot_number)
      - name: cert_expires_at
        type: datetime
        source: input
        description: Certification expiry instant; expiry is evaluated against the logical clock
      - name: status
        type: enum
        source: system
        description: VALID until the logical clock reaches cert_expires_at, then EXPIRED via the sweep endpoint
        constraints: one of {VALID, EXPIRED}
        default: VALID

  - name: KitJob
    parent: CustomerSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CustomerSite.id; the site ordering the kit
      - name: kit_name
        type: string
        source: input
        description: Human-readable kit/bag label
      - name: component_part_ids
        type: array
        source: input
        description: Ordered list of part ids to bag; every element must reference an ACTIVE Part
        constraints: 1..20 elements; no duplicates
      - name: qty_per_part
        type: integer
        source: input
        description: Units of each component placed in one kit
        constraints: ">= 1"
      - name: kit_count
        type: integer
        source: input
        description: Number of identical kits to produce
        constraints: ">= 1"
      - name: station_window_start
        type: datetime
        source: input
        description: Reserved packaging-station window start
      - name: station_window_end
        type: datetime
        source: input
        description: Reserved packaging-station window end; a new reservation must leave a buffer of at least 15 minutes (STATION_BUFFER_MINUTES) after any existing non-terminal job's station_window_end (closed-interval-with-buffer semantics, unlike the half-open route windows)
      - name: packaging_cost_cents
        type: integer
        source: computed
        description: Total packaging charge per calculation kit_packaging_cost (per-line rounding, then summed)
      - name: status
        type: enum
        source: system
        description: Kit job lifecycle with a hold branch
        constraints: one of {DRAFT, PICKING, ON_HOLD, PACKED, COMPLETED, SCRAPPED}
        default: DRAFT

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: CustomerSite
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vmi/sites/{id}/retire"
        actor: DistributorAdmin
        preconditions:
          - "No BinAgreement for this site in status ACTIVE or AT_CAPACITY"
          - "No ReplenishmentRoute for this site in status SCHEDULED or IN_PROGRESS"
        side_effects:
          - "site.status := RETIRED"
          - "increments CustomerSite.version by 1"

  - entity: Part
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /vmi/parts/{id}/obsolete"
        actor: DistributorAdmin
        preconditions:
          - "No ReplenishmentOrder for this part in status CONFIRMED or IN_TRANSIT"
          - "No KitJob listing this part in status PICKING or ON_HOLD"
        side_effects:
          - "part.status := OBSOLETE"
          - "Every BinAgreement with part_id == this part and status in {ACTIVE, AT_CAPACITY} transitions to RETIRED **unless** at least one PartCrossReference with from_part_id == this part, is_active == true, and a to_part whose status == ACTIVE exists (such agreements stay live so the operator can repoint them via the substitute endpoint)"
          - "Every PartCrossReference with to_part_id == this part has is_active := false (an obsolete part can no longer serve as anyone's substitute); references FROM this part remain active to drive substitution"
          - "increments Part.version by 1"

  - entity: BinAgreement
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: AT_CAPACITY
        trigger: "system auto-transition after a RouteStop submission or ReplenishmentOrder confirmation leaves on_hand_qty + open_order_qty >= max_qty"
        actor: system
        preconditions:
          - "on_hand_qty + open_order_qty >= max_qty"
        side_effects:
          - "agreement.status := AT_CAPACITY"
          - "increments BinAgreement.version by 1"
      - from: AT_CAPACITY
        to: ACTIVE
        trigger: "system auto-transition after a delivery, cancellation, or new scan leaves on_hand_qty + open_order_qty < max_qty"
        actor: system
        preconditions:
          - "on_hand_qty + open_order_qty < max_qty"
        side_effects:
          - "agreement.status := ACTIVE"
          - "increments BinAgreement.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vmi/bin-agreements/{id}/retire OR Part obsolescence cascade"
        actor: DistributorAdmin
        preconditions:
          - "No ReplenishmentOrder for this agreement in status DRAFT, CONFIRMED, ON_HOLD, or IN_TRANSIT"
        side_effects:
          - "agreement.status := RETIRED"
          - "increments BinAgreement.version by 1"
      - from: AT_CAPACITY
        to: RETIRED
        trigger: "POST /vmi/bin-agreements/{id}/retire OR Part obsolescence cascade"
        actor: DistributorAdmin
        preconditions:
          - "No ReplenishmentOrder for this agreement in status DRAFT, CONFIRMED, ON_HOLD, or IN_TRANSIT"
        side_effects:
          - "agreement.status := RETIRED"
          - "increments BinAgreement.version by 1"

  - entity: ReplenishmentRoute
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /vmi/routes/{id}/start"
        actor: RouteDriver
        preconditions:
          - "logical clock current time >= route.window_start"
          - "route.site.status == ACTIVE"
        side_effects:
          - "route.status := IN_PROGRESS"
          - "increments ReplenishmentRoute.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vmi/routes/{id}/cancel"
        actor: RouteDriver
        preconditions: []
        side_effects:
          - "route.status := CANCELLED"
          - "every RouteStop with route_id == this route and status PENDING is deleted (PENDING stops carry no side effects)"
          - "increments ReplenishmentRoute.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /vmi/routes/{id}/close"
        actor: RouteDriver
        preconditions:
          - "At least one RouteStop with route_id == this route has status SUBMITTED (empty routes cannot be closed — violation yields ERR_ROUTE_EMPTY, 422)"
          - "No RouteStop with route_id == this route remains in status PENDING (violation yields ERR_ROUTE_EMPTY, 422)"
        side_effects:
          - "route.status := CLOSED"
          - "increments ReplenishmentRoute.version by 1"

  - entity: RouteStop
    initial_state: PENDING
    terminal_states: [SUBMITTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /vmi/route-stops/{id}/submit"
        actor: RouteDriver
        preconditions:
          - "stop.route.status == IN_PROGRESS"
          - "stop.bin_agreement.status in {ACTIVE, AT_CAPACITY}"
          - "counted_qty <= stop.bin_agreement.max_qty"
        side_effects:
          - "stop.status := SUBMITTED"
          - "stop.bin_agreement.on_hand_qty := counted_qty"
          - "IF counted_qty < bin_agreement.min_qty THEN create ReplenishmentOrder(bin_agreement_id, ordered_qty = max_qty - counted_qty, status DRAFT) and set stop.generated_order_id to its id"
          - "Recompute bin_agreement posture (ACTIVE <-> AT_CAPACITY auto-transitions) using on_hand_qty + open_order_qty vs max_qty"
          - "increments RouteStop.version by 1 and increments BinAgreement.version by 1"

  - entity: ReplenishmentOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /vmi/replenishment-orders/{id}/confirm"
        actor: DistributorAdmin
        preconditions:
          - "order.bin_agreement.status in {ACTIVE, AT_CAPACITY}"
          - "order.bin_agreement.compliance_flag == CLEAR"
          - "site.outstanding_balance_cents + order.total_price_cents <= site.credit_limit_cents"
          - "IF part.is_critical THEN at least one LotCertificate for order.part_id has status VALID"
        side_effects:
          - "order.status := CONFIRMED"
          - "order.delivery_mode := site.delivery_mode (version-pinned at confirmation)"
          - "bin_agreement.open_order_qty += order.ordered_qty"
          - "site.outstanding_balance_cents += order.total_price_cents"
          - "Recompute bin_agreement posture (may auto-transition ACTIVE -> AT_CAPACITY)"
          - "increments ReplenishmentOrder.version by 1, BinAgreement.version by 1, CustomerSite.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vmi/replenishment-orders/{id}/cancel"
        actor: DistributorAdmin
        preconditions: []
        side_effects:
          - "order.status := CANCELLED"
          - "increments ReplenishmentOrder.version by 1"
      - from: CONFIRMED
        to: IN_TRANSIT
        trigger: "POST /vmi/replenishment-orders/{id}/ship"
        actor: DistributorAdmin
        preconditions: []
        side_effects:
          - "order.status := IN_TRANSIT"
          - "increments ReplenishmentOrder.version by 1"
      - from: CONFIRMED
        to: ON_HOLD
        trigger: "system cascade when a LotCertificate for order.part_id transitions VALID -> EXPIRED and part.is_critical"
        actor: system
        preconditions:
          - "order.part.is_critical == true"
        side_effects:
          - "order.status := ON_HOLD"
          - "increments ReplenishmentOrder.version by 1"
      - from: ON_HOLD
        to: CONFIRMED
        trigger: "POST /vmi/replenishment-orders/{id}/release-hold"
        actor: DistributorAdmin
        preconditions:
          - "At least one LotCertificate for order.part_id has status VALID"
        side_effects:
          - "order.status := CONFIRMED"
          - "increments ReplenishmentOrder.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /vmi/replenishment-orders/{id}/cancel"
        actor: DistributorAdmin
        preconditions: []
        side_effects:
          - "order.status := CANCELLED"
          - "bin_agreement.open_order_qty -= order.ordered_qty"
          - "site.outstanding_balance_cents -= order.total_price_cents"
          - "Recompute bin_agreement posture (may auto-transition AT_CAPACITY -> ACTIVE)"
          - "increments ReplenishmentOrder.version by 1, BinAgreement.version by 1, CustomerSite.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /vmi/replenishment-orders/{id}/deliver"
        actor: RouteDriver
        preconditions: []
        side_effects:
          - "order.status := DELIVERED"
          - "bin_agreement.on_hand_qty := bin_agreement.on_hand_qty + order.ordered_qty"
          - "bin_agreement.open_order_qty -= order.ordered_qty"
          - "site.outstanding_balance_cents -= order.total_price_cents (delivery settles the outstanding balance; invoicing is out of scope)"
          - "Recompute bin_agreement posture (may auto-transition AT_CAPACITY -> ACTIVE, or stay AT_CAPACITY if on_hand alone >= max_qty)"
          - "increments ReplenishmentOrder.version by 1, BinAgreement.version by 1, CustomerSite.version by 1"
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /vmi/replenishment-orders/{id}/dispute"
        actor: RouteDriver
        preconditions:
          - "Dispute must be raised while the order is the most recent DELIVERED order for its bin_agreement (created_at DESC, first row)"
        side_effects:
          - "order.status := DISPUTED"
          - "bin_agreement.on_hand_qty := bin_agreement.on_hand_qty - order.ordered_qty (count disputed; stock backing the bin is pulled back pending resolution)"
          - "Recompute bin_agreement posture"
          - "increments ReplenishmentOrder.version by 1, BinAgreement.version by 1"
      - from: DISPUTED
        to: DELIVERED
        trigger: "POST /vmi/replenishment-orders/{id}/resolve-dispute"
        actor: DistributorAdmin
        preconditions: []
        side_effects:
          - "order.status := DELIVERED"
          - "bin_agreement.on_hand_qty := bin_agreement.on_hand_qty + order.ordered_qty (dispute resolved in the distributor's favour; stock restored)"
          - "Recompute bin_agreement posture"
          - "increments ReplenishmentOrder.version by 1, BinAgreement.version by 1"
      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /vmi/replenishment-orders/{id}/cancel"
        actor: DistributorAdmin
        preconditions: []
        side_effects:
          - "order.status := CANCELLED"
          - "No further bin or balance adjustment (stock was already pulled back at DISPUTED; balance was already settled at DELIVERED)"
          - "increments ReplenishmentOrder.version by 1"

  - entity: LotCertificate
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "POST /vmi/_sweep/cert-expiry (system sweep evaluated against the logical clock)"
        actor: system
        preconditions:
          - "logical clock current time >= cert.cert_expires_at"
        side_effects:
          - "cert.status := EXPIRED"
          - "IF part.is_critical THEN every BinAgreement with part_id == cert.part_id and status in {ACTIVE, AT_CAPACITY} has compliance_flag := BLOCKED"
          - "Every ReplenishmentOrder with part_id == cert.part_id and status == CONFIRMED transitions to ON_HOLD (depth-2 cascade: cert expiry -> compliance block -> order hold)"
          - "increments LotCertificate.version by 1 and each affected BinAgreement.version by 1"

  - entity: KitJob
    initial_state: DRAFT
    terminal_states: [COMPLETED, SCRAPPED]
    transitions:
      - from: DRAFT
        to: PICKING
        trigger: "POST /vmi/kit-jobs/{id}/start-picking"
        actor: WarehouseOperator
        preconditions:
          - "Every part in component_part_ids has status ACTIVE"
          - "For every component part, part.available_qty >= qty_per_part * kit_count"
        side_effects:
          - "job.status := PICKING"
          - "For every component part: part.reserved_qty += qty_per_part * kit_count; part.available_qty -= qty_per_part * kit_count"
          - "increments KitJob.version by 1 and each component Part.version by 1"
      - from: DRAFT
        to: SCRAPPED
        trigger: "POST /vmi/kit-jobs/{id}/scrap"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := SCRAPPED"
          - "increments KitJob.version by 1"
      - from: PICKING
        to: ON_HOLD
        trigger: "POST /vmi/kit-jobs/{id}/hold"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := ON_HOLD"
          - "Reservations are retained while ON_HOLD"
          - "increments KitJob.version by 1"
      - from: ON_HOLD
        to: PICKING
        trigger: "POST /vmi/kit-jobs/{id}/resume"
        actor: WarehouseOperator
        preconditions:
          - "Every part in component_part_ids still has status ACTIVE"
        side_effects:
          - "job.status := PICKING"
          - "increments KitJob.version by 1"
      - from: PICKING
        to: PACKED
        trigger: "POST /vmi/kit-jobs/{id}/pack"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := PACKED"
          - "job.packaging_cost_cents := result of calculation kit_packaging_cost"
          - "increments KitJob.version by 1"
      - from: PACKED
        to: COMPLETED
        trigger: "POST /vmi/kit-jobs/{id}/complete"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := COMPLETED"
          - "For every component part: part.reserved_qty -= qty_per_part * kit_count; part.total_stock_qty -= qty_per_part * kit_count (stock leaves the building; available_qty unchanged because reservation and stock drop together)"
          - "increments KitJob.version by 1 and each component Part.version by 1"
      - from: PICKING
        to: SCRAPPED
        trigger: "POST /vmi/kit-jobs/{id}/scrap"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := SCRAPPED"
          - "For every component part: part.reserved_qty -= qty_per_part * kit_count; part.available_qty += qty_per_part * kit_count (compensating release — invariant reserved_qty + available_qty == total_stock_qty restored)"
          - "increments KitJob.version by 1 and each component Part.version by 1"
      - from: ON_HOLD
        to: SCRAPPED
        trigger: "POST /vmi/kit-jobs/{id}/scrap"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "job.status := SCRAPPED"
          - "For every component part: part.reserved_qty -= qty_per_part * kit_count; part.available_qty += qty_per_part * kit_count (same compensating release as PICKING -> SCRAPPED)"
          - "increments KitJob.version by 1 and each component Part.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bin-agreement-update-stale-version
    parent_entity: BinAgreement
    write_endpoint: "PUT /vmi/bin-agreements/{id}"
    occ_field: "expected_bin_agreement_version"
    description: |
      Updating a BinAgreement's min_qty/max_qty/pricing fields against an
      agreement whose version has advanced since the client last observed it
      is rejected. This captures the case where a scan submission, order
      confirmation, or posture auto-transition has legitimately advanced the
      agreement and the writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: route-create-stale-site
    parent_entity: CustomerSite
    write_endpoint: "POST /vmi/routes"
    occ_field: "expected_site_version"
    description: |
      Creating a ReplenishmentRoute against a CustomerSite whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just changed the site's credit or
      delivery configuration and the route would otherwise be scheduled
      against a stale site snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: order_pricing
    trigger: "ReplenishmentOrder creation (from RouteStop submit) — total_price_cents and unit_price_cents are fixed at creation and never recomputed"
    algorithm: tiered_pricing
    formula: |
      IF agreement.pricing_mode == 'UNIT_PRICE':
        # volume discount on the part's catalogue unit price
        base = part.unit_price_cents
        IF ordered_qty >= QTY_TIER2_MIN:        unit = base * (100 - TIER2_DISCOUNT_PCT) / 100   # 5% off
        ELIF ordered_qty >= QTY_TIER1_MIN:      unit = base * (100 - TIER1_DISCOUNT_PCT) / 100   # 2% off
        ELSE:                                   unit = base
        # integer division truncates toward zero; no rounding step here
        total_price_cents = unit * ordered_qty
        IF part.is_critical:  total_price_cents += CERT_FEE_CENTS
        unit_price_cents = unit
      ELSE:  # COST_PER_BIN — flat per-trip fee regardless of quantity
        unit_price_cents = 0
        total_price_cents = agreement.flat_bin_price_cents
        IF part.is_critical:  total_price_cents += CERT_FEE_CENTS
      # evaluation order pinned: tier selection -> qty multiplication -> cert fee add
    input_set: "The triggering BinAgreement, its Part, and ordered_qty = max_qty - counted_qty"
    constants:
      QTY_TIER1_MIN: 100
      QTY_TIER2_MIN: 500
      TIER1_DISCOUNT_PCT: 2
      TIER2_DISCOUNT_PCT: 5
      CERT_FEE_CENTS: 1500
    precision: "integer cents; tier discount uses truncating integer division (unit = base * (100 - pct) / 100)"
    variants:
      - name: unit_price_variant
        when: "agreement.pricing_mode == UNIT_PRICE"
        difference: "Total scales with ordered_qty and tier discounts apply"
      - name: cost_per_bin_variant
        when: "agreement.pricing_mode == COST_PER_BIN"
        difference: "Total is the flat per-trip fee; identical inputs (same counted_qty, same part) yield a different total_price_cents than UNIT_PRICE whenever flat_bin_price_cents != unit * ordered_qty"

  - name: bin_sizing_recommendation
    trigger: "GET /vmi/bin-agreements/{id}/sizing-recommendation — advisory min/max proposal"
    algorithm: forward_looking
    formula: |
      # Chronological variant (trailing consumption):
      #   weekly_usage = sum of (previous on_hand - counted_qty) over the last
      #   LOOKBACK_WEEKS submitted RouteStops for this agreement, processed in
      #   RouteStop.created_at ASC order, negatives clamped to 0 (delivery gaps)
      #   recommended_min = ceil(weekly_usage / LOOKBACK_WEEKS * SAFETY_FACTOR)
      #   recommended_max = recommended_min * MAX_MULTIPLE
      # Forward-looking variant (projected consumption):
      #   same weekly series, but weeks whose stop generated an order are
      #   weighted DOUBLE (consumption during a stockout-risk week is a
      #   stronger signal); the projected average is
      #     sum(weight_i * usage_i) / sum(weight_i)
      #   recommended_min = ceil(projected_avg * SAFETY_FACTOR)
      #   recommended_max = recommended_min * MAX_MULTIPLE
      # Variants differ whenever any stop in the window generated an order
      # and usages are not all equal.
    input_set: "RouteStops for this agreement with status SUBMITTED, window = last LOOKBACK_WEEKS by created_at DESC, order-sensitive so ties broken by created_at ASC"
    constants:
      LOOKBACK_WEEKS: 4
      SAFETY_FACTOR: 1.5
      MAX_MULTIPLE: 3
    precision: "ceil to integer pieces; SAFETY_FACTOR applied before ceil"
    variants:
      - name: chronological_trailing
        when: "query param method=TRAILING (default)"
        difference: "Plain average over the trailing window"
      - name: forward_looking_projected
        when: "query param method=PROJECTED"
        difference: "Order-generating weeks weighted 2x; produces a different (higher-or-equal) recommended_min than TRAILING whenever the window contains an order-generating stop and usages are not all equal"

  - name: kit_packaging_cost
    trigger: "KitJob transition PICKING -> PACKED"
    algorithm: aggregation
    formula: |
      # Nested rounding — ORDER PINNED: round per component line first, then sum.
      # (Summing raw costs then rounding once is a valid alternative reading
      # that yields different cents; the per-line-then-sum order is canonical.)
      For each component part i (in the order given by component_part_ids):
        line_i = ceil(PER_BAG_CENTS + qty_per_part * PER_UNIT_CENTS + part_i.unit_price_cents * PART_SURCHARGE_PCT / 100)
      packaging_cost_cents = kit_count * sum(line_i)
    input_set: "The KitJob's component_part_ids, qty_per_part, kit_count, and each component Part's current unit_price_cents"
    constants:
      PER_BAG_CENTS: 250
      PER_UNIT_CENTS: 3
      PART_SURCHARGE_PCT: 4
    precision: "ceil to integer cents per line; sum of rounded lines multiplied by kit_count"

  - name: site_balance_rollup
    trigger: "ReplenishmentOrder transitions CONFIRMED (debit), ON_HOLD->CANCELLED (credit), IN_TRANSIT->DELIVERED (settle)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum of total_price_cents over every
      ReplenishmentOrder with site_id == site.id and status in {CONFIRMED, IN_TRANSIT}
      # Recomputed from source rows on every contributing transition — never
      # adjusted incrementally without a full recompute check.
    input_set: "All ReplenishmentOrder rows for the site with status in {CONFIRMED, IN_TRANSIT}; DRAFT, ON_HOLD, DISPUTED, DELIVERED, CANCELLED are excluded"
    constants: {}
    precision: "integer cents, exact sum"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role must be one of the declared RBAC roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 1.5
    category: existence
    check: "Request body is well-formed: every required input field present, types match the entity schema, enum values within their declared sets, and flat_bin_price_cents present iff pricing_mode == COST_PER_BIN (shape check runs after auth, before any state or business rule)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted on the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path id and every FK in the request body references an existing entity, validated left-to-right (site before route, route before stop, part before cross-reference)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists per its state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (retire, obsolete, start, close, cancel, submit, confirm, ship, deliver, dispute, resolve-dispute, release-hold, start-picking, hold, resume, pack, complete, scrap)"
  - priority: 5
    category: state
    check: "Referenced parent/site/agreement is not terminal where required: site RETIRED blocks route creation and stop submission; agreement RETIRED blocks stops and order confirmation"
    error_id: ERR_AGREEMENT_OR_SITE_RETIRED
    http_status: 409
    applies_to: "POST /vmi/routes, POST /vmi/route-stops/{id}/submit, POST /vmi/replenishment-orders/{id}/confirm, POST /vmi/bin-agreements"
  - priority: 6
    category: business_referential
    check: "BinAgreement (site_id, part_id, bin_location) triple is unique among agreements with status != RETIRED; Part.sku unique; CustomerSite.ship_to_code unique; PartCrossReference (from_part_id, to_part_id) unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /vmi/sites, POST /vmi/parts, POST /vmi/bin-agreements, POST /vmi/part-cross-references"
  - priority: 7
    category: business_referential
    check: "PartCrossReference.to_part must differ from from_part; substitution candidates (POST /vmi/bin-agreements/{id}/substitute) resolve only through PartCrossReference rows with is_active == true, ordered by priority_rank ASC then created_at ASC"
    error_id: ERR_NO_SUBSTITUTE
    http_status: 422
    applies_to: "POST /vmi/part-cross-references, POST /vmi/bin-agreements/{id}/substitute"
  - priority: 8
    category: business_temporal
    check: "ReplenishmentRoute windows on the same site do not overlap under half-open [window_start, window_end) semantics — back-to-back routes (end == start) are allowed; window_start < window_end required"
    error_id: ERR_ROUTE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /vmi/routes"
  - priority: 9
    category: business_temporal
    check: "KitJob station reservations do not collide: a new job's station_window_start must be >= every existing non-terminal (status in {DRAFT, PICKING, ON_HOLD, PACKED}) job's station_window_end + STATION_BUFFER_MINUTES when windows would otherwise abut (closed-interval-with-buffer semantics); station_window_start < station_window_end required. STATION_BUFFER_MINUTES is the fixed constant 15"
    error_id: ERR_STATION_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /vmi/kit-jobs"
  - priority: 10
    category: business_safety
    check: "Critical-part certification gate: confirming an order for a part with is_critical == true requires at least one LotCertificate with status VALID for that part; agreement.compliance_flag must be CLEAR"
    error_id: ERR_CERTIFICATION_BLOCKED
    http_status: 422
    applies_to: "POST /vmi/replenishment-orders/{id}/confirm, POST /vmi/replenishment-orders/{id}/release-hold"
  - priority: 11
    category: business_constraint
    check: "Count and quantity bounds: counted_qty <= agreement.max_qty; min_qty < max_qty; kit component list has 1..20 unique elements; every kit component part is ACTIVE"
    error_id: ERR_QUANTITY_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /vmi/route-stops/{id}/submit, POST /vmi/bin-agreements, PUT /vmi/bin-agreements/{id}, POST /vmi/kit-jobs, POST /vmi/kit-jobs/{id}/start-picking, POST /vmi/kit-jobs/{id}/resume"
  - priority: 12
    category: business_constraint
    check: "Stock sufficiency for kit picking: every component part.available_qty >= qty_per_part * kit_count"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /vmi/kit-jobs/{id}/start-picking"
  - priority: 13
    category: business_fiscal
    check: "Credit gate: site.outstanding_balance_cents + order.total_price_cents <= site.credit_limit_cents at order confirmation"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /vmi/replenishment-orders/{id}/confirm"
  - priority: 14
    category: business_constraint
    check: "OCC precondition: expected_<parent>_version matches the parent's current version on guarded write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /vmi/bin-agreements/{id}, POST /vmi/routes"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- clock / system ---
  - method: POST
    path: /vmi/_clock/set_current_utc
    description: "Test-driving endpoint: sets the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [DistributorAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; no entity mutation"]
  - method: POST
    path: /vmi/_sweep/cert-expiry
    description: "System sweep: transitions every LotCertificate with status VALID and cert_expires_at <= logical clock to EXPIRED, firing the compliance cascade"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: "{ expired_cert_ids: string[] }"
    side_effects: ["LotCertificate VALID -> EXPIRED cascade per state machine"]

  # --- CustomerSite ---
  - method: POST
    path: /vmi/sites
    description: Create a customer site
    roles: [DistributorAdmin]
    code: 201
    input: [name, ship_to_code, credit_limit_cents, delivery_mode]
    output: CustomerSite
    side_effects: []
  - method: GET
    path: /vmi/sites/{id}
    description: Fetch one site
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: []
    output: CustomerSite
    side_effects: []
  - method: GET
    path: /vmi/sites
    description: List sites with pagination and optional status filter
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustomerSite[]
    side_effects: []
  - method: POST
    path: /vmi/sites/{id}/retire
    description: Retire a site once it has no live agreements or routes
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: CustomerSite
    side_effects: ["CustomerSite ACTIVE -> RETIRED"]

  # --- Part ---
  - method: POST
    path: /vmi/parts
    description: Create a part
    roles: [DistributorAdmin]
    code: 201
    input: [sku, description, is_critical, unit_price_cents, total_stock_qty]
    output: Part
    side_effects: ["available_qty := total_stock_qty"]
  - method: GET
    path: /vmi/parts/{id}
    description: Fetch one part
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: GET
    path: /vmi/parts
    description: List parts with pagination and optional status filter
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Part[]
    side_effects: []
  - method: POST
    path: /vmi/parts/{id}/obsolete
    description: Mark a part obsolete; cascades bin retirement and cross-reference deactivation
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: Part
    side_effects: ["Part ACTIVE -> OBSOLETE with cascade per state machine"]

  # --- PartCrossReference ---
  - method: POST
    path: /vmi/part-cross-references
    description: Declare that one part may substitute for another
    roles: [DistributorAdmin]
    code: 201
    input: [from_part_id, to_part_id, priority_rank, "is_active?"]
    output: PartCrossReference
    side_effects: []
  - method: GET
    path: /vmi/part-cross-references/{id}
    description: Fetch one cross-reference
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: []
    output: PartCrossReference
    side_effects: []
  - method: GET
    path: /vmi/part-cross-references
    description: List cross-references; filterable by either endpoint part
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: ["from_part_id?", "to_part_id?", "limit?", "offset?"]
    output: PartCrossReference[]
    side_effects: []

  # --- BinAgreement ---
  - method: POST
    path: /vmi/bin-agreements
    description: Create a VMI bin agreement for a (site, part, location) triple
    roles: [DistributorAdmin]
    code: 201
    input: [site_id, part_id, bin_location, pricing_mode, "flat_bin_price_cents?", min_qty, max_qty]
    output: BinAgreement
    side_effects: []
  - method: GET
    path: /vmi/bin-agreements/{id}
    description: Fetch one bin agreement
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: []
    output: BinAgreement
    side_effects: []
  - method: GET
    path: /vmi/bin-agreements
    description: List bin agreements with filters
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: ["site_id?", "part_id?", "status?", "limit?", "offset?"]
    output: BinAgreement[]
    side_effects: []
  - method: PUT
    path: /vmi/bin-agreements/{id}
    description: "Update sizing/pricing fields (min_qty, max_qty, pricing_mode, flat_bin_price_cents, bin_location); OCC-guarded on the agreement version"
    roles: [DistributorAdmin]
    code: 200
    input: [expected_bin_agreement_version, "min_qty?", "max_qty?", "pricing_mode?", "flat_bin_price_cents?", "bin_location?"]
    output: BinAgreement
    side_effects: ["increments BinAgreement.version by 1", "Recompute posture against new max_qty"]
  - method: POST
    path: /vmi/bin-agreements/{id}/retire
    description: Retire a bin agreement with no open orders
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: BinAgreement
    side_effects: ["BinAgreement -> RETIRED"]
  - method: POST
    path: /vmi/bin-agreements/{id}/substitute
    description: "Repoint the agreement's part to the best eligible substitute per PartCrossReference ordering (priority_rank ASC, created_at ASC); used when the original part is OBSOLETE"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: BinAgreement
    side_effects: ["agreement.part_id := selected substitute part id", "increments BinAgreement.version by 1"]
  - method: GET
    path: /vmi/bin-agreements/{id}/sizing-recommendation
    description: "Advisory min/max proposal from consumption history; method=TRAILING (default) or PROJECTED"
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: ["method?"]
    output: "{ recommended_min: integer, recommended_max: integer, method: string }"
    side_effects: []

  # --- ReplenishmentRoute ---
  - method: POST
    path: /vmi/routes
    description: "Schedule a scan route for a site; OCC-guarded on the site version; half-open window overlap enforced"
    roles: [DistributorAdmin]
    code: 201
    input: [site_id, route_date, window_start, window_end, expected_site_version]
    output: ReplenishmentRoute
    side_effects: ["increments CustomerSite.version by 1"]
  - method: GET
    path: /vmi/routes/{id}
    description: Fetch one route
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: []
  - method: GET
    path: /vmi/routes
    description: List routes with filters
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: ReplenishmentRoute[]
    side_effects: []
  - method: POST
    path: /vmi/routes/{id}/start
    description: Start a scheduled route once its window opens
    roles: [RouteDriver]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: ["ReplenishmentRoute SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: /vmi/routes/{id}/cancel
    description: Cancel a scheduled route; pending stops are deleted
    roles: [RouteDriver]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: ["ReplenishmentRoute SCHEDULED -> CANCELLED; PENDING stops deleted"]
  - method: POST
    path: /vmi/routes/{id}/close
    description: Close an in-progress route; requires at least one submitted stop and no pending stops
    roles: [RouteDriver]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: ["ReplenishmentRoute IN_PROGRESS -> CLOSED"]
  - method: GET
    path: /vmi/routes/{id}/stops
    description: List stops for a route
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # --- RouteStop ---
  - method: POST
    path: /vmi/routes/{id}/stops
    description: Register a scan stop for a bin on a route (count recorded at submit time)
    roles: [RouteDriver]
    code: 201
    input: [bin_agreement_id]
    output: RouteStop
    side_effects: []
  - method: GET
    path: /vmi/route-stops/{id}
    description: Fetch one route stop
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: /vmi/route-stops
    description: List route stops with filters (supports FK reverse-reachability by bin agreement and by generated order)
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: ["route_id?", "bin_agreement_id?", "generated_order_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: /vmi/route-stops/{id}/submit
    description: Submit the physical count; triggers replenishment-order creation when counted_qty < min_qty
    roles: [RouteDriver]
    code: 200
    input: [counted_qty]
    output: RouteStop
    side_effects: ["RouteStop PENDING -> SUBMITTED with cascade per state machine"]

  # --- ReplenishmentOrder ---
  - method: GET
    path: /vmi/replenishment-orders/{id}
    description: Fetch one replenishment order
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []
  - method: GET
    path: /vmi/replenishment-orders
    description: List replenishment orders with filters
    roles: [DistributorAdmin, RouteDriver]
    code: 200
    input: ["bin_agreement_id?", "site_id?", "part_id?", "status?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []
  - method: POST
    path: /vmi/replenishment-orders/{id}/confirm
    description: Confirm a draft order; applies certification and credit gates
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder DRAFT -> CONFIRMED with cascade per state machine"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/ship
    description: Ship a confirmed order
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder CONFIRMED -> IN_TRANSIT"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/deliver
    description: Deliver an in-transit order; stock lands in the bin and balance settles
    roles: [RouteDriver]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder IN_TRANSIT -> DELIVERED with cascade per state machine"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/dispute
    description: Dispute the delivered count; pulls the delivered quantity back out of the bin
    roles: [RouteDriver]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder DELIVERED -> DISPUTED with cascade per state machine"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/resolve-dispute
    description: Resolve a dispute in the distributor's favour; restores the delivered quantity
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder DISPUTED -> DELIVERED with cascade per state machine"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/release-hold
    description: Release a certification hold once a valid lot certificate exists
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder ON_HOLD -> CONFIRMED"]
  - method: POST
    path: /vmi/replenishment-orders/{id}/cancel
    description: Cancel an order from DRAFT, ON_HOLD, or DISPUTED with the compensating adjustments declared per source state
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["ReplenishmentOrder -> CANCELLED with state-dependent compensation per state machine"]

  # --- LotCertificate ---
  - method: POST
    path: /vmi/lot-certificates
    description: Register a lot certificate for a critical part
    roles: [DistributorAdmin]
    code: 201
    input: [part_id, lot_number, cert_expires_at]
    output: LotCertificate
    side_effects: []
  - method: GET
    path: /vmi/lot-certificates/{id}
    description: Fetch one lot certificate
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: []
    output: LotCertificate
    side_effects: []
  - method: GET
    path: /vmi/lot-certificates
    description: List lot certificates with filters
    roles: [DistributorAdmin, RouteDriver, WarehouseOperator]
    code: 200
    input: ["part_id?", "status?", "limit?", "offset?"]
    output: LotCertificate[]
    side_effects: []

  # --- KitJob ---
  - method: POST
    path: /vmi/kit-jobs
    description: Create a kitting/bagging job; station window uses closed-interval-with-buffer collision semantics
    roles: [WarehouseOperator]
    code: 201
    input: [site_id, kit_name, component_part_ids, qty_per_part, kit_count, station_window_start, station_window_end]
    output: KitJob
    side_effects: []
  - method: GET
    path: /vmi/kit-jobs/{id}
    description: Fetch one kit job
    roles: [DistributorAdmin, WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: []
  - method: GET
    path: /vmi/kit-jobs
    description: List kit jobs with filters
    roles: [DistributorAdmin, WarehouseOperator]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: KitJob[]
    side_effects: []
  - method: POST
    path: /vmi/kit-jobs/{id}/start-picking
    description: Begin picking; reserves component stock
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob DRAFT -> PICKING with stock reservation"]
  - method: POST
    path: /vmi/kit-jobs/{id}/hold
    description: Pause a picking job, retaining reservations
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob PICKING -> ON_HOLD"]
  - method: POST
    path: /vmi/kit-jobs/{id}/resume
    description: Resume a held job
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob ON_HOLD -> PICKING"]
  - method: POST
    path: /vmi/kit-jobs/{id}/pack
    description: Pack a picked job; computes packaging_cost_cents
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob PICKING -> PACKED; packaging_cost_cents computed"]
  - method: POST
    path: /vmi/kit-jobs/{id}/complete
    description: Complete a packed job; reserved stock leaves inventory
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob PACKED -> COMPLETED with stock decrement"]
  - method: POST
    path: /vmi/kit-jobs/{id}/scrap
    description: Scrap a job from DRAFT, PICKING, or ON_HOLD; compensating release of reservations
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: KitJob
    side_effects: ["KitJob -> SCRAPPED with state-dependent compensation per state machine"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is authenticated but not permitted on this endpoint per the RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body FK references a non-existent entity (checked left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, enum value outside its declared set, or flat_bin_price_cents absent when pricing_mode == COST_PER_BIN"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition does not exist from the resource's current state (includes terminal-state lockdown and idempotent re-trigger rejection)"
  - id: ERR_AGREEMENT_OR_SITE_RETIRED
    http: 409
    condition: "Operation requires a live site/agreement but the referenced site or bin agreement is RETIRED (or the part driving it is OBSOLETE where substitution was not applied)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: site ship_to_code, part sku, live (site, part, bin_location) agreement triple, or (from_part_id, to_part_id) cross-reference pair"
  - id: ERR_NO_SUBSTITUTE
    http: 422
    condition: "Self-referential cross-reference, or substitution requested but no is_active PartCrossReference row leads to an ACTIVE part"
  - id: ERR_ROUTE_WINDOW_OVERLAP
    http: 422
    condition: "New route window overlaps an existing SCHEDULED or IN_PROGRESS route on the same site under half-open interval semantics (window_start >= window_end also rejected here)"
  - id: ERR_STATION_WINDOW_CONFLICT
    http: 422
    condition: "New kit-job station window violates closed-interval-with-buffer semantics against a non-terminal job (station_window_start >= station_window_end also rejected here)"
  - id: ERR_CERTIFICATION_BLOCKED
    http: 422
    condition: "Critical part has no VALID lot certificate, or the agreement's compliance_flag is BLOCKED, at confirmation or hold-release"
  - id: ERR_QUANTITY_OUT_OF_BOUNDS
    http: 422
    condition: "counted_qty > max_qty, min_qty >= max_qty, kit component list empty/oversized/duplicated, or a kit component part not ACTIVE"
  - id: ERR_INSUFFICIENT_STOCK
    http: 422
    condition: "Kit picking requires qty_per_part * kit_count from a component whose available_qty is smaller"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Confirmation would push site.outstanding_balance_cents + total_price_cents over credit_limit_cents"
  - id: ERR_ROUTE_EMPTY
    http: 422
    condition: "Route close requested with zero SUBMITTED stops (empty-collection edge) or with PENDING stops remaining"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version on an OCC-guarded write"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: DistributorAdmin
    description: "Distributor-side administrator: owns catalogue, agreements, pricing, credit, certification, and order lifecycle"
    identity: opaque
    exclusive_operations:
      - "Create/obsolete parts, create/retire sites, create/update/retire bin agreements, manage cross-references and lot certificates"
      - "Confirm, ship, cancel, and release-hold replenishment orders; resolve disputes"
      - "Schedule routes; set the logical clock; run the cert-expiry sweep"
    shared_operations:
      - "Read any entity"
  - name: RouteDriver
    description: "Distributor field rep running scan routes at customer sites"
    identity: opaque
    exclusive_operations:
      - "Start, cancel, and close routes; create and submit route stops; deliver orders; raise count disputes"
    shared_operations:
      - "Read sites, parts, agreements, routes, stops, orders, certificates; read sizing recommendations"
  - name: WarehouseOperator
    description: "Distributor warehouse staff running kitting/bagging jobs"
    identity: opaque
    exclusive_operations:
      - "Create kit jobs and drive the picking/hold/resume/pack/complete/scrap lifecycle"
    shared_operations:
      - "Read sites, parts, certificates, and kit jobs"
