            - call: "PATCH /clients/${client_id}/headcount"
              payload: { headcount: 6 }
              as: PlatformAdmin
              captures: { v1: "$.data.version" }
            - call: "PATCH /clients/${client_id}/headcount"
              payload: { headcount: 7 }
              as: PlatformAdmin
              captures: { v2: "$.data.version" }
          assert:
            - "v0 == 1"
            - "v1 == 2"
            - "v2 == 3"

