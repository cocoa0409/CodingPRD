          setup:
            - "A Case in OPEN (freshly created, not assigned)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Op En", ssn_last4: "2222", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
