              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Cy", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /opportunities"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "FestCo", proposed_value_cents: 10000000, offer_expiry_date: "2026-12-31", proposed_window_start: "2026-10-01T00:00:00Z", proposed_window_end: "2026-10-02T00:00:00Z", fit_score: 80 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp: $.data.id, opp_v: $.data.version }
            - call: "POST /opportunities/${opp}/evaluate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /opportunities/${opp}/negotiate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp_v2: $.data.version }
          trigger:
            - call: "POST /opportunities/${opp}/counter-offer"
              payload: { new_value_cents: 11000000, expected_opportunity_version: "${opp_v2}" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp_v3: $.data.version }
            - call: "POST /opportunities/${opp}/counter-offer"
              payload: { new_value_cents: 12500000, expected_opportunity_version: "${opp_v3}" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp_v4: $.data.version }
            - call: "POST /opportunities/${opp}/evaluate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /opportunities/${opp}/negotiate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
          assert:
            - "First counter-offer: delta == exactly 10% ((11000000-10000000)/10000000 == 0.10) so Opportunity stays NEGOTIATING, current_value_cents == 11000000, round_number == 1"
            - "Second counter-offer: delta 12500000 vs 11000000 exceeds 10% so Opportunity loops back to UNDER_EVALUATION with round_number == 2"
            - "The 11000000 value crossed the 10000000 threshold, so an ARTIST ApprovalRequest (target_type OPPORTUNITY, target_id == ${opp}, status PENDING) exists"
            - "After re-evaluate the status is UNDER_EVALUATION (recompute allowed in place) and after negotiate it is NEGOTIATING again - one full cycle completed"

      - name: statement_issue_dispute_amend_cycle
        grounds:
          - state_machines.Statement.ISSUED_to_DISPUTED
          - state_machines.Statement.DISPUTED_to_ISSUED
