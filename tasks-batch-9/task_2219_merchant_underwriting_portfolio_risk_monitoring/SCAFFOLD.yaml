scenario: "2219. Merchant Underwriting & Portfolio Risk Monitoring (payment facilitator risk operations): applicant underwriting with business verification, beneficial ownership and prohibited business screening, credit assessment and reserve requirement determination by delivery lag and chargeback risk, transaction monitoring for laundering patterns, sudden volume spikes and card testing, chargeback ratio thresholds with remediation programs and network monitoring escalation, rolling and capped reserve mechanics with release schedules, funding holds, delayed payouts and account termination decisions, merchant appeal and reinstatement, portfolio loss forecasting and reserve adequacy"
domain_name: merchant-underwriting-portfolio-risk
api_prefix: ""   # flat topology: peer collections, no shared top-level prefix

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections linked by body-level foreign keys; only reverse-reachability
  # reads are nested. No entity is addressed through a parent path segment.

  state_machine_shape: cyclic
  # Merchant carries two independent state dimensions (account_state x funding_state);
  # MerchantApplication (IN_VERIFICATION -> INFO_REQUESTED -> SUBMITTED), Appeal
  # (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW), ReserveAccount
  # (ACCRUING <-> RELEASING, CAP_REACHED -> ACCRUING) and RemediationProgram
  # (ACTIVE -> ACTIVE) all loop.

  relationship_patterns:
    - one_to_many
    - self_referential      # MerchantApplication.supersedes_application_id -> MerchantApplication.id
    - cross_aggregate       # ReserveLedgerEntry.settlement_batch_id spans the reserve and settlement aggregates

  role_model: segregation_of_duties
  # The X-User-ID that proposes a termination may not approve it, and neither the
  # proposer nor the approver may decide the merchant's appeal.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 61 endpoints / 53 error codes / 7 calculations (3 carrying
  # dual variants) / 9 state machines / 53 priority-ordered validations /
  # 2 OCC rules / 6 roles under segregation of duties.

entities:
  - name: MerchantApplication
    parent: null
    common_fields: true
    fields:
      - name: legal_business_name
        type: string
        source: input
        description: Registered legal name of the applicant business.
        constraints: 1..200 chars, non-blank
      - name: tax_id
        type: string
        source: input
        description: Employer identification number of the applicant.
        constraints: "matches ^[0-9]{2}-[0-9]{7}$"
      - name: mcc_code
        type: string
        source: input
        description: Merchant category code the applicant will process under.
        constraints: "matches ^[0-9]{4}$"
      - name: country_code
        type: string
        source: input
        description: Country of incorporation.
        constraints: "one of {US, CA}"
      - name: requested_monthly_volume_cents
        type: integer
        source: input
        description: Monthly card volume the applicant requests, in cents.
        constraints: ">= 100000"
      - name: average_ticket_cents
        type: integer
        source: input
        description: Applicant-declared average transaction size in cents.
        constraints: ">= 1"
      - name: avg_delivery_lag_days
        type: integer
        source: input
        description: Average days between authorization and goods/service delivery; primary driver of the LAG_WEIGHTED reserve variant.
        constraints: 0..365
      - name: prior_processing_history_months
        type: integer
        source: input
        description: Months of verifiable prior card-processing history; below 6 the applicant is a thin file.
        constraints: 0..600
      - name: credit_score
        type: integer
        source: input
        description: Principal credit bureau score used to select the base reserve band.
        constraints: 300..850
      - name: declared_chargeback_ratio_bps
        type: integer
        source: input
        description: Applicant-declared historical chargeback ratio in basis points; primary driver of the CHARGEBACK_WEIGHTED reserve variant.
        constraints: 0..10000
      - name: supersedes_application_id
        type: string
        source: input
        description: "FK -> MerchantApplication.id; the prior APPROVED application whose Merchant is TERMINATED that this re-application supersedes; null for first-time applicants."
        default: null
      - name: state
        type: enum
        source: system
        description: Underwriting pipeline state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, IN_VERIFICATION, INFO_REQUESTED, UNDERWRITING, APPROVED, DECLINED, WITHDRAWN}"
      - name: outstanding_info_items
        type: array
        source: system
        description: Item labels requested by the underwriting officer on the most recent request-info transition; cleared on the next submit.
        default: []
      - name: decline_reason_code
        type: enum
        source: system
        description: Reason recorded when the decision disposition is DECLINE.
        default: null
        constraints: "one of {PROHIBITED_CATEGORY, INSUFFICIENT_CREDIT, VERIFICATION_FAILED, OWNERSHIP_UNVERIFIED}"
      - name: verification_attempt_count
        type: integer
        source: computed
        description: Count of BusinessVerification rows recorded against this application.
        default: 0
      - name: owner_ownership_pct_total
        type: number
        source: computed
        description: Sum of BeneficialOwner.ownership_pct over all owners of this application, 2 decimal places.
        default: 0
      - name: mcc_disposition
        type: enum
        source: computed
        description: Screening disposition derived from the ProhibitedCategoryRule whose mcc_code equals this application's mcc_code; ALLOWED when no rule matches.
        default: ALLOWED
        constraints: "one of {ALLOWED, RESTRICTED_REVIEW, PROHIBITED}"
      - name: current_assessment_method
        type: enum
        source: computed
        description: method of the CreditAssessment with the greatest assessment_sequence for this application.
        default: null
        constraints: "one of {LAG_WEIGHTED, CHARGEBACK_WEIGHTED}"
      - name: current_reserve_pct_bps
        type: integer
        source: computed
        description: reserve_pct_bps of the CreditAssessment with the greatest assessment_sequence.
        default: null
      - name: current_reserve_cap_cents
        type: integer
        source: computed
        description: reserve_cap_cents of the CreditAssessment with the greatest assessment_sequence.
        default: null
      - name: current_reserve_type
        type: enum
        source: computed
        description: reserve_type of the CreditAssessment with the greatest assessment_sequence.
        default: null
        constraints: "one of {ROLLING, CAPPED}"
      - name: decision_officer_user_id
        type: string
        source: system
        description: X-User-ID of the UnderwritingOfficer that issued the decision.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision transition.
        default: null

  - name: BusinessVerification
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> MerchantApplication.id; the application whose business identity was verified."
      - name: registry_match
        type: boolean
        source: input
        description: Legal name matched the state business registry.
      - name: tax_id_match
        type: boolean
        source: input
        description: Tax id matched the federal record.
      - name: bank_account_match
        type: boolean
        source: input
        description: Settlement bank account ownership matched the legal entity.
      - name: address_match
        type: boolean
        source: input
        description: Principal place of business matched the registry address.
      - name: mismatch_count
        type: integer
        source: computed
        description: Count of the four match flags that are false.
      - name: attempt_index
        type: integer
        source: computed
        description: 1-based ordinal of this verification among the application's verifications; the greatest attempt_index is the authoritative one.
      - name: status
        type: enum
        source: computed
        description: PASSED when mismatch_count == 0, otherwise FAILED.
        constraints: "one of {PASSED, FAILED}"
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the UnderwritingOfficer that recorded the vendor result.

  - name: BeneficialOwner
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> MerchantApplication.id; the application this owner is disclosed on."
      - name: full_name
        type: string
        source: input
        description: Legal name of the beneficial owner.
        constraints: 1..200 chars, non-blank
      - name: ownership_pct
        type: number
        source: input
        description: Percentage of the applicant entity owned, 2 decimal places.
        constraints: 0.01..100
      - name: date_of_birth
        type: string
        source: input
        description: Owner date of birth, YYYY-MM-DD.
      - name: government_id_last4
        type: string
        source: input
        description: Last four digits of the owner's government identifier.
        constraints: "matches ^[0-9]{4}$"
      - name: country_code
        type: string
        source: input
        description: Owner country of residence.
        constraints: "one of {US, CA}"
      - name: sanctions_hit
        type: boolean
        source: system
        description: Sanctions-list match reported by the screening vendor.
        default: false
      - name: pep_flag
        type: boolean
        source: system
        description: Politically-exposed-person match reported by the screening vendor.
        default: false
      - name: id_verified
        type: boolean
        source: system
        description: Identity document verified by the screening vendor.
        default: false
      - name: status
        type: enum
        source: computed
        description: "SANCTIONS_HIT when sanctions_hit; else FLAGGED_PEP when pep_flag; else ID_UNVERIFIED when not id_verified; else CLEARED. PENDING until the screen endpoint runs."
        default: PENDING
        constraints: "one of {PENDING, CLEARED, FLAGGED_PEP, ID_UNVERIFIED, SANCTIONS_HIT}"
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant the screening result was recorded.
        default: null

  - name: ProhibitedCategoryRule
    parent: null
    common_fields: false
    fields:
      - name: mcc_code
        type: string
        source: input
        description: Merchant category code this rule governs; unique across rules.
        constraints: "matches ^[0-9]{4}$; unique"
      - name: category
        type: string
        source: input
        description: Human-readable category label, e.g. INBOUND_TELEMARKETING.
      - name: disposition
        type: enum
        source: input
        description: PROHIBITED blocks underwriting outright; RESTRICTED_REVIEW allows it with a reserve uplift.
        constraints: "one of {PROHIBITED, RESTRICTED_REVIEW}"
      - name: reserve_uplift_bps
        type: integer
        source: input
        description: Basis points added to the reserve percentage for RESTRICTED_REVIEW categories.
        default: 0
        constraints: 0..2000
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PortfolioController that published the rule.

  - name: CreditAssessment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> MerchantApplication.id; the application being assessed."
      - name: method
        type: enum
        source: input
        description: Reserve determination variant to evaluate.
        constraints: "one of {LAG_WEIGHTED, CHARGEBACK_WEIGHTED}"
      - name: assessment_sequence
        type: integer
        source: computed
        description: 1-based ordinal of this assessment among the application's assessments.
      - name: credit_band
        type: enum
        source: computed
        description: Band selected from MerchantApplication.credit_score.
        constraints: "one of {A, B, C, D}"
      - name: base_reserve_bps
        type: integer
        source: computed
        description: Band base reserve in basis points.
      - name: lag_uplift_bps
        type: integer
        source: computed
        description: Delivery-lag uplift component; 0 for the CHARGEBACK_WEIGHTED method.
      - name: thin_file_uplift_bps
        type: integer
        source: computed
        description: 300 when prior_processing_history_months < 6, else 0.
      - name: mcc_uplift_bps
        type: integer
        source: computed
        description: reserve_uplift_bps of the matching ProhibitedCategoryRule, else 0.
      - name: chargeback_uplift_bps
        type: integer
        source: computed
        description: Declared-chargeback uplift component; 0 for the LAG_WEIGHTED method.
      - name: reserve_pct_bps
        type: integer
        source: computed
        description: Final clamped reserve percentage in basis points.
      - name: exposure_estimate_cents
        type: integer
        source: computed
        description: Estimated in-flight exposure used to cap the reserve.
      - name: reserve_cap_cents
        type: integer
        source: computed
        description: Maximum reserve balance the account may accrue.
      - name: reserve_type
        type: enum
        source: computed
        description: ROLLING when reserve_pct_bps < 1000, else CAPPED.
        constraints: "one of {ROLLING, CAPPED}"
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the UnderwritingOfficer that ran the assessment.

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> MerchantApplication.id; the approved application this portfolio member was onboarded from."
      - name: legal_business_name
        type: string
        source: computed
        description: Copied from the application at approval.
      - name: mcc_code
        type: string
        source: computed
        description: Copied from the application at approval.
      - name: monthly_volume_limit_cents
        type: integer
        source: computed
        description: Copied from MerchantApplication.requested_monthly_volume_cents at approval.
      - name: account_state
        type: enum
        source: system
        description: Risk posture dimension; gates settlement, reserve release and activity ingest.
        default: ACTIVE
        constraints: "one of {ACTIVE, RESTRICTED, TERMINATED}"
      - name: funding_state
        type: enum
        source: system
        description: Payout dimension, independent of account_state.
        default: NORMAL
        constraints: "one of {NORMAL, DELAYED, HELD}"
      - name: delayed_payout_days
        type: integer
        source: system
        description: Payout deferral applied to new and cascaded settlement batches; 0 when funding_state is NORMAL, 7 when DELAYED.
        default: 0
      - name: remediation_required
        type: boolean
        source: system
        description: Set true when a chargeback-threshold breach restricts the account; a RemediationProgram may only be opened while true.
        default: false
      - name: pinned_reserve_pct_bps
        type: integer
        source: computed
        description: reserve_pct_bps copied from the authoritative CreditAssessment at approval; later changed only by a granted appeal.
      - name: pinned_reserve_cap_cents
        type: integer
        source: computed
        description: reserve_cap_cents copied from the authoritative CreditAssessment at approval.
      - name: pinned_reserve_type
        type: enum
        source: computed
        description: reserve_type copied from the authoritative CreditAssessment at approval.
        constraints: "one of {ROLLING, CAPPED}"
      - name: pinned_assessment_method
        type: enum
        source: computed
        description: method copied from the authoritative CreditAssessment at approval.
        constraints: "one of {LAG_WEIGHTED, CHARGEBACK_WEIGHTED}"
      - name: metrics_as_of_date
        type: string
        source: computed
        description: Window end date of the trailing metrics currently stored on this row.
        default: null
      - name: trailing_30d_txn_count
        type: integer
        source: computed
        description: Sum of MerchantDayActivity.txn_count over the trailing 30-day window.
        default: 0
      - name: trailing_30d_volume_cents
        type: integer
        source: computed
        description: Sum of MerchantDayActivity.volume_cents over the trailing 30-day window.
        default: 0
      - name: trailing_30d_chargeback_count
        type: integer
        source: computed
        description: Sum of MerchantDayActivity.chargeback_count over the trailing 30-day window.
        default: 0
      - name: trailing_30d_chargeback_amount_cents
        type: integer
        source: computed
        description: Sum of MerchantDayActivity.chargeback_amount_cents over the trailing 30-day window.
        default: 0
      - name: rolling_chargeback_ratio_bps
        type: integer
        source: computed
        description: COUNT_BASED chargeback ratio variant; the only variant that gates account_state.
        default: 0
      - name: amount_based_chargeback_ratio_bps
        type: integer
        source: computed
        description: AMOUNT_BASED chargeback ratio variant; feeds loss forecasting only.
        default: 0
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: Denormalized mirror of the merchant's ReserveAccount.held_balance_cents.
        default: 0
      - name: pending_payout_cents
        type: integer
        source: computed
        description: Sum of SettlementBatch.net_payout_cents over batches with payout_state IN {SCHEDULED, DELAYED, HELD}.
        default: 0
      - name: lifetime_reversed_cents
        type: integer
        source: computed
        description: Sum of SettlementBatch.net_payout_cents over batches with payout_state == REVERSED.
        default: 0
      - name: open_alert_count
        type: integer
        source: computed
        description: Count of MonitoringAlert rows with state IN {OPEN, UNDER_REVIEW, ESCALATED}.
        default: 0
      - name: last_monitoring_run_date
        type: string
        source: system
        description: as_of_date of the most recent monitoring run that evaluated this merchant.
        default: null
      - name: funding_hold_reason_code
        type: enum
        source: system
        description: Reason recorded when funding_state moved to HELD.
        default: null
        constraints: "one of {SUSPECTED_LAUNDERING, CARD_TESTING, EXCESSIVE_CHARGEBACKS, TERMINATION_PENDING}"
      - name: terminated_at
        type: datetime
        source: system
        description: Logical-clock instant the termination was executed.
        default: null
      - name: reinstated_at
        type: datetime
        source: system
        description: Logical-clock instant a granted appeal reinstated the account.
        default: null

  - name: ReserveAccount
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the portfolio member whose funds this account holds."
      - name: reserve_type
        type: enum
        source: computed
        description: Copied from Merchant.pinned_reserve_type at onboarding.
        constraints: "one of {ROLLING, CAPPED}"
      - name: reserve_pct_bps
        type: integer
        source: computed
        description: Copied from Merchant.pinned_reserve_pct_bps at onboarding; re-pinned by a granted appeal.
      - name: reserve_cap_cents
        type: integer
        source: computed
        description: Copied from Merchant.pinned_reserve_cap_cents at onboarding.
      - name: release_lag_days
        type: integer
        source: computed
        description: 90 when reserve_type is ROLLING, 180 when CAPPED.
      - name: total_accrued_cents
        type: integer
        source: computed
        description: Sum of ReserveLedgerEntry.amount_cents where entry_type == HOLD.
        default: 0
      - name: released_to_date_cents
        type: integer
        source: computed
        description: Sum of ReserveLedgerEntry.amount_cents where entry_type == RELEASE.
        default: 0
      - name: offset_to_date_cents
        type: integer
        source: computed
        description: Sum of ReserveLedgerEntry.amount_cents where entry_type == OFFSET_LOSS.
        default: 0
      - name: held_balance_cents
        type: integer
        source: computed
        description: total_accrued_cents - released_to_date_cents - offset_to_date_cents.
        default: 0
      - name: state
        type: enum
        source: system
        description: Reserve lifecycle state.
        default: ACCRUING
        constraints: "one of {ACCRUING, CAP_REACHED, RELEASING, CLOSED}"
      - name: last_release_tranche_end_date
        type: string
        source: computed
        description: tranche_end_date of the RELEASE entry with reason_code == SCHEDULED_RELEASE having the greatest effective_date (tie-break created_at ASC, last wins).
        default: null

  - name: ReserveLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: reserve_account_id
        type: string
        source: input
        description: "FK -> ReserveAccount.id; the account this append-only entry mutates."
      - name: settlement_batch_id
        type: string
        source: system
        description: "FK -> SettlementBatch.id; the batch that produced this entry; null for scheduled release requests and reinstatement releases."
        default: null
      - name: entry_type
        type: enum
        source: system
        description: HOLD adds to the reserve, RELEASE returns funds to the merchant, OFFSET_LOSS consumes reserve to cover uncovered chargebacks.
        constraints: "one of {HOLD, RELEASE, OFFSET_LOSS}"
      - name: amount_cents
        type: integer
        source: system
        description: Always a positive magnitude; the sign is carried by entry_type.
        constraints: ">= 1"
      - name: effective_date
        type: string
        source: system
        description: Date the entry takes economic effect; HOLD entries use the batch period_end_date, RELEASE and OFFSET_LOSS entries use the logical-clock date.
      - name: tranche_start_date
        type: string
        source: system
        description: Inclusive start of the release tranche window; null for HOLD and OFFSET_LOSS entries.
        default: null
      - name: tranche_end_date
        type: string
        source: system
        description: Inclusive end of the release tranche window; null for HOLD and OFFSET_LOSS entries.
        default: null
      - name: reason_code
        type: enum
        source: system
        description: Why the entry was written.
        constraints: "one of {SETTLEMENT_HOLD, SCHEDULED_RELEASE, BATCH_REVERSAL_RELEASE, LOSS_OFFSET, REINSTATEMENT_RELEASE}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose request produced the entry; null for entries written by the monitoring run.
        default: null

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant being settled."
      - name: period_start_date
        type: string
        source: input
        description: Inclusive first business date of the settlement period.
      - name: period_end_date
        type: string
        source: input
        description: Inclusive last business date of the settlement period.
      - name: gross_volume_cents
        type: integer
        source: input
        description: Gross card volume submitted for settlement; must equal the sum of MerchantDayActivity.volume_cents over the period.
        constraints: ">= 1"
      - name: day_line_count
        type: integer
        source: computed
        description: Count of MerchantDayActivity rows in the settlement period; these rows are the batch's line items.
      - name: reserve_hold_cents
        type: integer
        source: computed
        description: Reserve withheld from this batch, summed per day line after per-line rounding.
      - name: loss_offset_from_settlement_cents
        type: integer
        source: computed
        description: Portion of the period's chargebacks funded out of this settlement.
      - name: reserve_offset_cents
        type: integer
        source: computed
        description: Portion of the period's chargebacks funded out of the reserve balance.
      - name: uncovered_loss_cents
        type: integer
        source: computed
        description: Chargeback amount neither settlement nor reserve could fund.
      - name: net_payout_cents
        type: integer
        source: computed
        description: Amount payable to the merchant.
      - name: payout_state
        type: enum
        source: system
        description: Payout lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DELAYED, HELD, PAID, REVERSED}"
      - name: scheduled_payout_date
        type: string
        source: computed
        description: Date the payout becomes due; null while payout_state is HELD.
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of payment.
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Logical-clock instant of reversal.
        default: null
      - name: reversal_reason_code
        type: enum
        source: system
        description: Reason recorded on reversal.
        default: null
        constraints: "one of {RISK_HOLD, FUNDING_ERROR, TERMINATION, APPEAL_REMEDY}"

  - name: MerchantDayActivity
    parent: null
    common_fields: false
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant whose day this row summarizes."
      - name: business_date
        type: string
        source: input
        description: Processing date, YYYY-MM-DD; unique per merchant.
      - name: txn_count
        type: integer
        source: input
        description: Approved transaction count for the day.
        constraints: ">= 0"
      - name: volume_cents
        type: integer
        source: input
        description: Approved transaction volume for the day, in cents.
        constraints: ">= 0"
      - name: distinct_card_count
        type: integer
        source: input
        description: Distinct card numbers presented during the day.
        constraints: ">= 0"
      - name: decline_count
        type: integer
        source: input
        description: Declined authorization count for the day.
        constraints: ">= 0"
      - name: cross_border_count
        type: integer
        source: input
        description: Transactions whose issuer country differs from the merchant country.
        constraints: ">= 0"
      - name: refund_cents
        type: integer
        source: input
        description: Refund amount issued during the day, in cents.
        constraints: ">= 0"
      - name: unique_bin_count
        type: integer
        source: input
        description: Distinct issuer BINs presented during the day.
        constraints: ">= 0"
      - name: chargeback_count
        type: integer
        source: input
        description: Chargebacks received for the day.
        constraints: ">= 0"
      - name: chargeback_amount_cents
        type: integer
        source: input
        description: Chargeback amount received for the day, in cents.
        constraints: ">= 0"
      - name: chargeback_network
        type: enum
        source: input
        description: Card network that raised the day's chargebacks; required when chargeback_count > 0.
        default: null
        constraints: "one of {VISA, MASTERCARD, AMEX, DISCOVER}"
      - name: avg_ticket_cents
        type: integer
        source: computed
        description: round_half_up(volume_cents / txn_count) when txn_count > 0, else 0.
      - name: ingested_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskAnalyst that ingested the row.

  - name: MonitoringAlert
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant the detector fired on."
      - name: alert_type
        type: enum
        source: system
        description: Detector that produced the alert.
        constraints: "one of {VELOCITY_SPIKE, CARD_TESTING, LAUNDERING_PATTERN, CHARGEBACK_THRESHOLD}"
      - name: severity_score
        type: integer
        source: computed
        description: Detector severity, 0..100.
        constraints: 0..100
      - name: observed_metric_bps
        type: integer
        source: computed
        description: Detector-specific observed metric in basis points at detection time.
      - name: state
        type: enum
        source: system
        description: Alert triage state.
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, ESCALATED, DISMISSED, CLOSED}"
      - name: detected_on_date
        type: string
        source: system
        description: as_of_date of the monitoring run that first raised this alert.
      - name: last_detected_on_date
        type: string
        source: system
        description: as_of_date of the most recent monitoring run that re-detected this alert.
      - name: recurrence_count
        type: integer
        source: computed
        description: Number of monitoring runs that detected this alert, including the first.
        default: 1
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskAnalyst that triaged the alert.
        default: null
      - name: review_note
        type: string
        source: system
        description: Free-text triage note.
        default: null

  - name: RemediationProgram
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the restricted merchant under remediation."
      - name: target_ratio_bps
        type: integer
        source: input
        description: Monthly COUNT_BASED chargeback ratio the merchant must stay below.
        constraints: 1..10000
      - name: monitoring_month_count
        type: integer
        source: input
        description: Consecutive compliant 30-day months required to pass.
        constraints: 1..6
      - name: window_start_date
        type: string
        source: input
        description: Inclusive first date of the monitoring window.
      - name: window_end_date
        type: string
        source: input
        description: Exclusive last date of the monitoring window (half-open [window_start_date, window_end_date)).
      - name: state
        type: enum
        source: system
        description: Program lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, PASSED, FAILED, NETWORK_ESCALATED}"
      - name: months_elapsed
        type: integer
        source: computed
        description: Count of evaluated 30-day months.
        default: 0
      - name: consecutive_compliant_months
        type: integer
        source: computed
        description: Run length of compliant months ending at months_elapsed; reset to 0 by any non-compliant month.
        default: 0
      - name: last_observed_ratio_bps
        type: integer
        source: computed
        description: COUNT_BASED chargeback ratio observed in the most recently evaluated month.
        default: null
      - name: network_program_tier
        type: enum
        source: system
        description: Network monitoring tier assigned when the program escalates.
        default: null
        constraints: "one of {STANDARD, EXCESSIVE}"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskAnalyst that opened the program.
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskCommitteeApprover that activated the program.
        default: null

  - name: TerminationDecision
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant proposed for termination."
      - name: reason_code
        type: enum
        source: input
        description: Termination ground.
        constraints: "one of {EXCESSIVE_CHARGEBACKS, SUSPECTED_LAUNDERING, PROHIBITED_ACTIVITY, REMEDIATION_FAILURE}"
      - name: match_listing_flag
        type: boolean
        source: input
        description: Whether the merchant is to be listed on the network terminated-merchant file at execution.
        default: false
      - name: state
        type: enum
        source: system
        description: Decision lifecycle state.
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED, EXECUTED, REVERSED}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskAnalyst that proposed the termination.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskCommitteeApprover that approved it; must differ from proposed_by_user_id.
        default: null
      - name: rejection_note
        type: string
        source: system
        description: Note recorded on rejection.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution.
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was reversed by a granted appeal.
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the terminated merchant appealing."
      - name: termination_decision_id
        type: string
        source: input
        description: "FK -> TerminationDecision.id; the EXECUTED decision being appealed."
      - name: evidence_summary
        type: string
        source: input
        description: Merchant-supplied summary of remediating evidence.
        constraints: 1..2000 chars, non-blank
      - name: state
        type: enum
        source: system
        description: Appeal lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, GRANTED, UPHELD}"
      - name: filed_on_date
        type: string
        source: system
        description: Logical-clock date the appeal was filed.
      - name: outstanding_info_items
        type: array
        source: system
        description: Items the reviewer requested on the most recent request-info transition; cleared when the merchant responds.
        default: []
      - name: response_round_count
        type: integer
        source: computed
        description: Number of times the merchant has responded to an information request on this appeal.
        default: 0
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the RiskCommitteeApprover reviewing the appeal.
        default: null
      - name: reinstatement_reserve_pct_bps
        type: integer
        source: system
        description: Reserve percentage re-pinned onto the merchant and its reserve account when the appeal is granted; defaults to the merchant's existing pinned_reserve_pct_bps when omitted.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the appeal decision.
        default: null

  - name: PortfolioForecast
    parent: null
    common_fields: true
    fields:
      - name: as_of_date
        type: string
        source: input
        description: Window end date for trailing metrics and unpaid-exposure selection.
      - name: method
        type: enum
        source: input
        description: Forecast variant.
        constraints: "one of {EXPECTED_LOSS, STRESSED}"
      - name: stress_multiplier_bps
        type: integer
        source: input
        description: Multiplier applied to each merchant's probability of default under the STRESSED variant; ignored by EXPECTED_LOSS.
        default: 25000
        constraints: 10000..100000
      - name: merchant_count
        type: integer
        source: computed
        description: Count of merchants included in the forecast input set.
      - name: unpaid_exposure_cents
        type: integer
        source: computed
        description: Portfolio sum of unpaid settlement exposure.
      - name: gross_expected_loss_cents
        type: integer
        source: computed
        description: Portfolio sum of per-merchant gross expected loss, before reserve offset.
      - name: net_expected_loss_cents
        type: integer
        source: computed
        description: Portfolio sum of per-merchant expected loss net of that merchant's reserve balance, floored at 0 per merchant.
      - name: total_reserve_held_cents
        type: integer
        source: computed
        description: Portfolio sum of ReserveAccount.held_balance_cents over included merchants.
      - name: reserve_adequacy_ratio_bps
        type: integer
        source: computed
        description: total_reserve_held_cents as basis points of gross_expected_loss_cents.
      - name: coverage_gap_cents
        type: integer
        source: computed
        description: max(0, gross_expected_loss_cents - total_reserve_held_cents).
      - name: required_additional_reserve_cents
        type: integer
        source: computed
        description: Additional reserve demanded by the adequacy tier selected from reserve_adequacy_ratio_bps.
      - name: projected_adequacy_ratio_bps
        type: integer
        source: computed
        description: Adequacy ratio recomputed after required_additional_reserve_cents is added; never feeds back into the tier selection.
      - name: generated_by_user_id
        type: string
        source: system
        description: X-User-ID of the PortfolioController that generated the forecast.

state_machines:
  - entity: MerchantApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /merchant-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID equals MerchantApplication.id"
          - "at least one BeneficialOwner row exists for the application"
        side_effects:
          - "recompute MerchantApplication.owner_ownership_pct_total"
          - "recompute MerchantApplication.mcc_disposition from the ProhibitedCategoryRule whose mcc_code equals the application's mcc_code"
          - "clear outstanding_info_items to []"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /merchant-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID equals MerchantApplication.id"
          - "at least one BeneficialOwner row exists for the application"
        side_effects:
          - "clear outstanding_info_items to []"
          - "recompute owner_ownership_pct_total and mcc_disposition"
        note: "Revision loop: an application may cycle SUBMITTED -> IN_VERIFICATION -> INFO_REQUESTED -> SUBMITTED any number of times."
      - from: SUBMITTED
        to: IN_VERIFICATION
        trigger: "POST /business-verifications (system transition on the referenced application)"
        actor: UnderwritingOfficer
        preconditions:
          - "application state == SUBMITTED"
        side_effects:
          - "create BusinessVerification with attempt_index = verification_attempt_count + 1 and status computed from mismatch_count"
          - "increment MerchantApplication.verification_attempt_count by 1"
          - "when the new verification's status == FAILED, this verification result itself triggers the IN_VERIFICATION -> INFO_REQUESTED transition below with outstanding_info_items set to the uppercase names of the false checks in the fixed order REGISTRY_MATCH, ADDRESS_MATCH, TAX_ID_MATCH, BANK_ACCOUNT_MATCH"
      - from: IN_VERIFICATION
        to: INFO_REQUESTED
        trigger: "POST /merchant-applications/{id}/request-info, or system cascade from a FAILED BusinessVerification"
        actor: UnderwritingOfficer | system
        preconditions:
          - "application state == IN_VERIFICATION"
        side_effects:
          - "set outstanding_info_items to the requested item labels"
      - from: UNDERWRITING
        to: INFO_REQUESTED
        trigger: "POST /merchant-applications/{id}/request-info"
        actor: UnderwritingOfficer
        preconditions:
          - "application state == UNDERWRITING"
        side_effects:
          - "set outstanding_info_items to the requested item labels"
      - from: IN_VERIFICATION
        to: UNDERWRITING
        trigger: "POST /merchant-applications/{id}/advance-to-underwriting"
        actor: UnderwritingOfficer
        preconditions:
          - "application state == IN_VERIFICATION"
          - "mcc_disposition != PROHIBITED"
          - "no BeneficialOwner of the application has status == SANCTIONS_HIT"
          - "no BeneficialOwner of the application has status == PENDING"
          - "owner_ownership_pct_total >= 75.00"
          - "the BusinessVerification of the application with the greatest attempt_index has status == PASSED"
        side_effects:
          - "no field changes beyond state, updated_at and version"
        note: "Cross-entity guard: this transition reads BeneficialOwner.status and BusinessVerification.status of sibling rows."
      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /merchant-applications/{id}/decision with decision == APPROVE"
        actor: RiskCommitteeApprover
        preconditions:
          - "application state == UNDERWRITING"
          - "at least one CreditAssessment exists for the application"
        side_effects:
          - "set decision_officer_user_id = X-User-ID and decided_at = logical clock"
          - "create Merchant with account_state ACTIVE, funding_state NORMAL, monthly_volume_limit_cents = requested_monthly_volume_cents, and pinned_* fields copied from the CreditAssessment with the greatest assessment_sequence"
          - "that Merchant creation itself triggers creation of exactly one ReserveAccount for the merchant with reserve_type / reserve_pct_bps / reserve_cap_cents copied from the merchant's pinned_* fields, release_lag_days = 90 when ROLLING and 180 when CAPPED, state ACCRUING and all ledger totals 0"
      - from: UNDERWRITING
        to: DECLINED
        trigger: "POST /merchant-applications/{id}/decision with decision == DECLINE"
        actor: RiskCommitteeApprover
        preconditions:
          - "application state == UNDERWRITING"
          - "decline_reason_code supplied in the request body"
        side_effects:
          - "set decline_reason_code, decision_officer_user_id, decided_at"
          - "no Merchant is created"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /merchant-applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID equals MerchantApplication.id"
        side_effects: ["set decided_at = logical clock"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /merchant-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID equals MerchantApplication.id"]
        side_effects: ["set decided_at = logical clock"]
      - from: IN_VERIFICATION
        to: WITHDRAWN
        trigger: "POST /merchant-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID equals MerchantApplication.id"]
        side_effects: ["set decided_at = logical clock"]
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /merchant-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID equals MerchantApplication.id"]
        side_effects: ["set decided_at = logical clock"]
      - from: UNDERWRITING
        to: WITHDRAWN
        trigger: "POST /merchant-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID equals MerchantApplication.id"]
        side_effects: ["set decided_at = logical clock"]

  - entity: BeneficialOwner
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == false, id_verified == true"
        actor: UnderwritingOfficer
        preconditions:
          - "the owner's application state IN {SUBMITTED, IN_VERIFICATION}"
        side_effects: ["set sanctions_hit, pep_flag, id_verified, screened_at = logical clock"]
      - from: PENDING
        to: FLAGGED_PEP
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == true"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["set flags and screened_at"]
        note: "FLAGGED_PEP does not block advance-to-underwriting; SANCTIONS_HIT does."
      - from: PENDING
        to: ID_UNVERIFIED
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == false, id_verified == false"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["set flags and screened_at"]
      - from: PENDING
        to: SANCTIONS_HIT
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == true"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["set flags and screened_at"]
      - from: SANCTIONS_HIT
        to: CLEARED
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == false, id_verified == true"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["overwrite flags and screened_at"]
        note: "Re-screen loop: a false-positive sanctions hit can be cleared by a subsequent vendor result while the application is still open."
      - from: ID_UNVERIFIED
        to: CLEARED
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == false, id_verified == true"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["overwrite flags and screened_at"]
      - from: FLAGGED_PEP
        to: CLEARED
        trigger: "POST /beneficial-owners/{id}/screen with sanctions_hit == false, pep_flag == false, id_verified == true"
        actor: UnderwritingOfficer
        preconditions: ["the owner's application state IN {SUBMITTED, IN_VERIFICATION}"]
        side_effects: ["overwrite flags and screened_at"]

  - entity: Merchant
    initial_state: "account_state=ACTIVE x funding_state=NORMAL"
    terminal_states: []
    note: |
      Merchant carries two independent state dimensions. account_state
      (ACTIVE / RESTRICTED / TERMINATED) is the risk posture; funding_state
      (NORMAL / DELAYED / HELD) is the payout posture. A transition on one
      dimension never implies a mirror transition on the other except through
      the explicitly listed cascade links, and a funding hold placed while
      account_state == ACTIVE leaves account_state untouched.
    transitions:
      - from: "account_state=ACTIVE"
        to: "account_state=RESTRICTED"
        trigger: "POST /monitoring-runs (system cascade link 2 of cascade CB-BREACH, caused by the creation of a CHARGEBACK_THRESHOLD alert whose severity_score >= 90)"
        actor: system
        preconditions:
          - "account_state == ACTIVE"
          - "the monitoring run created or re-detected a CHARGEBACK_THRESHOLD alert with severity_score >= 90 for this merchant"
        side_effects:
          - "set remediation_required = true"
          - "this restriction itself triggers the funding_state NORMAL -> DELAYED transition below (cascade CB-BREACH link 3)"
      - from: "funding_state=NORMAL"
        to: "funding_state=DELAYED"
        trigger: "system cascade link 3 of cascade CB-BREACH, caused by account_state ACTIVE -> RESTRICTED"
        actor: system
        preconditions:
          - "funding_state == NORMAL"
        side_effects:
          - "set delayed_payout_days = 7"
          - "this funding change itself triggers, for every SettlementBatch of this merchant with payout_state == SCHEDULED processed in period_end_date ASC then created_at ASC order, the SettlementBatch SCHEDULED -> DELAYED transition with scheduled_payout_date = <the triggering run's as_of_date> + 7 days (cascade CB-BREACH link 4)"
          - "recompute pending_payout_cents"
      - from: "account_state=RESTRICTED"
        to: "account_state=ACTIVE"
        trigger: "system cascade link 2 of cascade REMEDIATION-PASS, caused by RemediationProgram ACTIVE -> PASSED"
        actor: system
        preconditions:
          - "account_state == RESTRICTED"
          - "the merchant has no TerminationDecision with state IN {PROPOSED, APPROVED}"
        side_effects:
          - "set remediation_required = false"
          - "this lift itself triggers the funding_state DELAYED -> NORMAL transition below (cascade REMEDIATION-PASS link 3)"
      - from: "funding_state=DELAYED"
        to: "funding_state=NORMAL"
        trigger: "system cascade link 3 of cascade REMEDIATION-PASS, caused by account_state RESTRICTED -> ACTIVE"
        actor: system
        preconditions: ["funding_state == DELAYED"]
        side_effects:
          - "set delayed_payout_days = 0"
          - "this funding change itself triggers, for every SettlementBatch of this merchant with payout_state == DELAYED processed in period_end_date ASC then created_at ASC order, the SettlementBatch DELAYED -> SCHEDULED transition with scheduled_payout_date = period_end_date + 1 day, and for every MonitoringAlert of this merchant with alert_type == CHARGEBACK_THRESHOLD and state == ESCALATED the MonitoringAlert ESCALATED -> CLOSED transition (cascade REMEDIATION-PASS link 4)"
          - "recompute open_alert_count and pending_payout_cents"
      - from: "funding_state=NORMAL"
        to: "funding_state=HELD"
        trigger: "POST /merchants/{id}/funding-holds"
        actor: RiskAnalyst
        preconditions:
          - "funding_state IN {NORMAL, DELAYED}"
          - "account_state != TERMINATED"
        side_effects:
          - "set funding_hold_reason_code from the request body and delayed_payout_days = 0"
          - "every SettlementBatch of this merchant with payout_state IN {SCHEDULED, DELAYED} transitions to HELD with scheduled_payout_date = null, processed in period_end_date ASC then created_at ASC order"
          - "recompute pending_payout_cents (value unchanged: HELD batches remain pending)"
          - "account_state is NOT modified by this transition"
      - from: "funding_state=DELAYED"
        to: "funding_state=HELD"
        trigger: "POST /merchants/{id}/funding-holds"
        actor: RiskAnalyst
        preconditions:
          - "funding_state == DELAYED"
          - "account_state != TERMINATED"
        side_effects:
          - "identical to the NORMAL -> HELD row"
      - from: "funding_state=HELD"
        to: "funding_state=NORMAL"
        trigger: "POST /merchants/{id}/funding-release"
        actor: RiskCommitteeApprover
        preconditions:
          - "funding_state == HELD"
          - "account_state == ACTIVE"
        side_effects:
          - "clear funding_hold_reason_code, set delayed_payout_days = 0"
          - "every SettlementBatch with payout_state == HELD transitions to SCHEDULED with scheduled_payout_date = period_end_date + 1 day"
      - from: "funding_state=HELD"
        to: "funding_state=DELAYED"
        trigger: "POST /merchants/{id}/funding-release"
        actor: RiskCommitteeApprover
        preconditions:
          - "funding_state == HELD"
          - "account_state == RESTRICTED"
        side_effects:
          - "clear funding_hold_reason_code, set delayed_payout_days = 7"
          - "every SettlementBatch with payout_state == HELD transitions to DELAYED with scheduled_payout_date = <logical clock date> + 7 days"
        note: "Release from a hold cannot return a RESTRICTED merchant to NORMAL funding; the two dimensions are resolved independently."
      - from: "funding_state=NORMAL"
        to: "funding_state=HELD"
        trigger: "system cascade link 2 of cascade ALERT-ESCALATION, caused by MonitoringAlert UNDER_REVIEW -> ESCALATED with alert_type IN {CARD_TESTING, LAUNDERING_PATTERN}"
        actor: system
        preconditions:
          - "funding_state == NORMAL"
          - "account_state != TERMINATED"
        side_effects:
          - "set funding_hold_reason_code = CARD_TESTING or SUSPECTED_LAUNDERING per the escalated alert_type, and delayed_payout_days = 0"
          - "every SettlementBatch of this merchant with payout_state IN {SCHEDULED, DELAYED} transitions to HELD with scheduled_payout_date = null, processed in period_end_date ASC then created_at ASC order (cascade ALERT-ESCALATION link 3)"
          - "account_state is NOT modified by this transition"
      - from: "funding_state=DELAYED"
        to: "funding_state=HELD"
        trigger: "system cascade link 2 of cascade ALERT-ESCALATION, caused by MonitoringAlert UNDER_REVIEW -> ESCALATED with alert_type IN {CARD_TESTING, LAUNDERING_PATTERN}"
        actor: system
        preconditions:
          - "funding_state == DELAYED"
          - "account_state != TERMINATED"
        side_effects:
          - "identical to the ALERT-ESCALATION NORMAL -> HELD row"
      - from: "funding_state=NORMAL"
        to: "funding_state=HELD"
        trigger: "system cascade link 2 of cascade TERMINATION-EXEC, caused by account_state -> TERMINATED"
        actor: system
        preconditions: ["funding_state IN {NORMAL, DELAYED}"]
        side_effects:
          - "set funding_hold_reason_code = TERMINATION_PENDING, delayed_payout_days = 0"
          - "this hold itself triggers every SettlementBatch with payout_state IN {SCHEDULED, DELAYED} to transition to HELD with scheduled_payout_date = null, and the merchant's ReserveAccount to transition to CLOSED (cascade TERMINATION-EXEC link 3)"
          - "closing the reserve account itself triggers, for every MonitoringAlert of this merchant with state IN {OPEN, UNDER_REVIEW, ESCALATED} processed in created_at ASC order, the MonitoringAlert -> CLOSED transition (cascade TERMINATION-EXEC link 4)"
      - from: "account_state=ACTIVE"
        to: "account_state=TERMINATED"
        trigger: "POST /termination-decisions/{id}/execute"
        actor: PortfolioController
        preconditions:
          - "account_state IN {ACTIVE, RESTRICTED}"
          - "the TerminationDecision state == APPROVED"
          - "the merchant has no RemediationProgram with state IN {DRAFT, ACTIVE}"
        side_effects:
          - "set terminated_at = logical clock"
          - "this termination itself triggers the funding_state -> HELD transition above (cascade TERMINATION-EXEC link 2)"
      - from: "account_state=RESTRICTED"
        to: "account_state=TERMINATED"
        trigger: "POST /termination-decisions/{id}/execute"
        actor: PortfolioController
        preconditions:
          - "account_state == RESTRICTED"
          - "the TerminationDecision state == APPROVED"
          - "the merchant has no RemediationProgram with state IN {DRAFT, ACTIVE}"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED row"
      - from: "account_state=TERMINATED"
        to: "account_state=RESTRICTED"
        trigger: "system cascade link 3 of cascade APPEAL-GRANT, caused by TerminationDecision EXECUTED -> REVERSED"
        actor: system
        preconditions:
          - "account_state == TERMINATED"
        side_effects:
          - "set reinstated_at = logical clock, remediation_required = true, terminated_at = null"
          - "set pinned_reserve_pct_bps = Appeal.reinstatement_reserve_pct_bps when supplied, otherwise leave unchanged, and mirror the value onto the merchant's ReserveAccount.reserve_pct_bps"
          - "this reinstatement itself triggers the funding_state HELD -> DELAYED transition below (cascade APPEAL-GRANT link 4)"
      - from: "funding_state=HELD"
        to: "funding_state=DELAYED"
        trigger: "system cascade link 4 of cascade APPEAL-GRANT, caused by account_state TERMINATED -> RESTRICTED"
        actor: system
        preconditions: ["funding_state == HELD"]
        side_effects:
          - "set funding_hold_reason_code = null, delayed_payout_days = 7"
          - "this funding change itself triggers every SettlementBatch of this merchant with payout_state == HELD to transition to DELAYED with scheduled_payout_date = <logical clock date> + 7 days, and the merchant's ReserveAccount CLOSED -> ACCRUING transition (cascade APPEAL-GRANT link 5)"
          - "recompute pending_payout_cents"

  - entity: ReserveAccount
    initial_state: ACCRUING
    terminal_states: []
    transitions:
      - from: ACCRUING
        to: CAP_REACHED
        trigger: "POST /settlement-batches (system, after the HOLD entry is appended)"
        actor: system
        preconditions:
          - "reserve_type == CAPPED"
          - "held_balance_cents >= reserve_cap_cents after the HOLD"
        side_effects: ["subsequent settlement batches withhold only the remaining capacity, which is 0 in this state"]
      - from: CAP_REACHED
        to: ACCRUING
        trigger: "POST /reserve-accounts/{id}/release-requests or POST /settlement-batches (system, after a RELEASE or OFFSET_LOSS entry)"
        actor: system
        preconditions:
          - "held_balance_cents < reserve_cap_cents after the entry"
          - "released_to_date_cents == 0 or held_balance_cents == 0"
        side_effects: ["reserve capacity reopens for future holds"]
      - from: ACCRUING
        to: RELEASING
        trigger: "POST /reserve-accounts/{id}/release-requests"
        actor: PortfolioController
        preconditions:
          - "held_balance_cents > 0 after the RELEASE entry"
          - "released_to_date_cents > 0 after the RELEASE entry"
        side_effects:
          - "append a RELEASE ReserveLedgerEntry with reason_code SCHEDULED_RELEASE"
          - "recompute released_to_date_cents, held_balance_cents, last_release_tranche_end_date"
          - "recompute Merchant.reserve_balance_cents"
          - "increment ReserveAccount.version by 1"
      - from: CAP_REACHED
        to: RELEASING
        trigger: "POST /reserve-accounts/{id}/release-requests"
        actor: PortfolioController
        preconditions:
          - "held_balance_cents > 0 and held_balance_cents < reserve_cap_cents after the RELEASE entry"
        side_effects: ["identical to the ACCRUING -> RELEASING row"]
      - from: RELEASING
        to: ACCRUING
        trigger: "POST /settlement-batches (system, after a HOLD entry is appended)"
        actor: system
        preconditions: ["a HOLD entry was appended"]
        side_effects: ["recompute total_accrued_cents and held_balance_cents"]
      - from: ACCRUING
        to: CLOSED
        trigger: "system cascade link 3 of cascade TERMINATION-EXEC"
        actor: system
        preconditions: ["the owning Merchant.account_state == TERMINATED"]
        side_effects: ["no new HOLD, RELEASE or OFFSET_LOSS entry may be appended while CLOSED"]
      - from: CAP_REACHED
        to: CLOSED
        trigger: "system cascade link 3 of cascade TERMINATION-EXEC"
        actor: system
        preconditions: ["the owning Merchant.account_state == TERMINATED"]
        side_effects: ["identical to the ACCRUING -> CLOSED row"]
      - from: RELEASING
        to: CLOSED
        trigger: "system cascade link 3 of cascade TERMINATION-EXEC"
        actor: system
        preconditions: ["the owning Merchant.account_state == TERMINATED"]
        side_effects: ["identical to the ACCRUING -> CLOSED row"]
      - from: CLOSED
        to: ACCRUING
        trigger: "system cascade link 5 of cascade APPEAL-GRANT"
        actor: system
        preconditions: ["the owning Merchant.account_state == RESTRICTED after reinstatement"]
        side_effects:
          - "re-pin reserve_pct_bps from Merchant.pinned_reserve_pct_bps"
          - "when held_balance_cents > 0, append a RELEASE entry with reason_code REINSTATEMENT_RELEASE for amount_cents = held_balance_cents, effective_date = logical clock date, tranche dates null"
          - "recompute released_to_date_cents, held_balance_cents and Merchant.reserve_balance_cents"

  - entity: SettlementBatch
    initial_state: SCHEDULED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /settlement-batches (system, at creation when the merchant's funding_state == DELAYED)"
        actor: system
        preconditions: ["Merchant.funding_state == DELAYED"]
        side_effects: ["set scheduled_payout_date = period_end_date + Merchant.delayed_payout_days days"]
      - from: SCHEDULED
        to: HELD
        trigger: "POST /settlement-batches (system, at creation when the merchant's funding_state == HELD), POST /merchants/{id}/funding-holds, or system cascade link 3 of cascade ALERT-ESCALATION"
        actor: system
        preconditions: ["Merchant.funding_state == HELD"]
        side_effects: ["set scheduled_payout_date = null"]
      - from: DELAYED
        to: HELD
        trigger: "POST /merchants/{id}/funding-holds, or system cascade link 3 of cascade ALERT-ESCALATION"
        actor: system
        preconditions: ["Merchant.funding_state transitioned to HELD"]
        side_effects: ["set scheduled_payout_date = null"]
      - from: SCHEDULED
        to: DELAYED
        trigger: "system cascade link 4 of cascade CB-BREACH"
        actor: system
        preconditions: ["payout_state == SCHEDULED", "the merchant's funding_state transitioned NORMAL -> DELAYED"]
        side_effects:
          - "set scheduled_payout_date = <triggering run as_of_date> + Merchant.delayed_payout_days days"
          - "recompute Merchant.pending_payout_cents"
      - from: DELAYED
        to: SCHEDULED
        trigger: "system cascade link 4 of cascade REMEDIATION-PASS, or POST /merchants/{id}/funding-release"
        actor: system
        preconditions: ["payout_state == DELAYED", "the merchant's funding_state is NORMAL after the triggering transition"]
        side_effects: ["set scheduled_payout_date = period_end_date + 1 day"]
      - from: HELD
        to: DELAYED
        trigger: "POST /merchants/{id}/funding-release, or system cascade link 5 of cascade APPEAL-GRANT"
        actor: system
        preconditions: ["payout_state == HELD", "the merchant's funding_state is DELAYED after the triggering transition"]
        side_effects: ["set scheduled_payout_date = <logical clock date> + 7 days"]
      - from: HELD
        to: SCHEDULED
        trigger: "POST /merchants/{id}/funding-release"
        actor: system
        preconditions: ["payout_state == HELD", "the merchant's funding_state is NORMAL after release"]
        side_effects: ["set scheduled_payout_date = period_end_date + 1 day"]
      - from: SCHEDULED
        to: PAID
        trigger: "POST /settlement-batches/{id}/pay"
        actor: PortfolioController
        preconditions:
          - "payout_state IN {SCHEDULED, DELAYED}"
          - "logical clock date >= scheduled_payout_date"
          - "the merchant's funding_state != HELD"
        side_effects:
          - "set paid_at = logical clock"
          - "recompute Merchant.pending_payout_cents (this batch leaves the pending set)"
      - from: DELAYED
        to: PAID
        trigger: "POST /settlement-batches/{id}/pay"
        actor: PortfolioController
        preconditions:
          - "payout_state == DELAYED"
          - "logical clock date >= scheduled_payout_date"
          - "the merchant's funding_state != HELD"
        side_effects: ["identical to the SCHEDULED -> PAID row"]
      - from: SCHEDULED
        to: REVERSED
        trigger: "POST /settlement-batches/{id}/reverse"
        actor: PortfolioController
        preconditions:
          - "payout_state IN {SCHEDULED, DELAYED, HELD}"
          - "the merchant's ReserveAccount.state != CLOSED"
        side_effects:
          - "set reversed_at = logical clock and reversal_reason_code from the body"
          - "append a RELEASE ReserveLedgerEntry with reason_code BATCH_REVERSAL_RELEASE, amount_cents = this batch's reserve_hold_cents, settlement_batch_id = this batch, effective_date = logical clock date, tranche dates null (skipped when reserve_hold_cents == 0)"
          - "when reserve_offset_cents > 0, append a HOLD entry with reason_code SETTLEMENT_HOLD for amount_cents = reserve_offset_cents to undo the loss offset"
          - "recompute ReserveAccount totals, ReserveAccount.state, Merchant.reserve_balance_cents, Merchant.pending_payout_cents and Merchant.lifetime_reversed_cents"
      - from: DELAYED
        to: REVERSED
        trigger: "POST /settlement-batches/{id}/reverse"
        actor: PortfolioController
        preconditions: ["payout_state == DELAYED", "the merchant's ReserveAccount.state != CLOSED"]
        side_effects: ["identical to the SCHEDULED -> REVERSED row"]
      - from: HELD
        to: REVERSED
        trigger: "POST /settlement-batches/{id}/reverse"
        actor: PortfolioController
        preconditions: ["payout_state == HELD", "the merchant's ReserveAccount.state != CLOSED"]
        side_effects: ["identical to the SCHEDULED -> REVERSED row"]

  - entity: MonitoringAlert
    initial_state: OPEN
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /monitoring-alerts/{id}/review with disposition == ACKNOWLEDGE"
        actor: RiskAnalyst
        preconditions: ["state == OPEN"]
        side_effects: ["set reviewed_by_user_id = X-User-ID and review_note"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /monitoring-alerts/{id}/review with disposition == DISMISS"
        actor: RiskAnalyst
        preconditions: ["state == UNDER_REVIEW"]
        side_effects:
          - "set review_note"
          - "recompute Merchant.open_alert_count"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /monitoring-alerts/{id}/review with disposition == ESCALATE"
        actor: RiskAnalyst
        preconditions: ["state == UNDER_REVIEW"]
        side_effects:
          - "set review_note"
          - "when alert_type IN {CARD_TESTING, LAUNDERING_PATTERN} and the merchant's funding_state IN {NORMAL, DELAYED}, this escalation itself triggers the Merchant funding_state -> HELD transition (cascade ALERT-ESCALATION link 2) with funding_hold_reason_code = CARD_TESTING for CARD_TESTING and SUSPECTED_LAUNDERING for LAUNDERING_PATTERN"
          - "when alert_type == CHARGEBACK_THRESHOLD no funding change occurs; the escalation only records the review"
      - from: ESCALATED
        to: CLOSED
        trigger: "system cascade link 4 of cascade REMEDIATION-PASS"
        actor: system
        preconditions: ["state == ESCALATED", "alert_type == CHARGEBACK_THRESHOLD"]
        side_effects: ["recompute Merchant.open_alert_count"]
      - from: OPEN
        to: CLOSED
        trigger: "system cascade link 4 of cascade TERMINATION-EXEC, caused by account_state -> TERMINATED"
        actor: system
        preconditions: ["state == OPEN", "the merchant's account_state == TERMINATED"]
        side_effects: ["recompute Merchant.open_alert_count"]
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "system cascade link 4 of cascade TERMINATION-EXEC, caused by account_state -> TERMINATED"
        actor: system
        preconditions: ["state == UNDER_REVIEW", "the merchant's account_state == TERMINATED"]
        side_effects: ["recompute Merchant.open_alert_count"]
      - from: ESCALATED
        to: CLOSED
        trigger: "system cascade link 4 of cascade TERMINATION-EXEC, caused by account_state -> TERMINATED"
        actor: system
        preconditions: ["state == ESCALATED", "the merchant's account_state == TERMINATED"]
        side_effects: ["recompute Merchant.open_alert_count"]
      - from: OPEN
        to: OPEN
        trigger: "POST /monitoring-runs (system, re-detection of an already-open alert of the same alert_type for the same merchant)"
        actor: system
        preconditions: ["an alert of the same alert_type with state IN {OPEN, UNDER_REVIEW} already exists for the merchant"]
        side_effects:
          - "increment recurrence_count by 1"
          - "overwrite severity_score, observed_metric_bps and last_detected_on_date"
          - "no new MonitoringAlert row is created"

  - entity: RemediationProgram
    initial_state: DRAFT
    terminal_states: [PASSED, NETWORK_ESCALATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /remediation-programs/{id}/activate"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == DRAFT"
          - "X-User-ID != opened_by_user_id"
          - "the merchant's account_state == RESTRICTED"
        side_effects: ["set activated_by_user_id = X-User-ID"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /remediation-programs/{id}/evaluate-month (non-final month)"
        actor: RiskAnalyst
        preconditions:
          - "state == ACTIVE"
          - "month_index == months_elapsed + 1"
          - "months_elapsed + 1 < monitoring_month_count or the month is non-compliant without breaching the failure ratio"
        side_effects:
          - "increment months_elapsed by 1"
          - "set last_observed_ratio_bps to the month's COUNT_BASED ratio"
          - "set consecutive_compliant_months = consecutive_compliant_months + 1 when the month is compliant, else 0"
        note: "Revision loop: the program stays ACTIVE across successive month evaluations."
      - from: ACTIVE
        to: PASSED
        trigger: "POST /remediation-programs/{id}/evaluate-month"
        actor: RiskAnalyst
        preconditions:
          - "state == ACTIVE"
          - "month_index == months_elapsed + 1"
          - "consecutive_compliant_months after this month >= monitoring_month_count"
        side_effects:
          - "increment months_elapsed, update consecutive_compliant_months and last_observed_ratio_bps"
          - "this pass itself triggers the Merchant account_state RESTRICTED -> ACTIVE transition (cascade REMEDIATION-PASS link 2)"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /remediation-programs/{id}/evaluate-month"
        actor: RiskAnalyst
        preconditions:
          - "state == ACTIVE"
          - "month_index == months_elapsed + 1"
          - "the month's COUNT_BASED ratio >= 180 bps, or months_elapsed after this month >= monitoring_month_count + 2 without passing"
        side_effects:
          - "increment months_elapsed, set consecutive_compliant_months = 0, set last_observed_ratio_bps"
          - "when the evaluated month's chargeback_count >= 100, this failure itself triggers the FAILED -> NETWORK_ESCALATED transition below (cascade REMEDIATION-FAIL link 2)"
      - from: FAILED
        to: NETWORK_ESCALATED
        trigger: "system cascade link 2 of cascade REMEDIATION-FAIL"
        actor: system
        preconditions:
          - "state == FAILED"
          - "the failing month's chargeback_count >= 100"
        side_effects:
          - "set network_program_tier = EXCESSIVE when last_observed_ratio_bps >= 180, else STANDARD"
          - "this escalation itself triggers the Merchant funding_state -> HELD transition with funding_hold_reason_code = EXCESSIVE_CHARGEBACKS (cascade REMEDIATION-FAIL link 3)"

  - entity: TerminationDecision
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /termination-decisions/{id}/approve"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == PROPOSED"
          - "X-User-ID != proposed_by_user_id"
          - "the merchant's account_state != TERMINATED"
        side_effects: ["set approved_by_user_id = X-User-ID"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /termination-decisions/{id}/reject"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == PROPOSED"
          - "X-User-ID != proposed_by_user_id"
        side_effects: ["set rejection_note"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /termination-decisions/{id}/execute"
        actor: PortfolioController
        preconditions:
          - "state == APPROVED"
          - "the merchant's account_state IN {ACTIVE, RESTRICTED}"
          - "the merchant has no RemediationProgram with state IN {DRAFT, ACTIVE}"
        side_effects:
          - "set executed_at = logical clock"
          - "this execution itself triggers the Merchant account_state -> TERMINATED transition (cascade TERMINATION-EXEC link 1 -> 2 -> 3)"
      - from: EXECUTED
        to: REVERSED
        trigger: "system cascade link 2 of cascade APPEAL-GRANT, caused by Appeal -> GRANTED"
        actor: system
        preconditions:
          - "state == EXECUTED"
        side_effects:
          - "set reversed_at = logical clock"
          - "this reversal itself triggers the Merchant account_state TERMINATED -> RESTRICTED transition (cascade APPEAL-GRANT link 3)"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, UPHELD]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/review"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == SUBMITTED"
        side_effects: ["set reviewer_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /appeals/{id}/request-info"
        actor: RiskCommitteeApprover
        preconditions: ["state == UNDER_REVIEW"]
        side_effects: ["set outstanding_info_items to the requested labels"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/respond"
        actor: MerchantUser
        preconditions:
          - "state == INFO_REQUESTED"
          - "X-User-ID equals Appeal.merchant_id"
        side_effects:
          - "clear outstanding_info_items to []"
          - "increment response_round_count by 1"
        note: "Negotiation loop: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat; response_round_count counts the laps."
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/{id}/decide with outcome == GRANT"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == UNDER_REVIEW"
          - "X-User-ID NOT IN {the TerminationDecision's proposed_by_user_id, approved_by_user_id}"
          - "the TerminationDecision state == EXECUTED"
        side_effects:
          - "set decided_at, reinstatement_reserve_pct_bps from the body when supplied"
          - "this grant itself triggers the TerminationDecision EXECUTED -> REVERSED transition (cascade APPEAL-GRANT link 2)"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with outcome == UPHOLD"
        actor: RiskCommitteeApprover
        preconditions:
          - "state == UNDER_REVIEW"
          - "X-User-ID NOT IN {the TerminationDecision's proposed_by_user_id, approved_by_user_id}"
        side_effects:
          - "set decided_at; the merchant remains TERMINATED and its ReserveAccount remains CLOSED"

concurrency_rules:
  - rule_id: credit-assessment-create-stale-application
    parent_entity: MerchantApplication
    write_endpoint: "POST /credit-assessments"
    occ_field: "expected_application_version"
    description: |
      Creating a CreditAssessment against an application whose version has
      advanced since the client last read it is rejected with 412. A new
      assessment legitimately supersedes the prior one (it re-pins the
      application's current_reserve_* fields), so the operation cannot be
      rejected on state grounds; the stale-version check is what protects an
      officer from re-pinning reserve terms computed from a view of the
      application that another writer has already replaced.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: release-request-stale-reserve-account
    parent_entity: ReserveAccount
    write_endpoint: "POST /reserve-accounts/{id}/release-requests"
    occ_field: "expected_reserve_account_version"
    description: |
      Recording a scheduled release against a reserve account whose version has
      advanced since the client last read it is rejected with 412. A second
      release of a still-releasable balance is a legitimate operation, so it
      cannot be rejected on state grounds; the stale-version check is what
      prevents a release sized against a superseded held_balance_cents.
    error_id: ERR_STALE_RESERVE_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: reserve_requirement_determination
    trigger: "POST /credit-assessments (side effect: writes every computed field of the new CreditAssessment and re-pins MerchantApplication.current_assessment_method / current_reserve_pct_bps / current_reserve_cap_cents / current_reserve_type)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - band selection (tiered, closed-open bands)
      credit_band = 'A' if credit_score >= 720 else 'B' if credit_score >= 660
                    else 'C' if credit_score >= 600 else 'D'
      base_reserve_bps = BASE_BY_BAND[credit_band]

      # Step 2 - method-independent uplifts
      thin_file_uplift_bps = THIN_FILE_UPLIFT_BPS if prior_processing_history_months < 6 else 0
      mcc_uplift_bps = rule.reserve_uplift_bps
                       if a ProhibitedCategoryRule with mcc_code == application.mcc_code exists
                          AND that rule.disposition == 'RESTRICTED_REVIEW'
                       else 0

      # Step 3 - method-specific uplift and exposure (the two variants diverge here).
      # Exposure never falls below one average day of requested volume.
      one_day_volume_cents = round_half_up(requested_monthly_volume_cents / 30)
      if method == 'LAG_WEIGHTED':
          lag_uplift_bps = ceil(avg_delivery_lag_days / 7) * LAG_UPLIFT_PER_WEEK_BPS
          chargeback_uplift_bps = 0
          exposure_raw_cents = round_half_up(
              requested_monthly_volume_cents * min(avg_delivery_lag_days, 30) / 30)
      else:   # 'CHARGEBACK_WEIGHTED'
          lag_uplift_bps = 0
          chargeback_uplift_bps = floor(declared_chargeback_ratio_bps * CHARGEBACK_UPLIFT_MULTIPLE)
          exposure_raw_cents = round_half_up(
              requested_monthly_volume_cents * declared_chargeback_ratio_bps / 10000
              * DISPUTE_HORIZON_MULTIPLE)
      exposure_estimate_cents = max(exposure_raw_cents, one_day_volume_cents)

      # Step 4 - clamp (nested min/max over five additive inputs)
      reserve_pct_bps = min(RESERVE_BPS_MAX,
                            max(RESERVE_BPS_MIN,
                                base_reserve_bps + lag_uplift_bps + chargeback_uplift_bps
                                + thin_file_uplift_bps + mcc_uplift_bps))

      # Step 5 - cap. Rounding order is pinned: multiply-then-round ONCE to get the
      # monthly hold, then multiply the rounded integer by CAP_MONTHS.
      monthly_hold_cents = round_half_up(requested_monthly_volume_cents * reserve_pct_bps / 10000)
      reserve_cap_cents = min(monthly_hold_cents * CAP_MONTHS,
                              EXPOSURE_CAP_MULTIPLE * exposure_estimate_cents)

      # Step 6 - mechanics selection
      reserve_type = 'ROLLING' if reserve_pct_bps < ROLLING_CEILING_BPS else 'CAPPED'
    input_set: "Exactly one MerchantApplication (state must be UNDERWRITING) plus the single ProhibitedCategoryRule whose mcc_code equals the application's mcc_code, if any. No other application's data participates."
    constants:
      BASE_BY_BAND: { A: 50, B: 500, C: 900, D: 1500 }   # band A alone is below RESERVE_BPS_MIN, so the lower clamp is live
      THIN_FILE_UPLIFT_BPS: 300
      LAG_UPLIFT_PER_WEEK_BPS: 150
      CHARGEBACK_UPLIFT_MULTIPLE: 3
      DISPUTE_HORIZON_MULTIPLE: 4
      RESERVE_BPS_MIN: 100
      RESERVE_BPS_MAX: 2500
      CAP_MONTHS: 6
      EXPOSURE_CAP_MULTIPLE: 2
      ROLLING_CEILING_BPS: 1000
    precision: "all money in integer cents; all percentages in integer basis points; round_half_up at each explicitly-marked round_half_up() call and nowhere else"
    variants:
      - name: LAG_WEIGHTED
        when: "method == LAG_WEIGHTED; the forward-looking view that prices unshipped-goods exposure"
        difference: "Uplift is driven by delivery lag (ceil(lag/7) * 150 bps) and exposure is the projected in-flight share of a month's volume (volume * min(lag,30)/30). Ignores declared_chargeback_ratio_bps entirely."
      - name: CHARGEBACK_WEIGHTED
        when: "method == CHARGEBACK_WEIGHTED; the historical view that prices realized dispute experience"
        difference: "Uplift is driven by declared history (floor(declared_chargeback_ratio_bps * 3) bps) and exposure is the dispute horizon (volume * ratio/10000 * 4). Ignores avg_delivery_lag_days entirely. For identical application inputs the two variants return different reserve_pct_bps, exposure_estimate_cents, reserve_cap_cents and often a different reserve_type."

  - name: rolling_chargeback_ratio
    trigger: "POST /merchant-day-activity (recompute with W_end = the ingested row's business_date), POST /monitoring-runs (recompute with W_end = the run's as_of_date), POST /portfolio-forecasts (recompute with W_end = the forecast's as_of_date). Each of these writes Merchant.metrics_as_of_date, trailing_30d_txn_count, trailing_30d_volume_cents, trailing_30d_chargeback_count, trailing_30d_chargeback_amount_cents, rolling_chargeback_ratio_bps and amount_based_chargeback_ratio_bps."
    algorithm: aggregation
    formula: |
      W_end   = the caller-supplied window end date (see trigger)
      W_start = W_end - 29 days
      rows = MerchantDayActivity where merchant_id == m.id
                                  AND W_start <= business_date <= W_end   # both bounds inclusive
      trailing_30d_txn_count               = sum(rows.txn_count)
      trailing_30d_volume_cents            = sum(rows.volume_cents)
      trailing_30d_chargeback_count        = sum(rows.chargeback_count)
      trailing_30d_chargeback_amount_cents = sum(rows.chargeback_amount_cents)

      rolling_chargeback_ratio_bps = 0 if trailing_30d_txn_count == 0 else
          round_half_up(trailing_30d_chargeback_count * 10000 / trailing_30d_txn_count)
      amount_based_chargeback_ratio_bps = 0 if trailing_30d_volume_cents == 0 else
          round_half_up(trailing_30d_chargeback_amount_cents * 10000 / trailing_30d_volume_cents)
      metrics_as_of_date = W_end
    input_set: "All MerchantDayActivity rows of the merchant whose business_date lies in the inclusive 30-day window; no state filter applies because activity rows have no lifecycle. Rows outside the window are excluded even if they are the merchant's only activity."
    constants:
      WINDOW_DAYS: 30
      EARLY_WARNING_BPS: 65
      EXCESSIVE_BPS: 90
    precision: "integer basis points, round_half_up; zero-denominator yields exactly 0, never an error"
    variants:
      - name: COUNT_BASED
        when: "Threshold gating: the CHARGEBACK_THRESHOLD detector, the RemediationProgram monthly evaluation, and every account_state cascade read this variant only."
        difference: "Numerator/denominator are counts (chargeback_count / txn_count). This is the network-standard measure and the ONLY variant that may restrict an account."
      - name: AMOUNT_BASED
        when: "Loss forecasting: portfolio_loss_forecast reads this variant only."
        difference: "Numerator/denominator are amounts (chargeback_amount_cents / volume_cents). For identical activity rows it returns a different basis-point value than COUNT_BASED whenever the average charged-back ticket differs from the average approved ticket, so a merchant may sit below EXCESSIVE_BPS on COUNT_BASED while its AMOUNT_BASED value exceeds it."

  - name: settlement_reserve_hold_and_payout_waterfall
    trigger: "POST /settlement-batches (writes day_line_count, reserve_hold_cents, loss_offset_from_settlement_cents, reserve_offset_cents, uncovered_loss_cents, net_payout_cents, payout_state, scheduled_payout_date; appends ReserveLedgerEntry rows; recomputes ReserveAccount totals and state, Merchant.reserve_balance_cents and Merchant.pending_payout_cents)"
    algorithm: waterfall_allocation
    formula: |
      lines = MerchantDayActivity where merchant_id == batch.merchant_id
                                    AND period_start_date <= business_date <= period_end_date
              ordered by business_date ASC
      day_line_count = count(lines)
      pct = ReserveAccount.reserve_pct_bps        # of the batch merchant's reserve account

      # ROUNDING ORDER IS PINNED: round each day line, THEN sum the rounded integers.
      # "sum the volumes, then round once" is explicitly NOT the rule and yields a
      # different number of cents whenever two or more lines round up.
      raw_hold_cents = sum over lines of round_half_up(line.volume_cents * pct / 10000)

      if ReserveAccount.reserve_type == 'CAPPED':
          remaining_capacity_cents = max(0, reserve_cap_cents - held_balance_cents)
          reserve_hold_cents = min(raw_hold_cents, remaining_capacity_cents)
      else:
          reserve_hold_cents = raw_hold_cents

      # Waterfall: bucket 1 = reserve, bucket 2 = settlement funds, bucket 3 = reserve balance
      loss_total_cents                  = sum(lines.chargeback_amount_cents)
      available_for_loss_cents          = max(0, gross_volume_cents - reserve_hold_cents)
      loss_offset_from_settlement_cents = min(loss_total_cents, available_for_loss_cents)
      deficit_cents                     = loss_total_cents - loss_offset_from_settlement_cents
      reserve_offset_cents              = min(deficit_cents, held_balance_cents + reserve_hold_cents)
      uncovered_loss_cents              = deficit_cents - reserve_offset_cents
      net_payout_cents                  = available_for_loss_cents - loss_offset_from_settlement_cents

      # Ledger append order is pinned: HOLD first, then OFFSET_LOSS.
      append HOLD entry (reason_code SETTLEMENT_HOLD, amount_cents = reserve_hold_cents,
             effective_date = period_end_date, settlement_batch_id = batch.id) when reserve_hold_cents > 0
      append OFFSET_LOSS entry (reason_code LOSS_OFFSET, amount_cents = reserve_offset_cents,
             effective_date = <logical clock date>, settlement_batch_id = batch.id) when reserve_offset_cents > 0

      payout_state / scheduled_payout_date by the merchant's funding_state at creation:
          NORMAL  -> SCHEDULED, scheduled_payout_date = period_end_date + 1 day
          DELAYED -> DELAYED,   scheduled_payout_date = period_end_date + delayed_payout_days days
          HELD    -> HELD,      scheduled_payout_date = null

      PER-BATCH INVARIANT (must hold at all times):
          gross_volume_cents == net_payout_cents + reserve_hold_cents
                                + loss_offset_from_settlement_cents
    input_set: "MerchantDayActivity rows of the batch's merchant whose business_date is inside the inclusive settlement period; the merchant's single ReserveAccount for pct, type, cap and current held balance. Activity rows outside the period never contribute, even if unsettled."
    constants:
      NORMAL_PAYOUT_LAG_DAYS: 1
      DELAYED_PAYOUT_LAG_DAYS: 7
      VOLUME_LIMIT_TOLERANCE_BPS: 12500
    precision: "integer cents; round_half_up per day line; no rounding is applied to any sum"
    variants: []

  - name: reserve_release_eligibility
    trigger: "POST /reserve-accounts/{id}/release-requests (validates the request, then appends the RELEASE entry and recomputes ReserveAccount.released_to_date_cents, held_balance_cents, last_release_tranche_end_date, state and Merchant.reserve_balance_cents); also read by GET /reserve-accounts/{id} and reported as reserve_releasable_cents by GET /merchants/{id}/risk-summary"
    algorithm: threshold
    formula: |
      release_lag_days = 90 if reserve_type == 'ROLLING' else 180
      cutoff_date      = <logical clock date> - release_lag_days days
      matured_hold_cents = sum(amount_cents of HOLD entries of this account
                               whose effective_date <= cutoff_date)      # inclusive boundary
      releasable_balance_cents = max(0,
          min(held_balance_cents,
              matured_hold_cents - released_to_date_cents - offset_to_date_cents))

      # Tranche geometry: CLOSED interval [tranche_start_date, tranche_end_date]
      # with a mandatory cooling buffer AFTER the previous scheduled release.
      prior = the ReserveLedgerEntry of this account with entry_type == 'RELEASE'
              AND reason_code == 'SCHEDULED_RELEASE' having the greatest effective_date;
              when two share that effective_date, the one with the greater created_at wins
      cooling_ok = (prior is null) or
                   (tranche_start_date >= prior.tranche_end_date + RELEASE_COOLING_DAYS + 1 days)

      accept when: cooling_ok
                   AND tranche_start_date <= tranche_end_date
                   AND tranche_end_date <= <logical clock date>
                   AND releasable_balance_cents > 0
                   AND amount_cents <= releasable_balance_cents

      CONSERVATION INVARIANT (must hold after every ledger append):
          total_accrued_cents == held_balance_cents + released_to_date_cents + offset_to_date_cents
    input_set: "All ReserveLedgerEntry rows of the one reserve account; HOLD maturity is filtered by effective_date only (never by created_at), and RELEASE/OFFSET_LOSS rows are subtracted in full regardless of maturity."
    constants:
      ROLLING_RELEASE_LAG_DAYS: 90
      CAPPED_RELEASE_LAG_DAYS: 180
      RELEASE_COOLING_DAYS: 30
    precision: "integer cents; date arithmetic in whole calendar days, UTC"
    variants: []

  - name: monitoring_detector_evaluation
    trigger: "POST /monitoring-runs (creates or re-detects MonitoringAlert rows and fires the CB-BREACH cascade)"
    algorithm: weighted_scoring
    formula: |
      merchants = Merchant where account_state IN {ACTIVE, RESTRICTED}, ordered created_at ASC
      for each merchant, in that order:
        recompute rolling_chargeback_ratio (both variants) with W_end = as_of_date
        today = the MerchantDayActivity row with business_date == as_of_date, else null
        baseline rows  = MerchantDayActivity in [as_of_date - 30 days, as_of_date - 1 day]
        baseline_avg_daily_volume_cents = round_half_up(sum(baseline.volume_cents) / 30)
        baseline_avg_ticket_cents = 0 if sum(baseline.txn_count) == 0 else
                                    round_half_up(sum(baseline.volume_cents) / sum(baseline.txn_count))

        # Detectors are evaluated in this pinned order; each may raise at most one alert.
        # 1) CHARGEBACK_THRESHOLD (does not need a `today` row)
        r = rolling_chargeback_ratio_bps            # COUNT_BASED variant only
        if r >= EARLY_WARNING_BPS:
            severity_score = 90 if r >= EXCESSIVE_BPS else 60
            observed_metric_bps = r
            raise CHARGEBACK_THRESHOLD
            if severity_score >= 90 and account_state == ACTIVE:
                fire cascade CB-BREACH (account_state ACTIVE -> RESTRICTED)

        # detectors 2-4 are skipped entirely when `today` is null
        # 2) VELOCITY_SPIKE
        if today and baseline_avg_daily_volume_cents > 0
           and today.volume_cents >= SPIKE_MULTIPLE * baseline_avg_daily_volume_cents:
            observed_metric_bps = round_half_up(today.volume_cents * 10000
                                                / baseline_avg_daily_volume_cents)
            severity_score = min(100, 20 + floor(observed_metric_bps / 1000))
            raise VELOCITY_SPIKE

        # 3) CARD_TESTING - all five conditions required
        if today and today.txn_count > 0
           and today.decline_count >= CARD_TESTING_MIN_DECLINES
           and round_half_up(today.decline_count * 10000
                             / (today.txn_count + today.decline_count)) >= DECLINE_RATIO_BPS_MIN
           and round_half_up(today.distinct_card_count * 10000 / today.txn_count) >= CARD_RATIO_BPS_MIN
           and today.avg_ticket_cents <= MICRO_TICKET_CENTS_MAX:
            observed_metric_bps = round_half_up(today.decline_count * 10000
                                                / (today.txn_count + today.decline_count))
            severity_score = 85
            raise CARD_TESTING

        # 4) LAUNDERING_PATTERN - additive weighted score
        score = 0
        if today and today.txn_count > 0 and
           round_half_up(today.cross_border_count * 10000 / today.txn_count) >= 5000: score += 30
        if today and today.volume_cents > 0 and
           round_half_up(today.refund_cents * 10000 / today.volume_cents) >= 3000:    score += 25
        if today and today.txn_count >= 100 and today.unique_bin_count <= 3:          score += 25
        if today and baseline_avg_ticket_cents > 0
           and today.avg_ticket_cents >= 5 * baseline_avg_ticket_cents:               score += 20
        if score >= LAUNDERING_SCORE_MIN:
            severity_score = score
            observed_metric_bps = score * 100
            raise LAUNDERING_PATTERN

      "raise X" means: when a MonitoringAlert with the same merchant_id and alert_type
      already has state IN {OPEN, UNDER_REVIEW}, take the OPEN -> OPEN re-detection
      transition (recurrence_count += 1, severity/observed/last_detected refreshed) and
      create nothing; otherwise INSERT a new alert with state OPEN, recurrence_count 1,
      detected_on_date = last_detected_on_date = as_of_date.
      Finally set Merchant.last_monitoring_run_date = as_of_date and recompute open_alert_count.
    input_set: "Merchants with account_state IN {ACTIVE, RESTRICTED} only - TERMINATED merchants are never evaluated and never receive alerts. Baseline excludes as_of_date itself; the CHARGEBACK_THRESHOLD window includes it."
    constants:
      SPIKE_MULTIPLE: 3
      CARD_TESTING_MIN_DECLINES: 50
      DECLINE_RATIO_BPS_MIN: 4000
      CARD_RATIO_BPS_MIN: 8000
      MICRO_TICKET_CENTS_MAX: 500
      LAUNDERING_SCORE_MIN: 55
      BASELINE_DAYS: 30
    precision: "integer basis points and integer severity 0..100, round_half_up; baseline denominator is the fixed constant 30, never the count of observed rows"
    variants: []

  - name: remediation_month_evaluation
    trigger: "POST /remediation-programs/{id}/evaluate-month (writes months_elapsed, consecutive_compliant_months, last_observed_ratio_bps, state, network_program_tier and fires the REMEDIATION-PASS or REMEDIATION-FAIL cascade)"
    algorithm: chronological
    formula: |
      month_start = window_start_date + (month_index - 1) * MONTH_DAYS days
      month_end   = window_start_date + month_index * MONTH_DAYS days - 1 day   # inclusive
      rows = MerchantDayActivity of the program's merchant with
             month_start <= business_date <= month_end
      month_txn_count = sum(rows.txn_count)
      month_cb_count  = sum(rows.chargeback_count)
      observed_ratio_bps = 0 if month_txn_count == 0 else
                           round_half_up(month_cb_count * 10000 / month_txn_count)
      compliant = observed_ratio_bps < target_ratio_bps        # STRICTLY less than

      months_elapsed += 1
      consecutive_compliant_months = consecutive_compliant_months + 1 if compliant else 0
      last_observed_ratio_bps = observed_ratio_bps

      if observed_ratio_bps >= FAIL_RATIO_BPS
         or (not compliant and months_elapsed >= monitoring_month_count + MAX_GRACE_MONTHS):
          state = FAILED           # then REMEDIATION-FAIL cascade when month_cb_count >= 100
      elif consecutive_compliant_months >= monitoring_month_count:
          state = PASSED           # then REMEDIATION-PASS cascade
      else:
          state = ACTIVE           # self-loop, awaiting the next month
    input_set: "Only the activity rows inside the evaluated 30-day month of the program's own merchant. Months are fixed 30-day blocks measured from window_start_date, never calendar months, and a month with zero transactions is compliant (ratio 0)."
    constants:
      MONTH_DAYS: 30
      FAIL_RATIO_BPS: 180
      MAX_GRACE_MONTHS: 2
      NETWORK_COUNT_MIN: 100
    precision: "integer basis points, round_half_up"
    variants: []

  - name: portfolio_loss_forecast
    trigger: "POST /portfolio-forecasts (writes every computed field of the new PortfolioForecast)"
    algorithm: constraint_propagation
    formula: |
      # The evaluation ORDER below is normative. reserve_adequacy_ratio_bps selects the
      # tier that sizes required_additional_reserve_cents, and adding that reserve would
      # change the adequacy ratio - so the ratio is frozen at step 5 and the post-uplift
      # ratio is reported separately at step 8. Recomputing the tier from step 8 (or
      # iterating to a fixed point) is explicitly wrong.
      merchants = Merchant where account_state IN {ACTIVE, RESTRICTED}, ordered created_at ASC

      # step 0 - refresh trailing metrics of every included merchant with W_end = as_of_date
      # step 1 - per-merchant probability of default from the AMOUNT_BASED ratio variant
      for m in merchants:
        a = m.amount_based_chargeback_ratio_bps
        pd_bps = 100 if a < 65 else 300 if a < 90 else 900 if a < 180 else 2000
        if m.account_state == 'RESTRICTED': pd_bps += RESTRICTED_PD_PENALTY_BPS
        if method == 'STRESSED':
            pd_bps = min(10000, round_half_up(pd_bps * stress_multiplier_bps / 10000))
        # step 2 - unpaid exposure: one single round after BOTH percentage factors
        m_unpaid = sum(SettlementBatch.net_payout_cents of m
                       where payout_state IN {SCHEDULED, DELAYED, HELD})
        m_gross_loss = round_half_up(m_unpaid * pd_bps / 10000 * LGD_BPS / 10000)
        m_held = m.ReserveAccount.held_balance_cents
        m_net_loss = max(0, m_gross_loss - m_held)          # floored PER MERCHANT

      # step 3 - portfolio roll-up
      merchant_count             = count(merchants)
      unpaid_exposure_cents      = sum(m_unpaid)
      gross_expected_loss_cents  = sum(m_gross_loss)
      net_expected_loss_cents    = sum(m_net_loss)
      total_reserve_held_cents   = sum(m_held)
      # step 4
      coverage_gap_cents = max(0, gross_expected_loss_cents - total_reserve_held_cents)
      # step 5 - FROZEN adequacy ratio
      reserve_adequacy_ratio_bps = 0 if gross_expected_loss_cents == 0 else
          round_half_up(total_reserve_held_cents * 10000 / gross_expected_loss_cents)
      # step 6 - tier selection reads ONLY step 5
      required_additional_reserve_cents =
          0                                                if reserve_adequacy_ratio_bps >= 10000
          else round_half_up(coverage_gap_cents * 2500 / 10000) if reserve_adequacy_ratio_bps >= 7500
          else coverage_gap_cents
      # step 7/8 - report the post-uplift ratio without re-entering step 6
      projected_adequacy_ratio_bps = 0 if gross_expected_loss_cents == 0 else
          round_half_up((total_reserve_held_cents + required_additional_reserve_cents)
                        * 10000 / gross_expected_loss_cents)
    input_set: "Merchants with account_state IN {ACTIVE, RESTRICTED} (TERMINATED excluded even when they still hold reserve); per merchant, SettlementBatch rows with payout_state IN {SCHEDULED, DELAYED, HELD} (PAID and REVERSED excluded) and the single ReserveAccount's held_balance_cents."
    constants:
      LGD_BPS: 6000
      RESTRICTED_PD_PENALTY_BPS: 500
      PD_TIERS_BY_AMOUNT_RATIO_BPS: { "<65": 100, "65..<90": 300, "90..<180": 900, ">=180": 2000 }
      ADEQUACY_FULL_BPS: 10000
      ADEQUACY_PARTIAL_BPS: 7500
      PARTIAL_UPLIFT_BPS: 2500
    precision: "integer cents and integer basis points; exactly one round_half_up per formula line as written"
    variants:
      - name: EXPECTED_LOSS
        when: "method == EXPECTED_LOSS; the base regulatory view"
        difference: "pd_bps is taken straight from the tier table (plus the RESTRICTED penalty). stress_multiplier_bps is ignored even when supplied."
      - name: STRESSED
        when: "method == STRESSED; the capital-planning view"
        difference: "pd_bps is scaled by stress_multiplier_bps and capped at 10000 before the loss computation, so gross_expected_loss_cents, net_expected_loss_cents, reserve_adequacy_ratio_bps, required_additional_reserve_cents and the selected adequacy tier can all differ from EXPECTED_LOSS on identical portfolio data."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query schema: required fields present, enum members valid, numeric ranges and string formats respected, limit in 1..100, offset >= 0, dates well-formed YYYY-MM-DD"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every MerchantApplication referenced in the path or body exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming an application in the path or body (including supersedes_application_id)"
  - priority: 5
    category: existence
    check: "every BeneficialOwner referenced in the path exists"
    error_id: ERR_OWNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /beneficial-owners/{id}/screen"
  - priority: 6
    category: existence
    check: "every Merchant referenced in the path or body exists"
    error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a merchant in the path or body"
  - priority: 7
    category: existence
    check: "every ReserveAccount referenced in the path exists"
    error_id: ERR_RESERVE_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /reserve-accounts/{id}, GET /reserve-accounts/{id}/ledger-entries, POST /reserve-accounts/{id}/release-requests"
  - priority: 8
    category: existence
    check: "every SettlementBatch referenced in the path exists"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST endpoints under /settlement-batches/{id}"
  - priority: 9
    category: existence
    check: "every MonitoringAlert, RemediationProgram, TerminationDecision, Appeal or PortfolioForecast referenced in the path or body exists"
    error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    applies_to: "POST /monitoring-alerts/{id}/review (alert); the sibling not-found rows at priorities 10-13 cover the other four types"
  - priority: 10
    category: existence
    check: "every RemediationProgram referenced in the path exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /remediation-programs/{id}"
  - priority: 11
    category: existence
    check: "every TerminationDecision referenced in the path or body exists"
    error_id: ERR_TERMINATION_DECISION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /termination-decisions/{id}; POST /appeals (termination_decision_id)"
  - priority: 12
    category: existence
    check: "every Appeal referenced in the path exists"
    error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /appeals/{id}"
  - priority: 13
    category: existence
    check: "every PortfolioForecast referenced in the path exists"
    error_id: ERR_FORECAST_NOT_FOUND
    http_status: 404
    applies_to: "GET /portfolio-forecasts/{id}"
  - priority: 14
    category: auth
    check: "for entity_backed roles, X-User-ID equals the id of the resource being acted on: Applicant's X-User-ID equals the MerchantApplication.id in the path or the body's application_id, MerchantUser's X-User-ID equals the Merchant.id in the path or the body's merchant_id. Exception: POST /merchant-applications has no owning application yet, so the check applies there only when supersedes_application_id is supplied, in which case X-User-ID must equal that superseded application's id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Applicant and MerchantUser endpoints"
  - priority: 15
    category: state
    check: "expected_application_version equals the current MerchantApplication.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /credit-assessments"
  - priority: 16
    category: state
    check: "expected_reserve_account_version equals the current ReserveAccount.version"
    error_id: ERR_STALE_RESERVE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /reserve-accounts/{id}/release-requests"
  - priority: 17
    category: state
    check: "the MerchantApplication is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /merchant-applications/{id}/* , POST /business-verifications, POST /beneficial-owners, POST /beneficial-owners/{id}/screen, POST /credit-assessments"
  - priority: 18
    category: state
    check: "the Merchant's account_state permits the operation (activity ingest, settlement, reserve release and remediation all require account_state != TERMINATED; reserve release additionally requires ACTIVE)"
    error_id: ERR_MERCHANT_ACCOUNT_STATE_INVALID
    http_status: 409
    applies_to: "POST /merchant-day-activity, POST /settlement-batches, POST /reserve-accounts/{id}/release-requests, POST /remediation-programs, POST /termination-decisions, POST /termination-decisions/{id}/execute"
  - priority: 19
    category: state
    check: "the Merchant's funding_state permits the operation (funding-holds requires NORMAL or DELAYED; funding-release requires HELD; reserve release requires NORMAL)"
    error_id: ERR_FUNDING_STATE_INVALID
    http_status: 409
    applies_to: "POST /merchants/{id}/funding-holds, POST /merchants/{id}/funding-release, POST /reserve-accounts/{id}/release-requests"
  - priority: 20
    category: state
    check: "the ReserveAccount.state != CLOSED"
    error_id: ERR_RESERVE_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "POST /reserve-accounts/{id}/release-requests, POST /settlement-batches, POST /settlement-batches/{id}/reverse"
  - priority: 21
    category: state
    check: "the SettlementBatch is in a payout_state from which the requested transition is declared (pay from SCHEDULED or DELAYED; reverse from SCHEDULED, DELAYED or HELD)"
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /settlement-batches/{id}/pay, POST /settlement-batches/{id}/reverse"
  - priority: 22
    category: state
    check: "the MonitoringAlert state permits the requested disposition (ACKNOWLEDGE from OPEN; DISMISS or ESCALATE from UNDER_REVIEW)"
    error_id: ERR_ALERT_STATE_INVALID
    http_status: 409
    applies_to: "POST /monitoring-alerts/{id}/review"
  - priority: 23
    category: state
    check: "the RemediationProgram state permits the operation (activate from DRAFT; evaluate-month from ACTIVE); and executing a TerminationDecision requires that the merchant have no RemediationProgram with state IN {DRAFT, ACTIVE}"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /remediation-programs/{id}/activate, POST /remediation-programs/{id}/evaluate-month, POST /termination-decisions/{id}/execute"
  - priority: 24
    category: state
    check: "the TerminationDecision state permits the operation (approve/reject from PROPOSED; execute from APPROVED)"
    error_id: ERR_TERMINATION_STATE_INVALID
    http_status: 409
    applies_to: "endpoints under /termination-decisions/{id}"
  - priority: 25
    category: state
    check: "the Appeal state permits the operation (review from SUBMITTED; request-info and decide from UNDER_REVIEW; respond from INFO_REQUESTED)"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "endpoints under /appeals/{id}"
  - priority: 26
    category: business_safety
    check: "the application's mcc_disposition != PROHIBITED"
    error_id: ERR_PROHIBITED_BUSINESS_CATEGORY
    http_status: 422
    applies_to: "POST /merchant-applications/{id}/advance-to-underwriting"
  - priority: 27
    category: business_safety
    check: "no BeneficialOwner of the application has status == SANCTIONS_HIT"
    error_id: ERR_SANCTIONED_BENEFICIAL_OWNER
    http_status: 422
    applies_to: "POST /merchant-applications/{id}/advance-to-underwriting"
  - priority: 28
    category: business_safety
    check: "no BeneficialOwner of the application has status == PENDING"
    error_id: ERR_OWNER_SCREENING_INCOMPLETE
    http_status: 409
    applies_to: "POST /merchant-applications/{id}/advance-to-underwriting"
  - priority: 29
    category: business_safety
    check: "segregation of duties: the approving X-User-ID differs from the proposing X-User-ID (termination approve/reject), the activating X-User-ID differs from opened_by_user_id (remediation activate), and the appeal-deciding X-User-ID is neither proposed_by_user_id nor approved_by_user_id of the appealed decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /termination-decisions/{id}/approve, POST /termination-decisions/{id}/reject, POST /remediation-programs/{id}/activate, POST /appeals/{id}/decide"
  - priority: 30
    category: business_constraint
    check: "owner_ownership_pct_total >= 75.00"
    error_id: ERR_OWNERSHIP_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /merchant-applications/{id}/advance-to-underwriting"
  - priority: 31
    category: business_constraint
    check: "the BusinessVerification with the greatest attempt_index for the application exists and has status == PASSED"
    error_id: ERR_VERIFICATION_NOT_PASSED
    http_status: 409
    applies_to: "POST /merchant-applications/{id}/advance-to-underwriting"
  - priority: 32
    category: business_referential
    check: "at least one CreditAssessment exists for the application"
    error_id: ERR_CREDIT_ASSESSMENT_REQUIRED
    http_status: 409
    applies_to: "POST /merchant-applications/{id}/decision"
  - priority: 33
    category: business_referential
    check: "at least one BeneficialOwner exists for the application"
    error_id: ERR_BENEFICIAL_OWNERS_REQUIRED
    http_status: 409
    applies_to: "POST /merchant-applications/{id}/submit"
  - priority: 34
    category: business_referential
    check: "when supersedes_application_id is supplied, that application's state == APPROVED and the Merchant onboarded from it has account_state == TERMINATED"
    error_id: ERR_SUPERSEDED_APPLICATION_INVALID
    http_status: 409
    applies_to: "POST /merchant-applications"
  - priority: 35
    category: business_referential
    check: "the appealed TerminationDecision has state == EXECUTED and its merchant_id equals the appeal's merchant_id"
    error_id: ERR_APPEAL_DECISION_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 36
    category: business_referential
    check: "the merchant's remediation_required == true"
    error_id: ERR_REMEDIATION_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /remediation-programs"
  - priority: 37
    category: business_temporal
    check: "business_date <= the logical clock date"
    error_id: ERR_ACTIVITY_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /merchant-day-activity"
  - priority: 38
    category: business_temporal
    check: "as_of_date <= logical clock date AND as_of_date >= the greatest Merchant.last_monitoring_run_date across the portfolio"
    error_id: ERR_MONITORING_RUN_DATE_REGRESSION
    http_status: 409
    applies_to: "POST /monitoring-runs"
  - priority: 39
    category: business_temporal
    check: "the requested half-open window [window_start_date, window_end_date) does not overlap the window of any RemediationProgram of the same merchant whose state IN {DRAFT, ACTIVE}; touching endpoints (new.start == existing.end) do not overlap"
    error_id: ERR_REMEDIATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /remediation-programs"
  - priority: 40
    category: business_temporal
    check: "tranche_start_date >= previous SCHEDULED_RELEASE tranche_end_date + 31 days, tranche_start_date <= tranche_end_date, and tranche_end_date <= the logical clock date"
    error_id: ERR_RELEASE_TRANCHE_COOLING_VIOLATION
    http_status: 409
    applies_to: "POST /reserve-accounts/{id}/release-requests"
  - priority: 41
    category: business_temporal
    check: "the logical clock date is at most 30 days after the appealed decision's executed_at date"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 42
    category: business_temporal
    check: "period_start_date <= period_end_date and period_end_date <= the logical clock date"
    error_id: ERR_SETTLEMENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /settlement-batches"
  - priority: 43
    category: business_temporal
    check: "the closed period [period_start_date, period_end_date] does not intersect the period of any SettlementBatch of the same merchant whose payout_state != REVERSED; a single shared endpoint date is already an intersection"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /settlement-batches"
  - priority: 44
    category: business_temporal
    check: "the logical clock date >= scheduled_payout_date"
    error_id: ERR_PAYOUT_NOT_DUE
    http_status: 409
    applies_to: "POST /settlement-batches/{id}/pay"
  - priority: 45
    category: business_constraint
    check: "(merchant_id, business_date) is unique across MerchantDayActivity"
    error_id: ERR_DUPLICATE_ACTIVITY_DATE
    http_status: 409
    applies_to: "POST /merchant-day-activity"
  - priority: 46
    category: business_constraint
    check: "mcc_code is unique across ProhibitedCategoryRule"
    error_id: ERR_DUPLICATE_CATEGORY_RULE
    http_status: 409
    applies_to: "POST /prohibited-category-rules"
  - priority: 47
    category: business_constraint
    check: "no Appeal with state IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} already exists for the same termination_decision_id"
    error_id: ERR_DUPLICATE_APPEAL
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 48
    category: business_constraint
    check: "month_index == months_elapsed + 1"
    error_id: ERR_MONTH_INDEX_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /remediation-programs/{id}/evaluate-month"
  - priority: 49
    category: business_constraint
    check: "at least one MerchantDayActivity row exists inside the settlement period"
    error_id: ERR_EMPTY_SETTLEMENT_PERIOD
    http_status: 409
    applies_to: "POST /settlement-batches"
  - priority: 50
    category: business_constraint
    check: "gross_volume_cents equals the sum of MerchantDayActivity.volume_cents over the settlement period"
    error_id: ERR_GROSS_VOLUME_MISMATCH
    http_status: 422
    applies_to: "POST /settlement-batches"
  - priority: 51
    category: business_fiscal
    check: "the merchant's trailing_30d_volume_cents measured with W_end = period_end_date is at most monthly_volume_limit_cents * 12500 / 10000"
    error_id: ERR_MONTHLY_VOLUME_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /settlement-batches"
  - priority: 52
    category: business_fiscal
    check: "releasable_balance_cents > 0"
    error_id: ERR_NO_RELEASABLE_BALANCE
    http_status: 409
    applies_to: "POST /reserve-accounts/{id}/release-requests"
  - priority: 53
    category: business_fiscal
    check: "amount_cents <= releasable_balance_cents"
    error_id: ERR_RELEASE_AMOUNT_EXCEEDS_RELEASABLE
    http_status: 422
    applies_to: "POST /reserve-accounts/{id}/release-requests"

endpoints:
  # ---------- underwriting configuration ----------
  - method: POST
    path: "/prohibited-category-rules"
    description: "Register an MCC screening rule. PROHIBITED blocks underwriting advancement; RESTRICTED_REVIEW contributes reserve_uplift_bps to the credit assessment."
    roles: [UnderwritingOfficer]
    code: 201
    input: [mcc_code, category, disposition, "reserve_uplift_bps?"]
    output: ProhibitedCategoryRule
    side_effects: ["recompute mcc_disposition on every MerchantApplication in DRAFT or SUBMITTED whose mcc_code matches"]
  - method: GET
    path: "/prohibited-category-rules"
    description: "List MCC screening rules, ordered mcc_code ASC."
    roles: [UnderwritingOfficer, RiskAnalyst, PortfolioController]
    code: 200
    input: ["disposition?", "limit?", "offset?"]
    output: ProhibitedCategoryRule[]
    side_effects: []

  # ---------- application intake ----------
  - method: POST
    path: "/merchant-applications"
    description: "Create a DRAFT merchant application. supersedes_application_id links a re-application after a prior termination."
    roles: [Applicant]
    code: 201
    input: [legal_business_name, tax_id, mcc_code, country_code, requested_monthly_volume_cents, average_ticket_cents, avg_delivery_lag_days, declared_chargeback_ratio_bps, prior_processing_history_months, credit_score, "supersedes_application_id?"]
    output: MerchantApplication
    side_effects: ["set state DRAFT", "set mcc_disposition from the matching ProhibitedCategoryRule (ALLOWED when no rule matches)", "set owner_ownership_pct_total 0.00"]
  - method: GET
    path: "/merchant-applications/{id}"
    description: "Fetch one application including mcc_disposition, owner_ownership_pct_total and the pinned current_reserve_* fields."
    roles: [Applicant, UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: []
    output: MerchantApplication
    side_effects: []
  - method: GET
    path: "/merchant-applications"
    description: "List applications, ordered created_at ASC."
    roles: [UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "mcc_code?", "limit?", "offset?"]
    output: MerchantApplication[]
    side_effects: []
  - method: GET
    path: "/merchant-applications/{id}/superseding-applications"
    description: "Re-applications that name this application in supersedes_application_id (FK reverse), ordered created_at ASC."
    roles: [UnderwritingOfficer, RiskAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: MerchantApplication[]
    side_effects: []
  - method: POST
    path: "/beneficial-owners"
    description: "Attach a beneficial owner to a DRAFT application."
    roles: [Applicant]
    code: 201
    input: [application_id, full_name, ownership_pct, country_code, date_of_birth, government_id_last4]
    output: BeneficialOwner
    side_effects: ["set status PENDING", "recompute MerchantApplication.owner_ownership_pct_total as the sum of ownership_pct over all owners of the application"]
  - method: GET
    path: "/merchant-applications/{id}/beneficial-owners"
    description: "Owners of an application (FK reverse), ordered created_at ASC."
    roles: [Applicant, UnderwritingOfficer, RiskAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BeneficialOwner[]
    side_effects: []
  - method: POST
    path: "/merchant-applications/{id}/submit"
    description: "Applicant submits the application for verification. Also the resubmission entry point from INFO_REQUESTED."
    roles: [Applicant]
    code: 200
    input: []
    output: MerchantApplication
    side_effects: ["state DRAFT -> SUBMITTED or INFO_REQUESTED -> SUBMITTED", "clear outstanding_info_items to []", "recompute owner_ownership_pct_total and mcc_disposition"]
  - method: POST
    path: "/merchant-applications/{id}/request-info"
    description: "Underwriting officer sends the application back to the applicant with a list of outstanding items. Valid from IN_VERIFICATION and from UNDERWRITING."
    roles: [UnderwritingOfficer]
    code: 200
    input: [outstanding_info_items]
    output: MerchantApplication
    side_effects: ["state IN_VERIFICATION -> INFO_REQUESTED or UNDERWRITING -> INFO_REQUESTED", "set outstanding_info_items to the supplied labels"]
  - method: POST
    path: "/merchant-applications/{id}/withdraw"
    description: "Applicant abandons the application. Valid from DRAFT, SUBMITTED, IN_VERIFICATION, INFO_REQUESTED and UNDERWRITING; terminal afterwards."
    roles: [Applicant]
    code: 200
    input: []
    output: MerchantApplication
    side_effects: ["state -> WITHDRAWN", "set decided_at to the logical clock", "no Merchant is created"]
  - method: POST
    path: "/business-verifications"
    description: "Record one KYB verification attempt against a SUBMITTED or INFO_REQUESTED application; attempt_index is assigned by the server as the merchant's previous greatest attempt_index + 1."
    roles: [UnderwritingOfficer]
    code: 201
    input: [application_id, registry_match, address_match, tax_id_match, bank_account_match]
    output: BusinessVerification
    side_effects: ["assign attempt_index and increment MerchantApplication.verification_attempt_count", "compute mismatch_count and status (PASSED only when registry_match, address_match, tax_id_match and bank_account_match are all true)", "application state SUBMITTED -> IN_VERIFICATION", "on a FAILED attempt the cascade continues IN_VERIFICATION -> INFO_REQUESTED with outstanding_info_items set to the uppercase names of the false checks in the fixed order REGISTRY_MATCH, ADDRESS_MATCH, TAX_ID_MATCH, BANK_ACCOUNT_MATCH"]
  - method: GET
    path: "/merchant-applications/{id}/business-verifications"
    description: "Verification attempts of an application (FK reverse), ordered attempt_index ASC."
    roles: [UnderwritingOfficer, RiskAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: BusinessVerification[]
    side_effects: []
  - method: POST
    path: "/beneficial-owners/{id}/screen"
    description: "Apply a screening outcome to one beneficial owner. status is derived in this pinned order: SANCTIONS_HIT when sanctions_hit is true; else ID_UNVERIFIED when id_verified is false; else FLAGGED_PEP when pep_flag is true; else CLEARED."
    roles: [UnderwritingOfficer]
    code: 200
    input: [sanctions_hit, pep_flag, id_verified]
    output: BeneficialOwner
    side_effects: ["store sanctions_hit, pep_flag and id_verified", "owner status PENDING -> CLEARED | FLAGGED_PEP | ID_UNVERIFIED | SANCTIONS_HIT by the pinned derivation order", "set screened_at to the logical clock"]
  - method: POST
    path: "/merchant-applications/{id}/advance-to-underwriting"
    description: "Gate the application into credit underwriting. Enforces the prohibited-category, sanctions, screening-completeness, ownership-coverage and verification checks in the §1.4 priority order."
    roles: [UnderwritingOfficer]
    code: 200
    input: ["reviewer_note?"]
    output: MerchantApplication
    side_effects: ["state IN_VERIFICATION -> UNDERWRITING"]
  - method: POST
    path: "/credit-assessments"
    description: "Run reserve_requirement_determination under the chosen method against an UNDERWRITING application. Optimistically concurrent on the application."
    roles: [UnderwritingOfficer]
    code: 201
    input: [application_id, method, expected_application_version]
    output: CreditAssessment
    side_effects: ["assign assessment_sequence = previous greatest + 1 for the application", "compute credit_band, all uplift components, reserve_pct_bps, exposure_estimate_cents, reserve_cap_cents, reserve_type", "re-pin MerchantApplication.current_assessment_method / current_reserve_pct_bps / current_reserve_cap_cents / current_reserve_type", "increment MerchantApplication.version"]
  - method: GET
    path: "/merchant-applications/{id}/credit-assessments"
    description: "Credit assessments of an application (FK reverse), ordered assessment_sequence ASC."
    roles: [UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["method?", "limit?", "offset?"]
    output: CreditAssessment[]
    side_effects: []
  - method: POST
    path: "/merchant-applications/{id}/decision"
    description: "Committee decision on an UNDERWRITING application. APPROVE onboards the Merchant and opens its ReserveAccount from the currently pinned assessment."
    roles: [RiskCommitteeApprover]
    code: 200
    input: [decision, "decline_reason_code?"]
    output: MerchantApplication
    side_effects: ["state UNDERWRITING -> APPROVED or DECLINED, decision_officer_user_id from X-User-ID and decided_at from the logical clock", "on APPROVE: create Merchant (account_state ACTIVE, funding_state NORMAL, pinned_reserve_pct_bps / pinned_reserve_cap_cents / pinned_reserve_type copied from the application, monthly_volume_limit_cents = requested_monthly_volume_cents) and its ReserveAccount (state ACCRUING, release_lag_days 90 for ROLLING / 180 for CAPPED, all balances 0)"]
  - method: GET
    path: "/merchant-applications/{id}/onboarded-merchants"
    description: "The Merchant onboarded from this application (FK reverse; length 0 or 1). Sole discovery channel for the cascade-created merchant id."
    roles: [UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["limit?", "offset?"]
    output: Merchant[]
    side_effects: []

  # ---------- merchant portfolio ----------
  - method: GET
    path: "/merchants/{id}"
    description: "Fetch one merchant with both state dimensions, trailing metrics and both chargeback ratio variants."
    roles: [MerchantUser, UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: GET
    path: "/merchants"
    description: "List merchants, ordered created_at ASC."
    roles: [UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["account_state?", "funding_state?", "remediation_required?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []
  - method: GET
    path: "/merchants/{id}/risk-summary"
    description: "Computed read, no persistence. Recomputed at read time from stored rows: rolling_chargeback_ratio_bps and amount_based_chargeback_ratio_bps are the two variants of calculation rolling_chargeback_ratio evaluated with W_end = the merchant's metrics_as_of_date (both 0 when metrics_as_of_date is null); gating_ratio_band is NORMAL when rolling_chargeback_ratio_bps < 65, EARLY_WARNING when 65 <= rolling_chargeback_ratio_bps < 90, EXCESSIVE when rolling_chargeback_ratio_bps >= 90; open_alert_count counts MonitoringAlert rows of this merchant with state IN {OPEN, UNDER_REVIEW, ESCALATED}; reserve_account_id / reserve_type / reserve_held_balance_cents are read from the merchant's single ReserveAccount (null / null / 0 when it has none); reserve_releasable_cents is releasable_balance_cents from calculation reserve_release_eligibility evaluated against the logical clock date (0 when the account state is CLOSED); unpaid_settlement_exposure_cents sums SettlementBatch.net_payout_cents of this merchant with payout_state IN {SCHEDULED, DELAYED, HELD}, matching calculation portfolio_loss_forecast's per-merchant exposure filter."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: []
    output: { merchant_id: string, account_state: string, funding_state: string, rolling_chargeback_ratio_bps: integer, amount_based_chargeback_ratio_bps: integer, gating_ratio_band: string, open_alert_count: integer, reserve_account_id: string, reserve_type: string, reserve_held_balance_cents: integer, reserve_releasable_cents: integer, unpaid_settlement_exposure_cents: integer, remediation_required: boolean }
    side_effects: []
  - method: GET
    path: "/merchants/{id}/reserve-accounts"
    description: "The merchant's reserve account (FK reverse; length 0 or 1)."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: ["limit?", "offset?"]
    output: ReserveAccount[]
    side_effects: []
  - method: POST
    path: "/merchant-day-activity"
    description: "Ingest one immutable day of processing activity for a merchant and refresh the trailing-30-day metrics with W_end = business_date."
    roles: [RiskAnalyst]
    code: 201
    input: [merchant_id, business_date, txn_count, volume_cents, decline_count, distinct_card_count, cross_border_count, refund_cents, unique_bin_count, chargeback_count, chargeback_amount_cents, "chargeback_network?"]
    output: MerchantDayActivity
    side_effects: ["compute avg_ticket_cents", "recompute Merchant trailing_30d_* fields, rolling_chargeback_ratio_bps, amount_based_chargeback_ratio_bps and metrics_as_of_date"]
  - method: GET
    path: "/merchants/{id}/day-activity"
    description: "Activity rows of a merchant (FK reverse), ordered business_date ASC."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: ["from_date?", "to_date?", "limit?", "offset?"]
    output: MerchantDayActivity[]
    side_effects: []

  # ---------- transaction monitoring ----------
  - method: POST
    path: "/monitoring-runs"
    description: "Run all four detectors over every ACTIVE or RESTRICTED merchant for as_of_date. Returns the alerts created or re-detected by this run, ordered by merchant created_at ASC then by detector order."
    roles: [RiskAnalyst]
    code: 201
    input: [as_of_date]
    output: MonitoringAlert[]
    side_effects: ["refresh trailing metrics of every evaluated merchant with W_end = as_of_date", "create OPEN alerts or take the OPEN -> OPEN re-detection transition", "CB-BREACH cascade on a CHARGEBACK_THRESHOLD alert with severity_score >= 90: account_state ACTIVE -> RESTRICTED, remediation_required true, funding_state NORMAL -> DELAYED with delayed_payout_days 7, every SettlementBatch of the merchant in SCHEDULED -> DELAYED with scheduled_payout_date pushed out", "set Merchant.last_monitoring_run_date and open_alert_count"]
  - method: GET
    path: "/merchants/{id}/monitoring-alerts"
    description: "Alerts of a merchant (FK reverse), ordered created_at ASC."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "alert_type?", "limit?", "offset?"]
    output: MonitoringAlert[]
    side_effects: []
  - method: POST
    path: "/monitoring-alerts/{id}/review"
    description: "Analyst disposition of an alert: ACKNOWLEDGE (OPEN -> UNDER_REVIEW), DISMISS (UNDER_REVIEW -> DISMISSED) or ESCALATE (UNDER_REVIEW -> ESCALATED)."
    roles: [RiskAnalyst]
    code: 200
    input: [disposition, "review_note?"]
    output: MonitoringAlert
    side_effects: ["alert state transition", "recompute Merchant.open_alert_count", "on ESCALATE of a CARD_TESTING or LAUNDERING_PATTERN alert whose merchant has funding_state IN {NORMAL, DELAYED}: cascade ALERT-ESCALATION sets Merchant.funding_state = HELD with funding_hold_reason_code CARD_TESTING or SUSPECTED_LAUNDERING and moves every SCHEDULED or DELAYED SettlementBatch of that merchant to HELD with scheduled_payout_date null"]
  - method: POST
    path: "/merchants/{id}/funding-holds"
    description: "Place a manual funding hold. funding_state NORMAL or DELAYED -> HELD."
    roles: [RiskAnalyst]
    code: 200
    input: [reason_code]
    output: Merchant
    side_effects: ["funding_state -> HELD, funding_hold_reason_code set, delayed_payout_days 0", "every SettlementBatch of the merchant in SCHEDULED or DELAYED -> HELD with scheduled_payout_date cleared"]
  - method: POST
    path: "/merchants/{id}/funding-release"
    description: "Lift a funding hold. funding_state HELD -> NORMAL (account_state ACTIVE) or HELD -> DELAYED (account_state RESTRICTED)."
    roles: [RiskCommitteeApprover]
    code: 200
    input: []
    output: Merchant
    side_effects: ["funding_state transition, funding_hold_reason_code cleared, delayed_payout_days set to 0 or 7 by the resulting funding_state", "every HELD SettlementBatch of the merchant -> SCHEDULED or DELAYED with scheduled_payout_date recomputed"]

  # ---------- settlement and payout ----------
  - method: POST
    path: "/settlement-batches"
    description: "Settle a closed activity period: apply the reserve hold, run the loss waterfall and schedule the payout by the merchant's funding_state."
    roles: [PortfolioController]
    code: 201
    input: [merchant_id, period_start_date, period_end_date, gross_volume_cents]
    output: SettlementBatch
    side_effects: ["run settlement_reserve_hold_and_payout_waterfall", "append the HOLD then the OFFSET_LOSS ReserveLedgerEntry rows", "recompute ReserveAccount total_accrued_cents / offset_to_date_cents / held_balance_cents / state (ACCRUING -> CAP_REACHED only for reserve_type CAPPED once held_balance_cents >= reserve_cap_cents)", "add net_payout_cents to Merchant.pending_payout_cents and set Merchant.reserve_balance_cents"]
  - method: GET
    path: "/settlement-batches/{id}"
    description: "Fetch one settlement batch with every waterfall component."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: GET
    path: "/merchants/{id}/settlement-batches"
    description: "Settlement batches of a merchant (FK reverse), ordered period_start_date ASC."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: ["payout_state?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []
  - method: POST
    path: "/settlement-batches/{id}/pay"
    description: "Release the scheduled payout on or after scheduled_payout_date. SCHEDULED or DELAYED -> PAID."
    roles: [PortfolioController]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["payout_state -> PAID, paid_at set from the logical clock", "subtract net_payout_cents from Merchant.pending_payout_cents"]
  - method: POST
    path: "/settlement-batches/{id}/reverse"
    description: "Compensating reversal of an unpaid batch: SCHEDULED, DELAYED or HELD -> REVERSED, unwinding every ledger effect."
    roles: [PortfolioController]
    code: 200
    input: [reversal_reason_code]
    output: SettlementBatch
    side_effects: ["append a RELEASE entry with reason_code BATCH_REVERSAL_RELEASE for reserve_hold_cents and a HOLD entry for reserve_offset_cents so total_accrued_cents - released_to_date_cents - offset_to_date_cents is restored", "recompute ReserveAccount held_balance_cents and state", "subtract net_payout_cents from Merchant.pending_payout_cents, restoring its pre-batch value", "add uncovered_loss_cents + reserve_offset_cents + loss_offset_from_settlement_cents to Merchant.lifetime_reversed_cents"]
  - method: GET
    path: "/settlement-batches/{id}/ledger-entries"
    description: "Reserve ledger entries produced by this batch (FK reverse), ordered created_at ASC."
    roles: [RiskAnalyst, PortfolioController]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []

  # ---------- reserve mechanics ----------
  - method: GET
    path: "/reserve-accounts/{id}"
    description: "Fetch one reserve account with total_accrued_cents, released_to_date_cents, offset_to_date_cents, held_balance_cents and the maturity-derived releasable balance."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: []
    output: ReserveAccount
    side_effects: []
  - method: GET
    path: "/reserve-accounts"
    description: "List reserve accounts, ordered created_at ASC."
    roles: [RiskAnalyst, PortfolioController]
    code: 200
    input: ["state?", "reserve_type?", "limit?", "offset?"]
    output: ReserveAccount[]
    side_effects: []
  - method: GET
    path: "/reserve-accounts/{id}/ledger-entries"
    description: "Append-only ledger of one reserve account (FK reverse), ordered created_at ASC."
    roles: [MerchantUser, RiskAnalyst, PortfolioController]
    code: 200
    input: ["entry_type?", "reason_code?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/reserve-accounts/{id}/release-requests"
    description: "Release a matured reserve tranche. Optimistically concurrent on the reserve account; enforces the 31-day cooling buffer between closed tranches and the maturity-derived releasable balance."
    roles: [PortfolioController]
    code: 201
    input: [amount_cents, tranche_start_date, tranche_end_date, expected_reserve_account_version]
    output: ReserveLedgerEntry
    side_effects: ["append the RELEASE entry with reason_code SCHEDULED_RELEASE", "increase released_to_date_cents, decrease held_balance_cents, set last_release_tranche_end_date", "ReserveAccount state ACCRUING or CAP_REACHED -> RELEASING", "set Merchant.reserve_balance_cents", "increment ReserveAccount.version"]

  # ---------- remediation ----------
  - method: POST
    path: "/remediation-programs"
    description: "Open a DRAFT remediation program over a half-open monitoring window for a merchant flagged remediation_required."
    roles: [RiskAnalyst]
    code: 201
    input: [merchant_id, window_start_date, window_end_date, target_ratio_bps, monitoring_month_count]
    output: RemediationProgram
    side_effects: ["set state DRAFT, months_elapsed 0, consecutive_compliant_months 0, network_program_tier STANDARD, opened_by_user_id from X-User-ID"]
  - method: POST
    path: "/remediation-programs/{id}/activate"
    description: "Activate a DRAFT program. Segregation of duties: the activating user must differ from opened_by_user_id."
    roles: [RiskCommitteeApprover]
    code: 200
    input: []
    output: RemediationProgram
    side_effects: ["state DRAFT -> ACTIVE, activated_by_user_id from X-User-ID"]
  - method: POST
    path: "/remediation-programs/{id}/evaluate-month"
    description: "Evaluate one fixed 30-day remediation month in sequence; may pass, fail, escalate to the network program or self-loop."
    roles: [RiskAnalyst]
    code: 200
    input: [month_index]
    output: RemediationProgram
    side_effects: ["run remediation_month_evaluation", "REMEDIATION-PASS cascade on PASSED: account_state RESTRICTED -> ACTIVE, remediation_required false, funding_state DELAYED -> NORMAL with delayed_payout_days 0, every DELAYED SettlementBatch -> SCHEDULED, every ESCALATED CHARGEBACK_THRESHOLD alert -> CLOSED", "REMEDIATION-FAIL cascade on FAILED with month chargeback_count >= 100: state FAILED -> NETWORK_ESCALATED, network_program_tier EXCESSIVE, funding_state -> HELD with funding_hold_reason_code EXCESSIVE_CHARGEBACKS, every non-terminal SettlementBatch -> HELD"]
  - method: GET
    path: "/remediation-programs/{id}"
    description: "Fetch one remediation program with its month counters and network tier."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: []
    output: RemediationProgram
    side_effects: []
  - method: GET
    path: "/merchants/{id}/remediation-programs"
    description: "Remediation programs of a merchant (FK reverse), ordered window_start_date ASC."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RemediationProgram[]
    side_effects: []

  # ---------- termination ----------
  - method: POST
    path: "/termination-decisions"
    description: "Propose termination of a non-terminated merchant."
    roles: [RiskAnalyst]
    code: 201
    input: [merchant_id, reason_code, "match_listing_flag?"]
    output: TerminationDecision
    side_effects: ["set state PROPOSED, proposed_by_user_id from X-User-ID"]
  - method: POST
    path: "/termination-decisions/{id}/approve"
    description: "Committee approval of a PROPOSED termination. Segregation of duties: the approver must differ from proposed_by_user_id."
    roles: [RiskCommitteeApprover]
    code: 200
    input: []
    output: TerminationDecision
    side_effects: ["state PROPOSED -> APPROVED, approved_by_user_id from X-User-ID"]
  - method: POST
    path: "/termination-decisions/{id}/reject"
    description: "Committee rejection of a PROPOSED termination. Segregation of duties applies."
    roles: [RiskCommitteeApprover]
    code: 200
    input: [rejection_note]
    output: TerminationDecision
    side_effects: ["state PROPOSED -> REJECTED, rejection_note stored, approved_by_user_id set to the deciding user"]
  - method: POST
    path: "/termination-decisions/{id}/execute"
    description: "Execute an APPROVED termination, freezing the account, the funding and the reserve."
    roles: [PortfolioController]
    code: 200
    input: []
    output: TerminationDecision
    side_effects: ["state APPROVED -> EXECUTED, executed_at set from the logical clock", "TERMINATION-EXEC cascade: account_state -> TERMINATED, funding_state -> HELD with funding_hold_reason_code TERMINATION_PENDING, every SCHEDULED or DELAYED SettlementBatch -> HELD, ReserveAccount -> CLOSED, every OPEN, UNDER_REVIEW or ESCALATED MonitoringAlert -> CLOSED"]
  - method: GET
    path: "/termination-decisions/{id}"
    description: "Fetch one termination decision with both actor ids and the MATCH listing flag."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: []
    output: TerminationDecision
    side_effects: []
  - method: GET
    path: "/merchants/{id}/termination-decisions"
    description: "Termination decisions of a merchant (FK reverse), ordered created_at ASC."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: TerminationDecision[]
    side_effects: []

  # ---------- appeal and reinstatement ----------
  - method: POST
    path: "/appeals"
    description: "Merchant appeals an EXECUTED termination within the 30-day appeal window."
    roles: [MerchantUser]
    code: 201
    input: [merchant_id, termination_decision_id, evidence_summary]
    output: Appeal
    side_effects: ["set state SUBMITTED, filed_on_date from the logical clock date, response_round_count 0"]
  - method: POST
    path: "/appeals/{id}/review"
    description: "Committee takes up a SUBMITTED appeal. SUBMITTED -> UNDER_REVIEW."
    roles: [RiskCommitteeApprover]
    code: 200
    input: []
    output: Appeal
    side_effects: ["state SUBMITTED -> UNDER_REVIEW, reviewer_user_id from X-User-ID"]
  - method: POST
    path: "/appeals/{id}/request-info"
    description: "Committee requests more evidence. UNDER_REVIEW -> INFO_REQUESTED."
    roles: [RiskCommitteeApprover]
    code: 200
    input: [outstanding_info_items]
    output: Appeal
    side_effects: ["state UNDER_REVIEW -> INFO_REQUESTED, outstanding_info_items stored"]
  - method: POST
    path: "/appeals/{id}/respond"
    description: "Merchant answers an information request. INFO_REQUESTED -> UNDER_REVIEW (the appeal cycle; unbounded rounds are counted)."
    roles: [MerchantUser]
    code: 200
    input: [response_text]
    output: Appeal
    side_effects: ["state INFO_REQUESTED -> UNDER_REVIEW", "clear outstanding_info_items", "response_round_count += 1"]
  - method: POST
    path: "/appeals/{id}/decide"
    description: "Committee grants or upholds. GRANT reinstates the merchant under a re-priced reserve. Segregation of duties: the decider may be neither the proposer nor the approver of the appealed termination."
    roles: [RiskCommitteeApprover]
    code: 200
    input: [outcome, "reinstatement_reserve_pct_bps?"]
    output: Appeal
    side_effects: ["state UNDER_REVIEW -> GRANTED or UPHELD, decided_at set from the logical clock", "APPEAL-GRANT cascade on GRANTED: TerminationDecision EXECUTED -> REVERSED, account_state TERMINATED -> RESTRICTED with remediation_required true, funding_state HELD -> DELAYED with delayed_payout_days 7, every HELD SettlementBatch -> DELAYED, ReserveAccount CLOSED -> ACCRUING with reserve_pct_bps replaced by reinstatement_reserve_pct_bps (defaulting to the pinned value)"]
  - method: GET
    path: "/appeals/{id}"
    description: "Fetch one appeal with its response_round_count and reinstatement terms."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/merchants/{id}/appeals"
    description: "Appeals of a merchant (FK reverse), ordered created_at ASC."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/termination-decisions/{id}/appeals"
    description: "Appeals against one termination decision (FK reverse), ordered created_at ASC."
    roles: [MerchantUser, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  # ---------- portfolio loss forecasting ----------
  - method: POST
    path: "/portfolio-forecasts"
    description: "Run the expected-loss or stressed forecast over the ACTIVE and RESTRICTED book and size the reserve shortfall."
    roles: [PortfolioController]
    code: 201
    input: [as_of_date, method, "stress_multiplier_bps?"]
    output: PortfolioForecast
    side_effects: ["refresh trailing metrics of every included merchant with W_end = as_of_date", "run portfolio_loss_forecast and store every computed field"]
  - method: GET
    path: "/portfolio-forecasts/{id}"
    description: "Fetch one stored forecast."
    roles: [RiskAnalyst, PortfolioController]
    code: 200
    input: []
    output: PortfolioForecast
    side_effects: []
  - method: GET
    path: "/portfolio-forecasts"
    description: "List forecasts, ordered created_at ASC."
    roles: [RiskAnalyst, PortfolioController]
    code: 200
    input: ["method?", "limit?", "offset?"]
    output: PortfolioForecast[]
    side_effects: []

  # ---------- test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock that every date rule reads (maturity cutoffs, appeal windows, payout due dates, activity-date checks). Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [Applicant, MerchantUser, UnderwritingOfficer, RiskAnalyst, RiskCommitteeApprover, PortfolioController]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["set the logical clock; no entity is recomputed as a side effect of the clock move"]

errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own: Applicant X-User-ID != the application id, MerchantUser X-User-ID != the merchant id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is barred from this step because it performed a conflicting earlier step (termination proposer approving, program opener activating, or termination proposer/approver deciding the appeal)"
  # schema
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, negative money or count, ownership_pct outside 0.01..100.00, malformed date, limit outside 1..100 or negative offset"
  # existence
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no MerchantApplication with the referenced id (path, application_id or supersedes_application_id)"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "no BeneficialOwner with the referenced id"
  - id: ERR_MERCHANT_NOT_FOUND
    http: 404
    condition: "no Merchant with the referenced id"
  - id: ERR_RESERVE_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no ReserveAccount with the referenced id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no SettlementBatch with the referenced id"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "no MonitoringAlert with the referenced id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no RemediationProgram with the referenced id"
  - id: ERR_TERMINATION_DECISION_NOT_FOUND
    http: 404
    condition: "no TerminationDecision with the referenced id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no Appeal with the referenced id"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "no PortfolioForecast with the referenced id"
  # optimistic concurrency
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the application's current version"
  - id: ERR_STALE_RESERVE_ACCOUNT_VERSION
    http: 412
    condition: "expected_reserve_account_version does not equal the reserve account's current version"
  # state
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "the application's state has no declared transition for the requested operation"
  - id: ERR_MERCHANT_ACCOUNT_STATE_INVALID
    http: 409
    condition: "the merchant's account_state forbids the operation (e.g. TERMINATED merchant receiving activity or settlement, non-ACTIVE merchant requesting a reserve release)"
  - id: ERR_FUNDING_STATE_INVALID
    http: 409
    condition: "the merchant's funding_state forbids the operation (holding an already HELD merchant, releasing a merchant that is not HELD, or releasing reserve while funding is not NORMAL)"
  - id: ERR_RESERVE_ACCOUNT_CLOSED
    http: 409
    condition: "the reserve account is CLOSED"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "the batch's payout_state has no declared transition for the requested operation (paying a PAID or HELD batch, reversing a PAID batch)"
  - id: ERR_ALERT_STATE_INVALID
    http: 409
    condition: "the alert's state does not permit the requested disposition"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "the remediation program is not in DRAFT for activation or not in ACTIVE for a month evaluation, or a TerminationDecision execution was attempted while the merchant still has a RemediationProgram in DRAFT or ACTIVE"
  - id: ERR_TERMINATION_STATE_INVALID
    http: 409
    condition: "the termination decision is not PROPOSED for approve/reject or not APPROVED for execute"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "the appeal's state does not permit the requested operation"
  # underwriting safety
  - id: ERR_PROHIBITED_BUSINESS_CATEGORY
    http: 422
    condition: "the application's mcc_disposition is PROHIBITED"
  - id: ERR_SANCTIONED_BENEFICIAL_OWNER
    http: 422
    condition: "at least one beneficial owner has status SANCTIONS_HIT"
  - id: ERR_OWNER_SCREENING_INCOMPLETE
    http: 409
    condition: "at least one beneficial owner is still PENDING"
  - id: ERR_OWNERSHIP_COVERAGE_INSUFFICIENT
    http: 422
    condition: "owner_ownership_pct_total is below 75.00"
  - id: ERR_VERIFICATION_NOT_PASSED
    http: 409
    condition: "the authoritative business verification (greatest attempt_index) is absent or not PASSED"
  # referential business rules
  - id: ERR_CREDIT_ASSESSMENT_REQUIRED
    http: 409
    condition: "a committee decision was requested on an application with no credit assessment"
  - id: ERR_BENEFICIAL_OWNERS_REQUIRED
    http: 409
    condition: "submission was requested on an application with no beneficial owner"
  - id: ERR_SUPERSEDED_APPLICATION_INVALID
    http: 409
    condition: "supersedes_application_id names an application that is not APPROVED or whose onboarded merchant is not TERMINATED"
  - id: ERR_APPEAL_DECISION_NOT_EXECUTED
    http: 409
    condition: "the appealed termination decision is not EXECUTED, or belongs to a different merchant than the appeal"
  - id: ERR_REMEDIATION_NOT_REQUIRED
    http: 409
    condition: "a remediation program was opened for a merchant whose remediation_required is false"
  # temporal
  - id: ERR_ACTIVITY_DATE_IN_FUTURE
    http: 422
    condition: "business_date is after the logical clock date"
  - id: ERR_MONITORING_RUN_DATE_REGRESSION
    http: 409
    condition: "as_of_date is after the logical clock date or earlier than the portfolio's greatest last_monitoring_run_date"
  - id: ERR_REMEDIATION_WINDOW_OVERLAP
    http: 409
    condition: "the half-open window overlaps a DRAFT or ACTIVE program of the same merchant (touching endpoints are accepted)"
  - id: ERR_RELEASE_TRANCHE_COOLING_VIOLATION
    http: 409
    condition: "tranche_start_date is less than 31 days after the previous scheduled tranche_end_date, tranche_start_date is after tranche_end_date, or tranche_end_date is after the logical clock date"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "more than 30 days have elapsed since the termination decision was executed"
  - id: ERR_SETTLEMENT_PERIOD_INVALID
    http: 422
    condition: "period_start_date is after period_end_date, or period_end_date is after the logical clock date"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "the closed settlement period intersects a non-REVERSED batch of the same merchant on at least one date"
  - id: ERR_PAYOUT_NOT_DUE
    http: 409
    condition: "the logical clock date is before the batch's scheduled_payout_date"
  # constraint
  - id: ERR_DUPLICATE_ACTIVITY_DATE
    http: 409
    condition: "an activity row already exists for this merchant and business_date"
  - id: ERR_DUPLICATE_CATEGORY_RULE
    http: 409
    condition: "a prohibited-category rule already exists for this mcc_code"
  - id: ERR_DUPLICATE_APPEAL
    http: 409
    condition: "an appeal in SUBMITTED, UNDER_REVIEW or INFO_REQUESTED already exists for this termination decision"
  - id: ERR_MONTH_INDEX_OUT_OF_SEQUENCE
    http: 409
    condition: "month_index does not equal months_elapsed + 1"
  - id: ERR_EMPTY_SETTLEMENT_PERIOD
    http: 409
    condition: "no activity row falls inside the requested settlement period"
  - id: ERR_GROSS_VOLUME_MISMATCH
    http: 422
    condition: "gross_volume_cents does not equal the summed volume of the period's activity rows"
  # fiscal
  - id: ERR_MONTHLY_VOLUME_LIMIT_EXCEEDED
    http: 422
    condition: "the merchant's trailing 30-day volume at period_end_date exceeds 125% of monthly_volume_limit_cents"
  - id: ERR_NO_RELEASABLE_BALANCE
    http: 409
    condition: "the maturity-derived releasable balance is zero"
  - id: ERR_RELEASE_AMOUNT_EXCEEDS_RELEASABLE
    http: 422
    condition: "amount_cents exceeds the releasable balance"

roles:
  - name: Applicant
    description: "Prospective merchant preparing and submitting an application; sees only its own application."
    identity: "entity_backed:MerchantApplication"
    exclusive_operations: ["create application", "attach beneficial owner", "submit application"]
    shared_operations: ["read own application", "read own beneficial owners", "set the logical clock"]
  - name: MerchantUser
    description: "Onboarded merchant reading its own risk position and pursuing an appeal after termination."
    identity: "entity_backed:Merchant"
    exclusive_operations: ["submit appeal", "respond to an appeal information request"]
    shared_operations: ["read own merchant record", "read own risk summary", "read own reserve account and ledger", "read own activity, alerts, batches, programs, decisions and appeals", "set the logical clock"]
  - name: UnderwritingOfficer
    description: "Underwriter performing KYB verification, owner screening, category gating and credit assessment."
    identity: "opaque"
    exclusive_operations: ["create prohibited-category rule", "record business verification", "screen beneficial owner", "advance application to underwriting", "create credit assessment"]
    shared_operations: ["read applications, owners, verifications, assessments, merchants", "set the logical clock"]
  - name: RiskAnalyst
    description: "Monitoring analyst ingesting activity, running detectors, disposing alerts, opening remediation and proposing termination."
    identity: "opaque"
    exclusive_operations: ["ingest merchant day activity", "run monitoring run", "review alert", "place funding hold", "open remediation program", "evaluate remediation month", "propose termination"]
    shared_operations: ["read merchants, alerts, activity, reserve accounts, ledger, batches, programs, decisions, appeals, forecasts", "set the logical clock"]
  - name: RiskCommitteeApprover
    description: "Committee member holding the second signature: application decisions, funding release, program activation, termination approval and appeal adjudication."
    identity: "opaque"
    exclusive_operations: ["decide application", "release funding hold", "activate remediation program", "approve termination", "reject termination", "review appeal", "request appeal information", "decide appeal"]
    shared_operations: ["read applications, assessments, merchants, alerts, programs, decisions, appeals", "set the logical clock"]
  - name: PortfolioController
    description: "Treasury/portfolio controller executing settlement, payouts, reserve releases, termination execution and loss forecasting."
    identity: "opaque"
    exclusive_operations: ["create settlement batch", "pay settlement batch", "reverse settlement batch", "request reserve release", "execute termination", "create portfolio forecast"]
    shared_operations: ["read merchants, risk summaries, reserve accounts, ledger, batches, programs, decisions, appeals, forecasts", "set the logical clock"]
