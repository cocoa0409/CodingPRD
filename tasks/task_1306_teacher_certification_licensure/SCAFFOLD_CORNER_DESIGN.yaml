            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan1: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_STALE_VERSION'"
            - "http status == 412"
            - "DeficiencyPlan.${plan1}.status == 'PROPOSED'"

