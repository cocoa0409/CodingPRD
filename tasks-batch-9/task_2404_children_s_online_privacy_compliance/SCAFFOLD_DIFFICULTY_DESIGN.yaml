          assert:
            - "${disclosed_at_declare} == false"
            - "${err_both_violated} == ERR_BEHAVIORAL_AD_TIER_UNMET with HTTP 422 (priority 95 wins over the also-violated priority 105)"
            - "${err_both_violated} != ERR_INTEGRATION_NOT_DISCLOSED"
            - "${tier_2} == 3 (PERSONALIZED_ADVERTISING carries USE_TIER 3; no bump, nothing is APPROVED yet)"
            - "OnlineService.${svc_id}.granted_disclosure_consent_count == 1 after consent 2 is granted"
            - "${err_disclosure_only} == ERR_INTEGRATION_NOT_DISCLOSED with HTTP 422 (identical payload, only the disclosure-consent count changed)"
