scenario: |
  2953. Accreditation Body Assessor Program (conformity assessment accreditation body): scheme rule development for each accreditation program with international standard alignment, assessor recruitment, technical expert qualification and impartiality screening, assessment team assignment avoiding conflicts with the applicant organization, on-site and remote assessment planning with witnessing of actual conformity assessment activity, nonconformity classification, corrective action review and effectiveness verification, accreditation decision by an independent decision panel with scope definition, surveillance and reassessment cycles with unannounced assessment authority, complaint and appeal handling and international mutual recognition obligations

domain_name: accreditation-body-assessor-program
api_prefix: "/accreditation"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # AssessorQualification and ImpartialityDeclaration are junction entities over
  # (Assessor x AccreditationScheme) and (Assessor x ApplicantOrganization);
  # AssessmentPlan.superseded_by_plan_id is self-referential; AccreditationApplication
  # points back at the AccreditationScope that spawned it, which itself points at the
  # AccreditationApplication that produced it — a cyclic reference pair resolved by
  # nullability rather than by nesting.

  state_machine_shape: cyclic
  # AccreditationScheme: DRAFT -> UNDER_REVIEW -> DRAFT (rule revision loop).
  # Assessor: two independent dimensions (qualification_status x impartiality_status).
  # AccreditationApplication: DECISION_PENDING -> NC_OPEN -> DECISION_PENDING (panel deferral loop).
  # Nonconformity: OPEN -> RESPONSE_SUBMITTED -> OPEN (rejected corrective action loop).
  # AccreditationScope: ACTIVE -> SUSPENDED -> ACTIVE (restore loop).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # A DecisionPanelMember may not vote on an application they were assigned to assess;
  # the assessor who reviewed a corrective action may not verify its effectiveness;
  # an appeal may not be reviewed by anyone who assessed or voted on the cycle.

  consistency_model: immediate

entities:
  - name: AccreditationScheme
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: Short program identifier of the accreditation program.
        constraints: 3..32 chars; unique across all AccreditationScheme rows (case-sensitive)
      - name: name
        type: string
        source: input
        description: Human-readable scheme name.
        constraints: 1..160 chars
      - name: standard_ref
        type: enum
        source: input
        description: International standard the scheme rules are aligned to.
        constraints: one of {ISO_IEC_17025, ISO_IEC_17020, ISO_IEC_17021_1, ISO_IEC_17065}
      - name: status
        type: enum
        source: system
        description: Scheme rule-development lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, UNDER_REVIEW, PUBLISHED, WITHDRAWN}
      - name: rule_revision
        type: integer
        source: system
        description: Semantic revision counter of the published rule set; incremented by one on every DRAFT->UNDER_REVIEW->PUBLISHED pass after the first publication. Applications pin this value at creation.
        default: 1
      - name: complexity_multiplier
        type: number
        source: input
        description: Per-scheme effort/fee multiplier applied to on-site, remote and witness fee lines.
        default: 1.0000
        constraints: 1.0000..2.0000, exactly 4 decimal places
      - name: witness_min_count
        type: integer
        source: input
        description: Minimum number of COMPLETED WitnessSession rows required before an assessment cycle may be closed.
        default: 1
        constraints: 0..10
      - name: qualification_points_required
        type: number
        source: input
        description: Verified competence points an AssessorQualification must reach to be GRANTED.
        default: 60.00
        constraints: 0.00..100.00, 2 decimal places
      - name: surveillance_interval_days
        type: integer
        source: input
        description: Nominal days between accreditation grant and the first surveillance due date, before risk tiering.
        default: 365
        constraints: 30..1095
      - name: reassessment_interval_days
        type: integer
        source: input
        description: Days between accreditation grant and the reassessment due date; never risk-adjusted.
        default: 1460
        constraints: 365..2190
      - name: critical_nc_close_days
        type: integer
        source: input
        description: Calendar days allowed to close a CRITICAL nonconformity.
        default: 30
        constraints: 1..365
      - name: major_nc_close_days
        type: integer
        source: input
        description: Calendar days allowed to close a MAJOR nonconformity.
        default: 60
        constraints: 1..365
      - name: minor_nc_close_days
        type: integer
        source: input
        description: Calendar days allowed to close a MINOR nonconformity.
        default: 90
        constraints: 1..365
      - name: unannounced_authority
        type: boolean
        source: input
        description: Whether the scheme rules grant the accreditation body authority to run unannounced assessments on active scopes.
        default: false
      - name: remote_assessment_allowed
        type: boolean
        source: input
        description: Whether assessment plans under this scheme may use mode REMOTE.
        default: true
      - name: revision_note
        type: string
        source: system
        description: Note recorded by the most recent UNDER_REVIEW->DRAFT return; null before the first return.
        constraints: nullable, 1..500 chars
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into PUBLISHED; null while never published.
        constraints: nullable, ISO 8601 UTC with three fractional digits

  - name: Assessor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Assessor legal name.
        constraints: 1..120 chars
      - name: email
        type: string
        source: input
        description: Contact email of the assessor.
        constraints: unique across all Assessor rows; must contain exactly one '@'
      - name: employment_type
        type: enum
        source: input
        description: Whether the assessor is employed by the accreditation body or contracted.
        constraints: one of {INTERNAL, CONTRACT}
      - name: annual_witness_capacity_days
        type: integer
        source: input
        description: Total witnessing days the assessor may be booked for; the conserved total of the witness-day ledger.
        default: 20
        constraints: 0..250
      - name: qualification_status
        type: enum
        source: system
        description: First independent state dimension - recruitment and qualification standing.
        default: APPLICANT
        constraints: one of {APPLICANT, SCREENING, QUALIFIED, SUSPENDED, WITHDRAWN}
      - name: impartiality_status
        type: enum
        source: system
        description: Second independent state dimension - impartiality screening standing; evolves independently of qualification_status.
        default: UNDECLARED
        constraints: one of {UNDECLARED, SCREENED, RESTRICTED}
      - name: committed_witness_days
        type: integer
        source: computed
        description: Sum of day_count over WitnessSession rows for this assessor whose status is in {SCHEDULED, COMPLETED}.
        default: 0
      - name: available_witness_days
        type: integer
        source: computed
        description: annual_witness_capacity_days minus committed_witness_days; the ledger invariant keeps the two summing to the capacity.
        default: 20
      - name: granted_qualification_count
        type: integer
        source: computed
        description: Count of AssessorQualification rows for this assessor whose status is GRANTED.
        default: 0
      - name: last_screened_on
        type: date
        source: system
        description: Logical-clock date of the most recent impartiality screening run; null before the first screening.
        constraints: nullable, YYYY-MM-DD
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded on the most recent QUALIFIED->SUSPENDED transition; null otherwise.
        constraints: nullable, 1..300 chars

  - name: AssessorQualification
    parent: Assessor
    common_fields: true
    fields:
      - name: assessor_id
        type: string
        source: input
        description: FK -> Assessor.id; the assessor whose competence this record evidences.
      - name: scheme_id
        type: string
        source: input
        description: FK -> AccreditationScheme.id; the accreditation program the qualification is scoped to.
      - name: role_type
        type: enum
        source: input
        description: Team role this qualification authorises.
        constraints: one of {LEAD_ASSESSOR, TECHNICAL_ASSESSOR, TECHNICAL_EXPERT}
      - name: years_experience
        type: integer
        source: input
        description: Declared years of conformity-assessment experience.
        constraints: 0..50
      - name: declared_witness_days
        type: integer
        source: input
        description: Witnessing days the candidate claims, before evidence verification.
        constraints: 0..200
      - name: declared_training_modules
        type: integer
        source: input
        description: Completed scheme training modules the candidate claims, before evidence verification.
        constraints: 0..20
      - name: last_witness_on
        type: date
        source: input
        description: Date of the candidate's most recent witnessing activity; drives the recency multiplier of the verified variant. Refreshed to the logical-clock date whenever a WitnessSession by this assessor under this scheme_id transitions to COMPLETED.
        constraints: nullable, YYYY-MM-DD
      - name: verified_witness_days
        type: integer
        source: system
        description: Witnessing days confirmed by the scheme manager during evidence verification.
        default: 0
      - name: verified_training_modules
        type: integer
        source: system
        description: Training modules confirmed during evidence verification.
        default: 0
      - name: verified_years_experience
        type: integer
        source: system
        description: Years of experience confirmed during evidence verification; null before verification.
        constraints: nullable, 0..50
      - name: declared_points
        type: number
        source: computed
        description: Competence points under the DECLARED_PROVISIONAL variant of assessor_competence_points; written at creation.
        constraints: 0.00..100.00, 2 decimal places
      - name: verified_points
        type: number
        source: computed
        description: Competence points under the VERIFIED_FINAL variant of assessor_competence_points; null until evidence verification runs.
        constraints: nullable, 0.00..100.00, 2 decimal places
      - name: status
        type: enum
        source: system
        description: Qualification standing for this (assessor, scheme, role_type) triple.
        default: PENDING
        constraints: one of {PENDING, GRANTED, EXPIRED, REVOKED}
      - name: granted_on
        type: date
        source: system
        description: Logical-clock date the qualification reached GRANTED; null otherwise.
        constraints: nullable, YYYY-MM-DD
      - name: expires_on
        type: date
        source: system
        description: granted_on plus QUALIFICATION_VALID_DAYS (1460); null until granted.
        constraints: nullable, YYYY-MM-DD
      - name: evidence_verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent evidence verification; null before the first verification.
        constraints: nullable, ISO 8601 UTC with three fractional digits

  - name: ImpartialityDeclaration
    parent: Assessor
    common_fields: false
    fields:
      - name: assessor_id
        type: string
        source: input
        description: FK -> Assessor.id; the assessor disclosing the relationship.
      - name: organization_id
        type: string
        source: input
        description: FK -> ApplicantOrganization.id; the applicant organization the relationship concerns.
      - name: relationship_type
        type: enum
        source: input
        description: Nature of the disclosed relationship with the applicant organization.
        constraints: one of {EMPLOYMENT, OWNERSHIP, FAMILY, CONSULTANCY, TRAINING_DELIVERY, NONE}
      - name: started_on
        type: date
        source: input
        description: Date the relationship began; informational only.
        constraints: nullable, YYYY-MM-DD
      - name: ended_on
        type: date
        source: input
        description: Date the relationship ended; null means the relationship is ongoing, which never clears a cooling-off period.
        constraints: nullable, YYYY-MM-DD
      - name: detail
        type: string
        source: input
        description: Free-text description of the relationship.
        constraints: 1..500 chars
      - name: severity_class
        type: enum
        source: computed
        description: STRUCTURAL for relationship_type in {EMPLOYMENT, OWNERSHIP, FAMILY}; SERVICE for {CONSULTANCY, TRAINING_DELIVERY}; NONE for NONE.
        constraints: one of {STRUCTURAL, SERVICE, NONE}
      - name: cooling_off_months
        type: integer
        source: computed
        description: Whole months that must elapse after ended_on before the relationship stops blocking - 24 for STRUCTURAL, 12 for SERVICE, 0 for NONE.
        constraints: one of {0, 12, 24}
      - name: declared_by_role
        type: string
        source: system
        description: X-User-Role header value of the actor who filed the disclosure.

  - name: ApplicantOrganization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the conformity assessment body applying for accreditation.
        constraints: 1..160 chars; unique across all ApplicantOrganization rows
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country code of the organization's registered seat.
        constraints: exactly 2 upper-case letters
      - name: contact_email
        type: string
        source: input
        description: Primary contact email of the applicant organization.
        constraints: must contain exactly one '@'
      - name: status
        type: enum
        source: system
        description: Accreditation standing of the organization.
        default: APPLIED
        constraints: one of {APPLIED, UNDER_ASSESSMENT, ACCREDITED, SUSPENDED, WITHDRAWN}
      - name: risk_score
        type: integer
        source: computed
        description: Latest organization_risk_score under the AT_DECISION variant; recomputed whenever an application of this organization enters DECISION_PENDING, is finalized, or has a nonconformity escalated.
        default: 0
        constraints: 0..100
      - name: active_scope_count
        type: integer
        source: computed
        description: Count of AccreditationScope rows for this organization whose status is ACTIVE.
        default: 0
      - name: upheld_complaint_count
        type: integer
        source: computed
        description: Count of ComplaintAppeal rows for this organization whose status is UPHELD.
        default: 0
      - name: mra_escalation_count
        type: integer
        source: computed
        description: Count of ComplaintAppeal rows for this organization whose status is ESCALATED_MRA.
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Reason propagated from the scope suspension that moved the organization to SUSPENDED; null otherwise.
        constraints: nullable, 1..300 chars

  - name: AccreditationApplication
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: FK -> ApplicantOrganization.id; the applicant under assessment.
      - name: scheme_id
        type: string
        source: input
        description: FK -> AccreditationScheme.id; the accreditation program applied for.
      - name: origin_scope_id
        type: string
        source: system
        description: FK -> AccreditationScope.id; the active scope that spawned this surveillance, reassessment or unannounced cycle. Null for cycle_type INITIAL.
        constraints: nullable
      - name: cycle_type
        type: enum
        source: input
        description: Which assessment cycle this application represents.
        constraints: one of {INITIAL, SURVEILLANCE, REASSESSMENT, UNANNOUNCED}
      - name: requested_scope_lines
        type: array
        source: input
        description: Ordered list of requested scope line strings (test/inspection/certification activities).
        constraints: 1..20 unique non-empty strings, each 1..80 chars; order preserved as supplied
      - name: notice_days
        type: integer
        source: input
        description: Calendar days of notice given to the applicant before the on-site window opens; must be 0 for cycle_type UNANNOUNCED.
        default: 30
        constraints: 0..120
      - name: pinned_scheme_rule_revision
        type: integer
        source: system
        description: AccreditationScheme.rule_revision captured at application creation; all downstream gates evaluate against this pinned revision.
      - name: status
        type: enum
        source: system
        description: Assessment cycle lifecycle state.
        default: SUBMITTED
        constraints: one of {SUBMITTED, TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN, DECISION_PENDING, GRANTED, REFUSED, WITHDRAWN}
      - name: decision_round
        type: integer
        source: system
        description: Panel round counter; starts at 1 and increments by one every time a DecisionRecord is DEFERRED and the application cycles back to NC_OPEN.
        default: 1
      - name: nc_total_count
        type: integer
        source: computed
        description: Count of all Nonconformity rows for this application, of every classification and status; the conserved total of the nonconformity ledger.
        default: 0
      - name: nc_blocking_open_count
        type: integer
        source: computed
        description: Count of Nonconformity rows with classification in {CRITICAL, MAJOR, MINOR} and status in {OPEN, RESPONSE_SUBMITTED, RESPONSE_ACCEPTED, ESCALATED}.
        default: 0
      - name: nc_closed_count
        type: integer
        source: computed
        description: Count of Nonconformity rows with classification in {CRITICAL, MAJOR, MINOR} and status CLOSED.
        default: 0
      - name: nc_observation_count
        type: integer
        source: computed
        description: Count of Nonconformity rows with classification OBSERVATION, which never block a decision.
        default: 0
      - name: completed_witness_session_count
        type: integer
        source: computed
        description: Count of WitnessSession rows whose plan_id belongs to an AssessmentPlan of this application and whose status is COMPLETED.
        default: 0
      - name: planned_effort_days
        type: integer
        source: computed
        description: total_effort_days of the APPROVED or EXECUTED AssessmentPlan of this application; null while no plan is approved.
        constraints: nullable
      - name: suspension_blocked
        type: boolean
        source: system
        description: Set true when a scope suspension cascade froze this in-flight cycle; blocks every further assessment action on the application.
        default: false

  - name: TeamAssignment
    parent: AccreditationApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> AccreditationApplication.id; the cycle the assessor is proposed for.
      - name: assessor_id
        type: string
        source: input
        description: FK -> Assessor.id; the proposed team member.
      - name: role_type
        type: enum
        source: input
        description: Role the assessor is proposed to occupy on this team.
        constraints: one of {LEAD_ASSESSOR, TECHNICAL_ASSESSOR, TECHNICAL_EXPERT}
      - name: status
        type: enum
        source: system
        description: Assignment standing.
        default: PROPOSED
        constraints: one of {PROPOSED, CONFIRMED, RECUSED, REJECTED}
      - name: conflict_verdict
        type: enum
        source: computed
        description: Verdict of impartiality_conflict_verdict for (assessor_id, application.organization_id) at confirmation time; null while PROPOSED.
        constraints: nullable, one of {CLEARED, CLEARED_WITH_NOTE, BLOCKED}
      - name: conflict_checked_at
        type: datetime
        source: system
        description: Logical-clock instant the conflict screening ran; null while PROPOSED.
        constraints: nullable, ISO 8601 UTC with three fractional digits
      - name: recusal_reason
        type: string
        source: system
        description: Reason recorded when the assignment moved to RECUSED or REJECTED; null otherwise.
        constraints: nullable, 1..300 chars

  - name: AssessmentPlan
    parent: AccreditationApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> AccreditationApplication.id; the cycle being planned.
      - name: mode
        type: enum
        source: input
        description: Delivery mode of the planned assessment.
        constraints: one of {ON_SITE, REMOTE, HYBRID}
      - name: planned_start
        type: date
        source: input
        description: First calendar day of the assessment window, inclusive.
        constraints: YYYY-MM-DD
      - name: planned_end
        type: date
        source: input
        description: Last calendar day of the assessment window, inclusive; must be >= planned_start.
        constraints: YYYY-MM-DD
      - name: on_site_days
        type: integer
        source: input
        description: Planned on-site assessor days; must be 0 when mode is REMOTE.
        constraints: 0..30
      - name: remote_days
        type: integer
        source: input
        description: Planned remote assessor days; must be 0 when mode is ON_SITE.
        constraints: 0..30
      - name: witness_days_planned
        type: integer
        source: computed
        description: Witness days derived by assessment_effort_days step 1 from the application's requested_scope_lines count and the scheme's witness_min_count.
      - name: core_days
        type: integer
        source: computed
        description: on_site_days + remote_days + witness_days_planned; the tier key for travel_days.
      - name: travel_days
        type: integer
        source: computed
        description: Travel days selected from the core_days tier (never from total_effort_days).
      - name: total_effort_days
        type: integer
        source: computed
        description: core_days + travel_days.
      - name: fee_line_on_site_cents
        type: integer
        source: computed
        description: Rounded on-site fee line, round_half_up to whole cents before summation.
      - name: fee_line_remote_cents
        type: integer
        source: computed
        description: Rounded remote fee line, round_half_up to whole cents before summation.
      - name: fee_line_witness_cents
        type: integer
        source: computed
        description: Rounded witness fee line, round_half_up to whole cents before summation.
      - name: fee_line_travel_cents
        type: integer
        source: computed
        description: Rounded travel fee line, round_half_up to whole cents before summation.
      - name: assessment_fee_cents
        type: integer
        source: computed
        description: Sum of the four already-rounded fee lines; pinned as round-per-line-then-sum.
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, APPROVED, EXECUTED, CANCELLED}
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent DRAFT->APPROVED transition; null while never approved.
        constraints: nullable, ISO 8601 UTC with three fractional digits
      - name: revision_note
        type: string
        source: system
        description: Note recorded by the most recent APPROVED->DRAFT return; null otherwise.
        constraints: nullable, 1..500 chars
      - name: superseded_by_plan_id
        type: string
        source: system
        description: FK -> AssessmentPlan.id; set on a DRAFT plan that a newer plan for the same application superseded (self-referential). Null on plans that were never superseded.
        constraints: nullable

  - name: WitnessSession
    parent: AssessmentPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> AssessmentPlan.id; the approved plan this witnessing slot belongs to.
      - name: assessor_id
        type: string
        source: input
        description: FK -> Assessor.id; the assessor who will witness the activity.
      - name: activity_type
        type: enum
        source: input
        description: Conformity assessment activity being witnessed.
        constraints: one of {TESTING, CALIBRATION, INSPECTION, MANAGEMENT_REVIEW, INTERNAL_AUDIT}
      - name: site_ref
        type: string
        source: input
        description: Site or laboratory reference where the activity is witnessed.
        constraints: 1..80 chars
      - name: delivery_mode
        type: enum
        source: input
        description: Whether the witnessing is performed on site or remotely.
        constraints: one of {ON_SITE, REMOTE}
      - name: starts_at
        type: datetime
        source: input
        description: Start instant of the witnessing slot, inclusive.
        constraints: ISO 8601 UTC with three fractional digits
      - name: ends_at
        type: datetime
        source: input
        description: End instant of the witnessing slot, exclusive; must be strictly after starts_at.
        constraints: ISO 8601 UTC with three fractional digits
      - name: day_count
        type: integer
        source: computed
        description: Assessor days the slot consumes, ceil of the slot's duration in hours divided by ASSESSMENT_DAY_HOURS.
      - name: status
        type: enum
        source: system
        description: Witnessing slot state.
        default: SCHEDULED
        constraints: one of {SCHEDULED, COMPLETED, ABORTED}
      - name: outcome
        type: enum
        source: system
        description: Result recorded when the slot is completed; null while SCHEDULED or ABORTED.
        constraints: nullable, one of {SATISFACTORY, DEFICIENT}
      - name: evidence_note
        type: string
        source: system
        description: Witness evidence note recorded on completion, or the abort reason recorded on abort; null while SCHEDULED.
        constraints: nullable, 1..500 chars

  - name: Nonconformity
    parent: AccreditationApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> AccreditationApplication.id; the cycle the finding was raised against.
      - name: raised_by_assessor_id
        type: string
        source: system
        description: FK -> Assessor.id; the CONFIRMED team member whose X-User-ID raised the finding.
      - name: clause_ref
        type: string
        source: input
        description: Clause of the international standard the finding is written against.
        constraints: 1..40 chars
      - name: classification
        type: enum
        source: input
        description: Severity classification of the finding; OBSERVATION never blocks a decision and never carries a due date.
        constraints: one of {CRITICAL, MAJOR, MINOR, OBSERVATION}
      - name: statement
        type: string
        source: input
        description: Statement of nonconformity.
        constraints: 1..800 chars
      - name: raised_on
        type: date
        source: system
        description: Logical-clock date the finding was raised.
        constraints: YYYY-MM-DD
      - name: due_on
        type: date
        source: computed
        description: Closure deadline from nonconformity_due_date; null for OBSERVATION.
        constraints: nullable, YYYY-MM-DD
      - name: status
        type: enum
        source: system
        description: Nonconformity and corrective-action lifecycle state.
        default: OPEN
        constraints: one of {OPEN, RESPONSE_SUBMITTED, RESPONSE_ACCEPTED, CLOSED, ESCALATED}
      - name: response_round
        type: integer
        source: system
        description: Number of corrective-action responses submitted so far; incremented on every response submission, never decremented by a rejection.
        default: 0
      - name: root_cause
        type: string
        source: system
        description: Root cause supplied with the most recent corrective-action response; null before the first response.
        constraints: nullable, 1..500 chars
      - name: action_plan
        type: string
        source: system
        description: Corrective action plan supplied with the most recent response; null before the first response.
        constraints: nullable, 1..800 chars
      - name: response_submitted_on
        type: date
        source: system
        description: Logical-clock date of the most recent corrective-action response; null before the first response.
        constraints: nullable, YYYY-MM-DD
      - name: reviewed_by_assessor_id
        type: string
        source: system
        description: FK -> Assessor.id; the assessor who performed the most recent corrective-action review. Null before the first review.
        constraints: nullable
      - name: review_note
        type: string
        source: system
        description: Note recorded by the most recent corrective-action review; null before the first review.
        constraints: nullable, 1..500 chars
      - name: verified_by_assessor_id
        type: string
        source: system
        description: FK -> Assessor.id; the assessor who performed the effectiveness verification. Null before verification.
        constraints: nullable
      - name: verified_evidence_count
        type: integer
        source: system
        description: Number of evidence items cited at effectiveness verification.
        default: 0
      - name: effectiveness_outcome
        type: enum
        source: system
        description: Result of the most recent effectiveness verification; null before verification.
        constraints: nullable, one of {PASS, FAIL}
      - name: closed_on
        type: date
        source: system
        description: Logical-clock date the finding reached CLOSED; null otherwise. Compared with due_on to count late closures in organization_risk_score.
        constraints: nullable, YYYY-MM-DD
      - name: reopen_count
        type: integer
        source: system
        description: Number of times a CLOSED finding was reopened by the compensating reopen action.
        default: 0
      - name: escalated_on
        type: date
        source: system
        description: Logical-clock date the finding was escalated for being overdue; null otherwise.
        constraints: nullable, YYYY-MM-DD

  - name: DecisionRecord
    parent: AccreditationApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: FK -> AccreditationApplication.id; the cycle the independent panel is deciding. Set by the cascade that created the record.
      - name: round
        type: integer
        source: system
        description: Panel round this record covers; equals the application's decision_round at creation time.
      - name: status
        type: enum
        source: system
        description: Panel record state.
        default: VOTING
        constraints: one of {VOTING, DECIDED, DEFERRED}
      - name: votes
        type: array
        source: system
        description: Append-only ballot list. Each element is an object with keys voter_assessor_id (Assessor.id of the DecisionPanelMember who cast it), vote (one of GRANT, GRANT_WITH_CONDITIONS, REFUSE, DEFER), rationale (string), cast_at (ISO 8601 UTC instant). Order is cast order.
        default: []
      - name: vote_count
        type: integer
        source: computed
        description: Length of votes.
        default: 0
      - name: outcome
        type: enum
        source: computed
        description: Panel outcome from panel_decision_outcome, written when the record is finalized; null while VOTING.
        constraints: nullable, one of {GRANT, GRANT_WITH_CONDITIONS, REFUSE, DEFER}
      - name: granted_scope_lines
        type: array
        source: system
        description: Scope lines the panel granted; null unless outcome is GRANT or GRANT_WITH_CONDITIONS.
        constraints: nullable, subset of the application's requested_scope_lines, order as supplied at finalization
      - name: decided_on
        type: date
        source: system
        description: Logical-clock date the record left VOTING; null while VOTING.
        constraints: nullable, YYYY-MM-DD
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the DecisionPanelMember who finalized the record.
        constraints: nullable

  - name: AccreditationScope
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: FK -> AccreditationApplication.id; the granted cycle that produced this scope.
      - name: organization_id
        type: string
        source: system
        description: FK -> ApplicantOrganization.id; the accredited organization.
      - name: scheme_id
        type: string
        source: system
        description: FK -> AccreditationScheme.id; the accreditation program the scope belongs to.
      - name: scope_lines
        type: array
        source: system
        description: Granted scope lines, copied from the DecisionRecord's granted_scope_lines.
      - name: status
        type: enum
        source: system
        description: Scope standing.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, WITHDRAWN}
      - name: effective_from
        type: date
        source: system
        description: Logical-clock date of the granting decision.
        constraints: YYYY-MM-DD
      - name: risk_score_at_grant
        type: integer
        source: system
        description: organization_risk_score AT_DECISION value frozen at grant time; drives surveillance_interval_days_effective.
        constraints: 0..100
      - name: surveillance_interval_days_effective
        type: integer
        source: computed
        description: Risk-tiered surveillance interval from surveillance_schedule.
      - name: next_surveillance_due
        type: date
        source: computed
        description: effective_from plus surveillance_interval_days_effective; recomputed when a surveillance cycle is opened.
        constraints: YYYY-MM-DD
      - name: next_reassessment_due
        type: date
        source: computed
        description: effective_from plus the scheme's reassessment_interval_days; never risk-adjusted.
        constraints: YYYY-MM-DD
      - name: surveillance_risk_score
        type: integer
        source: computed
        description: organization_risk_score AT_SURVEILLANCE_PLANNING value written when a surveillance, reassessment or unannounced cycle is opened against this scope; null before then.
        constraints: nullable, 0..100
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded on the most recent ACTIVE->SUSPENDED transition; null otherwise.
        constraints: nullable, 1..300 chars
      - name: withdrawn_on
        type: date
        source: system
        description: Logical-clock date the scope was withdrawn; null otherwise.
        constraints: nullable, YYYY-MM-DD
      - name: mra_notified
        type: boolean
        source: system
        description: Set true when an international mutual-recognition notification was issued for this scope because a suspension, withdrawal or upheld appeal touched it.
        default: false

  - name: ComplaintAppeal
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: COMPLAINT concerns an accredited organization's conduct; APPEAL contests an accreditation decision and therefore requires application_id.
        constraints: one of {COMPLAINT, APPEAL}
      - name: organization_id
        type: string
        source: input
        description: FK -> ApplicantOrganization.id; the organization the case concerns.
      - name: application_id
        type: string
        source: input
        description: FK -> AccreditationApplication.id; the decided cycle being appealed. Required when kind is APPEAL, must be omitted or null when kind is COMPLAINT.
        constraints: nullable
      - name: reviewer_assessor_id
        type: string
        source: system
        description: FK -> Assessor.id; the independent reviewer assigned to handle the case. Null until a reviewer is assigned.
        constraints: nullable
      - name: summary
        type: string
        source: input
        description: Summary of the complaint or the grounds of appeal.
        constraints: 1..800 chars
      - name: filed_by_name
        type: string
        source: input
        description: Name of the natural person or body filing the case.
        constraints: 1..120 chars
      - name: status
        type: enum
        source: system
        description: Case handling state.
        default: RECEIVED
        constraints: one of {RECEIVED, UNDER_REVIEW, UPHELD, DISMISSED, ESCALATED_MRA}
      - name: resolution_note
        type: string
        source: system
        description: Note recorded at resolution; null while RECEIVED or UNDER_REVIEW.
        constraints: nullable, 1..500 chars
      - name: resolved_on
        type: date
        source: system
        description: Logical-clock date the case was upheld or dismissed; null otherwise. Bounds the 730-day complaint window of organization_risk_score.
        constraints: nullable, YYYY-MM-DD
      - name: mra_body
        type: string
        source: system
        description: Name of the international mutual-recognition body the case was escalated to; null unless ESCALATED_MRA.
        constraints: nullable, 1..120 chars
      - name: mra_escalated_on
        type: date
        source: system
        description: Logical-clock date the case was escalated under mutual-recognition obligations; null unless ESCALATED_MRA.
        constraints: nullable, YYYY-MM-DD

state_machines:
  - entity: AccreditationScheme
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /accreditation/schemes/{scheme_id}/status with to_status UNDER_REVIEW"
        actor: SchemeManager
        preconditions:
          - "scheme.status == DRAFT"
        side_effects:
          - "increments AccreditationScheme.version by 1 and refreshes updated_at"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /accreditation/schemes/{scheme_id}/status with to_status DRAFT and revision_note"
        actor: SchemeManager
        preconditions:
          - "scheme.status == UNDER_REVIEW"
          - "revision_note is present and non-empty"
        side_effects:
          - "sets AccreditationScheme.revision_note to the supplied note"
          - "increments AccreditationScheme.version by 1"
        note: "Rule-development revision loop; rule_revision is NOT touched here, only at the next publication."
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /accreditation/schemes/{scheme_id}/status with to_status PUBLISHED"
        actor: SchemeManager
        preconditions:
          - "scheme.status == UNDER_REVIEW"
          - "witness_min_count, qualification_points_required and all three nc close-day fields are within their declared constraints"
        side_effects:
          - "sets AccreditationScheme.published_at to the current logical-clock instant"
          - "if published_at was already non-null before this transition, increments AccreditationScheme.rule_revision by 1; the first publication leaves rule_revision at 1"
          - "increments AccreditationScheme.version by 1"
      - from: PUBLISHED
        to: UNDER_REVIEW
        trigger: "POST /accreditation/schemes/{scheme_id}/status with to_status UNDER_REVIEW"
        actor: SchemeManager
        preconditions:
          - "scheme.status == PUBLISHED"
        side_effects:
          - "increments AccreditationScheme.version by 1"
        note: "Re-opening a published scheme for revision. Applications already created keep their pinned_scheme_rule_revision, so a later re-publication makes them stale (ERR_SCHEME_VERSION_SUPERSEDED at plan approval)."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /accreditation/schemes/{scheme_id}/status with to_status WITHDRAWN"
        actor: SchemeManager
        preconditions:
          - "scheme.status == PUBLISHED"
        side_effects:
          - "increments AccreditationScheme.version by 1"
          - "no application is mutated; in-flight cycles under this scheme fail at plan approval with ERR_SCHEME_NOT_PUBLISHED"

  - entity: Assessor
    dimension: qualification_status
    initial_state: APPLICANT
    terminal_states: [WITHDRAWN]
    shape: "parallel dimension 1 of 2 - evolves independently of impartiality_status"
    transitions:
      - from: APPLICANT
        to: SCREENING
        trigger: "system, on POST /accreditation/assessors/{assessor_id}/qualifications creating the assessor's first AssessorQualification"
        actor: system
        preconditions:
          - "assessor.qualification_status == APPLICANT"
        side_effects:
          - "sets Assessor.qualification_status to SCREENING and increments Assessor.version by 1"
        note: "impartiality_status is untouched by this transition."
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /accreditation/assessors/{assessor_id}/screen"
        actor: SchemeManager
        preconditions:
          - "assessor.qualification_status == SCREENING"
          - "assessor.granted_qualification_count >= 1"
        side_effects:
          - "sets Assessor.last_screened_on to the current logical-clock date"
          - "re-evaluates the impartiality_status dimension in the same request per impartiality_standing"
          - "increments Assessor.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /accreditation/assessors/{assessor_id}/status with to_status SUSPENDED and reason"
        actor: SchemeManager
        preconditions:
          - "assessor.qualification_status == QUALIFIED"
        side_effects:
          - "sets Assessor.suspension_reason to the supplied reason"
          - "cascade hop 1: every TeamAssignment for this assessor with status PROPOSED becomes REJECTED with recusal_reason 'assessor suspended'"
          - "cascade hop 1: every TeamAssignment for this assessor with status CONFIRMED becomes RECUSED with recusal_reason 'assessor suspended'"
          - "cascade hop 2: each TeamAssignment that just became RECUSED and had role_type LEAD_ASSESSOR on an application in status TEAM_ASSIGNED with no other CONFIRMED LEAD_ASSESSOR moves that AccreditationApplication back to SUBMITTED"
          - "cascade hop 1: every WitnessSession for this assessor with status SCHEDULED becomes ABORTED with evidence_note 'assessor suspended', restoring committed_witness_days and available_witness_days by that session's day_count"
          - "increments Assessor.version by 1"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /accreditation/assessors/{assessor_id}/status with to_status QUALIFIED"
        actor: SchemeManager
        preconditions:
          - "assessor.qualification_status == SUSPENDED"
          - "assessor.granted_qualification_count >= 1"
        side_effects:
          - "sets Assessor.suspension_reason to null"
          - "increments Assessor.version by 1"
          - "does NOT restore any TeamAssignment or WitnessSession the suspension cascade terminated"
        note: "Reinstatement loop; the assessor must be re-proposed to teams by name."
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /accreditation/assessors/{assessor_id}/status with to_status WITHDRAWN and reason"
        actor: SchemeManager
        preconditions:
          - "assessor.qualification_status == QUALIFIED"
        side_effects:
          - "every AssessorQualification of this assessor with status in {PENDING, GRANTED} becomes REVOKED and Assessor.granted_qualification_count becomes 0"
          - "same TeamAssignment and WitnessSession cascade as the SUSPENDED transition"
          - "increments Assessor.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /accreditation/assessors/{assessor_id}/status with to_status WITHDRAWN and reason"
        actor: SchemeManager
        preconditions:
          - "assessor.qualification_status == SUSPENDED"
        side_effects:
          - "every AssessorQualification of this assessor with status in {PENDING, GRANTED} becomes REVOKED and Assessor.granted_qualification_count becomes 0"
          - "increments Assessor.version by 1"

  - entity: Assessor
    dimension: impartiality_status
    initial_state: UNDECLARED
    terminal_states: []
    shape: "parallel dimension 2 of 2 - a RESTRICTED assessor may still be QUALIFIED, and a SUSPENDED assessor may still be SCREENED"
    transitions:
      - from: UNDECLARED
        to: RESTRICTED
        trigger: "POST /accreditation/assessors/{assessor_id}/impartiality-declarations creating a declaration whose severity_class is STRUCTURAL and whose ended_on is null"
        actor: system
        preconditions:
          - "the new declaration is the latest by created_at for its (assessor_id, organization_id) pair"
        side_effects:
          - "sets Assessor.impartiality_status to RESTRICTED and increments Assessor.version by 1"
      - from: SCREENED
        to: RESTRICTED
        trigger: "POST /accreditation/assessors/{assessor_id}/impartiality-declarations creating a declaration whose severity_class is STRUCTURAL and whose ended_on is null"
        actor: system
        preconditions:
          - "the new declaration is the latest by created_at for its (assessor_id, organization_id) pair"
        side_effects:
          - "sets Assessor.impartiality_status to RESTRICTED and increments Assessor.version by 1"
      - from: UNDECLARED
        to: SCREENED
        trigger: "POST /accreditation/assessors/{assessor_id}/screen"
        actor: SchemeManager
        preconditions:
          - "impartiality_standing evaluates to SCREENED - no (assessor_id, organization_id) pair whose latest declaration by created_at has severity_class STRUCTURAL and ended_on null"
        side_effects:
          - "sets Assessor.impartiality_status to SCREENED, sets last_screened_on, increments Assessor.version by 1"
      - from: RESTRICTED
        to: SCREENED
        trigger: "POST /accreditation/assessors/{assessor_id}/screen"
        actor: SchemeManager
        preconditions:
          - "impartiality_standing evaluates to SCREENED because, for every (assessor_id, organization_id) pair, the latest declaration by created_at either is not STRUCTURAL or carries a non-null ended_on"
        side_effects:
          - "sets Assessor.impartiality_status to SCREENED, sets last_screened_on, increments Assessor.version by 1"
        note: "Restriction-clearing loop: because declarations are immutable, an ongoing structural relationship is closed by filing a NEWER declaration for the same pair that carries ended_on."
      - from: SCREENED
        to: SCREENED
        trigger: "POST /accreditation/assessors/{assessor_id}/screen"
        actor: SchemeManager
        preconditions:
          - "impartiality_standing evaluates to SCREENED"
        side_effects:
          - "refreshes Assessor.last_screened_on and increments Assessor.version by 1"

  - entity: AssessorQualification
    initial_state: PENDING
    terminal_states: [REVOKED]
    shape: branching
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /accreditation/qualifications/{qualification_id}/verify-evidence"
        actor: SchemeManager
        preconditions:
          - "qualification.status == PENDING"
          - "verified_points from assessor_competence_points VERIFIED_FINAL >= scheme.qualification_points_required"
          - "verified_witness_days >= ROLE_MIN_WITNESS_DAYS for qualification.role_type"
        side_effects:
          - "writes verified_witness_days, verified_training_modules, verified_years_experience, verified_points and evidence_verified_at"
          - "sets granted_on to the current logical-clock date and expires_on to granted_on + QUALIFICATION_VALID_DAYS (1460)"
          - "increments Assessor.granted_qualification_count by 1 and Assessor.version by 1"
      - from: PENDING
        to: PENDING
        trigger: "POST /accreditation/qualifications/{qualification_id}/verify-evidence with evidence below the grant thresholds"
        actor: SchemeManager
        preconditions:
          - "qualification.status == PENDING"
          - "verified_points < scheme.qualification_points_required OR verified_witness_days < ROLE_MIN_WITNESS_DAYS for role_type"
        side_effects:
          - "writes verified_witness_days, verified_training_modules, verified_years_experience, verified_points and evidence_verified_at; status stays PENDING and granted_on stays null"
          - "increments AssessorQualification.version by 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "system, lazily on POST /accreditation/team-assignments/{assignment_id}/confirm when the current logical-clock date > qualification.expires_on"
        actor: system
        preconditions:
          - "qualification.status == GRANTED"
          - "current logical-clock date > qualification.expires_on"
        side_effects:
          - "sets AssessorQualification.status to EXPIRED, decrements Assessor.granted_qualification_count by 1"
          - "the confirm request that observed the expiry is rejected with ERR_QUALIFICATION_NOT_GRANTED"
      - from: GRANTED
        to: REVOKED
        trigger: "system, on the Assessor transition into WITHDRAWN"
        actor: system
        preconditions:
          - "assessor.qualification_status transitions to WITHDRAWN"
        side_effects:
          - "sets AssessorQualification.status to REVOKED and increments its version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "system, on the Assessor transition into WITHDRAWN"
        actor: system
        preconditions:
          - "assessor.qualification_status transitions to WITHDRAWN"
        side_effects:
          - "sets AssessorQualification.status to REVOKED and increments its version by 1"

  - entity: TeamAssignment
    initial_state: PROPOSED
    terminal_states: [RECUSED, REJECTED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /accreditation/team-assignments/{assignment_id}/confirm"
        actor: AssessmentManager
        preconditions:
          - "assignment.status == PROPOSED"
          - "application.status in {SUBMITTED, TEAM_ASSIGNED}"
          - "application.suspension_blocked == false"
          - "assessor.qualification_status == QUALIFIED"
          - "assessor.impartiality_status != RESTRICTED"
          - "an AssessorQualification exists for (assignment.assessor_id, application.scheme_id, assignment.role_type) with status GRANTED and expires_on >= current logical-clock date"
          - "impartiality_conflict_verdict for (assignment.assessor_id, application.organization_id) != BLOCKED"
        side_effects:
          - "writes conflict_verdict (CLEARED or CLEARED_WITH_NOTE) and conflict_checked_at"
          - "cascade hop 1: when role_type == LEAD_ASSESSOR and application.status == SUBMITTED, moves AccreditationApplication to TEAM_ASSIGNED and increments its version by 1"
          - "cascade hop 2: that application transition moves ApplicantOrganization from APPLIED to UNDER_ASSESSMENT and increments the organization's version by 1"
          - "increments TeamAssignment.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "system, on the Assessor transition into SUSPENDED or WITHDRAWN"
        actor: system
        preconditions:
          - "assignment.status == PROPOSED"
        side_effects:
          - "sets recusal_reason to 'assessor suspended' or 'assessor withdrawn' and increments TeamAssignment.version by 1"
      - from: CONFIRMED
        to: RECUSED
        trigger: "POST /accreditation/team-assignments/{assignment_id}/recuse with reason"
        actor: AssessmentManager
        preconditions:
          - "assignment.status == CONFIRMED"
          - "application.status in {SUBMITTED, TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN}"
        side_effects:
          - "sets recusal_reason to the supplied reason"
          - "cascade hop 1: when the recused assignment had role_type LEAD_ASSESSOR and no other CONFIRMED LEAD_ASSESSOR remains on the application and application.status == TEAM_ASSIGNED, moves the AccreditationApplication back to SUBMITTED and increments its version by 1"
          - "increments TeamAssignment.version by 1"
      - from: CONFIRMED
        to: RECUSED
        trigger: "system, on the Assessor transition into SUSPENDED or WITHDRAWN"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
        side_effects:
          - "sets recusal_reason to 'assessor suspended' or 'assessor withdrawn' and increments TeamAssignment.version by 1"

  - entity: AssessmentPlan
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    shape: "branching with revert"
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /accreditation/assessment-plans/{plan_id}/approve"
        actor: AssessmentManager
        preconditions:
          - "plan.status == DRAFT"
          - "application.status in {SUBMITTED, TEAM_ASSIGNED}"
          - "application.suspension_blocked == false"
          - "scheme.status == PUBLISHED"
          - "scheme.rule_revision == application.pinned_scheme_rule_revision"
          - "at least one TeamAssignment on the application has status CONFIRMED and role_type LEAD_ASSESSOR"
          - "mode != REMOTE unless scheme.remote_assessment_allowed == true"
          - "mode != REMOTE unless scheme.witness_min_count == 0"
        side_effects:
          - "computes witness_days_planned, core_days, travel_days and total_effort_days per assessment_effort_days"
          - "computes the four fee lines and assessment_fee_cents per assessment_fee"
          - "sets approved_at to the current logical-clock instant"
          - "cascade hop 1: moves AccreditationApplication from TEAM_ASSIGNED to PLANNED, writes planned_effort_days = total_effort_days and increments the application's version by 1"
          - "increments AssessmentPlan.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /accreditation/assessment-plans/{plan_id}/return-to-draft with revision_note"
        actor: AssessmentManager
        preconditions:
          - "plan.status == APPROVED"
          - "application.status == PLANNED"
          - "no WitnessSession under this plan has status COMPLETED"
        side_effects:
          - "sets revision_note, clears approved_at to null"
          - "cascade hop 1: every WitnessSession under this plan with status SCHEDULED becomes ABORTED with evidence_note 'plan returned to draft'"
          - "cascade hop 2: each such abort restores that session's day_count to Assessor.committed_witness_days (decrement) and Assessor.available_witness_days (increment), keeping the witness-day ledger invariant"
          - "cascade hop 1: moves AccreditationApplication from PLANNED back to TEAM_ASSIGNED, sets planned_effort_days to null and increments the application's version by 1"
          - "increments AssessmentPlan.version by 1"
        note: "Plan revision loop; the fee lines computed by the earlier approval are recomputed from scratch at the next approval."
      - from: APPROVED
        to: EXECUTED
        trigger: "system, on POST /accreditation/applications/{application_id}/close-assessment"
        actor: system
        preconditions:
          - "plan.status == APPROVED"
        side_effects:
          - "sets AssessmentPlan.status to EXECUTED and increments its version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "system, on POST /accreditation/applications/{application_id}/assessment-plans creating a newer plan for the same application"
        actor: system
        preconditions:
          - "plan.status == DRAFT"
        side_effects:
          - "sets superseded_by_plan_id to the id of the newly created plan and increments this plan's version by 1"

  - entity: WitnessSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /accreditation/witness-sessions/{session_id}/outcome with result_status COMPLETED"
        actor: LeadAssessor
        preconditions:
          - "session.status == SCHEDULED"
          - "the acting X-User-ID equals session.assessor_id"
          - "plan.status == APPROVED"
          - "application.suspension_blocked == false"
          - "outcome is present and is one of {SATISFACTORY, DEFICIENT}"
        side_effects:
          - "writes outcome and evidence_note"
          - "cascade hop 1: refreshes AssessorQualification.last_witness_on to the current logical-clock date for the (session.assessor_id, application.scheme_id) qualification whose status is GRANTED, and increments that qualification's version by 1"
          - "cascade hop 1: recomputes AccreditationApplication.completed_witness_session_count"
          - "cascade hop 1: when application.status == PLANNED, moves the AccreditationApplication to IN_ASSESSMENT and increments its version by 1"
          - "increments WitnessSession.version by 1"
        note: "committed_witness_days is NOT released on completion - a completed day is consumed capacity."
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /accreditation/witness-sessions/{session_id}/outcome with result_status ABORTED"
        actor: LeadAssessor
        preconditions:
          - "session.status == SCHEDULED"
          - "the acting X-User-ID equals session.assessor_id"
          - "outcome is omitted"
        side_effects:
          - "writes evidence_note with the abort reason"
          - "compensating: decrements Assessor.committed_witness_days by session.day_count and increments Assessor.available_witness_days by the same day_count, leaving annual_witness_capacity_days == committed + available"
          - "increments Assessor.version by 1 and WitnessSession.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system, on the Assessor transition into SUSPENDED or WITHDRAWN, or on the AssessmentPlan APPROVED->DRAFT revert, or on the scope-suspension cascade"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "writes evidence_note with the cascade reason and restores the assessor's witness-day ledger by session.day_count"
          - "increments WitnessSession.version by 1"

  - entity: AccreditationApplication
    initial_state: SUBMITTED
    terminal_states: [GRANTED, WITHDRAWN]
    shape: "cyclic - DECISION_PENDING -> NC_OPEN -> DECISION_PENDING panel deferral loop; REFUSED is re-openable only by an upheld appeal"
    transitions:
      - from: SUBMITTED
        to: TEAM_ASSIGNED
        trigger: "system, on the first LEAD_ASSESSOR TeamAssignment reaching CONFIRMED"
        actor: system
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "cascade hop 2: moves ApplicantOrganization from APPLIED to UNDER_ASSESSMENT"
          - "increments AccreditationApplication.version by 1"
      - from: TEAM_ASSIGNED
        to: SUBMITTED
        trigger: "system, on the recusal of the last CONFIRMED LEAD_ASSESSOR TeamAssignment"
        actor: system
        preconditions:
          - "application.status == TEAM_ASSIGNED"
          - "no TeamAssignment on the application has status CONFIRMED and role_type LEAD_ASSESSOR"
        side_effects:
          - "increments AccreditationApplication.version by 1"
        note: "Team-assembly loop; the organization stays UNDER_ASSESSMENT."
      - from: TEAM_ASSIGNED
        to: PLANNED
        trigger: "system, on an AssessmentPlan of this application reaching APPROVED"
        actor: system
        preconditions:
          - "application.status == TEAM_ASSIGNED"
        side_effects:
          - "writes planned_effort_days from the approved plan's total_effort_days"
          - "increments AccreditationApplication.version by 1"
      - from: PLANNED
        to: TEAM_ASSIGNED
        trigger: "system, on the APPROVED->DRAFT revert of the application's approved AssessmentPlan"
        actor: system
        preconditions:
          - "application.status == PLANNED"
        side_effects:
          - "sets planned_effort_days to null"
          - "increments AccreditationApplication.version by 1"
      - from: PLANNED
        to: IN_ASSESSMENT
        trigger: "system, on the first WitnessSession under the application's approved plan reaching COMPLETED"
        actor: system
        preconditions:
          - "application.status == PLANNED"
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: IN_ASSESSMENT
        to: NC_OPEN
        trigger: "POST /accreditation/applications/{application_id}/close-assessment"
        actor: AssessmentManager
        preconditions:
          - "application.status == IN_ASSESSMENT"
          - "application.suspension_blocked == false"
          - "application.completed_witness_session_count >= the pinned scheme revision's witness_min_count"
          - "the sum of day_count over the WitnessSession rows of the application's APPROVED AssessmentPlan whose status is COMPLETED is >= that plan's witness_days_planned"
          - "application.nc_blocking_open_count >= 1"
        side_effects:
          - "moves the application's APPROVED AssessmentPlan to EXECUTED"
          - "increments AccreditationApplication.version by 1"
      - from: IN_ASSESSMENT
        to: DECISION_PENDING
        trigger: "POST /accreditation/applications/{application_id}/close-assessment"
        actor: AssessmentManager
        preconditions:
          - "application.status == IN_ASSESSMENT"
          - "application.suspension_blocked == false"
          - "application.completed_witness_session_count >= the pinned scheme revision's witness_min_count"
          - "the sum of day_count over the WitnessSession rows of the application's APPROVED AssessmentPlan whose status is COMPLETED is >= that plan's witness_days_planned"
          - "application.nc_blocking_open_count == 0"
        side_effects:
          - "moves the application's APPROVED AssessmentPlan to EXECUTED"
          - "cascade hop 1: creates a DecisionRecord with status VOTING, round = application.decision_round and empty votes"
          - "cascade hop 2: recomputes ApplicantOrganization.risk_score under the organization_risk_score AT_DECISION variant and increments the organization's version by 1"
          - "increments AccreditationApplication.version by 1"
      - from: NC_OPEN
        to: DECISION_PENDING
        trigger: "system, on the last blocking Nonconformity of the application reaching CLOSED"
        actor: system
        preconditions:
          - "application.status == NC_OPEN"
          - "application.nc_blocking_open_count == 0"
        side_effects:
          - "cascade hop 1: creates a DecisionRecord with status VOTING and round = application.decision_round when no DecisionRecord of that round is in VOTING"
          - "cascade hop 2: recomputes ApplicantOrganization.risk_score under the AT_DECISION variant and increments the organization's version by 1"
          - "increments AccreditationApplication.version by 1"
      - from: DECISION_PENDING
        to: NC_OPEN
        trigger: "system, on a DecisionRecord of this application being finalized with outcome DEFER, or on a CLOSED Nonconformity of this application being reopened"
        actor: system
        preconditions:
          - "application.status == DECISION_PENDING"
        side_effects:
          - "increments AccreditationApplication.decision_round by 1"
          - "increments AccreditationApplication.version by 1"
        note: "Panel deferral loop: the next time the blocking count returns to zero a fresh DecisionRecord is created for the new round."
      - from: DECISION_PENDING
        to: GRANTED
        trigger: "system, on POST /accreditation/decisions/{decision_id}/finalize resolving to GRANT or GRANT_WITH_CONDITIONS"
        actor: system
        preconditions:
          - "application.status == DECISION_PENDING"
        side_effects:
          - "cascade hop 2: creates an AccreditationScope with status ACTIVE, effective_from = current logical-clock date, scope_lines = the decision's granted_scope_lines, risk_score_at_grant = organization.risk_score and the two due dates from surveillance_schedule"
          - "cascade hop 3: moves ApplicantOrganization to ACCREDITED, recomputes active_scope_count and risk_score, and increments the organization's version by 1"
          - "increments AccreditationApplication.version by 1"
      - from: DECISION_PENDING
        to: REFUSED
        trigger: "system, on POST /accreditation/decisions/{decision_id}/finalize resolving to REFUSE"
        actor: system
        preconditions:
          - "application.status == DECISION_PENDING"
        side_effects:
          - "cascade hop 2: moves ApplicantOrganization to APPLIED when organization.active_scope_count == 0, otherwise leaves it ACCREDITED, and recomputes risk_score"
          - "increments AccreditationApplication.version by 1"
      - from: REFUSED
        to: DECISION_PENDING
        trigger: "system, on POST /accreditation/complaints/{complaint_id}/resolve upholding an APPEAL whose application_id is this application"
        actor: system
        preconditions:
          - "application.status == REFUSED"
        side_effects:
          - "increments AccreditationApplication.decision_round by 1"
          - "creates a fresh DecisionRecord with status VOTING for the new round"
          - "increments AccreditationApplication.version by 1"
        note: "The only path out of REFUSED; an upheld appeal returns the cycle to the independent panel."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system, on the withdrawal of the AccreditationScope named by origin_scope_id"
        actor: system
        preconditions:
          - "application.status in {SUBMITTED, TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN, DECISION_PENDING}"
          - "application.origin_scope_id == the withdrawn scope's id"
        side_effects:
          - "increments AccreditationApplication.version by 1"
        note: "Declared once for SUBMITTED; the identical transition applies from TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN and DECISION_PENDING."

  - entity: Nonconformity
    initial_state: OPEN
    terminal_states: [ESCALATED]
    shape: "cyclic - OPEN -> RESPONSE_SUBMITTED -> OPEN rejection loop and RESPONSE_ACCEPTED -> OPEN effectiveness-failure loop"
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/responses"
        actor: ApplicantContact
        preconditions:
          - "nonconformity.status == OPEN"
          - "nonconformity.classification != OBSERVATION"
          - "application.status == NC_OPEN"
          - "application.suspension_blocked == false"
          - "the acting X-User-ID equals application.organization_id"
          - "current logical-clock date <= nonconformity.due_on"
          - "expected_nonconformity_version equals nonconformity.version"
        side_effects:
          - "increments response_round by 1 and writes root_cause, action_plan and response_submitted_on"
          - "increments Nonconformity.version by 1"
        note: "A resubmission after a rejection supersedes the prior response text and increments response_round again."
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_ACCEPTED
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/review with outcome ACCEPT"
        actor: LeadAssessor
        preconditions:
          - "nonconformity.status == RESPONSE_SUBMITTED"
          - "the acting X-User-ID is an Assessor with a CONFIRMED TeamAssignment of role_type LEAD_ASSESSOR on the application"
        side_effects:
          - "writes reviewed_by_assessor_id = the acting assessor id and review_note"
          - "increments Nonconformity.version by 1"
      - from: RESPONSE_SUBMITTED
        to: OPEN
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/review with outcome REJECT"
        actor: LeadAssessor
        preconditions:
          - "nonconformity.status == RESPONSE_SUBMITTED"
          - "the acting X-User-ID is an Assessor with a CONFIRMED TeamAssignment of role_type LEAD_ASSESSOR on the application"
        side_effects:
          - "writes reviewed_by_assessor_id and review_note; leaves response_round, root_cause and action_plan as submitted"
          - "increments Nonconformity.version by 1"
        note: "Corrective-action rejection loop; the applicant may resubmit while the due date has not passed."
      - from: RESPONSE_ACCEPTED
        to: CLOSED
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness with outcome PASS"
        actor: LeadAssessor
        preconditions:
          - "nonconformity.status == RESPONSE_ACCEPTED"
          - "the acting X-User-ID is an Assessor with a CONFIRMED TeamAssignment of role_type in {LEAD_ASSESSOR, TECHNICAL_ASSESSOR} on the application"
          - "the acting X-User-ID != nonconformity.reviewed_by_assessor_id"
          - "verified_evidence_count >= MIN_EFFECTIVENESS_EVIDENCE for nonconformity.classification"
        side_effects:
          - "writes verified_by_assessor_id, verified_evidence_count, effectiveness_outcome = PASS and closed_on = current logical-clock date"
          - "cascade hop 1: decrements AccreditationApplication.nc_blocking_open_count by 1 and increments nc_closed_count by 1, leaving nc_total_count unchanged, and increments the application's version by 1"
          - "cascade hop 2: when the application is NC_OPEN and nc_blocking_open_count has reached 0, moves the application to DECISION_PENDING and creates a DecisionRecord with status VOTING for the current decision_round"
          - "cascade hop 3: that DecisionRecord creation recomputes ApplicantOrganization.risk_score under the AT_DECISION variant and increments the organization's version by 1"
          - "increments Nonconformity.version by 1"
      - from: RESPONSE_ACCEPTED
        to: OPEN
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness with outcome FAIL"
        actor: LeadAssessor
        preconditions:
          - "nonconformity.status == RESPONSE_ACCEPTED"
          - "the acting X-User-ID is an Assessor with a CONFIRMED TeamAssignment of role_type in {LEAD_ASSESSOR, TECHNICAL_ASSESSOR} on the application"
          - "the acting X-User-ID != nonconformity.reviewed_by_assessor_id"
        side_effects:
          - "writes verified_by_assessor_id, verified_evidence_count and effectiveness_outcome = FAIL; closed_on stays null"
          - "leaves AccreditationApplication.nc_blocking_open_count unchanged - the finding never left the blocking set"
          - "increments Nonconformity.version by 1"
        note: "Effectiveness-failure loop; the applicant must submit a further response."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/escalate"
        actor: AssessmentManager
        preconditions:
          - "nonconformity.status in {OPEN, RESPONSE_SUBMITTED}"
          - "nonconformity.classification in {CRITICAL, MAJOR}"
          - "current logical-clock date > nonconformity.due_on"
        side_effects:
          - "writes escalated_on = current logical-clock date; the finding stays inside nc_blocking_open_count"
          - "cascade hop 1: recomputes ApplicantOrganization.risk_score under the AT_DECISION variant of the escalated application"
          - "cascade hop 2: when application.origin_scope_id is not null and that AccreditationScope is ACTIVE, moves the scope to SUSPENDED with suspension_reason 'escalated nonconformity' and sets mra_notified = true"
          - "cascade hop 3: that scope suspension moves ApplicantOrganization to SUSPENDED and copies the suspension reason onto the organization"
          - "cascade hop 4: that organization suspension sets suspension_blocked = true on every AccreditationApplication of the organization whose status is in {SUBMITTED, TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN} other than the escalated one"
          - "cascade hop 5: every AssessmentPlan of those blocked applications whose status is DRAFT becomes CANCELLED, and every WitnessSession whose status is SCHEDULED under any AssessmentPlan of those blocked applications becomes ABORTED with the witnessing assessor's committed_witness_days restored"
          - "increments Nonconformity.version by 1"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/escalate"
        actor: AssessmentManager
        preconditions:
          - "nonconformity.status == RESPONSE_SUBMITTED"
          - "nonconformity.classification in {CRITICAL, MAJOR}"
          - "current logical-clock date > nonconformity.due_on"
        side_effects:
          - "identical five-hop cascade as the OPEN->ESCALATED transition"
          - "increments Nonconformity.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /accreditation/nonconformities/{nonconformity_id}/reopen with reason"
        actor: AssessmentManager
        preconditions:
          - "nonconformity.status == CLOSED"
          - "application.status in {NC_OPEN, DECISION_PENDING}"
        side_effects:
          - "compensating: increments reopen_count by 1, clears closed_on and effectiveness_outcome to null, and writes the reason into review_note"
          - "compensating cascade hop 1: increments AccreditationApplication.nc_blocking_open_count by 1 and decrements nc_closed_count by 1, leaving nc_total_count unchanged"
          - "compensating cascade hop 2: when application.status == DECISION_PENDING, moves the application back to NC_OPEN, increments decision_round by 1 and moves the VOTING DecisionRecord of the previous round to DEFERRED"
          - "increments Nonconformity.version by 1"

  - entity: DecisionRecord
    initial_state: VOTING
    terminal_states: [DECIDED, DEFERRED]
    shape: "branching - the ballot mix decides which of three exits is taken"
    transitions:
      - from: VOTING
        to: VOTING
        trigger: "POST /accreditation/decisions/{decision_id}/votes"
        actor: DecisionPanelMember
        preconditions:
          - "decision.status == VOTING"
          - "the acting X-User-ID is an Assessor with qualification_status QUALIFIED"
          - "no TeamAssignment with status in {PROPOSED, CONFIRMED, RECUSED} exists for (the acting assessor, decision.application_id)"
          - "no element of decision.votes already has voter_assessor_id equal to the acting X-User-ID"
        side_effects:
          - "appends { voter_assessor_id, vote, rationale, cast_at } to votes and recomputes vote_count"
          - "increments DecisionRecord.version by 1"
      - from: VOTING
        to: DECIDED
        trigger: "POST /accreditation/decisions/{decision_id}/finalize"
        actor: DecisionPanelMember
        preconditions:
          - "decision.status == VOTING"
          - "application.status == DECISION_PENDING"
          - "decision.vote_count >= MIN_PANEL_VOTES (3)"
          - "panel_decision_outcome resolves to GRANT, GRANT_WITH_CONDITIONS or REFUSE"
          - "for GRANT and GRANT_WITH_CONDITIONS every element of granted_scope_lines appears in application.requested_scope_lines"
          - "for GRANT_WITH_CONDITIONS the length of granted_scope_lines is strictly less than the length of application.requested_scope_lines"
        side_effects:
          - "writes outcome, granted_scope_lines, decided_on and decided_by_user_id"
          - "cascade hop 1: moves the AccreditationApplication to GRANTED (GRANT, GRANT_WITH_CONDITIONS) or REFUSED (REFUSE)"
          - "cascade hop 2: on a grant, creates the AccreditationScope; on a refusal, no scope is created"
          - "cascade hop 3: updates ApplicantOrganization.status, active_scope_count and risk_score"
          - "increments DecisionRecord.version by 1"
      - from: VOTING
        to: DEFERRED
        trigger: "POST /accreditation/decisions/{decision_id}/finalize where panel_decision_outcome resolves to DEFER"
        actor: DecisionPanelMember
        preconditions:
          - "decision.status == VOTING"
          - "application.status == DECISION_PENDING"
          - "decision.vote_count >= MIN_PANEL_VOTES (3)"
          - "panel_decision_outcome resolves to DEFER"
        side_effects:
          - "writes outcome = DEFER, decided_on and decided_by_user_id; granted_scope_lines stays null"
          - "cascade hop 1: moves the AccreditationApplication from DECISION_PENDING back to NC_OPEN and increments its decision_round by 1"
          - "increments DecisionRecord.version by 1"
      - from: VOTING
        to: DEFERRED
        trigger: "system, on a CLOSED Nonconformity of the application being reopened while this record is VOTING"
        actor: system
        preconditions:
          - "decision.status == VOTING"
        side_effects:
          - "writes outcome = DEFER and decided_on; the votes list is preserved as an audit record"
          - "increments DecisionRecord.version by 1"

  - entity: AccreditationScope
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    shape: "cyclic - ACTIVE -> SUSPENDED -> ACTIVE restore loop"
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accreditation/scopes/{scope_id}/status with to_status SUSPENDED and reason, or system on the escalation of a Nonconformity belonging to a cycle spawned by this scope"
        actor: SchemeManager
        preconditions:
          - "scope.status == ACTIVE"
        side_effects:
          - "writes suspension_reason and sets mra_notified = true"
          - "cascade hop 1: moves ApplicantOrganization to SUSPENDED, copies the suspension reason and recomputes active_scope_count"
          - "cascade hop 2: sets suspension_blocked = true on every AccreditationApplication of the organization whose status is in {SUBMITTED, TEAM_ASSIGNED, PLANNED, IN_ASSESSMENT, NC_OPEN}"
          - "cascade hop 3: every AssessmentPlan of those blocked applications whose status is DRAFT becomes CANCELLED, and every WitnessSession whose status is SCHEDULED under any AssessmentPlan of those blocked applications becomes ABORTED with the witnessing assessor's committed_witness_days restored"
          - "increments AccreditationScope.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accreditation/scopes/{scope_id}/status with to_status ACTIVE"
        actor: SchemeManager
        preconditions:
          - "scope.status == SUSPENDED"
          - "no Nonconformity with status ESCALATED exists on any AccreditationApplication whose origin_scope_id == scope.id or whose id == scope.application_id"
        side_effects:
          - "sets suspension_reason to null"
          - "cascade hop 1: recomputes ApplicantOrganization.active_scope_count and moves the organization to ACCREDITED when that count is >= 1"
          - "cascade hop 2: clears suspension_blocked to false on every AccreditationApplication of the organization"
          - "increments AccreditationScope.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /accreditation/scopes/{scope_id}/status with to_status WITHDRAWN and reason"
        actor: SchemeManager
        preconditions:
          - "scope.status == ACTIVE"
        side_effects:
          - "writes withdrawn_on = current logical-clock date and sets mra_notified = true"
          - "cascade hop 1: every AccreditationApplication whose origin_scope_id == scope.id and whose status is not in {GRANTED, REFUSED, WITHDRAWN} becomes WITHDRAWN"
          - "cascade hop 2: recomputes ApplicantOrganization.active_scope_count and moves the organization to WITHDRAWN when that count reaches 0"
          - "increments AccreditationScope.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /accreditation/scopes/{scope_id}/status with to_status WITHDRAWN and reason"
        actor: SchemeManager
        preconditions:
          - "scope.status == SUSPENDED"
        side_effects:
          - "identical cascade as the ACTIVE->WITHDRAWN transition"
          - "increments AccreditationScope.version by 1"

  - entity: ComplaintAppeal
    initial_state: RECEIVED
    terminal_states: [DISMISSED, ESCALATED_MRA]
    shape: branching
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /accreditation/complaints/{complaint_id}/review with reviewer_assessor_id"
        actor: ComplaintOfficer
        preconditions:
          - "complaint.status == RECEIVED"
          - "the reviewer Assessor has qualification_status QUALIFIED"
          - "the reviewer has impartiality_conflict_verdict != BLOCKED for (reviewer, complaint.organization_id)"
          - "when kind == APPEAL, the reviewer has no TeamAssignment with status in {PROPOSED, CONFIRMED, RECUSED} on complaint.application_id and appears in no DecisionRecord.votes element of that application"
        side_effects:
          - "writes reviewer_assessor_id"
          - "increments ComplaintAppeal.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /accreditation/complaints/{complaint_id}/resolve with outcome UPHELD"
        actor: ComplaintOfficer
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "writes resolution_note and resolved_on = current logical-clock date"
          - "cascade hop 1: increments ApplicantOrganization.upheld_complaint_count and recomputes risk_score under the AT_DECISION variant"
          - "cascade hop 2: when kind == APPEAL and the appealed AccreditationApplication is REFUSED, moves that application back to DECISION_PENDING, increments its decision_round by 1 and creates a fresh VOTING DecisionRecord"
          - "increments ComplaintAppeal.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /accreditation/complaints/{complaint_id}/resolve with outcome DISMISSED"
        actor: ComplaintOfficer
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "writes resolution_note and resolved_on; no organization counter changes"
          - "increments ComplaintAppeal.version by 1"
      - from: UPHELD
        to: ESCALATED_MRA
        trigger: "POST /accreditation/complaints/{complaint_id}/mra-escalation with mra_body"
        actor: ComplaintOfficer
        preconditions:
          - "complaint.status == UPHELD"
        side_effects:
          - "writes mra_body and mra_escalated_on = current logical-clock date"
          - "cascade hop 1: increments ApplicantOrganization.mra_escalation_count by 1"
          - "cascade hop 2: sets mra_notified = true on every AccreditationScope of the organization whose status is in {ACTIVE, SUSPENDED}"
          - "increments ComplaintAppeal.version by 1"

concurrency_rules:
  - rule_id: plan-create-stale-application
    parent_entity: AccreditationApplication
    write_endpoint: "POST /accreditation/applications/{application_id}/assessment-plans"
    occ_field: "expected_application_version"
    description: |
      Creating an AssessmentPlan against an AccreditationApplication whose version
      has advanced since the client last read it is rejected. A new plan legitimately
      supersedes any DRAFT plan of the same application (the superseded plan is
      CANCELLED and carries superseded_by_plan_id), so the write cannot be resolved
      by a state precondition alone - the second creation would otherwise succeed on
      a stale view in which the team, the pinned scheme revision or an earlier plan
      still looked the way the client remembered.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: response-submit-stale-nonconformity
    parent_entity: Nonconformity
    write_endpoint: "POST /accreditation/nonconformities/{nonconformity_id}/responses"
    occ_field: "expected_nonconformity_version"
    description: |
      Submitting a corrective-action response against a Nonconformity whose version
      has advanced since the applicant last read it is rejected. A fresh response
      legitimately supersedes the prior response text after a rejection review, so
      the submission is valid from OPEN more than once; only the stale-version check
      distinguishes a response written against the reviewer's latest feedback from one
      written against feedback the applicant never saw.
    error_id: ERR_STALE_NONCONFORMITY_VERSION
    http_status: 412

calculations:
  - name: assessor_competence_points
    trigger: "on POST /accreditation/assessors/{assessor_id}/qualifications (DECLARED_PROVISIONAL variant, writing declared_points) and on POST /accreditation/qualifications/{qualification_id}/verify-evidence (VERIFIED_FINAL variant, writing verified_points)"
    algorithm: weighted_scoring
    formula: |
      # four weighted factors, each individually capped, then a recency multiplier
      experience_points = min(40, 4 * years_experience)
      witness_points    = min(30, 5 * witness_days)
      training_points   = min(20, 10 * training_modules)
      integrity_points  = 10 if assessor.employment_type == "INTERNAL" else 6
      raw_points        = experience_points + witness_points + training_points + integrity_points
      points            = round_half_up(raw_points * recency_factor, 2)

      # the caps are per-factor, never on raw_points: an assessor may reach 100.00
      # only by maxing experience, witnessing and training AND being INTERNAL.

      # granting decision, evaluated only by the VERIFIED_FINAL variant:
      if verified_points >= scheme.qualification_points_required
         and verified_witness_days >= ROLE_MIN_WITNESS_DAYS[qualification.role_type]:
          qualification.status = "GRANTED"
          qualification.granted_on = clock_date
          qualification.expires_on = clock_date + QUALIFICATION_VALID_DAYS
      else:
          qualification.status stays "PENDING"   # never an error
    input_set: |
      The DECLARED_PROVISIONAL variant reads only the declared_years_experience,
      declared_witness_days and declared_training_modules supplied at creation.
      The VERIFIED_FINAL variant reads only the verified_years_experience,
      verified_witness_days and verified_training_modules supplied by the verifier,
      plus last_witness_on for recency. Qualifications in status REVOKED or EXPIRED
      are never recalculated.
    constants:
      EXPERIENCE_POINTS_PER_YEAR: 4
      EXPERIENCE_POINTS_CAP: 40
      WITNESS_POINTS_PER_DAY: 5
      WITNESS_POINTS_CAP: 30
      TRAINING_POINTS_PER_MODULE: 10
      TRAINING_POINTS_CAP: 20
      INTEGRITY_POINTS_INTERNAL: 10
      INTEGRITY_POINTS_CONTRACT: 6
      RECENCY_FACTOR_CURRENT: 1.00
      RECENCY_FACTOR_LAPSED_1Y: 0.90
      RECENCY_FACTOR_LAPSED_2Y: 0.75
      RECENCY_CURRENT_MAX_DAYS: 365
      RECENCY_LAPSED_1Y_MAX_DAYS: 730
      QUALIFICATION_VALID_DAYS: 1460
      ROLE_MIN_WITNESS_DAYS: "{ LEAD_ASSESSOR: 4, TECHNICAL_ASSESSOR: 2, TECHNICAL_EXPERT: 0 }"
    precision: "2 decimal places, round_half_up; the multiplication by recency_factor is the only rounding site"
    variants:
      - name: DECLARED_PROVISIONAL
        when: "at qualification creation, when only the assessor's self-declared evidence exists"
        difference: "uses the declared_* counts and pins recency_factor to 1.00 regardless of last_witness_on; writes declared_points; can never move the qualification out of PENDING"
      - name: VERIFIED_FINAL
        when: "at evidence verification, when the qualification officer has confirmed the counts"
        difference: "uses the verified_* counts and derives recency_factor from days_since_last_witness = clock_date - last_witness_on: 1.00 when <= 365, 0.90 when 366..730, 0.75 when > 730 or last_witness_on is null; writes verified_points and decides GRANTED vs PENDING"

  - name: organization_risk_score
    trigger: "on the creation of a DecisionRecord, on POST /accreditation/nonconformities/{nonconformity_id}/escalate, on POST /accreditation/complaints/{complaint_id}/resolve with outcome UPHELD, and on POST /accreditation/scopes/{scope_id}/surveillance-applications"
    algorithm: weighted_scoring
    formula: |
      raw = 5 * critical_count
          + 3 * major_count
          + 1 * minor_count
          + 4 * late_closed_count
          + 6 * escalated_count
          + 2 * upheld_complaint_count

      # AT_DECISION variant
      risk_score = min(100, raw)

      # AT_SURVEILLANCE_PLANNING variant
      risk_score = min(100, ceil(0.5 * prior_cycle_raw
                                 + current_surveillance_raw
                                 + 3 * organization.mra_escalation_count))
    input_set: |
      Nonconformity rows whose classification is not OBSERVATION, belonging to the
      AccreditationApplication under evaluation. late_closed_count counts rows with
      closed_on strictly greater than due_on; escalated_count counts rows in status
      ESCALATED; a single row may contribute to its classification weight, the late
      weight and the escalated weight at once. upheld_complaint_count counts
      ComplaintAppeal rows of the organization in status UPHELD or ESCALATED_MRA whose
      resolved_on is on or after clock_date - COMPLAINT_LOOKBACK_DAYS. Nonconformity
      rows of other organizations are never included.
    constants:
      WEIGHT_CRITICAL: 5
      WEIGHT_MAJOR: 3
      WEIGHT_MINOR: 1
      WEIGHT_LATE_CLOSED: 4
      WEIGHT_ESCALATED: 6
      WEIGHT_UPHELD_COMPLAINT: 2
      PRIOR_CYCLE_CARRY_FACTOR: 0.5
      MRA_ESCALATION_WEIGHT: 3
      RISK_SCORE_CAP: 100
      COMPLAINT_LOOKBACK_DAYS: 730
    precision: "integer; the AT_SURVEILLANCE_PLANNING variant applies ceil after the carry-forward sum, never before"
    variants:
      - name: AT_DECISION
        when: "whenever the risk score is recomputed inside the cycle that produced the findings (decision record creation, escalation, upheld complaint)"
        difference: "scores only the current application's findings; no carry-forward term and no MRA term; min(100, raw)"
      - name: AT_SURVEILLANCE_PLANNING
        when: "on POST /accreditation/scopes/{scope_id}/surveillance-applications, to set surveillance_risk_score and derive the surveillance interval"
        difference: "carries half of the granting cycle's raw score forward (unrounded), adds the raw score of the surveillance cycle's own findings and 3 points per MRA escalation, then applies ceil and the cap"

  - name: assessment_effort_days
    trigger: "on POST /accreditation/applications/{application_id}/assessment-plans and on any subsequent recomputation of that plan"
    algorithm: constraint_propagation
    formula: |
      # STEP ORDER IS NORMATIVE - each step consumes the previous step's output
      # 1. witnessing coverage: never below the scheme floor, otherwise scope-driven
      witness_days_planned = max(scheme.witness_min_count,
                                 ceil(requested_scope_line_count / SCOPE_LINES_PER_WITNESS_DAY))
      # 2. core days
      core_days = on_site_days + remote_days + witness_days_planned
      # 3. travel tier - keyed on core_days, NEVER on total_effort_days
      if core_days <= TRAVEL_TIER_1_MAX_CORE_DAYS:   travel_days = 0
      elif core_days <= TRAVEL_TIER_2_MAX_CORE_DAYS: travel_days = 1
      else:                                          travel_days = 2
      # 4. total
      total_effort_days = core_days + travel_days
      # AccreditationApplication.planned_effort_days is set to total_effort_days
    input_set: "the AssessmentPlan's own on_site_days and remote_days, the length of application.requested_scope_lines, and the witness_min_count of the scheme revision pinned on the application"
    constants:
      SCOPE_LINES_PER_WITNESS_DAY: 3
      TRAVEL_TIER_1_MAX_CORE_DAYS: 5
      TRAVEL_TIER_2_MAX_CORE_DAYS: 10
      TRAVEL_DAYS_TIER_1: 0
      TRAVEL_DAYS_TIER_2: 1
      TRAVEL_DAYS_TIER_3: 2
    precision: "whole days; ceil on the scope-line division, no other rounding"

  - name: assessment_fee
    trigger: "on POST /accreditation/applications/{application_id}/assessment-plans, after assessment_effort_days has produced the day counts"
    algorithm: tiered_pricing
    formula: |
      # each line is rounded to whole cents BEFORE the sum - never sum-then-round
      fee_line_on_site_cents = round_half_up(on_site_days * ON_SITE_DAY_RATE_CENTS
                                             * scheme.complexity_multiplier)
      fee_line_remote_cents  = round_half_up(remote_days * REMOTE_DAY_RATE_CENTS
                                             * scheme.complexity_multiplier)
      fee_line_witness_cents = round_half_up(witness_days_planned * WITNESS_DAY_RATE_CENTS
                                             * scheme.complexity_multiplier)
      # the travel line is a flat pass-through: the complexity multiplier does NOT apply
      fee_line_travel_cents  = travel_days * TRAVEL_DAY_RATE_CENTS
      assessment_fee_cents   = fee_line_on_site_cents + fee_line_remote_cents
                             + fee_line_witness_cents + fee_line_travel_cents
    input_set: "the four day counts produced by assessment_effort_days for this plan, and the complexity_multiplier of the scheme revision pinned on the application"
    constants:
      ON_SITE_DAY_RATE_CENTS: 145000
      REMOTE_DAY_RATE_CENTS: 96500
      WITNESS_DAY_RATE_CENTS: 132500
      TRAVEL_DAY_RATE_CENTS: 87500
    precision: "integer cents; round_half_up applied per fee line, then the lines are summed - the per-line rounding is observable whenever complexity_multiplier is not 1.0000"

  - name: impartiality_conflict_verdict
    trigger: "on POST /accreditation/applications/{application_id}/team-assignments, on POST /accreditation/team-assignments/{assignment_id}/confirm, and on POST /accreditation/complaints/{complaint_id}/review"
    algorithm: threshold
    formula: |
      # only the LATEST declaration per (assessor_id, organization_id) pair counts,
      # ordered by created_at ascending; earlier declarations for the same pair are
      # superseded and contribute nothing.
      ref = clock_date
      for each latest declaration d of (assessor, organization):
          if d.relationship_type in {EMPLOYMENT, OWNERSHIP, FAMILY}:      # STRUCTURAL
              cooling_off_months = 24
          elif d.relationship_type in {CONSULTANCY, TRAINING_DELIVERY}:   # SERVICE
              cooling_off_months = 12
          else:                                                          # NONE
              verdict = CLEARED; continue
          if d.ended_on is null: verdict = BLOCKED
          else:
              months = (ref.year - d.ended_on.year) * 12
                     + (ref.month - d.ended_on.month)
                     - (1 if ref.day < d.ended_on.day else 0)
              if months < cooling_off_months:        verdict = BLOCKED
              elif d.severity_class == "STRUCTURAL": verdict = CLEARED
              else:                                  verdict = CLEARED_WITH_NOTE
      # aggregate over all pairs for this assessor and organization
      aggregate = BLOCKED  if any verdict is BLOCKED
                  else CLEARED_WITH_NOTE if any verdict is CLEARED_WITH_NOTE
                  else CLEARED
    input_set: "ImpartialityDeclaration rows for the acting assessor and the applicant organization of the application; for each (assessor, organization) pair only the row with the greatest created_at is evaluated"
    constants:
      COOLING_OFF_MONTHS_STRUCTURAL: 24
      COOLING_OFF_MONTHS_SERVICE: 12
      STRUCTURAL_RELATIONSHIP_TYPES: "[EMPLOYMENT, OWNERSHIP, FAMILY]"
      SERVICE_RELATIONSHIP_TYPES: "[CONSULTANCY, TRAINING_DELIVERY]"
      VERDICT_RANK: "{ BLOCKED: 3, CLEARED_WITH_NOTE: 2, CLEARED: 1 }"
    precision: "whole calendar months, computed by the year/month difference with a day-of-month borrow - not by dividing a day count by 30"

  - name: nonconformity_due_date
    trigger: "on POST /accreditation/applications/{application_id}/nonconformities"
    algorithm: threshold
    formula: |
      if classification == "CRITICAL": window = scheme.critical_nc_close_days
      elif classification == "MAJOR":  window = scheme.major_nc_close_days
      elif classification == "MINOR":  window = scheme.minor_nc_close_days
      else:                            window = null    # OBSERVATION
      due_on = null if window is null else raised_on + window days
    input_set: "the classification of the finding and the three close-day windows of the scheme revision pinned on the application; the scheme's live revision is ignored"
    constants:
      OBSERVATION_HAS_DUE_DATE: false
    precision: "whole days, calendar addition on raised_on"

  - name: witness_session_day_count
    trigger: "on POST /accreditation/assessment-plans/{plan_id}/witness-sessions"
    algorithm: aggregation
    formula: |
      duration_hours = (ends_at - starts_at) in hours, as an exact rational
      day_count = ceil(duration_hours / ASSESSMENT_DAY_HOURS)
      # the assessor's ledger moves by day_count, not by wall-clock duration
      assessor.committed_witness_days += day_count
      assessor.available_witness_days = assessor.annual_witness_capacity_days
                                      - assessor.committed_witness_days
    input_set: "the session's own starts_at and ends_at; ABORTED sessions are removed from committed_witness_days again"
    constants:
      ASSESSMENT_DAY_HOURS: 8
    precision: "whole days, ceil - any partial day counts as a full witness day"

  - name: panel_decision_outcome
    trigger: "on POST /accreditation/decisions/{decision_id}/finalize"
    algorithm: aggregation
    formula: |
      n      = vote_count
      refuse = count of votes with vote == "REFUSE"
      grant  = count of votes with vote == "GRANT"
      cond   = count of votes with vote == "GRANT_WITH_CONDITIONS"
      # strict majority is expressed as doubling to avoid any fractional comparison
      if refuse * 2 > n:                 outcome = "REFUSE"
      elif (grant + cond) * 2 > n:       outcome = "GRANT_WITH_CONDITIONS" if cond >= 1
                                                   else "GRANT"
      else:                              outcome = "DEFER"
      # a refusal majority is checked FIRST: with n = 4, refuse = 3, grant = 1 the
      # outcome is REFUSE even though a grant vote exists.
    input_set: "the votes array of this DecisionRecord only; votes on DEFERRED records of earlier decision_rounds are never re-counted"
    constants:
      MIN_PANEL_VOTES: 3
    precision: "integer vote counts; no rounding"

  - name: surveillance_schedule
    trigger: "on the creation of an AccreditationScope by a granted DecisionRecord, and on POST /accreditation/scopes/{scope_id}/surveillance-applications"
    algorithm: threshold
    formula: |
      if risk_score <= RISK_BAND_LOW_MAX:       factor = 1.00
      elif risk_score <= RISK_BAND_MEDIUM_MAX:  factor = 0.75
      else:                                     factor = 0.50
      surveillance_interval_days_effective = floor(scheme.surveillance_interval_days * factor)
      next_surveillance_due  = effective_from + surveillance_interval_days_effective days
      next_reassessment_due  = effective_from + scheme.reassessment_interval_days days
      # reassessment is never compressed by risk - only surveillance is
    input_set: "risk_score_at_grant at scope creation, or surveillance_risk_score (AT_SURVEILLANCE_PLANNING variant) on each surveillance cycle; the two interval constants come from the scheme revision pinned on the granting application"
    constants:
      RISK_BAND_LOW_MAX: 10
      RISK_BAND_MEDIUM_MAX: 30
      FACTOR_LOW: 1.00
      FACTOR_MEDIUM: 0.75
      FACTOR_HIGH: 0.50
    precision: "whole days, floor on the interval product"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles and is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 2
    category: auth
    check: "when X-User-Role is ApplicantContact, X-User-ID equals the organization_id of the resource being created or mutated, resolved through the owning AccreditationApplication where the resource is a nonconformity response"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /accreditation/applications, POST /accreditation/nonconformities/{nonconformity_id}/responses, POST /accreditation/complaints"
  - priority: 3
    category: existence
    check: "request body is a JSON object, every required input is present, enum values are members of their declared set, integers are non-negative where the field is a count, and monetary/point fields are numeric"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 3
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 4
    category: existence
    check: "planned_end >= planned_start on an assessment plan, ends_at > starts_at on a witness session, and ended_on >= started_on on an impartiality declaration"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/assessment-plans, POST /accreditation/assessment-plans/{plan_id}/witness-sessions, POST /accreditation/assessors/{assessor_id}/impartiality-declarations"
  - priority: 5
    category: existence
    check: "every path id resolves to a live row, validated left-to-right in path order"
    error_id: "ERR_SCHEME_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_ORGANIZATION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_TEAM_ASSIGNMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_WITNESS_SESSION_NOT_FOUND | ERR_NONCONFORMITY_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_SCOPE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a live row, validated in declared field order after all path ids"
    error_id: "ERR_SCHEME_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_ORGANIZATION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SCOPE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /accreditation/applications, POST /accreditation/applications/{application_id}/team-assignments, POST /accreditation/assessors/{assessor_id}/qualifications, POST /accreditation/assessors/{assessor_id}/impartiality-declarations, POST /accreditation/complaints, POST /accreditation/complaints/{complaint_id}/review"
  - priority: 7
    category: state
    check: "expected_application_version equals the application's current version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /accreditation/applications/{application_id}/assessment-plans"
  - priority: 7
    category: state
    check: "expected_nonconformity_version equals the nonconformity's current version"
    error_id: ERR_STALE_NONCONFORMITY_VERSION
    http_status: 412
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/responses"
  - priority: 8
    category: state
    check: "the target resource's own status permits the requested transition, and the requested to_status is a declared successor of the current status"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /accreditation/schemes/{scheme_id}/status, POST /accreditation/assessors/{assessor_id}/status, POST /accreditation/team-assignments/{assignment_id}/confirm, POST /accreditation/team-assignments/{assignment_id}/recuse, POST /accreditation/assessment-plans/{plan_id}/approve, POST /accreditation/assessment-plans/{plan_id}/return-to-draft, POST /accreditation/witness-sessions/{session_id}/outcome, POST /accreditation/nonconformities/{nonconformity_id}/review, POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness, POST /accreditation/nonconformities/{nonconformity_id}/escalate, POST /accreditation/nonconformities/{nonconformity_id}/reopen, POST /accreditation/decisions/{decision_id}/votes, POST /accreditation/decisions/{decision_id}/finalize, POST /accreditation/scopes/{scope_id}/status, POST /accreditation/complaints/{complaint_id}/review, POST /accreditation/complaints/{complaint_id}/resolve, POST /accreditation/complaints/{complaint_id}/mra-escalation"
  - priority: 9
    category: state
    check: "the owning AccreditationApplication is in a status that permits the operation and its suspension_blocked flag is false"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /accreditation/applications/{application_id}/team-assignments, POST /accreditation/applications/{application_id}/assessment-plans, POST /accreditation/applications/{application_id}/nonconformities, POST /accreditation/applications/{application_id}/close-assessment, POST /accreditation/assessment-plans/{plan_id}/witness-sessions, POST /accreditation/assessment-plans/{plan_id}/approve, POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 9
    category: state
    check: "the owning Nonconformity is in a status that permits the operation"
    error_id: ERR_NONCONFORMITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/responses"
  - priority: 10
    category: business_safety
    check: "impartiality_conflict_verdict for the (assessor, applicant organization) pair is not BLOCKED"
    error_id: ERR_IMPARTIALITY_CONFLICT
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/team-assignments, POST /accreditation/team-assignments/{assignment_id}/confirm"
  - priority: 10
    category: business_safety
    check: "the assessor's impartiality_status is not RESTRICTED"
    error_id: ERR_ASSESSOR_IMPARTIALITY_RESTRICTED
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/team-assignments, POST /accreditation/team-assignments/{assignment_id}/confirm"
  - priority: 10
    category: business_safety
    check: "the acting decision-panel member holds no TeamAssignment of any status on the application under decision"
    error_id: ERR_PANEL_INDEPENDENCE_BREACH
    http_status: 422
    applies_to: "POST /accreditation/decisions/{decision_id}/votes"
  - priority: 10
    category: business_safety
    check: "the acting assessor is not the same person who performed the preceding step of the same workflow: the effectiveness verifier differs from the response reviewer, and the finalizing panel member has cast a vote on this record"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness, POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 10
    category: business_safety
    check: "for an APPEAL, the nominated reviewer neither sat on the assessment team of the appealed application nor cast a vote on any of its DecisionRecords"
    error_id: ERR_APPEAL_REVIEWER_CONFLICT
    http_status: 422
    applies_to: "POST /accreditation/complaints/{complaint_id}/review"
  - priority: 10
    category: business_safety
    check: "the acting assessor holds a CONFIRMED TeamAssignment on the cycle, of role_type LEAD_ASSESSOR for a corrective-action review and of role_type in {LEAD_ASSESSOR, TECHNICAL_ASSESSOR} for an effectiveness verification"
    error_id: ERR_NOT_ASSIGNED_TEAM_MEMBER
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/nonconformities, POST /accreditation/nonconformities/{nonconformity_id}/review, POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness, POST /accreditation/witness-sessions/{session_id}/outcome"
  - priority: 11
    category: business_referential
    check: "the referenced AccreditationScheme is in status PUBLISHED"
    error_id: ERR_SCHEME_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /accreditation/applications, POST /accreditation/assessors/{assessor_id}/qualifications"
  - priority: 11
    category: business_referential
    check: "the application's pinned_scheme_rule_revision still equals the scheme's current rule_revision"
    error_id: ERR_SCHEME_VERSION_SUPERSEDED
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/assessment-plans, POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 11
    category: business_referential
    check: "the nominated assessor holds an AssessorQualification for the application's scheme in status GRANTED, of the requested role_type, whose expires_on is on or after the current logical-clock date"
    error_id: ERR_QUALIFICATION_NOT_GRANTED
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/team-assignments, POST /accreditation/team-assignments/{assignment_id}/confirm"
  - priority: 11
    category: business_referential
    check: "the AccreditationScope a surveillance or reassessment cycle is opened against is in status ACTIVE"
    error_id: ERR_SCOPE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /accreditation/scopes/{scope_id}/surveillance-applications"
  - priority: 11
    category: business_referential
    check: "the AssessmentPlan a witnessing session, a witness outcome or an assessment closure depends on is in status APPROVED"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /accreditation/assessment-plans/{plan_id}/witness-sessions, POST /accreditation/witness-sessions/{session_id}/outcome, POST /accreditation/applications/{application_id}/close-assessment"
  - priority: 11
    category: business_referential
    check: "every element of granted_scope_lines appears in the application's requested_scope_lines"
    error_id: ERR_SCOPE_LINE_NOT_REQUESTED
    http_status: 422
    applies_to: "POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 12
    category: business_temporal
    check: "the assessor has no other WitnessSession in status SCHEDULED or COMPLETED whose half-open interval [starts_at, ends_at) intersects the requested half-open interval; a session starting exactly at another session's ends_at is permitted because the intervals only touch"
    error_id: ERR_ASSESSOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /accreditation/assessment-plans/{plan_id}/witness-sessions"
  - priority: 12
    category: business_temporal
    check: "for every WitnessSession in status SCHEDULED or COMPLETED with delivery_mode ON_SITE at the same site_ref that belongs to a DIFFERENT applicant organization, the whole-day gap (requested starts_at date - that session ends_at date) is strictly greater than SITE_BUFFER_DAYS (14); a gap of exactly 14 days is rejected. Sessions of the same organization are exempt from the buffer entirely."
    error_id: ERR_SITE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /accreditation/assessment-plans/{plan_id}/witness-sessions"
  - priority: 12
    category: business_temporal
    check: "the current logical-clock date is strictly after the nonconformity's due_on before an escalation is accepted"
    error_id: ERR_NOT_YET_OVERDUE
    http_status: 422
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/escalate"
  - priority: 12
    category: business_temporal
    check: "the current logical-clock date is on or before the nonconformity's due_on when a corrective-action response is submitted"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/responses"
  - priority: 12
    category: business_temporal
    check: "an UNANNOUNCED cycle's notice_days is 0 and any other cycle_type's notice_days is at least MIN_NOTICE_DAYS (14)"
    error_id: ERR_INVALID_NOTICE_PERIOD
    http_status: 422
    applies_to: "POST /accreditation/applications, POST /accreditation/scopes/{scope_id}/surveillance-applications"
  - priority: 13
    category: business_constraint
    check: "the application's completed_witness_session_count is at least the pinned scheme revision's witness_min_count AND the sum of day_count over the WitnessSession rows of the application's APPROVED plan whose status is COMPLETED is at least that plan's witness_days_planned"
    error_id: ERR_WITNESS_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /accreditation/applications/{application_id}/close-assessment"
  - priority: 13
    category: business_constraint
    check: "the DecisionRecord has at least MIN_PANEL_VOTES (3) votes before it can be finalized"
    error_id: ERR_PANEL_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 13
    category: business_constraint
    check: "the assessor's committed_witness_days plus the requested day_count does not exceed annual_witness_capacity_days"
    error_id: ERR_ASSESSOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /accreditation/assessment-plans/{plan_id}/witness-sessions"
  - priority: 13
    category: business_constraint
    check: "the acting panel member has not already cast a vote on this DecisionRecord"
    error_id: ERR_DUPLICATE_PANEL_VOTE
    http_status: 409
    applies_to: "POST /accreditation/decisions/{decision_id}/votes"
  - priority: 13
    category: business_constraint
    check: "the organization has no other AccreditationApplication for the same scheme in a non-terminal status"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /accreditation/applications, POST /accreditation/scopes/{scope_id}/surveillance-applications"
  - priority: 13
    category: business_constraint
    check: "a GRANT_WITH_CONDITIONS outcome carries a granted_scope_lines list strictly shorter than requested_scope_lines, and a GRANT outcome carries the full requested list"
    error_id: ERR_CONDITIONS_REQUIRE_REDUCED_SCOPE
    http_status: 422
    applies_to: "POST /accreditation/decisions/{decision_id}/finalize"
  - priority: 13
    category: business_constraint
    check: "the scheme revision pinned on the cycle has unannounced_authority true before an UNANNOUNCED cycle may be opened"
    error_id: ERR_UNANNOUNCED_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /accreditation/applications, POST /accreditation/scopes/{scope_id}/surveillance-applications"
  - priority: 13
    category: business_constraint
    check: "a witness session with delivery_mode REMOTE is only accepted when the pinned scheme revision has remote_assessment_allowed true"
    error_id: ERR_REMOTE_WITNESS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /accreditation/assessment-plans/{plan_id}/witness-sessions"
  - priority: 13
    category: business_constraint
    check: "an MRA escalation is only accepted for a ComplaintAppeal of kind APPEAL in status UPHELD whose organization has at least one AccreditationScope in status ACTIVE or SUSPENDED"
    error_id: ERR_MRA_ESCALATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /accreditation/complaints/{complaint_id}/mra-escalation"
  - priority: 13
    category: business_constraint
    check: "verified_evidence_count is at least MIN_EFFECTIVENESS_EVIDENCE for the finding's classification, where MIN_EFFECTIVENESS_EVIDENCE = { CRITICAL: 3, MAJOR: 2, MINOR: 1 }"
    error_id: ERR_EFFECTIVENESS_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /accreditation/nonconformities/{nonconformity_id}/verify-effectiveness"

