        grounds:
          - validations[priority=46]
          - validations[priority=101]
          - errors[ERR_PASS_NOT_ACTIVE]
          - errors[ERR_RESERVATION_SLOT_FULL]
          - endpoints[POST /reservations]
        distinguishing_aspect: |
          Pairs category `state` (priority 46) against category `business_fiscal` (priority 101) on
          POST /reservations. Both conditions hold on the trigger call — the pass is still
          PENDING_PROCESSING and the requested window already has window_slot_capacity (2) overlapping
          CONFIRMED reservations — and the response must be ERR_PASS_NOT_ACTIVE (409), never
          ERR_RESERVATION_SLOT_FULL (422). The control call proves the fiscal rule was genuinely armed.
