              as: AccountHolder
              as_user_id: "${acc_cap}"
              captures: { dep_cap: $.data.id, granted_cap: $.data.instant_credit_granted_cents }
          trigger:
            - call: "POST /accounts/${acc_cap}/deposits"
              payload: { amount_cents: 1, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_cap}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "Deposit.${dep_cap}.instant_credit_granted_cents == 10000000 (requested == headroom allowed)"
            - "Second deposit returns status 402 and data.error_id == ERR_INSTANT_LIMIT_EXCEEDED (headroom 0, requested 1 over)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- Pair Order -> Account.trading_status ----------------------------
      - name: order_placement_depends_on_account_trading_status
        grounds:
          - state_machines.Order.PENDING_NEW_to_ACCEPTED
          - entities.Account.fields.trading_status
          - validations[priority=8]
          - errors[ERR_RESTRICTED_CLOSING_ONLY]
        distinguishing_aspect: |
          An opening BUY on an account whose trading_status is RESTRICTED_CLOSING_ONLY is rejected with
          ERR_RESTRICTED_CLOSING_ONLY, while a closing SELL (is_closing=true) on the same account is
          ACCEPTED — Order's valid transition depends on the Account's posture (Order->Account pair).
        test_recipe:
          setup:
            - "MARGIN account A_DEP holding 100 sh of DEPCO (last 10000c, maintenance 2500bps), driven to RESTRICTED_CLOSING_ONLY by a quote drop to 4000c (excess -200000)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "DEPCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: false, maintenance_rate_bps: 2500 }
              as: ClearingSystem
              captures: { sec_dep: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "dep@x.com", account_type: "MARGIN" }
              as: AccountHolder
              captures: { acc_dep: $.data.id }
            - call: "POST /accounts/${acc_dep}/deposits"
              payload: { amount_cents: 500000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_dep}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_dep}"
              as: AccountHolder
              as_user_id: "${acc_dep}"
              captures: { v_dep_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_dep}", security_id: "${sec_dep}", side: "BUY", order_type: "LIMIT", quantity: 100, limit_price_cents: 10000, expected_account_version: "${v_dep_1}" }
              as: AccountHolder
              as_user_id: "${acc_dep}"
              captures: { ord_dep: $.data.id }
            - call: "POST /orders/${ord_dep}/fills"
              payload: { fill_quantity: 100, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "PATCH /securities/${sec_dep}/quote"
              payload: { last_price_cents: 4000 }
              as: MarketData
            - call: "GET /accounts/${acc_dep}"
              as: AccountHolder
              as_user_id: "${acc_dep}"
              captures: { v_dep_2: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_dep}", security_id: "${sec_dep}", side: "BUY", order_type: "LIMIT", quantity: 1, limit_price_cents: 4000, expected_account_version: "${v_dep_2}" }
              as: AccountHolder
              as_user_id: "${acc_dep}"
              captures: { err_dep: $.data.error_id }
          assert:
            - "Account.${acc_dep}.trading_status == RESTRICTED_CLOSING_ONLY before the trigger"
            - "Opening BUY returns status 409 and data.error_id == ERR_RESTRICTED_CLOSING_ONLY"

      # ---- Pair DividendEvent -> Position.drip_enabled ---------------------
      - name: reinvest_depends_on_position_drip_enabled
        grounds:
          - state_machines.DividendEvent.PAID_to_REINVESTED
          - entities.Position.fields.drip_enabled
          - errors[ERR_DRIP_NOT_ENABLED]
        distinguishing_aspect: |
          A reinvest of a PAID dividend is rejected with ERR_DRIP_NOT_ENABLED when the underlying
          Position.drip_enabled is false — the DividendEvent transition depends on the Position's flag
          (DividendEvent->Position pair), a different entity pair than Order->Account above.
        test_recipe:
          setup:
            - "CASH account A_ND holding 10 sh of NDCO (last 10000c) with DRIP DISABLED (default); a 100c/share dividend ANNOUNCED then PAID (gross 1000)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "NDCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_nd: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "nd@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_nd: $.data.id }
            - call: "POST /accounts/${acc_nd}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_nd}"
            - call: "GET /accounts/${acc_nd}"
              as: AccountHolder
              as_user_id: "${acc_nd}"
              captures: { v_nd: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_nd}", security_id: "${sec_nd}", side: "BUY", order_type: "MARKET", quantity: 10, expected_account_version: "${v_nd}" }
              as: AccountHolder
              as_user_id: "${acc_nd}"
              captures: { ord_nd: $.data.id }
            - call: "POST /orders/${ord_nd}/fills"
              payload: { fill_quantity: 10, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "GET /positions"
              payload: { account_id: "${acc_nd}" }
              as: AccountHolder
              as_user_id: "${acc_nd}"
              captures: { pos_nd: "$.data[0].id" }
            - call: "POST /dividends"
              payload: { account_id: "${acc_nd}", position_id: "${pos_nd}", rate_per_share_cents: 100, ex_date: "2026-04-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_nd: $.data.id }
            - call: "POST /dividends/${div_nd}/pay"
              as: ClearingSystem
          trigger:
            - call: "POST /dividends/${div_nd}/reinvest"
              as: ClearingSystem
              captures: { err_nd: $.data.error_id }
          assert:
            - "Position.${pos_nd}.drip_enabled == false"
            - "Reinvest returns status 409 and data.error_id == ERR_DRIP_NOT_ENABLED; DividendEvent.${div_nd}.status remains PAID"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Dividend window overlap (Position resource, half-open interval) --
      - name: dividend_window_overlap_same_position_half_open
        grounds:
          - calculations.window_overlap
          - validations[priority=16]
          - entities.DividendEvent.fields.ex_date
          - entities.DividendEvent.fields.window_end
          - errors[ERR_DIVIDEND_WINDOW_OVERLAP]
        distinguishing_aspect: |
          A second ANNOUNCED dividend whose [ex_date, ex_date+30d) overlaps an existing non-terminal
          dividend's window for the SAME position is rejected with ERR_DIVIDEND_WINDOW_OVERLAP; the
          interval semantics are pairwise half-open (touching endpoints do NOT collide), distinct from
          the margin single-occupancy closed-window rule below.
        test_recipe:
          setup:
            - "CASH account A_DW holding 10 sh of DWCO (last 10000c). One dividend already ANNOUNCED with ex_date 2026-05-01 (window through 2026-05-31)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "DWCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_dw: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "dw@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_dw: $.data.id }
            - call: "POST /accounts/${acc_dw}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_dw}"
            - call: "GET /accounts/${acc_dw}"
              as: AccountHolder
              as_user_id: "${acc_dw}"
              captures: { v_dw: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_dw}", security_id: "${sec_dw}", side: "BUY", order_type: "MARKET", quantity: 10, expected_account_version: "${v_dw}" }
              as: AccountHolder
              as_user_id: "${acc_dw}"
              captures: { ord_dw: $.data.id }
            - call: "POST /orders/${ord_dw}/fills"
              payload: { fill_quantity: 10, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "GET /positions"
              payload: { account_id: "${acc_dw}" }
              as: AccountHolder
              as_user_id: "${acc_dw}"
              captures: { pos_dw: "$.data[0].id" }
            - call: "POST /dividends"
              payload: { account_id: "${acc_dw}", position_id: "${pos_dw}", rate_per_share_cents: 50, ex_date: "2026-05-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_dw1: $.data.id }
          trigger:
            - call: "POST /dividends"
              payload: { account_id: "${acc_dw}", position_id: "${pos_dw}", rate_per_share_cents: 50, ex_date: "2026-05-15T00:00:00Z" }
              as: ClearingSystem
              captures: { err_dw: $.data.error_id }
          assert:
            - "Second announce returns status 409 and data.error_id == ERR_DIVIDEND_WINDOW_OVERLAP (2026-05-15 < 2026-05-31 window_end of div1)"

      # ---- Margin call single-occupancy (Account resource, closed window) ---
      - name: margin_call_active_blocks_second_issue_single_occupancy
        grounds:
          - calculations.window_overlap
          - validations[priority=18]
          - state_machines.MarginCall.ISSUED_to_MET
          - errors[ERR_MARGIN_CALL_ACTIVE]
        distinguishing_aspect: |
          Issuing a second margin call while an ISSUED MarginCall already occupies the account's
          [created_at, cure_by] window is rejected with ERR_MARGIN_CALL_ACTIVE; the interval semantics are
          single-slot (aggregate capacity 1) on the Account resource, distinct from the pairwise half-open
          dividend rule above.
        test_recipe:
          setup:
            - "MARGIN account A_MC holding 100 sh of MCCO (last 10000c, maintenance 2500bps); a quote drop to 4000c makes excess -200000 and a first MarginCall is ISSUED (cure window open)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "MCCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: false, maintenance_rate_bps: 2500 }
              as: ClearingSystem
              captures: { sec_mc: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "mc@x.com", account_type: "MARGIN" }
              as: AccountHolder
              captures: { acc_mc: $.data.id }
            - call: "POST /accounts/${acc_mc}/deposits"
              payload: { amount_cents: 500000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_mc}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_mc}"
              as: AccountHolder
              as_user_id: "${acc_mc}"
              captures: { v_mc: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_mc}", security_id: "${sec_mc}", side: "BUY", order_type: "LIMIT", quantity: 100, limit_price_cents: 10000, expected_account_version: "${v_mc}" }
              as: AccountHolder
              as_user_id: "${acc_mc}"
              captures: { ord_mc: $.data.id }
            - call: "POST /orders/${ord_mc}/fills"
              payload: { fill_quantity: 100, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "PATCH /securities/${sec_mc}/quote"
              payload: { last_price_cents: 4000 }
              as: MarketData
            - call: "POST /accounts/${acc_mc}/margin-calls"
              as: ClearingSystem
              captures: { mc_first: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_mc}/margin-calls"
              as: ClearingSystem
              captures: { err_mc: $.data.error_id }
          assert:
            - "MarginCall.${mc_first}.status == ISSUED with deficiency_cents == 200000"
            - "Second issue returns status 409 and data.error_id == ERR_MARGIN_CALL_ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Invariant 1: deposit + ACH reverse leaves instant_credit conserved
      - name: deposit_reverse_conserves_instant_credit_pool
        grounds:
          - state_machines.Deposit.PENDING_to_REVERSED
          - calculations.instant_credit
          - entities.Account.fields.instant_credit_cents
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Conserved quantity = Account.instant_credit_cents. A PENDING instant deposit grants
          instant_credit_granted_cents; its ACH reversal claws back exactly that same amount, so
          instant_credit_cents returns to its pre-deposit value (0) — net zero drift in the instant-credit
          pool, a different conserved quantity than the share-quantity invariant below.
        test_recipe:
          setup:
            - "Fresh CASH account A_RV; one $4000.00 PENDING instant deposit (instant_credit_cents=400000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "rv@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_rv: $.data.id }
            - call: "POST /accounts/${acc_rv}/deposits"
              payload: { amount_cents: 400000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_rv}"
              captures: { dep_rv: $.data.id }
            - call: "GET /accounts/${acc_rv}"
              as: AccountHolder
              as_user_id: "${acc_rv}"
              captures: { ic_before: $.data.instant_credit_cents }
          trigger:
            - call: "POST /deposits/${dep_rv}/reverse"
              as: ClearingSystem
              captures: { dep_rv_status: $.data.status }
            - call: "GET /accounts/${acc_rv}"
              as: AccountHolder
              as_user_id: "${acc_rv}"
              captures: { ic_after: $.data.instant_credit_cents }
          assert:
            - "Before reverse: Account.${acc_rv}.instant_credit_cents == 400000"
            - "Deposit.${dep_rv}.status == REVERSED after the reverse"
            - "After reverse: Account.${acc_rv}.instant_credit_cents == 0 (conserved: forward grant + reverse clawback = 0 net)"

      # ---- Invariant 2: dividend pay + reverse conserves settled_cash ------
      - name: dividend_pay_reverse_conserves_settled_cash
        grounds:
          - state_machines.DividendEvent.ANNOUNCED_to_PAID
          - state_machines.DividendEvent.PAID_to_REVERSED
          - entities.Account.fields.settled_cash_cents
        distinguishing_aspect: |
          Conserved quantity = Account.settled_cash_cents. Paying a dividend credits gross_amount_cents to
          settled_cash; reversing the PAID dividend debits exactly gross_amount_cents, returning
          settled_cash to its pre-pay value — net zero drift in settled cash, a different conserved
          quantity (cash, not the instant-credit pool) than invariant 1.
        test_recipe:
          setup:
            - "CASH account A_PRV holding 10 sh of PRVCO (last 10000c); settled_cash known pre-pay; a 100c/share dividend ANNOUNCED then PAID (gross 1000), DRIP disabled."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "PRVCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_prv: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "prv@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_prv: $.data.id }
            - call: "POST /accounts/${acc_prv}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_prv}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_prv}"
              as: AccountHolder
              as_user_id: "${acc_prv}"
              captures: { v_prv: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_prv}", security_id: "${sec_prv}", side: "BUY", order_type: "MARKET", quantity: 10, expected_account_version: "${v_prv}" }
              as: AccountHolder
              as_user_id: "${acc_prv}"
              captures: { ord_prv: $.data.id }
            - call: "POST /orders/${ord_prv}/fills"
              payload: { fill_quantity: 10, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-07T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_prv}"
              as: AccountHolder
              as_user_id: "${acc_prv}"
              captures: { sc_before: $.data.settled_cash_cents }
            - call: "GET /positions"
              payload: { account_id: "${acc_prv}" }
              as: AccountHolder
              as_user_id: "${acc_prv}"
              captures: { pos_prv: "$.data[0].id" }
            - call: "POST /dividends"
              payload: { account_id: "${acc_prv}", position_id: "${pos_prv}", rate_per_share_cents: 100, ex_date: "2026-06-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_prv: $.data.id }
            - call: "POST /dividends/${div_prv}/pay"
              as: ClearingSystem
              captures: { sc_after_pay: $.data.account_id }
          trigger:
            - call: "POST /dividends/${div_prv}/reverse"
              as: ClearingSystem
              captures: { div_prv_status: $.data.status }
            - call: "GET /accounts/${acc_prv}"
              as: AccountHolder
              as_user_id: "${acc_prv}"
              captures: { sc_after: $.data.settled_cash_cents }
          assert:
            - "settled_cash_cents before pay == 100000 (deposit 200000 settled minus 100000 buy)"
            - "After pay: settled_cash_cents == 101000; after reverse: settled_cash_cents == 100000 (conserved: +1000 then -1000)"
            - "DividendEvent.${div_prv}.status == REVERSED"
