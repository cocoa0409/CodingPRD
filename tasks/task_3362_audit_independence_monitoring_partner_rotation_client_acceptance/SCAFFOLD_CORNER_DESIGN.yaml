              payload: { legal_name: "Dunmore Glassworks", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_dg: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_dg}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
