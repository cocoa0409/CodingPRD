scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_tiered_vs_flat_on_therapist
        grounds:
          - calculations.tiered_commission
          - state_machines.Appointment.PRICED_to_PAID
          - entities.Therapist.fields.commission_scheme
        distinguishing_aspect: |
          On the THERAPIST domain: the same service_charge_cents (12000) yields commission 4800 under
          commission_scheme==FLAT (0.40 flat) but 5500 under TIERED when mtd_service_revenue sits at 15000
          and the slice straddles the 20000 floor — two valid algorithms, divergent therapist payout.
        test_recipe:
          setup:
            - "Two therapists: T_flat (FLAT 0.40) and T_tier (TIERED). Commission tiers: floor 0 @0.40, floor 20000 @0.50, floor 40000 @0.55."
            - "T_tier has one prior PAID Deep-Tissue 60-min appointment (charge 15000), so mtd_service_revenue_cents==15000."
            - "A second Swedish 60-min appointment (charge 12000) is completed+priced for T_tier, and one for T_flat."
            - "Clock at 2026-03-02T12:00:00Z (after each start_at)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
            - call: "POST /practice/modalities"
              payload: { name: "Deep Tissue", code: "DEEPT", base_price_cents: 15000 }
              as: PracticeAdmin
              captures: { mod_dt: $.data.id }
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 0, floor_revenue_cents: 0, commission_pct: 0.40 }
              as: PracticeAdmin
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 1, floor_revenue_cents: 20000, commission_pct: 0.50 }
              as: PracticeAdmin
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 2, floor_revenue_cents: 40000, commission_pct: 0.55 }
              as: PracticeAdmin
            - call: "POST /practice/therapists"
              payload: { full_name: "T Tier", license_number: "LMT-100001", license_expiry: "2027-01-01T00:00:00Z", commission_scheme: "TIERED" }
              as: PracticeAdmin
              captures: { t_tier: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "T Flat", license_number: "LMT-100002", license_expiry: "2027-01-01T00:00:00Z", commission_scheme: "FLAT", flat_commission_pct: 0.40 }
              as: PracticeAdmin
              captures: { t_flat: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R1-A", room: "R1", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl1: $.data.id, tbl1_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R1-B", room: "R1", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl2: $.data.id, tbl2_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R1-C", room: "R1", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl3: $.data.id, tbl3_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            # prior DT60 for T_tier -> mtd 15000 (own table tbl3)
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t_tier}", table_id: "${tbl3}", modality_id: "${mod_dt}", consent_id: "${con}", start_at: "2026-03-02T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl3_v}" }
              as: FrontDesk
              captures: { ap_prior: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap_prior}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t_tier}"
              captures: { sn_prior: $.data.id }
            - call: "POST /practice/appointments/${ap_prior}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn_prior}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_prior}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_prior}/price"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/appointments/${ap_prior}/pay"
              payload: { gratuity_cents: 0 }
              as: FrontDesk
            # T_tier test SW60
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t_tier}", table_id: "${tbl1}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T11:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl1_v}" }
              as: FrontDesk
              captures: { ap_tier: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap_tier}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t_tier}"
              captures: { sn_tier: $.data.id }
            - call: "POST /practice/appointments/${ap_tier}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn_tier}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_tier}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_tier}/price"
              payload: {}
              as: FrontDesk
            # T_flat test SW60
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t_flat}", table_id: "${tbl2}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T11:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl2_v}" }
              as: FrontDesk
              captures: { ap_flat: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap_flat}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t_flat}"
              captures: { sn_flat: $.data.id }
            - call: "POST /practice/appointments/${ap_flat}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn_flat}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t_flat}"
            - call: "POST /practice/appointments/${ap_flat}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_flat}"
            - call: "POST /practice/appointments/${ap_flat}/price"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /practice/appointments/${ap_tier}/pay"
              payload: { gratuity_cents: 0 }
              as: FrontDesk
            - call: "POST /practice/appointments/${ap_flat}/pay"
              payload: { gratuity_cents: 0 }
              as: FrontDesk
          assert:
            - "Appointment.${ap_tier}.commission_credited_cents == 5500"
            - "Appointment.${ap_flat}.commission_credited_cents == 4800"
            - "Appointment.${ap_tier}.commission_credited_cents != Appointment.${ap_flat}.commission_credited_cents"

      - name: no_show_fee_proration_vs_membership_rollover
        grounds:
          - calculations.no_show_fee_proration
          - calculations.package_rollover
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Different entity domains: no_show_fee_proration computes a dollar fee on the APPOINTMENT
          (12000 for a true no-show on Swedish-60), while package_rollover computes a SESSION-credit
          balance on the PACKAGE (kept=min(3,1)=1, +included 2 -> balance 3) — money vs session-count,
          two unrelated subjects.
        test_recipe:
          setup:
            - "A client with a Swedish-60 appointment that becomes a true NO_SHOW (fee 12000)."
            - "A package on a plan with rollover_cap_sessions=1, included_sessions=2: initial GRANT gives balance 2; after the clock passes cycle end a renewal applies cap-then-grant (kept=min(2,1)=1, +2) -> balance 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "T1", license_number: "LMT-200001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t1: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R2-A", room: "R2" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client NS", email: "ns@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-01T10:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap_ns: $.data.id }
            # package with rollover dynamics
            - call: "POST /practice/plans"
              payload: { name: "RollPlan", monthly_fee_cents: 9000, included_sessions: 2, member_discount_pct: 0.20, rollover_cap_sessions: 1 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}", cycle_anchor_day: 1 }
              as: FrontDesk
              captures: { pkg: $.data.id }
            # initial grant gives 2; admin-bump to 3 unused before renewal is not an endpoint,
            # but we add one more credit by NOT redeeming and granting via renewal would forfeit.
            # Instead drive balance to 3: renew once (cycle end advanced) after pushing clock.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/packages/${pkg}/renew"
              payload: {}
              as: PracticeAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:30:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/appointments/${ap_ns}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${ap_ns}.no_show_fee_cents == 12000"
            - "Appointment.${ap_ns}.scheduling_status == NO_SHOW"
            - "Package.${pkg}.credit_balance_sessions == 3"
            - "latest CreditLedgerEntry for Package.${pkg} has balance_after == 3"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_commission_marginal_slice_mode_a
        grounds:
          - calculations.tiered_commission
          - entities.CommissionTier.fields.commission_pct
          - state_machines.Appointment.PRICED_to_PAID
        distinguishing_aspect: |
          Mode (a) non-linear: commission is a marginal nested min/max over tier slices with >=3 inputs
          (old_rev, new_rev, tier floors); the SAME 12000 charge yields 4800 at mtd 0 (single tier) but
          5500 at mtd 15000 (straddles the 20000 floor). Branch selection depends on therapist state.
        test_recipe:
          setup:
            - "Tiers floor 0@0.40, 20000@0.50, 40000@0.55. T_tier mtd_service_revenue_cents==15000 from one prior PAID DT60 (charge 15000)."
            - "Test Swedish-60 (charge 12000) priced and ready to pay."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
            - call: "POST /practice/modalities"
              payload: { name: "Deep Tissue", code: "DEEPT", base_price_cents: 15000 }
              as: PracticeAdmin
              captures: { mod_dt: $.data.id }
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 0, floor_revenue_cents: 0, commission_pct: 0.40 }
              as: PracticeAdmin
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 1, floor_revenue_cents: 20000, commission_pct: 0.50 }
              as: PracticeAdmin
            - call: "POST /practice/commission-tiers"
              payload: { tier_index: 2, floor_revenue_cents: 40000, commission_pct: 0.55 }
              as: PracticeAdmin
            - call: "POST /practice/therapists"
              payload: { full_name: "T Tier", license_number: "LMT-300001", license_expiry: "2027-01-01T00:00:00Z", commission_scheme: "TIERED" }
              as: PracticeAdmin
              captures: { t_tier: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R3-A", room: "R3", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R3-B", room: "R3", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl2: $.data.id, tbl2_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client B", email: "b@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t_tier}", table_id: "${tbl}", modality_id: "${mod_dt}", consent_id: "${con}", start_at: "2026-03-02T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap_prior: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap_prior}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t_tier}"
              captures: { sn_prior: $.data.id }
            - call: "POST /practice/appointments/${ap_prior}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn_prior}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_prior}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_prior}/price"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/appointments/${ap_prior}/pay"
              payload: { gratuity_cents: 0 }
              as: FrontDesk
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t_tier}", table_id: "${tbl2}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T11:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl2_v}" }
              as: FrontDesk
              captures: { ap_test: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap_test}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t_tier}"
              captures: { sn_test: $.data.id }
            - call: "POST /practice/appointments/${ap_test}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn_test}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_test}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_tier}"
            - call: "POST /practice/appointments/${ap_test}/price"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /practice/appointments/${ap_test}/pay"
              payload: { gratuity_cents: 0 }
              as: FrontDesk
          assert:
            - "Appointment.${ap_test}.commission_credited_cents == 5500"
            - "Therapist.${t_tier}.mtd_service_revenue_cents == 27000"

      - name: no_show_fee_multiply_then_round_mode_b
        grounds:
          - calculations.no_show_fee_proration
          - entities.Appointment.fields.no_show_fee_cents
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Mode (b) nested rounding order: fee = round_half_up(base_session * fee_fraction * strike_multiplier)
          with the multiply chain pinned BEFORE the single round. For a 30-min Swedish (base_session=6000) true
          no-show with strike_multiplier 1.5, multiply-then-round gives 9000; rounding 6000*1.0 then *1.5 would
          also give 9000 here, but for fractional intermediates the pinned order is multiply-all-then-round.
        test_recipe:
          setup:
            - "Client with no_show_strikes already at 3 (three prior no-shows), so strike_multiplier==1.5."
            - "A Swedish 30-min appointment (base_session 6000) becomes a true NO_SHOW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "T2", license_number: "LMT-400001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t1: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R4-A", room: "R4" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R4-B", room: "R4" }
              as: PracticeAdmin
              captures: { tbl_b: $.data.id, tbl_b_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R4-C", room: "R4" }
              as: PracticeAdmin
              captures: { tbl_c: $.data.id, tbl_c_v: $.data.version }
            - call: "POST /practice/tables"
              payload: { label: "R4-D", room: "R4" }
              as: PracticeAdmin
              captures: { tbl_d: $.data.id, tbl_d_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client S3", email: "s3@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            # three prior no-shows to push strikes to 3 (each at a distinct slot)
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-01T08:00:00Z", duration_minutes: 30, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:31:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/appointments/${ap1}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl_b}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-01T09:00:00Z", duration_minutes: 30, payer: "CASH", expected_table_version: "${tbl_b_v}" }
              as: FrontDesk
              captures: { ap2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:31:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/appointments/${ap2}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl_c}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-01T10:00:00Z", duration_minutes: 30, payer: "CASH", expected_table_version: "${tbl_c_v}" }
              as: FrontDesk
              captures: { ap3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:31:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/appointments/${ap3}/no-show"
              payload: {}
              as: FrontDesk
            # the test appointment
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl_d}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-01T12:00:00Z", duration_minutes: 30, payer: "CASH", expected_table_version: "${tbl_d_v}" }
              as: FrontDesk
              captures: { ap_test: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
