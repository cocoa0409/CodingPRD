            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b11}", "${b12}", "${b13}", "${b14}", "${b15}", "${b16}", "${b17}", "${b18}", "${b19}", "${b20}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T15:00:00Z" }, as: FurnaceOperator, captures: { chg2_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg1_id}/close-loading", payload: {}, as: FurnaceOperator }
