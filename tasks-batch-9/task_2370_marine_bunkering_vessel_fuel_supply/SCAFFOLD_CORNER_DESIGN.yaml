        distinguishing_aspect: "The CustomerRep's X-User-ID IS the Customer id, so scope is enforced by identity rather than by role: reading customer B's exposure while authenticated as customer A is 403 ERR_CUSTOMER_SCOPE_VIOLATION (not 404), while the same call against A's own id succeeds and returns the zeroed projection."
