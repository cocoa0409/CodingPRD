      - name: transport_asset_closed_interval_legs_touch_at_endpoint
        grounds:
          - validations[priority 80]
          - errors.ERR_ASSET_CAPACITY_EXCEEDED
          - entities.TransportAsset.fields.concurrent_leg_capacity
          - calculations.cold_ischemic_projection
        distinguishing_aspect: |
          A different resource (TransportAsset) with the opposite interval semantics: leg overlap is
          evaluated on CLOSED intervals, so a leg starting at exactly 09:00 collides with a leg ending
          at 09:00 and is refused, whereas the team rule in the sibling instance treats a touching
          endpoint as free. Shifting the departure by one minute to 09:01 clears the conflict, and both
          candidate legs stay well inside the 1080-minute kidney CIT limit so capacity is the only gate.
