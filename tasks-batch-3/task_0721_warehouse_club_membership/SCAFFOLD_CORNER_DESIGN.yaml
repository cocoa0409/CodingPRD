              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_id}.reward_accrued_cents == 0"
            - "Membership.${m_id}.reward_accrued_cents == 0"

      - name: reward_excludes_non_eligible_lines
        claim_type: Input Set Filtering
        grounds:
          - 'calculations.transaction_reward_accrual'
          - 'entities.Product.fields.reward_eligible'
        distinguishing_aspect: "An EXECUTIVE finalize over one reward_eligible line (net 40000) and one non-eligible line (net 40000) accrues 800 only on the eligible base (floor(40000*200/10000))."
        test_recipe:
          setup:
            - "EXECUTIVE ACTIVE member cap 100000; product A reward_eligible member 8000, product B reward_eligible=false member 8000; txn with A qty 5 and B qty 5."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-ELIG", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-NOELIG", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: false }
              as: ClubAdmin
              captures: { prod_b: $.data.id }
