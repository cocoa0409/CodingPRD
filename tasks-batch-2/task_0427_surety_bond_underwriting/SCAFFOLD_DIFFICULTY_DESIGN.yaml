          - state_machines.Rider.DRAFT_to_APPLIED
        distinguishing_aspect: |
          On POST /surety/riders/{id}/apply an INCREASE rider whose bond has an OPEN claim AND whose
          increase would breach the single limit violates BOTH business_safety (priority 8,
          ERR_OPEN_CLAIM_EXISTS) and business_fiscal (priority 11, ERR_SINGLE_LIMIT_EXCEEDED);
          priority 8 wins. Category pair: business_safety vs business_fiscal — different from the
          state/referential pair above.
        test_recipe:
          setup:
            - "An ACTIVE bond penal 19,000,000 (program single_limit 20,000,000); a DRAFT INCREASE rider delta 2,000,000 (would reach 21,000,000 > single_limit); a claim FILED on the bond (open)."
