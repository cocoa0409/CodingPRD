              payload: { code: "OCC_PKG", name: "Occ Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 6, bundle_discount_cents: 0, active: true }
