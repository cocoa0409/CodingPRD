            - call: "POST /grower-relations/grape-contracts/${contract_id}/settlement-close"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /grower-relations/grape-contracts/${contract_id}/settlement-summary"
              as: AccountsPayableClerk
            - call: "GET /grower-relations/payment-installments"
              payload: { contract_id: "${contract_id}" }
