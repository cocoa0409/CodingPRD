  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the submit response, a follow-up case read, and a follow-up member read all reflect the mutation within the same logical instant — case IN_REVIEW and reliability_completed_count == 1."
        test_recipe:
          setup: ["case with B assigned (PENDING)"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Imm", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "immediate case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}", captures: { a_st: $.data.status, a_sub: $.data.submitted_at } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { c_st: $.data.status } }
            - { call: "GET /peer-review/committee-members/${m_b}", as: QualityDirector, captures: { rel: $.data.reliability_completed_count } }
          assert:
            - "submit response: status == 'SUBMITTED', submitted_at == '2026-08-01T00:00:00Z'"
            - "immediate GET case: status == 'IN_REVIEW'"
            - "immediate GET member: reliability_completed_count == 1 (no reconciliation lag)"
