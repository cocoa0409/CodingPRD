              payload: { name: "Digital Draft D", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_d: "$.data.id", plan_d_v1: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "draftsub@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_d: "$.data.id" }
          trigger:
