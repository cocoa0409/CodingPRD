  - section: calculations
    instances:
      - name: contract_cap_charge_sums_base_salary_and_first_year_proration
        claim_type: correct_result
        grounds:
          - calculations.contract_current_season_cap_charge
          - calculations.signing_bonus_proration
          - entities.Contract.fields.current_season_cap_charge_cents
        distinguishing_aspect: "For years 3 / base 80000000 / bonus 10000000 / start 2026 the stored contract carries proration_years 3, annual 3333333, final-year 3333334 and current_season_cap_charge_cents 83333333 — the remainder cent is not in the first-season charge."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z, so CURRENT_SEASON_YEAR 2026 equals start_season_year and seasons_elapsed is 0."
            - "Harbor Kings and Ray Alder registered, and a DRAFT SIGNING filing created for 3 years / base 80000000 / bonus 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { cr_team_id: $.data.id, cr_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { cr_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${cr_team_id}", player_id: "${cr_p_id}", transaction_type: "SIGNING", expected_team_version: "${cr_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${cr_team_id}"
              captures: { cr_c_id: $.data.contract_id }
          trigger:
            - call: "GET /contracts/${cr_c_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cr_team_id}"
              captures: { cr_charge: $.data.current_season_cap_charge_cents, cr_annual: $.data.annual_proration_cents, cr_final: $.data.final_season_proration_cents, cr_years: $.data.proration_years, cr_total: $.data.total_value_cents }
          assert:
            - "HTTP 200 with the captured ${cr_years} == 3, ${cr_annual} == 3333333, ${cr_final} == 3333334"
            - "the captured ${cr_charge} == 83333333 (80000000 + 3333333) and ${cr_total} == 250000000"
            - "3 * 3333333 + 1 == 10000000, so the three proration rows re-sum to the signing bonus exactly"
            - "Contract.${cr_c_id}.status == PENDING_APPROVAL and dead_money_current_season_cents == 0"

      - name: provisional_commitment_drops_only_the_voided_contract_from_the_sum
        claim_type: input_set_filtering
        grounds:
          - calculations.team_cap_commitment
          - state_machines.Contract.PENDING_APPROVAL_to_VOIDED
          - state_machines.Transaction.FILED_to_REJECTED
        distinguishing_aspect: "This is a set-membership claim, not a conservation claim: with two PENDING_APPROVAL contracts summing to 115333333, rejecting one leaves the PROVISIONAL total at exactly the survivor's 32000000 while the survivor's own charge is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) with two DRAFT SIGNING filings: Ray Alder at 3 years / base 80000000 / bonus 10000000 (charge 83333333) and Dov Keller at 7 years / base 30000000 / bonus 10000000 (proration capped at MAX_PRORATION_YEARS 5, annual 2000000, charge 32000000)."
            - "Neither filing has been decided, so PROVISIONAL is 115333333 and FINAL is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { if_team_id: $.data.id, if_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { if_p1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Dov Keller", position: "WR" }
              as: LeagueOfficer
              captures: { if_p2_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${if_team_id}", player_id: "${if_p1_id}", transaction_type: "SIGNING", expected_team_version: "${if_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
              captures: { if_txn1_id: $.data.id, if_c1_id: $.data.contract_id }
            - call: "GET /teams/${if_team_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
              captures: { if_team_v2: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${if_team_id}", player_id: "${if_p2_id}", transaction_type: "SIGNING", expected_team_version: "${if_team_v2}", years: 7, base_salary_cents: 30000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
              captures: { if_c2_id: $.data.contract_id }
            - call: "GET /teams/${if_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
              captures: { if_prov_before: $.data.provisional_cap_committed_cents }
            - call: "POST /transactions/${if_txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
          trigger:
            - call: "POST /transactions/${if_txn1_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "cap posture" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /teams/${if_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${if_team_id}"
              captures: { if_prov_after: $.data.provisional_cap_committed_cents, if_final_after: $.data.final_cap_committed_cents, if_space_after: $.data.cap_space_cents }
          assert:
            - "the captured ${if_prov_before} == 115333333 (83333333 + 32000000)"
            - "the captured ${if_prov_after} == 32000000, ${if_final_after} == 0, ${if_space_after} == 468000000"
            - "Contract.${if_c1_id}.status == VOIDED with current_season_cap_charge_cents still 83333333 — the row keeps its value and merely leaves the input set"
            - "Contract.${if_c2_id}.status == PENDING_APPROVAL with current_season_cap_charge_cents == 32000000, annual_proration_cents == 2000000, proration_years == 5"
            - "Transaction.${if_txn1_id}.status == REJECTED with rejection_reason == cap posture"

      - name: waiver_clearance_applies_the_24_hour_revocable_constant
        claim_type: constants_applied
        grounds:
          - calculations.waiver_clearance_deadline
          - entities.WaiverRequest.fields.clearance_deadline_at
          - entities.WaiverRequest.fields.revocability
        distinguishing_aspect: "placed_at 2026-08-10T14:00:00Z is before WAIVER_IRREVOCABLE_CUTOFF, so the request is REVOCABLE and takes the 24-hour constant: raw 2026-08-11T14:00:00Z already sits inside the processing window and is therefore returned unsnapped."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z, well before WAIVER_IRREVOCABLE_CUTOFF 2026-08-25T16:00:00Z."
            - "Harbor Kings with Ray Alder signed on an APPROVED 3-year deal and an APPROVED RELEASE filing for him."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { ca_team_id: $.data.id, ca_team_v1: $.data.version }
