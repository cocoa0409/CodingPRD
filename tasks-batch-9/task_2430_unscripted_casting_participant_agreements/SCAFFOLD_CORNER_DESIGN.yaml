      - name: open_call_intake_inside_and_outside_the_closed_window
        claim_type: temporal_validation
        grounds:
          - validations.priority_16
          - entities.CastingCall.fields.open_call_window_start_utc
          - entities.CastingCall.fields.open_call_window_end_utc
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Temporal claim on a CLOSED (both-ends-inclusive) window. One second before
          the window opens the intake is refused; at exactly the closing instant
          2026-08-10T23:59:59Z it is accepted, proving inclusivity of the upper bound;
          one second later it is refused again. A half-open reading of the window would
          reject the middle call, and a wall-clock implementation could not reproduce
          any of the three because the clock is driven only through the test endpoint.
        test_recipe:
          setup:
            - "One production; one venue; one PUBLISHED OPEN_CALL call whose window is 2026-08-05T00:00:00Z .. 2026-08-10T23:59:59Z."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
