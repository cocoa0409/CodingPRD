scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: manufacturer_creation_returns_201_with_stamped_parity
        claim_type: creation
        grounds:
          - entities.Manufacturer
          - endpoints."POST /manufacturers"
          - calculations.parity_index
        distinguishing_aspect: |
          A create call with all seven required inputs returns 201 and the response echoes every
          input field AND the two server-stamped parity fields (parity_index 1.1500,
          parity_status COMPLIANT) — the creation endpoint is not a bare insert.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.id is a non-empty string"
            - "response.data.name == Acme Motors"
            - "response.data.oem_code == ACME"
            - "response.data.region == NA"
            - "response.data.independent_list_monthly_cents == 115000"
            - "response.data.independent_covered_system_count == 3"
            - "response.data.oem_dealer_monthly_cents == 100000"
            - "response.data.oem_dealer_covered_system_count == 4"
            - "response.data.parity_index == 1.1500"
            - "response.data.parity_status == COMPLIANT"
            - "response.data.version == 1"

      - name: shop_retrieval_returns_stored_ledger_fields
        claim_type: retrieval
        grounds:
          - entities.Shop
          - endpoints."GET /shops/{id}"
          - endpoints."POST /shops/{id}/credit-funding"
        distinguishing_aspect: |
          GET /shops/{id} returns the four stored ledger/derived fields exactly as the funding
          write left them (funded_credit_total_cents 200000, data_credit_balance_cents 200000,
          gateway_fee_accrued_cents 0, coverage_completeness_pct 0.00) — the read recomputes nothing.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Shop 'Bay Auto' on tier PRO funded with 200000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
          trigger:
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopManager
              as_user_id: "${shop_id}"
          assert:
            - "HTTP status == 200"
            - "response.data.id == ${shop_id}"
            - "response.data.name == Bay Auto"
            - "response.data.tier == PRO"
            - "response.data.funded_credit_total_cents == 200000"
            - "response.data.data_credit_balance_cents == 200000"
            - "response.data.gateway_fee_accrued_cents == 0"
            - "response.data.coverage_completeness_pct == 0.00"
            - "response.data.version == 2"

      - name: publication_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Publication
          - endpoints."GET /publications"
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three Publication rows on the same (model, system area) cell with three different
          publication_type values list as total_count 3 with has_more true at limit 2 offset 0
          and has_more false at limit 2 offset 2 — total_count counts the whole filtered set,
          not the returned page.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One SystemArea POWERTRAIN, one Manufacturer ACME, one VehicleModel AX7 2025"
            - "Three Publications on that (model, system area) cell: REPAIR_PROCEDURE, TSB, CALIBRATION_DOC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "REPAIR_PROCEDURE" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_rp_id: $.data.id }
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "TSB" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_tsb_id: $.data.id }
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "CALIBRATION_DOC" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_cd_id: $.data.id }
          trigger:
            - call: "GET /publications"
              payload: { vehicle_model_id: "${vm_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /publications"
              payload: { vehicle_model_id: "${vm_id}", limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "first page: HTTP status == 200 and total_count == 3 and has_more == true"
            - "first page: limit == 2 and offset == 0 and data array length == 2"
            - "second page: total_count == 3 and has_more == false and data array length == 1"
            - "the three returned ids across both pages are exactly {${pub_rp_id}, ${pub_tsb_id}, ${pub_cd_id}}"
            - "every returned row has current_version_no == 0 and published_version_id == null"

      - name: get_entitlement_unknown_id_returns_entitlement_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /entitlements/{id}"
          - errors[ERR_ENTITLEMENT_NOT_FOUND]
          - validations[priority=14]
        distinguishing_aspect: |
          A well-formed but unknown UUID on GET /entitlements/{id} returns
          ERR_ENTITLEMENT_NOT_FOUND with HTTP 404 — not the generic
          ERR_REFERENCED_RESOURCE_NOT_FOUND that priority 20 reserves for body FKs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no ShopEntitlement row exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /entitlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_ENTITLEMENT_NOT_FOUND"
            - "response.response_type == error"

      - name: create_technician_missing_full_name_returns_4XX_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Technician.fields.full_name
          - endpoints."POST /technicians"
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          full_name has source input with no default, so omitting it fails shape validation at
          priority 6 with ERR_INVALID_REQUEST (400) — the row is not created with a null name.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Shop 'Bay Auto' exists on tier PRO"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
            - call: "GET /shops/${shop_id}/technicians"
              payload: {}
              as: ShopManager
              as_user_id: "${shop_id}"
          assert:
            - "create call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST"
            - "list call: total_count == 0 (no partial Technician row was persisted)"

      - name: system_area_defaults_calibration_and_credential_flags_to_false
        claim_type: defaults
        grounds:
          - entities.SystemArea.fields.requires_calibration_doc
          - entities.SystemArea.fields.requires_security_credential
          - endpoints."POST /system-areas"
        distinguishing_aspect: |
          Both boolean flags carry default false, so a create call that omits both returns them
          as false (not null and not absent), while an explicit true is preserved — proving the
          default is applied at write time rather than coerced on read.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no SystemArea row exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /system-areas"
              payload: { code: "BODY_ELECTRICAL", name: "Body Electrical" }
              as: PlatformAdmin
              captures: { sa_body_id: $.data.id }
            - call: "POST /system-areas"
              payload: { code: "ADAS", name: "Advanced Driver Assistance", requires_calibration_doc: true, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_adas_id: $.data.id }
          assert:
            - "first call: HTTP status == 201 and requires_calibration_doc == false and requires_security_credential == false"
            - "first call: response.data.code == BODY_ELECTRICAL and response.data.name == Body Electrical"
            - "second call: requires_calibration_doc == true and requires_security_credential == true"

      - name: entitlement_seats_available_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ShopEntitlement.fields.seats_available
          - entities.ShopEntitlement.fields.charged_cents
          - endpoints."POST /entitlements"
          - calculations.seat_ledger
        distinguishing_aspect: |
          seats_available and charged_cents are source computed and are not in the endpoint's
          input list, so a payload that tries to supply them is rejected at priority 6, and the
          clean create then stamps seats_available 3 and charged_cents 85000 from the ledger and
          the tier formula rather than from any client value.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME COMPLIANT with an ACTIVE License (monthly_fee_cents 100000, one covered system area, seat_cap 5)"
            - "Shop 'Bay Auto' on tier PRO funded 200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
          trigger:
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", seats_available: 99, charged_cents: 1 }
              as: ShopManager
              as_user_id: "${shop_id}"
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id }
          assert:
            - "first call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP status == 201"
            - "ShopEntitlement.${ent_id}.seats_total == 3"
            - "ShopEntitlement.${ent_id}.seats_assigned == 0"
            - "ShopEntitlement.${ent_id}.seats_available == 3 (not 99)"
            - "ShopEntitlement.${ent_id}.charged_cents == 85000 (not 1)"
            - "Shop.${shop_id}.data_credit_balance_cents == 115000"

      - name: technician_system_field_identity_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Technician.fields.identity_status
          - entities.Technician.fields.verified_by_user_id
          - endpoints."POST /technicians"
        distinguishing_aspect: |
          identity_status, verified_by_user_id, id, created_at and version are all server-owned:
          a create payload naming identity_status is rejected at priority 6, and the clean create
          stamps UNVERIFIED with verified_by_user_id null and version 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Shop 'Bay Auto' exists on tier PRO"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tina Tech", credential_expires_at: "2026-12-31T00:00:00Z", identity_status: "VERIFIED" }
              as: ShopManager
              as_user_id: "${shop_id}"
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tina Tech", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { tech_id: $.data.id }
          assert:
            - "first call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP status == 201 and response.data.identity_status == UNVERIFIED"
            - "second call: response.data.verified_by_user_id == null"
            - "second call: response.data.identity_document_ref == null"
            - "second call: response.data.version == 1 and response.data.id is a non-empty string"
            - "Technician.${tech_id}.shop_id == ${shop_id}"

      - name: create_shop_unknown_tier_and_license_inverted_window_rejected
        claim_type: type_constraints
        grounds:
          - entities.Shop.fields.tier
          - entities.License.fields.effective_start
          - entities.License.fields.effective_end
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two different shape failures both land on ERR_INVALID_REQUEST at priority 6: an
          off-enum tier value GOLD, and a License whose effective_start is not strictly before
          effective_end — enum membership and interval ordering are both pre-persistence checks.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN and Manufacturer ACME exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /shops"
              payload: { name: "Gold Garage", tier: "GOLD" }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2027-08-01T00:00:00Z", effective_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /manufacturers/${mfr_id}/licenses"
              payload: {}
              as: PlatformAdmin
          assert:
            - "shop call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST"
            - "license call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST"
            - "list call: total_count == 0 (neither malformed row was persisted)"

      - name: system_area_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.SystemArea.common_fields
          - endpoints."POST /system-areas"
        distinguishing_aspect: |
          SystemArea is declared common_fields false, so its create response carries only its own
          four fields plus id — no version, no created_at, no updated_at — and §1.5 declares no
          PATCH, PUT or DELETE route under /system-areas at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no SystemArea row exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /system-areas"
              payload: { code: "ADAS", name: "Advanced Driver Assistance", requires_calibration_doc: true, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_adas_id: $.data.id }
          assert:
            - "HTTP status == 201 and response.data.id is a non-empty string"
            - "response.data keys are exactly {id, code, name, requires_calibration_doc, requires_security_credential}"
            - "response.data has no version key"
            - "response.data has no created_at key and no updated_at key"
            - "§1.5 contains no PATCH, PUT or DELETE endpoint whose path starts with /system-areas"

      - name: create_vehicle_model_unknown_manufacturer_not_found
        claim_type: parent_relationships
        grounds:
          - entities.VehicleModel.parent
          - endpoints."POST /vehicle-models"
          - errors[ERR_MANUFACTURER_NOT_FOUND]
        distinguishing_aspect: |
          VehicleModel.parent is Manufacturer, and an unknown manufacturer_id in the body raises
          the typed ERR_MANUFACTURER_NOT_FOUND at priority 10 — the typed parent 404 outranks the
          generic priority-20 referenced-resource error.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one real Manufacturer ACME exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "00000000-0000-4000-8000-000000000000", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
          assert:
            - "first call: HTTP status == 404 and response.data.error_id == ERR_MANUFACTURER_NOT_FOUND"
            - "second call: HTTP status == 201 and response.data.manufacturer_id == ${mfr_id}"
            - "second call: response.data.model_code == AX7 and response.data.model_year == 2025"
            - "GET /manufacturers/${mfr_id}/vehicle-models returns total_count == 1"

      - name: seat_assignment_junction_navigable_from_both_technician_and_entitlement
        claim_type: graph_topology
        grounds:
          - complexity_profile.entity_topology
          - entities.SeatAssignment
          - endpoints."GET /seat-assignments"
          - calculations.seat_ledger
        distinguishing_aspect: |
          SeatAssignment is the many-to-many junction between ShopEntitlement and Technician, so
          two seats on one entitlement are reachable both by entitlement_id (2 rows) and by
          technician_id (1 row each), and the entitlement's ledger reads seats_assigned 2 /
          seats_available 1 for the same fixture.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME COMPLIANT with an ACTIVE License (seat_cap 5, one covered system area)"
            - "Shop 'Bay Auto' tier PRO funded 200000, with an ACTIVE SUBSCRIPTION entitlement of seats_total 3"
            - "Two VERIFIED technicians at that shop"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
