              payload: { standard_code: "UT.E.4.1", depth_level: "MASTERY", page_reference: "pp. 15-70", evidence_citation: "Unit 1 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/sampling-shipments"
              payload: { units: 10, carrier_ref: "UT-BOX-1" }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
          trigger:
