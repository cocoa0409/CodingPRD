              as: RampOperator
              captures: { u1: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00111CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u2: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u1}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T11:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
          trigger:
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v2: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u2}", build_start: "2026-08-09T12:00:00Z", build_end: "2026-08-09T13:00:00Z", expected_flight_version: "${f_v2}" }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ULD_POSITION_UNAVAILABLE (reserved_positions 1 == uld_position_count 1)"

      - name: uld_payload_boundary_equality
        claim_type: violation_to_error
        grounds: [calculations.uld_payload_check, "validations[priority=12]"]
        distinguishing_aspect: "ULD payload boundary is inclusive: tare 100 + gross 400 == max_gross 500 assigns cleanly; adding 0.1kg more (500.1 > 500) fails with ERR_ULD_PAYLOAD_EXCEEDED."
        test_recipe:
          setup: ["Flight CA324 OPEN_FOR_BOOKING; type tare 100 max 500; bookings B1 400kg and B2 0.1kg ACCEPTED; DRAFT plan"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA324", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00112CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-U2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-U3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 0.1, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b1}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { tw: $.data.total_weight_kg, p_v2: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b2}", expected_build_up_plan_version: "${p_v2}" }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "Equality allowed: first assign succeeds with ${tw} == 400 (100 + 400 == 500 <= 500)"
            - "Strictly-greater rejected: ${err} == ERR_ULD_PAYLOAD_EXCEEDED (100 + 400 + 0.1 > 500)"

      - name: occ_stale_flight_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[build-plan-create-stale-flight]"]
        distinguishing_aspect: "Plan creation carrying expected_flight_version one behind the flight's current version fails with 412 ERR_STALE_FLIGHT_VERSION; retrying with the current version succeeds."
        test_recipe:
          setup: ["Flight CA325 OPEN_FOR_BOOKING; type + ULD ready; client observed flight version BEFORE opening (stale by one: open bumped it)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA325", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00113CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v_now: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v_now}" }
              as: RampOperator
              captures: { p_st: $.data.status }
          assert:
            - "Stale write (${f_v} captured pre-open): ${err} == ERR_STALE_FLIGHT_VERSION (412)"
            - "Retry with the current version ${f_v_now}: ${p_st} == DRAFT"

      - name: occ_stale_plan_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[assignment-create-stale-plan]"]
        distinguishing_aspect: "Assign carrying a plan version one behind current fails with 412 ERR_STALE_PLAN_VERSION; re-reading the plan and retrying succeeds — deterministic two-sequential-request OCC."
        test_recipe:
          setup: ["Flight CA326 OPEN_FOR_BOOKING; booking 100kg ACCEPTED; DRAFT plan (version observed at creation)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA326", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00114CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-O4", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v} - 1" }
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { tw: $.data.total_weight_kg }
          assert:
            - "Stale write (${p_v} - 1): ${err} == ERR_STALE_PLAN_VERSION (412)"
            - "Retry at current version: succeeds with ${tw} == 100"

      - name: sod_self_check_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the DGInspector role holder whose X-User-ID equals the booking creator's id cannot accept the declaration, even with the correct role."
        test_recipe:
          setup: ["Flight CA327; DG booking created by fwd-1; declaration PENDING_CHECK"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA327", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-SOD", commodity_code: "DG", pieces: 1, gross_weight_kg: 50, volume_m3: 1, is_dangerous_goods: true }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "II", declaration_doc_ref: "DGD-1" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /cargo/dg-declarations/${d_id}/accept"
              as: DGInspector
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
            - call: "POST /cargo/dg-declarations/${d_id}/accept"
              as: DGInspector
              as_user_id: dg-9
              captures: { st: $.data.status }
          assert:
            - "Self-check (X-User-ID fwd-1 == booking creator): ${err} == ERR_SOD_VIOLATION (403)"
            - "Independent checker dg-9: ${st} == ACCEPTED"

      - name: cancel_other_forwarders_booking_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_BOOKING_NOT_OWNED]"]
        distinguishing_aspect: "Ownership is attribute-based: a ForwarderAgent whose X-User-ID differs from created_by_user_id cannot cancel the booking (ERR_BOOKING_NOT_OWNED) even though the role may cancel."
        test_recipe:
          setup: ["Flight CA328; booking created by fwd-1 (REQUESTED)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA328", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-OWN", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/cancel"
              as: ForwarderAgent
              as_user_id: fwd-2
              captures: { err: $.data.error_id }
            - call: "POST /cargo/bookings/${b_id}/cancel"
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { st: $.data.status }
          assert:
            - "Non-owner: ${err} == ERR_BOOKING_NOT_OWNED (403)"
            - "Owner: ${st} == CANCELLED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_object_and_error_shapes
        claim_type: envelope_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Every response wraps in the fixed envelope: success object carries meta.api_request_id + response_type object; failure carries response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Flight CA329 exists"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA329", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
            - call: "GET /cargo/flights/00000000-0000-0000-0000-000000000000"
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "Success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object"
            - "Failure: response_type == error, data.error_id == ERR_NOT_FOUND (${err}), data.message non-empty"

      - name: clock_default_applies_without_set
        claim_type: conditional_action
        grounds: [endpoints, entities.ULD.fields.dispatched_at]
        distinguishing_aspect: "Without any set_current_utc call the logical clock is pinned at 2026-08-01T00:00:00Z: a departure stamps dispatched_at with exactly that default, never wall-clock time."
        test_recipe:
          setup: ["Flight CA330 fully built (booking BUILT_UP, plan SEALED, CLOSED) with NO clock-set call anywhere in the chain"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA330", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00115CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-CK", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
          trigger:
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "GET /cargo/ulds/${u_id}"
              as: RampOperator
              captures: { disp: $.data.dispatched_at }
          assert:
            - "${disp} == 2026-08-01T00:00:00Z (startup default — no wall-clock leakage)"

