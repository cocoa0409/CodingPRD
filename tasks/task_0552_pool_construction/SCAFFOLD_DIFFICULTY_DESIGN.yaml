# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pool Construction & Remodel — Expert tier. 19 instances across 9 rules.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls
# chain drives empty-DB → the setup state using only §1.5 endpoints.
# Reusable literals: owner_user_id "owner-1" (Owner acts as as_user_id "owner-1").
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: draw_provisional_vs_final_divergence
        grounds:
          - calculations.draw_eligibility
          - entities.DrawRequest.fields.provisional_eligible_cents
          - entities.DrawRequest.fields.eligible_cents
          - state_machines.DrawRequest.APPROVED_to_FUNDED
        distinguishing_aspect: |
          On the DrawRequest financial domain, the provisional variant snapshotted at CREATE
          while the gate is IN_PROGRESS (factor 0.5 → 50000) differs from the final variant at
          FUND after the gate PASSED (factor 1.0 → 100000); same phase budget, two algorithms,
          different cents.
        test_recipe:
          setup:
            - "Permitted project (contract 500000); one EXCAVATION PhaseGate budget 100000, started (IN_PROGRESS)."
            - "A DrawRequest created while the gate is IN_PROGRESS (provisional 50000), then APPROVED; the gate is then PASSED before funding."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg_id}/start", payload: {}, as: BuilderPM }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { pv1: $.data.version } }
            - { call: "POST /pool-build/draw-requests", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", requested_cents: 100000, expected_pool_project_version: "${pv1}" }, as: BuilderPM, captures: { dr_id: $.data.id } }
            - { call: "POST /pool-build/draw-requests/${dr_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T10:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins_id}/record", payload: { outcome: "PASS" }, as: Inspector }
          trigger:
            - { call: "POST /pool-build/draw-requests/${dr_id}/transition", payload: { action: "FUND" }, as: BuilderPM }
          assert:
            - "DrawRequest.${dr_id}.provisional_eligible_cents == 50000"
            - "DrawRequest.${dr_id}.eligible_cents == 100000"
            - "DrawRequest.${dr_id}.net_disbursed_cents == 90000"
            - "DrawRequest.${dr_id}.provisional_eligible_cents != DrawRequest.${dr_id}.eligible_cents"

      - name: subcontractor_projected_vs_realized_reliability
        grounds:
          - calculations.subcontractor_reliability
          - entities.Subcontractor.fields.reliability_projected
          - entities.Subcontractor.fields.reliability_realized
          - entities.PhaseGate.fields.inspection_attempts
        distinguishing_aspect: |
          On the Subcontractor domain (a different entity than the draw calc), projected
          reliability (100: both COMPLETED assignments sit on non-FAILED gates) diverges from
          realized reliability (50: only one gate PASSED on inspection_attempts==1); same
          assignments, two inclusion rules, different score.
        test_recipe:
          setup:
            - "Permitted project (contract 500000); gates EXCAVATION and STEEL each budget 100000; one Subcontractor S."
            - "Assignment A1 (S→EXCAVATION) COMPLETED; EXCAVATION PASSED on first inspection (attempts=1)."
            - "Assignment A2 (S→STEEL) COMPLETED; STEEL FAILED once then reworked and PASSED (attempts=2)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "GENERAL" }, as: BuilderPM, captures: { sub_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg1_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "STEEL", budget_cents: 100000 }, as: BuilderPM, captures: { pg2_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg1_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${sub_id}", phase_gate_id: "${pg1_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z" }, as: BuilderPM, captures: { a1_id: $.data.id } }
            - { call: "POST /pool-build/crew-assignments/${a1_id}/transition", payload: { action: "COMPLETE" }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg1_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T17:00:00Z" }, as: Inspector, captures: { ins1_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins1_id}/record", payload: { outcome: "PASS" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates/${pg2_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${sub_id}", phase_gate_id: "${pg2_id}", start_at: "2026-06-02T08:00:00Z", end_at: "2026-06-02T16:00:00Z" }, as: BuilderPM, captures: { a2_id: $.data.id } }
            - { call: "POST /pool-build/crew-assignments/${a2_id}/transition", payload: { action: "COMPLETE" }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg2_id}", inspector_name: "Insp", scheduled_at: "2026-06-02T17:00:00Z" }, as: Inspector, captures: { ins2_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins2_id}/record", payload: { outcome: "FAIL" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates/${pg2_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg2_id}", inspector_name: "Insp", scheduled_at: "2026-06-03T17:00:00Z" }, as: Inspector, captures: { ins3_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins3_id}/record", payload: { outcome: "PASS" }, as: Inspector }
          trigger:
            - { call: "GET /pool-build/subcontractors/${sub_id}", as: BuilderPM, captures: { proj: $.data.reliability_projected, real: $.data.reliability_realized } }
          assert:
            - "Subcontractor.${sub_id}.reliability_projected == 100"
            - "Subcontractor.${sub_id}.reliability_realized == 50"
            - "Subcontractor.${sub_id}.reliability_projected != Subcontractor.${sub_id}.reliability_realized"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: draw_fundable_nested_min_mode_a
        grounds:
          - calculations.draw_eligibility
          - entities.PhaseGate.fields.budget_cents
          - entities.PhaseGate.fields.status
          - entities.DrawRequest.fields.requested_cents
        distinguishing_aspect: |
          Mode (a): provisional_eligible_cents = max(0, min(round(budget*completion_factor(status)),
          requested)) has three inputs with a tiered status-factor selection (INSPECTION_PENDING→0.8)
          nested inside a min against requested; with budget 100000, factor 0.8 (phase_earned 80000)
          and requested 60000 the min binds on requested → 60000.
        test_recipe:
          setup:
            - "Permitted project (contract 500000); EXCAVATION gate budget 100000, started then inspection scheduled → gate INSPECTION_PENDING."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T10:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { pv1: $.data.version } }
          trigger:
            - { call: "POST /pool-build/draw-requests", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", requested_cents: 60000, expected_pool_project_version: "${pv1}" }, as: BuilderPM, captures: { dr_id: $.data.id } }
          assert:
            - "DrawRequest.${dr_id}.provisional_eligible_cents == 60000"

      - name: retainage_per_line_rounding_mode_b
        grounds:
          - calculations.retainage_computation
          - entities.DrawRequest.fields.retainage_cents
          - entities.PoolProject.fields.retainage_held_cents
        distinguishing_aspect: |
          Mode (b): two funded draws of eligible 12345 each round retainage PER LINE
          (round_half_up(12345*0.10)=1235 each → held 2470), which differs from sum-then-round
          (round(24690*0.10)=2469); the scaffold pins per-line rounding so retainage_held_cents==2470.
        test_recipe:
          setup:
            - "Permitted project (contract 500000); gates EXCAVATION and STEEL each budget 12345, both PASSED."
            - "Two draws (one per gate) requested 12345, both APPROVED, both FUNDED."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 12345 }, as: BuilderPM, captures: { pg1_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "STEEL", budget_cents: 12345 }, as: BuilderPM, captures: { pg2_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg1_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg1_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T10:00:00Z" }, as: Inspector, captures: { ins1_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins1_id}/record", payload: { outcome: "PASS" }, as: Inspector }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { pv_a: $.data.version } }
            - { call: "POST /pool-build/draw-requests", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg1_id}", requested_cents: 12345, expected_pool_project_version: "${pv_a}" }, as: BuilderPM, captures: { dr1_id: $.data.id } }
            - { call: "POST /pool-build/draw-requests/${dr1_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/draw-requests/${dr1_id}/transition", payload: { action: "FUND" }, as: BuilderPM }
            - { call: "POST /pool-build/phase-gates/${pg2_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg2_id}", inspector_name: "Insp", scheduled_at: "2026-06-02T10:00:00Z" }, as: Inspector, captures: { ins2_id: $.data.id } }
            - { call: "POST /pool-build/inspections/${ins2_id}/record", payload: { outcome: "PASS" }, as: Inspector }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { pv_b: $.data.version } }
            - { call: "POST /pool-build/draw-requests", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg2_id}", requested_cents: 12345, expected_pool_project_version: "${pv_b}" }, as: BuilderPM, captures: { dr2_id: $.data.id } }
            - { call: "POST /pool-build/draw-requests/${dr2_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /pool-build/draw-requests/${dr2_id}/transition", payload: { action: "FUND" }, as: BuilderPM }
          assert:
            - "DrawRequest.${dr1_id}.retainage_cents == 1235"
            - "DrawRequest.${dr2_id}.retainage_cents == 1235"
            - "PoolProject.${pp_id}.retainage_held_cents == 2470"

      - name: change_order_discount_evaluation_order_mode_c
        grounds:
          - calculations.change_order_discount
          - entities.ChangeOrder.fields.applied_delta_cents
          - entities.PoolProject.fields.contract_amount_cents
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Mode (c): applied_delta depends on the discount tier, which is keyed on cumulative
          pre-discount applied deltas (part of contract_amount) — resolved by the pinned order
          (tier read BEFORE adding this CO). CO1 (+600000) applies at tier 0% → 600000; CO2 (+400000)
          reads cumulative_pre 600000 → tier 3% → round(400000*0.97)=388000; contract_amount==1988000.
        test_recipe:
          setup:
            - "Project contract 1000000. ChangeOrder CO1 (+600000) APPLIED; ChangeOrder CO2 (+400000) APPROVED."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 1000000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/change-orders", payload: { pool_project_id: "${pp_id}", category: "SCOPE", description: "spa add", price_delta_cents: 600000 }, as: BuilderPM, captures: { co1_id: $.data.id } }
            - { call: "POST /pool-build/change-orders/${co1_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/change-orders/${co1_id}/transition", payload: { action: "APPLY" }, as: BuilderPM }
            - { call: "POST /pool-build/change-orders", payload: { pool_project_id: "${pp_id}", category: "HEATER", description: "heater upgrade", price_delta_cents: 400000 }, as: BuilderPM, captures: { co2_id: $.data.id } }
            - { call: "POST /pool-build/change-orders/${co2_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /pool-build/change-orders/${co2_id}/transition", payload: { action: "APPLY" }, as: BuilderPM, captures: { ad: $.data.applied_delta_cents } }
          assert:
            - "ChangeOrder.${co1_id}.applied_delta_cents == 600000"
            - "ChangeOrder.${co2_id}.applied_delta_cents == 388000"
            - "PoolProject.${pp_id}.contract_amount_cents == 1988000"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: design_plan_revision_cycle
        grounds:
          - state_machines.DesignPlan.RENDERED_3D_to_OWNER_APPROVED
          - state_machines.DesignPlan.OWNER_APPROVED_to_DRAFT
          - state_machines.DesignPlan.RENDERED_3D_to_DRAFT
          - entities.DesignPlan.fields.revision_count
        distinguishing_aspect: |
          On DesignPlan (an entity distinct from the Inspection machine), the status forms a cycle
          DRAFT→RENDERED_3D→OWNER_APPROVED→DRAFT→RENDERED_3D→DRAFT; two REQUEST_REVISION loops return
          it to DRAFT with revision_count monotonically 2 — a true A→B→A loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Project + DesignPlan DRAFT; RENDER→RENDERED_3D; APPROVE→OWNER_APPROVED (permit NONE)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "REQUEST_REVISION" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "REQUEST_REVISION" }, as: Owner, as_user_id: "owner-1" }
          assert:
            - "DesignPlan.${dp_id}.status == DRAFT"
            - "DesignPlan.${dp_id}.revision_count == 2"

      - name: inspection_branch_fork_fail_path
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.PhaseGate.INSPECTION_PENDING_to_FAILED
        distinguishing_aspect: |
          On Inspection (a different entity than DesignPlan), SCHEDULED branches to
          {PASSED, FAILED, CANCELLED} with disjoint side-effect sets; the FAIL branch drives
          PhaseGate→FAILED and PoolProject.posture→STOP_WORK, side effects the PASS branch never fires.
        test_recipe:
          setup:
            - "Permitted project; EXCAVATION gate budget 100000, started, inspection scheduled → gate INSPECTION_PENDING."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg_id}/start", payload: {}, as: BuilderPM }
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T10:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/inspections/${ins_id}/record", payload: { outcome: "FAIL" }, as: Inspector }
          assert:
            - "Inspection.${ins_id}.status == FAILED"
            - "PhaseGate.${pg_id}.status == FAILED"
            - "PoolProject.${pp_id}.posture == STOP_WORK"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plaster_pass_cascades_startup_and_retainage_release
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.PhaseGate.INSPECTION_PENDING_to_PASSED
          - state_machines.PoolProject.IN_CONSTRUCTION_to_STARTUP_READY
          - calculations.draw_ledger
          - entities.DrawRequest.fields.retainage_released
        distinguishing_aspect: |
          Depth-3 chain: recording the PLASTER inspection PASS mutates PhaseGate(PLASTER)→PASSED
          (hop1), which because all five gates are now PASSED mutates PoolProject→STARTUP_READY (hop2),
          which releases the funded draw's retainage — retainage_released=true, retainage_held_cents 0,
          amount_disbursed_cents 100000 (hop3). Each hop is caused by the prior mutation.
