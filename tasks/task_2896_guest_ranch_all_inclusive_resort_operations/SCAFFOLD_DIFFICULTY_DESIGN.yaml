            - "ActivitySlot.${slot_mix}.minor_rider_count == 1"
            - "ActivitySlot.${slot_mix}.required_guide_count == 2"
            - "ActivitySlot.${slot_adults}.confirmed_rider_count == 2"
            - "ActivitySlot.${slot_adults}.minor_rider_count == 0"
            - "ActivitySlot.${slot_adults}.required_guide_count == 1"
            - "neither slot reports required_guide_count 3, which is what summing the three floors would produce for the MIX slot"

  - rule_id: non_linear_state_machine
    instances:
      - name: booking_status_and_payment_status_dimensions_move_independently_on_cancel
        grounds:
          - state_machines.Booking.booking_status
          - state_machines.Booking.payment_status
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund_split
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Booking carries two parallel state dimensions. One cancel call drives booking_status to
          the terminal CANCELLED while payment_status lands on PARTIALLY_REFUNDED — a value that is
          reachable only from DEPOSIT_PAID and only for a middle refund band. The same call on an
          unpaid hold sends payment_status to FORFEITED instead, so the second dimension is not a
          function of the first; a single-enum implementation cannot represent this pair.
        test_recipe:
          setup:
            - "OPEN season with deposit_pct 0.30 and refund bands 90/60/30 days"
            - "confirmed 7-night booking for two adults and one child with its 377607-cent deposit paid, so payment_status is DEPOSIT_PAID"
            - "clock left at 2026-08-01, which is 71 days before the 2026-10-11 arrival and therefore inside the 60..89 band with refund_pct 0.50"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
            - call: "POST /bookings"
