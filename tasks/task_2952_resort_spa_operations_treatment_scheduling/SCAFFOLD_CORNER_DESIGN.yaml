      - call: POST /therapists
        payload: { full_name: "Report Window Therapist", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "CA" }
        as: SpaDirector
        captures: { th: $.data.id }
      trigger:
      - call: GET /reports/room-utilization
        payload: { from_at: "2026-08-10T00:00:00.000Z", to_at: "2026-08-10T00:00:00.000Z" }
        as: SpaDirector
        captures: { err_empty_window: $.data.error_id }
      - call: GET /reports/room-utilization
        payload: { from_at: "2026-08-11T00:00:00.000Z", to_at: "2026-08-10T00:00:00.000Z" }
        as: SpaDirector
        captures: { err_inverted_window: $.data.error_id }
      - call: GET /reports/room-utilization
        payload: { from_at: "2026-05-01T00:00:00.000Z", to_at: "2026-08-01T00:00:00.001Z" }
        as: SpaDirector
        captures: { err_span_too_long: $.data.error_id }
      - call: GET /reports/room-utilization
        payload: { from_at: "2026-05-01T00:00:00.000Z", to_at: "2026-08-01T00:00:00.000Z" }
        as: SpaDirector
      - call: GET /reports/retail-attachment
        payload: { from_at: "2026-08-11T00:00:00.000Z", to_at: "2026-08-10T00:00:00.000Z" }
        as: SpaCoordinator
        captures: { err_retail_inverted: $.data.error_id }
      - call: GET /reports/retail-attachment
        payload: { from_at: "2026-05-01T00:00:00.000Z", to_at: "2026-08-01T00:00:00.001Z", therapist_id: "${th}" }
        as: SpaCoordinator
        captures: { err_retail_span: $.data.error_id }
      - call: GET /reports/retail-attachment
        payload: { from_at: "2026-05-01T00:00:00.000Z", to_at: "2026-08-01T00:00:00.000Z", therapist_id: "${th}" }
        as: SpaCoordinator
      assert:
      - "from_at == to_at returns 422 ERR_INVALID_REPORT_WINDOW: the lower comparison is strict, so a zero-width window is not a legal report request"
      - "from_at > to_at returns 422 ERR_INVALID_REPORT_WINDOW on the room-utilization report"
      - "2026-05-01T00:00:00.000Z to 2026-08-01T00:00:00.001Z spans 92 days plus one millisecond and returns 422 ERR_INVALID_REPORT_WINDOW"
      - "2026-05-01T00:00:00.000Z to 2026-08-01T00:00:00.000Z spans exactly MAX_REPORT_WINDOW_DAYS days and returns 200 with window_minutes 132480 and one room row for DRY-1 whose occupied_minutes, revenue_cents, labor_cost_cents and net_margin_cents are all 0"
      - "the same inverted and over-long windows on GET /reports/retail-attachment also return 422 ERR_INVALID_REPORT_WINDOW, proving the guard is shared, not per-endpoint"
      - "the exactly-92-day retail window returns 200 with eligible_appointment_count 0, purchased_count 0, attach_rate_pct 0.00, purchased_amount_cents 0 and commission_cents 0, and the therapist_id filter narrows without changing the guard"

