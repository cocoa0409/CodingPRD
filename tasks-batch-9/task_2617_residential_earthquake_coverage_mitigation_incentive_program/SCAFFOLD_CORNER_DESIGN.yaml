              as: ProgramAdmin
            - call: "POST /eqp/catastrophe-events"
              payload: { event_code: "EQ-2026-VALID", magnitude: 6.4, epicenter_county_code: "06111", occurred_at: "2026-09-05T00:00:00Z", retention_cents: 100000000 }
              as: ProgramAdmin
