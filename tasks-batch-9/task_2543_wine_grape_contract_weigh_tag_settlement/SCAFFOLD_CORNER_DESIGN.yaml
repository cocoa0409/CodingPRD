              payload: { weigh_tag_id: "${tag_id}" }
              as: QualityLabTech
          assert:
            - "The grading response itself already carries adjustment_pct 0.0 and recommended_disposition ACCEPT — the derived grade is in the same response, not fetched later"
            - "Settlement lines: exactly one row, status PROVISIONAL, bucket CONTRACT, ton_slice 20.000, gross_amount_cents 9000000, provisional_amount_cents 5400000"
            - "Contract: delivered_contract_tons 20.000, delivered_over_tons 0.000, rejected_tons 0.000, provisional_settlement_cents 5400000, tonnage_status OPEN — all four rollups already reconciled"
            - "Pick call: status FULFILLED with fulfillment_pct 100.0, because delivered_net_tons 20.000 >= estimated_tons 20.000 was evaluated inside the same request"
            - "Appointment: status CLOSED, because the graded tag was its last open one"
            - "Lane: committed_tons 0.000 and scheduled_appointment_count 0 — the ledger spans only SCHEDULED and ARRIVED, so closing the appointment released the slot immediately"
            - "Block: delivered_net_tons_vintage 20.000"
            - "Quality grades: exactly one row with superseded_at null, and the weigh tag reports grade_count 1 and active_adjustment_pct 0.0"
            - "No re-read after any delay changes any of these values: there is no eventual-consistency window to wait out"
