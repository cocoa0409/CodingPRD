scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: domain_renewal_quoted_vs_charged_across_redemption
        grounds:
          - calculations.domain_renewal_charge
          - calculations.domain_expiry_sweep
          - state_machines.Domain.lifecycle_status.EXPIRED_to_REDEMPTION
          - state_machines.Domain.lifecycle_status.REDEMPTION_to_ACTIVE
          - entities.Domain.fields.lifecycle_status
        distinguishing_aspect: |
          The dual variant lives on the Domain entity domain (registration term pricing):
          the QUOTED variant reads lifecycle_status at quote time (EXPIRED -> quoted_total_cents
          1199) while the CHARGED variant re-reads it at renew time (REDEMPTION -> charged
          subtotal 9199, i.e. exactly REDEMPTION_FEE_CENTS = 8000 more) for identical inputs.
        test_recipe:
          setup:
            - "Account with a card on file."
            - "Domain example.com registered for 1 year with auto_renew disabled, activated on 2026-05-01, expires_at 2027-05-01."
            - "Clock at 2027-05-20 and a sweep run, so the domain sits in EXPIRED (19 days into the 30-day grace)."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "ada@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: false, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { reg_inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${reg_inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/_ops/run-expiry-sweep"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /registrar/domains/${dom_id}/renewal-quote"
              payload: { term_years: 1 }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/_ops/run-expiry-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_v: $.data.version }
            - call: "POST /registrar/domains/${dom_id}/renew"
              payload: { term_years: 1, expected_domain_version: "${dom_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { renew_inv_id: "$.data[0].id" }
          assert:
            - "renewal-quote response variant == 'QUOTED', lifecycle_status == 'EXPIRED', redemption_fee_cents == 0, quoted_total_cents == 1199"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE' after the renew (REDEMPTION -> ACTIVE)"
            - "Invoice.${renew_inv_id}.subtotal_cents == 9199 (CHARGED variant: 1199 renewal + 8000 REDEMPTION_FEE)"
            - "Invoice.${renew_inv_id}.service_fee_cents == 299"
            - "Invoice.${renew_inv_id}.tax_cents == 759"
            - "Invoice.${renew_inv_id}.total_cents == 10257"
            - "Invoice.${renew_inv_id}.subtotal_cents - 1199 == 8000, i.e. the CHARGED subtotal exceeds the QUOTED total by exactly REDEMPTION_FEE_CENTS"

      - name: hosting_overage_provisional_vs_final_same_usage_rows
        grounds:
          - calculations.hosting_bandwidth_overage
          - entities.BillingPeriod.fields.provisional_overage_cents
          - entities.BillingPeriod.fields.final_overage_cents
          - state_machines.BillingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — HostingSubscription
          bandwidth metering, not domain pricing. Over the SAME four UsageRecord rows the
          PROVISIONAL variant (flat rate, rounded per record, chronological) yields 3079 cents
          while the FINAL variant (tiered rate, rounded once over the aggregate) yields 2809.
        test_recipe:
          setup:
            - "DELUXE plan: bandwidth_quota_mb 10240, overage_rate_cents_per_gb 200."
            - "Subscription activated on 2026-05-01, so its first BillingPeriod is [2026-05-01, 2026-05-31)."
            - "Four bandwidth usage records inside that period: 6000, 6000, 6000 and 8000 MB (26000 MB total, 15760 MB over quota)."
          setup_api_calls:
            - call: "POST /registrar/hosting-plans"
              payload: { plan_code: "DLX-1", tier: "DELUXE", storage_quota_mb: 5120, bandwidth_quota_mb: 10240, monthly_price_cents: 4999, included_mailboxes: 5, included_ssl: true, overage_rate_cents_per_gb: 200 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /registrar/accounts"
              payload: { email: "ops@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/hosting-subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${sub_inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/hosting-subscriptions/${sub_id}/billing-periods"
              payload: { status: "OPEN" }
              as: BillingAdmin
              captures: { p0_id: "$.data[0].id" }
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 6000, recorded_at: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 6000, recorded_at: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 6000, recorded_at: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 8000, recorded_at: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /registrar/billing-periods/${p0_id}/close"
              payload: {}
              as: BillingAdmin
              captures: { final_cents: $.data.final_overage_cents, prov_cents: $.data.provisional_overage_cents }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", billing_period_id: "${p0_id}" }
              as: BillingAdmin
              captures: { ov_inv_id: "$.data[0].id" }
          assert:
            - "BillingPeriod.${p0_id}.provisional_overage_cents == 3079"
            - "BillingPeriod.${p0_id}.final_overage_cents == 2809"
            - "BillingPeriod.${p0_id}.provisional_overage_cents != BillingPeriod.${p0_id}.final_overage_cents"
            - "Invoice.${ov_inv_id}.subtotal_cents == 2809 (the FINAL figure is billed, not the provisional one)"
            - "Invoice.${ov_inv_id}.tax_cents == 232"
            - "Invoice.${ov_inv_id}.total_cents == 3041"
            - "HostingSubscription.${sub_id}.status == 'ACTIVE' and bandwidth_used_mb == 0 after the close"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_tax_rounding_then_sum_beats_invoice_wide_rounding
        grounds:
          - calculations.invoice_total
          - entities.InvoiceLineItem.fields.line_tax_cents
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. A .xyz registration with WHOIS
          privacy produces two lines (199 and 999 cents). Rounding tax PER LINE and summing
          gives 16 + 82 = 98 cents; rounding once over the 1198-cent base gives 99. The
          scaffold pins per-line-then-sum, so tax_cents MUST be 98 and total_cents 1296.
        test_recipe:
          setup:
            - "Account with a card on file."
            - "A .xyz registration for 1 year with whois_privacy enabled: DOMAIN_REGISTRATION line 199 cents, PRIVACY_FEE line 999 cents."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "cheap@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "budgetsite", tld: "xyz", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: true, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "GET /registrar/invoices/${inv_id}/line-items"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 1198"
            - "InvoiceLineItem[item_type=DOMAIN_REGISTRATION].line_subtotal_cents == 199 and line_tax_cents == 16"
            - "InvoiceLineItem[item_type=PRIVACY_FEE].line_subtotal_cents == 999 and line_tax_cents == 82"
            - "Invoice.${inv_id}.tax_cents == 98 (NOT 99 — per-line rounding, then sum)"
            - "Invoice.${inv_id}.service_fee_cents == 0"
            - "Invoice.${inv_id}.total_cents == 1296"

      - name: promo_cap_then_service_fee_tier_evaluation_order
        grounds:
          - calculations.invoice_promo_and_service_fee
          - calculations.invoice_total
          - entities.Invoice.fields.service_fee_cents
          - entities.PromoCode.fields.max_discount_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the service fee
          is keyed on the POST-discount subtotal while the promo's min_subtotal gate is keyed on
          the PRE-discount subtotal. A 20999-cent ULTIMATE invoice discounted by a capped 3000
          drops from the >=20000 tier (999) into the 5000..19999 tier (299) — evaluating the fee
          before the discount would charge 999.
        test_recipe:
          setup:
            - "ULTIMATE plan priced at 20999 cents."
            - "PromoCode SAVE20: PERCENT 0.20, applies_to_item_types [HOSTING_PLAN], min_subtotal_cents 10000, max_discount_cents 3000."
            - "An ISSUED hosting invoice with a single HOSTING_PLAN line of 20999 cents."
          setup_api_calls:
            - call: "POST /registrar/hosting-plans"
              payload: { plan_code: "ULT-1", tier: "ULTIMATE", storage_quota_mb: 20480, bandwidth_quota_mb: 51200, monthly_price_cents: 20999, included_mailboxes: 25, included_ssl: true, overage_rate_cents_per_gb: 150 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /registrar/promo-codes"
              payload: { code: "SAVE20", discount_type: "PERCENT", discount_value: 0.20, applies_to_item_types: ["HOSTING_PLAN"], min_subtotal_cents: 10000, max_discount_cents: 3000 }
              as: BillingAdmin
            - call: "POST /registrar/accounts"
              payload: { email: "ult@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/hosting-subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" }
          trigger:
            - call: "POST /registrar/invoices/${inv_id}/apply-promo"
              payload: { promo_code: "SAVE20", expected_invoice_version: "${inv_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 20999"
            - "Invoice.${inv_id}.discount_cents == 3000 (raw 20% = 4200, capped at max_discount_cents)"
            - "Invoice.${inv_id}.service_fee_cents == 299 (tier keyed on 17999, NOT 999 from the pre-discount 20999)"
            - "Invoice.${inv_id}.tax_cents == 1485"
            - "Invoice.${inv_id}.total_cents == 19783"
            - "Invoice.${inv_id}.applied_promo_code == 'SAVE20'"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: domain_lifecycle_and_lock_dimensions_evolve_independently
        grounds:
          - state_machines.Domain.lock_status.LOCKED_to_UNLOCKED
          - state_machines.Domain.lifecycle_status.ACTIVE_to_EXPIRED
          - state_machines.Domain.lifecycle_status.EXPIRED_to_ACTIVE
          - entities.Domain.fields.lock_status
          - entities.Domain.fields.lifecycle_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (Domain): lock_status moves LOCKED -> UNLOCKED
          while lifecycle_status stays ACTIVE, and lifecycle_status then cycles ACTIVE -> EXPIRED
          -> ACTIVE while lock_status stays UNLOCKED throughout. Neither dimension is a function
          of the other.
        test_recipe:
          setup:
            - "Account with a card on file."
            - "Domain example.com active since 2026-05-01, auto_renew disabled, expires_at 2027-05-01, lock_status LOCKED."
            - "Clock advanced to 2026-07-01, past the 60-day post-registration transfer lock."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "dual@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: false, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { reg_inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${reg_inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /registrar/domains/${dom_id}/settings"
              payload: { locked: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/_ops/run-expiry-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_v: $.data.version }
            - call: "POST /registrar/domains/${dom_id}/renew"
              payload: { term_years: 1, expected_domain_version: "${dom_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "after PATCH settings: Domain.${dom_id}.lock_status == 'UNLOCKED' and lifecycle_status == 'ACTIVE' (lifecycle untouched by the lock move)"
            - "after the sweep: Domain.${dom_id}.lifecycle_status == 'EXPIRED' and lock_status == 'UNLOCKED' (lock untouched by the lifecycle move)"
            - "after the renew: Domain.${dom_id}.lifecycle_status == 'ACTIVE' and lock_status == 'UNLOCKED'"

      - name: transfer_request_rejected_then_retried_then_completed_cycle
        grounds:
          - state_machines.TransferRequest.INITIATED_to_PENDING_ACK
          - state_machines.TransferRequest.PENDING_ACK_to_REJECTED
          - state_machines.TransferRequest.REJECTED_to_INITIATED
          - state_machines.TransferRequest.PENDING_ACK_to_COMPLETED
          - entities.TransferRequest.fields.attempt_count
        distinguishing_aspect: |
          A cycle on a DIFFERENT entity (TransferRequest): INITIATED -> PENDING_ACK -> REJECTED
          -> INITIATED -> PENDING_ACK -> COMPLETED. The entity re-enters a state it already left,
          attempt_count reaches 2, and the inbound approval mints a brand-new Domain.
        test_recipe:
          setup:
            - "Account with a card on file."
            - "An inbound TransferRequest for acquired.net in INITIATED with attempt_count 0."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "xfer@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests"
              payload: { account_id: "${acct_id}", direction: "IN", domain_name: "acquired", tld: "net", epp_auth_code: "EPP-WRONG-01" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/registry-response"
              payload: { outcome: "REJECTED", reason: "auth code rejected by losing registrar" }
              as: PlatformAdmin
            - call: "POST /registrar/transfer-requests/${tr_id}/retry"
              payload: { epp_auth_code: "EPP-CORRECT-02" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/registry-response"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
              captures: { new_dom_id: $.data.domain_id }
          assert:
            - "after the first registry-response: TransferRequest.${tr_id}.status == 'REJECTED' and rejection_reason == 'auth code rejected by losing registrar'"
            - "after the retry: TransferRequest.${tr_id}.status == 'INITIATED' and epp_auth_code == 'EPP-CORRECT-02' and rejection_reason is null"
            - "TransferRequest.${tr_id}.attempt_count == 2 (incremented on each submit)"
            - "TransferRequest.${tr_id}.status == 'COMPLETED'"
            - "Domain.${new_dom_id}.fqdn == 'acquired.net' and lifecycle_status == 'ACTIVE' and lock_status == 'LOCKED' and account_id == '${acct_id}'"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: abuse_uphold_cascades_domain_addons_account_subscription
        grounds:
          - state_machines.AbuseReport.UNDER_REVIEW_to_UPHELD
          - state_machines.Domain.lifecycle_status.ACTIVE_to_SUSPENDED
          - state_machines.AddOn.ACTIVE_to_REVOKED
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.HostingSubscription.ACTIVE_to_SUSPENDED
          - calculations.account_risk_score
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /abuse-reports/{id}/uphold: uphold -> Domain
          SUSPENDED -> (because the domain suspended) its SSL add-on REVOKED, its mailbox add-on
          SUSPENDED and Account.risk_score recomputed to 90 -> (because the score crossed 70)
          Account SUSPENDED -> (because the account suspended) HostingSubscription SUSPENDED.
          Each hop is caused by the previous hop, not by the original uphold.
        test_recipe:
          setup:
            - "Account with a card, two active domains example.com (d1) and shop.net (d2)."
            - "An ACTIVE DELUXE hosting subscription with NO primary domain bound."
            - "On d2: one ACTIVE email mailbox add-on and one PENDING_VALIDATION SSL add-on."
            - "Two abuse reports, one HIGH on d1 and one CRITICAL on d2, both already UNDER_REVIEW by analyst-1."
          setup_api_calls:
            - call: "POST /registrar/hosting-plans"
              payload: { plan_code: "DLX-2", tier: "DELUXE", storage_quota_mb: 5120, bandwidth_quota_mb: 10240, monthly_price_cents: 4999, included_mailboxes: 5, included_ssl: true, overage_rate_cents_per_gb: 200 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /registrar/accounts"
              payload: { email: "abuse@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: false, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { d1_id: $.data.id }
            - call: "GET /registrar/invoices"
