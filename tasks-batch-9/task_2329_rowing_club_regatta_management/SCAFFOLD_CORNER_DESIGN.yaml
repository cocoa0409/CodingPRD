              payload: { note: "second attempt" }
              as: ClubAdmin
          assert:
            - "the trigger call returns HTTP 409 with data.error_id == ERR_TRUEUP_ALREADY_APPLIED"
            - "DuesInvoice.${invoice_id}.variant_basis == TRUEUP, assessed_cents == 29600 and trueup_cents == -44400 from the first call only"
            - "DuesInvoice.${invoice_id}.status == ISSUED and paid_cents == 0"

