      - name: cycle_posture_beats_duplicate_enrollment
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair (state-posture, business_constraint) — a third distinct pair:
          re-enrolling an already-ENROLLED volunteer while the cycle is
          RECERTIFICATION must return ERR_CYCLE_NOT_OPEN, proving parent posture
          runs before the duplicate-enrollment constraint.
        test_recipe:
          setup:
            - "Cycle 2026 with volunteer TRAINEE holding an ENROLLED enrollment"
            - "Clock 2026-11-02; cycle moved OPEN -> RECERTIFICATION"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
