      - name: corner_calc_settlement_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.settlement_net_to_promoter.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_then_final_sponsor_holdback_and_refund_dropout"
          rationale: "Both variants are run over identical stored data in that §1.8 instance and every diverging field, including the sponsor holdback and the refund dropout, is asserted with pinned values."

      - name: corner_calc_readiness_variant_selection
        claim_type: Variant Selection
        grounds:
          - calculations.logistics_readiness_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / vehicle_readiness_pre_staging_projection_vs_post_staging_actuals"
          rationale: "That §1.8 instance pins which variant each endpoint selects (PRE_STAGING at creation, POST_STAGING from check-in onwards) and asserts readiness_variant at every step."

      - name: corner_calc_settlement_reconciliation_delta_to_the_season_ledger
        claim_type: Reconciliation
        grounds:
          - calculations.settlement_net_to_promoter.variants
          - state_machines.EventSettlement.PREPARED_to_APPROVED
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_then_final_sponsor_holdback_and_refund_dropout"
          rationale: "The PROVISIONAL -> FINAL switch and the resulting delta posted to Season.season_net_cents are asserted there; the zero-delta counterpart is covered positively by corner_calc_waterfall_funds_all_four_buckets_and_leaves_a_remainder."

      - name: corner_calc_ticket_order_rounding_order
        claim_type: Precision
        grounds:
          - calculations.ticket_order_amounts
        excluded_because:
          difficulty_instance: "combinatorial_formula / ticket_order_rounds_each_discount_line_before_summing"
          rationale: "The per-line ROUND_HALF_UP ordering of the group and pit-party bundle discounts, and the wrong sum-then-round total, are that instance's whole subject."

      - name: corner_calc_coop_credit_tier_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.venue_settlement_due
        excluded_because:
          difficulty_instance: "combinatorial_formula / coop_credit_rate_keyed_on_pre_credit_total_at_the_inclusive_boundary"
          rationale: "The inclusive 5000000 boundary and the pinned rate-selection order are asserted there with the wrong-order alternative spelled out."

      - name: corner_calc_run_order_interval_packing
        claim_type: Correct Result
        grounds:
