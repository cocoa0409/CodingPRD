          - state_machines.SurveyComponent.edit_status
          - state_machines.CohortMember.exclusion_status
          - state_machines.DataElementMapping.status
        distinguishing_aspect: |
          Every dimension starts on its §1.2 initial_state in the creating response: cycle OPEN,
          component DRAFT with edit_status NOT_RUN (not CLEARED — no prepare has run yet),
          member NONE, mapping PROPOSED.
        test_recipe:
          setup:
            - "Definition ENR_LEVEL (required false) exists; ReportingCycle IPEDS-2027 is CENSUS_LOCKED with one ACTIVE ENROLLMENT extract."
          setup_api_calls:
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD", "GRADUATE"], required: false, unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { def1: $.data.id }
          trigger:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
