            - "${visit_state} == MISSED"
            - "HOP 1 — ${credit_amount} == 62413 (density 65 -> 6.0 percent tier; 51200 -> 54272 -> 62413), ${credit_state} == ASSESSED, ${credit_actor} == SYSTEM, ${credit_source_visit} == ${visit_id}"
            - "HOP 2 — ${credit_accrued} == 62413, ${bs_after} == REBILL_REQUIRED, ${net_after} == 136784 (199197 + 0 - 62413)"
            - "HOP 3 — ${balance_after} == 62413"
            - "HOP 4 — ${hold_after} == true (62413 >= 60000)"
            - "${rebill_error} == ERR_ACCOUNT_BILLING_HOLD with HTTP 402 — hop 4 is what refuses the re-invoice"
            - "Route.${route_id}.density_realized_pct == 0 and Route.${route_id}.density_planned_pct is still 65 (the credit read the PRE-transition planned density, not the post-transition realized one)"
            - "ChargeEvent ${credit_id} is the only charge on the contract, so charge_debits_cents == 0"

