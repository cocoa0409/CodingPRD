            - "L3 — InLieuFee.${sub_fee_id}.surcharge_cents == 840000 (below the 5000000 cap, so the cap does not bind here)"
            - "L3 — InLieuFee.${sub_fee_id}.pre_discount_total_cents == 24840000 and discount_bps_applied == 150 and discount_cents == 372600"
            - "L3 — InLieuFee.${sub_fee_id}.assessed_amount_cents == 24467400 and due_date == 2026-09-15 and ordinance_id == ${ord_id}"
            - "L4 — Project.${p_id}.fee_covered_equivalents_bps == 10000"
            - "L4 — Project.${p_id}.compliance_posture == COMPLIANT_BY_FEE (it passed through DEFICIENT at L2 and must not stay there)"
            - "Project.${p_id}.total_obligation_bps is still 10000 — the cascade never rewrites the obligation itself"

