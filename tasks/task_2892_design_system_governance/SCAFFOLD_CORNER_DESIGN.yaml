              as_user_id: "${team_id}"
              captures: { state_submitted: $.data.state }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "jumping the queue" }
              as: EngineeringReviewer
              as_user_id: "eng-1"
              captures: { e_skip: $.data.error_id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "BLOCK", notes: "blocking at the wrong gate" }
