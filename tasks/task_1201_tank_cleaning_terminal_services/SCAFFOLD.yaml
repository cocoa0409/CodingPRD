  # --- CleaningJob ---
  - method: POST
    path: "/ops/cleaning-jobs"
    description: "Create a cleaning job in DRAFT; computes changeover class, provisional sludge estimate, flush volume"
    roles: [TerminalOperator]
    code: 201
    input: [terminal_id, tank_id, contractor_id, from_product_id, to_product_id, heel_volume_liters_sounding, base_service_fee_cents, "lines_included?"]
    output: CleaningJob
    side_effects:
      - "ERR_TANK_NOT_IN_SERVICE unless tank.status == IN_SERVICE"
      - "ERR_INVALID_REQUEST if terminal_id != tank.terminal_id"
      - "compute changeover_class, sludge_estimate_provisional_kg, flush_volume_liters (null when FORBIDDEN)"
  - method: GET
    path: "/ops/cleaning-jobs/{jobId}"
    description: "Get a cleaning job"
    roles: *all_roles
    code: 200
    input: []
    output: CleaningJob
    side_effects: []
  - method: GET
    path: "/ops/cleaning-jobs"
    description: "List cleaning jobs, filterable (paginated)"
    roles: *all_roles
    code: 200
    input: ["terminal_id?", "tank_id?", "contractor_id?", "from_product_id?", "to_product_id?", "window_id?", "status?", "limit?", "offset?"]
    output: CleaningJob[]
    side_effects: []
  - method: PATCH
    path: "/ops/cleaning-jobs/{jobId}"
    description: "Patch fee/lines flag while DRAFT (OCC on job version)"
    roles: [TerminalOperator]
    code: 200
    input: [expected_job_version, "base_service_fee_cents?", "lines_included?"]
    output: CleaningJob
    side_effects: ["increments CleaningJob.version by 1", "recompute flush_volume_liters when lines_included changes"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/schedule"
    description: "Schedule a job against a planned service window"
    roles: [TerminalOperator]
    code: 200
    input: [window_id]
    output: CleaningJob
    side_effects: ["status DRAFT -> SCHEDULED; window.job_id = job.id"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/take-out-of-service"
    description: "Take the tank out of service to begin cleaning"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> TANK_OOS; Tank.status -> OUT_OF_SERVICE; increments Tank.version by 1"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/record-heel-removal"
    description: "Record metered heel pump-out volume"
    roles: [ContractorSupervisor]
    code: 200
    input: [metered_liters]
    output: CleaningJob
    side_effects: ["status -> HEEL_REMOVED; recompute expected_solids_kg (FINAL_BASIS)"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/record-sludge-removal"
    description: "Record sludge removal completion and residual solids"
    roles: [ContractorSupervisor]
    code: 200
    input: [residual_sludge_kg]
    output: CleaningJob
    side_effects: ["status -> SLUDGE_REMOVED (from HEEL_REMOVED or REWORK_CLEANING); shipped_solids_kg recomputed"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/request-gas-free"
    description: "Request gas-free certification"
    roles: [ContractorSupervisor]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> GAS_FREE_PENDING"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/begin-entry"
    description: "Begin manned entry (requires ACTIVE permit with CLEAR atmosphere)"
    roles: [ContractorSupervisor]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> ENTRY_IN_PROGRESS"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/complete-entry"
    description: "Complete entry phase (all permits closed/voided)"
    roles: [ContractorSupervisor]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> ENTRY_COMPLETE"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/order-rework"
    description: "Order rework after accepted inspection (cyclic loop back)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> REWORK_CLEANING; VALID certs -> SUPERSEDED; permits in {REQUESTED, ISSUED, SUSPENDED} -> VOIDED"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/begin-flush"
    description: "Begin product-changeover flush"
    roles: [ContractorSupervisor]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> FLUSH_IN_PROGRESS"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/verify-flush"
    description: "Verify flush volume meets computed requirement"
    roles: [EHSOfficer]
    code: 200
    input: [actual_flush_liters]
    output: CleaningJob
    side_effects: ["status -> FLUSH_VERIFIED"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/request-rts"
    description: "Request return-to-service (mass balance gate; computes invoice)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> RTS_PENDING; recompute invoice_total_cents"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/return-to-service"
    description: "Return tank to service and recertify"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> RETURNED_TO_SERVICE; Tank IN_SERVICE with current_product_id = to_product_id; linked window -> COMPLETED"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/resume"
    description: "Resume a paused job back to paused_from"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status PAUSED -> paused_from"]
  - method: POST
    path: "/ops/cleaning-jobs/{jobId}/cancel"
    description: "Cancel a non-terminal job"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["status -> CANCELLED; permits {REQUESTED, ISSUED, SUSPENDED} -> VOIDED; tank -> IN_SERVICE if OOS; linked window -> CANCELLED (or unlinked if SCHEDULED)"]

