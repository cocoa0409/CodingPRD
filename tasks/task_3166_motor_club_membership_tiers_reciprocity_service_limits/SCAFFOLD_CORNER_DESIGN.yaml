              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["BATTERY"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 1 }
              as: ClubAdmin
              captures: { p1: $.data.id }
            - call: "POST /motor-club/providers/${p1}/part-stock"
              payload: { part_sku: "BAT-G24", part_kind: "BATTERY", quantity_on_hand: 3 }
              as: ClubAdmin
              captures: { stock1: $.data.id }
          trigger:
            - call: "POST /motor-club/part-stock/${stock1}/restock"
