          setup: ["Verified FL COMMERCIAL_PRIVATE project under FL rule (prelim_days 5, BUSINESS basis); ACTIVE BASE_CONTRACT span 2026-05-01..2026-05-20; two DRAFT notices to OWNER and GC"]
