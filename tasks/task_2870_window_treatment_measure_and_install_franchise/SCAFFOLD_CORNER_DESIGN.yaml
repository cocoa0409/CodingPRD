            - "the counter is a recount, not a tally of PATCH calls: the captured ${conf_after_one} == 1, ${conf_after_reconfig} == 1 and ${conf_after_two} == 2"
            - "the quote reads the CURRENT prices: the captured ${sub} == 17000 (12040 + 4960) and ${net} == 17000, with install_fee_cents 12500 and total_cents 29500"
            - "the captured ${cost} == 7140 - round_half_up(17000 x 0.42) is exactly 7140.0 - and the captured ${open_after_place} == 1"
            - "receiving takes the counters DOWN by recount: the captured ${open_after_receive} == 0 and ${expo_after_receive} == 0, with ${roy} == 935 (round_half_up(17000 x 0.055))"
