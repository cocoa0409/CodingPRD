          setup:
            - "A light RACING world with entries A and B ACCEPTED in CONFIRMED division A, panel P SEATED with chair Nils Brandt, jury_quorum_required 2."
            - "Race 1 (6.0 nm, scheduled 2026-08-05T14:00:00Z) started at 14:00; at clock 15:00:00Z entry A's FINISHED result stamped results_closed_utc 15:00:00Z."
