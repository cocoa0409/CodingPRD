              payload: { block_id: "${b2_id}", farming_plan_id: "${p2_id}", crew_id: "${cr3_id}", task_type: "PRUNING", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", planned_vines: 2000, planned_hours: 8.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { wo_exact_id: $.data.id, wo_exact_est: $.data.estimated_labor_cost }
            - call: "GET /farming-plans/${p2_id}"
              payload: {}
              as: Controller
              captures: { p2_committed: $.data.committed_cost, p2_remaining: $.data.remaining_budget, p2_posture: $.data.budget_posture }
            - call: "POST /work-orders"
              payload: { block_id: "${b2_id}", farming_plan_id: "${p2_id}", crew_id: "${cr3_id}", task_type: "SUCKERING", scheduled_start: "2026-08-07T06:00:00Z", scheduled_end: "2026-08-07T06:30:00Z", planned_vines: 100, planned_hours: 0.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
