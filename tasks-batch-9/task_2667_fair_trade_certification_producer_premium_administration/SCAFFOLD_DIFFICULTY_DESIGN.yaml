            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION", "INFRASTRUCTURE"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", is_organic: true, volume_kg: 30000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
