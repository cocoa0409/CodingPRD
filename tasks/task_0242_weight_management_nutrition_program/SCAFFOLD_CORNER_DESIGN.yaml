  - section: consistency_model
    instances:
      - name: activate_immediate_invoice_visible_same_flow
        claim_type: immediate
        grounds: [state_machines.Enrollment.PENDING_CLINICAL_to_ACTIVE, entities.Invoice]
        distinguishing_aspect: "The cycle-0 invoice produced by activate is immediately retrievable via GET /wm/invoices?enrollment_id right after the activate call (immediate consistency)."
        test_recipe:
          setup: ["Member with APPROVED intake on a COACHING plan."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c26@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
