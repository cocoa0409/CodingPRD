      - name: improvement_record_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ImprovementRecord.common_fields
          - endpoints."GET /floodplain/improvement-records/{recordId}"
          - complexity_profile.relationship_patterns.polymorphic
        distinguishing_aspect: |
          ImprovementRecord declares common_fields false, so the ledger row exposes id and
          created_at but no version and no updated_at, and §1.5 offers no PATCH or DELETE
          for the collection — corrections are made only by appending a REVERSAL row.
        test_recipe:
          setup:
            - "Canonical base fixture; one counted IMPROVEMENT record of 60000.00 on 2019-03-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
