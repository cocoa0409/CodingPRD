            - { call: "POST /eqip/payment-requests", payload: { contract_id: "${con}", practice_item_id: "${item}", documented_cost_cents: 350000, documentation_refs: ["r1"] }, as: Applicant, as_user_id: "${a1}", captures: { req: $.data.id, computed: $.data.computed_amount_cents } }
          assert:
            - "first attempt: err == ERR_ITEM_NOT_CERTIFIED (item INSTALLED)"
            - "after certify: same payload returns 201 with computed == 300000"

      - name: contract_complete_blocked_by_outstanding_advance
        grounds:
          - state_machines.Contract.OBLIGATED_to_COMPLETED
          - errors[ERR_ADVANCE_OUTSTANDING]
          - entities.AdvancePayment.fields.outstanding_cents
