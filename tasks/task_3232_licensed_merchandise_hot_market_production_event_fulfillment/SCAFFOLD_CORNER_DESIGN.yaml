            - "FulfillmentOrder.${fom_id}.realized_wholesale_cents == 100"
  # ===========================================================================
  - section: calculations
    instances:

      - name: hot_market_tier_boundary_sits_on_inclusive_25000
        claim_type: threshold_boundary
        grounds:
          - calculations.hot_market_capacity_commitment
          - constants.REGIONAL_DEMAND_UNITS
        distinguishing_aspect: "The regional tier is inclusive at exactly 25000 demand units, so 25000 adds the 50-unit residual while 24999 falls to LOCAL and adds 25 after multiplying by the 1.5 hour factor — a one-unit change flips the branch."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICN with an APPROVED JERSEY design, no run yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor N", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 500000 }
              as: PlatformAdmin
              captures: { licn_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licn_id}", team_code: "ATL", garment_sku: "JERSEY", design_name: "N Jersey" }
              as: DesignOps
              captures: { dsgn_id: $.data.id, dsgn_v: $.data.version }
            - call: "PUT /designs/${dsgn_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgn_v}" }
              as: LicensingOps
              as_user_id: "${licn_id}"
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${licn_id}", design_id: "${dsgn_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 25000, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T01:00:00Z" }
              as: ProductionPlanner
              captures: { pon_at_id: $.data.id, pon_at: $.data.capacity_commitment_units }
            - call: "POST /production-orders"
              payload: { licensor_id: "${licn_id}", design_id: "${dsgn_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 24999, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T01:00:00Z" }
              as: ProductionPlanner
              captures: { pon_below_id: $.data.id, pon_below: $.data.capacity_commitment_units }
          assert:
            - "ProductionOrder.${pon_at_id}.capacity_commitment_units == 12550"
            - "ProductionOrder.${pon_below_id}.capacity_commitment_units == 18750"
            - "the run at the boundary commits 6200 fewer units than the run one unit below it"

      - name: write_down_greater_charge_survives_lesser
        claim_type: correctness
        grounds:
          - calculations.demand_collapse_write_down
          - entities.ProductionOrder.fields.write_down_inventory_cents
        distinguishing_aspect: "A standard run with 100 destroyed units at 900 cents books 36000 and keeps that figure, because a smaller late charge is skipped rather than added."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICO, APPROVED TRACTOR design, run with a BASE layer of 200 printed, one order of 100 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor O", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lico_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lico_id}", team_code: "BOS", garment_sku: "TRACTOR", design_name: "O Tractor" }
              as: DesignOps
              captures: { dsgo_id: $.data.id, dsgo_v: $.data.version }
            - call: "PUT /designs/${dsgo_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgo_v}" }
              as: LicensingOps
              as_user_id: "${lico_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lico_id}", design_id: "${dsgo_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 20000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { poo_id: $.data.id, poo_v: $.data.version }
            - call: "POST /production-orders/${poo_id}/layers"
              payload: { expected_production_order_version: "${poo_v}", layers: [{ print_type: "BASE", quantity: 200 }] }
              as: ProductionPlanner
              captures: { layo_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${layo_id}/print"
              payload: { printed_qty: 200 }
              as: PrintOperator
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${poo_id}", channel: "VENUE_RETAIL", destination_code: "BOS_VENUE", quantity: 100 }
              as: FulfillmentCoordinator
              captures: { foo_id: $.data.id }
          trigger:
            - call: "POST /production-orders/${poo_id}/retire"
              payload: { retire_reason: "LOSING_OUTCOME", destroy_mode: "DESTROY" }
              as: ProductionPlanner
              captures: { poo_wd: $.data.write_down_inventory_cents }
            - call: "GET /production-orders/${poo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { poo_wd_after: $.data.write_down_inventory_cents }
          assert:
            - "ProductionOrder.${poo_id}.write_down_inventory_cents == 36000"
            - "ProductionOrder.${poo_id}.destroyed_units == 100 and donated_units == 0"
            - "ProductionOrder.${poo_id}.status == RETIRED_DESTROYED"
            - "ProductionOrder.${poo_id}.write_down_inventory_cents is unchanged at 36000 after the retirement settles"

      - name: writing_down_a_second_time_does_not_stack
        claim_type: reversal
        grounds:
          - calculations.demand_collapse_write_down
          - state_machines.ProductionOrder.transitions.PRINTING_to_RETIRED_DESTROYED
        distinguishing_aspect: "Retiring a run with a signed-inventory path does not recharge its write-down, because units already booked as damaged are not counted twice."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICP, APPROVED TRACTOR design, run with a BASE layer of 20 printed, 5 units lost to a print failure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor P", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licp_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licp_id}", team_code: "NYC", garment_sku: "TRACTOR", design_name: "P Tractor" }
              as: DesignOps
              captures: { dsgp_id: $.data.id, dsgp_v: $.data.version }
            - call: "PUT /designs/${dsgp_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgp_v}" }
              as: LicensingOps
              as_user_id: "${licp_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${licp_id}", design_id: "${dsgp_id}", team_code: "NYC", trigger_type: "STANDARD", expected_demand_qty: 20000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { pop_id: $.data.id, pop_v: $.data.version }
            - call: "POST /production-orders/${pop_id}/layers"
              payload: { expected_production_order_version: "${pop_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { layp_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${layp_id}/print"
              payload: { printed_qty: 20 }
              as: PrintOperator
          trigger:
            - call: "POST /print-layers/${layp_id}/print-failure"
              payload: { failed_qty: 5 }
              as: PrintOperator
            - call: "GET /production-orders/${pop_id}"
              payload: {}
              as: ProductionPlanner
              captures: { pop_base_units: $.data.base_units_printed }
            - call: "POST /production-orders/${pop_id}/retire"
              payload: { retire_reason: "DEMAND_COLLAPSE", destroy_mode: "DESTROY" }
              as: ProductionPlanner
              captures: { pop_wd: $.data.write_down_inventory_cents }
          assert:
            - "ProductionOrder.${pop_id}.base_units_printed == 15"
            - "ProductionOrder.${pop_id}.write_down_inventory_cents == 0 because no destroyed units remain after the failure"
            - "PrintLayer ${layp_id}.failed_qty == 5 and committed_qty == 15"

      - name: rush_or_standard_commitment_ignores_unheld_reservations
        claim_type: input_set_filtering
        grounds:
          - calculations.rush_delivery_commitment
          - entities.PrintReservation.fields.reservation_state
        distinguishing_aspect: "Only HELD reservations count toward the written rush_delivery_points, so a capacity window that exists but carries no reservation leaves the run's commitment at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICQ, APPROVED CAP design, run created with an outcome_at six hours away, and one capacity window registered with no reservation against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor Q", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licq_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licq_id}", team_code: "PHI", garment_sku: "CAP", design_name: "Q Cap" }
              as: DesignOps
              captures: { dsgq_id: $.data.id, dsgq_v: $.data.version }
            - call: "PUT /designs/${dsgq_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgq_v}" }
              as: LicensingOps
              as_user_id: "${licq_id}"
            - call: "POST /print-capacity"
              payload: { city_code: "PHI", print_type: "BASE", window_start: "2026-09-01T01:00:00Z", window_end: "2026-09-02T01:00:00Z", capacity_qty: 100, rush_sla_hours: 24 }
              as: FulfillmentCoordinator
              captures: { capq_id: $.data.id }
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${licq_id}", design_id: "${dsgq_id}", team_code: "PHI", trigger_type: "CHAMPIONSHIP_WIN", event_outcome: "WIN_FAVORED_TEAM", expected_demand_qty: 2000, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T06:00:00Z" }
              as: ProductionPlanner
              captures: { poq_id: $.data.id, poq_points: $.data.rush_delivery_points }
          assert:
            - "ProductionOrder.${poq_id}.rush_delivery_points == 0"
            - "PrintCapacity.${capq_id}.reserved_qty == 0 and available_qty == 100"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no role header is rejected at 401 before any body or existence check, so the auth layer precedes everything else."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /designs"
              payload: { licensor_id: "00000000-0000-0000-0000-000000000001", team_code: "ATL", garment_sku: "CAP", design_name: "Unreadable" }
              as: no_such_role
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "no Design is created"

      - name: enforcement_role_cannot_create_a_design
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - roles.EnforcementAgent
        distinguishing_aspect: "The EnforcementAgent role is refused on POST /designs with ERR_FORBIDDEN_ROLE, confirming the peer-role separation between brand protection and design authoring."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICR created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor R", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licr_id: $.data.id }
          trigger:
            - call: "POST /designs"
              payload: { licensor_id: "${licr_id}", team_code: "ATL", garment_sku: "CAP", design_name: "R Cap" }
              as: EnforcementAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: unknown_endpoint_returns_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/royalty-accruals/{accrual_id}
        distinguishing_aspect: "Reading an accrual id that does not exist returns ERR_NOT_FOUND, so the existence layer reports a domain error_id rather than a framework default."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /royalty-accruals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3"
              payload: {}
              as: AuditOnly
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

      - name: settlement_noop_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_SETTLEMENT_NOOP]
        distinguishing_aspect: "A zero-value settlement on a licensor with a healthy accrual is refused with ERR_SETTLEMENT_NOOP rather than booked as a no-op record."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICS with minimum_guarantee_cents 0 and one delivered ECOM order of 250 units, so accrued_royalty_cents is 84.38."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor S", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 0 }
              as: PlatformAdmin
              captures: { lics_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lics_id}", team_code: "ATL", garment_sku: "CAP", design_name: "S Cap" }
              as: DesignOps
              captures: { dsgs_id: $.data.id, dsgs_v: $.data.version }
            - call: "PUT /designs/${dsgs_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgs_v}" }
              as: LicensingOps
              as_user_id: "${lics_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lics_id}", design_id: "${dsgs_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { pos_id: $.data.id, pos_v: $.data.version }
            - call: "POST /production-orders/${pos_id}/layers"
              payload: { expected_production_order_version: "${pos_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { pos_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${pos_id}", channel: "ECOM", destination_code: "ECOM-ATL-5", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fos_id: $.data.id }
            - call: "POST /fulfillment-orders/${fos_id}/pick"
              payload: { expected_production_order_version: "${pos_v2}", quantity: 250, pick_remark: "pick-s" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fos_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fos_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
            - call: "GET /licensors/${lics_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lics_id}"
              captures: { lics_v: $.data.version, lics_acc: $.data.accrued_royalty_cents }
          trigger:
            - call: "POST /licensors/${lics_id}/minimum-guarantee/apply"
              payload: { expected_licensor_version: "${lics_v}", reserved_cents: 0, accept_guarantee_breach: true }
              as: LicensingOps
              as_user_id: "${lics_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /royalty-accruals?licensor_id=${lics_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lics_id}"
              captures: { accrual_first: "$.data[0].id" }
          assert:
            - "the response status is 422 and error_id == ERR_SETTLEMENT_NOOP"
            - "Licensor.${lics_id}.accrued_royalty_cents unchanged at 84.38 and guarantee_recovery_block_cents == 0"
            - "Licensor.${lics_id}.accrued_unsettled_cents == 84.38 and the accrual register still holds its row ${accrual_first}"

      - name: settlement_requires_a_positive_unsettled_accrual
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_NO_ACCRUED_ROYALTY]
        distinguishing_aspect: "A licensor with 0.00 unsettled royalty has its settlement refused with ERR_NO_ACCRUED_ROYALTY rather than ERR_GUARANTEE_FLOOR_BREACH, because the accrual check runs before the floor check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICT freshly created with no accrual."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor T", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lict_id: $.data.id, lict_v: $.data.version }
          trigger:
            - call: "POST /licensors/${lict_id}/minimum-guarantee/apply"
              payload: { expected_licensor_version: "${lict_v}", reserved_cents: 100, accept_guarantee_breach: true }
              as: LicensingOps
              as_user_id: "${lict_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_NO_ACCRUED_ROYALTY"
            - "the error_id is not ERR_GUARANTEE_FLOOR_BREACH"

      - name: settlement_below_floor_requires_the_breach_flag
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_GUARANTEE_FLOOR_BREACH]
        distinguishing_aspect: "With accept_guarantee_breach false the same settlement is refused and reports the shortfall, while flipping only that flag accepts the identical numbers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICU with minimum_guarantee_cents 2000 and 84.38 cents of accrued royalty from one delivered ECOM order of 250 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor U", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 2000 }
              as: PlatformAdmin
              captures: { licu_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licu_id}", team_code: "BOS", garment_sku: "CAP", design_name: "U Cap" }
              as: DesignOps
              captures: { dsgu_id: $.data.id, dsgu_v: $.data.version }
            - call: "PUT /designs/${dsgu_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgu_v}" }
              as: LicensingOps
              as_user_id: "${licu_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${licu_id}", design_id: "${dsgu_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { pou_id: $.data.id, pou_v: $.data.version }
            - call: "POST /production-orders/${pou_id}/layers"
              payload: { expected_production_order_version: "${pou_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { pou_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${pou_id}", channel: "ECOM", destination_code: "ECOM-BOS-6", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fou_id: $.data.id }
            - call: "POST /fulfillment-orders/${fou_id}/pick"
              payload: { expected_production_order_version: "${pou_v2}", quantity: 250, pick_remark: "pick-u" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fou_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fou_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
            - call: "GET /licensors/${licu_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${licu_id}"
              captures: { licu_v: $.data.version }
          trigger:
            - call: "POST /licensors/${licu_id}/minimum-guarantee/apply"
              payload: { expected_licensor_version: "${licu_v}", reserved_cents: 100, accept_guarantee_breach: false }
              as: LicensingOps
              as_user_id: "${licu_id}"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
            - call: "POST /licensors/${licu_id}/minimum-guarantee/apply"
              payload: { expected_licensor_version: "${licu_v}", reserved_cents: 100, accept_guarantee_breach: true }
              as: LicensingOps
              as_user_id: "${licu_id}"
              captures: { ms_u_id: $.data.id, ms_u_shortfall: $.data.guarantee_shortfall_cents }
          assert:
            - "the rejected first call leaves Licensor.version unchanged, so the same expected_licensor_version is still current for the retry"
            - "the first call is rejected with ERR_GUARANTEE_FLOOR_BREACH and the message reports a shortfall of 2000"
            - "the second call with accept_guarantee_breach true succeeds with status 201"
            - "MinimumGuaranteeSettlement.${ms_u_id}.guarantee_shortfall_cents == 2000, and accrued_royalty_cents settles to 0 with guarantee_recovery_block_cents == 2000"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: licensor_get_returns_full_ledger_for_audit
        claim_type: computed read
        grounds:
          - endpoints.GET_/licensors/{licensor_id}
          - entities.Licensor.fields.accrued_unsettled_cents
        distinguishing_aspect: "The licensor read exposes all three ledger quantities plus the version, so an auditor can reconcile unsettled royalty without calling any write endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICV created with a minimum guarantee and no accrual."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor V", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licv_id: $.data.id }
          trigger:
            - call: "GET /licensors/${licv_id}"
              payload: {}
              as: AuditOnly
              captures: { v_acc: $.data.accrued_royalty_cents, v_block: $.data.guarantee_recovery_block_cents, v_unsettled: $.data.accrued_unsettled_cents, v_version: $.data.version }
          assert:
            - "Licensor.${licv_id}.accrued_royalty_cents == 0 and guarantee_recovery_block_cents == 0"
            - "Licensor.${licv_id}.accrued_unsettled_cents == 0 and version == 1"
            - "the response carries minimum_guarantee_cents == 100000 and royalty_rate_pct == 0.1"

