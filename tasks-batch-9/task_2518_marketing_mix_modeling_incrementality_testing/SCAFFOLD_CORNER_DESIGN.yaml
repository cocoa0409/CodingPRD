      - name: seal_temporal_and_completeness_gates_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_DATA_WINDOW_NOT_ELAPSED (409) - validations priority 67, check current_utc >= window_end_date"
          - "errors ERR_DATA_WINDOW_INCOMPLETE (422) - validations priority 70, check sales_period_count >= MIN_SEALED_PERIOD_COUNT (4) and lag_completeness_pct == 100.00"
          - "state_machines SalesObservation create side_effects - DataWindow.lag_completeness_pct := round(100 * sales_period_count / expected_period_count, 2)"
        distinguishing_aspect: |
          Two independent seal preconditions fire in priority order on the SAME window: at 2026-08-10 the
          window has not elapsed (409 at priority 67) even though it is also incomplete, and only after the
          clock reaches the end date does the 422 completeness error at priority 70 become visible with 3
          of 4 periods and lag_completeness_pct 75.00. Adding the missing period, and no spend row at all,
          is enough to seal - completeness is a SALES-side counter.
          
        test_recipe:
          setup:
            - "Market US_CORE and window W1 [2026-08-03, 2026-08-31) WEEKLY, expected_period_count 4."
            - "Only the first three weekly sales rows are filed, so sales_period_count is 3, lag_completeness_pct is 75.00 and the window version is 4 (1 create + 3 sales)."
            - "No SpendObservation exists at all, which does not matter: lag_completeness_pct is derived from sales_period_count / expected_period_count."
            - "The clock is set forward to 2026-08-10T00:00:00Z, inside the window."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
