              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_l1_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_l1_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_l1_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_l1_id}"
              captures: { app_l1_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_l1_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_l1_id}"
            - call: "POST /dealer-board/license-applications/${app_l1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_l1_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-12-01", affected_dealer_id: "${dlr_l1_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_PERFORMANCE" }
              as: Manufacturer
