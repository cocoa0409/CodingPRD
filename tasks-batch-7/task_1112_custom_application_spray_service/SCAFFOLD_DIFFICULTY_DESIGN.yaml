            - "WO_C at 12:00 (padded [11:30,14:30) touches [07:30,11:30) half-open) succeeds: status == SCHEDULED"

  # ------------------------------------------------------------- rule 9 -----
  - rule_id: compensating_invariant
    instances:
      - name: rinsate_balance_returns_to_zero
        grounds:
          - calculations.rinsate_generation
          - entities.WorkOrder.fields.rinsate_balance_gal
          - errors[ERR_RINSATE_OVER_DISPOSAL]
        distinguishing_aspect: |
          Conserved quantity = rinsate gallons: completion generates +24.0 and
          compensating disposals of 10.0 (field) + 14.0 (containment) return
          rinsate_balance_gal to exactly 0; a further 0.1-gal disposal exceeds
          the zero balance and is rejected.
        test_recipe:
          setup:
            - "Base fixture; WO1 COMPLETED at 2026-05-10T10:30:00Z (100 acres, carrier 12 gpa, tank 400 gal -> 3 loads -> 24.0 gal rinsate)"
