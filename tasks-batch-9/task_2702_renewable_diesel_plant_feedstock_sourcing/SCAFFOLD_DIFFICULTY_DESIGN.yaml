            - "CreditBlock.${block_id}.provisional_credits_mtco2e == 547.171"
            - "CreditBlock.${block_id}.verified_ci_gco2e_per_mj == 41.25"
            - "CreditBlock.${block_id}.verified_credits_mtco2e == 536.228"
            - "CreditBlock.${block_id}.provisional_rin_credits == 0"
            - "CreditBlock.${block_id}.verified_rin_credits == 0"
            - "CreditBlock.${block_id}.verification_outcome == VERIFIED"
            - "CreditBlock.${block_id}.status == VERIFIED"
            - "PathwayRegistration.${pathway_id}.credits_outstanding_mtco2e == 536.228"
            - "PathwayRegistration.${pathway_id}.variance_strikes == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: pretreatment_fee_four_metric_worst_tier_with_waste_escalation
        grounds:
          - calculations.pretreatment_tier_and_fee
          - entities.QualityTest.fields.tier
          - entities.FeedstockLot.fields.pretreatment_fee_usd
          - state_machines.FeedstockLot.RECEIVED_to_PRETREAT_REQUIRED
        distinguishing_aspect: |
          Mode (a) — four independent inputs (ffa_pct, moisture_pct, insolubles_ppm, phosphorus_ppm)
          collapse through max() into a worst sub-tier, a conditional waste-feedstock escalation branch
          (TALLOW with phosphorus_ppm >= 10) can push that tier up by one, and the fee is then a linear
          term wrapped in max(FEE_FLOOR_USD, ...) and min(FEE_CAP_USD, ...): 300.000 MT of TALLOW at
          ffa 5.00 / moisture 0.60 / insolubles 400 / phosphorus 12 yields HEAVY and 17313.75 USD.
        test_recipe:
          setup:
            - "One PENDING supplier of TALLOW (no due-diligence verification is needed to lab-test a lot)."
            - "One RECEIVED 300.000 MT TALLOW lot at 780.00 USD/MT, never tested."
            - "Clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Midwest Tallow Co", country_code: "US", feedstock_types: ["TALLOW"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "TALLOW", mass_mt: 300.000, attested_ci_gco2e_per_mj: 41.00, purchase_price_usd_per_mt: 780.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
          trigger:
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 5.00, moisture_pct: 0.60, insolubles_ppm: 400, phosphorus_ppm: 12, sampled_at: "2026-08-01T06:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
              captures: { test_id: $.data.id }
          assert:
            - "QualityTest.${test_id}.ffa_tier_index == 2"
            - "QualityTest.${test_id}.moisture_tier_index == 1"
            - "QualityTest.${test_id}.insolubles_tier_index == 0"
            - "QualityTest.${test_id}.phosphorus_tier_index == 1"
            - "QualityTest.${test_id}.tier == HEAVY"
            - "QualityTest.${test_id}.disposition == PRETREAT"
            - "FeedstockLot.${lot_id}.pretreatment_tier == HEAVY"
            - "FeedstockLot.${lot_id}.pretreatment_fee_usd == 17313.75"
            - "FeedstockLot.${lot_id}.status == PRETREAT_REQUIRED"

      - name: feedstock_settlement_round_per_line_then_sum
        grounds:
          - calculations.feedstock_settlement_cost
          - entities.FeedstockAllocation.fields.line_cost_usd
          - entities.ProcessingRun.fields.feedstock_cost_usd
          - state_machines.ProcessingRun.COMPLETED_to_RECONCILED
        distinguishing_aspect: |
          Mode (b) — evaluation order is the whole answer: rounding each of the three CONSUMED lines to
          cents before summing yields feedstock_cost_usd 129660.99, while summing the unrounded products
          and rounding once yields 129661.00. The fixture masses and prices were chosen so the two orders
          differ by exactly one cent.
        test_recipe:
          setup:
            - "One VERIFIED UCO supplier and three ACCEPTED UCO lots: 40.500 MT at 905.55 USD/MT, 45.500 MT at 920.25 USD/MT, 50.500 MT at 925.35 USD/MT (all CI 32.50)."
            - "One five-day run [2026-09-01T00:00:00Z, 2026-09-06T00:00:00Z) on HTU-1 with target_saf_share_pct 0.00 carrying all three lots as allocations (136.500 MT reserved), hydrogen nominated at 900.0 kg/day, started on 2026-09-01 and completed on 2026-09-06 with measured_rd_mt 110.000."
            - "Clock at 2026-09-06T00:00:00Z when reconciliation is triggered."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-c" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "MASS_BALANCE_STATEMENT", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-mbs-2702-c" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 40.500, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 905.55, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_a: $.data.id, lot_a_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_a}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_a_v0}" }
              as: QualityAnalyst
            - call: "POST /feedstock-lots/${lot_a}/acceptances"
              payload: {}
