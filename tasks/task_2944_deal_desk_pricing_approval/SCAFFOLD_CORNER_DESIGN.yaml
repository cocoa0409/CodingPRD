      - name: approval_inside_the_surge_window_caps_quote_expiry_at_quarter_end
        claim_type: constants_applied
        grounds:
          - calculations.C5_service_levels_and_expiry
          - entities.DeskPolicy.fields.surge_window_days
          - entities.Quote.fields.expires_at
          - entities.Quote.fields.approved_at
        distinguishing_aspect: |
          C5 re-bases expires_at at approval and caps it at the quarter-end instant whenever approved_at
          falls inside the surge window: a quote created 2026-09-25T00:00:00Z carries the uncapped
          expires_at 2026-10-25T00:00:00.000Z while DRAFT, and approving it at that same instant — four
          days inside the 10-day window that ends at 2026-10-01T00:00:00Z — rewrites expires_at to
          exactly 2026-10-01T00:00:00.000Z instead of 2026-10-25T00:00:00.000Z.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; quote_validity_days is 30 and surge_window_days is 10, so the Q3 2026 surge window runs from 2026-09-21T00:00:00Z up to the quarter-end instant 2026-10-01T00:00:00Z."
            - "The logical clock set to 2026-09-25T00:00:00Z before the quote is created."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0 — final_blended_discount_pct 0.000000 and required_approval_level 0, so submit auto-approves it in the same request."
