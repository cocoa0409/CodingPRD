              captures: { i1_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i1_id}", product_type: "CANCELLATION", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { p3_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/payments"
              payload: { itinerary_id: "${i1_id}", protection_id: "${p3_id}", payment_kind: "PREMIUM", amount_cents: 825, capture: true }
              as: OpsAgent
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /fare/payments/${pay_id}/refunds"
              payload: { refund_cents: 200 }
              as: OpsAgent
            - call: "POST /fare/payments/${pay_id}/refunds"
