scenario: "1878. Snack Food Manufacturing & Line Changeover (regional snack manufacturer): recipe & seasoning application control, fryer/oven parameter monitoring & oil management, changeover & allergen cleaning validation, bag weight control & giveaway, freshness dating & DSD vs warehouse routing, promotional pack & display-ready case, co-manufacturing agreement, oil price & margin management"
domain_name: snack-food-line-changeover
api_prefix: /snack-mfg

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel   # ProductionRun execution x quality dims; Changeover/FryerOil/PromoWindow are cyclic; Shipment is branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; all FK links via body fields)
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Product display name; unique per tenant scope (single-tenant deployment: globally unique)"
      - name: process_type
        type: enum
        source: input
        description: "Thermal process this product requires"
        constraints: "one of {FRYER, OVEN}"
      - name: allergen_profile
        type: array
        source: input
        description: "Set of allergen tags present in the recipe; may be empty (plain product)"
        constraints: "each element one of {PEANUT, TREE_NUT, DAIRY, SOY, GLUTEN, SESAME, EGG}; duplicates rejected"
      - name: flavor_group
        type: enum
        source: input
        description: "Flavor family used for changeover matrix (dry-clean on flavor change without allergen change)"
        constraints: "one of {PLAIN, CHEESE, SPICY, SWEET}"
      - name: declared_net_weight_g
        type: number
        source: input
        description: "Label-declared net weight per bag in grams (1 decimal)"
        constraints: "> 0"
      - name: tne_g
        type: number
        source: input
        description: "Tolerable negative error per bag in grams; a bag is a reject iff bag_weight_g < declared_net_weight_g - 2*tne_g (strictly below; exactly at the limit is NOT a reject)"
        constraints: "> 0"
      - name: giveaway_target_pct
        type: number
        source: input
        description: "Planned average overfill percent used by the provisional giveaway variant"
        constraints: ">= 0"
      - name: giveaway_max_pct
        type: number
        source: input
        description: "Compliance ceiling for the final giveaway percent; breach at completion forces quality QHOLD when final_giveaway_pct > giveaway_max_pct (strictly greater; exactly equal passes)"
        constraints: ">= 0"
      - name: shelf_life_days
        type: integer
        source: input
        description: "Shelf life in whole days from run completion timestamp (completed_at counts as day 0)"
        constraints: ">= 1"
      - name: seasoning_target_pct
        type: number
        source: input
        description: "Target seasoning mass as percent of product mass; compliance band is +/- 0.5 pct points inclusive (|actual - target| > 0.5 forces QHOLD; exactly 0.5 passes)"
        constraints: ">= 0"
      - name: fry_target_temp_c
        type: number
        source: input
        description: "Target fryer temperature in C; required when process_type == FRYER, ignored (may be null) for OVEN"
        constraints: "required iff process_type == FRYER"
      - name: standard_oil_price_cents_per_gal
        type: integer
        source: input
        description: "Fallback oil price for standard costing when no priced oil movement exists before run start"
        constraints: ">= 0"
      - name: case_revenue_cents
        type: integer
        source: input
        description: "Net revenue per accepted case used by margin calculations"
        constraints: ">= 0"
      - name: min_margin_cents_per_case
        type: integer
        source: input
        description: "Fiscal floor: dispatch requires margin_actual_cents / accepted_cases >= this value unless a PlantManager overrides"
        constraints: ">= 0"
      - name: bags_per_case
        type: integer
        source: input
        description: "Bags per finished case"
        default: 12
        constraints: ">= 1"

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Line display name; unique"
      - name: line_type
        type: enum
        source: input
        description: "Thermal equipment installed on the line"
        constraints: "one of {FRYER, OVEN, BOTH}"
      - name: oil_capacity_gallons
        type: number
        source: input
        description: "Fryer oil sump capacity in gallons; the line's FryerOil is created with an initial charge of exactly this volume at tpm 0.5"
        constraints: "> 0"
      - name: cleaning_minutes_full_wash
        type: integer
        source: input
        description: "Schedule buffer (minutes) required between two runs on this line when the allergen matrix yields FULL_WASH"
        default: 120
        constraints: ">= 0"
      - name: cleaning_minutes_dry
        type: integer
        source: input
        description: "Schedule buffer (minutes) required when the allergen matrix yields DRY_CLEAN"
        default: 30
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Derived line posture, recomputed on every child mutation; precedence order: RUNNING if any ProductionRun on the line has execution_status == RUNNING; else CLEANING if any Changeover on the line has status in {REQUIRED, CLEANING, SWAB_PENDING}; else BLOCKED if the line's FryerOil.state in {QUALITY_HOLD, DRAINING}; else IDLE"
        constraints: "one of {IDLE, RUNNING, CLEANING, BLOCKED}"
      - name: current_allergen_profile
        type: array
        source: computed
        description: "Allergen set physically present on the line = allergen_profile of the product of the most recently COMPLETED run (by completed_at, tie-break created_at); empty array when no run has completed"
      - name: current_flavor_group
        type: enum
        source: computed
        description: "Flavor group of the most recently COMPLETED run's product; PLAIN when no run has completed"
        constraints: "one of {PLAIN, CHEESE, SPICY, SWEET}"

  - name: FryerOil
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: system
        description: "FK -> ProductionLine.id; 1:1, created automatically with the line"
      - name: initial_charge_gallons
        type: number
        source: system
        description: "Gallons charged at creation == ProductionLine.oil_capacity_gallons"
      - name: current_gallons
        type: number
        source: computed
        description: "Mass-balance conserved quantity: initial_charge_gallons + sum(TOP_OFF.gallons) + sum(FULL_REPLACE.gallons after a drain) - sum(DISCARD.gallons) - absorbed_gallons, where absorbed_gallons = round(total_lbs_since_replace * 1.5 / 1000, 3); note FULL_REPLACE follows a full drain (DISCARD of all gallons via begin-change sequence) so the discarded balance is excluded exactly once"
        constraints: ">= 0, recomputed on every OilMovement and every frying-accrual event"
      - name: tpm_pct
        type: number
        source: computed
        description: "Total polar materials percent; see tpm_degradation calculation; 0.5 at charge and after FULL_REPLACE"
      - name: state
        type: enum
        source: computed
        description: "Oil lifecycle state, see state machine FryerOil"
        constraints: "one of {ACTIVE, QUALITY_HOLD, DRAINING}"
      - name: total_lbs_since_replace
        type: number
        source: computed
        description: "Cumulative lbs fried since last FULL_REPLACE (or initial charge); drives TPM accrual and absorption"
      - name: last_oil_price_cents_per_gal
        type: integer
        source: computed
        description: "unit_price_cents_per_gal of the most recent priced movement (TOP_OFF or FULL_REPLACE) by recorded_at then created_at; null when none"

  - name: OilMovement
    parent: null
    common_fields: false
    fields:
      - name: fryer_oil_id
        type: string
        source: input
        description: "FK -> FryerOil.id; the oil record this movement applies to"
      - name: movement_type
        type: enum
        source: input
        description: "Kind of oil movement"
        constraints: "one of {TOP_OFF, DISCARD, FILTRATION, FULL_REPLACE}"
      - name: gallons
        type: number
        source: input
        description: "Gallons moved; must be > 0 for TOP_OFF/DISCARD, exactly 0 for FILTRATION, and exactly equal to line oil_capacity_gallons for FULL_REPLACE"
        constraints: ">= 0"
      - name: unit_price_cents_per_gal
        type: integer
        source: input
        description: "Spot price paid; required for TOP_OFF and FULL_REPLACE, forbidden for DISCARD and FILTRATION"
        constraints: ">= 0 when present"
      - name: tpm_after_pct
        type: number
        source: computed
        description: "tpm_pct of the FryerOil immediately after this movement is applied"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical clock timestamp at recording"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the recording LineOperator (audit)"

  - name: Changeover
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; line being switched"
      - name: to_product_id
        type: string
        source: input
        description: "FK -> Product.id; the next product to run"
      - name: from_allergen_profile
        type: array
        source: system
        description: "Snapshot of line.current_allergen_profile at changeover creation"
      - name: to_allergen_profile
        type: array
        source: system
        description: "Snapshot of to-product allergen_profile at changeover creation"
      - name: from_flavor_group
        type: enum
        source: system
        description: "Snapshot of line.current_flavor_group at changeover creation"
      - name: to_flavor_group
        type: enum
        source: system
        description: "Snapshot of to-product flavor_group at changeover creation"
      - name: required_level
        type: enum
        source: computed
        description: "Result of changeover_requirement matrix over the snapshots"
        constraints: "one of {NONE, DRY_CLEAN, FULL_WASH}"
      - name: status
        type: enum
        source: computed
        description: "See state machine Changeover"
        constraints: "one of {REQUIRED, CLEANING, SWAB_PENDING, VALIDATED, APPLIED, CANCELLED}"
      - name: cleaned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LineOperator who ran begin-cleaning; null until then (segregation-of-duties anchor)"
      - name: swab_result
        type: enum
        source: system
        description: "Latest swab outcome; reset to null whenever the changeover re-enters CLEANING"
        constraints: "one of {PASS, FAIL} or null"
      - name: swab_attempts
        type: integer
        source: system
        description: "Count of record-swab calls; increments on every swab including failures"
      - name: validated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the validating QualityTechnician; must differ from cleaned_by_user_id"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical clock at validation; a validated changeover is consumed by the first run start that uses it and goes stale 48h after validated_at"
      - name: consumed_by_run_id
        type: string
        source: system
        description: "Run that consumed this validation (set on the VALIDATED -> APPLIED transition); null while unused"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; line the run is scheduled on"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product to manufacture"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start (logical clock); half-open interval [scheduled_start, scheduled_end) for overlap checks"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end; must be strictly after scheduled_start"
      - name: lbs_planned
        type: number
        source: input
        description: "Planned product mass in lbs (standard costing basis)"
        constraints: "> 0"
      - name: cases_planned
        type: integer
        source: input
        description: "Planned case output; reservation basis while the run is not COMPLETED"
        constraints: ">= 1"
      - name: execution_status
        type: enum
        source: computed
        description: "Parallel dimension 1 of the run state machine"
        constraints: "one of {SCHEDULED, RUNNING, HELD, COMPLETED, CANCELLED}"
      - name: quality_status
        type: enum
        source: computed
        description: "Parallel dimension 2; evolves independently of execution_status"
        constraints: "one of {PENDING, QHOLD, PASSED, REJECTED}"
      - name: started_at
        type: datetime
        source: system
        description: "Logical clock at start; null until started"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical clock at completion; freshness dating day 0; null until completed"
      - name: lbs_produced
        type: number
        source: input
        description: "Actual mass produced; supplied at complete"
      - name: cases_produced
        type: integer
        source: input
        description: "Actual cases produced; supplied at complete"
      - name: rejected_cases
        type: integer
        source: input
        description: "Cases rejected at end-of-line; supplied at complete"
      - name: seasoning_actual_pct
        type: number
        source: input
        description: "Measured seasoning percent; supplied at complete; |actual - target| > 0.5 forces QHOLD"
      - name: accepted_cases
        type: integer
        source: computed
        description: "cases_produced - rejected_cases (0 until completed)"
      - name: cases_unrouted
        type: integer
        source: computed
        description: "Reservation ledger: (accepted_cases if COMPLETED else cases_planned) - sum(cases of Shipments with status != CANCELLED) - sum(cases_planned of DisplayCases with status in {PLANNED, BUILT}) for this run"
      - name: hold_placed_by_user_id
        type: string
        source: system
        description: "X-User-ID that placed the current hold; null when the hold was placed by the system (oil cascade) or no hold active; segregation-of-duties anchor for release-hold"
      - name: locked_oil_price_cents_per_gal
        type: integer
        source: system
        description: "Version-pinned cost basis: FryerOil.last_oil_price_cents_per_gal at run start, else Product.standard_oil_price_cents_per_gal; set at start, never changes afterwards"
      - name: margin_standard_cents
        type: integer
        source: computed
        description: "Locked-variant margin computed at start per margin_calc STANDARD variant; null until started"
      - name: margin_actual_cents
        type: integer
        source: computed
        description: "Actualized-variant margin computed at complete per margin_calc ACTUAL variant; null until completed"
      - name: giveaway_provisional_pct
        type: number
        source: computed
        description: "giveaway_calc PROVISIONAL variant over all recorded weight checks (rejects included, raw mean); null when zero checks"
      - name: giveaway_final_pct
        type: number
        source: computed
        description: "giveaway_calc FINAL variant over non-reject checks with per-check rounding (pinned order); null when zero non-reject checks"
      - name: reject_ratio
        type: number
        source: computed
        description: "count(is_reject checks) / count(all checks); null when zero checks"

  - name: WeightCheck
    parent: null
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; run being sampled (must be RUNNING)"
      - name: bag_weight_g
        type: number
        source: input
        description: "Measured bag weight in grams (2 decimals allowed)"
        constraints: "> 0"
      - name: lbs_fried_since_last_check
        type: number
        source: input
        description: "Production progress since the previous check (or since run start for the first check); drives TPM accrual on the line's FryerOil"
        constraints: ">= 0"
      - name: avg_fry_temp_c
        type: number
        source: input
        description: "Average fryer temperature observed for this interval; required when the run's product process_type == FRYER; temp_factor = 1.5 iff |avg_fry_temp_c - product.fry_target_temp_c| > 5.0 (strictly greater; exactly 5.0 yields factor 1.0)"
      - name: is_reject
        type: boolean
        source: computed
        description: "true iff bag_weight_g < declared_net_weight_g - 2*tne_g (strictly below; exactly at the limit is false)"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical clock at recording"
      - name: checked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityTechnician (audit)"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; source run (must be COMPLETED)"
      - name: cases
        type: integer
        source: input
        description: "Cases reserved from the run; must be <= run.cases_unrouted at creation"
        constraints: ">= 1"
      - name: requested_route
        type: enum
        source: input
        description: "Routing intent; AUTO resolves per freshness_window calculation"
        constraints: "one of {DSD, WAREHOUSE, AUTO}"
      - name: transit_days
        type: integer
        source: input
        description: "Whole days in transit to warehouse; used by the WAREHOUSE freshness variant"
        default: 2
        constraints: ">= 0"
      - name: planned_route
        type: enum
        source: computed
        description: "Resolved route after plan; null while DRAFT"
        constraints: "one of {DSD, WAREHOUSE} or null"
      - name: status
        type: enum
        source: computed
        description: "See state machine Shipment (branching fork through DSD_PLANNED / WAREHOUSE_PLANNED)"
        constraints: "one of {DRAFT, DSD_PLANNED, WAREHOUSE_PLANNED, DISPATCHED, CANCELLED}"
      - name: freshness_days_at_plan
        type: integer
        source: computed
        description: "shelf_life_days - floor((plan_time - run.completed_at)/86400); null until planned"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical clock at dispatch; null until dispatched"

  - name: PromoWindow
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; promoted product"
      - name: quota_total_cases
        type: integer
        source: input
        description: "Total display-ready cases the campaign may build"
        constraints: ">= 1"
      - name: window_start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD, logical clock) builds are allowed; CLOSED interval [window_start_date, window_end_date] inclusive on both ends"
      - name: window_end_date
        type: string
        source: input
        description: "Last calendar date builds are allowed; must be >= window_start_date"
      - name: case_size_bags
        type: integer
        source: input
        description: "Bags per display-ready case"
        default: 12
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "See state machine PromoWindow (ACTIVE <-> EXHAUSTED cycle)"
        constraints: "one of {DRAFT, ACTIVE, EXHAUSTED, CLOSED}"
      - name: quota_consumed_cases
        type: integer
        source: computed
        description: "Sum of cases_planned over DisplayCases that reached BUILT (monotone; never decremented)"
      - name: quota_released_cases
        type: integer
        source: computed
        description: "Sum of cases_planned over DisplayCases cancelled from BUILT (compensating counter)"
      - name: quota_remaining_cases
        type: integer
        source: computed
        description: "quota_total_cases - quota_consumed_cases + quota_released_cases; conserved-quantity invariant: quota_total_cases == quota_remaining_cases + quota_consumed_cases - quota_released_cases at all times"

  - name: DisplayCase
    parent: null
    common_fields: true
    fields:
      - name: promo_window_id
        type: string
        source: input
        description: "FK -> PromoWindow.id; campaign this build draws quota from"
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; source run reserving the cases"
      - name: cases_planned
        type: integer
        source: input
        description: "Cases to assemble; reserves against run.cases_unrouted at creation and consumes window quota at build"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "See state machine DisplayCase"
        constraints: "one of {PLANNED, BUILT, CANCELLED}"
      - name: cancelled_reason
        type: enum
        source: system
        description: "Why a CANCELLED case was cancelled: OIL_HOLD (cascade from run hold), QUOTA_EXHAUSTED (cascade from window exhaustion), OVER_RESERVED (cascade at run completion), RUN_CANCELLED, RUN_REJECTED, MANUAL"
        constraints: "one of {OIL_HOLD, QUOTA_EXHAUSTED, OVER_RESERVED, RUN_CANCELLED, RUN_REJECTED, MANUAL} or null"

  - name: CoManufacturer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Partner organization name; unique"
      - name: active
        type: boolean
        source: input
        description: "Whether the partner may activate agreements"
        default: true

  - name: CoManAgreement
    parent: null
    common_fields: true
    fields:
      - name: co_manufacturer_id
        type: string
        source: input
        description: "FK -> CoManufacturer.id; owning partner; CoManufacturer-role callers must present X-User-ID equal to this value to read or book under the agreement"
      - name: weekly_capacity_lbs
        type: number
        source: input
        description: "Aggregate weekly capacity; sum of reserved_lbs over slots in the same ISO week with status in {BOOKED, CONFIRMED} must be <= weekly_capacity_lbs (exactly equal is allowed)"
        constraints: "> 0"
      - name: rate_per_lb_cents
        type: integer
        source: input
        description: "Tolling rate per reserved lb"
        constraints: ">= 0"
      - name: budget_cents
        type: integer
        source: input
        description: "Fiscal ceiling: sum over all non-terminal slots (BOOKED/CONFIRMED) of reserved_lbs * rate_per_lb_cents must be <= budget_cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "See state machine CoManAgreement (ACTIVE <-> SUSPENDED cycle)"
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, TERMINATED}"

  - name: CoManSlot
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> CoManAgreement.id; agreement the capacity is booked under"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product to toll"
      - name: week_start_date
        type: string
        source: input
        description: "Monday (YYYY-MM-DD) of the ISO production week the reservation occupies"
      - name: reserved_lbs
        type: number
        source: input
        description: "Reserved capacity in lbs"
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "See state machine CoManSlot"
        constraints: "one of {BOOKED, CONFIRMED, CONSUMED, RELEASED}"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Changeover
    initial_state: REQUIRED
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: REQUIRED
        to: CLEANING
        trigger: "POST /snack-mfg/changeovers/{id}/begin-cleaning"
        actor: LineOperator
        preconditions:
          - "changeover.status == REQUIRED"
          - "required_level != NONE (a NONE changeover never requires cleaning; see note)"
        side_effects:
          - "cleaned_by_user_id := X-User-ID"
          - "swab_result := null"
          - "line posture recompute (REQUIRED/CLEANING/SWAB_PENDING -> CLEANING posture)"
          - "increments Changeover.version by 1"
        note: "Changeovers with required_level == NONE are auto-created only via manual POST /changeovers; they transition REQUIRED -> APPLIED implicitly without cleaning when a run start references them (no validation needed)."
      - from: CLEANING
        to: SWAB_PENDING
        trigger: "POST /snack-mfg/changeovers/{id}/record-swab with result PASS"
        actor: QualityTechnician
        preconditions:
          - "changeover.status == CLEANING"
          - "payload result == PASS"
        side_effects:
          - "swab_result := PASS"
          - "swab_attempts += 1"
          - "increments Changeover.version by 1"
      - from: CLEANING
        to: CLEANING
        trigger: "POST /snack-mfg/changeovers/{id}/record-swab with result FAIL"
        actor: QualityTechnician
        preconditions:
          - "changeover.status == CLEANING"
          - "payload result == FAIL"
        side_effects:
          - "swab_result := FAIL"
          - "swab_attempts += 1"
          - "swab_result := null (reset for the next cleaning cycle)"
          - "increments Changeover.version by 1"
        note: "Failed swab loops the machine back into CLEANING; the line stays in CLEANING posture, continuing to gate run starts."
      - from: SWAB_PENDING
        to: VALIDATED
        trigger: "POST /snack-mfg/changeovers/{id}/validate"
        actor: QualityTechnician
        preconditions:
          - "changeover.status == SWAB_PENDING"
          - "swab_result == PASS"
          - "X-User-ID != cleaned_by_user_id (segregation of duties: the cleaner cannot validate own work -> ERR_SOD_VIOLATION)"
        side_effects:
          - "validated_by_user_id := X-User-ID"
          - "validated_at := logical clock now"
          - "line posture recompute (no more open changeover -> may leave CLEANING posture)"
          - "increments Changeover.version by 1"
      - from: VALIDATED
        to: APPLIED
        trigger: "system: consumed by the first POST /snack-mfg/production-runs/{id}/start whose run satisfies this changeover (line_id matches, run.product_id == to_product_id, validated_at within 48h)"
        actor: system
        preconditions:
          - "a run start passes its changeover gate using this changeover"
        side_effects:
          - "consumed_by_run_id := the started run's id"
          - "increments Changeover.version by 1"
      - from: REQUIRED
        to: CANCELLED
        trigger: "system: superseded — a newer Changeover is created on the same line whose to_product_id differs, OR the triggering schedule context is cancelled"
        actor: system
        preconditions:
          - "another Changeover on the same line is created while this one is still REQUIRED"
        side_effects:
          - "line posture recompute"
          - "increments Changeover.version by 1"

  - entity: FryerOil
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: QUALITY_HOLD
        trigger: "system: tpm_pct recomputed to >= 27.0 (inclusive) after a frying-accrual event (weight check or run completion) or an oil movement"
        actor: system
        preconditions:
          - "tpm_pct >= 27.0 after recompute"
        side_effects:
          - "the RUNNING ProductionRun on the same line (if any) transitions RUNNING -> HELD with hold_placed_by_user_id := null (system hold)"
          - "that run's HELD transition cascades: every DisplayCase with run_id == run.id and status == PLANNED transitions to CANCELLED with cancelled_reason := OIL_HOLD (releasing its case reservation)"
          - "line posture recompute (BLOCKED once no run is RUNNING)"
          - "increments FryerOil.version by 1"
      - from: QUALITY_HOLD
        to: ACTIVE
        trigger: "system: tpm_pct recomputed to < 27.0 after a FILTRATION movement (tpm * 0.6) or FULL_REPLACE (tpm := 0.5)"
        actor: system
        preconditions:
          - "tpm_pct < 27.0 after recompute"
        side_effects:
          - "line posture recompute"
          - "increments FryerOil.version by 1"
        note: "Releasing the HELD run is NOT automatic: a QualityTechnician must still call release-hold."
      - from: ACTIVE
        to: DRAINING
        trigger: "POST /snack-mfg/fryer-oils/{id}/begin-change, or a DISCARD movement whose gallons == current_gallons (full drain)"
        actor: LineOperator
        preconditions:
          - "fryer_oil.state in {ACTIVE, QUALITY_HOLD}"
          - "no ProductionRun on the line has execution_status == RUNNING (cannot drain under an active run -> ERR_INVALID_STATE)"
        side_effects:
          - "line posture recompute (BLOCKED)"
          - "increments FryerOil.version by 1"
      - from: DRAINING
        to: ACTIVE
        trigger: "system: a FULL_REPLACE OilMovement is recorded (gallons == oil_capacity_gallons)"
        actor: system
        preconditions:
          - "fryer_oil.state == DRAINING"
          - "movement.gallons == line.oil_capacity_gallons (ERR_VALIDATION otherwise)"
        side_effects:
          - "tpm_pct := 0.5"
          - "total_lbs_since_replace := 0"
          - "current_gallons := oil_capacity_gallons"
          - "last_oil_price_cents_per_gal := movement.unit_price_cents_per_gal"
          - "line posture recompute"
          - "increments FryerOil.version by 1"

  - entity: ProductionRun
    initial_state: SCHEDULED (execution_status) / PENDING (quality_status)
    terminal_states: [COMPLETED, CANCELLED]  # terminal on the execution dimension; quality PASSED/REJECTED are terminal on the quality dimension
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /snack-mfg/production-runs/{id}/start"
        actor: LineOperator
        preconditions:
          - "execution_status == SCHEDULED (else ERR_INVALID_STATE)"
          - "no sibling run on the same line has execution_status == RUNNING (state gate, else ERR_INVALID_STATE)"
          - "allergen safety gate: changeover_requirement(line.current profile -> run.product) == NONE, OR there exists a Changeover on the line with to_product_id == run.product_id, status == VALIDATED, consumed_by_run_id == null, and validated_at within 48h of now (no such changeover -> ERR_ALLERGEN_CHANGEOVER_REQUIRED; one exists but validated_at is over 48h old -> ERR_CLEANING_VALIDATION_STALE)"
          - "oil safety gate: FryerOil.state == ACTIVE (else ERR_OIL_QUALITY_HOLD)"
          - "logical clock now >= scheduled_start (else ERR_START_BEFORE_WINDOW)"
        side_effects:
          - "started_at := now"
          - "the satisfying Changeover (if any) transitions VALIDATED -> APPLIED with consumed_by_run_id := this run"
          - "locked_oil_price_cents_per_gal := FryerOil.last_oil_price_cents_per_gal, else Product.standard_oil_price_cents_per_gal when null"
          - "margin_standard_cents computed per margin_calc STANDARD variant"
          - "line posture recompute (RUNNING)"
          - "increments ProductionRun.version by 1"
      - from: RUNNING
        to: HELD
        trigger: "POST /snack-mfg/production-runs/{id}/place-hold, or system cascade from FryerOil ACTIVE -> QUALITY_HOLD"
        actor: LineOperator | system
        preconditions:
          - "execution_status == RUNNING"
        side_effects:
          - "hold_placed_by_user_id := X-User-ID (or null when system-placed)"
          - "every DisplayCase with run_id == run.id and status == PLANNED transitions to CANCELLED with cancelled_reason := OIL_HOLD (only when the hold is the oil cascade) — reservation released"
          - "line posture recompute"
          - "increments ProductionRun.version by 1"
      - from: HELD
        to: RUNNING
        trigger: "POST /snack-mfg/production-runs/{id}/release-hold"
        actor: QualityTechnician
        preconditions:
          - "execution_status == HELD"
          - "FryerOil.state == ACTIVE (else ERR_OIL_QUALITY_HOLD)"
          - "if hold_placed_by_user_id is not null then X-User-ID != hold_placed_by_user_id (segregation of duties -> ERR_SOD_VIOLATION)"
        side_effects:
          - "hold_placed_by_user_id := null"
          - "line posture recompute (RUNNING)"
          - "increments ProductionRun.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /snack-mfg/production-runs/{id}/complete"
        actor: LineOperator
        preconditions:
          - "execution_status == RUNNING"
          - "at least one WeightCheck recorded for the run (else ERR_NO_WEIGHT_CHECKS)"
        side_effects:
          - "completed_at := now; accepted_cases := cases_produced - rejected_cases"
          - "residual frying accrual: lbs_produced - sum(WeightCheck.lbs_fried_since_last_check) is applied to FryerOil TPM at temp factor 1.0 (no temperature sample exists for the residual interval); may trigger FryerOil ACTIVE -> QUALITY_HOLD (its run-hold cascade is a no-op because this run is already COMPLETED)"
          - "giveaway_provisional_pct and giveaway_final_pct computed per giveaway_calc"
          - "compliance evaluation: quality_status PENDING -> QHOLD iff (reject_ratio > 0.025) OR (mean of all checks' bag_weight_g < declared_net_weight_g) OR (giveaway_final_pct > giveaway_max_pct) OR (|seasoning_actual_pct - seasoning_target_pct| > 0.5); otherwise quality_status stays PENDING awaiting disposition"
          - "margin_actual_cents computed per margin_calc ACTUAL variant"
          - "line.current_allergen_profile := product.allergen_profile; line.current_flavor_group := product.flavor_group; increments ProductionLine.version by 1"
          - "over-reservation cascade: while cases_unrouted < 0, the newest still-PLANNED DisplayCase (created_at DESC, tie-break none needed as timestamps are unique per request) with run_id == run.id transitions to CANCELLED with cancelled_reason := OVER_RESERVED until cases_unrouted >= 0 or no PLANNED cases remain"
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /snack-mfg/production-runs/{id}/cancel"
        actor: PlantManager
        preconditions:
          - "execution_status in {SCHEDULED, HELD}"
        side_effects:
          - "every DisplayCase with run_id == run.id and status == PLANNED transitions to CANCELLED with cancelled_reason := RUN_CANCELLED"
          - "REQUIRED Changeovers on the line whose to_product_id == run.product_id transition to CANCELLED (superseded)"
          - "line posture recompute"
          - "increments ProductionRun.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /snack-mfg/production-runs/{id}/cancel"
        actor: PlantManager
        preconditions:
          - "execution_status in {SCHEDULED, HELD}"
        side_effects:
          - "same side effects as SCHEDULED -> CANCELLED"
          - "increments ProductionRun.version by 1"
      - from: COMPLETED   # quality dimension transition; execution_status unchanged
        to: COMPLETED
        trigger: "POST /snack-mfg/production-runs/{id}/quality-disposition"
        actor: QualityTechnician
        preconditions:
          - "execution_status == COMPLETED"
          - "quality_status in {PENDING, QHOLD}"
          - "payload disposition in {PASS, REJECT}"
        side_effects:
          - "quality_status := PASSED when disposition == PASS else REJECTED"
          - "when REJECTED: every Shipment with run_id == run.id and status in {DRAFT, DSD_PLANNED, WAREHOUSE_PLANNED} transitions to CANCELLED (reservation released), and every DisplayCase with run_id == run.id and status == PLANNED transitions to CANCELLED with cancelled_reason := RUN_REJECTED"
          - "increments ProductionRun.version by 1"
        note: "quality_status terminal states PASSED/REJECTED: no further disposition calls succeed (ERR_ALREADY_TERMINAL)."

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DSD_PLANNED
        trigger: "POST /snack-mfg/shipments/{id}/plan resolving to DSD"
        actor: RoutePlanner
        preconditions:
          - "status == DRAFT"
          - "run.quality_status == PASSED (else ERR_RUN_NOT_PASSED)"
          - "freshness_window DSD eligibility holds: freshness_days_at_plan >= 4 (inclusive; exactly 4 is eligible)"
        side_effects:
          - "planned_route := DSD; freshness_days_at_plan computed; status := DSD_PLANNED"
          - "increments Shipment.version by 1"
      - from: DRAFT
        to: WAREHOUSE_PLANNED
        trigger: "POST /snack-mfg/shipments/{id}/plan resolving to WAREHOUSE"
        actor: RoutePlanner
        preconditions:
          - "status == DRAFT"
          - "run.quality_status == PASSED"
          - "freshness_window WAREHOUSE eligibility holds: freshness_days_at_plan - transit_days > 10 (strictly greater; exactly 10 is ineligible -> ERR_ROUTE_INELIGIBLE)"
        side_effects:
          - "planned_route := WAREHOUSE; freshness_days_at_plan computed; status := WAREHOUSE_PLANNED"
          - "increments Shipment.version by 1"
      - from: DSD_PLANNED
        to: DRAFT
        trigger: "POST /snack-mfg/shipments/{id}/replan"
        actor: RoutePlanner
        preconditions:
          - "status in {DSD_PLANNED, WAREHOUSE_PLANNED}"
        side_effects:
          - "planned_route := null; freshness_days_at_plan := null"
          - "increments Shipment.version by 1"
      - from: WAREHOUSE_PLANNED
        to: DRAFT
        trigger: "POST /snack-mfg/shipments/{id}/replan"
        actor: RoutePlanner
        preconditions:
          - "status in {DSD_PLANNED, WAREHOUSE_PLANNED}"
        side_effects:
          - "planned_route := null; freshness_days_at_plan := null"
          - "increments Shipment.version by 1"
      - from: DSD_PLANNED
        to: DISPATCHED
        trigger: "POST /snack-mfg/shipments/{id}/dispatch"
        actor: RoutePlanner | PlantManager
        preconditions:
          - "status == DSD_PLANNED"
          - "run.quality_status == PASSED (re-checked at dispatch)"
          - "freshness re-check at dispatch: shelf_life_days - floor((now - run.completed_at)/86400) >= 4 (else ERR_FRESHNESS_INSUFFICIENT)"
          - "margin floor: round(margin_actual_cents / accepted_cases, 0) >= product.min_margin_cents_per_case, unless caller role == PlantManager AND payload override_margin_floor == true (else ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "dispatched_at := now"
          - "increments Shipment.version by 1"
      - from: WAREHOUSE_PLANNED
        to: DISPATCHED
        trigger: "POST /snack-mfg/shipments/{id}/dispatch"
        actor: RoutePlanner | PlantManager
        preconditions:
          - "status == WAREHOUSE_PLANNED"
          - "run.quality_status == PASSED"
          - "freshness re-check: shelf_life_days - floor((now - run.completed_at)/86400) - transit_days > 10"
          - "margin floor as above"
        side_effects:
          - "dispatched_at := now"
          - "increments Shipment.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /snack-mfg/shipments/{id}/cancel, or system cascade from run quality REJECTED"
        actor: RoutePlanner | system
        preconditions:
          - "status in {DRAFT, DSD_PLANNED, WAREHOUSE_PLANNED}"
        side_effects:
          - "case reservation released (run.cases_unrouted increases by shipment.cases)"
          - "increments Shipment.version by 1"
      - from: DSD_PLANNED
        to: CANCELLED
        trigger: "POST /snack-mfg/shipments/{id}/cancel, or system cascade from run quality REJECTED"
        actor: RoutePlanner | system
        preconditions:
          - "status in {DRAFT, DSD_PLANNED, WAREHOUSE_PLANNED}"
        side_effects:
          - "case reservation released"
          - "increments Shipment.version by 1"
      - from: WAREHOUSE_PLANNED
        to: CANCELLED
        trigger: "POST /snack-mfg/shipments/{id}/cancel, or system cascade from run quality REJECTED"
        actor: RoutePlanner | system
        preconditions:
          - "status in {DRAFT, DSD_PLANNED, WAREHOUSE_PLANNED}"
        side_effects:
          - "case reservation released"
          - "increments Shipment.version by 1"

  - entity: PromoWindow
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /snack-mfg/promo-windows/{id}/activate"
        actor: PlantManager
        preconditions:
          - "status == DRAFT"
          - "no other PromoWindow with the same product_id and status == ACTIVE has a CLOSED-interval overlap: [window_start_date, window_end_date] intersected with the candidate's interval is non-empty (both ends inclusive; sharing a boundary date IS an overlap -> ERR_PROMO_WINDOW_OVERLAP)"
        side_effects:
          - "increments PromoWindow.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: quota_remaining_cases recomputes to exactly 0 after a DisplayCase build"
        actor: system
        preconditions:
          - "quota_remaining_cases == 0"
        side_effects:
          - "every DisplayCase with promo_window_id == window.id and status == PLANNED transitions to CANCELLED with cancelled_reason := QUOTA_EXHAUSTED (their case reservations release back to their runs)"
          - "increments PromoWindow.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: quota_remaining_cases recomputes to > 0 after a DisplayCase cancelled from BUILT (quota release)"
        actor: system
        preconditions:
          - "quota_remaining_cases > 0"
        side_effects:
          - "increments PromoWindow.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /snack-mfg/promo-windows/{id}/close"
        actor: PlantManager
        preconditions:
          - "status in {ACTIVE, EXHAUSTED}"
        side_effects:
          - "every DisplayCase with promo_window_id == window.id and status == PLANNED transitions to CANCELLED with cancelled_reason := MANUAL (window closed)"
          - "increments PromoWindow.version by 1"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /snack-mfg/promo-windows/{id}/close"
        actor: PlantManager
        preconditions:
          - "status in {ACTIVE, EXHAUSTED}"
        side_effects:
          - "same as ACTIVE -> CLOSED"
          - "increments PromoWindow.version by 1"

  - entity: DisplayCase
    initial_state: PLANNED
    terminal_states: [BUILT, CANCELLED]
    transitions:
      - from: PLANNED
        to: BUILT
        trigger: "POST /snack-mfg/display-cases/{id}/build"
        actor: LineOperator
        preconditions:
          - "status == PLANNED"
          - "promo_window.status == ACTIVE (EXHAUSTED windows cannot build -> ERR_INVALID_STATE)"
          - "logical clock date within [window_start_date, window_end_date] inclusive (else ERR_OUTSIDE_PROMO_WINDOW)"
          - "cases_planned <= promo_window.quota_remaining_cases (else ERR_PROMO_QUOTA_EXHAUSTED)"
        side_effects:
          - "promo_window.quota_consumed_cases += cases_planned; quota_remaining_cases recomputed"
          - "when quota_remaining_cases reaches exactly 0: PromoWindow ACTIVE -> EXHAUSTED cascade (which itself cancels remaining PLANNED DisplayCases with cancelled_reason := QUOTA_EXHAUSTED)"
          - "increments DisplayCase.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /snack-mfg/display-cases/{id}/cancel, or system cascades (OIL_HOLD / QUOTA_EXHAUSTED / OVER_RESERVED / RUN_CANCELLED / RUN_REJECTED)"
        actor: PlantManager | system
        preconditions:
          - "status in {PLANNED, BUILT}"
        side_effects:
          - "case reservation released back to run.cases_unrouted"
          - "no quota effect (PLANNED never consumed quota)"
          - "increments DisplayCase.version by 1"
      - from: BUILT
        to: CANCELLED
        trigger: "POST /snack-mfg/display-cases/{id}/cancel"
        actor: PlantManager
        preconditions:
          - "status in {PLANNED, BUILT}"
        side_effects:
          - "promo_window.quota_released_cases += cases_planned; quota_remaining_cases recomputed"
          - "when the window was EXHAUSTED and quota_remaining_cases becomes > 0: PromoWindow EXHAUSTED -> ACTIVE cascade"
          - "case reservation released back to run.cases_unrouted"
          - "increments DisplayCase.version by 1"

  - entity: CoManAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /snack-mfg/co-man-agreements/{id}/activate"
        actor: PlantManager
        preconditions:
          - "status == DRAFT"
          - "co_manufacturer.active == true (else ERR_INVALID_STATE)"
        side_effects:
          - "increments CoManAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /snack-mfg/co-man-agreements/{id}/suspend"
        actor: PlantManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increments CoManAgreement.version by 1"
        note: "Suspension does NOT release booked slots; it blocks confirm and new bookings (ERR_AGREEMENT_NOT_ACTIVE)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /snack-mfg/co-man-agreements/{id}/resume"
        actor: PlantManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "increments CoManAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /snack-mfg/co-man-agreements/{id}/terminate"
        actor: PlantManager
        preconditions:
          - "status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "every CoManSlot with agreement_id == agreement.id and status in {BOOKED, CONFIRMED} transitions to RELEASED (capacity and budget freed)"
          - "increments CoManAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /snack-mfg/co-man-agreements/{id}/terminate"
        actor: PlantManager
        preconditions:
          - "status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "same slot-release cascade as ACTIVE -> TERMINATED"
          - "increments CoManAgreement.version by 1"

  - entity: CoManSlot
    initial_state: BOOKED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /snack-mfg/co-man-slots/{id}/confirm"
        actor: CoManufacturer
        preconditions:
          - "status == BOOKED"
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "ownership: agreement.co_manufacturer_id == X-User-ID (else ERR_FORBIDDEN)"
        side_effects:
          - "increments CoManSlot.version by 1"
      - from: CONFIRMED
        to: CONSUMED
        trigger: "POST /snack-mfg/co-man-slots/{id}/consume"
        actor: PlantManager
        preconditions:
          - "status == CONFIRMED"
          - "agreement.status != TERMINATED (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "capacity and budget freed (slot leaves the BOOKED/CONFIRMED aggregation sets)"
          - "increments CoManSlot.version by 1"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /snack-mfg/co-man-slots/{id}/release, or system cascade from agreement termination"
        actor: CoManufacturer | PlantManager | system
        preconditions:
          - "status in {BOOKED, CONFIRMED}"
          - "when actor is CoManufacturer: agreement.co_manufacturer_id == X-User-ID"
        side_effects:
          - "capacity and budget freed"
          - "increments CoManSlot.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /snack-mfg/co-man-slots/{id}/release, or system cascade from agreement termination"
        actor: CoManufacturer | PlantManager | system
        preconditions:
          - "status in {BOOKED, CONFIRMED}"
          - "when actor is CoManufacturer: agreement.co_manufacturer_id == X-User-ID"
        side_effects:
          - "capacity and budget freed"
          - "increments CoManSlot.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1 — true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-line-version
    parent_entity: ProductionLine
    write_endpoint: "POST /snack-mfg/production-runs"
    occ_field: "expected_line_version"
    description: |
      Creating a ProductionRun against a ProductionLine whose version has
      advanced since the client last observed it is rejected. Run creation
      pins the allergen-changeover computation and schedule state to the
      line version the client observed; once another run creation (or a
      run completion updating current_allergen_profile) has advanced the
      line's version, the client's basis is stale even when the new run's
      own payload is independently valid.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: oil-movement-stale-baseline
    parent_entity: FryerOil
    write_endpoint: "POST /snack-mfg/oil-movements"
    occ_field: "expected_oil_version"
    description: |
      Recording an OilMovement against a FryerOil whose version has advanced
      since the client last observed it is rejected. Replenishment and
      discard volumes are computed by operators from the TPM and gallons
      baseline they read; once any earlier movement or frying accrual has
      advanced the oil record's version, that baseline is stale even though
      the movement itself would apply cleanly.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tpm_degradation
    trigger: "after every frying-accrual event (WeightCheck.lbs_fried_since_last_check, and the residual lbs at run completion) and after every OilMovement"
    algorithm: decay_function
    formula: |
      Frying accrual of L lbs with temp factor f:
        tpm_pct += (L / 1000) * TPM_RATE_PER_1000_LBS * f
        where f = 1.5 iff |avg_fry_temp_c - product.fry_target_temp_c| > 5.0 else 1.0
        total_lbs_since_replace += L
      TOP_OFF of g gallons (dilution, applied to pre-topoff tpm):
        tpm_pct = tpm_pct * current_gallons / (current_gallons + g)
        current_gallons += g
      DISCARD of g gallons:
        tpm_pct unchanged; current_gallons -= g
        (g == current_gallons implies full drain -> state DRAINING)
      FILTRATION:
        tpm_pct = tpm_pct * FILTRATION_FACTOR
      FULL_REPLACE (only from DRAINING):
        tpm_pct := FRESH_TPM; current_gallons := capacity; total_lbs_since_replace := 0
      After every recompute: state := QUALITY_HOLD iff tpm_pct >= TPM_HOLD_THRESHOLD
      (inclusive), else ACTIVE when previously QUALITY_HOLD and now below.
      tpm_pct is stored rounded to 2 decimals, round_half_up, after each step.
    input_set: "the line's FryerOil; all OilMovements and frying accruals since last FULL_REPLACE or initial charge"
    constants:
      TPM_RATE_PER_1000_LBS: 2.0
      TEMP_DEVIATION_LIMIT_C: 5.0
      TEMP_FACTOR_HIGH: 1.5
      FILTRATION_FACTOR: 0.6
      TPM_HOLD_THRESHOLD: 27.0
      FRESH_TPM: 0.5
    precision: "tpm_pct stored at 2 decimals, round_half_up, rounded after each individual step (dilution, accrual, filtration)"

  - name: giveaway_calc
    trigger: "on every WeightCheck creation and at run completion; read back via run fields and cost-summary"
    algorithm: aggregation
    formula: |
      reject threshold: a check is a reject iff bag_weight_g < declared - 2*tne
      (strictly below; exactly at declared - 2*tne is NOT a reject).
      reject_ratio = count(rejects) / count(all checks).
    input_set: "all WeightChecks of the run (variant-dependent filtering below)"
    constants:
      MAX_REJECT_RATIO: 0.025
    precision: "percent at 2 decimals, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "forward-looking estimate: includes ALL checks (rejects included), raw mean without per-check rounding"
        difference: "giveaway_provisional_pct = round_half_up(100 * (mean(all bag_weight_g) - declared) / declared, 2)"
      - name: FINAL
        when: "compliance-grade figure: excludes reject checks, per-check rounding applied BEFORE averaging (pinned order)"
        difference: "giveaway_final_pct = round_half_up(100 * mean_over_nonreject( round_half_up(bag_weight_g - declared, 1) ) / declared, 2)"

  - name: seasoning_dosing
    trigger: "inside margin_calc for the seasoning cost component"
    algorithm: aggregation
    formula: |
      seasoning_grams = round_half_up(lbs * 453.592 * seasoning_pct / 100, 1)
      seasoning_cost_cents = round_half_up(seasoning_grams * SEASONING_CENTS_PER_G, 0)
      STANDARD uses lbs_planned and product.seasoning_target_pct;
      ACTUAL uses lbs_produced and run.seasoning_actual_pct.
    input_set: "the run's planned or actual lbs and seasoning pct"
    constants:
      SEASONING_CENTS_PER_G: 2
      GRAMS_PER_LB: 453.592
    precision: "grams at 1 decimal then cents at 0 decimals, round_half_up; the two-step nested rounding order is pinned (grams first, then cost)"

  - name: margin_calc
    trigger: "STANDARD variant at run start (locked basis); ACTUAL variant at run completion"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (circular-looking dependency resolved):
        (1) case basis: STANDARD uses cases_planned; ACTUAL uses accepted_cases
            = cases_produced - rejected_cases (rejects determined before cost);
        (2) oil cost: absorbed_gal = round_half_up(lbs * ABSORB_GAL_PER_1000_LBS / 1000, 3);
            STANDARD price = locked_oil_price_cents_per_gal;
            ACTUAL price = weighted average unit_price over TOP_OFF movements with
            recorded_at in [run.started_at, run.completed_at] (inclusive both ends),
            weighted by gallons; when no such movement exists, ACTUAL price falls
            back to locked_oil_price_cents_per_gal;
            oil_cost_cents = round_half_up(absorbed_gal * price, 0);
        (3) ingredient_cost_cents = round_half_up(lbs * INGREDIENT_CENTS_PER_LB, 0);
        (4) seasoning_cost per seasoning_dosing;
        (5) margin_cents = case_basis * case_revenue_cents
                           - (ingredient_cost_cents + oil_cost_cents + seasoning_cost_cents).
      Per-case margin for the dispatch floor = round_half_up(margin_actual_cents / accepted_cases, 0).
    input_set: "the run, its product, its line's FryerOil movements inside the run window"
    constants:
      ABSORB_GAL_PER_1000_LBS: 1.5
      INGREDIENT_CENTS_PER_LB: 80
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: STANDARD
        when: "computed at run start with locked_oil_price and planned quantities"
        difference: "uses cases_planned, lbs_planned, seasoning_target_pct, locked oil price"
      - name: ACTUAL
        when: "computed at run completion with actualized quantities and in-window weighted oil price"
        difference: "uses accepted_cases, lbs_produced, seasoning_actual_pct, weighted-average in-window TOP_OFF price (fallback locked)"

  - name: freshness_window
    trigger: "at shipment plan (frozen into freshness_days_at_plan) and re-evaluated at dispatch"
    algorithm: threshold
    formula: |
      elapsed_days = floor((evaluation_time - run.completed_at) / 86400)
      freshness_remaining = product.shelf_life_days - elapsed_days
      DSD eligibility:       freshness_remaining >= DSD_MIN_DAYS        (inclusive; exactly 4 eligible)
      WAREHOUSE eligibility: freshness_remaining - transit_days > WH_MIN_DAYS  (exclusive; receipt remaining of exactly 10 is ineligible)
      AUTO resolution order: WAREHOUSE is selected iff warehouse-eligible;
      otherwise DSD iff dsd-eligible; otherwise ERR_FRESHNESS_INSUFFICIENT.
    input_set: "the shipment, its run (completed_at), its product (shelf_life_days), logical clock"
    constants:
      DSD_MIN_DAYS: 4
      WH_MIN_DAYS: 10
    precision: "whole days via floor on seconds/86400"
    variants:
      - name: DSD_VARIANT
        when: "requested_route == DSD, or AUTO fallback after warehouse ineligibility"
        difference: "evaluates remaining days at dispatch only"
      - name: WAREHOUSE_VARIANT
        when: "requested_route == WAREHOUSE, or AUTO first choice"
        difference: "evaluates remaining days at warehouse receipt (dispatch + transit_days), exclusive threshold"

  - name: changeover_requirement
    trigger: "at run creation (auto-creates a Changeover when level != NONE), at manual changeover creation, at run start (recomputed against the CURRENT line profile), and inside run schedule-overlap buffering"
    algorithm: constraint_propagation
    formula: |
      Given from = line.current_allergen_profile / current_flavor_group and
      to = product.allergen_profile / flavor_group:
        if (from - to) is non-empty        -> FULL_WASH   (any allergen removal)
        elif from == to and from_flavor != to_flavor -> DRY_CLEAN (flavor change only)
        else                               -> NONE        (identical, or pure allergen addition from <= to)
      Schedule buffer when level != NONE between consecutive runs A then B
      on the same line: B.scheduled_start >= A.scheduled_end + cleaning_minutes
      (cleaning_minutes_full_wash for FULL_WASH, cleaning_minutes_dry for DRY_CLEAN).
    input_set: "line's current profile snapshots and the target product"
    constants: {}
    precision: "set semantics over allergen arrays"

  - name: coman_capacity_allocation
    trigger: "at CoManSlot creation (booking)"
    algorithm: waterfall_allocation
    formula: |
      capacity_used(week) = sum(reserved_lbs of slots with same ISO week as
      week_start_date and status in {BOOKED, CONFIRMED})
      capacity check: capacity_used(week) + new.reserved_lbs <= weekly_capacity_lbs
      (exactly equal is allowed) else ERR_CAPACITY_EXCEEDED
      budget_used = sum(reserved_lbs * rate_per_lb_cents over ALL slots with
      status in {BOOKED, CONFIRMED})
      budget check: budget_used + new.reserved_lbs * rate <= budget_cents
      else ERR_BUDGET_EXCEEDED
      Priority: capacity (business_constraint) is checked BEFORE budget
      (business_fiscal).
    input_set: "all slots of the agreement in states {BOOKED, CONFIRMED}"
    constants: {}
    precision: "lbs at 2 decimals; cents integer"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path parameters reference existing resources (left-to-right), then body FK fields (line_id, product_id, run_id, fryer_oil_id, promo_window_id, agreement_id, co_manufacturer_id, to_product_id) reference existing resources"
    error_id: ERR_PRODUCT_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_CHANGEOVER_NOT_FOUND | ERR_OIL_NOT_FOUND | ERR_MOVEMENT_NOT_FOUND | ERR_WEIGHT_CHECK_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_PROMO_WINDOW_NOT_FOUND | ERR_DISPLAY_CASE_NOT_FOUND | ERR_COMAN_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: auth
    check: "ownership scope: CoManufacturer-role callers must satisfy agreement.co_manufacturer_id == X-User-ID on every endpoint touching an agreement or its slots"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "GET /snack-mfg/co-man-agreements/{id}, GET /snack-mfg/co-man-agreements, POST /snack-mfg/co-man-slots, GET /snack-mfg/co-man-slots, POST /snack-mfg/co-man-slots/{id}/confirm, POST /snack-mfg/co-man-slots/{id}/release"
  - priority: 5
    category: existence
    check: "request shape: required fields present, types valid, enum members valid, numeric ranges respected, duplicates in allergen_profile rejected, movement-type-specific field rules (gallons == 0 for FILTRATION; unit_price required for TOP_OFF/FULL_REPLACE and forbidden otherwise; FULL_REPLACE gallons == line oil_capacity_gallons); client-supplied system fields (id, created_at, updated_at, version) and undeclared extra fields are silently ignored, never rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "target entity in a from-state of the invoked transition; terminal entities reject all further transitions; OCC expected_*_version equals current version; cross-entity gating states (run.execution_status == COMPLETED for shipment creation; run.quality_status == PASSED for shipment plan/dispatch; agreement.status == ACTIVE for slot booking/confirm; promo window ACTIVE and run execution in {RUNNING, COMPLETED} for display-case creation)"
    error_id: ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | ERR_STALE_VERSION | ERR_RUN_NOT_PASSED | ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "all action endpoints (ERR_STALE_VERSION returns 412 per §1.2.1; the error catalog is authoritative per error_id)"
  - priority: 7
    category: business_safety
    check: "allergen/oil safety and segregation of duties: changeover gate on run start (requirement NONE or fresh validated unconsumed changeover); FryerOil ACTIVE for run start and hold release; validator != cleaner; hold releaser != holder"
    error_id: ERR_ALLERGEN_CHANGEOVER_REQUIRED | ERR_CLEANING_VALIDATION_STALE | ERR_OIL_QUALITY_HOLD | ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "run start, changeover validate, release-hold, oil movements (ERR_SOD_VIOLATION returns 403; the error catalog is authoritative per error_id)"
  - priority: 8
    category: business_temporal
    check: "time-window rules: run start not before scheduled_start; run half-open overlap with allergen cleaning buffer; promo window closed-interval overlap; display-case build within window dates; slot week_start is a Monday; freshness route eligibility at plan and dispatch"
    error_id: ERR_START_BEFORE_WINDOW | ERR_SCHEDULE_OVERLAP | ERR_PROMO_WINDOW_OVERLAP | ERR_OUTSIDE_PROMO_WINDOW | ERR_WEEK_START_INVALID | ERR_ROUTE_INELIGIBLE | ERR_FRESHNESS_INSUFFICIENT
    http_status: 422
    applies_to: "run create/start, promo activate, display-case build, slot booking, shipment plan/dispatch"
  - priority: 9
    category: business_constraint
    check: "capacity and quantity constraints: process/line compatibility; case reservation availability; co-man weekly capacity; promo quota remaining; oil sump overflow/underflow; at-least-one weight check before completion"
    error_id: ERR_PROCESS_LINE_MISMATCH | ERR_CASES_UNAVAILABLE | ERR_CAPACITY_EXCEEDED | ERR_PROMO_QUOTA_EXHAUSTED | ERR_OIL_OVERFLOW | ERR_INSUFFICIENT_OIL | ERR_NO_WEIGHT_CHECKS
    http_status: 422
    applies_to: "run create/complete, shipment create, display-case create/build, slot booking, oil movements"
  - priority: 10
    category: business_fiscal
    check: "money rules last: co-man budget ceiling; dispatch margin floor (overridable only by PlantManager with override_margin_floor == true)"
    error_id: ERR_BUDGET_EXCEEDED | ERR_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "slot booking, shipment dispatch"

# =============================================================================
# Table 5: API Endpoint Table (flat topology; FKs travel in request bodies)
# =============================================================================
endpoints:
  - method: POST
    path: "/snack-mfg/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. All freshness, window, schedule, and cleaning-staleness rules read this clock."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; no entity mutation"]

  - method: POST
    path: "/snack-mfg/products"
    description: "Create a product recipe definition"
    roles: [PlantManager]
    code: 201
    input: [name, process_type, allergen_profile, flavor_group, declared_net_weight_g, tne_g, giveaway_target_pct, giveaway_max_pct, shelf_life_days, seasoning_target_pct, standard_oil_price_cents_per_gal, case_revenue_cents, min_margin_cents_per_case, "fry_target_temp_c?", "bags_per_case?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/snack-mfg/products/{id}"
    description: "Fetch one product"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/snack-mfg/lines"
    description: "Create a production line; atomically creates its 1:1 FryerOil (initial charge = oil_capacity_gallons, tpm_pct = 0.5, state ACTIVE)"
    roles: [PlantManager]
    code: 201
    input: [name, line_type, oil_capacity_gallons, "cleaning_minutes_full_wash?", "cleaning_minutes_dry?"]
    output: ProductionLine
    side_effects: ["FryerOil created for the line", "posture initialized to IDLE", "current_allergen_profile := [], current_flavor_group := PLAIN"]
  - method: GET
    path: "/snack-mfg/lines/{id}"
    description: "Fetch one line including computed posture and current profile"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  - method: POST
    path: "/snack-mfg/production-runs"
    description: "Schedule a production run on a line (create-with-supersede against the line's schedule basis; OCC on expected_line_version). Auto-creates a REQUIRED Changeover when changeover_requirement(line current profile -> product) != NONE."
    roles: [PlantManager]
    code: 201
    input: [line_id, product_id, scheduled_start, scheduled_end, lbs_planned, cases_planned, expected_line_version]
    output: ProductionRun
    side_effects:
      - "half-open overlap + cleaning-buffer validation against sibling runs (ERR_SCHEDULE_OVERLAP)"
      - "process compatibility: product.process_type servable by line.line_type (FRYER product needs line_type in {FRYER, BOTH}; OVEN needs {OVEN, BOTH}; else ERR_PROCESS_LINE_MISMATCH)"
      - "when changeover_requirement != NONE and no open Changeover (status in {REQUIRED, CLEANING, SWAB_PENDING} or VALIDATED-unconsumed) already exists for (line, to_product == product): a Changeover (REQUIRED) is created; otherwise the existing open one is reused"
      - "increments ProductionLine.version by 1"
  - method: GET
    path: "/snack-mfg/production-runs/{id}"
    description: "Fetch one run (both status dimensions, computed margins and giveaway)"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/snack-mfg/production-runs"
    description: "List runs with filters and pagination"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["line_id?", "product_id?", "execution_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/production-runs/{id}/start"
    description: "Start a SCHEDULED run; consumes a fresh VALIDATED changeover when the allergen gate requires one; locks the standard cost basis"
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["SCHEDULED -> RUNNING", "Changeover VALIDATED -> APPLIED when consumed", "locked_oil_price_cents_per_gal pinned", "margin_standard_cents computed", "line posture -> RUNNING"]
  - method: POST
    path: "/snack-mfg/production-runs/{id}/place-hold"
    description: "Operator-placed quality/safety hold on a RUNNING run"
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["RUNNING -> HELD", "hold_placed_by_user_id := X-User-ID", "line posture recompute"]
  - method: POST
    path: "/snack-mfg/production-runs/{id}/release-hold"
    description: "Release a HELD run back to RUNNING; requires oil ACTIVE and segregation of duties (releaser != holder for user-placed holds)"
    roles: [QualityTechnician]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["HELD -> RUNNING", "hold_placed_by_user_id := null", "line posture recompute"]
  - method: POST
    path: "/snack-mfg/production-runs/{id}/complete"
    description: "Complete a RUNNING run with actuals; triggers residual TPM accrual, compliance evaluation, giveaway and actual margin computation, and the over-reservation cascade"
    roles: [LineOperator]
    code: 200
    input: [lbs_produced, cases_produced, rejected_cases, seasoning_actual_pct]
    output: ProductionRun
    side_effects: ["RUNNING -> COMPLETED", "residual lbs accrual to FryerOil (possible QUALITY_HOLD cascade)", "quality_status auto-evaluation to QHOLD or stays PENDING", "giveaway + margin_actual computed", "line current profile updated; ProductionLine.version incremented", "over-reservation cascade cancels newest PLANNED DisplayCases while cases_unrouted < 0"]
  - method: POST
    path: "/snack-mfg/production-runs/{id}/cancel"
    description: "Cancel a SCHEDULED or HELD run; cascades to PLANNED display cases and pending changeovers"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["execution -> CANCELLED", "PLANNED DisplayCases -> CANCELLED (RUN_CANCELLED)", "matching REQUIRED Changeovers -> CANCELLED", "line posture recompute"]
  - method: POST
    path: "/snack-mfg/production-runs/{id}/quality-disposition"
    description: "Quality disposition of a COMPLETED run; REJECT cascades to non-terminal shipments and PLANNED display cases"
    roles: [QualityTechnician]
    code: 200
    input: [disposition]
    output: ProductionRun
    side_effects: ["quality_status -> PASSED or REJECTED", "on REJECT: DRAFT/PLANNED Shipments -> CANCELLED; PLANNED DisplayCases -> CANCELLED (RUN_REJECTED)"]
  - method: GET
    path: "/snack-mfg/production-runs/{id}/cost-summary"
    description: "Computed read: dual-variant margin and giveaway figures for the run"
    roles: [PlantManager, QualityTechnician]
    code: 200
    input: []
    output: { margin_standard_cents: "integer|null", margin_actual_cents: "integer|null", margin_actual_per_case_cents: "integer|null", giveaway_provisional_pct: "number|null", giveaway_final_pct: "number|null", accepted_cases: integer, reject_ratio: "number|null" }
    side_effects: []

  - method: POST
    path: "/snack-mfg/weight-checks"
    description: "Record a checkweigher sample against a RUNNING run; applies frying accrual to the line's oil (may trigger the TPM hold cascade)"
    roles: [QualityTechnician]
    code: 201
    input: [run_id, bag_weight_g, lbs_fried_since_last_check, "avg_fry_temp_c?"]
    output: WeightCheck
    side_effects: ["is_reject computed", "TPM accrual on FryerOil (possible QUALITY_HOLD -> run HELD -> PLANNED display cases CANCELLED cascade)", "giveaway fields recomputed", "increments FryerOil.version by 1 when accrual lbs > 0"]
  - method: GET
    path: "/snack-mfg/weight-checks/{id}"
    description: "Fetch one weight check"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: WeightCheck
    side_effects: []
  - method: GET
    path: "/snack-mfg/weight-checks"
    description: "List weight checks, filterable by run"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["run_id?", "limit?", "offset?"]
    output: WeightCheck[]
    side_effects: []

  - method: POST
    path: "/snack-mfg/changeovers"
    description: "Manually create a changeover plan on a line toward a product; supersedes any still-REQUIRED changeover on that line"
    roles: [PlantManager]
    code: 201
    input: [line_id, to_product_id]
    output: Changeover
    side_effects: ["required_level computed via changeover_requirement", "prior REQUIRED changeovers on the line -> CANCELLED (superseded)", "line posture recompute"]
  - method: GET
    path: "/snack-mfg/changeovers/{id}"
    description: "Fetch one changeover"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: Changeover
    side_effects: []
  - method: GET
    path: "/snack-mfg/changeovers"
    description: "List changeovers with filters"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["line_id?", "to_product_id?", "status?", "limit?", "offset?"]
    output: Changeover[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/changeovers/{id}/begin-cleaning"
    description: "Begin cleaning for a REQUIRED changeover (records cleaner identity for segregation of duties)"
    roles: [LineOperator]
    code: 200
    input: []
    output: Changeover
    side_effects: ["REQUIRED -> CLEANING", "cleaned_by_user_id := X-User-ID", "line posture recompute"]
  - method: POST
    path: "/snack-mfg/changeovers/{id}/record-swab"
    description: "Record allergen swab result; PASS advances to SWAB_PENDING, FAIL loops back to CLEANING"
    roles: [QualityTechnician]
    code: 200
    input: [result]
    output: Changeover
    side_effects: ["CLEANING -> SWAB_PENDING on PASS; CLEANING -> CLEANING on FAIL", "swab_attempts += 1"]
  - method: POST
    path: "/snack-mfg/changeovers/{id}/validate"
    description: "Validate a passed swab; validator must differ from cleaner (ERR_SOD_VIOLATION)"
    roles: [QualityTechnician]
    code: 200
    input: []
    output: Changeover
    side_effects: ["SWAB_PENDING -> VALIDATED", "validated_at := now", "line posture recompute"]

  - method: GET
    path: "/snack-mfg/fryer-oils/{id}"
    description: "Fetch one fryer oil record"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: FryerOil
    side_effects: []
  - method: GET
    path: "/snack-mfg/fryer-oils"
    description: "List fryer oil records (line_id filter returns the 1:1 child as a 0-1 element array)"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["line_id?", "limit?", "offset?"]
    output: FryerOil[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/oil-movements"
    description: "Record an oil movement (TOP_OFF / DISCARD / FILTRATION / FULL_REPLACE); OCC on expected_oil_version because movement volumes are computed from the TPM/gallons baseline the operator last read"
    roles: [LineOperator]
    code: 201
    input: [fryer_oil_id, movement_type, gallons, "unit_price_cents_per_gal?", expected_oil_version]
    output: OilMovement
    side_effects: ["tpm/gallons recompute per tpm_degradation", "possible state transitions QUALITY_HOLD <-> ACTIVE / DRAINING -> ACTIVE", "possible run-hold cascade when accrual-driven breach occurs with a RUNNING run", "increments FryerOil.version by 1"]
  - method: GET
    path: "/snack-mfg/oil-movements/{id}"
    description: "Fetch one oil movement"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: OilMovement
    side_effects: []
  - method: GET
    path: "/snack-mfg/oil-movements"
    description: "List oil movements, filterable by fryer_oil_id"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["fryer_oil_id?", "limit?", "offset?"]
    output: OilMovement[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/fryer-oils/{id}/begin-change"
    description: "Begin a full oil change; transitions ACTIVE/QUALITY_HOLD -> DRAINING (blocked while a run is RUNNING on the line)"
    roles: [LineOperator]
    code: 200
    input: []
    output: FryerOil
    side_effects: ["state -> DRAINING", "line posture recompute (BLOCKED)", "increments FryerOil.version by 1"]

  - method: POST
    path: "/snack-mfg/shipments"
    description: "Create a DRAFT shipment reserving cases from a COMPLETED run"
    roles: [RoutePlanner]
    code: 201
    input: [run_id, cases, requested_route, "transit_days?"]
    output: Shipment
    side_effects: ["requires run.execution_status == COMPLETED (else ERR_INVALID_STATE)", "case reservation: run.cases_unrouted decreases by cases (ERR_CASES_UNAVAILABLE when insufficient)"]
  - method: GET
    path: "/snack-mfg/shipments/{id}"
    description: "Fetch one shipment"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/snack-mfg/shipments"
    description: "List shipments with filters"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["run_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/shipments/{id}/plan"
    description: "Resolve routing per freshness_window; branches DRAFT -> DSD_PLANNED or WAREHOUSE_PLANNED"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["planned_route + freshness_days_at_plan computed", "status -> DSD_PLANNED or WAREHOUSE_PLANNED"]
  - method: POST
    path: "/snack-mfg/shipments/{id}/replan"
    description: "Return a planned shipment to DRAFT for re-routing"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DRAFT", "planned_route and freshness_days_at_plan cleared"]
  - method: POST
    path: "/snack-mfg/shipments/{id}/dispatch"
    description: "Dispatch a planned shipment; re-checks quality, freshness at dispatch, and the margin floor (PlantManager may override the floor)"
    roles: [RoutePlanner, PlantManager]
    code: 200
    input: ["override_margin_floor?"]
    output: Shipment
    side_effects: ["status -> DISPATCHED", "dispatched_at := now"]
  - method: POST
    path: "/snack-mfg/shipments/{id}/cancel"
    description: "Cancel a non-terminal shipment, releasing its case reservation"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CANCELLED", "run.cases_unrouted increases"]

  - method: POST
    path: "/snack-mfg/promo-windows"
    description: "Create a promotional pack campaign (quota + closed date interval)"
    roles: [PlantManager]
    code: 201
    input: [product_id, quota_total_cases, window_start_date, window_end_date, "case_size_bags?"]
    output: PromoWindow
    side_effects: []
  - method: GET
    path: "/snack-mfg/promo-windows/{id}"
    description: "Fetch one promo window including quota counters"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: PromoWindow
    side_effects: []
  - method: GET
    path: "/snack-mfg/promo-windows"
    description: "List promo windows with filters"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: PromoWindow[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/promo-windows/{id}/activate"
    description: "Activate a DRAFT window; rejects closed-interval overlap with another ACTIVE window on the same product"
    roles: [PlantManager]
    code: 200
    input: []
    output: PromoWindow
    side_effects: ["DRAFT -> ACTIVE"]
  - method: POST
    path: "/snack-mfg/promo-windows/{id}/close"
    description: "Close an ACTIVE or EXHAUSTED window; cancels remaining PLANNED display cases"
    roles: [PlantManager]
    code: 200
    input: []
    output: PromoWindow
    side_effects: ["status -> CLOSED", "PLANNED DisplayCases -> CANCELLED (MANUAL)"]

  - method: POST
    path: "/snack-mfg/display-cases"
    description: "Create a PLANNED display-ready case build; reserves cases from the run's unrouted balance"
    roles: [PlantManager]
    code: 201
    input: [promo_window_id, run_id, cases_planned]
    output: DisplayCase
    side_effects: ["requires promo window ACTIVE and run execution_status in {RUNNING, COMPLETED}", "case reservation: run.cases_unrouted decreases by cases_planned (ERR_CASES_UNAVAILABLE when insufficient)"]
  - method: GET
    path: "/snack-mfg/display-cases/{id}"
    description: "Fetch one display case build"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: DisplayCase
    side_effects: []
  - method: GET
    path: "/snack-mfg/display-cases"
    description: "List display case builds with filters"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: ["promo_window_id?", "run_id?", "status?", "limit?", "offset?"]
    output: DisplayCase[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/display-cases/{id}/build"
    description: "Build a PLANNED display case; consumes window quota and may exhaust the window (cascade cancels remaining PLANNED builds)"
    roles: [LineOperator]
    code: 200
    input: []
    output: DisplayCase
    side_effects: ["PLANNED -> BUILT", "quota_consumed_cases += cases_planned", "possible PromoWindow ACTIVE -> EXHAUSTED cascade"]
  - method: POST
    path: "/snack-mfg/display-cases/{id}/cancel"
    description: "Cancel a PLANNED or BUILT display case; BUILT cancellation releases quota and may reactivate an EXHAUSTED window"
    roles: [PlantManager]
    code: 200
    input: []
    output: DisplayCase
    side_effects: ["status -> CANCELLED (MANUAL)", "BUILT: quota_released_cases += cases_planned; possible EXHAUSTED -> ACTIVE cascade", "reservation released"]

  - method: POST
    path: "/snack-mfg/co-manufacturers"
    description: "Register a co-manufacturing partner organization"
    roles: [PlantManager]
    code: 201
    input: [name, "active?"]
    output: CoManufacturer
    side_effects: []
  - method: GET
    path: "/snack-mfg/co-manufacturers/{id}"
    description: "Fetch one co-manufacturer"
    roles: [PlantManager, LineOperator, QualityTechnician, RoutePlanner, CoManufacturer]
    code: 200
    input: []
    output: CoManufacturer
    side_effects: []
  - method: POST
    path: "/snack-mfg/co-man-agreements"
    description: "Create a tolling agreement with weekly capacity, rate, and budget ceiling"
    roles: [PlantManager]
    code: 201
    input: [co_manufacturer_id, weekly_capacity_lbs, rate_per_lb_cents, budget_cents]
    output: CoManAgreement
    side_effects: []
  - method: GET
    path: "/snack-mfg/co-man-agreements/{id}"
    description: "Fetch one agreement; CoManufacturer role must own it (co_manufacturer_id == X-User-ID)"
    roles: [PlantManager, CoManufacturer]
    code: 200
    input: []
    output: CoManAgreement
    side_effects: []
  - method: GET
    path: "/snack-mfg/co-man-agreements"
    description: "List agreements; CoManufacturer role sees only its own (co_manufacturer_id == X-User-ID filter forced)"
    roles: [PlantManager, CoManufacturer]
    code: 200
    input: ["co_manufacturer_id?", "status?", "limit?", "offset?"]
    output: CoManAgreement[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/co-man-agreements/{id}/activate"
    description: "Activate a DRAFT agreement (partner must be active)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CoManAgreement
    side_effects: ["DRAFT -> ACTIVE"]
  - method: POST
    path: "/snack-mfg/co-man-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement; blocks new bookings and confirms"
    roles: [PlantManager]
    code: 200
    input: []
    output: CoManAgreement
    side_effects: ["ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/snack-mfg/co-man-agreements/{id}/resume"
    description: "Resume a SUSPENDED agreement"
    roles: [PlantManager]
    code: 200
    input: []
    output: CoManAgreement
    side_effects: ["SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/snack-mfg/co-man-agreements/{id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED agreement; releases all non-terminal slots"
    roles: [PlantManager]
    code: 200
    input: []
    output: CoManAgreement
    side_effects: ["status -> TERMINATED", "BOOKED/CONFIRMED CoManSlots -> RELEASED"]
  - method: POST
    path: "/snack-mfg/co-man-slots"
    description: "Book weekly capacity under an ACTIVE agreement; aggregate weekly capacity and budget checks apply (capacity before budget)"
    roles: [CoManufacturer, PlantManager]
    code: 201
    input: [agreement_id, product_id, week_start_date, reserved_lbs]
    output: CoManSlot
    side_effects: ["capacity_used(week) += reserved_lbs", "budget_used += reserved_lbs * rate_per_lb_cents"]
  - method: GET
    path: "/snack-mfg/co-man-slots/{id}"
    description: "Fetch one slot; CoManufacturer role must own the parent agreement"
    roles: [PlantManager, CoManufacturer]
    code: 200
    input: []
    output: CoManSlot
    side_effects: []
  - method: GET
    path: "/snack-mfg/co-man-slots"
    description: "List slots; CoManufacturer role sees only slots under its own agreements"
    roles: [PlantManager, CoManufacturer]
    code: 200
    input: ["agreement_id?", "product_id?", "status?", "limit?", "offset?"]
    output: CoManSlot[]
    side_effects: []
  - method: POST
    path: "/snack-mfg/co-man-slots/{id}/confirm"
    description: "Confirm a BOOKED slot (agreement must be ACTIVE; owner co-manufacturer only)"
    roles: [CoManufacturer]
    code: 200
    input: []
    output: CoManSlot
    side_effects: ["BOOKED -> CONFIRMED"]
  - method: POST
    path: "/snack-mfg/co-man-slots/{id}/release"
    description: "Release a BOOKED or CONFIRMED slot, freeing capacity and budget"
    roles: [CoManufacturer, PlantManager]
    code: 200
    input: []
    output: CoManSlot
    side_effects: ["status -> RELEASED", "capacity and budget freed"]
  - method: POST
    path: "/snack-mfg/co-man-slots/{id}/consume"
    description: "Mark a CONFIRMED slot consumed after tolling completes"
    roles: [PlantManager]
    code: 200
    input: []
    output: CoManSlot
    side_effects: ["CONFIRMED -> CONSUMED", "capacity and budget freed"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing or role name not declared"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not in endpoint roles list, or CoManufacturer ownership scope violated (agreement.co_manufacturer_id != X-User-ID)"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing/invalid required field, bad enum member, out-of-range number, duplicate allergen entries, or movement-type field rule violated (FILTRATION gallons != 0; TOP_OFF/FULL_REPLACE missing price; DISCARD/FILTRATION carrying price; FULL_REPLACE gallons != oil_capacity_gallons)"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "Product id in path or body does not exist"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "ProductionLine id in path or body does not exist"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "ProductionRun id in path or body does not exist"
  - id: ERR_CHANGEOVER_NOT_FOUND
    http: 404
    condition: "Changeover id in path does not exist"
  - id: ERR_OIL_NOT_FOUND
    http: 404
    condition: "FryerOil id in path or body does not exist"
  - id: ERR_MOVEMENT_NOT_FOUND
    http: 404
    condition: "OilMovement id in path does not exist"
  - id: ERR_WEIGHT_CHECK_NOT_FOUND
    http: 404
    condition: "WeightCheck id in path does not exist"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "Shipment id in path does not exist"
  - id: ERR_PROMO_WINDOW_NOT_FOUND
    http: 404
    condition: "PromoWindow id in path or body does not exist"
  - id: ERR_DISPLAY_CASE_NOT_FOUND
    http: 404
    condition: "DisplayCase id in path does not exist"
  - id: ERR_COMAN_NOT_FOUND
    http: 404
    condition: "CoManufacturer id in path or body does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "CoManAgreement id in path or body does not exist"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "CoManSlot id in path does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a from-state of the invoked transition (non-terminal)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Target entity is in a terminal state (COMPLETED/CANCELLED run, DISPATCHED/CANCELLED shipment, CLOSED window, BUILT/CANCELLED case on rebuild, CONSUMED/RELEASED slot, TERMINATED agreement, APPLIED/CANCELLED changeover, PASSED/REJECTED quality)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_line_version != ProductionLine.version on run creation, or expected_oil_version != FryerOil.version on oil movement (OCC, see concurrency_rules)"
  - id: ERR_RUN_NOT_PASSED
    http: 409
    condition: "Shipment plan/dispatch requires the source run's quality_status == PASSED"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Slot booking/confirm requires agreement.status == ACTIVE; consume requires status != TERMINATED"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation of duties: changeover validator == cleaner (validated against cleaned_by_user_id), or hold releaser == user who placed the hold"
  - id: ERR_ALLERGEN_CHANGEOVER_REQUIRED
    http: 422
    condition: "Run start requires a validated allergen changeover (requirement != NONE) but none exists in VALIDATED unconsumed state for this line/product"
  - id: ERR_CLEANING_VALIDATION_STALE
    http: 422
    condition: "A matching VALIDATED changeover exists but validated_at is more than 48h before the run start"
  - id: ERR_OIL_QUALITY_HOLD
    http: 422
    condition: "Run start or hold release while the line's FryerOil.state != ACTIVE (QUALITY_HOLD or DRAINING)"
  - id: ERR_START_BEFORE_WINDOW
    http: 422
    condition: "Run start attempted before scheduled_start (logical clock)"
  - id: ERR_SCHEDULE_OVERLAP
    http: 409
    condition: "Run's half-open [scheduled_start, scheduled_end) intersects a sibling run's interval on the same line, or violates the allergen cleaning buffer (end + cleaning_minutes) against the immediately preceding run"
  - id: ERR_PROMO_WINDOW_OVERLAP
    http: 409
    condition: "Activating a promo window whose closed [start_date, end_date] interval intersects another ACTIVE window for the same product (shared boundary date counts as overlap)"
  - id: ERR_OUTSIDE_PROMO_WINDOW
    http: 422
    condition: "Display case build outside [window_start_date, window_end_date] inclusive (logical clock date)"
  - id: ERR_WEEK_START_INVALID
    http: 422
    condition: "CoManSlot week_start_date is not a Monday"
  - id: ERR_ROUTE_INELIGIBLE
    http: 422
    condition: "Explicitly requested route fails its freshness eligibility (DSD < 4 days remaining; WAREHOUSE receipt remaining <= 10 days)"
  - id: ERR_FRESHNESS_INSUFFICIENT
    http: 422
    condition: "AUTO routing finds neither route eligible, or dispatch-time freshness re-check fails"
  - id: ERR_PROCESS_LINE_MISMATCH
    http: 422
    condition: "product.process_type not servable by line.line_type (FRYER product needs line_type in {FRYER, BOTH}; OVEN needs {OVEN, BOTH})"
  - id: ERR_CASES_UNAVAILABLE
    http: 422
    condition: "Shipment/display-case reservation exceeds run.cases_unrouted"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Co-man weekly aggregate capacity would exceed weekly_capacity_lbs (sum over BOOKED/CONFIRMED slots of the same ISO week)"
  - id: ERR_PROMO_QUOTA_EXHAUSTED
    http: 422
    condition: "Display case build with cases_planned > quota_remaining_cases (quota_remaining_cases == 0 included)"
  - id: ERR_OIL_OVERFLOW
    http: 422
    condition: "TOP_OFF would push current_gallons above oil_capacity_gallons"
  - id: ERR_INSUFFICIENT_OIL
    http: 422
    condition: "DISCARD gallons > current_gallons"
  - id: ERR_NO_WEIGHT_CHECKS
    http: 422
    condition: "Run completion attempted with zero recorded WeightChecks"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "Co-man slot booking would push sum(reserved_lbs * rate) over BOOKED/CONFIRMED slots above budget_cents (checked after capacity)"
  - id: ERR_MARGIN_BELOW_FLOOR
    http: 422
    condition: "Dispatch when round(margin_actual_cents / accepted_cases, 0) < product.min_margin_cents_per_case without a PlantManager override"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: products, lines, schedules, promo campaigns, co-man agreements; cancels runs; may override the dispatch margin floor. Deliberately NOT allowed on the quality/segregation surface (swabs, validation, weight checks, hold release) — admin rights do not subsume quality duties."
    identity: opaque
    exclusive_operations:
      - "POST /snack-mfg/products"
      - "POST /snack-mfg/lines"
      - "POST /snack-mfg/production-runs"
      - "POST /snack-mfg/production-runs/{id}/cancel"
      - "POST /snack-mfg/changeovers"
      - "POST /snack-mfg/promo-windows"
      - "POST /snack-mfg/promo-windows/{id}/activate"
      - "POST /snack-mfg/promo-windows/{id}/close"
      - "POST /snack-mfg/display-cases"
      - "POST /snack-mfg/display-cases/{id}/cancel"
      - "POST /snack-mfg/co-manufacturers"
      - "POST /snack-mfg/co-man-agreements"
      - "POST /snack-mfg/co-man-agreements/{id}/activate"
      - "POST /snack-mfg/co-man-agreements/{id}/suspend"
      - "POST /snack-mfg/co-man-agreements/{id}/resume"
      - "POST /snack-mfg/co-man-agreements/{id}/terminate"
      - "POST /snack-mfg/co-man-slots/{id}/consume"
      - "POST /snack-mfg/_clock/set_current_utc"
    shared_operations:
      - "POST /snack-mfg/shipments/{id}/dispatch (with RoutePlanner; sole holder of margin-floor override)"
      - "POST /snack-mfg/co-man-slots (with CoManufacturer)"
      - "POST /snack-mfg/co-man-slots/{id}/release (with CoManufacturer)"
      - "all GET endpoints"
      - "GET /snack-mfg/production-runs/{id}/cost-summary (with QualityTechnician)"
  - name: LineOperator
    description: "Runs the line: starts/holds/completes runs, records oil movements and oil changes, performs changeover cleaning, builds display cases. Cannot validate its own cleaning (SoD) or release its own holds (SoD enforced at release-hold via QualityTechnician gating)."
    identity: opaque
    exclusive_operations:
      - "POST /snack-mfg/production-runs/{id}/start"
      - "POST /snack-mfg/production-runs/{id}/place-hold"
      - "POST /snack-mfg/production-runs/{id}/complete"
      - "POST /snack-mfg/oil-movements"
      - "POST /snack-mfg/fryer-oils/{id}/begin-change"
      - "POST /snack-mfg/changeovers/{id}/begin-cleaning"
      - "POST /snack-mfg/display-cases/{id}/build"
    shared_operations:
      - "all GET endpoints"
  - name: QualityTechnician
    description: "Quality gatekeeper: swabs, changeover validation, weight checks, hold release, quality disposition. Segregation-of-duties anchor role: must differ from the cleaning/holding user at validation/release time."
    identity: opaque
    exclusive_operations:
      - "POST /snack-mfg/changeovers/{id}/record-swab"
      - "POST /snack-mfg/changeovers/{id}/validate"
      - "POST /snack-mfg/weight-checks"
      - "POST /snack-mfg/production-runs/{id}/release-hold"
      - "POST /snack-mfg/production-runs/{id}/quality-disposition"
    shared_operations:
      - "all GET endpoints"
      - "GET /snack-mfg/production-runs/{id}/cost-summary (with PlantManager)"
  - name: RoutePlanner
    description: "Distribution planner: creates, routes, replans, dispatches, and cancels shipments. Subject to freshness and margin-floor gates without override power."
    identity: opaque
    exclusive_operations:
      - "POST /snack-mfg/shipments"
      - "POST /snack-mfg/shipments/{id}/plan"
      - "POST /snack-mfg/shipments/{id}/replan"
      - "POST /snack-mfg/shipments/{id}/cancel"
    shared_operations:
      - "POST /snack-mfg/shipments/{id}/dispatch (with PlantManager; no override privilege)"
      - "all GET endpoints"
  - name: CoManufacturer
    description: "External tolling partner; X-User-ID equals its CoManufacturer entity id. Reads and books only under agreements it owns (agreement.co_manufacturer_id == X-User-ID); confirms and releases its slots."
    identity: "entity_backed:CoManufacturer"
    exclusive_operations:
      - "POST /snack-mfg/co-man-slots/{id}/confirm"
    shared_operations:
      - "POST /snack-mfg/co-man-slots (with PlantManager)"
      - "POST /snack-mfg/co-man-slots/{id}/release (with PlantManager)"
      - "GET /snack-mfg/co-man-agreements/{id} and list (own agreements only)"
      - "GET /snack-mfg/co-man-slots/{id} and list (own slots only)"
      - "all other GET endpoints"




