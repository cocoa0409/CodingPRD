        distinguishing_aspect: "The YouthMember surface is closed: the priority 2 role check rejects a resident on staff reads such as the admissions and placements collections with 403 ERR_UNAUTHORIZED_ROLE before the priority 3 ownership check can even be considered, and it holds for reads of the resident's own admission."
