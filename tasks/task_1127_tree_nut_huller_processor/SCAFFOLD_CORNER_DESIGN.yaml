# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task 1127: Tree-Nut Huller & Processor. Breadth probe per claim-extraction-guide.
# All chains start from empty DB. Clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: lot_create_returns_201_with_initial_state_and_system_fields
        claim_type: creation
        grounds: [entities.FieldLot, state_machines.FieldLot.initial_state]
        distinguishing_aspect: "POST /lots with valid input returns 201; server mints id/created_at/version and forces status RECEIVED regardless of caller input."
        test_recipe:
          setup: ["Grower G1 exists"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 3000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
          assert:
            - "HTTP 201; response data.id is a server-minted UUID"
            - "FieldLot.${lot1}.status == RECEIVED and version == 1"
            - "created_at == current logical clock (2026-05-01T00:00:00Z at default)"

      - name: lot_create_missing_required_gross_weight_rejected
        claim_type: required_fields
        grounds: [entities.FieldLot.fields.gross_weight_lbs, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input gross_weight_lbs yields ERR_INVALID_REQUEST (400); no lot persisted."
        test_recipe:
          setup: ["Grower G1 exists"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil" }
              as: IntakeOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: lot_create_system_field_status_input_ignored
        claim_type: system_fields
        grounds: [entities.FieldLot.fields.status, state_machines.FieldLot.initial_state]
        distinguishing_aspect: "A client-supplied status field is not part of the endpoint contract; the lot is created in RECEIVED regardless."
        test_recipe:
          setup: ["Grower G1 exists"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 3000, status: "SETTLED" }
              as: IntakeOperator
              captures: { lot1: $.data.id }
          assert:
            - "HTTP 201 and FieldLot.${lot1}.status == RECEIVED (input status ignored)"

      - name: grower_create_applies_default_premium_rate
        claim_type: defaults
        grounds: [entities.Grower.fields.premium_rate_pct]
        distinguishing_aspect: "Omitting premium_rate_pct applies the declared default 0.0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
          assert:
            - "Grower.${g1}.premium_rate_pct == 0.0"
            - "Grower.${g1}.payable_outstanding_cents == 0 and lifetime_paid_cents == 0"

      - name: grower_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [errors.ERR_GROWER_NOT_FOUND, validations.priority=3]
        distinguishing_aspect: "GET on a non-existent UUID yields the per-entity 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /growers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GROWER_NOT_FOUND, HTTP 404"

      - name: lot_create_unknown_grower_fk_rejected
        claim_type: parent_relationships
        grounds: [entities.FieldLot.fields.grower_id, errors.ERR_GROWER_NOT_FOUND]
        distinguishing_aspect: "Flat topology FK integrity: a body grower_id that does not resolve is rejected 404 before any lot is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lots"
              payload: { grower_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", variety: "Nonpareil", gross_weight_lbs: 3000 }
              as: IntakeOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GROWER_NOT_FOUND, HTTP 404"

      - name: lots_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset window over 3 lots: page 1 reports total_count 3 and has_more true; page at offset 2 returns 1 item with has_more false."
        test_recipe:
          setup: ["Grower G1 with three lots"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 1000 }
              as: IntakeOperator
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Butte", gross_weight_lbs: 2000 }
              as: IntakeOperator
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Carmel", gross_weight_lbs: 3000 }
              as: IntakeOperator
          trigger:
            - call: "GET /lots"
              payload: { limit: 2, offset: 0 }
              as: IntakeOperator
            - call: "GET /lots"
              payload: { limit: 2, offset: 2 }
              as: IntakeOperator
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

  - section: state_machines
    instances:
      - name: resample_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.FieldLot.REJECTED_to_SAMPLED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "resample is only declared from REJECTED; from RECEIVED it fails with ERR_INVALID_STATE and no field changes."
        test_recipe:
          setup: ["Grower G1; lot in RECEIVED"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 3000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /lots/${lot1}/resample"
              payload: {}
              as: IntakeOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "FieldLot.${lot1}.status == RECEIVED (unchanged)"

      - name: settlement_approve_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Settlement.DRAFT_to_ISSUED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "The same trigger twice: second approve observes ISSUED (not DRAFT) and fails with ERR_INVALID_STATE; grower payable debited exactly once."
        test_recipe:
          setup:
            - "Processed lot (gross 2000, kernel_out 1000, edible 0.80 -> graded 800.00); grower price 100, no premium"
            - "Settlement DRAFT total_cents 80000"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 1000, shell_out_lbs: 500, hull_out_lbs: 300 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "UNSIZED" }
              as: LabTechnician
            - call: "POST /settlements"
              payload: { lot_id: "${lot1}" }
              as: PlantAdmin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /settlements/${st1}/approve"
              payload: {}
              as: PlantAdmin
            - call: "POST /settlements/${st1}/approve"
              payload: {}
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Settlement.${st1}.total_cents == 80000 (= round(800.00 * 100), no premium, no deduction)"
            - "second approve: error_id == ERR_INVALID_STATE, HTTP 409"
            - "Grower.${g1}.payable_outstanding_cents == 80000 (debited exactly once)"

      - name: settlement_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Settlement.DRAFT_to_CANCELLED, errors.ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "From terminal CANCELLED no transition exists: approve on a cancelled settlement fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Processed lot (graded 800.00) with Settlement DRAFT, then cancelled"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 100 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 1000, shell_out_lbs: 500, hull_out_lbs: 300 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "UNSIZED" }
              as: LabTechnician
            - call: "POST /settlements"
              payload: { lot_id: "${lot1}" }
              as: PlantAdmin
              captures: { st1: $.data.id }
            - call: "POST /settlements/${st1}/cancel"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /settlements/${st1}/approve"
              payload: {}
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL, HTTP 409"
            - "Grower.${g1}.payable_outstanding_cents == 0"

      - name: lot_dispose_cascades_quarantined_placements_to_disposed
        claim_type: side_effect_execution
        grounds: [state_machines.FieldLot.REJECTED_to_DISPOSED, state_machines.StoragePlacement.QUARANTINED_to_DISPOSED]
        distinguishing_aspect: "Disposing a REJECTED lot disposes its QUARANTINED placements and the disposed weight leaves the bin's occupied_lbs (2000 -> 0)."
        test_recipe:
          setup:
            - "Processed KERNEL lot (kernel_out 2400); bin B1 cap 5000; placement 2000 STORED"
            - "AFLATOXIN 30.0 FAIL -> lot REJECTED, placement QUARANTINED"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 5000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 2400, shell_out_lbs: 1300, hull_out_lbs: 900 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "SPEC_23_25" }
              as: LabTechnician
            - call: "POST /bins"
              payload: { bin_code: "B-1", capacity_lbs: 5000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin1: $.data.id }
            - call: "POST /placements"
              payload: { bin_id: "${bin1}", lot_id: "${lot1}", product_form: "KERNEL", quantity_lbs: 2000 }
              as: PlantOperator
              captures: { pl1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 30.0 }
              as: LabTechnician
          trigger:
            - call: "POST /lots/${lot1}/dispose"
              payload: {}
              as: IntakeOperator
          assert:
            - "FieldLot.${lot1}.status == DISPOSED"
            - "StoragePlacement.${pl1}.status == DISPOSED"
            - "StorageBin.${bin1}.occupied_lbs == 0 (disposed weight no longer occupies the bin)"

      - name: shipment_blocked_to_planned_on_fumigation_clearance
        claim_type: side_effect_execution
        grounds: [state_machines.Shipment.BLOCKED_to_PLANNED]
        excluded_because:
          difficulty_instance: confirm_requires_bin_clear_of_fumigation
          rationale: "The BLOCKED -> PLANNED restoration edge is asserted there ('Shipment back to PLANNED' after the clock passes cleared_at)."

  - section: calculations
    instances:
      - name: premium_grade_threshold_inclusive_at_seventy
        claim_type: constants_applied
        grounds: [calculations.settlement_amount, entities.Settlement.fields.premium_cents]
        distinguishing_aspect: "PREMIUM_GRADE_PCT 0.70 is inclusive (>=): edible_kernel_pct exactly 0.70 earns the premium; total 154000 cents."
        test_recipe:
          setup:
            - "Grower price 100, premium_rate 0.10; lot gross 4000; MK 6.0/0.50/0.01 (no drying); AF 2.0 PASS"
            - "Run completed kernel 2000 / shell 1000 / hull 700; KERNEL_GRADE edible exactly 0.70"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 100, premium_rate_pct: 0.10 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 4000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 2000, shell_out_lbs: 1000, hull_out_lbs: 700 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.70, size_spec: "SPEC_23_25" }
              as: LabTechnician
          trigger:
            - call: "POST /settlements"
              payload: { lot_id: "${lot1}" }
              as: PlantAdmin
              captures: { st1: $.data.id }
          assert:
            - "Settlement.${st1}.graded_kernel_weight_lbs == 1400.00 (= 2000 * 0.70)"
            - "Settlement.${st1}.base_cents == 140000"
            - "Settlement.${st1}.premium_cents == 14000 (edible 0.70 >= 0.70 — threshold inclusive)"
            - "Settlement.${st1}.moisture_deduction_cents == 0 (effective moisture 6.0 <= 8.0)"
            - "Settlement.${st1}.total_cents == 154000"

      - name: kernel_out_excludes_cancelled_runs
        claim_type: input_set_filtering
        grounds: [calculations.kernel_weight_grading, entities.FieldLot.fields.kernel_out_lbs]
        distinguishing_aspect: "Lot output sums include COMPLETED runs only: a cancelled run contributes nothing, so kernel_out_lbs == 1500 from the single completed run."
        test_recipe:
          setup:
            - "Lot gross 4000, graded route KERNEL; run1 created then cancelled while QUEUED; run2 completed 1500/1000/500"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 4000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/cancel"
              payload: {}
              as: PlantOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v2: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v2}" }
              as: PlantOperator
              captures: { run2: $.data.id }
            - call: "POST /processing-runs/${run2}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run2}/complete"
              payload: { kernel_out_lbs: 1500, shell_out_lbs: 1000, hull_out_lbs: 500 }
              as: PlantOperator
          trigger:
            - call: "GET /lots/${lot1}"
              as: PlantOperator
          assert:
            - "ProcessingRun.${run1}.status == CANCELLED"
            - "FieldLot.${lot1}.kernel_out_lbs == 1500 (cancelled run contributes nothing)"
            - "FieldLot.${lot1}.status == PROCESSED"

      - name: byproduct_stock_accounting_and_exhaustion
        claim_type: correct_result
        grounds: [calculations.byproduct_available_stock, errors.ERR_BYPRODUCT_STOCK_EXCEEDED]
        distinguishing_aspect: "Stock(HULL) = 1500 (one completed run); selling 1500 at 3 c/lb yields total_cents 4500 and drains the pool; a further 1-lb sale is rejected."
        test_recipe:
          setup:
            - "One completed run with hull_out 1500, shell_out 2000 (lot gross 10000 chain)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 10000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.65, foreign_material_pct: 0.02 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
