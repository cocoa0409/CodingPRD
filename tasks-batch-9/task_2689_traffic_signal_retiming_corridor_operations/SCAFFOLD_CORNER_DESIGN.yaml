  # ===================================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS — complexity_profile.complexity_layers declares
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # selector_policy. The first three are guide rows and are walked below; selector_policy
  # is not a row in the guide's layer table, so no claim is invented for it (its
  # observable behaviour is the tie-broken waterfall already covered by
  # calculations.priority_budget_is_zero_until_a_plan_is_actually_deployed and by
  # errors.priority_config_gates_rank_reuse_budget_exhaustion_and_posture).
  # ===================================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_project_version_gates_plan_creation_and_the_supersede_that_moves_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.timing-plan-create-stale-project
          - validations[priority 45 ERR_STALE_PROJECT_VERSION]
          - state_machines.TimingPlan[DRAFT -> SUPERSEDED]
        distinguishing_aspect: "The OCC token is the PARENT's version, not the plan's, so creating a plan is what invalidates the next plan creation: one successful POST leaves every other client's expected_project_version stale even though they intend to write a completely different time-of-day window. The rule's own description names the race it protects — a second plan on the same (project, intersection, tod_period) legitimately supersedes the first DRAFT — and this recipe performs exactly that supersede with a refreshed token, so the reader can see the DRAFT -> SUPERSEDED write that the stale reader would have missed."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One SELECTED corridor with intersection i1; project p1 opened by eng-1 and advanced to PLAN_DEVELOPMENT."
            - "Version convention: every entity is created at version 1 and every write increments it by exactly 1."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
