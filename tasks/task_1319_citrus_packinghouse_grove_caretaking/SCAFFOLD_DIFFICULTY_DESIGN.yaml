            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-XL1", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { xl_jp: "$.data.id" } }
