              captures: { rt_v: $.data.version }
            - call: "POST /doc-set-versions"
              payload: { release_train_id: "${rt_id}", version_label: "30.0-docs", expected_release_train_version: "${rt_v}" }
              as: DocsLead
              captures: { ds_id: $.data.id }
            - call: "POST /doc-set-versions/${ds_id}/publish"
              payload: {}
              as: DocsLead
            - call: "POST /locale-profiles"
              payload: { locale_code: "de-DE", publication_mode: "DELAYED", tm_coverage_pct: 0, per_word_rate_cents: 10, sla_days: 10, parallel_job_limit: 3 }
              as: LocalizationCoordinator
              captures: { loc_de_id: $.data.id }
          trigger:
            - call: "POST /localization-jobs"
              payload: { topic_id: "${t_id}", locale_profile_id: "${loc_de_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-21" }
              as: LocalizationCoordinator
              captures: { job_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /localization-jobs/${job_id}/cancel"
              payload: { cancel_reason: "locale dropped from this release" }
              as: LocalizationCoordinator
          assert:
            - "after the create: ${est} == 12000, LocalizationJob.${job_id}.reserved_source_words == 1200, state QUEUED, cost_variant PROVISIONAL, rush_surcharge_cents 0"
            - "after the create: LocaleProfile.${loc_de_id}.committed_source_words == 1200 and open_job_count == 1"
            - "after the create: ReleaseTrain.${rt_id}.localization_committed_cents == 12000 — exactly the job's estimated_cost_cents"
            - "after the cancel: LocaleProfile.${loc_de_id}.committed_source_words == 0 and open_job_count == 0 — the exact pre-create values"
            - "after the cancel: ReleaseTrain.${rt_id}.localization_committed_cents == 0 — the monetary shadow is released in the same call, not left behind"
            - "after the cancel: LocalizationJob.${job_id}.state == CANCELLED with cancel_reason 'locale dropped from this release', while reserved_source_words == 1200 and estimated_cost_cents == 12000 are RETAINED on the row as history"
            - "Topic.${t_id}.publication_state is still PUBLISHED — cancelling a translation never touches the source page"
