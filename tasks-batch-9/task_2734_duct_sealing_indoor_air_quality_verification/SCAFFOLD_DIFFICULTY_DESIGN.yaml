# =============================================================================
# §1.8 Scaffold Difficulty Design — Duct Sealing & Indoor Air Quality Verification
# Nine Difficulty Rules x 2 instances = 18 instances.
# Every literal in `assert:` was computed against the §1.3 formulas with
# Decimal/ROUND_HALF_UP before being written here.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: whole_house_vs_system_basis_reduction_divergence
        grounds:
          - calculations.leakage_reduction_basis
          - entities.VerificationReport.fields.reduction_pct_system_basis
          - entities.VerificationReport.fields.reduction_pct_whole_house_basis
          - entities.DuctSystem.fields.eligibility_status
        distinguishing_aspect: |
          On one identical measurement set the SYSTEM_BASIS variant reports 81.67% while the
          WHOLE_HOUSE_BASIS variant reports 49.00%, because a second ELIGIBLE duct system with a
          200.00 CFM25 baseline and no accepted POST test is charged at full baseline in the
          whole-house sums and is invisible to the system-basis ratio.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "Program with min_reduction_pct 80.00, PER_CFM basis, rate 1200 cents/CFM, cap 500000, budget 5000000"
            - "Project with conditioned_floor_area_sqft 2000, invoice_amount_cents 480000, one gas appliance"
            - "Duct system AHU-1: CLEARED screening -> ELIGIBLE, accepted PRE test 300.0 CFM at 25 Pa -> baseline 300.00"
            - "Duct system AHU-2: CLEARED screening -> ELIGIBLE, accepted PRE test 200.0 CFM at 25 Pa -> baseline 200.00, never sealed, no POST test"
            - "AHU-1 sealed to 55.0 CFM and an accepted POST test of 55.0 CFM at 25 Pa exists"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-2", total_register_count: 6, design_cfm: 800.0, duct_material: "FLEX", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds2_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/duct-systems/${ds2_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1002" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "AHU-1 baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds2_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre2_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre2_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_1", masked_register_count: 6 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre2_id}/record"
              payload: { measured_leakage_cfm: 200.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre2_id}/review"
              payload: { decision: "ACCEPT", review_note: "AHU-2 baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 12, co_ppm_air_free: 18.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { ds1_v: $.data.version }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${ds1_v}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job_id: $.data.id }
            - call: "POST /duct-sealing/seal-jobs/${job_id}/masks"
              payload: { register_labels: ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9"] }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/start-injection"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 1, elapsed_seconds: 0, instantaneous_leakage_cfm: 300.0, injection_pressure_pa: 700.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 2, elapsed_seconds: 240, instantaneous_leakage_cfm: 200.0, injection_pressure_pa: 720.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 3, elapsed_seconds: 480, instantaneous_leakage_cfm: 120.0, injection_pressure_pa: 730.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 4, elapsed_seconds: 720, instantaneous_leakage_cfm: 55.0, injection_pressure_pa: 740.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/complete-seal"
              payload: { sealant_lbs_used: 3.2 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "POST", method: "DUCT_BLASTER", window_start_at: "2026-08-02T19:00:00Z", window_end_at: "2026-08-02T20:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { post1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/record"
              payload: { measured_leakage_cfm: 55.0, ambient_temp_f: 79.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/review"
              payload: { decision: "ACCEPT", review_note: "post-seal measurement accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "GET /duct-sealing/seal-jobs/${job_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { job_v: $.data.version }
          trigger:
            - call: "POST /duct-sealing/verification-reports"
              payload: { seal_job_id: "${job_id}", post_test_id: "${post1_id}", expected_seal_job_version: "${job_v}" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { report_id: $.data.id }
          assert:
            - "HTTP 201 and VerificationReport.${report_id}.status == DRAFT"
            - "VerificationReport.${report_id}.pre_leakage_cfm25 == 300.00"
            - "VerificationReport.${report_id}.post_leakage_cfm25 == 55.00"
            - "VerificationReport.${report_id}.reduction_pct_system_basis == 81.67"
            - "VerificationReport.${report_id}.reduction_pct_whole_house_basis == 49.00"
            - "VerificationReport.${report_id}.cfm_reduced_whole_house == 245.00"
            - "VerificationReport.${report_id}.guarantee_threshold_pct == 80.00"
            - "VerificationReport.${report_id}.guarantee_met == true"
            - "reduction_pct_system_basis - reduction_pct_whole_house_basis == 32.67 (the two variants disagree on identical inputs)"

      - name: rebate_basis_per_cfm_vs_percent_of_invoice_divergence
        grounds:
          - calculations.rebate_payable_amount
          - entities.RebateClaim.fields.per_cfm_candidate_cents
          - entities.RebateClaim.fields.percent_of_invoice_candidate_cents
          - entities.RebateClaim.fields.basis_applied
          - entities.UtilityProgram.fields.rebate_basis
        distinguishing_aspect: |
          A LESSER_OF_BOTH program persists both base candidates on the same claim for one identical
          report — 294000 cents under PER_CFM and 144000 cents under PERCENT_OF_INVOICE — and selects
          the strictly smaller invoice candidate, producing payable_cents 150480 instead of the 307230
          the PER_CFM variant would have produced.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "Program with rebate_basis LESSER_OF_BOTH, rate 1200 cents/CFM, pct_of_invoice_bps 3000, cap 500000, budget 5000000, min_reduction_pct 80.00"
            - "Single-duct-system project (area 2000 sqft, invoice 480000 cents) sealed from 300.00 to 55.00 CFM25"
            - "Verification report issued: reduction_pct_system_basis 81.67, reduction_pct_whole_house_basis 81.67, cfm_reduced_whole_house 245.00"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Lesser-Of-Both Pilot", rebate_basis: "LESSER_OF_BOTH", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 12, co_ppm_air_free: 18.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { ds1_v: $.data.version }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${ds1_v}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job_id: $.data.id }
            - call: "POST /duct-sealing/seal-jobs/${job_id}/masks"
              payload: { register_labels: ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9"] }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/start-injection"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 1, elapsed_seconds: 0, instantaneous_leakage_cfm: 300.0, injection_pressure_pa: 700.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 2, elapsed_seconds: 240, instantaneous_leakage_cfm: 200.0, injection_pressure_pa: 720.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 3, elapsed_seconds: 480, instantaneous_leakage_cfm: 120.0, injection_pressure_pa: 730.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 4, elapsed_seconds: 720, instantaneous_leakage_cfm: 55.0, injection_pressure_pa: 740.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/complete-seal"
              payload: { sealant_lbs_used: 3.2 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "POST", method: "DUCT_BLASTER", window_start_at: "2026-08-02T19:00:00Z", window_end_at: "2026-08-02T20:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { post1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/record"
              payload: { measured_leakage_cfm: 55.0, ambient_temp_f: 79.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/review"
              payload: { decision: "ACCEPT", review_note: "post-seal measurement accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "POST", spillage_seconds: 8, co_ppm_air_free: 14.0, draft_pressure_pa: 2.7, worst_case_depressurization_pa: 2.8 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/seal-jobs/${job_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { job_v: $.data.version }
            - call: "POST /duct-sealing/verification-reports"
              payload: { seal_job_id: "${job_id}", post_test_id: "${post1_id}", expected_seal_job_version: "${job_v}" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { report_id: $.data.id }
            - call: "POST /duct-sealing/verification-reports/${report_id}/issue"
              payload: { signature_note: "guarantee verified" }
              as: QAVerifier
              as_user_id: "qa-1"
          trigger:
            - call: "POST /duct-sealing/rebate-claims"
              payload: { verification_report_id: "${report_id}", utility_program_id: "${prog_id}", documentation_bundle_ref: "BUNDLE-77" }
              as: ProgramAdmin
              captures: { claim_id: $.data.id }
          assert:
            - "HTTP 201 and RebateClaim.${claim_id}.status == SUBMITTED"
            - "RebateClaim.${claim_id}.per_cfm_candidate_cents == 294000"
            - "RebateClaim.${claim_id}.percent_of_invoice_candidate_cents == 144000"
            - "RebateClaim.${claim_id}.basis_applied == PERCENT_OF_INVOICE"
            - "RebateClaim.${claim_id}.tier_bonus_pct == 0.10"
            - "RebateClaim.${claim_id}.capped_subtotal_cents == 158400"
            - "RebateClaim.${claim_id}.admin_fee_cents == 7920"
            - "RebateClaim.${claim_id}.payable_cents == 150480 (the PER_CFM variant on the same report would have produced 307230)"
            - "UtilityProgram.${prog_id}.committed_rebate_cents == 150480"
            - "UtilityProgram.${prog_id}.remaining_budget_cents == 4849520"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: normalized_leakage_rounding_order_pinned
        grounds:
          - calculations.normalized_duct_leakage
          - entities.LeakageTest.fields.normalized_leakage_cfm25
          - entities.LeakageTest.fields.leakage_per_100_sqft
          - entities.Project.fields.conditioned_floor_area_sqft
        distinguishing_aspect: |
          Mode (b) — pinned intermediate rounding. leakage_per_100_sqft is derived from the ALREADY-ROUNDED
          normalized_leakage_cfm25 (85.77), giving 4.77; deriving it from the unrounded power-law result
          (85.76801420...) gives 4.76, so the two orders are observably different on this fixture.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "Project with conditioned_floor_area_sqft 1800"
            - "Duct system CLEARED -> ELIGIBLE"
            - "PRE leakage test pressurized to 50 Pa and recorded at 130.0 CFM"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { address_line: "9 Cedar Ct", conditioned_floor_area_sqft: 1800, gas_appliance_count: 0, invoice_amount_cents: 300000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 7, design_cfm: 900.0, duct_material: "SHEET_METAL", condition_grade: "A" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-3001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "PRESSURE_PAN", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
