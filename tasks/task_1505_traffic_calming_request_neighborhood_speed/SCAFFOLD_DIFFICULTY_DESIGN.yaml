  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — count threshold (signatures) vs ratio
  # threshold (ballot approval). Different metrics, different endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: petition_threshold_exact_count_flips
        grounds:
          - calculations.petition_threshold
          - state_machines.TrafficCalmingRequest.PETITION_OPEN_to_PETITION_MET
        distinguishing_aspect: |
          Metric = integer signature count on POST .../petition-signatures.
          required_signatures = ceil(10 * 0.60) = 6; at count 5 the request stays
          PETITION_OPEN, at exactly 6 (inclusive >= boundary) it flips to
          PETITION_MET.
        test_recipe:
          setup:
            - "Segment with household_count 10 (required_signatures 6); 6 residents H1..H6; request PETITION_OPEN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Holly Ave", speed_limit_mph: 30, household_count: 10, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "bp1-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "bp1-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "bp1-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R4", email: "bp1-r4@x.com", street_segment_id: "${seg}", household_ref: "H4" }, as: CityAdmin, captures: { r4: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R5", email: "bp1-r5@x.com", street_segment_id: "${seg}", household_ref: "H5" }, as: CityAdmin, captures: { r5: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R6", email: "bp1-r6@x.com", street_segment_id: "${seg}", household_ref: "H6" }, as: CityAdmin, captures: { r6: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Holly Ave", requested_budget_cents: 50000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - call: "POST /api/requests/${req}/open-petition"
              payload: {}
              as: TrafficEngineer
              captures: { reqd: $.data.required_signatures }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r4}" }
          trigger:
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r5}" }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { status5: $.data.status, count5: $.data.signature_count }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r6}" }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { status6: $.data.status, count6: $.data.signature_count }
          assert:
            - "required_signatures == 6 (ceil(10 * 0.60))"
            - "At count 5: signature_count == 5 AND status == PETITION_OPEN (threshold not met)"
            - "At count 6 (exactly == required): signature_count == 6 AND status == PETITION_MET (inclusive >= boundary)"

      - name: ballot_approval_exact_sixty_percent_grants
        grounds:
          - calculations.ballot_tally
          - state_machines.Ballot.OPEN_to_TALLIED
        distinguishing_aspect: |
          Metric = integer-ratio approval test on POST /_clock/set_current_utc
          (sweep tally) — a different metric (ratio, not count) and different
          endpoint from the petition instance. 8 households -> quorum 2; 5 votes
          cast, exactly 3 FOR: 100*3 >= 60*5 holds with equality (300 >= 300), so
          the exact-60% boundary grants consent.
        test_recipe:
          setup:
            - "Segment household_count 8 (petition needs ceil(4.8) = 5 signatures; ballot quorum ceil(2.0) = 2); 5 residents"
            - "Request driven to BALLOT_OPEN (score 60, funded, plan approved); ballot close_date 2026-08-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
