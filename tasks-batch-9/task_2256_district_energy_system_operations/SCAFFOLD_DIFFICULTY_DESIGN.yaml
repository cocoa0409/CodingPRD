              as: FieldTechnician
          trigger:
            - call: "POST /district-energy/connection-agreements/${ca1_id}/status"
              payload: { contract_state: "SUSPENDED", reason: "customer requested seasonal shutdown" }
              as: BillingAnalyst
              captures: { ca1_v_suspended: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${ca1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${ca1_v_suspended}" }
