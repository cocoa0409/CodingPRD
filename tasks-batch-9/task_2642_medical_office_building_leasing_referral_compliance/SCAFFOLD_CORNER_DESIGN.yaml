          setup:
            - "One reference Building with three 5000 sf STANDARD_EXAM suites."
            - "Incumbent: a CARDIOLOGY tenant ACTIVE on suite 210 with radius_restriction_miles 3.0 and no exclusive_use_specialty."
            - "Entrant A: a second CARDIOLOGY tenant FMV_CERTIFIED on suite 220. Entrant B: an ORTHOPEDICS tenant FMV_CERTIFIED on suite 230."
