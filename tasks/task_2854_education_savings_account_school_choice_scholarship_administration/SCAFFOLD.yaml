scenario: |
  2854. Education Savings Account & School Choice Scholarship Administration (state education savings
  account program): student eligibility determination by residency, prior enrollment and income or
  category criteria, application windows, award prioritization and waitlist ordering, participating
  provider and vendor approval with fraud screening, allowable expense catalog and purchase
  pre-approval or reimbursement flows, quarterly disbursement to accounts with unused balance
  rollover rules, misuse detection, clawback and account suspension, annual testing or portfolio
  requirements and continued-eligibility renewal, appeals and provider delisting
domain_name: education-savings-account-administration
api_prefix: "/esa"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only three read paths are nested
  # (append-only event children: eligibility-determinations, fraud-screenings,
  # clawback-entries, disbursements); every mutable entity is addressed at its own
  # top-level collection with FK fields carried in the request body.

  state_machine_shape: cyclic
  # Application: DENIED -> UNDER_APPEAL -> SUBMITTED re-enters the pipeline (bounded by
  # APPEAL_ROUND_CAP). Provider: APPROVED -> PROBATION -> APPROVED, and
  # DELISTED -> PROBATION on an overturned delisting appeal. PurchaseRequest carries two
  # independent state dimensions (approval_status x settlement_status).

  relationship_patterns:
    - one_to_many          # ProgramYear -> Application, Account -> PurchaseRequest/Disbursement
    - polymorphic          # Appeal.subject_type selects exactly one of three FK columns
    - cross_aggregate      # PurchaseRequest guards on Provider state; Account guards on MisuseCase state
    - self_referential     # Application.is_renewal chains a prior-year Application to the renewed one via RenewalReview

  role_model: segregation_of_duties
  # The ExpenseReviewer who approved a PurchaseRequest may not settle it; the AppealsOfficer
  # who authored the underlying denial may not decide the appeal against it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: ProgramYear
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Human label for the award year, e.g. "2026-27".
        constraints: non-empty, unique across ProgramYear
      - name: residency_state
        type: string
        source: input
        description: Two-letter state code a Student must reside in to be eligible for this year.
        constraints: exactly 2 uppercase letters
      - name: base_award_cents
        type: integer
        source: input
        description: Per-pupil base entitlement in cents, before income multiplier and category add-ons.
        default: 731500
        constraints: ">= 1"
      - name: total_seats
        type: integer
        source: input
        description: Hard cap on the number of Applications that may hold AWARD_OFFERED or ACCEPTED at once.
        constraints: ">= 0"
      - name: seats_committed
        type: integer
        source: computed
        description: "Count of Applications for this ProgramYear whose status IN {AWARD_OFFERED, ACCEPTED}."
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: total_seats - seats_committed; never negative.
        default: 0
      - name: rollover_cap_pct
        type: number
        source: input
        description: Fraction of Account.final_award_cents that may survive year-end close as carried balance.
        default: 0.25
        constraints: 0 <= value <= 1
      - name: admin_fee_pct
        type: number
        source: input
        description: Fraction withheld from each quarterly disbursement as program administration fee.
        default: 0.0175
        constraints: 0 <= value < 1
      - name: window_open_at
        type: datetime
        source: input
        description: Inclusive start of the application submission window (ISO 8601 UTC).
      - name: window_close_at
        type: datetime
        source: input
        description: Exclusive end of the application submission window (ISO 8601 UTC).
        constraints: must be strictly after window_open_at
      - name: term_start_date
        type: string
        source: input
        description: Inclusive first date of the instructional term, YYYY-MM-DD.
      - name: term_end_date
        type: string
        source: input
        description: Inclusive last date of the instructional term, YYYY-MM-DD.
        constraints: must be strictly after term_start_date
      - name: acceptance_deadline_days
        type: integer
        source: input
        description: Days a Guardian has to accept an AWARD_OFFERED application before it EXPIRES.
        default: 14
        constraints: ">= 1"
      - name: min_assessment_percentile
        type: integer
        source: input
        description: Minimum norm-referenced assessment percentile accepted at renewal (inclusive).
        default: 40
        constraints: 0 <= value <= 100
      - name: min_portfolio_artifacts
        type: integer
        source: input
        description: Minimum portfolio artifact count accepted at renewal (inclusive).
        default: 6
        constraints: ">= 1"
      - name: current_quarter
        type: integer
        source: system
        description: Ops-run epoch. 0 before any disbursement run; set to the run's quarter on each run.
        default: 0
        constraints: 0 <= value <= 4
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the program year.
        default: DRAFT
        constraints: "one of {DRAFT, WINDOW_OPEN, AWARDING, ACTIVE, CLOSED}"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: Opaque household grouping key used for sibling-priority bookkeeping.
        constraints: non-empty
      - name: first_name
        type: string
        source: input
        description: Student given name.
      - name: last_name
        type: string
        source: input
        description: Student family name.
      - name: date_of_birth
        type: string
        source: input
        description: YYYY-MM-DD birth date.
      - name: residency_state
        type: string
        source: input
        description: Two-letter state code where the student resides.
        constraints: exactly 2 uppercase letters
      - name: prior_enrollment
        type: enum
        source: input
        description: Prior-year schooling status used by the prior-enrollment eligibility criterion.
        constraints: "one of {PUBLIC_SCHOOL_FULL_YEAR, PUBLIC_SCHOOL_PARTIAL, PRIVATE_SCHOOL, HOMESCHOOL, ENTERING_KINDERGARTEN}"
      - name: income_band
        type: enum
        source: input
        description: Household income band of record at intake.
        constraints: "one of {BAND_A, BAND_B, BAND_C}"
      - name: category_flags
        type: array
        source: input
        description: Categorical eligibility flags asserted at intake.
        default: []
        constraints: "subset of {DISABILITY_IEP, FOSTER, MILITARY, PRIOR_PUBLIC_SCHOOL}, no duplicates"
      - name: has_enrolled_sibling
        type: boolean
        source: input
        description: True when a sibling already holds an ACCEPTED award in any ProgramYear.
        default: false

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_year_id
        type: string
        source: input
        description: FK -> ProgramYear.id; the award year this application competes in.
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student the award would follow. Guardian X-User-ID must equal this value.
      - name: status
        type: enum
        source: system
        description: Application lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ELIGIBLE, DENIED, UNDER_APPEAL, DENIED_FINAL, AWARD_OFFERED, WAITLISTED, ACCEPTED, EXPIRED, WITHDRAWN, COMPLETED}"
      - name: is_renewal
        type: boolean
        source: input
        description: True when this application was created by an approved RenewalReview or filed as a renewal.
        default: false
      - name: claimed_income_band
        type: enum
        source: input
        description: Income band asserted by the guardian on the application (may differ from the verified band).
        constraints: "one of {BAND_A, BAND_B, BAND_C}"
      - name: claimed_category_flags
        type: array
        source: input
        description: Category flags asserted by the guardian; drives the provisional award only.
        default: []
        constraints: "subset of {DISABILITY_IEP, FOSTER, MILITARY, PRIOR_PUBLIC_SCHOOL}"
      - name: provisional_award_cents
        type: integer
        source: computed
        description: Output of calculations.annual_award_amount variant provisional_claimed, stamped at submit.
        default: 0
      - name: verified_income_band
        type: enum
        source: computed
        description: Income band confirmed by the latest EligibilityDetermination; null before determination.
      - name: verified_category_flags
        type: array
        source: computed
        description: Category flags confirmed by the latest EligibilityDetermination.
        default: []
      - name: annual_award_cents
        type: integer
        source: computed
        description: Output of calculations.annual_award_amount variant final_verified, stamped at determination.
        default: 0
      - name: final_award_cents
        type: integer
        source: computed
        description: Prorated entitlement stamped at accept-award; equals annual_award_cents when quarters_remaining is 4.
        default: 0
      - name: priority_tier
        type: integer
        source: computed
        description: 1..5 award-prioritization tier assigned by the latest EligibilityDetermination; lower ranks first.
        default: 0
      - name: priority_score
        type: integer
        source: computed
        description: Output of calculations.priority_score_and_rank; higher ranks first within a tier.
        default: 0
      - name: waitlist_position
        type: integer
        source: computed
        description: 1-based position among WAITLISTED applications of the same ProgramYear; null when not WAITLISTED.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the submit transition; primary tie-break for ranking.
      - name: acceptance_deadline_at
        type: datetime
        source: computed
        description: submitted-award offer instant + ProgramYear.acceptance_deadline_days; null before AWARD_OFFERED.
      - name: appeal_round_count
        type: integer
        source: system
        description: Number of Appeals filed against denials of this application; capped by APPEAL_ROUND_CAP.
        default: 0

  - name: EligibilityDetermination
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application being adjudicated.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityOfficer who recorded this determination.
      - name: residency_check
        type: enum
        source: input
        description: Reviewer finding on the residency criterion.
        constraints: "one of {PASS, FAIL}"
      - name: prior_enrollment_check
        type: enum
        source: input
        description: Reviewer finding on the prior-enrollment criterion.
        constraints: "one of {PASS, FAIL}"
      - name: verified_income_band
        type: enum
        source: input
        description: Income band confirmed from documentation.
        constraints: "one of {BAND_A, BAND_B, BAND_C}"
      - name: verified_prior_enrollment
        type: enum
        source: input
        description: Prior-enrollment status confirmed from documentation; feeds priority tier 3.
        constraints: "one of {PUBLIC_SCHOOL_FULL_YEAR, PUBLIC_SCHOOL_PARTIAL, PRIVATE_SCHOOL, HOMESCHOOL, ENTERING_KINDERGARTEN}"
      - name: verified_category_flags
        type: array
        source: input
        description: Category flags confirmed from documentation.
        constraints: "subset of {DISABILITY_IEP, FOSTER, MILITARY, PRIOR_PUBLIC_SCHOOL}"
      - name: outcome
        type: enum
        source: computed
        description: ELIGIBLE when both checks PASS and the income-or-category criterion is met, else INELIGIBLE.
        constraints: "one of {ELIGIBLE, INELIGIBLE}"
      - name: denial_reason_code
        type: enum
        source: computed
        description: Which criterion failed; null when outcome is ELIGIBLE.
        constraints: "one of {RESIDENCY, PRIOR_ENROLLMENT, INCOME_OR_CATEGORY, null}"
      - name: priority_tier
        type: integer
        source: computed
        description: Tier assigned by the first-match tier ladder in calculations.priority_score_and_rank.
      - name: priority_score
        type: integer
        source: computed
        description: Weighted priority score computed from the verified attributes.
      - name: annual_award_cents
        type: integer
        source: computed
        description: annual_award_amount variant final_verified evaluated against the verified attributes.
      - name: round_number
        type: integer
        source: computed
        description: 1 for the first determination on this application; increments on each post-appeal re-determination.

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the accepted award that funds this account.
      - name: program_year_id
        type: string
        source: input
        description: FK -> ProgramYear.id; denormalized from the application for disbursement-run scoping.
      - name: status
        type: enum
        source: system
        description: Account lifecycle state; SUSPENDED blocks every debit and credit operation.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: final_award_cents
        type: integer
        source: computed
        description: Prorated annual entitlement copied from Application.final_award_cents at acceptance.
        default: 0
      - name: quarters_remaining_at_award
        type: integer
        source: computed
        description: Number of quarterly disbursements this account is scheduled to receive (1..4).
        default: 4
      - name: rollover_in_cents
        type: integer
        source: computed
        description: Carried balance transferred in from a prior-year Account at renewal acceptance.
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: Unencumbered spendable funds.
        default: 0
      - name: encumbered_cents
        type: integer
        source: computed
        description: Funds held against APPROVED but unsettled PurchaseRequests.
        default: 0
      - name: lifetime_disbursed_cents
        type: integer
        source: computed
        description: Sum of Disbursement.gross_amount_cents for this account.
        default: 0
      - name: lifetime_admin_fee_cents
        type: integer
        source: computed
        description: Sum of Disbursement.admin_fee_cents withheld from this account.
        default: 0
      - name: lifetime_spent_cents
        type: integer
        source: computed
        description: Sum of PurchaseRequest.paid_amount_cents settled from this account, net of reversals.
        default: 0
      - name: lifetime_clawed_back_cents
        type: integer
        source: computed
        description: Sum of ClawbackEntry.amount_cents of entry_type ACCOUNT_DEBIT minus entry_type REVERSAL.
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: Unused balance above the rollover cap surrendered at year-end close.
        default: 0
      - name: rolled_out_cents
        type: integer
        source: computed
        description: Carried balance transferred out to a next-year Account at renewal acceptance.
        default: 0
      - name: rollover_carried_cents
        type: integer
        source: computed
        description: Balance that survived year-end close and is eligible to transfer at renewal.
        default: 0
      - name: disbursement_count
        type: integer
        source: computed
        description: Number of Disbursement rows issued to this account.
        default: 0
      - name: suspension_reason
        type: string
        source: computed
        description: Free text recorded when the account entered SUSPENDED; null while ACTIVE.

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the participating provider or vendor.
      - name: ein
        type: string
        source: input
        description: Employer identification number; unique across Provider.
        constraints: 9 digits, unique
      - name: address_state
        type: string
        source: input
        description: Two-letter state code of the provider's principal address.
      - name: provider_type
        type: enum
        source: input
        description: Category of participating vendor.
        constraints: "one of {SCHOOL, TUTOR, THERAPY, CURRICULUM_VENDOR, TRANSPORT}"
      - name: status
        type: enum
        source: system
        description: Participation state; only APPROVED and PROBATION may receive purchases.
        default: DRAFT
        constraints: "one of {DRAFT, SCREENED, APPROVED, PROBATION, DELISTED, PERMANENTLY_BARRED}"
      - name: authorized_category_codes
        type: array
        source: computed
        description: ExpenseCategory.code values this provider may bill, pinned at approve time.
        default: []
      - name: screening_score
        type: integer
        source: computed
        description: Output of calculations.provider_risk_score variant screening_static, 0..100.
        default: 0
      - name: screening_flags
        type: array
        source: computed
        description: Flags recorded by the latest FraudScreening.
        default: []
      - name: screened_at
        type: datetime
        source: computed
        description: Logical-clock instant of the latest FraudScreening; null before screening.
      - name: surveillance_score
        type: integer
        source: computed
        description: Output of calculations.provider_risk_score variant surveillance_decayed, 0..100.
        default: 0
      - name: substantiated_case_count
        type: integer
        source: computed
        description: Count of MisuseCases naming a PurchaseRequest of this provider that reached SUBSTANTIATED.
        default: 0
      - name: sanction_reason
        type: string
        source: computed
        description: Reason recorded by the most recent sanction or auto-sanction; null when never sanctioned.

  - name: FraudScreening
    parent: null
    common_fields: false
    fields:
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; the provider that was screened.
      - name: flags
        type: array
        source: input
        description: Screening flags detected by the vendor-integrity check.
        constraints: "subset of {NO_STATE_REGISTRATION, ADDRESS_MISMATCH, PRIOR_DELISTING, OFAC_HIT, NEW_ENTITY_UNDER_12_MONTHS, SHARED_BANK_ACCOUNT}, no duplicates"
      - name: screening_score
        type: integer
        source: computed
        description: Weighted flag total capped at 100.
      - name: recommended_status
        type: enum
        source: computed
        description: APPROVE below 40, PROBATION at 40..59, REJECT at 60 and above.
        constraints: "one of {APPROVE, PROBATION, REJECT}"
      - name: screened_by_user_id
        type: string
        source: system
        description: X-User-ID of the VendorScreener who ran the screening.
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant at which the screening was recorded.

  - name: ExpenseCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable catalog code, e.g. "TUITION"; unique across ExpenseCategory.
        constraints: uppercase snake, unique
      - name: name
        type: string
        source: input
        description: Display name of the allowable expense category.
      - name: allowable
        type: boolean
        source: input
        description: False marks the code as catalogued-but-disallowed; purchases against it are rejected.
        default: true
      - name: requires_preapproval
        type: boolean
        source: input
        description: True forbids the REIMBURSEMENT flow for this category.
        default: true
      - name: per_year_cap_cents
        type: integer
        source: input
        description: Per-account per-ProgramYear ceiling on encumbered plus settled spend in this category.
        constraints: ">= 1"
      - name: requires_service_period
        type: boolean
        source: input
        description: True enforces the half-open service-interval non-overlap rule for this category.
        default: false

  - name: PurchaseRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the ESA account the expense draws on.
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; the vendor to be paid. Provider X-User-ID must equal this value to claim.
      - name: expense_category_id
        type: string
        source: input
        description: FK -> ExpenseCategory.id; the catalog line the expense is charged to.
      - name: flow
        type: enum
        source: input
        description: PREAPPROVAL requests a decision before service; REIMBURSEMENT attaches an invoice for service already rendered.
        constraints: "one of {PREAPPROVAL, REIMBURSEMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Requested (and maximum billable) amount in cents.
        constraints: ">= 1"
      - name: service_start_at
        type: datetime
        source: input
        description: Inclusive start of the service interval.
      - name: service_end_at
        type: datetime
        source: input
        description: Exclusive end of the service interval.
        constraints: must be strictly after service_start_at
      - name: invoice_reference
        type: string
        source: input
        description: Vendor invoice identifier; required for the REIMBURSEMENT flow, optional at PREAPPROVAL creation.
        default: null
      - name: approval_status
        type: enum
        source: system
        description: First independent state dimension - pre-approval track.
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, APPROVED, DENIED, VOID}"
      - name: settlement_status
        type: enum
        source: system
        description: Second independent state dimension - money track.
        default: UNSETTLED
        constraints: "one of {UNSETTLED, CLAIMED, PAID, REVERSED, CANCELLED}"
      - name: claimed_amount_cents
        type: integer
        source: computed
        description: Amount invoiced by the provider; null before a claim.
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Amount actually debited at settlement; null before settlement.
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ExpenseReviewer who approved; drives the segregation-of-duties check at settle.
      - name: settled_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ExpenseReviewer who settled; null before settlement.
      - name: decision_reason
        type: string
        source: computed
        description: Reviewer note recorded on the latest approval-track decision.
      - name: flagged_rule
        type: enum
        source: computed
        description: Detection rule that fired at settlement; null when nothing fired.
        constraints: "one of {DUPLICATE_INVOICE, null}"

  - name: Disbursement
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the credited account.
      - name: program_year_id
        type: string
        source: input
        description: FK -> ProgramYear.id; the year whose disbursement run issued this row.
      - name: quarter
        type: integer
        source: computed
        description: Quarter index 1..4 of the issuing run.
      - name: quarters_left_at_issue
        type: integer
        source: computed
        description: Scheduled quarters minus already-issued disbursements at the moment of issue.
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Entitlement slice before the administration fee.
      - name: remainder_applied_cents
        type: integer
        source: computed
        description: Indivisible remainder cents folded into this (the account's first) disbursement; 0 otherwise.
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administration fee withheld from this slice, rounded per disbursement.
      - name: net_credited_cents
        type: integer
        source: computed
        description: gross_amount_cents - admin_fee_cents; the amount added to Account.balance_cents.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the disbursement run.

  - name: MisuseCase
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the account under investigation.
      - name: purchase_request_id
        type: string
        source: input
        description: FK -> PurchaseRequest.id; the implicated purchase, null for account-level cases.
      - name: detection_rule
        type: enum
        source: input
        description: Which misuse-detection rule the case rests on.
        constraints: "one of {DUPLICATE_INVOICE, NON_ALLOWABLE_EXPENSE, PROVIDER_COLLUSION, FALSIFIED_ENROLLMENT, CAP_CIRCUMVENTION}"
      - name: disallowed_principal_cents
        type: integer
        source: input
        description: Principal amount alleged to be misused; the sole input to the penalty-tier selection.
        constraints: ">= 1"
      - name: narrative
        type: string
        source: input
        description: Investigator narrative.
      - name: status
        type: enum
        source: system
        description: Case lifecycle state.
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, SUBSTANTIATED, DISMISSED, CLAWBACK_ISSUED, UNDER_APPEAL, RESOLVED, REVERSED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the opener, or the literal "system" when auto-opened by detection.
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID that moved the case to UNDER_REVIEW; null before then.
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: X-User-ID that substantiated or dismissed the case; null before adjudication.
      - name: penalty_rate
        type: number
        source: computed
        description: Penalty rate selected from disallowed_principal_cents; null before clawback issuance.
      - name: penalty_cents
        type: integer
        source: computed
        description: Rounded penalty component of the clawback; null before clawback issuance.
      - name: clawback_total_cents
        type: integer
        source: computed
        description: disallowed_principal_cents + penalty_cents; null before clawback issuance.
      - name: account_debit_cents
        type: integer
        source: computed
        description: Portion of the clawback actually recovered from Account.balance_cents.
      - name: receivable_cents
        type: integer
        source: computed
        description: Unrecovered remainder of the clawback held as a receivable outside the account identity.
      - name: auto_opened
        type: boolean
        source: computed
        description: True when opened by settlement-time detection rather than by a ComplianceOfficer.
        default: false

  - name: ClawbackEntry
    parent: null
    common_fields: false
    fields:
      - name: misuse_case_id
        type: string
        source: input
        description: FK -> MisuseCase.id; the case that produced this ledger row.
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the account the row debits, credits, or records a receivable against.
      - name: entry_type
        type: enum
        source: computed
        description: ACCOUNT_DEBIT recovers from balance, RECEIVABLE records the shortfall, REVERSAL undoes a debit.
        constraints: "one of {ACCOUNT_DEBIT, RECEIVABLE, REVERSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: Absolute cents moved or recorded by this row.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that caused the row, or "system" for cascaded reversals.

  - name: RenewalReview
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the current-year account seeking continued eligibility.
      - name: next_program_year_id
        type: string
        source: input
        description: FK -> ProgramYear.id; the year the renewal would fund.
      - name: assessment_type
        type: enum
        source: input
        description: Which annual-testing evidence route the family elected.
        constraints: "one of {NORM_REFERENCED_TEST, PORTFOLIO}"
      - name: assessment_score
        type: integer
        source: input
        description: Norm-referenced percentile; required when assessment_type is NORM_REFERENCED_TEST.
        constraints: 0 <= value <= 100
      - name: portfolio_artifact_count
        type: integer
        source: input
        description: Count of submitted portfolio artifacts; required when assessment_type is PORTFOLIO, otherwise omitted.
        default: null
        constraints: ">= 0"
      - name: residency_state_attested
        type: string
        source: input
        description: Re-attested residency state for the next year.
        constraints: exactly 2 uppercase letters
      - name: status
        type: enum
        source: system
        description: Review lifecycle state; SUPERSEDED is set when a newer review is filed for the same application.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED, SUPERSEDED}"
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the EligibilityOfficer who decided; null while SUBMITTED.
      - name: renewed_application_id
        type: string
        source: computed
        description: Id of the Application minted on approval; discoverable via GET /esa/applications with student_id filter. Null unless status is APPROVED.
      - name: decision_note
        type: string
        source: computed
        description: Free-text note recorded with the decision.

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: subject_type
        type: enum
        source: input
        description: Selects which one of the three subject FK columns must be populated.
        constraints: "one of {APPLICATION_DENIAL, CLAWBACK, PROVIDER_DELISTING}"
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; required when subject_type is APPLICATION_DENIAL, otherwise must be null.
      - name: misuse_case_id
        type: string
        source: input
        description: FK -> MisuseCase.id; required when subject_type is CLAWBACK, otherwise must be null.
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; required when subject_type is PROVIDER_DELISTING, otherwise must be null.
      - name: grounds
        type: string
        source: input
        description: Appellant's stated grounds.
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle state.
        default: FILED
        constraints: "one of {FILED, UPHELD, OVERTURNED}"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Guardian or Provider that filed.
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the AppealsOfficer that decided; null while FILED.
      - name: rationale
        type: string
        source: computed
        description: Decision rationale recorded by the AppealsOfficer.
      - name: round_number
        type: integer
        source: computed
        description: 1-based ordinal of this appeal among appeals against the same subject.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: ProgramYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: WINDOW_OPEN
        trigger: "POST /esa/program-years/{id}/open-window"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT, else ERR_INVALID_STATE_TRANSITION"
          - "total_seats >= 0 (guaranteed by input constraint)"
        side_effects:
          - "seats_committed set to 0 and seats_available set to total_seats"
          - "increments ProgramYear.version by 1"
        note: "Submissions are additionally clock-gated to [window_open_at, window_close_at)."

      - from: WINDOW_OPEN
        to: AWARDING
        trigger: "POST /esa/program-years/{id}/awarding-runs"
        actor: ProgramAdmin
        preconditions:
          - "status == WINDOW_OPEN, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "no Application may be submitted from this point on: every later POST /esa/applications/{id}/submit fails ERR_APPLICATION_WINDOW_CLOSED because status != WINDOW_OPEN"
          - "increments ProgramYear.version by 1"
        note: "AWARDING is a transient state entered and left inside the same request."

      - from: AWARDING
        to: ACTIVE
        trigger: "system: same POST /esa/program-years/{id}/awarding-runs request, after allocation completes"
        actor: system
        preconditions:
          - "status == AWARDING"
        side_effects:
          - "candidate set = Applications with program_year_id == this year AND status == ELIGIBLE, ranked by calculations.priority_score_and_rank"
          - "the first seats_available candidates in rank order move ELIGIBLE -> AWARD_OFFERED and each stamps acceptance_deadline_at = clock_now + acceptance_deadline_days days"
          - "every remaining candidate moves ELIGIBLE -> WAITLISTED and receives waitlist_position 1,2,3,... in the same rank order"
          - "seats_committed = count of Applications in {AWARD_OFFERED, ACCEPTED}; seats_available = total_seats - seats_committed"
          - "empty candidate set is legal: awarded_count 0, waitlisted_count 0, status still becomes ACTIVE"
          - "increments ProgramYear.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /esa/program-years/{id}/disbursement-runs"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE, else ERR_PROGRAM_YEAR_NOT_ACTIVE"
          - "quarter == current_quarter + 1, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "current_quarter = quarter (ops-run epoch advance)"
          - "expiry pass runs first: every Application with status == AWARD_OFFERED and acceptance_deadline_at <= clock_now moves AWARD_OFFERED -> EXPIRED; that expiry itself decrements seats_committed, which itself promotes the WAITLISTED application with the lowest waitlist_position to AWARD_OFFERED"
          - "credit pass: for each Account with program_year_id == this year AND status == ACTIVE AND disbursement_count < quarters_remaining_at_award, appends one Disbursement per calculations.quarterly_disbursement_slice and credits net_credited_cents to Account.balance_cents"
          - "Accounts with status IN {SUSPENDED, CLOSED} or with disbursement_count == quarters_remaining_at_award are listed in skipped_account_ids and receive nothing"
          - "increments ProgramYear.version by 1 and each credited Account.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /esa/program-years/{id}/year-end-close"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE, else ERR_PROGRAM_YEAR_NOT_ACTIVE"
        side_effects:
          - "for each Account with program_year_id == this year AND status == ACTIVE: applies calculations.unused_balance_rollover, setting rollover_carried_cents, forfeited_cents and balance_cents"
          - "each such Account's Application moves ACCEPTED -> COMPLETED"
          - "every MisuseCase whose account_id belongs to this year AND status == CLAWBACK_ISSUED moves CLAWBACK_ISSUED -> RESOLVED"
          - "increments ProgramYear.version by 1 and each touched Account.version by 1"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [DENIED_FINAL, EXPIRED, WITHDRAWN, COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /esa/applications/{id}/submit"
        actor: Guardian
        preconditions:
          - "status == DRAFT, else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID == Application.student_id, else ERR_NOT_ACCOUNT_HOLDER"
          - "ProgramYear.status == WINDOW_OPEN AND window_open_at <= clock_now < window_close_at, else ERR_APPLICATION_WINDOW_CLOSED"
        side_effects:
          - "submitted_at = clock_now"
          - "provisional_award_cents = calculations.annual_award_amount variant provisional_claimed"
          - "increments Application.version by 1"

      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /esa/applications/{id}/eligibility-determinations with residency_check PASS, prior_enrollment_check PASS and the income-or-category criterion met (verified_income_band IN {BAND_A, BAND_B} OR verified_category_flags is non-empty)"
        actor: EligibilityOfficer
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
          - "ProgramYear.status IN {WINDOW_OPEN, AWARDING}, else ERR_PROGRAM_YEAR_NOT_ACTIVE"
        side_effects:
          - "appends an EligibilityDetermination with outcome ELIGIBLE, round_number = prior determination count + 1"
          - "verified_income_band, verified_category_flags, priority_tier, priority_score and annual_award_cents copied from the determination"
          - "increments Application.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /esa/applications/{id}/eligibility-determinations with any criterion failing: residency_check FAIL, or prior_enrollment_check FAIL, or (verified_income_band == BAND_C AND verified_category_flags is empty)"
        actor: EligibilityOfficer
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "appends an EligibilityDetermination with outcome INELIGIBLE and denial_reason_code fixed by first-match order: RESIDENCY when residency_check == FAIL, else PRIOR_ENROLLMENT when prior_enrollment_check == FAIL, else INCOME_OR_CATEGORY"
          - "verified_prior_enrollment is still recorded on the determination for the audit trail"
          - "annual_award_cents stays 0; priority_tier and priority_score stay 0"
          - "increments Application.version by 1"

      - from: ELIGIBLE
        to: AWARD_OFFERED
        trigger: "system: awarding run allocation pass, rank position <= seats_available"
        actor: system
        preconditions:
          - "status == ELIGIBLE"
          - "ProgramYear.seats_available > 0 at the moment this candidate is drawn"
        side_effects:
          - "acceptance_deadline_at = clock_now + ProgramYear.acceptance_deadline_days days"
          - "ProgramYear.seats_committed += 1 and seats_available -= 1"
          - "increments Application.version by 1"

      - from: ELIGIBLE
        to: WAITLISTED
        trigger: "system: awarding run allocation pass, rank position > seats_available"
        actor: system
        preconditions:
          - "status == ELIGIBLE"
          - "ProgramYear.seats_available == 0 at the moment this candidate is drawn"
        side_effects:
          - "waitlist_position = 1 + count of applications already WAITLISTED by this run"
          - "increments Application.version by 1"

      - from: WAITLISTED
        to: AWARD_OFFERED
        trigger: "system: promotion cascade after a seat is released by a withdraw, an expiry, or a renewal seat release"
        actor: system
        preconditions:
          - "status == WAITLISTED AND waitlist_position is the minimum among WAITLISTED applications of this ProgramYear"
          - "ProgramYear.seats_available >= 1"
        side_effects:
          - "waitlist_position set to null; acceptance_deadline_at = clock_now + ProgramYear.acceptance_deadline_days days"
          - "ProgramYear.seats_committed += 1 and seats_available -= 1"
          - "remaining WAITLISTED applications keep their existing waitlist_position values (no renumbering)"
          - "increments Application.version by 1"

      - from: AWARD_OFFERED
        to: ACCEPTED
        trigger: "POST /esa/applications/{id}/accept-award"
        actor: Guardian
        preconditions:
          - "status == AWARD_OFFERED, else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID == Application.student_id, else ERR_NOT_ACCOUNT_HOLDER"
          - "clock_now < acceptance_deadline_at, else ERR_INVALID_STATE_TRANSITION"
          - "ProgramYear.status == ACTIVE, else ERR_PROGRAM_YEAR_NOT_ACTIVE"
          - "ProgramYear.current_quarter <= 3, else ERR_INVALID_STATE_TRANSITION (no quarters left to fund)"
        side_effects:
          - "final_award_cents = calculations.annual_award_amount variant final_verified with quarters_remaining = 4 - ProgramYear.current_quarter"
          - "creates one Account with status ACTIVE, final_award_cents copied, quarters_remaining_at_award = 4 - ProgramYear.current_quarter, balance_cents 0"
          - "when this Application.is_renewal is true and a RenewalReview with renewed_application_id == this Application exists, the prior Account named by that review moves ACTIVE -> CLOSED, its rollover_carried_cents becomes the new Account.rollover_in_cents, prior.rolled_out_cents += that amount and prior.balance_cents -= that amount"
          - "increments Application.version by 1"

      - from: AWARD_OFFERED
        to: EXPIRED
        trigger: "system: disbursement-run expiry pass when acceptance_deadline_at <= clock_now"
        actor: system
        preconditions:
          - "status == AWARD_OFFERED AND acceptance_deadline_at <= clock_now"
        side_effects:
          - "ProgramYear.seats_committed -= 1 and seats_available += 1; that release itself promotes the lowest-waitlist_position WAITLISTED application to AWARD_OFFERED when one exists"
          - "increments Application.version by 1"

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /esa/applications/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "status == ACCEPTED, else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID == Application.student_id, else ERR_NOT_ACCOUNT_HOLDER"
        side_effects:
          - "the Account with application_id == this Application moves to CLOSED; its balance_cents and encumbered_cents are left untouched (audit trail)"
          - "that Account closure itself voids every PurchaseRequest of the account with approval_status IN {PENDING_REVIEW, APPROVED}: approval_status -> VOID and settlement_status -> CANCELLED"
          - "ProgramYear.seats_committed -= 1 and seats_available += 1; that release itself promotes the lowest-waitlist_position WAITLISTED application to AWARD_OFFERED when one exists, which itself re-decrements seats_available"
          - "increments Application.version, Account.version and ProgramYear.version by 1 each"

      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /esa/appeals with subject_type APPLICATION_DENIAL"
        actor: Guardian
        preconditions:
          - "status == DENIED, else ERR_INVALID_STATE_TRANSITION"
          - "appeal_round_count < APPEAL_ROUND_CAP (2), else ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "appeal_round_count += 1"
          - "creates one Appeal with status FILED and round_number = appeal_round_count"
          - "increments Application.version by 1"

      - from: UNDER_APPEAL
        to: SUBMITTED
        trigger: "POST /esa/appeals/{id}/decision with decision OVERTURNED"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_APPEAL AND Appeal.status == FILED AND Appeal.subject_type == APPLICATION_DENIAL"
          - "X-User-ID != the decided_by_user_id of the latest EligibilityDetermination on this Application, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "the application re-enters the pipeline at SUBMITTED so a fresh EligibilityDetermination can be recorded (round_number increments)"
          - "verified_income_band, verified_category_flags, annual_award_cents, priority_tier and priority_score are reset to their defaults"
          - "increments Application.version by 1"
        note: "This is the cycle: DENIED -> UNDER_APPEAL -> SUBMITTED -> DENIED is reachable twice before the cap bites."

      - from: UNDER_APPEAL
        to: DENIED_FINAL
        trigger: "POST /esa/appeals/{id}/decision with decision UPHELD"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_APPEAL AND Appeal.status == FILED AND Appeal.subject_type == APPLICATION_DENIAL"
        side_effects:
          - "terminal: no further transition is possible and any later POST /esa/appeals naming it fails ERR_INVALID_STATE_TRANSITION"
          - "increments Application.version by 1"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "system: POST /esa/program-years/{id}/year-end-close"
        actor: system
        preconditions:
          - "status == ACCEPTED AND ProgramYear.status == ACTIVE at the start of the close"
        side_effects:
          - "increments Application.version by 1"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /esa/accounts/{id}/status-actions with action SUSPEND, or system cascade from MisuseCase UNDER_REVIEW -> SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "suspension_reason recorded"
          - "this suspension itself voids every PurchaseRequest of this account with approval_status IN {PENDING_REVIEW, APPROVED}: approval_status -> VOID, settlement_status -> CANCELLED"
          - "each voided request that was APPROVED itself releases its hold: Account.encumbered_cents -= amount_cents and Account.balance_cents += amount_cents"
          - "the account is excluded from every later disbursement run while SUSPENDED (listed in skipped_account_ids)"
          - "increments Account.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /esa/accounts/{id}/status-actions with action REINSTATE, or system cascade from an OVERTURNED clawback appeal"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUSPENDED, else ERR_INVALID_STATE_TRANSITION"
          - "every MisuseCase with account_id == this Account has status IN {DISMISSED, RESOLVED, REVERSED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "suspension_reason set to null"
          - "voided PurchaseRequests are NOT revived; the guardian must file new ones"
          - "increments Account.version by 1"
        note: "Cross-entity guard: Account reinstatement depends on MisuseCase state, not on Account state alone."

      - from: ACTIVE
        to: CLOSED
        trigger: "system cascade from Application ACCEPTED -> WITHDRAWN, or from renewal acceptance transferring the carried balance"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "no further disbursement, purchase, or clawback operation is accepted; every write returns ERR_INVALID_STATE_TRANSITION"
          - "increments Account.version by 1"

      - from: SUSPENDED
        to: CLOSED
        trigger: "system cascade from Application ACCEPTED -> WITHDRAWN"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "increments Account.version by 1"

  - entity: Provider
    initial_state: DRAFT
    terminal_states: [PERMANENTLY_BARRED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /esa/providers/{id}/fraud-screenings"
        actor: VendorScreener
        preconditions:
          - "status IN {DRAFT, SCREENED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "appends a FraudScreening; screening_score, screening_flags and screened_at copied onto the Provider"
          - "surveillance_score set equal to screening_score (0 substantiated cases, 0 months of decay)"
          - "increments Provider.version by 1"

      - from: SCREENED
        to: APPROVED
        trigger: "POST /esa/providers/{id}/approve with screening_score < 40"
        actor: VendorScreener
        preconditions:
          - "status == SCREENED, else ERR_INVALID_STATE_TRANSITION"
          - "screening_score < 60, else ERR_FRAUD_RISK_TOO_HIGH"
          - "every code in authorized_category_codes matches an existing ExpenseCategory.code, else ERR_EXPENSE_CATEGORY_NOT_FOUND"
        side_effects:
          - "authorized_category_codes pinned from the request"
          - "increments Provider.version by 1"

      - from: SCREENED
        to: PROBATION
        trigger: "POST /esa/providers/{id}/approve with 40 <= screening_score < 60"
        actor: VendorScreener
        preconditions:
          - "status == SCREENED"
          - "screening_score < 60, else ERR_FRAUD_RISK_TOO_HIGH"
        side_effects:
          - "authorized_category_codes pinned from the request; sanction_reason set to \"ELEVATED_SCREENING_SCORE\""
          - "PROBATION providers may only be used with flow PREAPPROVAL; REIMBURSEMENT purchases naming them fail ERR_PROVIDER_NOT_ELIGIBLE"
          - "increments Provider.version by 1"
        note: "Branching fork: the same approve request lands in APPROVED or PROBATION with different side-effect sets, selected purely by the screening score band."

      - from: APPROVED
        to: PROBATION
        trigger: "POST /esa/providers/{id}/sanctions with action PROBATION, or system cascade when surveillance_score >= 75 and < 90"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPROVED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "sanction_reason recorded"
          - "increments Provider.version by 1"

      - from: PROBATION
        to: APPROVED
        trigger: "POST /esa/providers/{id}/sanctions with action REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "status == PROBATION, else ERR_INVALID_STATE_TRANSITION"
          - "surveillance_score < 75, else ERR_FRAUD_RISK_TOO_HIGH"
        side_effects:
          - "sanction_reason set to null"
          - "increments Provider.version by 1"
        note: "This closes the cycle APPROVED -> PROBATION -> APPROVED."

      - from: APPROVED
        to: DELISTED
        trigger: "POST /esa/providers/{id}/sanctions with action DELIST, or system cascade when surveillance_score >= 90"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {APPROVED, PROBATION}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "sanction_reason recorded"
          - "the delisting itself voids every PurchaseRequest with provider_id == this Provider and approval_status IN {PENDING_REVIEW, APPROVED}: approval_status -> VOID, settlement_status -> CANCELLED"
          - "each voided request that was APPROVED itself releases its hold on its own Account: encumbered_cents -= amount_cents and balance_cents += amount_cents"
          - "increments Provider.version by 1 and each touched Account.version by 1"

      - from: PROBATION
        to: DELISTED
        trigger: "POST /esa/providers/{id}/sanctions with action DELIST, or system cascade when surveillance_score >= 90"
        actor: ComplianceOfficer
        preconditions:
          - "status == PROBATION"
        side_effects:
          - "identical cascade to APPROVED -> DELISTED"
          - "increments Provider.version by 1"

      - from: DELISTED
        to: PROBATION
        trigger: "POST /esa/appeals/{id}/decision with decision OVERTURNED on an Appeal with subject_type PROVIDER_DELISTING"
        actor: AppealsOfficer
        preconditions:
          - "status == DELISTED AND Appeal.status == FILED"
        side_effects:
          - "sanction_reason set to \"DELISTING_OVERTURNED_ON_APPEAL\"; previously voided PurchaseRequests are NOT revived"
          - "increments Provider.version by 1"
        note: "Second cycle: a delisted provider can re-enter participation through appeal."

      - from: DELISTED
        to: PERMANENTLY_BARRED
        trigger: "POST /esa/appeals/{id}/decision with decision UPHELD on an Appeal with subject_type PROVIDER_DELISTING"
        actor: AppealsOfficer
        preconditions:
          - "status == DELISTED AND Appeal.status == FILED"
        side_effects:
          - "terminal: every later sanction or approve request returns ERR_INVALID_STATE_TRANSITION"
          - "increments Provider.version by 1"

  - entity: PurchaseRequest
    initial_state: "APPROVAL:PENDING_REVIEW + SETTLEMENT:UNSETTLED"
    terminal_states: ["APPROVAL:DENIED", "APPROVAL:VOID", "SETTLEMENT:CANCELLED", "SETTLEMENT:REVERSED"]
    transitions:
      - from: "APPROVAL:PENDING_REVIEW"
        to: "APPROVAL:APPROVED"
        trigger: "POST /esa/purchase-requests/{id}/decision with decision APPROVED"
        actor: ExpenseReviewer
        preconditions:
          - "approval_status == PENDING_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "Account.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
          - "Provider.status == APPROVED for flow REIMBURSEMENT, or Provider.status IN {APPROVED, PROBATION} for flow PREAPPROVAL, else ERR_PROVIDER_NOT_ELIGIBLE"
          - "ExpenseCategory.code IN Provider.authorized_category_codes, else ERR_CATEGORY_NOT_AUTHORIZED"
          - "amount_cents <= Account.balance_cents, else ERR_INSUFFICIENT_BALANCE"
        side_effects:
          - "approved_by_user_id = X-User-ID; decision_reason recorded"
          - "Account.balance_cents -= amount_cents and Account.encumbered_cents += amount_cents (hold placed)"
          - "when flow == REIMBURSEMENT and settlement_status == CLAIMED, this approval itself advances the settlement dimension CLAIMED -> PAID in the same request, applying the settle side effects below"
          - "increments PurchaseRequest.version and Account.version by 1 each"
        note: "Cross-entity guard on Provider.status - the two entities are different aggregates."

      - from: "APPROVAL:PENDING_REVIEW"
        to: "APPROVAL:DENIED"
        trigger: "POST /esa/purchase-requests/{id}/decision with decision DENIED"
        actor: ExpenseReviewer
        preconditions:
          - "approval_status == PENDING_REVIEW, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "settlement_status -> CANCELLED (the money track is closed with the approval track)"
          - "no funds move; Account.balance_cents and encumbered_cents unchanged"
          - "increments PurchaseRequest.version by 1"

      - from: "APPROVAL:APPROVED"
        to: "APPROVAL:VOID"
        trigger: "POST /esa/purchase-requests/{id}/decision with decision VOID, or a system cascade from Account suspension, Account closure, or Provider delisting"
        actor: ExpenseReviewer
        preconditions:
          - "approval_status == APPROVED, else ERR_INVALID_STATE_TRANSITION"
          - "settlement_status IN {UNSETTLED, CLAIMED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "settlement_status -> CANCELLED"
          - "Account.encumbered_cents -= amount_cents and Account.balance_cents += amount_cents (hold released, exact compensation of the approval)"
          - "increments PurchaseRequest.version and Account.version by 1 each"

      - from: "APPROVAL:PENDING_REVIEW"
        to: "APPROVAL:VOID"
        trigger: "system cascade from Account suspension, Account closure, or Provider delisting"
        actor: system
        preconditions:
          - "approval_status == PENDING_REVIEW"
        side_effects:
          - "settlement_status -> CANCELLED; no funds move because no hold was ever placed"
          - "increments PurchaseRequest.version by 1"

      - from: "SETTLEMENT:UNSETTLED"
        to: "SETTLEMENT:CLAIMED"
        trigger: "POST /esa/purchase-requests/{id}/claim"
        actor: Provider
        preconditions:
          - "settlement_status == UNSETTLED, else ERR_INVALID_STATE_TRANSITION"
          - "approval_status IN {PENDING_REVIEW, APPROVED} (the approval dimension is NOT required to have advanced), else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID == PurchaseRequest.provider_id, else ERR_NOT_ASSIGNED_PROVIDER"
          - "1 <= claimed_amount_cents <= amount_cents, else ERR_CLAIM_AMOUNT_MISMATCH"
        side_effects:
          - "claimed_amount_cents and invoice_reference recorded"
          - "increments PurchaseRequest.version by 1"
        note: "Parallel dimensions: a provider may claim while the approval track is still PENDING_REVIEW; the two dimensions advance independently."

      - from: "SETTLEMENT:CLAIMED"
        to: "SETTLEMENT:PAID"
        trigger: "POST /esa/purchase-requests/{id}/settle"
        actor: ExpenseReviewer
        preconditions:
          - "settlement_status == CLAIMED, else ERR_INVALID_STATE_TRANSITION"
          - "approval_status == APPROVED, else ERR_INVALID_STATE_TRANSITION (cross-dimension guard)"
          - "Account.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
          - "X-User-ID != approved_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Provider.status IN {APPROVED, PROBATION}, else ERR_PROVIDER_NOT_ELIGIBLE"
          - "ExpenseCategory.code IN Provider.authorized_category_codes (re-validated at settle), else ERR_CATEGORY_NOT_AUTHORIZED"
        side_effects:
          - "paid_amount_cents = claimed_amount_cents; settled_by_user_id = X-User-ID"
          - "Account.encumbered_cents -= amount_cents; Account.lifetime_spent_cents += claimed_amount_cents; Account.balance_cents += (amount_cents - claimed_amount_cents) (unspent hold returned)"
          - "misuse detection runs: when another PurchaseRequest exists with the same account_id, the same provider_id, the same invoice_reference and settlement_status == PAID, this settlement itself sets flagged_rule = DUPLICATE_INVOICE and auto-opens a MisuseCase with status OPEN, auto_opened true, detection_rule DUPLICATE_INVOICE and disallowed_principal_cents = paid_amount_cents"
          - "increments PurchaseRequest.version and Account.version by 1 each"

      - from: "SETTLEMENT:PAID"
        to: "SETTLEMENT:REVERSED"
        trigger: "system cascade from MisuseCase SUBSTANTIATED -> CLAWBACK_ISSUED when the case names this PurchaseRequest"
        actor: system
        preconditions:
          - "settlement_status == PAID AND MisuseCase.purchase_request_id == this PurchaseRequest"
        side_effects:
          - "Account.lifetime_spent_cents -= paid_amount_cents (the spend is disowned; recovery is tracked as lifetime_clawed_back_cents instead)"
          - "increments PurchaseRequest.version by 1"

  - entity: MisuseCase
    initial_state: OPEN
    terminal_states: [DISMISSED, RESOLVED, REVERSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /esa/misuse-cases/{id}/review"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "increments MisuseCase.version by 1"

      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /esa/misuse-cases/{id}/adjudication with outcome SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
          - "when purchase_request_id is not null, X-User-ID != that PurchaseRequest.approved_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "adjudicated_by_user_id = X-User-ID"
          - "link 1 -> 2: this substantiation itself moves the Account ACTIVE -> SUSPENDED with suspension_reason = \"MISUSE_SUBSTANTIATED\""
          - "link 2 -> 3: that suspension itself voids every PurchaseRequest of the account with approval_status IN {PENDING_REVIEW, APPROVED} (approval_status -> VOID, settlement_status -> CANCELLED)"
          - "link 3 -> 4: each voided request that had been APPROVED itself releases its hold, so Account.encumbered_cents -= amount_cents and Account.balance_cents += amount_cents"
          - "when purchase_request_id is not null, Provider.substantiated_case_count += 1 and Provider.surveillance_score is recomputed by calculations.provider_risk_score variant surveillance_decayed; scores >= 90 cascade the provider to DELISTED, scores in [75, 90) cascade APPROVED -> PROBATION"
          - "increments MisuseCase.version, Account.version and each touched PurchaseRequest.version by 1"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /esa/misuse-cases/{id}/adjudication with outcome DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "adjudicated_by_user_id = X-User-ID; no account, purchase, or provider state changes"
          - "increments MisuseCase.version by 1"
        note: "Branching fork-join: SUBSTANTIATED and DISMISSED leave the same from-state with disjoint side-effect sets."

      - from: SUBSTANTIATED
        to: CLAWBACK_ISSUED
        trigger: "POST /esa/misuse-cases/{id}/clawbacks"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBSTANTIATED, else ERR_INVALID_STATE_TRANSITION"
          - "Account.status == SUSPENDED (guaranteed by the substantiation cascade), else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "penalty_rate, penalty_cents, clawback_total_cents, account_debit_cents and receivable_cents set by calculations.clawback_assessment"
          - "appends a ClawbackEntry with entry_type ACCOUNT_DEBIT and amount_cents = account_debit_cents; when receivable_cents > 0 appends a second entry with entry_type RECEIVABLE"
          - "Account.balance_cents -= account_debit_cents and Account.lifetime_clawed_back_cents += account_debit_cents"
          - "when purchase_request_id is not null and that request has settlement_status == PAID, it moves PAID -> REVERSED and Account.lifetime_spent_cents -= paid_amount_cents"
          - "increments MisuseCase.version and Account.version by 1 each"

      - from: CLAWBACK_ISSUED
        to: UNDER_APPEAL
        trigger: "POST /esa/appeals with subject_type CLAWBACK"
        actor: Guardian
        preconditions:
          - "status == CLAWBACK_ISSUED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "creates one Appeal with status FILED and round_number = 1 + count of prior appeals against this case"
          - "increments MisuseCase.version by 1"

      - from: UNDER_APPEAL
        to: REVERSED
        trigger: "POST /esa/appeals/{id}/decision with decision OVERTURNED on a CLAWBACK appeal"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_APPEAL AND Appeal.status == FILED"
          - "X-User-ID != MisuseCase.adjudicated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appends a ClawbackEntry with entry_type REVERSAL and amount_cents = account_debit_cents"
          - "Account.balance_cents += account_debit_cents and Account.lifetime_clawed_back_cents -= account_debit_cents (exact compensation)"
          - "receivable_cents set to 0"
          - "this reversal itself moves the Account SUSPENDED -> ACTIVE when no other MisuseCase on the account has status IN {OPEN, UNDER_REVIEW, SUBSTANTIATED, CLAWBACK_ISSUED, UNDER_APPEAL}"
          - "increments MisuseCase.version and Account.version by 1 each"

      - from: UNDER_APPEAL
        to: RESOLVED
        trigger: "POST /esa/appeals/{id}/decision with decision UPHELD on a CLAWBACK appeal"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_APPEAL AND Appeal.status == FILED"
        side_effects:
          - "no ledger movement; the clawback stands and the Account stays SUSPENDED"
          - "increments MisuseCase.version by 1"

      - from: CLAWBACK_ISSUED
        to: RESOLVED
        trigger: "system: POST /esa/program-years/{id}/year-end-close"
        actor: system
        preconditions:
          - "status == CLAWBACK_ISSUED at the start of the close"
        side_effects:
          - "increments MisuseCase.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: OVERTURNED
        trigger: "POST /esa/appeals/{id}/decision with decision OVERTURNED"
        actor: AppealsOfficer
        preconditions:
          - "status == FILED, else ERR_INVALID_STATE_TRANSITION"
          - "subject-specific segregation of duties: X-User-ID must differ from the latest EligibilityDetermination.decided_by_user_id (APPLICATION_DENIAL), from MisuseCase.adjudicated_by_user_id (CLAWBACK), else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "decided_by_user_id and rationale recorded"
          - "subject cascade by subject_type: APPLICATION_DENIAL moves the Application UNDER_APPEAL -> SUBMITTED; CLAWBACK moves the MisuseCase UNDER_APPEAL -> REVERSED; PROVIDER_DELISTING moves the Provider DELISTED -> PROBATION"
          - "increments Appeal.version and the subject entity's version by 1 each"

      - from: FILED
        to: UPHELD
        trigger: "POST /esa/appeals/{id}/decision with decision UPHELD"
        actor: AppealsOfficer
        preconditions:
          - "status == FILED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "subject cascade by subject_type: APPLICATION_DENIAL moves the Application UNDER_APPEAL -> DENIED_FINAL; CLAWBACK moves the MisuseCase UNDER_APPEAL -> RESOLVED; PROVIDER_DELISTING moves the Provider DELISTED -> PERMANENTLY_BARRED"
          - "increments Appeal.version and the subject entity's version by 1 each"

  - entity: RenewalReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /esa/renewal-reviews/{id}/decision with decision APPROVED"
        actor: EligibilityOfficer
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
          - "assessment evidence sufficient: assessment_type NORM_REFERENCED_TEST requires assessment_score >= next ProgramYear.min_assessment_percentile; PORTFOLIO requires portfolio_artifact_count >= next ProgramYear.min_portfolio_artifacts, else ERR_ASSESSMENT_EVIDENCE_INSUFFICIENT"
          - "next ProgramYear.status IN {WINDOW_OPEN, ACTIVE}, else ERR_PROGRAM_YEAR_NOT_ACTIVE"
          - "residency_state_attested == next ProgramYear.residency_state, else ERR_RESIDENCY_NOT_ELIGIBLE"
          - "next ProgramYear.seats_available >= 1, else ERR_NO_SEATS_AVAILABLE"
        side_effects:
          - "mints an Application for next_program_year_id with is_renewal true, status AWARD_OFFERED, priority_tier 1, claimed_income_band and verified_income_band both set to Student.income_band, claimed_category_flags and verified_category_flags both set to Student.category_flags, annual_award_cents from calculations.annual_award_amount variant final_verified, acceptance_deadline_at = clock_now + next ProgramYear.acceptance_deadline_days days"
          - "next ProgramYear.seats_committed += 1 and seats_available -= 1"
          - "renewed_application_id recorded on this review"
          - "increments RenewalReview.version, the new Application.version and the next ProgramYear.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /esa/renewal-reviews/{id}/decision with decision DENIED"
        actor: EligibilityOfficer
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "decision_note recorded; no Application is minted and no seat is consumed"
          - "increments RenewalReview.version by 1"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a later POST /esa/renewal-reviews for the same account_id carrying a current expected_application_version"
        actor: system
        preconditions:
          - "status == SUBMITTED AND a newer RenewalReview for the same account_id has just been created"
        side_effects:
          - "increments RenewalReview.version by 1"
        note: "This is the legitimate supersede that makes the OCC rule in 1.2.1 a true race rather than a state precondition."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent version - the only sanctioned mechanism)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: purchase-request-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /esa/accounts/{id}/purchase-requests"
    occ_field: "expected_account_version"
    description: |
      Creating a PurchaseRequest against an Account whose version has advanced since the
      client last read it is rejected with a stale-version error. Two PurchaseRequests on
      one Account are individually legitimate, so no state precondition can catch the case
      where the client's view of balance_cents and encumbered_cents predates another
      writer's approval, disbursement credit, or clawback debit; the version check is what
      forces the client to re-read before committing new spend against a moved balance.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: renewal-review-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /esa/renewal-reviews"
    occ_field: "expected_application_version"
    description: |
      Filing a RenewalReview whose expected_application_version no longer matches the
      current version of the Account's Application is rejected with a stale-version error.
      A second RenewalReview legitimately supersedes the first (the prior review moves to
      SUPERSEDED), so the operation cannot be blocked by any state precondition; the
      version check is what stops a filing built on a stale view of the application, whose
      verified attributes drive the renewed award.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# ---------------------------------------------------------------------------

calculations:
  - name: annual_award_amount
    algorithm_type: tiered_pricing
    trigger: "POST /esa/applications/{id}/submit (provisional_claimed) and POST /esa/applications/{id}/accept-award plus POST /esa/renewal-reviews/{id}/decision (final_verified)"
    input_set: "the single Application under operation, plus its ProgramYear.base_award_cents"
    constants:
      INCOME_MULTIPLIER: "{BAND_A: 1.00, BAND_B: 0.90, BAND_C: 0.75}"
      ADDON_PCT: "{DISABILITY_IEP: 0.375, FOSTER: 0.225, MILITARY: 0.125, PRIOR_PUBLIC_SCHOOL: 0.0625}"
      ADDON_CAP_PCT: 0.45
      QUARTERS_PER_YEAR: 4
    formula: |
      Step 1 (income tier): base_component_cents = round_half_up(
          ProgramYear.base_award_cents * INCOME_MULTIPLIER[income_band] )
      Step 2 (deterministic add-on order): sort the admitted category flags by
          ADDON_PCT DESC, then by flag code ASC. Never by id, never by insertion order.
      Step 3 (waterfall against the cap): running_pct starts at 0. For each flag in that
          order: allowed_pct = min(ADDON_PCT[flag], ADDON_CAP_PCT - running_pct). If
          allowed_pct <= 0, stop consuming flags. Otherwise
          addon_component_cents = round_half_up(ProgramYear.base_award_cents * allowed_pct)
          and running_pct += allowed_pct. The last admitted flag is TRUNCATED to the
          cap remainder, it is not dropped and it is not admitted in full.
      Step 4 (rounding order is load-bearing): annual_award_cents =
          base_component_cents + sum of the individually rounded addon_component_cents.
          Percentages are NEVER summed first and multiplied once; each component is
          rounded to whole cents BEFORE the sum. The two orders differ by 1 cent on
          BAND_B + {DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL}: 978382 (pinned) vs 978381.
      Step 5 (variant selection, see variants below).
    precision: "integer cents throughout; ROUND_HALF_UP at every named rounding step; no floats retained between steps"
    variants:
      - variant_id: provisional_claimed
        applies_when: "POST /esa/applications/{id}/submit, before any EligibilityDetermination exists"
        formula_delta: |
          Uses claimed_income_band and claimed_category_flags (guardian self-report) and
          always assumes the full 4 quarters:
            provisional_award_cents = annual_award_cents (Steps 1-4, no proration).
          Stored on Application.provisional_award_cents.
      - variant_id: final_verified
        applies_when: "POST /esa/applications/{id}/accept-award and POST /esa/renewal-reviews/{id}/decision, after verification"
        formula_delta: |
          Uses verified_income_band and verified_category_flags from the latest
          EligibilityDetermination, then prorates for the quarters that remain:
            quarters_remaining = QUARTERS_PER_YEAR - ProgramYear.current_quarter
            final_award_cents = round_half_up(annual_award_cents * quarters_remaining / 4)
          Stored on Account.final_award_cents. With annual 932663 the variant yields
          932663 at quarters_remaining 4, 699497 at 3 and 466332 at 2, while
          provisional_claimed on the same application yields 978382.
    edge_cases:
      - "Zero admitted flags: annual_award_cents == base_component_cents exactly (BAND_A -> 731500, BAND_C -> 548625)."
      - "Flag set whose raw ADDON_PCT sum exceeds ADDON_CAP_PCT: the lowest-pct admitted flag is truncated so running_pct lands exactly on 0.45 (BAND_A + {DISABILITY_IEP, FOSTER} -> 1060676, not 1060675)."
      - "quarters_remaining == 0 is unreachable: accept-award requires ProgramYear.current_quarter <= 3."
      - "An unknown flag code is rejected at input validation (ERR_INVALID_REQUEST), never silently scored 0."

  - name: priority_score_and_rank
    algorithm_type: weighted_scoring
    trigger: "POST /esa/applications/{id}/eligibility-determinations (scores one application) and POST /esa/program-years/{id}/awarding-runs (ranks the eligible set)"
    input_set: "Applications with program_year_id == the run's year AND status == ELIGIBLE"
    constants:
      TIER_LADDER: "first match wins: {RENEWAL: 1, SIBLING: 2, PRIOR_PUBLIC_LOW_INCOME: 3, CATEGORY: 4, OPEN: 5}"
      INCOME_WEIGHT: "{BAND_A: 1.0, BAND_B: 0.6, BAND_C: 0.25}"
      INCOME_POINTS_BASE: 100
      CATEGORY_POINTS: "{DISABILITY_IEP: 40, FOSTER: 30, MILITARY: 15, PRIOR_PUBLIC_SCHOOL: 10}"
      SIBLING_POINTS: 25
    formula: |
      priority_tier: evaluate the ladder top-down and stop at the first match.
        1 RENEWAL                 when Application.is_renewal is true
        2 SIBLING                 when Student.has_enrolled_sibling is true AND another
                                  Application of the same ProgramYear whose Student shares
                                  this Student.household_id has status IN {AWARD_OFFERED, ACCEPTED}
        3 PRIOR_PUBLIC_LOW_INCOME when the determination's verified_prior_enrollment ==
                                  PUBLIC_SCHOOL_FULL_YEAR AND verified_income_band == BAND_A
        4 CATEGORY                when verified_category_flags is non-empty
        5 OPEN                    otherwise
      priority_score = round_half_up(INCOME_POINTS_BASE * INCOME_WEIGHT[verified_income_band])
                     + sum over verified_category_flags of CATEGORY_POINTS[flag]
                     + (SIBLING_POINTS when priority_tier == 2 else 0)
      Ranking of the eligible set is ORDER BY priority_tier ASC, priority_score DESC,
      submitted_at ASC, created_at ASC. The entity id is never a sort key or tie-break.
    precision: "priority_score is a whole-number integer; the single ROUND_HALF_UP is on the income term only, before the point sums"
    edge_cases:
      - "Two applications identical on tier, score and submitted_at fall back to created_at ASC; ties are impossible beyond that because created_at is unique per insert."
      - "Score and tier are 0/null while status is SUBMITTED; they are stamped only by the determination, so an unscored application can never out-rank a scored one (it is not in the ELIGIBLE input set)."
      - "A BAND_C application with no flags scores exactly 25 and lands at tier 5, the last rank position."
      - "priority_tier 1 with a low score still outranks priority_tier 5 with score 100: the tier is the primary key, the score never overrides it."

  - name: quarterly_disbursement_slice
    algorithm_type: waterfall_allocation
    trigger: "POST /esa/program-years/{id}/disbursement-runs"
    input_set: "Accounts with program_year_id == the run's year AND status == ACTIVE AND disbursement_count < quarters_remaining_at_award"
    constants:
      QUARTERS_PER_YEAR: 4
      ADMIN_FEE_PCT: "ProgramYear.admin_fee_pct (default 0.0175)"
    formula: |
      quarters_left            = Account.quarters_remaining_at_award - Account.disbursement_count
      remaining_entitlement    = Account.final_award_cents - Account.lifetime_disbursed_cents
      even_slice_cents         = floor(remaining_entitlement / quarters_left)
      indivisible_remainder    = remaining_entitlement - even_slice_cents * quarters_left
      gross_amount_cents       = even_slice_cents + (indivisible_remainder when
                                 Account.disbursement_count == 0 else 0)
      admin_fee_cents          = round_half_up(gross_amount_cents * ADMIN_FEE_PCT)
      net_credited_cents       = gross_amount_cents - admin_fee_cents
      Then: Account.balance_cents += net_credited_cents,
            Account.lifetime_disbursed_cents += gross_amount_cents,
            Account.lifetime_admin_fee_cents += admin_fee_cents,
            Account.disbursement_count += 1.
      The remainder is front-loaded onto the FIRST disbursement only, never spread and
      never appended to the last one. The fee is charged per disbursement on that
      disbursement's gross; it is NEVER computed annually and split, which for
      final_award_cents 932663 over 4 quarters would total 16322 instead of the pinned 16320.
    precision: "integer cents; floor on the even slice, ROUND_HALF_UP on the fee; sum of the four gross amounts equals final_award_cents exactly"
    edge_cases:
      - "final_award_cents 932663 with quarters_remaining_at_award 4 yields gross 233168 / 233165 / 233165 / 233165 and fees 4080 / 4080 / 4080 / 4080 (16320 total)."
      - "An Account with disbursement_count == quarters_remaining_at_award is skipped, appears in skipped_account_ids and gets no Disbursement row."
      - "A SUSPENDED Account is skipped even when quarters remain; the skipped quarter is not recovered later because quarters_left shrinks with each run only via disbursement_count, so the missed money stays in remaining_entitlement and is redistributed across the quarters that are still funded."
      - "quarters_left == 1 pays out the whole remaining_entitlement, so no residue can survive the final quarter."

  - name: unused_balance_rollover
    algorithm_type: threshold
    trigger: "POST /esa/program-years/{id}/year-end-close"
    input_set: "Accounts with program_year_id == the closing year AND status == ACTIVE"
    constants:
      ROLLOVER_CAP_PCT: "ProgramYear.rollover_cap_pct (default 0.25)"
    formula: |
      rollover_cap_cents = round_half_up(Account.final_award_cents * ROLLOVER_CAP_PCT)
      when Account.balance_cents > rollover_cap_cents:      # STRICTLY greater
          rollover_carried_cents = rollover_cap_cents
          forfeited_cents        = Account.balance_cents - rollover_cap_cents
      otherwise:
          rollover_carried_cents = Account.balance_cents
          forfeited_cents        = 0
      Account.balance_cents is then set to rollover_carried_cents.
      The carried amount only reaches a new Account when a renewal Application is
      accepted; at that moment prior.rolled_out_cents += rollover_carried_cents,
      prior.balance_cents -= the same amount and new.rollover_in_cents receives it.
    precision: "integer cents; a single ROUND_HALF_UP on the cap; encumbered_cents is NOT part of the balance and is never rolled or forfeited"
    edge_cases:
      - "final_award_cents 932663 gives a cap of exactly 233166 (233165.75 rounds half up). A balance of exactly 233166 forfeits 0 - the comparison is strictly greater, not >=."
      - "A balance of 233167 against the same cap forfeits exactly 1 cent, the minimum non-zero forfeiture."
      - "A balance of 0 yields rollover_carried_cents 0 and forfeited_cents 0 with no error."
      - "rollover_cap_pct 0 forfeits the entire balance; rollover_cap_pct 1 forfeits nothing regardless of balance."

  - name: provider_risk_score
    algorithm_type: weighted_scoring
    trigger: "POST /esa/providers/{id}/fraud-screenings (screening_static) and MisuseCase substantiation (surveillance_decayed)"
    input_set: "the single Provider under operation plus its latest FraudScreening"
    constants:
      FLAG_WEIGHTS: "{OFAC_HIT: 60, PRIOR_DELISTING: 40, NO_STATE_REGISTRATION: 35, SHARED_BANK_ACCOUNT: 25, ADDRESS_MISMATCH: 20, NEW_ENTITY_UNDER_12_MONTHS: 15}"
      SCORE_CEILING: 100
      APPROVE_MAX_SCORE: 60
      PROBATION_MIN_SCORE: 40
      DECAY_PER_MONTH: 0.1
      DECAY_FLOOR: 0.5
      SUBSTANTIATED_CASE_POINTS: 25
      AUTO_PROBATION_THRESHOLD: 75
      AUTO_DELIST_THRESHOLD: 90
    formula: |
      screening_score = min(SCORE_CEILING, sum of FLAG_WEIGHTS[flag] over the distinct
                            flags submitted with the screening)
      Approval banding on POST /esa/providers/{id}/approve:
        screening_score >= APPROVE_MAX_SCORE (60)                     -> ERR_FRAUD_RISK_TOO_HIGH, status stays SCREENED
        PROBATION_MIN_SCORE (40) <= screening_score < 60              -> PROBATION
        screening_score < 40                                          -> APPROVED
    precision: "whole-number integer scores; one ROUND_HALF_UP inside the surveillance variant, applied to the decayed screening term BEFORE the case points are added"
    variants:
      - variant_id: screening_static
        applies_when: "POST /esa/providers/{id}/fraud-screenings - the moment of screening"
        formula_delta: |
          No decay and no case history:
            screening_score = min(100, sum of FLAG_WEIGHTS[flag])
            surveillance_score = screening_score
            recommended_status = APPROVE when screening_score < 40, PROBATION when
                40 <= screening_score < 60, REJECT when screening_score >= 60
          Stored on FraudScreening.screening_score and mirrored onto the Provider.
      - variant_id: surveillance_decayed
        applies_when: "recomputed whenever a MisuseCase naming this provider is SUBSTANTIATED"
        formula_delta: |
          decay_factor = max(DECAY_FLOOR, 1 - DECAY_PER_MONTH * months_since_screening)
          surveillance_score = min(100,
              round_half_up(screening_score * decay_factor)
              + SUBSTANTIATED_CASE_POINTS * substantiated_case_count )
          months_since_screening = whole months from screened_at to clock_now, floor.
          The decayed screening term is rounded BEFORE the case points are added, never
          after: screening 25, 0 months, 2 cases gives exactly 75 (auto-PROBATION at the
          boundary), while screening 40 after 4 months with 1 case gives 49.
    edge_cases:
      - "A flag list summing above 100 clamps to exactly 100 (OFAC_HIT + PRIOR_DELISTING + NO_STATE_REGISTRATION = 135 -> 100)."
      - "A screening with an empty flag list scores 0 and approves cleanly."
      - "Decay never drops below DECAY_FLOOR: 12 months since screening still retains 0.5, not 0."
      - "surveillance_score exactly 75 forces PROBATION, exactly 90 forces DELISTED; 74 leaves the provider APPROVED."
      - "Re-screening an already-SCREENED provider replaces screening_score and resets months_since_screening to 0, restarting the decay curve."

  - name: clawback_assessment
    algorithm_type: threshold
    trigger: "POST /esa/misuse-cases/{id}/clawbacks"
    input_set: "the single MisuseCase under operation plus its Account"
    constants:
      PENALTY_TIERS: "keyed on disallowed_principal_cents: <= 50000 -> 0.10; <= 250000 -> 0.20; otherwise -> 0.35"
    formula: |
      Order of operations is pinned because the tier looks circular but is not - the tier
      is selected from the PRINCIPAL alone, never from the running total:
        Step 1: penalty_rate = the first matching PENALTY_TIERS band for
                MisuseCase.disallowed_principal_cents
        Step 2: penalty_cents = round_half_up(disallowed_principal_cents * penalty_rate)
        Step 3: clawback_total_cents = disallowed_principal_cents + penalty_cents
        Step 4: account_debit_cents = min(Account.balance_cents, clawback_total_cents)
        Step 5: receivable_cents = clawback_total_cents - account_debit_cents
      Re-deriving the tier from clawback_total_cents (Step 3) instead of the principal
      would push 250000 into the 0.35 band and produce 337500 instead of the pinned 300000.
    precision: "integer cents; one ROUND_HALF_UP on the penalty; account_debit_cents + receivable_cents == clawback_total_cents always holds"
    edge_cases:
      - "Principal exactly 50000 uses 0.10 (penalty 5000, total 55000); 50001 uses 0.20 (penalty 10000, total 60001)."
      - "Principal exactly 250000 uses 0.20 (penalty 50000, total 300000); 250001 uses 0.35 (penalty 87500, total 337501)."
      - "Principal 150000 gives penalty 30000 and total 180000."
      - "A balance below the total splits the recovery: balance 100000 against a total of 180000 debits 100000 and books 80000 receivable, leaving balance 0 (never negative)."
      - "A balance of 0 debits nothing and books the whole total as receivable."
      - "An OVERTURNED clawback appeal reverses account_debit_cents exactly and zeroes receivable_cents; the penalty is not re-derived at reversal time."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in this priority order)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body and query parameters are well formed: required fields present, enum values in range, integers non-negative where declared, ISO-8601 datetimes parseable, limit in [1, 100], offset >= 0, dates YYYY-MM-DD"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "the ProgramYear named by the path or by program_year_id / next_program_year_id exists"
    error_id: ERR_PROGRAM_YEAR_NOT_FOUND
    http_status: 404
    applies_to: "POST/GET /esa/program-years/{id}/*, POST /esa/applications, POST /esa/renewal-reviews"

  - priority: 5
    category: existence
    check: "the Student named by the path or by student_id exists"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /esa/students/{id}, POST /esa/applications"

  - priority: 6
    category: existence
    check: "the Application named by the path or by application_id exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /esa/applications/{id}/*, POST /esa/appeals"

  - priority: 7
    category: existence
    check: "the Account named by the path or by account_id exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /esa/accounts/{id}/*, POST /esa/misuse-cases, POST /esa/renewal-reviews"

  - priority: 8
    category: existence
    check: "the Provider named by the path or by provider_id exists"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /esa/providers/{id}/*, POST /esa/accounts/{id}/purchase-requests, POST /esa/appeals"

  - priority: 9
    category: existence
    check: "the ExpenseCategory named by expense_category_id exists, and every code in authorized_category_codes matches an existing ExpenseCategory.code"
    error_id: ERR_EXPENSE_CATEGORY_NOT_FOUND
    http_status: 404
    applies_to: "GET /esa/expense-categories/{id}, POST /esa/accounts/{id}/purchase-requests, POST /esa/providers/{id}/approve"

  - priority: 10
    category: existence
    check: "the PurchaseRequest named by the path or by purchase_request_id exists"
    error_id: ERR_PURCHASE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /esa/purchase-requests/{id}/*, POST /esa/misuse-cases"

  - priority: 11
    category: existence
    check: "the MisuseCase named by the path or by misuse_case_id exists"
    error_id: ERR_MISUSE_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /esa/misuse-cases/{id}/*, POST /esa/appeals"

  - priority: 12
    category: existence
    check: "the RenewalReview named by the path exists"
    error_id: ERR_RENEWAL_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /esa/renewal-reviews/{id}, POST /esa/renewal-reviews/{id}/decision"

  - priority: 13
    category: existence
    check: "the Appeal named by the path exists"
    error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /esa/appeals/{id}, POST /esa/appeals/{id}/decision"

  - priority: 14
    category: auth
    check: "for role Guardian, X-User-ID equals the Student.id behind the Application or the Account under operation"
    error_id: ERR_NOT_ACCOUNT_HOLDER
    http_status: 403
    applies_to: "POST /esa/applications/{id}/submit, /accept-award, /withdraw, POST /esa/accounts/{id}/purchase-requests, POST /esa/appeals with subject_type IN {APPLICATION_DENIAL, CLAWBACK}"

  - priority: 15
    category: auth
    check: "for role Provider, X-User-ID equals the provider_id of the PurchaseRequest or the Provider under operation"
    error_id: ERR_NOT_ASSIGNED_PROVIDER
    http_status: 403
    applies_to: "POST /esa/purchase-requests/{id}/claim, POST /esa/appeals with subject_type PROVIDER_DELISTING"

  - priority: 16
    category: state
    check: "expected_account_version equals the current Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /esa/accounts/{id}/purchase-requests"

  - priority: 17
    category: state
    check: "expected_application_version equals the current version of the Account's Application"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /esa/renewal-reviews"

  - priority: 18
    category: state
    check: "the governing ProgramYear is in the state the operation requires: ACTIVE for disbursement runs, year-end close and accept-award; IN {WINDOW_OPEN, AWARDING} for eligibility determinations; IN {WINDOW_OPEN, ACTIVE} for a renewal target year"
    error_id: ERR_PROGRAM_YEAR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /esa/program-years/{id}/disbursement-runs, /year-end-close, POST /esa/applications/{id}/accept-award, /eligibility-determinations, POST /esa/renewal-reviews/{id}/decision"

  - priority: 19
    category: state
    check: "the ProgramYear.status == WINDOW_OPEN and window_open_at <= clock_now < window_close_at"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /esa/applications, POST /esa/applications/{id}/submit"

  - priority: 20
    category: state
    check: "the target entity's current state permits the requested transition per §1.2 (including acceptance_deadline_at not yet passed, quarter == current_quarter + 1, and the reinstatement guard that every MisuseCase on the account is in {DISMISSED, RESOLVED, REVERSED})"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 21
    category: state
    check: "the Account under operation has status ACTIVE (not SUSPENDED) for any operation that moves or encumbers its money"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /esa/accounts/{id}/purchase-requests, POST /esa/purchase-requests/{id}/decision, /settle"

  - priority: 22
    category: state
    check: "Application.appeal_round_count < 2 before a new APPLICATION_DENIAL appeal is filed"
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /esa/appeals"

  - priority: 23
    category: business_safety
    check: "the acting X-User-ID differs from the user who performed the paired earlier step: the approver of a PurchaseRequest may not settle it; the ExpenseReviewer who approved a request may not adjudicate the MisuseCase naming it; the officer who authored the underlying denial or adjudication may not decide the appeal against it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /esa/purchase-requests/{id}/settle, POST /esa/misuse-cases/{id}/adjudication, POST /esa/appeals/{id}/decision"

  - priority: 24
    category: business_safety
    check: "Provider.screening_score < 60 at approval, and Provider.surveillance_score < 75 at reinstatement"
    error_id: ERR_FRAUD_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /esa/providers/{id}/approve, POST /esa/providers/{id}/sanctions with action REINSTATE"

  - priority: 25
    category: business_safety
    check: "the Provider named by the purchase is participation-eligible: status APPROVED for flow REIMBURSEMENT, status IN {APPROVED, PROBATION} for flow PREAPPROVAL"
    error_id: ERR_PROVIDER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests, POST /esa/purchase-requests/{id}/decision, /settle"

  - priority: 26
    category: business_referential
    check: "the ExpenseCategory.code appears in Provider.authorized_category_codes"
    error_id: ERR_CATEGORY_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests, POST /esa/purchase-requests/{id}/decision, /settle"

  - priority: 27
    category: business_referential
    check: "the ExpenseCategory.allowable is true"
    error_id: ERR_EXPENSE_NOT_ALLOWABLE
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests"

  - priority: 28
    category: business_referential
    check: "flow REIMBURSEMENT is only accepted when ExpenseCategory.requires_preapproval is false"
    error_id: ERR_PREAPPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests"

  - priority: 29
    category: business_temporal
    check: "the Student holds no other Application in status IN {AWARD_OFFERED, ACCEPTED, COMPLETED} whose ProgramYear term interval [term_start_date, term_end_date] (both inclusive) intersects the requested year's term interval, excluding Applications for the same program_year_id"
    error_id: ERR_OVERLAPPING_ENROLLMENT_PERIOD
    http_status: 409
    applies_to: "POST /esa/applications"

  - priority: 30
    category: business_temporal
    check: "when ExpenseCategory.requires_service_period is true: no other PurchaseRequest for the same account_id and the same expense_category_id with approval_status IN {PENDING_REVIEW, APPROVED} has a half-open service interval [service_start_at, service_end_at) that intersects the requested one. Categories with requires_service_period false are exempt from this collision check and may reuse the same interval"
    error_id: ERR_DUPLICATE_SERVICE_PERIOD
    http_status: 409
    applies_to: "POST /esa/accounts/{id}/purchase-requests"

  - priority: 31
    category: business_temporal
    check: "service_start_at and service_end_at both fall inside the ProgramYear term: term_start_date 00:00:00Z <= service_start_at < service_end_at <= term_end_date 23:59:59Z"
    error_id: ERR_SERVICE_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests"

  - priority: 32
    category: business_constraint
    check: "the Student has no other Application for the same program_year_id in status NOT IN {WITHDRAWN, DENIED_FINAL, EXPIRED}"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /esa/applications"

  - priority: 33
    category: business_constraint
    check: "Student.residency_state equals ProgramYear.residency_state at application; at renewal approval, RenewalReview.residency_state_attested equals the next ProgramYear.residency_state"
    error_id: ERR_RESIDENCY_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /esa/applications, POST /esa/renewal-reviews/{id}/decision"

  - priority: 34
    category: business_constraint
    check: "renewal evidence clears the bar: assessment_type NORM_REFERENCED_TEST requires assessment_score >= min_assessment_percentile; PORTFOLIO requires portfolio_artifact_count >= min_portfolio_artifacts"
    error_id: ERR_ASSESSMENT_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /esa/renewal-reviews/{id}/decision with decision APPROVED"

  - priority: 35
    category: business_fiscal
    check: "amount_cents <= ExpenseCategory.per_year_cap_cents minus the account's already-committed spend in that category (sum of amount_cents over PurchaseRequests of the same account and category with approval_status == APPROVED)"
    error_id: ERR_CATEGORY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /esa/accounts/{id}/purchase-requests, POST /esa/purchase-requests/{id}/decision with decision APPROVED"

  - priority: 36
    category: business_fiscal
    check: "amount_cents <= Account.balance_cents at the moment the hold is placed"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /esa/purchase-requests/{id}/decision with decision APPROVED"

  - priority: 37
    category: business_fiscal
    check: "ProgramYear.seats_available >= 1 before a renewal Application is minted"
    error_id: ERR_NO_SEATS_AVAILABLE
    http_status: 409
    applies_to: "POST /esa/renewal-reviews/{id}/decision with decision APPROVED"

  - priority: 38
    category: business_fiscal
    check: "1 <= claimed_amount_cents <= PurchaseRequest.amount_cents"
    error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /esa/purchase-requests/{id}/claim"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table (all paths are prefixed /esa)
# ---------------------------------------------------------------------------

endpoints:
  # --- ProgramYear ---------------------------------------------------------
  - method: POST
    path: "/esa/program-years"
    description: "Create a program year in DRAFT with its award parameters, submission window and instructional term."
    roles: [ProgramAdmin]
    code: 201
    input: [label, residency_state, total_seats, window_open_at, window_close_at, term_start_date, term_end_date, "base_award_cents?", "rollover_cap_pct?", "admin_fee_pct?", "acceptance_deadline_days?", "min_assessment_percentile?", "min_portfolio_artifacts?"]
    output: ProgramYear
    side_effects: ["status DRAFT, current_quarter 0, seats_committed 0, seats_available 0"]

  - method: GET
    path: "/esa/program-years/{id}"
    description: "Read one program year including live seat counters and the ops-run epoch."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, ExpenseReviewer, VendorScreener, Guardian, Provider]
    code: 200
    output: ProgramYear
    side_effects: []

  - method: POST
    path: "/esa/program-years/{id}/open-window"
    description: "Move the program year DRAFT -> WINDOW_OPEN and publish its seat pool."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramYear
    side_effects: ["state_machines.ProgramYear.DRAFT_to_WINDOW_OPEN", "seats_available = total_seats"]

  - method: POST
    path: "/esa/program-years/{id}/awarding-runs"
    description: "Run award prioritization: rank every ELIGIBLE application, offer up to seats_available of them and waitlist the rest in rank order. Moves the year WINDOW_OPEN -> AWARDING -> ACTIVE in one request."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output:
      awarded_count: integer
      waitlisted_count: integer
      program_year_status: string
      seats_committed: integer
      seats_available: integer
      awarded_application_ids: string[]
      waitlist_ordered_application_ids: string[]
    side_effects: ["calculations.priority_score_and_rank", "state_machines.Application.ELIGIBLE_to_AWARD_OFFERED", "state_machines.Application.ELIGIBLE_to_WAITLISTED", "state_machines.ProgramYear.AWARDING_to_ACTIVE"]

  - method: POST
    path: "/esa/program-years/{id}/disbursement-runs"
    description: "Advance the ops epoch to the given quarter: expire overdue offers (promoting the waitlist), then credit one quarterly slice to every eligible ACTIVE account."
    roles: [ProgramAdmin]
    code: 200
    input: [quarter]
    output:
      quarter: integer
      disbursement_count: integer
      total_gross_cents: integer
      total_admin_fee_cents: integer
      total_net_credited_cents: integer
      skipped_account_ids: string[]
      expired_application_ids: string[]
      promoted_application_ids: string[]
    side_effects: ["calculations.quarterly_disbursement_slice", "state_machines.Application.AWARD_OFFERED_to_EXPIRED", "state_machines.Application.WAITLISTED_to_AWARD_OFFERED", "appends one Disbursement per credited account"]

  - method: POST
    path: "/esa/program-years/{id}/year-end-close"
    description: "Close the year: apply rollover and forfeiture to every ACTIVE account, complete their applications and resolve outstanding clawbacks."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output:
      program_year_status: string
      closed_account_count: integer
      total_rolled_cents: integer
      total_forfeited_cents: integer
      resolved_misuse_case_ids: string[]
    side_effects: ["calculations.unused_balance_rollover", "state_machines.Application.ACCEPTED_to_COMPLETED", "state_machines.MisuseCase.CLAWBACK_ISSUED_to_RESOLVED", "state_machines.ProgramYear.ACTIVE_to_CLOSED"]

  - method: GET
    path: "/esa/program-years/{id}/disbursements"
    description: "List every disbursement issued under this program year, oldest first."
    roles: [ProgramAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  # --- Student -------------------------------------------------------------
  - method: POST
    path: "/esa/students"
    description: "Register a student record with household, residency and prior-enrollment facts."
    roles: [ProgramAdmin]
    code: 201
    input: [household_id, first_name, last_name, date_of_birth, residency_state, prior_enrollment, income_band, "category_flags?", "has_enrolled_sibling?"]
    output: Student
    side_effects: []

  - method: GET
    path: "/esa/students/{id}"
    description: "Read one student record."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    output: Student
    side_effects: []

  # --- Application ---------------------------------------------------------
  - method: POST
    path: "/esa/applications"
    description: "Open a DRAFT application for a student in a program year, carrying the guardian's claimed income band and category flags."
    roles: [Guardian]
    code: 201
    input: [program_year_id, student_id, claimed_income_band, claimed_category_flags, "is_renewal?"]
    output: Application
    side_effects: ["validations[priority=29]", "validations[priority=32]", "validations[priority=33]", "status DRAFT, appeal_round_count 0"]

  - method: GET
    path: "/esa/applications/{id}"
    description: "Read one application with its verified attributes, priority tier/score, award figures and waitlist position."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    output: Application
    side_effects: []

  - method: GET
    path: "/esa/applications"
    description: "List applications filtered by program year, student or status; the canonical reverse lookup for both application FKs."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    input: ["program_year_id?", "student_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/esa/applications/{id}/submit"
    description: "Submit a DRAFT application inside the open window and stamp the provisional award from the claimed attributes."
    roles: [Guardian]
    code: 200
    input: []
    output: Application
    side_effects: ["state_machines.Application.DRAFT_to_SUBMITTED", "calculations.annual_award_amount variant provisional_claimed", "validations[priority=19]"]

  - method: POST
    path: "/esa/applications/{id}/eligibility-determinations"
    description: "Record an eligibility determination (residency, prior enrollment, income-or-category), driving the application to ELIGIBLE or DENIED and stamping tier and score."
    roles: [EligibilityOfficer]
    code: 201
    input: [residency_check, prior_enrollment_check, verified_income_band, verified_prior_enrollment, verified_category_flags]
    output: EligibilityDetermination
    side_effects: ["state_machines.Application.SUBMITTED_to_ELIGIBLE", "state_machines.Application.SUBMITTED_to_DENIED", "calculations.priority_score_and_rank", "calculations.annual_award_amount"]

  - method: GET
    path: "/esa/applications/{id}/eligibility-determinations"
    description: "List the determination history of one application, oldest round first."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: POST
    path: "/esa/applications/{id}/accept-award"
    description: "Accept an award offer before its deadline: prorates the verified award for the quarters that remain and opens the ESA account."
    roles: [Guardian]
    code: 200
    output:
      application_id: string
      application_status: string
      account_id: string
      annual_award_cents: integer
      final_award_cents: integer
      quarters_remaining_at_award: integer
    side_effects: ["state_machines.Application.AWARD_OFFERED_to_ACCEPTED", "calculations.annual_award_amount variant final_verified", "creates one Account", "transfers rollover_carried_cents from the prior account on a renewal"]

  - method: POST
    path: "/esa/applications/{id}/withdraw"
    description: "Withdraw an accepted award: closes the account, voids its open purchase requests, releases the seat and promotes the head of the waitlist."
    roles: [Guardian]
    code: 200
    output:
      application_id: string
      application_status: string
      account_id: string
      account_status: string
      seats_committed: integer
      seats_available: integer
      promoted_application_id: string
    side_effects: ["state_machines.Application.ACCEPTED_to_WITHDRAWN", "state_machines.Account.ACTIVE_to_CLOSED", "state_machines.Application.WAITLISTED_to_AWARD_OFFERED"]

  # --- Provider ------------------------------------------------------------
  - method: POST
    path: "/esa/providers"
    description: "Register a candidate education provider or vendor in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, ein, address_state, provider_type]
    output: Provider
    side_effects: ["status DRAFT, screening_score 0, surveillance_score 0, substantiated_case_count 0"]

  - method: GET
    path: "/esa/providers/{id}"
    description: "Read one provider with its screening and surveillance scores, sanction reason and authorized categories."
    roles: [ProgramAdmin, VendorScreener, ComplianceOfficer, AppealsOfficer, ExpenseReviewer, Guardian, Provider]
    code: 200
    output: Provider
    side_effects: []

  - method: POST
    path: "/esa/providers/{id}/fraud-screenings"
    description: "Screen a provider against the fraud flag catalog and record the resulting score."
    roles: [VendorScreener]
    code: 201
    input: [flags]
    output: FraudScreening
    side_effects: ["state_machines.Provider.DRAFT_to_SCREENED", "calculations.provider_risk_score variant screening_static"]

  - method: GET
    path: "/esa/providers/{id}/fraud-screenings"
    description: "List the screening history of one provider, oldest first."
    roles: [ProgramAdmin, VendorScreener, ComplianceOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FraudScreening[]
    side_effects: []

  - method: POST
    path: "/esa/providers/{id}/approve"
    description: "Admit a screened provider to participation, landing in APPROVED or PROBATION by score band, and pin the expense categories it may serve."
    roles: [VendorScreener]
    code: 200
    input: [authorized_category_codes]
    output: Provider
    side_effects: ["state_machines.Provider.SCREENED_to_APPROVED", "state_machines.Provider.SCREENED_to_PROBATION", "validations[priority=24]"]

  - method: POST
    path: "/esa/providers/{id}/sanctions"
    description: "Apply or lift a participation sanction: PROBATION, REINSTATE or DELIST. Delisting voids the provider's open purchase requests and releases their holds."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, reason]
    output: Provider
    side_effects: ["state_machines.Provider.APPROVED_to_PROBATION", "state_machines.Provider.PROBATION_to_APPROVED", "state_machines.Provider.APPROVED_to_DELISTED", "releases encumbered_cents on every voided request's account"]

  # --- ExpenseCategory -----------------------------------------------------
  - method: POST
    path: "/esa/expense-categories"
    description: "Publish an allowable-expense catalog entry with its annual cap and flow requirements."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, per_year_cap_cents, "allowable?", "requires_preapproval?", "requires_service_period?"]
    output: ExpenseCategory
    side_effects: []

  - method: GET
    path: "/esa/expense-categories/{id}"
    description: "Read one catalog entry."
    roles: [ProgramAdmin, ExpenseReviewer, ComplianceOfficer, VendorScreener, Guardian, Provider]
    code: 200
    output: ExpenseCategory
    side_effects: []

  # --- Account -------------------------------------------------------------
  - method: GET
    path: "/esa/accounts/{id}"
    description: "Read one ESA account with its full ledger: balance, encumbrance, lifetime disbursed/spent/fees/clawed-back, rollover and forfeiture."
    roles: [ProgramAdmin, ComplianceOfficer, ExpenseReviewer, EligibilityOfficer, AppealsOfficer, Guardian]
    code: 200
    output: Account
    side_effects: []

  - method: GET
    path: "/esa/accounts"
    description: "List accounts filtered by application, program year or status; the reverse lookup for both account FKs."
    roles: [ProgramAdmin, ComplianceOfficer, ExpenseReviewer, EligibilityOfficer, Guardian]
    code: 200
    input: ["application_id?", "program_year_id?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: GET
    path: "/esa/accounts/{id}/disbursements"
    description: "List the quarterly disbursements credited to one account, oldest quarter first."
    roles: [ProgramAdmin, ComplianceOfficer, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: GET
    path: "/esa/accounts/{id}/clawback-entries"
    description: "List every clawback ledger entry booked against one account, including reversals."
    roles: [ProgramAdmin, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: ClawbackEntry[]
    side_effects: []

  - method: POST
    path: "/esa/accounts/{id}/status-actions"
    description: "Suspend or reinstate an account. Suspension voids open purchase requests and releases their holds; reinstatement requires every misuse case on the account to be closed."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, reason]
    output: Account
    side_effects: ["state_machines.Account.ACTIVE_to_SUSPENDED", "state_machines.Account.SUSPENDED_to_ACTIVE", "voids PENDING_REVIEW and APPROVED purchase requests and returns encumbered_cents to balance_cents"]

  - method: POST
    path: "/esa/accounts/{id}/purchase-requests"
    description: "File a pre-approval or reimbursement purchase request against an account, guarded by an optimistic-concurrency check on the account version."
    roles: [Guardian]
    code: 201
    input: [provider_id, expense_category_id, flow, amount_cents, service_start_at, service_end_at, expected_account_version, "invoice_reference?"]
    output: PurchaseRequest
    side_effects: ["concurrency_rules[purchase-request-create-stale-account]", "validations[priority=30]", "validations[priority=31]", "validations[priority=35]", "approval_status PENDING_REVIEW, settlement_status UNSETTLED", "increments Account.version by 1"]

  # --- PurchaseRequest -----------------------------------------------------
  - method: GET
    path: "/esa/purchase-requests/{id}"
    description: "Read one purchase request with both of its state dimensions, claim data and settlement figures."
    roles: [ProgramAdmin, ExpenseReviewer, ComplianceOfficer, AppealsOfficer, Guardian, Provider]
    code: 200
    output: PurchaseRequest
    side_effects: []

  - method: GET
    path: "/esa/purchase-requests"
    description: "List purchase requests filtered by account, provider, category or either state dimension; the reverse lookup for all three purchase-request FKs."
    roles: [ProgramAdmin, ExpenseReviewer, ComplianceOfficer, AppealsOfficer, Guardian, Provider]
    code: 200
    input: ["account_id?", "provider_id?", "expense_category_id?", "approval_status?", "settlement_status?", "limit?", "offset?"]
    output: PurchaseRequest[]
    side_effects: []

  - method: POST
    path: "/esa/purchase-requests/{id}/decision"
    description: "Decide the approval dimension: APPROVED places a hold on the account, DENIED and VOID close the request and release any hold."
    roles: [ExpenseReviewer]
    code: 200
    input: [decision, "reason?"]
    output: PurchaseRequest
    side_effects: ["state_machines.PurchaseRequest.APPROVAL:PENDING_REVIEW_to_APPROVAL:APPROVED", "state_machines.PurchaseRequest.APPROVAL:PENDING_REVIEW_to_APPROVAL:DENIED", "state_machines.PurchaseRequest.APPROVAL:APPROVED_to_APPROVAL:VOID", "moves amount_cents between balance_cents and encumbered_cents", "validations[priority=36]"]

  - method: POST
    path: "/esa/purchase-requests/{id}/claim"
    description: "Provider submits an invoice claim against a purchase request; permitted while the approval dimension is still pending."
    roles: [Provider]
    code: 200
    input: [invoice_reference, claimed_amount_cents]
    output: PurchaseRequest
    side_effects: ["state_machines.PurchaseRequest.SETTLEMENT:UNSETTLED_to_SETTLEMENT:CLAIMED", "validations[priority=38]"]

  - method: POST
    path: "/esa/purchase-requests/{id}/settle"
    description: "Settle an approved claim: converts the hold to spend, returns the unspent remainder and runs duplicate-invoice misuse detection."
    roles: [ExpenseReviewer]
    code: 200
    output:
      purchase_request_id: string
      settlement_status: string
      paid_amount_cents: integer
      released_cents: integer
      account_balance_cents: integer
      account_encumbered_cents: integer
      opened_misuse_case_id: string
    side_effects: ["state_machines.PurchaseRequest.SETTLEMENT:CLAIMED_to_SETTLEMENT:PAID", "validations[priority=23]", "auto-opens a MisuseCase on a duplicate invoice_reference"]

  # --- MisuseCase ----------------------------------------------------------
  - method: POST
    path: "/esa/misuse-cases"
    description: "Open a misuse case against an account, optionally naming the purchase request that triggered it and the disallowed principal."
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, detection_rule, disallowed_principal_cents, narrative, "purchase_request_id?"]
    output: MisuseCase
    side_effects: ["status OPEN, auto_opened false"]

  - method: GET
    path: "/esa/misuse-cases/{id}"
    description: "Read one misuse case with its adjudication trail and clawback figures."
    roles: [ProgramAdmin, ComplianceOfficer, AppealsOfficer, ExpenseReviewer, Guardian]
    code: 200
    output: MisuseCase
    side_effects: []

  - method: GET
    path: "/esa/misuse-cases"
    description: "List misuse cases filtered by account, purchase request or status; the reverse lookup for both misuse-case FKs."
    roles: [ProgramAdmin, ComplianceOfficer, AppealsOfficer, ExpenseReviewer, Guardian]
    code: 200
    input: ["account_id?", "purchase_request_id?", "status?", "limit?", "offset?"]
    output: MisuseCase[]
    side_effects: []

  - method: POST
    path: "/esa/misuse-cases/{id}/review"
    description: "Take a misuse case under review and record the reviewing officer."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MisuseCase
    side_effects: ["state_machines.MisuseCase.OPEN_to_UNDER_REVIEW"]

  - method: POST
    path: "/esa/misuse-cases/{id}/adjudication"
    description: "Substantiate or dismiss a misuse case. Substantiation suspends the account, voids its open purchase requests, releases their holds and re-scores the provider."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, rationale]
    output: MisuseCase
    side_effects: ["state_machines.MisuseCase.UNDER_REVIEW_to_SUBSTANTIATED", "state_machines.MisuseCase.UNDER_REVIEW_to_DISMISSED", "state_machines.Account.ACTIVE_to_SUSPENDED", "calculations.provider_risk_score variant surveillance_decayed", "validations[priority=23]"]

  - method: POST
    path: "/esa/misuse-cases/{id}/clawbacks"
    description: "Issue the clawback for a substantiated case: tiered penalty, account debit up to the available balance and a receivable for the shortfall."
    roles: [ComplianceOfficer]
    code: 200
    output:
      misuse_case_id: string
      misuse_case_status: string
      penalty_rate: number
      penalty_cents: integer
      clawback_total_cents: integer
      account_debit_cents: integer
      receivable_cents: integer
      account_balance_cents: integer
      clawback_entry_ids: string[]
    side_effects: ["state_machines.MisuseCase.SUBSTANTIATED_to_CLAWBACK_ISSUED", "calculations.clawback_assessment", "appends ClawbackEntry rows", "reverses the named PAID purchase request"]

  - method: GET
    path: "/esa/misuse-cases/{id}/clawback-entries"
    description: "List the clawback ledger entries booked for one misuse case, oldest first."
    roles: [ProgramAdmin, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: ClawbackEntry[]
    side_effects: []

  # --- RenewalReview -------------------------------------------------------
  - method: POST
    path: "/esa/renewal-reviews"
    description: "File the annual testing-or-portfolio evidence for continued eligibility, guarded by an optimistic-concurrency check on the account's application version. Supersedes any prior SUBMITTED review for the same account."
    roles: [Guardian]
    code: 201
    input: [account_id, next_program_year_id, assessment_type, residency_state_attested, expected_application_version, "assessment_score?", "portfolio_artifact_count?"]
    output: RenewalReview
    side_effects: ["concurrency_rules[renewal-review-create-stale-application]", "state_machines.RenewalReview.SUBMITTED_to_SUPERSEDED", "status SUBMITTED", "increments the Account's Application.version by 1"]

  - method: GET
    path: "/esa/renewal-reviews/{id}"
    description: "Read one renewal review with its evidence, decision and minted application id."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    output: RenewalReview
    side_effects: []

  - method: GET
    path: "/esa/renewal-reviews"
    description: "List renewal reviews filtered by account, target program year or status; the reverse lookup for both renewal-review FKs."
    roles: [ProgramAdmin, EligibilityOfficer, ComplianceOfficer, AppealsOfficer, Guardian]
    code: 200
    input: ["account_id?", "next_program_year_id?", "status?", "limit?", "offset?"]
    output: RenewalReview[]
    side_effects: []

  - method: POST
    path: "/esa/renewal-reviews/{id}/decision"
    description: "Approve or deny continued eligibility. Approval mints a tier-1 renewal application already in AWARD_OFFERED and consumes a seat in the next year."
    roles: [EligibilityOfficer]
    input: [decision, "decision_note?"]
    code: 200
    output:
      renewal_review_id: string
      status: string
      renewed_application_id: string
      prior_account_status: string
      next_program_year_seats_available: integer
    side_effects: ["state_machines.RenewalReview.SUBMITTED_to_APPROVED", "state_machines.RenewalReview.SUBMITTED_to_DENIED", "calculations.annual_award_amount variant final_verified", "validations[priority=34]", "validations[priority=37]"]

  # --- Appeal --------------------------------------------------------------
  - method: POST
    path: "/esa/appeals"
    description: "File an appeal against exactly one subject: an application denial, a clawback, or a provider delisting."
    roles: [Guardian, Provider]
    code: 201
    input: [subject_type, grounds, "application_id?", "misuse_case_id?", "provider_id?"]
    output: Appeal
    side_effects: ["state_machines.Application.DENIED_to_UNDER_APPEAL", "state_machines.MisuseCase.CLAWBACK_ISSUED_to_UNDER_APPEAL", "validations[priority=22]", "status FILED"]

  - method: GET
    path: "/esa/appeals/{id}"
    description: "Read one appeal with its subject reference, decision and rationale."
    roles: [ProgramAdmin, AppealsOfficer, ComplianceOfficer, EligibilityOfficer, Guardian, Provider]
    code: 200
    output: Appeal
    side_effects: []

  - method: GET
    path: "/esa/appeals"
    description: "List appeals filtered by subject type, subject id or status; the reverse lookup for all three polymorphic appeal FKs."
    roles: [ProgramAdmin, AppealsOfficer, ComplianceOfficer, EligibilityOfficer, Guardian, Provider]
    code: 200
    input: ["application_id?", "misuse_case_id?", "provider_id?", "subject_type?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/esa/appeals/{id}/decision"
    description: "Decide an appeal. OVERTURNED re-opens the application, reverses the clawback, or returns the provider to probation; UPHELD makes the original outcome final."
    roles: [AppealsOfficer]
    code: 200
    input: [decision, rationale]
    output: Appeal
    side_effects: ["state_machines.Appeal.FILED_to_OVERTURNED", "state_machines.Appeal.FILED_to_UPHELD", "state_machines.Application.UNDER_APPEAL_to_SUBMITTED", "state_machines.MisuseCase.UNDER_APPEAL_to_REVERSED", "state_machines.Provider.DELISTED_to_PROBATION", "validations[priority=23]"]

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/esa/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and decay rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["every subsequent clock_now read returns to_iso8601"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body or query: missing required field, unknown enum value, negative money, unparseable datetime, limit outside [1,100], negative offset, or an unknown category flag code"
  - id: ERR_PROGRAM_YEAR_NOT_FOUND
    http: 404
    condition: "no ProgramYear with the given id (path, program_year_id, or next_program_year_id)"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "no Student with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no Application with the given id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account with the given id"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "no Provider with the given id"
  - id: ERR_EXPENSE_CATEGORY_NOT_FOUND
    http: 404
    condition: "no ExpenseCategory with the given id, or an authorized_category_codes entry matches no ExpenseCategory.code"
  - id: ERR_PURCHASE_REQUEST_NOT_FOUND
    http: 404
    condition: "no PurchaseRequest with the given id"
  - id: ERR_MISUSE_CASE_NOT_FOUND
    http: 404
    condition: "no MisuseCase with the given id"
  - id: ERR_RENEWAL_REVIEW_NOT_FOUND
    http: 404
    condition: "no RenewalReview with the given id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no Appeal with the given id"
  - id: ERR_NOT_ACCOUNT_HOLDER
    http: 403
    condition: "role Guardian whose X-User-ID is not the Student behind the application or account under operation"
  - id: ERR_NOT_ASSIGNED_PROVIDER
    http: 403
    condition: "role Provider whose X-User-ID is not the provider_id on the purchase request or provider under operation"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal the current Account.version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the current version of the account's Application"
  - id: ERR_PROGRAM_YEAR_NOT_ACTIVE
    http: 409
    condition: "the governing ProgramYear is not in the status the operation requires (e.g. a disbursement run against a DRAFT or CLOSED year, a renewal target year already CLOSED)"
  - id: ERR_APPLICATION_WINDOW_CLOSED
    http: 409
    condition: "the ProgramYear is not WINDOW_OPEN, or the logical clock is before window_open_at or at/after window_close_at"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the entity's current state, the acceptance deadline has passed, the run quarter is not current_quarter + 1, or reinstatement is attempted while a misuse case on the account is still open"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "a purchase, approval, or settlement is attempted against an Account whose status is SUSPENDED"
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "a third APPLICATION_DENIAL appeal is filed after appeal_round_count has reached 2"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the paired earlier step (approved the request being settled, approved the request behind the case being adjudicated, or authored the decision under appeal)"
  - id: ERR_FRAUD_RISK_TOO_HIGH
    http: 422
    condition: "approval attempted with screening_score >= 60, or reinstatement attempted with surveillance_score >= 75"
  - id: ERR_PROVIDER_NOT_ELIGIBLE
    http: 422
    condition: "the named Provider is not participation-eligible for the requested flow (DRAFT, SCREENED, DELISTED, PERMANENTLY_BARRED, or PROBATION with flow REIMBURSEMENT)"
  - id: ERR_CATEGORY_NOT_AUTHORIZED
    http: 422
    condition: "the ExpenseCategory.code is not in the Provider's authorized_category_codes"
  - id: ERR_EXPENSE_NOT_ALLOWABLE
    http: 422
    condition: "the ExpenseCategory has allowable false"
  - id: ERR_PREAPPROVAL_REQUIRED
    http: 422
    condition: "flow REIMBURSEMENT requested for a category whose requires_preapproval is true"
  - id: ERR_OVERLAPPING_ENROLLMENT_PERIOD
    http: 409
    condition: "the Student already holds an offered, accepted, or completed Application in a different ProgramYear whose inclusive term interval intersects the requested year's term"
  - id: ERR_DUPLICATE_SERVICE_PERIOD
    http: 409
    condition: "the ExpenseCategory has requires_service_period true and another PurchaseRequest for the same account and category with approval_status IN {PENDING_REVIEW, APPROVED} covers an intersecting half-open service interval"
  - id: ERR_SERVICE_PERIOD_OUTSIDE_TERM
    http: 422
    condition: "service_start_at or service_end_at falls outside the ProgramYear term, or service_end_at is not strictly after service_start_at"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "the Student already has a live Application for the same program_year_id"
  - id: ERR_RESIDENCY_NOT_ELIGIBLE
    http: 422
    condition: "Student.residency_state differs from ProgramYear.residency_state, or RenewalReview.residency_state_attested differs from the next ProgramYear.residency_state at renewal approval"
  - id: ERR_ASSESSMENT_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "the renewal assessment percentile is below min_assessment_percentile, or the portfolio artifact count is below min_portfolio_artifacts, or the evidence field required by the declared assessment_type is absent"
  - id: ERR_CATEGORY_CAP_EXCEEDED
    http: 422
    condition: "the request would push the account's committed spend in that category above ExpenseCategory.per_year_cap_cents"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 402
    condition: "amount_cents exceeds Account.balance_cents when the approval hold would be placed"
  - id: ERR_NO_SEATS_AVAILABLE
    http: 409
    condition: "renewal approval attempted while the next ProgramYear has seats_available 0"
  - id: ERR_CLAIM_AMOUNT_MISMATCH
    http: 422
    condition: "claimed_amount_cents is below 1 or above the PurchaseRequest.amount_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation_of_duties)
# ---------------------------------------------------------------------------

roles:
  - name: ProgramAdmin
    description: "State program operator. Owns program-year setup, the expense catalog, intake of students and providers, and every ops run (awarding, disbursement, year-end close, logical clock)."
    identity: opaque
    exclusive_operations:
      - "POST /esa/program-years"
      - "POST /esa/program-years/{id}/open-window"
      - "POST /esa/program-years/{id}/awarding-runs"
      - "POST /esa/program-years/{id}/disbursement-runs"
      - "POST /esa/program-years/{id}/year-end-close"
      - "POST /esa/students"
      - "POST /esa/providers"
      - "POST /esa/expense-categories"
      - "POST /esa/_clock/set_current_utc"
    shared_operations:
      - "GET /esa/program-years/{id}"
      - "GET /esa/program-years/{id}/disbursements"
      - "GET /esa/students/{id}"
      - "GET /esa/applications, GET /esa/applications/{id}"
      - "GET /esa/accounts, GET /esa/accounts/{id}"
      - "GET /esa/providers/{id}"
      - "GET /esa/purchase-requests, GET /esa/purchase-requests/{id}"
      - "GET /esa/misuse-cases, GET /esa/misuse-cases/{id}"
      - "GET /esa/renewal-reviews, GET /esa/renewal-reviews/{id}"
      - "GET /esa/appeals, GET /esa/appeals/{id}"

  - name: EligibilityOfficer
    description: "Determines student eligibility by residency, prior enrollment and income-or-category criteria, and decides continued-eligibility renewals."
    identity: opaque
    exclusive_operations:
      - "POST /esa/applications/{id}/eligibility-determinations"
      - "POST /esa/renewal-reviews/{id}/decision"
    shared_operations:
      - "GET /esa/applications, GET /esa/applications/{id}, GET /esa/applications/{id}/eligibility-determinations"
      - "GET /esa/students/{id}"
      - "GET /esa/accounts, GET /esa/accounts/{id}"
      - "GET /esa/renewal-reviews, GET /esa/renewal-reviews/{id}"
      - "GET /esa/appeals, GET /esa/appeals/{id}"

  - name: ExpenseReviewer
    description: "Adjudicates purchase pre-approvals and settles provider claims. May never settle a request it approved itself."
    identity: opaque
    exclusive_operations:
      - "POST /esa/purchase-requests/{id}/decision"
      - "POST /esa/purchase-requests/{id}/settle"
    shared_operations:
      - "GET /esa/purchase-requests, GET /esa/purchase-requests/{id}"
      - "GET /esa/accounts, GET /esa/accounts/{id}"
      - "GET /esa/expense-categories/{id}"
      - "GET /esa/providers/{id}"
      - "GET /esa/misuse-cases, GET /esa/misuse-cases/{id}"

  - name: VendorScreener
    description: "Screens candidate providers for fraud indicators and admits them to participation with a pinned category authorization."
    identity: opaque
    exclusive_operations:
      - "POST /esa/providers/{id}/fraud-screenings"
      - "POST /esa/providers/{id}/approve"
    shared_operations:
      - "GET /esa/providers/{id}, GET /esa/providers/{id}/fraud-screenings"
      - "GET /esa/expense-categories/{id}"
      - "GET /esa/program-years/{id}"

  - name: ComplianceOfficer
    description: "Runs misuse detection follow-up: opens and adjudicates cases, issues clawbacks, suspends or reinstates accounts, and sanctions or delists providers."
    identity: opaque
    exclusive_operations:
      - "POST /esa/misuse-cases"
      - "POST /esa/misuse-cases/{id}/review"
      - "POST /esa/misuse-cases/{id}/adjudication"
      - "POST /esa/misuse-cases/{id}/clawbacks"
      - "POST /esa/accounts/{id}/status-actions"
      - "POST /esa/providers/{id}/sanctions"
    shared_operations:
      - "GET /esa/misuse-cases, GET /esa/misuse-cases/{id}, GET /esa/misuse-cases/{id}/clawback-entries"
      - "GET /esa/accounts, GET /esa/accounts/{id}, GET /esa/accounts/{id}/disbursements, GET /esa/accounts/{id}/clawback-entries"
      - "GET /esa/purchase-requests, GET /esa/purchase-requests/{id}"
      - "GET /esa/providers/{id}, GET /esa/providers/{id}/fraud-screenings"
      - "GET /esa/program-years/{id}/disbursements"

  - name: AppealsOfficer
    description: "Decides appeals against application denials, clawbacks and provider delistings. May never decide an appeal against a decision it authored."
    identity: opaque
    exclusive_operations:
      - "POST /esa/appeals/{id}/decision"
    shared_operations:
      - "GET /esa/appeals, GET /esa/appeals/{id}"
      - "GET /esa/applications, GET /esa/applications/{id}, GET /esa/applications/{id}/eligibility-determinations"
      - "GET /esa/misuse-cases, GET /esa/misuse-cases/{id}, GET /esa/misuse-cases/{id}/clawback-entries"
      - "GET /esa/providers/{id}, GET /esa/providers/{id}/fraud-screenings"
      - "GET /esa/accounts/{id}, GET /esa/accounts/{id}/clawback-entries"

  - name: Guardian
    description: "Parent or guardian acting for one student. X-User-ID is that Student.id; every write is checked against the student behind the application or account."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /esa/applications"
      - "POST /esa/applications/{id}/submit"
      - "POST /esa/applications/{id}/accept-award"
      - "POST /esa/applications/{id}/withdraw"
      - "POST /esa/accounts/{id}/purchase-requests"
      - "POST /esa/renewal-reviews"
    shared_operations:
      - "POST /esa/appeals (subject_type APPLICATION_DENIAL or CLAWBACK)"
      - "GET /esa/applications, GET /esa/applications/{id}, GET /esa/applications/{id}/eligibility-determinations"
      - "GET /esa/accounts, GET /esa/accounts/{id}, GET /esa/accounts/{id}/disbursements, GET /esa/accounts/{id}/clawback-entries"
      - "GET /esa/purchase-requests, GET /esa/purchase-requests/{id}"
      - "GET /esa/misuse-cases, GET /esa/misuse-cases/{id}, GET /esa/misuse-cases/{id}/clawback-entries"
      - "GET /esa/renewal-reviews, GET /esa/renewal-reviews/{id}"
      - "GET /esa/appeals, GET /esa/appeals/{id}"
      - "GET /esa/students/{id}, GET /esa/providers/{id}, GET /esa/expense-categories/{id}, GET /esa/program-years/{id}"

  - name: Provider
    description: "Participating provider or vendor acting for itself. X-User-ID is that Provider.id; it may claim only against purchase requests naming it."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /esa/purchase-requests/{id}/claim"
    shared_operations:
      - "POST /esa/appeals (subject_type PROVIDER_DELISTING)"
      - "GET /esa/purchase-requests, GET /esa/purchase-requests/{id}"
      - "GET /esa/providers/{id}"
      - "GET /esa/appeals, GET /esa/appeals/{id}"
      - "GET /esa/expense-categories/{id}, GET /esa/program-years/{id}"
