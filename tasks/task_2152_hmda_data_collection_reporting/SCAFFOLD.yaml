# =============================================================================
# task_2152 — HMDA Data Collection & Reporting (bank mortgage compliance)
# Seed tables §1.0–§1.7
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2152. HMDA Data Collection & Reporting
  (bank mortgage compliance): application register field capture at each stage,
  action-taken & date accuracy rules, demographic collection & visual observation
  rules, geocoding & census tract assignment, edit checks (syntactical/validity/
  quality) & resubmission, annual filing deadline & disclosure statement, data
  scrub & audit sampling, fair lending analysis using register data

domain_name: hmda-register
api_prefix: /hmda

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Twelve peer entities linked by explicit foreign keys. No entity is addressed
  # through a nested creation path; every write endpoint takes its parent id in
  # the request body. Reads expose parents' children through sub-resource GETs.

  state_machine_shape: cyclic
  # FilingSubmission loops DRAFT -> EDITS_ATTACHED -> CERTIFIED -> FILED ->
  # REJECTED -> DRAFT; Application carries TWO independent state dimensions
  # (stage x lar_status) that evolve on the same row; AuditSample forks
  # DRAFT -> IN_REVIEW -> {CLOSED_CLEAN | CLOSED_WITH_FINDINGS}; EditException
  # cycles VERIFIED -> OPEN when its Application is reopened.

  relationship_patterns:
    - one_to_many        # Institution -> Application / EditRun / FilingSubmission / AuditSample
    - self_referential   # Application.supersedes_application_id -> Application.id
    - cross_aggregate    # FilingSubmission.edit_run_id crosses the EditRun aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer who certifies a FilingSubmission MUST NOT be the same
  # X-User-ID that verified any EditException on the attached EditRun.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: lei, type: string, source: input, description: "Legal Entity Identifier of the reporting bank; unique across all Institution rows", constraints: "exactly 20 characters, uppercase alphanumeric" }
      - { name: name, type: string, source: input, description: "Reporting bank legal name" }
      - { name: activity_year, type: integer, source: input, description: "HMDA activity year this register covers", constraints: "2020..2035" }
      - { name: asset_size_usd_cents, type: integer, source: input, description: "Total assets at prior year end, in cents" }
      - { name: prior_year_closed_end_originations, type: integer, source: input, default: 0, description: "Closed-end mortgage originations reported for the prior calendar year" }
      - { name: prior_year_open_end_originations, type: integer, source: input, default: 0, description: "Open-end line-of-credit originations reported for the prior calendar year" }
      - { name: partial_exemption_eligible, type: boolean, source: computed, description: "Output of calculations.filing_profile_resolution step 4" }
      - { name: quarterly_filer, type: boolean, source: computed, description: "Output of calculations.filing_profile_resolution step 3" }
      - { name: required_field_count, type: integer, source: computed, description: "26 when partial_exemption_eligible, else 48; output of calculations.filing_profile_resolution step 5" }
      - { name: total_application_count, type: integer, source: computed, default: 0, description: "Count of all Application rows whose institution_id equals this id" }
      - { name: pending_record_count, type: integer, source: computed, default: 0, description: "Count of own Applications with lar_status == PENDING_FIELDS" }
      - { name: reportable_record_count, type: integer, source: computed, default: 0, description: "Count of own Applications with lar_status IN {COMPLETE, EXCEPTION_FLAGGED, CLEARED}" }
      - { name: excluded_record_count, type: integer, source: computed, default: 0, description: "Count of own Applications with lar_status == EXCLUDED" }
      - { name: cleared_record_count, type: integer, source: computed, default: 0, description: "Count of own Applications with lar_status == CLEARED" }
      - { name: open_register_count, type: integer, source: computed, default: 0, description: "Count of own Applications with stage != ARCHIVED" }
      - { name: filing_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | LOCKED_FOR_FILING | FILED_YEAR | CLOSED_YEAR — gates FilingSubmission.file", constraints: "OPEN, LOCKED_FOR_FILING, FILED_YEAR, CLOSED_YEAR" }
      - { name: filing_deadline_at, type: datetime, source: computed, description: "= (activity_year + 1)-03-01T23:59:59.000Z; output of calculations.filing_deadline_and_lateness step 1" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the reporting bank that owns this register record" }
      - { name: uli, type: string, source: input, description: "Universal Loan Identifier; unique among non-superseded Applications of the same institution" }
      - { name: application_date, type: datetime, source: input, description: "Date the application was received" }
      - { name: application_channel, type: enum, source: input, description: "How the application was taken; gates demographic visual-observation rules", constraints: "FACE_TO_FACE, MAIL, INTERNET, TELEPHONE" }
      - { name: loan_type, type: enum, source: input, description: "Loan program", constraints: "CONVENTIONAL, FHA, VA, RHS_FSA" }
      - { name: loan_purpose, type: enum, source: input, description: "Purpose of credit", constraints: "HOME_PURCHASE, HOME_IMPROVEMENT, REFINANCING, CASH_OUT_REFINANCING, OTHER_PURPOSE" }
      - { name: occupancy_type, type: enum, source: input, description: "Occupancy of the secured property", constraints: "PRINCIPAL, SECOND, INVESTMENT" }
      - { name: lien_status, type: enum, source: input, description: "Lien position", constraints: "FIRST_LIEN, SUBORDINATE_LIEN" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Loan or line amount in cents", constraints: ">= 1" }
      - { name: income_thousands, type: integer, source: input, description: "Gross annual income relied on, in thousands of dollars; nullable at intake" }
      - { name: rate_spread, type: number, source: input, description: "Difference between APR and APOR, percentage points; nullable" }
      - { name: purchaser_type, type: enum, source: input, description: "Type of purchaser of the loan", constraints: "NOT_APPLICABLE, FANNIE_MAE, FREDDIE_MAC, GINNIE_MAE, PRIVATE_SECURITIZER, OTHER" }
      - { name: denial_reason_codes, type: array, source: input, default: [], description: "Denial reasons; each of DEBT_TO_INCOME, EMPLOYMENT_HISTORY, CREDIT_HISTORY, COLLATERAL, INSUFFICIENT_CASH, UNVERIFIABLE_INFO, INCOMPLETE_APPLICATION, MORTGAGE_INSURANCE_DENIED, OTHER" }
      - { name: business_or_commercial_purpose, type: boolean, source: input, default: false, description: "True when the loan is primarily for a business or commercial purpose" }
      - { name: open_end_line_of_credit, type: boolean, source: input, default: false, description: "True for open-end lines of credit" }
      - { name: action_taken, type: enum, source: input, description: "Register action taken; null until POST /hmda/applications/{id}/action-taken", constraints: "ORIGINATED, APPROVED_NOT_ACCEPTED, DENIED, WITHDRAWN, FILE_CLOSED_INCOMPLETE, PURCHASED_LOAN, PREAPPROVAL_DENIED, PREAPPROVAL_APPROVED_NOT_ACCEPTED" }
      - { name: action_taken_date, type: datetime, source: input, description: "Date the action was taken; null until action-taken is recorded" }
      - { name: supersedes_application_id, type: string, source: input, description: "FK -> Application.id; set when this row is a corrected replacement for an earlier register record" }
      - { name: is_superseded, type: boolean, source: computed, default: false, description: "True when some other Application declares supersedes_application_id == this id" }
      - { name: stage, type: enum, source: system, default: "INTAKE", description: "Field-capture stage dimension", constraints: "INTAKE, UNDERWRITING, DECISIONED, REGISTER_LOCKED, ARCHIVED" }
      - { name: lar_status, type: enum, source: system, default: "PENDING_FIELDS", description: "Register-quality dimension, independent of stage", constraints: "PENDING_FIELDS, COMPLETE, EXCEPTION_FLAGGED, CLEARED, EXCLUDED" }
      - { name: captured_field_count, type: integer, source: computed, default: 0, description: "Number of applicable required fields currently present; output of calculations.application_completeness" }
      - { name: applicable_field_count, type: integer, source: computed, default: 0, description: "Size of the applicable required-field set for this row; output of calculations.application_completeness" }
      - { name: exclusion_reason, type: enum, source: computed, default: "NOT_EXCLUDED", description: "Why the row is outside the register", constraints: "NOT_EXCLUDED, BUSINESS_PURPOSE" }

  - name: DemographicEntry
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the register record this applicant belongs to" }
      - { name: applicant_role, type: enum, source: input, description: "Which applicant this row describes", constraints: "APPLICANT, CO_APPLICANT" }
      - { name: is_natural_person, type: boolean, source: input, default: true, description: "False when the applicant is a trust, estate or other non-natural person" }
      - { name: collection_method, type: enum, source: input, description: "How ethnicity/race/sex were obtained", constraints: "PROVIDED_BY_APPLICANT, VISUAL_OBSERVATION_OR_SURNAME, NOT_PROVIDED_BY_APPLICANT, NOT_APPLICABLE" }
      - { name: ethnicity_codes, type: array, source: input, description: "Aggregate codes HISPANIC_OR_LATINO, NOT_HISPANIC_OR_LATINO, INFO_NOT_PROVIDED, NOT_APPLICABLE; disaggregated codes MEXICAN, PUERTO_RICAN, CUBAN, OTHER_HISPANIC" }
      - { name: race_codes, type: array, source: input, description: "Aggregate codes AMERICAN_INDIAN, ASIAN, BLACK, PACIFIC_ISLANDER, WHITE, INFO_NOT_PROVIDED, NOT_APPLICABLE; disaggregated codes ASIAN_INDIAN, CHINESE, FILIPINO, JAPANESE, KOREAN, VIETNAMESE, OTHER_ASIAN, NATIVE_HAWAIIAN, GUAMANIAN, SAMOAN, OTHER_PACIFIC_ISLANDER" }
      - { name: sex_code, type: enum, source: input, description: "Sex of the applicant", constraints: "MALE, FEMALE, BOTH, INFO_NOT_PROVIDED, NOT_APPLICABLE" }
      - { name: age_years, type: integer, source: input, description: "Applicant age in years; nullable" }
      - { name: observation_basis, type: enum, source: input, default: "NOT_OBSERVED", description: "Basis when collection_method is VISUAL_OBSERVATION_OR_SURNAME", constraints: "NOT_OBSERVED, SURNAME, VISUAL" }
      - { name: status, type: enum, source: system, default: "RECORDED", description: "Lifecycle of this demographic row", constraints: "RECORDED, AMENDED" }

  - name: GeocodeAssignment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the register record whose property is being geocoded" }
      - { name: census_tract_id, type: string, source: computed, description: "FK -> CensusTract.id; resolved tract, null while status is PENDING, AMBIGUOUS or NOT_MATCHED" }
      - { name: street_address, type: string, source: input, description: "Property street address" }
      - { name: city, type: string, source: input, description: "Property city" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the property" }
      - { name: zip_code, type: string, source: input, description: "Five-digit ZIP code of the property" }
      - { name: county_fips, type: string, source: input, description: "Five-digit county FIPS code of the property" }
      - { name: submitted_tract_code, type: string, source: input, description: "Optional 11-digit census tract code asserted by the loan officer" }
      - { name: candidate_count, type: integer, source: computed, default: 0, description: "Number of CensusTract rows matched by calculations.geocode_match_resolution" }
      - { name: msa_md_code, type: string, source: computed, description: "MSA/MD code copied from the resolved CensusTract; null when unresolved" }
      - { name: override_reason, type: string, source: input, description: "Justification recorded on manual-override; null otherwise" }
      - { name: is_current, type: boolean, source: computed, default: true, description: "False once a newer GeocodeAssignment is created for the same application_id" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Geocoding outcome", constraints: "PENDING, MATCHED, AMBIGUOUS, NOT_MATCHED, MANUAL_OVERRIDE" }

  - name: CensusTract
    parent: null
    common_fields: false
    fields:
      - { name: tract_code, type: string, source: input, description: "Eleven-digit census tract code" }
      - { name: county_fips, type: string, source: input, description: "Five-digit county FIPS code" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: msa_md_code, type: string, source: input, description: "Five-digit MSA/MD code" }
      - { name: minority_population_pct, type: number, source: input, description: "Minority population share of the tract, percent" }
      - { name: tract_to_msa_income_pct, type: number, source: input, description: "Tract median family income as a percent of MSA median" }
      - { name: owner_occupied_units, type: integer, source: input, description: "Owner-occupied housing units; drives disclosure suppression" }
      - { name: median_family_income_cents, type: integer, source: input, description: "Tract median family income in cents" }

  - name: EditRun
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the register this run evaluates" }
      - { name: run_index, type: integer, source: system, description: "1-based monotone counter within the institution, assigned in creation order" }
      - { name: scope, type: enum, source: input, description: "Breadth of the run", constraints: "FULL, INCREMENTAL" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the review window this run occupies on the institution" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the review window this run occupies on the institution" }
      - { name: snapshot_record_count, type: integer, source: computed, description: "Size of the snapshot record set frozen at run start, before any verification" }
      - { name: syntactical_count, type: integer, source: computed, default: 0, description: "Exceptions created with severity SYNTACTICAL" }
      - { name: validity_count, type: integer, source: computed, default: 0, description: "Exceptions created with severity VALIDITY" }
      - { name: quality_count, type: integer, source: computed, default: 0, description: "Exceptions created with severity QUALITY" }
      - { name: macro_count, type: integer, source: computed, default: 0, description: "Exceptions created with severity MACRO" }
      - { name: total_exception_count, type: integer, source: computed, default: 0, description: "syntactical_count + validity_count + quality_count + macro_count" }
      - { name: open_exception_count, type: integer, source: computed, default: 0, description: "Own EditExceptions with status OPEN" }
      - { name: verified_exception_count, type: integer, source: computed, default: 0, description: "Own EditExceptions with status VERIFIED" }
      - { name: stale_exception_count, type: integer, source: computed, default: 0, description: "Own EditExceptions with status STALE" }
      - { name: cleared_record_count, type: integer, source: computed, default: 0, description: "Snapshot records currently carrying zero OPEN EditExceptions from this run" }
      - { name: required_verified_quota, type: integer, source: computed, default: 0, description: "Output of calculations.certification_verification_quota" }
      - { name: status, type: enum, source: system, default: "RUNNING", description: "Run lifecycle", constraints: "RUNNING, COMPLETED, CLEARED_ALL, INVALIDATED" }

  - name: EditException
    parent: null
    common_fields: true
    fields:
      - { name: edit_run_id, type: string, source: system, description: "FK -> EditRun.id; the run that raised this exception" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; null for MACRO edits that describe the whole register" }
      - { name: edit_code, type: string, source: system, description: "Catalog code such as S300, S301, V610, V620, V631, Q607, Q615, Q620, Q800" }
      - { name: severity, type: enum, source: system, description: "Edit class", constraints: "SYNTACTICAL, VALIDITY, QUALITY, MACRO" }
      - { name: field_name, type: string, source: system, description: "Register field the edit points at" }
      - { name: message, type: string, source: system, description: "Human-readable edit description" }
      - { name: verification_note, type: string, source: input, description: "Analyst justification recorded on verify; null while OPEN" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAnalyst who verified; null while OPEN" }
      - { name: verified_at, type: datetime, source: system, description: "Logical clock value at verification; null while OPEN" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Exception lifecycle", constraints: "OPEN, VERIFIED, STALE" }

  - name: FilingSubmission
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the filer" }
      - { name: edit_run_id, type: string, source: input, description: "FK -> EditRun.id; the run attached to this submission, null while DRAFT" }
      - { name: activity_year, type: integer, source: computed, description: "Copied from Institution.activity_year at creation" }
      - { name: submission_index, type: integer, source: system, description: "1-based monotone counter within the institution, assigned in creation order" }
      - { name: provisional_record_count, type: integer, source: computed, description: "PROVISIONAL variant of calculations.submission_record_count, frozen at creation" }
      - { name: final_record_count, type: integer, source: computed, description: "FINAL variant of calculations.submission_record_count, frozen at certification; null before" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying ComplianceOfficer; null while not CERTIFIED" }
      - { name: certified_at, type: datetime, source: system, description: "Logical clock value at certification; null before" }
      - { name: attestation_text, type: string, source: input, description: "Officer attestation captured at certification" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock value at filing; null before" }
      - { name: deadline_at, type: datetime, source: computed, description: "Copied from Institution.filing_deadline_at at creation" }
      - { name: is_late, type: boolean, source: computed, description: "filed_at > deadline_at; null before filing" }
      - { name: late_by_days, type: integer, source: computed, description: "Whole days late, ceiling; 0 when on time, null before filing" }
      - { name: rejection_reason, type: string, source: input, description: "Examiner text recorded on a REJECT review; null otherwise" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Number of times this submission has returned to DRAFT via resubmit" }
      - { name: is_superseded, type: boolean, source: computed, default: false, description: "True once a newer FilingSubmission for the same institution has been created while this one was DRAFT" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Submission lifecycle", constraints: "DRAFT, EDITS_ATTACHED, CERTIFIED, FILED, ACCEPTED, REJECTED" }

  - name: DisclosureStatement
    parent: null
    common_fields: false
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> FilingSubmission.id; the filing that produced this statement" }
      - { name: statement_type, type: enum, source: system, description: "Which public artifact this row is", constraints: "MODIFIED_LAR, DISCLOSURE_REPORT" }
      - { name: record_count, type: integer, source: computed, description: "Equals the submission's final_record_count" }
      - { name: tract_suppression_count, type: integer, source: computed, description: "Number of distinct tract groups suppressed by calculations.disclosure_redaction" }
      - { name: suppressed_record_count, type: integer, source: computed, description: "Records falling inside suppressed tract groups" }
      - { name: redacted_field_count, type: integer, source: computed, description: "= suppressed_record_count * REDACTED_FIELDS_PER_SUPPRESSED_RECORD" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock value when the filing was made" }

  - name: AuditSample
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the register being scrubbed" }
      - { name: sample_index, type: integer, source: system, description: "1-based monotone counter within the institution, assigned in creation order" }
      - { name: method, type: enum, source: input, description: "Selection method", constraints: "SYSTEMATIC_INTERVAL, STRATIFIED_BY_ACTION" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the action-date period sampled" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the action-date period sampled" }
      - { name: fields_reviewed_per_record, type: integer, source: input, description: "Number of register fields re-keyed from source documents per sampled record", constraints: ">= 1" }
      - { name: population_size, type: integer, source: computed, description: "Candidate set size at creation" }
      - { name: sample_size, type: integer, source: computed, description: "Output of calculations.audit_sample_sizing_and_selection" }
      - { name: selected_application_ids, type: array, source: computed, description: "Ordered ids drawn by the systematic interval walk" }
      - { name: defect_count, type: integer, source: computed, default: 0, description: "Own AuditFindings with is_defect true" }
      - { name: records_with_defect_count, type: integer, source: computed, default: 0, description: "Distinct application_id values among defect findings" }
      - { name: defect_rate_basis, type: enum, source: input, description: "Which variant of calculations.audit_defect_rate was applied at close; null before", constraints: "FIELD_WEIGHTED, RECORD_WEIGHTED" }
      - { name: defect_rate_pct, type: number, source: computed, description: "Defect rate under defect_rate_basis; null before close" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Sample lifecycle", constraints: "DRAFT, IN_REVIEW, CLOSED_CLEAN, CLOSED_WITH_FINDINGS" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: audit_sample_id, type: string, source: input, description: "FK -> AuditSample.id; the sample this finding belongs to" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the sampled register record" }
      - { name: field_name, type: string, source: input, description: "Register field re-keyed from the source document" }
      - { name: recorded_value, type: string, source: input, description: "Value currently on the register" }
      - { name: source_document_value, type: string, source: input, description: "Value read from the source document" }
      - { name: is_defect, type: boolean, source: computed, description: "recorded_value != source_document_value, exact case-sensitive comparison" }
      - { name: severity, type: enum, source: input, description: "Materiality of the discrepancy", constraints: "MATERIAL, NON_MATERIAL" }
      - { name: remediation_start, type: datetime, source: input, description: "Inclusive start of the remediation window this finding occupies on the application" }
      - { name: remediation_end, type: datetime, source: input, description: "Inclusive end of the remediation window this finding occupies on the application" }
      - { name: resolution, type: enum, source: system, default: "OPEN", description: "Finding disposition", constraints: "OPEN, ACCEPTED_AS_IS" }

  - name: FairLendingAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the register analysed" }
      - { name: analysis_index, type: integer, source: system, description: "1-based monotone counter within the institution, assigned in creation order" }
      - { name: basis, type: enum, source: input, description: "Prohibited basis dimension analysed", constraints: "RACE, ETHNICITY, SEX" }
      - { name: control_group_code, type: string, source: input, description: "Demographic code forming the control group, matched against the APPLICANT DemographicEntry" }
      - { name: protected_group_code, type: string, source: input, description: "Demographic code forming the protected group, matched against the APPLICANT DemographicEntry" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the action-date period analysed" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the action-date period analysed" }
      - { name: control_total, type: integer, source: computed, description: "Records in the control group" }
      - { name: control_denied, type: integer, source: computed, description: "Control records with action_taken IN {DENIED, PREAPPROVAL_DENIED}" }
      - { name: protected_total, type: integer, source: computed, description: "Records in the protected group" }
      - { name: protected_denied, type: integer, source: computed, description: "Protected records with action_taken IN {DENIED, PREAPPROVAL_DENIED}" }
      - { name: control_denial_rate_pct, type: number, source: computed, description: "Step 1 of calculations.fair_lending_disparity_index, rounded to 2dp before use" }
      - { name: protected_denial_rate_pct, type: number, source: computed, description: "Step 2 of calculations.fair_lending_disparity_index, rounded to 2dp before use" }
      - { name: disparity_index, type: number, source: computed, description: "Step 3, computed from the two ALREADY-ROUNDED rates" }
      - { name: significance_flag, type: enum, source: computed, description: "Banding of disparity_index", constraints: "NOT_SIGNIFICANT, ELEVATED, SEVERE" }
      - { name: status, type: enum, source: system, default: "COMPUTED", description: "Analysis lifecycle", constraints: "COMPUTED, ESCALATED, CLEARED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Application dimension 1 of 2: field-capture stage -------------------
  - entity: Application
    state_field: stage
    initial_state: INTAKE
    terminal_states: [ARCHIVED]
    transitions:
      - from: INTAKE
        to: UNDERWRITING
        trigger: "POST /hmda/applications/{id}/advance with to_stage=UNDERWRITING"
        actor: LoanOfficer
        preconditions:
          - "At least one DemographicEntry exists with application_id == this id and applicant_role == APPLICANT, else ERR_MISSING_APPLICANT_DEMOGRAPHICS"
        side_effects:
          - "stage := UNDERWRITING"
          - "increments Application.version by 1"

      - from: UNDERWRITING
        to: DECISIONED
        trigger: "POST /hmda/applications/{id}/advance with to_stage=DECISIONED"
        actor: LoanOfficer
        preconditions:
          - "application_date <= logical clock, else ERR_INVALID_STAGE_TRANSITION"
        side_effects:
          - "stage := DECISIONED"
          - "increments Application.version by 1"

      - from: DECISIONED
        to: REGISTER_LOCKED
        trigger: "POST /hmda/applications/{id}/advance with to_stage=REGISTER_LOCKED"
        actor: LoanOfficer
        preconditions:
          - "action_taken IS NOT NULL, else ERR_INVALID_STAGE_TRANSITION"
          - "the GeocodeAssignment with application_id == this id and is_current == true has status IN {MATCHED, MANUAL_OVERRIDE}, else ERR_GEOCODE_UNRESOLVED"
          - "lar_status IN {COMPLETE, EXCLUDED}, else ERR_INVALID_STAGE_TRANSITION"
        side_effects:
          - "stage := REGISTER_LOCKED"
          - "increments Application.version by 1"

      - from: REGISTER_LOCKED
        to: DECISIONED
        trigger: "POST /hmda/applications/{id}/reopen"
        actor: ComplianceAnalyst
        preconditions:
          - "stage == REGISTER_LOCKED, else ERR_INVALID_STAGE_TRANSITION"
        side_effects:
          - "stage := DECISIONED; action_taken := null; action_taken_date := null"
          - "CASCADE hop 1 -> calculations.application_completeness reruns and lar_status leaves CLEARED for PENDING_FIELDS; Institution.pending_record_count/reportable_record_count/cleared_record_count recomputed"
          - "CASCADE hop 2 (caused by hop 1) -> every EditException with this application_id and status VERIFIED reverts to OPEN; the owning EditRun.verified_exception_count decreases, open_exception_count increases, cleared_record_count decreases by 1"
          - "CASCADE hop 3 (caused by hop 2) -> that EditRun.status becomes INVALIDATED because its snapshot no longer describes the register"
          - "CASCADE hop 4 (caused by hop 3) -> every FilingSubmission whose edit_run_id is that run and whose status IN {EDITS_ATTACHED, CERTIFIED} returns to DRAFT; edit_run_id, certified_by_user_id, certified_at, attestation_text and final_record_count are cleared"
          - "CASCADE hop 5 (caused by hop 4) -> Institution.filing_posture returns from LOCKED_FOR_FILING to OPEN"
          - "increments Application.version by 1"

      - from: REGISTER_LOCKED
        to: ARCHIVED
        trigger: "system, during POST /hmda/submissions/{id}/file"
        actor: system
        preconditions:
          - "the Application is a member of the filing submission's FINAL record set"
        side_effects:
          - "stage := ARCHIVED"
          - "Institution.open_register_count recomputed"
          - "increments Application.version by 1"

      - from: ARCHIVED
        to: REGISTER_LOCKED
        trigger: "system, during POST /hmda/submissions/{id}/review with decision=REJECT"
        actor: system
        preconditions:
          - "the Application was archived by the submission being rejected"
        side_effects:
          - "stage := REGISTER_LOCKED"
          - "Institution.open_register_count recomputed; filing_posture returns to OPEN"
          - "increments Application.version by 1"

  # --- Application dimension 2 of 2: register quality ----------------------
  - entity: Application
    state_field: lar_status
    initial_state: PENDING_FIELDS
    terminal_states: []
    note: "Evolves independently of stage on the same row; a record can be DECISIONED/PENDING_FIELDS or DECISIONED/EXCEPTION_FLAGGED."
    transitions:
      - from: PENDING_FIELDS
        to: COMPLETE
        trigger: "POST /hmda/applications/{id}/action-taken or PATCH /hmda/applications/{id}"
        actor: LoanOfficer
        preconditions:
          - "captured_field_count == applicable_field_count per calculations.application_completeness"
        side_effects:
          - "lar_status := COMPLETE"
          - "Institution.pending_record_count -1, Institution.reportable_record_count +1"

      - from: COMPLETE
        to: PENDING_FIELDS
        trigger: "POST /hmda/applications/{id}/reopen or PATCH /hmda/applications/{id} that clears a required field"
        actor: ComplianceAnalyst | LoanOfficer
        preconditions:
          - "captured_field_count < applicable_field_count after the mutation"
        side_effects:
          - "lar_status := PENDING_FIELDS"
          - "Institution.reportable_record_count -1, Institution.pending_record_count +1"

      - from: PENDING_FIELDS
        to: EXCLUDED
        trigger: "PATCH /hmda/applications/{id} setting loan_purpose=OTHER_PURPOSE on a business-purpose row"
        actor: LoanOfficer
        preconditions:
          - "business_or_commercial_purpose == true AND loan_purpose NOT IN {HOME_PURCHASE, HOME_IMPROVEMENT, REFINANCING, CASH_OUT_REFINANCING}"
        side_effects:
          - "lar_status := EXCLUDED; exclusion_reason := BUSINESS_PURPOSE"
          - "Institution.excluded_record_count +1, Institution.pending_record_count -1"

      - from: COMPLETE
        to: EXCEPTION_FLAGGED
        trigger: "system, during POST /hmda/edit-runs"
        actor: system
        preconditions:
          - "the run raised at least one record-level EditException for this application_id"
        side_effects:
          - "lar_status := EXCEPTION_FLAGGED"

      - from: PENDING_FIELDS
        to: EXCEPTION_FLAGGED
        trigger: "system, during POST /hmda/edit-runs"
        actor: system
        preconditions:
          - "the row is in the run snapshot and the run raised at least one record-level EditException for it"
        side_effects:
          - "lar_status := EXCEPTION_FLAGGED"

      - from: COMPLETE
        to: CLEARED
        trigger: "system, during POST /hmda/edit-runs"
        actor: system
        preconditions:
          - "the row is in the run snapshot and the run raised zero record-level EditExceptions for it"
        side_effects:
          - "lar_status := CLEARED; EditRun.cleared_record_count +1; Institution.cleared_record_count +1"

      - from: EXCEPTION_FLAGGED
        to: CLEARED
        trigger: "system, during POST /hmda/edit-exceptions/{id}/verify"
        actor: system
        preconditions:
          - "after this verification the application has zero EditExceptions with status OPEN from the current run"
        side_effects:
          - "CASCADE hop 1 -> lar_status := CLEARED; Institution.cleared_record_count +1"
          - "CASCADE hop 2 (caused by hop 1) -> owning EditRun.cleared_record_count +1"
          - "CASCADE hop 3 (caused by hop 2) -> when EditRun.cleared_record_count == EditRun.snapshot_record_count the run's status moves COMPLETED -> CLEARED_ALL"

      - from: CLEARED
        to: EXCEPTION_FLAGGED
        trigger: "system, during a later POST /hmda/edit-runs that raises a new exception for the row"
        actor: system
        preconditions:
          - "the newer run raised at least one record-level EditException for this application_id"
        side_effects:
          - "lar_status := EXCEPTION_FLAGGED; Institution.cleared_record_count -1"

      - from: CLEARED
        to: PENDING_FIELDS
        trigger: "POST /hmda/applications/{id}/reopen"
        actor: ComplianceAnalyst
        preconditions:
          - "stage == REGISTER_LOCKED"
        side_effects:
          - "lar_status := PENDING_FIELDS; Institution.cleared_record_count -1, reportable_record_count -1, pending_record_count +1"

  # --- GeocodeAssignment ---------------------------------------------------
  - entity: GeocodeAssignment
    state_field: status
    initial_state: PENDING
    terminal_states: [MATCHED, MANUAL_OVERRIDE]
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "system, inside POST /hmda/geocode-assignments"
        actor: system
        preconditions:
          - "calculations.geocode_match_resolution yields candidate_count == 1"
        side_effects:
          - "status := MATCHED; census_tract_id := the single candidate; msa_md_code copied from that CensusTract"
          - "any earlier GeocodeAssignment for the same application_id gets is_current := false"
          - "increments Application.version by 1"
      - from: PENDING
        to: AMBIGUOUS
        trigger: "system, inside POST /hmda/geocode-assignments"
        actor: system
        preconditions:
          - "no submitted_tract_code was supplied and calculations.geocode_match_resolution yields candidate_count >= 2"
        side_effects:
          - "status := AMBIGUOUS; census_tract_id := null; msa_md_code := null"
          - "increments Application.version by 1"
      - from: PENDING
        to: NOT_MATCHED
        trigger: "system, inside POST /hmda/geocode-assignments"
        actor: system
        preconditions:
          - "calculations.geocode_match_resolution yields candidate_count == 0"
        side_effects:
          - "status := NOT_MATCHED; census_tract_id := null; msa_md_code := null"
          - "increments Application.version by 1"
      - from: AMBIGUOUS
        to: MANUAL_OVERRIDE
        trigger: "POST /hmda/geocode-assignments/{id}/manual-override"
        actor: ComplianceAnalyst
        preconditions:
          - "status IN {AMBIGUOUS, NOT_MATCHED}, else ERR_GEOCODE_NOT_OVERRIDABLE"
          - "the supplied CensusTract has county_fips == this.county_fips AND state_code == this.state_code, else ERR_GEOCODE_TRACT_MISMATCH"
        side_effects:
          - "status := MANUAL_OVERRIDE; census_tract_id := supplied tract; msa_md_code copied; override_reason stored"
      - from: NOT_MATCHED
        to: MANUAL_OVERRIDE
        trigger: "POST /hmda/geocode-assignments/{id}/manual-override"
        actor: ComplianceAnalyst
        preconditions:
          - "status IN {AMBIGUOUS, NOT_MATCHED}, else ERR_GEOCODE_NOT_OVERRIDABLE"
          - "the supplied CensusTract has county_fips == this.county_fips AND state_code == this.state_code, else ERR_GEOCODE_TRACT_MISMATCH"
        side_effects:
          - "status := MANUAL_OVERRIDE; census_tract_id := supplied tract; msa_md_code copied; override_reason stored"

  # --- EditRun -------------------------------------------------------------
  - entity: EditRun
    state_field: status
    initial_state: RUNNING
    terminal_states: [INVALIDATED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "system, inside POST /hmda/edit-runs after calculations.edit_check_evaluation finishes"
        actor: system
        preconditions:
          - "open_exception_count >= 1"
        side_effects:
          - "status := COMPLETED; required_verified_quota set by calculations.certification_verification_quota"
          - "every EditException of every earlier non-INVALIDATED run of the same institution moves to STALE, and each of those runs moves to INVALIDATED"
      - from: RUNNING
        to: CLEARED_ALL
        trigger: "system, inside POST /hmda/edit-runs after calculations.edit_check_evaluation finishes"
        actor: system
        preconditions:
          - "open_exception_count == 0"
        side_effects:
          - "status := CLEARED_ALL; cleared_record_count := snapshot_record_count; required_verified_quota := 0"
          - "every EditException of every earlier non-INVALIDATED run of the same institution moves to STALE, and each of those runs moves to INVALIDATED"
      - from: COMPLETED
        to: CLEARED_ALL
        trigger: "system, bubble-up during POST /hmda/edit-exceptions/{id}/verify"
        actor: system
        preconditions:
          - "cleared_record_count == snapshot_record_count after the verification cascade"
        side_effects:
          - "status := CLEARED_ALL"
      - from: CLEARED_ALL
        to: INVALIDATED
        trigger: "system, cascade hop 3 of POST /hmda/applications/{id}/reopen, or a newer POST /hmda/edit-runs on the same institution"
        actor: system
        preconditions:
          - "a snapshot record left CLEARED, or a newer run superseded this one"
        side_effects:
          - "status := INVALIDATED"
          - "every FilingSubmission with this edit_run_id and status IN {EDITS_ATTACHED, CERTIFIED} returns to DRAFT"
      - from: COMPLETED
        to: INVALIDATED
        trigger: "system, cascade hop 3 of POST /hmda/applications/{id}/reopen, or a newer POST /hmda/edit-runs on the same institution"
        actor: system
        preconditions:
          - "a snapshot record left CLEARED, or a newer run superseded this one"
        side_effects:
          - "status := INVALIDATED"
          - "every FilingSubmission with this edit_run_id and status IN {EDITS_ATTACHED, CERTIFIED} returns to DRAFT"

  # --- EditException -------------------------------------------------------
  - entity: EditException
    state_field: status
    initial_state: OPEN
    terminal_states: [STALE]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /hmda/edit-exceptions/{id}/verify"
        actor: ComplianceAnalyst
        preconditions:
          - "status == OPEN, else ERR_EXCEPTION_NOT_OPEN"
          - "severity IN {QUALITY, MACRO}, else ERR_SEVERITY_NOT_VERIFIABLE"
          - "when application_id is not null, that Application.stage != ARCHIVED, else ERR_APPLICATION_ARCHIVED"
        side_effects:
          - "status := VERIFIED; verified_by_user_id := X-User-ID; verified_at := logical clock; verification_note stored"
          - "EditRun.open_exception_count -1, verified_exception_count +1"
          - "bubble-up cascade into Application.lar_status and EditRun.status per the Application lar_status machine"
      - from: VERIFIED
        to: OPEN
        trigger: "system, cascade hop 2 of POST /hmda/applications/{id}/reopen"
        actor: system
        preconditions:
          - "the exception's application_id was reopened"
        side_effects:
          - "status := OPEN; verified_by_user_id := null; verified_at := null; verification_note := null"
          - "EditRun.verified_exception_count -1, open_exception_count +1"
      - from: OPEN
        to: STALE
        trigger: "system, inside a newer POST /hmda/edit-runs for the same institution"
        actor: system
        preconditions:
          - "a newer EditRun for the same institution completed"
        side_effects:
          - "status := STALE; EditRun.open_exception_count -1, stale_exception_count +1"
      - from: VERIFIED
        to: STALE
        trigger: "system, inside a newer POST /hmda/edit-runs for the same institution"
        actor: system
        preconditions:
          - "a newer EditRun for the same institution completed"
        side_effects:
          - "status := STALE; EditRun.verified_exception_count -1, stale_exception_count +1"

  # --- FilingSubmission (cyclic) ------------------------------------------
  - entity: FilingSubmission
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: EDITS_ATTACHED
        trigger: "POST /hmda/submissions/{id}/attach-edit-run"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT, else ERR_INVALID_SUBMISSION_STATE"
          - "EditRun.institution_id == this.institution_id, else ERR_EDIT_RUN_INSTITUTION_MISMATCH"
          - "EditRun.status IN {COMPLETED, CLEARED_ALL}, else ERR_EDIT_RUN_INVALIDATED"
        side_effects:
          - "status := EDITS_ATTACHED; edit_run_id stored"
      - from: EDITS_ATTACHED
        to: CERTIFIED
        trigger: "POST /hmda/submissions/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == EDITS_ATTACHED, else ERR_INVALID_SUBMISSION_STATE"
          - "X-User-ID differs from every verified_by_user_id on the attached run's VERIFIED exceptions, else ERR_SEGREGATION_OF_DUTIES"
          - "the attached EditRun has zero OPEN exceptions with severity IN {SYNTACTICAL, VALIDITY}, else ERR_OPEN_VALIDITY_EDITS"
          - "EditRun.verified_exception_count >= EditRun.required_verified_quota, else ERR_VERIFICATION_QUOTA_NOT_MET"
        side_effects:
          - "status := CERTIFIED; certified_by_user_id := X-User-ID; certified_at := logical clock; attestation_text stored"
          - "final_record_count := FINAL variant of calculations.submission_record_count"
          - "Institution.filing_posture := LOCKED_FOR_FILING"
      - from: CERTIFIED
        to: DRAFT
        trigger: "system, cascade hop 4 of POST /hmda/applications/{id}/reopen"
        actor: system
        preconditions:
          - "the attached EditRun became INVALIDATED"
        side_effects:
          - "status := DRAFT; edit_run_id, certified_by_user_id, certified_at, attestation_text, final_record_count cleared"
          - "Institution.filing_posture := OPEN"
      - from: EDITS_ATTACHED
        to: DRAFT
        trigger: "system, cascade hop 4 of POST /hmda/applications/{id}/reopen"
        actor: system
        preconditions:
          - "the attached EditRun became INVALIDATED"
        side_effects:
          - "status := DRAFT; edit_run_id cleared"
      - from: CERTIFIED
        to: FILED
        trigger: "POST /hmda/submissions/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "status == CERTIFIED, else ERR_INVALID_SUBMISSION_STATE"
          - "Institution.filing_posture == LOCKED_FOR_FILING, else ERR_INVALID_SUBMISSION_STATE"
        side_effects:
          - "CASCADE hop 1 -> status := FILED; filed_at := logical clock; is_late and late_by_days from calculations.filing_deadline_and_lateness; Institution.filing_posture := FILED_YEAR"
          - "CASCADE hop 2 (caused by hop 1) -> every Application of the FINAL record set with stage REGISTER_LOCKED moves to ARCHIVED"
          - "CASCADE hop 3 (caused by hop 2) -> Institution.open_register_count is recomputed and, when it reaches 0, Institution.filing_posture moves FILED_YEAR -> CLOSED_YEAR"
          - "two DisclosureStatement rows are appended in this order: MODIFIED_LAR then DISCLOSURE_REPORT, both carrying calculations.disclosure_redaction outputs"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /hmda/submissions/{id}/review with decision=ACCEPT"
        actor: Examiner
        preconditions:
          - "status == FILED, else ERR_INVALID_SUBMISSION_STATE"
        side_effects:
          - "status := ACCEPTED"
      - from: FILED
        to: REJECTED
        trigger: "POST /hmda/submissions/{id}/review with decision=REJECT"
        actor: Examiner
        preconditions:
          - "status == FILED, else ERR_INVALID_SUBMISSION_STATE"
        side_effects:
          - "status := REJECTED; rejection_reason stored"
          - "every Application archived by this filing returns to REGISTER_LOCKED"
          - "Institution.filing_posture := OPEN; Institution.open_register_count recomputed"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /hmda/submissions/{id}/resubmit"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED, else ERR_INVALID_SUBMISSION_STATE"
        side_effects:
          - "status := DRAFT; resubmission_count +1"
          - "edit_run_id, certified_by_user_id, certified_at, attestation_text, final_record_count, filed_at, is_late, late_by_days cleared"

  # --- AuditSample (branching) --------------------------------------------
  - entity: AuditSample
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED_CLEAN, CLOSED_WITH_FINDINGS]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "system, on the first POST /hmda/audit-findings for this sample"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status := IN_REVIEW"
      - from: DRAFT
        to: CLOSED_CLEAN
        trigger: "POST /hmda/audit-samples/{id}/close"
        actor: ComplianceAnalyst
        preconditions:
          - "status IN {DRAFT, IN_REVIEW}, else ERR_SAMPLE_NOT_OPEN"
          - "defect_count == 0"
        side_effects:
          - "status := CLOSED_CLEAN; defect_rate_basis stored; defect_rate_pct := 0.00"
      - from: IN_REVIEW
        to: CLOSED_CLEAN
        trigger: "POST /hmda/audit-samples/{id}/close"
        actor: ComplianceAnalyst
        preconditions:
          - "status IN {DRAFT, IN_REVIEW}, else ERR_SAMPLE_NOT_OPEN"
          - "defect_count == 0"
        side_effects:
          - "status := CLOSED_CLEAN; defect_rate_basis stored; defect_rate_pct := 0.00"
          - "every own AuditFinding moves resolution OPEN -> ACCEPTED_AS_IS"
      - from: IN_REVIEW
        to: CLOSED_WITH_FINDINGS
        trigger: "POST /hmda/audit-samples/{id}/close"
        actor: ComplianceAnalyst
        preconditions:
          - "status IN {DRAFT, IN_REVIEW}, else ERR_SAMPLE_NOT_OPEN"
          - "defect_count >= 1"
        side_effects:
          - "status := CLOSED_WITH_FINDINGS; defect_rate_basis stored; defect_rate_pct := calculations.audit_defect_rate under the chosen variant"
          - "every own AuditFinding moves resolution OPEN -> ACCEPTED_AS_IS"

  # --- FairLendingAnalysis -------------------------------------------------
  - entity: FairLendingAnalysis
    state_field: status
    initial_state: COMPUTED
    terminal_states: [ESCALATED, CLEARED]
    transitions:
      - from: COMPUTED
        to: ESCALATED
        trigger: "system, inside POST /hmda/fair-lending-analyses"
        actor: system
        preconditions:
          - "significance_flag == SEVERE"
        side_effects:
          - "status := ESCALATED"
      - from: COMPUTED
        to: CLEARED
        trigger: "system, inside POST /hmda/fair-lending-analyses"
        actor: system
        preconditions:
          - "significance_flag IN {NOT_SIGNIFICANT, ELEVATED}"
        side_effects:
          - "status := CLEARED"

  # --- DemographicEntry ----------------------------------------------------
  - entity: DemographicEntry
    state_field: status
    initial_state: RECORDED
    terminal_states: []
    transitions:
      - from: RECORDED
        to: AMENDED
        trigger: "PATCH /hmda/demographic-entries/{id}"
        actor: LoanOfficer
        preconditions:
          - "the parent Application.stage != ARCHIVED, else ERR_APPLICATION_ARCHIVED"
        side_effects:
          - "status := AMENDED; supplied fields replaced; all §1.4 demographic rules re-evaluated against the merged row"
          - "increments DemographicEntry.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: submission-create-stale-institution
    parent_entity: Institution
    write_endpoint: "POST /hmda/submissions"
    occ_field: "expected_institution_version"
    description: |
      Creating a FilingSubmission carries the Institution version the client last
      observed. A new DRAFT submission legitimately supersedes an existing DRAFT
      submission of the same institution, so the create itself is a valid
      operation from an unchanged state; the rejection exists only to stop a
      writer whose view of the register is stale. When the supplied
      expected_institution_version does not equal the Institution's current
      version the create is rejected with 412 and no FilingSubmission row is
      written.
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412

  - rule_id: geocode-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /hmda/geocode-assignments"
    occ_field: "expected_application_version"
    description: |
      Creating a GeocodeAssignment supersedes the application's previous current
      assignment (is_current := false), which is a legitimate re-geocode from an
      unchanged state. The supplied expected_application_version must equal the
      Application's current version; a stale value means the client has not seen
      the assignment or stage change that already moved the row, and the create
      is rejected with 412 leaving is_current untouched.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: filing_profile_resolution
    trigger: "POST /hmda/institutions and PATCH /hmda/institutions/{id}"
    algorithm: constraint_propagation
    formula: |
      # The four outputs look mutually dependent (exemption depends on volume,
      # quarterly status depends on volume, field requirements depend on both).
      # Evaluation order is PINNED; there is no fixed-point iteration.
      step1: volume_exempt = (prior_year_closed_end_originations < CLOSED_END_EXEMPT_THRESHOLD)
                            AND (prior_year_open_end_originations < OPEN_END_EXEMPT_THRESHOLD)
      step2: asset_exempt  = (asset_size_usd_cents <= EXEMPT_ASSET_CAP_CENTS)
      step3: quarterly_filer = ((prior_year_closed_end_originations
                                 + prior_year_open_end_originations) >= QUARTERLY_FILER_THRESHOLD)
      step4: partial_exemption_eligible = volume_exempt AND asset_exempt AND (NOT quarterly_filer)
      step5: required_field_count = PARTIAL_EXEMPT_FIELD_COUNT if partial_exemption_eligible
                                    else FULL_FIELD_COUNT
      step6: filing_deadline_at = ISO8601(activity_year + 1, month=03, day=01,
                                          time=23:59:59.000, zone=UTC)
    input_set: "The Institution row alone; no child entities participate."
    constants:
      CLOSED_END_EXEMPT_THRESHOLD: 500
      OPEN_END_EXEMPT_THRESHOLD: 500
      EXEMPT_ASSET_CAP_CENTS: 1000000000000
      QUARTERLY_FILER_THRESHOLD: 60000
      FULL_FIELD_COUNT: 48
      PARTIAL_EXEMPT_FIELD_COUNT: 26
    precision: "integers exact; booleans exact; the `<` in step1 is strict, so a prior-year count of exactly 500 removes the exemption"

  - name: application_completeness
    trigger: "POST /hmda/applications, PATCH /hmda/applications/{id}, POST /hmda/applications/{id}/action-taken, POST /hmda/applications/{id}/reopen; writes captured_field_count, applicable_field_count, lar_status, exclusion_reason"
    algorithm: aggregation
    formula: |
      CORE = [uli, application_date, application_channel, loan_type, loan_purpose,
              occupancy_type, lien_status, loan_amount_cents, action_taken,
              action_taken_date]                       # 10 entries, always applicable

      applicable = CORE
      if NOT institution.partial_exemption_eligible:
          applicable += [income_thousands]
          if action_taken == "ORIGINATED":     applicable += [rate_spread, purchaser_type]
          if action_taken == "PURCHASED_LOAN": applicable += [purchaser_type]
          if action_taken == "DENIED":         applicable += [denial_reason_codes]

      applicable_field_count = len(applicable)
      captured_field_count   = count of fields in `applicable` whose value is
                               non-null and, for array fields, non-empty
                               (the enum member NOT_APPLICABLE counts as present)

      # lar_status is written in this pinned order:
      if business_or_commercial_purpose == true
         AND loan_purpose NOT IN {HOME_PURCHASE, HOME_IMPROVEMENT,
                                  REFINANCING, CASH_OUT_REFINANCING}:
          lar_status = "EXCLUDED";  exclusion_reason = "BUSINESS_PURPOSE"
      elif captured_field_count == applicable_field_count:
          lar_status = "COMPLETE";  exclusion_reason = "NOT_EXCLUDED"
      else:
          lar_status = "PENDING_FIELDS"; exclusion_reason = "NOT_EXCLUDED"

      # This calculation never writes EXCEPTION_FLAGGED or CLEARED; those two
      # values are owned by edit_check_evaluation and by the verify cascade.
      # When the row is currently EXCEPTION_FLAGGED or CLEARED and this
      # calculation would yield COMPLETE, lar_status is left unchanged.
    input_set: "The Application row plus its Institution's partial_exemption_eligible flag."
    constants:
      CORE_FIELD_COUNT: 10
    precision: "integer counts, exact"

  - name: geocode_match_resolution
    trigger: "POST /hmda/geocode-assignments; writes candidate_count, census_tract_id, msa_md_code, status"
    algorithm: topological
    formula: |
      if submitted_tract_code IS NOT NULL:
          candidates = CensusTract rows where tract_code == submitted_tract_code
                       AND county_fips == request.county_fips
                       AND state_code  == request.state_code
      else:
          candidates = CensusTract rows where county_fips == request.county_fips
                       AND state_code  == request.state_code

      candidate_count = len(candidates)
      if candidate_count == 1:
          status = "MATCHED"
          census_tract_id = candidates[0].id
          msa_md_code     = candidates[0].msa_md_code
      elif candidate_count == 0:
          status = "NOT_MATCHED";  census_tract_id = null;  msa_md_code = null
      else:
          status = "AMBIGUOUS";    census_tract_id = null;  msa_md_code = null
    input_set: "All CensusTract rows; no status filter (CensusTract is immutable reference data)."
    constants: {}
    precision: "exact set membership; comparisons are case-sensitive string equality"

  - name: edit_check_evaluation
    trigger: "POST /hmda/edit-runs; creates EditException rows and writes every EditRun counter"
    algorithm: chronological
    formula: |
      snapshot = Applications where institution_id == run.institution_id
                 AND action_taken IS NOT NULL
                 AND is_superseded == false
                 AND lar_status != "EXCLUDED"
                 AND stage IN {DECISIONED, REGISTER_LOCKED}
      snapshot ordered by created_at ASC          # never by id
      snapshot_record_count = len(snapshot)

      # record-level edits, evaluated per application in the pinned code order
      # S300, S301, V610, V620, V631, Q607, Q615, Q620; every fired edit appends
      # one EditException in that same order, so exception created_at ordering is
      # deterministic
      S300 SYNTACTICAL uli          : len(uli) < ULI_MIN_LENGTH
      S301 SYNTACTICAL uli          : uli contains a character outside [A-Z0-9]
      V610 VALIDITY income_thousands: income_thousands IS NULL
                                      AND institution.partial_exemption_eligible == false
                                      AND action_taken IN {ORIGINATED, APPROVED_NOT_ACCEPTED, DENIED}
      V620 VALIDITY rate_spread     : rate_spread IS NOT NULL
                                      AND action_taken IN {WITHDRAWN, FILE_CLOSED_INCOMPLETE}
      V631 VALIDITY census_tract_id : the row has NO is_current GeocodeAssignment at
                                      all, or its is_current assignment has status
                                      IN {AMBIGUOUS, NOT_MATCHED, PENDING}
      Q607 QUALITY loan_amount_cents: income_thousands IS NOT NULL AND
                                      loan_amount_cents > income_thousands * 100000 * QUALITY_LTI_MULTIPLE
      Q615 QUALITY action_taken_date: (action_taken_date - application_date) in whole days
                                      > QUALITY_DECISION_LAG_DAYS
      Q620 QUALITY loan_amount_cents: loan_amount_cents < QUALITY_MIN_LOAN_CENTS

      # macro edit, evaluated once after the per-record walk
      Q800 MACRO action_taken       : snapshot_record_count >= 1 AND
                                      (count(action_taken == WITHDRAWN) * 100.0
                                       / snapshot_record_count) > MACRO_WITHDRAWN_PCT
                                      -> one EditException with application_id = null

      syntactical_count / validity_count / quality_count / macro_count = counts by severity
      total_exception_count = their sum
      open_exception_count  = total_exception_count      # every new exception starts OPEN
      verified_exception_count = 0 ; stale_exception_count = 0
      cleared_record_count  = count of snapshot rows with zero record-level exceptions
      # lar_status side effect: each snapshot row with >= 1 record-level exception
      # becomes EXCEPTION_FLAGGED, every other snapshot row becomes CLEARED
    input_set: "Snapshot as defined above; MACRO edits read the whole snapshot. Applications outside the snapshot are untouched."
    constants:
      ULI_MIN_LENGTH: 23
      QUALITY_LTI_MULTIPLE: 5
      QUALITY_DECISION_LAG_DAYS: 180
      QUALITY_MIN_LOAN_CENTS: 100000
      MACRO_WITHDRAWN_PCT: 30.0
    precision: "day differences are whole days floor((t2 - t1)/86400s); percentage comparisons use exact rational arithmetic, strict >"

  - name: certification_verification_quota
    trigger: "POST /hmda/edit-runs (writes EditRun.required_verified_quota); read again as a precondition of POST /hmda/submissions/{id}/certify"
    algorithm: threshold
    formula: |
      # Circular-looking: verifying an exception moves an Application to CLEARED,
      # which would change what counts as a reportable record, which would change
      # the quota. The dependency is broken by PINNING the base to the snapshot
      # frozen at run start, BEFORE any verification has happened. The quota is
      # therefore computed exactly once, inside POST /hmda/edit-runs, and never
      # recomputed while exceptions are being worked.
      quota                  = ceil(snapshot_record_count * QUALITY_VERIFY_QUOTA_PCT)
      required_verified_quota = min(quota, quality_count + macro_count)
    input_set: "EditRun.snapshot_record_count, EditRun.quality_count and EditRun.macro_count, all as written by edit_check_evaluation in the same request."
    constants:
      QUALITY_VERIFY_QUOTA_PCT: 0.10
    precision: "ceil to the next integer; min over integers"

  - name: submission_record_count
    trigger: "POST /hmda/submissions writes provisional_record_count; POST /hmda/submissions/{id}/certify writes final_record_count"
    algorithm: aggregation
    formula: |
      base(I) = Applications where institution_id == I
                AND action_taken IS NOT NULL
                AND year(action_taken_date) == institution.activity_year

      PROVISIONAL = count( base(I) where lar_status != "EXCLUDED" )
      FINAL       = count( base(I) where lar_status == "CLEARED"
                                    AND is_superseded == false )
    input_set: "Both variants read the identical base set; they differ only in the status filter and in whether superseded originals stay in."
    constants: {}
    precision: "integer counts, exact"
    variants:
      - name: PROVISIONAL
        when: "Evaluated inside POST /hmda/submissions and frozen on FilingSubmission.provisional_record_count"
        difference: "Counts every non-EXCLUDED record with an action taken in the activity year, including records still PENDING_FIELDS or EXCEPTION_FLAGGED and including superseded originals."
      - name: FINAL
        when: "Evaluated inside POST /hmda/submissions/{id}/certify and frozen on FilingSubmission.final_record_count"
        difference: "Counts only CLEARED, non-superseded records. Against the same database state FINAL <= PROVISIONAL, and the two differ whenever any record is superseded, PENDING_FIELDS or EXCEPTION_FLAGGED."

  - name: filing_deadline_and_lateness
    trigger: "POST /hmda/institutions writes filing_deadline_at; POST /hmda/submissions/{id}/file writes filed_at, is_late, late_by_days"
    algorithm: threshold
    formula: |
      step1: deadline_at = ISO8601(activity_year + 1, 03, 01, 23:59:59.000Z)
      step2: filed_at    = current logical clock
      step3: is_late     = (filed_at > deadline_at)          # STRICT >, so filing
                                                             # exactly at the
                                                             # deadline instant is
                                                             # ON TIME
      step4: late_by_days = 0 if not is_late
                            else ceil((filed_at - deadline_at) in seconds / 86400)
    input_set: "The submission's deadline_at (copied from the Institution at creation) and the logical clock at filing time."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "millisecond-resolution timestamp comparison; late_by_days is a ceiling to whole days, minimum 1 once late"

  - name: audit_sample_sizing_and_selection
    trigger: "POST /hmda/audit-samples; writes population_size, sample_size, selected_application_ids"
    algorithm: tiered_pricing
    formula: |
      candidates = Applications where institution_id == sample.institution_id
                   AND action_taken IS NOT NULL
                   AND action_taken_date >= period_start
                   AND action_taken_date <= period_end          # closed interval
                   AND lar_status IN {COMPLETE, EXCEPTION_FLAGGED, CLEARED}
                   AND is_superseded == false
      candidates ordered by created_at ASC                       # never by id
      population_size = len(candidates)
      if population_size == 0: reject with ERR_EMPTY_SAMPLE_POPULATION

      # tier selection is a step function of the population, then the raw draw is
      # clamped from below by the floor, from above by the ceiling AND by the
      # population itself: three interacting inputs, nested max inside min
      tier_pct = 0.10 if population_size <= 30
                 else 0.30 if population_size <= 100
                 else 0.15 if population_size <= 500
                 else 0.05
      base        = ceil(population_size * tier_pct)
      sample_size = min( max(base, AUDIT_MIN_SAMPLE), AUDIT_MAX_SAMPLE, population_size )
      # worked examples: population 2 -> base 1, max(1,5)=5, min(5,50,2)  = 2
      #                  population 3 -> base 1, max(1,5)=5, min(5,50,3)  = 3
      #                  population 12-> base 2, max(2,5)=5, min(5,50,12) = 5
      #                  population 31-> base 10,max(10,5)=10,min(10,50,31)=10

      stride = max(1, floor(population_size / sample_size))
      selected_application_ids = [ candidates[i * stride].id
                                   for i in 0 .. sample_size - 1 ]
      # when method == STRATIFIED_BY_ACTION the candidate list is first ordered by
      # action_taken ascending as an enum-declaration order, then by created_at ASC,
      # and the same stride walk is applied
    input_set: "Only records whose action_taken_date lies inside the closed sampling period and whose lar_status is one of the three register-quality values listed."
    constants:
      AUDIT_MIN_SAMPLE: 5
      AUDIT_MAX_SAMPLE: 50
    precision: "ceil for the draw, floor for the stride, all integers"

  - name: audit_defect_rate
    trigger: "POST /hmda/audit-findings updates defect_count and records_with_defect_count; POST /hmda/audit-samples/{id}/close writes defect_rate_pct under the requested variant"
    algorithm: weighted_scoring
    formula: |
      is_defect(f)              = (f.recorded_value != f.source_document_value)   # exact, case-sensitive
      defect_count              = count of own AuditFindings with is_defect == true
      records_with_defect_count = count of DISTINCT application_id among those findings
      total_fields_reviewed     = sample_size * fields_reviewed_per_record

      FIELD_WEIGHTED : defect_rate_pct = round(defect_count / total_fields_reviewed * 100, 2)
      RECORD_WEIGHTED: defect_rate_pct = round(records_with_defect_count / sample_size * 100, 2)
    input_set: "All AuditFinding rows whose audit_sample_id is this sample, regardless of severity or resolution."
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP"
    variants:
      - name: FIELD_WEIGHTED
        when: "close called with defect_rate_basis=FIELD_WEIGHTED"
        difference: "Denominator is every field re-keyed across the whole sample, so several defects on one record dilute across the sample."
      - name: RECORD_WEIGHTED
        when: "close called with defect_rate_basis=RECORD_WEIGHTED"
        difference: "Denominator is the sampled record count and the numerator collapses to distinct records, so several defects on one record count once. Against identical findings the two variants return different percentages."

  - name: fair_lending_disparity_index
    trigger: "POST /hmda/fair-lending-analyses; writes both denial rates, disparity_index, significance_flag and the auto status"
    algorithm: weighted_scoring
    formula: |
      universe = Applications where institution_id == analysis.institution_id
                 AND action_taken IS NOT NULL
                 AND action_taken_date >= period_start
                 AND action_taken_date <= period_end        # closed interval
                 AND is_superseded == false
                 AND lar_status != "EXCLUDED"

      group(code) = universe rows whose APPLICANT DemographicEntry carries `code`
                    in race_codes when basis == RACE,
                    in ethnicity_codes when basis == ETHNICITY,
                    or whose sex_code == code when basis == SEX
      denied(g)   = rows of g with action_taken IN {DENIED, PREAPPROVAL_DENIED}

      control_total    = len(group(control_group_code))
      protected_total  = len(group(protected_group_code))
      if control_total == 0 OR protected_total == 0:
          reject with ERR_EMPTY_CONTROL_GROUP

      # ROUNDING ORDER IS PINNED: each denial rate is rounded to 2dp FIRST, and
      # the index is computed from those two ALREADY-ROUNDED numbers. Dividing
      # the raw ratios and rounding once at the end is a DIFFERENT number and is
      # explicitly not what this system computes.
      step1: control_denial_rate_pct   = round(control_denied   / control_total   * 100, 2)
      step2: protected_denial_rate_pct = round(protected_denied / protected_total * 100, 2)
      step3: if control_denial_rate_pct == 0.00 and protected_denial_rate_pct == 0.00:
                 disparity_index = 100.00
             elif control_denial_rate_pct == 0.00:
                 disparity_index = DISPARITY_CAP
             else:
                 disparity_index = round(protected_denial_rate_pct
                                         / control_denial_rate_pct * 100, 2)

      significance_flag = "SEVERE"          if disparity_index >= SEVERE_THRESHOLD
                          else "ELEVATED"   if disparity_index >= ELEVATED_THRESHOLD
                          else "NOT_SIGNIFICANT"
      status = "ESCALATED" if significance_flag == "SEVERE" else "CLEARED"
    input_set: "Only records with an action taken inside the closed analysis period; superseded and EXCLUDED records never enter either group."
    constants:
      SEVERE_THRESHOLD: 200.0
      ELEVATED_THRESHOLD: 125.0
      DISPARITY_CAP: 999.99
    precision: "2 decimal places, ROUND_HALF_UP, applied three times in the order above"

  - name: disclosure_redaction
    trigger: "POST /hmda/submissions/{id}/file; writes both DisclosureStatement rows"
    algorithm: aggregation
    formula: |
      final_set = the FINAL record set frozen at certification
      record_count = len(final_set)

      groups = final_set grouped by the census_tract_id of each record's
               is_current GeocodeAssignment; records whose assignment has a null
               census_tract_id form one additional group keyed NULL_TRACT

      suppressed(g) = (g.key == NULL_TRACT)
                      OR (len(g) < DISCLOSURE_MIN_TRACT_LOANS)
                      OR (tract(g).owner_occupied_units < DISCLOSURE_MIN_OWNER_OCCUPIED)

      tract_suppression_count = count of groups where suppressed(g)
      suppressed_record_count = sum of len(g) over suppressed groups
      redacted_field_count    = suppressed_record_count * REDACTED_FIELDS_PER_SUPPRESSED_RECORD

      # exactly two rows are appended, in this order, both carrying the values
      # above: statement_type MODIFIED_LAR first, then DISCLOSURE_REPORT
    input_set: "The submission's FINAL record set only; PENDING_FIELDS, EXCEPTION_FLAGGED, EXCLUDED and superseded records never appear in a disclosure statement."
    constants:
      DISCLOSURE_MIN_TRACT_LOANS: 5
      DISCLOSURE_MIN_OWNER_OCCUPIED: 500
      REDACTED_FIELDS_PER_SUPPRESSED_RECORD: 3
    precision: "integer counts, exact; both comparisons are strict <"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing row decides the response, later rows are not evaluated)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 30
    category: auth
    check: "When X-User-Role is InstitutionAdmin, X-User-ID equals the Institution.id being addressed (path id or body institution_id)"
    error_id: ERR_INSTITUTION_SCOPE_VIOLATION
    http_status: 403
    applies_to: "PATCH /hmda/institutions/{id}, GET /hmda/institutions/{id} and all its sub-resources"

  - priority: 40
    category: existence
    check: "Every id in the path resolves, validated left to right"
    error_id: "ERR_INSTITUTION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_DEMOGRAPHIC_ENTRY_NOT_FOUND | ERR_GEOCODE_ASSIGNMENT_NOT_FOUND | ERR_CENSUS_TRACT_NOT_FOUND | ERR_EDIT_RUN_NOT_FOUND | ERR_EDIT_EXCEPTION_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_AUDIT_SAMPLE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 50
    category: business_constraint
    check: "Body shape: every required field of §1.5 `input:` is present, enum values are members of the declared constraint set, integers/numbers are of the declared type and within their stated range, arrays are arrays, ISO-8601 datetimes parse, and limit/offset lie inside the §1.0 pagination bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 60
    category: existence
    check: "Every foreign key supplied in the body resolves to an existing row"
    error_id: "ERR_INSTITUTION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CENSUS_TRACT_NOT_FOUND | ERR_EDIT_RUN_NOT_FOUND | ERR_AUDIT_SAMPLE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /hmda/applications, POST /hmda/demographic-entries, POST /hmda/geocode-assignments, POST /hmda/geocode-assignments/{id}/manual-override, POST /hmda/edit-runs, POST /hmda/submissions, POST /hmda/submissions/{id}/attach-edit-run, POST /hmda/audit-samples, POST /hmda/audit-findings, POST /hmda/fair-lending-analyses"

  - priority: 70
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (§1.2.1 OCC)"
    error_id: "ERR_STALE_INSTITUTION_VERSION | ERR_STALE_APPLICATION_VERSION"
    http_status: 412
    applies_to: "POST /hmda/submissions, POST /hmda/geocode-assignments"

  - priority: 80
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_STAGE_TRANSITION | ERR_INVALID_SUBMISSION_STATE | ERR_EXCEPTION_NOT_OPEN | ERR_GEOCODE_NOT_OVERRIDABLE | ERR_SAMPLE_NOT_OPEN | ERR_APPLICATION_ARCHIVED | ERR_EDIT_RUN_INVALIDATED"
    http_status: 409
    applies_to: "all action endpoints and PATCH /hmda/demographic-entries/{id}"

  - priority: 85
    category: state
    check: "Cross-entity state guard: advancing an Application DECISIONED -> REGISTER_LOCKED requires its is_current GeocodeAssignment.status IN {MATCHED, MANUAL_OVERRIDE}; advancing INTAKE -> UNDERWRITING requires an APPLICANT DemographicEntry"
    error_id: "ERR_GEOCODE_UNRESOLVED | ERR_MISSING_APPLICANT_DEMOGRAPHICS"
    http_status: 409
    applies_to: "POST /hmda/applications/{id}/advance"

  - priority: 90
    category: business_safety
    check: "Segregation of duties: the certifying ComplianceOfficer's X-User-ID must not equal any verified_by_user_id recorded on a VERIFIED EditException of the attached EditRun"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hmda/submissions/{id}/certify"

  - priority: 92
    category: business_safety
    check: "Visual observation is permitted only when the parent Application.application_channel == FACE_TO_FACE"
    error_id: ERR_VISUAL_OBSERVATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /hmda/demographic-entries, PATCH /hmda/demographic-entries/{id}"

  - priority: 94
    category: business_safety
    check: "When collection_method == VISUAL_OBSERVATION_OR_SURNAME, every supplied ethnicity and race code must be an aggregate category; disaggregated subcategories and INFO_NOT_PROVIDED are forbidden, and sex_code must be MALE, FEMALE or BOTH"
    error_id: ERR_DISAGGREGATED_CODE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /hmda/demographic-entries, PATCH /hmda/demographic-entries/{id}"

  - priority: 96
    category: business_safety
    check: "When the parent Application.application_channel == FACE_TO_FACE and is_natural_person == true, collection_method must not be NOT_PROVIDED_BY_APPLICANT — the officer is required to record ethnicity, race and sex by visual observation or surname"
    error_id: ERR_OBSERVATION_REQUIRED_FOR_IN_PERSON
    http_status: 422
    applies_to: "POST /hmda/demographic-entries, PATCH /hmda/demographic-entries/{id}"

  - priority: 98
    category: business_safety
    check: "When is_natural_person == false, collection_method must be NOT_APPLICABLE and ethnicity_codes, race_codes and sex_code must all carry only NOT_APPLICABLE"
    error_id: ERR_NON_NATURAL_PERSON_MISMATCH
    http_status: 422
    applies_to: "POST /hmda/demographic-entries, PATCH /hmda/demographic-entries/{id}"

  - priority: 100
    category: business_referential
    check: "action_taken == DENIED or PREAPPROVAL_DENIED requires a non-empty denial_reason_codes array"
    error_id: ERR_DENIAL_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 102
    category: business_referential
    check: "action_taken NOT IN {DENIED, PREAPPROVAL_DENIED} forbids a non-empty denial_reason_codes array"
    error_id: ERR_DENIAL_REASON_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 104
    category: business_referential
    check: "action_taken == PURCHASED_LOAN requires purchaser_type present and different from NOT_APPLICABLE"
    error_id: ERR_PURCHASER_TYPE_REQUIRED
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 106
    category: business_referential
    check: "The CensusTract supplied to manual-override has county_fips and state_code equal to the GeocodeAssignment's own county_fips and state_code"
    error_id: ERR_GEOCODE_TRACT_MISMATCH
    http_status: 422
    applies_to: "POST /hmda/geocode-assignments/{id}/manual-override"

  - priority: 108
    category: business_referential
    check: "The EditRun being attached belongs to the same Institution as the FilingSubmission"
    error_id: ERR_EDIT_RUN_INSTITUTION_MISMATCH
    http_status: 422
    applies_to: "POST /hmda/submissions/{id}/attach-edit-run"

  - priority: 110
    category: business_referential
    check: "The application_id of a new AuditFinding appears in the sample's selected_application_ids"
    error_id: ERR_FINDING_APPLICATION_NOT_IN_SAMPLE
    http_status: 422
    applies_to: "POST /hmda/audit-findings"

  - priority: 120
    category: business_temporal
    check: "action_taken_date >= the Application's application_date"
    error_id: ERR_ACTION_DATE_BEFORE_APPLICATION
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 122
    category: business_temporal
    check: "action_taken_date <= the current logical clock"
    error_id: ERR_ACTION_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 124
    category: business_temporal
    check: "year(action_taken_date) equals the owning Institution.activity_year"
    error_id: ERR_ACTION_DATE_OUTSIDE_ACTIVITY_YEAR
    http_status: 422
    applies_to: "POST /hmda/applications/{id}/action-taken"

  - priority: 126
    category: business_temporal
    check: "Interval well-formedness: EditRun.window_end > window_start; AuditSample.period_end >= period_start; AuditFinding.remediation_end >= remediation_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /hmda/edit-runs, POST /hmda/audit-samples, POST /hmda/audit-findings"

  - priority: 130
    category: business_constraint
    check: "EditRun review windows on one Institution are HALF-OPEN [window_start, window_end): a new run is rejected when an existing run of the same institution whose status != INVALIDATED satisfies new_start < existing_end AND existing_start < new_end. Touching windows (new_start == existing_end) are accepted."
    error_id: ERR_EDIT_RUN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /hmda/edit-runs"

  - priority: 132
    category: business_constraint
    check: "AuditFinding remediation windows on one Application are CLOSED [remediation_start, remediation_end]: a new finding is rejected when another finding on the same application_id with resolution == OPEN satisfies new_start <= existing_end AND existing_start <= new_end. Touching endpoints DO collide."
    error_id: ERR_REMEDIATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /hmda/audit-findings"

  - priority: 134
    category: business_constraint
    check: "uli is unique among Applications of the same Institution whose is_superseded == false"
    error_id: ERR_DUPLICATE_ULI
    http_status: 409
    applies_to: "POST /hmda/applications"

  - priority: 136
    category: business_constraint
    check: "lei is unique across all Institution rows"
    error_id: ERR_DUPLICATE_LEI
    http_status: 409
    applies_to: "POST /hmda/institutions"

  - priority: 138
    category: business_constraint
    check: "At most one DemographicEntry per (application_id, applicant_role) pair"
    error_id: ERR_DUPLICATE_DEMOGRAPHIC_ROLE
    http_status: 409
    applies_to: "POST /hmda/demographic-entries"

  - priority: 140
    category: business_constraint
    check: "race_codes carries at most 5 entries and ethnicity_codes at most 2"
    error_id: ERR_TOO_MANY_RACE_CODES
    http_status: 422
    applies_to: "POST /hmda/demographic-entries, PATCH /hmda/demographic-entries/{id}"

  - priority: 142
    category: business_constraint
    check: "Only exceptions with severity IN {QUALITY, MACRO} may be verified; SYNTACTICAL and VALIDITY exceptions must be corrected in the register and cleared by a later edit run"
    error_id: ERR_SEVERITY_NOT_VERIFIABLE
    http_status: 422
    applies_to: "POST /hmda/edit-exceptions/{id}/verify"

  - priority: 150
    category: business_fiscal
    check: "The attached EditRun carries zero OPEN exceptions with severity IN {SYNTACTICAL, VALIDITY}"
    error_id: ERR_OPEN_VALIDITY_EDITS
    http_status: 422
    applies_to: "POST /hmda/submissions/{id}/certify"

  - priority: 152
    category: business_fiscal
    check: "EditRun.verified_exception_count >= EditRun.required_verified_quota"
    error_id: ERR_VERIFICATION_QUOTA_NOT_MET
    http_status: 422
    applies_to: "POST /hmda/submissions/{id}/certify"

  - priority: 154
    category: business_fiscal
    check: "The audit sampling candidate set is non-empty"
    error_id: ERR_EMPTY_SAMPLE_POPULATION
    http_status: 422
    applies_to: "POST /hmda/audit-samples"

  - priority: 156
    category: business_fiscal
    check: "Both the control group and the protected group contain at least one record"
    error_id: ERR_EMPTY_CONTROL_GROUP
    http_status: 422
    applies_to: "POST /hmda/fair-lending-analyses"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Institution ---------------------------------------------------------
  - method: POST
    path: "/hmda/institutions"
    description: "Register a reporting bank for one HMDA activity year"
    roles: [SystemAdmin]
    code: 201
    input: ["lei", "name", "activity_year", "asset_size_usd_cents", "prior_year_closed_end_originations?", "prior_year_open_end_originations?"]
    output: Institution
    side_effects:
      - "runs calculations.filing_profile_resolution -> partial_exemption_eligible, quarterly_filer, required_field_count, filing_deadline_at"
      - "filing_posture := OPEN; all record counters := 0; version := 1"

  - method: PATCH
    path: "/hmda/institutions/{id}"
    description: "Amend the institution profile; re-derives the whole filing profile"
    roles: [InstitutionAdmin]
    code: 200
    input: ["name?", "asset_size_usd_cents?", "prior_year_closed_end_originations?", "prior_year_open_end_originations?"]
    output: Institution
    side_effects:
      - "re-runs calculations.filing_profile_resolution over the merged row"
      - "re-runs calculations.application_completeness for every own Application, because required_field_count may have changed"
      - "increments Institution.version by 1"

  - method: GET
    path: "/hmda/institutions/{id}"
    description: "Read one institution with all derived counters"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: []
    output: Institution
    side_effects: []

  - method: GET
    path: "/hmda/institutions/{id}/applications"
    description: "List the institution's register records (reverse reachability for Application.institution_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: ["stage?", "lar_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/hmda/institutions/{id}/edit-runs"
    description: "List the institution's edit runs (reverse reachability for EditRun.institution_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EditRun[]
    side_effects: []

  - method: GET
    path: "/hmda/institutions/{id}/submissions"
    description: "List the institution's filing submissions (reverse reachability for FilingSubmission.institution_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FilingSubmission[]
    side_effects: []

  - method: GET
    path: "/hmda/institutions/{id}/audit-samples"
    description: "List the institution's audit samples (reverse reachability for AuditSample.institution_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []

  - method: GET
    path: "/hmda/institutions/{id}/fair-lending-analyses"
    description: "List the institution's fair lending analyses (reverse reachability for FairLendingAnalysis.institution_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["basis?", "status?", "limit?", "offset?"]
    output: FairLendingAnalysis[]
    side_effects: []

  # --- CensusTract ---------------------------------------------------------
  - method: POST
    path: "/hmda/census-tracts"
    description: "Load one census tract reference row"
    roles: [SystemAdmin]
    code: 201
    input: [tract_code, county_fips, state_code, msa_md_code, minority_population_pct, tract_to_msa_income_pct, owner_occupied_units, median_family_income_cents]
    output: CensusTract
    side_effects: []

  - method: GET
    path: "/hmda/census-tracts/{id}"
    description: "Read one census tract"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: []
    output: CensusTract
    side_effects: []

  - method: GET
    path: "/hmda/census-tracts/{id}/geocode-assignments"
    description: "List assignments resolved to this tract (reverse reachability for GeocodeAssignment.census_tract_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["is_current?", "limit?", "offset?"]
    output: GeocodeAssignment[]
    side_effects: []

  # --- Application ---------------------------------------------------------
  - method: POST
    path: "/hmda/applications"
    description: "Open a register record at INTAKE"
    roles: [LoanOfficer]
    code: 201
    input: ["institution_id", "uli", "application_date", "application_channel", "loan_type", "loan_purpose", "occupancy_type", "lien_status", "loan_amount_cents", "income_thousands?", "business_or_commercial_purpose?", "open_end_line_of_credit?", "supersedes_application_id?"]
    output: Application
    side_effects:
      - "stage := INTAKE; lar_status from calculations.application_completeness"
      - "when supersedes_application_id is supplied, that Application.is_superseded := true and its version increments by 1"
      - "recomputes Institution.total_application_count, pending_record_count, reportable_record_count, excluded_record_count, open_register_count; increments Institution.version by 1"

  - method: PATCH
    path: "/hmda/applications/{id}"
    description: "Capture or amend register fields at the current stage"
    roles: [LoanOfficer]
    code: 200
    input: ["income_thousands?", "loan_amount_cents?", "rate_spread?", "purchaser_type?", "denial_reason_codes?", "occupancy_type?", "lien_status?", "loan_purpose?", "business_or_commercial_purpose?"]
    output: Application
    side_effects:
      - "re-runs calculations.application_completeness -> captured_field_count, applicable_field_count, lar_status, exclusion_reason"
      - "recomputes the Institution record counters; increments both Application.version and Institution.version by 1"

  - method: GET
    path: "/hmda/applications/{id}"
    description: "Read one register record with both state dimensions"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/hmda/applications/{id}/advance"
    description: "Move the record to the next field-capture stage"
    roles: [LoanOfficer]
    code: 200
    input: [to_stage]
    output: Application
    side_effects:
      - "stage transition per the Application stage machine; increments Application.version by 1"

  - method: POST
    path: "/hmda/applications/{id}/action-taken"
    description: "Record the action taken and its date, plus the fields that only become applicable once the action is known"
    roles: [LoanOfficer]
    code: 200
    input: ["action_taken", "action_taken_date", "denial_reason_codes?", "purchaser_type?", "rate_spread?", "income_thousands?"]
    output: Application
    side_effects:
      - "action_taken and action_taken_date stored after all §1.4 priority 100-124 rules pass"
      - "re-runs calculations.application_completeness -> lar_status may move PENDING_FIELDS -> COMPLETE"
      - "recomputes the Institution record counters; increments Application.version and Institution.version by 1"

  - method: POST
    path: "/hmda/applications/{id}/reopen"
    description: "Unlock a REGISTER_LOCKED record for correction; drives the five-hop decertification cascade"
    roles: [ComplianceAnalyst]
    code: 200
    input: [reason]
    output: Application
    side_effects:
      - "stage REGISTER_LOCKED -> DECISIONED; action_taken and action_taken_date cleared; lar_status -> PENDING_FIELDS"
      - "hop 2: this application's VERIFIED EditExceptions revert to OPEN and the owning run's counters move"
      - "hop 3: that EditRun -> INVALIDATED"
      - "hop 4: FilingSubmissions on that run in EDITS_ATTACHED or CERTIFIED -> DRAFT"
      - "hop 5: Institution.filing_posture LOCKED_FOR_FILING -> OPEN"
      - "increments Application.version and Institution.version by 1"

  - method: GET
    path: "/hmda/applications/{id}/corrections"
    description: "List records that supersede this one (reverse reachability for Application.supersedes_application_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/hmda/applications/{id}/demographic-entries"
    description: "List the record's applicants (reverse reachability for DemographicEntry.application_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: ["applicant_role?", "limit?", "offset?"]
    output: DemographicEntry[]
    side_effects: []

  - method: GET
    path: "/hmda/applications/{id}/geocode-assignments"
    description: "List the record's geocode attempts newest last (reverse reachability for GeocodeAssignment.application_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: ["is_current?", "limit?", "offset?"]
    output: GeocodeAssignment[]
    side_effects: []

  - method: GET
    path: "/hmda/applications/{id}/edit-exceptions"
    description: "List every exception ever raised against this record (reverse reachability for EditException.application_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, LoanOfficer, Examiner]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: EditException[]
    side_effects: []

  - method: GET
    path: "/hmda/applications/{id}/audit-findings"
    description: "List scrub findings raised against this record (reverse reachability for AuditFinding.application_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["resolution?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  # --- DemographicEntry ----------------------------------------------------
  - method: POST
    path: "/hmda/demographic-entries"
    description: "Record ethnicity, race and sex for one applicant on a register record"
    roles: [LoanOfficer]
    code: 201
    input: ["application_id", "applicant_role", "collection_method", "ethnicity_codes", "race_codes", "sex_code", "is_natural_person?", "age_years?", "observation_basis?"]
    output: DemographicEntry
    side_effects:
      - "status := RECORDED"

  - method: PATCH
    path: "/hmda/demographic-entries/{id}"
    description: "Amend a recorded applicant's demographic data; all collection rules are re-evaluated on the merged row"
    roles: [LoanOfficer]
    code: 200
    input: ["collection_method?", "ethnicity_codes?", "race_codes?", "sex_code?", "age_years?", "observation_basis?", "is_natural_person?"]
    output: DemographicEntry
    side_effects:
      - "status := AMENDED; increments DemographicEntry.version by 1"

  # --- GeocodeAssignment ---------------------------------------------------
  - method: POST
    path: "/hmda/geocode-assignments"
    description: "Geocode the secured property and assign a census tract; supersedes the record's previous current assignment (OCC on Application.version)"
    roles: [LoanOfficer]
    code: 201
    input: ["application_id", "expected_application_version", "street_address", "city", "state_code", "zip_code", "county_fips", "submitted_tract_code?"]
    output: GeocodeAssignment
    side_effects:
      - "runs calculations.geocode_match_resolution -> candidate_count, census_tract_id, msa_md_code, status"
      - "the record's previous GeocodeAssignment gets is_current := false"
      - "increments Application.version by 1"

  - method: POST
    path: "/hmda/geocode-assignments/{id}/manual-override"
    description: "Analyst pins a census tract for an AMBIGUOUS or NOT_MATCHED assignment"
    roles: [ComplianceAnalyst]
    code: 200
    input: [census_tract_id, override_reason]
    output: GeocodeAssignment
    side_effects:
      - "status := MANUAL_OVERRIDE; census_tract_id and msa_md_code stored; increments GeocodeAssignment.version by 1"

  # --- EditRun / EditException --------------------------------------------
  - method: POST
    path: "/hmda/edit-runs"
    description: "Run the syntactical, validity, quality and macro edit battery over the institution's register snapshot; occupies a half-open review window on the institution"
    roles: [ComplianceAnalyst]
    code: 201
    input: [institution_id, scope, window_start, window_end]
    output: EditRun
    side_effects:
      - "runs calculations.edit_check_evaluation -> EditException rows and every severity counter"
      - "runs calculations.certification_verification_quota -> required_verified_quota"
      - "status RUNNING -> COMPLETED, or -> CLEARED_ALL when no exception was raised"
      - "each snapshot Application.lar_status becomes EXCEPTION_FLAGGED or CLEARED"
      - "every earlier non-INVALIDATED run of the institution -> INVALIDATED and all its exceptions -> STALE"
      - "increments Institution.version by 1"

  - method: GET
    path: "/hmda/edit-runs/{id}"
    description: "Read one edit run with its full exception ledger"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: []
    output: EditRun
    side_effects: []

  - method: GET
    path: "/hmda/edit-runs/{id}/exceptions"
    description: "List the run's exceptions in creation order (reverse reachability for EditException.edit_run_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: EditException[]
    side_effects: []

  - method: GET
    path: "/hmda/edit-runs/{id}/submissions"
    description: "List submissions attached to this run (reverse reachability for FilingSubmission.edit_run_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: FilingSubmission[]
    side_effects: []

  - method: POST
    path: "/hmda/edit-exceptions/{id}/verify"
    description: "Analyst verifies a QUALITY or MACRO exception as reviewed-and-correct"
    roles: [ComplianceAnalyst]
    code: 200
    input: [verification_note]
    output: EditException
    side_effects:
      - "status := VERIFIED; verified_by_user_id := X-User-ID; verified_at := logical clock"
      - "bubble-up: Application.lar_status EXCEPTION_FLAGGED -> CLEARED when no OPEN exception remains, then EditRun.cleared_record_count +1, then EditRun COMPLETED -> CLEARED_ALL when the run is fully cleared"
      - "increments EditException.version by 1"

  # --- FilingSubmission ----------------------------------------------------
  - method: POST
    path: "/hmda/submissions"
    description: "Open a filing submission for the institution's activity year; supersedes any existing DRAFT submission (OCC on Institution.version)"
    roles: [ComplianceOfficer]
    code: 201
    input: [institution_id, expected_institution_version]
    output: FilingSubmission
    side_effects:
      - "status := DRAFT; activity_year and deadline_at copied from the Institution"
      - "provisional_record_count := PROVISIONAL variant of calculations.submission_record_count"
      - "any existing DRAFT submission of the institution gets is_superseded := true"
      - "increments Institution.version by 1"

  - method: GET
    path: "/hmda/submissions/{id}"
    description: "Read one filing submission"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: []
    output: FilingSubmission
    side_effects: []

  - method: POST
    path: "/hmda/submissions/{id}/attach-edit-run"
    description: "Bind a completed edit run to the submission"
    roles: [ComplianceOfficer]
    code: 200
    input: [edit_run_id]
    output: FilingSubmission
    side_effects:
      - "status DRAFT -> EDITS_ATTACHED; edit_run_id stored; increments FilingSubmission.version by 1"

  - method: POST
    path: "/hmda/submissions/{id}/certify"
    description: "Officer attests to the register; freezes the FINAL record count and locks the institution for filing"
    roles: [ComplianceOfficer]
    code: 200
    input: [attestation_text]
    output: FilingSubmission
    side_effects:
      - "status EDITS_ATTACHED -> CERTIFIED; certified_by_user_id := X-User-ID; certified_at := logical clock"
      - "final_record_count := FINAL variant of calculations.submission_record_count"
      - "Institution.filing_posture := LOCKED_FOR_FILING; increments Institution.version by 1"

  - method: POST
    path: "/hmda/submissions/{id}/file"
    description: "File the register with the regulator; evaluates the annual deadline and publishes the disclosure statements"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FilingSubmission
    side_effects:
      - "status CERTIFIED -> FILED; filed_at, is_late and late_by_days from calculations.filing_deadline_and_lateness"
      - "hop 2: FINAL-set Applications in REGISTER_LOCKED -> ARCHIVED"
      - "hop 3: Institution.open_register_count recomputed; filing_posture FILED_YEAR -> CLOSED_YEAR when it reaches 0"
      - "appends DisclosureStatement rows MODIFIED_LAR then DISCLOSURE_REPORT with calculations.disclosure_redaction outputs"
      - "increments Institution.version by 1"

  - method: POST
    path: "/hmda/submissions/{id}/review"
    description: "Examiner accepts or rejects a filed submission"
    roles: [Examiner]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: FilingSubmission
    side_effects:
      - "ACCEPT -> ACCEPTED (terminal); REJECT -> REJECTED, archived Applications return to REGISTER_LOCKED and Institution.filing_posture := OPEN"
      - "increments FilingSubmission.version and Institution.version by 1"

  - method: POST
    path: "/hmda/submissions/{id}/resubmit"
    description: "Return a rejected submission to DRAFT so the register can be corrected and refiled"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: FilingSubmission
    side_effects:
      - "status REJECTED -> DRAFT; resubmission_count +1; edit_run_id, certification and filing fields cleared"

  - method: GET
    path: "/hmda/submissions/{id}/disclosure-statements"
    description: "List the public artifacts produced by this filing (reverse reachability for DisclosureStatement.submission_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["statement_type?", "limit?", "offset?"]
    output: DisclosureStatement[]
    side_effects: []

  # --- Audit scrub ---------------------------------------------------------
  - method: POST
    path: "/hmda/audit-samples"
    description: "Draw a scrub sample over a closed action-date period"
    roles: [ComplianceAnalyst]
    code: 201
    input: [institution_id, method, period_start, period_end, fields_reviewed_per_record]
    output: AuditSample
    side_effects:
      - "runs calculations.audit_sample_sizing_and_selection -> population_size, sample_size, selected_application_ids"
      - "status := DRAFT"

  - method: GET
    path: "/hmda/audit-samples/{id}"
    description: "Read one audit sample with its selection and defect counters"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: []
    output: AuditSample
    side_effects: []

  - method: GET
    path: "/hmda/audit-samples/{id}/findings"
    description: "List the sample's findings (reverse reachability for AuditFinding.audit_sample_id)"
    roles: [SystemAdmin, InstitutionAdmin, ComplianceAnalyst, ComplianceOfficer, Examiner]
    code: 200
    input: ["resolution?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/hmda/audit-findings"
    description: "Record one re-keyed field comparison against a sampled record; occupies a closed remediation window on that record"
    roles: [ComplianceAnalyst]
    code: 201
    input: [audit_sample_id, application_id, field_name, recorded_value, source_document_value, severity, remediation_start, remediation_end]
    output: AuditFinding
    side_effects:
      - "is_defect := recorded_value != source_document_value"
      - "AuditSample.defect_count and records_with_defect_count recomputed"
      - "AuditSample status DRAFT -> IN_REVIEW on the first finding"

  - method: POST
    path: "/hmda/audit-samples/{id}/close"
    description: "Close the sample, choosing which defect-rate variant to publish"
    roles: [ComplianceAnalyst]
    code: 200
    input: [defect_rate_basis]
    output: AuditSample
    side_effects:
      - "defect_rate_pct := calculations.audit_defect_rate under the chosen variant"
      - "status -> CLOSED_CLEAN or CLOSED_WITH_FINDINGS; own findings move resolution OPEN -> ACCEPTED_AS_IS"

  # --- Fair lending --------------------------------------------------------
  - method: POST
    path: "/hmda/fair-lending-analyses"
    description: "Compute a denial-rate disparity index between a control and a protected group using register data"
    roles: [ComplianceAnalyst]
    code: 201
    input: [institution_id, basis, control_group_code, protected_group_code, period_start, period_end]
    output: FairLendingAnalysis
    side_effects:
      - "runs calculations.fair_lending_disparity_index -> both rates, disparity_index, significance_flag"
      - "status auto-resolves to ESCALATED (SEVERE) or CLEARED"

  # --- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "every subsequent action_taken_date bound, certified_at, verified_at, filed_at and deadline comparison reads the new value"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- authentication / authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_INSTITUTION_SCOPE_VIOLATION, http: 403, condition: "An InstitutionAdmin addresses an Institution whose id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The certifying ComplianceOfficer's X-User-ID also appears as verified_by_user_id on a VERIFIED exception of the attached run" }

  # -- existence
  - { id: ERR_INSTITUTION_NOT_FOUND, http: 404, condition: "No Institution with the supplied id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No Application with the supplied id" }
  - { id: ERR_DEMOGRAPHIC_ENTRY_NOT_FOUND, http: 404, condition: "No DemographicEntry with the supplied id" }
  - { id: ERR_GEOCODE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No GeocodeAssignment with the supplied id" }
  - { id: ERR_CENSUS_TRACT_NOT_FOUND, http: 404, condition: "No CensusTract with the supplied id" }
  - { id: ERR_EDIT_RUN_NOT_FOUND, http: 404, condition: "No EditRun with the supplied id" }
  - { id: ERR_EDIT_EXCEPTION_NOT_FOUND, http: 404, condition: "No EditException with the supplied id" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "No FilingSubmission with the supplied id" }
  - { id: ERR_AUDIT_SAMPLE_NOT_FOUND, http: 404, condition: "No AuditSample with the supplied id" }

  # -- request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, unknown enum member, wrong type, unparseable datetime, or limit/offset outside the §1.0 pagination bounds" }

  # -- optimistic concurrency
  - { id: ERR_STALE_INSTITUTION_VERSION, http: 412, condition: "expected_institution_version differs from Institution.version on POST /hmda/submissions" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version differs from Application.version on POST /hmda/geocode-assignments" }

  # -- state preconditions
  - { id: ERR_INVALID_STAGE_TRANSITION, http: 409, condition: "The requested to_stage is not reachable from the Application's current stage, or a stage precondition other than the geocode/demographic guards fails" }
  - { id: ERR_INVALID_SUBMISSION_STATE, http: 409, condition: "The FilingSubmission is not in the state the requested submission action requires" }
  - { id: ERR_EXCEPTION_NOT_OPEN, http: 409, condition: "verify called on an EditException whose status is VERIFIED or STALE" }
  - { id: ERR_GEOCODE_NOT_OVERRIDABLE, http: 409, condition: "manual-override called on a GeocodeAssignment whose status is not AMBIGUOUS or NOT_MATCHED" }
  - { id: ERR_SAMPLE_NOT_OPEN, http: 409, condition: "close or a new finding on an AuditSample already CLOSED_CLEAN or CLOSED_WITH_FINDINGS" }
  - { id: ERR_APPLICATION_ARCHIVED, http: 409, condition: "A mutation targets an Application whose stage is ARCHIVED, or an exception whose application is ARCHIVED" }
  - { id: ERR_EDIT_RUN_INVALIDATED, http: 409, condition: "attach-edit-run names an EditRun whose status is INVALIDATED or RUNNING" }
  - { id: ERR_GEOCODE_UNRESOLVED, http: 409, condition: "advance to REGISTER_LOCKED while the record's current GeocodeAssignment status is PENDING, AMBIGUOUS or NOT_MATCHED" }
  - { id: ERR_MISSING_APPLICANT_DEMOGRAPHICS, http: 409, condition: "advance to UNDERWRITING with no APPLICANT DemographicEntry on the record" }

  # -- demographic collection safety
  - { id: ERR_VISUAL_OBSERVATION_NOT_PERMITTED, http: 422, condition: "collection_method VISUAL_OBSERVATION_OR_SURNAME on a record whose application_channel is not FACE_TO_FACE" }
  - { id: ERR_DISAGGREGATED_CODE_NOT_PERMITTED, http: 422, condition: "A disaggregated ethnicity/race subcategory, INFO_NOT_PROVIDED, or a sex_code outside {MALE, FEMALE, BOTH} recorded under visual observation or surname" }
  - { id: ERR_OBSERVATION_REQUIRED_FOR_IN_PERSON, http: 422, condition: "collection_method NOT_PROVIDED_BY_APPLICANT for a natural person on a FACE_TO_FACE application" }
  - { id: ERR_NON_NATURAL_PERSON_MISMATCH, http: 422, condition: "is_natural_person false while collection_method or any code is something other than NOT_APPLICABLE" }

  # -- cross-field referential accuracy
  - { id: ERR_DENIAL_REASON_REQUIRED, http: 422, condition: "action_taken DENIED or PREAPPROVAL_DENIED with an empty denial_reason_codes array" }
  - { id: ERR_DENIAL_REASON_NOT_PERMITTED, http: 422, condition: "denial_reason_codes supplied for an action_taken that is not a denial" }
  - { id: ERR_PURCHASER_TYPE_REQUIRED, http: 422, condition: "action_taken PURCHASED_LOAN without a purchaser_type, or with purchaser_type NOT_APPLICABLE" }
  - { id: ERR_GEOCODE_TRACT_MISMATCH, http: 422, condition: "The override tract's county_fips or state_code differs from the assignment's" }
  - { id: ERR_EDIT_RUN_INSTITUTION_MISMATCH, http: 422, condition: "attach-edit-run names a run belonging to a different Institution" }
  - { id: ERR_FINDING_APPLICATION_NOT_IN_SAMPLE, http: 422, condition: "A finding names an application_id absent from the sample's selected_application_ids" }

  # -- action-date accuracy
  - { id: ERR_ACTION_DATE_BEFORE_APPLICATION, http: 422, condition: "action_taken_date earlier than the record's application_date" }
  - { id: ERR_ACTION_DATE_IN_FUTURE, http: 422, condition: "action_taken_date later than the current logical clock" }
  - { id: ERR_ACTION_DATE_OUTSIDE_ACTIVITY_YEAR, http: 422, condition: "year(action_taken_date) differs from the Institution's activity_year" }

  # -- interval and uniqueness constraints
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end <= window_start on an EditRun, or period_end < period_start, or remediation_end < remediation_start" }
  - { id: ERR_EDIT_RUN_WINDOW_OVERLAP, http: 409, condition: "The new run's half-open window collides with a non-INVALIDATED run of the same Institution" }
  - { id: ERR_REMEDIATION_WINDOW_OVERLAP, http: 409, condition: "The new finding's closed remediation window collides with an OPEN finding on the same Application" }
  - { id: ERR_DUPLICATE_ULI, http: 409, condition: "uli already used by a non-superseded Application of the same Institution" }
  - { id: ERR_DUPLICATE_LEI, http: 409, condition: "lei already registered" }
  - { id: ERR_DUPLICATE_DEMOGRAPHIC_ROLE, http: 409, condition: "A DemographicEntry already exists for this (application_id, applicant_role)" }
  - { id: ERR_TOO_MANY_RACE_CODES, http: 422, condition: "More than 5 race codes or more than 2 ethnicity codes" }
  - { id: ERR_SEVERITY_NOT_VERIFIABLE, http: 422, condition: "verify called on a SYNTACTICAL or VALIDITY exception" }

  # -- aggregate / quota
  - { id: ERR_OPEN_VALIDITY_EDITS, http: 422, condition: "certify while the attached run still has OPEN SYNTACTICAL or VALIDITY exceptions" }
  - { id: ERR_VERIFICATION_QUOTA_NOT_MET, http: 422, condition: "certify while verified_exception_count is below required_verified_quota" }
  - { id: ERR_EMPTY_SAMPLE_POPULATION, http: 422, condition: "The audit sampling candidate set is empty for the requested period" }
  - { id: ERR_EMPTY_CONTROL_GROUP, http: 422, condition: "Either the control group or the protected group is empty for the requested period" }

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator who onboards reporting institutions, loads census reference data and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /hmda/institutions"
      - "POST /hmda/census-tracts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: InstitutionAdmin
    description: "Bank-side administrator of exactly one Institution; X-User-ID is that Institution's id"
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "PATCH /hmda/institutions/{id} (only where {id} == X-User-ID)"
    shared_operations:
      - "All GET endpoints (institution-scoped reads are limited to the acting Institution)"

  - name: LoanOfficer
    description: "Front-line originator who captures register fields stage by stage, records action taken, collects applicant demographics and geocodes the property"
    identity: opaque
    exclusive_operations:
      - "POST /hmda/applications"
      - "PATCH /hmda/applications/{id}"
      - "POST /hmda/applications/{id}/advance"
      - "POST /hmda/applications/{id}/action-taken"
      - "POST /hmda/demographic-entries"
      - "PATCH /hmda/demographic-entries/{id}"
      - "POST /hmda/geocode-assignments"
    shared_operations:
      - "GET /hmda/institutions/{id} and its applications sub-resource, GET /hmda/applications/{id} and its corrections, demographic-entries, geocode-assignments and edit-exceptions sub-resources, GET /hmda/census-tracts/{id}"

  - name: ComplianceAnalyst
    description: "Second-line reviewer who resolves geocode ambiguity, runs the edit battery, verifies quality exceptions, reopens locked records, runs the data scrub and computes fair lending disparities"
    identity: opaque
    exclusive_operations:
      - "POST /hmda/applications/{id}/reopen"
      - "POST /hmda/geocode-assignments/{id}/manual-override"
      - "POST /hmda/edit-runs"
      - "POST /hmda/edit-exceptions/{id}/verify"
      - "POST /hmda/audit-samples"
      - "POST /hmda/audit-findings"
      - "POST /hmda/audit-samples/{id}/close"
      - "POST /hmda/fair-lending-analyses"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Accountable officer who opens, attaches, certifies, files and resubmits the annual filing. Segregation of duties: this officer's X-User-ID must not be the analyst id that verified any exception on the attached run"
    identity: opaque
    exclusive_operations:
      - "POST /hmda/submissions"
      - "POST /hmda/submissions/{id}/attach-edit-run"
      - "POST /hmda/submissions/{id}/certify"
      - "POST /hmda/submissions/{id}/file"
      - "POST /hmda/submissions/{id}/resubmit"
    shared_operations:
      - "All GET endpoints"

  - name: Examiner
    description: "Regulator-side reviewer with read access to the whole platform and the sole power to accept or reject a filed submission"
    identity: opaque
    exclusive_operations:
      - "POST /hmda/submissions/{id}/review"
    shared_operations:
      - "All GET endpoints"
