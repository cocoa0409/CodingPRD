# =============================================================================
# PRD Benchmark Seed Tables — task_3100
# Private Mortgage Insurance Underwriting & Claim Settlement
# =============================================================================

scenario: |
  Private Mortgage Insurance Underwriting & Claim Settlement (MGIC): coverage application from lenders with delegated and non-delegated underwriting paths, premium plan selection across borrower-paid monthly, single and lender-paid structures with rate cards by credit and loan-to-value, master policy terms governing rescission relief, curtailment and independent validation of loan data, cancellation of coverage on borrower request or automatic termination at amortization milestones, servicer reporting of delinquency with loss mitigation participation requirements, claim filing after foreclosure or short sale with claim amount computation and settlement options, rescission and curtailment disputes over origination defects, portfolio risk concentration and reinsurance

domain_name: private-mortgage-insurance-underwriting-claim-settlement
api_prefix: /mortgage-insurance

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation
    - Rate / threshold triggers
    - Cascading side effects
    - Optimistic concurrency

  entity_topology: flat
  # Loan is the spine. MasterPolicy / RateCard / ReinsuranceTreaty / Servicer /
  # ReinsuranceCession are configuration and counterparty records that Loan
  # references by FK; Claim, ClaimSettlementOption, DelinquencyReport,
  # CancellationNotice, CurtailmentDispute and PortfolioSnapshot are
  # transaction records that reference Loan. No URL nesting beyond
  # /mortgage-insurance/<collection>/{id}.

  state_machine_shape: branching
  # CoverageApplication forks at submission (delegated vs non-delegated) and
  # has a real revert cycle via information requests.
  # LoanCoverage is a parallel two-axis machine (coverage_status x
  # amortization_status) whose coverage_status additionally derives from the
  # compound aggregate of the loan's Class-A delinquency streak.
  # Claim is cyclic: RECONSIDERATION re-opens DENIED or SETTLED claims.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: peer_roles
  # Lender / Servicer / Underwriter / MasterPolicyAdmin each own a different
  # slice of the surface; MasterPolicyAdmin is the sole override authority for
  # rescission relief, persistence waivers and reinsurance configuration.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: MasterPolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Master policy identifier" }
      - { name: anniversary_utc, type: datetime, source: input, description: "Policy anniversary instant in ISO 8601 UTC; the rescission-relief cycle boundary" }
      - { name: coverage_percent_default, type: integer, source: input, default: 25, description: "Default coverage percentage applied when a CoverageApplication pins none; allowed values are 12, 25, 30 only" }
      - { name: delegated_curtailment_rate, type: number, source: input, description: "Curtailment factor applied to a CLAIM whose Loan was written on the delegated underwriting path" }
      - { name: nondelagated_curtailment_rate, type: number, source: input, description: "Curtailment factor applied to a CLAIM whose Loan was written on the non-delegated underwriting path" }
      - { name: ltv_variance_tolerance, type: number, source: input, description: "Fractional tolerance used by independent_loan_data_validation" }
      - { name: servicer_loss_mitigation_standard, type: enum, source: input, description: "PARTICIPATION | PARTICIPATION_COMPLETE — the standard a DelinquencyReport must satisfy for the covering Loan to remain claim-eligible" }
      - { name: rescission_relief_cycles, type: integer, source: input, description: "Number of consecutive payment-free-of-delinquency anniversary cycles a Loan must survive before the statutory rescission relief guarantee attaches" }
      - { name: min_third_party_net_bps, type: integer, source: input, description: "Floor applied to every settlement option of kind THIRD_PARTY_SALE, in basis points of the computed net adjusted claim amount" }
      - { name: two_year_effective_flag, type: boolean, source: input, description: "Whether Rule 2 of the rescission relief guarantee is available for loans sourced from this policy" }
      - { name: exposure_contribution_rate, type: number, source: input, description: "Fractional quota each loan written under this policy contributes to its lender's exposure reconciliation" }
      - { name: status, type: enum, source: system, description: "ACTIVE — a policy is created active and this scaffold declares no suspension or termination operation for it, so no other value is reachable" }

  - name: RateCard
    parent: MasterPolicy
    common_fields: true
    fields:
      - { name: master_policy_id, type: string, source: system, description: "FK -> MasterPolicy.id; owning master policy" }
      - { name: credit_grade, type: enum, source: input, description: "A | B | C | D — borrower credit band the card prices" }
      - { name: ltv_band, type: enum, source: input, description: "831_TO_85 | 851_TO_90 | 901_TO_95 — the loan-to-value band the card prices" }
      - { name: coverage_percent, type: integer, source: input, description: "Coverage percentage this card prices; restricted to the policy's allowed set" }
      - { name: premium_plan, type: enum, source: input, description: "BPM | SPM | LPM" }
      - { name: rate_bps, type: integer, source: input, description: "Rate in basis points of the coverage base for this (credit_grade, ltv_band, coverage_percent, premium_plan)" }
      - { name: min_borrower_reserves_months, type: integer, source: system, default: 0, description: "Minimum months of reserves a borrower must document; 0 when the card imposes no reserve requirement" }

  - name: ReinsuranceTreaty
    parent: null
    common_fields: true
    fields:
      - { name: treaty_number, type: string, source: input, description: "Treaty identifier" }
      - { name: inception_utc, type: datetime, source: input, description: "Start of the treaty effective window (inclusive)" }
      - { name: expiration_utc, type: datetime, source: input, description: "End of the treaty effective window (exclusive)" }
      - { name: retention_per_claim_cents, type: integer, source: input, description: "Per-claim attachment point" }
      - { name: exhaustion_per_claim_cents, type: integer, source: input, description: "Per-claim exhaustion point; capacity = exhaustion - retention" }
      - { name: aggregate_ceded_cap_cents, type: integer, source: input, description: "Maximum aggregate ceded across all loans covered by this treaty" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | CANCELLED" }

  - name: Servicer
    parent: null
    common_fields: true
    fields:
      - { name: servicer_name, type: string, source: input, description: "Servicing organization name" }
      - { name: tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3 — determines the required loss-mitigation participation standard" }
      - { name: loss_mitigation_capability, type: enum, source: input, description: "PARTICIPATION | PARTICIPATION_COMPLETE — the highest standard this servicer has been approved to perform" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; starts at 1 and increments by exactly one on every mutation of this row" }

  - name: CoverageApplication
    parent: null
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; the lender submitting the application" }
      - { name: master_policy_id, type: string, source: input, description: "FK -> MasterPolicy.id; the master policy the coverage is issued under" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; must share the application's master_policy_id" }
      - { name: borrower_reference, type: string, source: input, description: "Lender-side borrower reference" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Note amount of the mortgage" }
      - { name: property_value_cents, type: integer, source: input, description: "Origination appraised value, exclusive of any financed premium" }
      - { name: credit_grade, type: enum, source: input, description: "A | B | C | D as reported by the lender" }
      - { name: coverage_percent, type: integer, source: input, description: "Requested coverage percentage" }
      - { name: premium_plan, type: enum, source: input, description: "BPM | SPM | LPM" }
      - { name: borrower_paid, type: boolean, source: input, description: "Whether the borrower bears the premium" }
      - { name: financed_premium, type: boolean, source: input, description: "Whether an SPM premium is financed into the note amount" }
      - { name: borrower_reserves_months, type: integer, source: input, default: 0, description: "Months of reserves documented at origination" }
      - { name: county_code, type: string, source: input, description: "5-digit FIPS county of the mortgaged property; drives portfolio concentration segments" }
      - { name: term_months, type: integer, source: input, description: "Note term in months; the claim filing bar is measured from the event instant for terms up to 240 months" }
      - { name: underwriting_path, type: enum, source: system, description: "DELEGATED | NON_DELEGATED; assigned by the underwriting path selected at submission" }
      - { name: submitted_utc, type: datetime, source: system, description: "Instant the application was received" }
      - { name: underwritten_utc, type: datetime, source: system, description: "Instant underwriting completed" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Number of times the application has been returned to SUBMITTED for borrower information" }
      - { name: approved_coverage_percent, type: integer, source: computed, description: "Coverage percentage underwritten into the coverage; 0 before approval; never exceeds the requested coverage_percent" }
      - { name: rate_bps_applied, type: integer, source: computed, description: "Rate from the pinned RateCard, or 0 when LENDER_PAID" }
      - { name: coverage_base_upb_cents, type: computed, description: "Integer coverage base: floor(loan_amount_cents * effective_coverage_percent / 100)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | IN_UNDERWRITING | INFO_REQUESTED | APPROVED | DECLINED | WITHDRAWN" }

  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: lender_name, type: string, source: input, description: "Lending institution name" }
      - { name: delegated_underwriting, type: boolean, source: input, description: "Whether the lender holds delegated underwriting authority" }
      - { name: policy_exposure_cap_cents, type: integer, source: input, description: "Maximum aggregate coverage base this lender may have in force" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> CoverageApplication.id; originating application" }
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; designated servicing organization" }
      - { name: reinsurance_treaty_id, type: string, source: input, description: "FK -> ReinsuranceTreaty.id; treaty the loan is ceded into; may reference a treaty that is not yet in force" }
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; denormalized from the originating CoverageApplication for exposure aggregation" }
      - { name: master_policy_id, type: string, source: system, description: "FK -> MasterPolicy.id; denormalized from the originating CoverageApplication" }
      - { name: coverage_percent, type: integer, source: system, description: "Coverage percentage in force" }
      - { name: premium_plan, type: enum, source: system, description: "BPM | SPM | LPM" }
      - { name: borrower_paid, type: boolean, source: system, description: "Whether the borrower bears the premium" }
      - { name: underwriting_path, type: enum, source: system, description: "DELEGATED | NON_DELEGATED; copied from the originating application" }
      - { name: rate_bps_applied, type: integer, source: system, description: "Rate in force; 0 when LENDER_PAID" }
      - { name: coverage_base_upb_cents, type: system, description: "Item 1 original coverage base; the ceiling used by claim_amount_computation" }
      - { name: current_upb_cents, type: integer, source: input, description: "Current unpaid principal balance; mutated by POST /loans/{id}/amortization-milestones" }
      - { name: current_coverage_base_cents, type: integer, source: computed, description: "floor(current_upb_cents * coverage_percent / 100) — the part of the coverage base still outstanding; drives the cancellation refund" }
      - { name: annual_premium_cents, type: computed, description: "round_half_up(coverage_base_upb_cents * rate_bps_applied / 10000) — the loan's annual premium under the borrower-paid monthly plan" }
      - { name: monthly_period_cents, type: computed, description: "ceil(annual_premium_cents / 12) — the borrower-paid monthly instalment" }
      - { name: final_period_cents, type: computed, description: "annual_premium_cents - 11 * monthly_period_cents — the twelfth instalment that absorbs the rounding remainder" }
      - { name: single_premium_cents, type: computed, default: 0, description: "The one-time premium of an SPM loan, computed by single_premium; 0 for BPM and LPM loans" }
      - { name: origination_property_value_cents, type: integer, source: input, description: "Property value asserted by the lender at origination" }
      - { name: verified_property_value_cents, type: integer, source: computed, description: "Property value established by independent validation; null until a report is submitted" }
      - { name: verified_loan_amount_cents, type: integer, source: computed, description: "Note amount established by independent validation; null until a report is submitted" }
      - { name: credit_grade, type: enum, source: system, description: "A | B | C | D" }
      - { name: county_code, type: string, source: system, description: "5-digit FIPS county, copied from the originating CoverageApplication" }
      - { name: term_months, type: integer, source: system, description: "Note term in months, copied from the originating CoverageApplication" }
      - { name: approval_credit_grade, type: enum, source: system, description: "Credit grade underwritten into the coverage; frozen at CoverageApplication approval" }
      - { name: coverage_status, type: enum, source: system, description: "ACTIVE | PENDING_CANCELLATION | CANCELLED" }
      - { name: termination_reason, type: enum, source: system, default: "NONE", description: "NONE | BORROWER_REQUEST | LTV_MILESTONE | SERVICER_LOSS_MITIGATION_FAILURE" }
      - { name: cancellation_effective_utc, type: datetime, source: system, description: "Instant coverage ends; null while coverage_status == ACTIVE" }
      - { name: amortization_status, type: enum, source: system, description: "IN_AMORTIZATION | AT_78 | AT_80 — the amortization milestone axis, independent of coverage_status" }
      - { name: milestone_78_reached_utc, type: datetime, source: computed, description: "Instant the loan first reached a 78% amortized loan-to-value ratio; null if not yet reached" }
      - { name: delinquency_streak, type: integer, source: computed, description: "Number of consecutive Class-A DelinquencyReports, most-recent-first, without interruption" }
      - { name: last_loss_mitigation_deficient_utc, type: datetime, source: computed, description: "Effective instant of the most recent Class-A report whose participation standard was deficient; null if none" }
      - { name: rescission_relief_status, type: enum, source: computed, description: "NONE | PROVISIONAL | GUARANTEED — Rule 1/2 state of the rescission relief guarantee" }
      - { name: rescission_relief_cycle_index, type: integer, source: computed, description: "Number of consecutive payment-free-of-delinquency anniversary cycles completed" }
      - { name: claim_blocked, type: boolean, source: computed, default: false, description: "Set true when the loan's last Class-A delinquency report failed the applicable loss-mitigation standard" }
      - { name: aggregate_ceded_cents, type: computed, description: "Sum of accepted cessions across this loan's CLAIMs; never exceeds the referenced treaty's aggregate_ceded_cap_cents" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; starts at 1 and increments by exactly one on every mutation of this row" }

  - name: DelinquencyReport
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan being reported" }
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; the reporting servicer" }
      - { name: as_of_period, type: string, source: input, description: "Reporting month as YYYY-MM" }
      - { name: delinquency_class, type: enum, source: input, description: "A | B; class A is a report of one or more payments past due, class B reports no past-due payment" }
      - { name: months_delinquent, type: integer, source: input, description: "Number of contractual payments past due" }
      - { name: loss_mitigation_activities, type: array, source: input, description: "List of { activity_kind, outcome, activity_utc }; activity_kind ∈ {OUTREACH_SENT, INTAKE_COMPLETE, EVALUATION_COMPLETE, PROGRAM_ACCEPTED, COLLATERAL_SALE_LISTING}" }
      - { name: reported_utc, type: datetime, source: system, description: "Instant the report was filed" }
      - { name: effective_utc, type: datetime, source: computed, description: "as_of_period fifth calendar day at 00:00:00Z; the instant this report enters the loan's timeline" }
      - { name: participation_standard_met, type: boolean, source: computed, description: "Whether loss_mitigation_activities satisfy the standard required of the loan's servicer" }

  - name: CancellationNotice
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose coverage is being terminated" }
      - { name: request_kind, type: enum, source: input, description: "BORROWER_REQUEST | SERVICER_LOSS_MITIGATION_FAILURE" }
      - { name: requested_by_role, type: enum, source: input, description: "BORROWER | SERVICER — the party submitting the notice" }
      - { name: notice_utc, type: datetime, source: input, description: "Instant the notice is given" }
      - { name: evidence_cents, type: integer, source: input, default: 0, description: "Eligible evidence amount supporting the maximum-refund computation" }
      - { name: applied_utc, type: datetime, source: input, description: "Requested effective instant of termination" }
      - { name: refund_cents, type: computed, description: "Refund of unearned premium held by the master insurer; 0 for factor-zero terminations" }
      - { name: effective_utc, type: computed, description: "Instant termination is actually applied; clamped forward to notice_utc + 30 days when the request is early" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPLIED | REJECTED" }

  - name: ExternalReport
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan independently validated" }
      - { name: verified_loan_amount_cents, type: integer, source: input, description: "Externally established note amount" }
      - { name: verified_property_value_cents, type: integer, source: input, description: "Externally established property value" }
      - { name: post_origination_value_cents, type: integer, source: input, default: 0, description: "Externally observed value after origination; 0 when the report predates the loan, which suppresses the occupancy/value-reset pathway" }
      - { name: occupancy_reported, type: enum, source: input, description: "OWNER_OCCUPIED | SECOND_HOME | INVESTMENT" }
      - { name: independent_validation_completed_utc, type: datetime, source: input, description: "Instant the independent validation completed" }
      - { name: validated_ltv, type: number, source: computed, description: "100 * verified_loan_amount_cents / verified_property_value_cents, 4 decimal places round_half_up" }
      - { name: occupancy_materially_differs, type: boolean, source: computed, description: "True when occupancy_reported is INVESTMENT" }

  - name: CurtailmentDispute
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose origination data is contested" }
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; the contesting lender" }
      - { name: target_claim_id, type: string, source: input, description: "FK -> Claim.id on the same loan; the curtailment being contested" }
      - { name: grounds, type: enum, source: input, description: "ORIGINATION_OMISSION | OCCUPANCY_MISREPRESENTATION | VALUATION_ERROR | LOSS_MITIGATION_EXCUSE" }
      - { name: asserted_coverage_percent, type: integer, source: input, description: "Coverage percentage the lender asserts should apply" }
      - { name: filed_utc, type: datetime, source: system, description: "Instant the dispute was filed" }
      - { name: decision, type: enum, source: input, description: "UPHELD | DENIED | RESCISSION_GRANTED | RESCISSION_DENIED; null while status == OPEN" }
      - { name: decision_utc, type: datetime, source: system, description: "Instant the decision was recorded; null while open" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED" }

  - name: Claim
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the claim is filed against" }
      - { name: event_kind, type: enum, source: input, description: "FORECLOSURE | SHORT_SALE | DEED_IN_LIEU" }
      - { name: event_completed_utc, type: datetime, source: input, description: "Instant the title-transferring event completed" }
      - { name: unpaid_principal_cents, type: integer, source: input, description: "Item 1 — unpaid principal balance at the event" }
      - { name: accrued_interest_cents, type: integer, source: input, description: "Item 2 — accrued interest claimed" }
      - { name: allowable_advances_cents, type: integer, source: input, description: "Item 3 — allowable advances claimed" }
      - { name: gross_proceeds_cents, type: integer, source: input, description: "Item 4 — gross sale or liquidation proceeds" }
      - { name: expenses_of_sale_cents, type: integer, source: input, description: "Item 5 — expenses of sale" }
      - { name: filed_utc, type: datetime, source: system, description: "Instant the claim was submitted" }
      - { name: curtailment_rate_applied, type: number, source: computed, description: "Curtailment factor taken from the loan's underwriting path; frozen at filing" }
      - { name: permitted_interest_cents, type: computed, description: "min(accrued_interest_cents, floor(unpaid_principal_cents * 0.15))" }
      - { name: permitted_advances_cents, type: computed, description: "min(allowable_advances_cents, floor(unpaid_principal_cents * 1.10))" }
      - { name: net_unpaid_balance_cents, type: computed, description: "unpaid_principal_cents + permitted_interest_cents + permitted_advances_cents" }
      - { name: recoverable_amount_cents, type: computed, description: "max(0, net_unpaid_balance_cents - (gross_proceeds_cents - expenses_of_sale_cents))" }
      - { name: coverage_ceiling_cents, type: computed, description: "Loan.coverage_base_upb_cents as frozen at claim filing — the ceiling is applied before curtailment" }
      - { name: covered_claim_amount_cents, type: computed, description: "min(recoverable_amount_cents, coverage_ceiling_cents) — pre-curtailment covered amount" }
      - { name: post_curtailment_cents, type: computed, description: "covered_claim_amount_cents - floor(covered_claim_amount_cents * curtailment_rate_applied)" }
      - { name: claim_deductible_cents, type: computed, description: "floor(post_curtailment_cents * deductible_rate) using the deductible rate of Loan.approval_credit_grade" }
      - { name: net_claim_amount_cents, type: computed, description: "post_curtailment_cents - claim_deductible_cents" }
      - { name: trace_number, type: string, source: system, description: "Server-minted identifier used only for path addressing, never for ranking" }
      - { name: settlement_option_kind, type: enum, source: input, description: "CASH | THIRD_PARTY_SALE | DEED_IN_LIEU | DIL; null until settlement" }
      - { name: settlement_amount_cents, type: computed, description: "Amount payable under the selected option; null until chosen" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | SETTLED | RESCINDED" }

  - name: ClaimSettlementOption
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim this option prices" }
      - { name: option_kind, type: enum, source: input, description: "CASH | THIRD_PARTY_SALE | DEED_IN_LIEU | DIL" }
      - { name: computed_amount_cents, type: computed, description: "Settlement amount this option would pay for the claim's current net_claim_amount_cents" }

  - name: PortfolioSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: snapshot_utc, type: datetime, source: input, description: "Instant the snapshot is declared for" }
      - { name: cluster_in_force_threshold_cents, type: integer, source: input, description: "Aggregate in-force coverage base within one geography at which the snapshot breaches concentration" }
      - { name: lender_concentration_index, type: number, source: computed, description: "Largest share of any single lender's aggregate coverage base over the whole in-force book, as a fraction; null when the in-force book is empty" }
      - { name: geography_totals, type: array, source: computed, description: "Per-geography in-force coverage base totals driving the concentration segments" }
      - { name: aggregate_ceded_cents, type: computed, description: "Reinsurance attributed across the whole in-force book" }
      - { name: segment_statuses, type: array, source: computed, description: "Per-segment concentration status, each WITHIN_LIMITS or BREACHED" }
      - { name: status, type: enum, source: system, description: "COMPUTED | SUPERSEDED" }

  - name: ReinsuranceCession
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being ceded under its loan's treaty" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan the ceded claim belongs to" }
      - { name: treaty_id, type: string, source: system, description: "FK -> ReinsuranceTreaty.id; the treaty applied" }
      - { name: ceded_amount_cents, type: computed, description: "Amount the treaty absorbs for this claim" }
      - { name: retained_amount_cents, type: computed, description: "Amount the insurer retains for this claim" }
      - { name: aggregate_ceded_after_cents, type: computed, description: "Loan.aggregate_ceded_cents after this cession is applied" }
      - { name: status, type: enum, source: system, description: "ACCEPTED | REJECTED" }
      - { name: rejected_reason, type: enum, source: system, description: "NO_TREATY | TREATY_NOT_IN_FORCE_AT_EVENT | AGGREGATE_CAP_EXHAUSTED; null when ACCEPTED" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: CoverageApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_UNDERWRITING
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/underwrite"
        actor: Underwriter
        preconditions:
          - "Calling actor's X-User-ID equals Lender.delegated_underwriting for the application's lender is irrelevant here; this endpoint is the NON_DELEGATED path and is rejected when the lender holds delegated authority (ERR_PATH_MISMATCH)"
          - "Every required origination input is present and non-negative"
        side_effects:
          - "underwriting_path = NON_DELEGATED"
          - "underwritten_utc = current logical clock"
          - "increments CoverageApplication.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/delegated-approve"
        actor: Lender
        preconditions:
          - "Lender.delegated_underwriting == true (ERR_PATH_MISMATCH otherwise)"
          - "rate_card_id resolves to a RateCard whose master_policy_id equals this application's master_policy_id (ERR_RATE_CARD_MISMATCH)"
        side_effects:
          - "underwriting_path = DELEGATED"
          - "approved_coverage_percent = coverage_percent"
          - "rate_bps_applied = RateCard.rate_bps pinned at approval"
          - "coverage_base_upb_cents = floor(loan_amount_cents * coverage_percent / 100) when financed_premium == false"
          - "coverage_base_upb_cents = floor(loan_amount_cents * coverage_percent / 100) when financed_premium == true and premium_plan == SPM, pricing off the note amount as reported"
          - "increments CoverageApplication.version by 1"

      - from: IN_UNDERWRITING
        to: INFO_REQUESTED
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/request-info"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "resubmission_count += 1"
          - "increments CoverageApplication.version by 1"

      - from: INFO_REQUESTED
        to: IN_UNDERWRITING
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/submit-info"
        actor: Lender
        preconditions:
          - "Borrower reserves and occupancy data supplied"
        side_effects:
          - "increments CoverageApplication.version by 1"

      - from: IN_UNDERWRITING
        to: APPROVED
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "rate_card_id resolves to a RateCard whose master_policy_id equals this application's master_policy_id (ERR_RATE_CARD_MISMATCH)"
          - "The effective coverage percentage, initially the requested coverage_percent, is reduced by 5 percentage points for every condition below that holds: credit_grade worse than the RateCard's credit band, borrower_reserves_months < RateCard.min_borrower_reserves_months. The reduction is applied once per failing condition and is never compounded, and the effective percentage is floored at the MasterPolicy minimum allowed value; if the effective percentage would fall below that minimum the application is approved at the MasterPolicy minimum instead of being declined"
        side_effects:
          - "approved_coverage_percent = effective coverage percentage after underwriting reductions"
          - "rate_bps_applied = RateCard.rate_bps pinned at approval"
          - "coverage_base_upb_cents = floor(loan_amount_cents * approved_coverage_percent / 100)"
          - "underwritten_utc = current logical clock"
          - "increments CoverageApplication.version by 1"

      - from: IN_UNDERWRITING
        to: DECLINED
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/decline"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "increments CoverageApplication.version by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/withdraw"
        actor: Lender
        preconditions: []
        side_effects:
          - "increments CoverageApplication.version by 1"

      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /mortgage-insurance/coverage-applications/{id}/withdraw"
        actor: Lender
        preconditions: []
        side_effects:
          - "increments CoverageApplication.version by 1"

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: |
      LoanCoverage is a two-axis machine. The coverage axis (coverage_status) and
      the amortization axis (amortization_status) evolve independently: reaching a
      milestone never by itself ends coverage, and ending coverage never resets the
      milestone axis. coverage_status is additionally compound — it re-derives
      itself from the loan's Class-A delinquency streak on every DelinquencyReport.
    transitions:
      - from: ACTIVE
        to: PENDING_CANCELLATION
        trigger: "POST /mortgage-insurance/loans/{id}/cancellation-notices"
        actor: Lender | Servicer
        preconditions:
          - "For request_kind SERVICER_LOSS_MITIGATION_FAILURE: claim_blocked == true (ERR_CANCELLATION_NOT_PERMITTED otherwise)"
          - "evidence_cents >= max(0, round_half_up(10000 * (coverage_base_upb_cents - current_upb_cents) / coverage_base_upb_cents)) (ERR_INSUFFICIENT_EVIDENCE otherwise)"
        side_effects:
          - "Creates a CancellationNotice with status APPLIED and request_kind/evidence/notice_utc copied from the request"
          - "coverage_status = PENDING_CANCELLATION"
          - "cancellation_effective_utc = clamp(applied_utc, min_allowed = notice_utc + 30 days)"
          - "CancellationNotice.refund_cents = max(0, min(evidence_cents, round_half_up(10000 * (coverage_base_upb_cents - current_upb_cents) / coverage_base_upb_cents)))"
          - "Voids the loan's premium installments whose period covers cancellation_effective_utc; the loan's premium schedule total is preserved by premium_schedule_invariant"
          - "increments Loan.version by 1"

      - from: PENDING_CANCELLATION
        to: CANCELLED
        trigger: "system (when cancellation_effective_utc <= current logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "coverage_status = CANCELLED"
          - "CancellationNotice.status = APPLIED"
          - "increments Loan.version by 1"

      - from: PENDING_CANCELLATION
        to: ACTIVE
        trigger: "POST /mortgage-insurance/loans/{id}/rescission-relief (REVOKE relief)"
        actor: MasterPolicyAdmin
        preconditions: []
        side_effects:
          - "coverage_status = ACTIVE"
          - "cancellation_effective_utc = null"
          - "increments Loan.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mortgage-insurance/loans/{id}/amortization-milestones (self-transition)"
        actor: MasterPolicyAdmin
        preconditions:
          - "current_upb_cents <= floor(0.80 * origination_property_value_cents) (ERR_MILESTONE_NOT_REACHED otherwise)"
        side_effects:
          - "amortization_status takes the DEEPEST milestone the balance has reached: AT_78 when current_upb_cents <= floor(0.78 * origination_property_value_cents), else AT_80 when current_upb_cents <= floor(0.80 * origination_property_value_cents). It is monotonic and never regresses, so a loan already at AT_78 stays there"
          - "milestone_78_reached_utc = current logical clock on the first transition into AT_78, unchanged afterwards"
          - "increments Loan.version by 1"

      - from: ACTIVE
        to: PENDING_CANCELLATION
        trigger: "system (automatic when amortization_status == AT_78 AND current_upb_cents <= floor(0.78 * origination_property_value_cents))"
        actor: system
        preconditions:
          - "no cancellation is already pending"
        side_effects:
          - "coverage_status = PENDING_CANCELLATION"
          - "termination_reason = LTV_MILESTONE"
          - "cancellation_effective_utc = the later of (current logical clock) and (milestone_78_reached_utc + 30 days)"
          - "increments Loan.version by 1"

      - from: ACTIVE
        to: PENDING_CANCELLATION
        trigger: "system (automatic when delinquency_streak >= 3)"
        actor: system
        preconditions:
          - "claim_blocked == true"
          - "no cancellation is already pending"
        side_effects:
          - "termination_reason = SERVICER_LOSS_MITIGATION_FAILURE"
          - "cancellation_effective_utc = last_loss_mitigation_deficient_utc + 60 days"
          - "Creates a CancellationNotice with request_kind SERVICER_LOSS_MITIGATION_FAILURE and requested_by_role SERVICER"
          - "increments Loan.version by 1"

  - entity: DelinquencyReport
    initial_state: FILED
    terminal_states: [FILED]
    note: |
      Append-only. Every report is FILED on creation and never changes state; the
      loan timeline it feeds is what moves.
    transitions:
      - from: FILED
        to: FILED
        trigger: "POST /mortgage-insurance/delinquency-reports (creation)"
        actor: Servicer
        preconditions:
          - "Servicer.status == ACTIVE (ERR_SERVICER_INACTIVE otherwise)"
          - "as_of_period is unique per loan (ERR_DUPLICATE_PERIOD otherwise)"
        side_effects:
          - "effective_utc = as_of_period fifth calendar day at 00:00:00Z"
          - "participation_standard_met = whether loss_mitigation_activities satisfy the loan servicer's required standard"
          - "Recomputes Loan.delinquency_streak"
          - "Sets Loan.claim_blocked = true when this report is Class A and participation_standard_met == false; never clears it"
          - "Sets Loan.last_loss_mitigation_deficient_utc = this report's effective_utc when this report is Class A and participation_standard_met == false"
          - "Recomputes Loan.rescission_relief_status"
          - "May auto-transition Loan.coverage_status to PENDING_CANCELLATION (delinquency_streak >= 3) — see Loan machine"
          - "increments Loan.version by 1"

  - entity: Claim
    initial_state: FILED
    terminal_states: [SETTLED, RESCINDED]
    note: |
      Cyclic: a DENIED claim may be re-opened by RECONSIDERATION, and a SETTLED
      claim may be re-opened into RESCINDED dispute resolution. Denial is therefore
      not terminal.
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /mortgage-insurance/claims/{id}/begin-review"
        actor: Underwriter
        preconditions:
          - "Claim was filed no later than Loan.term_months after event_completed_utc (ERR_CLAIM_TIME_BARRED otherwise) — the bar is a whole month period measured from the event instant to filed_utc"
        side_effects:
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /mortgage-insurance/claims/{id}/reconsideration"
        actor: Lender
        preconditions:
          - "A reason is supplied"
        side_effects:
          - "status returns to FILED, re-entering the review cycle"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mortgage-insurance/claims/{id}/approve"
        actor: Underwriter
        preconditions:
          - "Loan.coverage_status == ACTIVE at the claim's filing instant (ERR_COVERAGE_NOT_ACTIVE otherwise)"
          - "Loan.claim_blocked == false at the claim's filing instant (ERR_CLAIM_BLOCKED_LOSS_MITIGATION otherwise)"
        side_effects:
          - "Freezes curtailment_rate_applied from the loan's underwriting path if not already frozen"
          - "Recomputes the full claim arithmetic: permitted_interest_cents, permitted_advances_cents, net_unpaid_balance_cents, recoverable_amount_cents, coverage_ceiling_cents, covered_claim_amount_cents, post_curtailment_cents, claim_deductible_cents, net_claim_amount_cents"
          - "Creates the four ClaimSettlementOption rows (CASH, THIRD_PARTY_SALE, DEED_IN_LIEU, DIL) with their computed_amount_cents"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /mortgage-insurance/claims/{id}/deny"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "increments Claim.version by 1"

      - from: DENIED
        to: FILED
        trigger: "POST /mortgage-insurance/claims/{id}/reconsideration"
        actor: Lender
        preconditions:
          - "A reason is supplied"
        side_effects:
          - "Re-opens denial; the claim re-enters the review cycle"
          - "increments Claim.version by 1"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /mortgage-insurance/claims/{id}/settle"
        actor: Lender
        preconditions:
          - "settlement_option_kind names one of the claim's four ClaimSettlementOption rows (ERR_SETTLEMENT_OPTION_UNKNOWN otherwise)"
          - "No open CurtailmentDispute targets this claim (ERR_CURTAILMENT_DISPUTE_OPEN otherwise) unless the open dispute's grounds == LOSS_MITIGATION_EXCUSE, which does not block settlement"
          - "expected_claim_version equals Claim.version (ERR_STALE_VERSION otherwise)"
          - "For settlement_option_kind == THIRD_PARTY_SALE: max(gross_proceeds_cents - expenses_of_sale_cents, 0) >= 85 percent of the recomputed net_claim_amount_cents (ERR_THIRD_PARTY_SALE_INSUFFICIENT otherwise)"
        side_effects:
          - "Recomputes net_claim_amount_cents, claim_deductible_cents, post_curtailment_cents, covered_claim_amount_cents, recoverable_amount_cents, net_unpaid_balance_cents, permitted_interest_cents, permitted_advances_cents from Loan and Claim state as it stands at this instant"
          - "settlement_option_kind = the named option; settlement_amount_cents = min recomputation of that option's amount"
          - "Creates a ReinsuranceCession when the loan is in an in-force treaty window and aggregate cap remains, otherwise a REJECTED cession record with the applicable rejected_reason"
          - "Loan.aggregate_ceded_cents += accepted cession's ceded_amount_cents"
          - "increments Loan.version by 1 and Claim.version by 1"

      - from: DENIED
        to: RESCINDED
        trigger: "POST /mortgage-insurance/coverage-disputes/{id}/decide with decision RESCISSION_GRANTED"
        actor: MasterPolicyAdmin
        preconditions:
          - "Loan.rescission_relief_status == NONE (ERR_RESCISSION_BARRED_RELIEF_ATTACHED otherwise)"
        side_effects:
          - "Claim.status = RESCINDED"
          - "Loan.coverage_status = CANCELLED"
          - "Loan.termination_reason = NONE"
          - "Loan.rescission_relief_status = NONE"
          - "increments Loan.version by 1 and Claim.version by 1"

      - from: SETTLED
        to: RESCINDED
        trigger: "POST /mortgage-insurance/coverage-disputes/{id}/decide with decision RESCISSION_GRANTED"
        actor: MasterPolicyAdmin
        preconditions:
          - "Loan.rescission_relief_status == NONE (ERR_RESCISSION_BARRED_RELIEF_ATTACHED otherwise)"
        side_effects:
          - "Claim.status = RESCINDED"
          - "Voids the claim's prior settlement under the settlement-reversal invariant"
          - "Loan.aggregate_ceded_cents += -(voided ReinsuranceCession.ceded_amount_cents) so the loan-level ceded total is unchanged by the reversal it undoes"
          - "increments Loan.version by 1 and Claim.version by 1"

  - entity: CurtailmentDispute
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /mortgage-insurance/coverage-disputes/{id}/begin-review"
        actor: MasterPolicyAdmin
        preconditions: []
        side_effects:
          - "increments CurtailmentDispute.version by 1"

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /mortgage-insurance/coverage-disputes/{id}/decide"
        actor: MasterPolicyAdmin
        preconditions:
          - "decision is one of UPHELD | DENIED | RESCISSION_GRANTED | RESCISSION_DENIED (ERR_DISPUTE_DECISION_INVALID otherwise)"
          - "decision == RESCISSION_GRANTED additionally requires the targeted Claim to be in DENIED or SETTLED (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "status = RESOLVED, decision and decision_utc recorded"
          - "When decision == UPHELD: re-runs claim_amount_computation on the targeted claim and adds max(0, recomputed net_claim_amount_cents - claim's frozen net_claim_amount_cents) to the targeted claim's net_claim_amount_cents"
          - "When decision == RESCISSION_GRANTED: drives the targeted Claim into RESCINDED and the loan's coverage into CANCELLED"
          - "increments CurtailmentDispute.version by 1"

  - entity: CancellationNotice
    initial_state: SUBMITTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPLIED
        trigger: "system (immediately on creation when the notice is admissible)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_cents and effective_utc are stamped"
          - "Drives the loan's coverage_status to PENDING_CANCELLATION"
          - "increments CancellationNotice.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "system (immediately on creation when the notice is inadmissible)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CancellationNotice.version by 1"

  - entity: Lender
    initial_state: ACTIVE
    terminal_states: []
    note: |
      The lender status machine is deliberately small. A lender is created ACTIVE
      and the only declared transition is the suspension a failed exposure
      reconciliation drives.
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when POST /lenders/{id}/exposure-reconciliations computes a contribution that strictly exceeds the lender's policy_exposure_cap_cents)"
        actor: system
        preconditions:
          - "the reconciliation request is otherwise well formed"
        side_effects:
          - "status = SUSPENDED"
          - "increments Lender.version by 1"

  - entity: PortfolioSnapshot
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system (when a newer snapshot is computed for the same reporting basis)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PortfolioSnapshot.version by 1"

  - entity: ReinsuranceCession
    initial_state: ACCEPTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: ACCEPTED
        to: ACCEPTED
        trigger: "POST /mortgage-insurance/claims/{id}/settle (cession synthesized on settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.aggregate_ceded_cents advanced by ceded_amount_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-settle-stale-loan-version
    parent_entity: Loan
    write_endpoint: "POST /mortgage-insurance/claims/{id}/settle"
    occ_field: "expected_loan_version"
    description: |
      Settling a claim against a loan whose version has advanced since the client
      last observed it is rejected with 412. The loan's version legitimately
      advances between claim approval and settlement — a DelinquencyReport
      landing, an amortization milestone being recorded, or a cancellation notice
      being filed each mutates the loan row — so a client that read the loan
      before any of those events holds a stale view and its settlement request is
      refused rather than applied against a superseded picture of the loan.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: exposure-reconcile-stale-loan-version
    parent_entity: Loan
    write_endpoint: "POST /mortgage-insurance/lenders/{id}/exposure-reconciliations"
    occ_field: "expected_loan_version"
    description: |
      Reconciling a lender's exposure contribution for a loan whose version has
      advanced since the client last observed it is rejected with 412. The
      exposure contribution is read off the loan row, so a loan that has since
      been amortized, cancelled or newly claimed against can no longer be
      reconciled from the client's stale snapshot of it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cession-create-stale-loan-version
    parent_entity: Loan
    write_endpoint: "POST /mortgage-insurance/reinsurance-cessions"
    occ_field: "expected_loan_version"
    description: |
      Manually recording a reinsurance cession against a loan whose version has
      advanced since the client last observed it is rejected with 412, because the
      cession is sized off the loan's ceded-to-date total and that total moved with
      the loan.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: borrower_monthly_premium
    trigger: "Loan creation (from an approved CoverageApplication), Loan cancellation, and POST /loans/{id}/amortization-milestones"
    algorithm: tiered_pricing
    formula: |
      base_upb = coverage_base_upb_cents of the loan
      annual_premium_cents = round_half_up(base_upb * rate_bps_applied / 10000)
      monthly_period_cents  = ceil(annual_premium_cents / 12)
      The borrower is billed 11 periods of monthly_period_cents followed by one
      final true-up period:
        final_true_up_cents = annual_premium_cents - (11 * monthly_period_cents)
      Rounding order is pinned: the annual amount is rounded ONCE, the periodic
      amount is derived from that rounded annual amount by ceiling division, and
      the final period absorbs the remainder. Summing twelve independently
      rounded periods, or rounding the annual amount per period, produces a
      different result and is wrong.
    input_set: "Loans with premium_plan == BPM and borrower_paid == true. LENDER_PAID loans bill 0; SPM loans are billed once through single_premium."
    constants:
      PERIODS_PER_YEAR: 12
      TRUE_UP_PERIODS: 1
    precision: "integer cents, round_half_up for the annual round then ceiling division for the period"
    variants:
      - name: per_period_rounded
        when: "the rejected alternative interpretation of the same prose"
        difference: "The true-up order is pinned in the base algorithm: the annual amount is rounded once and the twelfth period absorbs the remainder, so a base of 8500000 at 62 basis points bills eleven periods of 4392 and a final period of 4388 (total 52700). Rounding each period independently instead gives twelve periods of 4391 (total 52692, 8 cents light), and distributing the remainder differently gives twelve periods of 4391 plus a final period of 4408 (total 52700 but with a different twelfth instalment). The pinned reading is the base algorithm; neither alternative is acceptable."
      - name: lender_paid
        when: "premium_plan == LPM"
        difference: "Every period bills 0 and rate_bps_applied is forced to 0 at approval; LPM is defined by borrower_paid == false and is only admissible when the master policy supplies rate cards for it. The loan is a zero-premium loan, but its claim arithmetic is unaffected: curtailment_rate_applied still comes from the loan's underwriting path and claim_deductible_cents still comes from the loan's approval credit grade."

  - name: single_premium
    trigger: "Loan creation (from an approved CoverageApplication with premium_plan == SPM)"
    algorithm: tiered_pricing
    formula: |
      When financed_premium == true the premium is financed into the note, so the
      single premium is an annuity over the term:
        base = coverage_base_upb_cents
        single_premium_cents = ceil(base * rate_bps_applied / 10000 * TERM_MONTHS / 12 * PRESENT_VALUE_FACTOR)
      When financed_premium == false the borrower pays a one-time premium computed
      as an ordinary LPM-style single premium:
        single_premium_cents = ceil(base * rate_bps_applied / 10000)
      The loan-to-value band used for rate-card lookup is computed from
      loan_amount_cents, which already includes any financed premium, so a
      financed premium moves the loan into a higher LTV band than the same base
      mortgage would occupy with an unfinanced premium — and therefore into a
      different rate card.
    input_set: "Loans with premium_plan == SPM."
    constants:
      TERM_MONTHS: 120
      PRESENT_VALUE_FACTOR: 0.92
    precision: "integer cents, ceil"

  - name: rate_lookup
    trigger: "CoverageApplication approval (both delegated and non-delegated paths)"
    algorithm: tiered_pricing
    formula: |
      Selects the RateCard matching (master_policy_id, credit_grade, ltv_band,
      coverage_percent, premium_plan).
      ltv_band = 831_TO_85 when ltv <= 85; 851_TO_90 when 85 < ltv <= 90;
                 901_TO_95 when 90 < ltv <= 95. ltv is a percentage and the upper
                 bound of each band is inclusive while the lower bound is exclusive.
      Rejection is pinned to permit: when ltv > 95.0 the application is DECLINED
      with ERR_UNDERWRITING_DECLINED rather than approved.
      LTV = 100 * loan_amount_cents / property_value_cents. loan_amount_cents is
      the note amount as the lender reports it and already includes any financed
      single premium, so a financed premium raises the note amount and can push
      the loan into a higher LTV band; the denominator stays the appraised
      property value and is never adjusted for the premium.
    input_set: "CoverageApplications reaching an approval transition; the pinned RateCard is what the resulting Loan inherits."
    precision: "ltv computed to 4 decimal places, round_half_up; comparison is against 85.0000 / 90.0000 / 95.0000"

  - name: claim_amount_computation
    trigger: "Claim approval, claim settlement, and coverage-dispute decisions that re-run the computation"
    algorithm: constraint_propagation
    formula: |
      permitted_interest_cents  = min(accrued_interest_cents, floor(unpaid_principal_cents * 0.15))
      permitted_advances_cents  = min(allowable_advances_cents, floor(unpaid_principal_cents * 1.10))
      net_unpaid_balance_cents  = unpaid_principal_cents + permitted_interest_cents + permitted_advances_cents
      recoverable_amount_cents  = max(0, net_unpaid_balance_cents - max(0, gross_proceeds_cents - expenses_of_sale_cents))
      coverage_ceiling_cents    = loan.coverage_base_upb_cents as frozen at claim filing
      covered_claim_amount_cents = min(recoverable_amount_cents, coverage_ceiling_cents)
      curtailed_cents           = floor(covered_claim_amount_cents * curtailment_rate_applied)
      post_curtailment_cents    = covered_claim_amount_cents - curtailed_cents
      claim_deductible_cents    = floor(post_curtailment_cents * deductible_rate)
      net_claim_amount_cents    = post_curtailment_cents - claim_deductible_cents
      curtailment_rate_applied and deductible_rate are frozen on the Claim at
      approval from the loan: curtailment_rate_applied is
      (MasterPolicy.delegated_curtailment_rate when loan.underwriting_path ==
      DELEGATED else MasterPolicy.nondelagated_curtailment_rate), and
      deductible_rate is the credit_grade_deductible for
      loan.approval_credit_grade. Re-running the computation does not re-freeze
      either rate. A loan written under a LENDER_PAID plan occupies no special
      carve-out: its underwriting-path curtailment rate and its credit-grade
      deductible rate apply to its claim exactly as they would to any other loan,
      and only its rate_bps_applied (and therefore its premium) is zero.
    input_set: "Claims in APPROVED or SETTLED status, and claim arithmetic referenced by a coverage-dispute decision."
    constants:
      DEDUCTIBLE_RATE_A: 0.05
      DEDUCTIBLE_RATE_B: 0.10
      DEDUCTIBLE_RATE_C: 0.15
      DEDUCTIBLE_RATE_D: 0.20
    precision: "integer cents; floor at every multiplication, round_half_up nowhere"
    variants:
      - name: coverage_ceiling_before_curtailment
        when: "the pinned evaluation order of this scaffold"
        difference: "The ceiling is applied to the recoverable amount FIRST and the curtailment factor is then applied to the ceilinged figure. Covered 8500000, curtailment 0.40, deductible 0.10 → curtailed 3400000, post_curtailment 5100000, deductible 510000, net 4590000. Applying curtailment to the raw recoverable amount before ceilinging gives 4600800 for the same claim, an 10800-cent divergence."
      - name: ceiling_basis_origination_vs_post_validation
        when: "the loan has an ExternalReport on file"
        difference: "coverage_ceiling_before_curtailment uses loan.coverage_base_upb_cents, the original-item ceiling frozen at approvaal. The alternative basis recomputes the ceiling from the validated loan-to-value established by external_loan_data_validation. Identical inputs diverge whenever the loan's LTV variance exceeds the master policy tolerance; the original-item ceiling is the one that governs."

  - name: settlement_option_computation
    trigger: "Claim approval (seeds all four options) and claim settlement (re-prices the selected option at that instant)"
    algorithm: waterfall_allocation
    formula: |
      CASH              = net_claim_amount_cents
      DEED_IN_LIEU      = net_claim_amount_cents
      DIL               = min(coverage_ceiling_cents, max(0, net_unpaid_balance_cents - total_recoveries))
      THIRD_PARTY_SALE  = max(0, net_claim_amount_cents - floor(net_claim_amount_cents * min_third_party_net_bps / 10000))
      total_recoveries  = min(net_unpaid_balance_cents,
                              max(0, gross_proceeds_cents - expenses_of_sale_cents)
                              + round_half_up(coverage_ceiling_basis_cents * coverage_percent / 100))
      coverage_ceiling_basis_cents = loan.origination_property_value_cents when
      loan.verified_property_value_cents is null, and
      loan.verified_property_value_cents otherwise.
      THIRD_PARTY_SALE is additionally admissible only when
      max(0, gross_proceeds_cents - expenses_of_sale_cents) >= floor(0.85 *
      net_claim_amount_cents); otherwise the option is refused with
      ERR_THIRD_PARTY_SALE_INSUFFICIENT.
    input_set: "The four ClaimSettlementOption rows of a claim in APPROVED status, plus the selected option at settlement."
    constants:
      THIRD_PARTY_MIN_PROCEEDS_RATIO: 0.85
    precision: "integer cents; floor for the THIRD_PARTY_SALE adjustment, round_half_up for the coverage credit inside total_recoveries"
    variants:
      - name: dil_reinstatement_credit
        when: "settlement_option_kind == DIL"
        difference: "DIL is the only option whose amount is driven by the coverage-percent reinstatement credit rather than by the net claim amount. With net_unpaid_balance 41000000 and a 25 percent credit on a 40000000 basis, total_recoveries is 18000000 and DIL pays the full 8500000 ceiling while CASH pays 7650000 — the two options differ by 850000 cents for identical claim data."
      - name: manual_reinsurance_cessions
        when: "a ReinsuranceCession is recorded directly rather than synthesized by settlement"
        difference: "A manual cession carries its own ceded_amount_cents supplied by the caller; a synthesized cession derives it from reinsurance_cession_allocation. The two paths agree only when the caller-supplied amount equals the computed allocation."

  - name: reinsurance_cession_allocation
    trigger: "Claim settlement; ReinsuranceCession creation"
    algorithm: aggregation
    formula: |
      Applies ONLY to settlements whose option is CASH or THIRD_PARTY_SALE;
      DEED_IN_LIEU and DIL settlements create no cession.
      treaty = ReinsuranceTreaty referenced by the loan
      ceded = 0 when the treaty is absent, when the treaty is not ACTIVE, or when
              the treaty is not in force at the claim's event_completed_utc.
      in-force window: inception_utc <= claim.event_completed_utc < expiration_utc
      capacity = exhaustion_per_claim_cents - retention_per_claim_cents
      per-claim ceded = clamp(settlement_amount_cents - retention_per_claim_cents, 0, capacity)
      aggregate test: the per-claim ceded is capped so that
                      loan.aggregate_ceded_cents + per-claim ceded
                      <= treaty.aggregate_ceded_cap_cents
                      (a claim is capped, not rejected, when the aggregate would breach)
      ceded_amount_cents   = the per-claim ceded after the aggregate cap
      retained_amount_cents = settlement_amount_cents - ceded_amount_cents
    input_set: "Claim settlements with settlement_option_kind IN {CASH, THIRD_PARTY_SALE} on loans with a reinsurance_treaty_id."
    precision: "integer cents; no rounding"

  - name: cancellation_refund
    trigger: "CancellationNotice creation and Loan cancellation"
    algorithm: threshold
    formula: |
      max_refund_cents = round_half_up(10000 * (coverage_base_upb_cents - current_coverage_base_cents) / coverage_base_upb_cents)
      where current_coverage_base_cents = floor(current_upb_cents * coverage_percent / 100)
      refund_cents = max(0, min(evidence_cents, max_refund_cents))
      effective_utc = max(applied_utc, notice_utc + 30 days)
      The borrower-paid and lender-paid plans refund on the same basis, and a
      borrower-request factor of zero is not a cancellation ground: a borrower
      request that computes a zero maximum refund is REFUSED at notice creation
      with ERR_CANCELLATION_NOT_PERMITTED rather than applied with a zero refund.
    input_set: "CancellationNotices on loans with coverage_status == ACTIVE."
    constants:
      MIN_NOTICE_DAYS: 30
      FACTOR_FLOOR: 0.0
      FACTOR_CEILING: 2.5
    precision: "integer cents, round_half_up"

  - name: external_loan_data_validation
    trigger: "POST /mortgage-insurance/loans/{id}/external-reports"
    algorithm: threshold
    formula: |
      validated_ltv = round_half_up(4dp, 100 * verified_loan_amount_cents / verified_property_value_cents)
      original_ltv  = 100 * loan_amount_cents / origination_property_value_cents
      ltv_variance_fraction = (validated_ltv - original_ltv) / original_ltv
      ltv_variance_exceeds_tolerance = ltv_variance_fraction > master_policy.ltv_variance_tolerance
      occupancy_materially_differs = occupancy_reported == INVESTMENT
      value_reset_pathway_present = post_origination_value_cents > origination_property_value_cents
      rescission_relief_eligibility_review:
        PERSISTS when ltv_variance_exceeds_tolerance == false
        and not (occupancy_materially_differs and value_reset_pathway_present)
      PERMITTED_RESCISSION is returned otherwise. The two clauses are conjunctive
      within the single PERSISTS condition above; the outcome is PERMITTED_RESCISSION
      whenever that condition does not hold.
    input_set: "Loans receiving an ExternalReport; results feed Loan.verified_property_value_cents and the rescission-relief determination."
    constants:
      OCCUPANCY_MISREPRESENTATION_REVIEW: true
    precision: "ltv to 4 decimal places round_half_up; variance comparison is strict > against the tolerance"
    variants:
      - name: persist_vs_permit_ordering
        when: "the independent validation report carries both a material occupancy change and a value reset"
        difference: "PERSISTS is returned whenever the loan-to-value variance stays inside the master policy tolerance, and PERMITTED_RESCISSION only when it does not. Two loans with identical occupancy and post-origination value evidence therefore diverge solely on whether the validated loan-to-value moved by more than the tolerance: at a 0.05 tolerance a validated loan-to-value of 87.0588 against an original 85.0000 gives a 0.024221 variance and PERSISTS, while 92.0000 against 85.0000 gives 0.082353 and PERMITTED_RESCISSION."

  - name: rescission_relief_eligibility
    trigger: "Any DelinquencyReport, any anniversary boundary crossing, and POST /loans/{id}/rescission-relief"
    algorithm: chronological
    formula: |
      For each DelinquencyReport the DELINQUENCY CYCLE is the 365-day window ending
      at that report's effective_utc: (effective_utc - 365 days, effective_utc].
      A cycle is free of delinquency when it contains no Class-A DelinquencyReport
      other than the one that defines the window (a Class-A report reporting no
      past-due amount is therefore its own lone Class-A report and its cycle is
      deemed free of delinquency). A cycle containing any ADDITIONAL Class-A report
      is not free.
      Cycle index = the count of consecutive free cycles walking the loan's
      Class-A reports newest first, stopping at the first report whose cycle is
      not free.
      Rule 1 (provisional relief): rescission_relief_status becomes PROVISIONAL
      when cycle_index >= 1.
      Rule 2 (guaranteed relief): rescission_relief_status becomes GUARANTEED when
      cycle_index >= master_policy.rescission_relief_cycles AND
      master_policy.two_year_effective_flag == true AND every one of the
      consecutive free cycles counted by cycle_index has its defining
      effective_utc within (master_policy.anniversary_utc,
      master_policy.anniversary_utc + 730 days].
      Otherwise rescission_relief_status is NONE. GUARANTEED is absorbing: once
      attached it never returns to PROVISIONAL or NONE, and it bars any
      RESCISSION_GRANTED decision.
    input_set: "Loans with an in-force or cancelled coverage_status; the status also gates the RESCISSION_GRANTED dispute decision."
    constants:
      RULE_2_WINDOW_DAYS: 730
      CYCLE_DAYS: 365
    precision: "no rounding; the status is a discrete value"

  - name: claim_eligibility_gate
    trigger: "Claim approval and POST /delinquency-reports (which sets the flag it reads)"
    algorithm: set_membership
    formula: |
      applicable_standard =
        max(master_policy.servicer_loss_mitigation_standard, servicer.tier_standard)
      where servicer.tier_standard is PARTICIPATION for TIER_1 and TIER_2 and
      PARTICIPATION_COMPLETE for TIER_3.
      ranking = [OUTREACH_SENT=1, INTAKE_COMPLETE=2, EVALUATION_COMPLETE=3, PROGRAM_ACCEPTED=4] and
      COLLATERAL_SALE_LISTING satisfies the PARTICIPATION standard on its own.
      participation_standard_met = the set of completed activity_kind values in the
      report contains every activity_kind required by applicable_standard.
      For a Class-A report with participation_standard_met == false,
      loan.claim_blocked is set true and loan.last_loss_mitigation_deficient_utc is
      set to the report's effective_utc. loan.claim_blocked is never cleared by a
      later report; it is cleared only by an explicit
      POST /loans/{id}/rescission-relief waiver, which requires
      master_policy.servicer_loss_mitigation_standard == PARTICIPATION.
      A loan whose claim_blocked == true is refused at claim approval with
      ERR_CLAIM_BLOCKED_LOSS_MITIGATION.
    input_set: "DelinquencyReports with delinquency_class == A; the gate reads only Class-A reports."
    constants:
      PARTICIPATION_REQUIRED: ["OUTREACH_SENT", "INTAKE_COMPLETE"]
      PARTICIPATION_COMPLETE_REQUIRED: ["OUTREACH_SENT", "INTAKE_COMPLETE", "EVALUATION_COMPLETE", "PROGRAM_ACCEPTED"]
    precision: "none; discrete"

  - name: delinquency_streak
    trigger: "Every DelinquencyReport creation"
    algorithm: chronological
    formula: |
      Consider the loan's DelinquencyReports ordered by (effective_utc DESC,
      created_at ASC, id ASC) — newest first. The streak is the number of
      Class-A reports encountered from the front of that order before the first
      Class-B report is reached; a Class-B report ends the streak. Reports with
      the same effective_utc are ordered by created_at ascending, and a tie in
      created_at is broken by id ascending for stability only.
    input_set: "All DelinquencyReports of the loan, every class."
    precision: "integer count"

  - name: coverage_termination_evaluation
    trigger: "Loan creation, POST /loans/{id}/amortization-milestones, DelinquencyReport creation, CancellationNotice creation and expiry, and POST /loans/{id}/rescission-relief"
    algorithm: threshold
    formula: |
      Evaluate every termination trigger and take the EARLIEST effective instant:
        LTV_MILESTONE: when amortization_status == AT_78, effective at
          max(current logical clock, milestone_78_reached_utc + 30 days)
        SERVICER_LOSS_MITIGATION_FAILURE: when claim_blocked == true and
          delinquency_streak >= 3, effective at
          last_loss_mitigation_deficient_utc + 60 days
        BORROWER_REQUEST: from an applied CancellationNotice, effective at
          max(applied_utc, notice_utc + 30 days)
      Coverage ends at the earliest instant across all satisfied triggers, and
      termination_reason is the label of that trigger. Ties between two triggers
      at the same instant are resolved in the fixed label order LTV_MILESTONE >
      SERVICER_LOSS_MITIGATION_FAILURE > BORROWER_REQUEST. A lender exposure-cap
      breach is NOT a coverage-termination trigger: it affects the lender's own
      status only.
    input_set: "Loans whose coverage_status is ACTIVE or PENDING_CANCELLATION."
    constants:
      MILESTONE_MIN_DAYS: 30
      DEFICIENCY_MIN_DAYS: 60
    precision: "instants compared at second resolution"

  - name: lender_exposure_reconciliation
    trigger: "POST /lenders/{id}/exposure-reconciliations"
    algorithm: aggregation
    formula: |
      contribution(loan) = loan.aggregate_ceded_cents +
        round_half_up(loan.coverage_base_upb_cents * master_policy.exposure_contribution_rate)
      contribution_rate = MasterPolicy.exposure_contribution_rate; the canonical fixture policy carries 0.35 so a 8500000-cent coverage base contributes 2975000 cents, and a policy carrying 1.0 contributes its whole coverage base of the loan's
        master policy; every loan in this scaffold's fixtures sits under MP-1001,
        whose rate is 1.0, so a loan's contribution equals its coverage base.
      lender_contribution_cents = round_half_up(sum of contribution(loan) over the
        lender's loans whose coverage_status IN {ACTIVE, PENDING_CANCELLATION})
      used_pct = round_half_up(4dp, 100 * lender_contribution_cents /
        lender.policy_exposure_cap_cents)
      The endpoint is rejected with ERR_LENDER_EXPOSURE_CAP_EXCEEDED when
      lender_contribution_cents > lender.policy_exposure_cap_cents (strictly
      greater; equality is permitted), and the reconciliation records a
      post-reconciliation warn flag otherwise when used_pct >= 80.
    input_set: "Loans whose coverage_status IN {ACTIVE, PENDING_CANCELLATION}; CANCELLED loans contribute nothing."
    constants:
      WARN_THRESHOLD_PCT: 80
    precision: "integer cents; used_pct to 4 decimal places round_half_up"

  - name: portfolio_concentration
    trigger: "POST /portfolio-snapshots"
    algorithm: aggregation
    formula: |
      in-force loans = loans whose coverage_status IN {ACTIVE, PENDING_CANCELLATION}
      sum_geography(county_code) = sum of coverage_base_upb_cents of in-force loans
        in that county
      county_code is the loan's 5-digit FIPS county, carried on the coverage
        application's property record and denormalized onto the loan.
      segment_status(county) = BREACHED when
        sum_geography(county) >= snapshot.cluster_in_force_threshold_cents,
        WITHIN_LIMITS otherwise (the comparison is inclusive at the threshold)
      One segment is emitted per county present in the in-force book. Segment
      ordering is by sum_geography DESC, then county_code ASC.
      lender_concentration_index = round_half_up(4dp, max over lenders of
        (lender's aggregate in-force coverage base) / (whole-book aggregate
        coverage base)); null when the in-force book is empty.
      aggregate_ceded_cents = sum of loan.aggregate_ceded_cents across in-force
        loans.
    input_set: "Loans whose coverage_status IN {ACTIVE, PENDING_CANCELLATION}; the empty book yields lender_concentration_index null and zero segments."
    precision: "integer cents; index to 4 decimal places round_half_up"

  - name: premium_schedule_invariant
    trigger: "Loan creation, Loan cancellation, CancellationNotice application"
    algorithm: aggregation
    formula: |
      For a BPM loan whose annual premium is A = round_half_up(base_upb *
      rate_bps_applied / 10000), the premium schedule holds 12 periods and the
      invariant below MUST hold before and after any cancellation:
        sum(PAID period amounts) + sum(BILLED period amounts) + sum(VOIDED period amounts) == A
      plus, in ALL cases:
        sum(BILLED period amounts) + sum(VOIDED period amounts) == A
      A cancellation moves periods from BILLED to VOIDED, so the first sum is
      unchanged and the second sum still equals A. A cancellation that reduces
      the schedule's total below A has drifted.
    input_set: "BPM loans; the 52700-cent schedule of a base 8500000 loan at 62 bps is the canonical fixture."
    precision: "integer cents"

  - name: settlement_reversal_invariant
    trigger: "POST /coverage-disputes/{id}/decide with decision RESCISSION_GRANTED targeting a SETTLED claim"
    algorithm: aggregation
    formula: |
      Reversing a settlement MUST leave Loan.aggregate_ceded_cents where it was
      before the settlement, and MUST leave lender exposure contributions where
      they were before the settlement:
        after reversal: loan.aggregate_ceded_cents == pre-settlement aggregate_ceded_cents
        after reversal: lender_exposure_reconciliation(lender_id) contribution ==
                        the same value it held before any claim on the loan settled
      The reversal therefore voids the previously accepted ReinsuranceCession and
      subtracts exactly the ceded amount that settlement had added.
    input_set: "SETTLED claims targeted by a RESCISSION_GRANTED decision."
    precision: "integer cents; exact equality"

  - name: annual_premium_interest
    trigger: "Loan creation when the loan sits under a master policy whose premium_plan is charged annually"
    algorithm: threshold
    formula: |
      Simple interest on the annual premium at the master policy's rate, applied
      on the whole annual amount:
        annual_premium_interest_cents = round_half_up(A * MASTER_POLICY_PREMIUM_INTEREST_RATE)
      The rate is a master-policy constant, not a loan field; the scaffold pins
      0.0450 for MP-1001 so a 52700-cent annual premium accrues 2372 cents.
    input_set: "BPM loans only."
    constants:
      MASTER_POLICY_PREMIUM_INTEREST_RATE: 0.0450
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced-resource ids supplied in the request body exist and belong to the resource named alongside them"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints that take a foreign key in the body"

  - priority: 4
    category: existence
    check: "Entity-specific 404 for the subject of the path segment"
    error_id: "ERR_LENDER_NOT_FOUND / ERR_SERVICER_NOT_FOUND / ERR_MASTER_POLICY_NOT_FOUND / ERR_RATE_CARD_NOT_FOUND / ERR_TREATY_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_LOAN_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_NOTICE_NOT_FOUND / ERR_SNAPSHOT_NOT_FOUND"
    http_status: 404
    applies_to: "the entity's own single-resource and action endpoints"

  - priority: 5
    category: state
    check: "Subject entity is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Underwriting path declared on the application matches the endpoint invoked — delegated authority may not use the non-delegated path and vice versa"
    error_id: ERR_PATH_MISMATCH
    http_status: 409
    applies_to: "POST /coverage-applications/{id}/underwrite and POST /coverage-applications/{id}/delegated-approve"

  - priority: 8
    category: business_safety
    check: "Rescission relief guarantee has not attached — a GUARANTEED relief status bars any RESCISSION_GRANTED decision"
    error_id: ERR_RESCISSION_BARRED_RELIEF_ATTACHED
    http_status: 409
    applies_to: "POST /coverage-disputes/{id}/decide (RESCISSION_GRANTED), POST /claims/{id}/rescind"

  - priority: 9
    category: business_safety
    check: "Timeout bar — a claim filed later than the loan's term in months after the title-transferring event is barred"
    error_id: ERR_CLAIM_TIME_BARRED
    http_status: 409
    applies_to: "POST /claims/{id}/begin-review"

  - priority: 10
    category: business_safety
    check: "Loss-mitigation gate — a loan whose last Class-A delinquency report failed the applicable participation standard blocks claim approval"
    error_id: ERR_CLAIM_BLOCKED_LOSS_MITIGATION
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Lender aggregate exposure cap — reconciliation is refused when the lender's contribution strictly exceeds its cap"
    error_id: ERR_LENDER_EXPOSURE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /lenders/{id}/exposure-reconciliations"

  - priority: 12
    category: business_constraint
    check: "Rate card eligibility — the pinned RateCard must share the application's master policy, must price the application's coverage percentage, and must price the application's premium plan"
    error_id: "ERR_RATE_CARD_MISMATCH / ERR_RATE_CARD_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "POST /coverage-applications/{id}/approve, POST /coverage-applications/{id}/delegated-approve"

  - priority: 13
    category: business_constraint
    check: "Coverage application declined at underwriting — loan-to-value above 95.0 percent, or a coverage percentage outside the master policy's allowed set"
    error_id: ERR_UNDERWRITING_DECLINED
    http_status: 422
    applies_to: "POST /coverage-applications/{id}/approve, POST /coverage-applications/{id}/delegated-approve, POST /coverage-applications/{id}/decline"

  - priority: 14
    category: business_constraint
    check: "Cancellation admissibility — SERVICER_LOSS_MITIGATION_FAILURE requires the loan's claim_blocked flag, and the evidence amount must reach the computed maximum refund"
    error_id: "ERR_CANCELLATION_NOT_PERMITTED / ERR_INSUFFICIENT_EVIDENCE"
    http_status: 409
    applies_to: "POST /loans/{id}/cancellation-notices"

  - priority: 15
    category: business_constraint
    check: "Loss-mitigation waiver gate — clearing claim_blocked requires the master policy's standard to be PARTICIPATION and an ATTACHED evidence code"
    error_id: ERR_WAIVER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /loans/{id}/rescission-relief with waiver"

  - priority: 16
    category: business_temporal
    check: "Coverage must have been in force at the claim's event instant"
    error_id: "ERR_COVERAGE_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 17
    category: business_referential
    check: "Only one open curtailment dispute may target a claim, and a non-LOSS_MITIGATION_EXCUSE open dispute blocks settlement"
    error_id: "ERR_DUPLICATE_OPEN_DISPUTE / ERR_CURTAILMENT_DISPUTE_OPEN"
    http_status: 409
    applies_to: "POST /coverage-disputes, POST /claims/{id}/settle"

  - priority: 18
    category: business_referential
    check: "Settlement option must name one of the claim's four priced options, and a THIRD_PARTY_SALE option must clear its proceeds floor"
    error_id: "ERR_SETTLEMENT_OPTION_UNKNOWN / ERR_THIRD_PARTY_SALE_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /claims/{id}/settle"

  - priority: 19
    category: business_referential
    check: "Reinsurance treaty must be ACTIVE and in force at the claim's event instant for a synthesized cession to be ACCEPTED (ERR_TREATY_NOT_IN_FORCE); a manually recorded cession whose requested amount exceeds the treaty's remaining aggregate capacity is rejected (ERR_TREATY_CAP_EXHAUSTED), while a synthesized cession is capped instead"
    http_status: 409
    applies_to: "POST /claims/{id}/settle, POST /reinsurance-cessions"

  - priority: 20
    category: state
    check: "Optimistic-concurrency version must match the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/settle, POST /lenders/{id}/exposure-reconciliations, POST /reinsurance-cessions"

  - priority: 21
    category: business_constraint
    check: "Amortization milestone not yet reached — the loan's current balance exceeds the 80 percent milestone"
    error_id: ERR_MILESTONE_NOT_REACHED
    http_status: 409
    applies_to: "POST /loans/{id}/amortization-milestones"

  - priority: 22
    category: business_constraint
    check: "Duplicate delinquency period for the same loan"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /delinquency-reports"

  - priority: 23
    category: business_constraint
    check: "Reporting servicer is not ACTIVE, or is not the loan's designated servicer"
    error_id: "ERR_SERVICER_INACTIVE / ERR_SERVICER_NOT_DESIGNATED"
    http_status: 409
    applies_to: "POST /delinquency-reports"

  - priority: 24
    category: business_constraint
    check: "Request body shape — required fields present, non-negative monetary amounts, event instant not in the future"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/mortgage-insurance/_clock/set_current_utc"
    description: "Set the server's logical clock. Default startup time is 2026-09-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time. Every temporal rule in this scaffold (event instants, cancellation effective dates, anniversary cycles, treaty windows) evaluates against the logical clock."
    roles: [MasterPolicyAdmin]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock moves to current_utc; may fire due system transitions"]

  # --- MasterPolicy ---
  - method: POST
    path: "/mortgage-insurance/master-policies"
    description: "Create a master policy"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["policy_number", "anniversary_utc", "coverage_percent_default?", "delegated_curtailment_rate", "nondelagated_curtailment_rate", "ltv_variance_tolerance", "servicer_loss_mitigation_standard", "rescission_relief_cycles", "min_third_party_net_bps", "two_year_effective_flag", "exposure_contribution_rate"]
    output: MasterPolicy
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/master-policies"
    description: "List master policies"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MasterPolicy[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/master-policies/{id}"
    description: "Get a master policy"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: MasterPolicy
    side_effects: []

  # --- RateCard ---
  - method: POST
    path: "/mortgage-insurance/rate-cards"
    description: "Create a rate card under a master policy"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["master_policy_id", "credit_grade", "ltv_band", "coverage_percent", "premium_plan", "rate_bps", "min_borrower_reserves_months?"]
    output: RateCard
    side_effects: ["version = 1"]

  - method: GET
    path: "/mortgage-insurance/rate-cards"
    description: "List rate cards, optionally filtered by owning master policy"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: ["master_policy_id?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/rate-cards/{id}"
    description: "Get a rate card"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  # --- ReinsuranceTreaty ---
  - method: POST
    path: "/mortgage-insurance/reinsurance-treaties"
    description: "Create a reinsurance treaty"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["treaty_number", "inception_utc", "expiration_utc", "retention_per_claim_cents", "exhaustion_per_claim_cents", "aggregate_ceded_cap_cents"]
    output: ReinsuranceTreaty
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/reinsurance-treaties"
    description: "List reinsurance treaties"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReinsuranceTreaty[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/reinsurance-treaties/{id}"
    description: "Get a reinsurance treaty"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/reinsurance-treaties/{id}/cancel"
    description: "Cancel a reinsurance treaty"
    roles: [MasterPolicyAdmin]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: ["status = CANCELLED", "increments ReinsuranceTreaty.version by 1"]

  # --- Servicer ---
  - method: POST
    path: "/mortgage-insurance/servicers"
    description: "Create a servicer"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["servicer_name", "tier", "loss_mitigation_capability"]
    output: Servicer
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/servicers"
    description: "List servicers"
    roles: [MasterPolicyAdmin, Underwriter, Servicer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Servicer[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/servicers/{id}"
    description: "Get a servicer"
    roles: [MasterPolicyAdmin, Underwriter, Servicer]
    code: 200
    input: []
    output: Servicer
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/servicers/{id}/suspend"
    description: "Suspend a servicer"
    roles: [MasterPolicyAdmin]
    code: 200
    input: []
    output: Servicer
    side_effects: ["status = SUSPENDED", "increments Servicer.version by 1"]

  # --- Lender ---
  - method: POST
    path: "/mortgage-insurance/lenders"
    description: "Create a lender"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["lender_name", "delegated_underwriting", "policy_exposure_cap_cents"]
    output: Lender
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/lenders"
    description: "List lenders"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lender[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/lenders/{id}"
    description: "Get a lender"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: Lender
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/lenders/{id}/exposure-reconciliations"
    description: "Reconcile a lender's aggregate in-force exposure contribution against its policy cap. Refused when the computed contribution strictly exceeds the cap; records a warn flag when utilisation reaches the warn threshold."
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: ["expected_loan_version", "loan_id"]
    output: "{ lender_id: string, lender_contribution_cents: integer, used_pct: number, warn: boolean }"
    side_effects:
      - "Stamps the reconciled loan as reconciled-at the current logical clock"
      - "increments Loan.version by 1"
      - "ERR_LENDER_EXPOSURE_CAP_EXCEEDED when contribution strictly exceeds the cap"
      - "On a breach that error is returned AND Lender.status becomes SUSPENDED"
      - "Expected values pin the implementation: for the canonical two-loan fixture below the response is lender_contribution_cents 17000000, used_pct 14.1667, warn false"

  # --- CoverageApplication ---
  - method: POST
    path: "/mortgage-insurance/coverage-applications"
    description: "Submit a coverage application. Borrowers may not submit: a caller whose role is Borrower is refused."
    roles: [Lender]
    code: 201
    input: ["lender_id", "master_policy_id", "rate_card_id", "borrower_reference", "loan_amount_cents", "property_value_cents", "credit_grade", "coverage_percent", "premium_plan", "borrower_paid", "financed_premium", "borrower_reserves_months?", "county_code", "term_months"]
    output: CoverageApplication
    side_effects: ["status = SUBMITTED", "submitted_utc = logical clock", "resubmission_count = 0", "underwriting_path = NON_DELEGATED (a placeholder value only — the path is definitively assigned by whichever underwriting transition the application takes, and delegated-approve overwrites it with DELEGATED)"]

  - method: GET
    path: "/mortgage-insurance/coverage-applications"
    description: "List coverage applications, optionally filtered by lender"
    roles: [Lender, Underwriter, MasterPolicyAdmin]
    code: 200
    input: ["lender_id?", "master_policy_id?", "rate_card_id?", "status?", "limit?", "offset?"]
    output: CoverageApplication[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/coverage-applications/{id}"
    description: "Get a coverage application"
    roles: [Lender, Underwriter, MasterPolicyAdmin]
    code: 200
    input: []
    output: CoverageApplication
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/underwrite"
    description: "Take a submitted application into non-delegated underwriting"
    roles: [Underwriter]
    code: 200
    input: []
    output: CoverageApplication
    side_effects: ["status = IN_UNDERWRITING", "underwriting_path = NON_DELEGATED", "underwritten_utc = logical clock", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/delegated-approve"
    description: "Approve a submitted application on the lender's delegated authority, skipping the underwriter review step entirely"
    roles: [Lender]
    code: 200
    input: []
    output: CoverageApplication
    side_effects: ["status = APPROVED", "underwriting_path = DELEGATED", "approved_coverage_percent = coverage_percent", "rate_bps_applied = pinned RateCard.rate_bps", "coverage_base_upb_cents = floor(loan_amount_cents * coverage_percent / 100)", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/request-info"
    description: "Return an application to the lender for borrower information"
    roles: [Underwriter]
    code: 200
    input: ["info_requested"]
    output: CoverageApplication
    side_effects: ["status = INFO_REQUESTED", "resubmission_count += 1", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/submit-info"
    description: "Lender supplies the requested borrower information and the application returns to underwriting"
    roles: [Lender]
    code: 200
    input: ["borrower_reserves_months?"]
    output: CoverageApplication
    side_effects: ["status = IN_UNDERWRITING", "underwriting_path = NON_DELEGATED", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/approve"
    description: "Approve an underwritten application, applying the reserves reduction and coverage-step-down rules"
    roles: [Underwriter]
    code: 200
    input: []
    output: CoverageApplication
    side_effects: ["status = APPROVED", "approved_coverage_percent = effective coverage percentage", "rate_bps_applied = pinned RateCard.rate_bps", "coverage_base_upb_cents = floor(loan_amount_cents * approved_coverage_percent / 100)", "underwritten_utc = logical clock", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/decline"
    description: "Decline an underwritten application"
    roles: [Underwriter]
    code: 200
    input: ["decline_reason"]
    output: CoverageApplication
    side_effects: ["status = DECLINED", "increments CoverageApplication.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-applications/{id}/withdraw"
    description: "Lender withdraws an application"
    roles: [Lender]
    code: 200
    input: []
    output: CoverageApplication
    side_effects: ["status = WITHDRAWN", "increments CoverageApplication.version by 1"]

  # --- Loan ---
  - method: POST
    path: "/mortgage-insurance/loans"
    description: "Issue coverage by creating a loan from an approved application"
    roles: [MasterPolicyAdmin]
    code: 201
    input: ["application_id", "servicer_id", "reinsurance_treaty_id"]
    output: Loan
    side_effects: ["coverage_status = ACTIVE, amortization_status = IN_AMORTIZATION, termination_reason = NONE", "inherits coverage_percent, premium_plan, borrower_paid, underwriting_path, rate_bps_applied, coverage_base_upb_cents, credit_grade, approval_credit_grade, master_policy_id, lender_id, county_code, term_months from the approved application", "current_upb_cents = the application's loan_amount_cents", "current_coverage_base_cents = floor(current_upb_cents * coverage_percent / 100)", "annual_premium_cents, monthly_period_cents and final_period_cents computed by borrower_monthly_premium", "claim_blocked = false", "aggregate_ceded_cents = 0", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/loans"
    description: "List loans, optionally filtered by lender, servicer, master policy or coverage status"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: ["lender_id?", "servicer_id?", "master_policy_id?", "reinsurance_treaty_id?", "application_id?", "coverage_status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/loans/{id}"
    description: "Get a loan"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/loans/{id}/amortization-milestones"
    description: "Record an amortization milestone against the loan's current balance"
    roles: [MasterPolicyAdmin, Servicer]
    code: 200
    input: ["current_upb_cents"]
    output: Loan
    side_effects: ["amortization_status advances monotonically", "milestone_78_reached_utc stamped on first entry to AT_78", "may auto-transition coverage_status to PENDING_CANCELLATION", "increments Loan.version by 1"]

  - method: POST
    path: "/mortgage-insurance/loans/{id}/rescission-relief"
    description: "Record the master policy's rescission-relief standing for the loan: relief_status ATTACHED records that the master insurer has attached its relief guarantee, and relief_status REVOKED clears the loan's claim_blocked waiver flag under the §1.4 priority-15 gate"
    roles: [MasterPolicyAdmin]
    code: 200
    input: ["relief_status", "waiver_evidence_code?"]
    output: Loan
    side_effects: ["relief_status == ATTACHED records the master insurer's attached relief against the loan", "relief_status == REVOKED clears claim_blocked when the master policy's standard is PARTICIPATION and an ATTACHED evidence code is supplied", "increments Loan.version by 1"]

  - method: POST
    path: "/mortgage-insurance/loans/{id}/cancellation-notices"
    description: "File a cancellation notice against the loan's coverage"
    roles: [Lender, Servicer]
    code: 201
    input: ["request_kind", "requested_by_role", "notice_utc", "evidence_cents?", "applied_utc"]
    output: CancellationNotice
    side_effects: ["CancellationNotice created and stamped with refund_cents, effective_utc", "Loan.coverage_status = PENDING_CANCELLATION", "increments Loan.version by 1"]

  - method: GET
    path: "/mortgage-insurance/loans/{id}/cancellation-notices"
    description: "List a loan's cancellation notices"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: CancellationNotice[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/loans/{id}/delinquency-reports"
    description: "List a loan's delinquency reports"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: DelinquencyReport[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/loans/{id}/claims"
    description: "List a loan's claims"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/loans/{id}/external-reports"
    description: "List a loan's independent-validation reports"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: ExternalReport[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/loans/{id}/coverage-disputes"
    description: "List a loan's curtailment and rescission disputes"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: CurtailmentDispute[]
    side_effects: []

  # --- ExternalReport ---
  - method: POST
    path: "/mortgage-insurance/loans/{id}/external-reports"
    description: "Submit an independent validation report for the loan's origination data"
    roles: [Underwriter, MasterPolicyAdmin]
    code: 201
    input: ["verified_loan_amount_cents", "verified_property_value_cents", "post_origination_value_cents?", "occupancy_reported", "independent_validation_completed_utc"]
    output: ExternalReport
    side_effects: ["validated_ltv and occupancy_materially_differs computed", "Loan.verified_property_value_cents and Loan.verified_loan_amount_cents updated", "recomputes the rescission-relief review outcome", "increments Loan.version by 1"]

  - method: GET
    path: "/mortgage-insurance/external-reports/{id}"
    description: "Get an independent validation report"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: ExternalReport
    side_effects: []

  # --- DelinquencyReport ---
  - method: POST
    path: "/mortgage-insurance/delinquency-reports"
    description: "File a monthly delinquency report for a loan"
    roles: [Servicer]
    code: 201
    input: ["loan_id", "servicer_id", "as_of_period", "delinquency_class", "months_delinquent", "loss_mitigation_activities"]
    output: DelinquencyReport
    side_effects: ["effective_utc = as_of_period fifth day", "participation_standard_met computed", "Loan.delinquency_streak recomputed", "Loan.claim_blocked and last_loss_mitigation_deficient_utc set on Class-A deficiency", "Loan.rescission_relief_status recomputed", "may auto-cancel the loan's coverage", "increments Loan.version by 1"]

  - method: GET
    path: "/mortgage-insurance/delinquency-reports"
    description: "List delinquency reports, optionally filtered by loan or servicer"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: ["loan_id?", "servicer_id?", "limit?", "offset?"]
    output: DelinquencyReport[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/delinquency-reports/{id}"
    description: "Get a delinquency report"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: DelinquencyReport
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/mortgage-insurance/claims"
    description: "File a claim against a loan after foreclosure, short sale or deed in lieu"
    roles: [Lender]
    code: 201
    input: ["loan_id", "event_kind", "event_completed_utc", "unpaid_principal_cents", "accrued_interest_cents", "allowable_advances_cents", "gross_proceeds_cents", "expenses_of_sale_cents"]
    output: Claim
    side_effects: ["status = FILED", "filed_utc = logical clock", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/claims"
    description: "List claims, optionally filtered by loan or status"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/claims/{id}"
    description: "Get a claim"
    roles: [MasterPolicyAdmin, Underwriter, Lender, Servicer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/claims/{id}/begin-review"
    description: "Take a filed claim into review"
    roles: [Underwriter]
    code: 200
    input: []
    output: Claim
    side_effects: ["status = UNDER_REVIEW", "increments Claim.version by 1"]

  - method: POST
    path: "/mortgage-insurance/claims/{id}/approve"
    description: "Approve a claim, freezing the curtailment and deductible rates and computing the full claim arithmetic and the four settlement options"
    roles: [Underwriter]
    code: 200
    input: []
    output: Claim
    side_effects: ["status = APPROVED", "curtailment_rate_applied frozen from the loan's underwriting path", "all claim arithmetic fields computed", "four ClaimSettlementOption rows created", "increments Claim.version by 1"]

  - method: POST
    path: "/mortgage-insurance/claims/{id}/deny"
    description: "Deny a claim, leaving it re-openable by reconsideration"
    roles: [Underwriter]
    code: 200
    input: ["denial_reason"]
    output: Claim
    side_effects: ["status = DENIED", "increments Claim.version by 1"]

  - method: POST
    path: "/mortgage-insurance/claims/{id}/reconsideration"
    description: "Lender asks for a denied or under-review claim to be reconsidered; the claim returns to the filed queue"
    roles: [Lender]
    code: 200
    input: ["reason", "additional_documentation?"]
    output: Claim
    side_effects: ["status = FILED", "increments Claim.version by 1"]

  - method: POST
    path: "/mortgage-insurance/claims/{id}/settle"
    description: "Settle an approved claim under one of its four priced options, recomputing the claim arithmetic and synthesizing the reinsurance cession"
    roles: [Lender]
    code: 200
    input: ["settlement_option_kind", "expected_claim_version", "expected_loan_version"]
    output: Claim
    side_effects: ["all claim arithmetic fields recomputed at this instant", "settlement_option_kind and settlement_amount_cents set", "status = SETTLED", "ReinsuranceCession created — ACCEPTED when the loan sits in an in-force ACTIVE treaty window at the event instant, capped by the treaty's remaining aggregate capacity; REJECTED with a reason otherwise", "Loan.aggregate_ceded_cents advanced on an accepted cession", "increments Claim.version by 1", "increments Loan.version by 1"]

  - method: GET
    path: "/mortgage-insurance/claims/{id}/settlement-options"
    description: "List the four priced settlement options of a claim"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: ClaimSettlementOption[]
    side_effects: []

  # --- CurtailmentDispute ---
  - method: POST
    path: "/mortgage-insurance/coverage-disputes"
    description: "File a curtailment or rescission dispute over a claim's origination data"
    roles: [Lender]
    code: 201
    input: ["loan_id", "lender_id", "target_claim_id", "grounds", "asserted_coverage_percent"]
    output: CurtailmentDispute
    side_effects: ["status = OPEN", "filed_utc = logical clock", "version = 1"]

  - method: GET
    path: "/mortgage-insurance/coverage-disputes"
    description: "List coverage disputes, optionally filtered by loan or status"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: ["loan_id?", "lender_id?", "target_claim_id?", "status?", "limit?", "offset?"]
    output: CurtailmentDispute[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/coverage-disputes/{id}"
    description: "Get a coverage dispute"
    roles: [MasterPolicyAdmin, Underwriter, Lender]
    code: 200
    input: []
    output: CurtailmentDispute
    side_effects: []

  - method: POST
    path: "/mortgage-insurance/coverage-disputes/{id}/begin-review"
    description: "Take an open dispute into review"
    roles: [MasterPolicyAdmin]
    code: 200
    input: []
    output: CurtailmentDispute
    side_effects: ["status = UNDER_REVIEW", "increments CurtailmentDispute.version by 1"]

  - method: POST
    path: "/mortgage-insurance/coverage-disputes/{id}/decide"
    description: "Record the master insurer's decision on a dispute"
    roles: [MasterPolicyAdmin]
    code: 200
    input: ["decision", "decision_reason"]
    output: CurtailmentDispute
    side_effects: ["status = RESOLVED", "UPHELD re-runs claim_amount_computation and raises the targeted claim's net amount", "RESCISSION_GRANTED drives the targeted claim into RESCINDED and the loan's coverage into CANCELLED", "increments CurtailmentDispute.version by 1"]

  # --- ReinsuranceCession ---
  - method: POST
    path: "/mortgage-insurance/reinsurance-cessions"
    description: "Record a reinsurance cession against a claim directly, rather than letting settlement synthesize it"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 201
    input: ["claim_id", "ceded_amount_cents", "expected_loan_version"]
    output: ReinsuranceCession
    side_effects: ["Cession created with status ACCEPTED, or REJECTED when the treaty is absent, not ACTIVE, outside its in-force window, or has insufficient remaining aggregate capacity", "ERR_TREATY_CAP_EXHAUSTED when the requested ceded amount exceeds the treaty's remaining aggregate capacity", "Loan.aggregate_ceded_cents advanced on an accepted cession", "increments Loan.version by 1"]

  - method: GET
    path: "/mortgage-insurance/reinsurance-cessions"
    description: "List reinsurance cessions, optionally filtered by claim or loan"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: ["claim_id?", "loan_id?", "treaty_id?", "status?", "limit?", "offset?"]
    output: ReinsuranceCession[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/reinsurance-cessions/{id}"
    description: "Get a reinsurance cession"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: []
    output: ReinsuranceCession
    side_effects: []

  # --- PortfolioSnapshot ---
  - method: POST
    path: "/mortgage-insurance/portfolio-snapshots"
    description: "Compute a portfolio risk-concentration snapshot over the in-force book"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 201
    input: ["snapshot_utc", "cluster_in_force_threshold_cents"]
    output: PortfolioSnapshot
    side_effects: ["segment_statuses, geography_totals, lender_concentration_index and aggregate_ceded_cents computed", "status = COMPUTED", "previously computed snapshots become SUPERSEDED"]

  - method: GET
    path: "/mortgage-insurance/portfolio-snapshots"
    description: "List portfolio snapshots"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PortfolioSnapshot[]
    side_effects: []

  - method: GET
    path: "/mortgage-insurance/portfolio-snapshots/{id}"
    description: "Get a portfolio snapshot"
    roles: [MasterPolicyAdmin, Underwriter]
    code: 200
    input: []
    output: PortfolioSnapshot
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this operation"

  # --- Resource Not Found ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"

  - id: ERR_LENDER_NOT_FOUND
    http: 404
    condition: "Lender id does not exist"

  - id: ERR_SERVICER_NOT_FOUND
    http: 404
    condition: "Servicer id does not exist"

  - id: ERR_MASTER_POLICY_NOT_FOUND
    http: 404
    condition: "Master policy id does not exist"

  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "Rate card id does not exist"

  - id: ERR_TREATY_NOT_FOUND
    http: 404
    condition: "Reinsurance treaty id does not exist"

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Coverage application id does not exist"

  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "Loan id does not exist"

  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Claim id does not exist"

  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "Coverage dispute id does not exist"

  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "Cancellation notice id does not exist"

  - id: ERR_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "Portfolio snapshot id does not exist"

  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "External report or delinquency report id does not exist"

  # --- Request Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, negative monetary amount, or an event instant in the future"

  # --- State ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Subject entity is not in a state from which the requested transition is declared"

  - id: ERR_PATH_MISMATCH
    http: 409
    condition: "Underwriting path invoked does not match the lender's delegated authority"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version in the request body does not equal the parent entity's current version"

  # --- Underwriting ---
  - id: ERR_RATE_CARD_MISMATCH
    http: 409
    condition: "Pinned rate card does not belong to the application's master policy"

  - id: ERR_RATE_CARD_NOT_ELIGIBLE
    http: 409
    condition: "Pinned rate card does not price the application's coverage percentage or premium plan"

  - id: ERR_UNDERWRITING_DECLINED
    http: 422
    condition: "Loan-to-value exceeds 95.0 percent, or the requested coverage percentage is outside the master policy's allowed set"

  - id: ERR_LENDER_EXPOSURE_CAP_EXCEEDED
    http: 409
    condition: "Lender's aggregate in-force contribution strictly exceeds its policy exposure cap"

  # --- Coverage termination ---
  - id: ERR_CANCELLATION_NOT_PERMITTED
    http: 409
    condition: "Cancellation requested for a reason whose precondition is not satisfied (for example a servicer loss-mitigation cancellation on a loan whose claim_blocked flag is false)"

  - id: ERR_INSUFFICIENT_EVIDENCE
    http: 409
    condition: "Evidence amount is below the computed maximum refund for a cancellation notice"

  - id: ERR_MILESTONE_NOT_REACHED
    http: 409
    condition: "Amortization milestone recorded while the loan's balance still exceeds the 80 percent milestone"

  - id: ERR_WAIVER_NOT_AVAILABLE
    http: 409
    condition: "Loss-mitigation waiver requested without the master policy's PARTICIPATION standard and an ATTACHED evidence code"

  # --- Delinquency reporting ---
  - id: ERR_DUPLICATE_PERIOD
    http: 409
    condition: "A delinquency report already exists for this loan and as_of_period"

  - id: ERR_SERVICER_INACTIVE
    http: 409
    condition: "Reporting servicer's status is not ACTIVE"

  - id: ERR_SERVICER_NOT_DESIGNATED
    http: 409
    condition: "Reporting servicer is not the loan's designated servicer"

  # --- Claims ---
  - id: ERR_COVERAGE_NOT_ACTIVE
    http: 409
    condition: "Coverage was not in force at the claim's event instant"

  - id: ERR_CLAIM_BLOCKED_LOSS_MITIGATION
    http: 409
    condition: "Loan's last Class-A delinquency report failed the applicable loss-mitigation participation standard"

  - id: ERR_CLAIM_TIME_BARRED
    http: 409
    condition: "Claim filed later than the loan's term in months after the title-transferring event"

  - id: ERR_SETTLEMENT_OPTION_UNKNOWN
    http: 409
    condition: "Named settlement option is not one of the claim's four priced options"

  - id: ERR_THIRD_PARTY_SALE_INSUFFICIENT
    http: 409
    condition: "Third-party sale net proceeds fall below 85 percent of the claim's net amount"

  # --- Disputes and rescission ---
  - id: ERR_RESCISSION_BARRED_RELIEF_ATTACHED
    http: 409
    condition: "Rescission decision attempted on a loan whose rescission relief is GUARANTEED"

  - id: ERR_DISPUTE_DECISION_INVALID
    http: 409
    condition: "Decision value is not one of UPHELD | DENIED | RESCISSION_GRANTED | RESCISSION_DENIED"

  - id: ERR_DUPLICATE_OPEN_DISPUTE
    http: 409
    condition: "An open coverage dispute already targets this claim"

  - id: ERR_CURTAILMENT_DISPUTE_OPEN
    http: 409
    condition: "Settlement attempted while a non-LOSS_MITIGATION_EXCUSE dispute is open against the claim"

  # --- Reinsurance ---
  - id: ERR_TREATY_NOT_IN_FORCE
    http: 409
    condition: "Treaty is not ACTIVE, or the claim's event instant falls outside the treaty's in-force window"

  - id: ERR_TREATY_CAP_EXHAUSTED
    http: 409
    condition: "Treaty aggregate capacity is fully consumed for this loan"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MasterPolicyAdmin
    description: "Master insurer operations authority: configures policies, rate cards and treaties, issues coverage, and is the sole decider on rescission and curtailment disputes."
    identity: opaque
    exclusive_operations:
      - "POST /master-policies, /rate-cards, /reinsurance-treaties, /reinsurance-treaties/{id}/cancel"
      - "POST /servicers, /servicers/{id}/suspend, /lenders"
      - "POST /loans"
      - "POST /loans/{id}/rescission-relief"
      - "POST /coverage-disputes/{id}/begin-review, /coverage-disputes/{id}/decide"
      - "POST /portfolio-snapshots"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /loans/{id}/amortization-milestones (shared with Servicer)"
      - "GET every collection and single-resource read"

  - name: Underwriter
    description: "Risk review authority: works the non-delegated underwriting queue, validates origination data, adjudicates claims, and reconciles lender exposure."
    identity: opaque
    exclusive_operations:
      - "POST /coverage-applications/{id}/underwrite, /request-info, /approve, /decline"
      - "POST /claims/{id}/begin-review, /approve, /deny"
      - "POST /loans/{id}/external-reports"
    shared_operations:
      - "GET every collection and single-resource read"
      - "POST /lenders/{id}/exposure-reconciliations (shared with MasterPolicyAdmin)"
      - "POST /reinsurance-cessions (shared with MasterPolicyAdmin)"
      - "POST /portfolio-snapshots (shared with MasterPolicyAdmin)"

  - name: Lender
    description: "Originating institution: submits coverage applications, may self-approve when delegated, files claims, selects settlement options, files curtailment disputes, and files borrower-request cancellation notices."
    identity: entity_backed:Lender
    exclusive_operations:
      - "POST /coverage-applications (as the owning lender)"
      - "POST /coverage-applications/{id}/delegated-approve, /submit-info, /withdraw"
      - "POST /claims (as the owning lender)"
      - "POST /claims/{id}/settle, /claims/{id}/reconsideration"
      - "POST /coverage-disputes"
    shared_operations:
      - "POST /loans/{id}/cancellation-notices (shared with Servicer)"
      - "GET every collection and single-resource read"

  - name: Servicer
    description: "Servicing organization: files monthly delinquency reports with loss-mitigation activity evidence and may file loss-mitigation cancellation notices."
    identity: entity_backed:Servicer
    exclusive_operations:
      - "POST /delinquency-reports (as the designated servicer)"
    shared_operations:
      - "POST /loans/{id}/cancellation-notices (shared with Lender)"
      - "POST /loans/{id}/amortization-milestones (shared with MasterPolicyAdmin)"
      - "GET every collection and single-resource read"

  - name: Borrower
    description: "Borrower on a covered mortgage. Read-only on the coverage of their own loan and permitted to read the master policy governing it; explicitly barred from submitting coverage applications."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /loans/{id}, /claims/{id}, /master-policies/{id}, /rate-cards/{id} — read only"
