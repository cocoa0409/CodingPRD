  # -----------------------------------------------------------------------
  # Table 2 (State Machines): 11 machines, cyclic shape, cascade-heavy
  # side effects. The negotiation cycle, the parallel claim axes and the
  # peer-review fork/join are all carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml,
  # so those rows are recorded as excluded stubs.
  # -----------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: a_new_term_starts_in_draft_and_leaves_its_policy_quoted
        claim_type: initial_state
        grounds:
          - state_machines.PolicyTerm.initial_state
          - state_machines.Policy.initial_state
          - entities.PolicyTerm.fields.term_index
          - entities.Policy.fields.quoted_premium_total
        distinguishing_aspect: "A freshly created PolicyTerm is DRAFT at term_index 1 and step year 1, and its Policy stays QUOTED with current_term_id null while the 19779.19 sits in quoted_premium_total only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class (base 38000.00, hazard 7.0) and one COOK_IL insured at 40 percent high-severity procedures, CREDENTIALED to 2028-01-01."
            - "A CLAIMS_MADE policy at 1M/3M limits with prior_acts_step_credit 0 and no term yet."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
          trigger:
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_a1: $.data.id }
          assert:
            - "response.status == 201"
            - "PolicyTerm.${term_a1}.status == DRAFT"
            - "PolicyTerm.${term_a1}.term_index == 1"
            - "PolicyTerm.${term_a1}.claims_made_step_year == 1"
            - "PolicyTerm.${term_a1}.step_factor == 0.35"
            - "PolicyTerm.${term_a1}.rating_variant == UNDERWRITING_SNAPSHOT"
            - "PolicyTerm.${term_a1}.premium_manual == 19285.00"
            - "PolicyTerm.${term_a1}.premium_net == 19285.00"
            - "PolicyTerm.${term_a1}.term_total == 19779.19"
            - "PolicyTerm.${term_a1}.issued_at == null"
            - "Policy.${pol_a}.status == QUOTED"
            - "Policy.${pol_a}.current_term_id == null"
            - "Policy.${pol_a}.quoted_premium_total == 19779.19"
            - "Policy.${pol_a}.written_premium_net_total == 0.00"
            - "Insured.${ins_a}.status == PROSPECT"

      - name: pro_rata_cancellation_returns_the_unearned_half_and_keeps_the_aggregate
        claim_type: valid_transition
        grounds:
          - state_machines.PolicyTerm.IN_FORCE_to_CANCELLED_PRO_RATA
          - calculations.pro_rata_return_premium
          - entities.PolicyTerm.fields.aggregate_limit_remaining
          - entities.Policy.fields.written_premium_net_total
        distinguishing_aspect: "Cancelling mid-term on 2027-02-01 returns 181/365 of the 24800.00 net premium, exactly 12298.08, and unlike a flat cancellation leaves aggregate_limit_remaining at 3000000.00."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ORTHOPEDIC_SURGERY class (base 24800.00, hazard 6.0), MARICOPA_AZ insured at 30 percent high-severity procedures (score 3.45 -> R2 -> 1.00), CREDENTIALED to 2028-01-01."
            - "An OCCURRENCE policy (step factor pinned to 1.00, no retroactive date) with one term 2026-08-01 -> 2027-08-01 issued into IN_FORCE at premium_net 24800.00."
            - "Clock then advanced to 2027-02-01T00:00:00Z with the term still IN_FORCE."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
