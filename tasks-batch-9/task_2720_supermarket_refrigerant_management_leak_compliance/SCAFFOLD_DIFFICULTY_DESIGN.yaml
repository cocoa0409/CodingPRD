            - call: "POST /systems/${sysr_id}/retirement"
              payload: { retirement_reason_code: "END_OF_LIFE_REPLACEMENT", retrofit_plan_id: "${plan_id}" }
              as: ComplianceManager
              captures: { retired_status: $.data.operational_status, retired_compliance: $.data.compliance_state }
          assert:
            - "with the plan only SUBMITTED: HTTP 422 with error_id == ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT"
            - "with the plan only SUBMITTED: RefrigerantSystem.${sysr_id}.operational_status == ACTIVE and LeakEvent.${event_id}.status == OPEN"
            - "after APPROVE: RefrigerantSystem.${sysr_id}.operational_status == RETIRED, compliance_state == RETIRED_EXEMPT, retired_on == 2026-08-01T00:00:00Z"
            - "after APPROVE: LeakEvent.${event_id}.status == VOIDED"
            - "RetrofitPlan.${plan_id}.status == APPROVED (the retirement does not itself complete the plan)"
            - "Store.${store_id}.open_leak_event_count == 0 and compliance_status == COMPLIANT"

      - name: verification_test_blocked_by_superseded_repair_attempt_state
        grounds:
          - validations[priority=25]
          - errors[ERR_REPAIR_ATTEMPT_NOT_CURRENT]
          - entities.RepairAttempt.fields.outcome
          - state_machines.LeakEvent.VERIFICATION_PENDING_to_VERIFICATION_PENDING
          - state_machines.LeakEvent.VERIFICATION_PENDING_to_FOLLOWUP_PENDING
        distinguishing_aspect: |
          A third entity pair (VerificationTest, RepairAttempt) where the
          depended-on state is not an entity-level lifecycle but a per-row
          outcome that a later sibling row mutated: filing A2 flips A1 from
          AWAITING_VERIFICATION to SUPERSEDED, and only the newest attempt may be
          verified. The two attempts are otherwise interchangeable - same event,
          same technician, same equipment - so the rejection can only come from
          A1's outcome field.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z then 2026-08-08T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 repairs, T2 verifies, EQ1, CYL1."
            - "A 20.0 lb ADD_REFRIGERANT record on 2026-08-01 opens LeakEvent E1."
            - "RepairAttempt A1 at 2026-08-05T09:00:00Z then RepairAttempt A2 at 2026-08-07T09:00:00Z, so A1.outcome == SUPERSEDED and A2.outcome == AWAITING_VERIFICATION."
