      - name: recording_without_a_w9_on_file_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_W9_MISSING]
          - validations[priority 29]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / record_memo_requires_landowner_w9_on_file
          rationale: "That instance records with w9_on_file false (rejected, recording_status left at MEMO_SUBMITTED and the parcel left OPTIONED), then PATCHes the flag true and replays the identical recording successfully."

      - name: fourth_counter_is_refused_by_the_negotiation_round_limit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
          - validations[priority 34]
        excluded_because:
          difficulty_instance: non_linear_state_machine / option_negotiation_loop_three_rounds_then_limit
          rationale: "That instance drives round_index to 3 through three counter/revise cycles and asserts the fourth counter fails with ERR_NEGOTIATION_ROUND_LIMIT while the agreement keeps its last revised terms."

      - name: extension_beyond_the_allowance_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EXTENSION_LIMIT_REACHED]
          - errors[ERR_LANDOWNER_PAYMENT_HOLD]
          - validations[priority 33]
          - validations[priority 41]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / extension_limit_beats_payment_hold
          rationale: "That instance exhausts extension_count_allowed and then puts the landowner on payment hold, asserting ERR_EXTENSION_LIMIT_REACHED wins at priority 33 and that the hold surfaces as ERR_LANDOWNER_PAYMENT_HOLD once the allowance is raised — so both codes are triggered there."

  # ==========================================================================
  - section: rbac
    instances:

      - name: land_agent_cannot_execute_an_option_reserved_to_the_portfolio_manager
        claim_type: exclusive_operation
        grounds:
          - roles.PortfolioManager.exclusive_operations
          - roles.LandAgent.description
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The LandAgent owns every step up to acceptance, so the 403 must be produced by the endpoint's own role list rather than by any general notion of the agent being 'read-only': the same user who drafted, sent and holds the instrument still cannot execute it."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement drafted and sent by la-user-01 and accepted by the landowner."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "OptionAgreement.${o_id}.status == ACCEPTED and executed_at is null and executed_by_user_id is null"
            - "GET /land-origination/option-payments with option_agreement_id ${o_id} returns meta.total_count == 0"
            - "Parcel.${p_id}.status == QUALIFIED and Landowner.${l_id}.total_paid_cents == 0"

      - name: payment_administrator_cannot_register_a_parcel
        claim_type: exclusive_operation
        grounds:
          - roles.LandAgent.exclusive_operations
          - roles.PaymentAdministrator.description
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The payables role holds the only PATCH in the API and the whole rent lifecycle, so it is the role most likely to be over-permitted. Origination must be closed to it, and the 403 must precede the priority-3 existence check on landowner_id."
        test_recipe:
          setup:
            - "One Landowner registered by the land agent."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "GET /land-origination/parcels with landowner_id ${l_id} returns meta.total_count == 0"

      - name: site_access_booking_is_shared_by_the_land_agent_and_title_counsel
        claim_type: shared_operation
        grounds:
