# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Botanical Garden / Arboretum — Membership & Admission Platform
# 9 rule_ids x >=2 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Clock default = 2026-04-01T00:00:00Z (POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # -- Membership domain: fresh-term full fee vs renewal-credit net charge --
      - name: dvc_membership_join_full_fee_vs_renewal_credit
        grounds:
          - calculations.join_fee_proration
          - calculations.renewal_credit
          - state_machines.Membership.PENDING_to_ACTIVE
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Membership.fields.paid_total_cents
        distinguishing_aspect: |
          On the SAME Membership and plan (annual_fee_cents=12000), activation charges the
          full 12000 (join_fee_proration, no credit) while an early renewal with 30 unused
          days charges only 11014 (renewal_credit subtracts a 986 credit) — the two variants
          produce different charges, so paid_total_cents == 23014 after both, not 24000.
        test_recipe:
          setup:
            - "Garden created; INDIVIDUAL plan annual_fee_cents=12000; membership PENDING then ACTIVE."
            - "Clock at default 2026-04-01T00:00:00Z so activation term_end = 2027-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Fernwood" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Ada", auto_renew: false }
              as: Visitor
              as_user_id: "anon-ada"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/memberships/${m_id}/renew"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { paid: $.data.paid_total_cents }
          assert:
            - "Membership.${m_id}.paid_total_cents == 23014"
            - "Membership.${m_id}.term_end == 2028-03-31T00:00:00Z"
            - "Membership.${m_id}.renewal_count == 1"

      # -- Rental domain: provisional quote vs locked final price --------------
      - name: dvc_rental_quoted_vs_final_lapsed_loses_discount
        grounds:
          - calculations.rental_pricing
          - state_machines.Rental.REQUESTED_to_CONFIRMED
          - entities.Rental.fields.quoted_cents
          - entities.Rental.fields.final_cents
        distinguishing_aspect: |
          quoted_cents is computed at REQUEST with the PATRON discount applied (102000), but
          if the membership lapses before CONFIRM, final_cents is recomputed without the
          discount (120000) — same rental, two variants diverge by exactly the 18000 discount.
        test_recipe:
          setup:
            - "PATRON membership ACTIVE; venue hourly_rate_cents=30000, member_rental_discount_pct=0.15, buffer 60."
            - "Rental window 2026-05-01T10:00->13:30 (ceil 4h, subtotal 120000 >= 50000 floor)."
            - "Clock advanced past term_end with auto_renew=false BEFORE confirm -> membership LAPSED."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Bloomvale" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "PATRON", annual_fee_cents: 30000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Cyrus", auto_renew: false }
              as: Visitor
              as_user_id: "anon-cy"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /v1/venues"
              payload: { garden_id: "${g_id}", name: "Conservatory Hall", hourly_rate_cents: 30000, buffer_minutes: 60, member_rental_discount_pct: 0.15 }
              as: RentalCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /v1/rentals"
              payload: { garden_id: "${g_id}", venue_id: "${v_id}", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T13:30:00Z", membership_id: "${m_id}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, quoted: $.data.quoted_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/rentals/${r_id}/confirm"
              payload: {}
              as: RentalCoordinator
              captures: { final: $.data.final_cents }
          assert:
            - "Rental.${r_id}.quoted_cents == 102000"
            - "Rental.${r_id}.final_cents == 120000"
            - "Rental.${r_id}.status == CONFIRMED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # -- mode (a): >=3 inputs, non-linear branch on reciprocal flag ----------
      - name: cf_reservation_admission_reciprocal_branch_mode_a
        grounds:
          - calculations.reservation_admission
          - entities.TimeSlot.fields.ga_price_cents
          - entities.Garden.fields.reciprocal_discount_pct
          - entities.Reservation.fields.admission_cents
        distinguishing_aspect: |
          admission_cents = paid_heads * per_head where per_head branches non-linearly on the
          reciprocal boolean: reciprocal=true gives round_half_up(2500*0.5)=1250 -> 2 heads = 2500,
          whereas reciprocal=false would give 2500*2 = 5000 (mode (a): >=3 inputs, conditional branch).
        test_recipe:
          setup:
            - "Garden in network AHS, reciprocal_discount_pct=0.5; TimeSlot ga_price_cents=2500, capacity 10."
            - "Non-member reciprocal reservation with paid_heads=2, reciprocal=true."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Aster Gardens", reciprocal_network_code: "AHS", reciprocal_discount_pct: 0.5 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-02T10:00:00Z", ends_at: "2026-04-02T12:00:00Z", capacity: 10, ga_price_cents: 2500 }
              as: GardenStaff
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 2, reciprocal: true }
              as: Visitor
              as_user_id: "anon-recip"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.admission_cents == 2500"
            - "Reservation.${res_id}.party_size == 2"

      # -- mode (b): order-sensitive rounding (round-per-ticket then *qty) ------
      - name: cf_event_ticket_round_per_ticket_then_sum_mode_b
        grounds:
          - calculations.event_ticket_pricing
          - entities.EventTicket.fields.charged_cents
          - state_machines.Membership.PENDING_to_ACTIVE
        distinguishing_aspect: |
          With list_price 1599, discount 0.2, qty 3: rounding the per-ticket price FIRST
          (round_half_up(1599*0.8)=1279) then * 3 = 3837, NOT sum-then-round (round(1599*0.8*3))=3838.
          The scaffold pins round-per-ticket-then-sum, so charged_cents == 3837 (mode (b)).
        test_recipe:
          setup:
            - "ACTIVE HOUSEHOLD membership with plan.event_discount_pct=0.2."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Camellia Park" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, event_discount_pct: 0.2 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Dora", household_member_names: ["Ben"], auto_renew: false }
              as: Visitor
              as_user_id: "anon-dora"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/event-tickets"
              payload: { garden_id: "${g_id}", exhibit_name: "Orchid Show", list_price_cents: 1599, quantity: 3, membership_id: "${m_id}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { t_id: $.data.id }
          assert:
            - "EventTicket.${t_id}.charged_cents == 3837"
            - "EventTicket.${t_id}.status == PURCHASED"

      # -- mode (c): circular-looking subtotal->discount eligibility ------------
      - name: cf_rental_subtotal_keyed_discount_mode_c
        grounds:
          - calculations.rental_pricing
          - entities.Venue.fields.hourly_rate_cents
          - entities.Rental.fields.quoted_cents
        distinguishing_aspect: |
          discount eligibility is keyed on subtotal (>= MEMBER_DISCOUNT_FLOOR_CENTS=50000) which
          itself depends on hours -> evaluation order pinned (hours->subtotal->eligibility->discount->final).
          A 1-hour PATRON rental has subtotal 30000 < 50000, so quoted_cents stays 30000 (no discount),
          proving the discount is gated on the computed subtotal, not the tier alone (mode (c)).
        test_recipe:
          setup:
            - "PATRON membership ACTIVE; venue hourly_rate_cents=30000, member_rental_discount_pct=0.15."
            - "Rental window 2026-05-02T10:00->11:00 = 1h -> subtotal 30000 below 50000 floor."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Dahlia Grove" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "PATRON", annual_fee_cents: 30000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Edith", auto_renew: false }
              as: Visitor
              as_user_id: "anon-ed"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /v1/venues"
              payload: { garden_id: "${g_id}", name: "Glasshouse", hourly_rate_cents: 30000, buffer_minutes: 60, member_rental_discount_pct: 0.15 }
              as: RentalCoordinator
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /v1/rentals"
              payload: { garden_id: "${g_id}", venue_id: "${v_id}", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T11:00:00Z", membership_id: "${m_id}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
          assert:
            - "Rental.${r_id}.quoted_cents == 30000"
            - "Rental.${r_id}.status == REQUESTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # -- Reservation fork-join: HELD -> {CHECKED_IN, EXPIRED, CANCELLED} -----
      - name: nlsm_reservation_fork_join_three_terminals
        grounds:
          - state_machines.Reservation.HELD_to_CHECKED_IN
          - state_machines.Reservation.HELD_to_EXPIRED
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.Reservation.fields.status
        distinguishing_aspect: |
          From the single HELD state the Reservation forks into three divergent terminals with
          different side effects: CHECKED_IN keeps held_count, EXPIRED/CANCELLED release it.
          Here a HELD reservation is checked in (HELD->CHECKED_IN) while held_count stays 1.
        test_recipe:
          setup:
            - "TimeSlot capacity 5; a HELD non-member reservation party_size 1; clock inside slot window."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Echinacea Field" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-02T10:00:00Z", ends_at: "2026-04-02T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-r1"
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T10:30:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: GardenStaff
          assert:
            - "Reservation.${res_id}.status == CHECKED_IN"
            - "TimeSlot.${s_id}.held_count == 1"

      # -- Membership cyclic ACTIVE -> ACTIVE via renew -----------------------
      - name: nlsm_membership_cyclic_active_to_active
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Membership.fields.renewal_count
          - entities.Membership.fields.term_end
        distinguishing_aspect: |
          Membership has a self-loop ACTIVE->ACTIVE (renew), a cycle on a DIFFERENT entity from the
          Reservation fork-join: after two renewals renewal_count==2 and term_end extends to 2029-03-31.
        test_recipe:
          setup:
            - "auto_renew=true so renew is allowed any time; plan annual_fee_cents=12000."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Foxglove Walk" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Gus", auto_renew: true }
              as: Visitor
              as_user_id: "anon-gus"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /v1/memberships/${m_id}/renew"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/memberships/${m_id}/renew"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { rc: $.data.renewal_count }
          assert:
            - "Membership.${m_id}.renewal_count == 2"
            - "Membership.${m_id}.status == ACTIVE"
            - "Membership.${m_id}.term_end == 2029-03-31T00:00:00Z"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # -- depth >= 3: lapse -> withdraw -> promote -> enrolled_count ----------
      - name: tc_lapse_withdraws_registration_promotes_waitlister_depth3
        grounds:
          - state_machines.Membership.ACTIVE_to_LAPSED
          - state_machines.Registration.ENROLLED_to_WITHDRAWN
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - entities.ProgramSession.fields.enrolled_count
        distinguishing_aspect: |
          Forcing the member to LAPSE (A) withdraws their ENROLLED registration (B, caused by A),
          which in turn promotes the rank-1 WAITLISTED registration to ENROLLED (C, caused by B):
          a 3-hop chain where each hop is caused by the prior. enrolled_count stays at capacity (1)
          and the waitlisted registration becomes ENROLLED with charged_cents 10000.
        test_recipe:
          setup:
            - "ProgramSession capacity 1, tuition 10000; member m1 (ACTIVE) ENROLLED; non-member r2 WAITLISTED rank 1."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Gardenia Court" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Hana", auto_renew: false }
              as: Visitor
              as_user_id: "anon-hana"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /v1/program-sessions"
              payload: { garden_id: "${g_id}", title: "Junior Botanists Camp", starts_at: "2026-07-01T09:00:00Z", capacity: 1, tuition_cents: 10000 }
              as: GardenStaff
              captures: { ses_id: $.data.id }
            - call: "POST /v1/registrations"
              payload: { garden_id: "${g_id}", program_session_id: "${ses_id}", participant_name: "Hana Jr", membership_id: "${m_id}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { reg1_id: $.data.id }
            - call: "POST /v1/registrations"
              payload: { garden_id: "${g_id}", program_session_id: "${ses_id}", participant_name: "Walt" }
              as: Visitor
              as_user_id: "anon-walt"
              captures: { reg2_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${m_id}/lapse"
              payload: {}
              as: GardenStaff
          assert:
            - "Membership.${m_id}.status == LAPSED"
            - "Registration.${reg1_id}.status == WITHDRAWN"
            - "Registration.${reg2_id}.status == ENROLLED"
            - "Registration.${reg2_id}.waitlist_rank == 0"
            - "Registration.${reg2_id}.charged_cents == 10000"
            - "ProgramSession.${ses_id}.enrolled_count == 1"

      # -- depth >= 2: cancel membership -> cancel reservation -> release slot --
      - name: tc_cancel_membership_cancels_reservation_releases_slot_depth2
        grounds:
          - state_machines.Membership.PENDING_or_ACTIVE_or_LAPSED_to_CANCELLED
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.TimeSlot.fields.held_count
        distinguishing_aspect: |
          Cancelling the membership (A) cancels its HELD reservation (B, caused by A), and B's
          cancel releases party_size from TimeSlot.held_count (C, caused by B): a 2-hop chain from
          a DIFFERENT trigger (membership cancel) than the lapse cascade. held_count returns to 0.
        test_recipe:
          setup:
            - "ACTIVE HOUSEHOLD membership with a HELD member reservation (member_heads 2) on a capacity-5 slot."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Heliconia House", guest_pass_grant_household: 4 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, admission_included: true }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Ivy", household_member_names: ["Jo"], auto_renew: false }
              as: Visitor
              as_user_id: "anon-ivy"
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-03T10:00:00Z", ends_at: "2026-04-03T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", member_heads: 2, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${m_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == CANCELLED"
            - "Reservation.${res_id}.status == CANCELLED"
            - "TimeSlot.${s_id}.held_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # -- state (p6) vs business_fiscal (p14): invalid state wins ------------
      - name: ppvc_invalid_state_beats_slot_capacity
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A check-in on an already-CANCELLED reservation against a slot that is also at capacity
          fails with ERR_INVALID_STATE (priority 6, state), NOT ERR_SLOT_CAPACITY_EXCEEDED
          (priority 14, business_fiscal) — different category pair state vs business_fiscal.
        test_recipe:
          setup:
            - "A CANCELLED reservation on a slot whose held_count already equals capacity (full)."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Iris Bend" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-04T10:00:00Z", ends_at: "2026-04-04T12:00:00Z", capacity: 1, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-fill"
              captures: { res_fill_id: $.data.id }
            - call: "POST /v1/reservations/${res_fill_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "anon-fill"
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-x"
              captures: { res_x_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-y"
              captures: { res_y_id: $.data.id }
            - call: "POST /v1/reservations/${res_x_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "anon-x"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-04T10:30:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/reservations/${res_x_id}/check-in"
              payload: {}
              as: GardenStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      # -- business_safety (p10) vs business_referential (p5): cross-garden first
      - name: ppvc_cross_garden_ref_beats_household_cap
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_CROSS_GARDEN_REFERENCE]
          - errors[ERR_HOUSEHOLD_CAP_EXCEEDED]
        distinguishing_aspect: |
          Creating a HOUSEHOLD membership whose plan_id belongs to a DIFFERENT garden AND whose
          household_member_names exceeds the cap fails with ERR_CROSS_GARDEN_REFERENCE (priority 5,
          business_referential), NOT ERR_HOUSEHOLD_CAP_EXCEEDED (priority 10, business_safety) —
          different category pair business_referential vs business_safety.
        test_recipe:
          setup:
            - "Garden A with household_member_cap=2; Garden B with its own HOUSEHOLD plan."
            - "Create membership in Garden A but reference Garden B's plan and pass 4 household names."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Jasmine A", household_member_cap: 2 }
              as: GardenAdmin
              captures: { gA_id: $.data.id }
            - call: "POST /v1/gardens"
              payload: { name: "Jasmine B", household_member_cap: 2 }
              as: GardenAdmin
              captures: { gB_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${gB_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000 }
              as: GardenAdmin
              captures: { planB_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships"
              payload: { garden_id: "${gA_id}", plan_id: "${planB_id}", primary_member_name: "Kit", household_member_names: ["a","b","c","d"], auto_renew: false }
              as: Visitor
              as_user_id: "anon-kit"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CROSS_GARDEN_REFERENCE"
            - "response.http_status == 422"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # -- exact slot-capacity boundary on POST /reservations -----------------
      - name: bpc_slot_capacity_exact_fill_then_one_over
        grounds:
          - validations[priority=14]
          - entities.TimeSlot.fields.capacity
          - entities.TimeSlot.fields.held_count
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A slot of capacity 3 accepts a party that fills held_count to exactly 3 (== capacity,
          allowed) but the very next single head (held_count would become 4 > 3) is rejected with
          ERR_SLOT_CAPACITY_EXCEEDED — boundary at held_count + party_size <= capacity (<= not <).
        test_recipe:
          setup:
            - "TimeSlot capacity 3; first reservation paid_heads 3 fills it exactly."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Kalmia Knoll" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-05T10:00:00Z", ends_at: "2026-04-05T12:00:00Z", capacity: 3, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 3 }
              as: Visitor
              as_user_id: "anon-full"
              captures: { res_full_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-over"
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${res_full_id}.party_size == 3"
            - "TimeSlot.${s_id}.held_count == 3"
            - "TimeSlot.${s_id}.status == CLOSED"
            - "response.data.error_id == ERR_SLOT_CAPACITY_EXCEEDED"

      # -- renewal credit zero-boundary on POST /memberships/{id}/renew --------
      - name: bpc_renewal_credit_zero_at_expiry
        grounds:
          - calculations.renewal_credit
          - entities.Membership.fields.paid_total_cents
          - state_machines.Membership.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Renewing at the exact term_end instant gives unused_days==0 so credit_cents==0 and the
          charge equals the full 12000 fee — a different metric (unused-days zero edge) on a
          different endpoint (renew) than the slot-capacity boundary. paid_total_cents == 24000.
        test_recipe:
          setup:
            - "auto_renew=true; activate at default; advance clock to exactly term_end 2027-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Lupine Ledge" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Mona", auto_renew: true }
              as: Visitor
              as_user_id: "anon-mona"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/memberships/${m_id}/renew"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { paid: $.data.paid_total_cents }
          assert:
            - "Membership.${m_id}.paid_total_cents == 24000"
            - "Membership.${m_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # -- Reservation check-in depends on Membership status (Reservation->Membership)
      - name: cesd_checkin_requires_membership_active
        grounds:
          - state_machines.Reservation.HELD_to_CHECKED_IN
          - validations[priority=8]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
          - entities.Membership.fields.status
        distinguishing_aspect: |
          A HELD member reservation cannot be CHECKED_IN once its Membership has LAPSED: the
          Reservation transition is gated on the linked Membership.status == ACTIVE (entity pair
          Reservation->Membership), failing with ERR_MEMBERSHIP_NOT_ACTIVE.
        test_recipe:
          setup:
            - "ACTIVE membership with a HELD member reservation; then membership force-lapsed (reservation slot is in the future so its HELD survives lapse cascade? No: lapse cancels future HELD)."
            - "To isolate the gate, lapse happens AFTER a past-dated slot so the reservation stays HELD; clock then inside slot window for check-in."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Magnolia Mews" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, admission_included: true }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Nell", auto_renew: false }
              as: Visitor
              as_user_id: "anon-nell"
              captures: { m_id: $.data.id, m_v1pre: $.data.version }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-06T10:00:00Z", ends_at: "2026-04-06T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", member_heads: 1, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T10:30:00Z" }
              as: GardenAdmin
            - call: "POST /v1/memberships/${m_id}/lapse"
              payload: {}
              as: GardenStaff
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: GardenStaff
              captures: { err: $.data.error_id }
          assert:
            - "Membership.${m_id}.status == LAPSED"
            - "Reservation.${res_id}.status == HELD"
            - "response.data.error_id == ERR_MEMBERSHIP_NOT_ACTIVE"

      # -- Registration promotion depends on ProgramSession capacity (Registration->ProgramSession)
      - name: cesd_promotion_requires_session_capacity
        grounds:
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - state_machines.Registration.ENROLLED_to_WITHDRAWN
          - entities.ProgramSession.fields.capacity
          - entities.ProgramSession.fields.enrolled_count
        distinguishing_aspect: |
          A WAITLISTED registration is promoted to ENROLLED ONLY when an ENROLLED peer withdraws and
          enrolled_count < capacity afterwards (entity pair Registration->ProgramSession). Withdrawing
          the rank-1 waitlister (not an enrolled) does NOT promote rank-2 because no seat opened.
        test_recipe:
          setup:
            - "ProgramSession capacity 1; reg1 ENROLLED; reg2 WAITLISTED rank 1; reg3 WAITLISTED rank 2."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Nasturtium Nook" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/program-sessions"
              payload: { garden_id: "${g_id}", title: "Bonsai Basics", starts_at: "2026-08-01T09:00:00Z", capacity: 1, tuition_cents: 8000 }
              as: GardenStaff
              captures: { ses_id: $.data.id }
            - call: "POST /v1/registrations"
              payload: { garden_id: "${g_id}", program_session_id: "${ses_id}", participant_name: "P1" }
              as: Visitor
              as_user_id: "anon-p1"
              captures: { reg1_id: $.data.id }
            - call: "POST /v1/registrations"
              payload: { garden_id: "${g_id}", program_session_id: "${ses_id}", participant_name: "P2" }
              as: Visitor
              as_user_id: "anon-p2"
              captures: { reg2_id: $.data.id }
            - call: "POST /v1/registrations"
              payload: { garden_id: "${g_id}", program_session_id: "${ses_id}", participant_name: "P3" }
              as: Visitor
              as_user_id: "anon-p3"
              captures: { reg3_id: $.data.id }
          trigger:
            - call: "POST /v1/registrations/${reg2_id}/withdraw"
              payload: {}
              as: Visitor
              as_user_id: "anon-p2"
          assert:
            - "Registration.${reg2_id}.status == WITHDRAWN"
            - "Registration.${reg1_id}.status == ENROLLED"
            - "Registration.${reg3_id}.status == WAITLISTED"
            - "Registration.${reg3_id}.waitlist_rank == 1"
            - "ProgramSession.${ses_id}.enrolled_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # -- Venue overlap with buffer (closed interval + buffer) ----------------
      - name: rto_venue_buffer_overlap_on_confirm
        grounds:
          - state_machines.Rental.REQUESTED_to_CONFIRMED
          - validations[priority=13]
          - entities.Venue.fields.buffer_minutes
          - errors[ERR_VENUE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          On Venue (buffer_minutes=60), a second rental starting 14:00 collides with a CONFIRMED
          rental ending 13:30 because [13:30, 13:30+60min] buffer overlaps — interval semantics =
          half-open occupancy EXPANDED by a turnover buffer. Confirm fails ERR_VENUE_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Venue buffer 60min; rental A 10:00-13:30 CONFIRMED; rental B 14:00-15:00 REQUESTED."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Oleander Oasis" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/venues"
              payload: { garden_id: "${g_id}", name: "Lily Pavilion", hourly_rate_cents: 20000, buffer_minutes: 60 }
              as: RentalCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /v1/rentals"
              payload: { garden_id: "${g_id}", venue_id: "${v_id}", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T13:30:00Z" }
              as: Visitor
              as_user_id: "anon-a"
              captures: { rA_id: $.data.id }
            - call: "POST /v1/rentals/${rA_id}/confirm"
              payload: {}
              as: RentalCoordinator
            - call: "POST /v1/rentals"
              payload: { garden_id: "${g_id}", venue_id: "${v_id}", starts_at: "2026-05-01T14:00:00Z", ends_at: "2026-05-01T15:00:00Z" }
              as: Visitor
              as_user_id: "anon-b"
              captures: { rB_id: $.data.id }
          trigger:
            - call: "POST /v1/rentals/${rB_id}/confirm"
              payload: {}
              as: RentalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Rental.${rA_id}.status == CONFIRMED"
            - "response.data.error_id == ERR_VENUE_DOUBLE_BOOKED"
            - "Rental.${rB_id}.status == REQUESTED"

      # -- TimeSlot aggregate-capacity overlap (different interval semantics) ---
      - name: rto_timeslot_aggregate_capacity_overlap
        grounds:
          - validations[priority=14]
          - entities.TimeSlot.fields.capacity
          - entities.TimeSlot.fields.held_count
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          On TimeSlot (a DIFFERENT resource), occupancy is AGGREGATE-capacity within the same fixed
          window: many reservations share one [starts_at, ends_at) interval and collide only when
          their summed party_size exceeds capacity (no pairwise buffer arithmetic). Two parties of 2
          each on a capacity-3 slot: the second is rejected because 2+2 > 3.
        test_recipe:
          setup:
            - "TimeSlot capacity 3; first reservation party_size 2 (held_count 2)."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Petunia Plaza" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-07T10:00:00Z", ends_at: "2026-04-07T12:00:00Z", capacity: 3, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 2 }
              as: Visitor
              as_user_id: "anon-1"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 2 }
              as: Visitor
              as_user_id: "anon-2"
              captures: { err: $.data.error_id }
          assert:
            - "TimeSlot.${s_id}.held_count == 2"
            - "response.data.error_id == ERR_SLOT_CAPACITY_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # -- guest passes: reserve then cancel leaves passes conserved ----------
      - name: ci_guest_passes_conserved_on_reserve_then_cancel
        grounds:
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.Membership.fields.guest_passes_remaining
          - calculations.guest_pass_grant
        distinguishing_aspect: |
          Conserved quantity = Membership.guest_passes_remaining. A reservation spending 2 guest
          passes (remaining 4->2) followed by its cancel refunds exactly 2 (2->4), leaving
          guest_passes_remaining unchanged at 4 == the original grant. Invariant: grant == remaining
          + sum(guest_heads of HELD/CHECKED_IN reservations).
        test_recipe:
          setup:
            - "ACTIVE HOUSEHOLD membership, guest_pass_grant_household=4; one HELD reservation guest_heads 2."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Quince Quarter", guest_pass_grant_household: 4 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, admission_included: true }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Rin", auto_renew: false }
              as: Visitor
              as_user_id: "anon-rin"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-08T10:00:00Z", ends_at: "2026-04-08T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", guest_heads: 2, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "Membership.${m_id}.guest_passes_remaining == 4"
            - "TimeSlot.${s_id}.held_count == 0"

      # -- conservancy fund: record then void leaves fund totals conserved -----
      - name: ci_conservancy_fund_conserved_on_record_then_void
        grounds:
          - state_machines.Donation.RECORDED_to_VOIDED
          - calculations.conservancy_match
          - entities.ConservancyFund.fields.pledged_total_cents
          - entities.ConservancyFund.fields.matched_total_cents
        distinguishing_aspect: |
          Conserved quantities = ConservancyFund.pledged_total_cents AND matched_total_cents (a
          DIFFERENT conserved quantity type — fund ledger, not a per-member pass count). Recording a
          30000 CONSERVANCY gift (match_ratio 0.5, cap 10000) sets pledged 30000 / matched 10000;
          voiding it reverses both back to 0.
        test_recipe:
          setup:
            - "ConservancyFund OPEN, match_ratio 0.5, match_cap_cents 10000; one RECORDED 30000 CONSERVANCY donation."
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Rose Reserve" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/conservancy-funds"
              payload: { garden_id: "${g_id}", match_ratio: 0.5, match_cap_cents: 10000 }
              as: DevelopmentOfficer
              captures: { f_id: $.data.id }
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 30000, designation: "CONSERVANCY" }
              as: DevelopmentOfficer
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /v1/donations/${d_id}/void"
              payload: {}
              as: DevelopmentOfficer
          assert:
            - "Donation.${d_id}.status == VOIDED"
            - "ConservancyFund.${f_id}.pledged_total_cents == 0"
            - "ConservancyFund.${f_id}.matched_total_cents == 0"
