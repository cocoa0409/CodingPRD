# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3484_immigration_court_docket_management_case_completion
#
# Depth probe: 2 instances per §0.5 Difficulty Rule (18 total). Every instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and ships a structured, replayable recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: court_pace_calendar_vs_hearing_day_variants
        grounds:
          - calculations.court_completion_pace
          - entities.DocketReview.fields.pace_ratio_calendar
          - entities.DocketReview.fields.pace_ratio_hearing_day
        distinguishing_aspect: |
          Court-domain dual variant: for identical inputs (goal 100, exactly 1
          completion, clock 2026-09-10) the CALENDAR_PRORATA variant yields
          0.0145 while the HEARING_DAY_PRORATA variant yields 0.0144 — two valid
          pro-rata algorithms over the same data producing different numbers,
          and is_on_pace reads the CALENDAR variant only.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. Court goal 100; one PRO_SE English non-detained case driven FILED -> CALENDAR -> MERITS -> DECIDED -> APPEALED -> COMPLETED via appeal affirmation; clock then moved to 2026-09-10 and the docket-review checkpoint run."
          setup_api_calls:
            - &d_clock
              call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-PACE", name: "Pace Court", city: "Atlanta", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Pace", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "P-1", respondent_full_name: "R Pace", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_master: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_master}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v4: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-04T10:00:00Z", expected_case_version: "${case_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_merits: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_merits}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v5: $.data.version }
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v5}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { decision_id: $.data.id }
            - call: "POST /eoir/appeals"
              payload: { decision_id: "${decision_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { appeal_id: $.data.id }
            - call: "POST /eoir/appeals/${appeal_id}/decide"
              payload: { ruling: "AFFIRMED" }
              as: BoardMember
              as_user_id: "bm-01"
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { review_id: $.data.id }
          assert:
            - "DocketReview.${review_id}.run_index == 1"
            - "DocketReview.${review_id}.completions_ytd == 1 and pending_case_count == 0"
            - "DocketReview.${review_id}.pace_ratio_calendar == 0.0145 (1 completion / (100 goal * 252 elapsed calendar days / 365))"
            - "DocketReview.${review_id}.pace_ratio_hearing_day == 0.0144 (1 completion / (100 goal * 180 elapsed Mon-Fri days / 260))"
            - "DocketReview.${review_id}.pace_ratio_calendar != DocketReview.${review_id}.pace_ratio_hearing_day for identical inputs"
            - "DocketReview.${review_id}.is_on_pace == false and is_backlog_critical == false"
            - "DocketReview.${review_id}.cases_finalized_by_lapse == 0 (the case completed by affirmation, not lapse)"

      - name: case_age_calendar_vs_court_days_variants
        grounds:
          - calculations.days_pending
          - entities.Case.fields.days_pending_calendar
          - entities.Case.fields.days_pending_court
        distinguishing_aspect: |
          Case-domain dual variant (different entity domain than the Court pace
          instance): one filed case measured at clock 2026-09-11 yields
          days_pending_calendar 10 but days_pending_court 8, because the
          COURT_DAYS variant drops the weekend of 2026-09-05/06.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z (a Tuesday). One non-detained case filed at that instant; clock then advanced to Friday 2026-09-11T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-AGE", name: "Age Court", city: "Boise", annual_completion_goal: 50, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "A-1", respondent_full_name: "R Age", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "Case.${case_id}.filed_at == \"2026-09-01T00:00:00Z\""
            - "Case.${case_id}.days_pending_calendar == 10"
            - "Case.${case_id}.days_pending_court == 8 (weekend 2026-09-05/06 excluded)"
            - "Case.${case_id}.days_pending_calendar != Case.${case_id}.days_pending_court for identical filed_at and clock"
            - "Case.${case_id}.is_past_goal == false (10 < 365 NON_DETAINED target)"
            - "Case.${case_id}.target_completion_date == \"2027-09-01T00:00:00Z\""

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_three_input_interaction
        grounds:
          - calculations.case_priority_score
          - entities.Case.fields.priority_score
        distinguishing_aspect: |
          Mode (a) — a formula with 3 inputs and non-linear interaction: the
          custody step (+1000 only when DETAINED), the age term capped by
          min(days, 720), and the continuance drag capped by min(count, 4). At
          identical age (10 days, 0 continuances) the detained case scores 1020
          while the non-detained case scores 20 — the custody branch contributes
          exactly the 1000-point step and nothing else.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Two cases filed at that instant in one court: one DETAINED, one NON_DETAINED; both PRO_SE, English, no interpreter. Clock advanced to 2026-09-11 before the read."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-PRI", name: "Priority Court", city: "El Paso", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "D-1", respondent_full_name: "R Det", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_d: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "N-1", respondent_full_name: "R Non", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_n: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "GET /eoir/cases/${case_d}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/cases/${case_n}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "Case.${case_d}.priority_score == 1020 (1000 detained base + 2*min(10,720) age - 25*min(0,4) drag)"
            - "Case.${case_n}.priority_score == 20 (0 base + 20 age - 0 drag)"
            - "Case.${case_d}.priority_score - Case.${case_n}.priority_score == 1000 exactly (custody step)"
            - "Case.${case_d}.is_past_goal == false (10 < 60) and Case.${case_n}.is_past_goal == false (10 < 365)"

      - name: hearing_block_rounding_then_sum_order
        grounds:
          - calculations.hearing_duration_and_daily_load
          - entities.Hearing.fields.duration_minutes
        distinguishing_aspect: |
          Mode (b) — nested rounding where the pinned order is observable: a
          COUNSEL_RETAINED non-detained merits hearing computes raw 120 * 0.8 =
          96 minutes but is stored as a 105-minute block (ceil to 15 BEFORE any
          aggregation), so scheduled_end is 11:45, not 11:36; and the judge's
          daily load sums the rounded blocks (105 + 105 = 210 > 120 rejects),
          not the raw minutes (which would sum to 192).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court, one judge (cap 5 cases). Two COUNSEL_RETAINED non-detained English cases both driven to MERITS. Case R1 schedules its merits hearing 2026-09-04T10:00; case R2 then attempts the same judge at 11:45 the same day."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-RND", name: "Rounding Court", city: "Tucson", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Round", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "R-1", respondent_full_name: "R One", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "COUNSEL_RETAINED", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_r1: $.data.id }
            - call: "POST /eoir/cases/${case_r1}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r1_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_r1}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${r1_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r1_master: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "R-2", respondent_full_name: "R Two", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "COUNSEL_RETAINED", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_r2: $.data.id }
            - call: "POST /eoir/cases/${case_r2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r2_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_r2}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T11:00:00Z", expected_case_version: "${r2_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r2_master: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${r1_master}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T11:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${r2_master}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_r1}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r1_v4: $.data.version }
            - call: "GET /eoir/cases/${case_r2}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r2_v4: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_r1}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-04T10:00:00Z", expected_case_version: "${r1_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { r1_merits: $.data.id, r1_merits_dur: $.data.duration_minutes, r1_merits_end: $.data.scheduled_end }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_r2}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-04T11:45:00Z", expected_case_version: "${r2_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "Hearing.${r1_merits}.duration_minutes == 105 (raw 120*0.8 = 96 ceiled to the next 15-minute block BEFORE storage)"
            - "Hearing.${r1_merits}.scheduled_end == \"2026-09-04T11:45:00Z\" (not 11:36, the raw-minute answer)"
            - "the second merits call is rejected with 409 and error_id == ERR_JUDGE_DAILY_MINUTES_EXCEEDED (105 + 105 = 210 > 120 under round-then-sum)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_appeal_remand_cycle_traversed_twice
        grounds:
          - state_machines.Case.MERITS_to_DECIDED
          - state_machines.Case.DECIDED_to_APPEALED
          - state_machines.Case.APPEALED_to_MERITS
        distinguishing_aspect: |
          Case is cyclic: MERITS -> DECIDED -> APPEALED -> MERITS is a full loop
          (not a DAG branch). The loop is traversed TWICE; after the second
          remand the case is again MERITS, exactly two decisions and two appeals
          exist, and each remand auto-created a merits hearing at clock + 42 days.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court, one judge (cap 5), one PRO_SE English non-detained case driven through the full merits cycle. First decision REMOVAL is appealed and REMANDED; the auto-created remand hearing is completed and a second decision (GRANT_RELIEF) is appealed and REMANDED again."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-CYC", name: "Cycle Court", city: "Denver", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Looper", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "C-1", respondent_full_name: "R Cyc", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_m1: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_m1}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v4: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-04T10:00:00Z", expected_case_version: "${case_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_i1: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_i1}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v5: $.data.version }
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v5}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { dec1_id: $.data.id }
            - call: "POST /eoir/appeals"
              payload: { decision_id: "${dec1_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { app1_id: $.data.id }
            - call: "POST /eoir/appeals/${app1_id}/decide"
              payload: { ruling: "REMANDED", remand_instructions: "Reassess country-conditions evidence" }
              as: BoardMember
              as_user_id: "bm-01"
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T12:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/hearings"
              payload: { case_id: "${case_id}", status: "SCHEDULED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_rem1: "$.data[0].id" }
            - call: "POST /eoir/hearings/${h_rem1}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v8: $.data.version }
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "GRANT_RELIEF", expected_case_version: "${case_v8}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { dec2_id: $.data.id }
            - call: "POST /eoir/appeals"
              payload: { decision_id: "${dec2_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { app2_id: $.data.id }
          trigger:
            - call: "POST /eoir/appeals/${app2_id}/decide"
              payload: { ruling: "REMANDED", remand_instructions: "Reopen the record for new evidence" }
              as: BoardMember
              as_user_id: "bm-01"
          assert:
            - "after the first remand the case returned to MERITS and the first auto-created merits hearing had scheduled_start == \"2026-10-16T12:00:00Z\" (clock 2026-09-04T12:00 + 42 days) with auto_created == true"
            - "Decision.${dec1_id}.status == REMANDED and Decision.${dec2_id}.status == REMANDED after the second ruling"
            - "Case.${case_id}.status == MERITS after the second remand — the cycle MERITS -> DECIDED -> APPEALED -> MERITS completed twice"
            - "GET /eoir/decisions?case_id=${case_id} returns exactly 2 rows"
            - "GET /eoir/appeals?case_id=${case_id} returns exactly 2 rows"
            - "the second remand auto-created an INDIVIDUAL_MERITS hearing at 2026-11-27T12:00:00Z (clock 2026-10-16T12:00 + 42 days) with auto_created == true and supersedes_hearing_id null"

      - name: hearing_branching_divergent_side_effects
        grounds:
          - state_machines.Hearing.SCHEDULED_to_COMPLETED
          - state_machines.Hearing.SCHEDULED_to_CONTINUED
        distinguishing_aspect: |
          Hearing (a different entity than the cyclic Case) forks from SCHEDULED:
          the COMPLETED branch advances the case CALENDAR -> MERITS and creates
          nothing, while the CONTINUED branch (continuance grant) leaves the case
          in CALENDAR and auto-creates a superseding hearing at +28 days. Same
          from-state, divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court, one judge (cap 5), two PRO_SE English non-detained cases each with a SCHEDULED master hearing on 2026-09-03 (10:00 for case A, 11:00 for case B). Case B has a PENDING EVIDENCE_GATHERING continuance filed at 2026-09-01 (lead time satisfied)."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-BRN", name: "Branch Court", city: "Fresno", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
