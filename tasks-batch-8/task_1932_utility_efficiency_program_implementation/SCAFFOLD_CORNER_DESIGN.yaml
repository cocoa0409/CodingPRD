          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request without X-User-Role/X-User-ID returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /efficiency/programs"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED when headers missing (test harness omits headers in raw call)"

      - name: wrong_role_unauthorized
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Contractor attempting ProgramManager-only endpoint (POST /efficiency/programs) returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["One contractor exists"]
