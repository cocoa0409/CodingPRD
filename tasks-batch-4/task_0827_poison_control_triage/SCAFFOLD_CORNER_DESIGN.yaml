  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_case_version_on_second_assessment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[risk-assessment-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "After a first risk-assessment create advances the case version, a second create carrying the pre-advance expected_case_version returns ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["A triaged case; the version observed at triage is reused (deliberately stale) on the second create."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "the first create succeeded; trigger response error_id == ERR_STALE_CASE_VERSION (412)"

      - name: consult_close_cascade_reref
        claim_type: cascading_side_effects
        grounds: [state_machines.FacilityConsult.ACTIVE_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / consult_close_cascade_depth3
          rationale: "The full consult-close -> re-score -> RiskAssessment -> case escalation cascade is asserted by the named §1.8 instance."

