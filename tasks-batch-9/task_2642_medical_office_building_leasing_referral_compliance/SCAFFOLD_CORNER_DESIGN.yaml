  # ===========================================================================
  - section: rbac
    instances:

      - name: every_role_is_refused_another_roles_exclusive_operation
        claim_type: exclusive_operation_denial
        grounds:
          - roles
          - validations[2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Seven cross-role attempts are all refused with 403 ERR_UNAUTHORIZED, including PortfolioAdmin — the role that owns the reference data and the clock — being refused a mix-freeze and a certification, which proves the model is peer segregation of duties and not a hierarchy with an admin override."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite, one tenant, one DRAFT lease with a SIGNED_LEASE attestation and one PROCEDURE TI project, each created by its owning role."
            - "The seven denied attempts are specified in full (method, path, body, X-User-Role) in the assert lines rather than as structured trigger calls, because §1.5 admits no wrong-role call and the structured form cannot express one; the trigger below carries only the legal reads that prove none of the seven attempts left a trace."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { r1_b_id: $.data.id, r1_b_v: $.data.version }
            - call: "POST /buildings/${r1_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { r1_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568571" }
              as: PortfolioAdmin
              captures: { r1_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${r1_b_id}", suite_id: "${r1_s_id}", tenant_id: "${r1_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { r1_l_id: $.data.id }
            - call: "POST /leases/${r1_l_id}/compliance-attestations"
              payload: { attestation_type: "SIGNED_LEASE", on_file: true, document_reference: "LSE-2642-0070" }
              as: LeasingAgent
            - call: "POST /leases/${r1_l_id}/ti-projects"
              payload: { suite_id: "${r1_s_id}", target_suite_class: "PROCEDURE", power_amps_requested: 120, medical_gas_requested: false, authorized_allowance_total: 100000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { r1_p_id: $.data.id }
          trigger:
            - call: "GET /leases/${r1_l_id}"
              payload: {}
              as: FacilitiesEngineer
            - call: "GET /buildings/${r1_b_id}"
              payload: {}
              as: FacilitiesEngineer
            - call: "GET /ti-projects/${r1_p_id}"
              payload: {}
              as: TenantPortalUser
              as_user_id: "${r1_t_id}"
            - call: "GET /leases"
              payload: { building_id: "${r1_b_id}" }
              as: PropertyManager
            - call: "GET /parking-allocations"
              payload: { building_id: "${r1_b_id}" }
              as: PropertyManager
          assert:
            - "POST /buildings {name: 'Rogue Tower', total_rentable_sf: 50000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 100} with X-User-Role: LeasingAgent returns 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "POST /leases {building_id: ${r1_b_id}, suite_id: ${r1_s_id}, tenant_id: ${r1_t_id}, lease_type: 'DIRECT', term_start: '2027-01-01', term_end: '2030-12-31', base_rent_psf_annual: 30.00} with X-User-Role: PropertyManager returns 403 ERR_UNAUTHORIZED"
            - "POST /leases/${r1_l_id}/certify-fmv {certification_note: 'Portfolio admin trying to certify'} with X-User-Role: PortfolioAdmin returns 403 ERR_UNAUTHORIZED"
            - "POST /buildings/${r1_b_id}/mix-freeze {frozen: true, reason: 'Portfolio admin trying to freeze the mix'} with X-User-Role: PortfolioAdmin returns 403 ERR_UNAUTHORIZED — the role that creates the building cannot freeze its mix, so there is no hierarchical override"
            - "POST /leases/${r1_l_id}/commence {commencement_note: 'Leasing agent trying to hand over keys'} with X-User-Role: LeasingAgent returns 403 ERR_UNAUTHORIZED"
            - "POST /ti-projects/${r1_p_id}/reviews {review_type: 'UTILITY', decision: 'APPROVE'} with X-User-Role: LeasingAgent returns 403 ERR_UNAUTHORIZED — the role that opened the project cannot sign off its own engineering"
            - "POST /parking-allocations {expected_building_version: ${r1_b_v}, building_id: ${r1_b_id}, lease_id: ${r1_l_id}, category: 'STAFF', stall_count: 10} with X-User-Role: LeasingAgent returns 403 ERR_UNAUTHORIZED"
            - "Every one of the seven returns 403 before any state, precondition or OCC check runs — the certify attempt is refused on role, not on ERR_INVALID_LEASE_STATE, even though the lease is in DRAFT rather than PENDING_FMV_REVIEW"
            - "Lease.${r1_l_id}.status is still DRAFT with fmv_certified_by_user_id == null, and Building.${r1_b_id}.tenant_mix_posture is not FROZEN"
            - "Building.${r1_b_id}.staff_allocated_stalls == 0, unallocated_stalls == 400 and version == ${r1_b_v} — the refused allocation neither allocated nor bumped the version"
            - "GET /leases?building_id=${r1_b_id} returns meta.total_count == 1 and GET /parking-allocations?building_id=${r1_b_id} returns meta.total_count == 0"
            - "FacilitiesEngineer's two GETs and the tenant's own project GET all return 200: every GET in §1.5 is open to all six roles"

      - name: absent_or_unknown_identity_headers_are_refused_before_authorization
        claim_type: authentication
        grounds:
          - validations[1]
          - validations[2]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 answers before priority 2: a request with no X-User-Role, a request with no X-User-ID and a request carrying an undeclared role string all return ERR_UNAUTHENTICATED (401) rather than ERR_UNAUTHORIZED (403), even when the endpoint would have refused the caller's role anyway."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite, created normally."
            - "The three malformed attempts are specified in full in the assert lines rather than as structured trigger calls, because a suppressed or undeclared X-User-Role cannot be written in the structured form; the trigger below carries only the fully-authenticated read that proves none of them took effect."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { r2_b_id: $.data.id }
            - call: "POST /buildings/${r2_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { r2_s_id: $.data.id }
          trigger:
            - call: "GET /buildings/${r2_b_id}/suites"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-001"
          assert:
            - "GET /buildings/${r2_b_id} issued with X-User-Role: PortfolioAdmin and NO X-User-ID header returns 401 with data.error_id == 'ERR_UNAUTHENTICATED'"
            - "GET /buildings/${r2_b_id} issued with X-User-ID: admin-001 and NO X-User-Role header returns 401 ERR_UNAUTHENTICATED"
            - "POST /buildings/${r2_b_id}/suites {suite_number: '999', floor: 9, rentable_sf: 1000, suite_class: 'STANDARD_EXAM', power_amps_available: 100} issued with X-User-ID: admin-001 and X-User-Role set to the undeclared string 'BuildingEngineer' returns 401 ERR_UNAUTHENTICATED and NOT 403 ERR_UNAUTHORIZED — an unknown role is an authentication failure, not an authorization one, even though the body is otherwise valid for the one role that owns this endpoint"
            - "The trigger's fully-authenticated GET /buildings/${r2_b_id}/suites returns 200 with meta.total_count == 1, confirming suite 999 was never created"
            - "Priority 1 answers before priority 3 as well: the same undeclared-role request with an empty body still returns ERR_UNAUTHENTICATED rather than ERR_INVALID_REQUEST"

