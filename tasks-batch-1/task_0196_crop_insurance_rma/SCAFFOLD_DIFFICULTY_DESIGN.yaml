              payload: { name: "Adjuster", license_number: "ADJ-12", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P12", tax_id: "TX-12" }
              as: RmaAdmin
