  - name: claim_create_under_unknown_employee_returns_employee_not_found
    claim_type: Parent Relationships
    grounds:
    - entities.Claim.fields.employee_id
    - validations[priority=4]
    - errors[ERR_EMPLOYEE_NOT_FOUND]
    distinguishing_aspect: The nested create path validates its parent id first, so posting a claim under an unused employee UUID returns 404 ERR_EMPLOYEE_NOT_FOUND rather than creating an orphan.
    test_recipe:
      setup:
      - Empty database apart from the clock reset.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /rtw/employees/00000000-0000-4000-8000-000000000000/claims
        payload:
          claim_number: CLM-2201
          adjuster_user_id: adj-001
          injury_date: '2026-06-15'
        as: ProgramAdmin
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_EMPLOYEE_NOT_FOUND
      - HTTP status == 404
  - name: placement_create_with_unknown_job_id_returns_job_not_found
    claim_type: Not Found
    grounds:
    - entities.Placement.fields.transitional_job_id
    - validations[priority=5]
    - errors[ERR_JOB_NOT_FOUND]
    distinguishing_aspect: Body foreign keys are resolved at priority 5, so a placement naming an unused transitional_job_id returns 404 ERR_JOB_NOT_FOUND before any state or safety rule runs.
    test_recipe:
      setup:
      - One ACTIVE RestrictionSet on an RTW_ELIGIBLE claim.
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
      - call: POST /rtw/employees/${emp_id}/claims
        payload:
          claim_number: CLM-2201
          adjuster_user_id: adj-001
          injury_date: '2026-06-15'
        as: ProgramAdmin
        captures:
          claim_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/adjuster-authorization
        payload:
          max_authorized_weekly_cost_cents: 150000
          claim_status_directive: RTW_ELIGIBLE
        as: ClaimAdjuster
