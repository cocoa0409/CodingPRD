  - rule_id: boundary_precision_check
    instances:

      - name: nurse_acuity_exactly_at_capacity_admitted_then_one_point_over_refused
        grounds:
          - calculations.nurse_acuity_load
          - calculations.staggered_start_assignment
          - entities.Nurse.fields.assigned_acuity_points
          - entities.Nurse.fields.acuity_capacity_points
          - errors.ERR_NURSE_ACUITY_EXCEEDED
        distinguishing_aspect: |
          The per-slot acuity comparison is `load + acuity_points <= capacity`, so a load of
          exactly 6 against a capacity of 6 must be ADMITTED and a load of 9 must be
          refused. Three chairs are free the whole time and every one of the nine candidate
          starts has an eligible chair, so the only thing that can refuse the third booking
          is the acuity ceiling — and the specific error must be ERR_NURSE_ACUITY_EXCEEDED
          rather than ERR_NO_CHAIR_CAPACITY, which is the fallback an off-by-one or a
          mis-ordered empty-pool cascade would produce.
        test_recipe:
          setup:
            - "One center open 480-1140, stagger grid 15, acuity slots of 30 minutes, turnover buffer 15."
            - "THREE available chairs A1, A2, A3 — chair supply is deliberately not the binding constraint."
            - "Exactly ONE active nurse on shift 480-1140 with acuity_capacity_points 6."
            - "Drug One at acuity 2; the MID template therefore carries acuity_points 2 and every first-dose booking costs 3 acuity points."
            - "Three patients each on their own six-cycle 10 mg/kg plan (dose_mg 700.0 -> MID -> 240-minute window)."
            - "Patients One and Two are booked first at requested_start 540, landing on A1 and A2 and taking the nurse's slot load to exactly 3 then exactly 6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A2", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
