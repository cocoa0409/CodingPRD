# =============================================================================
# Task 0623 — Dermatology Practice — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances each (>=18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every assert numeric literal was computed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: charge_split_insurance_vs_cash_diverge
        grounds:
          - calculations.charge_patient_responsibility
          - entities.Charge.fields.patient_responsibility_cents
          - entities.Encounter.fields.pay_path
        distinguishing_aspect: |
          On the Charge entity domain, the INSURANCE variant (deductible
          waterfall + 20% coinsurance) and the CASH variant (10% prompt-pay
          discount on billed) yield different patient_responsibility_cents for
          comparable inputs: an INSURANCE charge with allowed=10000, deductible
          already 0 -> 2000; a CASH charge billed=15000 -> 13500.
        test_recipe:
          setup:
            - "Insured patient P_ins: has_active_insurance=true, coinsurance 0.2, deductible_remaining 0."
            - "Cash patient P_cash: has_active_insurance=false."
            - "Each has one CLINICALLY_CLOSED-or-open MEDICAL encounter, BILLING_OPEN."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Derm", npi: "NPI-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ins Pat", date_of_birth: "1980-01-01", has_active_insurance: true, insurance_coinsurance_rate: 0.2, insurance_deductible_remaining_cents: 0 }
              as: FrontDesk
              captures: { p_ins_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cash Pat", date_of_birth: "1980-02-02", has_active_insurance: false }
              as: FrontDesk
              captures: { p_cash_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${p_ins_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-02T09:00:00Z" }
              as: FrontDesk
              captures: { enc_ins_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${p_cash_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-02T10:00:00Z" }
              as: FrontDesk
              captures: { enc_cash_id: $.data.id }
          trigger:
            - call: "POST /charges"
              payload: { patient_id: "${p_ins_id}", encounter_id: "${enc_ins_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 10000, insurer_allowed_cents: 10000 }
              as: BillingSpecialist
              captures: { ch_ins_id: $.data.id }
            - call: "POST /charges"
              payload: { patient_id: "${p_cash_id}", encounter_id: "${enc_cash_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 15000 }
              as: BillingSpecialist
              captures: { ch_cash_id: $.data.id }
          assert:
            - "Charge.${ch_ins_id}.patient_responsibility_cents == 2000"
            - "Charge.${ch_ins_id}.insurer_responsibility_cents == 8000"
            - "Charge.${ch_cash_id}.patient_responsibility_cents == 13500"
            - "Charge.${ch_cash_id}.insurer_responsibility_cents == 0"

      - name: membership_redemption_silver_vs_gold_diverge
        grounds:
          - calculations.cosmetic_redemption_split
          - entities.CosmeticTreatment.fields.redeemed_cents
          - entities.CosmeticMembership.fields.tier
        distinguishing_aspect: |
          On the CosmeticMembership/CosmeticTreatment domain (distinct from the
          Charge ledger), the SILVER variant (5% tier discount) and GOLD variant
          (15%) produce different redeemed_cents for list=20000 against an
          ample wallet: SILVER redeems 19000, GOLD redeems 17000.
        test_recipe:
          setup:
            - "Patient P with one COSMETIC encounter (BILLING_OPEN, CASH forced)."
            - "One SILVER membership activated with ample wallet, one GOLD membership activated with ample wallet."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Cosmo", npi: "NPI-2", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cos Pat", date_of_birth: "1985-03-03" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "COSMETIC", scheduled_at: "2026-01-03T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "SILVER", purchased_unit_cents: 100000 }
              as: BillingSpecialist
              captures: { mem_s_id: $.data.id }
            - call: "POST /cosmetic-memberships/${mem_s_id}/activate"
              payload: {}
              as: BillingSpecialist
              captures: { mem_s_v: $.data.version }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "GOLD", purchased_unit_cents: 100000 }
              as: BillingSpecialist
              captures: { mem_g_id: $.data.id }
            - call: "POST /cosmetic-memberships/${mem_g_id}/activate"
              payload: {}
              as: BillingSpecialist
              captures: { mem_g_v: $.data.version }
          trigger:
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_s_id}", service_name: "filler", list_price_cents: 20000, expected_membership_version: "${mem_s_v}" }
              as: BillingSpecialist
              captures: { t_s_id: $.data.id }
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_g_id}", service_name: "filler", list_price_cents: 20000, expected_membership_version: "${mem_g_v}" }
              as: BillingSpecialist
              captures: { t_g_id: $.data.id }
          assert:
            - "CosmeticTreatment.${t_s_id}.redeemed_cents == 19000"
            - "CosmeticTreatment.${t_s_id}.out_of_pocket_cents == 0"
            - "CosmeticTreatment.${t_g_id}.redeemed_cents == 17000"
            - "CosmeticTreatment.${t_g_id}.out_of_pocket_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: biologic_charge_tiered_with_resubmission_stepdown
        grounds:
          - calculations.biologic_charge_amount
          - entities.PriorAuthorization.fields.submission_round
          - entities.Charge.fields.billed_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (list_price, submission_round, admin uplift cap)
          with nested max-floor and min-cap branches. A PA approved on its 2nd
          submission round (list 100000) yields billed_amount 98800
          (allowed 95000 + uplift 3800), differing from a 1st-round approval's
          104000 purely through the round-stepdown branch.
        test_recipe:
          setup:
            - "Patient P with a BIOLOGIC-eligible MEDICAL encounter (BILLING_OPEN)."
            - "PriorAuthorization PA: list 100000, required_step_count 1, approved on submission_round 2 (denied once, resubmitted with a second FAILED step trial)."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Bio", npi: "NPI-3", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Bio Pat", date_of_birth: "1979-04-04", has_active_insurance: true, insurance_coinsurance_rate: 0.0, insurance_deductible_remaining_cents: 0 }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-04T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "biologic-X", required_step_count: 1, list_price_cents: 100000 }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /prior-authorizations/${pa_id}/step-therapy-trials"
              payload: { drug_name: "old-drug-1", outcome: "FAILED" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/adjudicate"
              payload: { decision: "DENY" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/step-therapy-trials"
              payload: { drug_name: "old-drug-2", outcome: "FAILED" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: BillingSpecialist
          trigger:
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "BIOLOGIC", billed_amount_cents: 98800, insurer_allowed_cents: 98800, prior_auth_id: "${pa_id}" }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
          assert:
            - "PriorAuthorization.${pa_id}.submission_round == 2"
            - "PriorAuthorization.${pa_id}.status == APPROVED"
            - "Charge.${ch_id}.billed_amount_cents == 98800"
            - "Charge.${ch_id}.status == POSTED"

      - name: deductible_waterfall_round_per_charge_not_sum_then_round
        grounds:
          - calculations.deductible_waterfall
          - entities.Patient.fields.insurance_deductible_remaining_cents
          - entities.Charge.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b): rounding order is load-bearing. Two INSURANCE charges, each
          allowed 502 with coinsurance 0.25 and deductible already 0, round
          per-charge to 126 each (sum 252). A sum-then-round implementation
          would compute round(1004*0.25)=251, a 1-cent divergence the pinned
          round-per-charge order avoids.
        test_recipe:
          setup:
            - "Insured patient: coinsurance 0.25, deductible_remaining 0."
            - "One MEDICAL encounter, BILLING_OPEN."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Round", npi: "NPI-4", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Round Pat", date_of_birth: "1975-05-05", has_active_insurance: true, insurance_coinsurance_rate: 0.25, insurance_deductible_remaining_cents: 0 }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-05T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 502, insurer_allowed_cents: 502 }
              as: BillingSpecialist
              captures: { ch1_id: $.data.id }
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "PROCEDURE", billed_amount_cents: 502, insurer_allowed_cents: 502 }
              as: BillingSpecialist
              captures: { ch2_id: $.data.id }
          assert:
            - "Charge.${ch1_id}.patient_responsibility_cents == 126"
            - "Charge.${ch2_id}.patient_responsibility_cents == 126"
            - "Charge.${ch1_id}.patient_responsibility_cents + Charge.${ch2_id}.patient_responsibility_cents == 252"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prior_auth_cyclic_resubmission_after_denial
        grounds:
          - state_machines.PriorAuthorization.SUBMITTED_to_DENIED
          - state_machines.PriorAuthorization.DENIED_to_SUBMITTED
          - entities.PriorAuthorization.fields.submission_round
        distinguishing_aspect: |
          The PriorAuthorization machine is cyclic: SUBMITTED->DENIED->SUBMITTED
          re-enters a state already visited, and submission_round increments to 2
          on the second SUBMITTED entry — proving the loop on the PA entity, not
          a forward-only pipeline.
        test_recipe:
          setup:
            - "PA with required_step_count 1, one FAILED step trial, submitted then denied."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cyc Pat", date_of_birth: "1970-06-06" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "biologic-Y", required_step_count: 1, list_price_cents: 50000 }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /prior-authorizations/${pa_id}/step-therapy-trials"
              payload: { drug_name: "step-1", outcome: "FAILED" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/adjudicate"
              payload: { decision: "DENY" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa_id}/step-therapy-trials"
              payload: { drug_name: "step-2", outcome: "FAILED" }
              as: BillingSpecialist
          trigger:
            - call: "POST /prior-authorizations/${pa_id}/submit"
              payload: {}
              as: BillingSpecialist
              captures: { pa_status: $.data.status }
          assert:
            - "PriorAuthorization.${pa_id}.status == SUBMITTED"
            - "PriorAuthorization.${pa_id}.submission_round == 2"

      - name: encounter_parallel_clinical_and_billing_dimensions
        grounds:
          - state_machines.Encounter.IN_PROGRESS_to_CLINICALLY_CLOSED
          - state_machines.Encounter.BILLING_OPEN_to_BILLING_FINALIZED
          - entities.Encounter.fields.clinical_status
          - entities.Encounter.fields.billing_status
        distinguishing_aspect: |
          The Encounter carries two independent state axes: driving
          clinical_status to CLINICALLY_CLOSED leaves billing_status at
          BILLING_OPEN until a separate finalize-billing call advances it —
          the two dimensions evolve independently on one Encounter row.
        test_recipe:
          setup:
            - "MEDICAL encounter checked in, started (IN_PROGRESS), no open biopsies."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Par", npi: "NPI-5", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Par Pat", date_of_birth: "1981-07-07" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-06T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /encounters/${enc_id}/clinical-close"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /encounters/${enc_id}/finalize-billing"
              payload: {}
              as: BillingSpecialist
              captures: { bill_status: $.data.billing_status }
          assert:
            - "Encounter.${enc_id}.clinical_status == CLINICALLY_CLOSED"
            - "Encounter.${enc_id}.billing_status == BILLING_FINALIZED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: malignant_signout_cascade_depth3
        grounds:
          - state_machines.Biopsy.RESULTED_to_SIGNED_OUT
          - state_machines.RecallReminder.PENDING_to_DISMISSED
          - entities.RecallReminder.fields.reason
        distinguishing_aspect: |
          Depth-3 cascade from biopsy sign-out: sign-out sets Biopsy.recall_months
          (link1) -> spawns a BIOPSY_FOLLOWUP RecallReminder (link2, caused by
          link1's sign-out) -> because result==MALIGNANT, creating that reminder
          supersedes and DISMISSES the patient's pre-existing PENDING
          ROUTINE_SKIN_CHECK reminder (link3, caused by link2's malignant spawn).
        test_recipe:
          setup:
            - "Clock at 2026-02-01. Patient has a pre-existing PENDING ROUTINE_SKIN_CHECK recall."
            - "A MEDICAL encounter IN_PROGRESS with a biopsy COLLECTED -> AT_LAB -> RESULTED(MALIGNANT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Mal", npi: "NPI-6", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Mal Pat", date_of_birth: "1968-08-08" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /recall-reminders"
              payload: { patient_id: "${pat_id}", reason: "ROUTINE_SKIN_CHECK", due_at: "2027-02-01T00:00:00Z" }
              as: FrontDesk
              captures: { routine_recall_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-02-01T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies"
              payload: { encounter_id: "${enc_id}", body_site: "left-cheek" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { biopsy_id: $.data.id }
            - call: "POST /biopsies/${biopsy_id}/send-to-lab"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies/${biopsy_id}/result"
              payload: { result: "MALIGNANT" }
              as: PathLab
          trigger:
            - call: "POST /biopsies/${biopsy_id}/sign-out"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { recall_months: $.data.recall_months }
          assert:
            - "Biopsy.${biopsy_id}.recall_months == 3"
            - "Biopsy.${biopsy_id}.status == SIGNED_OUT"
            - "RecallReminder.${routine_recall_id}.status == DISMISSED"
            - "A new RecallReminder with reason == BIOPSY_FOLLOWUP and biopsy_id == ${biopsy_id} exists with status == PENDING (discoverable via GET /recall-reminders?biopsy_id=${biopsy_id})"

      - name: void_billing_cascade_charge_then_deductible_depth3
        grounds:
          - state_machines.Encounter.BILLING_OPEN_to_BILLING_VOID
          - state_machines.Charge.POSTED_to_VOIDED
          - entities.Patient.fields.insurance_deductible_remaining_cents
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (encounter void-billing):
          void-billing flips Encounter.billing_status->BILLING_VOID (link1) ->
          its child POSTED INSURANCE Charge -> VOIDED (link2, caused by link1) ->
          that charge's void restores Patient.insurance_deductible_remaining_cents
          by its deductible_applied_cents (link3, caused by link2).
        test_recipe:
          setup:
            - "Insured patient, coinsurance 0.2, deductible_remaining 5000."
            - "A MEDICAL encounter CANCELLED (so void-billing is permitted) but first an INSURANCE charge allowed=20000 was posted while BILLING_OPEN, consuming 5000 deductible."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Void", npi: "NPI-7", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Void Pat", date_of_birth: "1972-09-09", has_active_insurance: true, insurance_coinsurance_rate: 0.2, insurance_deductible_remaining_cents: 5000 }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-07T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 20000, insurer_allowed_cents: 20000 }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
            - call: "POST /encounters/${enc_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /encounters/${enc_id}/void-billing"
              payload: {}
              as: BillingSpecialist
              captures: { enc_billing: $.data.billing_status }
          assert:
            - "Encounter.${enc_id}.billing_status == BILLING_VOID"
            - "Charge.${ch_id}.status == VOIDED"
            - "Patient.${pat_id}.insurance_deductible_remaining_cents == 5000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: occ_state_beats_room_temporal_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - concurrency_rules[booking-create-stale-room]
        distinguishing_aspect: |
          Error-category pair {state(OCC, priority 5)} vs
          {business_temporal(room overlap, priority 10)}: a booking that is BOTH
          stale-versioned AND geometrically overlapping returns
          ERR_STALE_ROOM_VERSION (412), the higher-priority state check, not
          ERR_ROOM_INTERVAL_CONFLICT (409).
        test_recipe:
          setup:
            - "A STANDARD room with one BOOKED interval [10:00,11:00). Client holds the room's pre-first-booking version (stale)."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Slot", npi: "NPI-8", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Slot Pat", date_of_birth: "1990-10-10" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-08T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Suite STD", room_kind: "STANDARD", turnover_buffer_minutes: 0 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /procedure-bookings"
              payload: { room_id: "${room_id}", provider_id: "${prov_id}", encounter_id: "${enc_id}", procedure_kind: "EXCISION", start_at: "2026-01-08T10:00:00Z", end_at: "2026-01-08T11:00:00Z", expected_room_version: "${room_v0}" }
              as: FrontDesk
              captures: { booking1_id: $.data.id }
          trigger:
            - call: "POST /procedure-bookings"
