            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, fy_start_date: "2026-01-01", fy_end_date: "2026-12-31", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
