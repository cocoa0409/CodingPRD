      - name: sales_planner_cannot_file_permit_rejected
        claim_type: rbac_exclusive_denial
        grounds: [roles.SalesPlanner, roles.ComplianceOfficer, "validations[priority=2]"]
        distinguishing_aspect: "Permit filing is exclusive to ComplianceOfficer; SalesPlanner is denied before existence checks run."
