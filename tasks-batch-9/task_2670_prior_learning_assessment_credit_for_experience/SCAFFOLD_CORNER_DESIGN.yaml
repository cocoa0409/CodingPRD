            - "S-1002 audit: total_credits_applied == 120, residency_satisfied == true, audit_status == ELIGIBLE"
            - "both audits report pla_credits_posted == 0, pla_credits_reserved == 0 and pla_credits_awarded == 0"
            - "both audits report effective_pla_cap_credits == 30, pla_cap_remaining_posted_only == 30 and pla_cap_remaining_reserved_inclusive == 30"
            - "both audits report upper_division_pla_posted == 0 and upper_division_remaining == 6"
            - "neither audit_status is PLA_CAP_VIOLATION or RESIDENCY_DEFICIENT"

      - name: coverage_input_set_excludes_a_deleted_artifact
        claim_type: input_set_filtering
        grounds:
          - calculations.outcome_coverage_score
          - entities.Portfolio.fields.artifact_count
          - endpoints[DELETE /portfolios/{portfolio_id}/artifacts/{artifact_id}]
          - endpoints[POST /portfolios/{portfolio_id}/submit]
        distinguishing_aspect: |
          A DRAFT portfolio holding an OC1 PRIMARY artifact and an OC2 SUPPORTING
          artifact would score provisional_coverage_bp 9000, but deleting the OC2
          artifact before submit yields exactly 8000 — the deleted row is gone from
          the input set while OC2 stays in the denominator contributing 0, and
          8000 still clears MIN_PROVISIONAL_COVERAGE_BP 5000.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 with OC1 weight_bp 8000 and OC2 weight_bp 2000, Student S-1001."
            - "A DRAFT PORTFOLIO claim with a DRAFT portfolio holding two artifacts: A1 mapping OC1 PRIMARY and A2 mapping OC2 SUPPORTING."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "SUPPORTING" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "DELETE /portfolios/${pf_id}/artifacts/${a2_id}"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { cov: "$.data.provisional_coverage_bp", cnt: "$.data.artifact_count" }
          assert:
            - "Portfolio.${pf_id}.artifact_count == 1 after the delete"
            - "GET /artifacts?portfolio_id=${pf_id} returns exactly 1 element, ${a1_id}"
            - "Portfolio.${pf_id}.provisional_coverage_bp == 8000, NOT 9000 — the deleted OC2 artifact contributes nothing"
            - "Portfolio.${pf_id}.status == SUBMITTED — 8000 >= MIN_PROVISIONAL_COVERAGE_BP 5000"
            - "the OC2 outcome remains in the denominator: 8000 == round_half_up((8000*10000 + 2000*0) / 10000)"
            - "PlaClaim.${claim_id}.assessment_status is still DRAFT — submitting the portfolio does not submit the claim"

      - name: fee_constants_by_source_type_place_credit_by_exam_in_the_lower_discount_tier
        claim_type: constants_applied
        grounds:
          - calculations.assessment_fee_invoice_total
          - entities.FeeInvoice.fields.lines
          - entities.FeeInvoice.fields.discount_bp
          - endpoints[POST /pla-claims/{claim_id}/submit]
          - endpoints[GET /fee-invoices]
        distinguishing_aspect: |
          A 6-credit CREDIT_BY_EXAM claim draws BASE_FEE_BY_SOURCE 5000 rather than
          the PORTFOLIO 15000, so its subtotal is 5000 + 2500*6 = 20000, which lands
          in DISCOUNT_TIER_1 (500 bp -> 1000 cents) and NOT in the 25000-cent
          TIER_2, giving total_cents 19000 with no artifact-tier line at all.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 (6 credits, LOWER), Student S-1001."
            - "CredentialRecommendation CLEP-CS (CREDIT_BY_EXAM, 6 credits, LOWER, effective_from 2026-06-01T00:00:00Z), PUBLISHED."
            - "ArticulationRule CLEP-CS -> CS150 awarding 6 credits, effective_from 2026-06-01T00:00:00Z, submitted by officer-reviewer and APPROVED by officer-approver."
            - "A CREDIT_BY_EXAM claim pinned to that rule with attempt_date 2026-06-15T00:00:00Z and no Portfolio."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computer Science", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id" }
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rule_id: "$.data.id" }
            - call: "POST /articulation-rules/${rule_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v1: "$.data.version" }
            - call: "POST /articulation-rules/${rule_id}/approve"
              payload: { expected_recommendation_version: "${rec_v1}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rule_pin: "$.data.pinned_recommendation_version" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "CREDIT_BY_EXAM", credits_requested: 6, articulation_rule_id: "${rule_id}", attempt_date: "2026-06-15T00:00:00Z" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_fee: "$.data.fee_status", claim_cov: "$.data.provisional_coverage_bp" }
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id", inv_sub: "$.data[0].subtotal_cents", inv_bp: "$.data[0].discount_bp", inv_total: "$.data[0].total_cents" }
          assert:
            - "CredentialRecommendation.${rec_id}.status == PUBLISHED and version == 2 and terms_version == 1"
            - "ArticulationRule.${rule_id}.status == APPROVED and pinned_recommendation_version == 1"
            - "FeeInvoice.${inv_id}.subtotal_cents == 20000 — BASE_FEE_BY_SOURCE[CREDIT_BY_EXAM] 5000 + PER_CREDIT_FEE_CENTS 2500 * 6"
            - "FeeInvoice.${inv_id}.lines contains no ARTIFACT_TIER_SURCHARGE line and no RUSH_SURCHARGE line"
            - "FeeInvoice.${inv_id}.discount_bp == 500 — 20000 clears DISCOUNT_TIER_1_MIN_CENTS 10000 but not DISCOUNT_TIER_2_MIN_CENTS 25000"
            - "FeeInvoice.${inv_id}.discount_cents == 1000 and total_cents == 19000 and balance_due_cents == 19000"
            - "PlaClaim.${claim_id}.fee_status == INVOICED and assessment_status == SUBMITTED"
            - "PlaClaim.${claim_id}.provisional_coverage_bp == 10000 — min(10000, round_half_up(6 * 10000 / 6)) for a non-PORTFOLIO source"
            - "Student.${stu_id}.pla_credits_reserved == 6"

      - name: fee_invoice_tiered_pricing_full_line_composition
        claim_type: tiered_pricing
        grounds:
          - calculations.assessment_fee_invoice_total
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_invoice_six_line_composition_with_discount_tier_reselection
          rationale: "That instance walks all six line types and both discount tiers, including the tier re-selection when the SLA credit line drops the subtotal, which is the tiered-pricing claim in full."

      - name: fee_invoice_rounding_precision_at_the_tier_edge
        claim_type: precision
        grounds:
          - calculations.assessment_fee_invoice_total
        excluded_because:
          difficulty_instance: boundary_precision_check / discount_tier_boundary_at_exactly_25000_cents_and_half_cent_round_half_up
          rationale: "Rounding mode and the inclusive 25000-cent tier edge are asserted there with a deliberate half-cent remainder."

      - name: buffered_window_interval_merge_semantics
        claim_type: interval_merge
        grounds:
          - calculations.assessor_buffered_window_conflict_count
          - calculations.articulation_window_overlap_check
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assessor_buffered_window_closed_endpoint_touch_conflicts_but_one_ms_later_does_not
          rationale: "Closed-interval padded overlap is asserted there and the opposite left-closed right-open geometry is asserted by articulation_half_open_adjacency_is_legal_while_one_ms_overlap_is_rejected."

      - name: verified_coverage_weighted_scoring_accumulation
        claim_type: weighted_scoring
        grounds:
          - calculations.outcome_coverage_score
        excluded_because:
          difficulty_instance: boundary_precision_check / verified_coverage_exactly_at_pass_threshold_passes_while_6999_twin_fails
          rationale: "Weight-times-ratio accumulation and the single final division are asserted there against a 7000/6999 twin pair."

      - name: cap_unblock_waterfall_first_fit_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.cap_unblock_waterfall
          - calculations.withdrawal_refund_settlement
        excluded_because:
          difficulty_instance: transitive_cascade / withdraw_cascade_waterfall_skips_oversized_then_unblocks_smaller_claim
          rationale: "First-fit by (created_at ASC, claim_number ASC) with an oversized candidate skipped and a later smaller one filled is exactly the waterfall claim."

      - name: capacity_and_coverage_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.program_pla_credit_capacity
          - calculations.outcome_coverage_score
        excluded_because:
          difficulty_instance: dual_variant_calc / pla_capacity_reserved_inclusive_vs_posted_only_divergence
          rationale: "Both dual-variant calculations are asserted with side-by-side deltas there and in coverage_provisional_self_reported_vs_assessor_verified_divergence."

      - name: coverage_variant_selected_by_lifecycle_position
        claim_type: variant_selection
        grounds:
          - calculations.outcome_coverage_score
        excluded_because:
          difficulty_instance: dual_variant_calc / coverage_provisional_self_reported_vs_assessor_verified_divergence
          rationale: "That instance shows the provisional variant applied at portfolio submit and the verified variant applied at assignment completion, with only the verified figure driving PASS/FAIL."

      - name: appeal_remand_variant_reconciliation_delta
        claim_type: reconciliation
        grounds:
          - calculations.assessment_fee_invoice_total
          - calculations.withdrawal_refund_settlement
        excluded_because:
          difficulty_instance: compensating_invariant / appeal_remand_fixed_refund_leaves_a_600_cent_discount_residue
          rationale: "The delta applied to the invoice ledger when the appeal line is removed is reconciled there down to the 600-cent residue."

  - section: validations
    instances:
      - name: clock_rewind_rejected_as_not_monotonic
        claim_type: violation_to_error
        grounds:
          - validations[priority 30].ERR_CLOCK_NOT_MONOTONIC
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Moving the logical clock forward returns previous_utc alongside the new
          value, but any attempt to set it to an earlier instant is refused with
          ERR_CLOCK_NOT_MONOTONIC (422) and the clock keeps its old value; setting
          it to the exact same instant is accepted because the rule is >=, not >.
        test_recipe:
          setup:
            - "A fresh instance whose logical clock is at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlaCoordinator
              captures: { c1_now: "$.data.current_utc", c1_prev: "$.data.previous_utc" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: PlaCoordinator
          assert:
            - "the setup call returned current_utc == 2026-08-05T00:00:00Z and previous_utc == 2026-08-01T00:00:00Z"
            - "the trigger returns status 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "a following POST /_clock/set_current_utc {current_utc: 2026-08-05T00:00:00Z} returns 200 with current_utc == previous_utc == 2026-08-05T00:00:00Z — equality is allowed"
            - "a following POST /_clock/set_current_utc {current_utc: 2026-08-05T00:00:01Z} returns 200, proving the clock was never rewound by the rejected call"

      - name: duplicate_active_claim_rejected_unless_it_supersedes_a_withdrawn_one
        claim_type: conditional_validation
        grounds:
          - validations[priority 30].ERR_DUPLICATE_CLAIM
          - entities.PlaClaim.fields.supersedes_claim_id
          - endpoints[POST /pla-claims]
        distinguishing_aspect: |
          A second claim for the same (student, course) is refused with
          ERR_DUPLICATE_CLAIM (409) while the first is DRAFT, and is still refused
          after the first is WITHDRAWN if supersedes_claim_id is omitted — the
          escape hatch is conditional on naming the superseded claim explicitly,
          not on the old claim merely being terminal.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 (6 credits), Student S-1001."
            - "One DRAFT PORTFOLIO claim C1 for (S-1001, CS150)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { c1_id: "$.data.id", c1_num: "$.data.claim_number" }
          trigger:
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
          assert:
            - "the trigger returns status 409 with data.error_id == ERR_DUPLICATE_CLAIM"
            - "GET /pla-claims?student_id=${stu_id}&course_id=${course_id} still returns exactly 1 element, ${c1_id}"
            - "after POST /pla-claims/${c1_id}/withdraw {withdraw_reason: 'Changed my mind'}, repeating the same bare POST /pla-claims STILL returns 409 ERR_DUPLICATE_CLAIM"
            - "the same POST with supersedes_claim_id: ${c1_id} returns 201 with supersedes_claim_id == ${c1_id} and assessment_status == DRAFT"
            - "PlaClaim.${c1_id}.assessment_status is WITHDRAWN and is left untouched by the successful superseding create"
            - "the two claims carry different claim_number values, both unique"

