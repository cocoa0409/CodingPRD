    grounds:
    - endpoints[POST /qualification-submissions/{id}/review]
    - state_machines.QualificationSubmission.transitions[SUBMITTED -> INTERIM_APPROVED]
    - calculations.program_delivery_posture
    distinguishing_aspect: 'One endpoint carries four verdicts and only one of them reads the optional interim_piece_cap:
      the INTERIM_APPROVE branch demands a positive cap and records it, unlocks shipping through the posture recompute,
      yet — unlike APPROVE — leaves the design at PROTOTYPE_RELEASED, the tool PENDING and the quote unfrozen.'
