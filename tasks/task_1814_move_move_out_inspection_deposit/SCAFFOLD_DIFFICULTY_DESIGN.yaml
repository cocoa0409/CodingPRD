# =============================================================================
# Task 1814 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# Canonical fixture (unless an instance overrides):
#   Jurisdiction: deadline 21d, dispute window 30d, interest 300bp ACTUAL_DAYS,
#     stale 180d, small-claims cap 1,000,000c, bad-faith x2, lock allowed,
#     actual-cost charge not allowed.
#   Property fees: key 5,000c / fob 7,500c / lock 12,000c.
#   Unit: carpet 2022-08-01 (5y => 1825d), paint 2025-08-01 (3y => 1095d).
#   Tenancy: lease 2025-01-10..2026-08-10, deposit 200,000c, keys 2, fobs 1.
#   Clock: 2025-01-10 at move-in completion; 2026-08-01 at move-out completion
#     (568 days => ACTUAL interest 9,337c; WHOLE_YEARS 1y => 6,000c).
#   Paint damage (repl 90,000c, age 365d, residual 730/1095) => 60,000c.
#   Standard refund: 200,000 + 9,337 - 60,000 = 149,337c; late statements
#   still bill (no forfeiture) but double small-claims exposure (x2).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: interest_actual_days_vs_whole_years_diverge
        grounds:
          - calculations.deposit_interest
          - entities.JurisdictionProfile.fields.interest_basis
          - entities.Tenancy.fields.interest_accrued_cents
        distinguishing_aspect: |
          Same deposit (200,000c), same rate (300bp), same tenancy span
          (2025-01-10 -> 2026-08-01, 568 days): ACTUAL_DAYS yields 9,337c while
          WHOLE_YEARS yields 6,000c — two valid interest algorithms on the
          deposit-accounting domain that disagree on identical inputs.
        test_recipe:
          setup:
            - "Two jurisdictions identical except interest_basis (CA-ACT vs NY-WHL)"
            - "Two properties/units/tenancies with identical dates and 200,000c deposit"
            - "Both tenancies complete move-in at clock 2025-01-10 and move-out at clock 2026-08-01 with no damage"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "NY-WHL", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "WHOLE_YEARS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur_b: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur_a}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_a: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Birch Court", address: "2 Birch St", jurisdiction_profile_id: "${jur_b}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_b: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_a}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_b}", unit_number: "1B", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_a}", tenant_display_name: "Tanya A", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_a: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_b}", tenant_display_name: "Tanya B", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_b: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_a: $.data.id }
            - call: "POST /pm/inspections/${mi_a}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "GOOD", photo_count: 2 }
              as: Inspector
            - { call: "POST /pm/inspections/${mi_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_b: $.data.id }
            - call: "POST /pm/inspections/${mi_b}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "GOOD", photo_count: 2 }
              as: Inspector
            - { call: "POST /pm/inspections/${mi_b}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten_a}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_b}/give_notice", payload: {}, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_a: $.data.id }
            - { call: "POST /pm/inspections/${mo_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_b: $.data.id }
            - { call: "POST /pm/inspections/${mo_b}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "GET /pm/tenancies/${ten_a}"
              as: PropertyManager
              captures: { int_a: $.data.interest_accrued_cents }
            - call: "GET /pm/tenancies/${ten_b}"
              as: PropertyManager
              captures: { int_b: $.data.interest_accrued_cents }
          assert:
            - "Tenancy.${ten_a}.interest_accrued_cents == 9337"
            - "Tenancy.${ten_b}.interest_accrued_cents == 6000"
            - "${int_a} != ${int_b}"

      - name: damage_charge_depreciated_vs_actual_cost
        grounds:
          - calculations.damage_charge
          - entities.JurisdictionProfile.fields.allow_actual_cost_charge
          - entities.Unit.fields.carpet_installed_on
        distinguishing_aspect: |
          Identical carpet damage (replacement 182,500c, age 1461d of 1825d life):
          the DEPRECIATED variant yields 36,400c while the ACTUAL_COST variant
          (jurisdiction allows it, documented repair 50,000c) yields
          min(50,000, 182,500) = 50,000c — dual variants on the
          InspectionItem/Unit damage domain, distinct from deposit interest.
        test_recipe:
          setup:
            - "Two jurisdictions identical except allow_actual_cost_charge (false vs true)"
            - "Two identical tenancies, each with one CARPET TENANT_DAMAGE item (replacement 182,500c); the actual-cost jurisdiction's item also carries actual_repair_cents 50,000"
            - "Both move out at clock 2026-08-01 (carpet age 1461 days, residual 364/1825)"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-DEP", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "TX-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: true }
              as: ManagerAdmin
              captures: { jur_b: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur_a}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_a: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Birch Court", address: "2 Birch St", jurisdiction_profile_id: "${jur_b}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_b: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_a}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_b}", unit_number: "1B", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_a}", tenant_display_name: "Tanya A", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_a: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_b}", tenant_display_name: "Tanya B", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_b: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_a: $.data.id }
            - call: "POST /pm/inspections/${mi_a}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "GOOD", photo_count: 2 }
              as: Inspector
              captures: { mi_item_a: $.data.id }
            - { call: "POST /pm/inspections/${mi_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_b: $.data.id }
            - call: "POST /pm/inspections/${mi_b}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "GOOD", photo_count: 2 }
              as: Inspector
              captures: { mi_item_b: $.data.id }
            - { call: "POST /pm/inspections/${mi_b}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten_a}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_b}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_a}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_b}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_a: $.data.id }
            - call: "POST /pm/inspections/${mo_a}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "DAMAGED", photo_count: 3, determination: "TENANT_DAMAGE", linked_move_in_item_id: "${mi_item_a}", replacement_cost_cents: 182500 }
              as: Inspector
            - { call: "POST /pm/inspections/${mo_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_b: $.data.id }
            - call: "POST /pm/inspections/${mo_b}/items"
              payload: { area_name: "living_room_carpet", category: "CARPET", condition: "DAMAGED", photo_count: 3, determination: "TENANT_DAMAGE", linked_move_in_item_id: "${mi_item_b}", replacement_cost_cents: 182500, actual_repair_cents: 50000 }
              as: Inspector
            - { call: "POST /pm/inspections/${mo_b}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "GET /pm/deductions"
              payload: {}
              as: PropertyManager
          assert:
            - "Deduction for tenancy ${ten_a} (source MOVE_OUT_DAMAGE).amount_cents == 36400"
            - "Deduction for tenancy ${ten_b} (source MOVE_OUT_DAMAGE).amount_cents == 50000"
            - "Tenancy.${ten_a}.pending_deductions_cents == 36400"
            - "Tenancy.${ten_b}.pending_deductions_cents == 50000"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: key_fob_lock_conditional_charge
        grounds:
          - calculations.key_fob_lock_charge
          - entities.Property.fields.lock_change_cents
          - entities.JurisdictionProfile.fields.lock_change_allowed
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs (keys_issued, keys_returned, fobs_issued,
          fobs_returned, fee schedule, lock_change_allowed) with a conditional
          branch: the 12,000c lock-change line exists only when
          missing_keys > 0 AND the jurisdiction allows it. Tenancy A
          (lock allowed, 1 missing key, 0 missing fobs) bills 5,000 + 12,000
          = 17,000c; tenancy B (lock not allowed, same counts) bills only
          5,000c; tenancy C (lock allowed, all returned) bills 0c.
        test_recipe:
          setup:
            - "Jurisdiction CA-LOCK (lock_change_allowed true) and CA-NOLOCK (false)"
            - "Tenancy A and C under CA-LOCK, tenancy B under CA-NOLOCK; all keys 2 / fobs 1"
            - "A and B return 1 key and 1 fob before move-out; C returns 2 keys and 1 fob"
            - "All three complete move-out at 2026-08-01 with no damage items"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-LOCK", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur_l: $.data.id }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-NOLOCK", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: false, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur_n: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur_l}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_l: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Birch Court", address: "2 Birch St", jurisdiction_profile_id: "${jur_n}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop_n: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_l}", unit_number: "A1", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_n}", unit_number: "B1", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop_l}", unit_number: "C1", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_c: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_a}", tenant_display_name: "T A", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_a: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_b}", tenant_display_name: "T B", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_b: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_c}", tenant_display_name: "T C", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_c: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_a: $.data.id }
            - { call: "POST /pm/inspections/${mi_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_b: $.data.id }
            - { call: "POST /pm/inspections/${mi_b}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_c}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi_c: $.data.id }
            - { call: "POST /pm/inspections/${mi_c}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten_a}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_b}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_c}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_a}/record_key_return", payload: { keys_returned: 1, fobs_returned: 1 }, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_b}/record_key_return", payload: { keys_returned: 1, fobs_returned: 1 }, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten_c}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_a: $.data.id }
            - { call: "POST /pm/inspections/${mo_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_b: $.data.id }
            - { call: "POST /pm/inspections/${mo_b}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_c}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_c: $.data.id }
            - { call: "POST /pm/inspections/${mo_c}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "GET /pm/deductions"
              payload: {}
              as: PropertyManager
          assert:
            - "Tenancy.${ten_a}.pending_deductions_cents == 17000 (KEY_NOT_RETURNED 5000 + LOCK_CHANGE 12000)"
            - "Tenancy.${ten_b}.pending_deductions_cents == 5000 (no LOCK_CHANGE line exists)"
            - "Tenancy.${ten_c}.pending_deductions_cents == 0 (no deduction lines at all)"
            - "DeductionItem for ${ten_a} source KEY_NOT_RETURNED has quantity == 1"

      - name: whole_years_per_segment_rounding
        grounds:
          - calculations.deposit_interest
          - entities.JurisdictionProfile.fields.interest_basis
        distinguishing_aspect: |
          Mode (b) — nested rounding order: WHOLE_YEARS pins round-per-completed-
          year THEN sum. Deposit 100,010c at 250bp gives 2,500.25c per year;
          per-year rounding then sum = 5,000c for 2 years, whereas summing first
          and rounding once gives round_half_up(5,000.50) = 5,001c. The pinned
          order yields exactly 5,000c.
        test_recipe:
          setup:
            - "Jurisdiction WA-WHL with rate 250bp, basis WHOLE_YEARS"
            - "Tenancy deposit 100,010c; move-in completed at clock 2024-01-10; move-out completed at clock 2026-01-10 (731 days => 2 completed years)"
            - "No damage, all keys/fobs returned"
          setup_api_calls:
