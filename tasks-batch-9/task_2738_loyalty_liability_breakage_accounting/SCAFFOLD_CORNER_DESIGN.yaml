      - name: calc_tier_and_promo_expense_attributed_to_own_point_delta
        claim_type: Correct Result
        grounds:
          - calculations.point_issuance_measurement.formula
          - entities.PointLot.fields.tier_benefit_expense_cents
          - entities.PointLot.fields.promo_expense_cents
        distinguishing_aspect: "STEP 5 measures each uplift on its OWN point delta and rounds each separately: (258 - 250) and (266 - 258) both give 10 cents for a total of 20, whereas attributing the whole 16-point uplift in one rounding would give 19."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Expense Core' ACTIVE (ssp_millicents_per_point 1200, per_issuance_point_cap 5000, promo_multiplier_cap_bp 30000, historical 7500 so current_breakage_rate_bp is 2500), rule TX, cohort C1, member M2 SILVER/TX (tier multiplier 10300), period per1 [2026-08-01, 2026-09-01)."
