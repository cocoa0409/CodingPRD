      - name: staffing_rank_check_outranks_self_assessment_completeness_on_the_same_submit
        claim_type: Priority Ordering
        grounds:
          - validations[priority 32]
          - validations[priority 33]
          - validations[priority 43]
          - validations[priority 45]
          - validations[priority 48]
          - errors[ERR_HEALTH_STAFFING_INSUFFICIENT]
          - errors[ERR_SELF_ASSESSMENT_INCOMPLETE]
          - errors[ERR_STANDARD_NOT_APPLICABLE]
          - errors[ERR_DUPLICATE_CYCLE_YEAR]
          - errors[ERR_PHYSICIAN_REVIEW_REQUIRED]
        distinguishing_aspect: "One submit request violates priority 32 and priority 45 at once and must answer ERR_HEALTH_STAFFING_INSUFFICIENT; only after the health center is upgraded does the same request expose ERR_SELF_ASSESSMENT_INCOMPLETE, and the non-applicable evaluation never needs a self_score for the submit to pass."
