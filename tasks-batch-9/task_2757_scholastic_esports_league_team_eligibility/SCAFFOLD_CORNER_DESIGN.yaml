          assert:
            - "Team.${tm1_id}.starter_slots_used == 0 and starter_slots_available == 3 before the triggers"
            - "trigger 1 returns 201 with data.slot_role == STARTER, data.participation_status == PROSPECTIVE, data.verification_status == UNVERIFIED and data.academic_status == PENDING"
            - "after trigger 1 Team.${tm1_id}.starter_slots_used == 1 and starter_slots_available == 2"
            - "trigger 2 returns 201; Team.${tm1_id}.starter_slots_used == 2 and starter_slots_available == 1"
            - "trigger 3 returns 201 — the third starter is accepted at the exact boundary where starter_slots_available is 1; afterwards used == 3 and available == 0"
            - "trigger 4 returns 201 with data.slot_role == SUB even though starter_slots_available is 0 — the cap is scoped to STARTER slots only"
            - "trigger 5 shows starter_slots_used == 3, starter_slots_available == 0 and active_starter_count == 0 — PROSPECTIVE starters consume capacity but are not active"
            - "all four slots carry participation_status PROSPECTIVE, so capacity accounting is independent of verification progress"

      # ---- validations: excluded_because stubs (covered in depth by SCAFFOLD_DIFFICULTY_DESIGN.yaml) ----

      - name: starter_capacity_aggregate_is_evaluated_across_all_non_released_slots
        claim_type: aggregate_validation
        grounds:
          - validations[priority=57]
          - calculations[roster_slot_participation]
        distinguishing_aspect: |
          The aggregate form of the cap — a COUNT over the team's non-RELEASED STARTER
          slots rather than a field on the team — including the release-and-refill path
          where the count must come back down.
        excluded_because:
          difficulty_instance: starter_capacity_used_plus_available_is_invariant_across_add_and_release
          rationale: |
            The §1.8 compensating-invariant instance already drives the aggregate through
            three adds, a release, a refill and a re-release while asserting
            starter_slots_used + starter_slots_available == Season.max_starters after
            every single step, which is a strictly stronger probe of the same COUNT than
            a breadth instance could state.

      - name: team_state_error_outranks_the_fiscal_pool_check
        claim_type: priority_conflict
        grounds:
          - validation_priority_conflicts[register-state-beats-fiscal]
          - validations[priority=14]
          - validations[priority=63]
        distinguishing_aspect: |
          A registration request that is both from the wrong team state and unaffordable
          against the district subsidy pool must report the state error (priority 14),
          never the fiscal one (priority 63).
        excluded_because:
          difficulty_instance: register_state_error_wins_over_exhausted_subsidy_pool
          rationale: |
            The §1.8 instance constructs the doubly-invalid request, asserts
            ERR_INVALID_TEAM_STATE, then repairs only the state fault to prove the pool
            check is genuinely live and second, and finally repairs the pool to reach
            201. Restating the pair here would duplicate that setup with weaker asserts.

      - name: dispute_participant_error_outranks_the_closed_dispute_window
        claim_type: priority_conflict
        grounds:
          - validation_priority_conflicts[dispute-referential-beats-temporal]
          - validations[priority=40]
          - validations[priority=49]
        distinguishing_aspect: |
          A dispute filed by a non-participant team after the window has expired violates
          both a cross-entity reference rule (priority 40) and a temporal rule (priority
          49); the reference error wins.
        excluded_because:
          difficulty_instance: dispute_non_participant_error_wins_over_closed_dispute_window
          rationale: |
            The §1.8 instance advances the clock past the district's dispute_window_hours
            and files from a third team, then repairs each fault in turn, which already
            demonstrates the ordering and that neither rule is dead.

      - name: recruiting_dead_period_error_outranks_the_contact_cap
        claim_type: priority_conflict
        grounds:
          - validation_priority_conflicts[recruiting-temporal-beats-constraint]
          - validations[priority=50]
          - validations[priority=61]
        distinguishing_aspect: |
          A recruiter contact made inside the district dead period by a recruiter who has
          also exhausted the rolling contact cap must surface the dead-period error
          (priority 50), not the cap error (priority 61).
        excluded_because:
          difficulty_instance: recruiting_dead_period_error_wins_over_contact_cap
          rationale: |
            The §1.8 instance fills the rolling window to exactly the cap, moves the
            clock into the dead period, and asserts the dead-period error before stepping
            out of the dead period to expose the cap error underneath — a superset of the
            ordering claim this stub would make.

  - section: endpoints
    # §1.5 audit note: the scaffold declares 58 endpoints and NO bulk endpoint, so the
    # claim-extraction-guide row `bulk_action` has no surface to probe and is deliberately
    # absent from this section. Every other row is instantiated below. The full
    # endpoint-by-endpoint coverage audit is the comment block at the end of this section.
    instances:
      - name: title_collection_reads_honour_the_envelope_pagination_contract_and_path_existence
        claim_type: standard_crud
        grounds:
          - endpoints[POST /titles]
          - endpoints[GET /titles/{titleId}]
          - endpoints[GET /titles]
          - response_envelope.pagination_defaults
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: |
          The plain create / read / list surface, where the interesting content is the
          envelope contract rather than the domain: `response_type` must be "object" for
          an item and "array" for a collection, the default limit is exactly 10, limit is
          clamped to the declared 1..100 range by REJECTION (not by silent clamping), an
          offset past the end returns an empty array with the true total_count, and a
          path id that does not resolve is a 404 with the entity-specific error id.
        test_recipe:
          setup:
            - "No entities exist beyond the three titles created below"
          setup_api_calls:
            - call: "POST /titles"
              payload: { name: "Rocket Clash", publisher: "Astro Interactive", age_rating: "E10", min_player_age: 13, server_pool_id: "POOL-A", server_pool_capacity: 2 }
              as: LeagueAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Tactics Arena", publisher: "Astro Interactive", age_rating: "T", min_player_age: 13, server_pool_id: "POOL-A", server_pool_capacity: 2 }
              as: LeagueAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Siege Front", publisher: "Bastion Games", age_rating: "M", min_player_age: 17, server_pool_id: "POOL-B", server_pool_capacity: 1 }
              as: LeagueAdmin
              captures: { t3_id: $.data.id }
          trigger:
            - call: "GET /titles/${t1_id}"
              as: Coach
              as_user_id: "coach-viewer"
            - call: "GET /titles"
              as: Coach
              as_user_id: "coach-viewer"
            - call: "GET /titles?limit=1&offset=0"
              as: LeagueAdmin
            - call: "GET /titles?limit=1&offset=2"
              as: LeagueAdmin
            - call: "GET /titles?offset=99"
              as: LeagueAdmin
            - call: "GET /titles?age_rating=M"
              as: LeagueAdmin
            - call: "GET /titles?server_pool_id=POOL-A"
              as: LeagueAdmin
            - call: "GET /titles?limit=0"
              as: LeagueAdmin
              captures: { e_limit_low: $.data.error_id }
            - call: "GET /titles?limit=101"
              as: LeagueAdmin
              captures: { e_limit_high: $.data.error_id }
            - call: "GET /titles/00000000-0000-4000-8000-000000000000"
              as: LeagueAdmin
              captures: { e_missing: $.data.error_id }
          assert:
            - "each POST /titles returns 201 with data.version == 1, data.created_at == data.updated_at and the defaulted fields present (age_rating, min_player_age, server_pool_id, server_pool_capacity, match_duration_minutes == 60)"
            - "trigger 1 returns 200 with response_type == \"object\", data.id == ${t1_id} and meta.api_request_id / meta.api_request_timestamp present"
            - "trigger 2 returns 200 with response_type == \"array\", exactly 3 rows, limit == 10 (the declared default), offset == 0, total_count == 3 and has_more == false"
            - "trigger 3 returns exactly 1 row with limit == 1, offset == 0, total_count == 3 and has_more == true"
            - "trigger 4 returns exactly 1 row with offset == 2, total_count == 3 and has_more == false — the last page reports has_more false even though the page is full"
            - "trigger 5 returns an empty array with total_count == 3 and has_more == false — an offset past the end is not an error"
            - "trigger 6 returns exactly 1 row, ${t3_id}, and trigger 7 returns exactly 2 rows, ${t1_id} and ${t2_id} — filters are ANDed with pagination, not applied after it"
            - "trigger 8 returns 400 with data.error_id == ERR_INVALID_REQUEST because limit is below the declared minimum of 1 — it is NOT silently clamped to 1"
            - "trigger 9 returns 400 with data.error_id == ERR_INVALID_REQUEST because limit exceeds the declared maximum of 100 — it is NOT silently clamped to 100"
            - "trigger 10 returns 404 with data.error_id == ERR_TITLE_NOT_FOUND, the entity-specific id from the priority-4 disjunction, not a generic not-found"

      - name: action_endpoints_return_the_whole_updated_entity_and_optional_notes_may_be_omitted
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /coaches/{coachId}/certification]
          - endpoints[POST /roster-slots/{slotId}/release]
          - entities.Coach.fields.certification_status
          - calculations[roster_slot_participation]
        distinguishing_aspect: |
          Action endpoints in this scaffold are POSTs to a verb sub-path that return 200
          (never 201) carrying the FULL updated entity — not a fragment, not an empty
          body — and bump exactly one version by exactly one. Their optional note fields
          must be genuinely optional, and an action reachable by two roles must behave
          identically for both, which is where implementations that hard-code the actor
          diverge.
        test_recipe:
          setup:
            - "One district, one school, one PENDING coach, one title, one season, one DRAFT team and one student holding a STARTER slot"
          setup_api_calls:
            - call: "POST /districts"
