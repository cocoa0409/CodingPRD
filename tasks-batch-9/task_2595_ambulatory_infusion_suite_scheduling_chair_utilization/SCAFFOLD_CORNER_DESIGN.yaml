              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0007", full_name: "Pat Seven", weight_kg: 70 }
              as: Scheduler
              captures: { pt7: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
