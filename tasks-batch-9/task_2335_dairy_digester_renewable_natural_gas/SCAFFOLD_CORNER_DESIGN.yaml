          - entities.OperationsDay.fields.digestate_liquid_tonnes
          - entities.OperationsDay.fields.bedding_recovered_tonnes
          - endpoints[POST /ops-days/{id}/record-separation]
        distinguishing_aspect: >
          total_solids_tonnes is rounded to 2 places (12.00) and only then divided by
          CAKE_DRY_MATTER_FRACTION, giving cake 26.000 t, liquid 124.000 t and bedding
          18.200 t, and the pair sums back to the 150.000 t feed exactly.
        test_recipe:
          setup:
