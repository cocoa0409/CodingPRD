# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "a request arrives without a usable X-User-ID / X-User-Role identity pair" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the caller's role is not permitted for the operation per the RBAC matrix" }
  - { id: ERR_CORRIDOR_NOT_FOUND, http: 404, condition: "no corridor row exists for the id in the path or the corridor_id supplied in a body" }
  - { id: ERR_RUN_PLAN_NOT_FOUND, http: 404, condition: "no run plan row exists for the id in the path or the run_plan_id supplied in a body" }
  - { id: ERR_TERMINAL_NOT_FOUND, http: 404, condition: "no terminal row exists for the id in the path or a terminal id supplied in a body" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "no carrier row exists for the id in the path or the carrier_id supplied in a body" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "no shipper commitment row exists for the id in the path or the shipper_commitment_id supplied in a body" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "no incident report row exists for the id in the path" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "a referenced resource named outside the path does not resolve, e.g. hauler_team_id or prospect_id" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "a required body field is missing, an unknown field is supplied, or a field's type does not match the endpoint schema" }
  - { id: ERR_CORRIDOR_RESTRICTED, http: 409, condition: "the owning corridor posture is RESTRICTED for an operation that requires OPEN" }
  - { id: ERR_CORRIDOR_FROZEN, http: 409, condition: "the owning corridor posture is FROZEN; every child operation on that corridor is rejected" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target row's current state does not permit the requested transition" }
  - { id: ERR_RUN_PLAN_TERMINAL, http: 409, condition: "the run plan is COMPLETED or ABORTED and rejects further transitions" }
  - { id: ERR_CALIBRATION_FAILED, http: 409, condition: "a sensor calibration reading exceeds the 150 ms variance tolerance, or a readiness check carries result FAIL" }
  - { id: ERR_LOAD_SECUREMENT_FAILED, http: 409, condition: "no LOAD_SECUREMENT check on the corridor reaches a secured payload of 40000 lbs with result PASS" }
  - { id: ERR_SAFETY_CASE_STALE, http: 409, condition: "the corridor has no FILED safety case, or its filed_date is more than the supervising state's engagement_window_days before the ledger clock" }
  - { id: ERR_WEATHER_RESTRICTED, http: 409, condition: "the corridor weather_risk_score exceeds 80" }
  - { id: ERR_BLOCKED_BY_INCIDENT, http: 409, condition: "the corridor carries an unresolved blocking incident in INVESTIGATING with severity CRITICAL" }
  - { id: ERR_ROUTE_NOT_VALIDATED, http: 409, condition: "the mapped route fails validation or its validation timestamp is older than the check's validity window" }
  - { id: ERR_MAINTENANCE_OVERDUE, http: 409, condition: "a fleet unit's inspection program is OVERDUE past its standard_inspection_due_date" }
  - { id: ERR_READINESS_CHECK_FAILED, http: 409, condition: "the corridor launch readiness gate is asked to pass while a check is unresolved or failing" }
  - { id: ERR_RUN_PLAN_OVERLAP, http: 409, condition: "a run plan would collide with another run plan already covering the same corridor coverage window" }
  - { id: ERR_APRON_OVERLAP, http: 409, condition: "a terminal apron window would occupy a minute already held by an approved window on the same terminal" }
  - { id: ERR_APRON_CAPACITY_EXCEEDED, http: 409, condition: "approved apron windows would exceed the terminal's apron_capacity" }
  - { id: ERR_MONITOR_OVERLAP, http: 409, condition: "a remote support monitoring window collides with another active window held by the same operator, in either direction" }
  - { id: ERR_COVERAGE_DATE_REQUIRED, http: 422, condition: "an onward chain day is requested without a coverage date and the request does not carry every day of the chain" }
  - { id: ERR_MULTI_DAY_NOT_ALLOWED, http: 422, condition: "a multi-day hold is requested against a hold row flagged single_day_hold" }
  - { id: ERR_HOLD_WINDOW_INVERTED, http: 422, condition: "a hold's end day is not strictly after its start day" }
  - { id: ERR_COMMITMENT_CAPACITY_EXHAUSTED, http: 409, condition: "the shipper commitment has no unconsumed loadboard slot left" }
  - { id: ERR_RATE_BELOW_COMMITMENT_FLOOR, http: 422, condition: "the resolved committed rate falls below the shipper floor minus the maximum band discount" }
  - { id: ERR_NO_ELIGIBLE_COMMITMENT, http: 409, condition: "no shipper commitment covers the requested run window on a half-open interval basis" }
  - { id: ERR_CHARGE_NOT_ALLOWED, http: 422, condition: "an autonomous-hour charge is attempted without a formal or informal state status and an accepted prior engagement in the epoch" }
  - { id: ERR_HOURS_BUDGET_EXCEEDED, http: 409, condition: "the requested autonomous hours exceed the state authority's remaining_autonomous_hours for the epoch" }
  - { id: ERR_OUTSIDE_EPOCH_WINDOW, http: 422, condition: "the engagement moment falls outside the current epoch window" }
  - { id: ERR_REVIEW_WINDOW_LAPSED, http: 409, condition: "an incident is reopened or submitted after its review window measured from the filing epoch" }
  - { id: ERR_DISPATCH_WINDOW_CONFLICT, http: 409, condition: "a dispatch is requested into a window already committed on the same corridor" }
  - { id: ERR_INVALID_ROUTE, http: 422, condition: "a corridor or run plan names the same terminal for origin and destination" }
  - { id: ERR_INVALID_TRAILER_COUNT, http: 422, condition: "trailer_count is neither 1 nor 2" }
  - { id: ERR_INVALID_VERSION, http: 422, condition: "the supplied safety case version is not greater than the corridor's current highest version" }
  - { id: ERR_INVALID_INSPECTION_INTERVAL, http: 422, condition: "inspection_interval_days is below 0 or above 365" }
  - { id: ERR_DUPLICATE_OPERATOR, http: 422, condition: "the remote operator and safety support operator on one monitoring window are the same person" }
  - { id: ERR_CORRECTIVE_ACTION_REQUIRED, http: 409, condition: "an incident is closed or advanced to corrective action without at least one corrective action on file" }
  - { id: ERR_CARRIER_HAS_LIVE_RUN_PLANS, http: 409, condition: "a carrier is offboarded while it still holds a non-terminal run plan" }
  - { id: ERR_RUN_PLAN_IN_TRANSIT, http: 409, condition: "a corridor is retired while one of its run plans is on the highway segment" }
  - { id: ERR_NO_APPROVED_HANDOFF_WINDOW, http: 409, condition: "the highway segment is started without any approved apron handoff window on the run plan" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "a shipping instruction is rejected without a declined active hold on one of its containers" }
  - { id: ERR_VGM_VERIFICATION_FAILED, http: 409, condition: "a container's verified gross mass is below 100 kg at verification" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the supplied expected version does not match the parent row's current version" }
  - { id: ERR_REPRO_NOT_REPLICATION, http: 422, condition: "a corrective action claims replication rather than reproduction of the incident case" }
  - { id: ERR_MISSING_LOGS, http: 422, condition: "a coordinated-dispatch readiness claim is made with empty fleet logs" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Any
    description: "Shared read surface across every operational role"
    identity: opaque
    shared_operations:
      - "GET /api/corridors, /terminals, /carriers, /driver-prospects, /driver-transitions, /safety-cases, /launch-readiness-checks, /run-plans, /shipper-commitments, /remote-support-assignments, /incident-reports, /maintenance-programs, /regulatory-engagements, /state-authorities, /multi-day-holds, /ledger-checkpoints and their sub-resource listings"
      - "GET /api/shipping-instructions, /container-units, /fleet-units, /security-records, /clause-variants, /agreement-codes"

  - name: PlatformAdmin
    description: "Owns the logical clock and the ledger epoch rollover"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /api/ledger-checkpoints"
      - "POST /api/ledger-checkpoints/{id}/adopt"
      - "POST /api/ledger-checkpoints/{id}/roll-over"
    shared_operations:
      - "GET on every collection"

  - name: CorridorOperationsManager
    description: "Owns corridor selection, launch readiness and the labor side of the workforce transition"
    identity: opaque
    exclusive_operations:
      - "POST /api/corridors"
      - "POST /api/corridors/{id}/launch-readiness/start"
      - "POST /api/corridors/{id}/launch-readiness/validate"
      - "POST /api/corridors/{id}/launch-readiness-checks"
      - "POST /api/launch-readiness-checks/{id}/calibrate"
      - "POST /api/launch-readiness-checks/{id}/validate"
      - "POST /api/driver-transitions/{id}/credential-lapse"
    shared_operations:
      - "GET on every collection and single-resource read"

  - name: ComplianceOfficer
    description: "Owns safety case documentation, incident closure and carrier standing"
    identity: opaque
    exclusive_operations:
      - "POST /api/corridors/{id}/launch-readiness/fail"
      - "POST /api/corridors/{id}/retire"
      - "POST /api/launch-readiness-checks/{id}/expire"
      - "POST /api/carriers/{id}/activate"
      - "POST /api/carriers/{id}/reinstate"
      - "POST /api/carriers/{id}/offboard"
      - "POST /api/run-plans/{id}/abort"
      - "POST /api/testing/simulate-vehicle-routing/I2"
      - "POST /api/incident-reports/{id}/close"
      - "POST /api/maintenance-programs/{id}/close"
      - "POST /api/shipping-instructions/{id}/reject"
      - "POST /api/security-records/{id}/consignor-roll"
      - "POST /api/security-records/{id}/route"
      - "POST /api/security-records/{id}/clamp"
      - "POST /api/security-records/{id}/outbound-vessel-roll"
      - "POST /api/security-records/{id}/reporting"
      - "POST /api/clause-variants"
      - "POST /api/clause-variants/{id}/elect"
      - "POST /api/clause-variants/{id}/decline"
      - "POST /api/security-records"
    shared_operations:
      - "POST /api/shipping-instructions/{id}/complete-carriage"

  - name: CarrierDispatcher
    description: "Owns run plan tendering, dispatch and chassis staging for the carrier partnership"
    identity: opaque
    exclusive_operations:
      - "POST /api/run-plans"
      - "POST /api/run-plans/{id}/submit"
      - "POST /api/run-plans/{id}/dispatch-ready"
      - "POST /api/run-plans/{id}/requeue"
      - "POST /api/run-plans/{id}/start-highway-segment"
      - "POST /api/run-plans/{id}/complete"
      - "POST /api/run-plans/{id}/chassis"
      - "POST /api/run-plan-chassis/{id}/recompute"
    shared_operations:
      - "GET /api/run-plans and /run-plans/{id}"

  - name: TerminalManager
    description: "Owns transfer hub operations: terminals and apron handoff windows"
    identity: opaque
    exclusive_operations:
      - "POST /api/terminals"
      - "POST /api/terminals/{id}/operate"
      - "POST /api/terminals/{id}/service-windows"
      - "POST /api/terminal-service-windows/{id}/approve"
      - "POST /api/terminal-service-windows/{id}/cancel"
      - "POST /api/terminal-service-windows/{id}/complete-handoff"
    shared_operations:
      - "GET /api/terminals and /terminals/{id}"

  - name: RemoteSupportSupervisor
    description: "Owns remote support monitoring rosters and intervention protocol coverage"
    identity: opaque
    exclusive_operations:
      - "POST /api/remote-support-assignments"
      - "POST /api/remote-support-assignments/{id}/release"
    shared_operations:
      - "GET /api/remote-support-assignments and /remote-support-assignments/{id}"

  - name: RemoteSupportOperator
    description: "Holds the exclusive monitoring window and runs intervention and safe-stop procedures"
    identity: entity_backed:DriverProspect
    exclusive_operations:
      - "POST /api/remote-support-assignments/{id}/acknowledge"
      - "POST /api/remote-support-assignments/{id}/interventions"
      - "POST /api/run-plans/{id}/safe-stop"
    shared_operations:
      - "GET /api/remote-support-assignments/{id}"

  - name: IncidentReviewer
    description: "Owns incident intake, investigation and regulatory disclosure"
    identity: opaque
    exclusive_operations:
      - "POST /api/incident-reports"
      - "POST /api/incident-reports/{id}/investigate"
      - "POST /api/incident-reports/{id}/corrective-action"
      - "POST /api/incident-reports/{id}/submit"
      - "POST /api/incident-reports/{id}/reopen"
      - "POST /api/testing/simulate-vehicle-routing/I5"
      - "POST /api/testing/simulate-ring-maintenance/I5"
    shared_operations:
      - "GET /api/incident-reports and /incident-reports/{id}"

  - name: SafetyCaseAuthor
    description: "Drafts and submits safety case revisions before the state authority files them"
    identity: opaque
    exclusive_operations:
      - "POST /api/safety-cases"
      - "POST /api/safety-cases/{id}/submit"
    shared_operations:
      - "GET /api/safety-cases and /safety-cases/{id}"

  - name: RegulatoryLiaison
    description: "Owns state-by-state regulatory engagement and safety case filing"
    identity: opaque
    exclusive_operations:
      - "POST /api/state-authorities"
      - "POST /api/safety-cases/{id}/file"
      - "POST /api/regulatory-engagements"
      - "POST /api/regulatory-engagements/{id}/submit"
      - "POST /api/regulatory-engagements/{id}/accept"
      - "POST /api/regulatory-engagements/{id}/reject"
    shared_operations:
      - "GET /api/regulatory-engagements and /state-authorities"

  - name: FleetMaintenanceTech
    description: "Owns autonomous hardware inspection programs and fleet unit hour posting"
    identity: opaque
    exclusive_operations:
      - "POST /api/maintenance-programs"
      - "POST /api/maintenance-programs/{id}/schedule"
      - "POST /api/maintenance-programs/{id}/record-inspection"
      - "POST /api/maintenance-programs/{id}/reschedule"
      - "POST /api/maintenance-programs/{id}/void"
      - "POST /api/fleet-units"
      - "POST /api/fleet-units/{id}/post-operational-hours"
      - "POST /api/fleet-units/{id}/route-driven-operational-hours"
      - "POST /api/fleet-units/{id}/clear-watch-squad"
    shared_operations:
      - "GET /api/maintenance-programs and /fleet-units"

  - name: DriverOutreachCoordinator
    description: "Owns driver workforce transition enrollment and terminal staffing outreach"
    identity: opaque
    exclusive_operations:
      - "POST /api/driver-prospects"
      - "POST /api/driver-transitions"
      - "POST /api/driver-transitions/{id}/ride-along"
      - "POST /api/driver-transitions/{id}/cancel"
    shared_operations:
      - "GET /api/driver-prospects and /driver-transitions"

  - name: ShipperPartnershipManager
    description: "Owns shipper partnership capacity commitments and pricing floors"
    identity: opaque
    exclusive_operations:
      - "POST /api/shipper-commitments"
      - "POST /api/shipper-commitments/{id}/confirm"
      - "POST /api/shipper-commitments/{id}/revoke"
    shared_operations:
      - "GET /api/shipper-commitments and /shipper-commitments/{id}"

  - name: BookingClerk
    description: "Owns coverage-date holds and shipping instruction booking"
    identity: opaque
    exclusive_operations:
      - "POST /api/shipping-instructions"
      - "POST /api/shipping-instructions/{id}/place-holds"
      - "POST /api/shipping-instructions/{id}/cancel-holds"
      - "POST /api/shipping-instructions/{id}/verify-vgm"
      - "POST /api/multi-day-holds"
      - "POST /api/multi-day-holds/bulk-insert"
      - "POST /api/multi-day-holds/{id}/remove"
      - "POST /api/multi-day-holds/{id}/decline"
    shared_operations:
      - "GET /api/shipping-instructions and /multi-day-holds"

  - name: TerminalOperator
    description: "Owns container gate, load, discharge and offload moves inside the hub"
    identity: opaque
    exclusive_operations:
      - "POST /api/container-units/{id}/gate-in"
      - "POST /api/container-units/{id}/load"
      - "POST /api/container-units/{id}/discharge"
      - "POST /api/container-units/{id}/offload"
      - "POST /api/container-units/{id}/gate-out"
    shared_operations:
      - "GET /api/container-units and /container-units/{id}"

  - name: ExchangeParticipant
    description: "Owns the driver exchange agreement codes used for hours-of-service commitments"
    identity: opaque
    exclusive_operations:
      - "POST /api/agreement-codes"
      - "POST /api/agreement-codes/{id}/execute"
    shared_operations:
      - "GET /api/agreement-codes and /agreement-codes/{id}"
