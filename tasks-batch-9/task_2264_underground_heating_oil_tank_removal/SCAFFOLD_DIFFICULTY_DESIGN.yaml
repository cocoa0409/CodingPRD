  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_depth_five_from_lab_result_to_insurance_notification_status
        grounds:
          - state_machines.SoilSample.AT_LAB_to_RESULTED
          - state_machines.TankProject.SAMPLING_to_ASSESSED
          - state_machines.TankProject.ASSESSED_to_REMEDIATION_ACTIVE
          - calculations.contamination_classification
          - calculations.remediation_soil_volume
          - calculations.remediation_cost
          - calculations.insurance_reserve_allocation
          - state_machines.InsuranceNotification.OPEN_to_THIRD_PARTY_REVIEW
        distinguishing_aspect: |
          Depth-5 chain triggered by POST /soil-samples/{id}/result: the sample reaching RESULTED closes the
          round, which drives the project SAMPLING -> ASSESSED, which (because the class is GROSS) drives
          ASSESSED -> REMEDIATION_ACTIVE and sets remediation_cost_cents to 185000, which re-runs the
          insurance waterfall to 100000 / 85000 / 0, which re-derives both notifications to
          THIRD_PARTY_REVIEW. Each hop is caused by the previous hop's mutation, not by the original call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T13:00:00Z."
            - "Property with first_party_coverage_limit_cents 100000 and third_party_sublimit_cents 5000000."
            - "TankProject in SAMPLING, sampling_round 1, remediation_cost_cents 0, remediation_started false."
            - "One SoilSample of round 1 at status AT_LAB, depth_inches 96."
            - "One FIRST_PARTY and one THIRD_PARTY_LIABILITY InsuranceNotification, both OPEN with all allocation fields 0."
