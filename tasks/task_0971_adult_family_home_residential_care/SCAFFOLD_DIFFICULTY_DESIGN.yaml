  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: caregiver_overlap_touch_allowed_rolling16_accumulates
        grounds:
          - calculations.caregiver_overlap_check
          - errors[ERR_SHIFT_CONFLICT]
        distinguishing_aspect: |
          Caregiver resource with mixed point+aggregate interval semantics: back-to-back shifts
          (end == start) do not overlap and are accepted, but the rolling 24h window still
          accumulates their hours — two 12h shifts separated by a 1-minute gap exceed the 16h
          rolling cap and are rejected with ERR_SHIFT_CONFLICT.
        test_recipe:
          setup:
            - "Licensed home with one ACTIVE caregiver, census 0 (no staffing-ratio interaction)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-8001", name: "Larch AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg Larch", credential_id: "HCA-900", awake_overnight_qualified: true }
              as: Provider
              captures: { cg_id: $.data.id, cg_v: $.data.version }
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/shifts"
              payload: { home_id: "${home_id}", caregiver_id: "${cg_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-01T08:00:00Z", expected_caregiver_version: "${cg_v}" }
              as: Provider
            - call: "GET /api/caregivers/${cg_id}"
              payload: {}
              as: Provider
              captures: { cg_v2: $.data.version }
            - call: "POST /api/shifts"
              payload: { home_id: "${home_id}", caregiver_id: "${cg_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z", expected_caregiver_version: "${cg_v2}" }
              as: Provider
            - call: "GET /api/caregivers/${cg_id}"
              payload: {}
              as: Provider
              captures: { cg_v3: $.data.version }
          trigger:
            - call: "POST /api/shifts"
              payload: { home_id: "${home_id}", caregiver_id: "${cg_id}", start_at: "2026-06-01T16:01:00Z", end_at: "2026-06-02T04:01:00Z", expected_caregiver_version: "${cg_v3}" }
              as: Provider
              captures: { err_id: $.data.error_id }
          assert:
            - "second shift (08:00Z start == first shift 08:00Z end) was accepted: touching intervals do not overlap"
            - "error_id == ERR_SHIFT_CONFLICT with HTTP 409: 8h + 8h + 12h within rolling 24h exceeds 16h even though no pair of intervals overlaps"

      - name: rate_schedule_overlap_adjacency_allowed_intersection_rejected
        grounds:
          - errors[ERR_RATE_OVERLAP]
          - entities.RateSchedule.fields.effective_from
          - entities.RateSchedule.fields.effective_to
        distinguishing_aspect: |
          RateSchedule resource with pure pairwise half-open-intersection semantics (no aggregate
          accumulation, unlike the caregiver rolling cap): a schedule whose window merely touches
          an existing one at the boundary is accepted, while a one-day interior intersection on
          the same payer lane is rejected with ERR_RATE_OVERLAP.
        test_recipe:
          setup:
            - "Licensed home; existing MEDICAID schedule [2026-06-01, 2026-06-15)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-8002", name: "Maple2 AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg M2", credential_id: "HCA-901" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01", effective_to: "2026-06-15" }
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 12500, care_low_daily_cents: 3100, care_medium_daily_cents: 6200, care_high_daily_cents: 9200, effective_from: "2026-06-15" }
              as: Provider
              captures: { rs2: $.data.id }
          trigger:
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 13000, care_low_daily_cents: 3200, care_medium_daily_cents: 6300, care_high_daily_cents: 9300, effective_from: "2026-06-14", effective_to: "2026-06-20" }
              as: Provider
              captures: { err_id: $.data.error_id }
          assert:
            - "RateSchedule.${rs2} created (effective_from 2026-06-15 == prior effective_to 2026-06-15: adjacency is not intersection)"
            - "error_id == ERR_RATE_OVERLAP with HTTP 409 ([2026-06-14, 2026-06-15) intersects the first schedule by one day)"

