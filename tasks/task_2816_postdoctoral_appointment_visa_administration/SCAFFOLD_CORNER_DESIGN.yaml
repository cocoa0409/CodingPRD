      - name: the_same_user_id_cannot_prepare_and_price_or_recommend_and_finalize
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_23_ERR_SEGREGATION_OF_DUTIES
          - concurrency_rules.salary-exception-stale-appointment
          - state_machines.ReappointmentReview.RECOMMENDED_RENEW_to_FINALIZED_RENEWED
        distinguishing_aspect: "Segregation of duties is enforced on X-User-ID, not on the role: an HRCompensationApprover request carrying the officer's own user id is refused with ERR_SEGREGATION_OF_DUTIES at 403 even though the role is allowed on that endpoint, and the same refusal applies to a finalize request whose X-User-ID equals the review's recommended_by_user_id. Both refusals sit at priority 23, behind the OCC check at priority 7, so each rejected call still has to carry a live version and neither refusal bumps Appointment.version."
