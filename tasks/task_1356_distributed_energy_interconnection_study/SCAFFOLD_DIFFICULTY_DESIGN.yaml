              payload: { decision: "ACCEPTED", review_note: "ok" }
              as: QueueAdministrator
              captures: { st_final: $.data.status }
          assert:
            - "${st_rejected} == REJECTED and ${note_rejected} == 'lease expires too soon'"
            - "${st_pending} == PENDING_REVIEW (REJECTED -> PENDING_REVIEW cycle edge)"
            - "${uri_after} == 's3://ev/site-v2.pdf' and ${note_after} == null"
            - "${st_final} == ACCEPTED"
            - "Project.${p1_id}.status == QUEUED still (TECHNICAL_DATA not yet accepted, so readiness_satisfied == false)"

  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_restudy_cascade_depth3
        grounds:
          - state_machines.Project.STUDY_COMPLETE_to_WITHDRAWN
          - state_machines.Study.RESULTS_PUBLISHED_to_IN_PROGRESS
          - calculations.study_cost_allocation
          - calculations.queue_position_assignment_and_compaction
        distinguishing_aspect: |
          Depth-3 chain from POST /projects/{id}/withdraw: withdrawal reopens the Study
          (RESULTS_PUBLISHED -> IN_PROGRESS); the reopen demotes sibling Projects
          (STUDY_COMPLETE -> RESTUDY_REQUIRED); the demotion changes the included set so
          CostShare rows are recomputed (P1 450000, P3 750000, withdrawn P2 zeroed) —
          each hop is caused by the previous hop's mutation, not by the withdrawal directly.
