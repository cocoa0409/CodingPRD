      - name: usage_variance_threshold_boundary_covered
        claim_type: boundary_edge
        grounds:
          - "calculations.consumption_variance"
        excluded_because:
          difficulty_instance: usage_variance_rolling_window_trigger
          rationale: "The exactly-+10%-stays-IN_BAND boundary (variance_pct == 0.1000 with band IN_BAND under the strictly-greater rule) is asserted verbatim in that §1.8 instance's first usage record."

  # ============================================================ validations
  - section: validations
    instances:
      - name: usage_missing_covering_standard_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NO_COVERING_STANDARD]"
        distinguishing_aspect: "No ACTIVE standard whose half-open window contains usage_date: standard window ended 2026-06-01, usage_date 2026-08-01 -> rejection (window containment is the coverage test)."
        test_recipe:
          setup: ["COATED product rpm 6000; ACTIVE machine spindle 5000 FIXED; standard window [2026-01-01, 2026-06-01); lot qty 100"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "NC-1", name: "No Cover Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-NC", asset_tag: "GR-NC", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "OLD_OP", standard_qty_per_part: 0.0250, effective_from: "2026-01-01", effective_to: "2026-06-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-NC", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 400 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_NO_COVERING_STANDARD (2026-08-01 not in [2026-01-01, 2026-06-01))"

      - name: usage_date_in_future_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_USAGE_DATE_IN_FUTURE]"
        distinguishing_aspect: "usage_date after the current logical-clock date (2026-08-02 > 2026-08-01) is rejected even when a covering standard exists."
        test_recipe:
          setup: ["COATED product rpm 6000; ACTIVE machine; ACTIVE standard [2026-01-01, open); lot qty 100; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "UF-1", name: "Future Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-UF", asset_tag: "GR-UF", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-UF", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-02", qty_used: 10, parts_produced: 400 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_USAGE_DATE_IN_FUTURE"

      - name: usage_qty_exceeds_lot_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_LOT_QTY_EXCEEDED]"
        distinguishing_aspect: "Fiscal check: qty_used 6 > lot.qty_on_hand 5 is rejected; the lot is untouched."
        test_recipe:
          setup: ["COATED product rpm 6000; ACTIVE machine; ACTIVE standard open window; lot qty 5"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "UQ-1", name: "Qty Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-UQ", asset_tag: "GR-UQ", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-UQ", manufacture_date: "2026-06-01", qty_received: 5 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 6, parts_produced: 200 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { lot_qoh: $.data.qty_on_hand }
          assert:
            - "HTTP 409 with error_id == ERR_LOT_QTY_EXCEEDED"
            - "InventoryLot.${lot_id}.qty_on_hand == 5 (unchanged)"

      - name: usage_lot_blocked_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_LOT_NOT_AVAILABLE]"
          - "state_machines.InventoryLot.AVAILABLE_to_BLOCKED"
        distinguishing_aspect: "A lot BLOCKED by the discontinuation fan-out rejects usage with ERR_LOT_NOT_AVAILABLE even though the machine is ACTIVE and speed checks would pass."
        test_recipe:
          setup: ["Products P1 (COATED 6000) and P2 (COATED 6500); ACTIVE machine spindle 5000 FIXED; lot of P1 qty 10; P1 discontinued with replacement P2 -> lot BLOCKED"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "LB-1", name: "Blocked Lot Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "LB-2", name: "Blocked Lot Repl", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-LB", asset_tag: "GR-LB", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p1_id}", lot_code: "L-LB", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p1_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 5, parts_produced: 200 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_LOT_NOT_AVAILABLE (lot BLOCKED by discontinuation fan-out)"

      - name: usage_speed_equal_boundary_allowed
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SPEED_RATING_EXCEEDED]"
        distinguishing_aspect: "Speed rule is >= (inclusive): product rated exactly at spindle max (5000 == 5000) is ALLOWED; one rpm below (4999) is rejected with ERR_SPEED_RATING_EXCEEDED."
        test_recipe:
          setup: ["Machine spindle 5000 FIXED ACTIVE; product A COATED rpm 5000 (with covering standard and lot); product B COATED rpm 4999 (with lot; no standard needed — safety fails first)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "SE-A", name: "Speed Equal Disc", product_form: "COATED", max_operating_speed_rpm: 5000 }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
