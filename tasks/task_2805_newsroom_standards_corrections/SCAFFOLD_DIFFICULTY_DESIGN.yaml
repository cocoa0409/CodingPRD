# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Newsroom Standards & Corrections — task_2805
#
# Every rule_id below is verbatim from §0.5. Every grounds: entry resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every numeric assert is a literal computed against the
# §1.3 formulas and their constants, not an expression left for the test generator.
#
# Shared bootstrap vocabulary used by the setup chains below:
#   Newsroom "Metro Ledger"  — correction_response_sla_hours 72 unless stated otherwise
#   Journalist role_title EXECUTIVE_EDITOR  -> acts as ExecutiveEditor
#   Journalist role_title STANDARDS_EDITOR  -> acts as StandardsEditor
#   Journalist role_title REPORTER          -> acts as Reporter
#   Reviewer discipline LEGAL               -> acts as LegalCounsel
#   PublicEditor is opaque, so its X-User-ID is a plain operator string.
# The logical clock reads 2026-08-01T00:00:00Z until POST /standards-desk/_clock/set_current_utc moves it.

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: story_risk_index_estimate_versus_actual_diverge_after_severe_correction
        grounds:
          - calculations.story_risk_index
          - entities.Story.fields.risk_index_estimate
          - entities.Story.fields.risk_index_actual
          - entities.Story.fields.severe_correction_count
          - state_machines.Story.CLEARED_to_PUBLISHED
        distinguishing_aspect: |
          The dual variant lives on Story: pre_publication_estimate and post_publication_actual read the
          same declared claim counts and the same approved-source pool, yet the actual variant adds 6
          points per MAJOR/SEVERE adjudicated correction, so one SEVERE adjudication moves
          risk_index_actual from 40.00 to 46.00 while risk_index_estimate stays 40.00.
        test_recipe:
          setup:
            - "Newsroom with correction_response_sla_hours 72, high_severity_open_threshold 2, required_module_codes [SOURCING]"
            - "Reporter has filed the SOURCING module, so training_current is true and a HIGH-tier story may publish"
            - "Story carries defamation_claim_count 7, privacy_subject_count 3, unverified_document_count 1 and two APPROVED SEVERE anonymous sources, giving risk_index_estimate 40.00 and risk_tier HIGH"
            - "Story is PUBLISHED, so risk_index_actual has been computed for the first time and equals 40.00"
            - "One correction request against the story is INVESTIGATING"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/reviewers"
              payload: { newsroom_id: "${nr}", full_name: "Lee Park", discipline: "LEGAL", weekly_capacity_minutes: 600 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rev: $.data.id }
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${rep}", module_code: "SOURCING", case_study_reference: "CS-2019-JAYSON" }
              as: Reporter
              as_user_id: "${rep}"
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Contract steering at the port authority", defamation_claim_count: 7, privacy_subject_count: 3, unverified_document_count: 1 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "POST /standards-desk/anonymous-source-approvals"
              payload: { story_id: "${st}", source_alias: "MERIDIAN", source_category: "WHISTLEBLOWER", harm_risk: "SEVERE", identity_known_to_editor: true, corroboration_count: 2, justification_text: "Contract insider who would be dismissed and prosecuted if named in the story." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { src1: $.data.id }
            - call: "POST /standards-desk/anonymous-source-approvals"
              payload: { story_id: "${st}", source_alias: "HARBOR", source_category: "GOVERNMENT", harm_risk: "SEVERE", identity_known_to_editor: true, corroboration_count: 3, justification_text: "Serving official whose family would face retaliation if identified in print." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { src2: $.data.id }
            - call: "POST /standards-desk/anonymous-source-approvals/${src1}/decide"
              payload: { decision: "APPROVE", decision_note: "Identity held by the desk, two corroborating records." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/anonymous-source-approvals/${src2}/decide"
              payload: { decision: "APPROVE", decision_note: "Identity held by the desk, three corroborating records." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "GET /standards-desk/stories/${st}"
              payload: {}
              as: Reporter
              as_user_id: "${rep}"
              captures: { st_v: $.data.version }
            - call: "POST /standards-desk/pre-publication-reviews"
              payload: { story_id: "${st}", expected_story_version: "${st_v}", high_risk_declared: false, submission_note: "Two severe-risk anonymous sources, seven contested assertions." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { rvw: $.data.id }
            - call: "POST /standards-desk/pre-publication-reviews/${rvw}/legal-verdict"
              payload: { legal_verdict: "PASS", defamation_findings: 7, privacy_findings: 3, findings_note: "Assertions are supported; privacy interests outweighed by public concern." }
              as: LegalCounsel
              as_user_id: "${rev}"
            - call: "POST /standards-desk/pre-publication-reviews/${rvw}/standards-verdict"
              payload: { standards_verdict: "PASS", findings_note: "Sourcing documentation complete." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/pre-publication-reviews/${rvw}/clear"
              payload: {}
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/stories/${st}/publish"
              payload: {}
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "counsel@portauthority.test", claim_text: "The story misidentifies the official who signed the steering memo.", claimed_error_category: "IDENTIFICATION", reader_reported_reach: 250000, subject_named: true }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
            - call: "POST /standards-desk/correction-requests/${cr}/start-investigation"
              payload: { assigned_note: "Pulling the signature page and the memo routing slip." }
              as: PublicEditor
              as_user_id: "public-editor-1"
          trigger:
            - call: "POST /standards-desk/correction-requests/${cr}/adjudicate"
              payload: { outcome_type: "CORRECTION", adjudicated_error_category: "IDENTIFICATION", verified_reach: 250000, notice_text: "An earlier version misidentified the official who signed the memo." }
              as: StandardsEditor
              as_user_id: "${sed}"
          assert:
            - "CorrectionRequest.${cr}.adjudicated_severity_score == 21"
            - "CorrectionRequest.${cr}.adjudicated_severity_band == SEVERE"
            - "Story.${st}.severe_correction_count == 1"
            - "Story.${st}.risk_index_estimate == 40.00"
            - "Story.${st}.risk_index_actual == 46.00"
            - "Story.${st}.risk_tier == HIGH"
            - "Story.${st}.publication_status == PUBLISHED"

      - name: correction_severity_provisional_versus_adjudicated_bands_disagree
        grounds:
          - calculations.correction_severity_score
          - entities.CorrectionRequest.fields.provisional_severity_band
          - entities.CorrectionRequest.fields.adjudicated_severity_band
          - entities.CorrectionRequest.fields.placement
          - state_machines.CorrectionRequest.INVESTIGATING_to_ADJUDICATED
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — CorrectionRequest, not Story: the
          intake_provisional variant reads the complainant's claimed_error_category, reader_reported_reach
          and submitter_type while adjudicated_final reads the desk's adjudicated_error_category,
          verified_reach and subject_named, so the same row ends with provisional band SEVERE (score 21)
          and adjudicated band MINOR (score 7).
        test_recipe:
          setup:
            - "Newsroom with correction_response_sla_hours 72 and a DRAFT story owned by the reporter"
            - "A SUBJECT-submitted correction request claims an IDENTIFICATION error with reader_reported_reach 250000, so the provisional band is SEVERE with score 21"
            - "The request is INVESTIGATING, and the desk has verified that the real error is a NUMERIC one seen by 8000 readers with no named subject"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Transit budget overrun reaches nine figures", defamation_claim_count: 1, privacy_subject_count: 0, unverified_document_count: 0 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "press@transit.test", claim_text: "You named the wrong deputy director as the budget owner.", claimed_error_category: "IDENTIFICATION", reader_reported_reach: 250000, subject_named: false }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
            - call: "POST /standards-desk/correction-requests/${cr}/start-investigation"
              payload: { assigned_note: "Checking the budget appendix and the audience figures." }
              as: StandardsEditor
              as_user_id: "${sed}"
          trigger:
            - call: "POST /standards-desk/correction-requests/${cr}/adjudicate"
              payload: { outcome_type: "CORRECTION", adjudicated_error_category: "NUMERIC", verified_reach: 8000, notice_text: "The overrun was 94 million dollars, not 194 million." }
              as: StandardsEditor
              as_user_id: "${sed}"
          assert:
            - "CorrectionRequest.${cr}.provisional_severity_score == 21"
            - "CorrectionRequest.${cr}.provisional_severity_band == SEVERE"
            - "CorrectionRequest.${cr}.adjudicated_severity_score == 7"
            - "CorrectionRequest.${cr}.adjudicated_severity_band == MINOR"
            - "CorrectionRequest.${cr}.placement == END_OF_STORY"
            - "CorrectionRequest.${cr}.status == ADJUDICATED"
            - "Story.${st}.severe_correction_count == 0"
            - "Story.${st}.standards_status == CORRECTED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_index_multiplier_applied_before_cap_and_rounding
        grounds:
          - calculations.story_risk_index
          - calculations.journalist_penalty_points
          - entities.Story.fields.risk_index_estimate
          - entities.Story.fields.risk_tier
          - entities.Journalist.fields.penalty_points
        distinguishing_aspect: |
          Mode (a) — non-linear composition over three interacting terms: the disciplinary multiplier is
          applied to the integer subtotal, the 100.00 cap is applied to the product, and only then is the
          result rounded. Subtotal 45 with a 1.10 multiplier lands on 49.50 (not 49 or 50), and subtotal
          160 with the same multiplier lands on the cap 100.00 rather than on 176.00, so any
          implementation that caps before multiplying or rounds before capping produces a different number.
        test_recipe:
          setup:
            - "Newsroom with high_severity_open_threshold 2"
            - "The reporter carries exactly 5 penalty_points from one SUSTAINED SERIOUS plagiarism finding, so employment_status is still ACTIVE and the story multiplier tier is 1.10"
            - "No anonymous sources and no corrections exist, so base and the actual-variant terms are zero"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/misconduct-investigations"
              payload: { journalist_id: "${rep}", allegation_type: "PLAGIARISM", severity: "SERIOUS", allegation_summary: "Three paragraphs of a 2025 feature reproduce a trade-journal article without attribution." }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { inv: $.data.id }
            - call: "POST /standards-desk/misconduct-investigations/${inv}/advance"
              payload: { advance_note: "Text comparison complete." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv}/advance"
              payload: { advance_note: "Written response requested from the reporter." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv}/decide"
              payload: { disposition: "SUSTAINED", decision_note: "Attribution failure established; not a fabrication." }
              as: ExecutiveEditor
              as_user_id: "${exec}"
          trigger:
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Ten disputed assertions about the housing authority", defamation_claim_count: 10, privacy_subject_count: 5, unverified_document_count: 1 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st_a: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Fifty disputed assertions across the whole procurement series", defamation_claim_count: 50, privacy_subject_count: 5, unverified_document_count: 0 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st_b: $.data.id }
          assert:
            - "Journalist.${rep}.penalty_points == 5"
            - "Journalist.${rep}.employment_status == ACTIVE"
            - "Story.${st_a}.risk_index_estimate == 49.50"
            - "Story.${st_a}.risk_tier == HIGH"
            - "Story.${st_b}.risk_index_estimate == 100.00"
            - "Story.${st_b}.risk_tier == HIGH"

      - name: training_compliance_index_rounds_each_ratio_before_averaging
        grounds:
          - calculations.desk_training_compliance_index
          - entities.Newsroom.fields.training_compliance_index
          - entities.Newsroom.fields.required_module_codes
          - entities.Journalist.fields.completed_required_module_count
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the answer: with 3 required modules and per-journalist
          completion counts {1, 1, 2}, rounding each ratio to 2 decimals first and then averaging yields
          44.33, while summing the unrounded ratios and rounding once yields 44.44. The pinned order is the
          first, so 44.44 is a wrong answer that a naive single-rounding implementation produces.
        test_recipe:
          setup:
            - "Newsroom requires three modules: SOURCING, CORRECTIONS and LEGAL_RISK"
            - "The cohort is exactly three journalists: the executive editor, the standards editor and the reporter"
            - "The executive editor has completed SOURCING only, the standards editor has completed SOURCING only, and the reporter has completed SOURCING and CORRECTIONS"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING", "CORRECTIONS", "LEGAL_RISK"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${exec}", module_code: "SOURCING", case_study_reference: "CS-SOURCING-01" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${sed}", module_code: "SOURCING", case_study_reference: "CS-SOURCING-01" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${rep}", module_code: "SOURCING", case_study_reference: "CS-SOURCING-01" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${rep}", module_code: "CORRECTIONS", case_study_reference: "CS-CORRECTIONS-04" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
          trigger:
            - call: "GET /standards-desk/newsrooms/${nr}/standards-summary"
              payload: {}
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { tci: $.data.training_compliance_index }
          assert:
            - "response.data.training_compliance_index == 44.33"
            - "Newsroom.${nr}.training_compliance_index == 44.33"
            - "Journalist.${rep}.completed_required_module_count == 2"
            - "Journalist.${rep}.training_current == false"
            - "Journalist.${exec}.completed_required_module_count == 1"

      - name: correction_band_pinned_from_raw_never_rebanded_from_final_score
        grounds:
          - calculations.correction_severity_score
          - entities.CorrectionRequest.fields.adjudicated_severity_score
          - entities.CorrectionRequest.fields.adjudicated_severity_band
          - entities.CorrectionRequest.fields.placement
        distinguishing_aspect: |
          Mode (c) — a pinned evaluation order that breaks an apparent circularity: raw 15 bands as MAJOR,
          the MAJOR surcharge of 2 lifts the score to 17, and 17 sits above the SEVERE edge of 16, yet the
          band MUST remain MAJOR because it is derived from raw only. An implementation that re-bands from
          the final score reports SEVERE and increments the newsroom's high-severity pool one step too fast.
        test_recipe:
          setup:
            - "Newsroom with high_severity_open_threshold 2 so a single MAJOR adjudication leaves posture OPEN"
            - "A DRAFT story owned by the reporter with an INVESTIGATING correction request"
            - "The desk has verified a QUOTE error affecting a named subject with verified_reach 120000, which is raw 15"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Council member quoted on the zoning swap", defamation_claim_count: 2, privacy_subject_count: 0, unverified_document_count: 0 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "aide@council.test", claim_text: "The quotation attributed to the council member was never said in those words.", claimed_error_category: "QUOTE", reader_reported_reach: 120000, subject_named: true }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { cr: $.data.id }
            - call: "POST /standards-desk/correction-requests/${cr}/start-investigation"
              payload: { assigned_note: "Recording pulled from the council archive." }
              as: StandardsEditor
              as_user_id: "${sed}"
          trigger:
            - call: "POST /standards-desk/correction-requests/${cr}/adjudicate"
              payload: { outcome_type: "CORRECTION", adjudicated_error_category: "QUOTE", verified_reach: 120000, notice_text: "The council member's words were paraphrased, not quoted." }
              as: StandardsEditor
              as_user_id: "${sed}"
          assert:
            - "CorrectionRequest.${cr}.adjudicated_severity_score == 17"
            - "CorrectionRequest.${cr}.adjudicated_severity_band == MAJOR"
            - "CorrectionRequest.${cr}.placement == TOP_OF_STORY"
            - "CorrectionRequest.${cr}.provisional_severity_score == 17"
            - "CorrectionRequest.${cr}.provisional_severity_band == MAJOR"
            - "Story.${st}.severe_correction_count == 1"
            - "Newsroom.${nr}.open_high_severity_count == 1"
            - "Newsroom.${nr}.standards_posture == OPEN"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: story_publication_and_standards_dimensions_advance_independently
        grounds:
          - state_machines.Story.CLEARED_to_PUBLISHED
          - state_machines.Story.CLEAN_to_UNDER_INQUIRY
