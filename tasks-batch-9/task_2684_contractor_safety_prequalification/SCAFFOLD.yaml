  # ------------------------------------------- writes: registration & setup ----
  - method: POST
    path: /clients
    roles: [NetworkAdmin]
    input: [legal_name, industry_code, "grading_policy?", "max_trir?", "max_dart_rate?", "max_emr?", "max_citation_points?", "weight_trir?", "weight_dart?", "weight_emr?", "weight_citation?", "conditional_band_pct?", "requalification_interval_months?", "audit_sample_rate_pct?", "cascade_depth_limit?", "required_coverage_types?"]
    output: Client
    side_effects:
      - "Client created with version 1; omitted fields take their section 1.1 defaults"
    notes: "The four weights must sum to exactly 1.00 when any of them is supplied; supplying a partial set that breaks the sum is ERR_INVALID_FIELD_VALUE. The created Client.id is the X-User-ID a ClientSafetyManager must present."
  - method: POST
    path: /clients/{id}/sites
    roles: [ClientSafetyManager]
    input: [site_code, required_hazard_classes, "min_grade?"]
    output: Site
    side_effects:
      - "Site created with granted_worker_count 0 and access_gate_status OPEN"
  - method: POST
    path: /contractors
    roles: [NetworkAdmin]
    input: [legal_name, scope_of_work, hazard_profile, employee_count]
    output: Contractor
    side_effects:
      - "Contractor created with version 1, status ACTIVE, incident_review_flag false, open_severe_incident_count 0, open_deficiency_count 0, verified_coverage_types []"
      - "base_hazard_tier computed from hazard_profile (2 when hazard_profile intersects HIGH_HAZARD_CLASSES, else 1)"
    notes: "The created Contractor.id is the X-User-ID a ContractorAdmin must present."
  - method: PATCH
    path: /contractors/{id}
    roles: [NetworkAdmin]
    input: ["scope_of_work?", "hazard_profile?", "employee_count?", "status?"]
    output: Contractor
    side_effects:
      - "increments Contractor.version by 1"
      - "recomputes base_hazard_tier when hazard_profile changes, which changes the tier-tightening factor applied by the next grading"
    notes: "hazard_profile may not be narrowed below the union of required_hazard_classes of the Sites where this contractor holds a GRANTED SiteAccessGrant (ERR_HAZARD_PROFILE_MISMATCH). Setting status to SUSPENDED or DEBARRED does not retroactively touch existing prequalifications; it only blocks new ones through validation priority 11."
  - method: POST
    path: /contractors/{id}/workers
    roles: [ContractorAdmin]
    input: [full_name, employee_ref, trade_code]
    output: Worker
    side_effects:
      - "Worker created; the row is immutable and carries no version field"
    notes: "employee_ref is unique per contractor (ERR_INVALID_FIELD_VALUE on a duplicate)."
  - method: POST
    path: /workers/{id}/qualifications
    roles: [ContractorAdmin]
    input: [qualification_code, issued_date, expiration_date, training_provider, evidence_ref]
    output: WorkerQualification
    side_effects:
      - "WorkerQualification created; immutable, no version field"
      - "an existing row for the same (worker_id, qualification_code) is NOT replaced - both rows coexist and worker_site_eligibility uses the one with the greatest expiration_date"
    notes: "expiration_date > issued_date, else ERR_INVALID_FIELD_VALUE. Renewal is expressed by adding a new row, never by mutating one."
  - method: POST
    path: /_clock/set_current_utc
    roles: [NetworkAdmin]
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "the service logical clock is set to current_utc; every subsequent temporal evaluation uses it"
    notes: "The logical clock starts at 2026-08-01T00:00:00Z at service startup and is only ever moved by this endpoint - the wall clock is never read. current_utc must be a valid ISO 8601 UTC instant (else ERR_INVALID_FIELD_VALUE) and may move backwards. Setting the clock does NOT sweep any row: expiry and overdue effects materialize either lazily on read or when a requalification run is executed."

  # --------------------------------- writes: prequalification & review flow ----
  - method: POST
    path: /prequalifications
    roles: [ContractorAdmin]
    input: [contractor_id, client_id, cycle_year, expected_contractor_version]
    output: Prequalification
    side_effects:
      - "Prequalification created in DRAFT with statistics_verification_status NOT_SUBMITTED, document_review_status NOT_STARTED, audit_state NOT_SELECTED"
      - "SUPERSEDE: every Prequalification for the same (contractor_id, client_id) with a strictly lower cycle_year and status in {APPROVED, CONDITIONAL, SUSPENDED} transitions to EXPIRED, processing order cycle_year ASC then created_at ASC, each firing its own EXPIRED side-effect chain (grant revocation, flow-down recompute, deficiency recount)"
      - "increments Contractor.version by 1"
      - "recomputes Contractor.open_deficiency_count"
    notes: "expected_contractor_version must equal the current Contractor.version, else ERR_STALE_VERSION (412). Because the supersede cascade rewrites the contractor's whole standing, two concurrent registrations that both read version N cannot both land. cycle_year must be within [logical_clock_year - 1, logical_clock_year + 1]."
  - method: POST
    path: /prequalifications/{id}/safety-statistics
    roles: [ContractorAdmin]
    input: [reporting_year, hours_worked, recordable_incidents, dart_cases, fatalities, emr, citation_count_willful, citation_count_serious, citation_count_other, source_document_ref]
    output: SafetyStatistic
    side_effects:
      - "SafetyStatistic created with verification_status PENDING"
      - "trir, dart_rate and citation_points computed and stored"
      - "Prequalification.statistics_verification_status becomes PENDING"
    notes: "Only allowed while Prequalification.status is DRAFT (else ERR_TRANSITION_NOT_ALLOWED). Rounding of trir and dart_rate is HALF_UP to 2 decimals."
  - method: POST
    path: /safety-statistics/{id}/verify
    roles: [VerificationAnalyst]
    input: [decision]
    output: SafetyStatistic
    side_effects:
      - "decision VERIFY: verification_status VERIFIED, verified_by_user_id = X-User-ID, verified_at = logical clock; Prequalification.statistics_verification_status becomes VERIFIED"
      - "decision REJECT: verification_status REJECTED, verified_by_user_id = X-User-ID, verified_at = logical clock; Prequalification.statistics_verification_status returns to NOT_SUBMITTED when no other PENDING or VERIFIED statistic remains, and the reporting_year is released for resubmission"
      - "re-evaluates the SUBMITTED -> UNDER_REVIEW join: the Prequalification advances only when statistics_verification_status is VERIFIED AND document_review_status is COMPLETE"
    notes: "decision is one of {VERIFY, REJECT}. This is the first of the two parallel review dimensions; the acting analyst identity is remembered for the segregation-of-duties check on insurance verification."
  - method: POST
    path: /prequalifications/{id}/written-programs
    roles: [ContractorAdmin]
    input: [program_type, revision_date, document_ref]
    output: WrittenProgram
    side_effects:
      - "WrittenProgram created with review_status SUBMITTED"
      - "is_required computed from calculations.required_program_set"
      - "Prequalification.document_review_status becomes IN_PROGRESS"
    notes: "Only allowed while Prequalification.status is DRAFT or SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED). revision_date must not be in the future relative to the logical clock. One row per (prequalification_id, program_type); a duplicate is ERR_INVALID_FIELD_VALUE."
  - method: POST
    path: /written-programs/{id}/review
    roles: [ClientSafetyManager]
    input: [decision, "reviewer_note?"]
    output: WrittenProgram
    side_effects:
      - "decision ACCEPT: review_status ACCEPTED; decision WAIVE: review_status WAIVED; decision DEFICIENT: review_status DEFICIENT"
      - "reviewer_note and reviewed_by_user_id written"
      - "Prequalification.document_review_status recomputed: COMPLETE when every program_type in calculations.required_program_set has a row in {ACCEPTED, WAIVED}, DEFICIENT when any required program row is DEFICIENT, else IN_PROGRESS"
      - "re-evaluates the SUBMITTED -> UNDER_REVIEW join"
    notes: "decision is one of {ACCEPT, WAIVE, DEFICIENT}. WAIVE is the client's explicit acceptance of a missing-but-required program and counts as satisfied; a DEFICIENT row on a non-required program leaves document_review_status IN_PROGRESS rather than DEFICIENT."
  - method: POST
    path: /written-programs/{id}/resubmit
    roles: [ContractorAdmin]
    input: [document_ref, revision_date]
    output: WrittenProgram
    side_effects:
      - "review_status returns to SUBMITTED; document_ref and revision_date replaced; reviewer_note and reviewed_by_user_id cleared"
      - "Prequalification.document_review_status recomputed (DEFICIENT can return to IN_PROGRESS)"
    notes: "Only from review_status DEFICIENT (else ERR_TRANSITION_NOT_ALLOWED). This is the document-review loop that makes the review dimension cyclic."
  - method: POST
    path: /prequalifications/{id}/submit
    roles: [ContractorAdmin]
    input: []
    output: Prequalification
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "provisional_composite_score written using calculations.composite_prequalification_score variant provisional (tier tightening forced to 1.00)"
      - "when statistics_verification_status is already VERIFIED and document_review_status is already COMPLETE, the SUBMITTED -> UNDER_REVIEW join fires within the same request"
    notes: "Preconditions in priority order: Contractor ACTIVE (11), Contractor.incident_review_flag false (13), a governing SafetyStatistic exists (14), every required written program present (15)."
  - method: POST
    path: /prequalifications/{id}/grade
    roles: [ClientSafetyManager]
    input: []
    output: Prequalification
    side_effects:
      - "resolves effective_thresholds via calculations.effective_client_threshold_resolution (full 5-step resolution including tier tightening, incident escalation and APPROVED variances) and stores it"
      - "writes final_composite_score via calculations.composite_prequalification_score variant final, then grade via calculations.grade_band_assignment"
      - "calculations.grading_decision selects exactly one of UNDER_REVIEW -> APPROVED, UNDER_REVIEW -> CONDITIONAL or UNDER_REVIEW -> REJECTED, and that transition's declared side-effect chain runs (deficiency_codes, expires_at, conditional_expires_at, Contractor.open_deficiency_count, grant revocation on REJECTED, flow-down recompute)"
      - "graded_at = logical clock, graded_by_user_id = X-User-ID"
    notes: "Only from status UNDER_REVIEW (else ERR_TRANSITION_NOT_ALLOWED). Requires Contractor.incident_review_flag false (13) and every Client.required_coverage_types satisfied by a VERIFIED certificate whose FRESHLY computed lifecycle_status is CURRENT or EXPIRING_SOON (28) - a certificate that has silently LAPSED against the logical clock blocks grading even though its stored lifecycle_status still reads CURRENT."
  - method: POST
    path: /prequalifications/{id}/improvement-plans
    roles: [ClientSafetyManager]
    input: [due_date, milestone_count, expected_prequalification_version]
    output: ImprovementPlan
    side_effects:
      - "ImprovementPlan created in OPEN with deficiency_codes snapshotted from the Prequalification"
      - "increments Prequalification.version by 1"
    notes: "Only when Prequalification.status is CONDITIONAL and no ImprovementPlan for this prequalification is in {OPEN, SUBMITTED} (else ERR_TRANSITION_NOT_ALLOWED). expected_prequalification_version must equal the current Prequalification.version, else ERR_STALE_VERSION (412) - a plan written against a pre-grading snapshot would carry the wrong deficiency set. due_date must be at or before conditional_expires_at."
  - method: POST
    path: /improvement-plans/{id}/submit
    roles: [ContractorAdmin]
    input: [evidence_ref]
    output: ImprovementPlan
    side_effects:
      - "status OPEN -> SUBMITTED; evidence_ref written"
    notes: "Allowed even after due_date has passed (the row reads as OVERDUE but submission is still accepted); rejected once the Prequalification has left CONDITIONAL."
  - method: POST
    path: /improvement-plans/{id}/decision
    roles: [ClientSafetyManager]
    input: [decision]
    output: ImprovementPlan
    side_effects:
      - "decision ACCEPT: status SUBMITTED -> ACCEPTED, closed_at = logical clock, decided_by_user_id = X-User-ID; the Prequalification returns CONDITIONAL -> UNDER_REVIEW with grade, final_composite_score, effective_thresholds, deficiency_codes and conditional_expires_at all cleared; Contractor.open_deficiency_count is recomputed and MUST return to its exact pre-grading value; flow_down_status is recomputed on every ACTIVE SubcontractorLink of the row"
      - "decision REJECT: status SUBMITTED -> OPEN, evidence_ref cleared, decided_by_user_id = X-User-ID; the Prequalification is untouched and stays CONDITIONAL"
    notes: "decision is one of {ACCEPT, REJECT}. Only from status SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED). ACCEPT is the compensating action for the CONDITIONAL grading side effect and must leave zero drift in the conserved deficiency counter."

  # ------------------------------------- writes: insurance, access, incidents ----
  - method: POST
    path: /contractors/{id}/insurance-certificates
    roles: [ContractorAdmin]
    input: [coverage_type, carrier_name, each_occurrence_limit, aggregate_limit, effective_date, expiration_date, "additional_insured?", "waiver_of_subrogation?"]
    output: InsuranceCertificate
    side_effects:
      - "InsuranceCertificate created with verification_status PENDING"
      - "lifecycle_status materialized per calculations.certificate_lifecycle_status against the logical clock"
      - "available_aggregate materialized per calculations.insurance_coverage_adequacy variant aggregate_depletion_basis"
      - "every REJECTED certificate for the same (contractor_id, coverage_type) whose interval intersects the new one becomes lifecycle_status SUPERSEDED"
      - "recomputes Contractor.verified_coverage_types"
    notes: "The half-open interval rule at priority 25 makes a certificate whose effective_date equals the incumbent's expiration_date legal (seamless renewal) while a one-second earlier effective_date is ERR_COVERAGE_PERIOD_OVERLAP."
  - method: POST
    path: /insurance-certificates/{id}/verify
    roles: [VerificationAnalyst]
    input: [decision]
    output: InsuranceCertificate
    side_effects:
      - "decision VERIFY: verification_status VERIFIED, verified_by_user_id = X-User-ID; lifecycle_status and available_aggregate re-materialized; Contractor.verified_coverage_types recomputed"
      - "decision REJECT: verification_status REJECTED, verified_by_user_id = X-User-ID; the coverage_type leaves Contractor.verified_coverage_types and the interval is released"
    notes: "decision is one of {VERIFY, REJECT}. VERIFY additionally enforces calculations.insurance_coverage_adequacy variant per_occurrence_basis (priority 29) and the segregation-of-duties rule at priority 8 - an analyst who already verified any SafetyStatistic of this contractor is refused with ERR_SEGREGATION_OF_DUTIES."
  - method: POST
    path: /site-access-grants
    roles: [ContractorAdmin]
    input: [worker_id, site_id, prequalification_id, expires_at]
    output: SiteAccessGrant
    side_effects:
      - "SiteAccessGrant created in GRANTED with granted_at = logical clock"
      - "qualification_snapshot = the qualification_codes that satisfied calculations.worker_site_eligibility, in HAZARD_QUALIFICATION_MAP order"
      - "increments Site.granted_worker_count by 1 (CONSERVED QUANTITY Q1) and recomputes Site.access_gate_status"
    notes: "This endpoint is the densest gate in the domain. Checks fire strictly in priority order: Contractor ACTIVE (11), Prequalification in {APPROVED, CONDITIONAL} (12), Site gate not LOCKED (16), hazard profile covers the site (17), worker qualifications current (18), revocation cooldown elapsed (26), no overlapping GRANTED window (27), all Client.required_coverage_types VERIFIED and fresh (28), aggregate depletion clears (29), grade at or above the site minimum (30). expires_at must be strictly after the logical clock."
  - method: POST
    path: /site-access-grants/{id}/revoke
    roles: [ClientSafetyManager]
    input: ["revocation_reason?"]
    output: SiteAccessGrant
    side_effects:
      - "status GRANTED -> REVOKED, revoked_at = logical clock, revocation_reason = CLIENT_REVOKED when omitted"
      - "decrements Site.granted_worker_count by 1 (CONSERVED QUANTITY Q1) and recomputes Site.access_gate_status"
      - "starts the ACCESS_COOLDOWN_HOURS window for this (worker_id, site_id) pair"
    notes: "revocation_reason may only be supplied as CLIENT_REVOKED; the three cascade reasons are system-only and are ERR_INVALID_FIELD_VALUE here."
  - method: POST
    path: /incident-reports
    roles: [ClientSafetyManager]
    input: [contractor_id, site_id, occurred_at, severity, description, "osha_reportable?"]
    output: IncidentReport
    side_effects:
      - "IncidentReport created with review_status OPEN"
      - "recomputes Contractor.open_severe_incident_count and Contractor.incident_review_flag"
      - "recomputes available_aggregate on every InsuranceCertificate of the contractor (each open severe incident depletes DEPLETION_PER_OPEN_INCIDENT)"
      - "recomputes Site.access_gate_status (LOCKED when an OPEN LOST_TIME or FATALITY incident exists at the site, counting every contractor)"
      - "when incident_review_flag flips false -> true, every APPROVED or CONDITIONAL Prequalification of this contractor transitions to SUSPENDED, processing order created_at ASC, each revoking its GRANTED SiteAccessGrant rows with revocation_reason PREQUAL_SUSPENDED and recomputing flow_down_status on its ACTIVE SubcontractorLink rows"
      - "triggered_suspension_count records how many Prequalification rows this incident suspended"
    notes: "occurred_at must not be in the future relative to the logical clock. Only incidents with occurred_at within INCIDENT_LOOKBACK_DAYS of the logical clock participate in threshold escalation; the review flag and site lock ignore the lookback and depend only on review_status."
  - method: POST
    path: /incident-reports/{id}/close-review
    roles: [ClientSafetyManager]
    input: [findings_note]
    output: IncidentReport
    side_effects:
      - "review_status OPEN -> CLOSED, closed_at = logical clock, findings_note written"
      - "recomputes Contractor.open_severe_incident_count, Contractor.incident_review_flag, available_aggregate on every certificate, and Site.access_gate_status"
      - "when incident_review_flag flips true -> false, every SUSPENDED Prequalification of this contractor returns to UNDER_REVIEW with grade, final_composite_score, effective_thresholds, deficiency_codes, conditional_expires_at and expires_at cleared; previously revoked grants are NOT restored"
    notes: "The suspension cascade is reversible for the prequalification but not for the grants - reinstating access requires a fresh grade and a fresh grant, which is what makes the cascade lossy by design."
  - method: POST
    path: /prequalifications/{id}/variances
    roles: [ContractorAdmin]
    input: [requirement_code, requested_value, justification]
    output: Variance
    side_effects:
      - "Variance created in REQUESTED; grading is unaffected until it is approved"
    notes: "Allowed while Prequalification.status is in {DRAFT, SUBMITTED, UNDER_REVIEW, CONDITIONAL}. One live row per (prequalification_id, requirement_code) among {REQUESTED, APPROVED}."
  - method: POST
    path: /variances/{id}/decision
    roles: [ClientSafetyManager]
    input: [decision, "expires_at?"]
    output: Variance
    side_effects:
      - "decision APPROVE: status REQUESTED -> APPROVED with expires_at written; the requested_value now replaces the resolved threshold for requirement_code in calculations.effective_client_threshold_resolution step 5 while expires_at > the logical clock"
      - "decision DENY: status REQUESTED -> DENIED, expires_at stays null, and the requirement_code is released for a new request"
    notes: "decision is one of {APPROVE, DENY}. APPROVE requires expires_at strictly after the logical clock, else ERR_INVALID_FIELD_VALUE. A variance is applied only at step 5 of threshold resolution, so it can only loosen an already tightened threshold - it never re-tightens one."
  - method: POST
    path: /subcontractor-links
    roles: [ContractorAdmin]
    input: [parent_contractor_id, child_contractor_id, prequalification_id, scope_of_work]
    output: SubcontractorLink
    side_effects:
      - "SubcontractorLink created in ACTIVE with depth from calculations.subcontractor_depth"
      - "flow_down_status computed from calculations.flow_down_status"
    notes: "Checks fire in priority order: Contractor ACTIVE (11), prime Prequalification in {APPROVED, CONDITIONAL} (12), acyclicity and connectivity to the prime (23), depth within Client.cascade_depth_limit (24), child contractor holds a VERIFIED GL certificate with each_occurrence_limit at or above FLOW_DOWN_MIN_OCCURRENCE 500000 (29). The cycle check runs strictly before the coverage check, so a request that is both cyclic and under-insured returns ERR_SUBCONTRACTOR_CYCLE."
  - method: POST
    path: /subcontractor-links/{id}/terminate
    roles: [ContractorAdmin]
    input: []
    output: SubcontractorLink
    side_effects:
      - "status ACTIVE -> TERMINATED"
      - "every ACTIVE descendant link reachable through this edge on the same prequalification also becomes TERMINATED, processing order depth ASC then created_at ASC"
    notes: "Termination is the only way to shrink the cascade; a terminated edge no longer participates in the acyclicity or depth computations, so a previously rejected edge may become legal afterwards."

  # ---------------------------------------- writes: periodic / batch runs ----
  - method: POST
    path: /clients/{id}/requalification-runs
    roles: [ClientSafetyManager]
    input: []
    output: "{ expired_count: integer, expired_prequalification_ids: string[], conditional_rejected_count: integer, conditional_rejected_prequalification_ids: string[], overdue_plan_count: integer, lapsed_certificate_count: integer }"
    side_effects:
      - "STEP 1 - every CONDITIONAL Prequalification of this client whose conditional_expires_at is at or before the logical clock transitions CONDITIONAL -> REJECTED, processing order conditional_expires_at ASC then created_at ASC, each revoking its GRANTED grants with revocation_reason PREQUAL_REJECTED and recomputing Site.granted_worker_count, Site.access_gate_status, Contractor.open_deficiency_count and flow_down_status"
      - "STEP 2 - every APPROVED, CONDITIONAL or SUSPENDED Prequalification of this client whose expires_at is at or before the logical clock transitions to EXPIRED, processing order expires_at ASC then created_at ASC, with the same revocation and recount chain"
      - "STEP 3 - every OPEN or SUBMITTED ImprovementPlan of this client whose due_date is at or before the logical clock is materialized as OVERDUE"
      - "STEP 4 - lifecycle_status and available_aggregate are re-materialized on every InsuranceCertificate of every contractor holding a prequalification with this client, and Contractor.verified_coverage_types is recomputed"
    notes: "Idempotent by construction: a second run at the same logical clock reports all-zero counts. STEP 1 strictly precedes STEP 2, so a row whose cure deadline and annual expiry both elapsed lands in REJECTED, not EXPIRED - the reverse order would silently forgive an uncured conditional. This endpoint is the only writer that materializes clock-driven expiry."
  - method: POST
    path: /clients/{id}/audit-sampling-runs
    roles: [ClientSafetyManager]
    input: []
    output: "{ selected_count: integer, selected_prequalification_ids: string[] }"
    side_effects:
      - "calculations.audit_sample_selection draws ceil(audit_sample_rate_pct / 100 * eligible_count) rows and moves each NOT_SELECTED -> SELECTED with audit_selected_at = logical clock"
    notes: "An empty eligible pool returns selected_count 0 with an empty array and HTTP 200 - never an error. Selection is deterministic: final_composite_score ASC then created_at ASC, never id."
  - method: POST
    path: /prequalifications/{id}/audit-findings
    roles: [ClientSafetyManager]
    input: [findings_count]
    output: Prequalification
    side_effects:
      - "findings_count 0: audit_state SELECTED -> PASSED, audit_findings_count = 0"
      - "findings_count >= 1: audit_state SELECTED -> FAILED, audit_findings_count = findings_count, AUDIT_SAMPLING appended to deficiency_codes if absent, Contractor.open_deficiency_count recomputed"
    notes: "Requires audit_state SELECTED (else ERR_TRANSITION_NOT_ALLOWED); status is never changed by an audit outcome. findings_count must be >= 0."

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a row outside its own subtree - ContractorAdmin on another contractor's data, ClientSafetyManager on another client's data"
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a field has the wrong JSON type, or an undeclared field is present"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "a supplied value breaks a section 1.1 constraint - unknown enum member, out-of-range number, malformed instant, weights not summing to 1.00, expiration_date at or before effective_date, aggregate_limit below each_occurrence_limit, duplicate program_type, duplicate employee_ref, system-only revocation_reason, APPROVE without a future expires_at, limit outside 1..100"
  # ---- not found ----
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "the client id in the path or body does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "the site id in the path or body does not resolve"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "a contractor id in the path or body does not resolve (including parent_contractor_id and child_contractor_id)"
  - id: ERR_PREQUALIFICATION_NOT_FOUND
    http: 404
    condition: "the prequalification id in the path or body does not resolve"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "the worker id in the path or body does not resolve"
  - id: ERR_INSURANCE_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "the insurance certificate id in the path does not resolve"
  - id: ERR_IMPROVEMENT_PLAN_NOT_FOUND
    http: 404
    condition: "the improvement plan id in the path does not resolve"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "a leaf row id in the path does not resolve - SafetyStatistic, WrittenProgram, WorkerQualification, SiteAccessGrant, IncidentReport, Variance or SubcontractorLink"
  # ---- concurrency & transition ----
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_contractor_version does not equal Contractor.version, or expected_prequalification_version does not equal Prequalification.version"
  - id: ERR_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "the requested transition is not declared from the row's current state in section 1.2 - includes terminal-state lockdown, a repeated trigger on an already-advanced row, grading a row that is not UNDER_REVIEW, creating a second live improvement plan, resubmitting a program that is not DEFICIENT, recording audit findings on a row that is not SELECTED"
  # ---- compliance & cross-entity state ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting VerificationAnalyst already verified a SafetyStatistic belonging to this contractor and therefore may not verify its insurance certificate"
  - id: ERR_CONTRACTOR_NOT_ACTIVE
    http: 409
    condition: "the governing Contractor.status is SUSPENDED or DEBARRED"
  - id: ERR_PREQUAL_NOT_ACTIVE
    http: 409
    condition: "the referenced Prequalification is not in {APPROVED, CONDITIONAL} when a site access grant or subcontractor edge is created"
  - id: ERR_INCIDENT_REVIEW_ACTIVE
    http: 409
    condition: "the contractor has an OPEN IncidentReport of severity LOST_TIME or FATALITY, so submission and grading are frozen"
  - id: ERR_STATISTICS_UNVERIFIED
    http: 409
    condition: "submission attempted with no PENDING or VERIFIED SafetyStatistic on the prequalification"
  - id: ERR_REQUIRED_PROGRAM_MISSING
    http: 422
    condition: "submission attempted while a program_type demanded by the hazard profile has no WrittenProgram row"
  - id: ERR_SITE_GATE_LOCKED
    http: 409
    condition: "the site has an OPEN LOST_TIME or FATALITY incident from any contractor, so its access gate is LOCKED"
  - id: ERR_MISSING_VERIFIED_COVERAGE
    http: 409
    condition: "a coverage type required by the client has no VERIFIED certificate whose freshly computed lifecycle_status is CURRENT or EXPIRING_SOON"
  # ---- worker & hazard ----
  - id: ERR_HAZARD_PROFILE_MISMATCH
    http: 422
    condition: "the site's required hazard classes are not covered by the contractor's hazard profile, or a PATCH would narrow the profile below a site where access is currently granted"
  - id: ERR_WORKER_QUALIFICATION_EXPIRED
    http: 422
    condition: "the worker lacks a qualification whose expiration_date is strictly after the logical clock for a code the site's hazard classes require"
  # ---- statistics ----
  - id: ERR_STATISTICS_INCONSISTENT
    http: 422
    condition: "dart_cases exceed recordable_incidents, fatalities exceed recordable_incidents, or hours_worked is 0 while recordable_incidents is positive"
  - id: ERR_REPORTING_YEAR_OUT_OF_WINDOW
    http: 422
    condition: "reporting_year is outside the four-year window ending at the logical-clock year"
  - id: ERR_DUPLICATE_REPORTING_YEAR
    http: 409
    condition: "a PENDING or VERIFIED SafetyStatistic already exists for that reporting_year on the prequalification"
  - id: ERR_DUPLICATE_PREQUALIFICATION
    http: 409
    condition: "an in-flight prequalification already exists for the contractor/client pair, or an active one already exists for the same cycle_year"
  # ---- cascade ----
  - id: ERR_SUBCONTRACTOR_CYCLE
    http: 409
    condition: "the proposed edge would close a cycle in the prequalification's ACTIVE subcontractor graph, points a contractor at itself, or hangs off a parent unreachable from the prime contractor"
  - id: ERR_CASCADE_DEPTH_EXCEEDED
    http: 422
    condition: "the proposed edge's depth exceeds the client's cascade_depth_limit"
  # ---- temporal ----
  - id: ERR_COVERAGE_PERIOD_OVERLAP
    http: 409
    condition: "the new certificate's half-open coverage interval intersects a PENDING or VERIFIED certificate for the same contractor and coverage type"
  - id: ERR_ACCESS_COOLDOWN_ACTIVE
    http: 409
    condition: "the worker's previous grant at this site was revoked less than ACCESS_COOLDOWN_HOURS before the logical clock"
  - id: ERR_ACCESS_WINDOW_OVERLAP
    http: 409
    condition: "the requested access window intersects the closed window of an existing GRANTED grant for the same worker and site"
  # ---- fiscal ----
  - id: ERR_COVERAGE_LIMIT_INSUFFICIENT
    http: 422
    condition: "certificate limits fall below the required per-occurrence floor at verification, below the depleted-aggregate floor at grading or grant creation, or below the flow-down minimum for a subcontractor edge"
  - id: ERR_GRADE_BELOW_SITE_MINIMUM
    http: 422
    condition: "the prequalification's grade ranks below the site's effective minimum grade"

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Operator of the prequalification network. Owns the tenant registry (clients and contractors) and the logical clock, but never grades, verifies or grants."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /contractors"
      - "PATCH /contractors/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
    notes: "Deliberately excluded from grading, verification and access granting so that no single role can register a contractor and then bless it."
  - name: ContractorAdmin
    description: "Acts for one contractor. Submits its own statistics, programs, certificates, workers, variance requests, subcontractor edges and site access requests."
    identity: entity_backed:Contractor
    exclusive_operations:
      - "POST /prequalifications"
      - "POST /prequalifications/{id}/safety-statistics"
      - "POST /prequalifications/{id}/written-programs"
      - "POST /written-programs/{id}/resubmit"
      - "POST /prequalifications/{id}/submit"
      - "POST /improvement-plans/{id}/submit"
      - "POST /contractors/{id}/insurance-certificates"
      - "POST /contractors/{id}/workers"
      - "POST /workers/{id}/qualifications"
      - "POST /site-access-grants"
      - "POST /prequalifications/{id}/variances"
      - "POST /subcontractor-links"
      - "POST /subcontractor-links/{id}/terminate"
    shared_operations:
      - "every GET endpoint, restricted to rows reachable from its own Contractor.id"
    notes: "X-User-ID must equal the Contractor.id reached from the target row, else ERR_NOT_RESOURCE_OWNER. A ContractorAdmin may create a subcontractor edge only when its own contractor is the prime of the referenced prequalification."
  - name: ClientSafetyManager
    description: "Acts for one client. Sets up sites, reviews written programs, grades submissions, issues improvement plans, decides variances, records incidents, revokes access and runs the periodic batches."
    identity: entity_backed:Client
    exclusive_operations:
      - "POST /clients/{id}/sites"
      - "POST /written-programs/{id}/review"
      - "POST /prequalifications/{id}/grade"
      - "POST /prequalifications/{id}/improvement-plans"
      - "POST /improvement-plans/{id}/decision"
      - "POST /site-access-grants/{id}/revoke"
      - "POST /incident-reports"
      - "POST /incident-reports/{id}/close-review"
      - "POST /variances/{id}/decision"
      - "POST /clients/{id}/requalification-runs"
      - "POST /clients/{id}/audit-sampling-runs"
      - "POST /prequalifications/{id}/audit-findings"
    shared_operations:
      - "every GET endpoint, restricted to rows reachable from its own Client.id"
    notes: "X-User-ID must equal the Client.id reached from the target row, else ERR_NOT_RESOURCE_OWNER. A ClientSafetyManager cannot verify statistics or certificates - verification is reserved for the independent analyst."
  - name: VerificationAnalyst
    description: "Independent third-party verifier. The only role that can move a SafetyStatistic or an InsuranceCertificate out of PENDING."
    identity: opaque
    exclusive_operations:
      - "POST /safety-statistics/{id}/verify"
      - "POST /insurance-certificates/{id}/verify"
    shared_operations:
      - "every GET endpoint, unrestricted"
    notes: "SEGREGATION OF DUTIES: the analyst identity that verified any SafetyStatistic of a contractor is barred from verifying that same contractor's insurance certificates (ERR_SEGREGATION_OF_DUTIES at priority 8). A second, distinct analyst id must perform the other half, so a complete prequalification always carries two independent verifier identities."
