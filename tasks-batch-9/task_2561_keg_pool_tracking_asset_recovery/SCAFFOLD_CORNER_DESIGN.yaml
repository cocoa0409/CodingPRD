        distinguishing_aspect: "The distributor holds the version it read at submission, but the brewer's COUNTER has already moved the claim, so the AGREE is refused 412 even though the distributor IS the side whose turn it is — priority 9 fires before priority 19. The replayed AGREE with the re-read version fixes agreed_offset_cents to the outstanding counter, not to the original claim, and mints a RECONCILIATION_OFFSET accrual that leaves the cooperation counters alone."
