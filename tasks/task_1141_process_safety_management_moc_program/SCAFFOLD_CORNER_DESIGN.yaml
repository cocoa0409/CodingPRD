  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_pssr_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[pssr-create-stale-moc]', 'validations[priority=4]', 'errors[ERR_STALE_MOC_VERSION]']
        distinguishing_aspect: "OCC (priority 4) precedes state checks (priority 5): a PSSR create with a stale expected_moc_version on a CLASSIFIED MOC (wrong state for PSSR anyway) returns 412 ERR_STALE_MOC_VERSION, not 409."
        test_recipe:
          setup: ["Unit U, study CURRENT; REQ; LEAD(PSSR_CERTIFIED); MOC M created (version captured) then classified (version advanced)"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id, v_create: $.data.version } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/pssrs", payload: { field_window_start: "2026-05-01", field_window_end: "2026-05-05", expected_moc_version: "${v_create}" }, as: PssrLead, as_user_id: "${lead_id}", captures: { err: $.data.error_id } }
          assert:
            - "rejected: error_id == ERR_STALE_MOC_VERSION, http 412 (stale ${v_create} vs post-classify version)"
            - "no Pssr row created (GET /psm/moc-requests/${m_id}/pssrs empty)"

