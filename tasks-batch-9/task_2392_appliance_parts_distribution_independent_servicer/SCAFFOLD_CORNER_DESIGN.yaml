              captures: { tier_gold_id: $.data.id }
            - call: "POST /pricing-tiers"
              payload: { tier_code: "SILVER", name: "Silver Contract", discount_pct_electrical: 0.10, discount_pct_mechanical: 0.10, discount_pct_cosmetic: 0.10, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 0 }
              as: PricingAdmin
              captures: { tier_silver_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p4_id}", on_hand_units: 60, reorder_point: 5 }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
              captures: { inv_a_p4_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-3014" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p4_id}", quantity: 50, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "inside limit" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-3014" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "PATCH /servicer-accounts/${acct_s_id}"
              payload: { pricing_tier_id: "${tier_silver_id}" }
              as: CreditManager
          trigger:
            - call: "POST /servicer-accounts/${acct_s_id}/tier-review"
