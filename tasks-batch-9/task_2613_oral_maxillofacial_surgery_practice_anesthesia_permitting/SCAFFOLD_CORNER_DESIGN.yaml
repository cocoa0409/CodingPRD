  # ==========================================================================
  - section: complexity_layers
    instances:
      - name: stale_block_version_blocks_confirmation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-confirm-stale-block]
          - errors[ERR_STALE_BLOCK_VERSION]
        distinguishing_aspect: "Holding the block is itself a write against BlockTime, so the version the client read at block creation is already stale by the time it confirms; the refusal is a 412 that leaves committed_minutes exactly where the hold left them."
        test_recipe:
          setup:
            - "a cleared LOCAL_ONLY case holding 60 of a 240-minute block"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Block OCC OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR" }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
