      - name: scope_score_variants_diverge_on_the_same_candidate_set
        claim_type: variant_divergence
        grounds:
          - calculations.scope_priority_score
        excluded_because:
          difficulty_instance: scope_priority_score_mode_flip_inverts_candidate_ranking
          rationale: "That §1.8 instance computes both RISK_DRIVEN and COMPLIANCE_DRIVEN scores for the same two assets and asserts the ranking inversion, which is the divergence claim with the delta already pinned."

      - name: scope_score_uses_the_variant_named_by_the_plan_mode
        claim_type: variant_selection
        grounds:
          - calculations.scope_priority_score
          - entities.ScopeItem.fields.scored_mode
        excluded_because:
          difficulty_instance: scope_priority_score_mode_flip_inverts_candidate_ranking
          rationale: "The same §1.8 instance asserts scored_mode on every row before and after the prioritization-mode flip, so variant selection is already verified there."

      - name: severity_multiplier_applies_only_to_the_technical_base_score
        claim_type: correct_result
        grounds:
          - calculations.finding_severity_rating
        excluded_because:
          difficulty_instance: severity_multiplier_binds_only_to_technical_base_score
          rationale: "That §1.8 instance contrasts the correct binding against the plausible wrong one (multiplying the tier and regime bonuses too) with both numeric results asserted."

      - name: severity_band_boundary_at_nine_point_zero_zero
        claim_type: threshold
        grounds:
          - calculations.finding_severity_rating
          - entities.Finding.fields.severity_band
        excluded_because:
          difficulty_instance: severity_band_flips_critical_at_exactly_nine_point_zero_zero
          rationale: "The §1.8 boundary instance tests one cent below, exactly at and just above 9.00 together with the alert side effect, which strictly contains the band-threshold claim."

      - name: assurance_score_reconciles_when_the_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.engagement_assurance_score
        excluded_because:
          difficulty_instance: assurance_score_provisional_and_final_diverge_on_identical_findings
          rationale: "That §1.8 instance stamps PROVISIONAL at COMPLETE_FIELDWORK and FINAL at CLOSE over identical finding data and asserts the exact delta produced by the retest credit."

      - name: training_contributions_are_rounded_before_they_are_summed
        claim_type: weighted_scoring
        grounds:
          - calculations.training_priority_score
        excluded_because:
          difficulty_instance: training_priority_rounds_each_contribution_before_summing
          rationale: "The §1.8 instance pins the rounding placement with a 0.01 delta between round-then-sum and sum-then-round, which is the weighted-scoring claim at full depth."

      - name: authorized_target_collision_pads_windows_with_the_cooldown
        claim_type: correct_result
        grounds:
          - calculations.authorized_target_collision
          - validations.priority_54
        excluded_because:
          difficulty_instance: network_target_windows_collide_across_an_inclusive_cooldown_gap
          rationale: "That §1.8 instance places two NETWORK target windows exactly 24 hours apart and shows the cooldown-padded inclusive comparison rejects them, then that one second more separation passes."

      - name: tester_interval_occupancy_counts_half_open_overlaps
        claim_type: aggregation
        grounds:
          - calculations.tester_interval_occupancy
          - validations.priority_56
        excluded_because:
          difficulty_instance: tester_intervals_are_half_open_and_capped_in_aggregate
          rationale: "The §1.8 instance builds touching and overlapping intervals to prove the half-open comparison and the aggregate cap, which subsumes a single occupancy probe."

      - name: assignment_hour_settlement_ceils_the_elapsed_hours
        claim_type: precision
        grounds:
          - calculations.assignment_hour_settlement
        excluded_because:
          difficulty_instance: revocation_exactly_at_interval_start_settles_zero_hours
          rationale: "That §1.8 boundary instance asserts the ceil behaviour at the zero-elapsed boundary and one second past it, so the precision claim is already covered."

  - section: validations
    instances:
      - name: list_pagination_outside_the_declared_range_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 and limit 0 both fall outside 1..100 and a negative offset fails the offset rule, all with 400 ERR_INVALID_PAGINATION, while limit 100 with offset 0 succeeds — the bounds are inclusive."
        test_recipe:
          setup:
            - "One registered asset so the list has content."
          setup_api_calls:
