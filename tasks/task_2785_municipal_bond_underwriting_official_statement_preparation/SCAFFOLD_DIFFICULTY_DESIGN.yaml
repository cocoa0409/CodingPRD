  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_business_constraint_on_order_entry
        grounds:
          - validations[state-transition-legal] (priority 11, category state)
          - validations[denomination-multiple] (priority 15, category business_constraint)
          - errors[ERR_ORDER_PERIOD_INVALID_STATE]
          - errors[ERR_DENOMINATION_INVALID]
        distinguishing_aspect: |
          Category pair is state (priority 11) versus business_constraint (priority 15). One
          request violates both: the order carries a par amount that is not a whole multiple of
          MIN_DENOMINATION_USD and is entered into a CLOSED book. The state error must win, and
          the same malformed order into the same period after it is reopened proves the
          business_constraint rule is genuinely violated rather than merely unreached.
        test_recipe:
          setup:
            - "A PRICING_NEGOTIATED deal has tranche 1 of 5,000,000 and tranche 2 of 5,000,000 and one ACTIVE SENIOR_MANAGER syndicate member at 100.0000 percent."
            - "An INSTITUTIONAL order period runs 2026-08-05T13:00:00Z to 2026-08-05T17:00:00Z and has been opened and then closed with zero orders."
            - "The logical clock stands at 2026-08-05T14:00:00.000Z, inside the window."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
