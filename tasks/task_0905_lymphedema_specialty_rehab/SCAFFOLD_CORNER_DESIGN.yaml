            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
