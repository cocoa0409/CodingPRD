  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_approve_requires_delivered_load
        grounds:
          - validations[priority=22]
          - entities.Load.fields.movement_status
          - entities.AccessorialClaim.fields.status
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - state_machines.AccessorialClaim.SUBMITTED_to_APPROVED
          - calculations.accessorial_pay
        distinguishing_aspect: |
          The gating state lives on the PARENT LOAD, not on the claim: an otherwise perfect
          documented TARPING claim on an IN_TRANSIT load is rejected with ERR_LOAD_NOT_DELIVERED,
          and the very same request succeeds after the load is delivered - the claim row itself is
          byte-identical across the two attempts.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_O: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "driver DRV_O assigned to PKG_O"
            - "load LOAD_O dispatched at 2026-08-03T08:00Z and left IN_TRANSIT, tarp_required true"
            - "documented TARPING claim CLM_O on LOAD_O covering 2026-08-03T09:00Z to 2026-08-03T10:00Z, status SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Tarp", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_o: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_o}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_o}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_o}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Ora Tarp", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_o: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_o}/assign-pay-package"
              payload: { pay_package_id: "${pkg_o}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_o}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_o}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1, tarp_required: true }
              as: SettlementClerk
              captures: { load_o: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_o}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/accessorial-claims"
              payload: { load_id: "${load_o}", driver_id: "${drv_o}", accessorial_type: "TARPING", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T10:00:00Z", document_ref: "doc://tarp-photo-12" }
              as: Driver
              as_user_id: "${drv_o}"
              captures: { clm_o: $.data.id }
