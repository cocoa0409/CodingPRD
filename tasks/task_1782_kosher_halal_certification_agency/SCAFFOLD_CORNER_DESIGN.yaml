          assert: ["err == ERR_CLIENT_INVALID_STATE (409)"]

      - name: window_complete_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.HolidayProductionWindow.CONFIRMED_to_COMPLETED, "errors[ERR_VISIT_WINDOW_NOT_ACTIVE]"]
        distinguishing_aspect: "complete at current_utc < window_end -> ERR_VISIT_WINDOW_NOT_ACTIVE; at exactly window_end it succeeds (inclusive lower bound of completion legality)."
        test_recipe:
