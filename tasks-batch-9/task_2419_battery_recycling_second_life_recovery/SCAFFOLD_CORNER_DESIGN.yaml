              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id", line_v: "$.data.version", line_family: "$.data.chemistry_family" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-20T00:00:00.000Z", window_end: "2026-08-21T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/processing-lines/${line_id}/replumb"
              payload: { chemistry_family: "IRON_PHOSPHATE" }
              as: PlatformAdmin
              captures: { early_family: "$.data.chemistry_family", early_v: "$.data.version" }
            - call: "POST /recycling/processing-lines/${line_id}/replumb"
              payload: { chemistry_family: "NICKEL_RICH" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/processing-lines/${line_id}/replumb"
              payload: { chemistry_family: "IRON_PHOSPHATE" }
              as: PlatformAdmin
          assert:
            - "${line_family} == NICKEL_RICH and ${line_v} == 1 at creation"
            - "The first replumb, taken while the campaign is only SCHEDULED, returns HTTP 200 with ${early_family} == IRON_PHOSPHATE and ${early_v} == 2 - a SCHEDULED campaign does not lock the line"
            - "The second replumb returns HTTP 200 and restores chemistry_family NICKEL_RICH with version == 3, so the campaign's family still matches its line"
            - "The start returns HTTP 200 and ProcessingCampaign.${camp_id}.status == RUNNING"
            - "The third replumb returns HTTP 409 with data.error_id == ERR_LINE_HAS_RUNNING_CAMPAIGN and ProcessingLine.${line_id}.chemistry_family is still NICKEL_RICH with version == 3"

      - name: intake_booking_is_refused_at_a_suspended_campus
        claim_type: conditional_action
        grounds:
          - endpoints[POST /recycling/intakes]
          - errors[ERR_FACILITY_SUSPENDED]
          - validations[priority=9]
          - entities.Facility.status
        distinguishing_aspect: "The intake endpoint is conditional on the receiving campus's own status: the same body is refused with ERR_FACILITY_SUSPENDED (422, priority 9 business safety) at a SUSPENDED campus and accepted at an ACTIVE one, and the refusal outranks nothing else - it is reached only after the body and both foreign keys have already resolved."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one SUSPENDED campus and one ACTIVE campus; one supplier with credit_hold false."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Sparks Annex", state_code: "NV", mech_capacity_kg_per_day: 1000.0, hydro_capacity_kg_per_day: 500.0, status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { bad_fac: "$.data.id", bad_status: "$.data.status" }
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { good_fac: "$.data.id", good_status: "$.data.status" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${bad_fac}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${good_fac}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { ok_id: "$.data.id", ok_custody: "$.data.custody_state", ok_net: "$.data.net_mass_kg" }
          assert:
            - "${bad_status} == SUSPENDED and ${good_status} == ACTIVE (the default)"
            - "The first booking returns HTTP 422 with data.error_id == ERR_FACILITY_SUSPENDED"
            - "GET /recycling/intakes?facility_id=${bad_fac} reports total_count == 0 - the refused booking created nothing"
            - "The second booking returns HTTP 201 with ${ok_custody} == RECEIVED and ${ok_net} == 100.0"
            - "GET /recycling/intakes?facility_id=${good_fac} reports total_count == 1 whose only element is ${ok_id}"

  - section: errors
    instances:
      - name: every_unknown_path_id_returns_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - errors[ERR_MODULE_NOT_FOUND]
          - errors[ERR_LINE_NOT_FOUND]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_DISCHARGE_EVENT_NOT_FOUND]
          - errors[ERR_PASSPORT_NOT_FOUND]
          - errors[ERR_MANIFEST_NOT_FOUND]
        distinguishing_aspect: "Ten sibling read endpoints and one nested action each report a DIFFERENT 404 error_id for a syntactically valid but unknown UUID - a single generic ERR_NOT_FOUND would fail this test - and the nested manifest close proves the manifest id is scoped to its intake: the 404 wins even though that intake's compliance_state would also have blocked the close."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus, one supplier and one NMC622 intake walked to custody PACKAGED with a SUBMITTED manifest; nothing else exists."
          setup_api_calls:
