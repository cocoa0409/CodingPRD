            - call: "POST /sellers"
              payload: { legal_name: "Kestrel Botanicals LLC", email: "ops@kestrel-botanicals.example", tax_id_hash: "TAX-JU-0001", payout_bank_token: "BANK-JU-0001", address_fingerprint: "ADDR-KE-0002" }
