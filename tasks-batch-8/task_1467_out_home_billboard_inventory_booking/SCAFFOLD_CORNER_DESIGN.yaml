            - "Flight B (27 days): cancellation_fee_cents == 200000 (25%)"
            - "Flight C (13 days): cancellation_fee_cents == 400000 (50%)"
            - "Campaign.cancellation_fees_cents == 680000"
      - name: impression_entries_precedence_replay
        claim_type: variant_divergence
        grounds: [calculations.delivered_impressions]
        excluded_because:
          difficulty_instance: impressions_estimated_vs_measured_diverge
          rationale: "AUDIENCE_MEASURED precedence and estimate supersede-on-replay are asserted there (delivered 4000000 vs naive 6400000)."

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID is rejected at priority 1 before any other check."
        test_recipe:
          setup: ["one face exists so the path would otherwise resolve"]
          setup_api_calls:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
          trigger:
            - { call: "GET /api/faces/${f1}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"
      - name: priority_existence_beats_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "Verifying a nonexistent posting record returns 404 ERR_POSTING_RECORD_NOT_FOUND, not the 409 state error — existence (P3) precedes state (P5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "PUT /api/posting-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: { status: "VERIFIED" }, as: OperationsAuditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_POSTING_RECORD_NOT_FOUND (http 404), not ERR_INVALID_STATE"
      - name: flight_outside_campaign_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Flight dates outside [campaign.start_date, campaign.end_date] are rejected as a referential/temporal violation."
        test_recipe:
          setup: ["card published; static face F1 with permit; campaign window 2026-08-01..2026-09-30"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-10-01", end_date: "2026-10-28", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (flight window escapes campaign window)"
      - name: rate_card_publish_tier_config_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", state_machines.RateCard.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Publishing a card whose tier-2 threshold is not greater than tier-1 fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DRAFT card with traffic_tier_1_threshold 250000 > traffic_tier_2_threshold 100000"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 250000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 100000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
          trigger:
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; card stays DRAFT"
      - name: rate_card_duplicate_published_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_RATE_CARD_DUPLICATE_PUBLISHED]"]
        distinguishing_aspect: "At most one PUBLISHED card per (market_code, display_type): publishing a second is rejected."
        test_recipe:
          setup: ["card A PUBLISHED for (NYC, STATIC); card B DRAFT for same pair"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rcA: $.data.id, rcA_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rcA}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rcA_v}" }, as: InventoryManager }
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 300000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rcB: $.data.id, rcB_v: $.data.version } }
          trigger:
            - { call: "PUT /api/rate-cards/${rcB}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rcB_v}" }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RATE_CARD_DUPLICATE_PUBLISHED (http 409); B stays DRAFT"
      - name: advertiser_credit_hold_blocks_confirm_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ADVERTISER_NOT_BOOKABLE]", state_machines.Flight.HELD_to_BOOKED]
        distinguishing_aspect: "Confirm against a CREDIT_HOLD advertiser fails with ERR_ADVERTISER_NOT_BOOKABLE; lifting the hold lets the same confirm through."
        test_recipe:
          setup: ["HELD flight on static F1, campaign APPROVED; advertiser then put on CREDIT_HOLD"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "PUT /api/advertiser-accounts/${adv}", payload: { status: "CREDIT_HOLD" }, as: FinanceAnalyst }
          trigger:
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
            - { call: "PUT /api/advertiser-accounts/${adv}", payload: { status: "ACTIVE" }, as: FinanceAnalyst }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner, captures: { ok_status: $.data.status } }
          assert:
            - "During CREDIT_HOLD: error_id == ERR_ADVERTISER_NOT_BOOKABLE (http 409)"
            - "After return to ACTIVE: confirm succeeds (campaign version unchanged by the failed call), Flight.status == BOOKED"
