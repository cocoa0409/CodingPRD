    instances:
      - name: pathway_return_resubmit_cycle_exhausts_revision_rounds
        grounds:
          - state_machines.PathwayRegistration.SUBMITTED_to_UNDER_REVIEW
          - state_machines.PathwayRegistration.UNDER_REVIEW_to_RETURNED_FOR_INFO
          - state_machines.PathwayRegistration.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.PathwayRegistration.fields.revision_round
          - validations[priority=20]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Cyclic re-entry with a counter bound: SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED
          is traversable four times because revision_round only increments on the RETURNED_FOR_INFO edge,
          and the fifth submission is refused with ERR_REVISION_LIMIT_EXCEEDED while the registration stays
          RETURNED_FOR_INFO at revision_round 3 — the state alone never tells you whether the edge is open.
        test_recipe:
          setup:
            - "One hydrotreating unit HTU-1 and one VERIFIED UCO supplier (so submissions pass the verified-supplier check)."
            - "One DRAFT LCFS pathway registration for UCO on HTU-1 created by officer-a, cycled through RETURN four times so revision_round is 3 and status is RETURNED_FOR_INFO."
            - "Clock at the 2026-08-01T00:00:00Z default throughout."
