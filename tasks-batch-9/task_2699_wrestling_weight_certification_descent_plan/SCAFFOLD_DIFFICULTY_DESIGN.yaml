  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_hydration_fork_divergent_side_effects
        grounds:
          - state_machines.Assessment.DRAFT_to_VALIDATED
          - state_machines.Assessment.DRAFT_to_HYDRATION_FAILED
          - entities.Assessment.fields.hydration_passed
          - entities.HealthFlag.fields.source
          - calculations.minimum_certified_weight
        distinguishing_aspect: |
          Non-linear shape on Assessment: a branching fork DRAFT -> {VALIDATED, HYDRATION_FAILED}
          selected purely by urine_specific_gravity against hydration_max_specific_gravity 1.025,
          with genuinely divergent side-effect sets — the VALIDATED arm computes four certified
          figures and moves the wrestler to PROVISIONAL while raising no flag, and the
          HYDRATION_FAILED arm leaves all four figures null, leaves certification_status
          UNCERTIFIED, and raises a HYDRATION_FAIL HealthFlag. Both arms are terminal-or-forward
          only: there is no join state and no path from HYDRATION_FAILED back to DRAFT.
        test_recipe:
          setup:
            - "One OPEN Season with hydration_max_specific_gravity 1.025 and min_body_fat_pct_male 7.0."
            - "One Team 'Northgate High' with open_flag_severity_total 0 and compliance_status CLEAR."
            - "One CERTIFIED Assessor credentialed for SKINFOLD."
            - "Two DRAFT Assessments on two different wrestlers: Alex Mercer with urine_specific_gravity 1.020 (hydrated) and Blake Ito with 1.030 (dehydrated)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
