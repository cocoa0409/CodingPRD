              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "R-2290-001", effective_date: "2026-01-01", expiry_date: "2033-12-31", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT"] }
              as: ProgramDirector
