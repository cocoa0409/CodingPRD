  # =========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, different triggers, depth >= 3 / >= 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: vet_suspend_cascades_to_vfd_to_feedorder_to_mill
        grounds:
          - state_machines.Veterinarian.ACTIVE_to_SUSPENDED
          - state_machines.VfdAuthorization.ISSUED_to_EXPIRED
          - state_machines.FeedOrder.VALIDATED_to_CANCELLED
          - entities.FeedMill.fields.pending_order_count
        distinguishing_aspect: |
          DEPTH 4 cascade triggered by Inspector suspending a vet:
          Vet(ACTIVE->SUSPENDED) -> VfdAuthorization(ISSUED->EXPIRED) ->
          FeedOrder(VALIDATED->CANCELLED) -> FeedMill.pending_order_count -= 1.
          Each link is caused by the previous link, not by the original
          suspend action.
        test_recipe:
          setup:
            - "Vet V7 issued VFD A7; Order O7 VALIDATED against A7; Mill M7.pending_order_count == 1"
          setup_api_calls:
            - call: "POST /vfd/clinics"
