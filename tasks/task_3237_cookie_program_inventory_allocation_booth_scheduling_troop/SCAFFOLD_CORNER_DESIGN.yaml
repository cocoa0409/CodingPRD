              payload: { season_id: "${s_id}", participant_name: "Scout 19", parent_name: "P19", signed_responsibility: true, assigned_packages: 19 }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { ag19_tier: $.data.incentive_tier }
            - call: "POST /cookie-program/troops/${t1}/agreements"
              payload: { season_id: "${s_id}", participant_name: "Scout 20", parent_name: "P20", signed_responsibility: true, assigned_packages: 20 }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { ag20_tier: $.data.incentive_tier }
          assert:
