            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id, camp_v0: $.data.version }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/one" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_1: $.data.id, page_1_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_1}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_1_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/two" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_2: $.data.id, page_2_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_2}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_2_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_1}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 6000, in_view_impressions: 6000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_1: $.data.id }
            - call: "POST /measurement-batches/${batch_1}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_1}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_2}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 6000, in_view_impressions: 6000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
