  - rule_id: compensating_invariant
    instances:
      - name: seat_release_refund_preserves_ancillary_net_revenue_identity
        grounds:
          - state_machines.SeatAssignment.assignment_state.CONFIRMED_to_RELEASED
          - entities.Booking.fields.recognized_ancillary_net_cents
          - entities.Booking.fields.ancillary_gross_cents
          - calculations.channel_settlement_total
          - calculations.ancillary_revenue_split
        invariant: |
          recognized_ancillary_net_cents == the signed sum of RevenueEntry.net_cents over the
          booking's rows with category != AIR_TRANSPORT, and channel_settlement_total_cents ==
          fare_component_cents + ancillary_gross_cents adjusted by commission and incentive -
          both must hold before the seat sale, after it, and after its compensating refund. The
          REFUND is additive: nothing is deleted or mutated, so the ledger must reconcile to its
          pre-sale value while the row count grows.
        compensating_action: "POST /seat-assignments/{id}/release with release_reason PASSENGER_RELEASE, which posts a mirroring REFUND of -2200 / -88 / -2112"
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; SETTLE_BASE (ECONOMY, base_fare 26000, bundle 27523, BAG_CHECKED_1 INCLUDED q1) is PUBLISHED with an IN_PARITY publication on DIRECT_WEB (commission_bp 0)"
