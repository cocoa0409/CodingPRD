              as: Consumer
              captures: { u_id: $.data.id, u_v0: $.data.version }
            - *k_lender
            - *k_lender_act
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - &k_program_seed
              call: "POST /credit/lender-programs"
              payload: { lender_id: "${lender_id}", product_catalog_item_id: "${item_id}", program_name: "Northstar Personal Loan", program_code: "NS-LOAN-01", min_modeled_score: 560, max_dti_pct: 45.0, max_eligible_utilization_pct: 55.0, annual_fee_cents: 9500, intro_apr_bps: 1800, go_live_at: "2026-08-01T00:00:00Z", expiry_at: "2027-08-01T00:00:00Z", revenue_share_bps: 1000, clawback_rate_bps: 500, clawback_days: 90 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /credit/lender-programs/${prog_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - &k_consent_up
              call: "POST /credit/consumers/${u_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
            - call: "GET /credit/consumers/${u_id}"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
              captures: { u_v1: $.data.version }
            - call: "POST /credit/consumers/${u_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${u_v1}" }
              as: BureauConnector
              captures: { u_snap: $.data.id }
            - &k_prequal_u
              call: "POST /credit/consumers/${u_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${u_id}"
              captures: { u_dec: $.data.id }
            - call: "POST /credit/pre-qualification-decisions/${u_dec}/qualify"
              payload: {}
              as: Referee
            - call: "POST /credit/consumers/${u_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/consumers/${u_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-facets-${u_id}" }
              as: PlatformAdmin
            - call: "GET /credit/consumers/${u_id}"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
              captures: { u_cv: $.data.version }
            - &k_consent_record_up
              call: "POST /credit/consumers/${u_id}/consents/${u_dec}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${u_cv}" }
              as: Consumer
              as_user_id: "${u_id}"
            - &k_present_up
              call: "POST /credit/pre-qualification-decisions/${u_dec}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${u_id}"
              captures: { u_offer: $.data.id }
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9500", channel: "WEB", offer_id: "${u_offer}" }
              as: LenderOps
              captures: { lr_id: $.data.id }
            - call: "POST /credit/referrals/${lr_id}/fund"
              payload: { funded_amount_cents: 600000 }
              as: LenderOps
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/referrals/${lr_id}/reverse"
              payload: { reason_code: "LENDER_RETURNED_FUNDS" }
              as: ComplianceOfficer
              captures: { err_win: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_CLAWBACK_WINDOW_CLOSED\""
            - "Referral.${lr_id}.status is still FUNDED"
            - "no CLAWBACK RevenueRecognitionEntry exists for ${lr_id} and the REVENUE entry still reads 60000"

      - name: clock_cannot_be_moved_backwards
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/credit/_clock/set_current_utc
        distinguishing_aspect: "The logical clock is monotonic: an earlier instant is refused with ERR_CLOCK_NOT_MONOTONIC while an identical instant is accepted as a no-op, so no test can rewind a deadline window."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-10-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_clock: $.data.error_id }
          assert:
            - "the rewind returns 409 ERR_CLOCK_NOT_MONOTONIC"
            - "the clock still reads 2026-10-01T00:00:00Z, observable through a fresh entity's created_at"
            - "a repeat call with the identical instant succeeds as a no-op"

      - name: referral_funding_via_the_marketplace_consumes_the_consent
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OFFER_NOT_RENDERED
          - state_machines.PreQualifiedOffer.RENDERED_to_CONSUMED
        distinguishing_aspect: "The second consumption route — POST /credit/referral-attempts — is the one that requires the offer to be RENDERED, so the same consent cannot be spent twice through the two routes."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with a consented decision, a rendered offer and a sealed consent record."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/offers/${u_offer}/render"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /credit/referral-attempts"
              payload: { decision_id: "${u_dec}", channel: "MARKETPLACE" }
              as: LenderOps
              captures: { att_id: $.data.id }
          assert:
            - "the attempt consumes both the decision and the consent, so PreQualificationDecision.${u_dec}.decision_status == CONSUMED"
            - "the consent record's status is SEALED and its lender_routing_netloc is non-null"
            - "a second attempt on the same decision returns 409 ERR_CONSENT_ALREADY_CONSUMED"
            - "PreQualifiedOffer.${u_offer}.status == CONSUMED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: bureau_connector_cannot_read_consumer_identity
        claim_type: RBAC
        grounds:
          - roles.BureauConnector
          - endpoints.GET_/credit/consumers/{consumer_id}
        distinguishing_aspect: "BureauConnector may pull snapshots but is not listed on the consumer read route, so the connector role cannot exfiltrate the identity it is enriching."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One enrolled consumer."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Id Guard", email: "idguard@x.com", state_code: "CA", bureau_pin: "1593", dti_pct: 35.0 }
              as: Consumer
              captures: { ig_id: $.data.id }
          trigger:
            - call: "GET /credit/consumers/${ig_id}"
              payload: {}
              as: BureauConnector
              captures: { err_bc: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "GET /credit/consumers/${ig_id} succeeds for the same id under as: Consumer"

      - name: referee_cannot_author_targeting_criteria
        claim_type: RBAC
        grounds:
          - roles.Referee
          - endpoints.POST_/credit/lender-programs/{program_id}/targeting-criteria
        distinguishing_aspect: "Targeting criteria are authored by LenderOps, so a Referee attempting to attach a criterion is refused even though the referee role can qualify the decisions those criteria gate."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE program."]
          setup_api_calls:
            - *k_clock
            - *k_lender
            - *k_lender_act
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - *k_program_loan
            - *k_program_act
          trigger:
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "SCORE", operator: "GTE", criterion_value: "640", is_hard_requirement: true }
              as: Referee
              captures: { err_ref: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "GET /credit/lender-programs/${prog_id}/targeting-criteria returns zero rows"
            - "the same call under as: LenderOps succeeds with 201"

      - name: lender_ops_cannot_reverse_a_funded_referral
        claim_type: RBAC
        grounds:
          - roles.LenderOps
          - endpoints.POST_/credit/referrals/{referral_id}/reverse
        distinguishing_aspect: "Reversal is exclusive to ComplianceOfficer, so the role that records funding cannot also record the clawback that undoes it."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One funded referral inside its clawback window."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9600", channel: "WEB", offer_id: "${u_offer}" }
              as: LenderOps
              captures: { lz_id: $.data.id }
            - call: "POST /credit/referrals/${lz_id}/fund"
              payload: { funded_amount_cents: 500000 }
              as: LenderOps
          trigger:
            - call: "POST /credit/referrals/${lz_id}/reverse"
              payload: { reason_code: "LENDER_RETURNED_FUNDS" }
              as: LenderOps
              captures: { err_lr: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "Referral.${lz_id}.status is still FUNDED"
            - "the same call under as: ComplianceOfficer succeeds and creates the CLAWBACK entry"

      - name: consumer_cannot_qualify_a_decision_or_acknowledge_a_dispute
        claim_type: RBAC
        grounds:
          - roles.Consumer
          - endpoints.POST_/credit/pre-qualification-decisions/{decision_id}/qualify
          - endpoints.POST_/credit/dispute-referrals/{dispute_id}/acknowledge
        distinguishing_aspect: "The consumer role is confined to its own enrollment, simulation, present and render routes, so neither the referee-only qualify route nor the referee-only dispute acknowledgement is reachable under it."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with an ELIGIBLE decision and one DRAFT dispute."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Role Bound", email: "role@x.com", state_code: "CA", bureau_pin: "2604", dti_pct: 25.0 }
              as: Consumer
              captures: { rb_id: $.data.id }
            - call: "POST /credit/consumers/${rb_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${rb_id}"
            - call: "GET /credit/consumers/${rb_id}"
              payload: {}
              as: Consumer
              as_user_id: "${rb_id}"
              captures: { rb_v: $.data.version }
            - call: "POST /credit/consumers/${rb_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${rb_v}" }
              as: BureauConnector
              captures: { rb_snap: $.data.id }
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - call: "POST /credit/consumers/${rb_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${rb_id}"
              captures: { rb_dec: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${rb_id}", snapshot_id: "${rb_snap}", inaccuracy_type: "INQUIRY", narrative: "An inquiry from a lender I never applied to appears on this file." }
              as: Referee
              captures: { rb_disp: $.data.id }
          trigger:
            - call: "POST /credit/pre-qualification-decisions/${rb_dec}/qualify"
              payload: {}
              as: Consumer
              as_user_id: "${rb_id}"
              captures: { err_q: $.data.error_id }
          assert:
            - "the qualify call returns 403 ERR_FORBIDDEN_FOR_ROLE"
            - "POST /credit/dispute-referrals/${rb_disp}/acknowledge under as: Consumer also returns 403"
            - "PreQualificationDecision.${rb_dec}.decision_status is still ELIGIBLE"

      - name: platform_admin_can_run_the_ops_sweep_but_not_author_content
        claim_type: RBAC
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/credit/content-quality-facets/{facet_id}/score
        distinguishing_aspect: "PlatformAdmin owns the operations sweep and the clock but is not the author of content quality, so scoring a facet is refused for the admin role while the same call under Referee succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with one facet."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Admin Bound", email: "adminb@x.com", state_code: "CA", bureau_pin: "3715", dti_pct: 35.0 }
              as: Consumer
              captures: { ab_id: $.data.id }
            - call: "POST /credit/consumers/${ab_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 5000 }
              as: Referee
              captures: { ab_f: $.data.id }
          trigger:
            - call: "POST /credit/content-quality-facets/${ab_f}/score"
              payload: { score_bps: 9000 }
              as: PlatformAdmin
              captures: { err_ab: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "ContentQualityFacet.${ab_f}.score_bps is still 5000 and status is still INCOMPLETE"
            - "the same call under as: Referee succeeds and leaves the facet COMPLETE"

  # ---------------------------------------------------------------------------
  - section: excluded_corners
    instances:
      - name: duplicate_calibration_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.compute_calibration_index
        excluded_because:
          difficulty_instance: calibration_index_including_provisional_versus_settled_only
          rationale: "The two-variant divergence of compute_calibration_index is the §1.8 dual-variant instance's whole subject."

      - name: duplicate_ods_floor_rounding_order
        claim_type: precision
        grounds:
          - calculations.simulate_score_delta
        excluded_because:
          difficulty_instance: simulation_recursive_floor_term
          rationale: "The floor-before-sum rounding order of simulate_score_delta is asserted in the §1.8 combinatorial-formula instance."

      - name: duplicate_reversal_compensation_invariant
        claim_type: compensation
        grounds:
          - calculations.compute_revenue_recognition_amount
        excluded_because:
          difficulty_instance: referral_reversal_restores_zero_net_realized
          rationale: "The conserved-cents invariant across funding and reversal is the §1.8 compensating-invariant instance's whole subject."

      - name: duplicate_utilization_penalty_boundary
        claim_type: boundary
        grounds:
          - calculations.compute_modeled_approval_odds
        excluded_because:
          difficulty_instance: utilization_penalty_boundary_exactly_at_thirty_percent
          rationale: "The strict-inequality utilization boundary of the odds formula is asserted in the §1.8 boundary-precision instance."

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:

      - name: stale_consumer_version_blocks_the_pre_consent_funnel
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-complete-stale-consumer]
          - errors.ERR_STALE_VERSION
          - state_machines.Consumer.ACTIVE_to_ACTIVE
        distinguishing_aspect: "The consent write carries an expected_consumer_version that has already advanced, so the OCC check rejects it with 412 and the funnel is not openable on a stale read."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with a PREQUALIFIED decision, a rendered offer and every render facet complete."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /credit/consumers/${u_id}/consents/${u_dec}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${u_v1}" }
              as: Consumer
              as_user_id: "${u_id}"
              captures: { err_occ: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == \"ERR_STALE_VERSION\""
            - "no ConsentRecord was created for the (${u_id}, ${u_dec}) pair"
            - "PreQualificationDecision.${u_dec}.decision_status is still PREQUALIFIED"
            - "retrying with the freshly read version succeeds with 201"

      - name: monitoring_posture_reconciles_after_the_ops_sweep
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Consumer.fields.monitoring_posture
          - endpoints.POST_/credit/_ops/runs
        distinguishing_aspect: "The rolled-up posture is recomputed by the sweep rather than written by the enrollment call, so a consumer can sit IMMATURE and become COMPLETE only once its constituent facets settle."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with one facet complete and one still INCOMPLETE."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Post Ure", email: "posture@x.com", state_code: "CA", bureau_pin: "4826", dti_pct: 35.0 }
              as: Consumer
              captures: { pu_id: $.data.id }
            - call: "POST /credit/consumers/${pu_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/consumers/${pu_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 3000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "posture-first" }
              as: PlatformAdmin
          trigger:
            - call: "GET /credit/render-policies"
              payload: { consumer_id: "${pu_id}" }
              as: Referee
          assert:
            - "with one facet INCOMPLETE the consumer's render_posture is RENDER_FACETS_INCOMPLETE and the monitoring posture is IMMATURE"
            - "scoring the second facet to 9000 and running a fresh ops run moves render_posture to RENDER_OPEN and monitoring posture to COMPLETE"
            - "the posture was never written directly by any facet call"

      - name: rendered_offer_ages_out_by_the_non_rolling_clock
        claim_type: scheduled_actions
        grounds:
          - calculations.compute_offer_freshness
          - state_machines.PreQualifiedOffer.RENDERED_to_STALE
        distinguishing_aspect: "The offer staleness sweep uses the non-rolling clock anchored to the decision, so an offer rendered late still expires on the original schedule rather than thirty days after it was rendered."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-09-30T00:00:00Z before the ops sweep."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/offers/${u_offer}/render"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "stale-offer-sweep" }
              as: PlatformAdmin
          assert:
            - "the offer rendered on 2026-09-01 was already 30 days old on 2026-10-01, so the sweep marks PreQualifiedOffer.${u_offer} STALE on 2026-10-02"
            - "the offer's intent clock was never restarted by the render call"
            - "its parent decision remains PREQUALIFIED and reachable for a fresh present"

      - name: presentation_cap_resets_on_the_ops_window
        claim_type: rate_threshold_triggers
        grounds:
          - entities.OfferPresentationCap.fields.presented_count
          - errors.ERR_OFFER_PRESENTATION_CAP_EXCEEDED
        distinguishing_aspect: "A cumulative per-product presentation counter gates the render route and is reset by the ops sweep, so the same offer that is refused before the run is admitted after it."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with a rendered CARD offer, which lifts presented_count to 1 against a floor of 0."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/offers/${u_offer}/render"
              payload: {}
              as: Consumer
              as_user_id: "${u_id}"
          trigger:
            - call: "GET /credit/offer-presentation-caps"
              payload: { consumer_id: "${u_id}", product_kind: "LOAN" }
              as: Consumer
              as_user_id: "${u_id}"
          assert:
            - "the LOAN presentation counter reads presented_count 1 and its cap floor is 0, so exceeds_cap is true"
            - "a second LOAN offer for the same consumer is refused with ERR_OFFER_PRESENTATION_CAP_EXCEEDED"
            - "after an ops run with a fresh run_key the counter resets to 0 and the second render is admitted"

      - name: archived_consent_records_stay_queryable_through_the_filter
        claim_type: soft_delete
        grounds:
          - entities.ConsentRecord.fields.archive_status
          - endpoints.GET_/credit/consent-records
        distinguishing_aspect: "Archival is a status flip rather than a delete, so an ARCHIVED consent record is absent from a status-scoped read but still returned by the archive filter."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then advanced 366 days for the retention sweep."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9700", channel: "WEB", offer_id: "${u_offer}" }
              as: LenderOps
              captures: { arch_r: $.data.id }
          trigger:
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "retention-sweep" }
              as: PlatformAdmin
          assert:
            - "the consent record's status is still SEALED but its archive_status is now ARCHIVED"
            - "GET /credit/consent-records?archive_status=ARCHIVED returns the record"
            - "the record is still reachable from GET /credit/consumers/${u_id}/consent-records"
            - "Referral.${arch_r}.status == FUNDED and its REVENUE entry is untouched by the retention sweep"

      - name: every_write_in_the_funnel_is_atomically_visible
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/credit/referrals
        distinguishing_aspect: "The consent consumption, decision transition and referral creation are visible in the same response and the immediately following read, so no re-read is needed to observe the end state."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer consented and rendered, ready to open a referral."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9800", channel: "WEB", offer_id: "${u_offer}" }
              as: LenderOps
              captures: { atom_r: $.data.id }
          assert:
            - "the create response already carries status SENT and the copied revenue_share_bps 1000"
            - "PreQualificationDecision.${u_dec}.decision_status == CONSUMED on the immediately following read, with no wait"
            - "the consent record reads SEALED on the same read"
            - "the offer reads CONSUMED on the same read"
