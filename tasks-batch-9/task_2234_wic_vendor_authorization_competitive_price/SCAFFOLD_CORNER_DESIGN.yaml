      - name: reauthorization_hold_blocks_completion
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_REAUTHORIZATION_HOLD"
          - "validations[priority 39]"
          - "endpoints[POST /vendors/{id}/complete-reauthorization]"
        excluded_because:
          difficulty_instance: visit_failure_cascades_to_compliance_buy_and_reauth_hold
          rationale: |
            ERR_REAUTHORIZATION_HOLD is triggered as the fourth-hop consequence of that
            §1.8 cascade: the second failed visit crosses HIGH_RISK_FINDING_THRESHOLD,
            which sets compliance_buy_required, which sets reauthorization_hold, which
            makes POST /vendors/{id}/complete-reauthorization return 409. Re-testing the
            code in isolation would require reproducing that same chain.

      - name: incomplete_price_submissions_block_authorization
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_PRICE_SUBMISSIONS_INCOMPLETE"
          - "validations[priority 36]"
          - "entities.Vendor.fields.price_submission_complete"
        excluded_because:
          difficulty_instance: item_delist_cascades_to_ceilings_submissions_and_authorization_block
          rationale: |
            ERR_PRICE_SUBMISSIONS_INCOMPLETE is triggered at the end of that §1.8
            cascade, after the delist voids both vendors' accepted submissions and
            price_submission_complete is recomputed to false. That instance already
            asserts the 409 and that the already-authorized vendor is not retroactively
            de-authorized.

      - name: paid_claim_cannot_be_adjusted
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_CLAIM_ALREADY_PAID"
          - "validations[priority 18]"
          - "endpoints[POST /reimbursement-adjustments]"
        excluded_because:
          difficulty_instance: paid_claim_state_beats_recoupment_fiscal_on_adjustment_create
          rationale: |
            ERR_CLAIM_ALREADY_PAID is the asserted outcome of that §1.8 priority-pair
            instance, which additionally proves the competing fiscal rule 41 was masked
            rather than absent.

      - name: adjudication_requires_published_cycle
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_NO_PUBLISHED_PRICE_CYCLE"
          - "validations[priority 38]"
          - "state_machines.RedemptionClaim[SUBMITTED -> ADJUDICATED]"
        excluded_because:
          difficulty_instance: adjudicate_blocked_when_no_published_price_cycle
          rationale: |
            ERR_NO_PUBLISHED_PRICE_CYCLE is triggered twice in that §1.8 instance — once
            with the cycle OPEN and once with it CLOSED and a PROVISIONAL ceiling already
            written — before the third attempt succeeds against a PUBLISHED cycle.

      - name: expired_training_blocks_authorization
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_VENDOR_TRAINING_EXPIRED"
          - "validations[priority 21]"
          - "calculations.reauthorization_and_training_dates"
        excluded_because:
          difficulty_instance: training_safety_beats_peer_group_referential_on_authorize
          rationale: |
            ERR_VENDOR_TRAINING_EXPIRED is the asserted outcome of the first authorize
            call in that §1.8 instance, where the clock has passed
            training_expires_at 2027-07-15T00:00:00Z.

      - name: overlapping_cycle_window_rejected
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_CYCLE_WINDOW_OVERLAP"
          - "validations[priority 13]"
          - "endpoints[POST /price-cycles]"
        excluded_because:
          difficulty_instance: price_cycle_window_allows_touching_boundary_but_rejects_overlap
          rationale: |
            ERR_CYCLE_WINDOW_OVERLAP is triggered there by a window that intersects an
            existing one by a single millisecond, and the same instance also shows
            ERR_INVALID_CYCLE_WINDOW and ERR_DUPLICATE_CYCLE_CODE winning on priority.

      - name: no_matching_peer_group_rejected
        claim_type: error_triggerability
        grounds:
          - "errors.ERR_NO_PEER_GROUP_MATCH"
          - "validations[priority 37]"
          - "calculations.peer_group_assignment"
        excluded_because:
          difficulty_instance: peer_group_band_upper_bound_is_inclusive_on_submit_application
          rationale: |
            ERR_NO_PEER_GROUP_MATCH is triggered at 4999999 cents — one cent below the
            only eligible band — in that §1.8 boundary instance, which also pins the
            inclusive upper bound and the band_width tie-break.

  # ===========================================================================
  # From Table 7 (RBAC) — §1.7, role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:

      - name: analyst_cannot_authorize_or_publish
        claim_type: exclusive_operation_denied
        grounds:
          - roles.VendorUnitAnalyst
          - roles.VendorUnitSupervisor
          - endpoints[POST /vendors/{id}/authorize]
          - endpoints[POST /price-cycles/{id}/publish-ceilings]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          VendorUnitAnalyst owns intake and review but none of the supervisor's
          committing operations: authorize and publish-ceilings both return 403 for the
          analyst even when every business precondition is satisfied, and the refusal
          leaves no partial effect (the vendor stays IN_REVIEW and the cycle stays
          CLOSED with its PROVISIONAL ceiling intact).
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; PG-SUPER-A, MILK, ITEM_MILK, cycle 2026Q3"
            - "Vendor v1 trained, IN_REVIEW, with an ACCEPTED milk submission — i.e. authorize would succeed for a supervisor"
            - "Cycle 2026Q3 closed, so a PROVISIONAL ceiling exists and publish-ceilings would succeed for a supervisor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
