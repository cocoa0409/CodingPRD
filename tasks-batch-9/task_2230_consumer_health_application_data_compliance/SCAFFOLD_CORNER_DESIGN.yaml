            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "d2", display_name: "Depth two", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${d1}" }
              as: DataSteward
              captures: { d2: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "d3", display_name: "Depth three", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${d2}" }
              as: DataSteward
              captures: { d3: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "d4", display_name: "Depth four", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${d3}" }
              as: DataSteward
              captures: { d4: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "d5", display_name: "Depth five", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${d4}" }
              as: DataSteward
              captures: { d5: $.data.id }
          trigger:
            - call: "POST /health-data/data-elements"
