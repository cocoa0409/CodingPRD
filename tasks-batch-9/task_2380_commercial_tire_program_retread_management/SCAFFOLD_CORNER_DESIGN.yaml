              payload: { name: "Sideeffect Commercial", location_code: "SEC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4015", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
