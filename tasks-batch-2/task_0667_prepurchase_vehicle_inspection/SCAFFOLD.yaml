# =============================================================================
# Scaffold: task_0667 — Pre-Purchase Vehicle Inspection & VIN History
# (Lemon Squad / Carfax style)
# Difficulty: Expert
# =============================================================================

scenario: |
  667. Pre-Purchase Vehicle Inspection & VIN History (Lemon Squad/Carfax style):
  inspection order & location dispatch, multi-point/road-test report & photos,
  VIN history & title/odometer/branding, rush & turnaround, buyer delivery &
  dispute, dealer/auction account, recall lookup, fee

domain_name: prepurchase-vehicle-inspection
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation       # estimated vs actual turnaround/fee
    - cascading_side_effects         # dispatch -> report -> delivery -> dispute -> compensation
    - rate_threshold_triggers        # rush surcharge tiers, odometer rollback threshold
    - optimistic_concurrency         # OCC on InspectionOrder.version for assignment create

  entity_topology: flat
  # Peer entities linked by foreign keys (Account, Inspector, InspectionOrder,
  # DispatchAssignment, InspectionReport, VinReport, Dispute, ...). URL paths
  # are flat resource collections with FK ids in the body, not nested trees.

  state_machine_shape: parallel
  # InspectionOrder carries two independent state axes (workflow_status x
  # payment_status). Dispute is cyclic (revision/reopen loop). Report is
  # branching (PASS / CONDITIONAL / FAIL with divergent side effects).

  relationship_patterns:
    - one_to_many        # Account -> InspectionOrder; InspectionReport -> ReportPhoto
    - flat_with_references  # InspectionOrder references Account, Vehicle, Inspector via FK
    - cross_aggregate    # Dispute references InspectionReport & InspectionOrder across aggregates

  role_model: peer_roles
  # AccountHolder (dealer/auction/buyer entity) owns orders & disputes;
  # Inspector owns dispatch acceptance & report authoring; OpsAdmin operates
  # dispatch, pricing, recalls, clock (opaque operator).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_type, type: enum, source: input, description: "DEALER | AUCTION | INDIVIDUAL", constraints: "one of DEALER, AUCTION, INDIVIDUAL" }
      - { name: legal_name, type: string, source: input, description: "Account legal/display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across active accounts" }
      - { name: net_terms_days, type: integer, source: input, default: 0, description: "Invoice net terms in days; DEALER/AUCTION may use >0 (invoice billing), INDIVIDUAL must be 0 (prepaid)" }
      - { name: rush_discount_pct, type: number, source: input, default: 0, description: "Negotiated rush surcharge discount, 0..0.50; applied to rush surcharge only", constraints: "0 <= rush_discount_pct <= 0.50" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new orders" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of fee_total_cents for this account's orders whose payment_status is INVOICED (unpaid, net-terms billing)" }

  - name: Vehicle
    parent: null
    common_fields: false
    fields:
      - { name: vin, type: string, source: input, description: "17-char VIN; immutable identity of the inspected vehicle", constraints: "exactly 17 uppercase alphanumeric chars, excludes I,O,Q" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: enum, source: input, description: "STANDARD | PREMIUM | HEAVY_DUTY — inspection package tier", constraints: "one of STANDARD, PREMIUM, HEAVY_DUTY" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base inspection fee for this tier" }
      - { name: vin_history_fee_cents, type: integer, source: input, description: "Add-on fee when VIN history report is bundled" }
      - { name: per_mile_dispatch_cents, type: integer, source: input, description: "Dispatch travel charge per mile from inspector base to location" }
      - { name: effective, type: boolean, source: input, default: true, description: "Whether this schedule may be referenced by new orders" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: base_lat, type: number, source: input, description: "Inspector home-base latitude" }
      - { name: base_lng, type: number, source: input, description: "Inspector home-base longitude" }
      - { name: certified_tiers, type: array, source: input, description: "Subset of {STANDARD, PREMIUM, HEAVY_DUTY} the inspector may perform", constraints: "non-empty array of tier_code enum values" }
      - { name: max_daily_jobs, type: integer, source: input, default: 3, description: "Max accepted assignments whose window_start falls on a single calendar date (UTC)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | OFFLINE — OFFLINE inspectors are not eligible for dispatch" }

  - name: InspectionOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; ordering account" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle to inspect" }
      - { name: fee_schedule_id, type: string, source: input, description: "FK -> FeeSchedule.id; pricing tier selected at order time (version-pinned)" }
      - { name: location_lat, type: number, source: input, description: "Inspection location latitude" }
      - { name: location_lng, type: number, source: input, description: "Inspection location longitude" }
      - { name: dispatch_miles, type: number, source: input, description: "Pre-computed road miles from chosen inspector base to location; supplied on dispatch" }
      - { name: include_vin_history, type: boolean, source: input, default: false, description: "Whether VIN history add-on is purchased" }
      - { name: rush_tier, type: enum, source: input, default: "NONE", description: "NONE | EXPRESS | SAME_DAY — turnaround urgency, drives surcharge & SLA hours", constraints: "one of NONE, EXPRESS, SAME_DAY" }
      - { name: ordered_at, type: datetime, source: system, description: "Logical clock time at order creation; SLA deadline is measured from this" }
      - { name: sla_deadline, type: datetime, source: computed, description: "ordered_at + SLA hours for rush_tier (see turnaround_sla calc)" }
      - { name: workflow_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | DISPATCHED | IN_PROGRESS | REPORTED | DELIVERED | CANCELLED — fulfillment axis" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PAID | INVOICED | REFUNDED — billing axis, independent of workflow_status" }
      - { name: estimated_fee_cents, type: integer, source: computed, default: 0, description: "Forward-looking fee quoted at order creation (estimated turnaround on-time)" }
      - { name: fee_total_cents, type: integer, source: computed, default: 0, description: "Final fee charged at delivery, reflecting actual on-time/late SLA outcome" }
      - { name: late_delivery, type: boolean, source: computed, default: false, description: "True if order was DELIVERED after sla_deadline" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Cumulative amount refunded via dispute compensation" }

  - name: DispatchAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; order being dispatched" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: window_start, type: datetime, source: input, description: "Inspection appointment window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Inspection appointment window end (exclusive)" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | RELEASED — RELEASED frees the slot" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; one report per order" }
      - { name: assignment_id, type: string, source: input, description: "FK -> DispatchAssignment.id; the accepted assignment authoring this report" }
      - { name: odometer_reading, type: integer, source: input, description: "Odometer miles recorded at inspection" }
      - { name: points_total, type: integer, source: input, description: "Number of inspection checkpoints evaluated (multi-point)" }
      - { name: points_failed, type: integer, source: input, description: "Number of checkpoints that failed", constraints: "0 <= points_failed <= points_total" }
      - { name: road_test_done, type: boolean, source: input, default: false, description: "Whether a road test was performed" }
      - { name: condition_score, type: number, source: computed, description: "Weighted 0..100 condition score (see condition_score calc)" }
      - { name: outcome, type: enum, source: computed, description: "PASS | CONDITIONAL | FAIL — derived from condition_score & critical failures" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | AMENDED — author lifecycle" }

  - name: ReportPhoto
    parent: null
    common_fields: false
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> InspectionReport.id; owning report" }
      - { name: caption, type: string, source: input, description: "Photo caption" }
      - { name: is_critical, type: boolean, source: input, default: false, description: "Whether this photo documents a critical/safety defect" }
      - { name: url, type: string, source: input, description: "Stored photo URL" }

  - name: VinHistoryRecord
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; subject vehicle" }
      - { name: record_type, type: enum, source: input, description: "TITLE | ODOMETER | BRANDING — type of historical event", constraints: "one of TITLE, ODOMETER, BRANDING" }
      - { name: event_date, type: datetime, source: input, description: "Date the historical event occurred (used for chronological ordering)" }
      - { name: odometer_value, type: integer, source: input, default: 0, description: "Mileage on record (ODOMETER records); 0 for non-ODOMETER" }
      - { name: branding_code, type: enum, source: input, default: "NONE", description: "NONE | SALVAGE | FLOOD | LEMON | REBUILT — title brand (BRANDING records)", constraints: "one of NONE, SALVAGE, FLOOD, LEMON, REBUILT" }
      - { name: title_state, type: string, source: input, default: "", description: "Issuing state code (TITLE records)" }

  - name: VinReport
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; order this VIN report serves" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; subject vehicle" }
      - { name: odometer_rollback, type: boolean, source: computed, default: false, description: "True if a later ODOMETER record reads lower than an earlier one beyond tolerance (see odometer_rollback calc)" }
      - { name: worst_branding, type: enum, source: computed, default: "NONE", description: "Most severe branding_code across BRANDING records (severity rank)" }
      - { name: title_count, type: integer, source: computed, default: 0, description: "Count of TITLE records (number of prior owners/title transfers)" }
      - { name: open_recall_count, type: integer, source: computed, default: 0, description: "Count of matching RecallRecord rows still OPEN at compile time" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "0..100 title-history risk score (see vin_risk_score calc)" }
      - { name: status, type: enum, source: system, default: "COMPILED", description: "COMPILED — terminal once generated" }

  - name: RecallRecord
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Manufacturer recall campaign id" }
      - { name: year, type: integer, source: input, description: "Affected model year" }
      - { name: make, type: string, source: input, description: "Affected make" }
      - { name: model, type: string, source: input, description: "Affected model" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH — recall severity", constraints: "one of LOW, MEDIUM, HIGH" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED — CLOSED recalls excluded from open_recall_count" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> InspectionOrder.id; disputed order" }
      - { name: report_id, type: string, source: input, description: "FK -> InspectionReport.id; report under dispute" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; filing account (must own the order)" }
      - { name: reason, type: enum, source: input, description: "MISSED_DEFECT | LATE_DELIVERY | WRONG_VEHICLE — dispute basis", constraints: "one of MISSED_DEFECT, LATE_DELIVERY, WRONG_VEHICLE" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount the filer claims should be refunded" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Amount actually approved at resolution (see dispute_refund calc)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | NEEDS_INFO | RESOLVED | REJECTED — cyclic via NEEDS_INFO->OPEN" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # InspectionOrder — PARALLEL dimensions: workflow_status x payment_status
  # ---------------------------------------------------------------------------
  - entity: InspectionOrder
    initial_state: DRAFT          # workflow_status initial; payment_status initial = UNPAID
    terminal_states: [CANCELLED]  # DELIVERED is near-terminal for workflow but disputes may still mutate payment axis
    transitions:
      # --- workflow_status axis ---
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /dispatch-assignments (assignment ACCEPTED for this order)"
        actor: system
        preconditions:
          - "Order.workflow_status == DRAFT"
          - "Account.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "expected_order_version matches Order.version (ERR_STALE_VERSION)"
        side_effects:
          - "workflow_status -> DISPATCHED"
          - "increments InspectionOrder.version by 1"
        note: "Driven by accepting a DispatchAssignment; see DispatchAssignment OFFERED->ACCEPTED."

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /inspection-reports (report DRAFT created for order)"
        actor: Inspector
        preconditions:
          - "Order.workflow_status == DISPATCHED"
          - "An ACCEPTED DispatchAssignment exists for this order (ERR_NO_ACCEPTED_ASSIGNMENT)"
        side_effects:
          - "workflow_status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: REPORTED
        trigger: "POST /inspection-reports/{id}/submit"
        actor: Inspector
        preconditions:
          - "Order.workflow_status == IN_PROGRESS"
          - "Report.status == DRAFT"
          - "Report.points_total >= 1 (ERR_EMPTY_REPORT)"
          - "If outcome would be FAIL: at least one ReportPhoto with is_critical=true exists (ERR_CRITICAL_PHOTO_REQUIRED)"
        side_effects:
          - "Report.status -> SUBMITTED"
          - "Report.condition_score & Report.outcome computed (condition_score calc)"
          - "workflow_status -> REPORTED"

      - from: REPORTED
        to: DELIVERED
        trigger: "POST /inspection-orders/{id}/deliver"
        actor: OpsAdmin
        preconditions:
          - "Order.workflow_status == REPORTED"
          - "Order.payment_status IN {PAID, INVOICED} (ERR_PAYMENT_REQUIRED)"
          - "If include_vin_history: a VinReport exists for the order (ERR_VIN_REPORT_MISSING)"
        side_effects:
          - "workflow_status -> DELIVERED"
          - "late_delivery := (current_clock > sla_deadline)"
          - "fee_total_cents finalized (fee_final calc) — may differ from estimated_fee_cents when late"
          - "If late_delivery and payment_status==INVOICED: outstanding_balance recomputed off final fee"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /inspection-orders/{id}/cancel"
        actor: AccountHolder
        preconditions:
          - "Order.workflow_status == DRAFT"
        side_effects:
          - "workflow_status -> CANCELLED"
          - "If payment_status == PAID: payment_status -> REFUNDED, refunded_cents := fee_total_cents (full refund), Account.outstanding_balance untouched"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /inspection-orders/{id}/cancel"
        actor: AccountHolder
        preconditions:
          - "Order.workflow_status == DISPATCHED"
        side_effects:
          - "workflow_status -> CANCELLED"
          - "Cascade: the ACCEPTED DispatchAssignment for this order -> RELEASED (frees inspector slot)"
          - "If payment_status == PAID: payment_status -> REFUNDED, refunded_cents := fee_total_cents"

      # --- payment_status axis (independent of workflow_status) ---
      - from: UNPAID
        to: PAID
        trigger: "POST /inspection-orders/{id}/pay"
        actor: AccountHolder
        preconditions:
          - "Order.payment_status == UNPAID"
          - "Order.workflow_status != CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "payment_status -> PAID"
        note: "Prepaid path; used by INDIVIDUAL accounts (net_terms_days==0)."

      - from: UNPAID
        to: INVOICED
        trigger: "POST /inspection-orders/{id}/invoice"
        actor: OpsAdmin
        preconditions:
          - "Order.payment_status == UNPAID"
          - "Account.net_terms_days > 0 (ERR_INVOICE_NOT_ELIGIBLE)"
          - "Order.workflow_status != CANCELLED"
        side_effects:
          - "payment_status -> INVOICED"
          - "Account.outstanding_balance_cents += order.estimated_fee_cents (recomputed to final on delivery)"
        note: "Net-terms billing path for DEALER/AUCTION."

  # ---------------------------------------------------------------------------
  # DispatchAssignment — branching: OFFERED -> {ACCEPTED, DECLINED}; ACCEPTED -> RELEASED
  # ---------------------------------------------------------------------------
  - entity: DispatchAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /dispatch-assignments/{id}/accept"
        actor: Inspector
        preconditions:
          - "Assignment.status == OFFERED"
          - "Acting inspector == Assignment.inspector_id"
          - "Inspector.status == AVAILABLE (ERR_INSPECTOR_OFFLINE)"
          - "Order.fee_schedule tier_code IN Inspector.certified_tiers (ERR_TIER_NOT_CERTIFIED)"
          - "No other ACCEPTED assignment for this inspector overlaps [window_start, window_end) — HALF-OPEN: touching endpoints (a.end == b.start) do NOT collide (ERR_WINDOW_OVERLAP)"
          - "The same Vehicle (this order's vehicle_id) has no other ACCEPTED assignment whose window collides under CLOSED-interval semantics — touching endpoints (a.end == b.start) DO collide, since the car cannot be in two appointments back-to-back (ERR_VEHICLE_DOUBLE_BOOKED)"
          - "Inspector's ACCEPTED assignments with window_start on this date < max_daily_jobs (ERR_DAILY_CAP_EXCEEDED)"
        side_effects:
          - "Assignment.status -> ACCEPTED"
          - "Cascade: Order.workflow_status DRAFT -> DISPATCHED, increments InspectionOrder.version by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /dispatch-assignments/{id}/decline"
        actor: Inspector
        preconditions:
          - "Assignment.status == OFFERED"
          - "Acting inspector == Assignment.inspector_id"
        side_effects:
          - "Assignment.status -> DECLINED"

      - from: ACCEPTED
        to: RELEASED
        trigger: "system (cascade from Order cancel) OR POST /dispatch-assignments/{id}/release"
        actor: OpsAdmin
        preconditions:
          - "Assignment.status == ACCEPTED"
          - "Order.workflow_status IN {DISPATCHED, CANCELLED} (ERR_INVALID_STATE) — cannot release once IN_PROGRESS"
        side_effects:
          - "Assignment.status -> RELEASED (inspector slot freed for overlap/daily-cap re-eligibility)"
          - "If triggered via direct release while Order.workflow_status == DISPATCHED: Order.workflow_status -> DRAFT, increments InspectionOrder.version by 1"

  # ---------------------------------------------------------------------------
  # InspectionReport — branching outcome, with amend loop
  # ---------------------------------------------------------------------------
  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inspection-reports/{id}/submit"
        actor: Inspector
        preconditions:
          - "Report.status == DRAFT"
          - "Report.points_total >= 1 (ERR_EMPTY_REPORT)"
          - "If computed outcome == FAIL: >=1 critical ReportPhoto exists (ERR_CRITICAL_PHOTO_REQUIRED)"
        side_effects:
          - "condition_score & outcome computed (condition_score calc)"
          - "Order.workflow_status IN_PROGRESS -> REPORTED"

      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /inspection-reports/{id}/amend"
        actor: Inspector
        preconditions:
          - "Report.status == SUBMITTED"
          - "Order.workflow_status != DELIVERED (ERR_REPORT_LOCKED) — cannot amend after delivery except via dispute"
        side_effects:
          - "Report.status -> AMENDED"
          - "condition_score & outcome recomputed from amended points/odometer"
          - "Order.workflow_status REPORTED -> IN_PROGRESS (re-submit required)"
        note: "Amend re-opens authoring; a fresh submit returns it to SUBMITTED/REPORTED."

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /inspection-reports/{id}/submit"
        actor: Inspector
        preconditions:
          - "Report.status == AMENDED"
          - "Report.points_total >= 1 (ERR_EMPTY_REPORT)"
          - "If computed outcome == FAIL: >=1 critical ReportPhoto exists (ERR_CRITICAL_PHOTO_REQUIRED)"
        side_effects:
          - "condition_score & outcome recomputed"
          - "Order.workflow_status IN_PROGRESS -> REPORTED"

  # ---------------------------------------------------------------------------
  # Dispute — CYCLIC: OPEN -> UNDER_REVIEW -> NEEDS_INFO -> OPEN (revision loop)
  # ---------------------------------------------------------------------------
  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/start-review"
        actor: OpsAdmin
        preconditions:
          - "Dispute.status == OPEN"
        side_effects:
          - "Dispute.status -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /disputes/{id}/request-info"
        actor: OpsAdmin
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects:
          - "Dispute.status -> NEEDS_INFO"

      - from: NEEDS_INFO
        to: OPEN
        trigger: "POST /disputes/{id}/supply-info"
        actor: AccountHolder
        preconditions:
          - "Dispute.status == NEEDS_INFO"
          - "Acting account == Dispute.account_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Dispute.status -> OPEN"
        note: "Revision loop — dispute returns to OPEN for another review round."

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: OpsAdmin
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "Order.workflow_status == DELIVERED (ERR_INVALID_STATE) — disputes resolve only against delivered orders"
        side_effects:
          - "approved_cents computed (dispute_refund calc)"
          - "Cascade A (refund): Order.refunded_cents += approved_cents; if Order.payment_status == PAID and approved_cents > 0 -> Order.payment_status -> REFUNDED; if INVOICED -> Account.outstanding_balance_cents -= approved_cents"
          - "Cascade B (report amend on MISSED_DEFECT): if reason==MISSED_DEFECT, linked InspectionReport.status SUBMITTED -> AMENDED and Order.workflow_status DELIVERED stays (report flagged for re-author)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{id}/reject"
        actor: OpsAdmin
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects:
          - "Dispute.status -> REJECTED; approved_cents stays 0; no refund"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-order
    parent_entity: InspectionOrder
    write_endpoint: "POST /dispatch-assignments"
    occ_field: "expected_order_version"
    description: |
      Creating a DispatchAssignment offer against an InspectionOrder whose
      version has advanced since the client last observed it is rejected on a
      stale-version basis. An accepted assignment legitimately supersedes a
      prior dispatch attempt (it drives the order DRAFT -> DISPATCHED and bumps
      the order version); a second offer carrying the pre-dispatch version is
      therefore working from a stale view of the order and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 instance A (dual-variant, Order fee domain) ---
  - name: fee_estimated
    trigger: "POST /inspection-orders (order creation) — forward-looking quote"
    algorithm: forward_looking
    formula: |
      # All amounts in integer cents. Evaluation order is PINNED:
      #   step 1: base components -> step 2: rush surcharge -> step 3: account discount -> step 4: round nothing (already integer cents)
      base = fee_schedule.base_fee_cents
      vin_add = fee_schedule.vin_history_fee_cents if order.include_vin_history else 0
      dispatch = round_half_up(fee_schedule.per_mile_dispatch_cents * order.dispatch_miles)   # cents, dispatch_miles may be fractional
      subtotal = base + vin_add + dispatch
      # rush surcharge is a TIERED percentage of subtotal (estimated assumes on-time delivery)
      rush_pct = RUSH_PCT[order.rush_tier]            # NONE:0.00, EXPRESS:0.20, SAME_DAY:0.50
      rush_surcharge = round_half_up(subtotal * rush_pct)
      # negotiated discount applies to the rush surcharge ONLY (not base/dispatch)
      rush_surcharge_after_discount = round_half_up(rush_surcharge * (1 - account.rush_discount_pct))
      estimated_fee_cents = subtotal + rush_surcharge_after_discount
    input_set: "Single order; fee_schedule version-pinned at order creation; account.rush_discount_pct at creation time."
    constants:
      RUSH_PCT: { NONE: 0.00, EXPRESS: 0.20, SAME_DAY: 0.50 }
    precision: "integer cents; round_half_up at each PINNED step (round dispatch, then round rush_surcharge, then round discounted surcharge)"
    variants:
      - name: estimated
        when: "computed at order creation; assumes delivery will be on-time"
        difference: "rush surcharge billed in full (minus account discount); no late credit applied"

  - name: fee_final
    trigger: "POST /inspection-orders/{id}/deliver — final charge at delivery"
    algorithm: forward_looking
    formula: |
      # Re-runs fee_estimated's subtotal+rush math, THEN applies the on-time/late adjustment.
      base = fee_schedule.base_fee_cents
      vin_add = fee_schedule.vin_history_fee_cents if order.include_vin_history else 0
      dispatch = round_half_up(fee_schedule.per_mile_dispatch_cents * order.dispatch_miles)
      subtotal = base + vin_add + dispatch
      rush_pct = RUSH_PCT[order.rush_tier]
      rush_surcharge = round_half_up(subtotal * rush_pct)
      rush_surcharge_after_discount = round_half_up(rush_surcharge * (1 - account.rush_discount_pct))
      late = (current_clock > order.sla_deadline)
      if late:
        # SLA breach: the ENTIRE rush surcharge is credited back (customer paid for speed not delivered)
        fee_total_cents = subtotal
      else:
        fee_total_cents = subtotal + rush_surcharge_after_discount
    input_set: "Single order at delivery; same fee_schedule version pinned at creation; late determined by logical clock vs sla_deadline."
    constants:
      RUSH_PCT: { NONE: 0.00, EXPRESS: 0.20, SAME_DAY: 0.50 }
    precision: "integer cents; same PINNED rounding order as fee_estimated"
    variants:
      - name: final_on_time
        when: "delivered at or before sla_deadline"
        difference: "equals estimated_fee_cents (full surcharge retained)"
      - name: final_late
        when: "delivered strictly after sla_deadline"
        difference: "rush surcharge fully credited — fee_total_cents == subtotal, strictly less than estimated when rush_tier != NONE"

  # --- Rule 1 instance B (dual-variant, VIN-history/Vehicle domain) ---
  - name: vin_risk_score
    trigger: "POST /vin-reports (VIN report compilation)"
    algorithm: weighted_scoring
    formula: |
      # Title-history risk on a 0..100 scale (different entity domain than fee).
      # PINNED weight order; clamp last.
      branding_pts = BRANDING_RISK[worst_branding]      # NONE:0, REBUILT:25, FLOOD:40, SALVAGE:55, LEMON:70
      owner_pts = min(title_count, 5) * 6               # capped owner-churn penalty
      rollback_pts = 30 if odometer_rollback else 0
      recall_pts = min(open_recall_count, 3) * 5
      risk_score = min(100, branding_pts + owner_pts + rollback_pts + recall_pts)
    input_set: "All VinHistoryRecord rows for vehicle_id; open RecallRecord matches; computed worst_branding/title_count/odometer_rollback/open_recall_count."
    constants:
      BRANDING_RISK: { NONE: 0, REBUILT: 25, FLOOD: 40, SALVAGE: 55, LEMON: 70 }
    precision: "integer points; min/clamp at 100"
    variants:
      - name: clean_title
        when: "worst_branding==NONE and no rollback"
        difference: "risk_score driven only by owner_pts + recall_pts"
      - name: branded_title
        when: "any BRANDING record with code != NONE"
        difference: "branding_pts dominates; rollback adds flat 30"

  # --- Rule 2 instance A: combinatorial mode (a) — multi-input non-linear ---
  - name: condition_score
    trigger: "POST /inspection-reports/{id}/submit (and amend re-submit)"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear interaction (ratio, road-test gate, critical-photo floor).
      if points_total == 0: reject ERR_EMPTY_REPORT
      pass_ratio = (points_total - points_failed) / points_total      # 0..1
      raw = pass_ratio * 100
      road_test_bonus = 5 if road_test_done else 0
      critical_count = count(ReportPhoto where report_id==this and is_critical==true)
      # non-linear: each critical defect floors the score harder than a plain failed point
      critical_penalty = min(40, critical_count * 15)
      condition_score = max(0, min(100, raw + road_test_bonus - critical_penalty))
      # outcome branch:
      if critical_count >= 1 or condition_score < FAIL_CEILING: outcome = FAIL
      elif condition_score < CONDITIONAL_CEILING: outcome = CONDITIONAL
      else: outcome = PASS
    input_set: "Single report's points_total/points_failed/road_test_done plus its critical ReportPhoto count."
    constants:
      FAIL_CEILING: 50          # condition_score < 50 -> FAIL (boundary: exactly 50 is NOT fail)
      CONDITIONAL_CEILING: 80   # 50 <= score < 80 -> CONDITIONAL; >= 80 -> PASS
    precision: "condition_score rounded to 2 decimals, round_half_up; ceilings compared on rounded value"

  # --- Rule 2 instance B: combinatorial mode (c) — pinned evaluation order on circular-looking dep ---
  - name: dispute_refund
    trigger: "POST /disputes/{id}/resolve"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking: cap depends on fee_total_cents, which itself was finalized at delivery
      # (which depended on lateness), and remaining refundable depends on prior refunds.
      # PINNED evaluation order resolves it:
      #   step 1: read finalized order.fee_total_cents (already pinned at delivery)
      #   step 2: already_refunded = order.refunded_cents
      #   step 3: refundable_ceiling = fee_total_cents - already_refunded   (never below 0)
      #   step 4: reason cap:
      #            MISSED_DEFECT -> floor(fee_total_cents * 0.50)
      #            LATE_DELIVERY -> rush_surcharge_component_that_was_charged  (0 if order already late-credited)
      #            WRONG_VEHICLE -> fee_total_cents (full)
      #   step 5: approved = min(claimed_cents, reason_cap, refundable_ceiling)
      #   step 6: approved = max(0, approved)
      reason_cap =
        floor(order.fee_total_cents * 0.50)                  if reason == MISSED_DEFECT
        (order.late_delivery ? 0 : rush_surcharge_after_discount_as_billed)  if reason == LATE_DELIVERY
        order.fee_total_cents                                 if reason == WRONG_VEHICLE
      refundable_ceiling = max(0, order.fee_total_cents - order.refunded_cents)
      approved_cents = max(0, min(claimed_cents, reason_cap, refundable_ceiling))
    input_set: "Single dispute; finalized order.fee_total_cents; order.refunded_cents accumulated from prior resolved disputes; order.late_delivery."
    constants:
      MISSED_DEFECT_CAP_PCT: 0.50
    precision: "integer cents; floor on the 50% cap; refundable_ceiling clamps cumulative refunds so they never exceed fee_total_cents"

  # --- turnaround SLA (supports late_delivery + rush) ---
  - name: turnaround_sla
    trigger: "POST /inspection-orders (sets sla_deadline)"
    algorithm: threshold
    formula: |
      sla_hours = SLA_HOURS[order.rush_tier]    # NONE:120, EXPRESS:48, SAME_DAY:8
      sla_deadline = order.ordered_at + hours(sla_hours)
    input_set: "Single order at creation; ordered_at = logical clock at creation."
    constants:
      SLA_HOURS: { NONE: 120, EXPRESS: 48, SAME_DAY: 8 }
    precision: "exact datetime arithmetic; late iff current_clock strictly greater than sla_deadline (> not >=)"

  # --- odometer rollback detection (chronological replay) ---
  - name: odometer_rollback
    trigger: "POST /vin-reports (compilation)"
    algorithm: chronological
    formula: |
      # Process ODOMETER records in ascending event_date order (tie-break: created_at ASC).
      # Rollback if any later reading is lower than the running max by more than tolerance.
      sorted = ODOMETER records sorted by (event_date ASC, created_at ASC)
      running_max = -infinity
      odometer_rollback = false
      for rec in sorted:
        if rec.odometer_value < running_max - ROLLBACK_TOLERANCE_MILES:
          odometer_rollback = true
        running_max = max(running_max, rec.odometer_value)
    input_set: "All VinHistoryRecord with record_type==ODOMETER for the vehicle."
    constants:
      ROLLBACK_TOLERANCE_MILES: 100   # later reading must be >100 miles below running max to flag (boundary: exactly 100 below does NOT flag)
    precision: "integer miles; strict '>' comparison on the (running_max - value) gap vs tolerance"

  # --- worst_branding severity (aggregation max over ranked enum) ---
  - name: worst_branding
    trigger: "POST /vin-reports (compilation)"
    algorithm: aggregation
    formula: |
      # max over BRANDING records by severity rank; NONE if no BRANDING records.
      ranks = BRANDING_RANK   # NONE:0, REBUILT:1, FLOOD:2, SALVAGE:3, LEMON:4
      worst_branding = argmax_by_rank(branding_code over BRANDING records), default NONE
    input_set: "All VinHistoryRecord with record_type==BRANDING for the vehicle."
    constants:
      BRANDING_RANK: { NONE: 0, REBUILT: 1, FLOOD: 2, SALVAGE: 3, LEMON: 4 }
    precision: "exact; tie impossible (distinct ranks)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource it mutates (AccountHolder owns order/dispute; Inspector owns assignment)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped mutations (cancel, pay, dispute file, supply-info, assignment accept/decline)"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, numeric ranges (e.g., points_failed <= points_total, VIN 17 chars, rush_discount_pct in [0,0.50])"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "OCC: expected_order_version matches current InspectionOrder.version on dispatch-assignment create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dispatch-assignments"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 8
    category: business_safety
    check: "Account is ACTIVE (not SUSPENDED) when creating orders or dispatching"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /inspection-orders, POST /dispatch-assignments"

  - priority: 9
    category: business_safety
    check: "Inspector AVAILABLE and certified for the order's fee tier before accepting an assignment"
    error_id: "ERR_INSPECTOR_OFFLINE / ERR_TIER_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /dispatch-assignments/{id}/accept"

  - priority: 10
    category: business_safety
    check: "A FAIL-outcome report cannot be submitted without at least one critical ReportPhoto"
    error_id: ERR_CRITICAL_PHOTO_REQUIRED
    http_status: 409
    applies_to: "POST /inspection-reports/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "Accepted assignment must not overlap [window_start, window_end) of another ACCEPTED assignment for the same INSPECTOR (HALF-OPEN: touching endpoints do not collide)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /dispatch-assignments/{id}/accept"

  - priority: 12
    category: business_temporal
    check: "Accepted assignment must not collide with another ACCEPTED assignment window for the same VEHICLE (CLOSED-interval: touching endpoints DO collide)"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dispatch-assignments/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "Inspector's accepted assignments whose window_start falls on the same UTC date must stay below max_daily_jobs"
    error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /dispatch-assignments/{id}/accept"

  - priority: 14
    category: business_referential
    check: "Delivery requires the report submitted and (if include_vin_history) a compiled VinReport for the order"
    error_id: "ERR_VIN_REPORT_MISSING / ERR_NO_ACCEPTED_ASSIGNMENT"
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/deliver, POST /inspection-reports"

  - priority: 15
    category: business_fiscal
    check: "Delivery requires payment_status IN {PAID, INVOICED}; invoicing requires account.net_terms_days > 0"
    error_id: "ERR_PAYMENT_REQUIRED / ERR_INVOICE_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/deliver, POST /inspection-orders/{id}/invoice"

  - priority: 16
    category: business_temporal
    check: "Report cannot be amended after the order is DELIVERED except through dispute resolution"
    error_id: ERR_REPORT_LOCKED
    http_status: 409
    applies_to: "POST /inspection-reports/{id}/amend"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Account ---
  - method: POST
    path: "/accounts"
    description: "Create an Account (dealer/auction/individual)."
    roles: [OpsAdmin]
    code: 201
    input: [account_type, legal_name, email, "net_terms_days?", "rush_discount_pct?"]
    output: Account
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an Account (includes computed outstanding_balance_cents)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/suspend"
    description: "Suspend an Account (blocks new orders/dispatch)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> SUSPENDED"]

  - method: GET
    path: "/accounts/{accountId}/orders"
    description: "List InspectionOrders for an account (reverse-reachability for InspectionOrder.account_id)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: InspectionOrder[]
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Register a Vehicle by VIN."
    roles: [OpsAdmin, AccountHolder]
    code: 201
    input: [vin, year, make, model]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}"
    description: "Get a Vehicle."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # --- FeeSchedule ---
  - method: POST
    path: "/fee-schedules"
    description: "Create a FeeSchedule pricing tier."
    roles: [OpsAdmin]
    code: 201
    input: [tier_code, base_fee_cents, vin_history_fee_cents, per_mile_dispatch_cents, "effective?"]
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/fee-schedules/{feeScheduleId}"
    description: "Get a FeeSchedule."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # --- Inspector ---
  - method: POST
    path: "/inspectors"
    description: "Create an Inspector resource."
    roles: [OpsAdmin]
    code: 201
    input: [full_name, base_lat, base_lng, certified_tiers, "max_daily_jobs?"]
    output: Inspector
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/inspectors/{inspectorId}"
    description: "Get an Inspector."
    roles: [OpsAdmin, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: POST
    path: "/inspectors/{inspectorId}/set-status"
    description: "Set Inspector AVAILABLE/OFFLINE."
    roles: [OpsAdmin, Inspector]
    code: 200
    input: [status]
    output: Inspector
    side_effects: ["status updated"]

  - method: GET
    path: "/inspectors/{inspectorId}/assignments"
    description: "List DispatchAssignments for an inspector (reverse-reachability for DispatchAssignment.inspector_id)."
    roles: [OpsAdmin, Inspector]
    code: 200
    input: []
    output: DispatchAssignment[]
    side_effects: []

  # --- InspectionOrder ---
  - method: POST
    path: "/inspection-orders"
    description: "Create an InspectionOrder; computes estimated_fee_cents (fee_estimated) and sla_deadline (turnaround_sla). ordered_at = logical clock."
    roles: [AccountHolder]
    code: 201
    input: [account_id, vehicle_id, fee_schedule_id, location_lat, location_lng, "include_vin_history?", "rush_tier?"]
    output: InspectionOrder
    side_effects:
      - "workflow_status=DRAFT, payment_status=UNPAID"
      - "ordered_at set, sla_deadline computed (turnaround_sla)"
      - "estimated_fee_cents computed (fee_estimated) — note dispatch_miles not yet known, dispatch component = 0 until dispatch (re-quoted)"
      - "Account.status must be ACTIVE (ERR_ACCOUNT_SUSPENDED)"

  - method: GET
    path: "/inspection-orders/{orderId}"
    description: "Get an InspectionOrder (both status axes + computed fees)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: []

  - method: GET
    path: "/inspection-orders"
    description: "List/filter InspectionOrders (FK reverse-reachability for account_id, vehicle_id, fee_schedule_id)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: ["account_id?", "vehicle_id?", "fee_schedule_id?"]
    output: InspectionOrder[]
    side_effects: []

  - method: POST
    path: "/inspection-orders/{orderId}/pay"
    description: "Mark order PAID (prepaid path)."
    roles: [AccountHolder]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["payment_status UNPAID -> PAID"]

  - method: POST
    path: "/inspection-orders/{orderId}/invoice"
    description: "Mark order INVOICED (net-terms path); adds estimated fee to account outstanding balance."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "payment_status UNPAID -> INVOICED"
      - "Account.outstanding_balance_cents += order.estimated_fee_cents"

  - method: POST
    path: "/inspection-orders/{orderId}/deliver"
    description: "Deliver report to buyer; finalizes fee_total_cents (fee_final), sets late_delivery."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "workflow_status REPORTED -> DELIVERED"
      - "late_delivery := current_clock > sla_deadline"
      - "fee_total_cents finalized (fee_final)"
      - "If payment_status==INVOICED: Account.outstanding_balance_cents adjusted by (fee_total_cents - estimated_fee_cents) delta"

  - method: POST
    path: "/inspection-orders/{orderId}/cancel"
    description: "Cancel an order (DRAFT or DISPATCHED); cascades assignment release & refund if PAID."
    roles: [AccountHolder]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "workflow_status -> CANCELLED"
      - "If DISPATCHED: ACCEPTED assignment -> RELEASED (cascade)"
      - "If payment_status==PAID: payment_status -> REFUNDED, refunded_cents := fee_total_cents (or estimated_fee_cents if never finalized)"

  # --- DispatchAssignment ---
  - method: POST
    path: "/dispatch-assignments"
    description: "Create (offer) a DispatchAssignment for an order to an inspector. OCC-guarded on order version."
    roles: [OpsAdmin]
    code: 201
    input: [order_id, inspector_id, window_start, window_end, dispatch_miles, expected_order_version]
    output: DispatchAssignment
    side_effects:
      - "status=OFFERED"
      - "Order.dispatch_miles set; estimated_fee_cents re-quoted (fee_estimated with dispatch component)"
      - "increments InspectionOrder.version by 1"
      - "OCC: expected_order_version must equal InspectionOrder.version (ERR_STALE_VERSION)"

  - method: GET
    path: "/dispatch-assignments/{assignmentId}"
    description: "Get a DispatchAssignment."
    roles: [OpsAdmin, Inspector]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: []

  - method: GET
    path: "/dispatch-assignments"
    description: "List/filter DispatchAssignments (FK reverse-reachability for order_id and inspector_id)."
    roles: [OpsAdmin, AccountHolder, Inspector]
    code: 200
    input: ["order_id?", "inspector_id?"]
    output: DispatchAssignment[]
    side_effects: []

  - method: POST
    path: "/dispatch-assignments/{assignmentId}/accept"
    description: "Inspector accepts an offered assignment; cascades order DRAFT -> DISPATCHED."
    roles: [Inspector]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects:
      - "status -> ACCEPTED"
      - "Cascade: Order DRAFT -> DISPATCHED, increments InspectionOrder.version by 1"

  - method: POST
    path: "/dispatch-assignments/{assignmentId}/decline"
    description: "Inspector declines an offered assignment."
    roles: [Inspector]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/dispatch-assignments/{assignmentId}/release"
    description: "Ops releases an accepted assignment (frees slot); reverts order to DRAFT if still DISPATCHED."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects:
      - "status -> RELEASED"
      - "If Order.workflow_status==DISPATCHED: Order -> DRAFT, increments InspectionOrder.version by 1"

  # --- InspectionReport ---
  - method: POST
    path: "/inspection-reports"
    description: "Create a DRAFT inspection report for an order; cascades order DISPATCHED -> IN_PROGRESS."
    roles: [Inspector]
    code: 201
    input: [order_id, assignment_id, odometer_reading, points_total, points_failed, "road_test_done?"]
    output: InspectionReport
    side_effects:
      - "status=DRAFT"
      - "Requires an ACCEPTED assignment for the order (ERR_NO_ACCEPTED_ASSIGNMENT)"
      - "Cascade: Order DISPATCHED -> IN_PROGRESS"

  - method: GET
    path: "/inspection-reports/{reportId}"
    description: "Get an InspectionReport (computed condition_score, outcome)."
    roles: [OpsAdmin, AccountHolder, Inspector]
    code: 200
    input: []
    output: InspectionReport
    side_effects: []

  - method: GET
    path: "/inspection-reports"
    description: "List/filter InspectionReports (FK reverse-reachability for order_id and assignment_id)."
    roles: [OpsAdmin, AccountHolder, Inspector]
    code: 200
    input: ["order_id?", "assignment_id?"]
    output: InspectionReport[]
    side_effects: []

  - method: POST
    path: "/inspection-reports/{reportId}/photos"
    description: "Attach a ReportPhoto to a report (DRAFT/AMENDED only)."
    roles: [Inspector]
    code: 201
    input: [caption, "is_critical?", url]
    output: ReportPhoto
    side_effects: []

  - method: GET
    path: "/report-photos/{photoId}"
    description: "Get a single ReportPhoto."
    roles: [OpsAdmin, AccountHolder, Inspector]
    code: 200
    input: []
    output: ReportPhoto
    side_effects: []

  - method: GET
    path: "/report-photos"
    description: "List/filter ReportPhotos (FK reverse-reachability for report_id)."
    roles: [OpsAdmin, AccountHolder, Inspector]
    code: 200
    input: ["report_id?"]
    output: ReportPhoto[]
    side_effects: []

  - method: POST
    path: "/inspection-reports/{reportId}/submit"
    description: "Submit report; computes condition_score & outcome; cascades order IN_PROGRESS -> REPORTED."
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionReport
    side_effects:
      - "status DRAFT|AMENDED -> SUBMITTED"
      - "condition_score & outcome computed (condition_score calc)"
      - "Cascade: Order IN_PROGRESS -> REPORTED"
      - "If outcome==FAIL and no critical photo: ERR_CRITICAL_PHOTO_REQUIRED"

  - method: POST
    path: "/inspection-reports/{reportId}/amend"
    description: "Re-open a submitted report for amendment (pre-delivery); cascades order back to IN_PROGRESS."
    roles: [Inspector]
    code: 200
    input: ["odometer_reading?", "points_total?", "points_failed?", "road_test_done?"]
    output: InspectionReport
    side_effects:
      - "status SUBMITTED -> AMENDED"
      - "Cascade: Order REPORTED -> IN_PROGRESS"
      - "ERR_REPORT_LOCKED if Order already DELIVERED"

  # --- VIN history / VinReport ---
  - method: POST
    path: "/vehicles/{vehicleId}/history-records"
    description: "Append a VinHistoryRecord (TITLE/ODOMETER/BRANDING) to a vehicle."
    roles: [OpsAdmin]
    code: 201
    input: [record_type, event_date, "odometer_value?", "branding_code?", "title_state?"]
    output: VinHistoryRecord
    side_effects: []

  - method: GET
    path: "/vin-history-records/{recordId}"
    description: "Get a single VinHistoryRecord."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: VinHistoryRecord
    side_effects: []

  - method: GET
    path: "/vin-history-records"
    description: "List/filter VinHistoryRecords (FK reverse-reachability for vehicle_id)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: ["vehicle_id?"]
    output: VinHistoryRecord[]
    side_effects: []

  - method: POST
    path: "/vin-reports"
    description: "Compile a VinReport for an order: odometer rollback, worst branding, title count, open recalls, risk score."
    roles: [OpsAdmin]
    code: 201
    input: [order_id]
    output: VinReport
    side_effects:
      - "odometer_rollback (odometer_rollback calc), worst_branding (worst_branding calc), title_count, open_recall_count (recall match), risk_score (vin_risk_score calc) computed"
      - "status=COMPILED"

  - method: GET
    path: "/vin-reports/{vinReportId}"
    description: "Get a compiled VinReport."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: VinReport
    side_effects: []

  - method: GET
    path: "/vin-reports"
    description: "List/filter VinReports (FK reverse-reachability for order_id and vehicle_id)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: ["order_id?", "vehicle_id?"]
    output: VinReport[]
    side_effects: []

  # --- RecallRecord ---
  - method: POST
    path: "/recall-records"
    description: "Create a recall campaign record (year/make/model match)."
    roles: [OpsAdmin]
    code: 201
    input: [campaign_id, year, make, model, severity]
    output: RecallRecord
    side_effects: ["status=OPEN"]

  - method: POST
    path: "/recall-records/{recallRecordId}/close"
    description: "Close a recall campaign (excluded from future open_recall_count)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: RecallRecord
    side_effects: ["status -> CLOSED"]

  - method: GET
    path: "/recall-records"
    description: "List recall records, filterable by year/make/model (recall lookup)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: ["year?", "make?", "model?"]
    output: RecallRecord[]
    side_effects: []

  # --- Dispute ---
  - method: POST
    path: "/disputes"
    description: "File a buyer dispute on a delivered order's report."
    roles: [AccountHolder]
    code: 201
    input: [order_id, report_id, reason, claimed_cents]
    output: Dispute
    side_effects:
      - "status=OPEN, account_id := acting account"
      - "Order must be DELIVERED (ERR_INVALID_STATE)"

  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get a Dispute."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List/filter Disputes (FK reverse-reachability for order_id, report_id, account_id)."
    roles: [OpsAdmin, AccountHolder]
    code: 200
    input: ["order_id?", "report_id?", "account_id?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/disputes/{disputeId}/start-review"
    description: "Ops moves dispute OPEN -> UNDER_REVIEW."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/disputes/{disputeId}/request-info"
    description: "Ops requests more info (UNDER_REVIEW -> NEEDS_INFO)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> NEEDS_INFO"]

  - method: POST
    path: "/disputes/{disputeId}/supply-info"
    description: "Account supplies info (NEEDS_INFO -> OPEN); revision loop."
    roles: [AccountHolder]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/disputes/{disputeId}/resolve"
    description: "Ops resolves dispute; computes approved_cents (dispute_refund) and cascades refund + report amend."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects:
      - "approved_cents computed (dispute_refund calc)"
      - "Cascade A: Order.refunded_cents += approved_cents; payment side adjusted (PAID->REFUNDED or INVOICED outstanding reduced)"
      - "Cascade B: if reason==MISSED_DEFECT, linked report SUBMITTED -> AMENDED"

  - method: POST
    path: "/disputes/{disputeId}/reject"
    description: "Ops rejects dispute (no refund)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> REJECTED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All SLA/deadline/late-delivery rules are measured against this logical clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting entity_backed user is not the owner of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, points_failed>points_total, bad VIN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current InspectionOrder.version on dispatch-assignment create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED; cannot create orders or dispatch" }
  - { id: ERR_INSPECTOR_OFFLINE, http: 409, condition: "Inspector is OFFLINE and cannot accept an assignment" }
  - { id: ERR_TIER_NOT_CERTIFIED, http: 409, condition: "Inspector is not certified for the order's fee tier" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Accepted assignment overlaps another ACCEPTED window for the same inspector (half-open interval)" }
  - { id: ERR_VEHICLE_DOUBLE_BOOKED, http: 409, condition: "Accepted assignment collides with another ACCEPTED window for the same vehicle (closed interval; touching endpoints collide)" }
  - { id: ERR_DAILY_CAP_EXCEEDED, http: 409, condition: "Inspector already at max_daily_jobs accepted assignments for the window_start date" }
  - { id: ERR_NO_ACCEPTED_ASSIGNMENT, http: 409, condition: "Report create / order progression requires an ACCEPTED assignment for the order" }
  - { id: ERR_EMPTY_REPORT, http: 409, condition: "Report submitted with points_total < 1" }
  - { id: ERR_CRITICAL_PHOTO_REQUIRED, http: 409, condition: "FAIL-outcome report submitted without any critical ReportPhoto" }
  - { id: ERR_REPORT_LOCKED, http: 409, condition: "Report amend attempted after order DELIVERED (outside dispute path)" }
  - { id: ERR_PAYMENT_REQUIRED, http: 409, condition: "Delivery attempted while payment_status not in {PAID, INVOICED}" }
  - { id: ERR_INVOICE_NOT_ELIGIBLE, http: 409, condition: "Invoice attempted on an account with net_terms_days == 0" }
  - { id: ERR_VIN_REPORT_MISSING, http: 409, condition: "Delivery attempted on include_vin_history order with no compiled VinReport" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset out of allowed bounds" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operations: pricing, inspectors, dispatch, VIN reports, recalls, invoicing, delivery, dispute adjudication, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts — create accounts"
      - "POST /accounts/{id}/suspend — suspend account"
      - "POST /fee-schedules — create pricing"
      - "POST /inspectors — create inspector"
      - "POST /dispatch-assignments — offer assignment (OCC)"
      - "POST /dispatch-assignments/{id}/release — release accepted assignment"
      - "POST /inspection-orders/{id}/invoice — net-terms invoicing"
      - "POST /inspection-orders/{id}/deliver — deliver report"
      - "POST /vehicles/{id}/history-records — append VIN history"
      - "POST /vin-reports — compile VIN report"
      - "POST /recall-records — create recall"
      - "POST /recall-records/{id}/close — close recall"
      - "POST /disputes/{id}/start-review — start review"
      - "POST /disputes/{id}/request-info — request info"
      - "POST /disputes/{id}/resolve — resolve dispute"
      - "POST /disputes/{id}/reject — reject dispute"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET endpoints (accounts, vehicles, fee-schedules, inspectors, orders, assignments, reports, photos, vin-reports, recalls, disputes)"
      - "POST /inspectors/{id}/set-status — shared with Inspector"
      - "POST /vehicles — shared with AccountHolder"
      - "GET /recall-records — recall lookup"

  - name: AccountHolder
    description: "Dealer/auction/individual buyer acting as their Account; owns orders and disputes."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /inspection-orders — create order (own account)"
      - "POST /inspection-orders/{id}/pay — prepay own order"
      - "POST /inspection-orders/{id}/cancel — cancel own order"
      - "POST /disputes — file dispute on own delivered order"
      - "POST /disputes/{id}/supply-info — supply info on own dispute"
    shared_operations:
      - "POST /vehicles — register vehicle (shared with OpsAdmin)"
      - "GET /accounts/{id}, /accounts/{id}/orders, /vehicles/{id}, /fee-schedules/{id}"
      - "GET /inspection-orders/{id} and sub-lists (reports, assignments, vin-reports, disputes)"
      - "GET /inspection-reports/{id}, /inspection-reports/{id}/photos"
      - "GET /vin-reports/{id}, GET /recall-records (recall lookup)"

  - name: Inspector
    description: "Field inspector resource; accepts dispatch and authors reports."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /dispatch-assignments/{id}/accept — accept own offered assignment"
      - "POST /dispatch-assignments/{id}/decline — decline own offered assignment"
      - "POST /inspection-reports — create report for own accepted assignment"
      - "POST /inspection-reports/{id}/photos — attach photos"
      - "POST /inspection-reports/{id}/submit — submit report"
      - "POST /inspection-reports/{id}/amend — amend report pre-delivery"
    shared_operations:
      - "POST /inspectors/{id}/set-status — own availability (shared with OpsAdmin)"
      - "GET /inspectors/{id}, /inspectors/{id}/assignments"
      - "GET /dispatch-assignments/{id}, /inspection-orders/{id}/assignments"
      - "GET /inspection-reports/{id}, /inspection-orders/{id}/reports, /inspection-reports/{id}/photos"
