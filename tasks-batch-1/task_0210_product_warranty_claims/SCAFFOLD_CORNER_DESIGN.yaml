            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "ACCIDENTAL", reported_date: "2024-02-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
