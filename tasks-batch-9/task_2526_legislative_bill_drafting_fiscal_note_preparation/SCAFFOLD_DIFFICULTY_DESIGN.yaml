          - entities.Bill.fields.fiscal_status
          - endpoints.POST_committee_referrals_report
        distinguishing_aspect: |
          Entity pair CommitteeReferral -> Bill: whether the referral may leave
          IN_COMMITTEE for REPORTED_FAVORABLE is decided entirely by a field on a
          DIFFERENT entity, the parent Bill's fiscal_status. The referral itself is
          in a perfectly legal state for the transition, so nothing about its own row
          explains the refusal. Both arms are exercised: NOTE_PENDING refuses,
          NOTE_COMPLETE admits, with no other input changed.
