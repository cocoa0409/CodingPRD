      - name: acknowledge_requires_a_pending_notification
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/mdm/consumer-subscriptions/{subscription_id}/acknowledge
          - errors.ERR_NO_PENDING_NOTIFICATION
        distinguishing_aspect: "acknowledge is conditional on pending_change_request_id being set by a schedule fan-out; with nothing pending the call must fail with 409 rather than stamping acknowledged_at, so an eager consumer cannot pre-acknowledge a change that has not been scheduled yet."
