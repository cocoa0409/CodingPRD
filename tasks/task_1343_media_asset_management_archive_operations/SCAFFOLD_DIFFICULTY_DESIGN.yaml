              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "BROADCAST", market_size: 6000000, duration_seconds_used: 20000, aired_at: "2026-07-10T00:00:00Z" }
              as: Requester
