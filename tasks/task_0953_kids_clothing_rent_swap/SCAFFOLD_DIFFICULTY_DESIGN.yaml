  # =======================================================================
  # RULE 8 — resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: same_season_capsule_windows_collide_on_a_touching_endpoint
        grounds:
          - calculations.capsule_window_overlap
          - validations[priority=68]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.Capsule.fields.release_at
          - entities.Capsule.fields.close_at
        distinguishing_aspect: |
          INTERVAL SEMANTICS = CLOSED at both ends, on the Capsule resource. A second SS
          capsule opening at exactly the first capsule's close_at COLLIDES, because both
          endpoints are included. A capsule of the OTHER season with the identical window
          does not collide, proving the conflict scope is season-partitioned.
        test_recipe:
          setup:
            - "One SS capsule occupying the closed window 2026-06-01 through 2026-07-01."
          setup_api_calls:
            - call: "POST /kidswear/capsules"
              payload: { season: "SS", name: "SS26 Early", release_at: "2026-06-01T00:00:00Z", close_at: "2026-07-01T00:00:00Z", quota_per_member: 2 }
              as: MerchandisePlanner
              captures: { cap_o1: $.data.id }
          trigger:
            - call: "POST /kidswear/capsules"
              payload: { season: "SS", name: "SS26 Late", release_at: "2026-07-01T00:00:00Z", close_at: "2026-08-01T00:00:00Z", quota_per_member: 2 }
              as: MerchandisePlanner
              captures: { err_o1: $.data.error_id }
            - call: "POST /kidswear/capsules"
              payload: { season: "AW", name: "AW26 Same Window", release_at: "2026-06-01T00:00:00Z", close_at: "2026-07-01T00:00:00Z", quota_per_member: 2 }
              as: MerchandisePlanner
              captures: { cap_o1_aw: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409"
            - "the captured err_o1 equals ERR_WINDOW_OVERLAP"
            - "the second trigger call returns HTTP 201"
            - "Capsule.${cap_o1_aw}.status == DRAFT"
            - "Capsule.${cap_o1_aw}.season == AW"

      - name: adjacent_pause_windows_on_a_member_do_not_collide
        grounds:
          - calculations.pause_window_overlap
          - state_machines.PauseRequest.REQUESTED_to_ACTIVE
          - state_machines.PauseRequest.ACTIVE_to_ENDED
          - entities.PauseRequest.fields.end_at
          - calculations.pause_days_remaining_period
        distinguishing_aspect: |
          INTERVAL SEMANTICS = HALF-OPEN [start_at, end_at), on the Member resource — the
          OPPOSITE geometry from the capsule rule and a different resource entity. A pause
          beginning at exactly the prior pause's end_at is ACCEPTED, because the prior
          interval excludes its own endpoint.
        test_recipe:
          setup:
            - "A CORE plan; one ACTIVE member with no shipments and no outstanding items."
            - "A 10-day pause covering [2026-05-05, 2026-05-15) has been activated and then ended, so the member is ACTIVE again."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, proration_basis: "THIRTY_DAY", discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_o2: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_o2}", email: "overlap2@kidswear.test", display_name: "Overlap Two", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_o2: $.data.id }
            - call: "POST /kidswear/members/${m_o2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members/${m_o2}/pause-requests"
              payload: { start_at: "2026-05-05T00:00:00Z", days_requested: 10 }
              as: Member
              as_user_id: "${m_o2}"
              captures: { pr_o2a: $.data.id }
            - call: "POST /kidswear/pause-requests/${pr_o2a}/activate"
              payload: {}
              as: BillingAgent
            - call: "POST /kidswear/pause-requests/${pr_o2a}/end"
              payload: {}
              as: Member
              as_user_id: "${m_o2}"
            - call: "POST /kidswear/members/${m_o2}/pause-requests"
              payload: { start_at: "2026-05-15T00:00:00Z", days_requested: 7 }
              as: Member
              as_user_id: "${m_o2}"
              captures: { pr_o2b: $.data.id }
          trigger:
            - call: "POST /kidswear/pause-requests/${pr_o2b}/activate"
              payload: {}
              as: BillingAgent
          assert:
            - "the trigger returns HTTP 200"
            - "PauseRequest.${pr_o2a}.end_at == 2026-05-15T00:00:00.000Z"
            - "PauseRequest.${pr_o2b}.status == ACTIVE"
            - "Member.${m_o2}.status == PAUSED"
            - "Member.${m_o2}.pause_days_used_period == 17"
            - "Member.${m_o2}.pause_days_used_lifetime == 17"

  # =======================================================================
  # RULE 9 — compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:

      - name: allocation_then_delinquency_cancellation_conserves_physical_units
        grounds:
          - calculations.unit_conservation_invariant
          - calculations.slot_conservation_invariant
          - state_machines.GarmentUnit.RESERVED_to_IN_STOCK
          - state_machines.BoxItem.ALLOCATED_to_CANCELLED
          - validations[priority=64]
        distinguishing_aspect: |
          CONSERVED QUANTITY = PHYSICAL GARMENTS. The forward action (allocate: IN_STOCK ->
          RESERVED) and its compensating action (delinquency cascade: RESERVED -> IN_STOCK via
          BoxItem CANCELLED) must leave GarmentStyle.units_ever_acquired equal to the sum over
          all eight unit states, and must return Box.slots_free to its full capacity with zero drift.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot and a 5000-cent fee; one ACTIVE member sized 5."
            - "One style with exactly one acquired unit."
            - "An OPEN cycle whose DRAFT box holds that unit as an ALLOCATED item, so the unit is RESERVED and slots_free is 0."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_c1: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_c1}", email: "cons1@kidswear.test", display_name: "Cons One", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_c1: $.data.id }
            - call: "POST /kidswear/members/${m_c1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-C1-5", name: "Cons Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_c1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_c1}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_c1: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_c1}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_c1: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_c1}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_c1}" }
              as: WarehouseOperator
              captures: { box_c1: $.data.id }
            - call: "POST /kidswear/boxes/${box_c1}/allocate"
              payload: { unit_id: "${u_c1}" }
              as: WarehouseOperator
              captures: { bi_c1: $.data.id }
          trigger:
            - call: "POST /kidswear/members/${m_c1}/charge-adjustments"
              payload: { charge_type: "DAMAGE_FEE", amount_cents: 20000 }
              as: BillingAgent
              captures: { chg_c1: $.data.id }
            - call: "POST /kidswear/charge-entries/${chg_c1}/waive"
              payload: { waive_reason: "operator error" }
              as: BillingAgent
          assert:
            - "GarmentStyle.${st_c1}.units_ever_acquired == 1"
            - "GarmentUnit.${u_c1}.state == IN_STOCK"
            - "BoxItem.${bi_c1}.fulfillment_status == CANCELLED"
            - "BoxItem.${bi_c1}.settlement_status == SETTLED"
            - "Box.${box_c1}.slot_capacity == 1"
            - "Box.${box_c1}.slots_free == 1"
            - "Member.${m_c1}.outstanding_balance_cents == 5000"
            - "Member.${m_c1}.status == ACTIVE"
            - "Cycle.${cyc_c1}.status == OPEN"

      - name: credit_grant_application_then_revocation_conserves_monetary_credit
        grounds:
          - calculations.credit_conservation_invariant
          - calculations.credit_application_waterfall
          - concurrency_rules[credit-apply-stale-member]
          - validations[priority=66]
          - entities.CreditLedgerEntry.fields.remaining_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = MONETARY CREDIT, a different kind of quantity from physical
          garments. Granting 5000, applying 3000 to a charge and revoking the remainder must
          satisfy 5000 == 0 available + 3000 applied + 2000 revoked-remaining, with no cent
          created or destroyed anywhere in the chain.
        test_recipe:
          setup:
            - "A CORE plan; one ACTIVE member with auto_apply_credit false so the application is explicit."
            - "A 5000-cent operator credit grant sitting AVAILABLE."
            - "A 3000-cent DAMAGE_FEE charge sitting ASSESSED."
            - "The member's version is re-read after both ledger writes so the OCC input is fresh."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_c2: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_c2}", email: "cons2@kidswear.test", display_name: "Cons Two", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_c2: $.data.id }
            - call: "POST /kidswear/members/${m_c2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members/${m_c2}/credit-adjustments"
              payload: { amount_cents: 5000, reason: "goodwill" }
              as: BillingAgent
              captures: { cre_c2: $.data.id }
            - call: "POST /kidswear/members/${m_c2}/charge-adjustments"
              payload: { charge_type: "DAMAGE_FEE", amount_cents: 3000 }
              as: BillingAgent
              captures: { chg_c2: $.data.id }
            - call: "GET /kidswear/members/${m_c2}"
              payload: {}
              as: BillingAgent
              captures: { v_m_c2: $.data.version }
          trigger:
            - call: "POST /kidswear/members/${m_c2}/credit-applications"
              payload: { charge_entry_id: "${chg_c2}", expected_member_version: "${v_m_c2}" }
              as: BillingAgent
            - call: "POST /kidswear/credit-entries/${cre_c2}/revoke"
              payload: { revoke_reason: "audit adjustment" }
              as: BillingAgent
          assert:
            - "CreditLedgerEntry.${cre_c2}.amount_cents == 5000"
            - "CreditLedgerEntry.${cre_c2}.remaining_cents == 2000"
            - "CreditLedgerEntry.${cre_c2}.status == REVOKED"
            - "ChargeLedgerEntry.${chg_c2}.credit_applied_cents == 3000"
            - "ChargeLedgerEntry.${chg_c2}.net_due_cents == 0"
            - "ChargeLedgerEntry.${chg_c2}.status == SETTLED"
            - "Member.${m_c2}.credit_balance_cents == 0"
            - "Member.${m_c2}.outstanding_balance_cents == 0"

      - name: partial_swap_fulfilment_conserves_slot_and_swap_entitlements
        grounds:
          - calculations.partial_swap_slot_delta
          - calculations.swap_entitlement_conservation_invariant
          - calculations.box_slot_occupancy
          - validations[priority=67]
          - state_machines.SwapRequest.APPROVED_to_FULFILLED
        distinguishing_aspect: |
          CONSERVED QUANTITY = PERIOD-SCOPED SLOT AND SWAP ENTITLEMENTS, distinct from both
          physical garments and money. Returning 1 of 2 items and taking 1 replacement leaves
          slot_delta at exactly 0 and Box.slots_free at 0, while swaps_used moves 0 -> 1 and
          the cycle's entitlement identity swaps_used + remaining == swaps_per_cycle still holds.
        test_recipe:
          setup:
            - "A CORE plan with 2 box slots and exactly 1 swap per cycle; one ACTIVE member sized 5."
            - "Style A has two units, both shipped out and delivered in the member's box."
            - "Style B has one IN_STOCK unit in the same size, available as the replacement."
            - "A swap request returning the first item and requesting one Style B garment has been submitted and approved."
            - "The returned item has travelled back and been received."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_c3: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_c3}", email: "cons3@kidswear.test", display_name: "Cons Three", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_c3: $.data.id }
            - call: "POST /kidswear/members/${m_c3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-C3-A", name: "Swap Style A", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_c3a: $.data.id }
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-C3-B", name: "Swap Style B", brand_tier: "STANDARD", retail_price_cents: 3500, size_code: "5", season: "SS", category: "BOTTOM", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_c3b: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_c3a}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_c3a1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_c3a}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_c3a2: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_c3b}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_c3b1: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_c3}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_c3: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_c3}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_c3}" }
              as: WarehouseOperator
              captures: { box_c3: $.data.id }
            - call: "POST /kidswear/boxes/${box_c3}/allocate"
              payload: { unit_id: "${u_c3a1}" }
              as: WarehouseOperator
              captures: { bi_c3_1: $.data.id }
            - call: "POST /kidswear/boxes/${box_c3}/allocate"
              payload: { unit_id: "${u_c3a2}" }
              as: WarehouseOperator
              captures: { bi_c3_2: $.data.id }
            - call: "POST /kidswear/boxes/${box_c3}/pack"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_c3}", direction: "OUTBOUND" }
              as: LogisticsCoordinator
              captures: { lbl_c3_out: $.data.id }
            - call: "POST /kidswear/boxes/${box_c3}/ship"
              payload: { label_id: "${lbl_c3_out}" }
              as: LogisticsCoordinator
              captures: { shp_c3_out: $.data.id }
            - call: "POST /kidswear/shipments/${shp_c3_out}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_c3_out}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "GET /kidswear/cycles/${cyc_c3}"
              payload: {}
              as: Member
              as_user_id: "${m_c3}"
              captures: { v_cyc_c3: $.data.version }
            - call: "POST /kidswear/cycles/${cyc_c3}/swap-requests"
              payload: { return_box_item_ids: ["${bi_c3_1}"], requested_style_ids: ["${st_c3b}"], expected_cycle_version: "${v_cyc_c3}" }
              as: Member
              as_user_id: "${m_c3}"
              captures: { sr_c3: $.data.id }
            - call: "POST /kidswear/swap-requests/${sr_c3}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_c3}"
            - call: "POST /kidswear/swap-requests/${sr_c3}/approve"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_c3}", direction: "RETURN" }
              as: LogisticsCoordinator
              captures: { lbl_c3_ret: $.data.id }
            - call: "POST /kidswear/shipments"
              payload: { member_id: "${m_c3}", label_id: "${lbl_c3_ret}", direction: "RETURN", item_count: 1 }
              as: LogisticsCoordinator
              captures: { shp_c3_ret: $.data.id }
            - call: "POST /kidswear/box-items/${bi_c3_1}/start-return"
              payload: { return_shipment_id: "${shp_c3_ret}" }
              as: Member
              as_user_id: "${m_c3}"
            - call: "POST /kidswear/shipments/${shp_c3_ret}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_c3_ret}/receive"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /kidswear/swap-requests/${sr_c3}/fulfill"
              payload: {}
              as: WarehouseOperator
            - call: "GET /kidswear/box-items"
              payload: { box_id: "${box_c3}", fulfillment_status: "ALLOCATED" }
              as: WarehouseOperator
              captures: { bi_c3_3: "$.data[0].id" }
          assert:
            - "SwapRequest.${sr_c3}.status == FULFILLED"
            - "SwapRequest.${sr_c3}.slot_delta == 0"
            - "Cycle.${cyc_c3}.swaps_used == 1"
            - "Box.${box_c3}.slot_capacity == 2"
            - "Box.${box_c3}.slots_free == 0"
            - "BoxItem.${bi_c3_1}.fulfillment_status == RECEIVED"
            - "BoxItem.${bi_c3_2}.fulfillment_status == WITH_MEMBER"
            - "BoxItem.${bi_c3_3}.fulfillment_status == ALLOCATED"
            - "GarmentUnit.${u_c3b1}.state == RESERVED"

