            - "InterventionEvent EV was requested with autonomy_confidence_pct 80, so mandatory is false, and the operator ro-1 acknowledged and assumed it, leaving takeover_state ACTIVE"
            - "the assuming operator is ro-1, which is the only user id allowed to release it"
