        grounds:
          - roles.Pharmacy
          - roles.Prescriber
          - endpoints.POST_/network/prescriptions/{id}/sign
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "sign is a Prescriber-exclusive operation, so a call bearing the Pharmacy role identity is refused with 403 ERR_FORBIDDEN_ROLE before any of the signing-session or controlled-substance guards are consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants certified, one patient, and a draft order with a fully satisfied signing session ready to sign."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the call returns 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "Prescription.${rx_id}.clinical_status is still DRAFT and SigningSession.${ss_id}.session_status is still OPEN"
            - "the same call with as: Prescriber and as_user_id ${cl_id} succeeds, proving the session was genuinely ready"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_prescription_version_on_route_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prescription-route-stale-version]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/network/prescriptions/{id}/route
        distinguishing_aspect: "The OCC guard compares expected_prescription_version against the row's current version, so a route request carrying the pre-sign version after a sign has advanced it is refused with 412 ERR_STALE_VERSION and creates no attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants certified, one patient, one signed order whose version has already advanced past the value captured at creation, and one in-flight attempt released so the route guard is reachable."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 3 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id, v_created: $.data.version }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v_signed: $.data.version }
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_created}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the route returns 412 with error_id == ERR_STALE_VERSION"
            - "v_created (${v_created}) is strictly less than v_signed (${v_signed})"
            - "Prescription.${rx_id}.routing_status is still NOT_ROUTED and routing_attempt_count == 0"
            - "re-issuing the same route with expected_prescription_version ${v_signed} succeeds"

      - name: repeated_stop_and_repost_in_the_same_month_leaves_the_net_fee_unchanged
        claim_type: derived_field_reconciliation
        grounds:
          - entities.TransactionFeeEntry.fields.period_net_total_cents
          - entities.TransactionFeeEntry.fields.reversal_entry_id
          - state_machines.TransactionFeeEntry.transitions.POSTED_to_REVERSED
          - calculations.transaction_fee_settlement
        distinguishing_aspect: "period_net_total_cents is derived from every entry for the participant and month regardless of status, so three post-reverse-post cycles leave the field back at its first value even though six rows now exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic is a MONTHLY sender with no fee rows for 2026-09."
          setup_api_calls:
            - *clock
            - *clinic
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e1_id: $.data.id, net1: $.data.period_net_total_cents }
            - call: "POST /network/transaction-fees/${e1_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { c1_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e2_id: $.data.id, net2: $.data.period_net_total_cents }
            - call: "POST /network/transaction-fees/${e2_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e3_id: $.data.id, net3: $.data.period_net_total_cents }
            - call: "GET /network/transaction-fees/${e3_id}"
              payload: {}
              as: NetworkOperator
              captures: { final_net: $.data.period_net_total_cents, e3_reversal: $.data.reversal_entry_id }
          assert:
            - "net1 == 3600, net2 == 3600 and net3 == 7200, so each reverse-then-repost cycle returned the field to its single-charge value before the next charge"
            - "final_net == 7200 and the participant's period_net_total_cents agrees with it"
            - "TransactionFeeEntry.${e3_id}.reversal_entry_id is null because that entry has not been reversed"
            - "six rows exist for the cell: three CHARGE rows and three MANUAL_REVERSAL rows, and the ANCHOR_ROWS total is 1500 while the status-agnostic sum is 7200"

      - name: missing_role_header_returns_unauthenticated
        claim_type: multi_tenancy
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: "The authentication band runs before everything else, so a participant read with no X-User-Role header returns 401 ERR_UNAUTHENTICATED in the standard error envelope rather than a 404 or an empty array."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One participant is on file."
          setup_api_calls:
            - *clock
            - *pharmacy
          trigger:
            - call: "GET /network/participants/${ph_id}"
              payload: {}
              as: __MISSING__
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "response_type is error and data carries both error_id and message"
            - "the body does not carry a NetworkParticipant payload, so no participant data leaked past the auth band"

  # ===========================================================================
  # Corners already exercised by a named §1.8 difficulty instance.
  # Stub form: name + claim_type + grounds + excluded_because. No test_recipe.
  # ===========================================================================
  - section: calculations
    instances:

      - name: benefit_variant_divergence_already_asserted_by_difficulty_instance
        claim_type: variant_divergence
        grounds:
          - calculations.benefit_cost_estimate.variants.provisional_at_prescribe
          - calculations.benefit_cost_estimate.variants.final_at_fill
          - entities.BenefitCheck.fields.estimated_patient_pay_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / benefit_cost_estimate_dual_variant_on_benefit_check
          rationale: "The named §1.8 instance already asserts both variants' outputs on identical inputs (3100/5200 provisional against 3400/4900 final) and the resulting payer deductible advance, so a second corner copy adds no coverage."

      - name: reliability_variant_selection_already_asserted_by_difficulty_instance
        claim_type: variant_selection
        grounds:
          - calculations.reliability_factor.variants.chronological_window
          - calculations.reliability_factor.variants.ewma_decay
          - entities.DirectoryEndpoint.fields.reliability_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / reliability_ratio_dual_variant_on_directory_endpoint
          rationale: "The named §1.8 instance pins which variant the downtime gate consumes and pins the other variant's value on the same history, which is exactly the variant-selection claim."

      - name: fee_ceiling_threshold_already_asserted_by_difficulty_instance
        claim_type: constants_applied
        grounds:
          - calculations.transaction_fee_settlement
          - constants.MONTHLY_CHARGEABLE_CEILING
        excluded_because:
          difficulty_instance: boundary_precision_check / monthly_chargeable_ceiling_boundary_at_seven_thousand_five_hundred
          rationale: "The named §1.8 instance walks below/at/above 7500 and pins the clamp-before-tiering order, covering the ceiling constant's application."

  - section: state_machines
    instances:

      - name: endpoint_disable_cascade_already_asserted_by_difficulty_instance
        claim_type: cascade_down
        grounds:
          - state_machines.DirectoryEndpoint.transitions.ACTIVE_to_DISABLED
          - entities.NetworkParticipant.fields.directory_listed
          - entities.Prescription.fields.clinical_status
        excluded_because:
          difficulty_instance: transitive_cascade / endpoint_disable_cascade_reaches_prescription_undeliverable
          rationale: "The named §1.8 instance replays all five hops of the disable cascade and asserts each intermediate state, so a corner copy would restate the same chain."

      - name: endpoint_degrade_cascade_already_asserted_by_difficulty_instance
        claim_type: cascade_down
        grounds:
          - state_machines.DirectoryEndpoint.transitions.ACTIVE_to_DEGRADED
          - calculations.reliability_factor.variants.chronological_window
        excluded_because:
          difficulty_instance: transitive_cascade / acknowledged_attempt_cascade_reaches_endpoint_degradation
          rationale: "The named §1.8 instance asserts the five-hop chain from sign through the reliability recompute to the endpoint degrade and the participant rollup."

  - section: validations
    instances:

      - name: certification_priority_conflict_already_asserted_by_difficulty_instance
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
