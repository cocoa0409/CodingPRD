  - rule_id: boundary_precision_check
    instances:
      - name: ffa_exactly_at_heavy_threshold_versus_one_hundredth_below
        grounds:
          - calculations.pretreatment_tier_and_fee
          - entities.QualityTest.fields.ffa_pct
          - entities.FeedstockLot.fields.pretreatment_fee_usd
          - state_machines.FeedstockLot.RECEIVED_to_PRETREAT_REQUIRED
        distinguishing_aspect: |
          The FFA tier boundary is inclusive at two decimal places: 5.00 is HEAVY, 4.99 is LIGHT, and one
          hundredth of a percentage point on the same 100.000 MT of soybean oil is the difference between a
          4275.00 and an 1850.00 pretreatment fee. Both lots are otherwise identical, so nothing but the
          >= comparison at the pinned precision can explain the 2425.00 divergence.
        test_recipe:
          setup:
            - "A VERIFIED SOYBEAN_OIL supplier."
            - "Two RECEIVED lots of exactly 100.000 MT each, same price and same attested CI."
            - "Clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Prairie Crush Cooperative", country_code: "US", feedstock_types: ["SOYBEAN_OIL"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-j" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "CHAIN_OF_CUSTODY", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-coc-2702-j" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "SOYBEAN_OIL", mass_mt: 100.000, attested_ci_gco2e_per_mj: 58.90, purchase_price_usd_per_mt: 1020.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_at_id: $.data.id, lot_at_v0: $.data.version }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "SOYBEAN_OIL", mass_mt: 100.000, attested_ci_gco2e_per_mj: 58.90, purchase_price_usd_per_mt: 1020.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_below_id: $.data.id, lot_below_v0: $.data.version }
          trigger:
            - call: "POST /feedstock-lots/${lot_at_id}/quality-tests"
              payload: { ffa_pct: 5.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_at_v0}" }
              as: QualityAnalyst
            - call: "POST /feedstock-lots/${lot_below_id}/quality-tests"
              payload: { ffa_pct: 4.99, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_below_v0}" }
              as: QualityAnalyst
          assert:
            - "Both trigger calls: response.status == 201"
            - "FeedstockLot.${lot_at_id}.pretreatment_tier == HEAVY"
            - "FeedstockLot.${lot_at_id}.pretreatment_fee_usd == 4275.00"
            - "FeedstockLot.${lot_at_id}.status == PRETREAT_REQUIRED"
            - "FeedstockLot.${lot_below_id}.pretreatment_tier == LIGHT"
            - "FeedstockLot.${lot_below_id}.pretreatment_fee_usd == 1850.00"
            - "FeedstockLot.${lot_below_id}.status == PRETREAT_REQUIRED"
            - "QualityTest for ${lot_at_id}: ffa_tier_index == 2, moisture_tier_index == 0, insolubles_tier_index == 0, phosphorus_tier_index == 0, tier == HEAVY, disposition == PRETREAT"
            - "QualityTest for ${lot_below_id}: ffa_tier_index == 1, tier == LIGHT, disposition == PRETREAT"

