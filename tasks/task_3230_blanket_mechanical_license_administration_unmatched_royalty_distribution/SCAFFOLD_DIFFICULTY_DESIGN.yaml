              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900003", track_title: "Petrel", plays_count: 1000, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "GET /mlc/usage-lines/${l0}/accruals"
              payload: {}
              as: MLCAdministrator
              captures: { acc_id: "$.data[0].id", acc_hold: "$.data[0].hold_expires_at" }
          assert:
            - "UsageReport.${r0}.status == ACCEPTED (hop 1)"
            - "UsageLine.${l0}.status == UNMATCHED (hop 2, caused by the acceptance sweep)"
            - "RoyaltyAccrual.${acc_id}.status == HELD and amount_cents == 131000 (hop 3, spawned by the line's UNMATCHED transition)"
            - "RoyaltyAccrual.${acc_id}.hold_expires_at == 2029-07-01T00:00:00Z (36 months after 2026-07-01, the first day of the month following the 2026-06 reporting month)"

      - name: dispute_open_freeze_cascade
        grounds:
          - state_machines.Dispute.transitions
          - state_machines.MusicalWork.ACTIVE_to_UNDER_DISPUTE
          - state_machines.UsageLine.CLAIMED_MATCHED_to_DISPUTE_HELD
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger (dispute
          creation, not report acceptance): open(Dispute) mutates
          MusicalWork (ACTIVE -> UNDER_DISPUTE); the dispute fold-in itself
          moves the contested UsageLine CLAIMED_MATCHED -> DISPUTE_HELD,
          freezing its queued postings.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule ACTIVE; DSP ACTIVE; member A with 100% share on work 'Harrier'"
            - "Accepted report 2026-06 with unmatched line 'Harrier' (26200 cents) -> HELD accrual"
