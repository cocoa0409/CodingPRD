            - "third PATCH raises the limit and switches the programme in one call: ${limit3} == 100000.00, ${prog3} == \"NON_RETURNABLE\", ${status3} == \"ACTIVE\" (994.58 <= 100000.00), and ${pt3} == false - the previously patched flag stays where the second call left it"

