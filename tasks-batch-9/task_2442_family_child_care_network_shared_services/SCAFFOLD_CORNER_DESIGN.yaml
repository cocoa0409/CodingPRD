          - entities.SubsidyClaim.fields.paid_cents
          - entities.SubsidyContract.fields.unallocated_credit_cents
        distinguishing_aspect: "A 100000-cent remittance against two RECONCILED claims of 90000 each fills the first bucket completely (SETTLED, paid_cents 90000) and only partially fills the second (paid_cents 10000, still RECONCILED), leaving unallocated_cents 0 — no even splitting, no overflow into credit."
