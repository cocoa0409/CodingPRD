          rationale: "The §1.8 priority-conflict instance triggers both codes on the same requirement: the self-review returns 403 ERR_CLOSING_REVIEW_SOD, and once a different reviewer acts the outstanding title exception returns 409 ERR_TITLE_EXCEPTIONS_OUTSTANDING."

