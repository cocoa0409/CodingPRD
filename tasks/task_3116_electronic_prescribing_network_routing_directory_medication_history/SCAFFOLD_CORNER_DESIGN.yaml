          rationale: "The named §1.8 instance contrasts the two error_ids returned for the same operation across two routing states, covering the safety-versus-state band ordering."

  - section: errors
    instances:

      - name: endpoint_interval_overlap_error_already_asserted_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENDPOINT_INTERVAL_OVERLAP]
          - entities.DirectoryEndpoint.fields.effective_to
        excluded_because:
