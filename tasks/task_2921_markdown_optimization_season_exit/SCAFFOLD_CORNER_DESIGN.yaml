scaffold_corner_design:

  - section: entities
    instances:
      - name: season_create_returns_declared_and_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Season
          - endpoints[POST /seasons]
          - response_envelope.success
          - state_machines.Season.status.initial_state
        distinguishing_aspect: |
          Registration is the only way a Season enters the system: the 201 response must echo all eight input
          fields and initialise the three clearance counters to 0, status to PLANNING and version to 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MerchandiseDirector
          trigger:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "data.code == 'FW26-APPAREL', category == APPAREL, exit_units_target == 1000, sell_through_target_pct == 82.00 and clearance_space_units == 900"
            - "data.status == PLANNING (the declared initial_state) and version == 1"
            - "data.reserved_clearance_units == 0, committed_clearance_units == 0 and projected_exit_units == 0"
            - "data.id is a bare UUID with no type prefix, and created_at / updated_at are ISO-8601 UTC with exactly three fractional digits"
      - name: item_get_returns_computed_inventory_position
        claim_type: Retrieval
        grounds:
          - entities.Item.fields.sell_through_pct
          - entities.Item.fields.weeks_of_supply
          - endpoints[GET /items/{item_id}]
          - calculations.lifecycle_stage_classification
        distinguishing_aspect: |
          A GET must serve the derived inventory position, not just the stored columns: four posted sales weeks
          make units_sold_total 257, on_hand 343, sell_through 42.83 and weeks_of_supply 5.34 on a single read.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and item A-1001 (600 units received at 4999c) has its four sales weeks posted: 60, 55, 68 and 74 units"
            - "Logical clock stands at 2026-10-10T00:00:00Z, past the item's 2026-10-01 protected date"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "GET /items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
          assert:
            - "data.units_sold_total == 257 and on_hand_units == 343 (600 - 257 - 0)"
            - "data.sample_weeks == 4 and sell_through_pct == 42.83 (round_half_up(257/600*100, 2))"
            - "data.weeks_of_supply == 5.34, from avg_weekly_units_sold 64.2500 and 343 on hand"
            - "data.protected_until_date == '2026-10-01' (first_receipt_date + 42 days for APPAREL)"
            - "data.current_retail_cents == 4999, permanent_markdown_reserve_cents == 0 and promo_discount_cents == 0"
            - "data.lifecycle_stage == AGING (slow_seller: 42.83 < 45.0 with weeks_on_hand 7 >= 6) and markdown_state == FULL_PRICE"
      - name: items_list_filters_and_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /items]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Item.fields.lifecycle_stage
        distinguishing_aspect: |
          total_count counts the whole filtered set while data holds only the page: limit 1 over two items must
          report total_count 2 with has_more true, and offset 1 must report has_more false with the same total.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and holds exactly two items: A-1001 (APPAREL, four sales weeks, AGING) and F-5005 (FOOTWEAR, no sales, protected until 2026-10-13 so NEW_ARRIVAL)"
            - "Logical clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "F-5005", season_id: "${season_id}", category: "FOOTWEAR", cluster_code: "CL-M1", vendor_code: "VN-200", first_receipt_date: "2026-08-18", original_retail_cents: 8999, unit_cost_cents: 3600, units_received_total: 200 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_f_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "GET /items"
              payload: { season_id: "${season_id}", limit: 1, offset: 0 }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "GET /items"
              payload: { season_id: "${season_id}", limit: 1, offset: 1 }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "GET /items"
              payload: { season_id: "${season_id}", lifecycle_stage: "NEW_ARRIVAL" }
              as: MerchandiseDirector
              as_user_id: "md-1"
          assert:
            - "The first call returns response_type == 'array' with total_count == 2, has_more == true and exactly 1 element in data"
            - "The second call returns total_count == 2, has_more == false and exactly 1 element in data"
            - "The third call returns total_count == 1 and data[0].sku == 'F-5005' (FOOTWEAR is protected 56 days, through 2026-10-13)"
            - "The unfiltered default page size is 10, so a call with neither limit nor offset would return both items with has_more == false"
      - name: markdown_plan_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /markdown-plans/{markdown_plan_id}]
          - errors[ERR_PLAN_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no MarkdownPlan must produce the entity-specific 404
          ERR_PLAN_NOT_FOUND, not a generic error and not an empty 200 envelope.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no MarkdownPlan has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "GET /markdown-plans/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_plan: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == 'error' and data.error_id == 'ERR_PLAN_NOT_FOUND'"
            - "GET /markdown-plans returns total_count == 0, confirming nothing was created as a side effect of the failed read"
      - name: item_create_missing_unit_cost_cents_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /items].input
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          unit_cost_cents is a required input with no default, so omitting it must fail at priority 3 with
          ERR_VALIDATION and persist nothing - the season must still hold zero items afterwards.
        test_recipe:
          setup:
            - "Season FW26-APPAREL exists in PLANNING; the clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == 'ERR_VALIDATION'"
            - "GET /items?season_id=${season_id} returns total_count == 0"
            - "Season.${season_id}.status is still PLANNING, so the failed create could not have activated anything"
      - name: price_zone_and_store_defaults_derive_from_zone_type
        claim_type: Defaults
        grounds:
          - entities.PriceZone.fields.signage_lead_days
          - global_constants.SIGNAGE_LEAD_DEFAULT_DAYS
          - entities.Store.fields.status
          - entities.Store.fields.available_clearance_units
        distinguishing_aspect: |
          Omitting signage_lead_days must resolve it from SIGNAGE_LEAD_DEFAULT_DAYS by zone_type - 10 for CHAIN
          and 3 for STORE - while an omitted Store.status defaults to OPEN with all bays available.
        test_recipe:
          setup:
            - "Empty registry; the clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: MerchandiseDirector
          trigger:
            - call: "POST /price-zones"
              payload: { zone_code: "CHAIN-US", zone_type: "CHAIN" }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { chain_zone_id: $.data.id }
            - call: "POST /price-zones"
              payload: { zone_code: "STORE-0101Z", zone_type: "STORE", parent_zone_id: "${chain_zone_id}" }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { store_zone_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "0101", price_zone_id: "${store_zone_id}", clearance_bay_units: 300 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { store_0101_id: $.data.id }
          assert:
            - "PriceZone.${chain_zone_id}.signage_lead_days == 10 (SIGNAGE_LEAD_DEFAULT_DAYS[CHAIN]) and parent_zone_id is null"
            - "PriceZone.${store_zone_id}.signage_lead_days == 3 (SIGNAGE_LEAD_DEFAULT_DAYS[STORE])"
            - "Store.${store_0101_id}.status == OPEN, committed_clearance_units == 0 and available_clearance_units == 300"
      - name: item_computed_fields_initialised_from_registration
        claim_type: Computed Fields
        grounds:
          - entities.Item.fields.protected_until_date
          - entities.Item.fields.weeks_of_supply
          - calculations.lifecycle_stage_classification.constants.PROTECTED_NEW_ARRIVAL_DAYS
          - entities.Item.fields.on_hand_units
        distinguishing_aspect: |
          Every Item field with source computed must be derived at registration, not accepted from the client:
          protected_until_date is first_receipt_date + 42 for APPAREL and weeks_of_supply is the 999.99 sentinel
          while sample_weeks is 0.
        test_recipe:
          setup:
            - "Season FW26-APPAREL exists; the clock stands at 2026-08-25T00:00:00Z, inside the protected window"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
          assert:
            - "data.protected_until_date == '2026-10-01' (2026-08-20 + PROTECTED_NEW_ARRIVAL_DAYS[APPAREL] = 42 days)"
            - "data.current_retail_cents == 4999, initialised from original_retail_cents"
            - "data.on_hand_units == 600, units_sold_total == 0, units_committed_disposition == 0 and units_disposed_total == 0"
            - "data.sample_weeks == 0, sell_through_pct == 0.00 and weeks_of_supply == 999.99 (the declared sentinel, not a division error)"
            - "data.lifecycle_stage == NEW_ARRIVAL (R2 matches: 2026-08-25 <= 2026-10-01) and markdown_state == FULL_PRICE"
      - name: store_patch_bumps_version_and_refreshes_updated_at
        claim_type: System Fields
        grounds:
          - entities.Store
          - endpoints[PATCH /stores/{store_id}]
          - entities.Store.fields.available_clearance_units
        distinguishing_aspect: |
          The four common fields are server-owned: a PATCH must leave id and created_at untouched while version
          goes 1 -> 2 and updated_at is refreshed, and the derived available_clearance_units must follow the new cap.
        test_recipe:
          setup:
            - "Zone REGION-WEST exists and store 0101 was registered OPEN with 300 clearance bay units and no reservations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: MerchandiseDirector
            - call: "POST /price-zones"
              payload: { zone_code: "CHAIN-US", zone_type: "CHAIN", signage_lead_days: 10 }
              as: MerchandiseDirector
              captures: { chain_zone_id: $.data.id }
            - call: "POST /price-zones"
              payload: { zone_code: "REGION-WEST", zone_type: "REGION", parent_zone_id: "${chain_zone_id}", signage_lead_days: 7, region_code: "WEST" }
              as: MerchandiseDirector
              captures: { west_zone_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "0101", price_zone_id: "${west_zone_id}", clearance_bay_units: 300, region_code: "WEST" }
              as: MerchandiseDirector
              captures: { store_0101_id: $.data.id }
          trigger:
            - call: "PATCH /stores/${store_0101_id}"
              payload: { status: "REMODEL", clearance_bay_units: 250 }
              as: MerchandiseDirector
              as_user_id: "md-1"
          assert:
            - "data.version == 2 and updated_at is strictly greater than created_at, which is unchanged"
            - "data.id equals ${store_0101_id} - a PATCH never re-mints identity"
            - "data.status == REMODEL and clearance_bay_units == 250"
            - "data.committed_clearance_units == 0 and available_clearance_units == 250, re-derived from the new cap"
      - name: sales_week_row_is_immutable_with_no_version_dimension
        claim_type: Immutability
        grounds:
          - entities.SalesWeek
          - entities.SalesWeek.fields.price_relative_pct
          - endpoints[GET /items/{item_id}/sales-weeks]
        distinguishing_aspect: |
          SalesWeek declares common_fields false, so each row carries only id and created_at - no version, no
          updated_at - and §1.5 offers no PATCH or DELETE for it: history is append-only.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and item A-1001 has its first sales week (2026-09-05, 60 units at 4999c) posted"
            - "The clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
              as_user_id: "pa-1"
          trigger:
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
              as_user_id: "pa-1"
            - call: "GET /items/${item_a_id}/sales-weeks"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
          assert:
            - "The created row exposes id and created_at but carries no version and no updated_at field"
            - "data.price_relative_pct == 90.00 for the 4499c week (round_half_up(4499/4999*100, 2)) and 100.00 for the 4999c week"
            - "GET /items/${item_a_id}/sales-weeks returns total_count == 2"
            - "§1.5 declares no PATCH or DELETE route for SalesWeek, so a posted week can never be edited or removed"
            - "Item.${item_a_id}.units_sold_total == 128 and sample_weeks == 2, re-derived from the two rows"
      - name: season_create_rejects_bad_enum_and_out_of_range_fields
        claim_type: Type Constraints
        grounds:
          - entities.Season.fields.category
          - entities.Season.fields.sell_through_target_pct
          - entities.Season.fields.exit_target_date
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Type constraints are checked at priority 3 before any business rule: an unlisted category enum, a
          sell_through_target_pct below 0.01 and an exit_target_date past season_end_date each yield ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty database; the clock stands at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MerchandiseDirector
          trigger:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "OUTERWEAR", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 0.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { err_range: $.data.error_id }
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-02-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { err_dates: $.data.error_id }
          assert:
