            - "place afterwards: HTTP 409 error_id == ERR_BOARDING_INVALID_STATE"

  # ===========================================================================
  # 3. Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: selector_tie_break_uses_created_at
        claim_type: correct_result
        grounds: [calculations.bed_match_score]
        distinguishing_aspect: "Two beds with identical score (same service/acuity/isolation, no unit preference): the selector picks the one created first (created_at ASC); UUIDs never decide."
        test_recipe:
          setup:
            - "Clock at 00:00; facility; physician ON_CALL CARDIAC; TR ACCEPTED (CARDIAC, ACUITY_3, NONE, no preferred_unit)"
            - "Two identical beds bOld (created first) and bNew, both CARDIAC/MEDICAL_SURGICAL/NONE"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Tie Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Tie", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "OLD", service: "CARDIAC", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { bOld: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-2", label: "NEW", service: "CARDIAC", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { bNew: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PTIE", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: {}
              as: TransferCenterCoordinator
              captures: { hold_bed: $.data.bed_id }
          assert:
            - "BedHold created with bed_id == ${bOld} (both beds score 1410; earlier created_at wins the tie)"

      - name: selector_empty_pool_returns_no_eligible_bed
        claim_type: boundary_edge
        grounds: [calculations.bed_match_score, "errors[ERR_NO_ELIGIBLE_BED]"]
        distinguishing_aspect: "Selector fallback: bed_id omitted and no bed passes eligibility (only an ED bed exists) -> 409 ERR_NO_ELIGIBLE_BED."
        test_recipe:
          setup:
            - "Clock at 00:00; facility with a single ED bed; physician ON_CALL MEDICAL; TR ACCEPTED (MEDICAL, ACUITY_3, NONE)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Empty Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Em", services: ["MEDICAL"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PEM", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: {}
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_NO_ELIGIBLE_BED (ED-unit beds are never selector candidates)"

      - name: hold_quota_seventh_hold_rejected
        claim_type: boundary_edge
        grounds: [calculations.hold_quota_check, "errors[ERR_HOLD_QUOTA_EXCEEDED]"]
        distinguishing_aspect: "Quota boundary alone (no other violation): with 6 ACTIVE holds the 7th eligible hold fails with ERR_HOLD_QUOTA_EXCEEDED; the >= rule means exactly 6 is the cap."
