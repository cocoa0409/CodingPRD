      - name: staffing_patch_response_shows_the_posture_flip_in_its_own_body
        claim_type: immediate
        grounds:
          - endpoints.PATCH_centers_center_id_staffing
          - calculations.center_intake_posture
          - entities.Center.fields.intake_posture
        distinguishing_aspect: "A staffing cut that drops staffing_headroom from 47 to exactly 1 reports intake_posture RESTRICTED and student_teacher_ratio 5.00 in the PATCH response itself rather than only on the next read, and a matching GET confirms the same values."
        test_recipe:
          setup:
            - "one 10-seat center at 4.00 certified FTE with exactly one ACTIVE placement, so staffing_headroom is 47 and the posture is OPEN"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-6801", full_name: "Kira Lund", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-01" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
            - call: "GET /centers/${ctr_id}"
              payload: {}
              as: DistrictAdmin
              as_user_id: "admin-01"
              captures: { ctr_v2: $.data.version }
          trigger:
            - call: "PATCH /centers/${ctr_id}/staffing"
