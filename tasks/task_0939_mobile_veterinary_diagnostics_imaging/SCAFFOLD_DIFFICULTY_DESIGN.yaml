              payload: { modality: "RADIOGRAPHY", serial_label: "XR-K", assigned_unit_id: "${un_k}" }
              as: PlatformAdmin
              captures: { eq_r: $.data.id }
            - call: "POST /equipment/${eq_r}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
