      - A COMMITTED 2-segment PAIRED_LOOP has a DONOR_RECOVERY booking for seg1 in OR-1 (2026-08-09T05:00:00Z..07:00:00Z)
        and a RECIPIENT_IMPLANT booking in OR-2 (2026-08-09T22:00:00Z..2026-08-10T02:00:00Z).
