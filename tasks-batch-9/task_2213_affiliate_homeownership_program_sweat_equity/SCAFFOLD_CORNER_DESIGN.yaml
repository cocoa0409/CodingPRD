      - name: site_readiness_ladder_advances_one_documented_step_at_a_time
        claim_type: valid_transition
        grounds: ["state_machines.BuildSite.readiness_status.RAW_LAND_to_TITLE_CLEAR", "state_machines.BuildSite.readiness_status.TITLE_CLEAR_to_ENV_CLEARED", "state_machines.BuildSite.readiness_status.ENV_CLEARED_to_READY_TO_BUILD", entities.BuildSite.fields.title_cleared, entities.BuildSite.fields.environmental_cleared, entities.BuildSite.fields.utilities_cleared, errors.ERR_TRANSITION_NOT_ALLOWED]
        distinguishing_aspect: "Each accepted step flips exactly ONE clearance flag and leaves the other two untouched; steps taken out of order are refused, so a site cannot reach READY_TO_BUILD by presenting the UTILITIES document first."
        test_recipe:
          setup:
            - "Canonical program with one RAW_LAND site (all three clearance flags false)."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { e_out_of_order: $.data.error_id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "FINAL_INSPECTION", document_reference: "FINAL-1001" }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_final_early: $.data.error_id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "UTILITIES first: HTTP 409 and ${e_out_of_order} == ERR_TRANSITION_NOT_ALLOWED; the site is still RAW_LAND with utilities_cleared == false"
            - "After TITLE: readiness_status == TITLE_CLEAR, title_cleared == true, environmental_cleared == false, utilities_cleared == false"
            - "FINAL_INSPECTION from TITLE_CLEAR: HTTP 409 and ${e_final_early} == ERR_TRANSITION_NOT_ALLOWED (COMPLETED is reachable only from UNDER_CONSTRUCTION)"
            - "After ENVIRONMENTAL: readiness_status == ENV_CLEARED, title_cleared == true, environmental_cleared == true, utilities_cleared == false"
            - "After UTILITIES: readiness_status == READY_TO_BUILD with all three flags true, safety_posture still CLEAR and assigned_household_id still null"

      - name: return_to_screening_clears_final_scores_but_keeps_reviews
        claim_type: side_effect_execution
        grounds: ["state_machines.ApplicantHousehold.selection_status.COMMITTEE_REVIEW_to_SCREENING", "state_machines.ApplicantHousehold.selection_status.SCREENING_to_COMMITTEE_REVIEW", entities.ApplicantHousehold.fields.score_basis, entities.ApplicantHousehold.fields.composite_selection_score, entities.SelectionReview.fields.status, calculations.committee_quorum_and_willingness]
        distinguishing_aspect: "The branching machine's one backward edge is a partial reset: score_basis drops to PRELIMINARY and the composite and willingness scores go null, but the six SUBMITTED reviews are deliberately NOT retracted, so quorum survives the loop and the household can be referred again and decided without re-reviewing."
        test_recipe:
          setup:
