    instances:
      - name: data_window_seal_from_open_valid_transition
        claim_type: valid_transition
        grounds:
          - "state_machines DataWindow OPEN -> SEALED on POST /mmm/data-windows/{id}/seal, actor DataEngineer"
          - "side_effects - status := SEALED; version += 1; recompute Market.data_posture"
          - "calculations.market_data_posture - the RESTRICTED branch also fires when no PUBLISHED ModelRun exists"
