scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: profit_share_provisional_vs_final_on_charge_correction
        grounds:
          - calculations.advisor_profit_share
          - calculations.branch_net_profit
          - state_machines.BranchFinancialPeriod.CLOSED_to_FINALIZED
        distinguishing_aspect: |
          Entity domain: BranchFinancialPeriod P&L. The provisional variant
          (computed at close) excludes a charge correction that is reversed and
          re-posted after close, while the final variant (at finalize) includes
          the re-posted charge — identical raw activity yields different
          advisor_share_cents between the two variants.
        test_recipe:
          setup:
            - "An OPEN branch with an OPEN financial period P covering 2026-09-01..2026-10-01"
            - "Two POSTED production records in window: gross 1000000 and 800000, payout 1.0 (revenue 1800000)"
            - "Charges LEASE_RENT 300000, BOA_PAYROLL 240000, EQUIPMENT 100000 POSTED (total 640000, net 1160000)"
            - "Period P closed at clock 2026-10-02: provisional advisor_share_cents = 473600"
            - "The EQUIPMENT charge reversed, then a corrected EQUIPMENT charge 110000 posted while period CLOSED"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv One", email: "adv1@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Cedar Falls", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Cedar Falls", site_address: "1 Main St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_id}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/administrators"
              payload: { full_name: "Boa One", email: "boa1@x.com", monthly_salary_cents: 300000 }
              as: HomeOfficeAdmin
              captures: { boa_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/assign-administrator"
              payload: { administrator_id: "${boa_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/open"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods"
              payload: { branch_id: "${br_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { per_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 1000000, payout_rate: 1.0, posted_at: "2026-09-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 800000, payout_rate: 1.0, posted_at: "2026-09-15T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/charges"
              payload: { branch_id: "${br_id}", charge_type: "LEASE_RENT", amount_cents: 300000 }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/charges"
              payload: { branch_id: "${br_id}", charge_type: "BOA_PAYROLL", amount_cents: 240000 }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/charges"
              payload: { branch_id: "${br_id}", charge_type: "EQUIPMENT", amount_cents: 100000 }
              as: HomeOfficeAdmin
              captures: { eq_charge_id: $.data.id }
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/close"
              payload: {}
              as: HomeOfficeAdmin
              captures: { provisional_share: $.data.advisor_share_cents }
            - call: "POST /branch-office/charges/${eq_charge_id}/reverse"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/reopen"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/charges"
              payload: { branch_id: "${br_id}", charge_type: "EQUIPMENT", amount_cents: 110000 }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/close"
              payload: {}
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/financial-periods/${per_id}/finalize"
              payload: {}
              as: HomeOfficeAdmin
              captures: { final_share: $.data.advisor_share_cents }
          assert:
            - "BranchFinancialPeriod.${per_id} provisional advisor_share_cents at first close == 473600 (net 1160000)"
            - "BranchFinancialPeriod.${per_id}.advisor_share_cents after finalize == 469000 (net 1150000: 190000 + 210000 + 69000)"
            - "final advisor_share_cents != provisional advisor_share_cents (469000 != 473600)"
      - name: goodwill_internal_vs_open_market_same_trailing_revenue
        grounds:
          - calculations.goodwill_valuation
          - entities.GoodwillTransfer.fields.valuation_mode
        distinguishing_aspect: |
          Entity domain: GoodwillTransfer valuation (distinct from the P&L
          domain of the sibling instance). Two transfers over branches with
          identical trailing-12-month POSTED revenue (2400000 cents) produce
          offer_price_cents 1800000 under INTERNAL_SUCCESSION and 2640000
          under OPEN_MARKET — same data, different result per variant.
        test_recipe:
          setup:
            - "Two branches B_int and B_open, each with a PRACTICING advisor"
            - "Each advisor has 12 POSTED production records of gross 200000, payout 1.0, one per month in [2025-09-01, 2026-08-01] (trailing revenue 2400000 before creation month 2026-09)"
            - "Both advisors declared retirement (RETIRING)"
            - "Clock at 2026-09-05"
          setup_api_calls:
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Ret A", email: "reta@x.com", hire_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_a: $.data.id }
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Ret B", email: "retb@x.com", hire_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_b: $.data.id }
            - call: "POST /branch-office/advisors/${adv_a}/enroll-training"
              payload: { goal_cents: 100, start_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_a: $.data.id }
            - call: "POST /branch-office/advisors/${adv_b}/enroll-training"
              payload: { goal_cents: 100, start_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_b: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_a}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2020-01-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_b}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2020-01-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_a}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_a}"
            - call: "POST /branch-office/training-programs/${tp_b}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_b}"
            - call: "POST /branch-office/training-programs/${tp_a}/evaluate"
              payload: { window_end: "2020-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_b}/evaluate"
              payload: { window_end: "2020-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Town A", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_a: $.data.id }
            - call: "POST /branch-office/territories"
              payload: { community_name: "Town B", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_b: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Town A", site_address: "10 A St", territory_id: "${ter_a}" }
              as: HomeOfficeAdmin
              captures: { br_a: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Town B", site_address: "20 B St", territory_id: "${ter_b}" }
              as: HomeOfficeAdmin
              captures: { br_b: $.data.id }
            - call: "POST /branch-office/branches/${br_a}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2020-01-01T00:00:00Z", term_end: "2030-12-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_b}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2020-01-01T00:00:00Z", term_end: "2030-12-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_a}/assign-branch"
              payload: { branch_id: "${br_a}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_b}/assign-branch"
              payload: { branch_id: "${br_b}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_a}", gross_commission_cents: 2400000, payout_rate: 1.0, posted_at: "2026-03-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_b}", gross_commission_cents: 2400000, payout_rate: 1.0, posted_at: "2026-03-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_a}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_a}"
            - call: "POST /branch-office/advisors/${adv_b}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_b}"
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Succ X", email: "succx@x.com", hire_date: "2024-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_x: $.data.id }
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Succ Y", email: "succy@x.com", hire_date: "2024-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_y: $.data.id }
          trigger:
            - call: "POST /branch-office/goodwill-transfers"
              payload: { branch_id: "${br_a}", retiring_advisor_id: "${adv_a}", successor_advisor_id: "${adv_x}", valuation_mode: "INTERNAL_SUCCESSION", escrow_deposit_cents: 0 }
              as: HomeOfficeAdmin
              captures: { gt_int_id: $.data.id, offer_int: $.data.offer_price_cents, trailing_int: $.data.trailing_revenue_cents }
            - call: "POST /branch-office/goodwill-transfers"
              payload: { branch_id: "${br_b}", retiring_advisor_id: "${adv_b}", successor_advisor_id: "${adv_y}", valuation_mode: "OPEN_MARKET", escrow_deposit_cents: 0 }
              as: HomeOfficeAdmin
              captures: { gt_open_id: $.data.id, offer_open: $.data.offer_price_cents }
          assert:
            - "GoodwillTransfer.${gt_int_id}.trailing_revenue_cents == 2400000"
            - "GoodwillTransfer.${gt_int_id}.offer_price_cents == 1800000"
            - "GoodwillTransfer.${gt_open_id}.offer_price_cents == 2640000"
            - "offer_int != offer_open for identical trailing revenue"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: profit_share_tiered_nested_min_max
        grounds:
          - calculations.advisor_profit_share
          - entities.BranchFinancialPeriod.fields.advisor_share_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested min/max
          tier selection over net_profit with three rate tiers. A net of
          1000010 cents exercises all three tiers and yields 400005.
        test_recipe:
          setup:
            - "OPEN branch with OPEN period 2026-09-01..2026-10-01"
            - "Revenue: one POSTED production record gross 1500010 payout 1.0"
            - "Charges: LEASE_RENT 500000 POSTED (net = 1000010)"
            - "Clock advanced past period end"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv T", email: "advt@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Tier Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Tier Town", site_address: "5 Oak St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_id}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/administrators"
              payload: { full_name: "Boa T", email: "boat@x.com", monthly_salary_cents: 300000 }
              as: HomeOfficeAdmin
              captures: { boa_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/assign-administrator"
              payload: { administrator_id: "${boa_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/open"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods"
              payload: { branch_id: "${br_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { per_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 1500010, payout_rate: 1.0, posted_at: "2026-09-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${per_id}/charges"
              payload: { branch_id: "${br_id}", charge_type: "LEASE_RENT", amount_cents: 500000 }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/financial-periods/${per_id}/close"
              payload: {}
              as: HomeOfficeAdmin
              captures: { share: $.data.advisor_share_cents, net: $.data.net_profit_cents }
          assert:
            - "BranchFinancialPeriod.${per_id}.net_profit_cents == 1000010"
            - "BranchFinancialPeriod.${per_id}.advisor_share_cents == 400005"
      - name: training_milestone_per_record_rounding
        grounds:
          - calculations.training_production_window
          - entities.ProductionRecord.fields.commissions_cents
          - entities.MilestoneEvaluation.fields.production_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each ProductionRecord
          rounds gross*payout half-up per record, and the milestone sums the
          per-record rounded values; sum-then-round would give 101, the pinned
          per-record order gives 102.
        test_recipe:
          setup:
            - "Advisor enrolled in TrainingProgram with goal_cents == 102"
            - "Two POSTED production records: gross 101 payout 0.5 each (per-record commissions 51)"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv R", email: "advr@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 102, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 101, payout_rate: 0.5, posted_at: "2026-02-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { pr1_comm: $.data.commissions_cents }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 101, payout_rate: 0.5, posted_at: "2026-02-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
          trigger:
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { eval_prod: $.data.production_cents, eval_outcome: $.data.outcome }
          assert:
            - "ProductionRecord #1 commissions_cents == 51 (round_half_up(101*0.5))"
            - "MilestoneEvaluation.production_cents == 102"
            - "MilestoneEvaluation.outcome == PASS (102 >= 102, inclusive boundary)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: goodwill_negotiation_cycle_with_alternation
        grounds:
          - state_machines.GoodwillTransfer.NEGOTIATING_to_NEGOTIATING
          - concurrency_rules[goodwill-counter-offer-stale-version]
        distinguishing_aspect: |
          Entity: GoodwillTransfer. Cyclic machine — OFFERED -> NEGOTIATING ->
          NEGOTIATING loops per counter-offer with strict party alternation;
          negotiation_round increments each cycle.
        test_recipe:
          setup:
            - "Branch with PRACTICING retiring advisor and trailing revenue 2400000; INTERNAL_SUCCESSION transfer OFFERED at 1800000, version observed"
            - "Successor advisor exists"
          setup_api_calls:
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Ret N", email: "retn@x.com", hire_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_r: $.data.id }
            - call: "POST /branch-office/advisors/${adv_r}/enroll-training"
              payload: { goal_cents: 100, start_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_r: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_r}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2020-01-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_r}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/training-programs/${tp_r}/evaluate"
              payload: { window_end: "2020-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Neg Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Neg Town", site_address: "7 Elm St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2020-01-01T00:00:00Z", term_end: "2030-12-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_r}", gross_commission_cents: 2400000, payout_rate: 1.0, posted_at: "2026-03-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Succ N", email: "succn@x.com", hire_date: "2024-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_s: $.data.id }
            - call: "POST /branch-office/goodwill-transfers"
              payload: { branch_id: "${br_id}", retiring_advisor_id: "${adv_r}", successor_advisor_id: "${adv_s}", valuation_mode: "INTERNAL_SUCCESSION", escrow_deposit_cents: 200000 }
              as: HomeOfficeAdmin
              captures: { gt_id: $.data.id, gt_v: $.data.version }
          trigger:
            - call: "POST /branch-office/goodwill-transfers/${gt_id}/counter-offer"
              payload: { expected_transfer_version: "${gt_v}", offer_price_cents: 1700000 }
              as: Advisor
              as_user_id: "${adv_s}"
