  - rule_id: boundary_precision_check
    instances:
      - name: arrears_exactly_at_suspension_threshold_suspends
        grounds:
          - calculations.owner_arrears_and_standing
          - entities.Owner.fields.standing
          - validations[priority=80]
          - errors[ERR_OWNER_STANDING_SUSPENDED]
        distinguishing_aspect: |
          Numeric threshold boundary reached through POST /inspection-orders/{id}/schedule: an owner
          whose posted_arrears_cents is exactly ARREARS_SUSPENSION_THRESHOLD_CENTS 25000 is SUSPENDED
          and blocked, while an owner at 24999 stays GOOD and schedules successfully, pinning the
          comparison as >= and not >.
        test_recipe:
          setup:
            - "District T-EXACT charges travel_surcharge_cents 25000; district T-UNDER charges 24999. Both are in state MT."
            - "Owner A completed one lot-free order in T-EXACT and owner B completed one lot-free order in T-UNDER, both while the clock read 2026-08-01T00:00:00Z, so both fees fall due on 2026-08-31T00:00:00Z."
            - "Clock advanced to 2026-08-31T00:00:00Z and a sweep run, so owner A is at posted_arrears_cents 25000 and owner B at 24999."
            - "Each owner has a fresh REQUESTED order and a free inspector in their own district."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Exact Line Ranch", mailing_state: "MT", contact_email: "exact@example.test" }
              as: BoardAdmin
