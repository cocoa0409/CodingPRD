              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-XD2", full_name: "Nina Prime", date_of_birth: "1994-10-10T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/providers/${provider_id}/terminate"
              payload: {}
              as: NetworkManager
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
