              as_user_id: "${v2}"
              captures: { e_owner: $.data.error_id }
          assert:
            - "HTTP 403 with ${e_owner} == ERR_NOT_RESOURCE_OWNER"
            - "Cart.${ct1}: status == OPEN, checked_out_at == null, version == ${ct1_v}"
            - "GET /orders?cart_id=${ct1} returns 0 items"

      - name: host_cannot_acknowledge_another_hosts_disclosure
        claim_type: not_resource_owner
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[POST /disclosure-records/{record_id}/acknowledge]
        distinguishing_aspect: "Only the booked host may speak the disclosure: a second, equally certified Host acting on host 1's record gets 403 ERR_NOT_RESOURCE_OWNER and the record stays PENDING."
        test_recipe:
          setup:
            - "A PENDING disclosure on host 1's CONFIRMED booking, plus a second certified host."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_show
            - *k_booking
            - *k_disclosure
