            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550135", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
