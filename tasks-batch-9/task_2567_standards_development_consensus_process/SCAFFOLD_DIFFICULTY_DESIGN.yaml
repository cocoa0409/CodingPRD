  # Rule 3 — non-linear state-machine shape on different entities
  #   3a: Draft — cycle (DRAFTING -> SUBCOMMITTEE_BALLOT -> COMMENT_RESOLUTION -> DRAFTING -> ...)
  #   3b: Vote  — two parallel state dimensions on one row
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: draft_cycles_back_through_drafting_into_a_second_ballot_round
        grounds:
          - state_machines.Draft.SUBCOMMITTEE_BALLOT_to_COMMENT_RESOLUTION
          - state_machines.Draft.COMMENT_RESOLUTION_to_DRAFTING
          - state_machines.Draft.DRAFTING_to_SUBCOMMITTEE_BALLOT
          - entities.Draft.fields.ballot_round_count
          - entities.Draft.fields.recirculation_required
