          00000000-0000-4000-8000-000000000001 with no X-User-Role or X-User-ID header returns 401
          ERR_UNAUTHENTICATED, never 404 ERR_STORE_NOT_FOUND, so an anonymous caller cannot probe which
          ids exist.
