scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_diverges
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.total_amount_cents
        distinguishing_aspect: |
          On the Invoice domain, the provisional variant (forward-looking, includes SCHEDULED work
          orders) yields 25000 while the final variant (completed-only) yields 12500 for the same data.
        test_recipe:
          setup:
            - "Customer with generous credit limit; ACTIVE contract with base_rate_cents=0, tax_rate_bps=0"
            - "Two ACTIVE grease-trap Equipment (eq1, eq2) at one Site"
            - "Two SCHEDULED grease-trap WorkOrders (WO1 on eq1, WO2 on eq2) in the May period"
            - "A DRAFT Invoice created while both WOs are SCHEDULED (provisional snapshot = 2 x 12500 = 25000)"
            - "WO1 then completed; WO2 cancelled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers"
              payload: { business_name: "Divergence Diner", billing_email: "d@x.com", credit_limit_cents: 1000000 }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "1 Fry St", municipality_code: "MUNI-A", permit_number: "P-1" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq1_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq2_id: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_id: "${cust_id}", billing_cycle: "MONTHLY", base_rate_cents: 0, tax_rate_bps: 0 }
              as: Admin
              captures: { contract_id: $.data.id }
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq1_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z", contract_id: "${contract_id}" }
              as: Dispatcher
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq2_id}", service_type: "SCHEDULED", planned_start: "2026-05-11T08:00:00Z", planned_end: "2026-05-11T10:00:00Z", contract_id: "${contract_id}" }
              as: Dispatcher
              captures: { wo2_id: $.data.id }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { cust_v: $.data.version }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", contract_id: "${contract_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_customer_version: "${cust_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id, prov_total: $.data.provisional_total_cents }
            - call: "POST /work-orders/${wo1_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo1_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo1_id}", disposal_facility_name: "Acme Disposal", disposal_facility_permit: "FAC-9", hazmat_certified: false, volume_gallons: 100, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo1_id}/complete"
              payload: { actual_hours: 2 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo2_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Dispatcher
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
              captures: { final_total: $.data.total_amount_cents }
          assert:
            - "Invoice.${inv_id}.provisional_total_cents == 25000"
            - "Invoice.${inv_id}.total_amount_cents == 12500"

      - name: site_compliance_as_of_vs_projected_diverges
        grounds:
          - calculations.site_compliance_grade
          - entities.Site.fields.compliance_status
          - entities.Site.fields.projected_compliance_status
        distinguishing_aspect: |
          On the Site domain, equipment due in 20 days makes compliance_status (7-day as-of horizon)
          COMPLIANT while projected_compliance_status (30-day forward horizon) is AT_RISK.
        test_recipe:
          setup:
            - "Clock at 2026-05-01"
            - "One grease-trap Equipment with nominal_frequency_days=20 that has just been serviced (completed WorkOrder), so next_service_due_at = 2026-05-21 (20 days out)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers"
              payload: { business_name: "Horizon Grill", billing_email: "h@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "2 Grill Rd", municipality_code: "MUNI-A", permit_number: "P-2" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 20 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-01T08:00:00Z", planned_end: "2026-05-01T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-1", hazmat_certified: false, volume_gallons: 50, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_hours: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { as_of: $.data.compliance_status, projected: $.data.projected_compliance_status }
          assert:
            - "Site.${site_id}.compliance_status == COMPLIANT"
            - "Site.${site_id}.projected_compliance_status == AT_RISK"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pump_out_disposal_fee_tiered_mode_a
        grounds:
          - calculations.pump_out_disposal_fee
          - entities.PumpOutManifest.fields.disposal_fee_cents
        distinguishing_aspect: |
          Mode (a): 3 interacting inputs (volume 2000 -> marginal tiers 500@40+1000@35+500@30=70000;
          fog 25.0 -> +20% surcharge 14000; hazmat true -> +5000) combine to disposal_fee_cents=89000.
        test_recipe:
          setup:
            - "One grease-trap Equipment with an IN_PROGRESS grease WorkOrder owned by a technician"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Fee Cafe", billing_email: "f@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "3 Fee Ln", municipality_code: "MUNI-A", permit_number: "P-3" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 3000, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-2", hazmat_certified: true, volume_gallons: 2000, fog_percentage: 25.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { fee: $.data.disposal_fee_cents, flag: $.data.compliance_flag }
          assert:
            - "PumpOutManifest.disposal_fee_cents == 89000"
            - "PumpOutManifest.compliance_flag == NON_COMPLIANT"

      - name: invoice_tax_round_per_line_mode_b
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (b): pinned round-per-line-then-sum. Two lines of 12500 at 8.25% give per-line tax
          round(1031.25)=1031 x2 = 2062 (not sum-then-round round(2062.5)=2063); total 27062.
        test_recipe:
          setup:
            - "ACTIVE contract base_rate_cents=12500, tax_rate_bps=825"
            - "One COMPLETED grease-trap WorkOrder (service_fee 12500) in the May period"
            - "A DRAFT invoice bound to that contract and period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers"
              payload: { business_name: "Round Bistro", billing_email: "r@x.com", credit_limit_cents: 1000000 }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "4 Round Ct", municipality_code: "MUNI-A", permit_number: "P-4" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_id: "${cust_id}", billing_cycle: "MONTHLY", base_rate_cents: 12500, tax_rate_bps: 825 }
              as: Admin
              captures: { contract_id: $.data.id }
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z", contract_id: "${contract_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-3", hazmat_certified: false, volume_gallons: 50, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_hours: 2 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { cust_v: $.data.version }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", contract_id: "${contract_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_customer_version: "${cust_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
              captures: { subtotal: $.data.subtotal_cents, tax: $.data.tax_cents, total: $.data.total_amount_cents }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 25000"
            - "Invoice.${inv_id}.tax_cents == 2062"
            - "Invoice.${inv_id}.total_amount_cents == 27062"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_dispatch_recall_cycle
        grounds:
          - state_machines.WorkOrder.DISPATCHED_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          WorkOrder has a cycle DISPATCHED->SCHEDULED->DISPATCHED (recall then re-dispatch), with
          technician_id cleared on recall; a genuinely non-linear machine on the WorkOrder entity.
        test_recipe:
          setup:
            - "One grease-trap WorkOrder dispatched to a technician"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Cycle Kitchen", billing_email: "c@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "5 Cyc Ave", municipality_code: "MUNI-A", permit_number: "P-5" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T08:00:00Z", planned_end: "2026-05-10T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "SCHEDULED" }
              as: Dispatcher
              captures: { st_after_recall: $.data.status, tech_after_recall: $.data.technician_id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { st_after_redispatch: $.data.status }
          assert:
            - "after recall WorkOrder.${wo_id}.status == SCHEDULED"
            - "after recall WorkOrder.${wo_id}.technician_id == null"
            - "after re-dispatch WorkOrder.${wo_id}.status == DISPATCHED"

      - name: compliance_report_reject_revise_cycle
        grounds:
          - state_machines.ComplianceReport.REJECTED_to_DRAFT
          - state_machines.ComplianceReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          ComplianceReport has a cycle SUBMITTED->REJECTED->DRAFT->SUBMITTED (revision loop) on a
          different entity than WorkOrder; the machine is non-linear.
        test_recipe:
          setup:
            - "A Site with no equipment (compliance_status COMPLIANT so submit is allowed)"
            - "A ComplianceReport moved DRAFT->SUBMITTED->REJECTED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Revise Deli", billing_email: "v@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "6 Rev Blvd", municipality_code: "MUNI-B", permit_number: "P-6" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", municipality_code: "MUNI-B", period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /compliance-reports/${rep_id}/record-decision"
              payload: { decision: "REJECTED", decision_note: "insufficient" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /compliance-reports/${rep_id}/revise"
              payload: {}
              as: ComplianceOfficer
              captures: { st_after_revise: $.data.status }
            - call: "POST /compliance-reports/${rep_id}/submit"
              payload: {}
              as: ComplianceOfficer
              captures: { st_after_resubmit: $.data.status }
          assert:
            - "after revise ComplianceReport.${rep_id}.status == DRAFT"
            - "after resubmit ComplianceReport.${rep_id}.status == SUBMITTED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_grease_trap_cascade_depth3
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - calculations.equipment_service_schedule
          - calculations.site_compliance_grade
          - state_machines.Customer.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Completing the WorkOrder mutates Equipment (last/next service); the Equipment change itself
          recomputes Site.compliance_status; that Site change itself lifts the Customer suspension —
          a 3-hop chain WorkOrder->Equipment->Site->Customer, each hop caused by the prior.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Customer with a Site holding one never-serviced grease-trap Equipment (freq 30)"
            - "Equipment OVERDUE -> Site NON_COMPLIANT -> Customer auto-SUSPENDED by the create-time cascade"
            - "A grease WorkOrder dispatched, started, and with a RECORDED manifest, ready to complete"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers"
              payload: { business_name: "Cascade Cafe", billing_email: "k@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "7 Casc St", municipality_code: "MUNI-A", permit_number: "P-7" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-01T08:00:00Z", planned_end: "2026-05-01T10:00:00Z" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-4", hazmat_certified: false, volume_gallons: 60, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_hours: 2 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "Equipment.${eq_id}.next_service_due_at == 2026-05-31T00:00:00.000Z"
            - "Site.${site_id}.compliance_status == COMPLIANT"
            - "Customer.${cust_id}.account_status == ACTIVE"

      - name: decommission_equipment_cascade_depth2
        grounds:
          - state_machines.Equipment.ACTIVE_to_DECOMMISSIONED
          - calculations.site_compliance_grade
          - state_machines.Customer.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Decommissioning the sole overdue Equipment mutates Equipment.status; that change itself
          recomputes Site.compliance_status (now no ACTIVE overdue equipment) which itself lifts the
          Customer suspension — a 2-hop chain Equipment->Site->Customer from a different trigger than
          the completion cascade.
        test_recipe:
          setup:
            - "Customer with a Site holding exactly one never-serviced grease-trap Equipment"
            - "Equipment OVERDUE -> Site NON_COMPLIANT -> Customer auto-SUSPENDED; no WorkOrders exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers"
              payload: { business_name: "Decomm Diner", billing_email: "dc@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "8 Dec Rd", municipality_code: "MUNI-A", permit_number: "P-8" }
              as: Admin
              captures: { site_id: $.data.id }
            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq_id: $.data.id }
          trigger:
