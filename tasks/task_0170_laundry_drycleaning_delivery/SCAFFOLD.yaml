# =============================================================================
# PRD Benchmark Scaffold — Laundry & Dry-Cleaning Pickup/Delivery
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  170. Laundry & Dry-Cleaning Pickup/Delivery: order/garment intake, service type
  (wash-fold by weight, dry-clean by piece, alterations), pickup/delivery route
  window, stain/damage notation, ready-by SLA/rush, locker/doorstep handoff,
  subscription plan, lost-item claim

domain_name: laundry-drycleaning-delivery
api_prefix: ""
# Flat / hybrid multi-root topology: Customer, Subscription, RouteWindow, Locker,
# Order, LockerAssignment, Claim, Invoice, SubscriptionPlan are all top-level
# collections (Garment and GarmentNote are nested under Order). There is no single
# resource root, so api_prefix is the empty string (collections live at /<name>).

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # Order is a parent of Garment (hierarchical); Garment parents GarmentNote
  # (event log). Customer, Subscription, RouteWindow, Locker, LockerAssignment,
  # Claim, Invoice, SubscriptionPlan are peer entities joined by foreign keys
  # (flat). Mixed = hybrid.

  state_machine_shape: cyclic
  # Order has an IN_PROCESSING <-> QC_HOLD rework loop; Garment has a
  # CLEANED -> CLEANING rewash loop; Claim has a REJECTED -> INVESTIGATING
  # appeal loop. Three independent cyclic machines on three different entities.

  relationship_patterns:
    - one_to_many       # Order -> Garment, Garment -> GarmentNote
    - cross_aggregate   # Order references RouteWindow, Locker, Customer
    - polymorphic       # Claim.subject_kind references either an Order or a Garment

  role_model: peer_roles
  # Customer owns their own orders/claims; DispatchAgent owns route/locker ops;
  # PlantOperator owns garment processing; ClaimsAdjuster owns claim settlement;
  # PlatformAdmin is the operational superuser for config + clock/seed.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "Plan tier label", constraints: "one of {LITE, PLUS, PREMIUM}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee in cents", constraints: ">= 0" }
      - { name: included_wash_fold_grams, type: integer, source: input, description: "Wash-fold weight included per billing cycle, in grams", constraints: ">= 0" }
      - { name: overage_rate_cents_per_kg, type: integer, source: input, description: "Charge per kg of wash-fold weight above the included grams, in cents", constraints: ">= 0" }
      - { name: dryclean_discount_pct, type: number, source: input, description: "Fractional discount applied to dry-clean and alteration line prices for subscribers", constraints: "0.0 <= x <= 0.5" }
      - { name: rush_waived, type: boolean, source: input, default: false, description: "When true, the rush surcharge is not applied to this plan's subscribers' orders" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether new subscriptions may select this plan" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Customer" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: default_address, type: string, source: input, description: "Default doorstep handoff address" }
      - { name: zone_code, type: string, source: input, description: "Delivery zone the customer belongs to; must match a RouteWindow.zone_code to schedule" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Store credit balance in cents; credited by claim settlements and subscription overpayments, debited when applied to an Invoice", constraints: ">= 0" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Garment-handling risk index for this customer; accumulates from logged damage/stain notes and settled lost-item claims; floored at 0", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | BLOCKED; BLOCKED customers cannot create orders", constraints: "one of {ACTIVE, BLOCKED}" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; the selected plan" }
      - { name: cycle_start_utc, type: datetime, source: system, description: "ISO 8601 UTC start of the current billing cycle" }
      - { name: cycle_wash_fold_grams_used, type: integer, source: computed, default: 0, description: "Sum of wash-fold grams across the subscriber's orders billed in the current cycle; resets to 0 on cycle roll", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Unpaid amount billed to this subscription in the current cycle, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED", constraints: "one of {ACTIVE, CANCELLED}" }

  - name: RouteWindow
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Service zone this window covers" }
      - { name: window_kind, type: enum, source: input, description: "PICKUP | DELIVERY", constraints: "one of {PICKUP, DELIVERY}" }
      - { name: start_utc, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the window" }
      - { name: end_utc, type: datetime, source: input, description: "ISO 8601 UTC exclusive end of the window; must be > start_utc" }
      - { name: stop_capacity, type: integer, source: input, description: "Maximum number of distinct orders that may be booked into this window", constraints: ">= 1" }
      - { name: booked_stops, type: integer, source: computed, default: 0, description: "Count of orders currently booked into this window (status not CANCELLED) for the relevant leg", constraints: "0 <= x <= stop_capacity" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FULL; FULL is derived when booked_stops == stop_capacity, and reverts to OPEN when a booked stop is released by an order cancel", constraints: "one of {OPEN, FULL}" }

  - name: Locker
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Zone the locker bank serves" }
      - { name: location_label, type: string, source: input, description: "Human-readable bank location" }
      - { name: compartment_count, type: integer, source: input, description: "Number of physically distinct compartments in the bank", constraints: ">= 1" }
      - { name: hold_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum cleaning/turnaround buffer enforced between two assignments in the SAME compartment of this locker", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN; a locker bank is always available once created (single-state lifecycle)", constraints: "one of {OPEN}" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the ordering customer" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; null for pay-as-you-go orders (allows wash-fold inclusion benefits when present)" }
      - { name: pickup_window_id, type: string, source: input, description: "FK -> RouteWindow.id; must have window_kind PICKUP and zone_code == customer.zone_code" }
      - { name: delivery_window_id, type: string, source: input, description: "FK -> RouteWindow.id; must have window_kind DELIVERY and zone_code == customer.zone_code; its start_utc must be >= ready_by_utc" }
      - { name: handoff_method, type: enum, source: input, description: "DOORSTEP | LOCKER", constraints: "one of {DOORSTEP, LOCKER}" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush order; shortens SLA and adds rush surcharge unless plan rush_waived" }
      - { name: ready_by_utc, type: datetime, source: computed, description: "SLA target completion time = picked_up_at + (RUSH_SLA_HOURS if rush else STANDARD_SLA_HOURS); set when the order is picked up", constraints: "ISO 8601 UTC" }
      - { name: estimate_total_cents, type: integer, source: computed, default: 0, description: "Provisional order total computed at intake from declared garment weights/pieces", constraints: ">= 0" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "Finalized order total computed at QC pass from re-weighed/re-counted garments", constraints: ">= 0" }
      - { name: risk_flag, type: boolean, source: computed, default: false, description: "True when the order accumulates damage/stain notes whose total severity >= ORDER_RISK_THRESHOLD" }
      - { name: status, type: enum, source: system, default: CREATED, description: "Lifecycle status", constraints: "one of {CREATED, SCHEDULED, PICKED_UP, IN_PROCESSING, QC_HOLD, READY, OUT_FOR_DELIVERY, DELIVERED, CANCELLED}" }

  - name: Garment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: service_type, type: enum, source: input, description: "WASH_FOLD | DRY_CLEAN | ALTERATION", constraints: "one of {WASH_FOLD, DRY_CLEAN, ALTERATION}" }
      - { name: declared_weight_grams, type: integer, source: input, default: 0, description: "Customer-declared weight for WASH_FOLD garments, in grams; 0 for DRY_CLEAN/ALTERATION", constraints: ">= 0" }
      - { name: declared_piece_count, type: integer, source: input, default: 0, description: "Declared piece count for DRY_CLEAN/ALTERATION garments; 0 for WASH_FOLD", constraints: ">= 0" }
      - { name: actual_weight_grams, type: integer, source: computed, default: 0, description: "Plant-weighed weight recorded at intake-log; used by the final calculation", constraints: ">= 0" }
      - { name: actual_piece_count, type: integer, source: computed, default: 0, description: "Plant-counted piece count recorded at intake-log", constraints: ">= 0" }
      - { name: alteration_fee_cents, type: integer, source: input, default: 0, description: "Flat per-garment alteration fee in cents; required (> 0) when service_type == ALTERATION, must be 0 otherwise", constraints: ">= 0" }
      - { name: estimate_line_cents, type: integer, source: computed, default: 0, description: "Provisional line price from declared values", constraints: ">= 0" }
      - { name: final_line_cents, type: integer, source: computed, default: 0, description: "Final line price from actual values", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: INTAKE_PENDING, description: "INTAKE_PENDING | INTAKE_LOGGED | CLEANING | CLEANED | PACKED | LOST", constraints: "one of {INTAKE_PENDING, INTAKE_LOGGED, CLEANING, CLEANED, PACKED, LOST}" }

  - name: GarmentNote
    parent: Garment
    common_fields: false
    fields:
      - { name: garment_id, type: string, source: input, description: "FK -> Garment.id; the garment this note annotates" }
      - { name: note_kind, type: enum, source: input, description: "STAIN | DAMAGE", constraints: "one of {STAIN, DAMAGE}" }
      - { name: severity, type: integer, source: input, description: "Severity weight contributed to order/customer risk", constraints: "1 <= x <= 10" }
      - { name: description, type: string, source: input, description: "Free-text note detail" }
      - { name: logged_by_role, type: string, source: system, description: "Role that recorded the note (PlantOperator)" }

  - name: LockerAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order whose finished bag occupies the compartment" }
      - { name: locker_id, type: string, source: input, description: "FK -> Locker.id; the locker bank" }
      - { name: compartment_index, type: integer, source: input, description: "Which compartment (1..compartment_count) is occupied", constraints: "1 <= x <= locker.compartment_count" }
      - { name: hold_start_utc, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of compartment occupation" }
      - { name: hold_end_utc, type: datetime, source: input, description: "ISO 8601 UTC exclusive end of compartment occupation; must be > hold_start_utc" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | OCCUPIED | RELEASED | EXPIRED", constraints: "one of {RESERVED, OCCUPIED, RELEASED, EXPIRED}" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order the claim is filed against" }
      - { name: subject_kind, type: enum, source: input, description: "ORDER | GARMENT; whether the claim concerns the whole order or one garment", constraints: "one of {ORDER, GARMENT}" }
      - { name: garment_id, type: string, source: input, description: "FK -> Garment.id; required when subject_kind == GARMENT, must be omitted when subject_kind == ORDER" }
      - { name: declared_value_cents, type: integer, source: input, description: "Customer-declared replacement value of the lost item(s), in cents", constraints: ">= 1" }
      - { name: settlement_cents, type: integer, source: computed, default: 0, description: "Approved payout in cents; computed at approval per the settlement waterfall", constraints: ">= 0" }
      - { name: appeal_count, type: integer, source: computed, default: 0, description: "Number of times this claim has been re-opened from REJECTED", constraints: "0 <= x <= MAX_APPEALS" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | INVESTIGATING | APPROVED | REJECTED | SETTLED | DENIED_FINAL", constraints: "one of {SUBMITTED, INVESTIGATING, APPROVED, REJECTED, SETTLED, DENIED_FINAL}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being billed" }
      - { name: gross_cents, type: integer, source: computed, description: "Order.final_total_cents at issuance", constraints: ">= 0" }
      - { name: subscription_credit_cents, type: integer, source: computed, default: 0, description: "Portion covered by subscription wash-fold inclusion", constraints: ">= 0" }
      - { name: wallet_applied_cents, type: integer, source: computed, default: 0, description: "Store credit reserved (debited) from Customer.wallet_credit_cents when the Invoice is created at DRAFT; restored on VOID; retained on ISSUED/PAID", constraints: ">= 0" }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_cents - subscription_credit_cents - wallet_applied_cents, floored at 0", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PAID | VOID", constraints: "one of {DRAFT, ISSUED, PAID, VOID}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    field: status
    initial_state: CREATED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: CREATED
        to: SCHEDULED
        trigger: "POST /orders/{orderId}/schedule"
        actor: Customer
        preconditions:
          - "Order has >= 1 Garment (ERR_NO_GARMENTS)"
          - "customer.status == ACTIVE (ERR_CUSTOMER_BLOCKED)"
          - "pickup_window.window_kind == PICKUP and pickup_window.zone_code == customer.zone_code (ERR_WINDOW_ZONE_MISMATCH)"
          - "pickup_window.booked_stops < pickup_window.stop_capacity (ERR_WINDOW_FULL)"
        side_effects:
          - "pickup_window.booked_stops += 1; if booked_stops == stop_capacity then pickup_window.status = FULL"
          - "estimate_total_cents recomputed via order_estimate_total over all Garments (order_estimate_total)"
        note: "Booking the pickup leg reserves a stop in the pickup window."

      - from: SCHEDULED
        to: PICKED_UP
        trigger: "POST /orders/{orderId}/pickup"
        actor: DispatchAgent
        preconditions:
          - "Order.status == SCHEDULED (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "ready_by_utc = current_utc + (RUSH_SLA_HOURS if rush else STANDARD_SLA_HOURS)"
          - "all Garments INTAKE_PENDING -> remain INTAKE_PENDING (await plant logging)"

      - from: PICKED_UP
        to: IN_PROCESSING
        trigger: "POST /orders/{orderId}/start-processing"
        actor: PlantOperator
        preconditions:
          - "Order.status == PICKED_UP (ERR_INVALID_ORDER_STATE)"
          - "every Garment.status == INTAKE_LOGGED (ERR_GARMENTS_NOT_LOGGED)"
        side_effects:
          - "every Garment INTAKE_LOGGED -> CLEANING"

      - from: IN_PROCESSING
        to: QC_HOLD
        trigger: "POST /orders/{orderId}/qc-hold"
        actor: PlantOperator
        preconditions:
          - "Order.status == IN_PROCESSING (ERR_INVALID_ORDER_STATE)"
          - "every Garment.status in {CLEANED, LOST} (ERR_GARMENTS_NOT_CLEANED)"
        side_effects:
          - "final_total_cents recomputed via order_final_total over non-LOST Garments (order_final_total)"
          - "risk_flag recomputed from accumulated GarmentNote severity (order_risk_flag)"

      - from: QC_HOLD
        to: IN_PROCESSING
        trigger: "POST /orders/{orderId}/reopen-processing"
        actor: PlantOperator
        preconditions:
          - "Order.status == QC_HOLD (ERR_INVALID_ORDER_STATE)"
          - "at least one Garment moved CLEANED -> CLEANING (rewash) since entering QC_HOLD, OR caller requests rework (ERR_NO_REWORK_REQUESTED)"
        side_effects:
          - "Order returns to processing; final_total_cents is cleared to 0 and will be recomputed on next QC_HOLD"
        note: "Cyclic rework loop IN_PROCESSING <-> QC_HOLD."

      - from: QC_HOLD
        to: READY
        trigger: "POST /orders/{orderId}/qc-pass"
        actor: PlantOperator
        preconditions:
          - "Order.status == QC_HOLD (ERR_INVALID_ORDER_STATE)"
          - "every non-LOST Garment.status == CLEANED (ERR_GARMENTS_NOT_CLEANED)"
        side_effects:
          - "every non-LOST Garment CLEANED -> PACKED"
          - "Invoice created in DRAFT for this order with gross_cents = final_total_cents"
          - "for a subscriber order, subscription_credit_cents computed and subscription.cycle_wash_fold_grams_used advanced (subscription_billing)"
          - "wallet_applied_cents and amount_due_cents computed (invoice_amounts); wallet_applied_cents reserved (debited) from customer.wallet_credit_cents at DRAFT creation"

      - from: READY
        to: OUT_FOR_DELIVERY
        trigger: "POST /orders/{orderId}/dispatch-delivery"
        actor: DispatchAgent
        preconditions:
          - "Order.status == READY (ERR_INVALID_ORDER_STATE)"
          - "delivery_window.window_kind == DELIVERY and delivery_window.zone_code == customer.zone_code (ERR_WINDOW_ZONE_MISMATCH)"
          - "delivery_window.booked_stops < delivery_window.stop_capacity (ERR_WINDOW_FULL)"
          - "delivery_window.start_utc >= ready_by_utc (ERR_DELIVERY_BEFORE_READY)"
          - "if handoff_method == LOCKER then an OCCUPIED or RESERVED LockerAssignment exists for this order (ERR_NO_LOCKER_ASSIGNED)"
        side_effects:
          - "delivery_window.booked_stops += 1; if booked_stops == stop_capacity then delivery_window.status = FULL"
          - "Invoice DRAFT -> ISSUED; amounts already finalized at DRAFT (no recompute, no further wallet debit)"

      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /orders/{orderId}/confirm-delivery"
        actor: DispatchAgent
        preconditions:
          - "Order.status == OUT_FOR_DELIVERY (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "if handoff_method == LOCKER then its LockerAssignment OCCUPIED -> RELEASED"
          - "Invoice ISSUED -> PAID (amount_due settled from wallet credit + plan inclusion + remainder marked paid)"

      - from: [CREATED, SCHEDULED, PICKED_UP, IN_PROCESSING, QC_HOLD, READY]
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "Order.status not in {OUT_FOR_DELIVERY, DELIVERED, CANCELLED} (ERR_INVALID_ORDER_STATE)"
          - "expected_order_version matches Order.version (ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "if a pickup stop was booked then pickup_window.booked_stops -= 1; if it was FULL it returns to OPEN"
          - "if a delivery stop was booked then delivery_window.booked_stops -= 1; if it was FULL it returns to OPEN"
          - "all Garments remain in place but the order is closed (no PACKED transition is applied on cancel)"
          - "any RESERVED/OCCUPIED LockerAssignment for this order -> RELEASED"
          - "any DRAFT Invoice for this order -> VOID (which restores wallet_applied_cents to customer.wallet_credit_cents and, for subscriber orders, reverses the subscription.cycle_wash_fold_grams_used increment made at qc-pass)"
        note: "Cancellation reverses leg bookings, frees the locker compartment, and unwinds the DRAFT invoice's wallet/subscription effects."

  - entity: Garment
    field: status
    initial_state: INTAKE_PENDING
    terminal_states: [PACKED, LOST]
    transitions:
      - from: INTAKE_PENDING
        to: INTAKE_LOGGED
        trigger: "POST /orders/{orderId}/garments/{garmentId}/log-intake"
        actor: PlantOperator
        preconditions:
          - "parent Order.status == PICKED_UP (ERR_ORDER_NOT_PICKED_UP)"
          - "for WASH_FOLD actual_weight_grams > 0; for DRY_CLEAN/ALTERATION actual_piece_count > 0 (ERR_INVALID_INTAKE_MEASUREMENT)"
        side_effects:
          - "actual_weight_grams / actual_piece_count recorded from request"

      - from: INTAKE_LOGGED
        to: CLEANING
        trigger: "system (parent Order start-processing)"
        actor: system
        preconditions:
          - "parent Order transitioned PICKED_UP -> IN_PROCESSING"
        side_effects: []

      - from: CLEANING
        to: CLEANED
        trigger: "POST /orders/{orderId}/garments/{garmentId}/finish-clean"
        actor: PlantOperator
        preconditions:
          - "Garment.status == CLEANING (ERR_GARMENT_NOT_CLEANING)"
        side_effects:
          - "final_line_cents recomputed via garment_line_price(final variant) (garment_line_price)"

      - from: CLEANED
        to: CLEANING
        trigger: "POST /orders/{orderId}/garments/{garmentId}/rewash"
        actor: PlantOperator
        preconditions:
          - "Garment.status == CLEANED (ERR_GARMENT_NOT_CLEANED)"
          - "parent Order.status in {IN_PROCESSING, QC_HOLD} (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "if parent Order.status == QC_HOLD it must be reopened via reopen-processing before re-finishing"
        note: "Cyclic rewash loop CLEANED <-> CLEANING."

      - from: CLEANED
        to: PACKED
        trigger: "system (parent Order qc-pass)"
        actor: system
        preconditions:
          - "parent Order transitioned QC_HOLD -> READY"
        side_effects: []

      - from: [INTAKE_LOGGED, CLEANING, CLEANED]
        to: LOST
        trigger: "POST /orders/{orderId}/garments/{garmentId}/mark-lost"
        actor: PlantOperator
        preconditions:
          - "Garment.status in {INTAKE_LOGGED, CLEANING, CLEANED} (ERR_GARMENT_NOT_LOSABLE)"
          - "parent Order.status in {IN_PROCESSING, QC_HOLD} (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "Garment marked LOST; excluded from order_final_total; eligible as a GARMENT-subject Claim"
          - "customer.risk_score += LOST_GARMENT_RISK_POINTS (customer_risk_score)"

  - entity: Claim
    field: status
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED_FINAL]
    transitions:
      - from: SUBMITTED
        to: INVESTIGATING
        trigger: "POST /claims/{claimId}/investigate"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_INVALID_CLAIM_STATE)"
        side_effects: []

      - from: INVESTIGATING
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == INVESTIGATING (ERR_INVALID_CLAIM_STATE)"
          - "if subject_kind == GARMENT then that Garment.status == LOST (ERR_CLAIM_GARMENT_NOT_LOST)"
        side_effects:
          - "settlement_cents computed via claim_settlement (claim_settlement)"

      - from: INVESTIGATING
        to: REJECTED
        trigger: "POST /claims/{claimId}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == INVESTIGATING (ERR_INVALID_CLAIM_STATE)"
        side_effects:
          - "settlement_cents set to 0"

      - from: REJECTED
        to: INVESTIGATING
        trigger: "POST /claims/{claimId}/appeal"
        actor: Customer
        preconditions:
          - "Claim.status == REJECTED (ERR_INVALID_CLAIM_STATE)"
          - "appeal_count < MAX_APPEALS (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1"
        note: "Cyclic appeal loop REJECTED -> INVESTIGATING."

      - from: REJECTED
        to: DENIED_FINAL
        trigger: "POST /claims/{claimId}/finalize-denial"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == REJECTED (ERR_INVALID_CLAIM_STATE)"
          - "appeal_count >= MAX_APPEALS (ERR_APPEAL_LIMIT_NOT_REACHED)"
        side_effects: []

      - from: APPROVED
        to: SETTLED
        trigger: "POST /claims/{claimId}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == APPROVED (ERR_INVALID_CLAIM_STATE)"
        side_effects:
          - "customer.wallet_credit_cents += settlement_cents (claim_settlement)"
          - "customer.risk_score += SETTLED_CLAIM_RISK_POINTS (customer_risk_score)"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscriptionId}/cancel"
        actor: Customer
        preconditions:
          - "Subscription.status == ACTIVE (ERR_INVALID_SUBSCRIPTION_STATE)"
          - "expected_subscription_version matches Subscription.version (ERR_STALE_SUBSCRIPTION_VERSION)"
        side_effects: []
        note: "Subscription is a lightweight resource; change-plan (OCC, no state change) and cancel are its only mutating operations."

  - entity: LockerAssignment
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /locker-assignments/{assignmentId}/occupy"
        actor: DispatchAgent
        preconditions:
          - "LockerAssignment.status == RESERVED (ERR_INVALID_ASSIGNMENT_STATE)"
          - "parent Order.status == READY (ERR_INVALID_ORDER_STATE)"
        side_effects: []

      - from: OCCUPIED
        to: RELEASED
        trigger: "system (parent Order confirm-delivery) or POST /locker-assignments/{assignmentId}/release"
        actor: DispatchAgent
        preconditions:
          - "LockerAssignment.status == OCCUPIED (ERR_INVALID_ASSIGNMENT_STATE)"
        side_effects: []

      - from: [RESERVED, OCCUPIED]
        to: EXPIRED
        trigger: "POST /locker-assignments/{assignmentId}/expire"
        actor: DispatchAgent
        preconditions:
          - "LockerAssignment.status in {RESERVED, OCCUPIED} (ERR_INVALID_ASSIGNMENT_STATE)"
          - "current_utc >= hold_end_utc (ERR_HOLD_NOT_EXPIRED)"
        side_effects: []

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (parent Order dispatch-delivery)"
        actor: system
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "subscription_credit_cents computed and amount_due_cents finalized (invoice_amounts); the wallet_applied_cents reserved at DRAFT is retained (no further wallet debit)"

      - from: ISSUED
        to: PAID
        trigger: "system (parent Order confirm-delivery)"
        actor: system
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects: []

      - from: DRAFT
        to: VOID
        trigger: "system (parent Order cancel)"
        actor: system
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "the wallet_applied_cents reserved at DRAFT creation is credited back to customer.wallet_credit_cents (compensating restore)"
          - "for a subscriber order, the subscription.cycle_wash_fold_grams_used increment made at qc-pass is reversed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /claims"
    occ_field: "expected_order_version"
    description: |
      Filing a Claim against an Order whose version has advanced since the
      client last observed it is rejected. A claim is only meaningful against
      a settled view of the order's garments; if a garment was marked LOST or
      the order was re-totaled after the client read the order, the client's
      view is stale and the claim it would have filed no longer matches the
      order's true state, so the create is rejected on the stale version.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: subscription-plan-change-stale
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{subscriptionId}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing the plan on a Subscription whose version has advanced since the
      client last observed it is rejected. A later plan change legitimately
      supersedes the earlier one (recomputing inclusion and overage on the new
      plan); a client carrying a stale subscription version would overwrite a
      change it never saw, so it is rejected on the stale version.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: garment_line_price
    trigger: "order schedule (estimate variant), garment finish-clean (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Per-garment line price. Operates on one Garment.
      # Inputs: service_type, weight (declared or actual grams), piece (declared
      # or actual count), alteration_fee_cents, plan.dryclean_discount_pct (0 if
      # no active subscription), order.rush, plan.rush_waived.
      #
      # 1) base by service_type:
      if service_type == WASH_FOLD:
        kg = weight_grams / 1000.0
        # tiered: first WF_TIER1_KG kg at WF_RATE1, remainder at WF_RATE2
        if kg <= WF_TIER1_KG:
          base = kg * WF_RATE1_CENTS_PER_KG
        else:
          base = (WF_TIER1_KG * WF_RATE1_CENTS_PER_KG)
               + ((kg - WF_TIER1_KG) * WF_RATE2_CENTS_PER_KG)
      elif service_type == DRY_CLEAN:
        base = piece_count * DRYCLEAN_RATE_CENTS_PER_PIECE
      elif service_type == ALTERATION:
        base = piece_count * alteration_fee_cents
      #
      # 2) subscriber discount applies ONLY to DRY_CLEAN and ALTERATION (never WASH_FOLD):
      if service_type in {DRY_CLEAN, ALTERATION} and has_active_subscription:
        base = base * (1 - plan.dryclean_discount_pct)
      #
      # 3) rush surcharge applies to every line unless plan.rush_waived:
      if order.rush and not plan_rush_waived:
        base = base * RUSH_MULTIPLIER
      #
      # 4) round THIS line to whole cents, round_half_up:
      line_cents = round_half_up(base)   # to integer cents
    input_set: "A single Garment; weight/piece come from declared_* (estimate) or actual_* (final)."
    constants:
      WF_TIER1_KG: 5.0
      WF_RATE1_CENTS_PER_KG: 400
      WF_RATE2_CENTS_PER_KG: 300
      DRYCLEAN_RATE_CENTS_PER_PIECE: 900
      RUSH_MULTIPLIER: 1.25
    precision: "Each line rounded to whole cents, round_half_up, BEFORE summing into the order total."
    variants:
      - name: estimate
        when: "Computed at order schedule from declared_weight_grams / declared_piece_count."
        difference: "Uses declared (customer-stated) measurements; writes Garment.estimate_line_cents."
      - name: final
        when: "Computed at garment finish-clean from actual_weight_grams / actual_piece_count."
        difference: "Uses plant-measured actuals; writes Garment.final_line_cents; LOST garments contribute 0."

  - name: order_estimate_total
    trigger: "order schedule transition CREATED -> SCHEDULED"
    algorithm: aggregation
    formula: |
      # Round-per-line-THEN-sum is mandatory (the per-line round happens inside
      # garment_line_price step 4; the order total is a plain sum of integers).
      estimate_total_cents = sum(g.estimate_line_cents
                                 for g in order.Garments
                                 if g.status != LOST)
    input_set: "All Garments on the order at schedule time (none are LOST yet)."
    constants: {}
    precision: "Sum of already-rounded integer line cents; no further rounding."

  - name: order_final_total
    trigger: "order qc-hold transition IN_PROCESSING -> QC_HOLD"
    algorithm: aggregation
    formula: |
      final_total_cents = sum(g.final_line_cents
                              for g in order.Garments
                              if g.status != LOST)
    input_set: "All non-LOST Garments; LOST garments are excluded entirely."
    constants: {}
    precision: "Sum of already-rounded integer line cents; no further rounding."

  - name: customer_risk_score
    trigger: "garment mark-lost, garment note logged, claim settle"
    algorithm: weighted_scoring
    formula: |
      # Provisional variant (on note logged): note severity feeds order_risk_flag
      # AND adds a provisional contribution to the customer's running score.
      #   on STAIN/DAMAGE note logged: customer.risk_score += note.severity
      # Settled / escalated contributions:
      #   on garment mark-lost:  customer.risk_score += LOST_GARMENT_RISK_POINTS
      #   on claim settle:       customer.risk_score += SETTLED_CLAIM_RISK_POINTS
      # Score is floored at 0 and never decreases on these forward actions.
      # When customer.risk_score >= CUSTOMER_BLOCK_THRESHOLD the next create-order
      # attempt is gated (see validations) but the score itself is not reset.
    input_set: "GarmentNotes on the customer's garments + LOST events + settled claims."
    constants:
      LOST_GARMENT_RISK_POINTS: 15
      SETTLED_CLAIM_RISK_POINTS: 25
      CUSTOMER_BLOCK_THRESHOLD: 100
    precision: "Integer points; floor 0."
    variants:
      - name: provisional
        when: "On a GarmentNote being logged during processing."
        difference: "Adds note.severity immediately; reversible only by an explicit admin correction (not modeled)."
      - name: settled
        when: "On a Claim reaching SETTLED."
        difference: "Adds a fixed SETTLED_CLAIM_RISK_POINTS on top of any earlier provisional note points."

  - name: order_risk_flag
    trigger: "order qc-hold; garment note logged"
    algorithm: threshold
    formula: |
      severity_sum = sum(n.severity for n in GarmentNotes
                         where n.garment_id in order's garment ids)
      risk_flag = (severity_sum >= ORDER_RISK_THRESHOLD)
    input_set: "All GarmentNotes attached to garments of this order."
    constants:
      ORDER_RISK_THRESHOLD: 12
    precision: "Boundary: severity_sum == 12 sets the flag (>=, not >)."

  - name: subscription_billing
    trigger: "invoice creation at order qc-pass (QC_HOLD -> READY) for a subscriber order"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency pinned by evaluation order:
      #   amount_due depends on subscription_credit, which depends on the
      #   cycle weight tally, which is updated by THIS order's wash-fold grams.
      # Evaluation order is fixed:
      #   STEP 1: wf_grams_this_order = sum(g.actual_weight_grams
      #                                     for g in order.Garments
      #                                     if g.service_type == WASH_FOLD and g.status != LOST)
      #   STEP 2: prior_used = subscription.cycle_wash_fold_grams_used   # BEFORE adding this order
      #   STEP 3: included_remaining = max(0, plan.included_wash_fold_grams - prior_used)
      #   STEP 4: covered_grams = min(wf_grams_this_order, included_remaining)
      #   STEP 5: subscription_credit_cents = round_half_up(
      #               (covered_grams / 1000.0) * effective_wf_rate )
      #           where effective_wf_rate is WF_RATE1_CENTS_PER_KG (inclusion is
      #           always valued at the tier-1 rate, never tier-2)
      #   STEP 6: subscription.cycle_wash_fold_grams_used = prior_used + wf_grams_this_order
      # The order of STEP 2 (read before write) and STEP 6 (write after) is what
      # makes the value well-defined.
    input_set: "The subscriber's current-cycle wash-fold tally + this order's wash-fold garments."
    constants:
      WF_RATE1_CENTS_PER_KG: 400
    precision: "subscription_credit_cents rounded once, round_half_up."

  - name: claim_settlement
    trigger: "claim approve transition INVESTIGATING -> APPROVED"
    algorithm: waterfall_allocation
    formula: |
      # The payout is the declared value capped, then reduced by a per-claim
      # depreciation, then capped again by a per-order aggregate ceiling.
      #   STEP 1: capped = min(declared_value_cents, PER_ITEM_CAP_CENTS)
      #   STEP 2: depreciated = round_half_up(capped * (1 - DEPRECIATION_PCT))
      #   STEP 3: # aggregate ceiling across all SETTLED+APPROVED claims on the order
      #           already_paid = sum(c.settlement_cents for c in order's claims
      #                              if c.status in {APPROVED, SETTLED} and c.id != this.id)
      #           remaining_ceiling = max(0, ORDER_PAYOUT_CEILING_CENTS - already_paid)
      #   STEP 4: settlement_cents = min(depreciated, remaining_ceiling)
    input_set: "This claim's declared value + all other APPROVED/SETTLED claims on the same order."
    constants:
      PER_ITEM_CAP_CENTS: 20000
      DEPRECIATION_PCT: 0.20
      ORDER_PAYOUT_CEILING_CENTS: 30000
    precision: "Depreciation rounded once (round_half_up); ceiling applied to integer cents."

  - name: invoice_amounts
    trigger: "invoice creation at order qc-pass (QC_HOLD -> READY, DRAFT)"
    algorithm: waterfall_allocation
    formula: |
      gross_cents = order.final_total_cents
      # subscription_credit_cents from subscription_billing (0 if no active sub)
      after_sub = max(0, gross_cents - subscription_credit_cents)
      # wallet credit applied next, capped by available balance:
      wallet_applied_cents = min(after_sub, customer.wallet_credit_cents)
      amount_due_cents = max(0, after_sub - wallet_applied_cents)
      # At DRAFT creation: customer.wallet_credit_cents -= wallet_applied_cents
      # (reserved). On VOID this debit is restored; on ISSUED/PAID it is retained.
    input_set: "Order final total + subscription credit + customer wallet balance, all evaluated at qc-pass."
    constants: {}
    precision: "Integer cents; floors at 0; waterfall order is sub-credit, then wallet, then due."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources must exist, validated left-to-right (orderId, then garmentId; or claimId; or subscriptionId; or assignmentId)"
    error_id: "ERR_ORDER_NOT_FOUND / ERR_GARMENT_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_LOCKER_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body FK references"

  - priority: 4
    category: business_constraint
    check: "Request body schema valid: required fields present, types/enums correct, numeric ranges honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "RouteWindow.end_utc > start_utc; LockerAssignment.hold_end_utc > hold_start_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /route-windows, POST /locker-assignments"

  - priority: 6
    category: business_referential
    check: "Owner identity: a Customer acting on an Order/Subscription/Claim must own it (X-User-ID == resource.customer_id, directly or via the order's customer)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "customer-actor order/subscription/claim transitions"

  - priority: 7
    category: state
    check: "Target resource must be in the correct state for the requested transition"
    error_id: "ERR_INVALID_ORDER_STATE / ERR_INVALID_CLAIM_STATE / ERR_INVALID_SUBSCRIPTION_STATE / ERR_INVALID_ASSIGNMENT_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Cross-entity garment-state gates: start-processing requires every Garment INTAKE_LOGGED; qc-pass requires every non-LOST Garment CLEANED"
    error_id: "ERR_GARMENTS_NOT_LOGGED / ERR_GARMENTS_NOT_CLEANED"
    http_status: 409
    applies_to: "POST /orders/{id}/start-processing, POST /orders/{id}/qc-pass"

  - priority: 9
    category: business_safety
    check: "Customer must not be BLOCKED and risk_score must be < CUSTOMER_BLOCK_THRESHOLD when creating or scheduling an order"
    error_id: ERR_CUSTOMER_BLOCKED
    http_status: 403
    applies_to: "POST /orders, POST /orders/{id}/schedule"

  - priority: 10
    category: business_constraint
    check: "Garment service-type field consistency: WASH_FOLD requires declared_weight_grams>0 & piece/alteration 0; DRY_CLEAN requires declared_piece_count>0 & weight/alteration_fee 0; ALTERATION requires declared_piece_count>0 & alteration_fee_cents>0 & weight 0"
    error_id: ERR_SERVICE_TYPE_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/garments"

  - priority: 11
    category: business_referential
    check: "Window zone match: chosen pickup/delivery RouteWindow.zone_code must equal the customer's zone_code and window_kind must match the leg"
    error_id: ERR_WINDOW_ZONE_MISMATCH
    http_status: 409
    applies_to: "POST /orders/{id}/schedule, POST /orders/{id}/dispatch-delivery"

  - priority: 12
    category: business_temporal
    check: "Delivery window must not start before the order is ready: delivery_window.start_utc >= ready_by_utc"
    error_id: ERR_DELIVERY_BEFORE_READY
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch-delivery"

  - priority: 13
    category: business_temporal
    check: "Locker compartment temporal overlap: a new LockerAssignment must not overlap an existing non-terminal assignment in the same compartment, including the locker's hold_buffer_minutes turnaround buffer"
    error_id: ERR_LOCKER_COMPARTMENT_CONFLICT
    http_status: 409
    applies_to: "POST /locker-assignments"

  - priority: 14
    category: business_temporal
    check: "RouteWindow stop overlap is by capacity, not geometry: a leg booking is rejected when booked_stops would exceed stop_capacity"
    error_id: ERR_WINDOW_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/schedule, POST /orders/{id}/dispatch-delivery"

  - priority: 15
    category: business_referential
    check: "Claim subject integrity: subject_kind==GARMENT requires garment_id present and that Garment.order_id==Claim.order_id; subject_kind==ORDER requires garment_id absent"
    error_id: ERR_CLAIM_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /claims"

  - priority: 16
    category: business_fiscal
    check: "OCC stale-version guard on supersede-style writes (claim create vs order version; plan change vs subscription version)"
    error_id: "ERR_STALE_ORDER_VERSION / ERR_STALE_SUBSCRIPTION_VERSION"
    http_status: 412
    applies_to: "POST /claims, POST /subscriptions/{id}/change-plan"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- SubscriptionPlan (config) ----------
  - method: POST
    path: "/subscription-plans"
    description: "Create a subscription plan"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, included_wash_fold_grams, overage_rate_cents_per_kg, dryclean_discount_pct, "rush_waived?", "active?"]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/subscription-plans"
    description: "List subscription plans"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "SubscriptionPlan[]"
    side_effects: []

  - method: GET
    path: "/subscription-plans/{planId}"
    description: "Get a subscription plan"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  # ---------- Customer ----------
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, default_address, zone_code]
    output: Customer
    side_effects: ["status=ACTIVE, wallet_credit_cents=0, risk_score=0"]

  - method: GET
    path: "/customers"
    description: "List customers (filterable by zone)"
    roles: [PlatformAdmin, DispatchAgent, ClaimsAdjuster]
    code: 200
    input: ["zone_code?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [PlatformAdmin, Customer, DispatchAgent, ClaimsAdjuster]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/block"
    description: "Administratively block a customer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> BLOCKED"]

  # ---------- Subscription ----------
  - method: POST
    path: "/subscriptions"
    description: "Create a subscription for a customer on a plan"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, plan_id]
    output: Subscription
    side_effects: ["status=ACTIVE, cycle_start_utc=current_utc, cycle_wash_fold_grams_used=0, outstanding_balance_cents=0"]

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (filterable; reverse-reachability for Subscription.customer_id and Subscription.plan_id)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["customer_id?", "plan_id?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/subscriptions/{subscriptionId}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/subscriptions/{subscriptionId}/change-plan"
    description: "Change the plan of a subscription (supersede prior; OCC-guarded)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: [plan_id, expected_subscription_version]
    output: Subscription
    side_effects: ["plan_id updated; inclusion/overage recomputed on next billing; increments Subscription.version by 1"]

  - method: POST
    path: "/subscriptions/{subscriptionId}/cancel"
    description: "Cancel a subscription (OCC-guarded)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["status ACTIVE -> CANCELLED; increments Subscription.version by 1"]

  # ---------- RouteWindow ----------
  - method: POST
    path: "/route-windows"
    description: "Create a pickup or delivery route window"
    roles: [PlatformAdmin, DispatchAgent]
    code: 201
    input: [zone_code, window_kind, start_utc, end_utc, stop_capacity]
    output: RouteWindow
    side_effects: ["status=OPEN, booked_stops=0"]

  - method: GET
    path: "/route-windows"
    description: "List route windows (filterable by zone/kind)"
    roles: [PlatformAdmin, Customer, DispatchAgent]
    code: 200
    input: ["zone_code?", "window_kind?", "limit?", "offset?"]
    output: "RouteWindow[]"
    side_effects: []

  - method: GET
    path: "/route-windows/{windowId}"
    description: "Get a route window"
    roles: [PlatformAdmin, Customer, DispatchAgent]
    code: 200
    input: []
    output: RouteWindow
    side_effects: []

  # ---------- Locker ----------
  - method: POST
    path: "/lockers"
    description: "Create a locker bank"
    roles: [PlatformAdmin, DispatchAgent]
    code: 201
    input: [zone_code, location_label, compartment_count, "hold_buffer_minutes?"]
    output: Locker
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/lockers"
    description: "List lockers (filterable by zone)"
    roles: [PlatformAdmin, DispatchAgent]
    code: 200
    input: ["zone_code?", "limit?", "offset?"]
    output: "Locker[]"
    side_effects: []

  - method: GET
    path: "/lockers/{lockerId}"
    description: "Get a locker"
    roles: [PlatformAdmin, DispatchAgent]
    code: 200
    input: []
    output: Locker
    side_effects: []

  # ---------- Order ----------
  - method: POST
    path: "/orders"
    description: "Create an order in CREATED state"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, "subscription_id?", pickup_window_id, delivery_window_id, handoff_method, "rush?"]
    output: Order
    side_effects: ["status=CREATED, estimate_total_cents=0, final_total_cents=0, risk_flag=false"]

  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for Order.customer_id / subscription_id / pickup_window_id / delivery_window_id)"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator]
    code: 200
    input: ["customer_id?", "subscription_id?", "pickup_window_id?", "delivery_window_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{id}/garments"
    description: "Add a garment line to a CREATED order"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [service_type, "declared_weight_grams?", "declared_piece_count?", "alteration_fee_cents?"]
    output: Garment
    side_effects: ["status=INTAKE_PENDING; estimate_line_cents=0 until schedule"]

  - method: GET
    path: "/orders/{id}/garments"
    description: "List garments of an order (reverse-reachability for Garment.order_id)"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "Garment[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}/garments/{garmentId}"
    description: "Get a garment"
    roles: [PlatformAdmin, Customer, DispatchAgent, PlantOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: Garment
    side_effects: []

  - method: POST
    path: "/orders/{id}/schedule"
    description: "Schedule pickup; reserves pickup window stop; computes estimate"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["status CREATED -> SCHEDULED; pickup_window.booked_stops += 1; estimate_total_cents computed (order_estimate_total); each Garment.estimate_line_cents computed (garment_line_price estimate)"]

  - method: POST
    path: "/orders/{id}/pickup"
    description: "Mark order picked up; sets ready_by SLA"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: Order
    side_effects: ["status SCHEDULED -> PICKED_UP; ready_by_utc set from SLA constants"]

  - method: POST
    path: "/orders/{id}/garments/{garmentId}/log-intake"
    description: "Record plant-measured weight/pieces for a garment"
    roles: [PlantOperator]
    code: 200
    input: ["actual_weight_grams?", "actual_piece_count?"]
    output: Garment
    side_effects: ["status INTAKE_PENDING -> INTAKE_LOGGED; actual_* recorded"]

  - method: POST
    path: "/orders/{id}/start-processing"
    description: "Begin processing; moves all logged garments to CLEANING"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["status PICKED_UP -> IN_PROCESSING; every Garment INTAKE_LOGGED -> CLEANING"]

  - method: POST
    path: "/orders/{id}/garments/{garmentId}/finish-clean"
    description: "Finish cleaning a garment; computes final line price"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Garment
    side_effects: ["status CLEANING -> CLEANED; final_line_cents computed (garment_line_price final)"]

  - method: POST
    path: "/orders/{id}/garments/{garmentId}/rewash"
    description: "Send a cleaned garment back to cleaning (rework loop)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Garment
    side_effects: ["status CLEANED -> CLEANING"]

  - method: POST
    path: "/orders/{id}/garments/{garmentId}/mark-lost"
    description: "Mark a garment lost during processing"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Garment
    side_effects: ["status -> LOST; customer.risk_score += LOST_GARMENT_RISK_POINTS (customer_risk_score)"]

  - method: POST
    path: "/orders/{id}/garments/{garmentId}/notes"
    description: "Log a stain/damage note on a garment"
    roles: [PlantOperator]
    code: 201
    input: [note_kind, severity, description]
    output: GarmentNote
    side_effects: ["customer.risk_score += severity (customer_risk_score provisional); order.risk_flag recomputed (order_risk_flag)"]

  - method: GET
    path: "/garment-notes"
    description: "List garment notes (reverse-reachability for GarmentNote.garment_id)"
    roles: [PlatformAdmin, PlantOperator, ClaimsAdjuster]
    code: 200
    input: ["garment_id?", "limit?", "offset?"]
    output: "GarmentNote[]"
    side_effects: []

  - method: GET
    path: "/garment-notes/{noteId}"
    description: "Get a garment note (single-resource read so GarmentNote has a derivable collection segment)"
    roles: [PlatformAdmin, PlantOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: GarmentNote
    side_effects: []

  - method: POST
    path: "/orders/{id}/qc-hold"
    description: "Move order to QC hold; compute final total + risk flag"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["status IN_PROCESSING -> QC_HOLD; final_total_cents computed (order_final_total); risk_flag computed (order_risk_flag)"]

  - method: POST
    path: "/orders/{id}/reopen-processing"
    description: "Reopen processing from QC hold (rework loop)"
    roles: [PlantOperator]
    code: 200
    input: ["rework_requested?"]
    output: Order
    side_effects: ["status QC_HOLD -> IN_PROCESSING; final_total_cents reset to 0"]

  - method: POST
    path: "/orders/{id}/qc-pass"
    description: "Pass QC; pack garments; create DRAFT invoice (with subscription + wallet amounts)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["status QC_HOLD -> READY; each non-LOST Garment CLEANED -> PACKED; DRAFT Invoice created (invoice_amounts); subscription_billing applied; wallet reserved"]

  - method: POST
    path: "/orders/{id}/dispatch-delivery"
    description: "Dispatch delivery; reserve delivery stop; issue invoice"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: Order
    side_effects: ["status READY -> OUT_FOR_DELIVERY; delivery_window.booked_stops += 1; Invoice DRAFT -> ISSUED (amounts already final from qc-pass)"]

  - method: POST
    path: "/orders/{id}/confirm-delivery"
    description: "Confirm delivery; settle invoice; release locker"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: Order
    side_effects: ["status OUT_FOR_DELIVERY -> DELIVERED; Invoice ISSUED -> PAID; LockerAssignment OCCUPIED -> RELEASED"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-terminal order (OCC-guarded)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["status -> CANCELLED; pickup/delivery booked_stops reversed; LockerAssignment -> RELEASED; DRAFT Invoice -> VOID (restores wallet, reverses subscription tally); increments Order.version by 1"]

  - method: GET
    path: "/orders/{id}/invoice"
    description: "Get the order's invoice (reverse-reachability for Invoice.order_id)"
    roles: [PlatformAdmin, Customer, DispatchAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # ---------- LockerAssignment ----------
  - method: POST
    path: "/locker-assignments"
    description: "Reserve a locker compartment for a READY order's bag"
    roles: [PlatformAdmin, DispatchAgent]
    code: 201
    input: [order_id, locker_id, compartment_index, hold_start_utc, hold_end_utc]
    output: LockerAssignment
    side_effects: ["status=RESERVED; overlap/buffer check against same compartment (ERR_LOCKER_COMPARTMENT_CONFLICT)"]

  - method: GET
    path: "/locker-assignments"
    description: "List locker assignments (reverse-reachability for LockerAssignment.order_id and locker_id)"
    roles: [PlatformAdmin, DispatchAgent]
    code: 200
    input: ["order_id?", "locker_id?", "limit?", "offset?"]
    output: "LockerAssignment[]"
    side_effects: []

  - method: GET
    path: "/locker-assignments/{assignmentId}"
    description: "Get a locker assignment"
    roles: [PlatformAdmin, DispatchAgent]
    code: 200
    input: []
    output: LockerAssignment
    side_effects: []

  - method: POST
    path: "/locker-assignments/{assignmentId}/occupy"
    description: "Mark a reserved compartment occupied"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: LockerAssignment
    side_effects: ["status RESERVED -> OCCUPIED"]

  - method: POST
    path: "/locker-assignments/{assignmentId}/release"
    description: "Release an occupied compartment"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: LockerAssignment
    side_effects: ["status OCCUPIED -> RELEASED"]

  - method: POST
    path: "/locker-assignments/{assignmentId}/expire"
    description: "Expire an assignment past its hold_end_utc"
    roles: [DispatchAgent]
    code: 200
    input: []
    output: LockerAssignment
    side_effects: ["status -> EXPIRED"]

  # ---------- Claim ----------
  - method: POST
    path: "/claims"
    description: "File a lost-item claim against an order (OCC-guarded on order version)"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [order_id, subject_kind, "garment_id?", declared_value_cents, expected_order_version]
    output: Claim
    side_effects: ["status=SUBMITTED, settlement_cents=0, appeal_count=0"]

  - method: GET
    path: "/claims"
    description: "List claims (reverse-reachability for Claim.order_id and Claim.garment_id)"
    roles: [PlatformAdmin, ClaimsAdjuster, Customer]
    code: 200
    input: ["order_id?", "garment_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [PlatformAdmin, ClaimsAdjuster, Customer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/investigate"
    description: "Open investigation on a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED -> INVESTIGATING"]

  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Approve a claim; compute settlement"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status INVESTIGATING -> APPROVED; settlement_cents computed (claim_settlement)"]

  - method: POST
    path: "/claims/{claimId}/reject"
    description: "Reject a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status INVESTIGATING -> REJECTED; settlement_cents=0"]

  - method: POST
    path: "/claims/{claimId}/appeal"
    description: "Appeal a rejected claim (re-open investigation; loop)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status REJECTED -> INVESTIGATING; appeal_count += 1"]

  - method: POST
    path: "/claims/{claimId}/finalize-denial"
    description: "Finally deny a rejected claim that exhausted appeals"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status REJECTED -> DENIED_FINAL"]

  - method: POST
    path: "/claims/{claimId}/settle"
    description: "Settle an approved claim; credit wallet; bump risk"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status APPROVED -> SETTLED; customer.wallet_credit_cents += settlement_cents (claim_settlement); customer.risk_score += SETTLED_CLAIM_RISK_POINTS (customer_risk_score)"]

  # ---------- Test-driving (clock) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for deterministic SLA/locker-expiry tests"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set to to_iso8601"]

# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acts on an order/subscription/claim they do not own" }

  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, or out-of-range value" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "end_utc <= start_utc or hold_end_utc <= hold_start_utc" }
  - { id: ERR_SERVICE_TYPE_FIELD_MISMATCH, http: 422, condition: "Garment measurement fields inconsistent with service_type" }
  - { id: ERR_CLAIM_SUBJECT_MISMATCH, http: 422, condition: "Claim subject_kind inconsistent with garment_id presence/ownership" }

  # --- not found ---
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "SubscriptionPlan not found" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer not found" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription not found" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "RouteWindow not found" }
  - { id: ERR_LOCKER_NOT_FOUND, http: 404, condition: "Locker not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order not found" }
  - { id: ERR_GARMENT_NOT_FOUND, http: 404, condition: "Garment not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "LockerAssignment not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim not found" }

  # --- order state ---
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order not in a valid state for the requested transition" }
  - { id: ERR_NO_GARMENTS, http: 409, condition: "Scheduling an order with zero garments" }
  - { id: ERR_ORDER_NOT_PICKED_UP, http: 409, condition: "log-intake requires the parent order in PICKED_UP" }
  - { id: ERR_GARMENTS_NOT_LOGGED, http: 409, condition: "start-processing requires every garment INTAKE_LOGGED" }
  - { id: ERR_GARMENTS_NOT_CLEANED, http: 409, condition: "qc-hold/qc-pass requires non-LOST garments CLEANED" }
  - { id: ERR_NO_REWORK_REQUESTED, http: 409, condition: "reopen-processing without a rework request or a rewashed garment" }
  - { id: ERR_DELIVERY_BEFORE_READY, http: 409, condition: "delivery_window.start_utc < ready_by_utc" }
  - { id: ERR_NO_LOCKER_ASSIGNED, http: 409, condition: "LOCKER handoff order dispatched without a locker assignment" }

  # --- garment state ---
  - { id: ERR_GARMENT_NOT_CLEANING, http: 409, condition: "finish-clean requires garment CLEANING" }
  - { id: ERR_GARMENT_NOT_CLEANED, http: 409, condition: "rewash requires garment CLEANED" }
  - { id: ERR_GARMENT_NOT_LOSABLE, http: 409, condition: "mark-lost requires garment in INTAKE_LOGGED/CLEANING/CLEANED" }
  - { id: ERR_INVALID_INTAKE_MEASUREMENT, http: 422, condition: "log-intake missing/zero measurement for the garment's service_type" }

  # --- claim state ---
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "Claim not in a valid state for the requested transition" }
  - { id: ERR_CLAIM_GARMENT_NOT_LOST, http: 409, condition: "approving a GARMENT-subject claim whose garment is not LOST" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal attempted at appeal_count == MAX_APPEALS" }
  - { id: ERR_APPEAL_LIMIT_NOT_REACHED, http: 409, condition: "finalize-denial before appeals exhausted" }

  # --- subscription state ---
  - { id: ERR_INVALID_SUBSCRIPTION_STATE, http: 409, condition: "Subscription not in a valid state for the requested transition" }

  # --- locker / assignment state ---
  - { id: ERR_INVALID_ASSIGNMENT_STATE, http: 409, condition: "LockerAssignment not in a valid state for the requested transition" }
  - { id: ERR_LOCKER_COMPARTMENT_CONFLICT, http: 409, condition: "New assignment overlaps an existing one in the same compartment (incl. buffer)" }
  - { id: ERR_HOLD_NOT_EXPIRED, http: 409, condition: "expire called before current_utc reaches hold_end_utc" }

  # --- window / capacity ---
  - { id: ERR_WINDOW_ZONE_MISMATCH, http: 409, condition: "Window zone_code/window_kind does not match leg/customer zone" }
  - { id: ERR_WINDOW_FULL, http: 409, condition: "Leg booking would exceed stop_capacity" }

  # --- customer safety ---
  - { id: ERR_CUSTOMER_BLOCKED, http: 403, condition: "Customer BLOCKED or risk_score >= CUSTOMER_BLOCK_THRESHOLD" }

  # --- concurrency (OCC) ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match Order.version" }
  - { id: ERR_STALE_SUBSCRIPTION_VERSION, http: 412, condition: "expected_subscription_version does not match Subscription.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser: config (plans), customer admin, clock, and broad write access for seeding/operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /subscription-plans — create plan"
      - "POST /customers — register customer"
      - "POST /customers/{id}/block — block customer"
      - "POST /_clock/set_current_utc — set clock"
    shared_operations:
      - "POST /subscriptions — create subscription (with Customer)"
      - "POST /subscriptions/{id}/change-plan, /cancel (with Customer)"
      - "POST /orders, /orders/{id}/garments, /schedule, /cancel (with Customer)"
      - "POST /claims, /claims/{id}/appeal (with Customer)"
      - "POST /route-windows, /lockers, /locker-assignments (with DispatchAgent)"
      - "GET reads across all collections"

  - name: Customer
    description: "End customer; owns their subscriptions, orders, garments, and claims"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /subscriptions, /subscriptions/{id}/change-plan, /cancel (own)"
      - "POST /orders, /orders/{id}/garments, /orders/{id}/schedule, /orders/{id}/cancel (own)"
      - "POST /claims, /claims/{id}/appeal (own)"
      - "GET own orders/garments/subscriptions/claims/invoices, plans, route-windows"

  - name: DispatchAgent
    description: "Owns logistics: route windows, lockers, pickup/delivery dispatch, locker assignment lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/pickup — mark picked up"
      - "POST /orders/{id}/dispatch-delivery — dispatch"
      - "POST /orders/{id}/confirm-delivery — confirm delivery"
      - "POST /locker-assignments/{id}/occupy, /release, /expire — assignment lifecycle"
    shared_operations:
      - "POST /route-windows, /lockers, /locker-assignments (with PlatformAdmin)"
      - "GET orders, route-windows, lockers, locker-assignments, customers"

  - name: PlantOperator
    description: "Owns garment processing at the plant: intake logging, cleaning, QC, notes, lost-item marking"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/garments/{gid}/log-intake — log intake"
      - "POST /orders/{id}/start-processing — start processing"
      - "POST /orders/{id}/garments/{gid}/finish-clean — finish clean"
      - "POST /orders/{id}/garments/{gid}/rewash — rewash"
      - "POST /orders/{id}/garments/{gid}/mark-lost — mark lost"
      - "POST /orders/{id}/garments/{gid}/notes — log stain/damage note"
      - "POST /orders/{id}/qc-hold, /qc-pass, /reopen-processing — QC lifecycle"
    shared_operations:
      - "GET orders, garments, notes"

  - name: ClaimsAdjuster
    description: "Owns claim adjudication: investigate, approve/reject, finalize denial, settle"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/investigate — open investigation"
      - "POST /claims/{id}/approve — approve + compute settlement"
      - "POST /claims/{id}/reject — reject"
      - "POST /claims/{id}/finalize-denial — finally deny"
      - "POST /claims/{id}/settle — settle + credit wallet"
    shared_operations:
      - "GET claims, orders, garments, notes, customers"
