      - name: temporal_window_error_wins_over_screening_capacity_on_a_full_event
        grounds:
          - validations[priority=23]
          - validations[priority=34]
          - calculations.screening_event_effective_capacity
          - errors.ERR_SLOT_OUTSIDE_EVENT_WINDOW
          - errors.ERR_SCREENING_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          A different category pair from the state/referential instance:
          `business_temporal` at priority 23 outranks `business_fiscal` at
          priority 34, so booking a slot that starts after the event window ends
          on an event whose booked_slot_count already equals
          effective_slot_capacity returns ERR_SLOT_OUTSIDE_EVENT_WINDOW (422),
          never ERR_SCREENING_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One screening-host-approved ACTIVE site."
            - "One screening event 2026-08-05T09:00:00Z to 2026-08-05T09:20:00Z with slot_length_minutes 20 and slot_capacity 1, so effective_slot_capacity is 1; the event is OPEN."
            - "One child already holds the single BOOKED slot at 09:00, so booked_slot_count is 1 and the event is full."
            - "A second child is waiting to be booked."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
