            - "carrier.rating_cooling_off_until == 2027-05-02T00:00:00Z (clock + 90 days)"

      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.InspectionViolation, state_machines.DrugAlcoholTest, state_machines.DocumentRecord, state_machines.RandomTestingPeriod]
