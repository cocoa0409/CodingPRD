      - name: corner_bill_payment_cascades_to_permittee_permit_and_aoi
        claim_type: side_effect_execution
        grounds:
          - state_machines.GrazingBill.ISSUED_to_PAID
          - state_machines.AnnualOperatingInstruction.BILLED_to_CLOSED
          - calculations.money_conservation_invariant
        distinguishing_aspect: "Paying the FINAL_USE bill in full runs a three-hop cascade in one request: bill_status -> PAID, Permittee.outstanding_balance_cents -> 0 with permittee_status IN_GOOD_STANDING, and the AOI moves BILLED -> CLOSED because every bill of that AOI is now PAID or VOIDED."
        test_recipe:
          setup:
            - "An issued permit with a 2026 AOI authorized at 100 AUMs, one 60-head cattle window of 31 days, accepted actual use of 62.00 AUMs and a FINAL_USE bill of 10664 cents"
          setup_api_calls:
