      - name: image_standard_violation_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_IMAGE_STANDARD_VIOLATION]
        excluded_because:
          difficulty_instance: boundary_precision_check / image_pixel_long_edge_exactly_at_standard_minimum_accepted
          rationale: "That §1.8 instance rejects the one-pixel-short upload with ERR_IMAGE_STANDARD_VIOLATION and accepts the exact minimum, so the code is already driven at its boundary."

      - name: fee_amount_mismatch_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        excluded_because:
          difficulty_instance: combinatorial_formula / entry_fee_per_line_rounding_before_summation
          rationale: "That §1.8 instance pays the naive whole-fee figure first and asserts ERR_FEE_AMOUNT_MISMATCH before paying the per-line rounded amount."

      - name: quorum_not_met_round_completion_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_QUORUM_NOT_MET]
        excluded_because:
          difficulty_instance: transitive_cascade / conflict_declaration_voids_score_and_reopens_quorum_shortfall
          rationale: "That §1.8 instance voids a score so a submitted work falls below quorum_required and the SCORING_COMPLETE request returns ERR_QUORUM_NOT_MET."

      - name: round_reopen_limit_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROUND_REOPEN_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / jury_round_reopen_cycle_bounded_at_two
          rationale: "That §1.8 instance reopens twice and asserts the third reopen returns ERR_ROUND_REOPEN_LIMIT."

      - name: juror_session_window_and_overlap_errors_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_JUROR_SESSION_OVERLAP]
          - errors[ERR_SESSION_OUTSIDE_ROUND_WINDOW]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / juror_session_half_open_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance books an adjacent session, rejects a one-minute intersection with ERR_JUROR_SESSION_OVERLAP and rejects a session that leaves the round window with ERR_SESSION_OUTSIDE_ROUND_WINDOW."

      - name: wall_span_bounds_and_conflict_errors_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WALL_SPAN_OUT_OF_BOUNDS]
          - errors[ERR_WALL_SPAN_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / wall_span_buffered_gap_exactly_fifteen_allowed
          rationale: "That §1.8 instance drives both codes: a span past length_cm for the bounds error and a 14 cm buffered gap for the conflict error."

      - name: artwork_condition_blocked_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ARTWORK_CONDITION_BLOCKED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / installation_plan_condition_before_span_conflict
          rationale: "That §1.8 instance plans a DAMAGED work onto a colliding span and asserts the condition error wins, so the code is triggered there."

      - name: exhibition_scope_mismatch_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EXHIBITION_SCOPE_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / score_scope_mismatch_before_scoring_window
          rationale: "That §1.8 instance scores a foreign exhibition's artwork outside the window and asserts ERR_EXHIBITION_SCOPE_MISMATCH is returned."

      - name: tax_form_missing_payout_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TAX_FORM_MISSING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / payout_requires_artist_tax_form_on_file
          rationale: "That §1.8 instance attempts the payout with tax_form_on_file false, asserts ERR_TAX_FORM_MISSING and then succeeds after the flag flips."

      - name: phase_and_settlement_invalid_errors_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EXHIBITION_PHASE_INVALID]
          - errors[ERR_SETTLEMENT_PHASE_INVALID]
        excluded_because:
          difficulty_instance: non_linear_state_machine / exhibition_status_and_settlement_axes_advance_independently
          rationale: "That §1.8 instance drives both: an out-of-order status target for ERR_EXHIBITION_PHASE_INVALID and a BOOKS_CLOSED request from the wrong settlement/status combination for ERR_SETTLEMENT_PHASE_INVALID."

  # =========================================================================
  # SECTION: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: role_not_permitted_on_other_roles_exclusive_operations_rejected
        claim_type: role_exclusive_operations
        grounds:
          - roles.CallManager.exclusive_operations
          - roles.JuryChair.exclusive_operations
          - roles.Artist.exclusive_operations
          - roles.Registrar.exclusive_operations
          - roles.FinanceOfficer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Every role's exclusive list is a hard boundary with no hierarchy: the CallManager who owns the whole call cannot invite a juror, the Registrar who owns the walls cannot record a sale, and each refusal is 403 ERR_ROLE_NOT_PERMITTED with no side effect."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES with one wall segment, one artist and one entry, so every attempted call is refused on role grounds alone rather than on state grounds."]
