            - "Contract.${cid}.highest_anniversary_value_cents == 2000000"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_segregation_of_duties_already_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "ERR_SEGREGATION_OF_DUTIES fires when the approver X-User-ID equals the submitter; verified here as a standalone error trigger."
        test_recipe:
          setup: ["An OUTBOUND 1035 exchange SUBMITTED by user 'same_user'."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { src: $.data.id }
            - call: "POST /exchanges-1035"
              payload: { direction: "OUTBOUND", source_contract_id: "${src}", external_carrier: "OtherCo", transfer_amount_cents: 1000000, cost_basis_cents: 600000 }
              as: ContractAdmin
              captures: { ex: $.data.id }
            - call: "POST /exchanges-1035/${ex}/submit"
              payload: {}
              as: ContractAdmin
              as_user_id: "same_user"
            - call: "GET /exchanges-1035/${ex}"
              payload: {}
              as: ComplianceOfficer
              captures: { exv1: $.data.version }
          trigger:
            - call: "POST /exchanges-1035/${ex}/approve"
              payload: { expected_exchange_version: "${exv1}" }
              as: ComplianceOfficer
              as_user_id: "same_user"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: error_stale_exchange_version_occ
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_EXCHANGE_VERSION]", "concurrency_rules[exchange-approve-stale]"]
        distinguishing_aspect: "Approving an Exchange1035 with a stale expected_exchange_version (one less than the live version after a revision cycle) returns ERR_STALE_EXCHANGE_VERSION (412)."
        test_recipe:
          setup: ["An OUTBOUND 1035 exchange that has gone through a revision cycle so its version advanced past the version the client first observed at submit."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { src: $.data.id }
            - call: "POST /exchanges-1035"
              payload: { direction: "OUTBOUND", source_contract_id: "${src}", external_carrier: "OtherCo", transfer_amount_cents: 1000000, cost_basis_cents: 600000 }
              as: ContractAdmin
              captures: { ex: $.data.id }
            - call: "POST /exchanges-1035/${ex}/submit"
              payload: {}
              as: ContractAdmin
              as_user_id: "submitter1"
            - call: "GET /exchanges-1035/${ex}"
              payload: {}
              as: ComplianceOfficer
              captures: { exv_stale: $.data.version }
            - call: "POST /exchanges-1035/${ex}/request-revision"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /exchanges-1035/${ex}/submit"
              payload: {}
              as: ContractAdmin
              as_user_id: "submitter1"
          trigger:
            - call: "POST /exchanges-1035/${ex}/approve"
              payload: { expected_exchange_version: "${exv_stale}" }
              as: ComplianceOfficer
              as_user_id: "approver2"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_EXCHANGE_VERSION"

      - name: error_referenced_segment_not_found_on_crediting
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]", entities.CreditingEvent.fields.source_segment_id]
        distinguishing_aspect: "INDEX_SEGMENT crediting with a source_segment_id that does not exist returns ERR_REFERENCED_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["INDEXED contract ACTIVE funded 2,000,000, no index segment created."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Indexed", contract_type: "INDEXED", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /crediting-events"
              payload: { contract_id: "${cid}", crediting_kind: "INDEX_SEGMENT", source_segment_id: "22222222-2222-4222-8222-222222222222", raw_index_return_bps: 500, credit_period_start: "2026-01-01T00:00:00Z", credit_period_end: "2026-06-01T00:00:00Z" }
              as: CreditingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

      - name: error_stale_contract_version_on_premium_already_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_CONTRACT_VERSION]", "concurrency_rules[premium-create-stale-contract]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_state_wins_over_fiscal_on_withdraw_create
          rationale: "ERR_STALE_CONTRACT_VERSION on an OCC-guarded create is asserted by the named §1.8 instance (withdrawal create)."

