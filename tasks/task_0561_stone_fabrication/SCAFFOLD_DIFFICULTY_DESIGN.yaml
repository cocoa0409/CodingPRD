scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_estimate_vs_final_balance_on_project
        grounds:
          - calculations.deposit_vs_balance
          - entities.Project.fields.quoted_total_cents
          - entities.Project.fields.final_invoice_cents
          - entities.Project.fields.balance_due_cents
        distinguishing_aspect: |
          On the Project COST domain the deposit_estimate variant (170000 = 50% of quoted
          340000) diverges from the final_balance variant (final_invoice 369751 minus
          amount_paid 0 = 369751) for the identical project.
        test_recipe:
          setup:
            - "Project PREMIUM with ACTIVE quote quote_total 340000; Template measured 40 sqft OGEE 25 lf with two SINK cutouts; template APPROVED so final_invoice_cents=369751; no payments."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ada", address: "1 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
          trigger:
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { fi: $.data.final_invoice_cents, bd: $.data.balance_due_cents }
          assert:
            - "Project.${p_id}.quoted_total_cents == 340000"
            - "Project.${p_id}.final_invoice_cents == 369751"
            - "Project.${p_id}.balance_due_cents == 369751"
            - "deposit_estimate (0.50*quoted 340000 = 170000) != final_balance (369751)"

      - name: estimated_yield_vs_actual_consumed_on_slab
        grounds:
          - calculations.slab_yield
          - entities.Slab.fields.reserved_sqft
          - entities.FabricationOrder.fields.actual_consumed_sqft
        distinguishing_aspect: |
          On the Slab MATERIAL domain the estimated_yield variant (42.50 = 50*0.85) diverges
          from the actual_consumed variant (40.20 = 25+15+0.10*2), a different entity domain
          than the Project cost variants.
        test_recipe:
          setup:
            - "PREMIUM project, quote, DEPOSIT 170000 (DEPOSIT_PAID), APPROVED template; slab nominal 50; fabrication order SCHEDULED with pieces 25 and 15 reserving the slab."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ben", address: "2 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id, ac: $.data.actual_consumed_sqft }
          trigger:
            - call: "GET /slabs/${sl_id}"
              payload: {}
              as: Fabricator
              captures: { rem: $.data.remaining_sqft, resv: $.data.reserved_sqft }
          assert:
            - "FabricationOrder.${f_id}.actual_consumed_sqft == 40.20"
            - "Slab.${sl_id}.reserved_sqft == 40.20"
            - "Slab.${sl_id}.remaining_sqft == 9.80"
            - "estimated_yield (50*0.85 = 42.50) != actual_consumed (40.20)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_tiered_with_min_job_floor
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.subtotal_cents
          - entities.Quote.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (a): quote_total combines >=3 inputs — tiered material rate (STANDARD 4500)*sqft,
          edge-rate selection (BEVELED 800)*lf, cutout charges — under a non-linear
          max(subtotal, MIN_JOB_CENTS) floor; subtotal 25700 is lifted to 80000 by the floor.
        test_recipe:
          setup:
            - "STANDARD project; create a small quote whose subtotal (25700) is below MIN_JOB_CENTS (80000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Cy", address: "3 Rock Rd", material_grade: "STANDARD" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
          trigger:
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 5, material_grade: "STANDARD", edge_profile: "BEVELED", edge_linear_ft: 4, sink_count: 0, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
              captures: { q_id: $.data.id, sub: $.data.subtotal_cents, tot: $.data.quote_total_cents }
          assert:
            - "Quote.${q_id}.subtotal_cents == 25700"
            - "Quote.${q_id}.quote_total_cents == 80000"

      - name: final_invoice_per_line_rounding_order
        grounds:
          - calculations.final_invoice
          - entities.Project.fields.final_invoice_cents
        distinguishing_aspect: |
          Mode (b): final_invoice rounds tax PER LINE then sums — two SINK lines each
          round_half_up(15000*1.0875)=16313 give 369751, whereas sum-then-round yields 369750;
          the scaffold pins per-line order.
        test_recipe:
          setup:
            - "PREMIUM project, quote, APPROVED template measured 40 OGEE 25 with two SINK cutouts; no change orders."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Di", address: "4 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
          trigger:
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
          assert:
            - "Project.${p_id}.final_invoice_cents == 369751"
            - "Project.${p_id}.final_invoice_cents != 369750 (sum-then-round result is rejected)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: template_reopen_then_reapprove_cycle
        grounds:
          - state_machines.Template.APPROVED_to_MEASURED
          - state_machines.Template.MEASURED_to_APPROVED
          - state_machines.ChangeOrder.DRAFT_to_APPLIED
        distinguishing_aspect: |
          Template cycles APPROVED -> MEASURED (via a reopens_template change order) -> APPROVED
          again, a revision loop on the Template entity (not a one-way linear pipeline).
        test_recipe:
          setup:
            - "PREMIUM project, quote, DEPOSIT 170000, APPROVED template, slab, bay, fabrication order SCHEDULED; a DRAFT reopens_template change order exists."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Eve", address: "5 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { p_vc: $.data.version }
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "swap edge", delta_cents: 0, reopens_template: true }
              as: SalesRep
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/approve"
              payload: {}
              as: ShopManager
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
          assert:
            - "Template.${t_id}.status == APPROVED (re-approved after cycling through MEASURED)"
            - "FabricationOrder.${f_id}.status == CANCELLED (proof the reopen fired)"
            - "Project.${p_id}.status == ON_HOLD"

      - name: warranty_fork_seal_vs_replacement_branch
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_RESOLVED
          - entities.WarrantyClaim.fields.resolution
          - entities.Project.fields.status
        distinguishing_aspect: |
          WarrantyClaim SUBMITTED forks to RESOLVED via REPLACEMENT (which reopens Project to
          IN_PRODUCTION) with divergent side effects from the SEAL_REPAIR branch (no reopen) —
          a branching fork-join on a different entity than Template.
        test_recipe:
          setup:
            - "Full pipeline through install DONE: PREMIUM project, quote, deposit, approved template, slab, bay, fab COMPLETE, crew, install job DONE; Project INSTALLED; a SUBMITTED warranty claim filed within the warranty window (clock at default 2026-05-01)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Fi", address: "6 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "PASS" }
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /crews"
              payload: { name: "CREW1" }
              as: ShopManager
              captures: { c_id: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${p_id}", fabrication_order_id: "${f_id}", crew_id: "${c_id}", install_date: "2026-06-15" }
              as: Installer
              captures: { ij_id: $.data.id }
            - call: "POST /install-jobs/${ij_id}/start"
              payload: {}
              as: Installer
            - call: "POST /install-jobs/${ij_id}/complete"
              payload: {}
              as: Installer
            - call: "POST /install-jobs/${ij_id}/warranty-claims"
              payload: { claim_type: "CRACK", description: "hairline crack near sink" }
              as: Installer
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${wc_id}/resolve"
              payload: { resolution: "REPLACEMENT" }
              as: Installer
          assert:
            - "WarrantyClaim.${wc_id}.status == RESOLVED"
            - "WarrantyClaim.${wc_id}.resolution == REPLACEMENT"
            - "Project.${p_id}.status == IN_PRODUCTION (REPLACEMENT branch reopens production)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approve_reopen_cascade_depth4
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_APPLIED
          - state_machines.Template.APPROVED_to_MEASURED
          - state_machines.FabricationOrder.SCHEDULED_to_CANCELLED
          - state_machines.Slab.RESERVED_to_IN_STOCK
        distinguishing_aspect: |
          Approving a reopens_template change order cascades ChangeOrder(apply) -> Template(reopen
          to MEASURED) -> FabricationOrder(cancel) -> Slab(release), each hop caused by the prior;
          a depth-4 chain triggered by change-order approve.
        test_recipe:
          setup:
            - "PREMIUM project, quote, deposit, APPROVED template, slab nominal 50 RESERVED (remaining 9.80), fabrication order SCHEDULED, a DRAFT reopens_template change order."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Gus", address: "7 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { p_vc: $.data.version }
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "add island", delta_cents: 50000, reopens_template: true }
              as: SalesRep
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/approve"
              payload: {}
              as: ShopManager
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED"
            - "Template.${t_id}.status == MEASURED"
            - "FabricationOrder.${f_id}.status == CANCELLED"
            - "Slab.${sl_id}.status == IN_STOCK"
            - "Slab.${sl_id}.reserved_sqft == 0"
            - "Slab.${sl_id}.remaining_sqft == 50.00"
            - "Project.${p_id}.status == ON_HOLD"

      - name: fab_complete_consume_cascade_depth3
        grounds:
          - state_machines.FabricationOrder.QC_PASSED_to_COMPLETE
          - state_machines.Slab.RESERVED_to_CONSUMED
          - entities.Remnant.fields.area_sqft
        distinguishing_aspect: |
          Completing a fabrication order cascades FabricationOrder(complete) -> Slab(consume) ->
          Remnant(create with area 9.80), each hop caused by the prior; a depth-3 chain from a
          different trigger (complete) than the change-order cascade.
        test_recipe:
          setup:
            - "PREMIUM project, quote, deposit, approved template, slab nominal 50, fab order QC_PASSED (pieces 25 and 15, actual_consumed 40.20)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Hal", address: "8 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "PASS" }
              as: Fabricator
          trigger:
            - call: "POST /fabrication-orders/${f_id}/complete"
              payload: {}
              as: Fabricator
            - call: "GET /slabs/${sl_id}/remnants"
              payload: {}
              as: Fabricator
              captures: { rem_area: "$.data[0].area_sqft" }
          assert:
            - "FabricationOrder.${f_id}.status == COMPLETE"
            - "Slab.${sl_id}.status == CONSUMED"
            - "GET /slabs/${sl_id}/remnants returns exactly one Remnant with area_sqft == 9.80"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_closed_beats_fiscal_invalid_amount_on_payment
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        distinguishing_aspect: |
          A payment that is both on a CLOSED Project (category state, pri 5) and has
          amount_cents=0 (category business_fiscal, pri 16) returns ERR_PROJECT_CLOSED — the
          state category outranks the fiscal category.
        test_recipe:
          setup:
            - "Project fully driven to CLOSED: PREMIUM project, quote, approved template (final_invoice 369751), a single BALANCE payment 369751 -> PAID_IN_FULL, fab COMPLETE, install DONE -> Project CLOSED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ivy", address: "9 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
