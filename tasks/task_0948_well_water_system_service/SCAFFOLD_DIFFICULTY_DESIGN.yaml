  - rule_id: boundary_precision_check
    instances:
      - name: parts_markup_band_boundary_5000_inclusive_versus_5001
        grounds:
          - calculations.parts_markup_pct
          - calculations.parts_unit_price_cents
          - calculations.parts_subtotal_cents
        distinguishing_aspect: |
          Numeric threshold metric on POST /water-service/quotes/{quote_id}/price: a
          unit cost of exactly 5000 sits INSIDE band 1 (60 percent, 8000 cents) while
          5001 falls into band 2 (40 percent, 7001 cents), so one extra cent of cost
          lowers the marked-up price by 999 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z."
            - "One account, property, well, APPRENTICE technician and COMPLETED inspection."
            - "Two CONSUMABLE parts: one costing exactly 5000 cents, one costing 5001 cents."
            - "A REPAIR quote carrying one ACTIVE line of quantity 1 for each part."
