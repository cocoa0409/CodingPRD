              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /merger-applications/${app_id}/accept"
              payload: {}
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "GET /comment-periods"
