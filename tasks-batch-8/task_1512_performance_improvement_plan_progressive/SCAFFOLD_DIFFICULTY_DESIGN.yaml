  # ===========================================================================
  # Rule 9: compensating_invariant — forward + compensating action leaves a
  # named global quantity unchanged. Different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pip_goal_weight_sum_conserved_across_create_withdraw
        grounds:
          - entities.PIPGoal.fields.weight
          - state_machines.PerformanceImprovementPlan.ISSUED_to_CLOSED_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: sum(PIPGoal.weight) for a PIP. Forward
          action = POST /pips (materializes goal rows whose weights sum
          to 100). Compensating action = POST /pips/{id}/withdraw (closes
          the PIP; goal rows remain but are frozen). Invariant:
          sum(weight) == 100 holds both immediately after creation AND
          after withdrawal — no drift introduced by the state flip.
        test_recipe:
          setup:
            - "Org unit with manager, HRBP, employee E1, ACCEPTED concern, PUBLISHED template with three goals weight 40+35+25"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
