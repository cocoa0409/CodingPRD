# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3381_charter_candidate_progression_exam_windows_experience_verification
#
# Depth probe: 2 instances per each of the nine §0.5 Difficulty Rules.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and ships a fully
# structured, replayable test_recipe. Shared fixture anchors (&k_*) are defined
# at first use and aliased (*k_*) afterwards — anchors are document-local.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: experience_months_cumulative_vs_contiguous_diverge
        grounds:
          - calculations.experience_months_evaluation
          - state_machines.WorkExperienceSubmission.DRAFT_to_SUBMITTED
          - state_machines.WorkExperienceSubmission.SUBMITTED_to_APPROVED
          - entities.WorkExperienceSubmission.fields.provisional_months
          - entities.WorkExperienceSubmission.fields.committee_months
        distinguishing_aspect: |
          Same two overlapping qualifying segments produce provisional_months == 47
          (cumulative, overlaps double-counted, computed at submit) and
          committee_months == 41 (contiguous interval-merge, overlaps counted once,
          computed at review) — two valid algorithms over the WorkExperienceSubmission
          domain that differ by exactly the 6-month overlap.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Candidate A exists. A DRAFT submission holds two overlapping qualifying segments: S1 2022-01-10..2024-01-10 at 80% (24 calendar months) and S2 2023-07-10..2025-06-10 at 60% (23 calendar months); overlap is exactly 2023-07-10..2024-01-10 (6 months)."
            - "Two references attached and VERIFIED so the APPROVED path is open."
          setup_api_calls:
            - &k_clock_jan05
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
            - &k_cand_a
              call: "POST /charter/candidates"
              payload: { email: "a.cand@example.com", full_name: "A Candidate", date_of_birth: "1995-04-12", gov_id_number: "GOV-A-1001" }
              as: ProgramAdmin
              captures: { cand_a: $.data.id }
            - &k_sub_a
              call: "POST /charter/candidates/${cand_a}/experience-submissions"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2022-01-10", end_date: "2024-01-10", qualifying_activity_pct: 80, hours: 4200 }, { employer_name: "Beta Capital", role_title: "Senior Analyst", start_date: "2023-07-10", end_date: "2025-06-10", qualifying_activity_pct: 60, hours: 4000 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_a: $.data.id, sub_a_v: $.data.version }
            - &k_ref1
              call: "POST /charter/experience-submissions/${sub_a}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { ref1: $.data.id }
            - &k_ref2
              call: "POST /charter/experience-submissions/${sub_a}/references"
              payload: { referee_name: "Ref Two", referee_email: "ref2@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { ref2: $.data.id }
            - &k_ref1_verify
              call: "POST /charter/references/${ref1}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${ref1}"
            - &k_ref2_verify
              call: "POST /charter/references/${ref2}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${ref2}"
          trigger:
            - call: "POST /charter/experience-submissions/${sub_a}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_prov: $.data.provisional_months }
            - call: "POST /charter/experience-submissions/${sub_a}/review"
              payload: { decision: "APPROVED" }
              as: ExperienceReviewer
              captures: { sub_comm: $.data.committee_months }
          assert:
            - "the submit response shows provisional_months == 47 (24 + 23, overlap double-counted)"
            - "the review response shows committee_months == 41 (merged run 2022-01-10..2025-06-10)"
            - "sub_prov != sub_comm and the delta is exactly 6 (the overlap)"
            - "WorkExperienceSubmission.${sub_a}.status == APPROVED"

      - name: ce_standing_calendar_vs_rolling_diverge
        grounds:
          - calculations.ce_standing_evaluation
          - entities.SocietyMembership.fields.calendar_year_credits
          - entities.SocietyMembership.fields.rolling_12m_credits
          - endpoints.POST_/charter/memberships/{membershipId}/ce-records
        distinguishing_aspect: |
          The same three CE records (5 credits on 2026-12-20, 15 on 2027-03-10,
          6 on 2027-08-19) evaluated at clock 2027-08-20 produce
          calendar_year_credits == 21 and rolling_12m_credits == 26 — the calendar-year
          variant (the renewal gate) drops the December 2026 credit that the
          trailing-365-day variant still counts. Same SocietyMembership domain data,
          two valid windowings, different totals.
        test_recipe:
          setup:
            - "Candidate A is a full charterholder (three levels passed, experience APPROVED, PCS 2027 filed, charter awarded) and an ACTIVE member of society NYSSA-EX (dues 27500, 20 CE credits required) with paid_through_year 2027."
            - "Logical clock at 2027-08-20T00:00:00Z."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - &k_enroll_a
              call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - &k_pay_enr_a
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - &k_level1
              call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_I", mps_scaled_score: 700, max_attempts: 6, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl1: $.data.id }
            - &k_level2
              call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_II", mps_scaled_score: 720, max_attempts: 6, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl2: $.data.id }
            - &k_level3
              call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_III", mps_scaled_score: 740, max_attempts: 6, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl3: $.data.id }
            - &k_win1
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-03-08T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win1: $.data.id }
            - &k_win2
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl2}", window_opens_at: "2027-05-03T00:00:00Z", window_closes_at: "2027-05-17T00:00:00Z", scheduling_deadline_at: "2027-04-19T00:00:00Z", reschedule_deadline_at: "2027-04-26T00:00:00Z", early_fee_deadline_at: "2027-03-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win2: $.data.id }
            - &k_win3
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl3}", window_opens_at: "2027-08-02T00:00:00Z", window_closes_at: "2027-08-16T00:00:00Z", scheduling_deadline_at: "2027-07-19T00:00:00Z", reschedule_deadline_at: "2027-07-26T00:00:00Z", early_fee_deadline_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { win3: $.data.id }
            - &k_ctr2
              call: "POST /charter/test-centers"
              payload: { name: "Metro Center", city: "Metropolis", daily_seat_capacity: 2 }
              as: ProgramAdmin
              captures: { ctr2: $.data.id }
            - &k_book_a_w1
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - &k_pay_fee_a
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - &k_clock_mar03
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-03T08:00:00Z" }
              as: ProgramAdmin
            - &k_checkin_a
              call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
            - &k_attempt_a
              call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a}" }
              as: ProgramAdmin
              captures: { att_a: "$.data[0].id" }
            - &k_clock_mar16
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-16T00:00:00Z" }
              as: ProgramAdmin
            - &k_score_a_700
              call: "POST /charter/exam-attempts/${att_a}/score"
              payload: { scaled_score: 700 }
              as: ProgramAdmin
            # --- LEVEL_II pass ---
            - &k_book_a_w2
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win2}", test_center_id: "${ctr2}", exam_date: "2027-05-05", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_a2: $.data.id }
            - &k_pay_fee_a2
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - &k_clock_may05
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T08:00:00Z" }
              as: ProgramAdmin
            - &k_checkin_a2
              call: "POST /charter/appointments/${appt_a2}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
            - &k_attempt_a2
              call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a2}" }
              as: ProgramAdmin
              captures: { att_a2: "$.data[0].id" }
            - &k_clock_may18
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-18T00:00:00Z" }
              as: ProgramAdmin
            - &k_score_a_720
              call: "POST /charter/exam-attempts/${att_a2}/score"
              payload: { scaled_score: 720 }
              as: ProgramAdmin
            # --- LEVEL_III pass ---
            - &k_book_a_w3
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win3}", test_center_id: "${ctr2}", exam_date: "2027-08-04", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_a3: $.data.id }
            - &k_pay_fee_a3
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - &k_clock_aug04
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-04T08:00:00Z" }
              as: ProgramAdmin
            - &k_checkin_a3
              call: "POST /charter/appointments/${appt_a3}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
            - &k_attempt_a3
              call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a3}" }
              as: ProgramAdmin
              captures: { att_a3: "$.data[0].id" }
            - &k_clock_aug17
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-17T00:00:00Z" }
              as: ProgramAdmin
            - &k_score_a_740
              call: "POST /charter/exam-attempts/${att_a3}/score"
              payload: { scaled_score: 740 }
              as: ProgramAdmin
            # --- experience approved + PCS filed + charter awarded ---
            - *k_sub_a
            - *k_ref1
            - *k_ref2
            - *k_ref1_verify
            - *k_ref2_verify
            - &k_submit_a
              call: "POST /charter/experience-submissions/${sub_a}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - &k_review_a_ok
              call: "POST /charter/experience-submissions/${sub_a}/review"
              payload: { decision: "APPROVED" }
              as: ExperienceReviewer
            - &k_pcs_a_2027
              call: "POST /charter/candidates/${cand_a}/conduct-statements"
              payload: { disclosure_year: 2027, has_disclosures: false }
              as: Candidate
              as_user_id: "${cand_a}"
            - &k_award_a
              call: "POST /charter/program-enrollments/${enr_a}/award-charter"
              payload: {}
              as: ProgramAdmin
            # --- society + membership ---
            - &k_society
              call: "POST /charter/societies"
              payload: { society_code: "NYSSA-EX", name: "Example Society", region: "NY", annual_dues_cents: 27500, ce_credits_required_per_year: 20 }
              as: ProgramAdmin
              captures: { soc: $.data.id }
            - &k_membership_a
              call: "POST /charter/societies/${soc}/memberships"
              payload: { candidate_id: "${cand_a}", dues_payment_cents: 27500 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { mem_a: $.data.id }
            - &k_clock_aug20
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/memberships/${mem_a}/ce-records"
              payload: { activity_title: "Ethics webinar", credit_hours: 5, completed_on: "2026-12-20" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/memberships/${mem_a}/ce-records"
              payload: { activity_title: "Fixed income seminar", credit_hours: 15, completed_on: "2027-03-10" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/memberships/${mem_a}/ce-records"
              payload: { activity_title: "Derivatives workshop", credit_hours: 6, completed_on: "2027-08-19" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { mem_cal: $.data.calendar_year_credits, mem_roll: $.data.rolling_12m_credits }
          assert:
            - "SocietyMembership.${mem_a}.calendar_year_credits == 21 (15 + 6; the 2026-12-20 record excluded)"
            - "SocietyMembership.${mem_a}.rolling_12m_credits == 26 (all three records; trailing 365 days from 2027-08-20 reaches back past 2026-08-20)"
            - "mem_cal != mem_roll"
            - "SocietyMembership.${mem_a}.ce_standing_met == true (21 >= 20 under the calendar-year variant that the renewal gate uses)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reschedule_fee_tiered_branch_min_cap
        grounds:
          - calculations.reschedule_fee_quote
          - state_machines.ExamAppointment.SCHEDULED_to_SCHEDULED
          - entities.ExamAppointment.fields.reschedule_fees_total_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: the fee branches on
          days_before_exam < 14, scales with min(reschedule_count, 2), and is clamped
          by the 60000 cap. The three reschedules below charge exactly 50000, 60000
          (cap binds at equality, 25000+25000+10000), and 60000 (70000 clamped),
          total 170000 — an uncapped reading would give 180000, a no-branch reading 75000.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Candidate A enrolled (35003 paid). LEVEL_I window W1 [2027-03-01, 2027-03-15) with reschedule_deadline 2027-03-08; center capacity 2. Appointment booked EARLY for exam_date 2027-03-10; exam fee 94000 already paid (outstanding 0)."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_win1
            - *k_ctr2
            - &k_book_a_w1_mar10
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-10", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_r: $.data.id, appt_r_v1: $.data.version }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/appointments/${appt_r}/reschedule"
              payload: { exam_date: "2027-03-12", expected_appointment_version: "${appt_r_v1}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_r_v2: $.data.version, fee_sum_1: $.data.reschedule_fees_total_cents }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /charter/appointments/${appt_r}/reschedule"
              payload: { exam_date: "2027-03-13", expected_appointment_version: "${appt_r_v2}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_r_v3: $.data.version, fee_sum_2: $.data.reschedule_fees_total_cents }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /charter/appointments/${appt_r}/reschedule"
              payload: { exam_date: "2027-03-14", expected_appointment_version: "${appt_r_v3}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { fee_sum_3: $.data.reschedule_fees_total_cents }
          assert:
            - "fee_sum_1 == 50000 (25000 base + 25000 late surcharge; 9 days before 2027-03-10 exam; zero prior reschedules)"
            - "fee_sum_2 == 110000 (second reschedule adds min(1,2)*10000 -> 60000; cap binds at exactly 60000, not truncating below)"
            - "fee_sum_3 == 170000 (third reschedule: 25000+25000+20000 = 70000 clamped to 60000 by RESCHEDULE_FEE_CAP_CENTS)"
            - "ExamAppointment.${appt_r}.reschedule_count == 3 and exam_date == \"2027-03-14\""
            - "ProgramEnrollment.${enr_a}.lifetime_charges_cents == 299003 (35003 program + 94000 exam + 50000 + 60000 + 60000; reschedule fees never scholarship-discounted)"

      - name: scholarship_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.enrollment_line_charges
          - entities.ProgramEnrollment.fields.lifetime_charges_cents
          - entities.ExamAppointment.fields.exam_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-half-up PER LINE
          then sum. With scholarship_pct 0.10, program fee line = round_half_up(35003*0.9)
          = 31503 and exam early line = round_half_up(99995*0.9) = 89996, total 121499;
          the rejected sum-then-round order gives round_half_up((35003+99995)*0.9)
          = round_half_up(121498.2) = 121498. The two orders differ by exactly 1 cent.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Candidate A enrolled with pathway EDUCATION and scholarship_pct 0.10 (unpaid). LEVEL_I fee card early 99995 / standard 125000; window W1 with early_fee_deadline 2027-01-31."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15", scholarship_pct: 0.10 }
              as: ProgramAdmin
              captures: { enr_s: $.data.id, enr_s_charges: $.data.lifetime_charges_cents }
            - call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_I", mps_scaled_score: 700, max_attempts: 6, early_fee_cents: 99995, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl_s: $.data.id }
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl_s}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-03-08T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_s: $.data.id }
            - *k_ctr2
            - call: "POST /charter/program-enrollments/${enr_s}/payments"
              payload: { amount_cents: 31503 }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_s}", exam_window_id: "${win_s}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_s: $.data.id, appt_s_fee: $.data.exam_fee_cents }
          assert:
            - "enr_s_charges == 31503 (per-line round_half_up(35003 * 0.9) = round_half_up(31502.7) = 31503, not a truncated 31502)"
            - "appt_s_fee == 89996 (per-line round_half_up(99995 * 0.9) = round_half_up(89995.5) = 89996 — half-up, not half-even)"
            - "ProgramEnrollment.${enr_s}.lifetime_charges_cents == 121499 (31503 + 89996; the rejected sum-then-round order would give 121498)"
            - "ProgramEnrollment.${enr_s}.outstanding_balance_cents == 89996 after booking"
# === DIFFICULTY PART 2 MARKER ===

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: misconduct_case_sanction_appeal_cycle
        grounds:
          - state_machines.MisconductCase.OPENED_to_SANCTIONED
          - state_machines.MisconductCase.SANCTIONED_to_APPEALED
          - state_machines.MisconductCase.APPEALED_to_DISMISSED
          - entities.Candidate.fields.suspended_until
        distinguishing_aspect: |
          MisconductCase is cyclic — OPENED -> SANCTIONED -> APPEALED -> DISMISSED
          revisits adjudication after appeal — and the compensation on the second
          adjudication (suspended_until cleared) proves the loop ran, unlike a
          linear pipeline. Second instance is on a different entity
          (ExamAppointment parallel dimensions).
        test_recipe:
          setup:
            - "Logical clock 2027-01-05T00:00:00Z. Candidate A enrolled (35003 paid); LEVEL_I window W1; appointment booked on 2027-03-03 (fee 94000 outstanding). A misconduct case opened by ConductInvestigator 'inv-1' (external report)."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_win1
            - *k_ctr2
            - *k_book_a_w1
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "External report of credential misrepresentation" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case1: $.data.id, case1_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/misconduct-cases/${case1}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "SUSPENSION_12M", expected_case_version: "${case1_v1}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
              captures: { case1_v2: $.data.version }
            - call: "GET /charter/candidates/${cand_a}"
              payload: {}
              as: ProgramAdmin
              captures: { susp_at: $.data.suspended_until }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-25T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /charter/misconduct-cases/${case1}/appeal"
              payload: { appeal_reason: "New evidence from employer" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { case1_v3: $.data.version }
            - call: "POST /charter/misconduct-cases/${case1}/adjudicate"
              payload: { outcome: "DISMISSED", expected_case_version: "${case1_v3}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
              captures: { case1_final: $.data.status }
            - call: "GET /charter/candidates/${cand_a}"
              payload: {}
              as: ProgramAdmin
              captures: { susp_after: $.data.suspended_until, standing_after: $.data.conduct_standing }
          assert:
            - "after first adjudication MisconductCase.${case1}.status == SANCTIONED and suspended_until == \"2028-03-19T00:00:00Z\" (sanctioned_at 2027-03-20 + 365 days, spanning the 2028 leap day)"
            - "after appeal status == APPEALED and version advanced to 3"
            - "after second adjudication status == DISMISSED (the cycle OPENED->SANCTIONED->APPEALED->DISMISSED completed)"
            - "compensation: Candidate.${cand_a}.suspended_until is null again and conduct_standing == GOOD_STANDING"

      - name: appointment_booking_and_compliance_dimensions_are_independent
        grounds:
          - state_machines.ExamAppointment.SCHEDULED_to_CHECKED_IN
          - state_machines.ExamAppointment.CLEAR_to_POLICY_FLAGGED
          - state_machines.ExamAppointment.POLICY_FLAGGED_to_CLEARED
          - entities.ExamAppointment.fields.booking_status
          - entities.ExamAppointment.fields.compliance_status
        distinguishing_aspect: |
          ExamAppointment carries two PARALLEL state dimensions on one row: a
          POLICY_FLAGGED compliance dimension does not gate the booking dimension
          (check-in still succeeds), and dismissing the case moves compliance
          POLICY_FLAGGED -> CLEARED while booking stays CHECKED_IN. Distinct entity
          and distinct non-linear shape from the MisconductCase appeal cycle.
        test_recipe:
          setup:
            - "Logical clock 2027-01-05T00:00:00Z. Candidate A enrolled; appointment booked for 2027-03-03 at center cap 2; a proctor-filed incident case (appointment-linked) has set compliance_status POLICY_FLAGGED while booking_status stays SCHEDULED."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_win1
            - *k_ctr2
            - *k_book_a_w1
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", appointment_id: "${appt_a}", allegation: "Suspected unauthorized notes", origin: "EXAM_INCIDENT" }
              as: Proctor
              as_user_id: "prt-7"
              captures: { case_p: $.data.id, case_p_v: $.data.version }
            - call: "GET /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}" }
              as: ProgramAdmin
              captures: { appt_comp1: "$.data[0].compliance_status", appt_book1: "$.data[0].booking_status" }
            - *k_clock_mar03
          trigger:
            - call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
              captures: { appt_book2: $.data.booking_status, appt_comp2: $.data.compliance_status }
            - call: "POST /charter/misconduct-cases/${case_p}/adjudicate"
              payload: { outcome: "DISMISSED", expected_case_version: "${case_p_v}" }
              as: ConductAdjudicator
              as_user_id: "adj-9"
            - call: "GET /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}" }
              as: ProgramAdmin
              captures: { appt_book3: "$.data[0].booking_status", appt_comp3: "$.data[0].compliance_status" }
          assert:
            - "after case creation: appt_book1 == SCHEDULED and appt_comp1 == POLICY_FLAGGED (flagging does not move booking)"
            - "check-in succeeds despite POLICY_FLAGGED: appt_book2 == CHECKED_IN and appt_comp2 == POLICY_FLAGGED"
            - "an ExamAttempt exists for the appointment (check-in side effect fired under a flagged compliance dimension)"
            - "after dismissal: appt_comp3 == CLEARED while appt_book3 == CHECKED_IN (dimensions evolve independently)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: exam_invalidation_cascades_attempt_progression_curriculum
        grounds:
          - state_machines.MisconductCase.OPENED_to_SANCTIONED
          - state_machines.ExamAttempt.VALID_to_INVALIDATED
          - calculations.candidate_progression_recompute
          - entities.ProgramEnrollment.fields.curriculum_access_cycle_ids
        distinguishing_aspect: |
          Depth-3 cascade from adjudication: case SANCTIONED(EXAM_INVALIDATION)
          -> attempt validity INVALIDATED -> Candidate.highest_level_passed_code
          recomputed DOWN to null -> ProgramEnrollment.curriculum_access_cycle_ids
          shrinks from both cycle ids to the LEVEL_I cycle only. Each hop is caused
          by the previous hop, and the trigger (case adjudication) differs from the
          second instance's trigger (window cancel).
        test_recipe:
          setup:
            - "Candidate A enrolled; LEVEL_I and LEVEL_II exist with PUBLISHED 2027 cycles (l1_cyc, l2_cyc). A booked, checked in 2027-03-03 and scored 700 (PASS) on 2027-03-16: highest_level_passed_code == LEVEL_I and curriculum access == [l1_cyc, l2_cyc] (levels up to and including the lowest unpassed level)."
            - "A proctor-opened case on the LEVEL_I appointment awaits adjudication."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_level2
            - &k_cyc_l1
              call: "POST /charter/exam-levels/${lvl1}/curriculum-cycles"
              payload: { cycle_year: 2027, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", content_version: "L1-2027" }
              as: ProgramAdmin
              captures: { l1_cyc: $.data.id }
            - &k_cyc_l2
              call: "POST /charter/exam-levels/${lvl2}/curriculum-cycles"
              payload: { cycle_year: 2027, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", content_version: "L2-2027" }
              as: ProgramAdmin
              captures: { l2_cyc: $.data.id }
            - *k_win1
            - *k_ctr2
            - *k_book_a_w1
            - *k_pay_fee_a
            - *k_clock_mar03
            - *k_checkin_a
            - *k_attempt_a
            - *k_clock_mar16
            - *k_score_a_700
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { access_before: "$.data[0].curriculum_access_cycle_ids" }
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", appointment_id: "${appt_a}", allegation: "Calculator concealment suspected", origin: "EXAM_INCIDENT" }
              as: Proctor
              as_user_id: "prt-7"
              captures: { case_c: $.data.id, case_c_v: $.data.version }
          trigger:
            - call: "POST /charter/misconduct-cases/${case_c}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "EXAM_INVALIDATION", expected_case_version: "${case_c_v}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
            - call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a}" }
              as: ProgramAdmin
              captures: { att_validity: "$.data[0].validity" }
            - call: "GET /charter/candidates/${cand_a}"
              payload: {}
              as: ProgramAdmin
              captures: { highest_after: $.data.highest_level_passed_code }
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { access_after: "$.data[0].curriculum_access_cycle_ids" }
            - call: "GET /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}" }
              as: ProgramAdmin
              captures: { appt_comp_after: "$.data[0].compliance_status" }
          assert:
            - "before sanction: access_before contains exactly [${l1_cyc}, ${l2_cyc}] (LEVEL_I passed, LEVEL_II next)"
            - "hop 1: ExamAttempt.${att_a}.validity == INVALIDATED"
            - "hop 2: Candidate.${cand_a}.highest_level_passed_code is null (recomputed down, not sticky)"
            - "hop 3: access_after contains exactly [${l1_cyc}] (LEVEL_II cycle access revoked)"
            - "appointment compliance_status == CONFIRMED_VIOLATION (parallel-dimension side effect of the same adjudication)"

      - name: window_cancel_cascades_appointment_credit_ledger
        grounds:
          - state_machines.ExamWindow.OPEN_to_CANCELLED
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED
          - calculations.window_cancellation_credit
          - entities.ProgramEnrollment.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade from window cancellation (a different trigger than case
          adjudication): window CANCELLED -> appointment CANCELLED -> enrollment
          credit posted; the follow-on booking then auto-draws the credit, proving
          the ledger hop (credit_balance 94000 -> 0 and outstanding stays 0).
        test_recipe:
          setup:
            - "Candidate A enrolled (35003 paid); LEVEL_I; window W1 [03-01..03-15) and window W1B [04-01..04-15); center cap 2. A booked W1 on 2027-03-03 EARLY (94000) and paid it fully (outstanding 0). Clock at 2027-01-05T00:00:00Z."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_win1
            - &k_win1b
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-04-01T00:00:00Z", window_closes_at: "2027-04-15T00:00:00Z", scheduling_deadline_at: "2027-03-20T00:00:00Z", reschedule_deadline_at: "2027-03-25T00:00:00Z", early_fee_deadline_at: "2027-02-28T00:00:00Z" }
              as: ProgramAdmin
              captures: { win1b: $.data.id }
            - *k_ctr2
            - *k_book_a_w1
            - *k_pay_fee_a
          trigger:
            - call: "POST /charter/exam-windows/${win1}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { win1_status: $.data.status }
            - call: "GET /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}" }
              as: ProgramAdmin
              captures: { appt_status_after: "$.data[0].booking_status" }
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { credit_after_cancel: "$.data[0].credit_balance_cents", net_billed_after_cancel: "$.data[0].net_billed_cents" }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1b}", test_center_id: "${ctr2}", exam_date: "2027-04-02", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_rebook: $.data.id }
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { credit_after_rebook: "$.data[0].credit_balance_cents", outstanding_after_rebook: "$.data[0].outstanding_balance_cents" }
          assert:
            - "win1_status == CANCELLED"
            - "hop 1: the SCHEDULED appointment is CANCELLED by the cascade"
            - "hop 2: credit_after_cancel == 94000 (fee was already paid, so the full credit lands in credit_balance; outstanding was 0) and net_billed_after_cancel == 35003"
            - "rebook succeeds into W1B and draws the credit: credit_after_rebook == 0 and outstanding_after_rebook == 0 (94000 charge auto-applied against the 94000 credit)"
            - "ProgramEnrollment.${enr_a}.lifetime_charges_cents == 222003 (35003 + 94000 + 94000) with lifetime_credits_posted_cents == 94000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_enrollment_beats_fiscal_balance_on_booking
        grounds:
          - validations.priority_8_state
          - validations.priority_13_business_fiscal
          - errors.ERR_ENROLLMENT_NOT_ENROLLED
          - errors.ERR_OUTSTANDING_BALANCE
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: a booking against a
          PENDING_PAYMENT enrollment violates both the state gate (not ENROLLED)
          and the fiscal gate (outstanding 35003 > 0); the ordered validation table
          (state priority 8 < fiscal priority 13) must return ERR_ENROLLMENT_NOT_ENROLLED.
        test_recipe:
          setup:
            - "Logical clock 2027-01-05T00:00:00Z. Candidate A has a PENDING_PAYMENT enrollment (program fee 35003 unpaid, so outstanding_balance_cents == 35003 too). LEVEL_I window W1 and center exist."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_level1
            - *k_win1
            - *k_ctr2
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENROLLMENT_NOT_ENROLLED"
            - "error_id != ERR_OUTSTANDING_BALANCE even though outstanding_balance_cents == 35003 > 0 also holds (state priority 8 beats fiscal priority 13)"
            - "GET /charter/appointments?program_enrollment_id=${enr_a} returns 0 rows (no partial write)"

      - name: temporal_deadline_beats_capacity_on_reschedule
        grounds:
          - validations.priority_9_business_temporal
          - validations.priority_11_business_constraint
          - errors.ERR_RESCHEDULE_DEADLINE_PASSED
          - errors.ERR_NO_SEAT_CAPACITY
        distinguishing_aspect: |
          Category pair business_temporal-vs-business_constraint (different pair
          than the first instance): a reschedule attempted after the original
          window's reschedule deadline onto a center+date that is ALSO fully booked
          must return ERR_RESCHEDULE_DEADLINE_PASSED (priority 9 beats 11) —
          an implementation that checks seats first would wrongly return
          ERR_NO_SEAT_CAPACITY.
        test_recipe:
          setup:
            - "Logical clock 2027-01-05T00:00:00Z. Window W1R (LEVEL_I, [2027-03-01, 2027-03-15), scheduling_deadline 2027-02-20, reschedule_deadline 2027-02-25). Center A cap 1 and Center B cap 1. Candidate A booked Center A on 2027-03-03; candidate B enrolled, paid, and booked Center B on 2027-03-05 (so Center B on 03-05 is full). Clock then advanced to 2027-02-26, past the reschedule deadline."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-02-25T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win1r: $.data.id }
            - call: "POST /charter/test-centers"
              payload: { name: "Center A", city: "Metropolis", daily_seat_capacity: 1 }
              as: ProgramAdmin
              captures: { ctr_a1: $.data.id }
            - call: "POST /charter/test-centers"
              payload: { name: "Center B", city: "Metropolis", daily_seat_capacity: 1 }
              as: ProgramAdmin
              captures: { ctr_b1: $.data.id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1r}", test_center_id: "${ctr_a1}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_ra: $.data.id, appt_ra_v: $.data.version }
            - &k_cand_b
              call: "POST /charter/candidates"
              payload: { email: "b.cand@example.com", full_name: "B Candidate", date_of_birth: "1993-09-30", gov_id_number: "GOV-B-1002" }
              as: ProgramAdmin
              captures: { cand_b: $.data.id }
            - &k_enroll_b
              call: "POST /charter/candidates/${cand_b}/program-enrollments"
              payload: { pathway: "WORK_EXPERIENCE", declared_work_months: 48, declared_work_hours: 6000 }
              as: ProgramAdmin
              captures: { enr_b: $.data.id }
            - &k_pay_enr_b
              call: "POST /charter/program-enrollments/${enr_b}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1r}", test_center_id: "${ctr_b1}", exam_date: "2027-03-05", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_rb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-26T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/appointments/${appt_ra}/reschedule"
              payload: { test_center_id: "${ctr_b1}", exam_date: "2027-03-05", expected_appointment_version: "${appt_ra_v}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_RESCHEDULE_DEADLINE_PASSED"
            - "error_id != ERR_NO_SEAT_CAPACITY even though Center B on 2027-03-05 is at capacity 1/1 (temporal priority 9 beats constraint priority 11)"
            - "ExamAppointment.${appt_ra}.exam_date still == \"2027-03-03\" and reschedule_count == 0 (rejection is atomic)"
# === DIFFICULTY PART 3 MARKER ===

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: mps_exact_boundary_pass_fail
        grounds:
          - calculations.mps_pass_determination
          - endpoints.POST_/charter/exam-attempts/{attemptId}/score
          - entities.ExamAttempt.fields.result
        distinguishing_aspect: |
          Numeric threshold metric on the score endpoint: scaled_score == mps (700)
          is PASS (>=, not >) while 699 is FAIL — the boundary value itself is the
          passing side, and two candidates in one window diverge on one point.
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A and B each ENROLLED (35003 paid), each booked W1 LEVEL_I (mps 700) on 2027-03-03 at the cap-2 center and checked in on exam day; clock then 2027-03-16 (window closed)."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_cand_b
            - *k_enroll_b
            - *k_pay_enr_b
            - *k_level1
            - *k_win1
            - *k_ctr2
            - *k_book_a_w1
            - &k_book_b_w1
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_b: $.data.id }
            - *k_clock_mar03
            - *k_checkin_a
            - call: "POST /charter/appointments/${appt_b}/check-in"
              payload: { identity_document_number: "GOV-B-1002", actual_calculator_model: "HP_12C" }
              as: Proctor
            - *k_attempt_a
            - call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_b}" }
              as: ProgramAdmin
              captures: { att_b: "$.data[0].id" }
            - *k_clock_mar16
          trigger:
            - call: "POST /charter/exam-attempts/${att_a}/score"
              payload: { scaled_score: 700 }
              as: ProgramAdmin
              captures: { res_a: $.data.result }
            - call: "GET /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}" }
              as: ProgramAdmin
              captures: { win_mid: "$.data[0].status" }
            - call: "POST /charter/exam-attempts/${att_b}/score"
              payload: { scaled_score: 699 }
              as: ProgramAdmin
              captures: { res_b: $.data.result }
            - call: "GET /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}" }
              as: ProgramAdmin
              captures: { win_end: "$.data[0].status" }
          assert:
            - "res_a == PASS (scaled_score 700 >= mps 700: equality passes)"
            - "res_b == FAIL (699 is one below the MPS)"
            - "after only A scored, win_mid == OPEN (window does not publish until every attempt is SCORED)"
            - "after B scored, win_end == RESULTS_PUBLISHED and both appointments reached COMPLETED (no-show sweep found none still SCHEDULED)"
            - "Candidate.${cand_a}.highest_level_passed_code == LEVEL_I and Candidate.${cand_b}.highest_level_passed_code is null"

      - name: seat_last_available_succeeds_next_fails
        grounds:
          - calculations.seat_capacity_tracking
          - endpoints.POST_/charter/appointments
          - errors.ERR_NO_SEAT_CAPACITY
        distinguishing_aspect: |
          Zero-count edge metric on the booking endpoint (different metric and
          endpoint than the MPS boundary): with daily_seat_capacity == 1 the booking
          that consumes the last seat succeeds, and the next booking for the same
          center+date fails with ERR_NO_SEAT_CAPACITY — while the same center on
          the adjacent date still books, proving the boundary is per (center, date).
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A and B ENROLLED. Center TINY with daily_seat_capacity 1. Window W1."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_cand_b
            - *k_enroll_b
            - *k_pay_enr_b
            - *k_level1
            - *k_win1
            - call: "POST /charter/test-centers"
              payload: { name: "Tiny Center", city: "Metropolis", daily_seat_capacity: 1 }
              as: ProgramAdmin
              captures: { ctr_tiny: $.data.id }
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr_tiny}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_ta: $.data.id, appt_ta_fee: $.data.exam_fee_cents }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr_tiny}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr_tiny}", exam_date: "2027-03-04", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_tb: $.data.id }
          assert:
            - "A's booking succeeds and consumes the single seat (appt_ta_fee == 94000, EARLY tier)"
            - "B's same-center same-date booking is 409 with error_id == ERR_NO_SEAT_CAPACITY (seats_consumed 1 == capacity 1)"
            - "B's booking for 2027-03-04 at the same center succeeds with 201 (the boundary is per center+date, not per center)"
            - "GET /charter/appointments?test_center_id=${ctr_tiny}&booking_status=SCHEDULED returns exactly 2 rows"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_enrolled_enrollment_arc
        grounds:
          - state_machines.ExamAppointment
          - state_machines.ProgramEnrollment.PENDING_PAYMENT_to_ENROLLED
          - validations.priority_8_state (ERR_ENROLLMENT_NOT_ENROLLED)
          - endpoints.POST_/charter/appointments
        distinguishing_aspect: |
          Appointment x ProgramEnrollment pair: the appointment's creatable set is
          gated by the enrollment's state — PENDING_PAYMENT blocks booking, and the
          auto-transition to ENROLLED at zero balance (triggered by the payment, not
          by any appointment call) is what unblocks it.
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A with a PENDING_PAYMENT enrollment (35003 outstanding). LEVEL_I window W1, center cap 2."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_level1
            - *k_win1
            - *k_ctr2
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
              captures: { enr_status: $.data.status }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_ok: $.data.id, appt_ok_fee: $.data.exam_fee_cents }
          assert:
            - "first booking fails 409 ERR_ENROLLMENT_NOT_ENROLLED while enrollment is PENDING_PAYMENT"
            - "the payment response itself shows status == ENROLLED (auto-transition at zero balance, immediate consistency)"
            - "second booking succeeds with 201 and appt_ok_fee == 94000 (EARLY tier at clock 2027-01-05 <= 2027-01-31)"
            - "ProgramEnrollment.${enr_a}.outstanding_balance_cents == 94000 after booking (the exam fee charge posts only on success)"

      - name: membership_join_requires_awarded_charter
        grounds:
          - state_machines.SocietyMembership
          - state_machines.ProgramEnrollment.ENROLLED_to_CHARTER_AWARDED
          - errors.ERR_CHARTER_REQUIRED
          - endpoints.POST_/charter/societies/{societyId}/memberships
        distinguishing_aspect: |
          SocietyMembership x Candidate pair (different pair than Appointment x
          ProgramEnrollment): joining a society is gated on the candidate's
          charter_awarded flag, which only the award-charter gate-chain (levels,
          experience, conduct statement, no open case, zero balance) can set.
        test_recipe:
          setup:
            - "Candidate A has passed all three levels (700/720/740 at MPS 700/720/740), holds an APPROVED submission worth 41 committee months, filed a 2027 conduct statement, zero balance. Society NYSSA-EX (dues 27500) exists. Clock 2027-08-17T00:00:00Z."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_level2
            - *k_level3
            - *k_win1
            - *k_win2
            - *k_win3
            - *k_ctr2
            - *k_book_a_w1
            - *k_pay_fee_a
            - *k_clock_mar03
            - *k_checkin_a
            - *k_attempt_a
            - *k_clock_mar16
            - *k_score_a_700
            - *k_book_a_w2
            - *k_pay_fee_a2
            - *k_clock_may05
            - *k_checkin_a2
            - *k_attempt_a2
            - *k_clock_may18
            - *k_score_a_720
            - *k_book_a_w3
            - *k_pay_fee_a3
            - *k_clock_aug04
            - *k_checkin_a3
            - *k_attempt_a3
            - *k_clock_aug17
            - *k_score_a_740
            - *k_sub_a
            - *k_ref1
            - *k_ref2
            - *k_ref1_verify
            - *k_ref2_verify
            - *k_submit_a
            - *k_review_a_ok
            - *k_pcs_a_2027
            - *k_society
          trigger:
            - call: "POST /charter/societies/${soc}/memberships"
              payload: { candidate_id: "${cand_a}", dues_payment_cents: 27500 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/program-enrollments/${enr_a}/award-charter"
              payload: {}
              as: ProgramAdmin
              captures: { enr_final: $.data.status }
            - call: "POST /charter/societies/${soc}/memberships"
              payload: { candidate_id: "${cand_a}", dues_payment_cents: 27500 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { mem_ok: $.data.id, mem_ok_year: $.data.paid_through_year }
          assert:
            - "join before the award fails 422 ERR_CHARTER_REQUIRED (charter_awarded still false despite all exams passed)"
            - "award succeeds: enr_final == CHARTER_AWARDED and Candidate.${cand_a}.charter_awarded == true"
            - "join after the award succeeds 201 with paid_through_year == 2027 (clock year at join)"
            - "SocietyMembership.${mem_ok}.status == ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_level_window_half_open_overlap
        grounds:
          - validations.priority_11_business_constraint (ERR_WINDOW_OVERLAP)
          - entities.ExamWindow.fields.window_opens_at
          - endpoints.POST_/charter/exam-windows
        distinguishing_aspect: |
          Half-open interval semantics on ExamWindow: windows for the same level
          occupy [opens, closes), so W2 opening exactly when W1 closes is legal
          (adjacency allowed) while W3 opening 12 hours before W1 closes collides.
          Different resource and different interval geometry than the blackout rule.
        test_recipe:
          setup:
            - "Clock 2027-01-05. LEVEL_I exists. W1 occupies [2027-03-01T00:00:00Z, 2027-03-15T00:00:00Z)."
          setup_api_calls:
            - *k_clock_jan05
            - *k_level1
            - *k_win1
          trigger:
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-15T00:00:00Z", window_closes_at: "2027-03-29T00:00:00Z", scheduling_deadline_at: "2027-03-01T00:00:00Z", reschedule_deadline_at: "2027-03-10T00:00:00Z", early_fee_deadline_at: "2027-02-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_adj: $.data.id }
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-14T12:00:00Z", window_closes_at: "2027-03-28T00:00:00Z", scheduling_deadline_at: "2027-03-01T00:00:00Z", reschedule_deadline_at: "2027-03-10T00:00:00Z", early_fee_deadline_at: "2027-02-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}" }
              as: ProgramAdmin
          assert:
            - "the adjacent window (opens == W1.closes) is created with 201 and status OPEN (half-open interval: touching endpoints do not overlap)"
            - "the 2027-03-14T12:00 window is 409 ERR_WINDOW_OVERLAP (its opens falls strictly inside [03-01, 03-15))"
            - "GET /charter/exam-windows?exam_level_id=${lvl1} returns exactly 2 rows (rejected window left no residue)"

      - name: center_blackout_closed_interval_with_buffer
        grounds:
          - validations.priority_11_business_constraint (ERR_CENTER_BLACKOUT_CONFLICT)
          - entities.TestCenter.fields.blackout_windows
          - endpoints.POST_/charter/appointments
        distinguishing_aspect: |
          Closed-interval-plus-buffer semantics on TestCenter (different resource,
          different geometry than the half-open window rule): a blackout of
          [2027-03-05, 2027-03-07] INCLUSIVE plus a 1-day buffer each side blocks
          2027-03-04 through 2027-03-08, so 03-04 is rejected while 03-03 and
          03-09 book cleanly.
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A and B ENROLLED. Window W1. Center BLK cap 2 with blackout_windows [{2027-03-05, 2027-03-07, HVAC maintenance}]."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_cand_b
            - *k_enroll_b
            - *k_pay_enr_b
            - *k_level1
            - *k_win1
            - call: "POST /charter/test-centers"
              payload: { name: "Blackout Center", city: "Metropolis", daily_seat_capacity: 2, blackout_windows: [ { blackout_start_date: "2027-03-05", blackout_end_date: "2027-03-07", reason: "HVAC maintenance" } ] }
              as: ProgramAdmin
              captures: { ctr_blk: $.data.id }
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr_blk}", exam_date: "2027-03-04", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr_blk}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_blk_a: $.data.id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr_blk}", exam_date: "2027-03-09", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_blk_b: $.data.id }
          assert:
            - "booking on 2027-03-04 (one day before the blackout start, inside the buffer) is 409 ERR_CENTER_BLACKOUT_CONFLICT"
            - "booking on 2027-03-03 (two days before start, outside the buffer) succeeds"
            - "booking on 2027-03-09 (one day past the 03-08 buffer edge) succeeds"
            - "GET /charter/appointments?test_center_id=${ctr_blk} returns exactly 2 rows with exam_dates 2027-03-03 and 2027-03-09"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_invariant_book_cancel_pair
        grounds:
          - calculations.seat_capacity_tracking
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED
          - endpoints.POST_/charter/appointments/{appointmentId}/cancel
        distinguishing_aspect: |
          Conserved quantity = seats_consumed per (center, date): the forward action
          (book) paired with its compensating action (cancel) returns
          seats_consumed to its pre-pair value, and capacity headroom is restored
          exactly — demonstrated by a third candidate failing while full and
          succeeding after the cancel. Different quantity than the money invariant.
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A, B, C each ENROLLED. Center DUO cap 2. Window W1. A and B hold the two seats on 2027-03-03; C's booking was rejected."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_cand_b
            - *k_enroll_b
            - *k_pay_enr_b
            - &k_cand_c
              call: "POST /charter/candidates"
              payload: { email: "c.cand@example.com", full_name: "C Candidate", date_of_birth: "1990-01-20", gov_id_number: "GOV-C-1003" }
              as: ProgramAdmin
              captures: { cand_c: $.data.id }
            - &k_enroll_c
              call: "POST /charter/candidates/${cand_c}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2022-06-01" }
              as: ProgramAdmin
              captures: { enr_c: $.data.id }
            - &k_pay_enr_c
              call: "POST /charter/program-enrollments/${enr_c}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - *k_level1
            - *k_win1
            - call: "POST /charter/test-centers"
              payload: { name: "Duo Center", city: "Metropolis", daily_seat_capacity: 2 }
              as: ProgramAdmin
              captures: { ctr_duo: $.data.id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr_duo}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_sa: $.data.id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr_duo}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_sb: $.data.id }
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_c}", exam_window_id: "${win1}", test_center_id: "${ctr_duo}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_c}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/appointments/${appt_sa}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_sa_status: $.data.booking_status }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_c}", exam_window_id: "${win1}", test_center_id: "${ctr_duo}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_c}"
              captures: { appt_sc: $.data.id }
          assert:
            - "C's first booking is 409 ERR_NO_SEAT_CAPACITY (seats_consumed 2 == capacity 2)"
            - "after A's cancel: appt_sa_status == CANCELLED and the (center, 2027-03-03) seats_consumed is back to 1 — the book+cancel pair left the count exactly where it was before A booked"
            - "C's retry succeeds 201 and seats_consumed returns to exactly 2 (headroom restored by 1, not leaked)"
            - "GET /charter/appointments?test_center_id=${ctr_duo}&booking_status=SCHEDULED returns exactly 2 rows"

      - name: net_billed_invariant_book_cancel_pair
        grounds:
          - calculations.enrollment_line_charges
          - calculations.window_cancellation_credit
          - entities.ProgramEnrollment.fields.net_billed_cents
          - entities.ProgramEnrollment.fields.lifetime_credits_posted_cents
        distinguishing_aspect: |
          Conserved quantity = net_billed_cents = lifetime_charges_cents -
          lifetime_credits_posted_cents (money, a different quantity than seats):
          booking posts +94000, and cancelling within the scheduling deadline posts
          the compensating -94000 credit, returning net_billed to exactly its
          pre-booking value 35003 even though intermediate outstanding/credit
          distribution changed.
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A ENROLLED (program fee 35003 paid; net_billed 35003). Window W1, center cap 2."
          setup_api_calls:
            - *k_clock_jan05
            - *k_cand_a
            - *k_enroll_a
            - *k_pay_enr_a
            - *k_level1
            - *k_win1
            - *k_ctr2
          trigger:
            - *k_book_a_w1
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { nb_mid: "$.data[0].net_billed_cents", out_mid: "$.data[0].outstanding_balance_cents" }
            - call: "POST /charter/appointments/${appt_a}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { nb_end: "$.data[0].net_billed_cents", out_end: "$.data[0].outstanding_balance_cents", cred_posted: "$.data[0].lifetime_credits_posted_cents", cred_applied: "$.data[0].lifetime_credits_applied_cents", cred_bal: "$.data[0].credit_balance_cents" }
          assert:
            - "after booking: nb_mid == 129003 (35003 + 94000) and out_mid == 94000"
            - "after cancel within the deadline: nb_end == 35003 — exactly the pre-booking net_billed (invariant restored)"
            - "cred_posted == 94000 and cred_applied == 94000 (the credit fully absorbed the unpaid fee), out_end == 0 and cred_bal == 0"
            - "identity holds end-to-end: outstanding_balance_cents == lifetime_charges_cents - lifetime_payments_cents - lifetime_credits_applied_cents (0 == 129003 - 35003 - 94000)"
