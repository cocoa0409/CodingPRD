            - call: "POST /phases"
              payload: { community_id: "${c4}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 1, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph4: $.data.id }
            - call: "POST /phases/${ph4}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph4}", lot_number: "D1", product_type: "DETACHED", bedrooms: 4, square_feet: 2200 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs7: $.data.id }
            - call: "POST /homesites/${hs7}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-DF-D1", issued_at: "2026-08-01T00:00:00Z" }
