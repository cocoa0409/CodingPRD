# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Gym & Fitness Membership — Expert tier. Walks references/claim-extraction-guide.md
# section-by-section over SCAFFOLD.yaml §1.1–§1.7. Every active instance carries a
# structured, lint-clean test_recipe; corners already covered by a §1.8 instance are
# emitted as excluded_because: stubs (no test_recipe). All names unique across §1.8∪§1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_membership_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.MembershipPlan, endpoints]
        distinguishing_aspect: "POST /membership-plans with all required fields -> 201; response echoes tier=ELITE, monthly_dues_cents=9000, archived=false, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "ELITE", monthly_dues_cents: 9000, included_class_credits: 12, pt_discount_pct: 0.4, contract_term_months: 12, early_termination_fee_cents: 20000, max_freeze_days_per_term: 45, guest_passes_per_cycle: 4 }
              as: StaffManager
              captures: { plan_id: $.data.id }
          assert:
            - "response http_status == 201"
            - "MembershipPlan.${plan_id}.tier == ELITE"
            - "MembershipPlan.${plan_id}.monthly_dues_cents == 9000"
            - "MembershipPlan.${plan_id}.archived == false"
            - "MembershipPlan.${plan_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; no member with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members omitting the required email field -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A plan and location exist; registration payload omits email."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_dues_cents: 5000, included_class_credits: 4, pt_discount_pct: 0.0, contract_term_months: 6, early_termination_fee_cents: 10000, max_freeze_days_per_term: 14, guest_passes_per_cycle: 1 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "No Email", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_member_invalid_plan_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Member.fields.plan_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Registration with a non-existent plan_id FK -> ERR_NOT_FOUND (404) (existence at priority 3 before body validation)."
        test_recipe:
          setup: ["A location exists; plan_id references a non-existent UUID."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { plan_id: "00000000-0000-4000-8000-000000000abc", home_location_id: "${loc_id}", full_name: "Bad FK", email: "badfk@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: duplicate_member_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Member.fields.email, "validations[priority=5]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second member with an email already used by a non-archived member -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A member dup@x.com already registered."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_dues_cents: 5000, included_class_credits: 4, pt_discount_pct: 0.0, contract_term_months: 6, early_termination_fee_cents: 10000, max_freeze_days_per_term: 14, guest_passes_per_cycle: 1 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "First", email: "dup@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Second", email: "dup@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_DUPLICATE_EMAIL"

      - name: member_system_fields_generated_on_register
        claim_type: System Fields
        grounds: [entities.Member.fields.membership_status, entities.Member.fields.dues_status, entities.Member.fields.contract_status]
        distinguishing_aspect: "On register the server sets membership_status=PENDING, dues_status=CURRENT, contract_status=IN_COOLING_OFF, version=1; client cannot override them."
        test_recipe:
          setup: ["A plan and location exist; clock pinned."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
          trigger:
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Fresh", email: "fresh@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
          assert:
            - "Member.${m}.membership_status == PENDING"
            - "Member.${m}.dues_status == CURRENT"
            - "Member.${m}.contract_status == IN_COOLING_OFF"
            - "Member.${m}.version == 1"

      - name: checkin_is_immutable_event_member_actor_kind
        claim_type: Immutability
        grounds: [entities.CheckIn, entities.CheckIn.fields.actor_kind]
        distinguishing_aspect: "CheckIn is common_fields:false (event log): created via POST /check-ins with actor_kind derived MEMBER, no version field; only closable via checkout."
        test_recipe:
          setup: ["A member ACTIVE checks in."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Ci Member", email: "ci@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m}" }
              as: StaffManager
              captures: { inv: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${m}", location_id: "${loc_id}" }
              as: StaffManager
              captures: { ci: $.data.id, ak: $.data.actor_kind }
          assert:
            - "CheckIn.${ci}.status == OPEN"
            - "CheckIn.${ci}.actor_kind == MEMBER"
            - "Location.${loc_id}.current_occupancy == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_member_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Member.membership_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a member already ACTIVE (not PENDING) -> ERR_INVALID_STATE (409); membership_status unchanged."
        test_recipe:
          setup: ["Member already ACTIVE (joining invoice paid + activated)."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Active Member", email: "act2@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m}" }
              as: StaffManager
              captures: { inv: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Member.${m}.membership_status == ACTIVE"

      - name: activate_before_invoice_paid_returns_activation_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.membership_status.PENDING_to_ACTIVE, "validations[priority=9]", "errors[ERR_ACTIVATION_NOT_PAID]"]
        distinguishing_aspect: "Activating a PENDING member whose joining invoice is still OPEN -> ERR_ACTIVATION_NOT_PAID (409)."
        test_recipe:
          setup: ["Member PENDING; joining invoice NOT paid."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Unpaid", email: "unpaid@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
          trigger:
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_ACTIVATION_NOT_PAID"
            - "Member.${m}.membership_status == PENDING"

      - name: cancel_already_cancelled_member_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Member.membership_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on an already-CANCELLED member -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member ACTIVE then CANCELLED once."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Cancel Twice", email: "ct@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m}" }
              as: StaffManager
              captures: { inv: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/cancel"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m}/cancel"
              payload: {}
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: freeze_blocked_when_suspended
        claim_type: guarded transitions
        grounds: [state_machines.Member.membership_status.ACTIVE_to_FROZEN, "validations[priority=8]", "errors[ERR_FREEZE_BLOCKED_BY_DUES]"]
        distinguishing_aspect: "ACTIVE->FROZEN guarded by dues axis: a SUSPENDED member cannot be frozen -> ERR_FREEZE_BLOCKED_BY_DUES (409)."
        test_recipe:
          setup: ["Member ACTIVE then driven SUSPENDED via unpaid invoice + 30-day sweep."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Susp Freeze", email: "sf@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m}" }
              as: StaffManager
              captures: { inv: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /dues-invoices"
              payload: { member_id: "${m}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", due_date: "2026-07-01T00:00:00Z" }
              as: StaffManager
              captures: { inv2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StaffManager
            - call: "POST /_clock/advance_dues"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m}/freeze"
              payload: { freeze_days: 5 }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "Member.${m}.dues_status == SUSPENDED"
            - "response http_status == 409"
            - "response data.error_id == ERR_FREEZE_BLOCKED_BY_DUES"

      - name: freeze_cap_exceeded_returns_conflict
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.membership_status.ACTIVE_to_FROZEN, "validations[priority=16]", "errors[ERR_FREEZE_CAP_EXCEEDED]"]
        distinguishing_aspect: "Requesting freeze_days that pushes cumulative_freeze_days over plan.max_freeze_days_per_term (14) -> ERR_FREEZE_CAP_EXCEEDED (409)."
        test_recipe:
          setup: ["Plan BASIC max_freeze_days_per_term 14. Member ACTIVE, cumulative_freeze_days 0. Requests 20 days."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_dues_cents: 5000, included_class_credits: 4, pt_discount_pct: 0.0, contract_term_months: 6, early_termination_fee_cents: 10000, max_freeze_days_per_term: 14, guest_passes_per_cycle: 1 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Freeze Cap", email: "fc@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m}" }
              as: StaffManager
              captures: { inv: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m}/activate"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m}/freeze"
              payload: { freeze_days: 20 }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_FREEZE_CAP_EXCEEDED"
            - "Member.${m}.membership_status == ACTIVE"
            - "Member.${m}.cumulative_freeze_days == 0"

      - name: session_complete_marks_booked_no_show_and_waitlisted_cancelled
        claim_type: Side Effect Execution
        grounds: [state_machines.ClassSession.SCHEDULED_to_COMPLETED, state_machines.Booking.BOOKED_to_NO_SHOW, entities.Booking.fields.status]
        distinguishing_aspect: "Completing a session after ends_at: a still-BOOKED booking -> NO_SHOW (credit forfeited, not restored, member stays at 7); a WAITLISTED booking -> CANCELLED."
        test_recipe:
          setup: ["Capacity-1/waitlist-1 session that has ended. m_a BOOKED (credits 7 after booking), m_b WAITLISTED. Clock past ends_at."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L1", occupancy_cap: 20 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "NS A", email: "nsa@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_a: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_a}" }
              as: StaffManager
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_a}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_a}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /members"
