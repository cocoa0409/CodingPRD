            - call: "POST /cfs/production-batches"
              payload: { facility_id: "${facility_id}", meal_forecast_id: "${forecast_id}", recipe_component: "Turkey Casserole", planned_trays: 10, scheduled_cook_start_at: "2026-08-01T04:00:00Z", service_site: "MAIN_KITCHEN", expected_facility_version: "${fresh_fv}" }
              as: FoodServiceSupervisor
