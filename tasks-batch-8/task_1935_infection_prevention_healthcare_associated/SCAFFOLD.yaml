# =============================================================================
# Task 1935 — Infection Prevention & Healthcare-Associated Infection Surveillance
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1935. Infection Prevention & Healthcare-Associated Infection Surveillance (hospital infection prevention): surveillance definition application (CLABSI/CAUTI/SSI) & case adjudication, denominator (device-day) collection, NHSN submission & standardized infection ratio, outbreak detection & cluster investigation, isolation precaution ordering & compliance audit, hand hygiene observation program, employee exposure follow-up, corrective action & unit feedback

domain_name: infection-prevention-surveillance
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: compound    # per-entity machines + Unit posture_driven aggregate gating
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic          # CorrectiveActionPlan.source_ref_id references several entity types
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: nhsn_org_id, type: string, source: input, description: "NHSN organization identifier; unique across facilities" }
      - { name: clabsi_baseline_per_1000, type: number, source: input, description: "Predicted CLABSI events per 1000 central-line days used as SIR denominator" }
      - { name: cauti_baseline_per_1000, type: number, source: input, description: "Predicted CAUTI events per 1000 urinary-catheter days" }
      - { name: ssi_baseline_per_procedure, type: number, source: input, description: "Predicted SSI events per risk-weighted surgical procedure" }
      - { name: sir_high_threshold, type: number, source: input, default: 1.25, description: "SIR >= this threshold flags a MonthlySummary sir_flag HIGH" }
      - { name: hh_min_opportunities, type: integer, source: input, default: 30, description: "Minimum hand-hygiene opportunities per unit-month for a reportable rate" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: name, type: string, source: input, description: "Unit display name" }
      - { name: unit_type, type: enum, source: input, description: "ICU | WARD | STEP_DOWN | OR" }
      - { name: nhsn_location_code, type: string, source: input, description: "NHSN location mapping code; unique within facility" }
      - { name: surveillance_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | ELEVATED | OUTBREAK. OUTBREAK if any OutbreakInvestigation for this unit has status CONFIRMED; else ELEVATED if any investigation is TRIGGERED or any CorrectiveActionPlan has status in {ACTIVE, VERIFICATION_PENDING, ESCALATED}; else NORMAL. Recomputed on every investigation/CAP mutation; increments Unit.version." }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique" }
      - { name: admitted_at, type: datetime, source: input, description: "Admission timestamp (UTC); admission calendar date counts as day 1 for the HAI day rule" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; initial inpatient unit" }
      - { name: current_unit_id, type: string, source: computed, description: "FK -> Unit.id; current unit from latest unit_stays entry with departed_at null" }
      - { name: unit_stays, type: array, source: system, description: "Array of {unit_id, arrived_at, departed_at} stays, half-open [arrived_at, departed_at); departed_at null while active. Seeded at creation with {unit_id, admitted_at, null}; appended by transfer; closed by transfer/discharge." }
      - { name: discharged_at, type: datetime, source: system, description: "Set by discharge; null while ADMITTED" }
      - { name: status, type: enum, source: system, description: "ADMITTED | DISCHARGED" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee identifier" }
      - { name: role_title, type: string, source: input, description: "Job title (free text)" }
      - { name: home_unit_id, type: string, source: input, description: "FK -> Unit.id; primary work unit" }

  - name: DeviceEpisode
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient carrying the device" }
      - { name: unit_id, type: string, source: computed, description: "FK -> Unit.id; patient's current_unit_id at creation (device attribution unit)" }
      - { name: device_type, type: enum, source: input, description: "CENTRAL_LINE | URINARY_CATHETER | VENTILATOR" }
      - { name: placed_at, type: datetime, source: input, description: "Placement timestamp (UTC)" }
      - { name: removed_at, type: datetime, source: system, description: "Set by remove action; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED" }

  - name: SurgicalProcedure
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: unit_id, type: string, source: computed, description: "FK -> Unit.id; patient's current_unit_id at creation (operating unit)" }
      - { name: procedure_code, type: string, source: input, description: "NHSN operative procedure code (free text)" }
      - { name: performed_at, type: datetime, source: input, description: "Procedure start timestamp (UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Procedure length in whole minutes; must be >= 1. Occupied interval is CLOSED [performed_at, performed_at + duration_minutes]." }
      - { name: asa_score, type: integer, source: input, description: "ASA physical status 1..5" }
      - { name: wound_class, type: enum, source: input, description: "CLEAN | CLEAN_CONTAMINATED | CONTAMINATED | DIRTY" }
      - { name: implant, type: boolean, source: input, default: false, description: "True if implant placed; extends SSI surveillance window to 90 days" }

  - name: InfectionCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: unit_id, type: string, source: computed, description: "FK -> Unit.id; patient's current_unit_id at creation; RE-ATTRIBUTED on ADJUDICATED_HAI via date-of-event unit attribution rule" }
      - { name: case_type, type: enum, source: input, description: "CLABSI | CAUTI | SSI | OTHER_BSI" }
      - { name: suspected_organism, type: string, source: input, description: "Organism name; cluster matching is case-insensitive exact string" }
      - { name: first_positive_specimen_at, type: datetime, source: input, description: "Collection timestamp of first positive specimen; anchor of the infection window period" }
      - { name: surgical_procedure_id, type: string, source: input, description: "FK -> SurgicalProcedure.id; REQUIRED iff case_type == SSI, else must be absent/null (ERR_INVALID_REQUEST)" }
      - { name: linked_device_episode_id, type: string, source: input, description: "FK -> DeviceEpisode.id; REQUIRED iff case_type in {CLABSI, CAUTI}, else must be absent/null (ERR_INVALID_REQUEST)" }
      - { name: infection_window_start, type: datetime, source: computed, description: "first_positive_specimen_at minus 3 calendar days, at 00:00:00Z" }
      - { name: infection_window_end, type: datetime, source: computed, description: "first_positive_specimen_at plus 3 calendar days, at 23:59:59Z" }
      - { name: date_of_event, type: datetime, source: system, description: "Set at ADJUDICATED_HAI from adjudication payload; must fall inside [infection_window_start, infection_window_end]" }
      - { name: is_hai, type: boolean, source: computed, description: "True once ADJUDICATED_HAI (the HAI day rule is enforced as an adjudication precondition); false/null otherwise" }
      - { name: rit_blocked_until, type: datetime, source: system, description: "date_of_event + 13 calendar days at 23:59:59Z; set on ADJUDICATED_HAI; cleared on reopen" }
      - { name: ssi_depth, type: enum, source: input, description: "SURFACE | DEEP | ORGAN_SPACE; required iff adjudicating an SSI case to ADJUDICATED_HAI" }
      - { name: status, type: enum, source: system, description: "SUSPECTED | UNDER_REVIEW | ADJUDICATED_HAI | RULED_OUT | REOPENED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicator" }
      - { name: adjudication_rationale, type: string, source: input, description: "Free-text rationale supplied at adjudication (>= 10 chars)" }

  - name: DeviceDayCount
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: count_date, type: datetime, source: input, description: "Calendar date (UTC midnight-normalized) this denominator row covers" }
      - { name: central_line_days, type: integer, source: input, description: ">= 0 and <= patient_days" }
      - { name: urinary_catheter_days, type: integer, source: input, description: ">= 0 and <= patient_days" }
      - { name: ventilator_days, type: integer, source: input, description: ">= 0 and <= patient_days" }
      - { name: patient_days, type: integer, source: input, description: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED. LOCKED while the covering MonthlySummary (same unit, month of count_date) is SUBMITTED or ACCEPTED; returns to DRAFT when that summary is REJECTED or amended to UNDER_AMENDMENT." }

  - name: MonthlySummary
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: month, type: string, source: input, description: "Calendar month 'YYYY-MM' (UTC)" }
      - { name: central_line_days, type: integer, source: computed, description: "Sum of DeviceDayCount.central_line_days for unit + count_date in month" }
      - { name: urinary_catheter_days, type: integer, source: computed, description: "Sum of DeviceDayCount.urinary_catheter_days for unit + month" }
      - { name: ventilator_days, type: integer, source: computed, description: "Sum of DeviceDayCount.ventilator_days for unit + month" }
      - { name: patient_days_total, type: integer, source: computed, description: "Sum of DeviceDayCount.patient_days for unit + month" }
      - { name: procedure_count, type: integer, source: computed, description: "Count of SurgicalProcedure rows for unit with performed_at in month" }
      - { name: clabsi_count, type: integer, source: computed, description: "Cases: unit_id == summary.unit, case_type == CLABSI, status == ADJUDICATED_HAI, date_of_event calendar date within month" }
      - { name: cauti_count, type: integer, source: computed, description: "Same shape as clabsi_count for CAUTI" }
      - { name: ssi_count, type: integer, source: computed, description: "Same shape as clabsi_count for SSI" }
      - { name: provisional_clabsi_count, type: integer, source: computed, description: "clabsi_count + cases with status == UNDER_REVIEW and first_positive_specimen_at date within month (provisional variant)" }
      - { name: provisional_cauti_count, type: integer, source: computed, description: "Provisional variant for CAUTI" }
      - { name: provisional_ssi_count, type: integer, source: computed, description: "Provisional variant for SSI" }
      - { name: predicted_clabsi, type: number, source: computed, description: "facility.clabsi_baseline_per_1000 * central_line_days / 1000, rounded 3dp half-up" }
      - { name: predicted_cauti, type: number, source: computed, description: "facility.cauti_baseline_per_1000 * urinary_catheter_days / 1000, rounded 3dp half-up" }
      - { name: predicted_ssi, type: number, source: computed, description: "facility.ssi_baseline_per_procedure * SUM(risk_weight(procedure)) over unit-month procedures, rounded 3dp half-up" }
      - { name: sir_clabsi, type: number, source: computed, description: "clabsi_count / predicted_clabsi rounded 3dp half-up; NULL when predicted_clabsi < 1.0 (NHSN not-calculated rule)" }
      - { name: sir_cauti, type: number, source: computed, description: "cauti_count / predicted_cauti; NULL when predicted_cauti < 1.0" }
      - { name: sir_ssi, type: number, source: computed, description: "ssi_count / predicted_ssi; NULL when predicted_ssi < 1.0" }
      - { name: provisional_sir_clabsi, type: number, source: computed, description: "provisional_clabsi_count / predicted_clabsi; NULL when predicted_clabsi < 1.0" }
      - { name: provisional_sir_cauti, type: number, source: computed, description: "provisional variant for CAUTI" }
      - { name: provisional_sir_ssi, type: number, source: computed, description: "provisional variant for SSI" }
      - { name: sir_flag, type: enum, source: computed, description: "HIGH if any calculable SIR >= facility.sir_high_threshold; NORMAL if at least one SIR calculable and all below threshold; NOT_CALCULATED if no SIR calculable" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | ACCEPTED | REJECTED | UNDER_AMENDMENT" }
      - { name: amendment_count, type: integer, source: computed, default: 0, description: "Increments by 1 on each ACCEPTED -> UNDER_AMENDMENT amend transition" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID at latest submit" }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID at accept; must differ from submitted_by_user_id" }

  - name: OutbreakInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: organism, type: string, source: input, description: "Cluster organism; case-insensitive exact match key" }
      - { name: origin, type: enum, source: system, description: "AUTO_THRESHOLD | MANUAL" }
      - { name: detection_window_start, type: datetime, source: computed, description: "Trigger clock date minus 13 calendar days, 00:00:00Z (14-day rolling window, inclusive)" }
      - { name: detection_window_end, type: datetime, source: computed, description: "Trigger clock date, 23:59:59Z" }
      - { name: trigger_case_ids, type: array, source: system, description: "Ordered list of contributing InfectionCase ids captured at creation: ADJUDICATED_HAI cases for this unit + organism with date_of_event inside detection window, sorted by date_of_event ASC then created_at ASC" }
      - { name: contributing_case_count, type: integer, source: computed, description: "length(trigger_case_ids), snapshot fixed at creation" }
      - { name: status, type: enum, source: system, description: "TRIGGERED | CONFIRMED | RULED_OUT | CLOSED" }

  - name: IsolationOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient must be ADMITTED" }
      - { name: unit_id, type: string, source: computed, description: "FK -> Unit.id; patient's current_unit_id at creation" }
      - { name: precaution_type, type: enum, source: input, description: "CONTACT | DROPLET | AIRBORNE" }
      - { name: ordered_by_user_id, type: string, source: system, description: "X-User-ID of ordering InfectionPreventionist" }
      - { name: ordered_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: started_at, type: datetime, source: system, description: "Set by start action" }
      - { name: discontinued_at, type: datetime, source: system, description: "Set by discontinue action" }
      - { name: status, type: enum, source: system, description: "ORDERED | ACTIVE | DISCONTINUED (independent axis)" }
      - { name: compliance_status, type: enum, source: system, description: "NOT_AUDITED | COMPLIANT | NON_COMPLIANT (independent parallel axis); set from latest IsolationComplianceAudit by observed_at (tie: latest created_at); never reset by status-axis transitions" }

  - name: IsolationComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: isolation_order_id, type: string, source: input, description: "FK -> IsolationOrder.id; order must be ACTIVE" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of auditing UnitNurseManager" }
      - { name: observed_at, type: datetime, source: input, description: "Observation timestamp (UTC)" }
      - { name: elements_checked, type: integer, source: input, description: ">= 1" }
      - { name: elements_passed, type: integer, source: input, description: ">= 0 and <= elements_checked (ERR_AUDIT_ELEMENTS_INVALID)" }
      - { name: compliance_pct, type: number, source: computed, description: "elements_passed / elements_checked * 100, rounded 1 decimal round_half_up" }
      - { name: outcome, type: enum, source: computed, description: "COMPLIANT when compliance_pct >= 90.0; NON_COMPLIANT otherwise" }

  - name: HandHygieneObservation
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: observer_user_id, type: string, source: system, description: "X-User-ID of observing UnitNurseManager" }
      - { name: observed_at, type: datetime, source: input, description: "Observation timestamp (UTC); month membership is by UTC calendar date" }
      - { name: opportunity_type, type: enum, source: input, description: "BEFORE_PATIENT_CONTACT | AFTER_PATIENT_CONTACT | ASEPTIC_TASK | BODY_FLUID_RISK | AFTER_SURROUNDINGS" }
      - { name: action, type: enum, source: input, description: "COMPLIANT | MISSED" }

  - name: EmployeeExposure
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: source_patient_id, type: string, source: input, description: "FK -> Patient.id; may be null when source unknown" }
      - { name: exposure_type, type: enum, source: input, description: "PERCUTANEOUS | MUCOUS_MEMBRANE | SKIN" }
      - { name: occurred_at, type: datetime, source: input, description: "Exposure timestamp (UTC); anchors all draw due dates" }
      - { name: source_hbv_status, type: enum, source: input, description: "UNKNOWN | NEGATIVE | POSITIVE; set at creation, updated by record-source-serologies" }
      - { name: source_hcv_status, type: enum, source: input, description: "UNKNOWN | NEGATIVE | POSITIVE" }
      - { name: source_hiv_status, type: enum, source: input, description: "UNKNOWN | NEGATIVE | POSITIVE" }
      - { name: recorded_stages, type: array, source: system, description: "Ordered list of {stage, drawn_at, result}; stages must be recorded strictly in order BASELINE -> WEEK_6 -> WEEK_12 -> WEEK_24" }
      - { name: next_draw_due_at, type: datetime, source: computed, description: "Due timestamp of the next unrecorded stage (BASELINE: occurred_at + 72h; WEEK_6: +42d; WEEK_12: +84d; WEEK_24: +168d); null when COMPLETED or LOST_TO_FOLLOWUP" }
      - { name: current_stage_overdue, type: boolean, source: computed, description: "True at read time when logical clock > next_draw_due_at and status in {REPORTED, SOURCE_EVALUATED, BASELINE_COMPLETE, FOLLOWUP_IN_PROGRESS}" }
      - { name: status, type: enum, source: system, description: "REPORTED | SOURCE_EVALUATED | BASELINE_COMPLETE | FOLLOWUP_IN_PROGRESS | COMPLETED | LOST_TO_FOLLOWUP" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit the plan corrects" }
      - { name: source_type, type: enum, source: input, description: "OUTBREAK | ISOLATION_AUDIT | HAND_HYGIENE | SIR_HIGH" }
      - { name: source_ref_id, type: string, source: input, description: "Polymorphic reference id, existence-checked per source_type: OUTBREAK -> OutbreakInvestigation.id (must be CONFIRMED); ISOLATION_AUDIT -> IsolationComplianceAudit.id; SIR_HIGH -> MonthlySummary.id; HAND_HYGIENE -> Unit.id. Violations raise ERR_CAP_SOURCE_INVALID. System-set on auto-created CAPs." }
      - { name: description, type: string, source: input, description: "Corrective plan narrative (>= 10 chars); system-generated for auto-created CAPs" }
      - { name: due_date, type: datetime, source: input, description: "Completion due date (UTC); audit-cascade CAPs set observed_at + 14 days" }
      - { name: evidence_notes, type: string, source: input, description: ">= 20 chars; supplied at submit-for-verification" }
      - { name: failure_count, type: integer, source: computed, default: 0, description: "Increments on each fail-verification; reaching 2 forces ESCALATED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; 'system' for auto-created CAPs (audit cascade)" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying director" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | VERIFICATION_PENDING | VERIFIED | ESCALATED. Auto-created CAPs start at ACTIVE. Statuses {ACTIVE, VERIFICATION_PENDING, ESCALATED} drive unit posture ELEVATED." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InfectionCase
    initial_state: SUSPECTED
    terminal_states: []
    note: "Cyclic machine: ADJUDICATED_HAI and RULED_OUT are soft-terminal (reopenable). Every mutation increments version."
    transitions:
      - from: SUSPECTED
        to: UNDER_REVIEW
        trigger: "POST /api/infection-cases/{id}/begin-review"
        actor: InfectionPreventionist
        preconditions:
          - "status == SUSPECTED or REOPENED (ERR_CASE_NOT_REVIEWABLE)"
        side_effects: []

      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /api/infection-cases/{id}/begin-review"
        actor: InfectionPreventionist
        preconditions:
          - "status == SUSPECTED or REOPENED (ERR_CASE_NOT_REVIEWABLE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: ADJUDICATED_HAI
        trigger: "POST /api/infection-cases/{id}/adjudicate with outcome=ADJUDICATED_HAI, date_of_event, rationale, ssi_depth iff SSI"
        actor: InfectionPreventionist
        preconditions:
          - "status == UNDER_REVIEW (ERR_CASE_NOT_ADJUDICATABLE)"
          - "date_of_event present and inside [infection_window_start, infection_window_end] (ERR_DOE_OUTSIDE_IWP)"
          - "HAI day rule: calendar_date(date_of_event) >= calendar_date(patient.admitted_at) + 2 days (ERR_DOE_NOT_HAI_DAY_RULE)"
          - "SSI window when case_type == SSI: calendar_date(date_of_event) <= calendar_date(procedure.performed_at) + (WINDOW-1) days, WINDOW = 90 if procedure.implant else 30 (ERR_SSI_WINDOW_EXPIRED)"
          - "Device day rule when case_type in {CLABSI, CAUTI}: linked episode placed calendar date <= calendar_date(date_of_event) - 2 days AND episode covers date_of_event (placed_at <= date_of_event AND (removed_at is null OR removed_at >= date_of_event)) (ERR_DEVICE_DAY_RULE_NOT_MET)"
          - "Covering MonthlySummary (case unit at attribution, month of date_of_event) — if it exists, its status must be in {OPEN, REJECTED, UNDER_AMENDMENT} (ERR_SUMMARY_LOCKED)"
        side_effects:
          - "set date_of_event, is_hai = true, rit_blocked_until = date_of_event + 13 days 23:59:59Z, adjudicated_by_user_id, adjudication_rationale"
          - "Unit attribution: unit_id := unit of the patient stay covering date_of_event under the transfer-out rule (see calculation date_of_event_unit_attribution)"
          - "Recompute covering MonthlySummary (if any, status in {OPEN, REJECTED, UNDER_AMENDMENT}) observed + provisional counts, predicted, SIR fields, sir_flag; increments its version"
          - "Cluster recompute: run calculation outbreak_cluster_detection for (attributed unit, suspected_organism); on threshold crossing system-creates an OutbreakInvestigation (status TRIGGERED, origin AUTO_THRESHOLD) capturing trigger_case_ids"
          - "That investigation creation then recomputes Unit.surveillance_posture (TRIGGERED investigation drives ELEVATED), incrementing Unit.version"

      - from: UNDER_REVIEW
        to: RULED_OUT
        trigger: "POST /api/infection-cases/{id}/adjudicate with outcome=RULED_OUT, rationale"
        actor: InfectionPreventionist
        preconditions:
          - "status == UNDER_REVIEW (ERR_CASE_NOT_ADJUDICATABLE)"
        side_effects:
          - "set adjudicated_by_user_id, adjudication_rationale; is_hai = false; date_of_event and rit_blocked_until remain null"

      - from: ADJUDICATED_HAI
        to: REOPENED
        trigger: "POST /api/infection-cases/{id}/reopen with reason (>= 10 chars)"
        actor: InfectionPreventionist
        preconditions:
          - "status in {ADJUDICATED_HAI, RULED_OUT} (ERR_CASE_NOT_REOPENABLE)"
          - "Covering MonthlySummary (by date_of_event month for ADJUDICATED_HAI; by first_positive_specimen_at month for RULED_OUT) — if it exists, status must be in {OPEN, REJECTED, UNDER_AMENDMENT} (ERR_SUMMARY_LOCKED)"
        side_effects:
          - "clear date_of_event, is_hai, rit_blocked_until (set null)"
          - "Recompute covering MonthlySummary (if any and mutable) counts/SIR/sir_flag; increments its version"
          - "Unit.surveillance_posture unchanged by reopen (investigations are not auto-removed)"

      - from: RULED_OUT
        to: REOPENED
        trigger: "POST /api/infection-cases/{id}/reopen with reason (>= 10 chars)"
        actor: InfectionPreventionist
        preconditions:
          - "status in {ADJUDICATED_HAI, RULED_OUT} (ERR_CASE_NOT_REOPENABLE)"
        side_effects: []

  - entity: MonthlySummary
    initial_state: OPEN
    terminal_states: []
    note: "Branching machine with revert + amendment cycle. ACCEPTED is soft-terminal: amend reopens it. All recompute side effects increment version."
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /api/monthly-summaries/{id}/submit"
        actor: InfectionPreventionist
        preconditions:
          - "status in {OPEN, REJECTED, UNDER_AMENDMENT} (ERR_SUMMARY_NOT_SUBMITTABLE)"
          - "Unit.surveillance_posture != OUTBREAK for the summary's unit (ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION)"
        side_effects:
          - "set submitted_by_user_id from X-User-ID"
          - "Cascade down: every DeviceDayCount row for (unit, month) -> LOCKED"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/monthly-summaries/{id}/submit"
        actor: InfectionPreventionist
        preconditions:
          - "status in {OPEN, REJECTED, UNDER_AMENDMENT} (ERR_SUMMARY_NOT_SUBMITTABLE)"
          - "Unit.surveillance_posture != OUTBREAK (ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION)"
        side_effects:
          - "set submitted_by_user_id"
          - "Cascade down: DeviceDayCount rows for (unit, month) -> LOCKED"

      - from: UNDER_AMENDMENT
        to: SUBMITTED
        trigger: "POST /api/monthly-summaries/{id}/submit"
        actor: InfectionPreventionist
        preconditions:
          - "status in {OPEN, REJECTED, UNDER_AMENDMENT} (ERR_SUMMARY_NOT_SUBMITTABLE)"
          - "Unit.surveillance_posture != OUTBREAK (ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION)"
        side_effects:
          - "set submitted_by_user_id"
          - "Cascade down: DeviceDayCount rows for (unit, month) -> LOCKED"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/monthly-summaries/{id}/accept"
        actor: InfectionControlDirector
        preconditions:
          - "status == SUBMITTED (ERR_SUMMARY_NOT_REVIEWABLE)"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "set accepted_by_user_id"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/monthly-summaries/{id}/reject with reason"
        actor: InfectionControlDirector
        preconditions:
          - "status == SUBMITTED (ERR_SUMMARY_NOT_REVIEWABLE)"
        side_effects:
          - "Compensation: DeviceDayCount rows for (unit, month) revert LOCKED -> DRAFT"

      - from: ACCEPTED
        to: UNDER_AMENDMENT
        trigger: "POST /api/monthly-summaries/{id}/amend with reason"
        actor: InfectionPreventionist
        preconditions:
          - "status == ACCEPTED (ERR_SUMMARY_NOT_AMENDABLE)"
        side_effects:
          - "amendment_count += 1"
          - "clear submitted_by_user_id / accepted_by_user_id to null"
          - "Compensation: DeviceDayCount rows for (unit, month) revert LOCKED -> DRAFT"

  - entity: OutbreakInvestigation
    initial_state: TRIGGERED
    terminal_states: [CLOSED]
    transitions:
      - from: TRIGGERED
        to: CONFIRMED
        trigger: "POST /api/outbreak-investigations/{id}/confirm"
        actor: InfectionControlDirector
        preconditions:
          - "status == TRIGGERED (ERR_OUTBREAK_NOT_CONFIRMABLE)"
          - "contributing_case_count >= 1 (at least one linked ADJUDICATED_HAI case) (ERR_OUTBREAK_EMPTY_CLUSTER)"
        side_effects:
          - "Unit.surveillance_posture recompute: a CONFIRMED investigation drives OUTBREAK; increments Unit.version"

      - from: TRIGGERED
        to: RULED_OUT
        trigger: "POST /api/outbreak-investigations/{id}/rule-out with reason"
        actor: InfectionControlDirector
        preconditions:
          - "status == TRIGGERED (ERR_OUTBREAK_NOT_CONFIRMABLE)"
        side_effects:
          - "Unit.surveillance_posture recompute (may drop ELEVATED -> NORMAL when no other drivers)"

      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /api/outbreak-investigations/{id}/close"
        actor: InfectionControlDirector
        preconditions:
          - "status in {CONFIRMED, RULED_OUT} (ERR_OUTBREAK_NOT_CLOSABLE)"
          - "When closing from CONFIRMED: at least one CorrectiveActionPlan with source_type == OUTBREAK and source_ref_id == this investigation id and status == VERIFIED (ERR_OUTBREAK_CLOSE_BLOCKED)"
        side_effects:
          - "Unit.surveillance_posture recompute (OUTBREAK clears when no other CONFIRMED investigation remains)"

      - from: RULED_OUT
        to: CLOSED
        trigger: "POST /api/outbreak-investigations/{id}/close"
        actor: InfectionControlDirector
        preconditions:
          - "status in {CONFIRMED, RULED_OUT} (ERR_OUTBREAK_NOT_CLOSABLE)"
        side_effects:
          - "Unit.surveillance_posture recompute"

  - entity: IsolationOrder
    initial_state: "status=ORDERED, compliance_status=NOT_AUDITED"
    terminal_states: ["status=DISCONTINUED (compliance axis terminal-agnostic)"]
    note: "PARALLEL state dimensions: status (ORDERED->ACTIVE->DISCONTINUED) evolves independently of compliance_status (NOT_AUDITED->COMPLIANT|NON_COMPLIANT, last-audit-wins). Discontinuing does not reset compliance_status."
    transitions:
      - from: ORDERED
        to: ACTIVE
        trigger: "POST /api/isolation-orders/{id}/start"
        actor: UnitNurseManager
        preconditions:
          - "status == ORDERED (ERR_ISOLATION_ORDER_NOT_STARTABLE)"
        side_effects:
          - "set started_at"

      - from: ORDERED
        to: DISCONTINUED
        trigger: "POST /api/isolation-orders/{id}/discontinue"
        actor: UnitNurseManager
        preconditions:
          - "status in {ORDERED, ACTIVE} (ERR_ISOLATION_ALREADY_DISCONTINUED)"
        side_effects:
          - "set discontinued_at; compliance_status left unchanged"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/isolation-orders/{id}/discontinue"
        actor: UnitNurseManager
        preconditions:
          - "status in {ORDERED, ACTIVE} (ERR_ISOLATION_ALREADY_DISCONTINUED)"
        side_effects:
          - "set discontinued_at; compliance_status left unchanged"

      - from: "compliance_status any (order ACTIVE)"
        to: "compliance_status = outcome of latest audit"
        trigger: "POST /api/isolation-compliance-audits"
        actor: UnitNurseManager
        preconditions:
          - "isolation order status == ACTIVE (ERR_ISOLATION_ORDER_NOT_ACTIVE)"
        side_effects:
          - "IsolationOrder.compliance_status := audit.outcome (last-audit-wins by observed_at, tie latest created_at)"
          - "When audit.outcome == NON_COMPLIANT, that order-field mutation then system-creates a CorrectiveActionPlan (unit = order.unit_id, source_type = ISOLATION_AUDIT, source_ref_id = audit id, description system-generated, due_date = observed_at + 14 days, created_by_user_id = 'system', status ACTIVE)"
          - "That CAP creation then recomputes Unit.surveillance_posture (ACTIVE CAP drives ELEVATED), incrementing Unit.version"

  - entity: EmployeeExposure
    initial_state: REPORTED
    terminal_states: [COMPLETED, LOST_TO_FOLLOWUP]
    transitions:
      - from: REPORTED
        to: SOURCE_EVALUATED
        trigger: "POST /api/employee-exposures/{id}/record-source-serologies"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == REPORTED (ERR_EXPOSURE_INVALID_STAGE)"
        side_effects:
          - "update source_hbv_status / source_hcv_status / source_hiv_status from payload"

      - from: SOURCE_EVALUATED
        to: BASELINE_COMPLETE
        trigger: "POST /api/employee-exposures/{id}/record-draw with stage=BASELINE"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == SOURCE_EVALUATED (ERR_EXPOSURE_INVALID_STAGE)"
          - "drawn_at <= occurred_at + 72h (ERR_BASELINE_WINDOW_MISSED)"
        side_effects:
          - "append {stage: BASELINE, drawn_at, result} to recorded_stages"
          - "status then auto-advances BASELINE_COMPLETE -> FOLLOWUP_IN_PROGRESS; next_draw_due_at := occurred_at + 42d (WEEK_6)"

      - from: FOLLOWUP_IN_PROGRESS
        to: FOLLOWUP_IN_PROGRESS
        trigger: "POST /api/employee-exposures/{id}/record-draw with stage=WEEK_6 or WEEK_12"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == FOLLOWUP_IN_PROGRESS (ERR_EXPOSURE_INVALID_STAGE)"
          - "stage equals the next unrecorded stage in order BASELINE -> WEEK_6 -> WEEK_12 -> WEEK_24 (ERR_EXPOSURE_INVALID_STAGE)"
          - "drawn_at inside stage window [occurred_at + (due_offset - 7d), occurred_at + (due_offset + 28d)] (ERR_DRAW_OUTSIDE_WINDOW)"
        side_effects:
          - "append draw to recorded_stages; next_draw_due_at advances to next stage due"

      - from: FOLLOWUP_IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/employee-exposures/{id}/record-draw with stage=WEEK_24"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == FOLLOWUP_IN_PROGRESS and WEEK_24 is the next unrecorded stage (ERR_EXPOSURE_INVALID_STAGE)"
          - "drawn_at inside [occurred_at + 161d, occurred_at + 196d] (ERR_DRAW_OUTSIDE_WINDOW)"
        side_effects:
          - "append draw; next_draw_due_at := null"

      - from: FOLLOWUP_IN_PROGRESS
        to: LOST_TO_FOLLOWUP
        trigger: "POST /api/employee-exposures/{id}/mark-lost-to-followup"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == FOLLOWUP_IN_PROGRESS (ERR_EXPOSURE_INVALID_STAGE)"
          - "logical clock > next_draw_due_at + 28 days (ERR_EXPOSURE_NOT_OVERDUE)"
        side_effects:
          - "next_draw_due_at := null"

  - entity: CorrectiveActionPlan
    initial_state: DRAFT
    terminal_states: [VERIFIED, ESCALATED]
    note: "Cyclic rework loop: failed verification returns to ACTIVE while failure_count < 2; the second failure escalates terminally. Auto-created CAPs (audit cascade) start directly in ACTIVE."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/corrective-action-plans/{id}/activate"
        actor: InfectionPreventionist
        preconditions:
          - "status == DRAFT (ERR_CAP_NOT_ACTIVATABLE)"
        side_effects:
          - "Unit.surveillance_posture recompute (ACTIVE CAP drives ELEVATED)"

      - from: ACTIVE
        to: VERIFICATION_PENDING
        trigger: "POST /api/corrective-action-plans/{id}/submit-for-verification with evidence_notes (>= 20 chars)"
        actor: InfectionPreventionist
        preconditions:
          - "status == ACTIVE (ERR_CAP_NOT_SUBMITTABLE)"
        side_effects: []

      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /api/corrective-action-plans/{id}/verify"
        actor: InfectionControlDirector
        preconditions:
          - "status == VERIFICATION_PENDING (ERR_CAP_NOT_VERIFIABLE)"
          - "Segregation of duties: X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTY); auto-created CAPs carry created_by_user_id = 'system' and are verifiable by any InfectionControlDirector"
        side_effects:
          - "set verified_by_user_id"
          - "Unit.surveillance_posture recompute (VERIFIED CAP no longer drives ELEVATED)"

      - from: VERIFICATION_PENDING
        to: ACTIVE
        trigger: "POST /api/corrective-action-plans/{id}/fail-verification with reason, when resulting failure_count < 2"
        actor: InfectionControlDirector
        preconditions:
          - "status == VERIFICATION_PENDING (ERR_CAP_NOT_VERIFIABLE)"
        side_effects:
          - "failure_count += 1; if failure_count >= 2 the target state is ESCALATED instead (see next transition)"
          - "Unit.surveillance_posture recompute"

      - from: VERIFICATION_PENDING
        to: ESCALATED
        trigger: "POST /api/corrective-action-plans/{id}/fail-verification with reason, when resulting failure_count >= 2"
        actor: InfectionControlDirector
        preconditions:
          - "status == VERIFICATION_PENDING (ERR_CAP_NOT_VERIFIABLE)"
        side_effects:
          - "failure_count += 1 (reaches 2); ESCALATED is terminal and still drives ELEVATED posture"
          - "Unit.surveillance_posture recompute"

  - entity: Patient
    initial_state: ADMITTED
    terminal_states: [DISCHARGED]
    transitions:
      - from: ADMITTED
        to: ADMITTED
        trigger: "POST /api/patients/{id}/transfer with to_unit_id, transferred_at"
        actor: UnitNurseManager
        preconditions:
          - "status == ADMITTED (ERR_PATIENT_NOT_ADMITTED)"
          - "to_unit_id != current_unit_id (ERR_INVALID_REQUEST)"
        side_effects:
          - "close current unit_stays entry (departed_at = transferred_at); append {to_unit_id, transferred_at, null}; current_unit_id := to_unit_id"

      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /api/patients/{id}/discharge with discharged_at"
        actor: UnitNurseManager
        preconditions:
          - "status == ADMITTED (ERR_PATIENT_NOT_ADMITTED)"
        side_effects:
          - "close current unit_stays entry (departed_at = discharged_at); current_unit_id := null; set discharged_at"

  - entity: DeviceEpisode
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /api/device-episodes/{id}/remove with removed_at"
        actor: UnitNurseManager
        preconditions:
          - "status == ACTIVE (ERR_DEVICE_EPISODE_NOT_ACTIVE)"
          - "removed_at >= placed_at (ERR_INVALID_REQUEST)"
        side_effects:
          - "set removed_at"

  - entity: DeviceDayCount
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "system (cascade from MonthlySummary OPEN/REJECTED/UNDER_AMENDMENT -> SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LOCKED
        to: DRAFT
        trigger: "system (compensation from MonthlySummary SUBMITTED -> REJECTED, or ACCEPTED -> UNDER_AMENDMENT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Unit
    initial_state: "surveillance_posture=NORMAL"
    terminal_states: []
    note: "Posture-driven aggregate machine: posture is a computed function of child investigations and CAPs; every child mutation that changes the driver set recomputes posture and increments Unit.version. OUTBREAK posture gates MonthlySummary submission."
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "system (first TRIGGERED investigation appears, or first CAP enters {ACTIVE, VERIFICATION_PENDING, ESCALATED})"
        actor: system
        preconditions: []
        side_effects: []

      - from: ELEVATED
        to: OUTBREAK
        trigger: "system (an investigation for this unit enters CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OUTBREAK
        to: ELEVATED
        trigger: "system (last CONFIRMED investigation CLOSED while CAP/investigation drivers remain)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ELEVATED
        to: NORMAL
        trigger: "system (no TRIGGERED/CONFIRMED investigations and no CAP in {ACTIVE, VERIFICATION_PENDING, ESCALATED})"
        actor: system
        preconditions: []
        side_effects: []

      - from: NORMAL
        to: OUTBREAK
        trigger: "system (investigation enters CONFIRMED while posture NORMAL — direct jump allowed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: device-day-count-correction-stale
    parent_entity: DeviceDayCount
    write_endpoint: "PUT /api/device-day-counts/{id}"
    occ_field: "expected_device_day_count_version"
    description: |
      Correcting a DeviceDayCount row whose version has advanced since the
      client last observed it is rejected. A second correction issued with a
      previously valid version is attempting to overwrite a row it has never
      seen (the row stays DRAFT and every correction is a legitimate write,
      so nothing in the state machine would stop it); the OCC check on
      expected_device_day_count_version is the only guard.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: facility-baseline-update-stale
    parent_entity: Facility
    write_endpoint: "PUT /api/facilities/{id}"
    occ_field: "expected_facility_version"
    description: |
      Updating facility SIR baselines with a version the client read earlier
      is rejected when the facility row has since advanced. Baseline updates
      are always semantically valid writes (they trigger recomputation of all
      mutable MonthlySummaries in the facility), so a stale write would
      silently discard the intervening update without this OCC check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: infection_window_period
    trigger: "InfectionCase creation"
    algorithm: interval_construction
    formula: |
      infection_window_start = calendar_date(first_positive_specimen_at) - 3 days, at 00:00:00Z
      infection_window_end   = calendar_date(first_positive_specimen_at) + 3 days, at 23:59:59Z
      The IWP is a CLOSED 7-calendar-day window: [start, end] inclusive.
    input_set: "The single new InfectionCase"
    precision: "calendar-day granularity, UTC"

  - name: date_of_event_unit_attribution
    trigger: "InfectionCase adjudication to ADJUDICATED_HAI"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (each step consumes only prior steps):
        1. IWP        := infection_window_period(first_positive_specimen_at)
        2. DOE        := payload date_of_event, validated DOE ∈ IWP
        3. is_hai     := calendar_date(DOE) >= calendar_date(patient.admitted_at) + 2   (admit date = day 1)
        4. unit       := stay_covering(DOE) with TRANSFER-OUT rule:
                           find stay S in patient.unit_stays with arrived_at <= DOE < departed_at (departed_at null = open);
                           if calendar_date(DOE) == calendar_date(S.arrived_at) AND a previous stay P exists
                           with calendar_date(P.departed_at) == calendar_date(DOE), attribute to P.unit_id;
                           else attribute to S.unit_id.
        5. rit        := DOE calendar date + 13 days at 23:59:59Z (14-day window inclusive of DOE date)
      Steps are ordered to break the apparent circularity (RIT needs DOE, DOE needs IWP, attribution needs DOE).
    input_set: "The case, its patient (admitted_at, unit_stays)"
    precision: "calendar-date comparisons in UTC"

  - name: rit_repeat_infection_block
    trigger: "InfectionCase creation"
    algorithm: threshold
    formula: |
      For each existing InfectionCase E with E.patient_id == new.patient_id
        AND E.case_type == new.case_type
        AND E.status == ADJUDICATED_HAI:
          if calendar_date(new.first_positive_specimen_at) ∈ [calendar_date(E.date_of_event), calendar_date(E.date_of_event) + 13 days]:
            reject with ERR_REPEAT_INFECTION_TIMEFRAME
      Cases in SUSPECTED / UNDER_REVIEW / RULED_OUT / REOPENED do NOT block.
    input_set: "All InfectionCase rows for the same patient + case_type"
    precision: "calendar-date comparison, inclusive both ends"

  - name: device_day_attribution
    trigger: "GET /api/device-day-counts/reconcile (expected value derivation)"
    algorithm: aggregation
    formula: |
      For (unit U, device_type T, calendar date D with half-open day interval [D 00:00:00Z, D+1 00:00:00Z)):
        expected_device_days = count of DeviceEpisode E where
          E.unit_id == U AND E.device_type == T
          AND E.placed_at <  (D+1 00:00:00Z)
          AND (E.removed_at is null OR E.removed_at >= D 00:00:00Z)
      An episode touching any instant of the calendar day contributes one device day to E.unit_id
      (the unit recorded on the episode at creation; no transfer splitting).
    input_set: "All DeviceEpisode rows for the unit + device type"
    precision: "integer device days"

  - name: predicted_infections_and_sir
    trigger: "MonthlySummary creation; recompute on DeviceDayCount create/update, SurgicalProcedure create, InfectionCase adjudicate/reopen, or Facility baseline update — only while summary status ∈ {OPEN, REJECTED, UNDER_AMENDMENT}"
    algorithm: aggregation
    formula: |
      central_line_days       = Σ DeviceDayCount.central_line_days       (unit, count_date ∈ month)
      urinary_catheter_days   = Σ DeviceDayCount.urinary_catheter_days   (unit, month)
      ventilator_days         = Σ DeviceDayCount.ventilator_days         (unit, month)
      patient_days_total      = Σ DeviceDayCount.patient_days            (unit, month)
      procedure_count         = count SurgicalProcedure (unit, performed_at ∈ month)
      predicted_clabsi        = round3_half_up(facility.clabsi_baseline_per_1000 * central_line_days / 1000)
      predicted_cauti         = round3_half_up(facility.cauti_baseline_per_1000 * urinary_catheter_days / 1000)
      predicted_ssi           = round3_half_up(facility.ssi_baseline_per_procedure * Σ risk_weight(p))
        where risk_weight(p) over unit-month procedures p:
          HIGH   2.0  when p.asa_score >= 4 OR p.wound_class ∈ {CONTAMINATED, DIRTY}
          LOW    1.0  when p.asa_score <= 2 AND p.wound_class == CLEAN
          MEDIUM 1.5  otherwise
      SIR per type X ∈ {clabsi, cauti, ssi}:
        if predicted_X < 1.0  → sir_X = NULL   (NHSN not-calculated rule; boundary is EXACTLY >= 1.0)
        else                  → sir_X = round3_half_up(observed_X / predicted_X)
      observed (final variant):       status == ADJUDICATED_HAI, DOE date ∈ month
      observed (provisional variant): final + cases with status == UNDER_REVIEW and specimen date ∈ month
      sir_flag := HIGH if any non-null sir_X >= facility.sir_high_threshold;
                  NORMAL if at least one sir_X non-null and all < threshold;
                  NOT_CALCULATED if every sir_X is null.
    input_set: "DeviceDayCount rows, SurgicalProcedure rows, InfectionCase rows for (unit, month); Facility baselines"
    constants:
      SIR_NOT_CALCULATED_FLOOR: 1.0
      SSI_WEIGHT_LOW: 1.0
      SSI_WEIGHT_MEDIUM: 1.5
      SSI_WEIGHT_HIGH: 2.0
    precision: "3 decimal places, round_half_up; SIR computed from the STORED (rounded) predicted value"
    variants:
      - name: provisional
        when: "previewing month-to-date exposure before adjudication completes"
        difference: "observed includes UNDER_REVIEW cases (specimen date in month) on top of ADJUDICATED_HAI cases → provisional counts/SIRs are >= final values for identical underlying data"
      - name: final
        when: "NHSN submission"
        difference: "observed counts only ADJUDICATED_HAI cases with date_of_event in month"

  - name: hand_hygiene_compliance_rate
    trigger: "GET /api/units/{id}/hand-hygiene-rate?month=YYYY-MM"
    algorithm: weighted_scoring
    formula: |
      Let O = HandHygieneObservation rows for unit with observed_at date ∈ month.
      total_count     = |O|
      compliant_count = |{o ∈ O : o.action == COMPLIANT}|
      reportable      = (total_count >= facility.hh_min_opportunities)
      If not reportable: simple_rate_pct = null, weighted_rate_pct = null.
      PINNED ROUNDING ORDER (mode: aggregate-then-round — computing per-ISO-week rounded rates
      and averaging them is the FORBIDDEN alternative and yields different values):
        simple_rate_pct   = round1_half_up(100 * compliant_count / total_count)
        weighted_rate_pct = round1_half_up(100 * Σ_{o compliant} w(o.opportunity_type) / Σ_{o ∈ O} w(o.opportunity_type))
      Both rates are computed from month-level aggregates, then rounded ONCE.
    input_set: "HandHygieneObservation rows for (unit, month); all actions included"
    constants:
      W_BEFORE_PATIENT_CONTACT: 1.0
      W_AFTER_PATIENT_CONTACT: 1.0
      W_ASEPTIC_TASK: 2.0
      W_BODY_FLUID_RISK: 1.5
      W_AFTER_SURROUNDINGS: 1.0
    precision: "1 decimal place, round_half_up, applied once to the month aggregate"
    variants:
      - name: simple_rate
        when: "default reporting"
        difference: "unweighted compliant/total"
      - name: opportunity_weighted
        when: "risk-adjusted review"
        difference: "weights each opportunity by type (ASEPTIC_TASK 2.0, BODY_FLUID_RISK 1.5, others 1.0); produces a different number than simple_rate for identical observations"

  - name: outbreak_cluster_detection
    trigger: "InfectionCase adjudication to ADJUDICATED_HAI (after unit attribution)"
    algorithm: threshold
    formula: |
      Window W = [logical-clock calendar date - 13 days, logical-clock calendar date] (14 days, inclusive).
      Cluster C = InfectionCase rows with unit_id == attributed unit,
                  case-insensitive-equal suspected_organism,
                  status == ADJUDICATED_HAI,
                  calendar_date(date_of_event) ∈ W.
      If |C| >= CLUSTER_THRESHOLD AND no OutbreakInvestigation exists for (unit, organism, case-insensitive)
      with status ∈ {TRIGGERED, CONFIRMED}:
        system-create OutbreakInvestigation(status TRIGGERED, origin AUTO_THRESHOLD,
          detection_window_start = W.start 00:00:00Z, detection_window_end = W.end 23:59:59Z,
          trigger_case_ids = C sorted by date_of_event ASC then created_at ASC,
          contributing_case_count = |C|)
      Boundary: exactly CLUSTER_THRESHOLD cases trigger; THRESHOLD-1 do not.
    input_set: "ADJUDICATED_HAI InfectionCase rows for unit + organism in rolling window; open investigations for dedupe"
    constants:
      CLUSTER_THRESHOLD: 3
      WINDOW_DAYS: 14
    precision: "case-count integer; window on calendar dates inclusive"

  - name: exposure_draw_schedule
    trigger: "EmployeeExposure creation; record-draw; mark-lost-to-followup; read of current_stage_overdue"
    algorithm: forward_looking
    formula: |
      Stage due offsets from occurred_at:
        BASELINE due = occurred_at + 72h         (acceptance window: drawn_at <= due)
        WEEK_6  due  = occurred_at + 42 days     (acceptance window [due - 7d, due + 28d])
        WEEK_12 due  = occurred_at + 84 days     (acceptance window [due - 7d, due + 28d])
        WEEK_24 due  = occurred_at + 168 days    (acceptance window [due - 7d, due + 28d])
      next_draw_due_at = due of earliest stage absent from recorded_stages; null when all recorded.
      current_stage_overdue (at read) = clock > next_draw_due_at AND status ∈
        {REPORTED, SOURCE_EVALUATED, BASELINE_COMPLETE, FOLLOWUP_IN_PROGRESS}.
      LOST_TO_FOLLOWUP eligibility: status == FOLLOWUP_IN_PROGRESS AND clock > next_draw_due_at + 28 days.
    input_set: "The exposure row; logical clock"
    constants:
      BASELINE_SLA_HOURS: 72
      WEEK6_DUE_DAYS: 42
      WEEK12_DUE_DAYS: 84
      WEEK24_DUE_DAYS: 168
      FOLLOWUP_WINDOW_EARLY_DAYS: 7
      FOLLOWUP_WINDOW_LATE_DAYS: 28
      LOST_AFTER_OVERDUE_DAYS: 28
    precision: "timestamps compared at second precision, UTC"

  - name: isolation_audit_compliance
    trigger: "IsolationComplianceAudit creation"
    algorithm: threshold
    formula: |
      compliance_pct = round1_half_up(100 * elements_passed / elements_checked)
      outcome        = COMPLIANT when compliance_pct >= 90.0 else NON_COMPLIANT
      Boundary: pct computed AFTER rounding; exactly 90.0 is COMPLIANT, 88.9 is NON_COMPLIANT.
    input_set: "The single audit row"
    constants:
      COMPLIANCE_THRESHOLD_PCT: 90.0
    precision: "1 decimal place, round_half_up before comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — evaluated top-down;
# a request failing multiple rules reports the LOWEST priority number)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Schema: all required fields present; enums valid; integer ranges (>= 0, >= 1) hold; string minimum lengths hold; conditional-required fields: surgical_procedure_id required iff case_type == SSI; linked_device_episode_id required iff case_type in {CLABSI, CAUTI}; date_of_event required iff adjudication outcome == ADJUDICATED_HAI; ssi_depth required iff adjudicating SSI to ADJUDICATED_HAI"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK ids in payload declaration order (ERR_<RESOURCE>_NOT_FOUND per resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 5
    category: state
    check: "Target resource state preconditions for the action (per §1.2 preconditions): case reviewable/adjudicatable/reopenable; summary submittable/reviewable/amendable; outbreak confirmable/closable; isolation order startable/not-discontinued/active-for-audit; exposure stage order; CAP activatable/submittable/verifiable; patient ADMITTED; device episode ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    note: "Each transition names its own domain-specific error_id (ERR_CASE_NOT_ADJUDICATABLE, ERR_SUMMARY_NOT_SUBMITTABLE, ...); this row fixes their shared priority tier."

  - priority: 5.5
    category: state
    check: "Covering-aggregate lock: (a) POST/PUT DeviceDayCount requires the covering MonthlySummary (unit, month of count_date), if it exists, to be in {OPEN, REJECTED, UNDER_AMENDMENT}; (b) adjudicate/reopen of an InfectionCase requires the covering MonthlySummary (unit, month of date_of_event resp. specimen date), if it exists, to be in {OPEN, REJECTED, UNDER_AMENDMENT}; (c) POST SurgicalProcedure requires covering summary mutable likewise"
    error_id: ERR_SUMMARY_LOCKED
    http_status: 409
    applies_to: "POST /api/device-day-counts; PUT /api/device-day-counts/{id}; POST /api/infection-cases/{id}/adjudicate; POST /api/infection-cases/{id}/reopen; POST /api/surgical-procedures"

  - priority: 6
    category: business_safety
    check: "Posture gate: MonthlySummary submit requires Unit.surveillance_posture != OUTBREAK"
    error_id: ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION
    http_status: 403
    applies_to: "POST /api/monthly-summaries/{id}/submit"

  - priority: 6.5
    category: business_safety
    check: "Segregation of duties: summary accept requires X-User-ID != submitted_by_user_id; CAP verify requires X-User-ID != created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTY
    http_status: 403
    applies_to: "POST /api/monthly-summaries/{id}/accept; POST /api/corrective-action-plans/{id}/verify"

  - priority: 7
    category: business_temporal
    check: "Temporal window rules, in this pinned sub-order: (a) RIT repeat-infection block on case create (ERR_REPEAT_INFECTION_TIMEFRAME); (b) date_of_event inside IWP (ERR_DOE_OUTSIDE_IWP); (c) HAI day rule DOE >= admit date + 2 (ERR_DOE_NOT_HAI_DAY_RULE); (d) SSI surveillance window 30/90 days (ERR_SSI_WINDOW_EXPIRED); (e) device day rule placed >= 2 days before DOE and covering DOE (ERR_DEVICE_DAY_RULE_NOT_MET); (f) exposure draw windows (ERR_BASELINE_WINDOW_MISSED, ERR_DRAW_OUTSIDE_WINDOW); (g) lost-to-followup overdue threshold (ERR_EXPOSURE_NOT_OVERDUE)"
    error_id: ERR_TEMPORAL_FAMILY
    http_status: 422
    applies_to: "POST /api/infection-cases; POST /api/infection-cases/{id}/adjudicate; POST /api/employee-exposures/{id}/record-draw; POST /api/employee-exposures/{id}/mark-lost-to-followup"

  - priority: 7.5
    category: business_temporal
    check: "Temporal overlap on resources: (a) DeviceEpisode half-open [placed_at, removed_at) overlap for same patient + device_type (ERR_DEVICE_EPISODE_OVERLAP); (b) SurgicalProcedure CLOSED [performed_at, performed_at + duration_minutes] overlap for same patient (ERR_PROCEDURE_OVERLAP)"
    error_id: ERR_OVERLAP_FAMILY
    http_status: 409
    applies_to: "POST /api/device-episodes; POST /api/surgical-procedures"

  - priority: 8
    category: business_referential
    check: "Cross-entity FK coherence: linked DeviceEpisode.patient_id == case.patient_id (ERR_EPISODE_PATIENT_MISMATCH); linked SurgicalProcedure.patient_id == case.patient_id (ERR_PROCEDURE_PATIENT_MISMATCH); CAP source_ref_id must reference an existing entity of the type pinned by source_type (OUTBREAK -> OutbreakInvestigation with status CONFIRMED; ISOLATION_AUDIT -> IsolationComplianceAudit; SIR_HIGH -> MonthlySummary; HAND_HYGIENE -> Unit) (ERR_CAP_SOURCE_INVALID); audit's isolation order exists (covered at p4)"
    error_id: ERR_REFERENTIAL_FAMILY
    http_status: 422
    applies_to: "POST /api/infection-cases; POST /api/corrective-action-plans"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and intra-row constraints: DeviceDayCount unique (unit_id, count_date) (ERR_DUPLICATE_DEVICE_DAY_COUNT); each device_days <= patient_days (ERR_DEVICE_DAYS_EXCEED_PATIENT_DAYS); MonthlySummary unique (unit_id, month) (ERR_DUPLICATE_SUMMARY_MONTH); IsolationOrder: at most one order with status in {ORDERED, ACTIVE} per (patient_id, precaution_type) (ERR_DUPLICATE_ISOLATION_ORDER); OutbreakInvestigation manual create: no existing investigation with status in {TRIGGERED, CONFIRMED} for same unit + organism (ERR_DUPLICATE_OUTBREAK_OPEN); audit elements_passed <= elements_checked (ERR_AUDIT_ELEMENTS_INVALID); Facility.nhsn_org_id unique (ERR_DUPLICATE_NHSN_ORG_ID); Patient.mrn unique (ERR_DUPLICATE_MRN)"
    error_id: ERR_CONSTRAINT_FAMILY
    http_status: 409
    applies_to: "creation endpoints and PUT /api/device-day-counts/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All overdue/window rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced (monotonic not enforced; tests may move freely)"]

  # --- Facilities ---
  - method: POST
    path: "/api/facilities"
    description: "Create a facility with SIR baselines"
    roles: [PlatformAdmin]
    code: 201
    input: [name, nhsn_org_id, clabsi_baseline_per_1000, cauti_baseline_per_1000, ssi_baseline_per_procedure, "sir_high_threshold?", "hh_min_opportunities?"]
    output: Facility
    side_effects: []

  - method: GET
    path: "/api/facilities/{id}"
    description: "Get a facility"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: PUT
    path: "/api/facilities/{id}"
    description: "Update facility baselines (OCC-guarded). Recomputes predicted/SIR fields of every MonthlySummary in mutable status {OPEN, REJECTED, UNDER_AMENDMENT} across the facility's units."
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "clabsi_baseline_per_1000?", "cauti_baseline_per_1000?", "ssi_baseline_per_procedure?", "sir_high_threshold?", "hh_min_opportunities?", expected_facility_version]
    output: Facility
    side_effects: ["increments Facility.version by 1", "recompute mutable MonthlySummaries of the facility (each recompute increments that summary's version)"]

  # --- Units ---
  - method: POST
    path: "/api/units"
    description: "Create a unit in a facility"
    roles: [PlatformAdmin]
    code: 201
    input: [facility_id, name, unit_type, nhsn_location_code]
    output: Unit
    side_effects: ["surveillance_posture = NORMAL"]

  - method: GET
    path: "/api/units"
    description: "List units, optional facility_id filter"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/api/units/{id}"
    description: "Get a unit (includes recomputed surveillance_posture)"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/api/units/{id}/hand-hygiene-rate"
    description: "Computed hand-hygiene compliance rates for a unit-month (dual variant: simple + opportunity-weighted; aggregate-then-round)"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: [month]
    output: { month: string, total_count: integer, compliant_count: integer, simple_rate_pct: "number|null", weighted_rate_pct: "number|null", reportable: boolean }
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/api/patients"
    description: "Register an inpatient admission"
    roles: [UnitNurseManager]
    code: 201
    input: [mrn, admitted_at, unit_id]
    output: Patient
    side_effects: ["status = ADMITTED", "unit_stays seeded with {unit_id, admitted_at, null}", "current_unit_id = unit_id"]

  - method: GET
    path: "/api/patients"
    description: "List patients"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["current_unit_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/api/patients/{id}"
    description: "Get a patient"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/api/patients/{id}/transfer"
    description: "Transfer an admitted patient to another unit (closes current stay, opens new)"
    roles: [UnitNurseManager]
    code: 200
    input: [to_unit_id, transferred_at]
    output: Patient
    side_effects: ["unit_stays rotation", "current_unit_id := to_unit_id", "increments Patient.version"]

  - method: POST
    path: "/api/patients/{id}/discharge"
    description: "Discharge an admitted patient"
    roles: [UnitNurseManager]
    code: 200
    input: [discharged_at]
    output: Patient
    side_effects: ["status = DISCHARGED", "current_unit_id = null", "open stay closed"]

  # --- Employees ---
  - method: POST
    path: "/api/employees"
    description: "Register an employee"
    roles: [EmployeeHealthNurse]
    code: 201
    input: [employee_code, role_title, home_unit_id]
    output: Employee
    side_effects: []

  - method: GET
    path: "/api/employees"
    description: "List employees"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["home_unit_id?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/api/employees/{id}"
    description: "Get an employee"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # --- Device episodes ---
  - method: POST
    path: "/api/device-episodes"
    description: "Record a device placement; rejects half-open interval overlap for same patient + device_type"
    roles: [UnitNurseManager]
    code: 201
    input: [patient_id, device_type, placed_at]
    output: DeviceEpisode
    side_effects: ["status = ACTIVE", "unit_id := patient.current_unit_id"]

  - method: GET
    path: "/api/device-episodes"
    description: "List device episodes"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["patient_id?", "unit_id?", "device_type?", "limit?", "offset?"]
    output: "DeviceEpisode[]"
    side_effects: []

  - method: GET
    path: "/api/device-episodes/{id}"
    description: "Get a device episode"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: DeviceEpisode
    side_effects: []

  - method: POST
    path: "/api/device-episodes/{id}/remove"
    description: "Mark device removed"
    roles: [UnitNurseManager]
    code: 200
    input: [removed_at]
    output: DeviceEpisode
    side_effects: ["status = REMOVED", "set removed_at"]

  # --- Surgical procedures ---
  - method: POST
    path: "/api/surgical-procedures"
    description: "Record an operative procedure; rejects CLOSED-interval overlap for same patient; blocked when covering summary locked"
    roles: [UnitNurseManager]
    code: 201
    input: [patient_id, procedure_code, performed_at, duration_minutes, asa_score, wound_class, "implant?"]
    output: SurgicalProcedure
    side_effects: ["unit_id := patient.current_unit_id", "recompute covering MonthlySummary (if mutable) procedure_count/predicted_ssi/sir_ssi"]

  - method: GET
    path: "/api/surgical-procedures"
    description: "List surgical procedures"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["patient_id?", "unit_id?", "limit?", "offset?"]
    output: "SurgicalProcedure[]"
    side_effects: []

  - method: GET
    path: "/api/surgical-procedures/{id}"
    description: "Get a surgical procedure"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: SurgicalProcedure
    side_effects: []

  # --- Infection cases ---
  - method: POST
    path: "/api/infection-cases"
    description: "Open a suspected HAI case; computes IWP; RIT block applies; unit taken from patient's current unit"
    roles: [InfectionPreventionist]
    code: 201
    input: [patient_id, case_type, suspected_organism, first_positive_specimen_at, "surgical_procedure_id?", "linked_device_episode_id?"]
    output: InfectionCase
    side_effects: ["status = SUSPECTED", "computes infection_window_start/end", "unit_id := patient.current_unit_id"]

  - method: GET
    path: "/api/infection-cases"
    description: "List infection cases"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "patient_id?", "status?", "surgical_procedure_id?", "linked_device_episode_id?", "limit?", "offset?"]
    output: "InfectionCase[]"
    side_effects: []

  - method: GET
    path: "/api/infection-cases/{id}"
    description: "Get an infection case"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: InfectionCase
    side_effects: []

  - method: POST
    path: "/api/infection-cases/{id}/begin-review"
    description: "SUSPECTED|REOPENED -> UNDER_REVIEW"
    roles: [InfectionPreventionist]
    code: 200
    input: []
    output: InfectionCase
    side_effects: ["status = UNDER_REVIEW", "increments version"]

  - method: POST
    path: "/api/infection-cases/{id}/adjudicate"
    description: "Adjudicate UNDER_REVIEW case to ADJUDICATED_HAI or RULED_OUT; triggers attribution, summary recompute, and cluster detection cascade"
    roles: [InfectionPreventionist]
    code: 200
    input: [outcome, rationale, "date_of_event?", "ssi_depth?"]
    output: InfectionCase
    side_effects: ["per InfectionCase state machine: attribution, rit, summary recompute, outbreak auto-trigger, posture recompute"]

  - method: POST
    path: "/api/infection-cases/{id}/reopen"
    description: "ADJUDICATED_HAI|RULED_OUT -> REOPENED; reverses case-level summary contributions"
    roles: [InfectionPreventionist]
    code: 200
    input: [reason]
    output: InfectionCase
    side_effects: ["clear date_of_event/is_hai/rit_blocked_until", "summary recompute (if mutable)"]

  # --- Device day counts ---
  - method: POST
    path: "/api/device-day-counts"
    description: "Record daily denominator row for a unit; unique per (unit, count_date); blocked when covering summary locked"
    roles: [UnitNurseManager]
    code: 201
    input: [unit_id, count_date, central_line_days, urinary_catheter_days, ventilator_days, patient_days]
    output: DeviceDayCount
    side_effects: ["status = DRAFT", "recompute covering MonthlySummary (if mutable)"]

  - method: GET
    path: "/api/device-day-counts"
    description: "List device day counts"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "month?", "limit?", "offset?"]
    output: "DeviceDayCount[]"
    side_effects: []

  - method: GET
    path: "/api/device-day-counts/reconcile"
    description: "Compare recorded device days against episodes-derived expectation for (unit, device_type, count_date)"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: [unit_id, device_type, count_date]
    output: { expected_device_days: integer, recorded_device_days: "integer|null", delta: "integer|null", matches: boolean }
    side_effects: []

  - method: GET
    path: "/api/device-day-counts/{id}"
    description: "Get a device day count row"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: DeviceDayCount
    side_effects: []

  - method: PUT
    path: "/api/device-day-counts/{id}"
    description: "Correct a denominator row (OCC-guarded); requires DRAFT status"
    roles: [UnitNurseManager]
    code: 200
    input: [central_line_days, urinary_catheter_days, ventilator_days, patient_days, expected_device_day_count_version]
    output: DeviceDayCount
    side_effects: ["increments DeviceDayCount.version by 1", "recompute covering MonthlySummary (if mutable)"]

  # --- Monthly summaries (NHSN submission cycle) ---
  - method: POST
    path: "/api/monthly-summaries"
    description: "Create the monthly summary for a unit (one per unit+month); computes denominators, counts, predicted, SIRs at creation"
    roles: [InfectionPreventionist]
    code: 201
    input: [unit_id, month]
    output: MonthlySummary
    side_effects: ["status = OPEN", "full computation of denominator/count/predicted/SIR fields"]

  - method: GET
    path: "/api/monthly-summaries"
    description: "List monthly summaries"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "MonthlySummary[]"
    side_effects: []

  - method: GET
    path: "/api/monthly-summaries/{id}"
    description: "Get a monthly summary"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: MonthlySummary
    side_effects: []

  - method: POST
    path: "/api/monthly-summaries/{id}/submit"
    description: "Submit for NHSN review; gated by unit posture; locks denominator rows"
    roles: [InfectionPreventionist]
    code: 200
    input: []
    output: MonthlySummary
    side_effects: ["status = SUBMITTED", "DeviceDayCount rows for (unit, month) -> LOCKED", "set submitted_by_user_id"]

  - method: POST
    path: "/api/monthly-summaries/{id}/accept"
    description: "Accept a submitted summary (segregation of duties vs submitter)"
    roles: [InfectionControlDirector]
    code: 200
    input: []
    output: MonthlySummary
    side_effects: ["status = ACCEPTED", "set accepted_by_user_id"]

  - method: POST
    path: "/api/monthly-summaries/{id}/reject"
    description: "Reject a submitted summary; unlocks denominator rows"
    roles: [InfectionControlDirector]
    code: 200
    input: [reason]
    output: MonthlySummary
    side_effects: ["status = REJECTED", "DeviceDayCount rows revert to DRAFT"]

  - method: POST
    path: "/api/monthly-summaries/{id}/amend"
    description: "Amend an ACCEPTED summary back to UNDER_AMENDMENT; increments amendment_count; unlocks denominators"
    roles: [InfectionPreventionist]
    code: 200
    input: [reason]
    output: MonthlySummary
    side_effects: ["status = UNDER_AMENDMENT", "amendment_count += 1", "DeviceDayCount rows revert to DRAFT"]

  # --- Outbreak investigations ---
  - method: POST
    path: "/api/outbreak-investigations"
    description: "Manually open an investigation (origin MANUAL); snapshots current matching cluster into trigger_case_ids; duplicate open investigation for unit+organism rejected"
    roles: [InfectionPreventionist]
    code: 201
    input: [unit_id, organism]
    output: OutbreakInvestigation
    side_effects: ["status = TRIGGERED", "snapshot trigger_case_ids + contributing_case_count", "Unit.surveillance_posture recompute"]

  - method: GET
    path: "/api/outbreak-investigations"
    description: "List outbreak investigations"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "OutbreakInvestigation[]"
    side_effects: []

  - method: GET
    path: "/api/outbreak-investigations/{id}"
    description: "Get an outbreak investigation"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: []

  - method: POST
    path: "/api/outbreak-investigations/{id}/confirm"
    description: "Confirm a triggered investigation; drives unit posture OUTBREAK"
    roles: [InfectionControlDirector]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: ["status = CONFIRMED", "Unit.surveillance_posture recompute (OUTBREAK)"]

  - method: POST
    path: "/api/outbreak-investigations/{id}/rule-out"
    description: "Rule out a triggered investigation"
    roles: [InfectionControlDirector]
    code: 200
    input: [reason]
    output: OutbreakInvestigation
    side_effects: ["status = RULED_OUT", "Unit.surveillance_posture recompute"]

  - method: POST
    path: "/api/outbreak-investigations/{id}/close"
    description: "Close a confirmed (requires verified outbreak CAP) or ruled-out investigation"
    roles: [InfectionControlDirector]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: ["status = CLOSED", "Unit.surveillance_posture recompute"]

  # --- Isolation orders + compliance audits ---
  - method: POST
    path: "/api/isolation-orders"
    description: "Order isolation precautions for an admitted patient; one open order per (patient, precaution_type)"
    roles: [InfectionPreventionist]
    code: 201
    input: [patient_id, precaution_type]
    output: IsolationOrder
    side_effects: ["status = ORDERED", "compliance_status = NOT_AUDITED", "unit_id := patient.current_unit_id", "ordered_by_user_id := X-User-ID"]

  - method: GET
    path: "/api/isolation-orders"
    description: "List isolation orders"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["patient_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: "IsolationOrder[]"
    side_effects: []

  - method: GET
    path: "/api/isolation-orders/{id}"
    description: "Get an isolation order"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: IsolationOrder
    side_effects: []

  - method: POST
    path: "/api/isolation-orders/{id}/start"
    description: "ORDERED -> ACTIVE"
    roles: [UnitNurseManager]
    code: 200
    input: []
    output: IsolationOrder
    side_effects: ["status = ACTIVE", "set started_at"]

  - method: POST
    path: "/api/isolation-orders/{id}/discontinue"
    description: "ORDERED|ACTIVE -> DISCONTINUED; compliance axis preserved"
    roles: [UnitNurseManager]
    code: 200
    input: []
    output: IsolationOrder
    side_effects: ["status = DISCONTINUED", "set discontinued_at"]

  - method: POST
    path: "/api/isolation-compliance-audits"
    description: "Audit an ACTIVE isolation order; computes compliance_pct + outcome; NON_COMPLIANT cascades to CAP creation and posture recompute"
    roles: [UnitNurseManager]
    code: 201
    input: [isolation_order_id, observed_at, elements_checked, elements_passed]
    output: IsolationComplianceAudit
    side_effects: ["set IsolationOrder.compliance_status (last-audit-wins)", "on NON_COMPLIANT: auto-create CorrectiveActionPlan(ACTIVE, ISOLATION_AUDIT)", "Unit.surveillance_posture recompute"]

  - method: GET
    path: "/api/isolation-compliance-audits"
    description: "List isolation compliance audits"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["isolation_order_id?", "limit?", "offset?"]
    output: "IsolationComplianceAudit[]"
    side_effects: []

  - method: GET
    path: "/api/isolation-compliance-audits/{id}"
    description: "Get an isolation compliance audit"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: IsolationComplianceAudit
    side_effects: []

  # --- Hand hygiene ---
  - method: POST
    path: "/api/hand-hygiene-observations"
    description: "Record one hand-hygiene opportunity observation (immutable; no update endpoint exists)"
    roles: [UnitNurseManager]
    code: 201
    input: [unit_id, observed_at, opportunity_type, action]
    output: HandHygieneObservation
    side_effects: []

  - method: GET
    path: "/api/hand-hygiene-observations"
    description: "List hand-hygiene observations"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "month?", "limit?", "offset?"]
    output: "HandHygieneObservation[]"
    side_effects: []

  - method: GET
    path: "/api/hand-hygiene-observations/{id}"
    description: "Get a hand-hygiene observation"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: HandHygieneObservation
    side_effects: []

  # --- Employee exposures ---
  - method: POST
    path: "/api/employee-exposures"
    description: "Report an occupational exposure; seeds draw schedule"
    roles: [EmployeeHealthNurse]
    code: 201
    input: [employee_id, "source_patient_id?", exposure_type, occurred_at, source_hbv_status, source_hcv_status, source_hiv_status]
    output: EmployeeExposure
    side_effects: ["status = REPORTED", "next_draw_due_at := occurred_at + 72h (BASELINE due)"]

  - method: GET
    path: "/api/employee-exposures"
    description: "List employee exposures"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["employee_id?", "status?", "source_patient_id?", "limit?", "offset?"]
    output: "EmployeeExposure[]"
    side_effects: []

  - method: GET
    path: "/api/employee-exposures/{id}"
    description: "Get an employee exposure (current_stage_overdue computed at read from logical clock)"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: EmployeeExposure
    side_effects: []

  - method: POST
    path: "/api/employee-exposures/{id}/record-source-serologies"
    description: "REPORTED -> SOURCE_EVALUATED; update source serostatuses"
    roles: [EmployeeHealthNurse]
    code: 200
    input: [source_hbv_status, source_hcv_status, source_hiv_status]
    output: EmployeeExposure
    side_effects: ["status = SOURCE_EVALUATED"]

  - method: POST
    path: "/api/employee-exposures/{id}/record-draw"
    description: "Record a serology draw for the next stage in order; windows enforced; WEEK_24 completes the protocol"
    roles: [EmployeeHealthNurse]
    code: 200
    input: [stage, drawn_at, result]
    output: EmployeeExposure
    side_effects: ["append recorded_stages", "advance status/next_draw_due_at per state machine"]

  - method: POST
    path: "/api/employee-exposures/{id}/mark-lost-to-followup"
    description: "FOLLOWUP_IN_PROGRESS -> LOST_TO_FOLLOWUP when current stage overdue > 28 days (logical clock)"
    roles: [EmployeeHealthNurse]
    code: 200
    input: []
    output: EmployeeExposure
    side_effects: ["status = LOST_TO_FOLLOWUP", "next_draw_due_at := null"]

  # --- Corrective action plans ---
  - method: POST
    path: "/api/corrective-action-plans"
    description: "Create a corrective action plan for a unit (status DRAFT); source_ref_id must reference a valid entity for source_type (OUTBREAK requires a CONFIRMED investigation)"
    roles: [InfectionPreventionist]
    code: 201
    input: [unit_id, source_type, source_ref_id, description, due_date]
    output: CorrectiveActionPlan
    side_effects: ["status = DRAFT", "failure_count = 0", "created_by_user_id := X-User-ID"]

  - method: GET
    path: "/api/corrective-action-plans"
    description: "List corrective action plans"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []

  - method: GET
    path: "/api/corrective-action-plans/{id}"
    description: "Get a corrective action plan"
    roles: [PlatformAdmin, InfectionPreventionist, InfectionControlDirector, UnitNurseManager, EmployeeHealthNurse]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []

  - method: POST
    path: "/api/corrective-action-plans/{id}/activate"
    description: "DRAFT -> ACTIVE; drives unit posture ELEVATED"
    roles: [InfectionPreventionist]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status = ACTIVE", "Unit.surveillance_posture recompute"]

  - method: POST
    path: "/api/corrective-action-plans/{id}/submit-for-verification"
    description: "ACTIVE -> VERIFICATION_PENDING with evidence notes"
    roles: [InfectionPreventionist]
    code: 200
    input: [evidence_notes]
    output: CorrectiveActionPlan
    side_effects: ["status = VERIFICATION_PENDING"]

  - method: POST
    path: "/api/corrective-action-plans/{id}/verify"
    description: "VERIFICATION_PENDING -> VERIFIED (segregation of duties vs creator); posture recompute"
    roles: [InfectionControlDirector]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status = VERIFIED", "set verified_by_user_id", "Unit.surveillance_posture recompute"]

  - method: POST
    path: "/api/corrective-action-plans/{id}/fail-verification"
    description: "VERIFICATION_PENDING -> ACTIVE (failure_count becomes 1) or -> ESCALATED (failure_count reaches 2, terminal)"
    roles: [InfectionControlDirector]
    code: 200
    input: [reason]
    output: CorrectiveActionPlan
    side_effects: ["failure_count += 1", "status = ACTIVE or ESCALATED per failure_count", "Unit.surveillance_posture recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / schema ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-User-Role not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, range violation, short rationale/reason/evidence string, or violated conditional-required pairing (surgical_procedure_id/linked_device_episode_id/date_of_event/ssi_depth)" }

  # --- not found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unit id does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patient id does not exist" }
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "employee id does not exist" }
  - { id: ERR_DEVICE_EPISODE_NOT_FOUND, http: 404, condition: "device episode id does not exist" }
  - { id: ERR_PROCEDURE_NOT_FOUND, http: 404, condition: "surgical procedure id does not exist" }
  - { id: ERR_INFECTION_CASE_NOT_FOUND, http: 404, condition: "infection case id does not exist" }
  - { id: ERR_DEVICE_DAY_COUNT_NOT_FOUND, http: 404, condition: "device day count id does not exist" }
  - { id: ERR_MONTHLY_SUMMARY_NOT_FOUND, http: 404, condition: "monthly summary id does not exist" }
  - { id: ERR_OUTBREAK_NOT_FOUND, http: 404, condition: "outbreak investigation id does not exist" }
  - { id: ERR_ISOLATION_ORDER_NOT_FOUND, http: 404, condition: "isolation order id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "isolation compliance audit id does not exist" }
  - { id: ERR_OBSERVATION_NOT_FOUND, http: 404, condition: "hand hygiene observation id does not exist" }
  - { id: ERR_EXPOSURE_NOT_FOUND, http: 404, condition: "employee exposure id does not exist" }
  - { id: ERR_CAP_NOT_FOUND, http: 404, condition: "corrective action plan id does not exist" }

  # --- state ---
  - { id: ERR_CASE_NOT_REVIEWABLE, http: 409, condition: "begin-review requires status SUSPECTED or REOPENED" }
  - { id: ERR_CASE_NOT_ADJUDICATABLE, http: 409, condition: "adjudicate requires status UNDER_REVIEW" }
  - { id: ERR_CASE_NOT_REOPENABLE, http: 409, condition: "reopen requires status ADJUDICATED_HAI or RULED_OUT" }
  - { id: ERR_SUMMARY_NOT_SUBMITTABLE, http: 409, condition: "submit requires status OPEN, REJECTED, or UNDER_AMENDMENT" }
  - { id: ERR_SUMMARY_NOT_REVIEWABLE, http: 409, condition: "accept/reject requires status SUBMITTED" }
  - { id: ERR_SUMMARY_NOT_AMENDABLE, http: 409, condition: "amend requires status ACCEPTED" }
  - { id: ERR_SUMMARY_LOCKED, http: 409, condition: "covering MonthlySummary is SUBMITTED or ACCEPTED; denominator/procedure/case mutations for that unit-month are frozen" }
  - { id: ERR_OUTBREAK_NOT_CONFIRMABLE, http: 409, condition: "confirm/rule-out requires status TRIGGERED" }
  - { id: ERR_OUTBREAK_EMPTY_CLUSTER, http: 409, condition: "confirm requires contributing_case_count >= 1" }
  - { id: ERR_OUTBREAK_NOT_CLOSABLE, http: 409, condition: "close requires status CONFIRMED or RULED_OUT" }
  - { id: ERR_OUTBREAK_CLOSE_BLOCKED, http: 409, condition: "closing a CONFIRMED investigation requires a VERIFIED CorrectiveActionPlan with source_type OUTBREAK referencing it" }
  - { id: ERR_ISOLATION_ORDER_NOT_STARTABLE, http: 409, condition: "start requires status ORDERED" }
  - { id: ERR_ISOLATION_ALREADY_DISCONTINUED, http: 409, condition: "discontinue requires status ORDERED or ACTIVE" }
  - { id: ERR_ISOLATION_ORDER_NOT_ACTIVE, http: 409, condition: "audit requires the isolation order to be ACTIVE" }
  - { id: ERR_EXPOSURE_INVALID_STAGE, http: 409, condition: "exposure action not valid for current status/stage order (REPORTED -> SOURCE_EVALUATED -> BASELINE -> WEEK_6 -> WEEK_12 -> WEEK_24)" }
  - { id: ERR_CAP_NOT_ACTIVATABLE, http: 409, condition: "activate requires status DRAFT" }
  - { id: ERR_CAP_NOT_SUBMITTABLE, http: 409, condition: "submit-for-verification requires status ACTIVE" }
  - { id: ERR_CAP_NOT_VERIFIABLE, http: 409, condition: "verify/fail-verification requires status VERIFICATION_PENDING" }
  - { id: ERR_PATIENT_NOT_ADMITTED, http: 409, condition: "patient must be ADMITTED (transfer/discharge/case-create/isolation-order/device-episode on a DISCHARGED patient)" }
  - { id: ERR_DEVICE_EPISODE_NOT_ACTIVE, http: 409, condition: "remove requires episode status ACTIVE" }

  # --- business safety ---
  - { id: ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION, http: 403, condition: "unit surveillance_posture == OUTBREAK blocks MonthlySummary submission" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "acceptor equals submitted_by_user_id, or CAP verifier equals created_by_user_id" }

  # --- business temporal ---
  - { id: ERR_REPEAT_INFECTION_TIMEFRAME, http: 422, condition: "new case's specimen date falls inside the 14-day RIT of an existing ADJUDICATED_HAI case of same patient + case_type" }
  - { id: ERR_DOE_OUTSIDE_IWP, http: 422, condition: "date_of_event outside [infection_window_start, infection_window_end]" }
  - { id: ERR_DOE_NOT_HAI_DAY_RULE, http: 422, condition: "date_of_event before admission calendar date + 2 days — not healthcare-associated" }
  - { id: ERR_SSI_WINDOW_EXPIRED, http: 422, condition: "SSI date_of_event beyond the 30-day (non-implant) or 90-day (implant) post-procedure window" }
  - { id: ERR_DEVICE_DAY_RULE_NOT_MET, http: 422, condition: "linked device episode not placed >= 2 calendar days before date_of_event or not covering date_of_event" }
  - { id: ERR_BASELINE_WINDOW_MISSED, http: 422, condition: "baseline draw drawn_at after occurred_at + 72h" }
  - { id: ERR_DRAW_OUTSIDE_WINDOW, http: 422, condition: "follow-up draw drawn_at outside [due - 7d, due + 28d] for its stage" }
  - { id: ERR_EXPOSURE_NOT_OVERDUE, http: 422, condition: "mark-lost-to-followup requires logical clock > next_draw_due_at + 28 days" }
  - { id: ERR_DEVICE_EPISODE_OVERLAP, http: 409, condition: "half-open [placed_at, removed_at) collides with an existing episode for same patient + device_type; back-to-back (placed_at == other.removed_at) is allowed" }
  - { id: ERR_PROCEDURE_OVERLAP, http: 409, condition: "CLOSED [performed_at, performed_at + duration_minutes] collides with an existing procedure for same patient; an instant shared by both intervals conflicts" }

  # --- referential / constraint ---
  - { id: ERR_EPISODE_PATIENT_MISMATCH, http: 422, condition: "linked_device_episode_id references an episode of a different patient" }
  - { id: ERR_PROCEDURE_PATIENT_MISMATCH, http: 422, condition: "surgical_procedure_id references a procedure of a different patient" }
  - { id: ERR_CAP_SOURCE_INVALID, http: 422, condition: "source_ref_id missing, references a non-existent entity, mismatches source_type, or references a non-CONFIRMED investigation for source_type OUTBREAK" }
  - { id: ERR_DUPLICATE_DEVICE_DAY_COUNT, http: 409, condition: "a DeviceDayCount row already exists for (unit_id, count_date)" }
  - { id: ERR_DEVICE_DAYS_EXCEED_PATIENT_DAYS, http: 422, condition: "any of central_line_days/urinary_catheter_days/ventilator_days exceeds patient_days" }
  - { id: ERR_DUPLICATE_SUMMARY_MONTH, http: 409, condition: "a MonthlySummary already exists for (unit_id, month)" }
  - { id: ERR_DUPLICATE_ISOLATION_ORDER, http: 409, condition: "an order with status ORDERED or ACTIVE already exists for (patient_id, precaution_type)" }
  - { id: ERR_DUPLICATE_OUTBREAK_OPEN, http: 409, condition: "an investigation with status TRIGGERED or CONFIRMED already exists for unit + organism (case-insensitive)" }
  - { id: ERR_AUDIT_ELEMENTS_INVALID, http: 422, condition: "elements_passed > elements_checked or elements_checked < 1" }
  - { id: ERR_DUPLICATE_NHSN_ORG_ID, http: 409, condition: "another facility already uses this nhsn_org_id" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "another patient already uses this mrn" }

  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent row's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Facility/location configuration and logical-clock operator"
    identity: opaque
    exclusive_operations:
      - "POST /api/facilities"
      - "PUT /api/facilities/{id}"
      - "POST /api/units"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: InfectionPreventionist
    description: "Infection preventionist: surveillance case work-up and adjudication, NHSN summary preparation and submission, isolation ordering, outbreak opening, corrective-action drafting"
    identity: opaque
    exclusive_operations:
      - "POST /api/infection-cases (+ begin-review / adjudicate / reopen)"
      - "POST /api/monthly-summaries (+ submit / amend)"
      - "POST /api/outbreak-investigations"
      - "POST /api/isolation-orders"
      - "POST /api/corrective-action-plans (+ activate / submit-for-verification)"
    shared_operations:
      - "all GET endpoints"

  - name: InfectionControlDirector
    description: "Infection control director: NHSN submission review (accept/reject), outbreak confirmation and closure, corrective-action verification — deliberately disjoint from InfectionPreventionist to enforce segregation of duties"
    identity: opaque
    exclusive_operations:
      - "POST /api/monthly-summaries/{id}/accept"
      - "POST /api/monthly-summaries/{id}/reject"
      - "POST /api/outbreak-investigations/{id}/confirm | rule-out | close"
      - "POST /api/corrective-action-plans/{id}/verify | fail-verification"
    shared_operations:
      - "all GET endpoints"

  - name: UnitNurseManager
    description: "Unit nurse manager: census (admit/transfer/discharge), device episodes, surgical procedures, daily denominator collection and correction, isolation start/discontinue, isolation compliance audits, hand-hygiene observations"
    identity: opaque
    exclusive_operations:
      - "POST /api/patients (+ transfer / discharge)"
      - "POST /api/device-episodes (+ remove)"
      - "POST /api/surgical-procedures"
      - "POST /api/device-day-counts; PUT /api/device-day-counts/{id}"
      - "POST /api/isolation-orders/{id}/start | discontinue"
      - "POST /api/isolation-compliance-audits"
      - "POST /api/hand-hygiene-observations"
    shared_operations:
      - "all GET endpoints"

  - name: EmployeeHealthNurse
    description: "Employee health nurse: employee registry, occupational exposure reporting and serology follow-up"
    identity: opaque
    exclusive_operations:
      - "POST /api/employees"
      - "POST /api/employee-exposures (+ record-source-serologies / record-draw / mark-lost-to-followup)"
    shared_operations:
      - "all GET endpoints"
