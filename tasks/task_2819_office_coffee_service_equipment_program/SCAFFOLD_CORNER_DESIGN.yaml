              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { stale_v: "$.data.version" }
            - call: "PATCH /ocs/sites/${site_id}"
              payload: { headcount: 45 }
              as: AccountManager
          trigger:
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${stale_v}" }
              as: AccountManager
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /ocs/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { fresh_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${fresh_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "GET /ocs/sites/${site_id}"
              payload: {}
              as: AccountManager
          assert:
            - "the first placement attempt is HTTP 412 with data.error_id == ERR_STALE_SITE_VERSION because ${stale_v} is one behind after the PATCH"
            - "the rejected attempt wrote nothing: GET /ocs/equipment-placements?site_id=${site_id} has total_count == 0, EquipmentAsset.${asset_id}.asset_status is still IN_STOCK and Site.version is unchanged at ${fresh_v}"
            - "${fresh_v} == ${stale_v} + 1 - the PATCH incremented the site version exactly once"
            - "the identical body with ${fresh_v} is HTTP 201 with placement_status ACTIVE and compliance_status MEETING"
            - "the successful placement bumps the site again, so the final read reports version == ${fresh_v} + 1 and the token ${fresh_v} would now itself be stale"

