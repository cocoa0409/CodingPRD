            - "A USD 100000 ticket validated by AA with three coupons (JFK-LHR/AA/ECONOMY/3451, LHR-CDG/BB/ECONOMY/216, CDG-FCO/CC/BUSINESS/693), all flown."
            - "A FINAL run has allocated 66601 / 12000 / 21399."
