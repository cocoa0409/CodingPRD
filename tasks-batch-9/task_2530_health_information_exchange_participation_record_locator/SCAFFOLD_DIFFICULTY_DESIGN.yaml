            - call: "POST /hie/participants/${pB2_id}/patient-records"
              payload: { source_mrn: "B2-0002", given_name: "Amara", family_name: "Okonjo", birth_date: "1986-09-30", sex: "F", ssn_last4: "7734", postal_code: "33139", phone_digits: "3035550122" }
              as: HieAdmin
              captures: { recB_r2: $.data.id }
            - call: "GET /hie/match-links"
              payload: { left_record_id: "${recB_l2}", right_record_id: "${recB_r2}" }
              as: PrivacyOfficer
              captures: { linkB2_score: "$.data[0].match_score", linkB2_status: "$.data[0].status", linkB2_cfg: "$.data[0].threshold_config_id" }
          assert:
            - "${linkB1_score} == 0.9200"
