  # =========================================================================
  # SECTION 2 - state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: capacity_study_starts_in_draft_with_zeroed_metrics
        claim_type: initial_state
        grounds: [state_machines.CapacityStudy.initial_state, entities.CapacityStudy]
        distinguishing_aspect: "A freshly created study must be DRAFT with revision_round 0, every capacity and utilization field at its declared zero and certification stamps null; the authoring user is captured from the request header at creation, not at submission."
        test_recipe:
          setup: ["one campus and a matching class-size policy; no rooms yet, because capacity is only computed at submission"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/class-size-policies"
              payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { policy_id: id }
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 10.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id, school_version_1: version }
          trigger:
            call: "POST /facilities/capacity-studies"
            payload: { school_id: "${school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "DISTRICT_POLICY", expected_school_version: "${school_version_1}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          assert:
            - "response status is 201"
            - "data.status == \"DRAFT\""
            - "data.revision_round == 0"
            - "data.authored_by_user_id == \"planner-1\""
            - "data.certified_by_user_id == null and data.certified_on == null"
            - "data.gross_room_seats == 0 and data.set_aside_deduction_seats == 0 and data.program_capacity_seats == 0"
            - "data.projected_enrollment_total == 0 and data.utilization_pct == 0 and data.portable_trigger_met == false"
