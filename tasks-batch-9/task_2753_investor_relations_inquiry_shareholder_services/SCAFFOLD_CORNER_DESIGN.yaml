          assert:
            - "trigger step 1 responds HTTP 200 with $.data.status == 'WITHDRAWN', $.data.withdrawal_reason == 'Legal review pulled the release before publication.', $.data.published_at == null, $.data.version == 2"
            - "trigger step 2 responds HTTP 409 with $.data.error_id == ERR_DISCLOSURE_INVALID_STATE"
            - "trigger step 3 responds HTTP 409 with $.data.error_id == ERR_DISCLOSURE_INVALID_STATE"
            - "Disclosure.${d_id}.version == 2 and Company.${co_id}.version == 1 — the DRAFT withdrawal branch touched no other row"

      - name: inquiry_auto_escalates_at_the_sensitivity_threshold
        claim_type: valid_transition
        grounds:
