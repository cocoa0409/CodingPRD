  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fa_rate_cap_boundary
        grounds:
          - calculations.indirect_cost
          - entities.FundingOpportunity.fields.fa_rate_cap_pct
          - entities.Proposal.fields.fa_rate_pct_applied
        distinguishing_aspect: |
          Metric: rate percent; endpoint: budget-finalizations. A selected FINAL
          rate of 56.50% against cap 54.00 applies exactly 54.00 (min clamp,
          indirect 5400000 on a 10000000 base); a selected rate exactly equal to
          the cap (54.00 == 54.00) is allowed and applies 54.00 — no off-by-one
          rejection at the boundary.
        test_recipe:
          setup:
            - "Opportunity C1 with fa_rate_cap_pct 54.00; opportunity C2 with cap 54.00; eligible PI"
            - "FINAL rate 56.50% and FINAL rate 54.00%? — separate proposals per case to keep rate selection unambiguous: C1 case uses OFF_CAMPUS 56.50 FINAL; C2 case uses OFF_CAMPUS 54.00 FINAL on a distinct window"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "C1", activity_codes_allowed: ["RESEARCH_OFF_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, fa_rate_cap_pct: 54.00, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_c1: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Thirteen", department_code: "GEOL", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "OFF_CAMPUS_RESEARCH", rate_pct: 56.50, effective_start_on: "2026-01-01", effective_end_on: "2027-01-01", initial_status: "FINAL" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_c1}", pi_id: "${pi_id}", title: "CapOver", activity_code: "RESEARCH_OFF_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_1: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_1}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_1}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_1}/budget-finalizations"
