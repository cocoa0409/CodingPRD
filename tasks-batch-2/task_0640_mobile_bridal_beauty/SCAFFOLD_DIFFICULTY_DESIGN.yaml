  # =====================================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trial_overlap_closed_open_no_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_TRIAL_WINDOW_CONFLICT]
          - entities.TrialSession.fields.start_utc
          - entities.TrialSession.fields.end_utc
        distinguishing_aspect: |
          TrialSession overlap uses closed-open [start,end) with NO buffer: a second trial for the
          same artist starting exactly at the first's end_utc is ALLOWED (adjacency), but one starting
          30 min earlier overlaps and is rejected. Pure point-interval semantics, no buffer.
        test_recipe:
          setup:
            - "artist L1 has a BOOKED trial [2026-06-10T09:00, 10:00) for event A"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: true }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/trials"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T10:00:00Z", trial_fee_cents: 5000 }
              as: Coordinator
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /bridal-beauty/trials"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", start_utc: "2026-06-10T09:30:00Z", end_utc: "2026-06-10T10:30:00Z", trial_fee_cents: 5000 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRIAL_WINDOW_CONFLICT"

      - name: assignment_overlap_with_travel_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
          - entities.ServiceAssignment.fields.window_start_utc
          - entities.ServiceAssignment.fields.window_end_utc
        distinguishing_aspect: |
          ServiceAssignment overlap differs: it adds a 60-min TRAVEL_BUFFER on each side, so a second
          window for the same artist starting only 30 min after the first ends is rejected even though
          the raw intervals don't overlap — buffered-interval semantics, distinct from the trial's
          no-buffer adjacency rule, on a different resource entity.
        test_recipe:
          setup:
            - "artist L1 leads a SCHEDULED assignment [2026-07-15T08:00, 09:00) on event A (deposit paid, contracted)"
            - "a second contracted event B for the same artist with deposit paid, 1 CONFIRMED face"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 4 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T20:00:00Z", ready_by_utc: "2026-07-15T20:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { eA_id: $.data.id }
            - call: "POST /bridal-beauty/events/${eA_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { fa: $.data.id }
            - call: "POST /bridal-beauty/faces/${fa}/confirm"
              payload: {}
              as: Client
