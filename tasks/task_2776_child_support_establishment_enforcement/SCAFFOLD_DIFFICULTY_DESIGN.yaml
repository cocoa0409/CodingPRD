              as: NoncustodialParty
              as_user_id: "${ncp_id}"
              captures: { off_st1: $.data.status, acc_at: $.data.accepted_at, due1: $.data.next_installment_due_date }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { wo_after_accept: $.data.interest_written_off_cents, posture_accept: $.data.enforcement_posture }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 71333, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { a_arr: $.data.applied_arrears_cents, a_int: $.data.applied_interest_cents, a_cur: $.data.applied_current_cents, a_un: $.data.unapplied_credit_cents }
            - call: "GET /child-support/compromise-offers/${offer_id}"
              as: FinanceOfficer
              captures: { off_st2: $.data.status, cpc: $.data.compliance_payment_count, due2: $.data.next_installment_due_date }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
              captures:
                p_pre: $.data.arrears_principal_cents
                r_pre: $.data.interest_receivable_cents
                wo_pre: $.data.interest_written_off_cents
                col_pre: $.data.total_collected_principal_cents
                ic_pre: $.data.interest_collected_cents
                charged: $.data.total_charged_principal_cents
          trigger:
            - call: "POST /child-support/compromise-offers/${offer_id}/default-declaration"
              payload: {}
              as: FinanceOfficer
              captures: { off_st3: $.data.status, def_at: $.data.defaulted_at, waiver_still: $.data.interest_waiver_cents }
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
              captures:
                p_post: $.data.arrears_principal_cents
                r_post: $.data.interest_receivable_cents
                wo_post: $.data.interest_written_off_cents
                col_post: $.data.total_collected_principal_cents
                ic_post: $.data.interest_collected_cents
                posture_post: $.data.enforcement_posture
                unapplied_post: $.data.unapplied_credit_cents
          assert:
            - "${monthly} == 82500"
            - "${c_tier} == \"MEDIUM\"  # 53, so the offer may be created"
            - "${p0} == 495000"
            - "${r0} == 8664  # aggregate_month_end at 2027-02-01: 56 snapshots pooled -> 8664"
            - "${snap_p} == 495000"
            - "${snap_i} == 8664"
            - "${pre} == 503664"
            - "${tier} == 0.50  # 503664 > 500000, so the second band applies to the PRE-waiver total"
            - "${waiver} == 4332  # round_half_up(8664 * 0.50)"
            - "${settle} == 499332  # 503664 - 4332"
            - "${mo} == 71333  # floor(499332 / 7)"
            - "${fin} == 71334  # 499332 - 71333*6"
            - "${off_st1} == \"ACCEPTED\""
            - "${acc_at} == \"2027-02-01T00:00:00Z\""
            - "${due1} == \"2027-03-01\"  # accepted_at date + 1 month"
            - "${wo_after_accept} == 4332"
            - "${posture_accept} == \"STAYED\""
            - "${a_cur} == 0  # 2027-02-01 is not inside any charge period, all six are [start, end) closed before it"
            - "${a_arr} == 71333  # bucket 3 takes it all from the oldest charge, due 2026-08-15"
            - "${a_int} == 0  # nothing is left for bucket 4"
            - "${a_un} == 0"
            - "${off_st2} == \"ACTIVE\""
            - "${cpc} == 1"
            - "${due2} == \"2027-04-01\"  # advanced one month by the installment"
            - "${p_pre} == 423667  # 495000 - 71333"
            - "${charged} == 495000"
            - "${wo_pre} == 4332"
            - "${col_pre} == 71333"
            - "${ic_pre} == 0"
            - "${r_pre} == 6426  # gross aggregate 10758 at 2027-04-02, minus 4332 written off, minus 0 collected"
            - "${off_st3} == \"DEFAULTED\"  # 2027-04-02 > 2027-04-01"
            - "${def_at} == \"2027-04-02T00:00:00Z\""
            - "${waiver_still} == 4332  # the offer keeps its own waiver figure; only the case-level write-off is reversed"
            - "${wo_post} == 0  # 4332 - 4332"
            - "${r_post} == 10758  # the full gross aggregate figure is receivable again"
            - "${r_pre} + ${wo_pre} + ${ic_pre} == 10758  # interest conserved before the compensation"
            - "${r_post} + ${wo_post} + ${ic_post} == 10758  # and after it - the waiver moved buckets, it was never created or destroyed"
            - "${r_post} - ${r_pre} == 4332  # exactly the reinstated waiver, no interest re-accrued as a side effect"
            - "${col_post} == 71333  # no clawback of the installment already applied"
            - "${p_post} == 423667  # principal untouched by the compensation"
            - "${p_post} + ${col_post} == ${charged}  # principal conserved: 423667 + 71333 == 495000"
            - "${unapplied_post} == 0  # nothing was pushed to unapplied credit"
            - "${posture_post} == \"ESCALATED\""

      - name: iwo_termination_conserves_employer_active_iwo_count
        grounds:
          - state_machines.IncomeWithholdingOrder.service_status.ISSUED_to_TERMINATED
          - state_machines.IncomeWithholdingOrder.service_status.SERVED_to_TERMINATED
          - entities.Employer.fields.active_iwo_count
          - validations[priority=10]
          - errors[ERR_INVALID_IWO_STATUS]
          - calculations.withholding_amount
        distinguishing_aspect: |
          Employer.active_iwo_count must always equal that employer's IWO count
          in {SERVED, AMENDED}: terminating a never-served ISSUED IWO leaves the
          counter at 0 (no phantom decrement to -1), terminating the SERVED one
          takes its employer from 1 to 0, and a repeat termination is refused
          with ERR_INVALID_IWO_STATUS without decrementing again.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED; PRESUMED_MARITAL paternity."
            - "One CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at 75000, with exactly one OPEN charge of 75000 so arrears_principal_cents is 75000 - below 3 x 75000 = 225000, which keeps federal_cap_pct at the 0.60 base."
            - "Two MN employers, each remittance_fee_cents 0, so statutory_cap_pct is null and the federal cap governs; each starts at active_iwo_count 0."
            - "IWO A on employer 1 and IWO B on employer 2, both with reported_disposable_income_cents 234000: arrears_recovery 15000, requested 75000 + 0 + 15000 = 90000, ccpa cap floor(234000 * 0.60) = 140400, withholding 90000 each. The aggregate check passes: 90000 + 90000 = 180000 <= floor(468000 * 0.60) = 280800."
            - "Each IWO creation bumps SupportOrder.version, so a fresh order version is read immediately before each one."
            - "Only IWO A is served, so employer 1 is at active_iwo_count 1 and employer 2 is still at 0 while holding an ISSUED IWO."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Wren Xu", ssn_last4: "3636", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Yan Xu", ssn_last4: "3737", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: $.data.monthly_obligation_cents }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
            - call: "POST /child-support/employers"
              payload: { legal_name: "Bluestem Machining", fein: "41-0000021", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { emp1_id: $.data.id, e1_count0: $.data.active_iwo_count, e1_cap: $.data.statutory_cap_pct }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Cedar Line Logistics", fein: "41-0000022", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { emp2_id: $.data.id, e2_count0: $.data.active_iwo_count }
            - call: "GET /child-support/orders/${order_id}"
              as: CaseWorker
              captures: { order_v1: $.data.version }
            - call: "POST /child-support/orders/${order_id}/withholding-orders"
              payload: { employer_id: "${emp1_id}", expected_order_version: "${order_v1}", reported_disposable_income_cents: 234000 }
              as: CaseWorker
              captures: { iwoA_id: $.data.id, whA: $.data.withholding_amount_cents, fedA: $.data.federal_cap_pct, capA: $.data.ccpa_cap_amount_cents, arA: $.data.arrears_recovery_cents }
            - call: "GET /child-support/orders/${order_id}"
              as: CaseWorker
              captures: { order_v2: $.data.version }
            - call: "POST /child-support/orders/${order_id}/withholding-orders"
              payload: { employer_id: "${emp2_id}", expected_order_version: "${order_v2}", reported_disposable_income_cents: 234000 }
              as: CaseWorker
              captures: { iwoB_id: $.data.id, whB: $.data.withholding_amount_cents, svcB0: $.data.service_status }
            - call: "POST /child-support/withholding-orders/${iwoA_id}/service"
              payload: {}
              as: CaseWorker
              captures: { svcA1: $.data.service_status, servedA: $.data.served_at, firstA: $.data.first_withholding_due_at }
            - call: "GET /child-support/employers/${emp1_id}"
              as: CaseWorker
              captures: { e1_count1: $.data.active_iwo_count }
            - call: "GET /child-support/employers/${emp2_id}"
              as: CaseWorker
              captures: { e2_count1: $.data.active_iwo_count }
          trigger:
            - call: "POST /child-support/withholding-orders/${iwoB_id}/termination"
              payload: { terminated_reason: "EMPLOYMENT_ENDED" }
              as: CaseWorker
              captures: { svcB1: $.data.service_status, reasonB: $.data.terminated_reason }
            - call: "GET /child-support/employers/${emp2_id}"
              as: CaseWorker
              captures: { e2_count2: $.data.active_iwo_count }
            - call: "POST /child-support/withholding-orders/${iwoA_id}/termination"
              payload: { terminated_reason: "EMPLOYMENT_ENDED" }
              as: CaseWorker
              captures: { svcA2: $.data.service_status, nextA: $.data.next_remittance_due_at }
            - call: "GET /child-support/employers/${emp1_id}"
              as: CaseWorker
              captures: { e1_count2: $.data.active_iwo_count }
            - call: "POST /child-support/withholding-orders/${iwoA_id}/termination"
              payload: { terminated_reason: "CASE_CLOSED" }
              as: CaseWorker
              captures: { err_repeat: $.data.error_id }
            - call: "GET /child-support/employers/${emp1_id}"
              as: CaseWorker
              captures: { e1_count3: $.data.active_iwo_count }
            - call: "GET /child-support/withholding-orders"
              payload: { employer_id: "${emp1_id}", service_status: "SERVED" }
              as: CaseWorker
          assert:
            - "${monthly} == 75000"
            - "${e1_cap} == null  # MN defers to the federal cap"
            - "${e1_count0} == 0"
            - "${e2_count0} == 0"
            - "${arA} == 15000  # round_half_up(75000 * 0.20)"
            - "${fedA} == 0.60  # 75000 arrears < 3 x 75000, so no 0.05 bump"
            - "${capA} == 140400  # floor(234000 * 0.60)"
            - "${whA} == 90000  # min(75000 + 0 + 15000, 140400 - 0)"
            - "${whB} == 90000"
            - "${svcB0} == \"ISSUED\""
            - "${svcA1} == \"SERVED\""
            - "${servedA} == \"2026-08-01T00:00:00Z\""
            - "${firstA} == \"2026-08-15T00:00:00Z\"  # served_at + 14 days"
            - "${e1_count1} == 1  # service is the only event that increments"
            - "${e2_count1} == 0  # employer 2 holds an ISSUED IWO that was never served"
            - "${svcB1} == \"TERMINATED\""
            - "${reasonB} == \"EMPLOYMENT_ENDED\""
            - "${e2_count2} == 0  # NOT -1; an ISSUED->TERMINATED transition must not decrement what was never incremented"
            - "${svcA2} == \"TERMINATED\""
            - "${nextA} == null  # the remittance dimension is frozen"
            - "${e1_count2} == 0  # 1 - 1"
            - "${err_repeat} == \"ERR_INVALID_IWO_STATUS\"  # HTTP 409; TERMINATED is terminal on the service dimension"
            - "${e1_count3} == 0  # the rejected repeat did not decrement to -1"
            - "GET /child-support/withholding-orders?employer_id=${emp1_id}&service_status=SERVED returns an empty list, matching active_iwo_count 0"
