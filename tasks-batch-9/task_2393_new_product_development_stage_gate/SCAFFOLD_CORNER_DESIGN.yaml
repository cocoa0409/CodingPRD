            - "all four trigger calls return 409 with data.error_id == ERR_PROJECT_INVALID_STATE"
            - "the version-carrying calls are refused on state, not on concurrency, so no ERR_PROJECT_VERSION_CONFLICT appears"
            - "GET /innovation-projects/${tk_p_id}/business-cases and GET /innovation-projects/${tk_p_id}/formulations both return total_count 0"
            - "GET /gate-reviews?project_id=${tk_p_id} returns total_count 0"
            - "InnovationProject.${tk_p_id}.version == ${tk_p_v2}, so four refused writes left no trace"

      - name: sm_waived_deliverable_satisfies_checklist_but_not_launch_readiness
        claim_type: conditional_cascade
        grounds:
          - state_machines.Deliverable.PENDING_to_WAIVED
          - calculations.deliverable_completeness_pct
          - calculations.launch_readiness_pct
          - endpoints[GET /innovation-projects/{id}/launch-readiness]
