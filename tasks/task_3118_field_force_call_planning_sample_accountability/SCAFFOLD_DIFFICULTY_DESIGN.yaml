      - name: zero_quantity_transfer_and_empty_expected_denominator
        grounds:
          - validations[priority=4]
          - calculations.count_variance_and_discipline
        distinguishing_aspect: |
          Metric = zero-quantity / empty-denominator edge (different metric
          from the percentage boundary): a transfer with quantity 0 is a
          malformed request (ERR_INVALID_REQUEST, priority 4), and a count
          session whose expected total is 0 uses max(sum,1)=1 so a counted 1
          unit surplus yields variance_pct 100.00 -> SUSPENSION_REVIEW rather
          than a division error.
        test_recipe:
          setup:
