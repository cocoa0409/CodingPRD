  - method: GET
    path: /water-treatment/service-agreements/{agreement_id}
    purpose: "Fetch one service agreement with both reserve commitment variants, the available reserve and the settlement variance."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: []
