# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Sections and claim_types are taken
# from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_producer_mints_system_fields_and_defaults
        claim_type: creation
        grounds: ["entities.Producer", "endpoints.POST_/producers"]
        distinguishing_aspect: "POST /producers returns 201 with a bare UUID id (no type prefix), version 1, enrollment_status NOT_ENROLLED, incentive_tier TIER_0, on_time_movement_pct 100.00 and incentive_balance_cents 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
          trigger:
            - call: "POST /producers"
              payload: { legal_name: "Alpine Cattle", contact_email: "ops@alpine.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_1: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Producer.${prod_1}.id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ with no prefix"
            - "Producer.${prod_1}.version == 1"
            - "Producer.${prod_1}.enrollment_status == NOT_ENROLLED"
            - "Producer.${prod_1}.enrolled_at is null"
            - "Producer.${prod_1}.incentive_tier == TIER_0"
            - "Producer.${prod_1}.enrolled_head_count == 0"
            - "Producer.${prod_1}.on_time_movement_pct == 100.00"
            - "Producer.${prod_1}.incentive_balance_cents == 0"
            - "Producer.${prod_1}.created_at == 2026-08-01T00:00:00.000Z"

      - name: producer_privacy_level_defaults_to_standard_when_omitted
        claim_type: defaults
        grounds: ["entities.Producer.fields.privacy_level"]
        distinguishing_aspect: "Omitting privacy_level yields STANDARD; supplying RESTRICTED stores RESTRICTED."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Default Co", contact_email: "a@x.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_def: $.data.id, lvl_def: $.data.privacy_level }
          trigger:
            - call: "POST /producers"
              payload: { legal_name: "Restricted Co", contact_email: "b@x.example", state_code: "CO", privacy_level: "RESTRICTED" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_res: $.data.id }
          assert:
            - "${lvl_def} == STANDARD"
            - "Producer.${prod_res}.privacy_level == RESTRICTED"

      - name: premises_creation_missing_required_capacity_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", "endpoints.POST_/premises"]
        distinguishing_aspect: "capacity has source input with no default, so omitting it fails at priority 3 with ERR_INVALID_REQUEST (400) before any existence check runs."
        test_recipe:
          setup:
            - "One producer exists."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Alpine Cattle", contact_email: "ops@alpine.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_2: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { producer_id: "${prod_2}", pin: "COA0001", operation_type: "COW_CALF", state_code: "CO" }
              as: Producer
              as_user_id: "${prod_2}"
              captures: { err_req: $.data.error_id }
          assert:
            - "${err_req} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /premises?producer_id=${prod_2} returns an empty array with total_count 0"

      - name: premises_invalid_operation_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Premises.fields.operation_type", "validations[priority=3]"]
        distinguishing_aspect: "operation_type accepts only COW_CALF, FEEDLOT, MARKET and HARVEST_FACILITY; DAIRY is rejected with ERR_INVALID_REQUEST rather than stored."
        test_recipe:
          setup:
            - "One producer exists."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Alpine Cattle", contact_email: "ops@alpine.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_3: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { producer_id: "${prod_3}", pin: "COA0002", operation_type: "DAIRY", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_3}"
              captures: { err_enum: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"

      - name: get_premises_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_PREMISES_NOT_FOUND]", "errors[ERR_ANIMAL_NOT_FOUND]", "errors[ERR_SIGHTING_NOT_FOUND]", "errors[ERR_MOVEMENT_NOT_FOUND]", "errors[ERR_TRACE_REQUEST_NOT_FOUND]", "errors[ERR_HOLD_ORDER_NOT_FOUND]", "errors[ERR_TAG_NOT_FOUND]", "errors[ERR_TAG_LOT_NOT_FOUND]", "errors[ERR_SUPPLIER_NOT_FOUND]", "errors[ERR_PRODUCER_NOT_FOUND]", "errors[ERR_AWARD_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET answers 404 with its own entity-specific error_id for a syntactically valid but unknown UUID."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
          trigger:
            - call: "GET /premises/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_prem: $.data.error_id }
            - call: "GET /animals/11111111-1111-4111-8111-111111111112"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_an: $.data.error_id }
            - call: "GET /sightings/11111111-1111-4111-8111-111111111113"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_sight: $.data.error_id }
            - call: "GET /movement-events/11111111-1111-4111-8111-111111111114"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_mv: $.data.error_id }
            - call: "GET /trace-requests/11111111-1111-4111-8111-111111111115"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_tr: $.data.error_id }
            - call: "GET /hold-orders/11111111-1111-4111-8111-111111111116"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_ho: $.data.error_id }
            - call: "GET /tags/11111111-1111-4111-8111-111111111117"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_tag: $.data.error_id }
            - call: "GET /tag-lots/11111111-1111-4111-8111-111111111118"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_lot: $.data.error_id }
            - call: "GET /device-suppliers/11111111-1111-4111-8111-111111111119"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_sup: $.data.error_id }
            - call: "GET /producers/11111111-1111-4111-8111-11111111111a"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { e_prod: $.data.error_id }
          assert:
            - "${e_prem} == ERR_PREMISES_NOT_FOUND and HTTP 404"
            - "${e_an} == ERR_ANIMAL_NOT_FOUND and HTTP 404"
            - "${e_sight} == ERR_SIGHTING_NOT_FOUND and HTTP 404"
            - "${e_mv} == ERR_MOVEMENT_NOT_FOUND and HTTP 404"
            - "${e_tr} == ERR_TRACE_REQUEST_NOT_FOUND and HTTP 404"
            - "${e_ho} == ERR_HOLD_ORDER_NOT_FOUND and HTTP 404"
            - "${e_tag} == ERR_TAG_NOT_FOUND and HTTP 404"
            - "${e_lot} == ERR_TAG_LOT_NOT_FOUND and HTTP 404"
            - "${e_sup} == ERR_SUPPLIER_NOT_FOUND and HTTP 404"
            - "${e_prod} == ERR_PRODUCER_NOT_FOUND and HTTP 404"

      - name: premises_list_paginates_and_filters_by_producer
        claim_type: listing
        grounds: ["endpoints.GET_/premises", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /premises?producer_id=X&limit=2&offset=0 returns exactly 2 of the 3 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One producer owns three premises, all still PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Three Peaks", contact_email: "ops@threepeaks.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_l: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_l}", pin: "COL0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_l}"
            - call: "POST /premises"
              payload: { producer_id: "${prod_l}", pin: "COL0002", operation_type: "FEEDLOT", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_l}"
            - call: "POST /premises"
              payload: { producer_id: "${prod_l}", pin: "COL0003", operation_type: "MARKET", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_l}"
          trigger:
            - call: "GET /premises"
              payload: { producer_id: "${prod_l}", limit: 2, offset: 0 }
              as: Producer
              as_user_id: "${prod_l}"
            - call: "GET /premises"
              payload: { producer_id: "${prod_l}", limit: 2, offset: 2 }
              as: Producer
              as_user_id: "${prod_l}"
          assert:
            - "First call: response_type == array, data has length 2, meta-level total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: data has length 1, total_count == 3, has_more == false"
            - "All returned rows have producer_id == ${prod_l} and registration_status == PENDING_REVIEW"

      - name: sighting_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds: ["entities.Sighting", "endpoints.GET_/sightings/{id}"]
        distinguishing_aspect: "Sighting declares common_fields false, so a fetched sighting exposes id and created_at but no version and no updated_at, and there is no endpoint that mutates one directly."
        test_recipe:
          setup:
            - "One animal was tagged at an ACTIVE premises, producing exactly one sighting."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Immutable Ranch", contact_email: "ops@immutable.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_im: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_im}", pin: "COI0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_im}"
              captures: { pim: $.data.id }
            - call: "POST /premises/${pim}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_im: $.data.id }
            - call: "POST /device-suppliers/${sup_im}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_im_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_im}", premises_id: "${pim}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_im_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_im}"
              captures: { lot_im: $.data.id }
            - call: "POST /tag-lots/${lot_im}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-04-04", birth_premises_id: "${pim}" }
              as: Producer
              as_user_id: "${prod_im}"
              captures: { an_im: $.data.id }
            - call: "GET /sightings"
              payload: { animal_id: "${an_im}" }
              as: Producer
              as_user_id: "${prod_im}"
              captures: { sight_im: "$.data[0].id" }
          trigger:
            - call: "GET /sightings/${sight_im}"
              payload: {}
              as: Producer
              as_user_id: "${prod_im}"
          assert:
            - "Response data contains id and created_at"
            - "Response data does NOT contain a version key and does NOT contain an updated_at key"
            - "Sighting.${sight_im}.sequence_no == 1 and .sighting_type == TAG_APPLIED and .reversed == false"

      - name: tag_lot_quantity_and_fee_are_computed_not_client_supplied
        claim_type: computed_fields
        grounds: ["entities.TagLot.fields.quantity", "entities.TagLot.fields.fee_cents", "calculations.tag_lot_issuance_fee"]
        distinguishing_aspect: "quantity and fee_cents carry source computed: a 500-device range yields quantity 500 and fee_cents 25000 + 42*500 = 46000 with discount_pct_applied 0.00, derived entirely from serial_start and serial_end."
        test_recipe:
          setup:
            - "APPROVED supplier with score 100.00 (probation false) and one ACTIVE premises."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Computed Co", contact_email: "ops@computed.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_cf: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_cf}", pin: "COC0001", operation_type: "FEEDLOT", state_code: "CO", capacity: 600 }
              as: Producer
              as_user_id: "${prod_cf}"
              captures: { pcf: $.data.id }
            - call: "POST /premises/${pcf}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "Y-Tex Devices", supplier_code: "YTEX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_cf: $.data.id }
            - call: "POST /device-suppliers/${sup_cf}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_cf_v: $.data.version }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_cf}", premises_id: "${pcf}", serial_start: 100000000001, serial_end: 100000000500, expected_supplier_version: "${sup_cf_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_cf}"
              captures: { lot_cf: $.data.id }
          assert:
            - "TagLot.${lot_cf}.quantity == 500"
            - "TagLot.${lot_cf}.fee_cents == 46000"
            - "TagLot.${lot_cf}.discount_pct_applied == 0.00"
            - "TagLot.${lot_cf}.surcharge_cents == 0"
            - "TagLot.${lot_cf}.unapplied_count == 500 and .applied_count == 0"
            - "TagLot.${lot_cf}.status == ISSUED"

      - name: tag_lot_creation_with_unknown_premises_returns_premises_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_PREMISES_NOT_FOUND]"]
        distinguishing_aspect: "Body foreign keys are resolved at priority 5, so a lot naming a non-existent premises fails with ERR_PREMISES_NOT_FOUND (404) even though supplier, OCC version and serial range are all valid."
        test_recipe:
          setup:
            - "APPROVED supplier exists; no premises with the requested id exists."
          setup_api_calls:
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_fk: $.data.id }
            - call: "POST /device-suppliers/${sup_fk}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_fk_v: $.data.version }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_fk}", premises_id: "22222222-2222-4222-8222-222222222222", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_fk_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_fk}"
              captures: { err_fk: $.data.error_id }
          assert:
            - "${err_fk} == ERR_PREMISES_NOT_FOUND"
            - "HTTP status is 404"
            - "DeviceSupplier.${sup_fk}.issued_tag_count == 0 and .version is unchanged"

      - name: tag_replacement_chain_is_discoverable_through_self_referential_fk
        claim_type: graph_topology_many_to_many
        grounds: ["entities.Tag.fields.replaces_tag_id", "endpoints.GET_/tags", "state_machines.Tag.APPLIED_to_REPLACED"]
        distinguishing_aspect: "After a replacement the old device is REPLACED and the new device carries replaces_tag_id == old id, so GET /tags?replaces_tag_id=<old> returns exactly the one successor row."
        test_recipe:
          setup:
            - "One animal at an ACTIVE premises carries device 840100000000001 from a 10-device lot."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Chain Ranch", contact_email: "ops@chain.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_ch: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_ch}", pin: "COH0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_ch}"
              captures: { pch: $.data.id }
            - call: "POST /premises/${pch}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_ch: $.data.id }
            - call: "POST /device-suppliers/${sup_ch}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_ch_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_ch}", premises_id: "${pch}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_ch_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_ch}"
              captures: { lot_ch: $.data.id }
            - call: "POST /tag-lots/${lot_ch}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-04-05", birth_premises_id: "${pch}" }
              as: Producer
              as_user_id: "${prod_ch}"
              captures: { an_ch: $.data.id }
            - call: "GET /tags"
              payload: { animal_id: "${an_ch}" }
              as: Producer
              as_user_id: "${prod_ch}"
              captures: { tag_ch: "$.data[0].id" }
          trigger:
            - call: "POST /tags/${tag_ch}/replace"
              payload: { replacement_ain: "840100000000002", tag_lot_id: "${lot_ch}" }
              as: Producer
              as_user_id: "${prod_ch}"
              captures: { tag_ch2: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Tag.${tag_ch}.device_status == REPLACED"
            - "Tag.${tag_ch2}.device_status == APPLIED and .replaces_tag_id == ${tag_ch} and .animal_id == ${an_ch}"
            - "Animal.${an_ch}.ain == 840100000000002"
            - "TagLot.${lot_ch}.applied_count == 1 and .replaced_count == 1 and .unapplied_count == 8"
            - "GET /tags?replaces_tag_id=${tag_ch} returns exactly 1 row whose id == ${tag_ch2}"
            - "Animal.${an_ch}.sighting_count == 1 (replacement appends no sighting)"

  - section: state_machines
    instances:

      - name: entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds: ["state_machines.Premises", "state_machines.TagLot", "state_machines.Animal", "state_machines.HoldOrder", "state_machines.ReconciliationRun"]
        distinguishing_aspect: "A fresh Premises is PENDING_REVIEW/CLEAR, a fresh TagLot is ISSUED, a fresh Animal is ACTIVE/NORMAL, a fresh HoldOrder is PROPOSED and a fresh ReconciliationRun is DRAFT."
        test_recipe:
          setup:
            - "Empty database; APPROVED supplier and one ACTIVE premises are built along the way."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Initial Co", contact_email: "ops@initial.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_in: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_in}", pin: "CON0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_in}"
              captures: { pin_p: $.data.id, reg0: $.data.registration_status, health0: $.data.health_status }
            - call: "POST /premises/${pin_p}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
              captures: { pin_v: $.data.version }
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_in: $.data.id, sup_status0: $.data.status }
            - call: "POST /device-suppliers/${sup_in}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_in_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_in}", premises_id: "${pin_p}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_in_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_in}"
              captures: { lot_in: $.data.id, lot_status0: $.data.status }
          trigger:
            - call: "POST /tag-lots/${lot_in}/apply-tag"
              payload: { ain: "840100000000001", species: "OVINE", birth_date: "2026-04-06", birth_premises_id: "${pin_p}" }
              as: Producer
              as_user_id: "${prod_in}"
              captures: { an_in: $.data.id, an_life0: $.data.lifecycle_status, an_trace0: $.data.trace_status }
            - call: "POST /hold-orders"
              payload: { premises_id: "${pin_p}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-05T00:00:00Z", expected_premises_version: "${pin_v}" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
              captures: { ho_in: $.data.id, ho_status0: $.data.status }
          assert:
            - "${reg0} == PENDING_REVIEW and ${health0} == CLEAR"
