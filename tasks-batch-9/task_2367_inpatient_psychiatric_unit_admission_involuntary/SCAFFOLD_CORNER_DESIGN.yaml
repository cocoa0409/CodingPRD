      - name: explicit_bed_eligibility_and_empty_candidate_pool
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - validations[priority=49]
          - validations[priority=16]
          - calculations.bed_placement_selector
          - errors[ERR_BED_NOT_ELIGIBLE]
          - errors[ERR_NO_ELIGIBLE_BED]
          - errors[ERR_ADMISSION_NOT_PLACEABLE]
        distinguishing_aspect: "An explicitly named bed must clear four separate conditions (same unit, AVAILABLE, a placement bed_type, and LIGATURE_RESISTANT_OBSERVATION when the admission is HIGH acuity) and each failure is 409 ERR_BED_NOT_ELIGIBLE; omitting bed_id instead runs the selector, whose empty candidate pool is a different error at a lower priority - reachable only after the posture gate has been satisfied by an override - and once placed the admission is no longer placeable at all."
        test_recipe:
          setup:
            - "Roster: intake clinician Nolan, psychiatrist Reyes, charge nurse Kim; clock set to 2026-09-03T08:00:00Z."
            - "Unit U (MIXED_ALLOWED): bed 521-A STANDARD AVAILABLE, bed 522-A SECLUSION AVAILABLE, bed 523-A STANDARD moved to OUT_OF_SERVICE. So licensed_placement_bed_count is 1, raw_available_bed_count is 1, posture is RESTRICTED and effective_available_bed_count is 0."
            - "Unit V (MIXED_ALLOWED) with bed 531-A STANDARD AVAILABLE, used as a foreign bed."
            - "One adult patient with an evaluation (self true, others true, grave true, capacity true) signed at 2026-09-03T08:00:00Z: score 12 -> HIGH with recommended_status VOLUNTARY, so the admission is HIGH acuity yet needs no hold; safety search completed."
