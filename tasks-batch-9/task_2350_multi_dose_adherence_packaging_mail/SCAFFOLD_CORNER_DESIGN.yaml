        distinguishing_aspect: "The STAGED -> IN_TRANSIT hop stamps a tracking number and dispatched_at, and on a pouch-free cycle it deliberately does NOT move the packaging dimension, whose SHIPPED hop is guarded from VERIFIED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient whose only prescription is refrigerated insulin, so the cycle has exactly one COLD_CHAIN line and never builds a roll"
            - "cycle C1 [2026-08-15, 2026-09-12) adjudicated to LINES_ADJUDICATED / CLEARED, one COLD_CHAIN parcel staged"
