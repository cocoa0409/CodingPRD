      - name: omitted_variant_defaults_to_rolling_six_and_the_tier_never_follows_the_quarter
        claim_type: variant_selection
        grounds:
          - calculations.no_show_risk_score.variants
          - endpoints[GET /patients/{id}/no-show-risk]
          - entities.Patient.fields.reminder_tier
        distinguishing_aspect: |
          Six terminal visits all sit in 2026 Q2 while the clock sits in Q3, so
          QUARTER_TO_DATE has an EMPTY input set and returns 0.00 over 0 considered rows
          while ROLLING_6 returns 48.33 over 6. The corner pins the selection rules rather
          than the arithmetic: omitting the variable returns the ROLLING_6 figure
          byte-identically, and the reminder_tier field is INTENSIVE in BOTH responses
          because the tier is always derived from ROLLING_6 — a payer-facing 0.00 must
          never downgrade the outreach cadence.
        test_recipe:
          setup:
            - "One center, the standing drug, a MID template, one patient and one ACTIVE 12-cycle plan; the clock stays at 2026-08-01T00:00:00Z (Q3)."
            - "Six terminal visits are injected inside 2026 Q2, newest first: 2026-06-20 NO_SHOW, 2026-06-13 CANCELLED late, 2026-06-06 COMPLETED, 2026-05-30 CANCELLED not late, 2026-05-23 COMPLETED, 2026-05-16 NO_SHOW."
            - "Weighted sum = 100*1.00 + 85*0.50 + 70*0 + 55*0.25 + 40*0 + 25*1.00 = 181.25 over total_w 375 -> 48.3333 -> 48.33."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 12, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-05-16", schedule_status: "NO_SHOW", chair_minutes: 240, start_minute: 540 }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-05-23", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780 }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-05-30", schedule_status: "CANCELLED", chair_minutes: 240, start_minute: 540, late_cancellation: false }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-06-06", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780 }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-06-13", schedule_status: "CANCELLED", chair_minutes: 240, start_minute: 540, late_cancellation: true }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-06-20", schedule_status: "NO_SHOW", chair_minutes: 240, start_minute: 540 }
              as: Scheduler
          trigger:
            - call: "GET /patients/${pt1}/no-show-risk"
              payload: {}
              as: Scheduler
              captures: { def_variant: $.data.variant, def_score: $.data.score, def_tier: $.data.reminder_tier, def_considered: $.data.considered_appointment_count }
            - call: "GET /patients/${pt1}/no-show-risk"
              payload: { variant: "QUARTER_TO_DATE" }
              as: Patient
              as_user_id: "${pt1}"
              captures: { qtd_variant: $.data.variant, qtd_score: $.data.score, qtd_tier: $.data.reminder_tier, qtd_considered: $.data.considered_appointment_count }
          assert:
            - "${def_variant} == 'ROLLING_6' — the omitted variable resolves to the declared default"
            - "${def_score} == 48.33 and ${def_considered} == 6"
            - "${qtd_variant} == 'QUARTER_TO_DATE' and ${qtd_score} == 0.00 and ${qtd_considered} == 0 — no terminal visit falls in Q3 2026"
            - "${def_tier} == 'INTENSIVE' and ${qtd_tier} == 'INTENSIVE' — the tier is ROLLING_6-derived in both responses, never 'STANDARD'"
            - "Patient.${pt1}.no_show_risk_score == 48.33 and reminder_tier == 'INTENSIVE'"
            - "Patient.${pt1}.no_show_strikes == 2 and steering_status == 'SUITE' (2 < 3)"
            - "Both responses echo patient_id == ${pt1}"

      - name: billable_units_rounding_order
        claim_type: aggregation
        excluded_because:
          difficulty_instance: billable_units_ceiling_per_appointment_then_summed_mode_b
          rationale: |
            The pinned rounding order of billable_chair_units — ceil() per appointment and
            only then sum, with the forbidden ceil(sum/15) producing a strictly smaller day
            total whenever two appointments carry a non-zero remainder — is that §1.8
            instance's entire construction, including the per-appointment literals and the
            day_billable_cents product.

      - name: cancellation_share_tier_boundaries
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: cancellation_charge_share_tier_keyed_on_provisional_total_mode_c
          rationale: |
            The tier walk of cancellation_charge — each of the three share brackets keyed on
            the PROVISIONAL total rather than on waste_cost_cents or on the final charge,
            with the inclusive upper edges at 5000 and 25000 — is asserted bracket by
            bracket by that §1.8 instance. The corner set retains only the step-5 rounding
            mode, which that instance does not pin.

      - name: utilization_and_risk_variants_diverge_on_identical_data
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: chair_utilization_scheduled_vs_actual_variant_divergence
          rationale: |
            Both dual-variant calculations already have a dedicated §1.8 divergence instance
            — this one for SCHEDULED versus ACTUAL chair minutes on one identical day, and
            no_show_risk_rolling6_vs_quarter_to_date_variant_divergence for the two risk
            curves — each asserting both variant results and the delta between them. The
            corner set keeps only the variant-SELECTION claim (default resolution and
            tier sourcing), which neither §1.8 instance covers.

  - section: validations
    instances:
      - name: a_second_patient_with_the_same_mrn_is_refused_and_no_row_is_written
        claim_type: violation_to_error
        grounds:
          - validations[priority 130]
          - errors[ERR_DUPLICATE_MRN]
          - entities.Patient.fields.mrn
        distinguishing_aspect: |
          The uniqueness check is system-wide rather than scoped to a center, and it must
          fire before the row is inserted: after the refusal the collection still holds
          exactly one MRN-0001 patient and it is still the original full_name. A different
          MRN on the identical name passes, so the check is keyed on mrn alone.
        test_recipe:
          setup:
            - "No fixtures beyond the first patient — the check touches no other entity."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id, pt1_name: $.data.full_name }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Impostor Two", weight_kg: 55 }
              as: Scheduler
              captures: { err_dupe: $.data.error_id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
          assert:
            - "First trigger HTTP status == 409 and ${err_dupe} == 'ERR_DUPLICATE_MRN'"
            - "GET /patients with mrn == 'MRN-0001' returns exactly 1 row whose id == ${pt1} and full_name == ${pt1_name}"
            - "Second trigger HTTP status == 201 and ${pt2} != ${pt1} — an identical full_name and weight are not part of the key"
            - "Patient.${pt2}.no_show_strikes == 0 and reminder_tier == 'STANDARD' — the new row still gets its declared defaults"

      - name: an_add_on_arriving_exactly_at_the_cutoff_minute_books_a_window_ending_exactly_at_close
