      - name: segregation_of_duties_on_certification
        claim_type: Violation → Error
        excluded_because:
          difficulty_instance: certify_by_preparer_after_window_close_rejects_with_segregation_error
          rationale: "§1.8 already forces ERR_SEGREGATION_OF_DUTIES as the winner of the priority-70-vs-92 pair with the same preparer certifying their own test; a standalone §1.9 instance would repeat that setup with a weaker assertion."

      - name: approval_with_a_pending_background_check
        claim_type: Violation → Error
        excluded_because:
          difficulty_instance: application_approval_depends_on_control_person_clearance
          rationale: "§1.8 covers ERR_BACKGROUND_CHECK_INCOMPLETE end to end, including the CLEARED follow-up that lets the same APPROVE succeed."

      - name: activation_through_a_blocked_expansion_gate
        claim_type: Violation → Error
        excluded_because:
          difficulty_instance: authorization_activation_depends_on_license_expansion_gate
          rationale: "§1.8 already triggers ERR_EXPANSION_GATE_BLOCKED from a posture-driven gate closure and then reopens it, which strictly subsumes a single-shot violation test."

      - name: activation_with_an_insufficient_oversight_score
