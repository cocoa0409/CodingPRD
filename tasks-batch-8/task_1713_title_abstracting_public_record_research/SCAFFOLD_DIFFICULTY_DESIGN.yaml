              payload: { review_slot_start: "2026-08-02T11:30:00Z", review_slot_end: "2026-08-02T12:00:00Z" }
              as: Examiner
              as_user_id: ex_772
              captures: { st: $.data.status }
          assert:
            - "gap of 15 minutes rejected: captured err == ERR_SLOT_CONFLICT, HTTP 409"
            - "gap of exactly 30 minutes accepted: captured st == UNDER_REVIEW (HTTP 200)"
