  - method: GET
    path: "/ugc/moderation-appeals/{id}"
    description: "Get appeal"
    roles: [Creator, PlatformAdmin, AppealsReviewer]
    code: 200
    input: []
    output: ModerationAppeal
    side_effects: []

  - method: GET
    path: "/ugc/moderation-appeals"
    description: "List appeals"
    roles: [PlatformAdmin, AppealsReviewer, Moderator]
