            - { call: "POST /compliance-docs", payload: { driver_id: "${d2}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d2_bg: $.data.id } }
