            - { call: "POST /api/portfolios/${pf}/valuation-snapshots", payload: { period_start: "2026-12-01", period_end: "2027-03-01", expected_portfolio_version: "${pf_v2}" }, as: PortfolioManager, captures: { s2: "$.data.id", s2_status: "$.data.status" } }
