scenario: |
  1121. Broadcast Affiliate Relations & Network Compensation (broadcast network affiliate relations): affiliation agreement terms & clearance obligations, network program clearance reporting & preemption approval, reverse compensation & retransmission revenue sharing, local avail allocation & sales rights, syndication exclusivity & territory protection, technical delivery standards & outage credits, renewal negotiation & station group leverage, compliance reporting

domain_name: broadcast-affiliate-relations
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Network
    parent: null
    common_fields: true
    fields:
      - name: call_sign
        type: string
        source: input
        description: "Network call sign / brand (e.g., 'PBN')"
      - name: primary_feed_tz
        type: string
        source: input
        description: "IANA timezone of the network's primary satellite feed (e.g., 'America/New_York')"
      - name: reverse_comp_standard_pct
        type: number
        source: input
        description: "Standard reverse-compensation percentage of station net retrans revenue owed to network; decimal in [0,1]"
      - name: retrans_share_standard_pct
        type: number
        source: input
        description: "Standard network share of station retransmission consent revenue; decimal in [0,1]; reverse_comp_standard_pct + retrans_share_standard_pct MUST equal 1.0"
      - name: current_period_index
        type: integer
        source: system
        default: 0
        description: "Current broadcast sweep period counter, advanced by /advance-period action"
      - name: posture
        type: enum
        source: computed
        description: "NORMAL | SWEEP_LOCKDOWN | DISPUTE_FREEZE — derived from open ComplianceReports and active RenewalOffers"
      - name: current_utc
        type: datetime
        source: system
        description: "Server logical clock; defaults to 2026-05-01T00:00:00Z at startup; set via POST /_clock/set_current_utc"

  - name: StationGroup
    parent: null
    common_fields: true
    fields:
      - name: group_name
        type: string
        source: input
        description: "Station group owner name (e.g., 'Meridian Media Group')"
      - name: leverage_tier
        type: enum
        source: input
        description: "SMALL | MID | LARGE | MAJOR — drives group-volume discount tier in reverse-comp calc"
      - name: aggregate_retrans_cents
        type: integer
        source: computed
        description: "Rolling 4-period sum of net retrans revenue across all Stations in this group; recomputed on every PeriodSettlement commit"

  - name: Station
    parent: StationGroup
    common_fields: true
    fields:
      - name: station_group_id
        type: string
        source: system
        description: "FK -> StationGroup.id; owning station group"
      - name: call_sign
        type: string
        source: input
        description: "Station call letters (e.g., 'KPBN-LD'); unique per Network"
      - name: dma_code
        type: string
        source: input
        description: "Nielsen DMA code (e.g., 'DMA-038')"
      - name: network_id
        type: string
        source: input
        description: "FK -> Network.id; affiliated network"
      - name: posture
        type: enum
        source: computed
        description: "CLEARANCE_OK | CLEARANCE_DEFICIENT | DARK — derived from clearance compliance and signal outage minutes in current period"
      - name: monthly_outage_minutes_current_period
        type: integer
        source: computed
        default: 0
        description: "Sum of OutageEvent.duration_minutes for events whose period_index == Network.current_period_index and status == CONFIRMED"
      - name: clearance_rate_current_period
        type: number
        source: computed
        description: "cleared_hours / obligated_hours over the current sweep period; null until first ClearanceReport filed"

  - name: Territory
    parent: Network
    common_fields: true
    fields:
      - name: network_id
        type: string
        source: system
        description: "FK -> Network.id"
      - name: dma_code
        type: string
        source: input
        description: "DMA this territory covers; unique per network"
      - name: exclusivity_holder_station_id
        type: string
        source: system
        description: "FK -> Station.id; station holding exclusivity in this DMA; null until an active AffiliationAgreement binds"
      - name: protection_window_start_utc
        type: datetime
        source: input
        description: "Start of protected broadcast window (half-open [start, end)) for syndicated exclusivity claims"
      - name: protection_window_end_utc
        type: datetime
        source: input
        description: "End of protected window; MUST be strictly after start"

  - name: AffiliationAgreement
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: network_id
        type: string
        source: system
        description: "FK -> Network.id (denormalized from Station for direct querying)"
      - name: term_start_utc
        type: datetime
        source: input
        description: "Agreement effective start"
      - name: term_end_utc
        type: datetime
        source: input
        description: "Agreement expiry; must be strictly after term_start_utc"
      - name: reverse_comp_pct
        type: number
        source: input
        description: "Negotiated reverse-compensation percentage for THIS agreement (decimal [0,1]); overrides Network.reverse_comp_standard_pct when set"
      - name: retrans_share_pct
        type: number
        source: input
        description: "Negotiated network share of retrans revenue; reverse_comp_pct + retrans_share_pct MUST equal 1.0"
      - name: clearance_obligation_hours
        type: integer
        source: input
        description: "Total hours of network programming the station MUST clear per sweep period"
      - name: status
        type: enum
        source: system
        description: "DRAFT | PENDING_ACTIVATION | ACTIVE | EXPIRING | RENEWAL_NEGOTIATION | LAPSED | TERMINATED"
      - name: renewal_round_count
        type: integer
        source: system
        default: 0
        description: "Number of renewal rounds executed against this agreement; incremented on each RenewalOffer PROPOSED transition"
      - name: version
        type: integer
        source: system
        description: "OCC field — incremented on every mutation"

  - name: Program
    parent: Network
    common_fields: true
    fields:
      - name: network_id
        type: string
        source: system
        description: "FK -> Network.id"
      - name: title
        type: string
        source: input
        description: "Program title"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Scheduled air time start"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Scheduled air time end (strictly after start)"
      - name: avail_minutes_total
        type: integer
        source: input
        description: "Total commercial avail minutes inside the program window"
      - name: avail_minutes_local_allocatable
        type: integer
        source: input
        description: "Of avail_minutes_total, the minutes stations may sell locally; MUST be <= avail_minutes_total"
      - name: is_syndicated
        type: boolean
        source: input
        description: "If true, program participates in syndicated exclusivity protection"

  - name: ClearanceReport
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: period_index
        type: integer
        source: input
        description: "Sweep period this report covers"
      - name: cleared_hours
        type: number
        source: input
        description: "Total hours of network programming cleared"
      - name: preempted_hours
        type: number
        source: input
        description: "Total hours preempted for local content"
      - name: status
        type: enum
        source: system
        description: "DRAFT | FILED | AUDITED | CLEARED | DISPUTED"
      - name: clearance_rate
        type: number
        source: computed
        description: "cleared_hours / agreement.clearance_obligation_hours; rounded half-up to 4 decimals"

  - name: PreemptionRequest
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id being preempted"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> AffiliationAgreement.id under which preemption is requested"
      - name: requested_start_utc
        type: datetime
        source: input
        description: "Preemption interval start"
      - name: requested_end_utc
        type: datetime
        source: input
        description: "Preemption interval end (strictly after start)"
      - name: reason
        type: enum
        source: input
        description: "BREAKING_NEWS | LOCAL_SPORTS | EMERGENCY | POLITICAL | OTHER"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | COUNTERED | WITHDRAWN"
      - name: counter_start_utc
        type: datetime
        source: system
        description: "Network's counter-proposed start; populated only on COUNTERED"
      - name: counter_end_utc
        type: datetime
        source: system
        description: "Network's counter-proposed end; populated only on COUNTERED"
      - name: counter_round_count
        type: integer
        source: system
        default: 0
        description: "Number of counter rounds executed; incremented on every SUBMITTED->COUNTERED->SUBMITTED cycle"

  - name: AvailAllocation
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: period_index
        type: integer
        source: input
        description: "Sweep period in which this avail is exercised"
      - name: local_minutes_claimed
        type: integer
        source: input
        description: "Minutes of local commercial time station claims inside this program"
      - name: status
        type: enum
        source: system
        description: "CLAIMED | CONFIRMED | REVOKED | EXPIRED"
      - name: claimed_revenue_cents
        type: integer
        source: input
        description: "Revenue station claims it earned from selling these avails locally"

  - name: RetransSettlement
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> AffiliationAgreement.id whose rates govern this settlement"
      - name: period_index
        type: integer
        source: input
        description: "Sweep period being settled"
      - name: gross_retrans_cents
        type: integer
        source: input
        description: "Gross retransmission consent revenue earned by the station this period"
      - name: net_retrans_cents
        type: integer
        source: computed
        description: "gross minus MVPD carriage deductions and outage credits, per formula"
      - name: network_share_cents
        type: integer
        source: computed
        description: "Amount owed by station to network (reverse comp + retrans share), per formula variant"
      - name: variant_used
        type: enum
        source: system
        description: "PROVISIONAL | FINAL — which calculation variant produced network_share_cents"
      - name: status
        type: enum
        source: system
        description: "DRAFT | COMMITTED | RECONCILED | VOID"
      - name: outage_credit_cents
        type: integer
        source: computed
        description: "Total outage credit applied to this settlement"

  - name: OutageEvent
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: period_index
        type: integer
        source: input
        description: "Sweep period in which the outage occurred"
      - name: started_at_utc
        type: datetime
        source: input
        description: "Outage start"
      - name: ended_at_utc
        type: datetime
        source: input
        description: "Outage end (strictly after start)"
      - name: duration_minutes
        type: integer
        source: computed
        description: "floor((ended_at_utc - started_at_utc) / 60)"
      - name: cause
        type: enum
        source: input
        description: "TRANSMITTER_FAILURE | FIBER_CUT | SATELLITE_JAM | POWER_LOSS | PLANNED_MAINTENANCE"
      - name: status
        type: enum
        source: system
        description: "REPORTED | CONFIRMED | REJECTED"

  - name: OutageCredit
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: outage_event_id
        type: string
        source: input
        description: "FK -> OutageEvent.id"
      - name: settlement_id
        type: string
        source: system
        description: "FK -> RetransSettlement.id to which this credit was applied; null until settlement COMMITTED"
      - name: credit_cents
        type: integer
        source: computed
        description: "Computed credit amount per outage_credit formula"
      - name: status
        type: enum
        source: system
        description: "PENDING | APPLIED | FORFEITED"

  - name: RenewalOffer
    parent: AffiliationAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> AffiliationAgreement.id being renewed"
      - name: proposed_by_role
        type: enum
        source: input
        description: "NETWORK_AFFILIATE_RELATIONS | STATION_GROUP_OWNER — who issued this offer"
      - name: proposed_reverse_comp_pct
        type: number
        source: input
        description: "Offered reverse-comp rate (decimal [0,1])"
      - name: proposed_retrans_share_pct
        type: number
        source: input
        description: "Offered retrans share (decimal [0,1]); MUST satisfy proposed_reverse_comp_pct + proposed_retrans_share_pct == 1.0"
      - name: proposed_term_months
        type: integer
        source: input
        description: "Offered renewal term length; must be in {12, 24, 36, 48, 60}"
      - name: round_index
        type: integer
        source: system
        description: "Sequential round number within this agreement's renewal negotiation (starts at 1)"
      - name: status
        type: enum
        source: system
        description: "PROPOSED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | SUPERSEDED"

  - name: ComplianceReport
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id"
      - name: period_index
        type: integer
        source: input
        description: "Sweep period reported"
      - name: report_kind
        type: enum
        source: input
        description: "FCC_302 | CHILDRENS_TELEVISION | EEO | POLITICAL_FILE"
      - name: status
        type: enum
        source: system
        description: "OPEN | SUBMITTED | AUDITED | PASSED | FAILED"
      - name: finding_count
        type: integer
        source: system
        default: 0
        description: "Number of audit findings; only set when status transitions to AUDITED"

  - name: SyndicationExclusivityClaim
    parent: Territory
    common_fields: true
    fields:
      - name: territory_id
        type: string
        source: system
        description: "FK -> Territory.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id whose syndicated airing is being claimed against"
      - name: claimant_station_id
        type: string
        source: input
        description: "FK -> Station.id asserting exclusivity"
      - name: respondent_station_id
        type: string
        source: input
        description: "FK -> Station.id accused of violation"
      - name: alleged_window_start_utc
        type: datetime
        source: input
        description: "Start of alleged violation window"
      - name: alleged_window_end_utc
        type: datetime
        source: input
        description: "End of alleged violation window"
      - name: status
        type: enum
        source: system
        description: "FILED | VALIDATED | DISMISSED | SETTLED"

state_machines:
  - entity: AffiliationAgreement
    initial_state: DRAFT
    terminal_states: [LAPSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_ACTIVATION
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/submit"
        actor: NetworkAffiliateRelations
        preconditions:
          - "Station.posture != DARK"
          - "No other AffiliationAgreement on same Station in status ACTIVE or PENDING_ACTIVATION"
        side_effects:
          - "increments AffiliationAgreement.version by 1"
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/activate"
        actor: NetworkAffiliateRelations
        preconditions:
          - "Network.current_utc >= agreement.term_start_utc"
          - "Territory covering Station.dma_code has exclusivity_holder_station_id == null OR == Station.id"
        side_effects:
          - "Territory.exclusivity_holder_station_id = Station.id for Territory covering Station.dma_code"
          - "increments AffiliationAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRING
        trigger: "system auto-transition when Network.current_utc >= term_end_utc - 90 days AND < term_end_utc"
        actor: system
        preconditions: []
        side_effects:
          - "increments AffiliationAgreement.version by 1"
      - from: ACTIVE
        to: RENEWAL_NEGOTIATION
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers (first offer on ACTIVE agreement)"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "Network.current_utc >= term_end_utc - 180 days"
        side_effects:
          - "increments AffiliationAgreement.renewal_round_count by 1"
          - "Network.posture recomputed (enters DISPUTE_FREEZE if any RenewalOffer is PROPOSED and station_group leverage_tier == MAJOR)"
          - "increments AffiliationAgreement.version by 1"
      - from: EXPIRING
        to: RENEWAL_NEGOTIATION
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions: []
        side_effects:
          - "increments AffiliationAgreement.renewal_round_count by 1"
          - "increments AffiliationAgreement.version by 1"
      - from: RENEWAL_NEGOTIATION
        to: ACTIVE
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "RenewalOffer.status == PROPOSED OR COUNTERED"
          - "proposed_by_role != caller's role (segregation of duties: proposer cannot accept own offer)"
        side_effects:
          - "agreement.reverse_comp_pct = offer.proposed_reverse_comp_pct"
          - "agreement.retrans_share_pct = offer.proposed_retrans_share_pct"
          - "agreement.term_end_utc extended by offer.proposed_term_months"
          - "RenewalOffer.status -> ACCEPTED"
          - "all other RenewalOffers on same agreement in PROPOSED|COUNTERED -> SUPERSEDED"
          - "Network.posture recomputed"
          - "increments AffiliationAgreement.version by 1"
      - from: RENEWAL_NEGOTIATION
        to: LAPSED
        trigger: "system auto-transition when Network.current_utc >= agreement.term_end_utc AND no RenewalOffer in PROPOSED|COUNTERED"
        actor: system
        preconditions: []
        side_effects:
          - "Territory.exclusivity_holder_station_id = null for Territory covering Station.dma_code"
          - "Station.posture recomputed"
          - "increments AffiliationAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/terminate"
        actor: NetworkAffiliateRelations
        preconditions:
          - "no RetransSettlement in DRAFT for this agreement"
        side_effects:
          - "Territory.exclusivity_holder_station_id = null for Territory covering Station.dma_code"
          - "all AvailAllocation in CLAIMED|CONFIRMED for this Station -> REVOKED"
          - "increments AffiliationAgreement.version by 1"
      - from: EXPIRING
        to: TERMINATED
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/terminate"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "Territory.exclusivity_holder_station_id = null for Territory covering Station.dma_code"
          - "increments AffiliationAgreement.version by 1"

  - entity: PreemptionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/begin-review"
        actor: NetworkAffiliateRelations
        preconditions:
          - "AffiliationAgreement referenced by request is in ACTIVE | EXPIRING"
        side_effects:
          - "increments PreemptionRequest.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/approve"
        actor: NetworkAffiliateRelations
        preconditions:
          - "cumulative approved preemption hours this period + this request's hours <= agreement.clearance_obligation_hours * 0.10"
        side_effects:
          - "ClearanceReport for the current period on this Station (if FILED|AUDITED) is flagged for recompute via clearance_rate"
          - "Station.posture recomputed"
          - "increments PreemptionRequest.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/deny"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "increments PreemptionRequest.version by 1"
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/counter"
        actor: NetworkAffiliateRelations
        preconditions:
          - "payload.counter_start_utc and payload.counter_end_utc overlap the original requested window by > 0 minutes"
        side_effects:
          - "populates counter_start_utc and counter_end_utc"
          - "increments PreemptionRequest.version by 1"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/resubmit"
        actor: StationGroupOwner
        preconditions:
          - "counter_round_count < 3"
        side_effects:
          - "requested_start_utc = counter_start_utc"
          - "requested_end_utc = counter_end_utc"
          - "counter_round_count += 1"
          - "increments PreemptionRequest.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/withdraw"
        actor: StationGroupOwner
        preconditions: []
        side_effects:
          - "increments PreemptionRequest.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/withdraw"
        actor: StationGroupOwner
        preconditions: []
        side_effects:
          - "increments PreemptionRequest.version by 1"

  - entity: RenewalOffer
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers (a new offer while another is PROPOSED)"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "new offer's proposed_by_role != existing PROPOSED offer's proposed_by_role (alternating turns)"
        side_effects:
          - "existing PROPOSED offer -> COUNTERED (implicit state flip on prior offer)"
          - "new offer created in PROPOSED with round_index = prior.round_index + 1"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "caller role != offer.proposed_by_role (segregation of duties)"
        side_effects:
          - "agreement fields updated (see AffiliationAgreement.RENEWAL_NEGOTIATION->ACTIVE)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/reject"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "caller role != offer.proposed_by_role"
        side_effects:
          - "Network.posture recomputed"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/withdraw"
        actor: NetworkAffiliateRelations | StationGroupOwner
        preconditions:
          - "caller role == offer.proposed_by_role (only proposer may withdraw)"
        side_effects: []
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system auto-transition when a subsequent offer is ACCEPTED on same agreement"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClearanceReport
    initial_state: DRAFT
    terminal_states: [CLEARED, DISPUTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/file"
        actor: StationGroupOwner
        preconditions:
          - "report.period_index <= Network.current_period_index"
        side_effects:
          - "clearance_rate recomputed"
          - "Station.clearance_rate_current_period = clearance_rate"
          - "Station.posture recomputed (CLEARANCE_DEFICIENT if clearance_rate < 0.85)"
          - "increments ClearanceReport.version by 1"
      - from: FILED
        to: AUDITED
        trigger: "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/audit"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "increments ClearanceReport.version by 1"
      - from: AUDITED
        to: CLEARED
        trigger: "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-cleared"
        actor: NetworkAffiliateRelations
        preconditions:
          - "clearance_rate >= 0.85"
        side_effects:
          - "Station.posture recomputed"
      - from: AUDITED
        to: DISPUTED
        trigger: "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-disputed"
        actor: NetworkAffiliateRelations
        preconditions:
          - "clearance_rate < 0.85"
        side_effects:
          - "Station.posture = CLEARANCE_DEFICIENT"
          - "Network.posture recomputed"

  - entity: RetransSettlement
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"
        actor: NetworkAffiliateRelations
        preconditions:
          - "AffiliationAgreement.status == ACTIVE"
          - "no other RetransSettlement in COMMITTED for same (station_id, period_index)"
          - "Station.monthly_outage_minutes_current_period computed and applied via outage_credit formula"
        side_effects:
          - "applies outage_credit_cents (computed from OutageCredit entries linked to this settlement)"
          - "all linked OutageCredit -> APPLIED, their settlement_id set"
          - "StationGroup.aggregate_retrans_cents recomputed"
          - "variant_used = PROVISIONAL"
          - "increments RetransSettlement.version by 1"
      - from: COMMITTED
        to: RECONCILED
        trigger: "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/reconcile"
        actor: NetworkAffiliateRelations
        preconditions:
          - "Network.current_period_index > settlement.period_index"
        side_effects:
          - "network_share_cents recomputed using FINAL variant"
          - "variant_used = FINAL"
          - "StationGroup.aggregate_retrans_cents recomputed"
          - "increments RetransSettlement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/void"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "increments RetransSettlement.version by 1"

  - entity: OutageEvent
    initial_state: REPORTED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /networks/{nid}/stations/{sid}/outage-events/{oid}/confirm"
        actor: NetworkAffiliateRelations
        preconditions:
          - "duration_minutes >= 1"
        side_effects:
          - "creates OutageCredit in PENDING with credit_cents computed per outage_credit formula"
          - "Station.monthly_outage_minutes_current_period += duration_minutes"
          - "Station.posture recomputed (DARK if outage minutes > 240 in current period)"
          - "increments OutageEvent.version by 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /networks/{nid}/stations/{sid}/outage-events/{oid}/reject"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "increments OutageEvent.version by 1"

  - entity: OutageCredit
    initial_state: PENDING
    terminal_states: [APPLIED, FORFEITED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "system transition when parent RetransSettlement transitions DRAFT->COMMITTED"
        actor: system
        preconditions: []
        side_effects:
          - "settlement_id populated"
      - from: PENDING
        to: FORFEITED
        trigger: "POST /networks/{nid}/stations/{sid}/outage-credits/{oid}/forfeit"
        actor: NetworkAffiliateRelations
        preconditions:
          - "OutageEvent.cause == PLANNED_MAINTENANCE"
        side_effects: []

  - entity: AvailAllocation
    initial_state: CLAIMED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: CLAIMED
        to: CONFIRMED
        trigger: "POST /networks/{nid}/stations/{sid}/avail-allocations/{aid}/confirm"
        actor: NetworkAffiliateRelations
        preconditions:
          - "sum of local_minutes_claimed across CONFIRMED AvailAllocations for this program + this claim <= program.avail_minutes_local_allocatable"
          - "Station.posture != DARK"
        side_effects:
          - "increments AvailAllocation.version by 1"
      - from: CLAIMED
        to: REVOKED
        trigger: "POST /networks/{nid}/stations/{sid}/avail-allocations/{aid}/revoke OR cascade from AffiliationAgreement termination"
        actor: NetworkAffiliateRelations | system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: REVOKED
        trigger: "cascade from AffiliationAgreement termination"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLAIMED
        to: EXPIRED
        trigger: "system transition when Network.current_period_index > period_index"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceReport
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/submit"
        actor: StationGroupOwner
        preconditions:
          - "report.period_index <= Network.current_period_index"
        side_effects:
          - "increments ComplianceReport.version by 1"
      - from: SUBMITTED
        to: AUDITED
        trigger: "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/audit"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "payload.finding_count stored"
          - "increments ComplianceReport.version by 1"
      - from: AUDITED
        to: PASSED
        trigger: "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-pass"
        actor: NetworkAffiliateRelations
        preconditions:
          - "finding_count == 0"
        side_effects:
          - "Network.posture recomputed"
      - from: AUDITED
        to: FAILED
        trigger: "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-fail"
        actor: NetworkAffiliateRelations
        preconditions:
          - "finding_count >= 1"
        side_effects:
          - "Network.posture = SWEEP_LOCKDOWN if >= 3 FAILED ComplianceReports this period"
          - "increments ComplianceReport.version by 1"

  - entity: SyndicationExclusivityClaim
    initial_state: FILED
    terminal_states: [VALIDATED, DISMISSED, SETTLED]
    transitions:
      - from: FILED
        to: VALIDATED
        trigger: "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/validate"
        actor: NetworkAffiliateRelations
        preconditions:
          - "Territory.exclusivity_holder_station_id == claimant_station_id"
          - "alleged window overlaps Territory.protection_window (half-open [start, end))"
          - "respondent_station_id != claimant_station_id"
        side_effects:
          - "Station.posture for respondent recomputed (CLEARANCE_DEFICIENT while claim is VALIDATED)"
          - "increments SyndicationExclusivityClaim.version by 1"
      - from: FILED
        to: DISMISSED
        trigger: "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/dismiss"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "increments SyndicationExclusivityClaim.version by 1"
      - from: VALIDATED
        to: SETTLED
        trigger: "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/settle"
        actor: NetworkAffiliateRelations
        preconditions: []
        side_effects:
          - "Station.posture for respondent recomputed"

  - entity: Station
    initial_state: CLEARANCE_OK
    terminal_states: []
    transitions:
      - from: CLEARANCE_OK
        to: CLEARANCE_DEFICIENT
        trigger: "system auto-transition when Station.clearance_rate_current_period < 0.85 OR a SyndicationExclusivityClaim against this Station is VALIDATED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Station.version by 1"
      - from: CLEARANCE_DEFICIENT
        to: CLEARANCE_OK
        trigger: "system auto-transition when clearance_rate_current_period >= 0.85 AND no VALIDATED exclusivity claims against this Station"
        actor: system
        preconditions: []
        side_effects:
          - "increments Station.version by 1"
      - from: CLEARANCE_OK
        to: DARK
        trigger: "system auto-transition when Station.monthly_outage_minutes_current_period > 240"
        actor: system
        preconditions: []
        side_effects:
          - "increments Station.version by 1"
      - from: CLEARANCE_DEFICIENT
        to: DARK
        trigger: "system auto-transition when Station.monthly_outage_minutes_current_period > 240"
        actor: system
        preconditions: []
        side_effects:
          - "increments Station.version by 1"
      - from: DARK
        to: CLEARANCE_OK
        trigger: "system transition when Network.current_period_index advances (outage counter resets)"
        actor: system
        preconditions: []
        side_effects:
          - "monthly_outage_minutes_current_period reset to 0 for new period"

  - entity: Network
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: SWEEP_LOCKDOWN
        trigger: "system auto-transition when >= 3 ComplianceReports FAILED within current_period_index"
        actor: system
        preconditions: []
        side_effects:
          - "blocks all PreemptionRequest approvals network-wide"
      - from: NORMAL
        to: DISPUTE_FREEZE
        trigger: "system auto-transition when any RenewalOffer is PROPOSED on an agreement whose Station's StationGroup.leverage_tier == MAJOR"
        actor: system
        preconditions: []
        side_effects: []
      - from: SWEEP_LOCKDOWN
        to: NORMAL
        trigger: "system auto-transition when Network.current_period_index advances"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTE_FREEZE
        to: NORMAL
        trigger: "system auto-transition when no RenewalOffer remains in PROPOSED for any MAJOR-tier group"
        actor: system
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: renewal-offer-stale-agreement
    parent_entity: AffiliationAgreement
    write_endpoint: "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"
    occ_field: "expected_agreement_version"
    description: |
      Creating a RenewalOffer against an AffiliationAgreement whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just proposed an offer (which
      legitimately supersedes the prior round under the alternating-turns rule)
      and the current writer's view of the agreement is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: settlement-commit-stale-station
    parent_entity: Station
    write_endpoint: "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"
    occ_field: "expected_station_version"
    description: |
      Committing a RetransSettlement against a Station whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just confirmed an OutageEvent
      (which mutates Station.monthly_outage_minutes_current_period and bumps
      version) and the committer's settlement inputs are therefore stale.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412

calculations:
  - name: reverse_comp_provisional_vs_final
    trigger: "on RetransSettlement DRAFT->COMMITTED (provisional) and COMMITTED->RECONCILED (final)"
    algorithm: tiered_pricing
    formula: |
      # Common inputs
      gross = settlement.gross_retrans_cents
      credits = sum(OutageCredit.credit_cents for OutageCredit where settlement_id == settlement.id and status == APPLIED)
      net = gross - credits
      # Tiered marginal rate based on StationGroup.leverage_tier AND Station.aggregate trailing 4-period retrans
      trailing = station_group.aggregate_retrans_cents
      if tier == MAJOR and trailing >= 100_000_000:
        discount_pct = 0.04
      elif tier == LARGE and trailing >= 50_000_000:
        discount_pct = 0.025
      elif tier == MID and trailing >= 20_000_000:
        discount_pct = 0.01
      else:
        discount_pct = 0.0
      base_share = round_half_up(net * agreement.reverse_comp_pct, 0)  # integer cents
      # PROVISIONAL: apply discount on top of base_share
      provisional_share = round_half_up(base_share * (1 - discount_pct), 0)
      # FINAL: recompute discount from *prior-period* trailing aggregate (not current), and
      #        use ceiling on the share computation instead of round_half_up
      trailing_prior = aggregate as of end of prior period (excludes current period settlements)
      discount_pct_prior = tier_discount(trailing_prior)  # same tier table, different snapshot
      final_share = ceil(net * agreement.reverse_comp_pct * (1 - discount_pct_prior))
      # Settlement stores whichever variant matches settlement.variant_used
    input_set: "RetransSettlement joined to AffiliationAgreement (for rates), StationGroup (for tier and trailing), OutageCredit (for credits); OutageCredit must have status == APPLIED to count"
    constants:
      TIER_THRESHOLD_MAJOR_CENTS: 100000000
      TIER_THRESHOLD_LARGE_CENTS: 50000000
      TIER_THRESHOLD_MID_CENTS: 20000000
      DISCOUNT_MAJOR: 0.04
      DISCOUNT_LARGE: 0.025
      DISCOUNT_MID: 0.01
    precision: "integer cents; PROVISIONAL rounds half-up, FINAL uses ceiling"
    variants:
      - name: PROVISIONAL
        when: "settlement.variant_used == PROVISIONAL (on COMMITTED transition)"
        difference: "uses CURRENT-period trailing aggregate and round_half_up"
      - name: FINAL
        when: "settlement.variant_used == FINAL (on RECONCILED transition)"
        difference: "uses PRIOR-period trailing aggregate snapshot and ceiling function"

  - name: outage_credit_amount
    trigger: "on OutageEvent REPORTED->CONFIRMED"
    algorithm: threshold
    formula: |
      # Per-minute credit rate depends on duration bracket AND cause
      base_rate_cents_per_min = 500  # 5 USD/min baseline
      if cause == PLANNED_MAINTENANCE:
        multiplier = 0.0  # no credit for planned maintenance
      elif cause == SATELLITE_JAM:
        multiplier = 1.5  # aggravated
      else:
        multiplier = 1.0
      # Tiered rate: first 30 min at 1x, 31-120 min at 1.5x, >120 min at 2x
      minutes = duration_minutes
      tier1 = min(minutes, 30)
      tier2 = max(0, min(minutes - 30, 90))
      tier3 = max(0, minutes - 120)
      raw = (tier1 * 1.0 + tier2 * 1.5 + tier3 * 2.0) * base_rate_cents_per_min * multiplier
      credit_cents = round_half_up(raw, 0)
      # Boundary: 0 minutes -> 0; 30 minutes -> 30*1.0*500 = 15000; 31 minutes -> 30*500 + 1*750 = 15750
    input_set: "single OutageEvent with status transitioning to CONFIRMED"
    constants:
      BASE_RATE_CENTS_PER_MIN: 500
      TIER1_MAX_MIN: 30
      TIER2_MAX_MIN: 120
      TIER1_MULT: 1.0
      TIER2_MULT: 1.5
      TIER3_MULT: 2.0
      SATJAM_MULT: 1.5
      PLANNED_MAINT_MULT: 0.0
    precision: "integer cents, round_half_up"

  - name: clearance_rate_calc
    trigger: "on ClearanceReport DRAFT->FILED and on PreemptionRequest UNDER_REVIEW->APPROVED (recompute)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: divide first, THEN round to 4 decimals.
      # Computing as round(cleared)*100/round(obligated) (i.e., pre-rounding inputs) yields different 4-decimal results.
      rate = round_half_up(report.cleared_hours / agreement.clearance_obligation_hours, 4)
    input_set: "ClearanceReport joined to ACTIVE AffiliationAgreement on the same Station"
    constants:
      DEFICIENT_THRESHOLD: 0.85
    precision: "4 decimal places, round_half_up"

  - name: avail_allocation_waterfall
    trigger: "on AvailAllocation CLAIMED->CONFIRMED"
    algorithm: waterfall_allocation
    formula: |
      # Local avails are confirmed in order of (created_at ASC, then claim size ASC) until
      # program.avail_minutes_local_allocatable is exhausted.
      # Cascade order: claims are processed in chronological order; if two claims have identical
      # created_at, the SMALLER claim wins; ties beyond that are rejected (no further fallback).
      # No random id tie-break is used; created_at is the primary key.
      remaining = program.avail_minutes_local_allocatable - sum(local_minutes_claimed for CONFIRMED AvailAllocations on this program)
      if claim.local_minutes_claimed <= remaining:
        confirm
      else:
        reject with ERR_AVAIL_POOL_EXHAUSTED
    input_set: "Program + all AvailAllocations for that program filtered to status == CONFIRMED"
    constants: {}
    precision: "integer minutes"

  - name: syndication_window_overlap
    trigger: "on SyndicationExclusivityClaim FILED->VALIDATED"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [protection_start, protection_end) vs [alleged_start, alleged_end)
      # Overlap exists iff alleged_start < protection_end AND alleged_end > protection_start
      # Adjacent windows (alleged_end == protection_start) do NOT overlap (zero-length intersection)
      overlap = (claim.alleged_start_utc < territory.protection_window_end_utc) AND (claim.alleged_end_utc > territory.protection_window_start_utc)
      if not overlap: reject with ERR_NO_WINDOW_OVERLAP
    input_set: "SyndicationExclusivityClaim joined to Territory"
    constants: {}
    precision: "datetime comparison, second precision"

  - name: station_posture_derivation
    trigger: "system recompute on any mutation to ClearanceReport, OutageEvent, or SyndicationExclusivityClaim affecting this Station"
    algorithm: constraint_propagation
    formula: |
      # Posture precedence: DARK > CLEARANCE_DEFICIENT > CLEARANCE_OK
      if monthly_outage_minutes_current_period > 240: posture = DARK
      elif clearance_rate_current_period is not null AND clearance_rate_current_period < 0.85: posture = CLEARANCE_DEFICIENT
      elif exists SyndicationExclusivityClaim with respondent_station_id == station.id AND status == VALIDATED: posture = CLEARANCE_DEFICIENT
      else: posture = CLEARANCE_OK
      # Fixed point reached in single pass; no iteration needed.
    input_set: "Station + linked ClearanceReports, OutageEvents, SyndicationExclusivityClaims for current period"
    constants:
      DARK_THRESHOLD_MINUTES: 240
      DEFICIENT_RATE_THRESHOLD: 0.85
    precision: "deterministic enum selection"

  - name: network_posture_derivation
    trigger: "system recompute on ComplianceReport FAILED transition or RenewalOffer PROPOSED transition"
    algorithm: constraint_propagation
    formula: |
      # Precedence: SWEEP_LOCKDOWN > DISPUTE_FREEZE > NORMAL
      failed_count = count(ComplianceReport where station.network_id == network.id AND period_index == network.current_period_index AND status == FAILED)
      if failed_count >= 3: posture = SWEEP_LOCKDOWN
      elif exists RenewalOffer on agreement whose station.group.leverage_tier == MAJOR AND status == PROPOSED: posture = DISPUTE_FREEZE
      else: posture = NORMAL
    input_set: "Network + all ComplianceReports for current period + all PROPOSED RenewalOffers"
    constants:
      LOCKDOWN_FAILED_COUNT: 3
    precision: "deterministic enum selection"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is in RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized for the target endpoint per endpoint.roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right: network exists, then station (scoped to network), then agreement/preemption/settlement (scoped to station)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition per state_machines"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Network.posture != SWEEP_LOCKDOWN for PreemptionRequest approval endpoint"
    error_id: ERR_NETWORK_LOCKDOWN
    http_status: 409
    applies_to: ["POST /networks/{nid}/stations/{sid}/preemptions/{pid}/approve"]

  - priority: 6
    category: business_safety
    check: "Segregation of duties: caller role != RenewalOffer.proposed_by_role for accept/reject; caller role == proposed_by_role for withdraw"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept", "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/reject", "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/withdraw"]

  - priority: 7
    category: business_constraint
    check: "reverse_comp_pct + retrans_share_pct == 1.0 (within 1e-9) for AffiliationAgreement and RenewalOffer creation"
    error_id: ERR_RATE_SUM_MISMATCH
    http_status: 422
    applies_to: ["POST /networks/{nid}/stations/{sid}/agreements", "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"]

  - priority: 8
    category: business_temporal
    check: "term_end_utc strictly greater than term_start_utc; requested_end_utc strictly greater than requested_start_utc; ended_at_utc strictly greater than started_at_utc; protection_window_end_utc strictly greater than protection_window_start_utc"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "all creation endpoints accepting time ranges"

  - priority: 9
    category: business_temporal
    check: "AvailAllocation.window must not overlap an existing CONFIRMED AvailAllocation on the same program when aggregated claim exceeds avail_minutes_local_allocatable (aggregate capacity semantics, not pairwise interval overlap)"
    error_id: ERR_AVAIL_POOL_EXHAUSTED
    http_status: 409
    applies_to: ["POST /networks/{nid}/stations/{sid}/avail-allocations/{aid}/confirm"]

  - priority: 10
    category: business_temporal
    check: "SyndicationExclusivityClaim alleged window must overlap Territory.protection_window under half-open interval semantics (adjacent windows do NOT overlap)"
    error_id: ERR_NO_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/validate"]

  - priority: 11
    category: business_referential
    check: "Territory covering Station.dma_code must have exclusivity_holder_station_id null or equal to Station.id when activating an AffiliationAgreement"
    error_id: ERR_TERRITORY_EXCLUSIVITY_HELD
    http_status: 409
    applies_to: ["POST /networks/{nid}/stations/{sid}/agreements/{aid}/activate"]

  - priority: 12
    category: business_fiscal
    check: "Cumulative approved preemption hours this period + new request hours <= agreement.clearance_obligation_hours * 0.10"
    error_id: ERR_PREEMPTION_QUOTA_EXCEEDED
    http_status: 422
    applies_to: ["POST /networks/{nid}/stations/{sid}/preemptions/{pid}/approve"]

  - priority: 13
    category: business_fiscal
    check: "Only one RetransSettlement may be in COMMITTED for a given (station_id, period_index) pair"
    error_id: ERR_DUPLICATE_COMMITTED_SETTLEMENT
    http_status: 409
    applies_to: ["POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"]

  - priority: 14
    category: business_referential
    check: "Claimant station must hold Territory exclusivity (Territory.exclusivity_holder_station_id == claimant_station_id) for claim validation"
    error_id: ERR_CLAIMANT_NOT_HOLDER
    http_status: 422
    applies_to: ["POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/validate"]

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal current parent version (see concurrency_rules)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: ["POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"]

  - priority: 16
    category: business_constraint
    check: "OCC: expected_station_version must equal current Station.version on settlement commit"
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412
    applies_to: ["POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"]

  - priority: 17
    category: business_constraint
    check: "PreemptionRequest COUNTERED -> SUBMITTED requires counter_round_count < 3"
    error_id: ERR_COUNTER_ROUND_EXHAUSTED
    http_status: 409
    applies_to: ["POST /networks/{nid}/stations/{sid}/preemptions/{pid}/resubmit"]

  - priority: 18
    category: business_temporal
    check: "OutageEvent.ended_at_utc must be <= Network.current_utc (cannot report future outages)"
    error_id: ERR_FUTURE_OUTAGE
    http_status: 422
    applies_to: ["POST /networks/{nid}/stations/{sid}/outage-events"]

  - priority: 19
    category: business_fiscal
    check: "RenewalOffer.proposed_term_months must be in {12, 24, 36, 48, 60}"
    error_id: ERR_INVALID_TERM_LENGTH
    http_status: 422
    applies_to: ["POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"]

  - priority: 20
    category: business_referential
    check: "ClearanceReport.period_index must be <= Network.current_period_index (no future reports); ComplianceReport.period_index similarly bounded"
    error_id: ERR_FUTURE_PERIOD
    http_status: 422
    applies_to: ["POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/file", "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/submit"]

endpoints:
  # --- Network management ---
  - method: POST
    path: "/networks"
    description: "Create a new Network"
    roles: [PlatformAdmin]
    code: 201
    input: [call_sign, primary_feed_tz, reverse_comp_standard_pct, retrans_share_standard_pct]
    output: Network
    side_effects: []

  - method: GET
    path: "/networks/{nid}"
    description: "Fetch a Network by id"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Network
    side_effects: []

  - method: GET
    path: "/networks"
    description: "List networks"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Network[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/advance-period"
    description: "Advance Network.current_period_index by 1 (sweep period rollover); resets Station outage counters, expires CLAIMED AvailAllocations in prior periods, recomputes Network.posture"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Network
    side_effects:
      - "current_period_index += 1"
      - "Station.monthly_outage_minutes_current_period reset to 0"
      - "AvailAllocation CLAIMED with period_index < new current -> EXPIRED"
      - "Network.posture recomputed"
      - "Station.posture recomputed"

  # --- Station Groups ---
  - method: POST
    path: "/station-groups"
    description: "Create a station group"
    roles: [PlatformAdmin]
    code: 201
    input: [group_name, leverage_tier]
    output: StationGroup
    side_effects: []

  - method: GET
    path: "/station-groups/{sgid}"
    description: "Fetch a station group"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: StationGroup
    side_effects: []

  # --- Stations ---
  - method: POST
    path: "/networks/{nid}/stations"
    description: "Register a station under a network and group"
    roles: [PlatformAdmin, NetworkAffiliateRelations]
    code: 201
    input: [call_sign, dma_code, station_group_id]
    output: Station
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}"
    description: "Fetch station"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations"
    description: "List stations for a network (filterable by dma_code, posture, station_group_id)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["dma_code?", "posture?", "station_group_id?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  # --- Territories ---
  - method: POST
    path: "/networks/{nid}/territories"
    description: "Create a DMA territory with protection window"
    roles: [NetworkAffiliateRelations]
    code: 201
    input: [dma_code, protection_window_start_utc, protection_window_end_utc]
    output: Territory
    side_effects: []

  - method: GET
    path: "/networks/{nid}/territories/{tid}"
    description: "Fetch territory"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Territory
    side_effects: []

  # --- Programs ---
  - method: POST
    path: "/networks/{nid}/programs"
    description: "Create a program inventory entry"
    roles: [NetworkAffiliateRelations]
    code: 201
    input: [title, scheduled_start_utc, scheduled_end_utc, avail_minutes_total, avail_minutes_local_allocatable, is_syndicated]
    output: Program
    side_effects: []

  - method: GET
    path: "/networks/{nid}/programs/{pid}"
    description: "Fetch a program"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Program
    side_effects: []

  # --- Affiliation Agreements ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements"
    description: "Create AffiliationAgreement (DRAFT) between station and network"
    roles: [NetworkAffiliateRelations]
    code: 201
    input: [term_start_utc, term_end_utc, reverse_comp_pct, retrans_share_pct, clearance_obligation_hours]
    output: AffiliationAgreement
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}"
    description: "Fetch agreement"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/agreements"
    description: "List agreements for a station (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AffiliationAgreement[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/submit"
    description: "DRAFT -> PENDING_ACTIVATION"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects: ["increments AffiliationAgreement.version by 1"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/activate"
    description: "PENDING_ACTIVATION -> ACTIVE"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects:
      - "Territory.exclusivity_holder_station_id set"
      - "increments AffiliationAgreement.version by 1"

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/terminate"
    description: "ACTIVE|EXPIRING -> TERMINATED; revokes AvailAllocations"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: AffiliationAgreement
    side_effects:
      - "Territory.exclusivity_holder_station_id cleared"
      - "AvailAllocation claimed/confirmed on station -> REVOKED"

  # --- Renewal Offers ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"
    description: "Propose a renewal offer (creates RenewalOffer in PROPOSED; flips prior PROPOSED offer to COUNTERED under alternating-turn rule). OCC on AffiliationAgreement.version."
    roles: [NetworkAffiliateRelations, StationGroupOwner]
    code: 201
    input: [proposed_by_role, proposed_reverse_comp_pct, proposed_retrans_share_pct, proposed_term_months, expected_agreement_version]
    output: RenewalOffer
    side_effects:
      - "AffiliationAgreement -> RENEWAL_NEGOTIATION if ACTIVE or EXPIRING"
      - "increments AffiliationAgreement.renewal_round_count"
      - "increments AffiliationAgreement.version by 1"
      - "prior PROPOSED offer -> COUNTERED"

  - method: GET
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}"
    description: "Fetch a renewal offer"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers"
    description: "List renewal offers for an agreement"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenewalOffer[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept"
    description: "Accept offer (SoD: caller role != proposed_by_role); agreement -> ACTIVE, terms updated"
    roles: [NetworkAffiliateRelations, StationGroupOwner]
    code: 200
    input: []
    output: RenewalOffer
    side_effects:
      - "AffiliationAgreement -> ACTIVE with new rates and extended term_end_utc"
      - "other PROPOSED|COUNTERED offers on agreement -> SUPERSEDED"

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/reject"
    description: "Reject offer (SoD: caller role != proposed_by_role)"
    roles: [NetworkAffiliateRelations, StationGroupOwner]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/withdraw"
    description: "Withdraw offer (SoD: caller role == proposed_by_role)"
    roles: [NetworkAffiliateRelations, StationGroupOwner]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []

  # --- Clearance Reports ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/clearance-reports"
    description: "Create a ClearanceReport in DRAFT"
    roles: [StationGroupOwner]
    code: 201
    input: [period_index, cleared_hours, preempted_hours]
    output: ClearanceReport
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/clearance-reports/{cid}"
    description: "Fetch clearance report"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: ClearanceReport
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/clearance-reports"
    description: "List clearance reports for a station (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "period_index?", "limit?", "offset?"]
    output: ClearanceReport[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/clearance-reports/{cid}/file"
    description: "DRAFT -> FILED; computes clearance_rate and updates Station posture"
    roles: [StationGroupOwner]
    code: 200
    input: []
    output: ClearanceReport
    side_effects: ["clearance_rate computed", "Station.posture recomputed"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/clearance-reports/{cid}/audit"
    description: "FILED -> AUDITED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: ClearanceReport
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-cleared"
    description: "AUDITED -> CLEARED (requires rate >= 0.85)"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: ClearanceReport
    side_effects: ["Station.posture recomputed"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-disputed"
    description: "AUDITED -> DISPUTED (requires rate < 0.85)"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: ClearanceReport
    side_effects: ["Station.posture = CLEARANCE_DEFICIENT", "Network.posture recomputed"]

  # --- Preemption Requests ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions"
    description: "Create a PreemptionRequest in SUBMITTED"
    roles: [StationGroupOwner]
    code: 201
    input: [program_id, agreement_id, requested_start_utc, requested_end_utc, reason]
    output: PreemptionRequest
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}"
    description: "Fetch preemption request"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/preemptions"
    description: "List preemption requests (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PreemptionRequest[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/approve"
    description: "UNDER_REVIEW -> APPROVED; enforces 10% preemption quota; blocked under SWEEP_LOCKDOWN"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: ["Station.posture recomputed"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/deny"
    description: "UNDER_REVIEW -> DENIED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/counter"
    description: "UNDER_REVIEW -> COUNTERED with counter window"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: [counter_start_utc, counter_end_utc]
    output: PreemptionRequest
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/resubmit"
    description: "COUNTERED -> SUBMITTED (counter_round_count < 3)"
    roles: [StationGroupOwner]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: ["requested window updated to counter window", "counter_round_count += 1"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/preemptions/{pid}/withdraw"
    description: "SUBMITTED|COUNTERED -> WITHDRAWN"
    roles: [StationGroupOwner]
    code: 200
    input: []
    output: PreemptionRequest
    side_effects: []

  # --- Avail Allocations ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/avail-allocations"
    description: "Claim local avails inside a program"
    roles: [StationGroupOwner]
    code: 201
    input: [program_id, period_index, local_minutes_claimed, claimed_revenue_cents]
    output: AvailAllocation
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/avail-allocations/{aid}"
    description: "Fetch avail allocation"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: AvailAllocation
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/avail-allocations"
    description: "List avail allocations for a station (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "period_index?", "limit?", "offset?"]
    output: AvailAllocation[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/avail-allocations/{aid}/confirm"
    description: "CLAIMED -> CONFIRMED (waterfall allocation, capacity check)"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: AvailAllocation
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/avail-allocations/{aid}/revoke"
    description: "CLAIMED -> REVOKED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: AvailAllocation
    side_effects: []

  # --- Retrans Settlements ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/retrans-settlements"
    description: "Create a DRAFT RetransSettlement"
    roles: [StationGroupOwner, NetworkAffiliateRelations]
    code: 201
    input: [agreement_id, period_index, gross_retrans_cents]
    output: RetransSettlement
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/retrans-settlements/{rid}"
    description: "Fetch settlement"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: RetransSettlement
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/retrans-settlements"
    description: "List settlements (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "period_index?", "limit?", "offset?"]
    output: RetransSettlement[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"
    description: "DRAFT -> COMMITTED using PROVISIONAL variant; OCC on Station.version; applies PENDING OutageCredits"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: [expected_station_version]
    output: RetransSettlement
    side_effects:
      - "outage_credit_cents computed"
      - "OutageCredit PENDING -> APPLIED (settlement_id linked)"
      - "StationGroup.aggregate_retrans_cents recomputed"
      - "increments Station.version by 1"

  - method: POST
    path: "/networks/{nid}/stations/{sid}/retrans-settlements/{rid}/reconcile"
    description: "COMMITTED -> RECONCILED using FINAL variant; network_share_cents recomputed"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: RetransSettlement
    side_effects: ["StationGroup.aggregate_retrans_cents recomputed"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/retrans-settlements/{rid}/void"
    description: "DRAFT -> VOID"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: RetransSettlement
    side_effects: []

  # --- Outage Events ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/outage-events"
    description: "Report an outage event"
    roles: [StationGroupOwner, NetworkAffiliateRelations]
    code: 201
    input: [period_index, started_at_utc, ended_at_utc, cause]
    output: OutageEvent
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/outage-events/{oid}"
    description: "Fetch outage event"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/outage-events"
    description: "List outage events (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "period_index?", "limit?", "offset?"]
    output: OutageEvent[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/outage-events/{oid}/confirm"
    description: "REPORTED -> CONFIRMED; creates OutageCredit; mutates Station outage counter"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: OutageEvent
    side_effects:
      - "creates OutageCredit in PENDING"
      - "Station.monthly_outage_minutes_current_period += duration_minutes"
      - "Station.posture recomputed"
      - "increments Station.version by 1"

  - method: POST
    path: "/networks/{nid}/stations/{sid}/outage-events/{oid}/reject"
    description: "REPORTED -> REJECTED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  # --- Outage Credits ---
  - method: GET
    path: "/networks/{nid}/stations/{sid}/outage-credits/{oid}"
    description: "Fetch outage credit"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: OutageCredit
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/outage-credits"
    description: "List outage credits for a station (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutageCredit[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/outage-credits/{oid}/forfeit"
    description: "PENDING -> FORFEITED (only when cause == PLANNED_MAINTENANCE)"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: OutageCredit
    side_effects: []

  # --- Compliance Reports ---
  - method: POST
    path: "/networks/{nid}/stations/{sid}/compliance-reports"
    description: "Create a compliance report"
    roles: [StationGroupOwner, ComplianceAuditor]
    code: 201
    input: [period_index, report_kind]
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/compliance-reports/{cid}"
    description: "Fetch compliance report"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/networks/{nid}/stations/{sid}/compliance-reports"
    description: "List compliance reports (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "report_kind?", "period_index?", "limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/compliance-reports/{cid}/submit"
    description: "OPEN -> SUBMITTED"
    roles: [StationGroupOwner]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/compliance-reports/{cid}/audit"
    description: "SUBMITTED -> AUDITED; records finding_count"
    roles: [NetworkAffiliateRelations, ComplianceAuditor]
    code: 200
    input: [finding_count]
    output: ComplianceReport
    side_effects: []

  - method: POST
    path: "/networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-pass"
    description: "AUDITED -> PASSED (requires finding_count == 0)"
    roles: [NetworkAffiliateRelations, ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["Network.posture recomputed"]

  - method: POST
    path: "/networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-fail"
    description: "AUDITED -> FAILED (requires finding_count >= 1)"
    roles: [NetworkAffiliateRelations, ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["Network.posture recomputed (may enter SWEEP_LOCKDOWN)"]

  # --- Syndication Exclusivity Claims ---
  - method: POST
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims"
    description: "File a syndication exclusivity claim"
    roles: [StationGroupOwner]
    code: 201
    input: [program_id, claimant_station_id, respondent_station_id, alleged_window_start_utc, alleged_window_end_utc]
    output: SyndicationExclusivityClaim
    side_effects: []

  - method: GET
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims/{cid}"
    description: "Fetch claim"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: []
    output: SyndicationExclusivityClaim
    side_effects: []

  - method: GET
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims"
    description: "List claims for a territory (FK reverse-reachability)"
    roles: [PlatformAdmin, NetworkAffiliateRelations, StationGroupOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SyndicationExclusivityClaim[]
    side_effects: []

  - method: POST
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/validate"
    description: "FILED -> VALIDATED; enforces half-open window overlap + holder check"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: SyndicationExclusivityClaim
    side_effects: ["respondent Station.posture recomputed"]

  - method: POST
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/dismiss"
    description: "FILED -> DISMISSED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: SyndicationExclusivityClaim
    side_effects: []

  - method: POST
    path: "/networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/settle"
    description: "VALIDATED -> SETTLED"
    roles: [NetworkAffiliateRelations]
    code: 200
    input: []
    output: SyndicationExclusivityClaim
    side_effects: ["respondent Station.posture recomputed"]

