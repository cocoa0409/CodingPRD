scaffold_difficulty_design:

  # =====================================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_contract_total_diverge
        grounds:
          - calculations.quote_total
          - calculations.contract_total
          - entities.BridalEvent.fields.estimated_total_cents
          - entities.Contract.fields.contracted_total_cents
        distinguishing_aspect: |
          quote_total runs forward-looking on BridalEvent over {PENDING,CONFIRMED} faces with the
          cheapest ACTIVE LEAD's rates, while contract_total runs on Contract over CONFIRMED-only
          faces with the chosen lead's PINNED rates — different entity domains, divergent totals for
          the same event.
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z"
            - "one ACTIVE LEAD artist L1 (hair=20000, makeup=25000, travel=600/km, max_faces_per_hour=2)"
            - "event E (distance 10km, ready_by 2026-07-15T12:00:00Z, trial_required=false)"
            - "bride face BOTH CONFIRMED; bridesmaid face HAIR CONFIRMED; one bridesmaid face MAKEUP left PENDING"
            - "event quoted once (estimated_total includes the PENDING MAKEUP face)"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-1"
              captures: { f_hair: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_2", service_type: "MAKEUP" }
              as: Client
              as_user_id: "client-1"
              captures: { f_makeup: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/faces/${f_hair}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { quoted_total: $.data.estimated_total_cents, e_v: $.data.version }
          trigger:
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
              captures: { contract_total: $.data.contracted_total_cents }
          assert:
            - "BridalEvent.${e_id}.estimated_total_cents == 118500"
            - "Contract.contracted_total_cents == 93500"
            - "Contract.contracted_total_cents != BridalEvent.${e_id}.estimated_total_cents"

      - name: balance_addon_vs_cancellation_relief_diverge
        grounds:
          - calculations.balance_reconcile
          - calculations.cancellation_settlement
          - entities.Invoice.fields.balance_amount_cents
          - entities.CancellationRecord.fields.balance_relief_cents
        distinguishing_aspect: |
          balance_reconcile aggregates SUCCEEDED payments minus APPLIED add-ons on the Invoice, while
          cancellation_settlement resolves a tier on CancellationRecord that forgives the outstanding
          balance — distinct entity domains (Invoice ledger vs CancellationRecord policy), distinct
          conserved figures.
        test_recipe:
          setup:
            - "contracted event with deposit PAID (contract_total 93500, deposit 28050), one TOUCH_UP qty 2 add-on (25000) applied"
            - "invoice balance reconciled to 90450 (93500 + 25000 - 28050)"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-1"
              captures: { f_hair: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/faces/${f_hair}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
              captures: { c_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "GET /bridal-beauty/invoices?event_id=${e_id}"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /bridal-beauty/invoices/${inv_id}/payments"
              payload: { applies_to: "DEPOSIT", amount_cents: 28050 }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/events/${e_id}"
              payload: {}
              as: Coordinator
              captures: { e_v2: $.data.version }
            - call: "POST /bridal-beauty/assignments"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", window_start_utc: "2026-07-15T08:00:00Z", window_end_utc: "2026-07-15T10:00:00Z", expected_event_version: "${e_v2}" }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bridal-beauty/assignments/${a_id}/addons"
              payload: { addon_type: "TOUCH_UP", quantity: 2 }
              as: Coordinator
              captures: { addon_id: $.data.id, addon_amt: $.data.amount_cents }
          trigger:
            - call: "GET /bridal-beauty/invoices/${inv_id}"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { bal: $.data.balance_amount_cents }
          assert:
            - "AddOn.${addon_id}.amount_cents == 25000"
            - "Invoice.${inv_id}.balance_amount_cents == 90450"
            - "Invoice.${inv_id}.balance_amount_cents != Contract.${c_id}.contracted_total_cents"

  # =====================================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_bride_rounding_before_sum
        grounds:
          - calculations.contract_total
          - entities.BookingFace.fields.is_bride
          - entities.Contract.fields.contracted_total_cents
        distinguishing_aspect: |
          Mode (b): the 1.5x bride surcharge is round_half_up applied PER bride-line BEFORE summing.
          Each bride BOTH base is 20001, *1.5 = 30001.5 -> rounds to 30002 per line; two lines sum to
          60004. A sum-then-round implementation gives (40002*1.5)=60003.0 -> 60003 (off by one cent),
          so the pinned round-then-sum order is observable.
        test_recipe:
          setup:
            - "lead L2 hair=10001 makeup=10000 travel=333/km, event distance 3km"
            - "two CONFIRMED bride faces BOTH (each base 20001, *1.5 = 30001.5 -> 30002 per line)"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L2", skill_tier: "LEAD", hair_rate_per_face_cents: 10001, makeup_rate_per_face_cents: 10000, travel_rate_per_km_cents: 333, max_faces_per_hour: 4 }
              as: Coordinator
              captures: { l2_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-2", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 3, trial_required: false }
              as: Client
              as_user_id: "client-2"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE_A", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-2"
              captures: { fa: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE_B", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-2"
              captures: { fb: $.data.id }
            - call: "POST /bridal-beauty/faces/${fa}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-2"
            - call: "POST /bridal-beauty/faces/${fb}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-2"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
          trigger:
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l2_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-2"
              captures: { ct: $.data.contracted_total_cents }
          assert:
            - "Contract.contracted_total_cents == 61003"

      - name: deposit_tier_selection_three_inputs
        grounds:
          - calculations.deposit_split
          - entities.Contract.fields.contracted_total_cents
          - entities.Contract.fields.deposit_due_cents
        distinguishing_aspect: |
          Mode (a): deposit_split is a tiered-rate selection over contracted_total with three
          half-open bands {<50000:0.25, [50000,200000):0.30, >=200000:0.40}; non-linear branch on
          the total tier, structurally different from the per-line rounding mode above.
        test_recipe:
          setup:
            - "contract_total lands in MID tier (93500) -> deposit pct 0.30 -> 28050"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-1"
              captures: { f_hair: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/faces/${f_hair}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
          trigger:
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
              captures: { dep: $.data.deposit_due_cents }
          assert:
            - "Contract.contracted_total_cents == 93500"
            - "Contract.deposit_due_cents == 28050"

  # =====================================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_quote_revision_cycle
        grounds:
          - state_machines.BridalEvent.QUOTED_to_REVISION_REQUESTED
          - state_machines.BridalEvent.REVISION_REQUESTED_to_QUOTED
          - entities.BridalEvent.fields.quote_revision
        distinguishing_aspect: |
          BridalEvent loops QUOTED -> REVISION_REQUESTED -> QUOTED; quote_revision increments each
          re-quote, so two full rounds leave quote_revision == 2 (a true cycle, not a linear pipeline).
        test_recipe:
          setup:
            - "event quoted once (revision 1), then revision requested, then re-quoted (revision 2)"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
            - call: "POST /bridal-beauty/events/${e_id}/request-revision"
              payload: {}
              as: Client
              as_user_id: "client-1"
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { rev: $.data.quote_revision, st: $.data.status }
          assert:
            - "BridalEvent.${e_id}.status == QUOTED"
            - "BridalEvent.${e_id}.quote_revision == 2"

      - name: invoice_parallel_deposit_and_balance_axes
        grounds:
          - state_machines.Invoice.deposit_status=DUE_to_deposit_status=PAID
          - state_machines.Invoice.balance_status=NOT_DUE_to_balance_status=DUE
          - entities.Invoice.fields.deposit_status
          - entities.Invoice.fields.balance_status
        distinguishing_aspect: |
          Invoice carries two independent axes: paying the deposit moves deposit_status DUE->PAID while
          balance_status stays NOT_DUE, and completing the assignment later moves balance_status
          NOT_DUE->DUE without touching deposit_status — parallel dimensions on one entity.
        test_recipe:
          setup:
            - "contracted event, deposit just paid; assignment scheduled and started, then completed"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-1"
              captures: { f_hair: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/faces/${f_hair}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/invoices?event_id=${e_id}"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /bridal-beauty/invoices/${inv_id}/payments"
              payload: { applies_to: "DEPOSIT", amount_cents: 28050 }
              as: Client
              as_user_id: "client-1"
              captures: { dep_status: $.data.invoice_id }
            - call: "GET /bridal-beauty/events/${e_id}"
              payload: {}
              as: Coordinator
              captures: { e_v2: $.data.version }
            - call: "POST /bridal-beauty/assignments"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", window_start_utc: "2026-07-15T08:00:00Z", window_end_utc: "2026-07-15T10:00:00Z", expected_event_version: "${e_v2}" }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/assignments/${a_id}/start"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
          trigger:
            - call: "POST /bridal-beauty/assignments/${a_id}/complete"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
          assert:
            - "Invoice.${inv_id}.deposit_status == PAID"
            - "Invoice.${inv_id}.balance_status == DUE"

  # =====================================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_settlement_invoice_face_cascade
        grounds:
          - state_machines.BridalEvent.CONTRACTED_to_CANCELLED
          - calculations.cancellation_settlement
          - state_machines.Invoice.deposit_status=PAID_to_deposit_status=FORFEITED
          - entities.BookingFace.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from event cancel: cancel -> CancellationRecord+settlement (hop1) ->
          Invoice deposit_status PAID->FORFEITED (hop2 caused by the settlement) -> CONFIRMED faces
          REMOVED (hop3 caused by the invoice/event teardown). Each link is caused by the prior link.
        test_recipe:
          setup:
            - "contracted event, deposit PAID, clock 24h before event_date -> FULL_FORFEIT tier"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f_bride: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDESMAID_1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-1"
              captures: { f_hair: $.data.id }
            - call: "POST /bridal-beauty/faces/${f_bride}/confirm"
              payload: {}
