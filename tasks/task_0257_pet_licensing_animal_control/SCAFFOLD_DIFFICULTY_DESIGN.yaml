  - rule_id: transitive_cascade
    instances:
      - name: pet_deceased_revokes_license_voids_tag_recounts_owner
        grounds:
          - state_machines.Pet.ACTIVE_to_DECEASED
          - state_machines.License.ACTIVE_to_REVOKED
          - entities.Tag.fields.status
          - entities.Owner.fields.active_license_count
        distinguishing_aspect: |
          Depth-3 cascade from mark-deceased: Pet→DECEASED (hop1) forces its ACTIVE License→REVOKED
          (hop2), which itself VOIDs the License's current Tag (hop3) and decrements
          Owner.active_license_count; each hop is caused by the prior hop, not by the original call,
          distinct trigger from the GRACE→EXPIRED cascade below.
        test_recipe:
          setup:
            - "Owner OE with pet PE holding one ACTIVE INDIVIDUAL license LE and an ISSUED tag; Owner.active_license_count=1"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner E", email: "oe@x.com", address_zip: "50001" }
              as: LicensingClerk
              captures: { oe_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${oe_id}", name: "Pax", species: "DOG", breed: "B", is_altered: true, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
