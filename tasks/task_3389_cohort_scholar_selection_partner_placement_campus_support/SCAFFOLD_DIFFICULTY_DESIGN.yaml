  - rule_id: combinatorial_formula
    instances:
      - name: evaluation_floor_cap_nonlinearity
        grounds:
          - calculations.evaluation_weighted_score
        distinguishing_aspect: |
          Mode (a) combinatorial formula: 3+ inputs with non-linear interaction.
          A conditional cap branch on min(leadership, teamwork, group_presence)
          makes the score non-linear: (100,100,39) computes base 817 but caps to
          499 because one dimension is below DIMENSION_FLOOR=40, while
          (100,100,40) ships uncapped at 820 — a single point on one dimension
          flips the branch and moves the result by 321.
        test_recipe:
          setup:
            - "Nominee N in ROUND_1 (city program window open at default clock)"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 20 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One", nominator_id: "${np}" }, as: ProgramAdmin, captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
          trigger:
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 100, teamwork: 100, group_presence: 39 }, as: Assessor, as_user_id: "assessor-a", captures: { e1: $.data.id, w1: $.data.weighted_score } }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 100, teamwork: 100, group_presence: 40 }, as: Assessor, as_user_id: "assessor-b", captures: { e2: $.data.id, w2: $.data.weighted_score } }
            - { call: "GET /api/nominees/${n1}", as: ProgramAdmin, captures: { r1: $.data.round_1_score } }
          assert:
            - "Evaluation.${e1}.weighted_score == 499 (captured ${w1}: base 4*100+3*100+3*39=817, min dimension 39 < 40 so min(817, 499)=499)"
            - "Evaluation.${e2}.weighted_score == 820 (captured ${w2}: base 820, min dimension 40 >= 40 so no cap)"
            - "nominee.round_1_score == 660 (captured ${r1}: round_half_up((499+820)/2) = round_half_up(659.5))"
      - name: program_fee_invoice_per_scholar_rounding
        grounds:
          - calculations.cohort_program_fee_invoice
          - state_machines.Cohort.LOCKED_to_MATRICULATED
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding where the order matters.
          tuition_annual_cents = 6123460 gives a raw fee fraction of 76543.25 per
          scholar; rounding each scholar's fee HALF_UP before summing (pinned
          order) yields 2*(250000+76543) = 653086, whereas summing raw fractions
          first would yield 653087 — the scaffold pins per-scholar-then-sum, and
          653086 is the only correct invoice.
        test_recipe:
