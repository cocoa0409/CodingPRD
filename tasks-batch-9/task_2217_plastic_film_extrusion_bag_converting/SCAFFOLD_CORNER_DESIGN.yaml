  - section: validations
    instances:
      - name: submitting_a_recipe_whose_weights_total_ninety_percent_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_BLEND_WEIGHT_NOT_100]
        distinguishing_aspect: "total_weight_pct must be exactly 100.000; 90.000 is short, and the check fires at submit rather than at component insertion."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-W for P-NF-1 holding a single 90.000 % LL-1001 component"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - &a_rw_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-W", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { rw: "$.data.id" } }
            - &a_rw_c1 { call: "POST /blend-recipes/${rw}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 90.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
          trigger:
            - { call: "POST /blend-recipes/${rw}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
          assert:
            - "POST /blend-recipes/${rw}/submit -> 422 ERR_BLEND_WEIGHT_NOT_100"
            - "BlendRecipe.${rw}.total_weight_pct == 90.000 and status == DRAFT"
            - "BlendRecipe.${rw}.submitted_by_user_id == null"
      - name: submitting_a_fully_conforming_recipe_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - state_machines.BlendRecipe.DRAFT_to_SUBMITTED
        distinguishing_aspect: "With weights at 100.000, layer_count matching the product, no barrier requirement for a one-layer product, regrind at 0.000 and strength_index 42.00 above the 25.0 floor, every priority-11 and priority-12 row is satisfied and the transition is taken."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-0 with one 100.000 % LL-1001 component"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_r0_new
            - *a_r0_c1
          trigger:
            - { call: "POST /blend-recipes/${r0}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
          assert:
            - "POST /blend-recipes/${r0}/submit -> 200 and BlendRecipe.${r0}.status == SUBMITTED"
            - "BlendRecipe.${r0}.submitted_by_user_id == 'u-be-1'"
            - "BlendRecipe.${r0}.strength_index == 42.00 and regrind_pct == 0.000"
