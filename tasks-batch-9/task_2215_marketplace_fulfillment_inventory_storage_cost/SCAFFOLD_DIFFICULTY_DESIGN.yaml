  - rule_id: compensating_invariant
    instances:
      - name: plan_cancel_restores_restock_reservation_ledger_exactly
        grounds:
          - state_machines.InboundShipmentPlan.CONFIRMED_to_CANCELLED
          - entities.SellerAccount.fields.restock_reserved_units
          - entities.RestockQuota.fields.utilized_units
          - calculations.restock_allocation
        distinguishing_aspect: |
          Conserved quantity is the restock reservation ledger (SellerAccount.restock_reserved_units and
          RestockQuota.utilized_units): cancelling a CONFIRMED plan must return both from 900 to exactly 0
          and zero every allocation field on the plan and its line item, with no residue.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Quota scored 1000 with restock_limit_units 3000 and utilized_units 0 before the confirm."
