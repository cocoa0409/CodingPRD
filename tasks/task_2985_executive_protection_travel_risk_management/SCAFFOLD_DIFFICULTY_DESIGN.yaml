            - "one LOCAL_LIAISON vendor in SO: AVAILABLE, max_concurrent_engagements 3, sla_response_minutes 120, hourly_rate_cents 20000, retainer_cents 100000"
            - "trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z with one SO leg 2026-09-10T00:00:00Z..2026-09-11T00:00:00Z, a LEAD_AGENT assignment covering that leg exactly, and one 24-hour LOCAL_LIAISON engagement on the leg"
