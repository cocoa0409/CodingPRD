  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Visitor role acting on a different visitor's resources" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum value" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property not found" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "JurisdictionPolicy not found" }
  - { id: ERR_BANNER_CONFIG_NOT_FOUND, http: 404, condition: "ConsentBannerConfig not found" }
