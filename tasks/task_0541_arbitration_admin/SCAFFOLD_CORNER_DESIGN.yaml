      - name: unauthenticated_precedes_not_found_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A GET on a non-existent case sent with an unknown role fails auth (priority 1) before
          existence (priority 3) — the response is 401 ERR_UNAUTHENTICATED, not 404.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.error_id == ERR_UNAUTHENTICATED"

