              captures: { att_after: $.data.attainment_actual_bps, tier_after: $.data.quota_compliance_tier }
          assert:
            - "the 2026-05 report is accepted (201) with net_units == 500"
            - "attainment_actual_bps was 9000 before and remains exactly 9000 after (round_half_up(10000 * 270 / 300))"
            - "quota_compliance_tier remains WATCH (9000 >= 9000 is not SANCTION) and the distributor stays APPROVED"

