# ===========================================================================
# 1.9 Scaffold Corner Design
# Alcohol Server Training & Certification Administration (TIPS program)
#
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7, walked against
# references/claim-extraction-guide.md. Corners already asserted by an
# instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because: stubs (no test_recipe).
#
# Every setup_api_calls chain below drives an empty database into the
# instance's precondition using only endpoints declared in section 1.5, and
# the logical clock is always pinned explicitly rather than relying on the
# 2026-08-01T00:00:00Z default.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: jurisdiction_creation_applies_every_declared_default_and_zeroed_system_counter
        claim_type: Defaults
        grounds:
          - entities.StateJurisdiction
          - endpoints.POST_/state-jurisdictions
        distinguishing_aspect: |
          A jurisdiction created with only the three required inputs must materialise all
          eleven declared defaults exactly (36 / 30 / 30 / true / 30 / 250 / 70 / 2 / 24 /
          true / 60) plus certificates_issued_count 0, version 1 and created_at equal to
          the pinned logical clock.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /state-jurisdictions"
              payload: { state_code: "NV", mandate_type: "CONDITIONAL", mandated_tracks: ["ON_PREMISE"] }
              as: ProgramAdmin
              captures: { nv_id: $.data.id }
          assert:
            - "response status == 201"
            - "StateJurisdiction.${nv_id}.certificate_validity_months == 36"
            - "StateJurisdiction.${nv_id}.renewal_grace_days == 30 and new_hire_training_days == 30"
            - "StateJurisdiction.${nv_id}.registry_submission_required == true and registry_deadline_days == 30"
            - "StateJurisdiction.${nv_id}.registry_late_fee_cents_per_day == 250"
            - "StateJurisdiction.${nv_id}.min_passing_score_pct == 70.00 and max_retakes_allowed == 2"
            - "StateJurisdiction.${nv_id}.retake_cooling_off_hours == 24 and proctor_separation_required == true"
            - "StateJurisdiction.${nv_id}.reminder_lead_days == 60"
            - "StateJurisdiction.${nv_id}.certificates_issued_count == 0"
            - "StateJurisdiction.${nv_id}.version == 1 and created_at == '2026-08-03T09:00:00Z' and updated_at == '2026-08-03T09:00:00Z'"

      - name: trainer_creation_generates_system_fields_and_leaves_computed_fields_at_defaults
        claim_type: System Fields
        grounds:
          - entities.Trainer
          - endpoints.POST_/trainers
        distinguishing_aspect: |
          A freshly created Trainer carries a server-minted id, created_at and updated_at
          equal to the pinned clock and version 1, while every computed field sits at its
          declared default: trainer_status PROVISIONAL, certified_tracks [],
          certified_state_codes [], credential_expires_at null, sessions_taught_count 0,
          graded_enrollments_count 0, pass_rate_pct 0.00.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
          assert:
            - "response status == 201 and the response body contains a non-empty id"
            - "Trainer.${tr_id}.trainer_status == 'PROVISIONAL'"
            - "Trainer.${tr_id}.certified_tracks == [] and certified_state_codes == [] and credential_expires_at is null"
            - "Trainer.${tr_id}.sessions_taught_count == 0 and graded_enrollments_count == 0 and pass_rate_pct == 0.00"
            - "Trainer.${tr_id}.created_at == '2026-08-03T09:00:00Z' and updated_at == '2026-08-03T09:00:00Z' and version == 1"

      - name: course_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Course
          - endpoints.GET_/courses/{id}
        distinguishing_aspect: |
          GET /courses/{id} returns exactly the field values that POST /courses stored -
          title, track, delivery_mode, contact_hours 4.00, question_count 40, version_label
          v1 - together with status DRAFT and content_revision_count 0.
        test_recipe:
          setup:
            - "One DRAFT course exists; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
          trigger:
            - call: "GET /courses/${course_id}"
              payload: {}
              as: StateRegulator
          assert:
            - "response status == 200 and data.id == ${course_id}"
            - "Course.${course_id}.title == 'TIPS On-Premise Core' and track == 'ON_PREMISE' and delivery_mode == 'CLASSROOM'"
            - "Course.${course_id}.contact_hours == 4.00 and question_count == 40 and version_label == 'v1'"
            - "Course.${course_id}.status == 'DRAFT' and content_revision_count == 0 and retired_at is null"

      - name: course_listing_filters_by_track_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.Course
          - endpoints.GET_/courses
        distinguishing_aspect: |
          With two ON_PREMISE courses and one OFF_PREMISE course, GET /courses filtered to
          track ON_PREMISE with limit 1 and offset 0 returns one row, total_count 2 and
          has_more true - total_count reflects the filtered set, not the table.
        test_recipe:
          setup:
            - "Three DRAFT courses exist: two ON_PREMISE and one OFF_PREMISE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Refresher", track: "ON_PREMISE", delivery_mode: "ONLINE", contact_hours: 2, question_count: 25, version_label: "v1" }
              as: ProgramAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS Off-Premise Core", track: "OFF_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 3, question_count: 30, version_label: "v1" }
              as: ProgramAdmin
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /courses"
              payload: { track: "ON_PREMISE", limit: 1, offset: 0 }
              as: ProgramAdmin
          assert:
            - "response status == 200 and data has length 1 and total_count == 2 and has_more == true"
            - "the returned row id is ${c1_id} (ascending created_at ordering) and ${c3_id} is absent"
            - "a second call with limit 1 and offset 1 returns the row ${c2_id}, total_count 2 and has_more == false"

      - name: certificate_retrieval_with_unknown_id_returns_credential_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_CREDENTIAL_NOT_FOUND
          - endpoints.GET_/certificates/{id}
          - validations.priority_4_path_id_resolution_by_entity_family
        distinguishing_aspect: |
          A syntactically valid but unknown Certificate id resolves to the credential
          family's 404 code ERR_CREDENTIAL_NOT_FOUND, not the catalog, training or employer
          family code - the four 404 codes are domain-scoped, so the family choice is
          itself the claim.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no Certificate rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /certificates/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response status == 404 and error_id == 'ERR_CREDENTIAL_NOT_FOUND'"
            - "a GET /courses/00000000-0000-4000-8000-000000000999 in the same state returns error_id == 'ERR_CATALOG_NOT_FOUND'"
            - "a GET /class-sessions/00000000-0000-4000-8000-000000000999 returns error_id == 'ERR_TRAINING_NOT_FOUND'"
            - "a GET /employer-locations/00000000-0000-4000-8000-000000000999 returns error_id == 'ERR_EMPLOYER_NOT_FOUND'"

      - name: course_creation_missing_question_count_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/courses
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          question_count is a required input with no default, so omitting it yields 400
          ERR_INVALID_REQUEST and creates no Course row - the shape check at priority 3
          runs before any state or existence check.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, version_label: "v1" }
              as: ProgramAdmin
          assert:
            - "response status == 400 and error_id == 'ERR_INVALID_REQUEST'"
            - "GET /courses with limit 50 and offset 0 returns total_count 0"

      - name: course_creation_with_unknown_track_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Course.fields.track
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          track accepts only ON_PREMISE or OFF_PREMISE, so the value BOTH_PREMISES is
          rejected with 400 ERR_INVALID_REQUEST; the same request also proves
          question_count 400 is out of the declared 10..200 range.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /courses"
              payload: { title: "TIPS Hybrid", track: "BOTH_PREMISES", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
            - call: "POST /courses"
              payload: { title: "TIPS Oversized", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 400, version_label: "v1" }
              as: ProgramAdmin
          assert:
            - "the BOTH_PREMISES request returns status 400 and error_id == 'ERR_INVALID_REQUEST'"
            - "the question_count 400 request returns status 400 and error_id == 'ERR_INVALID_REQUEST'"
            - "GET /courses with limit 50 and offset 0 returns total_count 0"

      - name: alcohol_server_computed_fields_start_at_their_declared_defaults
        claim_type: Computed Fields
        grounds:
          - entities.AlcoholServer.fields.work_eligibility
          - entities.AlcoholServer.fields.active_certificate_id
          - endpoints.POST_/alcohol-servers
        distinguishing_aspect: |
          A newly registered server is UNCERTIFIED with active_certificate_id null,
          certification_count 0 and restricted_since null - the certificate selector has
          not run, so no eligibility can be inferred from the absence of certificates
          other than UNCERTIFIED.
        test_recipe:
          setup:
            - "A TX jurisdiction exists; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_id: $.data.id }
          assert:
            - "response status == 201"
            - "AlcoholServer.${srv_id}.work_eligibility == 'UNCERTIFIED'"
            - "AlcoholServer.${srv_id}.active_certificate_id is null and certification_count == 0 and restricted_since is null"
            - "AlcoholServer.${srv_id}.state_jurisdiction_id == ${tx_id} and version == 1"

      - name: compliance_run_is_immutable_and_exposes_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.ComplianceRun
          - endpoints.POST_/compliance-runs
        distinguishing_aspect: |
          ComplianceRun is the only entity declared with common_fields false: its response
          carries id, created_at and run_at but no version and no updated_at, and section
          1.5 declares no update or delete endpoint for it, so the audit row cannot be
          rewritten.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock, so the run has nothing to process."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /compliance-runs"
              payload: {}
              as: ProgramAdmin
              captures: { run_id: $.data.id }
          assert:
            - "response status == 201 and the body contains id and created_at but NOT version and NOT updated_at"
            - "ComplianceRun.${run_id}.run_at == '2026-08-03T09:00:00Z'"
            - "ComplianceRun.${run_id}.trainers_lapsed_count == 0, approvals_expired_count == 0, certificates_graced_count == 0, certificates_lapsed_count == 0"
            - "ComplianceRun.${run_id}.reminders_sent_count == 0, assignments_restricted_count == 0, assignments_restored_count == 0, locations_recomputed_count == 0, documents_voided_count == 0"

      - name: location_creation_under_unknown_employer_account_returns_employer_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.EmployerLocation.parent
          - errors.ERR_EMPLOYER_NOT_FOUND
          - endpoints.POST_/employer-accounts/{id}/locations
        distinguishing_aspect: |
          EmployerLocation is a child of EmployerAccount addressed by nested route, so an
          unknown parent id in the path yields 404 ERR_EMPLOYER_NOT_FOUND at priority 4 -
          before the body's state_jurisdiction_id is even resolved (that id is valid here,
          proving the parent check fired first).
        test_recipe:
          setup:
            - "A TX jurisdiction exists but no EmployerAccount rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /employer-accounts/00000000-0000-4000-8000-000000000777/locations"
              payload: { location_name: "Ghost Bar", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 100000 }
              as: ProgramAdmin
          assert:
            - "response status == 404 and error_id == 'ERR_EMPLOYER_NOT_FOUND'"
            - "GET /employer-locations with limit 50 and offset 0 returns total_count 0"

      - name: enrollment_junction_row_is_reachable_from_both_the_session_and_the_server_side
        claim_type: Creation
        grounds:
          - entities.Enrollment
          - endpoints.GET_/enrollments
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Enrollment is the many-to-many junction of the graph topology: the same row must
          appear when GET /enrollments is filtered by class_session_id and when it is
          filtered by alcohol_server_id, and its paid_by must read SELF_PAY with
          seat_credit_charged false when no sponsoring account is supplied.
        test_recipe:
          setup:
            - "TX jurisdiction, a published ON_PREMISE course with an APPROVED TX approval, a CERTIFIED trainer, one SCHEDULED session and server Ari Cole."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], proctor_separation_required: false }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", capacity: 20 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess_id}", alcohol_server_id: "${srv_id}", expected_class_session_version: "${sess_v}" }
              as: AlcoholServer
              as_user_id: "${srv_id}"
              captures: { enr_id: $.data.id }
          assert:
            - "response status == 201 and Enrollment.${enr_id}.enrollment_state == 'REGISTERED'"
            - "Enrollment.${enr_id}.paid_by == 'SELF_PAY' and seat_credit_charged == false and sponsoring_employer_account_id is null"
            - "Enrollment.${enr_id}.attempt_count == 0 and best_score_pct is null and retake_eligible_at is null"
            - "GET /enrollments filtered by class_session_id ${sess_id} returns total_count 1 with row id ${enr_id}"
            - "GET /enrollments filtered by alcohol_server_id ${srv_id} returns total_count 1 with row id ${enr_id}"
            - "ClassSession.${sess_id}.enrolled_count == 1 and version == ${sess_v} + 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: course_is_created_in_the_draft_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Course.initial_state
          - entities.Course.fields.status
        distinguishing_aspect: |
          POST /courses lands in DRAFT, never PUBLISHED: the row is not yet approvable, so
          POST /course-approvals against it is rejected with 409 ERR_COURSE_INVALID_STATE
          until publish runs.
        test_recipe:
          setup:
            - "A TX jurisdiction exists and one course has just been created but not published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "premature filing" }
              as: ProgramAdmin
          assert:
            - "Course.${course_id}.status == 'DRAFT'"
            - "response status == 409 and error_id == 'ERR_COURSE_INVALID_STATE'"
            - "GET /course-approvals filtered by course_id ${course_id} returns total_count 0"

      - name: publishing_an_already_published_course_returns_course_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Course.DRAFT_to_PUBLISHED
          - errors.ERR_COURSE_INVALID_STATE
          - validations.priority_10_ERR_COURSE_INVALID_STATE
        distinguishing_aspect: |
          Publish is only defined from DRAFT, so the second publish on the same course is
          rejected with 409 ERR_COURSE_INVALID_STATE and leaves Course.version untouched -
          the failed transition must not bump the OCC counter.
        test_recipe:
          setup:
            - "One course has been created and published once; the logical clock is pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { course_v: $.data.version }
          trigger:
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response status == 409 and error_id == 'ERR_COURSE_INVALID_STATE'"
            - "Course.${course_id}.status == 'PUBLISHED' and version == ${course_v} and content_revision_count == 0"

      - name: suspended_trainer_is_locked_down_against_further_suspension_and_recredentialing
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Trainer.terminal_states
          - errors.ERR_TRAINER_INVALID_STATE
        distinguishing_aspect: |
          SUSPENDED is Trainer's only terminal state, so both declared write triggers into
          it - POST /trainers/{id}/suspend and POST /trainers/{id}/credential - return 409
          ERR_TRAINER_INVALID_STATE afterwards, and certified_tracks stays as it was at
          suspension time.
        test_recipe:
          setup:
            - "Trainer Dana Reyes was credentialed for ON_PREMISE in TX and then suspended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
