            - call: "POST /applications/${c23_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c23_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c23_award_id: $.data.id }
          trigger:
            - call: "POST /single-audits"
              payload: { award_id: "${c23_award_id}", fiscal_year: 2026, federal_expenditures_cents: 75000100 }
              as: Auditor
              captures: { c23_sa_id: $.data.id, c23_req: $.data.audit_required }
          assert:
            - "SingleAudit.${c23_sa_id}.audit_required == true"

      - name: waterfall_full_fill_within_first_bucket_single_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.drawdown_waterfall_allocation
          - entities.FundAllocation.fields.amount_cents
          - entities.RestrictedFund.fields.allocated_cents
        distinguishing_aspect: |
          waterfall variant full_fill_within_first_bucket: a 2000000 draw against a priority-1 fund with
          5000000 headroom is absorbed entirely by bucket 1 (single FundAllocation), leaving the priority-2
          fund untouched (allocated_cents 0).
        test_recipe:
          setup:
            - "ACTIVE Award; two funds priority 1/2 budget 5000000/5000000; a REQUESTED drawdown 2000000 against fund 1."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C24", applicant_org_name: "Corner Org 24", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
