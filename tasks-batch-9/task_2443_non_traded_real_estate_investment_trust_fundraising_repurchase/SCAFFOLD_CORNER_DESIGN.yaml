      - name: subscriptions_are_refused_under_pending_suspended_and_terminated_agreements
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELLING_AGREEMENT_NOT_ACTIVE]
          - state_machines.SellingAgreement.status
          - entities.SellingAgreement.fields.status
        distinguishing_aspect: |
          The identical subscription body is refused with
          ERR_SELLING_AGREEMENT_NOT_ACTIVE while its agreement is PENDING, again
          after an explicit SUSPEND, and again after TERMINATED, succeeding only in
          the ACTIVE window between them.
        test_recipe:
          setup:
            - "Offering 'Jerrow Income REIT' is EFFECTIVE at 1000 cents per share with one zero-load class I."
            - "Broker-dealer 'Jerrow Placement' is IN_GOOD_STANDING and its agreement (max_commission_bps 100) starts at its default PENDING."
            - "Investor Kaia Lindqvist is DOCUMENTED with a 5000000000-cent net worth, so no investor-protection gate can fire."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Jerrow Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Jerrow Placement", crd_number: "CRD-340002" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id, sa_status: $.data.status }
            - call: "POST /investors"
              payload: { legal_name: "Kaia Lindqvist", email: "kaia.lindqvist@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-KAIA-2026-08" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { pending_error: $.error.error_id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { ok_sub_id: $.data.id, ok_sub_status: $.data.status }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "SUSPENDED" }
              as: ComplianceOfficer
              captures: { suspended_status: $.data.status }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 50000 }
              as: SponsorOperator
              captures: { suspended_error: $.error.error_id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "TERMINATED" }
              as: ComplianceOfficer
              captures: { terminated_status: $.data.status }
            - call: "GET /subscriptions/${ok_sub_id}"
              as: SponsorOperator
              captures: { ok_sub_after: $.data.status, ok_sub_reason: $.data.rejection_reason }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 50000 }
              as: SponsorOperator
              captures: { terminated_error: $.error.error_id }
          assert:
            - "sa_status == \"PENDING\""
            - "pending_error == \"ERR_SELLING_AGREEMENT_NOT_ACTIVE\" with response http status == 409"
            - "ok_sub_status == \"PENDING\" with response http status == 201"
            - "suspended_status == \"SUSPENDED\" and BrokerDealer.${bd_id}.suspended_agreement_count == 1 and BrokerDealer.${bd_id}.supervision_status == \"HEIGHTENED_SUPERVISION\""
            - "suspended_error == \"ERR_SELLING_AGREEMENT_NOT_ACTIVE\" with response http status == 409"
            - "terminated_status == \"TERMINATED\" and BrokerDealer.${bd_id}.suspended_agreement_count == 0"
            - "ok_sub_after == \"REJECTED\" and ok_sub_reason == \"AGREEMENT_TERMINATED\""
            - "terminated_error == \"ERR_SELLING_AGREEMENT_NOT_ACTIVE\" with response http status == 409"
            - "GET /subscriptions?offering_id=${off_id} returns total_count == 1 (only the one accepted-into-PENDING ticket was ever created)"

      - name: concentration_limit_binds_one_cent_past_ten_percent_of_the_state_basis
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONCENTRATION_LIMIT_EXCEEDED]
          - calculations.investor_concentration_limit
          - entities.Investor.fields.concentration_limit_cents
        distinguishing_aspect: |
          With identical 2600000-cent net worth, a Texas investor's limit is 260000
          and an Ohio investor's is 250000 because the strict-state basis is the
          lesser of net worth and income, so the same 260000-cent ticket passes in
          Texas and is refused in Ohio.
        test_recipe:
          setup:
            - "Offering 'Kestrel Income REIT' is EFFECTIVE at 1000 cents per share with one zero-load class I and an ACTIVE agreement (max_commission_bps 100)."
            - "Texas investor Lena Marchetti: net worth 2600000, annual income 900000, DOCUMENTED; her concentration_limit_cents is 260000."
            - "Ohio investor Milo Bergstrom: net worth 2600000, annual income 2500000, DOCUMENTED; his concentration_limit_cents is 250000."
