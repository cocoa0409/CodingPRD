              as: ProjectAccountant
              as_user_id: "acct-001"
            - call: "POST /write-offs"
              payload: { project_id: "${p_id}", target_type: "INVOICE_RECEIVABLE", amount: 1331.04, reason: "Client insolvent", invoice_id: "${inv_id}" }
              as: ProjectAccountant
              as_user_id: "acct-001"
            - call: "POST /write-offs"
              payload: { project_id: "${p_id}", target_type: "INVOICE_RECEIVABLE", amount: 1331.05, reason: "Client insolvent", invoice_id: "${inv_id}" }
              as: ProjectAccountant
              as_user_id: "acct-001"
