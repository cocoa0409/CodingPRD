          trigger:
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id, v_create: $.data.version }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { v_active: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${v_active}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "GET /offtake-contracts/${contract_id}"
              as: CommercialScheduler
              captures: { v_after_nom: $.data.version }
          assert:
            - "${v_create} == 1"
            - "${v_active} == 2"
            - "${v_after_nom} == 3"
            - "PipelineNomination.${nom_id}.version == 1"
            - "OfftakeContract.${contract_id}.status == ACTIVE"

      - name: cascading_side_effects_span_five_entities_from_one_reading
        claim_type: cascading_side_effects
        grounds: ["state_machines.GasWell.ONLINE_to_ISOLATED", "state_machines.ProcessingPlant.UPGRADING_to_FLARING"]
        excluded_because:
          difficulty_instance: alarm_reading_cascades_well_site_plant_batch_nomination
          rationale: "That §1.8 instance walks the full depth-5 chain end to end and asserts every hop's observable state."

      - name: dual_variant_calculation_produces_different_numbers_on_identical_inputs
        claim_type: dual_variant_calculation
        grounds: ["calculations.rin_d3_generation", "calculations.royalty_settlement"]
        excluded_because:
          difficulty_instance: royalty_gross_revenue_share_vs_netback_share
          rationale: "Both dual-variant surfaces are asserted by the §1.8 dual_variant_calc instances (3988 vs 4132 RINs; 1711.50 vs 1663.50 USD)."

      - name: rate_threshold_trigger_fires_at_the_exact_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.reading_quality_classification", "calculations.receipt_point_headroom"]
        excluded_because:
          difficulty_instance: oxygen_at_exactly_five_percent_isolates_while_four_ninety_nine_throttles
          rationale: "The inclusive oxygen threshold and the inclusive receipt-point cap are both asserted at their exact boundaries by the §1.8 boundary_precision_check and resource_temporal_overlap instances."

  - section: consistency_model
    instances:
      - name: all_cascade_effects_are_visible_in_the_same_request
        claim_type: immediate
        grounds: ["state_machines.InjectionBatch.NOMINATED_to_INJECTED", "calculations.energy_balance_invariant"]
        excluded_because:
          difficulty_instance: site_energy_mmbtu_conserved_across_divert_and_void
          rationale: "The consistency model is immediate: every §1.8 and §1.9 instance reads the cascaded state back on the very next request with no settling delay, and that instance asserts the ledger the moment the divert and the void return."
