              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${pv1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan_id: $.data.id }
            - call: "POST /scan-runs/${scan_id}/cancel"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
          trigger:
            - call: "GET /accounts/${acct_id}/entitlement-statement"
              as: Auditor
              as_user_id: "auditor-1"
              captures: { stmt_scan_rem: $.data.scan_remaining, stmt_cycle: $.data.cycle_id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { row_scan_rem: $.data.scan_units_remaining }
          assert:
            - "Statement: scan_granted == 12, scan_consumed == 1, scan_released == 1, scan_remaining == 12"
            - "Account row: scan_units_granted == 12, scan_units_consumed == 1, scan_units_released == 1, scan_units_remaining == 12"
            - "Statement profile_consumed == 1 and profile_remaining == 3 match Account.profile_units_consumed and profile_units_remaining"
            - "Statement removal_granted == 60, removal_consumed == 0, removal_remaining == 60"
            - "stmt_cycle equals the id of the account's only OPEN BillingCycle"
            - "ScanRun.${scan_id}.status == CANCELLED and entitlement_units_held == 0"

