            - "SeedLot.${child_lot_id}.certification_status == RETEST_DUE and conditioning_status == BAGGED and carryover_generation == 1 and gross_kg == 34501.25 and season_year == 2027"
            - "SeedLot.${lot_id}.certification_status == TAGGED (the parent lot is untouched by minting the successor)"

