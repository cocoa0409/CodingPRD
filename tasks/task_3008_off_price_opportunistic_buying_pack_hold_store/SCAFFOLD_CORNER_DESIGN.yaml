# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3008_off_price_opportunistic_buying_pack_hold_store
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Logical clock default at server start: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: merchandise_season_create_returns_defaults_and_computed_zeros
        claim_type: Creation
        grounds:
          - entities.MerchandiseSeason
          - endpoints.POST_/merchandise-seasons
        distinguishing_aspect: "A season created with the five required inputs returns 201 with status DRAFT, version 1, and all four computed budget fields exactly 0 — none of status/committed/spent are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanningLead
          trigger:
            - &k_season
              call: "POST /merchandise-seasons"
              payload: { season_code: "SS2027", start_date: "2027-02-01T00:00:00Z", end_date: "2027-07-31T00:00:00Z", department_otb_budget_cents: 30000000, packaway_reserve_ratio: 0.30 }
              as: PlanningLead
              captures: { k_season_id: $.data.id, k_season_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "MerchandiseSeason.${k_season_id}.status == DRAFT and version == 1"
            - "committed_forward_cents == 0, committed_packaway_cents == 0, spent_forward_cents == 0, spent_packaway_cents == 0"
            - "the response carries non-null id, created_at, updated_at"

      - name: lot_create_packaway_requires_target_season_and_defaults
        claim_type: Defaults
        grounds:
          - entities.Lot.fields.target_season_id
          - entities.Lot.fields.mixed_lot
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A PACKAWAY lot omitting target_season_id is a 400 ERR_INVALID_REQUEST (required-iff-disposition rule), while an IMMEDIATE lot omitting mixed_lot defaults mixed_lot to false."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 DRAFT, FW2027 DRAFT. Vendor V STANDARD zone MT."
          setup_api_calls:
            - *k_clock
            - *k_season
            - &k_season_fw
              call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { k_fw_id: $.data.id }
            - &k_zone_mt
              call: "POST /price-zones"
              payload: { zone_code: "MT", compare_at_multiplier: 2.0, markdown_cadence_weeks: 4, clearance_weeks: 12 }
              as: PricingAnalyst
            - &k_vendor
              call: "POST /vendors"
              payload: { legal_name: "Rocky Mountain Apparel Closeouts", vendor_code: "RMA", discretion_level: "STANDARD", ticket_discretion_required: false, default_zone_code: "MT", vendor_tier: "A" }
              as: PlanningLead
              captures: { k_vendor_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { lot_code: "PK-NOTARGET", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { err_no_target: $.data.error_id }
            - call: "POST /lots"
              payload: { lot_code: "IM-DEFAULT", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_im_id: $.data.id }
          assert:
            - "the PACKAWAY create without target_season_id fails with 400 ERR_INVALID_REQUEST"
            - "the IMMEDIATE create succeeds with 201 and Lot.${lot_im_id}.mixed_lot == false and status == OFFERED"
            - "Lot.${lot_im_id}.landed_cost_cents is null and deal_quality_score is null before evaluation"

      - name: vendor_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/vendors/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_3
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the vendor path produces the 404 ERR_NOT_FOUND from the existence check, not a 400 and not a generic server error."
        test_recipe:
          setup:
            - "Clock 2026-09-01. No vendor has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Buyer
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: price_zone_rejects_invalid_enum_and_clearance_bound
        claim_type: Type Constraints
        grounds:
          - entities.PriceZone.fields.clearance_weeks
          - entities.Store.fields.cluster_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "clearance_weeks equal to markdown_cadence_weeks violates the strict > constraint (400), and a Store created with an undeclared cluster_code enum member is likewise 400 — two different constraint classes."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Empty database."
          setup_api_calls:
            - *k_clock
            - *k_zone_mt
          trigger:
            - call: "POST /price-zones"
              payload: { zone_code: "NE", compare_at_multiplier: 1.5, markdown_cadence_weeks: 4, clearance_weeks: 4 }
              as: PricingAnalyst
              captures: { err_zone: $.data.error_id }
            - call: "POST /stores"
              payload: { store_code: "S-BAD", cluster_code: "DOWNTOWN_CORE", zone_code: "MT", storage_capacity_units: 100 }
              as: AllocationManager
              captures: { err_store: $.data.error_id }
          assert:
            - "the zone create fails with 400 ERR_INVALID_REQUEST (clearance_weeks must be > markdown_cadence_weeks, 4 == 4 violates it)"
            - "the store create fails with 400 ERR_INVALID_REQUEST (cluster_code not in {URBAN_PREMIUM, SUBURBAN_FAMILY, VALUE_RURAL})"
            - "GET /price-zones returns only the MT zone"

      - name: ticket_is_immutable_no_version_field_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Ticket
          - state_machines.Ticket.ACTIVE_to_VOIDED
        distinguishing_aspect: "Ticket has common_fields false: its response carries id and created_at but no version and no updated_at, and the only mutation path is the void action — no PATCH/PUT on /tickets exists."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. Lot IMMEDIATE asking 1000000 (landed 1150000) ACCEPTED with one line target_retail 10000."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "T-IMM", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_ti_id: $.data.id }
            - call: "POST /lots/${lot_ti_id}/lot-lines"
              payload: { style_code: "TI-1", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 25000, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_ti_id: $.data.id }
            - call: "POST /lots/${lot_ti_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_ti_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
          trigger:
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_ti_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_ti_id: $.data.id }
          assert:
            - "the response status is 201 and data carries id and created_at"
            - "the response carries no version field and no updated_at field (common_fields false)"
            - "Ticket.${ticket_ti_id}.ticket_retail_cents == 9999 (zone multiplier 1.0 then 9-ending adjustment) and status == ACTIVE"

      - name: lot_line_create_rejected_when_parent_lot_missing
        claim_type: Parent Relationships
        grounds:
          - entities.LotLine.fields.lot_id
          - endpoints.POST_/lots/{id}/lot-lines
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "The nested creation path resolves the parent lot first: an unknown lot id yields 404 ERR_NOT_FOUND from existence, before any body validation runs."
        test_recipe:
          setup:
            - "Clock 2026-09-01. No lots exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /lots/00000000-0000-4000-8000-000000000000/lot-lines"
              payload: { style_code: "X", department: "APPAREL", quantity: 1, unit_cost_cents: 100, compare_at_claim_cents: 200, target_retail_cents: 150 }
              as: Buyer
              captures: { err_par: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: lot_pass_from_offered_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Lot
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Pass is only defined from EVALUATED; attempting it from OFFERED returns 409 ERR_INVALID_STATE and leaves the lot untouched."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 DRAFT. Vendor STANDARD. Lot LP in OFFERED."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "LP", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lp_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_lp_id}/pass"
              payload: {}
              as: Buyer
              captures: { err_lp: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Lot.${lot_lp_id}.status remains OFFERED and version == 1"

      - name: lot_terminal_states_lock_down_all_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Lot
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A PASSED lot rejects evaluate, accept, pass, and cancel — every later trigger from a terminal state is 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 DRAFT. Vendor STANDARD. Lot LT evaluated then passed."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "LT", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CANCELLATION", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lt_id: $.data.id }
            - call: "POST /lots/${lot_lt_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_lt_id}/pass"
              payload: {}
              as: Buyer
          trigger:
            - call: "POST /lots/${lot_lt_id}/evaluate"
              payload: {}
              as: Buyer
              captures: { err_t1: $.data.error_id }
            - call: "POST /lots/${lot_lt_id}/cancel"
              payload: { cancel_reason: "BUYER_WITHDRAW" }
              as: Buyer
              captures: { err_t2: $.data.error_id }
          assert:
            - "evaluate from PASSED returns 409 ERR_INVALID_STATE"
            - "cancel from PASSED returns 409 ERR_INVALID_STATE"
            - "Lot.${lot_lt_id}.status remains PASSED"

      - name: packaway_hold_direct_liquidate_from_stale_stored
        claim_type: Valid Transition
        grounds:
          - state_machines.PackawayHold.STORED_to_LIQUIDATED
          - calculations.hold_age_bucket
        distinguishing_aspect: "A STORED hold aged 270+ days can be liquidated directly (bypassing the review cycle) and the cascade creates a DRAFT LiquidationOrder pinned to recovery_rate_pct 0.25."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 DRAFT, FW2027 DRAFT. Vendor STANDARD zone MT. PACKAWAY lot accepted (budget big enough); hold 1 pallet entered 2026-09-01; clock at 2027-05-29 (270 days)."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_season_fw
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "P-STALE", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${k_fw_id}" }
              as: Buyer
              captures: { lot_ps_id: $.data.id }
            - call: "POST /lots/${lot_ps_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_ps_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "W-ST", pallet_capacity: 50, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_st_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_ps_id}", warehouse_id: "${wh_st_id}", pallet_count: 1, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_st_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "STC2", cluster_code: "VALUE_RURAL", zone_code: "MT", storage_capacity_units: 500, clearance_outlet: true }
              as: AllocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-29T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_st_id}/liquidate"
              payload: {}
              as: InventoryPlanner
            - call: "GET /lots/${lot_ps_id}/liquidation-orders"
              payload: {}
              as: PlanningLead
              captures: { lo_st_id: "$.data[0].id" }
          assert:
            - "PackawayHold.${hold_st_id}.status == LIQUIDATED and review_count == 0 (direct path, no review)"
            - "PackawayHold.${hold_st_id}.accrued_holding_cost_cents == 45000 (270 days = 9 full months * 1 * 5000)"
            - "LiquidationOrder.${lo_st_id}.reason == PACKAWAY_STALE and recovery_rate_pct == 0.25 and status == DRAFT"

      - name: shrink_case_void_then_confirm_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ShrinkCase
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "VOIDED is terminal: confirming a voided case is 409 ERR_INVALID_STATE and no valuation or on-hand decrement fires."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Store ST-V exists. An OPEN untraceable shrink case against the store is voided."
          setup_api_calls:
            - *k_clock
            - *k_zone_mt
            - call: "POST /stores"
              payload: { store_code: "ST-V", cluster_code: "VALUE_RURAL", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_sv_id: $.data.id }
            - call: "POST /shrink-cases"
              payload: { store_id: "${store_sv_id}", shrink_type: "MIXED_LOT_OVERAGE", units_lost: 0, units_untraceable: 5 }
              as: ShrinkAuditor
              captures: { sc_sv_id: $.data.id }
            - call: "POST /shrink-cases/${sc_sv_id}/void"
              payload: {}
              as: ShrinkAuditor
          trigger:
            - call: "POST /shrink-cases/${sc_sv_id}/confirm"
              payload: {}
              as: ShrinkAuditor
              captures: { err_sc: $.data.error_id }
          assert:
            - "the confirm fails with 409 ERR_INVALID_STATE"
            - "ShrinkCase.${sc_sv_id}.status remains VOIDED"

      - name: liquidation_order_approve_then_cancel_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.LiquidationOrder
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Cancel is defined only from DRAFT; an APPROVED order rejects cancel with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Store ST-L exists. A DRAFT liquidation order created and approved."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_zone_mt
            - *k_vendor
            - call: "POST /stores"
              payload: { store_code: "ST-L", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_sl_id: $.data.id }
            - call: "POST /lots"
              payload: { lot_code: "LQ1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lq_id: $.data.id }
            - call: "POST /liquidation-orders"
              payload: { store_id: "${store_sl_id}", lot_id: "${lot_lq_id}", reason: "CLEARANCE_WEEKS_EXCEEDED", recovery_rate_pct: 0.5 }
              as: PlanningLead
              captures: { lo_lq_id: $.data.id }
            - call: "POST /liquidation-orders/${lo_lq_id}/approve"
              payload: {}
              as: PlanningLead
          trigger:
            - call: "POST /liquidation-orders/${lo_lq_id}/cancel"
              payload: {}
              as: PlanningLead
              captures: { err_lo: $.data.error_id }
          assert:
            - "the cancel fails with 409 ERR_INVALID_STATE"
            - "LiquidationOrder.${lo_lq_id}.status remains APPROVED"

      - name: markdown_sweep_skips_clearance_outlet_store_until_clearance_weeks
        claim_type: guarded transitions
        grounds:
          - state_machines.StoreSku
          - calculations.markdown_cadence_step
          - entities.Store.fields.clearance_outlet
        distinguishing_aspect: "A clearance_outlet store ignores the cadence ladder entirely: at 8 weeks on floor (two cadence boundaries) its SKU is still ON_FLOOR at the ticket price, and only the clearance-weeks threshold moves it."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. Lot accepted, line target_retail 10000, ticket MT, clearance store ST-C, StoreSku 20 units."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "CL1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_cl_id: $.data.id }
            - call: "POST /lots/${lot_cl_id}/lot-lines"
              payload: { style_code: "CL-1", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 25000, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_cl_id: $.data.id }
            - call: "POST /lots/${lot_cl_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_cl_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_cl_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_cl_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "ST-C", cluster_code: "VALUE_RURAL", zone_code: "MT", storage_capacity_units: 500, clearance_outlet: true }
              as: AllocationManager
              captures: { store_cc_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_cc_id}", lot_line_id: "${line_cl_id}", ticket_id: "${ticket_cl_id}", season_id: "${k_season_id}", units_on_hand: 20 }
              as: StoreOpsLead
              captures: { ss_cc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-27T00:00:00Z" }
              as: PlanningLead
            - call: "GET /store-skus/${ss_cc_id}"
              payload: {}
              as: StoreOpsLead
              captures: { cc_price: $.data.current_price_cents, cc_status: $.data.status }
          assert:
            - "StoreSku.${ss_cc_id}.weeks_on_floor == 8 and markdown_step == 0"
            - "StoreSku.${ss_cc_id}.current_price_cents == 9999 and status == ON_FLOOR (clearance outlets skip cadence)"
            - "GET /store-skus/${ss_cc_id}/markdown-events returns 0 rows"

      - name: allocation_plan_cancel_from_draft_and_approve_block_on_second_plan
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AllocationPlan
          - errors.ERR_LOT_ALREADY_ALLOCATED
        distinguishing_aspect: "With plan P1 APPROVED for a lot, approving a second plan P2 for the same lot fails with 422 ERR_LOT_ALREADY_ALLOCATED; P2 can still be cancelled from DRAFT."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. IMMEDIATE lot accepted (100 units); ticket MT; one SUBURBAN_FAMILY store. Plans P1, P2 created; P1 approved."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
