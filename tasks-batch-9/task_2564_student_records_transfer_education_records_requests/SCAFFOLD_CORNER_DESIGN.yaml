        excluded_because:
          difficulty_instance: cross_entity_state_dependency / destruction_blocked_by_open_records_request
          rationale: >
            The §1.8 cross_entity_state_dependency instance already aggregates the student's open
            RecordsRequest and LegalDemand rows behind ERR_DESTRUCTION_HOLD_ACTIVE and shows the same
            destruction succeeding once the obligation closes.

      - name: fee_custody_identity_after_payment_and_waiver
        claim_type: aggregate_validation
        grounds:
          - validations.priority_87_fee_custody_conserved
          - entities.InspectionRequest.fields.fee_outstanding_cents
        excluded_because:
          difficulty_instance: compensating_invariant / fee_custody_preserved_by_payment_and_waiver
          rationale: >
            The §1.8 compensating_invariant instance already drives the PAYMENT/WAIVER pair to the
            exact remaining cent, rejects the one-cent overpayment with ERR_FEE_OVERPAYMENT and
            re-checks the assessed == collected + waived + outstanding identity after every step.

  - section: endpoints
    instances:
      - name: inspection_room_crud_and_status_filtered_pagination
        claim_type: standard_crud
        grounds:
          - endpoints.POST_inspection_rooms
          - endpoints.GET_inspection_rooms
          - endpoints.GET_inspection_rooms_by_id
          - endpoints.PATCH_inspection_rooms
          - validations.priority_91_district_code_unique
          - errors.ERR_DUPLICATE_ROOM_CODE
        distinguishing_aspect: "Three rooms exercise the full room surface in one chain: creation defaults status to ACTIVE, the by-id read echoes the stored row, ?limit=2 reports total_count 3 / has_more true while offset=2 reports 1 row / has_more false, PATCH flips one room to CLOSED so ?status=ACTIVE drops to 2 rows, and a fourth POST reusing room_code ROOM-A is refused with ERR_DUPLICATE_ROOM_CODE / 409."
        test_recipe:
          setup:
            - "No rooms exist. Rooms ROOM-A (4 seats), ROOM-B (2) and ROOM-C (8) are registered in that order at the default clock."
          setup_api_calls:
            - call: "POST /records-office/inspection-rooms"
              payload: { room_code: "ROOM-A", site_name: "District Office", seats: 4 }
              as: SystemAdmin
              captures: { room_a: "$.data.id", room_a_created: "$.data.created_at" }
            - call: "POST /records-office/inspection-rooms"
              payload: { room_code: "ROOM-B", site_name: "North Annex", seats: 2 }
              as: SystemAdmin
              captures: { room_b: "$.data.id" }
            - call: "POST /records-office/inspection-rooms"
              payload: { room_code: "ROOM-C", site_name: "Records Center", seats: 8 }
              as: SystemAdmin
              captures: { room_c: "$.data.id" }
          trigger:
            - call: "GET /records-office/inspection-rooms/${room_a}"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/inspection-rooms?limit=2&offset=0"
              payload: {}
              as: RecordsClerk
            - call: "GET /records-office/inspection-rooms?limit=2&offset=2"
              payload: {}
              as: RecordsClerk
            - call: "PATCH /records-office/inspection-rooms/${room_b}"
              payload: { status: "CLOSED" }
              as: SystemAdmin
            - call: "GET /records-office/inspection-rooms?status=ACTIVE"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /records-office/inspection-rooms"
              payload: { room_code: "ROOM-A", site_name: "Duplicate Site", seats: 1 }
              as: SystemAdmin
          assert:
            - "each of the three setup calls returned HTTP 201 with status == \"ACTIVE\""
            - "trigger call 1 returns HTTP 200 with room_code == \"ROOM-A\" and seats == 4 and site_name == \"District Office\" and created_at == ${room_a_created}"
            - "trigger call 2 returns exactly 2 rows with meta/pagination total_count == 3, limit == 2, offset == 0, has_more == true"
            - "trigger call 3 returns exactly 1 row with total_count == 3, offset == 2, has_more == false"
            - "trigger call 4 returns HTTP 200 with InspectionRoom.${room_b}.status == \"CLOSED\""
            - "trigger call 5 returns exactly 2 rows whose ids are ${room_a} and ${room_c}"
            - "trigger call 6 returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_ROOM_CODE\""
            - "GET /records-office/inspection-rooms with no filter still returns total_count == 3"

