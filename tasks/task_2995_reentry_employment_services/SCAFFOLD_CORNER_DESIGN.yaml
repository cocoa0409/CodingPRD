          coach_user_id: coach-1
          starts_at: '2026-08-06T13:00:00.000Z'
          ends_at: '2026-08-06T15:00:00.000Z'
          seat_capacity: 3
        as: CaseManager
        as_user_id: cm-1
        captures:
          sa_id: $.data.id
      - call: POST /readiness-sessions
        payload:
          session_type: DISCLOSURE_COACHING
          coach_user_id: coach-1
          starts_at: '2026-08-05T13:00:00.000Z'
          ends_at: '2026-08-05T15:00:00.000Z'
          seat_capacity: 2
        as: CaseManager
