              captures: { entry_121_id: $.data.id }
          assert:
            - "CasefindingEntry.${entry_120_id}.referral_lag_days == 120"
            - "CasefindingEntry.${entry_120_id}.class_of_case_code == CLASS_20 and CasefindingEntry.${entry_120_id}.analytic_flag == true"
            - "CasefindingEntry.${entry_121_id}.referral_lag_days == 121"
            - "CasefindingEntry.${entry_121_id}.class_of_case_code == CLASS_31 and CasefindingEntry.${entry_121_id}.analytic_flag == false"
            - "CasefindingEntry.${entry_120_id}.suggested_reportability == REPORTABLE and CasefindingEntry.${entry_121_id}.suggested_reportability == REPORTABLE"
            - "CasefindingSource.${src_id}.entries_this_month == 2 and CasefindingSource.${src_id}.casefinding_completeness_pct == 5.0"

      - name: conference_credit_with_zero_cases_presented_fails_quorum_on_empty_set
        grounds:
          - calculations.conference_quorum
          - validations[priority=61]
          - errors[ERR_CONFERENCE_QUORUM_NOT_MET]
          - state_machines.ConferenceSession.SCHEDULED_to_HELD
          - entities.ConferenceSession.fields.prospective_case_ratio
          - endpoints[POST /cancer-registry/conference-sessions/{sessionId}/credit]
        distinguishing_aspect: |
          The EMPTY-SET boundary of the quorum rule: every required discipline attended for 45
          minutes (>= QUORUM_MIN_MINUTES 30) and the prospective ratio is defined as 0.0 rather
          than a division error, yet cases_presented_count == 0 makes quorum_met false, so credit
          is refused — a "all required disciplines present" reading would have credited it.
        test_recipe:
          setup:
            - "One program with annual_analytic_caseload 620, so required_sessions_12mo == 24."
            - "One session on 2026-08-05 13:00Z-14:00Z requires all five disciplines."
            - "Five attendances were recorded, each 45 minutes, one flagged is_required_coordinator."
            - "The clock was advanced to 2026-08-05T14:00:00Z and the session was held with cases_presented_count 0 and prospective_case_count 0."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Pinehurst Cancer Program", coc_program_id: "COC-14562", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-08-05T13:00:00Z", end_at: "2026-08-05T14:00:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "RADIATION_ONCOLOGY", "PATHOLOGY", "RADIOLOGY"] }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
              captures: { sess_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "dr-abbott", discipline: "SURGERY", attended_minutes: 45, is_required_coordinator: true }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "dr-bell", discipline: "MEDICAL_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "dr-choi", discipline: "RADIATION_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "dr-devi", discipline: "PATHOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "dr-ellis", discipline: "RADIOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/hold"
              payload: { cases_presented_count: 0, prospective_case_count: 0 }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
          trigger:
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/credit"
              payload: { disposition: "CREDIT", credit_note: "administrative session" }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
          assert:
            - "response error_id == ERR_CONFERENCE_QUORUM_NOT_MET with http status 409"
            - "ConferenceSession.${sess_id}.session_state == HELD and ConferenceSession.${sess_id}.credited_on == null"
            - "ConferenceSession.${sess_id}.quorum_met == false"
            - "ConferenceSession.${sess_id}.prospective_case_ratio == 0.0"
            - "ConferenceSession.${sess_id}.cases_presented_count == 0 and every one of the five attendances has attended_minutes == 45"
            - "CancerProgram.${prog_id}.credited_sessions_12mo == 0 and CancerProgram.${prog_id}.required_sessions_12mo == 24"
            - "CancerProgram.${prog_id}.conference_frequency_compliant == false"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_assignment_gated_by_critical_deficiency_state_on_another_entity
        grounds:
          - validations[priority=50]
          - calculations.registry_posture
          - state_machines.Deficiency.RESPONSE_SUBMITTED_to_RESOLVED
          - entities.CancerProgram.fields.open_critical_deficiency_count
          - errors[ERR_REGISTRY_FROZEN]
          - endpoints[POST /cancer-registry/cases/{caseId}/assign]
        distinguishing_aspect: |
          Whether a TumorCase may be assigned depends on the state of a Deficiency row two entities
          away (Deficiency -> CancerProgram.registry_posture -> TumorCase.assign): the identical
          call fails with ERR_REGISTRY_FROZEN while the CRITICAL deficiency is CITED and succeeds
          unchanged once the surveyor accepts the response and the deficiency becomes RESOLVED.
        test_recipe:
          setup:
            - "One program with a CTR abstractor and one IDENTIFIED case N1."
            - "A CRITICAL deficiency cited on 2026-08-01 (response_due_date 2026-08-31) has forced registry_posture FROZEN."
            - "The clock stays at 2026-08-01T00:00:00Z so the response window is open."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Westbrook Cancer Program", coc_program_id: "COC-14563", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-4001", accession_date: "2026-08-05", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-06-02", first_contact_date: "2026-06-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_n_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_n_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_n_id: $.data.created_case_id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-5.4", severity: "CRITICAL", cited_on: "2026-08-01", evidence_reference: "survey-finding-5.4" }
              as: CoCSurveyor
              as_user_id: "surv-nakamura"
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/cases/${case_n_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "corrective action plan filed with evidence", evidence_reference: "cap-5.4" }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "plan accepted" }
              as: CoCSurveyor
              as_user_id: "surv-nakamura"
            - call: "POST /cancer-registry/cases/${case_n_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
          assert:
            - "the first assign returns error_id == ERR_REGISTRY_FROZEN with http status 409"
            - "Deficiency.${def_id}.deficiency_state == RESOLVED after the ACCEPTED review"
            - "CancerProgram.${prog_id}.open_critical_deficiency_count == 0 and CancerProgram.${prog_id}.registry_posture == OPEN"
            - "the second assign returns http status 200 and TumorCase.${case_n_id}.case_state == ASSIGNED"
            - "TumorCase.${case_n_id}.assigned_abstractor_id == ${abs_a_id}"
            - "Abstractor.${abs_a_id}.assigned_open_case_count == 1"

      - name: transmit_requires_every_item_case_completed_after_audit_regression
        grounds:
          - validations[priority=40]
          - errors[ERR_CASE_NOT_COMPLETED]
          - state_machines.TumorCase.COMPLETED_to_REWORK_PENDING
          - entities.RegistrySubmission.fields.total_case_count
          - endpoints[POST /cancer-registry/submissions/{submissionId}/transmit]
        distinguishing_aspect: |
          A different entity pair and direction from the assign gate: the RegistrySubmission
          transmit is validated against the case_state of every TumorCase reachable through its
          SubmissionItem rows, so an audit-driven COMPLETED -> REWORK_PENDING regression on one
          member case blocks the batch with ERR_CASE_NOT_COMPLETED while the submission itself is
          still a perfectly valid DRAFT.
        test_recipe:
          setup:
            - "One program with a CTR abstractor (Dana) and a QA reviewer/auditor (Priya); case Q was COMPLETED on 2026-08-01."
            - "A DRAFT submission for period 2026-01-01..2026-06-30 (deadline 2026-12-31) carries case Q as its only item, so the case dimension reads PENDING_SUBMISSION."
            - "A CRITICAL_FAIL audit on Q's abstraction then drove case_state back to REWORK_PENDING; the registry posture is still OPEN (1 open case, none overdue)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Halstead Cancer Program", coc_program_id: "COC-14564", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-4101", accession_date: "2026-08-05", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-02", first_contact_date: "2026-03-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_q_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_q_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_q_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_q_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_q_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_q_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-03-20", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-01" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_q_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_q_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_q_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-06-30", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id, sub_v1: $.data.version }
            - call: "POST /cancer-registry/submissions/${sub_id}/items"
              payload: { case_id: "${case_q_id}", expected_submission_version: "${sub_v1}" }
              as: RegistryManager
              captures: { item_q_id: $.data.id }
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_q_id}", auditor_id: "${abs_q_id}", audit_type: "PRE_SURVEY", window_start: "2026-07-25", window_end: "2026-08-05" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_q_id: $.data.id }
            - call: "POST /cancer-registry/qa-audits/${audit_q_id}/score"
              payload: { audited_field_count: 40, minor_discrepancy_count: 0, major_discrepancy_count: 0, critical_discrepancy_count: 1 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          trigger:
            - call: "POST /cancer-registry/submissions/${sub_id}/transmit"
              payload: {}
              as: RegistryManager
          assert:
            - "response error_id == ERR_CASE_NOT_COMPLETED with http status 409"
            - "RegistrySubmission.${sub_id}.submission_state == DRAFT and RegistrySubmission.${sub_id}.transmitted_at == null"
            - "RegistrySubmission.${sub_id}.total_case_count == 1"
            - "TumorCase.${case_q_id}.case_state == REWORK_PENDING and TumorCase.${case_q_id}.submission_state == PENDING_SUBMISSION"
            - "CancerProgram.${prog_id}.registry_posture == OPEN (so the failure is the case gate, not ERR_REGISTRY_FROZEN)"
            - "SubmissionItem.${item_q_id}.edit_status == PENDING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: conference_back_to_back_session_violates_thirty_minute_changeover_buffer
        grounds:
          - calculations.conference_slot_overlap
          - validations[priority=55]
          - errors[ERR_CONFERENCE_SLOT_CONFLICT]
          - endpoints[POST /cancer-registry/conference-sessions]
        distinguishing_aspect: |
          HALF-OPEN intervals plus a 30-minute buffer on a per-program calendar: a session starting
          exactly when the previous one ends (14:00Z after a 13:00-14:00Z session) is REJECTED
          because the buffer has not elapsed, while one starting at 14:30Z — exactly the buffered
          edge — is accepted; a plain half-open overlap test would have accepted both.
        test_recipe:
          setup:
            - "One program with one SCHEDULED session on 2026-08-05 from 13:00Z to 14:00Z."
            - "The clock stays at its 2026-08-01T00:00:00Z default, so both candidate sessions are in the future."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Kingsway Cancer Program", coc_program_id: "COC-14565", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-08-05T13:00:00Z", end_at: "2026-08-05T14:00:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "PATHOLOGY"] }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
              captures: { sess_a_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-08-05T14:00:00Z", end_at: "2026-08-05T15:00:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "PATHOLOGY"] }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-08-05T14:30:00Z", end_at: "2026-08-05T15:30:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "PATHOLOGY"] }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
              captures: { sess_c_id: $.data.id }
          assert:
            - "the 14:00Z candidate returns error_id == ERR_CONFERENCE_SLOT_CONFLICT with http status 409"
            - "the 14:30Z candidate returns http status 201 and ConferenceSession.${sess_c_id}.session_state == SCHEDULED"
            - "ConferenceSession.${sess_a_id}.session_state == SCHEDULED and its start_at/end_at are unchanged"
            - "exactly 2 ConferenceSession rows exist for CancerProgram.${prog_id}"

      - name: third_overlapping_auditor_window_exceeds_capacity_until_one_is_voided
        grounds:
          - calculations.auditor_window_capacity
          - validations[priority=55]
          - errors[ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED]
          - state_machines.QaAudit.OPEN_to_VOIDED
          - endpoints[POST /cancer-registry/qa-audits]
        distinguishing_aspect: |
          CLOSED intervals with an AGGREGATE capacity of 2 — the opposite convention from the
          conference calendar: two overlapping windows for one auditor are legal, the third is
          rejected even though it only TOUCHES the first at 2026-07-31, and voiding one window
          releases the slot so the identical third request then succeeds.
        test_recipe:
          setup:
            - "One program with an authoring abstractor (Dana) and an auditor (Priya); Dana's abstraction is APPROVED."
            - "Priya already holds two non-VOIDED audits on that abstraction: windows 2026-07-01..2026-07-31 and 2026-07-15..2026-08-15, both OPEN."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Silverton Cancer Program", coc_program_id: "COC-14566", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
