                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Short Cover Mutual"
                policy_number: "P-SHORT"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2026-08-31"
              as: FleetAdmin
              captures: { cert_short_id: "$.data.id" }
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 1
