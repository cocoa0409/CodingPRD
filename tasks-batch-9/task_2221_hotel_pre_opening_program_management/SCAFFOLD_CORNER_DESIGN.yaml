      - name: cancelled_ose_order_cannot_be_received
        claim_type: terminal_state_lockdown
        grounds:
          - "§1.2 OseOrder declares terminal_states STORED and CANCELLED and lists no transition out of CANCELLED; §1.6 declares ERR_INVALID_OSE_ORDER_STATE (409)."
        distinguishing_aspect: "CANCELLED is a terminal state with no outgoing transition, so /receive on a cancelled order returns ERR_INVALID_OSE_ORDER_STATE at 409 and the budget line's restored totals do not move again."
