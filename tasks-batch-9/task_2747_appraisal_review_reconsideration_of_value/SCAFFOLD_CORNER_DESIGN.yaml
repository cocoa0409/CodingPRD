              payload: { expected_appraisal_version: "${ap1_v1}" }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
            - call: "POST /appraisal-desk/rov-requests"
              payload: { loan_file_id: "${lf1_id}", appraisal_id: "${ap1_id}", borrower_statement: "Two closer sales support a materially higher opinion.", requested_value_cents: 49000000 }
              as: Borrower
              as_user_id: "${lf1_id}"
