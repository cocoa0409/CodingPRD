            - "Program year 2026 with default_contribution_rate_bp 500"
            - "Fund menu: TDF2040 (TARGET_DATE, target_year 2040, expense_ratio_bp 25, default_eligible true); TDF2045 (TARGET_DATE, target_year 2045, expense_ratio_bp 40, default_eligible FALSE); MMKT01 (CAPITAL_PRESERVATION, expense_ratio_bp 20, default_eligible true); STABLE1 (CAPITAL_PRESERVATION, expense_ratio_bp 15, default_eligible FALSE)"
            - "Employer Delta Fabrication registered"
            - "Rosa Lim born 1980-05-10 so her retirement_year is 1980 + 65 = 2045; Tomas Vela born 1975-11-02 so his retirement_year is 1975 + 65 = 2040"
            - "Both are enrolled and NOTIFIED; clock advanced to 2026-02-01, past the 2026-01-31 opt-out deadline, and neither has opted out"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2040", name: "Target Retirement 2040", category: "TARGET_DATE", target_year: 2040, expense_ratio_bp: 25, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 40, default_eligible: false }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "STABLE1", name: "Stable Value Trust", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 15, default_eligible: false }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "Tomas Vela", date_of_birth: "1975-11-02", email: "tomas.vela@x.example", ssn_last4: "7788", state_resident: true }
              as: ProgramAdministrator
              captures: { par3_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par3_id}", hire_date: "2026-01-05", annual_compensation_cents: 8400000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response status == 200"
            - "response data.activated_count == 2"
            - "response data.accounts_opened_count == 2"
            - "response data.skipped_count == 0"
            - "GET /participant-accounts with participant_id ${par_id} returns total_count == 1"
            - "GET /participant-accounts with participant_id ${par3_id} returns total_count == 1"
            - "Rosa's ACTIVE InvestmentElection has exactly one allocation entry with fund_code MMKT01 and allocation_bp 10000"
            - "Rosa's ACTIVE InvestmentElection has selection_basis == CAPITAL_PRESERVATION_FALLBACK"
            - "Rosa's ACTIVE InvestmentElection has source == SYSTEM_DEFAULT"
            - "Rosa's ACTIVE InvestmentElection has no allocation entry with fund_code TDF2040"
            - "Rosa's ACTIVE InvestmentElection has no allocation entry with fund_code STABLE1"
            - "Tomas's ACTIVE InvestmentElection has exactly one allocation entry with fund_code TDF2040 and allocation_bp 10000"
            - "Tomas's ACTIVE InvestmentElection has selection_basis == TARGET_DATE_GLIDE_PATH"
            - "Tomas's ACTIVE InvestmentElection has source == SYSTEM_DEFAULT"

  # ===========================================================================
  # RULE 7 / 9 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_creation_gated_on_employer_registration_state
        grounds:
          - validations.v_employer_not_registered
          - errors.ERR_EMPLOYER_NOT_REGISTERED
          - state_machines.Employer.registration_status.PENDING_REGISTRATION_to_REGISTERED
          - entities.Enrollment.fields.employer_id
          - entities.Enrollment.fields.enrollment_status
        distinguishing_aspect: |
          The gate lives on the PARENT of the entity being created and is a registration-lifecycle
          gate: an Enrollment cannot exist under an employer still in PENDING_REGISTRATION, and the
          same request that fails with 409 succeeds unchanged once the employer registers, proving
          the block is state-derived rather than payload-derived. Both the Participant and the
          ProgramYear are already valid, so no other validation can account for the rejection.
        test_recipe:
          setup:
            - "Program year 2026 with default_contribution_rate_bp 500; fund menu holds TDF2045 and MMKT01"
            - "Employer Delta Fabrication created with 60 employees, so wave_tier WAVE_2 and registration_status PENDING_REGISTRATION; the registration action has NOT been called and non_fiduciary_acknowledged is false"
            - "Participant Rosa Lim exists and is a state resident"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
          trigger:
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: ProgramAdministrator
              captures: { enr_ok_id: "$.data.id" }
          assert:
            - "the first trigger call returns status == 409 with data.error_id == ERR_EMPLOYER_NOT_REGISTERED"
            - "immediately after the first trigger call, GET /enrollments with employer_id ${emp_id} returns total_count == 0"
            - "the second trigger call returns status == 200 and Employer.${emp_id}.registration_status == REGISTERED"
            - "Employer.${emp_id}.non_fiduciary_acknowledged == true"
            - "the third trigger call returns status == 201"
            - "Enrollment.${enr_ok_id}.enrollment_status == NOTIFIED"
            - "Enrollment.${enr_ok_id}.employer_id == ${emp_id}"
            - "Enrollment.${enr_ok_id}.contribution_rate_bp == 500"
            - "Enrollment.${enr_ok_id}.rate_source == DEFAULT"
            - "Enrollment.${enr_ok_id}.opt_out_deadline == 2026-01-31"
            - "GET /enrollments with employer_id ${emp_id} returns total_count == 1"

      - name: account_closure_gated_on_in_flight_portability_transfer_state
        grounds:
          - validations.v_account_restricted
          - errors.ERR_ACCOUNT_RESTRICTED
          - calculations.account_posture_derivation
          - state_machines.PortabilityTransfer.REQUESTED_to_RETURNED
          - state_machines.ParticipantAccount.account_status.OPEN_to_CLOSURE_PENDING
          - entities.PortabilityTransfer.fields.in_transit_cents
        distinguishing_aspect: |
          The gate is derived from the state of a SIBLING child rather than a parent: the account's
          posture is RESTRICTED purely because a PortabilityTransfer sits in REQUESTED with
          100000 cents in transit, and the identical closure request flips from 409 to 201 the
          moment that transfer is returned. Unlike the registration-gated instance the blocking
