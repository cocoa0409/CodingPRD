        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=10]
          - entities.ConveyorSegment.parent
        distinguishing_aspect: |
          Uniqueness of segment_code is scoped to the project, so reusing IB-01 on a second project returns 201
          with a distinct id rather than ERR_DUPLICATE_SEGMENT_CODE.
        test_recipe:
