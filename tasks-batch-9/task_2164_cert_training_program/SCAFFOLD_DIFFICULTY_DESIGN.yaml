      - name: enroll_then_withdraw_conserves_the_cohort_seat_ledger
        grounds:
          - state_machines.Trainee.enrollment_status.APPLIED_to_ENROLLED
          - state_machines.Trainee.enrollment_status.ENROLLED_to_WITHDRAWN
          - entities.Cohort.fields.seats_confirmed
          - entities.Program.fields.active_member_count
        distinguishing_aspect: |
          Conserved quantity #2 is a HEADCOUNT rather than money: Cohort.seats_confirmed ==
          COUNT(Trainee where cohort_id matches AND enrollment_status IN {ENROLLED, GRADUATED}) and
          Program.active_member_count is its program-wide twin. Enrolling then withdrawing the same
          trainee must return both counters to their pre-enrollment values while
          Cohort.next_waitlist_position, a monotone counter, is deliberately NOT conserved.
        test_recipe:
          setup:
            - "Cohort C-2026A RECRUITING with seat_capacity 2, seats_confirmed 0, seats_waitlisted 0, next_waitlist_position 1"
            - "Program.active_member_count is 0"
            - "Trainee Tara created in APPLIED with no equipment and no roster commitments"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
