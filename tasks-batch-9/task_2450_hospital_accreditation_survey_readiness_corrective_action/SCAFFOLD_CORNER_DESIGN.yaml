            - "${s11_count} == 0, ${s11_score} == 57.00 and ${s11_band} == NOT_READY (base 78.00 minus 21)"

      - name: chapter_readiness_flag_derives_from_two_flagged_ppr_assessments
        claim_type: bubble_up
        grounds:
          - calculations.ppr_chapter_assessment
          - entities.Chapter.fields.ppr_escalation_count
          - entities.Chapter.fields.readiness_flag
          - state_machines.PprSelfAssessment.SUBMITTED_to_RETURNED_FOR_REASSESSMENT
        distinguishing_aspect: "Chapter.readiness_flag is derived, not set: the first flagged PPR leaves it ON_TRACK at ppr_escalation_count 1 and the second flips it to AT_RISK at 2, returning BOTH SUBMITTED assessments for reassessment."
        test_recipe:
          setup:
            - "Chapter PC with exactly one standard, MAPPED via owner-1 and holding no validated evidence, so verified_score is 50.00."
            - "Clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { s12_ch: $.data.id }
            - call: "POST /accreditation/chapters/${s12_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s12_s1: $.data.id }
            - call: "POST /accreditation/standards/${s12_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/chapters/${s12_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H1", self_ratings: [{ standard_id: "${s12_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { s12_p1: $.data.id, s12_p1_self: $.data.self_score, s12_p1_ver: $.data.verified_score, s12_p1_gap: $.data.gap, s12_p1_flag: $.data.flagged_overstatement }
            - call: "GET /accreditation/chapters/${s12_ch}"
              as: AccreditationDirector
              captures: { s12_esc1: $.data.ppr_escalation_count, s12_flag1: $.data.readiness_flag }
            - call: "POST /accreditation/chapters/${s12_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H2", self_ratings: [{ standard_id: "${s12_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { s12_p2: $.data.id, s12_p2_state: $.data.state }
            - call: "GET /accreditation/chapters/${s12_ch}"
              as: AccreditationDirector
              captures: { s12_esc2: $.data.ppr_escalation_count, s12_flag2: $.data.readiness_flag }
          assert:
            - "${s12_p1_self} == 100.00, ${s12_p1_ver} == 50.00, ${s12_p1_gap} == 50.00, ${s12_p1_flag} == true"
            - "${s12_esc1} == 1 and ${s12_flag1} == ON_TRACK (1 is below CHAPTER_AT_RISK_PPR_COUNT 2)"
            - "${s12_esc2} == 2 and ${s12_flag2} == AT_RISK"
            - "PprSelfAssessment.${s12_p1}.state == RETURNED_FOR_REASSESSMENT with requires_reassessment == true"
            - "PprSelfAssessment.${s12_p2}.state == RETURNED_FOR_REASSESSMENT with requires_reassessment == true"

      - name: ppr_revise_clears_reassessment_then_attest_reaches_attested
        claim_type: valid_transition
        grounds:
          - state_machines.PprSelfAssessment.RETURNED_FOR_REASSESSMENT_to_SUBMITTED
          - state_machines.PprSelfAssessment.SUBMITTED_to_ATTESTED
          - endpoints[POST /accreditation/ppr-self-assessments/{id}/revise]
          - calculations.ppr_chapter_assessment
        distinguishing_aspect: "Revising a returned PPR with an honest NON_COMPLIANT rating recomputes self_score to 0.00 and gap to -50.00, clears requires_reassessment, and only then does attest reach the terminal ATTESTED state."
        test_recipe:
          setup:
            - "Chapter PC as in chapter_readiness_flag_derives_from_two_flagged_ppr_assessments, with PPR 2026-H2 in state RETURNED_FOR_REASSESSMENT."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { s13_ch: $.data.id }
            - call: "POST /accreditation/chapters/${s13_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s13_s1: $.data.id }
            - call: "POST /accreditation/standards/${s13_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/chapters/${s13_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H1", self_ratings: [{ standard_id: "${s13_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { s13_p1: $.data.id }
            - call: "POST /accreditation/chapters/${s13_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H2", self_ratings: [{ standard_id: "${s13_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { s13_p2: $.data.id, s13_p2_state1: $.data.state }
          trigger:
            - call: "POST /accreditation/ppr-self-assessments/${s13_p2}/revise"
              payload: { self_ratings: [{ standard_id: "${s13_s1}", rating: "NON_COMPLIANT" }] }
              as: AccreditationDirector
              captures: { s13_p2_state2: $.data.state, s13_p2_self: $.data.self_score, s13_p2_gap: $.data.gap, s13_p2_req: $.data.requires_reassessment }
            - call: "POST /accreditation/ppr-self-assessments/${s13_p2}/attest"
              payload: { attestation_note: "Reassessment reflects the evidence" }
              as: AccreditationDirector
              as_user_id: "dir-1"
              captures: { s13_p2_state3: $.data.state, s13_p2_by: $.data.attested_by_user_id }
          assert:
            - "${s13_p2_state1} == RETURNED_FOR_REASSESSMENT before the trigger"
            - "${s13_p2_state2} == SUBMITTED, ${s13_p2_self} == 0.00, ${s13_p2_gap} == -50.00, ${s13_p2_req} == false"
            - "Chapter.${s13_ch}.ppr_escalation_count stays 2 (the revised gap is below OVERSTATEMENT_THRESHOLD, so nothing is added)"
            - "${s13_p2_state3} == ATTESTED and ${s13_p2_by} == dir-1"
            - "PprSelfAssessment.${s13_p1}.state == RETURNED_FOR_REASSESSMENT is unaffected by the sibling revision"

      - name: ppr_attest_twice_returns_already_attested
        claim_type: idempotency
        grounds:
          - validations[priority=21]
          - errors[ERR_PPR_ALREADY_ATTESTED]
          - state_machines.PprSelfAssessment.SUBMITTED_to_ATTESTED
        distinguishing_aspect: "ATTESTED is terminal and attest is not idempotent: the second attest on the same assessment returns ERR_PPR_ALREADY_ATTESTED with HTTP 409."
        test_recipe:
          setup:
            - "Chapter EM with one standard MAPPED via owner-1 and one PPR rated PARTIAL, giving self_score 50.00 == verified_score 50.00 (gap 0.00, not flagged)."
          setup_api_calls:
