            - "second dispute attempt: Dispute.${dsp}.status == FILED (201 created)"
            - "ScreeningReport.${rp}.status == UNDER_DISPUTE"
            - "ScreeningRecord.${r1}.status == DISPUTED"
            - "ScreeningReport.${rp}.included_record_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: jurisdiction_rule_half_open_window_overlap
        grounds:
          - entities.JurisdictionRule.fields.effective_from
          - entities.JurisdictionRule.fields.effective_to
          - errors[ERR_RULE_WINDOW_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          Half-open interval semantics on JurisdictionRule: a second CA rule whose effective_from equals
          the first rule's effective_to is ADJACENT ([from, to) excludes the endpoint) and accepted, while
          one starting a day earlier overlaps and is rejected with ERR_RULE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "One CA jurisdiction rule with half-open window [2026-01-01T00:00:00Z, 2026-06-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/jurisdiction-rules"
              payload: { state_code: "CA", criminal_lookback_years: 7, eviction_lookback_years: 7, source_of_income_protected: false, portable_report_acceptance_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ComplianceAdmin
              captures: { rule1: "$.data.id" }
          trigger:
            - call: "POST /api/jurisdiction-rules"
              payload: { state_code: "CA", criminal_lookback_years: 5, eviction_lookback_years: 5, source_of_income_protected: true, portable_report_acceptance_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ComplianceAdmin
              captures: { rule2: "$.data.id" }
            - call: "POST /api/jurisdiction-rules"
              payload: { state_code: "CA", criminal_lookback_years: 3, eviction_lookback_years: 3, source_of_income_protected: false, portable_report_acceptance_required: false, effective_from: "2026-05-31T00:00:00Z" }
              as: ComplianceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "adjacent rule accepted (201): JurisdictionRule.${rule2}.effective_from == 2026-06-01T00:00:00Z — half-open adjacency is allowed"
            - "overlapping rule rejected: error_id == ERR_RULE_WINDOW_OVERLAP (http 409); captured ${err}"

      - name: criteria_closed_window_touching_endpoints_conflict
        grounds:
          - entities.ScreeningCriteria.fields.effective_from
          - entities.ScreeningCriteria.fields.effective_to
          - errors[ERR_CRITERIA_WINDOW_OVERLAP]
          - concurrency_rules[criteria-publish-stale-landlord]
        distinguishing_aspect: |
          Closed-interval semantics on a different resource (ScreeningCriteria): two PUBLISHED criteria of
          the same landlord whose windows merely TOUCH (first.effective_to == second.effective_from)
          conflict because BOTH endpoints are inclusive — unlike the half-open jurisdiction adjacency,
          which is accepted. A disjoint window publishes cleanly.
        test_recipe:
          setup:
            - "Landlord ll (version captured); criteria C1 [2026-01-01, 2026-06-30] created and PUBLISHED (landlord.version advanced to 2); landlord version re-read as ll_v2"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Win", contact_email: "lwin@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "C1", disclosure_summary: "H1 criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { c1: "$.data.id" }
            - { call: "POST /api/criteria/${c1}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "GET /api/landlords/${ll}"
              payload: {}
              as: ComplianceAdmin
              captures: { ll_v2: "$.data.version" }
          trigger:
            - call: "POST /api/criteria"
              payload: { name: "C2", disclosure_summary: "Touching criteria", min_credit_score: 700, income_multiplier: 3.5, guarantor_policy: "INDEPENDENT_ONLY", guarantor_income_multiplier: 4.0, accepts_portable_reports: false, accepts_voucher_income: true, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { c2: "$.data.id" }
            - call: "POST /api/criteria/${c2}/publish"
              payload: { expected_landlord_version: "${ll_v2}" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { err: "$.data.error_id" }
            - call: "POST /api/criteria"
              payload: { name: "C3", disclosure_summary: "H2 criteria", min_credit_score: 700, income_multiplier: 3.5, guarantor_policy: "INDEPENDENT_ONLY", guarantor_income_multiplier: 4.0, accepts_portable_reports: false, accepts_voucher_income: true, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { c3: "$.data.id" }
            - call: "POST /api/criteria/${c3}/publish"
              payload: { expected_landlord_version: "${ll_v2}" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { c3_status: "$.data.status" }
          assert:
            - "C2 publish rejected: error_id == ERR_CRITERIA_WINDOW_OVERLAP (http 409) — closed windows touching at 2026-06-30 conflict; captured ${err}; the OCC check passed first because ${ll_v2} was current, proving the rejection is the overlap, not staleness"
            - "C2 remains DRAFT (failed publish does not mutate)"
            - "C3 publish succeeds (disjoint closed window): captured ${c3_status} == PUBLISHED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: dispute_uphold_restores_included_record_count
        grounds:
          - state_machines.ScreeningReport.DELIVERED_to_UNDER_DISPUTE
          - state_machines.ScreeningReport.UNDER_DISPUTE_to_RE_DELIVERED
          - entities.ScreeningReport.fields.included_record_count
        distinguishing_aspect: |
          Conserved quantity = report included_record_count (a record count): filing a dispute moves the
          two records INCLUDED -> DISPUTED (count 2 -> 0), and the compensating resolve(UPHELD) moves them
          DISPUTED -> INCLUDED, restoring the invariant included_record_count == count(INCLUDED records)
          to exactly its pre-dispute value 2 with zero drift.
        test_recipe:
          setup:
            - "CA landlord, published criteria; application (income 600000, credit 700) scored and report DELIVERED with two INCLUDED eviction records; pre-dispute included_record_count captured as 2; dispute on both records FILED and UNDER_REINVESTIGATION (reinvestigator scr-2)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /api/jurisdiction-rules", payload: { state_code: "CA", criminal_lookback_years: 7, eviction_lookback_years: 7, source_of_income_protected: false, portable_report_acceptance_required: true, effective_from: "2020-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Inv", contact_email: "linv@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Inv", dob: "1990-01-01T00:00:00Z", email: "ainv@x.com", ssn_last4: "1111", residence_state: "CA" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "CA", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applications/${app}/record-searches"
              payload: { credit_score: 700, records: [ { record_type: "EVICTION", jurisdiction_state_code: "CA", record_date: "2024-03-01T00:00:00Z", description: "eviction A" }, { record_type: "EVICTION", jurisdiction_state_code: "CA", record_date: "2024-04-01T00:00:00Z", description: "eviction B" } ] }
              as: Screener
              as_user_id: scr-1
              captures: { rp: "$.data.id" }
            - call: "GET /api/records?report_id=${rp}"
              payload: {}
              as: Screener
              captures: { r1: "$.data[0].id", r2: "$.data[1].id" }
            - call: "POST /api/applications/${app}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { iv: "$.data.id" }
            - { call: "POST /api/income-verifications/${iv}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 600000 }, as: Screener }
            - { call: "POST /api/applications/${app}/score", payload: {}, as: Screener }
            - { call: "POST /api/reports/${rp}/deliver", payload: {}, as: Screener }
            - call: "GET /api/reports/${rp}"
              payload: {}
              as: Screener
              captures: { pre_count: "$.data.included_record_count" }
            - call: "POST /api/reports/${rp}/disputes"
              payload: { disputed_record_ids: ["${r1}", "${r2}"], reason_text: "both records are inaccurate" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { d1: "$.data.id" }
            - { call: "POST /api/disputes/${d1}/start-reinvestigation", payload: {}, as: Screener, as_user_id: scr-2 }
          trigger:
            - { call: "POST /api/disputes/${d1}/resolve", payload: { outcome: "UPHELD", resolution_notes: "records verified accurate" }, as: Screener, as_user_id: scr-2 }
          assert:
            - "pre-dispute included_record_count was 2 (captured ${pre_count} == 2)"
            - "after resolve(UPHELD): ScreeningReport.${rp}.included_record_count == 2 — the forward + compensating pair leaves the conserved count unchanged"
            - "ScreeningRecord.${r1}.status == INCLUDED and ScreeningRecord.${r2}.status == INCLUDED"
            - "ScreeningReport.${rp}.status == RE_DELIVERED and last_delivered_at == 2026-08-01T00:00:00Z (refreshed)"

      - name: withdraw_refund_restores_fee_balance
        grounds:
          - calculations.screening_fee
          - state_machines.ScreeningApplication.status.SCREENING_to_WITHDRAWN
          - entities.Landlord.fields.fee_balance_cents
          - entities.ScreeningApplication.fields.fee_charged_cents
        distinguishing_aspect: |
          Conserved quantity = Landlord.fee_balance_cents (money — a different quantity than the record
          count instance): record-searches charges 3439 (balance 0 -> 3439) and the compensating
          withdrawal before delivery refunds exactly 3439, restoring the balance to 0 with zero drift;
          the historical fee_charged_cents on the application is retained for audit.
        test_recipe:
          setup:
            - "Landlord with published criteria; TX application (no jurisdiction rule rows -> default lookbacks, criminal search allowed) in SCREENING after record-searches charged fee 3439; landlord fee_balance_cents == 3439"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Ref", contact_email: "lref@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Ref", dob: "1990-01-01T00:00:00Z", email: "aref@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applications/${app}/record-searches"
              payload: { credit_score: 700, records: [] }
              as: Screener
              captures: { rp: "$.data.id" }
            - call: "GET /api/landlords/${ll}"
              payload: {}
              as: ComplianceAdmin
              captures: { bal_charged: "$.data.fee_balance_cents" }
          trigger:
            - { call: "POST /api/applications/${app}/withdraw", payload: {}, as: Landlord, as_user_id: "${ll}" }
          assert:
            - "after charge: captured ${bal_charged} == 3439"
            - "after withdraw: Landlord.${ll}.fee_balance_cents == 0 — charge + compensating refund nets to zero"
            - "ScreeningApplication.${app}.status == WITHDRAWN and fee_charged_cents == 3439 (historical charge retained)"
            - "ScreeningReport.${rp}.status == VOIDED (undelivered DRAFT report voided)"
