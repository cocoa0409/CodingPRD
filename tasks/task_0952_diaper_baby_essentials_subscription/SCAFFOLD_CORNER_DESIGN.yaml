  # =======================================================================
  # Cross-cutting complexity layers
  # =======================================================================
  - section: cross_cutting_layers
    instances:
      - name: corner_occ_stale_subscription_version_rejects_resize
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[resize-create-stale-subscription]", "validations[priority=18]", "errors[ERR_STALE_SUBSCRIPTION_VERSION]"]
        distinguishing_aspect: "A resize carrying the subscription version observed at CREATION time — before activation bumped it — is rejected with ERR_STALE_SUBSCRIPTION_VERSION (412), and no ResizeEvent row is written."
        test_recipe:
          setup: ["One subscription created (version captured at that moment) and then activated, which advances Subscription.version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "occ1@example.com", full_name: "OCC One", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, sub_v_at_create: $.data.version }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_v_after_activate: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/resizes"
              payload: { target_stage: "S3", expected_subscription_version: "${sub_v_at_create}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${sub_v_after_activate} > ${sub_v_at_create}"
            - "${err} == ERR_STALE_SUBSCRIPTION_VERSION"
            - "HTTP status is 412"
            - "Child.${child_id}.stage == S2"
            - "no ResizeEvent row exists with subscription_id == ${sub_id}"

