            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
            - *k_lic_m
            - *k_lic_m_grant
            - *k_slot
            - *k_reserve
            - *k_confirm_slot
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rideshare/missions/${m_id}/launch"
              payload: {}
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_LAUNCH_WINDOW_VIOLATION"
            - "Mission.${m_id}.status remains RANGE_SCHEDULED and RangeSlot.${s1}.status remains CONFIRMED"
            - "GET /rideshare/separation-events?mission_id=${m_id} returns 0 rows (no sequence computed)"

      - name: assignment_constraint_violations_orbit_interface_occupancy
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=10]
          - errors.ERR_ORBIT_MISMATCH
          - errors.ERR_INTERFACE_INCOMPATIBLE
          - errors.ERR_PORT_OCCUPIED
        distinguishing_aspect: "The three business_constraint gates fire independently: orbit mismatch (SSO payload vs LEO mission), interface mismatch (CUBESAT payload vs RING-only port), and port occupancy (a second live assignment on DSP-A) each return their own error and persist nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. LEO mission [2026-10-10, 2026-10-20] with ports P-A (stack 4, max 150, RING_15+RING_24) and P-B (stack 3, max 100, CUBESAT). Contract signed with four LEO/SSO payloads."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-L1", target_orbit: "LEO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 6.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - *k_port_a
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL_SSO", mass_kg: 50, volume_m3: 1.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PL_LEO_CB", mass_kg: 40, volume_m3: 0.5, interface_class: "CUBESAT", required_orbit: "LEO" }, { payload_name: "PL_LEO_R15", mass_kg: 50, volume_m3: 1.0, interface_class: "RING_15", required_orbit: "LEO" }, { payload_name: "PL_LEO_R24", mass_kg: 45, volume_m3: 0.9, interface_class: "RING_24", required_orbit: "LEO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl_sso: "$.data[0].id", pl_leo_cb: "$.data[1].id", pl_leo_r15: "$.data[2].id", pl_leo_r24: "$.data[3].id" }
            - *k_getm1
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_sso}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { e_orbit: $.data.error_id }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_leo_cb}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { e_iface: $.data.error_id }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_leo_r15}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a_ok: $.data.id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_leo_r24}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { e_port: $.data.error_id }
          assert:
            - "e_orbit == ERR_ORBIT_MISMATCH (422; SSO payload cannot fly on a LEO mission)"
            - "e_iface == ERR_INTERFACE_INCOMPATIBLE (422; CUBESAT not in DSP-A's supported classes) — rejected writes never bump Mission.version, so ${m_v1} was still current"
            - "the LEO/RING_15 assignment returns 201"
            - "e_port == ERR_PORT_OCCUPIED (409; DSP-A already carries a live assignment)"
            - "GET /rideshare/assignments?mission_id=${m_id} returns exactly 1 row"
