      - name: ship_blocked_when_allocated_lot_unshippable
        claim_type: cross_entity_validation
        grounds:
          - state_machines.ShipmentOrder.PICKED_to_SHIPPED
          - errors[ERR_ORDER_CONTAINS_UNSHIPPABLE_LOT]
        distinguishing_aspect: |
          PICKED orders keep their allocations through a lot recall (the
          de-allocation cascade skips PICKED); the ship gate then refuses with
          ERR_ORDER_CONTAINS_UNSHIPPABLE_LOT because the allocated lot is
          RECALLED — the order stays PICKED.
        test_recipe:
          setup:
            - "Full pipeline; lot of 1000 units; order for 400 units ALLOCATED then PICKED"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ShipGate", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
