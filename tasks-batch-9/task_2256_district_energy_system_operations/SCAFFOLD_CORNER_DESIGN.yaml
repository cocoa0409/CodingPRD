            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_q_id}", code: "SEG-Q2", length_m: 800.0, diameter_mm: 250, install_year: 1976, insulation_class: "C", buried_depth_m: 1.1 }
              as: NetworkEngineer
              captures: { seg_q2_id: $.data.id }
            - call: "POST /district-energy/pipe-segments/${seg_q2_id}/condition-assessment"
              payload: { makeup_water_ratio: 0.05, historical_leak_count: 3, insulation_class: "C", survey_note: "acoustic survey flags this run" }
              as: NetworkEngineer
              captures: { seg_q2_score: $.data.leak_risk_score, seg_q2_condition: $.data.condition }
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_q1_id}", loop_id: "${loop_q_id}", work_type: "INSPECTION", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T16:00:00Z", requires_isolation: true }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { woq_id: $.data.id }
            - call: "POST /district-energy/work-orders/${woq_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${woq_id}/permit-decision"
              payload: { permit_decision: "GRANTED", decision_note: "isolation approved" }
              as: NetworkEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/work-orders/${woq_id}/begin-excavation"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${woq_id}/begin-repair"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${woq_id}/backfill"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/network-loops/${loop_q_id}"
              payload: {}
              as: NetworkEngineer
              captures: { loop_q_posture_isolated: $.data.posture, loop_q_suspect_count: $.data.suspect_segment_count, loop_q_isolation_count: $.data.open_isolation_count }
          trigger:
            - call: "POST /district-energy/work-orders/${woq_id}/complete"
              payload: { completion_note: "inspection closed" }
              as: FieldTechnician
              as_user_id: "tech-2"
              captures: { woq_state: $.data.work_state }
            - call: "GET /district-energy/network-loops/${loop_q_id}"
              payload: {}
              as: NetworkEngineer
              captures: { loop_q_posture_after: $.data.posture, loop_q_suspect_after: $.data.suspect_segment_count, loop_q_isolation_after: $.data.open_isolation_count }
          assert:
            - "${seg_q2_score} == 91.92"
            - "${seg_q2_condition} == SUSPECT"
            - "${loop_q_posture_isolated} == ISOLATED"
            - "${loop_q_suspect_count} == 1"
            - "${loop_q_isolation_count} == 1"
            - "${woq_state} == COMPLETED"
            - "PipeSegment.${seg_q1_id}.historical_leak_count == 0 because the work_type was INSPECTION"
            - "PipeSegment.${seg_q1_id}.leak_risk_score == 9.67"
            - "PipeSegment.${seg_q1_id}.condition == SOUND"
            - "${loop_q_isolation_after} == 0"
            - "${loop_q_suspect_after} == 1"
            - "${loop_q_posture_after} == CONSTRAINED"

      - name: cyclic_shape_plan_loops_back_from_committed_to_draft
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DispatchPlan.COMMITTED_to_DRAFT
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispatch_plan_commit_decommit_reoptimise_cycle
          rationale: "The named §1.8 instance drives DRAFT -> SUBMITTED -> APPROVED -> COMMITTED -> DRAFT -> APPROVED and asserts the version arithmetic across the loop."

      - name: parallel_state_dimensions_move_independently_on_one_agreement
        claim_type: parallel
        grounds:
          - state_machines.ConnectionAgreement
          - entities.ConnectionAgreement.fields.billing_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_contract_and_billing_dimensions_advance_independently
          rationale: "The named §1.8 instance advances contract_state and billing_state on the same row and asserts each dimension moves without dragging the other."

      - name: compensation_decommit_reverses_every_commit_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.DispatchPlan.COMMITTED_to_DRAFT
          - entities.ProductionAsset.fields.state_of_charge_kwh
        excluded_because:
          difficulty_instance: compensating_invariant / storage_energy_kwh_ledger_returns_to_zero_drift_over_two_commit_cycles
          rationale: "The named §1.8 instance asserts the kWh ledger returns to 4000.0 after each decommit across two cycles with no drift."

      - name: cascade_down_fuel_suspension_reaches_asset_plan_and_loop
        claim_type: Cascade down
        grounds:
          - state_machines.FuelSupplyContract.ACTIVE_to_SUSPENDED
          - state_machines.ProductionAsset.AVAILABLE_to_DERATED
          - state_machines.DispatchPlan.APPROVED_to_DRAFT
        excluded_because:
          difficulty_instance: transitive_cascade / fuel_suspension_derates_asset_reverts_plan_constrains_loop
          rationale: "The named §1.8 instance walks the four-hop chain contract -> asset -> plan -> loop and asserts each hop's observable."

  - section: Calculations
    instances:
      - name: merit_order_input_set_skips_an_asset_left_in_outage
        claim_type: Input Set Filtering
        grounds:
          - calculations.merit_order_dispatch
          - calculations.plan_reliability_metrics
          - endpoints[POST /district-energy/production-assets/{asset_id}/availability]
          - errors[ERR_RESERVE_MARGIN_INSUFFICIENT]
        distinguishing_aspect: "The waterfall's input_set admits only AVAILABLE and DERATED assets, so putting C_BIO (52.00 per MWh) into OUTAGE hands merit rank 3 to the dearer C_OIL (90.00 per MWh): total cost rises from 1584.36 to 1882.77 and the N-1 reserve margin falls from 46.41 to -12.95, which then blocks approval."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-C (DUAL, rated 8000.0) with ACTIVE ConnectionAgreement CA3 (COMMERCIAL_OFFICE, reserved 3000.0) and PUBLISHED LoadForecast F3 (coincident_demand_kw 2527.20)."
            - "Assets C_STO (storage 4000.0 kWh, cost 6.00), C_CHP (1200.0, min_stable 400.0, cost 40.00), C_BIO (1500.0, min_stable 300.0, cost 52.00), C_OIL (2000.0, min_stable 200.0, cost 90.00)."
            - "C_BIO moved to OUTAGE before the plan is optimized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-C", name: "Campus Loop C", service_mode: "DUAL", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 8000.0 }
              as: SystemController
              captures: { loop_c_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_c_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Campus Facilities", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 3000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca3_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca3_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_STO", asset_type: "THERMAL_STORAGE", rated_capacity_kw: 1000.0, marginal_cost_per_mwh: 6.00, emission_factor_kg_per_mwh: 0.0, storage_capacity_kwh: 4000.0, state_of_charge_kwh: 4000.0 }
              as: SystemController
              captures: { c_sto_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_CHP", asset_type: "CHP", rated_capacity_kw: 1200.0, marginal_cost_per_mwh: 40.00, emission_factor_kg_per_mwh: 205.0, derated_capacity_kw: 600.0, min_stable_output_kw: 400.0 }
              as: SystemController
              captures: { c_chp_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_BIO", asset_type: "BIOMASS_BOILER", rated_capacity_kw: 1500.0, marginal_cost_per_mwh: 52.00, emission_factor_kg_per_mwh: 28.0, derated_capacity_kw: 750.0, min_stable_output_kw: 300.0 }
              as: SystemController
              captures: { c_bio_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_OIL", asset_type: "BOILER", rated_capacity_kw: 2000.0, marginal_cost_per_mwh: 90.00, emission_factor_kg_per_mwh: 260.0, derated_capacity_kw: 1000.0, min_stable_output_kw: 200.0 }
              as: SystemController
              captures: { c_oil_id: $.data.id }
            - call: "POST /district-energy/production-assets/${c_bio_id}/availability"
              payload: { availability_state: "OUTAGE", reason: "boiler tube failure" }
              as: SystemController
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_c_id}", service_date: "2026-08-05T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 0.0, cooling_degree_hours: 0.0 }
              as: DispatchOperator
              captures: { f3_id: $.data.id }
            - call: "POST /district-energy/load-forecasts/${f3_id}/publish"
              payload: { variant: "WEATHER_NORMAL_PROVISIONAL" }
              as: DispatchOperator
            - call: "GET /district-energy/network-loops/${loop_c_id}"
              payload: {}
              as: DispatchOperator
              captures: { loop_c_v: $.data.version }
            - call: "POST /district-energy/dispatch-plans"
              payload: { loop_id: "${loop_c_id}", forecast_id: "${f3_id}", expected_loop_version: "${loop_c_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { plan_c_id: $.data.id }
          trigger:
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/optimize"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { plan_cost: $.data.total_dispatch_cost, plan_rm: $.data.reserve_margin_pct }
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/submit"
              payload: { submission_note: "biomass out" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/review"
              payload: { decision: "APPROVE", review_note: "attempt with biomass out" }
              as: SystemController
              as_user_id: "ctrl-1"
          assert:
            - "GET /district-energy/dispatch-orders?plan_id=${plan_c_id} has total_count == 3"
            - "no DispatchOrder for plan ${plan_c_id} references asset ${c_bio_id}"
            - "the DispatchOrder for ${c_oil_id} has merit_rank == 3, allocated_kw == 327.20, block_energy_mwh == 7.853, order_cost == 706.77 and order_emissions_kg == 2041.78"
            - "${plan_cost} == 1882.77"
            - "DispatchPlan.${plan_c_id}.total_emissions_kg == 7945.78"
            - "DispatchPlan.${plan_c_id}.allocated_capacity_kw == 2527.20"
            - "DispatchPlan.${plan_c_id}.unserved_demand_kw == 0.00"
            - "${plan_rm} == -12.95"
            - "DispatchPlan.${plan_c_id}.fuel_diversity_hhi == 0.5489"
            - "the submit response status is 200 and DispatchPlan.${plan_c_id}.plan_state == SUBMITTED"
            - "the review response status is 409 with data.error_id == ERR_RESERVE_MARGIN_INSUFFICIENT"
            - "DispatchPlan.${plan_c_id}.plan_state == SUBMITTED after the rejected review"

      - name: load_factor_tier_ladder_switches_one_hundredth_of_a_point_above_thirty
        claim_type: tiered_pricing
        grounds:
          - calculations.invoice_billing_determinants
          - entities.RateSchedule.fields.tiers
          - state_machines.Invoice.DRAFT_to_VOID
        distinguishing_aspect: "At load_factor_pct exactly 30.00 the ladder selects the first tier whose load_factor_max is at or above the load factor (88.00 per MWh, total 62816.00); one hundredth of a point higher at 30.01 it selects the 74.00 tier, so 0.100 MWh more energy makes the bill 6040.60 cheaper."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-N with RateSchedule RS-C (tiers 30.0 -> 88.00, 65.0 -> 74.00, 100.0 -> 61.00) and ACTIVE agreement CB1 (COMMERCIAL_OFFICE, reserved 4000.0 so the reserved floor is 2000.00)."
            - "COMMISSIONED MeteringPoint MP-N1 (multiplier 1.0) with ACTUAL reads cumulative 1000.000 at peak 1500.0 and cumulative 1432.000 at peak 1500.0 inside 2026-06-01 to 2026-07-01 (720 hours)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-N", name: "Northgate Loop N", service_mode: "DUAL", design_supply_temp_c: 93.0, max_pressure_kpa: 1500.0, rated_capacity_kw: 8000.0 }
              as: SystemController
              captures: { loop_n_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_n_id}", code: "SEG-N1", length_m: 600.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_n1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_n_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Northgate Centre", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 4000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { cb1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${cb1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${cb1_id}", segment_id: "${seg_n1_id}", code: "MP-N1", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_n1_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp_n1_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points/${mp_n1_id}/readings"
              payload: { read_at: "2026-06-01T00:00:00Z", cumulative_energy_mwh: 1000.000, peak_demand_kw: 1500.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points/${mp_n1_id}/readings"
              payload: { read_at: "2026-06-15T00:00:00Z", cumulative_energy_mwh: 1432.000, peak_demand_kw: 1500.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/connection-agreements/${cb1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cb1_v1: $.data.version }
          trigger:
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cb1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${cb1_v1}" }
              as: BillingAnalyst
              captures: { inv_at_boundary_id: $.data.id, lf_at_boundary: $.data.load_factor_pct, total_at_boundary: $.data.total_amount }
            - call: "POST /district-energy/invoices/${inv_at_boundary_id}/void"
              payload: { reason: "superseded by a corrected register read" }
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points/${mp_n1_id}/readings"
              payload: { read_at: "2026-06-20T00:00:00Z", cumulative_energy_mwh: 1432.100, peak_demand_kw: 1500.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/connection-agreements/${cb1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cb1_v2: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cb1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${cb1_v2}" }
              as: BillingAnalyst
              captures: { inv_above_boundary_id: $.data.id, lf_above_boundary: $.data.load_factor_pct, total_above_boundary: $.data.total_amount }
          assert:
