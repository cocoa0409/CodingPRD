              as: PlatformAdmin
            - call: "POST /api/catalog/products"
              payload: { sku: "PEST-01", name: "Grub control", category: PEST, list_price_cents: 900, tier_t1_cents: 500, tier_t2_cents: 500, tier_t3_cents: 500, add_on_flat_price_cents: 2500, window_start_md: "05-01", window_end_md: "09-01", conflicting_categories: [], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "x4@x.com", full_name: "X Four", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 1, target_month: 6 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${c_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/add-ons"
              payload: { subscription_id: "${sub_id}", add_on_sku: "PEST-01", qty_units: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ao_id: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { exp: $.data.add_ons_expired }
            - call: "GET /api/add-ons/${ao_id}"
              as: PlatformAdmin
              captures: { ao_s: $.data.status }
            - call: "POST /api/add-ons/${ao_id}/confirm"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${exp} == 1 (expiry at exactly quote_expires_at: now >= quote_expires_at is inclusive)"
            - "add-on ${ao_s} == EXPIRED"
            - "confirm on the expired quote: ${err} == ERR_ADD_ON_NOT_QUOTED (409)"

      - name: pause_resume_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, state_machines.ShipmentBox.SCHEDULED_to_HELD]
        excluded_because:
          difficulty_instance: subscription_pause_resume_cycle
          rationale: "Box HELD/SCHEDULED cascade asserted in the named §1.8 instance; task FROZEN cascade asserted in pause_resume_application_count_conservation."

      - name: cancel_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, state_machines.Invoice.ISSUED_to_VOID]
        excluded_because:
          difficulty_instance: subscription_cancel_cascade_invoice_void_credit_restore
          rationale: "Asserted end-to-end (box cancel -> invoice void -> credit restore) in the named §1.8 instance."

      - name: reship_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.SatisfactionClaim.FILED_to_RESOLVED]
        excluded_because:
          difficulty_instance: claim_reship_cascade_depth3
          rationale: "RESHIP -> replacement box -> add-on attach -> charge recompute asserted in the named §1.8 instance."

      - name: referral_qualification_covered
        claim_type: variant_selection
        grounds: [state_machines.Referral.PENDING_to_QUALIFIED]
        excluded_because:
          difficulty_instance: referral_credit_provisional_vs_qualified
          rationale: "Qualification on referee first paid invoice asserted in the named §1.8 instance."

      - name: invoice_rounding_covered
        claim_type: precision
        grounds: [calculations.invoice_total_calc]
        excluded_because:
          difficulty_instance: invoice_total_per_line_rounding_order
          rationale: "Pinned per-line rounding order asserted in the named §1.8 instance."

      - name: validation_priority_conflicts_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: reschedule_state_beats_window_temporal
          rationale: "Two priority pairs asserted by the §1.8 instances reschedule_state_beats_window_temporal and weather_safety_beats_window_temporal."

      - name: application_count_invariant_covered
        claim_type: compensation
        grounds: [state_machines.ApplicationTask.SCHEDULED_to_FROZEN]
        excluded_because:
          difficulty_instance: pause_resume_application_count_conservation
          rationale: "Count conservation across pause/resume asserted in the named §1.8 instance."

      - name: credit_conservation_invariant_covered
        claim_type: compensation
        grounds: [calculations.credit_balance_calc]
        excluded_because:
          difficulty_instance: referral_qualify_revoke_credit_conservation
          rationale: "Earn/revoke conservation asserted in the named §1.8 instance."

  # =========================================================== section 9 =====
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a registration is fully visible in the very next GET with identical field values — no read-your-writes lag anywhere."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers/register"
              payload: { email: "m1@x.com", full_name: "M One", climate_zone: WARM }
              as: Anonymous
              captures: { c_id: $.data.id, c_zone: $.data.climate_zone, c_bal: $.data.credit_balance_cents }
            - call: "GET /api/customers/${c_id}"
              as: PlatformAdmin
              captures: { g_zone: $.data.climate_zone, g_bal: $.data.credit_balance_cents, g_status: $.data.status }
          assert:
            - "write response and immediate read agree: ${c_zone} == ${g_zone} == WARM, ${c_bal} == ${g_bal} == 0"
            - "read shows ${g_status} == ACTIVE with no propagation delay"

