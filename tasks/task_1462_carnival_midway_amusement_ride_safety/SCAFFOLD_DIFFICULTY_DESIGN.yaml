            - { call: "POST /midway/weather-observations", payload: { operating_day_id: "${day_id}", wind_speed_mph: 39 }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/operating-days/${day_id}/resume-day", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
