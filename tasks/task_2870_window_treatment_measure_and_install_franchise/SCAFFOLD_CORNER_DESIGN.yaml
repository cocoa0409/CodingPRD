          rationale: "The named §1.8 instance drives the territory to PROBATION and asserts the guarded acceptance refusal two FK hops away."

  # -------------------------------------------------------------------
  # Guide section 3 - Calculations (Table 3 + algorithm boundary rows)
  # -------------------------------------------------------------------
  - section: calculations
    instances:
      - name: the_oversize_surcharge_engages_strictly_above_the_billable_width_boundary
        claim_type: threshold
        grounds:
          - calculations.opening_list_price
          - calculations.opening_finished_dimensions
        distinguishing_aspect: "Two openings 0.125 in apart across the OVERSIZE_WIDTH_IN boundary: billable width exactly 72.000 carries no surcharge, 72.125 carries 15 percent. The wider opening is charged twice over - it also crosses a quarter-sqft billing step - so the test pins that the surcharge is computed on the post-step subtotal and not on the base price."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one ROUTED lead and one SCHEDULED consultation."
            - "Two INSIDE-mount openings measured with square readings: A at width 72.500 / height 48.250 (ordered 72.000 x 48.000) and B at width 72.625 / height 48.250 (ordered 72.125 x 48.000)."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Slider at the boundary", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 72.500, width_middle_in: 72.500, width_bottom_in: 72.500, height_left_in: 48.250, height_center_in: 48.250, height_right_in: 48.250, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { oa: $.data.id, oa_w: $.data.ordered_width_in }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Slider one eighth over", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 72.625, width_middle_in: 72.625, width_bottom_in: 72.625, height_left_in: 48.250, height_center_in: 48.250, height_right_in: 48.250, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { ob: $.data.id, ob_w: $.data.ordered_width_in }
          trigger:
            - call: "PATCH /blinds/openings/${oa}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
              captures: { a_price: $.data.list_price_cents, a_sqft: $.data.billable_sqft }
            - call: "PATCH /blinds/openings/${ob}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
              captures: { b_price: $.data.list_price_cents, b_sqft: $.data.billable_sqft }
          assert:
            - "the captured ${oa_w} == 72.000 and ${ob_w} == 72.125 - both floored to the eighth from 72.000 and 72.125 raw"
            - "the captured ${a_sqft} == 24.000 (72.000 x 48.000 / 144 is exactly 24, so the quarter-sqft ceiling is a no-op) and ${b_sqft} == 24.250 (24.041666 ceiled to the quarter)"
            - "the captured ${a_price} == 14880 with NO surcharge: 24.000 x 620 = 14880 and billable width 72.000 is not strictly greater than OVERSIZE_WIDTH_IN"
            - "the captured ${b_price} == 17290: base 24.250 x 620 = 15035, surcharge round_half_up(15035 x 0.15) = 2255 (2255.25 truncates nothing - it rounds), total 17290"
            - "the surcharge is 2255, NOT 2231 (15 percent of the boundary opening's 14880) and NOT 2250 (15 percent of a pooled 15000) - it is a percentage of THIS opening's post-step subtotal"
