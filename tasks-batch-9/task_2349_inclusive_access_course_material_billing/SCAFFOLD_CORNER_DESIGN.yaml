  - section: cross_cutting_complexity_layers
    instances:
      - name: layer_occ_stale_section_version_rejects_adoption_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adoption-create-stale-section]
          - validations[priority=40]
          - errors[ERR_STALE_SECTION_VERSION]
          - endpoints[POST /adoptions]
        distinguishing_aspect: |
          The section's version, not the adoption's, is the OCC token. A second adoption on the same
          section is legitimate (max_concurrent_titles is 2), so nothing else would stop it - only the
          section version advanced by the first create does, with 412 ERR_STALE_SECTION_VERSION. The
          rejected write leaves the version untouched, and re-reading it makes the identical payload
          succeed.
        test_recipe:
          setup:
            - "FA26 OPEN; PUB-A ACTIVE with tiered titles T1 and T2; section ECON-101-001 (fac-1, max_concurrent_titles 2) freshly created at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
