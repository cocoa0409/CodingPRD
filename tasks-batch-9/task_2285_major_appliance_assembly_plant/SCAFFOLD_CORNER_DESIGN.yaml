            - "EC-B: identical but cut_in_sequence_index 5; also APPROVED"
            - "Line L1 is still RUNNING with posture OPEN"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - call: "POST /engineering-changes"
              payload: { model_variant_id: "${wmx_id}", affected_part_id: "${p_door_id}", target_line_id: "${line_id}", bom_position_code: "POS-DOOR", cut_in_sequence_index: 1 }
              as: EngineeringLead
