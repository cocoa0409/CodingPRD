      - name: tier_tightening_constants_applied_to_client_thresholds
        claim_type: constants_applied
        grounds:
          - calculations.effective_client_threshold_resolution
        excluded_because:
          difficulty_instance: combinatorial_formula / threshold_resolution_escalates_tier_from_closed_lost_time_at_badged_site
          rationale: "TIER_TIGHTENING and the severity-rank escalation constants are pinned numerically in that instance's asserts."

      - name: rounding_order_of_the_weighted_products
        claim_type: precision
        grounds:
          - calculations.composite_prequalification_score
        excluded_because:
          difficulty_instance: combinatorial_formula / metric_normalization_rounds_each_weighted_product_before_summing
          rationale: "That instance contrasts the mandated 63.14 against the forbidden 63.13 produced by summing before rounding."

      - name: grading_threshold_at_exact_equality
        claim_type: threshold
        grounds:
          - calculations.grading_decision
        excluded_because:
          difficulty_instance: boundary_precision_check / emr_exactly_at_effective_threshold_is_not_a_breach_and_grades_approved
          rationale: "Value == threshold, value just above and the band ceiling are all covered there."

      - name: aggregation_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.site_granted_worker_count
        excluded_because:
          difficulty_instance: compensating_invariant / site_granted_worker_count_returns_to_zero_after_two_grants_and_two_revokes_and_never_goes_negative
          rationale: "Running total after add, after reversal and the floor at zero are all asserted there."

      - name: weighted_scoring_weight_application_and_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.composite_prequalification_score
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_and_final_composite_diverge_on_hazard_tier_tightening
          rationale: "The four weights, their products and the resulting composite are pinned for both variants there."

      - name: variant_divergence_of_the_composite_score
        claim_type: variant_divergence
        grounds:
          - calculations.composite_prequalification_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_and_final_composite_diverge_on_hazard_tier_tightening
          rationale: "Same statistic, two variants, delta asserted as literals."

      - name: variant_selection_between_coverage_bases
        claim_type: variant_selection
        grounds:
          - calculations.insurance_coverage_adequacy.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / insurance_per_occurrence_verifies_then_aggregate_depletion_blocks_grant
          rationale: "That instance shows the per_occurrence_basis variant passing at verification and the aggregate_depletion_basis variant failing at grant time for the same certificate."

      - name: topological_order_of_the_subcontractor_graph
        claim_type: topological
        grounds:
          - calculations.subcontractor_depth
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_prime_subcontractor_edge_cascades_through_three_generation_chain
          rationale: "Depth assignment and depth-ordered processing across a three-generation chain are asserted there."

  - section: validations
    instances:
      - name: duplicate_reporting_year_on_a_pending_statistic_returns_duplicate_reporting_year
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors.ERR_DUPLICATE_REPORTING_YEAR
        distinguishing_aspect: "The uniqueness scope is (prequalification_id, reporting_year) restricted to verification_status in {PENDING, VERIFIED}: a second 2025 row is refused with 409 while the first is still merely PENDING, and the different hours_worked in the second body proves the rejection is keyed on the year, not on payload equality."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification carrying one PENDING statistic for reporting_year 2025."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
          trigger:
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 610000, recordable_incidents: 1, dart_cases: 0, fatalities: 0, emr: 0.75, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 0, source_document_ref: "OSHA300A-2025-ALT" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2024, hours_worked: 610000, recordable_incidents: 1, dart_cases: 0, fatalities: 0, emr: 0.75, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 0, source_document_ref: "OSHA300A-2024" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat2024_id: $.data.id }
          assert:
            - "duplicate 2025: HTTP 409 with data.error_id == ERR_DUPLICATE_REPORTING_YEAR"
            - "distinct 2024: HTTP 201 - the constraint is per reporting_year, not one statistic per prequalification"
            - "GET /prequalifications/${pq_id}/safety-statistics returns exactly 2 rows (${stat_id} for 2025 and ${stat2024_id} for 2024), both PENDING"

      - name: reporting_year_at_the_lower_window_edge_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=20]
          - entities.SafetyStatistic.fields.reporting_year
          - errors.ERR_REPORTING_YEAR_OUT_OF_WINDOW
        distinguishing_aspect: "The window [clock_year - 3, clock_year] is INCLUSIVE at both ends: with the clock in 2026, reporting_year 2023 is accepted and 2022 is refused, and the current year 2026 is also accepted - an implementation using a strict lower bound or excluding the current year flips one of the three."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (clock year 2026, so the window is [2023, 2026])."
            - "Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification and no statistics yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2023, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2023" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat2023_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2022, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2022" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2026, hours_worked: 300000, recordable_incidents: 1, dart_cases: 0, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 0, source_document_ref: "OSHA300A-2026-YTD" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat2026_id: $.data.id }
          assert:
            - "reporting_year 2023 (clock_year - 3): HTTP 201 with data.reporting_year == 2023 and verification_status PENDING"
            - "reporting_year 2022 (clock_year - 4): HTTP 422 with data.error_id == ERR_REPORTING_YEAR_OUT_OF_WINDOW"
            - "reporting_year 2026 (clock_year): HTTP 201"
            - "GET /prequalifications/${pq_id}/safety-statistics returns exactly 2 rows (${stat2023_id} and ${stat2026_id})"

      - name: client_weights_not_summing_to_one_are_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=4]
          - entities.Client.fields.weight_trir
          - errors.ERR_INVALID_FIELD_VALUE
        distinguishing_aspect: "Each weight is individually a legal number in [0, 1], but the collective constraint sum == 1.00 exactly is what fails - and the accepted follow-up call with 0.50/0.20/0.20/0.10 proves a non-default but summing set is allowed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty client registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361", weight_trir: 0.5, weight_dart: 0.25, weight_emr: 0.25, weight_citation: 0.1 }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361", weight_trir: 0.5, weight_dart: 0.2, weight_emr: 0.2, weight_citation: 0.1 }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
          assert:
            - "weights summing to 1.10: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "weights summing to exactly 1.00: HTTP 201 with data.weight_trir == 0.5, data.weight_dart == 0.2, data.weight_emr == 0.2, data.weight_citation == 0.1"
            - "GET /clients/${client_id} confirms the stored non-default weights"

