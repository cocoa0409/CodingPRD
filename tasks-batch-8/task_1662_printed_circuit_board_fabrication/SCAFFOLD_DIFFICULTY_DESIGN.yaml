scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: FabOrder pricing vs ImpedanceCoupon disposition)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_pricing_diverge
        grounds:
          - calculations.order_pricing
          - entities.FabOrder.fields.provisional_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Same order data priced by two valid algorithms on the FabOrder/Invoice
          domain: PROVISIONAL (panel basis panels_required=34, no retest fees) yields
          68248 cents, while FINAL (panel basis actual_panels_run=36 plus one 1500-cent
          retest fee) yields 73615 cents — a 5367-cent divergence on identical geometry.
        test_recipe:
          setup:
            - "Order (2L HASL, 2000x3000 mil boards, 2x2 array on 5000x7000 mil panels, qty 100, STANDARD lane, ship 2026-08-10) advanced to COMPLETED"
            - "Locked stackup has 1 SINGLE_ENDED spec line; coupon needed exactly 1 retest (first measurement 60.0 FAIL, second 52.0 PASS)"
            - "provisional_total_cents == 68248 (base 59798 + finish 5950 + impedance 2500)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Acme Circuits", contact_email: "ops@acme.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator, captures: { line: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-A1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line}", panel_ref: "P01" }, as: QualityInspector, captures: { cpn: $.data.id } }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${cpn}", station: "MICROSECTION_A", starts_at: "2026-07-31T23:30:00Z", ends_at: "2026-08-01T00:30:00Z" }, as: QualityInspector, captures: { bk1: $.data.id } }
            - { call: "POST /pcb/coupons/${cpn}/measurements", payload: { measured_ohms: 60.0, lab_slot_booking_id: "${bk1}" }, as: QualityInspector }
            - { call: "POST /pcb/coupons/${cpn}/retest", payload: {}, as: QualityInspector }
            - { call: "POST /pcb/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: FabAdmin }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${cpn}", station: "MICROSECTION_A", starts_at: "2026-08-01T00:45:00Z", ends_at: "2026-08-01T01:45:00Z" }, as: QualityInspector, captures: { bk2: $.data.id } }
            - { call: "POST /pcb/coupons/${cpn}/measurements", payload: { measured_ohms: 52.0, lab_slot_booking_id: "${bk2}" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/complete-fab", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/etest-runs", payload: { fixture_id: "FX-1", test_voltage: 250 }, as: QualityInspector, captures: { etr: $.data.id } }
            - { call: "POST /pcb/etest-runs/${etr}/start", payload: {}, as: QualityInspector }
            - { call: "POST /pcb/etest-runs/${etr}/complete", payload: { outcome: "PASS", boards_tested: 100, boards_failed: 0, opens_found: 0, shorts_found: 0 }, as: QualityInspector }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/invoices/final", payload: { actual_panels_run: 36 }, as: ProductionPlanner, captures: { inv: $.data.id, inv_total: $.data.total_cents } }
          assert:
            - "Invoice.${inv}.total_cents == 73615 (base 63315 + finish 6300 + impedance 2500 + retest 1500)"
            - "GET FabOrder.${ord} shows provisional_total_cents == 68248"
            - "Invoice.${inv}.retest_fees_cents == 1500"
            - "73615 != 68248 — FINAL diverges from PROVISIONAL on identical order geometry"
      - name: single_vs_statistical_coupon_disposition
        grounds:
          - calculations.impedance_disposition
          - entities.ImpedanceSpecLine.fields.line_type
          - entities.ImpedanceCoupon.fields.disposition_basis
        distinguishing_aspect: |
          Same in-band reading 99.0 on the ImpedanceCoupon domain, two valid algorithms:
          SINGLE (single-ended line) judges the latest reading alone and PASSes;
          STATISTICAL (differential line) also enforces leg spread <= 6.0, so legs
          91.0/99.0 (spread 8.0) FAIL despite both legs lying inside the 100±10 band.
        test_recipe:
          setup:
            - "Order IN_PRODUCTION whose locked stackup has two spec lines: L1 SINGLE_ENDED 100±10, L2 DIFFERENTIAL 100±10"
            - "coupon c1 exists for L1; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Beta Circuits", contact_email: "ops@beta.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 100.0, tolerance_plus_ohms: 10.0, tolerance_minus_ohms: 10.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator, captures: { line1: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L2", target_ohms: 100.0, tolerance_plus_ohms: 10.0, tolerance_minus_ohms: 10.0, line_type: "DIFFERENTIAL", coupon_required: true }, as: CAMOperator, captures: { line2: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-B1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line1}", panel_ref: "P01" }, as: QualityInspector, captures: { c1: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line2}", panel_ref: "P02" }, as: QualityInspector, captures: { c2: $.data.id } }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${c1}", station: "MICROSECTION_A", starts_at: "2026-07-31T23:30:00Z", ends_at: "2026-08-01T00:30:00Z" }, as: QualityInspector, captures: { bk1: $.data.id } }
            - { call: "POST /pcb/coupons/${c1}/measurements", payload: { measured_ohms: 99.0, lab_slot_booking_id: "${bk1}" }, as: QualityInspector }
            - { call: "POST /pcb/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: FabAdmin }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${c2}", station: "MICROSECTION_A", starts_at: "2026-08-01T00:45:00Z", ends_at: "2026-08-01T01:45:00Z" }, as: QualityInspector, captures: { bk2: $.data.id } }
          trigger:
            - { call: "POST /pcb/coupons/${c2}/measurements", payload: { measured_ohms: 91.0, measured_ohms_b: 99.0, lab_slot_booking_id: "${bk2}" }, as: QualityInspector, captures: { m2: $.data.id, m2_result: $.data.result } }
          assert:
            - "GET ImpedanceCoupon.${c1}: status == PASSED, disposition_basis == SINGLE (reading 99.0 inside [90,110])"
            - "GET ImpedanceCoupon.${c2}: status == FAILED, disposition_basis == STATISTICAL"
            - "CouponMeasurement.${m2}.result == FAIL although both legs 91.0 and 99.0 are inside [90,110] — spread 8.0 > 6.0 fails only the STATISTICAL variant"

  # =========================================================================
  # Rule 2 — combinatorial_formula (mode a: nested min/max + floor/ceil; mode b: pinned rounding order)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: array_yield_floor_ceil_interaction
        grounds:
          - calculations.panel_array_yield
          - entities.PanelArray.fields.array_yield
          - entities.PanelArray.fields.panels_required
        distinguishing_aspect: |
          Mode (a) non-linear formula with >= 3 inputs and a nested max() floor: a
          2000x3000-mil board takes the main branch (yield 0.94 -> good 3 -> 34 panels
          for qty 100), while a 10000x8000-mil board hits the ARRAY_YIELD_FLOOR branch
          (raw 0.20 -> clamped 0.50 -> good 2 -> 2 panels for qty 4) — same code path,
          different branch, different panels_required.
        test_recipe:
          setup:
            - "Customer exists; two QUOTED orders: A (2000x3000, qty 100) and B (10000x8000, qty 4)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Gamma Circuits", contact_email: "ops@gamma.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ordA: $.data.id, ordA_v: $.data.version } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 10000, board_y_mils: 8000, layer_count: 2, surface_finish: "HASL", quantity_boards: 4, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ordB: $.data.id, ordB_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ordA}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ordA_v}" }, as: CAMOperator, captures: { arrA: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ordB}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 22000, panel_height_mils: 18000, expected_fab_order_version: "${ordB_v}" }, as: CAMOperator, captures: { arrB: $.data.id } }
          trigger:
            - { call: "GET /pcb/panel-arrays/${arrA}", payload: {}, as: CAMOperator, captures: { a_yield: $.data.array_yield, a_good: $.data.good_boards_per_panel, a_panels: $.data.panels_required, a_util: $.data.utilization_pct } }
            - { call: "GET /pcb/panel-arrays/${arrB}", payload: {}, as: CAMOperator, captures: { b_yield: $.data.array_yield, b_good: $.data.good_boards_per_panel, b_panels: $.data.panels_required, b_util: $.data.utilization_pct } }
          assert:
            - "PanelArray.${arrA}: boards_per_panel == 4, array_yield == 0.94, good_boards_per_panel == 3 (floor(4*0.94)), panels_required == 34 (ceil(100/3)), utilization_pct == 68.57"
            - "PanelArray.${arrB}: array_yield == 0.50 (floor branch clamped from raw 0.20), good_boards_per_panel == 2, panels_required == 2 (ceil(4/2)), utilization_pct == 80.81"
      - name: per_line_rounding_order_pinned
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: line values 1688.40 (base) and 655.20 (finish)
          both round DOWN per-line giving subtotal 2343, whereas summing raw
          (2343.60) and rounding once gives 2344 — the scaffold pins
          round-per-line-then-sum, so 2343 is the only correct answer.
        test_recipe:
          setup:
            - "QUOTED order: 2L ENIG, 2000x3000 mil boards, qty 3, STANDARD lane; array 2x2 on 5000x6720 mil panel (33.6 sqin -> 1 panel)"
            - "no locked stackup (0 impedance lines)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Delta Circuits", contact_email: "ops@delta.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "ENIG", quantity_boards: 3, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 6720, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
          trigger:
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
          assert:
            - "GET FabOrder.${ord}.provisional_total_cents == 2343 (1688 + 655 per-line-rounded then summed)"
            - "provisional_total_cents != 2344 (the sum-then-round result 2343.60 -> 2344 is the WRONG evaluation order)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (cycle on DrillProgram; parallel dimensions on FabOrder)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: drill_program_revision_cycle
        grounds:
          - state_machines.DrillProgram.REJECTED_to_DRAFT
          - state_machines.DrillProgram.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          DrillProgram is cyclic: DRAFT -> UNDER_REVIEW -> REJECTED -> DRAFT ->
          UNDER_REVIEW -> APPROVED; the revise hop increments revision to 2 and clears
          rejection_reason — a pure pipeline machine could not express the loop.
        test_recipe:
          setup:
            - "QUOTED order with a LOCKED stackup (thickness 62, 1oz); drill program created by cam_1 with min_hole 5 mils"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Epsilon Circuits", contact_email: "ops@epsilon.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 5, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/reject", payload: { reason: "min hole below process minimum" }, as: ProcessEngineer, as_user_id: "eng_1" }
          trigger:
            - { call: "POST /pcb/drill-programs/${drl}/revise", payload: { min_hole_mils: 10 }, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
          assert:
            - "DrillProgram.${drl}.status == APPROVED after the REJECTED -> DRAFT -> UNDER_REVIEW loop"
            - "DrillProgram.${drl}.revision == 2 and rejection_reason == null"
            - "DrillProgram.${drl}.plated_aspect_ratio == 6.2 (62 mils / 10 mils)"
      - name: order_parallel_status_dimensions
        grounds:
          - state_machines.FabOrder.quality_disposition
          - state_machines.FabOrder.FAILED_to_CONDITIONAL
          - state_machines.FabOrder.CONDITIONAL_to_PASSED
        distinguishing_aspect: |
          FabOrder carries two independent state dimensions: while fab_status stays
          IN_PRODUCTION, quality_disposition independently walks PENDING -> FAILED ->
          CONDITIONAL -> PASSED via final coupon failure, concession, and requalify —
          the quality transitions never touch fab_status.
        test_recipe:
          setup:
            - "Order IN_PRODUCTION (G1 geometry, 1 SINGLE_ENDED line); coupon exhausted all retests: FAIL at 60.0, retest, FAIL at 61.0, retest, FAIL at 62.0 — final failure sets disposition FAILED"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Zeta Circuits", contact_email: "ops@zeta.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator, captures: { line: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
