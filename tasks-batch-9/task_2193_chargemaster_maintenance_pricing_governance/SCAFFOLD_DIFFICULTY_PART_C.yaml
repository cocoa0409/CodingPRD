  - rule_id: compensating_invariant
    instances:
      - name: compensating_invariant__department_leakage_money_conserved_across_confirm_then_resolve
        grounds:
          - state_machines.MissingChargeFinding.OPEN_to_CONFIRMED
          - state_machines.MissingChargeFinding.CONFIRMED_to_RESOLVED
          - entities.Department.fields.unresolved_finding_amount_cents
          - entities.Department.fields.recovered_charge_cents
          - entities.Department.fields.capture_hold
          - entities.MissingChargeFinding.fields.estimated_lost_charge_cents
          - calculations.missing_charge_detection
          - calculations.charge_capture_variance_summary
          - validations[priority=31]
        distinguishing_aspect: |
          The conserved quantity is the Department's leakage MONEY total
          Q = Department.unresolved_finding_amount_cents + Department.recovered_charge_cents, which
          must equal 512000 both immediately after the two CONFIRM forward actions and after the
          two compensating RESOLVE actions have moved every cent from unresolved to recovered, and
          the derived capture_hold flag must therefore return from true to false.
