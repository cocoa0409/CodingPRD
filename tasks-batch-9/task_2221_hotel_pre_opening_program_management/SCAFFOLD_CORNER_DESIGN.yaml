      - name: budget_line_derived_totals_reconcile_after_commit_receipt_and_cancellation
        claim_type: derived_field_reconciliation
        grounds:
          - "§1.1 BudgetLine.committed_cents sums COMMITTED orders, spent_cents sums STORED orders and available_cents is authorized_cents - committed_cents - spent_cents, with authorized_cents declared conserved and never mutated by order activity; each of create, receive and cancel must leave the three derived fields reconciled."
        distinguishing_aspect: "The three derived fields are reconciled after each of the three source events: a receipt moves value from committed_cents to spent_cents without touching available_cents, and a cancellation returns it, while authorized_cents never drifts."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
