            - "${print_1} == PRINTED then ${place_1} == PLACED"
            - "${sum_backlog_2} == 1 and ${plain_backlog_2} == 1, with ${sum_posture_2} == ${plain_posture_2} == OPEN"
            - "${unplaced_total} == 1 with ${unplaced_id} == ${lt_2}, which is exactly the row the recomputed backlog counts"

      - name: corner_signage_post_is_conditional_on_the_jurisdictions_disclosure_set
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/price-integrity/promo-signage/{id}/post
          - validations.priority_62
          - errors.ERR_MISSING_DISCLOSURE
          - calculations.signage_compliance_state
        distinguishing_aspect: "The same POST is refused or accepted purely on the jurisdiction's required disclosure set: missing_disclosure_codes is computed at draft time and the post is gated on it being empty, so the DRAFT sign already advertises the reason it will be refused, while a fully disclosed twin posts and becomes COMPLIANT."
        test_recipe:
          setup:
            - "Jurisdiction requiring two disclosure codes; one store with aisle A01 and certified sm1; two DRAFT signs, one under-disclosed and one complete."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", signage_disclosure_codes: ["UNIT_PRICE_SHOWN", "EXPIRY_DATE"] }
              as: PricingAdmin
              captures: { jur_a: $.data.id, req_codes: $.data.signage_disclosure_codes }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
          trigger:
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", sign_code: "SG-1", promo_start_at: "2026-08-01T00:00:00Z", promo_end_at: "2026-08-10T00:00:00Z", disclosure_codes: ["UNIT_PRICE_SHOWN"] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sg_1: $.data.id, miss_1: $.data.missing_disclosure_codes, state_1: $.data.compliance_state, st_1: $.data.status }
            - call: "POST /price-integrity/promo-signage/${sg_1}/post"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_missing: $.data.error_id }
            - call: "GET /price-integrity/promo-signage/${sg_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_1b: $.data.status, posted_at_1: $.data.posted_at }
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", sign_code: "SG-2", promo_start_at: "2026-08-01T00:00:00Z", promo_end_at: "2026-08-10T00:00:00Z", disclosure_codes: ["EXPIRY_DATE", "UNIT_PRICE_SHOWN"] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sg_2: $.data.id, miss_2: $.data.missing_disclosure_codes, state_2: $.data.compliance_state }
            - call: "POST /price-integrity/promo-signage/${sg_2}/post"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_2: $.data.status, state_2b: $.data.compliance_state, posted_at_2: $.data.posted_at }
            - call: "POST /price-integrity/promo-signage/${sg_2}/remove"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_2c: $.data.status, state_2c: $.data.compliance_state, removed_at_2: $.data.removed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { sign_violations: $.data.signage_violation_count, posture_1: $.data.compliance_posture }
          assert:
            - "${req_codes} == ['UNIT_PRICE_SHOWN', 'EXPIRY_DATE'] on the jurisdiction"
            - "The under-disclosed draft is created with ${miss_1} == ['EXPIRY_DATE'], ${st_1} == DRAFT and ${state_1} == NOT_APPLICABLE (compliance is only judged once POSTED)"
            - "Posting it: HTTP 422 with ${e_missing} == ERR_MISSING_DISCLOSURE, and ${st_1b} == DRAFT with ${posted_at_1} == null"
            - "The complete draft has ${miss_2} == [] and ${state_2} == NOT_APPLICABLE, and posting it returns HTTP 200 with ${st_2} == POSTED, ${state_2b} == COMPLIANT and ${posted_at_2} == 2026-08-01T00:00:00Z"
            - "Removing it: ${st_2c} == REMOVED, ${state_2c} == NOT_APPLICABLE, ${removed_at_2} == 2026-08-01T00:00:00Z"
            - "${sign_violations} == 0 throughout, so ${posture_1} == OPEN — a refused post never counts as a violation"

  # ==========================================================================
  # Table 6 — Errors (every catalogued id must be triggerable somewhere)
  # ==========================================================================
  - section: Errors
    instances:
      - name: corner_finding_evidence_guards_and_the_penalty_override_ceiling
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REMEDIATION_EVIDENCE_REQUIRED
          - errors.ERR_FINDING_INVALID_STATE
          - errors.ERR_PENALTY_OVERRIDE_TOO_HIGH
          - state_machines.InspectionFinding
        distinguishing_aspect: "Each finding branch demands a different companion field and the adjudication override is bounded by the freshly recomputed exposure, so the same target_status is a 409 (wrong source state), a 422 (missing evidence) or a 200 depending only on the payload, and the ACCEPT override is refused at exposure + 1 while exposure itself is accepted."
        test_recipe:
          setup:
            - "Jurisdiction with default penalty constants; store with unassigned aisle A01 and certified pa1; PASS evidence audit; inspection with two issued findings (MINOR/2 items and MAJOR/4 items)."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", auditor_associate_id: "${pa1}", audit_type: "REGULATORY", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000017001", shelf_price_cents: 100, register_price_cents: 100 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${au_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { out_1: $.data.outcome }
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${au_1}", inspector_ref: "INS-2026-15", inspection_date: "2026-08-01T10:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MINOR", affected_item_count: 2, affected_aisle_code: "A01" }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MAJOR", affected_item_count: 4, affected_aisle_code: "A01" }] }
              as: ComplianceOfficer
              captures: { pen_issued: $.data.penalty_exposure_cents }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              as: ComplianceOfficer
              captures: { f_1: "$.data[0].id", f_2: "$.data[1].id" }
          trigger:
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "REMEDIATED", remediation_evidence_ref: "PHOTO-1" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_state: $.data.error_id }
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "REMEDIATION_PLANNED" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_no_code: $.data.error_id }
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "REMEDIATION_PLANNED", remediation_action_code: "RELABEL_AISLE" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_f1_a: $.data.status, code_f1: $.data.remediation_action_code, ev_f1_a: $.data.remediation_evidence_ref }
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "REMEDIATED" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_no_evidence: $.data.error_id }
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "REMEDIATED", remediation_evidence_ref: "PHOTO-1" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_f1_b: $.data.status, ev_f1_b: $.data.remediation_evidence_ref, comp_f1: $.data.penalty_component_cents }
            - call: "POST /price-integrity/inspection-findings/${f_1}/transition"
              payload: { target_status: "WAIVED", waiver_reason: "regulator relented" }
              as: ComplianceOfficer
              captures: { e_terminal: $.data.error_id }
            - call: "POST /price-integrity/inspection-findings/${f_2}/transition"
              payload: { target_status: "REMEDIATION_PLANNED", remediation_action_code: "REPRINT_UNIT_PRICE" }
              as: StoreManager
              as_user_id: "${sm1}"
            - call: "POST /price-integrity/inspection-findings/${f_2}/transition"
              payload: { target_status: "REMEDIATED", remediation_evidence_ref: "PHOTO-2" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_f2: $.data.status }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}"
              as: ComplianceOfficer
              captures: { ver_now: $.data.version, pen_now: $.data.penalty_exposure_cents }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/response"
              payload: { remediation_summary: "Both findings relabelled and photographed.", expected_regulatory_inspection_version: "${ver_now}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_insp: $.data.status, round_1: $.data.response_round }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/adjudicate"
              payload: { decision: "ACCEPT", assessed_penalty_cents: 70001 }
              as: ComplianceOfficer
              captures: { e_override: $.data.error_id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/adjudicate"
              payload: { decision: "ACCEPT", assessed_penalty_cents: 70000 }
              as: ComplianceOfficer
              captures: { st_closed: $.data.status, assessed: $.data.assessed_penalty_cents, pen_final: $.data.penalty_exposure_cents, liab: $.data.refund_liability_cents, credit: $.data.refund_credit_cents, closed_at: $.data.closed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { cum_penalty: $.data.cumulative_penalty_exposure_cents, open_findings: $.data.open_finding_count }
          assert:
            - "${out_1} == PASS and ${pen_issued} == 70000 == FLOOR((1*5000*2 + 3*5000*4) * 100/100)"
            - "OPEN -> REMEDIATED directly: HTTP 409 with ${e_state} == ERR_FINDING_INVALID_STATE — the source state is checked before the evidence field"
            - "REMEDIATION_PLANNED without remediation_action_code: HTTP 422 with ${e_no_code} == ERR_REMEDIATION_EVIDENCE_REQUIRED"
            - "With the code: ${st_f1_a} == REMEDIATION_PLANNED, ${code_f1} == RELABEL_AISLE, ${ev_f1_a} == null (the evidence slot belongs to the next hop)"
            - "REMEDIATED without remediation_evidence_ref: HTTP 422 with ${e_no_evidence} == ERR_REMEDIATION_EVIDENCE_REQUIRED — the same id, a different missing field"
            - "With the evidence: ${st_f1_b} == REMEDIATED, ${ev_f1_b} == PHOTO-1, and ${comp_f1} == 10000 is NOT zeroed (only WAIVED zeroes a component)"
            - "Waiving the REMEDIATED finding: HTTP 409 with ${e_terminal} == ERR_FINDING_INVALID_STATE (REMEDIATED is terminal), even though waiver_reason was supplied"
            - "${st_f2} == REMEDIATED, so ${pen_now} == 70000 still counts both findings and ${st_insp} == RESPONSE_SUBMITTED with ${round_1} == 1"
            - "ACCEPT with an override of 70001: HTTP 422 with ${e_override} == ERR_PENALTY_OVERRIDE_TOO_HIGH — one cent above the recomputed exposure"
            - "ACCEPT with exactly 70000: HTTP 200 with ${st_closed} == CLOSED, ${assessed} == 70000, ${pen_final} == 70000, ${liab} == 0, ${credit} == min(FLOOR(0*7500/10000), FLOOR(70000*50/100)) == 0 and ${closed_at} == 2026-08-01T00:00:00Z"
            - "${cum_penalty} == 70000 and ${open_findings} == 0 after closure"

      - name: corner_remedial_training_score_gate_binds_only_a_suspended_associate
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TRAINING_SCORE_TOO_LOW
          - errors.ERR_ASSOCIATE_INVALID_STATE
          - state_machines.Associate
        distinguishing_aspect: "A failing score is deliberately NOT an error for an UNTRAINED or IN_TRAINING associate — it is recorded and parks them IN_TRAINING — while the identical score is a 422 for a SUSPENDED associate, and a passing score on the wrong module is a 409 rather than a silent recertification."
        test_recipe:
          setup:
            - "One store with certified sm1 and one fresh label associate la1 in UNTRAINED."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id, variant: $.data.accountability_variant }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id, tr_0: $.data.training_status, exp_0: $.data.certification_expires_at, score_0: $.data.accountability_score }
          trigger:
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 79 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_1: $.data.training_status, exp_1: $.data.certification_expires_at, last_score_1: $.data.last_training_score_pct }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 12 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_2: $.data.training_status, last_score_2: $.data.last_training_score_pct }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 80 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_3: $.data.training_status, exp_3: $.data.certification_expires_at }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "AUDIT_FAIL", action_type: "SUSPENSION", source_ref: "AU-manual" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_1: $.data.id, weight_1: $.data.score_weight, act_status_1: $.data.status, issued_by: $.data.issued_by_ref }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_4: $.data.training_status, score_4: $.data.accountability_score }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_wrong_module: $.data.error_id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "REMEDIAL_LABEL_101", score_pct: 79 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_low_score: $.data.error_id }
            - call: "GET /price-integrity/associates/${la1}/accountability-actions"
              payload: { status: "ISSUED" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { issued_total_1: $.meta.total_count }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "REMEDIAL_LABEL_101", score_pct: 80 }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_5: $.data.training_status, score_5: $.data.accountability_score, exp_5: $.data.certification_expires_at }
            - call: "GET /price-integrity/accountability-actions/${act_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_status_2: $.data.status }
          assert:
            - "${variant} == OCCURRENCE_WEIGHTED, and la1 starts at ${tr_0} == UNTRAINED with ${exp_0} == null and ${score_0} == 100.00"
            - "score 79 (one below TRAINING_PASS_SCORE_PCT 80): HTTP 200 — ${tr_1} == IN_TRAINING, ${exp_1} == null, ${last_score_1} == 79; a failing score is not an error here"
            - "score 12: HTTP 200 again with ${tr_2} == IN_TRAINING and ${last_score_2} == 12 (the self-loop repeats without bound)"
            - "score exactly 80: ${tr_3} == CERTIFIED with ${exp_3} == 2027-08-01T00:00:00Z (clock + 365 days)"
            - "The SUSPENSION action has ${weight_1} == 25 and ${act_status_1} == ISSUED with ${issued_by} == ${sm1}, driving ${score_4} == 75.00 == max(0, 100 - 25) and therefore ${tr_4} == SUSPENDED"
            - "A passing score on LABEL_101 while SUSPENDED: HTTP 409 with ${e_wrong_module} == ERR_ASSOCIATE_INVALID_STATE — only the remedial module reinstates"
            - "REMEDIAL_LABEL_101 with 79: HTTP 422 with ${e_low_score} == ERR_TRAINING_SCORE_TOO_LOW, and ${issued_total_1} == 1 shows the refused call completed no action"
            - "REMEDIAL_LABEL_101 with 80: ${tr_5} == CERTIFIED, ${score_5} == 100.00 and ${exp_5} == 2027-08-01T00:00:00Z, and ${act_status_2} == COMPLETED — the compensating hops ran in one request"

      - name: corner_voiding_an_action_requires_a_reason_and_is_not_repeatable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VOID_REASON_REQUIRED
          - errors.ERR_ACTION_INVALID_STATE
          - state_machines.AccountabilityAction
        distinguishing_aspect: "void_reason is declared optional in the endpoint's input list yet mandatory for the VOIDED target, so the check is conditional on target_status rather than on the schema; the refused void must leave the action ISSUED and the score depressed, and the successful void restores the score exactly while never touching training_status."
        test_recipe:
          setup:
            - "One store with certified sm1 and certified la1; one WRITTEN_WARNING issued against la1 (weight 15, so the associate stays above the suspension floor)."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
              captures: { tr_0: $.data.training_status, score_0: $.data.accountability_score }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "OVERDUE_LABEL_TASK", action_type: "WRITTEN_WARNING" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_1: $.data.id, weight_1: $.data.score_weight, src_ref: $.data.source_ref, void_0: $.data.void_reason }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_1: $.data.training_status, score_1: $.data.accountability_score, count_1: $.data.issued_action_count }
          trigger:
            - call: "POST /price-integrity/accountability-actions/${act_1}/transition"
              payload: { target_status: "VOIDED" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_no_reason: $.data.error_id }
            - call: "POST /price-integrity/accountability-actions/${act_1}/transition"
              payload: { target_status: "VOIDED", void_reason: "" }
              as: ComplianceOfficer
              captures: { e_empty_reason: $.data.error_id }
            - call: "GET /price-integrity/accountability-actions/${act_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_status_1: $.data.status, act_ver_1: $.data.version }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { score_2: $.data.accountability_score }
            - call: "POST /price-integrity/accountability-actions/${act_1}/transition"
              payload: { target_status: "VOIDED", void_reason: "issued against the wrong associate" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_status_2: $.data.status, void_2: $.data.void_reason, act_ver_2: $.data.version }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { tr_3: $.data.training_status, score_3: $.data.accountability_score, count_3: $.data.issued_action_count }
            - call: "POST /price-integrity/accountability-actions/${act_1}/transition"
              payload: { target_status: "VOIDED", void_reason: "again" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_repeat: $.data.error_id }
          assert:
            - "${tr_0} == CERTIFIED with ${score_0} == 100.00 before the action; the action carries ${weight_1} == 15, ${src_ref} == null and ${void_0} == null"
            - "${score_1} == 85.00 == max(0, 100 - 15) with ${count_1} == 1, and ${tr_1} == CERTIFIED because 85.00 >= SUSPENSION_SCORE_FLOOR 80"
            - "VOIDED with no void_reason: HTTP 422 with ${e_no_reason} == ERR_VOID_REASON_REQUIRED"
            - "VOIDED with an empty-string void_reason: HTTP 422 with ${e_empty_reason} == ERR_VOID_REASON_REQUIRED — non-empty is required, not merely present"
            - "${act_status_1} == ISSUED and ${score_2} == 85.00: neither refusal changed the action or the score"
            - "VOIDED with a reason: HTTP 200 with ${act_status_2} == VOIDED, ${void_2} == 'issued against the wrong associate' and ${act_ver_2} == ${act_ver_1} + 1"
            - "${score_3} == 100.00 exactly (the pre-issue value) with ${count_3} == 0, while ${tr_3} == CERTIFIED — voiding never touches training_status"
            - "Voiding the VOIDED action: HTTP 409 with ${e_repeat} == ERR_ACTION_INVALID_STATE"

      - name: corner_error_envelope_is_uniform_and_returns_4XX_across_every_status_class
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Every failure class — 400, 401, 403, 404, 409, 412, 422 — must come back in the identical error envelope (response_type 'error', data limited to error_id and message, meta still populated) and must never carry a data payload of the target entity."
        test_recipe:
          setup:
            - "One jurisdiction and one DRAFT price change file with no lines, which is enough to reach a 409/422 without any further fixtures."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"] }
              as: PricingAdmin
              captures: { file_1: $.data.id, ver_0: $.data.version }
          trigger:
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NY" }
              as: PricingAdmin
              captures: { e_400: $.data.error_id, m_400: $.data.message, rt_400: $.response_type }
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NY", name: "New York" }
              as: "(headers omitted: no X-User-Role and no X-User-ID)"
              captures: { e_401: $.data.error_id, rt_401: $.response_type }
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NY", name: "New York" }
              as: CustomerServiceDesk
              captures: { e_403: $.data.error_id, rt_403: $.response_type }
            - call: "GET /price-integrity/jurisdictions/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e_404: $.data.error_id, rt_404: $.response_type }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              as: PricingAdmin
              captures: { e_422: $.data.error_id, m_422: $.data.message }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000018001", item_description: "Milk 1 GAL", category_code: "DAIRY", old_retail_cents: 499, new_retail_cents: 449, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              as: PricingAdmin
              captures: { ver_1: $.data.version, st_1: $.data.status }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              as: PricingAdmin
              captures: { e_409: $.data.error_id }
            - call: "POST /price-integrity/price-change-files/${file_1}/supersede"
              payload: { superseding_file_id: "${file_1}" }
              as: PricingAdmin
              captures: { e_supersede: $.data.error_id }
            - call: "GET /price-integrity/price-change-files/${file_1}"
              as: PricingAdmin
              captures: { ver_2: $.data.version, st_2: $.data.status }
          assert:
            - "Missing name: HTTP 400 with ${e_400} == ERR_INVALID_REQUEST, ${rt_400} == error and ${m_400} a non-empty human-readable string"
            - "No auth headers: HTTP 401 with ${e_401} == ERR_UNAUTHENTICATED and ${rt_401} == error"
            - "CustomerServiceDesk (a declared role, but not on this endpoint): HTTP 403 with ${e_403} == ERR_UNAUTHORIZED and ${rt_403} == error"
            - "The all-zero UUID: HTTP 404 with ${e_404} == ERR_JURISDICTION_NOT_FOUND and ${rt_404} == error — the not-found id is entity-specific, not generic"
            - "Distributing a file with zero lines: HTTP 422 with ${e_422} == ERR_FILE_HAS_NO_LINES and ${m_422} non-empty"
            - "After one line is added the same call succeeds with ${st_1} == DISTRIBUTED and ${ver_1} == ${ver_0} + 1"
            - "Distributing again: HTTP 409 with ${e_409} == ERR_FILE_INVALID_STATE"
            - "Superseding a file with itself: HTTP 422 with ${e_supersede} == ERR_SUPERSEDING_FILE_INVALID (the target must be DRAFT or DISTRIBUTED with a later effective_date, and a self-reference is neither a distinct row nor a later date)"
            - "${ver_2} == ${ver_1} and ${st_2} == DISTRIBUTED: every 4XX above left the entity untouched, and no error response carried an entity body"

  # ==========================================================================
  # Table 7 — RBAC (role_model: segregation_of_duties)
  # ==========================================================================
  - section: RBAC
    instances:
      - name: corner_every_exclusive_operation_is_reachable_only_by_its_owning_role
        claim_type: exclusive_operations
        grounds:
          - roles.PricingAdmin
          - roles.ComplianceOfficer
          - roles.StoreManager
          - roles.PriceAuditor
          - validations.priority_20
        distinguishing_aspect: "Each of the four roles that owns exclusive operations is shown succeeding at one of them while a differently-privileged role is refused the same call, and the last pair proves the priority-20 role check runs before any state check: a StoreManager gets 403 on issue-findings even though the inspection has already left SCHEDULED."
        test_recipe:
          setup:
            - "One store staffed with a certified STORE_MANAGER, LABEL_ASSOCIATE and PRICE_AUDITOR plus one unassigned aisle."
