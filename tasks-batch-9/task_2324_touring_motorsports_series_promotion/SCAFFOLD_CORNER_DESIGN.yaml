      - name: corner_season_closes_only_when_the_last_outstanding_stop_settles
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Season.PLANNING_to_CLOSED
          - state_machines.TourStop.SALES_CLOSED_to_SETTLED
          - entities.Season.fields.settled_stop_count
          - entities.Season.fields.season_net_cents
        distinguishing_aspect: "Bubble-up: the Season's own status is never written by a request, it is derived from its children. With two stops in the season, approving the first settlement must leave status PLANNING with settled_stop_count 1; only when the second stop is CANCELLED (also a terminal outcome) does the season close."
