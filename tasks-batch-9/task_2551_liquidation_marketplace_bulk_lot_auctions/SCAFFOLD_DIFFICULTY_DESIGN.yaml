              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lotp1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lotp1}/manifest-reviews"
              payload: { decision: "APPROVE" }
