            - "second response: meta.total_count == 2"
            - "ChangeRequest.${cr1_id}.legal_decision == PENDING"
            - "ChangeRequest.${cr1_id}.brand_decision == PENDING"
            - "ChangeRequest.${cr2_id}.author_user_id == \"author_1\""

      - name: retailer_listing_create_starts_with_both_score_variants_at_zero
        claim_type: computed_fields
        grounds:
          - entities.RetailerListing.fields.completeness_score_declared
          - entities.RetailerListing.fields.completeness_score_certified
          - entities.RetailerListing.fields.readiness_score
          - entities.RetailerListing.fields.syndication_state
          - entities.RetailerListing.fields.shelf_state
          - calculations.listing_completeness_score
        distinguishing_aspect: "A brand-new listing on a retailer that already has a REQUIRED requirement scores 0.00 on both variants because the product has no revision at all, which is the null-source-version branch rather than the D == 0 branch."
        test_recipe:
          setup:
            - "Retailer RETS has title REQUIRED (weight 40) so D == 60, and product SKU-G-5 exists with NO ContentVersion and no media asset"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", min_image_count: 1 }
              as: ShelfAdmin
              captures: { rz_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rz_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-G-5", gtin: "00012345679001", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pz_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pz_id}", retailer_id: "${rz_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { lz_id: $.data.id }
            - call: "GET /digital-shelf/retailer-listings/${lz_id}/completeness"
              payload: {}
              as: ContentAuthor
              captures: { z_decl: $.data.declared_score, z_cert: $.data.certified_score, z_dtot: $.data.requirement_weight_total, z_src: $.data.declared_source_content_version_id }
          assert:
            - "HTTP 201"
            - "RetailerListing.${lz_id}.completeness_score_declared == 0.00"
            - "RetailerListing.${lz_id}.completeness_score_certified == 0.00"
            - "RetailerListing.${lz_id}.readiness_score == 0.00"
            - "RetailerListing.${lz_id}.syndication_state == NOT_SYNDICATED"
            - "RetailerListing.${lz_id}.shelf_state == OK"
            - "RetailerListing.${lz_id}.pinned_content_version_id == null"
            - "RetailerListing.${lz_id}.open_blocking_error_count == 0"
            - "${z_decl} == 0.00 and ${z_cert} == 0.00"
            - "${z_dtot} == 40.00   # requirement weights only; IMAGE_WEIGHT 20 is added separately to D"
            - "${z_src} == null"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: change_request_and_target_revision_both_sit_in_draft_before_submit
        claim_type: initial_state
        grounds:
          - state_machines.ChangeRequest.initial_state
          - state_machines.ContentVersion.initial_state
          - entities.ChangeRequest.fields.legal_review_state
          - entities.ChangeRequest.fields.brand_review_state
          - entities.ChangeRequest.fields.submitted_at
        distinguishing_aspect: "Before any submit the ChangeRequest is DRAFT with submitted_at null and both track dimensions PENDING, and its target revision is still DRAFT with pin_count 0."
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1 and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and one DRAFT revision carrying only title, image_count 1, and is listed on SimpleMart"
            - "a ChangeRequest authored by author_1 targets that revision but has NOT been submitted"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/change-requests/${crd_id}"
              payload: {}
              as: ContentAuthor
              captures: { cr_state: $.data.state, cr_sub: $.data.submitted_at }
            - call: "GET /digital-shelf/content-versions/${vd1_id}"
              payload: {}
              as: ContentAuthor
              captures: { v_state: $.data.state, v_pins: $.data.pin_count }
          assert:
            - "${cr_state} == \"DRAFT\""
            - "${cr_sub} == null"
            - "${v_state} == \"DRAFT\""
            - "${v_pins} == 0"
            - "ChangeRequest.${crd_id}.legal_review_state == PENDING"
            - "ChangeRequest.${crd_id}.brand_review_state == PENDING"
            - "ChangeRequest.${crd_id}.legal_reviewer_user_id == null"
            - "ChangeRequest.${crd_id}.brand_reviewer_user_id == null"
            - "ChangeRequest.${crd_id}.author_user_id == \"author_1\""
            - "RetailerListing.${ld_id}.pinned_content_version_id == null"
            - "Product.${pd_id}.status == DRAFT"

      - name: submit_forks_both_tracks_and_freezes_the_target_revision
        claim_type: valid_transition
        grounds:
          - state_machines.ChangeRequest.DRAFT_to_IN_REVIEW
          - state_machines.ContentVersion.DRAFT_to_IN_REVIEW
          - endpoints["POST /digital-shelf/change-requests/{id}/submit"]
        distinguishing_aspect: "One submit call moves two entities at once: the request to IN_REVIEW with submitted_at stamped from the logical clock and the target revision to IN_REVIEW, while nothing is pinned and no score changes."
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1 and title REQUIRED (weight 40), so D == 60"
            - "product SKU-D-1 has one DRAFT revision carrying title and image_count 1, listed on SimpleMart, with a DRAFT ChangeRequest authored by author_1 targeting that revision"
            - "the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
