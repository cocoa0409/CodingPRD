# =============================================================================
# Scaffold: Tuition Payment Plan benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Tuition Payment Plan: enrollment & installment schedule, plan fee, down payment,
  autopay, late fee & hold, balance recalculation on charges/aid, refund/withdrawal
  proration, per-term enrollment

domain_name: tuition-payment-plan
api_prefix: /institutions

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Pricing engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution display name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code; cents-denominated throughout" }
      - { name: clock_utc, type: datetime, source: system, description: "Institution-scoped current UTC clock; advanced only via /_clock/set_current_utc; all date math reads this, never wall-clock" }
      - { name: refund_policy, type: enum, source: input, default: "DATE_BASED", description: "DATE_BASED | SCHEDULE_BASED — selects which withdrawal-proration variant the institution uses" }

  - name: AcademicTerm
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id" }
      - { name: code, type: string, source: input, description: "Term code e.g. FALL2026; unique among AcademicTerm with status IN {OPEN, LOCKED} for the institution" }
      - { name: term_start, type: datetime, source: input, description: "First day of term (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Last day of term (inclusive); term_total_days = floor((term_end - term_start)/1 day) + 1, must be >= 1 else ERR_INVALID_TERM_WINDOW" }
      - { name: enroll_open, type: datetime, source: input, description: "Enrollment window open (inclusive)" }
      - { name: enroll_close, type: datetime, source: input, description: "Enrollment window close (inclusive); enroll_open <= enroll_close <= term_end" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> LOCKED -> CLOSED; OPEN accepts enrollments, LOCKED blocks new enrollments but services existing, CLOSED is terminal" }

  - name: Student
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id" }
      - { name: external_ref, type: string, source: input, description: "Registrar student id; unique per institution" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: has_active_hold, type: boolean, source: computed, default: false, description: "True iff the student has any Hold with status ACTIVE; gates registrar-side and student-side actions" }

  - name: PlanTemplate
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id" }
      - { name: name, type: string, source: input, description: "Template label e.g. 4-PAY" }
      - { name: installment_count, type: integer, source: input, description: "Number of financed installments N; integer >= 1 and <= 12 else ERR_INVALID_PLAN_TEMPLATE" }
      - { name: down_payment_pct, type: number, source: input, description: "Fraction of net-after-aid collected up-front at activation; 0 <= x <= 0.5 else ERR_INVALID_PLAN_TEMPLATE" }
      - { name: plan_fee_cents, type: integer, source: input, description: "Flat non-refundable enrollment fee collected at activation; >= 0" }
      - { name: late_fee_grace_days, type: integer, source: input, default: 3, description: "Days after installment due_date before an installment becomes OVERDUE and a late fee may assess; >= 0" }
      - { name: autopay_required, type: boolean, source: input, default: false, description: "If true, every Enrollment on this template must activate with autopay_enabled=true else ERR_AUTOPAY_REQUIRED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED; RETIRED templates cannot back new enrollments (ERR_TEMPLATE_RETIRED)" }

  - name: Enrollment
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: term_id, type: string, source: input, description: "FK -> AcademicTerm.id; the term this enrollment finances" }
      - { name: plan_template_id, type: string, source: input, description: "FK -> PlanTemplate.id; snapshotted into fee fields at activation" }
      - { name: installment_count, type: integer, source: system, description: "Snapshot of PlanTemplate.installment_count at activation" }
      - { name: down_payment_pct, type: number, source: system, description: "Snapshot of PlanTemplate.down_payment_pct at activation" }
      - { name: plan_fee_cents, type: integer, source: system, description: "Snapshot of PlanTemplate.plan_fee_cents at activation" }
      - { name: autopay_enabled, type: boolean, source: input, default: false, description: "Whether installments are auto-charged on due date" }
      - { name: gross_charges_cents, type: integer, source: computed, description: "Sum of Charge.amount_cents for Charge.status=POSTED on this enrollment" }
      - { name: total_aid_cents, type: integer, source: computed, description: "Sum of FinancialAid.amount_cents for FinancialAid.status=APPLIED on this enrollment" }
      - { name: net_after_aid_cents, type: integer, source: computed, description: "max(0, gross_charges_cents - total_aid_cents); the conserved tuition principal" }
      - { name: down_payment_cents, type: integer, source: computed, description: "round_half_up(net_after_aid_cents * down_payment_pct) computed at activation; immutable after activation" }
      - { name: financed_principal_cents, type: integer, source: computed, description: "net_after_aid_cents - down_payment_cents at activation; baseline that installment schedule sums to before later deltas" }
      - { name: scheduled_balance_cents, type: integer, source: computed, description: "Sum of Installment.amount_cents for Installment.status IN {SCHEDULED, OVERDUE}; the still-owed financed amount" }
      - { name: paid_principal_cents, type: integer, source: computed, description: "Sum of Installment.amount_cents for Installment.status=PAID plus down_payment_cents once collected" }
      - { name: late_fee_balance_cents, type: integer, source: computed, description: "Sum of LateFee.amount_cents for LateFee.status=ASSESSED on this enrollment; capped per MAX_TOTAL_LATE_FEE_CENTS" }
      - { name: delinquent_installment_count, type: integer, source: computed, description: "Count of Installment with status=OVERDUE on this enrollment" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> ACTIVE -> {COMPLETED, WITHDRAWN}; PENDING awaits activation, ACTIVE services installments, COMPLETED when all installments PAID, WITHDRAWN is terminal after refund proration" }

  - name: Installment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: sequence_index, type: integer, source: system, description: "1-based position in the schedule; ordering key for remainder allocation and aid reduction" }
      - { name: due_date, type: datetime, source: system, description: "Scheduled due date; due_date[k] = term_start + k * floor(term_total_days / (installment_count + 1)) days" }
      - { name: amount_cents, type: integer, source: computed, description: "Current scheduled amount; recomputed on charge/aid deltas while status=SCHEDULED" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Cumulative Payment.amount_cents applied to this installment for Payment.status=SETTLED" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> {PAID, OVERDUE}; OVERDUE -> {PAID}; PAID terminal; OVERDUE set when clock_utc > due_date + grace and still unpaid" }

  - name: Charge
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: kind, type: enum, source: input, description: "TUITION | FEE | HOUSING — informational category" }
      - { name: amount_cents, type: integer, source: input, description: "Positive charge amount in cents; > 0 else ERR_INVALID_AMOUNT" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED -> REVERSED; POSTED contributes to gross_charges_cents, REVERSED is excluded and triggers recalc" }

  - name: FinancialAid
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: source, type: enum, source: input, description: "GRANT | SCHOLARSHIP | LOAN — informational" }
      - { name: amount_cents, type: integer, source: input, description: "Positive aid amount in cents; > 0 else ERR_INVALID_AMOUNT" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED -> CANCELLED; APPLIED reduces net_after_aid, CANCELLED is excluded and triggers recalc" }

  - name: Payment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: installment_id, type: string, source: input, description: "FK -> Installment.id; null when purpose=DOWN_PAYMENT" }
      - { name: purpose, type: enum, source: input, description: "DOWN_PAYMENT | INSTALLMENT | AUTOPAY — DOWN_PAYMENT settles activation due, INSTALLMENT/AUTOPAY settle one installment" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered in cents; > 0 else ERR_INVALID_AMOUNT" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> {SETTLED, FAILED}; SETTLED applies to installment/down ledger, FAILED leaves balances untouched" }

  - name: LateFee
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: installment_id, type: string, source: system, description: "FK -> Installment.id; the OVERDUE installment that triggered the fee" }
      - { name: days_late, type: integer, source: system, description: "clock_utc-day minus due_date-day at assessment; drives the tier" }
      - { name: amount_cents, type: integer, source: computed, description: "Tiered late-fee amount; see calculation late_fee_assessment" }
      - { name: status, type: enum, source: system, default: "ASSESSED", description: "ASSESSED -> WAIVED; ASSESSED adds to late_fee_balance, WAIVED reverses it" }

  - name: Hold
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the delinquent enrollment that raised the hold" }
      - { name: reason, type: enum, source: system, description: "DELINQUENCY_COUNT | DELINQUENCY_AMOUNT — which threshold tripped" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> RELEASED; ACTIVE sets Student.has_active_hold, RELEASED clears it when delinquency cured" }

  - name: Withdrawal
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: effective_date, type: datetime, source: input, description: "Withdrawal effective date; clamped to [term_start, term_end]; days_elapsed = floor((effective_date - term_start)/1 day) + 1" }
      - { name: variant_used, type: enum, source: computed, description: "DATE_BASED | SCHEDULE_BASED — copied from Institution.refund_policy at withdrawal" }
      - { name: retained_charges_cents, type: integer, source: computed, description: "Institution-retained portion of gross_charges after proration; see refund_proration" }
      - { name: net_owed_after_withdrawal_cents, type: integer, source: computed, description: "max(0, retained_charges_cents - total_aid_cents - paid_principal_cents)" }
      - { name: refund_to_student_cents, type: integer, source: computed, description: "max(0, paid_principal_cents - max(0, retained_charges_cents - total_aid_cents)); cash returned to the student" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AcademicTerm
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /institutions/terms/{termId}/lock"
        actor: Registrar
        preconditions:
          - "Term status == OPEN else ERR_INVALID_STATE"
        side_effects:
          - "Block creation of new Enrollment on this term (existing enrollments continue to be serviced)"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /institutions/terms/{termId}/close"
        actor: Registrar
        preconditions:
          - "Term status == LOCKED else ERR_INVALID_STATE"
          - "No Enrollment on this term has status IN {PENDING, ACTIVE} with scheduled_balance_cents > 0 else ERR_TERM_HAS_OPEN_BALANCES"
        side_effects: []

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /institutions/enrollments/{enrollmentId}/activate"
        actor: Registrar
        preconditions:
          - "Enrollment status == PENDING else ERR_INVALID_STATE"
          - "AcademicTerm.status == OPEN else ERR_TERM_NOT_OPEN (cross-entity: Enrollment activation depends on AcademicTerm state)"
          - "clock_utc within [enroll_open, enroll_close] else ERR_OUTSIDE_ENROLL_WINDOW"
          - "PlanTemplate.status == ACTIVE else ERR_TEMPLATE_RETIRED"
          - "Student.has_active_hold == false else ERR_STUDENT_ON_HOLD (cross-entity: Enrollment activation depends on Student/Hold state)"
          - "gross_charges_cents > 0 else ERR_NO_CHARGES_TO_FINANCE"
          - "If PlanTemplate.autopay_required: autopay_enabled == true else ERR_AUTOPAY_REQUIRED"
          - "request carries expected_enrollment_version matching Enrollment.version else ERR_STALE_VERSION (412)"
        side_effects:
          - "Snapshot installment_count, down_payment_pct, plan_fee_cents from PlanTemplate onto Enrollment"
          - "Run installment_schedule calculation: compute down_payment_cents, financed_principal_cents, and create installment_count Installment rows (status=SCHEDULED) with amount_cents per schedule and due_date per cadence"
          - "Recompute Enrollment.net_after_aid_cents, scheduled_balance_cents"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when every Installment.status==PAID and down payment collected)"
        actor: system
        preconditions:
          - "All Installment.status == PAID"
          - "down_payment_cents fully settled"
        side_effects:
          - "scheduled_balance_cents == 0"
          - "If Student has an ACTIVE Hold whose enrollment_id == this enrollment, release it (Hold ACTIVE->RELEASED), then recompute Student.has_active_hold"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /institutions/enrollments/{enrollmentId}/withdraw"
        actor: Registrar
        preconditions:
          - "Enrollment status == ACTIVE else ERR_INVALID_STATE"
          - "request carries expected_enrollment_version matching Enrollment.version else ERR_STALE_VERSION (412)"
        side_effects:
          - "Create Withdrawal: run refund_proration (variant per Institution.refund_policy) computing retained_charges_cents, net_owed_after_withdrawal_cents, refund_to_student_cents"
          - "Cascade hop 1: cancel every Installment.status IN {SCHEDULED, OVERDUE} on this enrollment (Installment -> CANCELLED is modeled as removal from scheduled_balance via WITHDRAWN parent; their amounts no longer count)"
          - "Cascade hop 2: each cancelled OVERDUE installment that still carries an ASSESSED LateFee leaves the LateFee ASSESSED (late fees survive withdrawal and remain owed)"
          - "Cascade hop 3: recompute delinquent_installment_count to 0; if it falls below thresholds, release any ACTIVE Hold for this enrollment (Hold ACTIVE->RELEASED) and recompute Student.has_active_hold"
          - "increments Enrollment.version by 1"

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "system (on Payment SETTLED whose installment_id == this and cumulative paid_amount_cents >= amount_cents)"
        actor: system
        preconditions:
          - "paid_amount_cents >= amount_cents"
        side_effects:
          - "Recompute Enrollment.scheduled_balance_cents and paid_principal_cents"
          - "Bubble-up: if all Installment.status==PAID, Enrollment ACTIVE->COMPLETED"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /institutions/enrollments/{enrollmentId}/run-delinquency (or system on clock advance)"
        actor: Registrar
        preconditions:
          - "clock_utc-day > due_date-day + late_fee_grace_days"
          - "paid_amount_cents < amount_cents"
        side_effects:
          - "Run late_fee_assessment: create LateFee (status=ASSESSED) honoring per-enrollment cap"
          - "Increment Enrollment.delinquent_installment_count"
          - "Run delinquency_evaluation: if threshold tripped and no ACTIVE Hold, create Hold (status=ACTIVE) and set Student.has_active_hold=true"
      - from: OVERDUE
        to: PAID
        trigger: "system (on Payment SETTLED whose installment_id == this and cumulative paid_amount_cents >= amount_cents)"
        actor: system
        preconditions:
          - "paid_amount_cents >= amount_cents"
        side_effects:
          - "Decrement Enrollment.delinquent_installment_count"
          - "Recompute Enrollment.scheduled_balance_cents and paid_principal_cents"
          - "Run delinquency_evaluation: if no thresholds remain tripped, release this enrollment's ACTIVE Hold (Hold ACTIVE->RELEASED), recompute Student.has_active_hold"
          - "Bubble-up: if all Installment.status==PAID, Enrollment ACTIVE->COMPLETED"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /institutions/payments/{paymentId}/settle"
        actor: Bursar
        preconditions:
          - "Payment status == PENDING else ERR_INVALID_STATE"
          - "Parent Enrollment.status == ACTIVE else ERR_ENROLLMENT_NOT_ACTIVE"
          - "If purpose==DOWN_PAYMENT: down payment not already collected else ERR_DOWN_PAYMENT_ALREADY_PAID"
          - "If purpose IN {INSTALLMENT, AUTOPAY}: target Installment.status IN {SCHEDULED, OVERDUE} else ERR_INSTALLMENT_NOT_PAYABLE"
        side_effects:
          - "If DOWN_PAYMENT: mark down payment collected; paid_principal_cents += down_payment_cents"
          - "If INSTALLMENT/AUTOPAY: target Installment.paid_amount_cents += amount_cents; if >= amount_cents drive Installment to PAID (cascade per Installment SM)"
      - from: PENDING
        to: FAILED
        trigger: "POST /institutions/payments/{paymentId}/fail"
        actor: Bursar
        preconditions:
          - "Payment status == PENDING else ERR_INVALID_STATE"
        side_effects:
          - "No ledger change; if this was an AUTOPAY attempt for an installment past grace, the installment may be driven OVERDUE by a subsequent run-delinquency"

  - entity: Hold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /institutions/holds/{holdId}/release (Registrar) or system (delinquency cured)"
        actor: Registrar
        preconditions:
          - "Hold status == ACTIVE else ERR_INVALID_STATE"
          - "Manual release allowed only when delinquent_installment_count < DELINQUENCY_COUNT_LIMIT and total overdue < DELINQUENCY_AMOUNT_LIMIT else ERR_DELINQUENCY_UNRESOLVED"
        side_effects:
          - "Recompute Student.has_active_hold from remaining ACTIVE holds"

  - entity: Charge
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /institutions/charges/{chargeId}/reverse"
        actor: Registrar
        preconditions:
          - "Charge status == POSTED else ERR_INVALID_STATE"
          - "Parent Enrollment.status IN {PENDING, ACTIVE} else ERR_ENROLLMENT_NOT_ACTIVE"
        side_effects:
          - "Recompute Enrollment.gross_charges_cents, net_after_aid_cents"
          - "If Enrollment ACTIVE: run balance_recalc_on_charge (negative delta) re-spreading across SCHEDULED installments"

  - entity: FinancialAid
    initial_state: APPLIED
    terminal_states: [CANCELLED]
    transitions:
      - from: APPLIED
        to: CANCELLED
        trigger: "POST /institutions/aids/{aidId}/cancel"
        actor: Registrar
        preconditions:
          - "FinancialAid status == APPLIED else ERR_INVALID_STATE"
          - "Parent Enrollment.status IN {PENDING, ACTIVE} else ERR_ENROLLMENT_NOT_ACTIVE"
        side_effects:
          - "Recompute Enrollment.total_aid_cents, net_after_aid_cents"
          - "If Enrollment ACTIVE: run balance_recalc_on_aid (aid removal increases owed) re-spreading across SCHEDULED installments"

  - entity: LateFee
    initial_state: ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /institutions/late-fees/{lateFeeId}/waive"
        actor: Registrar
        preconditions:
          - "LateFee status == ASSESSED else ERR_INVALID_STATE"
        side_effects:
          - "Recompute Enrollment.late_fee_balance_cents = sum(LateFee.amount_cents WHERE status==ASSESSED); the waived fee is removed exactly (compensating reversal)"

  - entity: PlanTemplate
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /institutions/plan-templates/{planTemplateId}/retire"
        actor: Registrar
        preconditions:
          - "PlanTemplate status == ACTIVE else ERR_INVALID_STATE"
        side_effects:
          - "RETIRED templates cannot back new enrollment activations (ERR_TEMPLATE_RETIRED); existing snapshots on already-activated enrollments are unaffected"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-activate-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /institutions/enrollments/{enrollmentId}/activate"
    occ_field: "expected_enrollment_version"
    description: |
      Activating an Enrollment whose version has advanced since the client last
      observed it is rejected. A Charge reversal or FinancialAid application
      cascades a recompute that bumps Enrollment.version between the client's
      read and the activate call, so the client's snapshot of the financed
      principal is stale and the schedule it expects no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-withdraw-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /institutions/enrollments/{enrollmentId}/withdraw"
    occ_field: "expected_enrollment_version"
    description: |
      Withdrawing an Enrollment whose version has advanced since the client last
      observed it is rejected. A settled installment payment or a charge reversal
      cascades a balance recompute that bumps Enrollment.version, so the
      paid_principal_cents the client assumed when computing the expected refund
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: installment_schedule
    trigger: "Enrollment PENDING->ACTIVE activation"
    algorithm: waterfall_allocation
    formula: |
      net_after_aid = max(0, gross_charges_cents - total_aid_cents)
      down_payment_cents = round_half_up(net_after_aid * down_payment_pct)   # ROUND HERE FIRST
      financed_principal = net_after_aid - down_payment_cents
      N = installment_count
      base = floor(financed_principal / N)                # per-installment floor
      remainder = financed_principal - base * N           # 0 <= remainder < N
      for k in 1..N (by sequence_index ascending):
        amount_cents[k] = base + (1 if k <= remainder else 0)   # remainder onto EARLIEST
      # invariant: sum(amount_cents) == financed_principal exactly
      cadence_days = floor(term_total_days / (N + 1))
      due_date[k] = term_start + k * cadence_days days
    input_set: "POSTED charges and APPLIED aid on the enrollment at activation time only"
    constants: {}
    precision: "cents integer; round_half_up applied to down payment BEFORE flooring the financed split"

  - name: balance_recalc_on_charge
    trigger: "Charge POSTED creation or Charge POSTED->REVERSED while Enrollment ACTIVE"
    algorithm: constraint_propagation
    formula: |
      delta_financed = (new_net_after_aid - old_net_after_aid)   # signed; down payment NOT re-collected on deltas
      remaining = [Installment with status==SCHEDULED ordered by sequence_index ascending]
      M = count(remaining)
      if M == 0: raise ERR_NO_SCHEDULED_INSTALLMENTS   # cannot re-spread onto fully-paid plan
      if delta_financed >= 0:
        base = floor(delta_financed / M); rem = delta_financed - base*M
        for j-th remaining (j=0-based ascending): amount_cents += base + (1 if j < rem else 0)   # add onto EARLIEST
      else:
        credit = -delta_financed
        for remaining in DESCENDING sequence_index:    # reduce from LATEST first
          take = min(amount_cents, credit); amount_cents -= take; credit -= take
          if credit == 0: break
      recompute scheduled_balance_cents = sum(remaining amount_cents) + sum(OVERDUE amount_cents)
    input_set: "Only Installment.status==SCHEDULED participate; PAID and OVERDUE installments are frozen at their amount"
    constants: {}
    precision: "cents integer; positive delta floors-then-remainder onto earliest, negative delta reduces from latest"

  - name: balance_recalc_on_aid
    trigger: "FinancialAid APPLIED creation or FinancialAid APPLIED->CANCELLED while Enrollment ACTIVE"
    algorithm: constraint_propagation
    formula: |
      # Aid application is a NEGATIVE delta to financed principal (reduces owed);
      # aid cancellation is a POSITIVE delta (increases owed). Same re-spread engine
      # as balance_recalc_on_charge but driven by the aid ledger; the DIRECTION of
      # the conserved-quantity adjustment is opposite a same-magnitude charge.
      delta_financed = (new_net_after_aid - old_net_after_aid)
      remaining = [Installment with status==SCHEDULED ordered by sequence_index ascending]
      M = count(remaining)
      if M == 0: raise ERR_NO_SCHEDULED_INSTALLMENTS
      if delta_financed >= 0:
        base = floor(delta_financed / M); rem = delta_financed - base*M
        for j-th remaining ascending: amount_cents += base + (1 if j < rem else 0)
      else:
        credit = -delta_financed
        for remaining in DESCENDING sequence_index:
          take = min(amount_cents, credit); amount_cents -= take; credit -= take
          if credit == 0: break
    input_set: "Only Installment.status==SCHEDULED; aid applies as a reduction from the latest unpaid installment backward"
    constants: {}
    precision: "cents integer"

  - name: late_fee_assessment
    trigger: "Installment SCHEDULED->OVERDUE"
    algorithm: tiered_pricing
    formula: |
      overdue = installment.amount_cents - installment.paid_amount_cents
      days_late = clock_utc_day - due_date_day            # integer days, >= grace+1 here
      if days_late < 1: return 0
      elif days_late < 10: pct = 0.02                     # tier 1: 1-9 days
      elif days_late < 30: pct = 0.04                     # tier 2: 10-29 days
      else: pct = 0.06                                    # tier 3: >= 30 days
      pct_amount = round_half_up(overdue * pct)
      fee = max(FLAT_FEE_CENTS, pct_amount)               # at least the flat floor
      fee = max(MIN_FEE_CENTS, min(MAX_FEE_CENTS, fee))   # clamp into band
      # Per-enrollment aggregate cap:
      remaining_cap = MAX_TOTAL_LATE_FEE_CENTS - late_fee_balance_cents
      fee = max(0, min(fee, remaining_cap))               # cap may zero out the fee
    input_set: "Single OVERDUE installment plus the enrollment's running late_fee_balance_cents"
    constants:
      FLAT_FEE_CENTS: 2500
      MIN_FEE_CENTS: 2500
      MAX_FEE_CENTS: 7500
      MAX_TOTAL_LATE_FEE_CENTS: 30000
    precision: "cents integer, round_half_up on the percentage term; >= and < boundaries pin the day tiers"

  - name: delinquency_evaluation
    trigger: "Installment SCHEDULED->OVERDUE, Installment OVERDUE->PAID, Enrollment withdraw"
    algorithm: threshold
    formula: |
      count = delinquent_installment_count   # number of OVERDUE installments
      total_overdue = sum(amount_cents - paid_amount_cents for Installment.status==OVERDUE)
      tripped = (count >= DELINQUENCY_COUNT_LIMIT) OR (total_overdue >= DELINQUENCY_AMOUNT_LIMIT)
      if tripped and no ACTIVE Hold for this enrollment:
        create Hold(status=ACTIVE, reason = DELINQUENCY_COUNT if count>=limit else DELINQUENCY_AMOUNT)
        Student.has_active_hold = true
      if not tripped and an ACTIVE Hold for this enrollment exists:
        Hold ACTIVE->RELEASED; recompute Student.has_active_hold
    input_set: "OVERDUE installments on the enrollment"
    constants:
      DELINQUENCY_COUNT_LIMIT: 3
      DELINQUENCY_AMOUNT_LIMIT: 150000
    precision: "integer count and cents; >= boundaries on both the count and the amount"

  - name: refund_proration
    trigger: "Enrollment ACTIVE->WITHDRAWN"
    algorithm: forward_looking
    formula: |
      days_elapsed = floor((clamp(effective_date, term_start, term_end) - term_start)/1 day) + 1
      pct_elapsed = days_elapsed / term_total_days
      # VARIANT A (DATE_BASED, forward-looking continuous):
      retained_charges_cents = round_half_up(gross_charges_cents * pct_elapsed)
      # VARIANT B (SCHEDULE_BASED, fixed bracket on days_elapsed):
      #   days_elapsed <= 7   -> retained 0%
      #   8  <= days_elapsed <= 21 -> retained 25%
      #   22 <= days_elapsed <= 42 -> retained 50%
      #   days_elapsed > 42   -> retained 100%
      retained_charges_cents = round_half_up(gross_charges_cents * bracket_pct)
      # COMMON settlement (same for both variants):
      net_owed_after_withdrawal_cents = max(0, retained_charges_cents - total_aid_cents - paid_principal_cents)
      refund_to_student_cents = max(0, paid_principal_cents - max(0, retained_charges_cents - total_aid_cents))
      # Cash invariant: paid_principal_cents == refund_to_student_cents + min(paid_principal_cents, max(0, retained_charges_cents - total_aid_cents))
    input_set: "gross_charges_cents (POSTED), total_aid_cents (APPLIED), paid_principal_cents at withdrawal time"
    constants:
      BRACKET_0_DAYS: 7
      BRACKET_25_DAYS: 21
      BRACKET_50_DAYS: 42
    precision: "cents integer, round_half_up on the prorated retained charge"
    variants:
      - name: date_based_continuous
        when: "Institution.refund_policy == DATE_BASED"
        difference: "retained = gross_charges * (days_elapsed / term_total_days), a continuous day-proportional fraction"
      - name: schedule_based_bracket
        when: "Institution.refund_policy == SCHEDULE_BASED"
        difference: "retained = gross_charges * bracket_pct, a step function of days_elapsed (0/25/50/100%); same inputs yield a different retained amount than date_based_continuous"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist within the institution, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: amounts > 0, enum members valid, plan template integer/fraction in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create endpoints"

  - priority: 5
    category: state
    check: "Target resource in a state where the transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Student.has_active_hold == false for registrar/student write actions on the student's enrollments (activate, create charge by registrar)"
    error_id: ERR_STUDENT_ON_HOLD
    http_status: 409
    applies_to: "enrollment activate, charge create"

  - priority: 7
    category: business_temporal
    check: "Enrollment activation occurs only while AcademicTerm.status==OPEN and clock within [enroll_open, enroll_close]"
    error_id: "ERR_TERM_NOT_OPEN > ERR_OUTSIDE_ENROLL_WINDOW"
    http_status: 409
    applies_to: "enrollment activate"

  - priority: 8
    category: business_safety
    check: "PlanTemplate.autopay_required satisfied: enrollment.autopay_enabled true when template demands it"
    error_id: ERR_AUTOPAY_REQUIRED
    http_status: 409
    applies_to: "enrollment activate"

  - priority: 9
    category: business_constraint
    check: "Enrollment has POSTED charges to finance (gross_charges_cents > 0) before activation"
    error_id: ERR_NO_CHARGES_TO_FINANCE
    http_status: 409
    applies_to: "enrollment activate"

  - priority: 10
    category: business_fiscal
    check: "Payment settle: down payment not double-collected; targeted installment is payable"
    error_id: "ERR_DOWN_PAYMENT_ALREADY_PAID > ERR_INSTALLMENT_NOT_PAYABLE"
    http_status: 409
    applies_to: "payment settle"

  - priority: 11
    category: business_referential
    check: "Term close blocked while any serviced enrollment retains an open balance"
    error_id: ERR_TERM_HAS_OPEN_BALANCES
    http_status: 409
    applies_to: "term close"

  - priority: 12
    category: business_constraint
    check: "Optimistic concurrency: expected_enrollment_version matches Enrollment.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "enrollment activate, enrollment withdraw"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Institution ---
  - method: POST
    path: "/institutions"
    description: "Create an institution"
    roles: [Registrar]
    code: 201
    input: [name, "currency?", "refund_policy?"]
    output: Institution
    side_effects: ["clock_utc initialized to epoch until set via /_clock/set_current_utc"]

  - method: GET
    path: "/institutions/{institutionId}"
    description: "Get an institution"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Institution
    side_effects: []

  - method: POST
    path: "/institutions/{institutionId}/_clock/set_current_utc"
    description: "Test-driving: set institution clock to an arbitrary UTC instant"
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: Institution
    side_effects: ["Institution.clock_utc = to_iso8601 (does not auto-run delinquency)"]

  # --- AcademicTerm (flat: /institutions/terms) ---
  - method: POST
    path: "/institutions/terms"
    description: "Create an academic term"
    roles: [Registrar]
    code: 201
    input: [institution_id, code, term_start, term_end, enroll_open, enroll_close]
    output: AcademicTerm
    side_effects: ["status=OPEN; ERR_INVALID_TERM_WINDOW if windows malformed"]

  - method: GET
    path: "/institutions/terms/{termId}"
    description: "Get a term"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []

  - method: GET
    path: "/institutions/terms"
    description: "List terms (reverse-reachability for AcademicTerm.institution_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["institution_id?", "status?"]
    output: "AcademicTerm[]"
    side_effects: []

  - method: POST
    path: "/institutions/terms/{termId}/lock"
    description: "Lock a term against new enrollments"
    roles: [Registrar]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["status OPEN->LOCKED"]

  - method: POST
    path: "/institutions/terms/{termId}/close"
    description: "Close a term"
    roles: [Registrar]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["status LOCKED->CLOSED if no open balances"]

  # --- Student (flat: /institutions/students) ---
  - method: POST
    path: "/institutions/students"
    description: "Create a student"
    roles: [Registrar]
    code: 201
    input: [institution_id, external_ref, full_name, email]
    output: Student
    side_effects: ["has_active_hold=false"]

  - method: GET
    path: "/institutions/students/{studentId}"
    description: "Get a student"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/institutions/students"
    description: "List students (reverse-reachability for Student.institution_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["institution_id?"]
    output: "Student[]"
    side_effects: []

  # --- PlanTemplate (flat: /institutions/plan-templates) ---
  - method: POST
    path: "/institutions/plan-templates"
    description: "Create a plan template"
    roles: [Registrar]
    code: 201
    input: [institution_id, name, installment_count, down_payment_pct, plan_fee_cents, "late_fee_grace_days?", "autopay_required?"]
    output: PlanTemplate
    side_effects: ["status=ACTIVE; ERR_INVALID_PLAN_TEMPLATE if count or pct out of range"]

  - method: GET
    path: "/institutions/plan-templates/{planTemplateId}"
    description: "Get a plan template"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: PlanTemplate
    side_effects: []

  - method: GET
    path: "/institutions/plan-templates"
    description: "List plan templates (reverse-reachability for PlanTemplate.institution_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["institution_id?", "status?"]
    output: "PlanTemplate[]"
    side_effects: []

  - method: POST
    path: "/institutions/plan-templates/{planTemplateId}/retire"
    description: "Retire a plan template"
    roles: [Registrar]
    code: 200
    input: []
    output: PlanTemplate
    side_effects: ["status ACTIVE->RETIRED"]

  # --- Enrollment (flat: /institutions/enrollments) ---
  - method: POST
    path: "/institutions/enrollments"
    description: "Create a PENDING enrollment for a student in a term"
    roles: [Registrar]
    code: 201
    input: [student_id, term_id, plan_template_id, "autopay_enabled?"]
    output: Enrollment
    side_effects: ["status=PENDING; no installments yet"]

  - method: GET
    path: "/institutions/enrollments/{enrollmentId}"
    description: "Get an enrollment (includes computed balance fields and version)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/institutions/enrollments"
    description: "List enrollments (reverse-reachability for Enrollment.student_id, .term_id, .plan_template_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["student_id?", "term_id?", "plan_template_id?", "status?"]
    output: "Enrollment[]"
    side_effects: []

  - method: POST
    path: "/institutions/enrollments/{enrollmentId}/activate"
    description: "Activate enrollment: snapshot fees, build installment schedule"
    roles: [Registrar]
    code: 200
    input: [expected_enrollment_version]
    output: Enrollment
    side_effects:
      - "status PENDING->ACTIVE"
      - "Run installment_schedule; create Installment rows; compute down_payment_cents, financed_principal_cents"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/institutions/enrollments/{enrollmentId}/withdraw"
    description: "Withdraw enrollment and run refund proration"
    roles: [Registrar]
    code: 200
    input: [effective_date, expected_enrollment_version]
    output: Enrollment
    side_effects:
      - "status ACTIVE->WITHDRAWN"
      - "Create Withdrawal; run refund_proration; cancel remaining installments; release hold if any"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/institutions/enrollments/{enrollmentId}/run-delinquency"
    description: "Sweep enrollment installments past grace into OVERDUE; assess late fees; evaluate holds"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "Each SCHEDULED installment past due_date+grace -> OVERDUE"
      - "Run late_fee_assessment per newly-OVERDUE installment"
      - "Run delinquency_evaluation; may create Hold"

  # --- Installment (flat: /institutions/installments) ---
  - method: GET
    path: "/institutions/installments/{installmentId}"
    description: "Get an installment"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Installment
    side_effects: []

  - method: GET
    path: "/institutions/installments"
    description: "List installments (reverse-reachability for Installment.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?", "status?"]
    output: "Installment[]"
    side_effects: []

  # --- Charge (flat: /institutions/charges) ---
  - method: POST
    path: "/institutions/charges"
    description: "Post a charge against an enrollment"
    roles: [Registrar]
    code: 201
    input: [enrollment_id, kind, amount_cents]
    output: Charge
    side_effects:
      - "status=POSTED; recompute gross_charges_cents, net_after_aid_cents"
      - "If Enrollment ACTIVE: run balance_recalc_on_charge (positive delta)"

  - method: GET
    path: "/institutions/charges/{chargeId}"
    description: "Get a charge"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: GET
    path: "/institutions/charges"
    description: "List charges (reverse-reachability for Charge.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?", "status?"]
    output: "Charge[]"
    side_effects: []

  - method: POST
    path: "/institutions/charges/{chargeId}/reverse"
    description: "Reverse a posted charge"
    roles: [Registrar]
    code: 200
    input: []
    output: Charge
    side_effects:
      - "status POSTED->REVERSED; recompute balances"
      - "If Enrollment ACTIVE: run balance_recalc_on_charge (negative delta)"

  # --- FinancialAid (flat: /institutions/aids) ---
  - method: POST
    path: "/institutions/aids"
    description: "Apply financial aid to an enrollment"
    roles: [Registrar]
    code: 201
    input: [enrollment_id, source, amount_cents]
    output: FinancialAid
    side_effects:
      - "status=APPLIED; recompute total_aid_cents, net_after_aid_cents"
      - "If Enrollment ACTIVE: run balance_recalc_on_aid (reduces owed)"

  - method: GET
    path: "/institutions/aids/{aidId}"
    description: "Get an aid record"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: FinancialAid
    side_effects: []

  - method: GET
    path: "/institutions/aids"
    description: "List aid (reverse-reachability for FinancialAid.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?", "status?"]
    output: "FinancialAid[]"
    side_effects: []

  - method: POST
    path: "/institutions/aids/{aidId}/cancel"
    description: "Cancel an applied aid"
    roles: [Registrar]
    code: 200
    input: []
    output: FinancialAid
    side_effects:
      - "status APPLIED->CANCELLED; recompute balances"
      - "If Enrollment ACTIVE: run balance_recalc_on_aid (increases owed)"

  # --- Payment (flat: /institutions/payments) ---
  - method: POST
    path: "/institutions/payments"
    description: "Create a PENDING payment (down payment, installment, or autopay)"
    roles: [Bursar, Student]
    code: 201
    input: [enrollment_id, purpose, amount_cents, "installment_id?"]
    output: Payment
    side_effects: ["status=PENDING; no ledger change until settled"]

  - method: GET
    path: "/institutions/payments/{paymentId}"
    description: "Get a payment"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/institutions/payments"
    description: "List payments (reverse-reachability for Payment.enrollment_id and Payment.installment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?", "installment_id?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/institutions/payments/{paymentId}/settle"
    description: "Settle a pending payment, applying it to the ledger"
    roles: [Bursar]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "status PENDING->SETTLED"
      - "Apply to down payment or installment; may drive Installment to PAID; may bubble Enrollment to COMPLETED"

  - method: POST
    path: "/institutions/payments/{paymentId}/fail"
    description: "Mark a pending payment failed (e.g. autopay decline)"
    roles: [Bursar]
    code: 200
    input: []
    output: Payment
    side_effects: ["status PENDING->FAILED; no ledger change"]

  # --- LateFee (flat: /institutions/late-fees) ---
  - method: GET
    path: "/institutions/late-fees/{lateFeeId}"
    description: "Get a late fee"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: LateFee
    side_effects: []

  - method: GET
    path: "/institutions/late-fees"
    description: "List late fees (reverse-reachability for LateFee.enrollment_id and LateFee.installment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?", "installment_id?", "status?"]
    output: "LateFee[]"
    side_effects: []

  - method: POST
    path: "/institutions/late-fees/{lateFeeId}/waive"
    description: "Waive an assessed late fee"
    roles: [Registrar]
    code: 200
    input: []
    output: LateFee
    side_effects:
      - "status ASSESSED->WAIVED; recompute late_fee_balance_cents (reverses the fee exactly)"

  # --- Hold (flat: /institutions/holds) ---
  - method: GET
    path: "/institutions/holds/{holdId}"
    description: "Get a hold"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: GET
    path: "/institutions/holds"
    description: "List holds (reverse-reachability for Hold.student_id and Hold.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["student_id?", "enrollment_id?", "status?"]
    output: "Hold[]"
    side_effects: []

  - method: POST
    path: "/institutions/holds/{holdId}/release"
    description: "Release a hold (only when delinquency cured)"
    roles: [Registrar]
    code: 200
    input: []
    output: Hold
    side_effects:
      - "status ACTIVE->RELEASED if delinquency cured else ERR_DELINQUENCY_UNRESOLVED"
      - "Recompute Student.has_active_hold"

  # --- Withdrawal (flat: /institutions/withdrawals) ---
  - method: GET
    path: "/institutions/withdrawals/{withdrawalId}"
    description: "Get a withdrawal"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []

  - method: GET
    path: "/institutions/withdrawals"
    description: "List withdrawals (reverse-reachability for Withdrawal.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["enrollment_id?"]
    output: "Withdrawal[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist in the institution" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or unknown enum member" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "Charge/aid/payment amount_cents is not strictly positive" }
  - { id: ERR_INVALID_TERM_WINDOW, http: 400, condition: "term_end < term_start, or enroll window violates enroll_open <= enroll_close <= term_end" }
  - { id: ERR_INVALID_PLAN_TEMPLATE, http: 400, condition: "installment_count out of [1,12] or down_payment_pct out of [0,0.5]" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state allowing this transition" }
  - { id: ERR_TERM_NOT_OPEN, http: 409, condition: "Enrollment activation attempted while AcademicTerm.status != OPEN" }
  - { id: ERR_OUTSIDE_ENROLL_WINDOW, http: 409, condition: "Enrollment activation attempted with clock outside [enroll_open, enroll_close]" }
  - { id: ERR_TEMPLATE_RETIRED, http: 409, condition: "Enrollment activation references a RETIRED plan template" }
  - { id: ERR_STUDENT_ON_HOLD, http: 409, condition: "Action blocked because Student.has_active_hold == true" }
  - { id: ERR_NO_CHARGES_TO_FINANCE, http: 409, condition: "Enrollment activation with gross_charges_cents == 0" }
  - { id: ERR_AUTOPAY_REQUIRED, http: 409, condition: "Plan template requires autopay but enrollment.autopay_enabled is false" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Charge reverse / aid cancel / payment settle requires an ACTIVE (or PENDING for charge/aid) enrollment" }
  - { id: ERR_DOWN_PAYMENT_ALREADY_PAID, http: 409, condition: "Settling a DOWN_PAYMENT when the down payment is already collected" }
  - { id: ERR_INSTALLMENT_NOT_PAYABLE, http: 409, condition: "Settling an installment payment against an installment not in {SCHEDULED, OVERDUE}" }
  - { id: ERR_NO_SCHEDULED_INSTALLMENTS, http: 409, condition: "A balance recalc delta cannot be re-spread because no SCHEDULED installments remain" }
  - { id: ERR_DELINQUENCY_UNRESOLVED, http: 409, condition: "Manual hold release attempted while delinquency thresholds still tripped" }
  - { id: ERR_TERM_HAS_OPEN_BALANCES, http: 409, condition: "Term close attempted while a serviced enrollment retains scheduled_balance_cents > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match Enrollment.version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Institution operator: manages terms, students, templates, enrollments, charges, aid, delinquency, holds, withdrawals"
    identity: "opaque"
    exclusive_operations:
      - "POST /institutions — create institution"
      - "POST .../terms, .../terms/{id}/lock, .../terms/{id}/close — term lifecycle"
      - "POST .../students — create student"
      - "POST .../plan-templates, .../plan-templates/{id}/retire — template lifecycle"
      - "POST .../students/{id}/enrollments — create enrollment"
      - "POST .../enrollments/{id}/activate — activate enrollment"
      - "POST .../enrollments/{id}/withdraw — withdraw enrollment"
      - "POST .../enrollments/{id}/run-delinquency — sweep delinquency"
      - "POST .../enrollments/{id}/charges, .../charges/{id}/reverse — charge lifecycle"
      - "POST .../enrollments/{id}/aids, .../aids/{id}/cancel — aid lifecycle"
      - "POST .../late-fees/{id}/waive — waive late fee"
      - "POST .../holds/{id}/release — release hold"
      - "POST .../_clock/set_current_utc — set institution clock (test-driving)"
    shared_operations:
      - "GET endpoints (shared with Bursar, Student)"

  - name: Bursar
    description: "Cashiering operator: creates and settles/fails payments; read access to ledger"
    identity: "opaque"
    exclusive_operations:
      - "POST .../payments/{id}/settle — settle a payment"
      - "POST .../payments/{id}/fail — fail a payment"
    shared_operations:
      - "POST .../enrollments/{id}/payments — create payment (shared with Student)"
      - "GET endpoints (shared with Registrar, Student)"

  - name: Student
    description: "Self-service payer: views own enrollments/ledger and initiates payments (down payment, installment)"
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST .../enrollments/{id}/payments — create payment (shared with Bursar)"
      - "GET endpoints (shared with Registrar, Bursar)"
