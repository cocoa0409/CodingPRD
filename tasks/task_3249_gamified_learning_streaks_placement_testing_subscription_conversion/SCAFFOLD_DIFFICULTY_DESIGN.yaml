              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { xp_after_practice: $.data.xp_awarded, n11_v2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "SKILL_DECAY" }
              as: PlatformAdmin
            - call: "PUT /lesson-nodes/${n11}/review"
              payload: { learner_id: "${ada}", expected_node_version: "${n11_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_state: $.data.state }
          assert:
            - "PracticeAttempt xp_awarded for the forward practice == ${xp_after_practice}"
            - "PracticeAttempt xp_awarded for the forward practice == 13"
            - "Learner.${ada}.xp_total == 13, unchanged by the compensating half"
            - "LessonNode.${n11}.state == \"UNLOCKED\""
            - "Learner.${ada}.leaf_count == 0, returning to its pre-practice value"
      - name: seat_add_and_remove_conserve_subscription_seats_used
        grounds:
          - state_machines.FamilyMembership.transitions.INVITED_to_ACTIVE
          - state_machines.FamilyMembership.transitions.ACTIVE_to_REMOVED
          - entities.Subscription.fields.seats_used
          - calculations.ComputeHeartAndEnergyLimits
        distinguishing_aspect: |
          The seat add paired with its seat removal conserves Subscription.seats_used at its pre-add
          value while restoring the member's heart allowance, so the named quota quantity shows no
          drift after the compensating call.
        test_recipe:
          setup:
            - "Ada owns an ACTIVE PLUS_FAMILY subscription with three seats and zero seats in use"
            - "Bea is a FREE learner holding a FamilyMembership in status INVITED"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /learners"
              payload: { display_name: "Bea", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { bea: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /subscriptions"
              payload: { learner_id: "${ada}", plan_code: "PLUS_FAMILY", seats_total: 3, auto_renew: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub: $.data.id, sub_v: $.data.version }
            - call: "POST /engagement-offers"
              payload: { learner_id: "${bea}", milestone_code: "STREAK_7" }
              as: PlatformAdmin
              captures: { offer: $.data.id }
          trigger:
            - call: "PUT /subscriptions/${sub}"
              payload: { expected_subscription_version: "${sub_v}", add_seat_learner_id: "${bea}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub_v2: $.data.version, seat: $.data.id, seats_after_add: $.data.seats_used }
            - call: "PUT /subscriptions/${sub}"
              payload: { expected_subscription_version: "${sub_v2}", remove_seat_learner_id: "${bea}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub_v3: $.data.version, seats_after_remove: $.data.seats_used }
          assert:
            - "Subscription.${sub}.seats_used == ${seats_after_remove}"
            - "Subscription.${sub}.seats_used == 0, equal to the pre-add value"
            - "the add recorded seats_used == 1 while the remove returned it to 0, so the pair conserves the quota quantity"
            - "FamilyMembership.${seat}.status == \"REMOVED\""
            - "Learner.${bea}.hearts_available == 5"
