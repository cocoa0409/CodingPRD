          rationale: "That §1.8 instance already triggers ERR_RICE_BATCH_NOT_APPROVED on POST /kiosk-ops/pack-lots from a MIXING batch and additionally proves it out-ranks the referential ERR_SOURCING_RECORD_NOT_FOUND, so a plain single-error §1.9 duplicate would add no coverage"
