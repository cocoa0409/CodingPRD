              captures: { ten1_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T2", contact_email: "t2@x.com" }
              as: PropertyManager
              captures: { ten2_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten1_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 0 }
              as: PropertyManager
              captures: { lease1_id: $.data.id }
            - call: "POST /leases/${lease1_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten2_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 0 }
              as: PropertyManager
              captures: { lease2_id: $.data.id }
            - call: "POST /leases/${lease2_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "OCCUPIED", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 1000000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease1_id}", pool_id: "${pool_id}", recon_year: 2025 }
