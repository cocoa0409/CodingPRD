      - call: POST /broadcasters
        payload:
          legal_name: B
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: SM3-A
          territory_code: US
          platform_class: LINEAR_TV
