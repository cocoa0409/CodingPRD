scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: work_create_success_returns_201
        claim_type: Creation
        grounds: [entities.Work, endpoints]
        distinguishing_aspect: "POST /copyright/works with all required fields returns 201 with a server-minted id, version==1, registration_status==UNREGISTERED, current_owner_name==author_name."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "Ann", owner_shares: [{ name: "Ann", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
          assert:
            - "Work.${w_id}.version == 1"
            - "Work.${w_id}.registration_status == UNREGISTERED"
            - "Work.${w_id}.current_owner_name == Ann"

      - name: create_work_missing_title_returns_validation
        claim_type: Required Fields
        grounds: [entities.Work.fields.title, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /copyright/works without title returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /copyright/works"
              payload: { work_type: "LITERARY", year_of_creation: 2024, author_name: "Ann", owner_shares: [{ name: "Ann", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_work_owner_shares_bad_sum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Work.fields.owner_shares, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "owner_shares summing to 9000 (not 10000) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "Ann", owner_shares: [{ name: "Ann", share_bps: 9000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_work_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Work, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /copyright/works/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /copyright/works/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: application_defaults_applied
        claim_type: Defaults
        grounds: [entities.Application.fields.claimant_count, entities.Application.fields.is_expedited]
        distinguishing_aspect: "POST /copyright/applications without claimant_count/is_expedited applies defaults claimant_count==1, is_expedited==false."
        test_recipe:
          setup: ["A Work exists"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.claimant_count == 1"
            - "Application.${app_id}.is_expedited == false"
            - "Application.${app_id}.status == DRAFT"

      - name: application_work_id_fk_nonexistent_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Application.fields.work_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /copyright/applications referencing an unknown work_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /copyright/applications"
              payload: { work_id: "00000000-0000-0000-0000-000000000000", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: register_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_UNDER_EXAMINATION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "register on a SUBMITTED application (not UNDER_EXAMINATION) returns ERR_INVALID_STATE (409); no Certificate created."
        test_recipe:
          setup: ["Application in SUBMITTED"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
          trigger:
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: deposit_accept_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Deposit.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED deposit returns ERR_INVALID_STATE (409) (terminal-state lockdown)."
        test_recipe:
          setup: ["Deposit ACCEPTED"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
          trigger:
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: dmca_restore_from_effective_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DmcaTakedown.COUNTERED_to_RESTORED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "restore on an EFFECTIVE (not COUNTERED) takedown returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Takedown EFFECTIVE, no counter-notice"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "VISUAL_ARTS", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns"
              payload: { work_id: "${w_id}", complainant_name: "C", infringing_url: "http://x/9" }
              as: Complainant
              as_user_id: "cx_1"
              captures: { td_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns/${td_id}/process"
              payload: {}
              as: Examiner
          trigger:
            - call: "POST /copyright/dmca-takedowns/${td_id}/restore"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: recordation_supersedes_prior
        claim_type: Side Effect Execution
        grounds: [state_machines.Recordation.RECORDED_to_SUPERSEDED, entities.Recordation.fields.status]
        distinguishing_aspect: "A second RECORDED recordation on the same work marks the prior recordation SUPERSEDED and sets Work.current_owner_name to the newest transferee."
        test_recipe:
          setup: ["Work with one RECORDED recordation (owner=Bob)"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id, w_v0: $.data.version }
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "A", transferee_name: "Bob", execution_date: "2026-05-01T00:00:00Z", expected_work_version: "${w_v0}" }
              as: Examiner
              captures: { rec1_id: $.data.id }
            - call: "GET /copyright/works/${w_id}"
              payload: {}
              as: Examiner
              captures: { w_v1: $.data.version }
          trigger:
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "Bob", transferee_name: "Cara", execution_date: "2026-05-02T00:00:00Z", expected_work_version: "${w_v1}" }
              as: Examiner
              captures: { rec2_id: $.data.id }
          assert:
            - "Recordation.${rec1_id}.status == SUPERSEDED"
            - "Recordation.${rec2_id}.status == RECORDED"
            - "Work.${w_id}.current_owner_name == Cara"

      - name: termination_cascade_reverses_posted_statements
        claim_type: Side Effect Execution
        grounds: [state_machines.Termination.NOTICE_SERVED_to_EFFECTIVE, state_machines.License.ACTIVE_to_TERMINATED, state_machines.RoyaltyStatement.POSTED_to_REVERSED]
        distinguishing_aspect: "Effectuating a termination terminates the license (link A), reverses its POSTED statements (link B), and zeroes escrow (link C)."
        test_recipe:
          setup: ["Registered work; ACTIVE license grant_date 1990-06-01; one POSTED statement (escrow 3333)"]
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 1988, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "1990-06-01T00:00:00Z", end_date: "2035-06-01T00:00:00Z", grant_date: "1990-06-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_id: $.data.id }
            - call: "POST /copyright/royalty-statements/${rs_id}/post"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/terminations"
              payload: { license_id: "${lic_id}", terminating_party_name: "A", notice_served_date: "2020-06-01T00:00:00Z", effective_date: "2026-06-01T00:00:00Z" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /copyright/terminations/${term_id}/effectuate"
              payload: {}
              as: Examiner
          assert:
            - "License.${lic_id}.status == TERMINATED"
            - "RoyaltyStatement.${rs_id}.status == REVERSED"
            - "License.${lic_id}.escrow_balance_cents == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: application_fee_single_basis_unpublished
        claim_type: Correct Result
        grounds: [calculations.application_fee, entities.Application.fields.fee_due_cents]
        distinguishing_aspect: "SINGLE_AUTHOR_SINGLE_WORK basis, claimant_count 1, unpublished, not expedited yields fee_due_cents==4500 (SINGLE_BASE)."
        test_recipe:
          setup: ["Unpublished Work; DRAFT app SINGLE_AUTHOR_SINGLE_WORK claimant_count 1"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }], is_published: false }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "SINGLE_AUTHOR_SINGLE_WORK", claimant_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { fee: $.data.fee_due_cents }
          assert:
            - "Application.${app_id}.fee_due_cents == 4500"

      - name: termination_before_window_earliest_returns_window_error
        claim_type: Boundary
        grounds: [calculations.termination_window, "errors[ERR_TERMINATION_WINDOW]"]
        distinguishing_aspect: "effective_date 2025-05-31 (one day before window_earliest 2025-06-01 for grant 1990-06-01) is rejected with ERR_TERMINATION_WINDOW (complements the >= inclusive boundary in §1.8)."
        test_recipe:
          setup: ["Registered work; ACTIVE license grant_date 1990-06-01; termination effective_date 2025-05-31"]
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 1988, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "1990-06-01T00:00:00Z", end_date: "2035-06-01T00:00:00Z", grant_date: "1990-06-01T00:00:00Z", royalty_rate_bps: 1000, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_id: $.data.id }
            - call: "POST /copyright/terminations"
              payload: { license_id: "${lic_id}", terminating_party_name: "A", notice_served_date: "2020-06-01T00:00:00Z", effective_date: "2025-05-31T00:00:00Z" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /copyright/terminations/${term_id}/effectuate"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TERMINATION_WINDOW"

      - name: dmca_restore_too_early_returns_error
        claim_type: Boundary
        grounds: [state_machines.DmcaTakedown.COUNTERED_to_RESTORED, "errors[ERR_RESTORE_TOO_EARLY]"]
        distinguishing_aspect: "restore at 2026-06-10 (day 9, before restoration_earliest 2026-06-11) returns ERR_RESTORE_TOO_EARLY."
        test_recipe:
          setup: ["Takedown COUNTERED with countered_at 2026-06-01; clock 2026-06-10"]
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "VISUAL_ARTS", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns"
              payload: { work_id: "${w_id}", complainant_name: "C", infringing_url: "http://x/5" }
              as: Complainant
              as_user_id: "cx_1"
              captures: { td_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns/${td_id}/process"
              payload: {}
              as: Examiner
            - call: "POST /copyright/counter-notices"
              payload: { takedown_id: "${td_id}", subscriber_name: "S", statement: "ok" }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /copyright/dmca-takedowns/${td_id}/restore"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESTORE_TOO_EARLY"

      - name: dmca_restore_window_expired_returns_error
        claim_type: Boundary
        grounds: [state_machines.DmcaTakedown.COUNTERED_to_RESTORED, "errors[ERR_RESTORE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "restore at 2026-06-16 (after restoration_latest 2026-06-15) returns ERR_RESTORE_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Takedown COUNTERED with countered_at 2026-06-01; clock 2026-06-16"]
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "VISUAL_ARTS", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns"
              payload: { work_id: "${w_id}", complainant_name: "C", infringing_url: "http://x/6" }
              as: Complainant
              as_user_id: "cx_1"
              captures: { td_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns/${td_id}/process"
              payload: {}
              as: Examiner
            - call: "POST /copyright/counter-notices"
              payload: { takedown_id: "${td_id}", subscriber_name: "S", statement: "ok" }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /copyright/dmca-takedowns/${td_id}/restore"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESTORE_WINDOW_EXPIRED"

      - name: certificate_renewal_within_window_succeeds
        claim_type: Correct Result
        grounds: [state_machines.Certificate.ISSUED_to_RENEWED, entities.Certificate.fields.renewal_deadline]
        distinguishing_aspect: "Certificate with effective_date 2026-05-05 renews when clock is inside [2053-05-05, 2054-05-05]; renewing at 2053-06-01 sets status RENEWED."
        test_recipe:
          setup: ["Registered certificate (effective_date 2026-05-05); clock advanced to 2053-06-01"]
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 1990, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
