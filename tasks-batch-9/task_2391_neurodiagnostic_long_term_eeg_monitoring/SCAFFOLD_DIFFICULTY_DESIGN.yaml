          - entities.Bed.fields.turnover_clear_at
          - state_machines.Admission.ADMITTED_to_DISCHARGED
        distinguishing_aspect: "Bed occupancy is a temporal resource with a 90-minute turnover buffer appended to the previous stay: re-admitting into the same bed at 2026-08-04T13:29:00Z (one minute inside the buffer) conflicts, while 2026-08-04T13:30:00Z is accepted because the guard is clock >= turnover_clear_at."
