        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Rows created after two different clock settings carry the two different instants in created_at, proving every timestamp comes from the logical clock rather than from wall time."
        test_recipe:
