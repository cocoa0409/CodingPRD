scenario: "Used Cooking Oil Collection & Rendering Route (Darling Ingredients route): customer container placement & pickup frequency, volume metering & quality (moisture/impurity) grading, rebate vs service-fee pricing by market index, theft prevention & locked container, route optimization & tank capacity, processing yield & product resale, spill/nuisance complaint, contract term & competitor poaching"
domain_name: "uco-collection-rendering"
api_prefix: "/api"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Restaurant / site legal name" }
      - { name: site_address, type: string, source: input, description: "Street address of the collection site" }
      - { name: site_max_container_gal, type: integer, source: input, description: "Maximum aggregate container gallons permitted at the site (zoning limit)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: PROSPECT, constraints: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: missed_pickup_count, type: integer, source: computed, description: "Count of PickupVisit rows with status SKIPPED whose skipped_at falls in the trailing 90 days relative to the logical clock", default: 0 }
      - { name: rebate_balance_cents, type: integer, source: computed, description: "Open rebate ledger balance: sum of final_total_cents over this customer's settlements in status FINALIZED (PAID and VOID excluded)", default: 0 }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning account" }
      - { name: pricing_mode, type: enum, source: input, description: "Pricing regime", constraints: "REBATE | SERVICE_FEE" }
      - { name: index_code, type: string, source: input, description: "Market index code this contract prices against, e.g. YG_CBI (yellow grease)" }
      - { name: floor_cents_per_gal, type: number, source: input, description: "REBATE mode: minimum cents-per-gallon rate floor", default: 0 }
      - { name: cap_cents_per_gal, type: number, source: input, description: "REBATE mode: maximum cents-per-gallon rate cap", default: 1000000 }
      - { name: service_fee_cents, type: integer, source: input, description: "SERVICE_FEE mode: flat fee charged per completed pickup", default: 0 }
      - { name: overage_threshold_gal, type: number, source: input, description: "SERVICE_FEE mode: gallons per pickup included in the flat fee before overage accrues", default: 0 }
      - { name: overage_rate_cents_per_gal, type: number, source: input, description: "SERVICE_FEE mode: cents per gallon charged on gallons above overage_threshold_gal", default: 0 }
      - { name: term_start, type: string, source: input, description: "Contract coverage start date (ISO date), half-open interval lower bound" }
      - { name: term_end, type: string, source: input, description: "Contract coverage end date (ISO date), half-open interval upper bound (exclusive)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "DRAFT | ACTIVE | RENEWAL_OFFERED | AT_RISK | TERMINATED_VOLUNTARY | TERMINATED_POACHED | EXPIRED" }
      - { name: status_before_renewal, type: enum, source: system, description: "Status the contract returns to if a renewal offer is rejected", constraints: "ACTIVE | AT_RISK | null" }
      - { name: offered_term_start, type: string, source: system, description: "Pending renewal term start, set by offer-renewal" }
      - { name: offered_term_end, type: string, source: system, description: "Pending renewal term end, set by offer-renewal" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; drives the 14-day cooling-off window" }
      - { name: competitor_name, type: string, source: system, description: "Competitor named in the most recent poach flag" }
      - { name: poach_offer_cents_per_gal, type: number, source: system, description: "Competitor offered rate recorded by the poach flag" }
      - { name: termination_reason, type: enum, source: system, description: "Reason recorded on termination", constraints: "VOLUNTARY | POACHED | null" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; site that hosts the container" }
      - { name: capacity_gallons, type: number, source: input, description: "Rated capacity; must satisfy 30 <= capacity_gallons <= 2000" }
      - { name: est_fill_rate_gal_per_week, type: number, source: input, description: "Estimated weekly accumulation used for route fill projection" }
      - { name: lock_code, type: string, source: input, description: "Theft-prevention lock code (driver-facing)" }
      - { name: status, type: enum, source: system, description: "Placement status", default: PLACED, constraints: "PLACED | ACTIVE | LOCKED | REMOVED" }
      - { name: last_completed_pickup_date, type: string, source: system, description: "Scheduled date of the most recent COMPLETED pickup for this container" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "License plate; unique" }
      - { name: tank_capacity_gallons, type: number, source: input, description: "Tanker capacity; dispatch rejects projected fill strictly above this" }
      - { name: status, type: enum, source: system, description: "Fleet status", default: IN_SERVICE, constraints: "IN_SERVICE | OUT_OF_SERVICE" }

  - name: RouteManifest
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; assigned tanker" }
      - { name: driver_ref, type: string, source: input, description: "Opaque X-User-ID of the Driver who may start/complete/fail this manifest's visits" }
      - { name: service_date, type: string, source: input, description: "ISO date the route runs; one manifest per truck per service_date" }
      - { name: status, type: enum, source: system, description: "Route status", default: DRAFT, constraints: "DRAFT | DISPATCHED | IN_PROGRESS | COMPLETED | RECONCILED" }
      - { name: projected_fill_gallons, type: number, source: computed, description: "Sum over stops of min(container.capacity_gallons, container.est_fill_rate_gal_per_week), 2dp", default: 0 }
      - { name: start_level_gallons, type: number, source: input, description: "Tank level at dispatch (usually 0 for an empty tank)" }
      - { name: end_level_gallons, type: number, source: input, description: "Tank level measured at reconcile" }
      - { name: spill_loss_gallons, type: number, source: input, description: "Gallons lost to spills en route, recorded at reconcile", default: 0 }
      - { name: collected_gallons, type: number, source: computed, description: "Sum of pump_gallons over this manifest's visits in status COMPLETED (VOID excluded), 2dp", default: 0 }

  - name: PickupVisit
    parent: null
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "FK -> RouteManifest.id; owning route" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; container serviced" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date copied from the manifest service_date at creation" }
      - { name: status, type: enum, source: system, description: "Visit status", default: SCHEDULED, constraints: "SCHEDULED | EN_ROUTE | COMPLETED | FAILED | SKIPPED | VOID" }
      - { name: pump_gallons, type: number, source: input, description: "Gross gallons read off the pump meter at completion; must satisfy 0 < pump_gallons <= container.capacity_gallons" }
      - { name: field_moisture_pct, type: number, source: input, description: "Field refractometer moisture reading 0-100, 2dp; feeds provisional netting" }
      - { name: net_gallons_provisional, type: number, source: computed, description: "pump_gallons * (1 - field_moisture_pct/100), 2dp round half-up" }
      - { name: retry_count, type: integer, source: system, description: "Number of FAILED -> SCHEDULED reschedules", default: 0 }
      - { name: failure_reason, type: string, source: input, description: "Reason recorded on fail" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded on void (compensating action)" }
      - { name: skipped_at, type: datetime, source: system, description: "Logical-clock timestamp when the visit was SKIPPED (drives trailing-90-day missed count)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion" }

  - name: QualitySample
    parent: null
    common_fields: true
    fields:
      - { name: pickup_visit_id, type: string, source: system, description: "FK -> PickupVisit.id; visit the sample was drawn from" }
      - { name: status, type: enum, source: system, description: "Lab status", default: COLLECTED, constraints: "COLLECTED | SUBMITTED | GRADED | DISPUTED" }
      - { name: lab_moisture_pct, type: number, source: input, description: "Lab moisture result 0-100, 2dp" }
      - { name: lab_impurity_pct, type: number, source: input, description: "Lab impurity result 0-100, 2dp" }
      - { name: grade, type: enum, source: computed, description: "Worst-dimension grade from quality_grade_assignment", constraints: "A | B | C | REJECT" }
      - { name: dispute_note, type: string, source: input, description: "Reason recorded when a graded sample is disputed" }

  - name: MarketIndexQuote
    parent: null
    common_fields: true
    fields:
      - { name: index_code, type: string, source: input, description: "Market index code, e.g. YG_CBI" }
      - { name: week_start, type: string, source: input, description: "ISO date (Monday) of the pricing week" }
      - { name: price_cents_per_gal, type: number, source: input, description: "Published index price" }
      - { name: status, type: enum, source: system, description: "Publication status", default: DRAFT, constraints: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publication" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billed account" }
      - { name: period_start, type: string, source: input, description: "Billing period start (ISO date), half-open lower bound" }
      - { name: period_end, type: string, source: input, description: "Billing period end (ISO date), exclusive upper bound" }
      - { name: status, type: enum, source: system, description: "Settlement status", default: PROVISIONAL, constraints: "PROVISIONAL | FINALIZED | PAID | VOID" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Sum of PROVISIONAL-variant line_amount_cents (per-line rounding, then sum)", default: 0 }
      - { name: final_total_cents, type: integer, source: computed, description: "Sum of FINAL-variant line_amount_cents, written at finalize", default: 0 }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of disbursement" }

  - name: SettlementLine
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; owning settlement" }
      - { name: pickup_visit_id, type: string, source: system, description: "FK -> PickupVisit.id; visit billed by this line" }
      - { name: variant, type: enum, source: system, description: "Which calculation variant produced the amounts", constraints: "PROVISIONAL | FINAL" }
      - { name: pricing_mode, type: enum, source: system, description: "Contract pricing mode snapshot", constraints: "REBATE | SERVICE_FEE" }
      - { name: gallons_billed, type: number, source: computed, description: "Net gallons used: net_gallons_provisional for PROVISIONAL, lab-netted gallons for FINAL" }
      - { name: rate_cents_per_gal, type: number, source: computed, description: "Resolved rate after grade factor and floor/cap clamp (REBATE) or null for SERVICE_FEE" }
      - { name: line_amount_cents, type: integer, source: computed, description: "Round-half-up to integer cents, per line, before summing" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; complainant site" }
      - { name: pickup_visit_id, type: string, source: input, description: "FK -> PickupVisit.id; optional linked visit (required for category SPILL)", constraints: "nullable" }
      - { name: category, type: enum, source: input, description: "Complaint category", constraints: "SPILL | ODOR | NUISANCE | THEFT_ATTEMPT" }
      - { name: severity, type: enum, source: input, description: "Severity", constraints: "LOW | MEDIUM | HIGH" }
      - { name: note, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "Complaint status", default: OPEN, constraints: "OPEN | INVESTIGATING | ESCALATED | RESOLVED | REOPENED | CLOSED" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolution; reopen window is 7 days" }
      - { name: reopen_count, type: integer, source: system, description: "Number of RESOLVED -> REOPENED loops", default: 0 }
      - { name: resolution_note, type: string, source: input, description: "Resolution summary" }

  - name: TheftIncident
    parent: null
    common_fields: true
    fields:
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; tampered container" }
      - { name: evidence_note, type: string, source: input, description: "Lock / tamper evidence description" }
      - { name: status, type: enum, source: system, description: "Incident status", default: REPORTED, constraints: "REPORTED | CONFIRMED | DISMISSED | RESOLVED" }
      - { name: resolution_note, type: string, source: input, description: "Resolution summary (e.g., lock replaced)" }

  - name: ProcessingBatch
    parent: null
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> RouteManifest.id; reconciled route supplying the raw oil" }
      - { name: input_gallons, type: number, source: input, description: "Raw gallons tipped into the batch; must equal the manifest's collected_gallons" }
      - { name: weighted_moisture_pct, type: number, source: computed, description: "Volume-weighted effective moisture over the manifest's completed pickups (lab moisture if that pickup has a GRADED sample, else field moisture), 2dp" }
      - { name: est_yield_gallons, type: number, source: computed, description: "Provisional yield estimate: input_gallons * (1 - weighted_moisture_pct/100) * YIELD_COEFF, 2dp round half-up" }
      - { name: actual_output_gallons, type: number, source: input, description: "Metered saleable output recorded at process completion" }
      - { name: yield_rate, type: number, source: computed, description: "actual_output_gallons / input_gallons, 4dp round half-up" }
      - { name: sale_price_cents_per_gal, type: number, source: input, description: "Resale price agreed at sell time" }
      - { name: sale_revenue_cents, type: integer, source: computed, description: "round_half_up(actual_output_gallons * sale_price_cents_per_gal)" }
      - { name: status, type: enum, source: system, description: "Batch status", default: INTAKE, constraints: "INTAKE | PROCESSED | SOLD" }

state_machines:
  - entity: Customer
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system: side effect of POST /api/contracts/{id}/activate when the contract's customer is PROSPECT"
        actor: system
        preconditions: ["a Contract of this customer transitions DRAFT -> ACTIVE"]
        side_effects: ["Customer.version + 1", "Customer.updated_at refreshed"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/suspend OR system: missed_pickup_count reaching MISSED_PICKUP_SUSPEND_THRESHOLD (3) inside the theft-confirm cascade"
        actor: FieldOpsManager | system
        preconditions: []
        side_effects: ["Customer.version + 1"]
        note: "SUSPENDED blocks new container placement and manifest dispatch for this customer (ERR_CUSTOMER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{id}/reinstate"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["Customer.missed_pickup_count recomputed (not reset)", "Customer.version + 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/customers/{id}/terminate"
        actor: FieldOpsManager
        preconditions: ["every Contract of this customer is in a terminal state (TERMINATED_VOLUNTARY | TERMINATED_POACHED | EXPIRED)"]
        side_effects: ["all Containers of this customer in PLACED|ACTIVE|LOCKED transition to REMOVED", "Customer.version + 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/customers/{id}/terminate"
        actor: FieldOpsManager
        preconditions: ["every Contract of this customer is in a terminal state"]
        side_effects: ["all non-terminal Containers of this customer transition to REMOVED", "Customer.version + 1"]

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED_VOLUNTARY, TERMINATED_POACHED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/activate"
        actor: FieldOpsManager
        preconditions: ["logical clock date >= term_start", "logical clock date < term_end", "no other non-terminal Contract of the same customer has a term window overlapping [term_start, term_end)"]
        side_effects: ["activated_at := logical clock", "if customer.status == PROSPECT then customer PROSPECT -> ACTIVE", "Contract.version + 1"]
      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /api/contracts/{id}/offer-renewal"
        actor: FieldOpsManager
        preconditions: ["offered window [new_term_start, new_term_end) does not overlap any other non-terminal contract of the same customer"]
        side_effects: ["offered_term_start/offered_term_end recorded", "status_before_renewal := ACTIVE", "Contract.version + 1"]
      - from: AT_RISK
        to: RENEWAL_OFFERED
        trigger: "POST /api/contracts/{id}/offer-renewal"
        actor: FieldOpsManager
        preconditions: ["offered window does not overlap other non-terminal contracts of the customer"]
        side_effects: ["offered term recorded", "status_before_renewal := AT_RISK", "Contract.version + 1"]
      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/respond-renewal with accept=true"
        actor: CustomerContact | FieldOpsManager
        preconditions: []
        side_effects: ["term_start := offered_term_start", "term_end := offered_term_end", "offered fields cleared", "status_before_renewal cleared", "Contract.version + 1"]
        note: "cyclic: ACTIVE -> RENEWAL_OFFERED -> ACTIVE may repeat indefinitely"
      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/respond-renewal with accept=false and status_before_renewal == ACTIVE"
        actor: CustomerContact | FieldOpsManager
        preconditions: []
        side_effects: ["offered fields cleared", "term unchanged", "Contract.version + 1"]
      - from: RENEWAL_OFFERED
        to: AT_RISK
        trigger: "POST /api/contracts/{id}/respond-renewal with accept=false and status_before_renewal == AT_RISK"
        actor: CustomerContact | FieldOpsManager
        preconditions: []
        side_effects: ["offered fields cleared", "term unchanged", "Contract.version + 1"]
      - from: ACTIVE
        to: AT_RISK
        trigger: "POST /api/contracts/{id}/flag-poach"
        actor: CustomerContact | FieldOpsManager
        preconditions: []
        side_effects: ["competitor_name and poach_offer_cents_per_gal recorded", "Contract.version + 1"]
      - from: AT_RISK
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/amend (retention amendment wins back the account)"
        actor: FieldOpsManager
        preconditions: ["expected_contract_version matches current version (OCC)"]
        side_effects: ["rate fields updated", "competitor fields cleared", "Contract.version + 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/amend"
        actor: FieldOpsManager
        preconditions: ["expected_contract_version matches current version (OCC)"]
        side_effects: ["rate fields updated", "Contract.version + 1"]
      - from: ACTIVE
        to: TERMINATED_VOLUNTARY
        trigger: "POST /api/contracts/{id}/terminate with reason=VOLUNTARY"
        actor: FieldOpsManager
        preconditions: ["logical clock >= activated_at + COOLING_OFF_DAYS (14)", "no Settlement of the customer in PROVISIONAL or FINALIZED status"]
        side_effects: ["termination_reason := VOLUNTARY", "Contract.version + 1"]
      - from: AT_RISK
        to: TERMINATED_POACHED
        trigger: "POST /api/contracts/{id}/terminate with reason=POACHED"
        actor: FieldOpsManager
        preconditions: ["logical clock >= activated_at + COOLING_OFF_DAYS (14)", "no Settlement of the customer in PROVISIONAL or FINALIZED status"]
        side_effects: ["termination_reason := POACHED", "Contract.version + 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy expiry — any read or write when logical clock date > term_end"
        actor: system
        preconditions: ["logical clock date > term_end"]
        side_effects: ["Contract.version + 1"]
      - from: AT_RISK
        to: EXPIRED
        trigger: "system: lazy expiry"
        actor: system
        preconditions: ["logical clock date > term_end"]
        side_effects: ["Contract.version + 1"]
      - from: RENEWAL_OFFERED
        to: EXPIRED
        trigger: "system: lazy expiry"
        actor: system
        preconditions: ["logical clock date > term_end"]
        side_effects: ["Contract.version + 1"]

  - entity: Container
    initial_state: PLACED
    terminal_states: [REMOVED]
    transitions:
      - from: PLACED
        to: ACTIVE
        trigger: "system: side effect of POST /api/route-manifests/{id}/dispatch for a manifest whose stops include this container"
        actor: system
        preconditions: []
        side_effects: ["Container.version + 1"]
      - from: ACTIVE
        to: LOCKED
        trigger: "system: side effect of POST /api/theft-incidents/{id}/confirm for a CONFIRMED incident on this container"
        actor: system
        preconditions: []
        side_effects:
          - "every PickupVisit of this container in status SCHEDULED transitions to SKIPPED with skipped_at := logical clock"
          - "each such skip increments the owning Customer.missed_pickup_count; when the recomputed count >= 3 the Customer transitions ACTIVE -> SUSPENDED"
          - "Container.version + 1"
        note: "EN_ROUTE visits are NOT auto-skipped — the driver is already on site and decides complete vs fail"
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /api/containers/{id}/unlock"
        actor: FieldOpsManager
        preconditions: ["no TheftIncident of this container is in status CONFIRMED (all resolved or dismissed)"]
        side_effects: ["Container.version + 1"]
      - from: PLACED
        to: REMOVED
        trigger: "POST /api/containers/{id}/remove"
        actor: FieldOpsManager
        preconditions: ["no PickupVisit of this container in SCHEDULED or EN_ROUTE"]
        side_effects: ["Container.version + 1"]
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /api/containers/{id}/remove"
        actor: FieldOpsManager
        preconditions: ["no PickupVisit of this container in SCHEDULED or EN_ROUTE"]
        side_effects: ["Container.version + 1"]
      - from: LOCKED
        to: REMOVED
        trigger: "POST /api/containers/{id}/remove"
        actor: FieldOpsManager
        preconditions: ["no PickupVisit of this container in SCHEDULED or EN_ROUTE", "no TheftIncident of this container in status CONFIRMED"]
        side_effects: ["Container.version + 1"]

  - entity: RouteManifest
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /api/route-manifests/{id}/dispatch"
        actor: RouteDispatcher
        preconditions:
          - "truck.status == IN_SERVICE"
          - "projected_fill_gallons <= truck.tank_capacity_gallons (rejection is strict-greater only; equality dispatches)"
          - "every stop container is in PLACED or ACTIVE"
          - "every stop container's customer.status == ACTIVE"
        side_effects:
          - "start_level_gallons recorded from input"
          - "every stop container in PLACED transitions to ACTIVE"
          - "RouteManifest.version + 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "system: first PickupVisit of this manifest transitions SCHEDULED -> EN_ROUTE"
        actor: system
        preconditions: []
        side_effects: ["RouteManifest.version + 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/route-manifests/{id}/complete"
        actor: Driver
        preconditions: ["every PickupVisit of this manifest is in COMPLETED, SKIPPED, or VOID"]
        side_effects: ["collected_gallons recomputed", "RouteManifest.version + 1"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /api/route-manifests/{id}/complete"
        actor: Driver
        preconditions: ["every PickupVisit of this manifest is in COMPLETED, SKIPPED, or VOID"]
        side_effects: ["collected_gallons recomputed", "RouteManifest.version + 1"]
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /api/route-manifests/{id}/reconcile"
        actor: RouteDispatcher
        preconditions: ["tank conservation: |end_level_gallons - (start_level_gallons + collected_gallons - spill_loss_gallons)| <= TANK_TOLERANCE_GAL (0.5)"]
        side_effects: ["RouteManifest.version + 1"]

  - entity: PickupVisit
    initial_state: SCHEDULED
    terminal_states: [SKIPPED, VOID]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /api/pickup-visits/{id}/start"
        actor: Driver
        preconditions: ["manifest status in DISPATCHED or IN_PROGRESS", "acting X-User-ID == manifest.driver_ref"]
        side_effects: ["if manifest was DISPATCHED it transitions to IN_PROGRESS", "PickupVisit.version + 1"]
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /api/pickup-visits/{id}/complete"
        actor: Driver
        preconditions:
          - "container.status == ACTIVE"
          - "logical clock date >= scheduled_date"
          - "0 < pump_gallons <= container.capacity_gallons"
        side_effects:
          - "net_gallons_provisional computed (pump_gallons * (1 - field_moisture_pct/100), 2dp half-up)"
          - "container.last_completed_pickup_date := scheduled_date"
          - "manifest.collected_gallons recomputed"
          - "PickupVisit.version + 1"
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /api/pickup-visits/{id}/fail"
        actor: Driver
        preconditions: []
        side_effects: ["failure_reason recorded", "visit immediately auto-transitions FAILED -> SCHEDULED with retry_count + 1", "PickupVisit.version + 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "system: automatic reschedule after a failure"
        actor: system
        preconditions: []
        side_effects: ["retry_count + 1"]
        note: "cyclic: a visit may fail and retry repeatedly"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system: side effect of a CONFIRMED theft incident locking the container"
        actor: system
        preconditions: []
        side_effects: ["skipped_at := logical clock", "owning customer.missed_pickup_count recomputed; if >= 3 customer ACTIVE -> SUSPENDED"]
      - from: COMPLETED
        to: VOID
        trigger: "POST /api/pickup-visits/{id}/void (compensating action)"
        actor: RouteDispatcher
        preconditions: ["manifest status in DISPATCHED, IN_PROGRESS, or COMPLETED (not RECONCILED)"]
        side_effects:
          - "void_reason recorded"
          - "manifest.collected_gallons recomputed excluding this visit"
          - "any SettlementLine referencing this visit in a PROVISIONAL settlement is removed and the settlement's provisional_total_cents recomputed"
          - "container.last_completed_pickup_date recomputed from remaining COMPLETED visits"
          - "PickupVisit.version + 1"

  - entity: QualitySample
    initial_state: COLLECTED
    terminal_states: []
    transitions:
      - from: COLLECTED
        to: SUBMITTED
        trigger: "POST /api/quality-samples/{id}/submit"
        actor: Driver
        preconditions: []
        side_effects: ["QualitySample.version + 1"]
      - from: SUBMITTED
        to: GRADED
        trigger: "POST /api/quality-samples/{id}/grade"
        actor: PlantOperator
        preconditions: []
        side_effects: ["grade computed by quality_grade_assignment (worst of moisture dimension and impurity dimension)", "QualitySample.version + 1"]
      - from: DISPUTED
        to: GRADED
        trigger: "POST /api/quality-samples/{id}/grade"
        actor: PlantOperator
        preconditions: []
        side_effects: ["grade recomputed and overwritten", "QualitySample.version + 1"]
        note: "cyclic: GRADED -> DISPUTED -> GRADED re-grade loop"
      - from: GRADED
        to: DISPUTED
        trigger: "POST /api/quality-samples/{id}/dispute"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["dispute_note recorded", "QualitySample.version + 1"]

  - entity: MarketIndexQuote
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/market-index-quotes/{id}/publish"
        actor: BillingAnalyst
        preconditions: []
        side_effects:
          - "published_at := logical clock"
          - "any other PUBLISHED quote with the same index_code and week_start transitions to SUPERSEDED"
          - "every Settlement in PROVISIONAL status whose included pickups are priced (provisional variant) by this index_code has its lines recomputed (settlement recompute), which mutates SettlementLine.rate_cents_per_gal / line_amount_cents and Settlement.provisional_total_cents"
          - "MarketIndexQuote.version + 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: side effect of publishing a newer quote with the same index_code and week_start"
        actor: system
        preconditions: []
        side_effects: ["MarketIndexQuote.version + 1"]

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [PAID, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/settlements/{id}/finalize"
        actor: BillingAnalyst
        preconditions:
          - "logical clock date >= period_end (period closed)"
          - "every included PickupVisit has at least one QualitySample in GRADED status"
          - "at least one PUBLISHED MarketIndexQuote exists with week_start in [period_start, period_end) for the contract's index_code"
          - "customer's ACTIVE-era contract used for pricing is in ACTIVE, AT_RISK, or RENEWAL_OFFERED (a contract in DRAFT or any terminal state fails)"
        side_effects:
          - "each line recomputed under the FINAL variant (lab grade + period-average index)"
          - "final_total_cents := sum of recomputed lines (per-line rounding, then sum)"
          - "customer.rebate_balance_cents += final_total_cents"
          - "Settlement.version + 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /api/settlements/{id}/pay"
        actor: BillingAnalyst
        preconditions: ["final_total_cents >= MIN_PAYOUT_CENTS (100)"]
        side_effects: ["customer.rebate_balance_cents -= final_total_cents", "paid_at := logical clock", "Settlement.version + 1"]
      - from: FINALIZED
        to: VOID
        trigger: "POST /api/settlements/{id}/void (compensating action)"
        actor: BillingAnalyst
        preconditions: []
        side_effects: ["customer.rebate_balance_cents -= final_total_cents (reversal)", "Settlement.version + 1"]
      - from: PROVISIONAL
        to: VOID
        trigger: "POST /api/settlements/{id}/void"
        actor: BillingAnalyst
        preconditions: []
        side_effects: ["Settlement.version + 1"]

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /api/complaints/{id}/investigate"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["Complaint.version + 1"]
      - from: REOPENED
        to: INVESTIGATING
        trigger: "POST /api/complaints/{id}/investigate"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["Complaint.version + 1"]
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /api/complaints/{id}/escalate"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["Complaint.version + 1"]
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /api/complaints/{id}/resolve"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["resolved_at := logical clock", "resolution_note recorded", "Complaint.version + 1"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/complaints/{id}/resolve"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["resolved_at := logical clock", "resolution_note recorded", "Complaint.version + 1"]
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /api/complaints/{id}/reopen"
        actor: CustomerContact
        preconditions: ["logical clock <= resolved_at + COMPLAINT_REOPEN_WINDOW_DAYS (7)"]
        side_effects: ["reopen_count + 1", "Complaint.version + 1"]
        note: "cyclic recurrence loop RESOLVED -> REOPENED -> INVESTIGATING -> RESOLVED"
      - from: RESOLVED
        to: CLOSED
        trigger: "system: lazy auto-close — any read or write when logical clock > resolved_at + 7 days"
        actor: system
        preconditions: ["logical clock > resolved_at + 7 days"]
        side_effects: ["Complaint.version + 1"]

  - entity: TheftIncident
    initial_state: REPORTED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /api/theft-incidents/{id}/confirm"
        actor: FieldOpsManager
        preconditions: []
        side_effects:
          - "container ACTIVE -> LOCKED"
          - "container's SCHEDULED pickups -> SKIPPED (skipped_at := logical clock)"
          - "per skip: owning customer.missed_pickup_count recomputed; if >= 3 customer ACTIVE -> SUSPENDED"
          - "TheftIncident.version + 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/theft-incidents/{id}/dismiss"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["TheftIncident.version + 1"]
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /api/theft-incidents/{id}/resolve (e.g., lock replaced)"
        actor: FieldOpsManager
        preconditions: []
        side_effects: ["resolution_note recorded", "TheftIncident.version + 1"]

  - entity: ProcessingBatch
    initial_state: INTAKE
    terminal_states: [SOLD]
    transitions:
      - from: INTAKE
        to: PROCESSED
        trigger: "POST /api/processing-batches/{id}/process"
        actor: PlantOperator
        preconditions: []
        side_effects: ["yield_rate := actual_output_gallons / input_gallons (4dp half-up)", "ProcessingBatch.version + 1"]
      - from: PROCESSED
        to: SOLD
        trigger: "POST /api/processing-batches/{id}/sell"
        actor: PlantOperator
        preconditions: []
        side_effects: ["sale_revenue_cents := round_half_up(actual_output_gallons * sale_price_cents_per_gal)", "ProcessingBatch.version + 1"]

concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: Contract
    write_endpoint: "POST /api/contracts/{id}/amend"
    occ_field: "expected_contract_version"
    description: |
      Amending a Contract whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just amended the contract (each amendment legitimately supersedes the
      prior rate schedule) and the current writer's view of the contract is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-patch-stale-version
    parent_entity: RouteManifest
    write_endpoint: "PATCH /api/route-manifests/{id}"
    occ_field: "expected_manifest_version"
    description: |
      Re-planning the stop list of a DRAFT RouteManifest whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another dispatcher has just replaced the stop list (the
      newer stop plan legitimately supersedes the prior one) and the current
      dispatcher's view of the manifest is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: quality_grade_assignment
    trigger: "POST /api/quality-samples/{id}/grade"
    algorithm: threshold
    formula: |
      moisture_dim = A if lab_moisture_pct < 5.0
                     else B if lab_moisture_pct < 15.0
                     else C if lab_moisture_pct < 25.0
                     else REJECT            # lab_moisture_pct >= 25.0
      impurity_dim = A if lab_impurity_pct < 2.0
                     else B if lab_impurity_pct < 6.0
                     else C if lab_impurity_pct < 10.0
                     else REJECT            # lab_impurity_pct >= 10.0
      grade = worse(moisture_dim, impurity_dim)   # ordering A < B < C < REJECT
      # boundary pins: moisture 15.00 -> C (>= lower bound belongs to the worse band);
      # impurity 2.00 -> B. lower bound inclusive, upper bound exclusive.
    input_set: "the single QualitySample being graded; fields lab_moisture_pct and lab_impurity_pct"
    constants:
      GRADE_A_MAX_MOISTURE: 5.0
      GRADE_B_MAX_MOISTURE: 15.0
      GRADE_C_MAX_MOISTURE: 25.0
      GRADE_A_MAX_IMPURITY: 2.0
      GRADE_B_MAX_IMPURITY: 6.0
      GRADE_C_MAX_IMPURITY: 10.0
    precision: "inputs 2 decimal places; comparisons exact"

  - name: pickup_net_gallons
    trigger: "POST /api/pickup-visits/{id}/complete (provisional) and settlement finalize (final)"
    algorithm: aggregation
    formula: |
      net_provisional = round_half_up(pump_gallons * (1 - field_moisture_pct/100), 2)
      net_final       = round_half_up(pump_gallons * (1 - lab_moisture_pct/100), 2)
      # lab_moisture_pct comes from the visit's GRADED QualitySample
    input_set: "the PickupVisit being netted; final variant requires a GRADED QualitySample"
    precision: "gallons to 2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "pickup completion and PROVISIONAL settlement generation"
        difference: "uses field_moisture_pct (driver's refractometer)"
      - name: final
        when: "settlement finalize"
        difference: "uses lab_moisture_pct; identical pump_gallons can net differently, so provisional and final line amounts diverge"

  - name: provisional_index_price
    trigger: "settlement generate and publish-cascade recompute of PROVISIONAL settlements"
    algorithm: aggregation
    formula: |
      candidates = MarketIndexQuote where index_code == contract.index_code
                   AND status == PUBLISHED
                   AND week_start <= pickup.scheduled_date
      price = price_cents_per_gal of the candidate with the greatest week_start;
              tie-break: greatest published_at, then created_at ASC
      if candidates is empty -> ERR_QUOTE_NOT_PUBLISHED
    input_set: "PUBLISHED quotes of the contract's index_code with week_start <= pickup.scheduled_date, evaluated at computation time"
    precision: "integer cents per gallon"

  - name: final_index_price
    trigger: "settlement finalize"
    algorithm: aggregation
    formula: |
      candidates = MarketIndexQuote where index_code == contract.index_code
                   AND status == PUBLISHED
                   AND period_start <= week_start < period_end
      price = round_half_up(arithmetic mean of candidates' price_cents_per_gal, 0)
      if candidates is empty -> ERR_QUOTE_NOT_PUBLISHED
    input_set: "PUBLISHED quotes whose week_start falls inside the half-open billing period [period_start, period_end)"
    precision: "rounded half-up to integer cents per gallon"
    variants:
      - name: provisional_vs_final
        when: "same pickup, same underlying quotes"
        difference: "provisional resolves a single latest-week quote keyed on the pickup date; final averages all in-period weeks — identical data produces different rates"

  - name: settlement_line_amount
    trigger: "settlement generate (PROVISIONAL variant) and finalize (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      grade_factor = A: 1.00, B: 0.90, C: 0.75, REJECT: 0.00
      # provisional variant maps field_moisture_pct through the moisture thresholds
      # to a field grade; final variant uses the lab grade.
      if pricing_mode == REBATE:
          raw_rate   = index_price * grade_factor
          rate       = min(cap_cents_per_gal, max(floor_cents_per_gal, raw_rate))
          amount     = round_half_up(net_gallons * rate, 0)          # company pays customer
      else:  # SERVICE_FEE
          overage_gal = max(0, net_gallons - overage_threshold_gal)
          amount      = -( service_fee_cents
                           + round_half_up(overage_gal * overage_rate_cents_per_gal, 0) )
          rate        = null                                          # customer pays company
      line_amount_cents = amount
    input_set: "one SettlementLine: pickup net gallons, grade factor, contract rate fields, resolved index price"
    constants:
      GRADE_FACTOR_A: 1.00
      GRADE_FACTOR_B: 0.90
      GRADE_FACTOR_C: 0.75
      GRADE_FACTOR_REJECT: 0.00
    precision: "line amount rounded half-up to integer cents per line"
    variants:
      - name: provisional
        when: "settlement generate"
        difference: "field-moisture grade + provisional_index_price"
      - name: final
        when: "settlement finalize"
        difference: "lab grade + final_index_price; same pickup yields a different line amount"

  - name: settlement_total
    trigger: "settlement generate, publish-cascade recompute, void-line recompute, finalize"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each line to integer cents FIRST,
      # then sum the integer lines. Summing unrounded values and rounding
      # once at the end is a different result and is NOT the contract.
      total_cents = sum over lines of round_half_up(line_amount_raw_cents, 0)
      provisional_total_cents = total under PROVISIONAL variant
      final_total_cents       = total under FINAL variant
    input_set: "SettlementLine rows of the settlement (lines of VOID pickups removed)"
    precision: "integer cents; per-line half-up rounding precedes summation"

  - name: projected_fill_gallons
    trigger: "POST /api/route-manifests create and PATCH (recompute), read at dispatch"
    algorithm: aggregation
    formula: |
      projected_fill_gallons = sum over stops of
          min(container.capacity_gallons, container.est_fill_rate_gal_per_week)
      # dispatch rejects when projected_fill_gallons > truck.tank_capacity_gallons
      # (equality is allowed: a projected fill exactly at capacity dispatches)
    input_set: "containers referenced by the manifest stop list"
    precision: "2 decimal places"

  - name: tank_conservation_check
    trigger: "POST /api/route-manifests/{id}/reconcile"
    algorithm: constraint_propagation
    formula: |
      expected_end = start_level_gallons + collected_gallons - spill_loss_gallons
      collected_gallons = sum of pump_gallons over visits in status COMPLETED (VOID excluded)
      pass if |end_level_gallons - expected_end| <= TANK_TOLERANCE_GAL
      else ERR_TANK_IMBALANCE
      # compensating invariant: voiding a completed pickup removes its pump_gallons
      # from collected_gallons, so a reconcile after the void still balances.
    input_set: "the manifest and its visits at reconcile time"
    constants:
      TANK_TOLERANCE_GAL: 0.5
    precision: "2 decimal places"

  - name: batch_yield
    trigger: "POST /api/processing-batches (provisional estimate) and POST /api/processing-batches/{id}/process (final metered)"
    algorithm: weighted_scoring
    formula: |
      effective_moisture(v) = lab_moisture_pct if v has a GRADED sample else field_moisture_pct
      weighted_moisture_pct = round_half_up(
          sum over COMPLETED non-VOID pickups v of (pump_gallons(v) * effective_moisture(v))
          / sum of pump_gallons(v), 2)
      est_yield_gallons = round_half_up(input_gallons * (1 - weighted_moisture_pct/100) * YIELD_COEFF, 2)
      yield_rate        = round_half_up(actual_output_gallons / input_gallons, 4)
      sale_revenue_cents = round_half_up(actual_output_gallons * sale_price_cents_per_gal, 0)
    input_set: "the manifest's COMPLETED non-VOID pickups and their samples"
    constants:
      YIELD_COEFF: 0.92
    precision: "moisture 2dp, yield gallons 2dp, yield_rate 4dp, revenue integer cents; round_half_up"
    variants:
      - name: estimated
        when: "batch intake (INTAKE)"
        difference: "formula-derived estimate from weighted moisture and the fixed coefficient"
      - name: metered
        when: "process completion (PROCESSED)"
        difference: "actual_output_gallons is a meter reading; the estimated and metered yields for the same batch diverge"

  - name: missed_pickup_aggregation
    trigger: "system on every SKIPPED transition and on reinstate read"
    algorithm: threshold
    formula: |
      missed_pickup_count = count of PickupVisit v
          where v.container.customer_id == customer.id
          AND v.status == SKIPPED
          AND clock - 90 days < v.skipped_at <= clock
      if missed_pickup_count >= MISSED_PICKUP_SUSPEND_THRESHOLD and customer.status == ACTIVE:
          customer -> SUSPENDED
    input_set: "SKIPPED visits of the customer's containers in the trailing 90-day window (inclusive upper bound at the logical clock)"
    constants:
      MISSED_PICKUP_SUSPEND_THRESHOLD: 3
      MISSED_PICKUP_WINDOW_DAYS: 90
    precision: "integer count; threshold comparison is >="

  - name: rebate_ledger_balance
    trigger: "settlement finalize, pay, void"
    algorithm: aggregation
    formula: |
      rebate_balance_cents = sum of final_total_cents over the customer's
          settlements in status FINALIZED
      # invariant (compensating): for every settlement, the finalize -> void pair
      # leaves rebate_balance_cents unchanged; the finalize -> pay pair moves the
      # amount out of the balance into a disbursement (paid_at set).
    input_set: "settlements of the customer in status FINALIZED (PROVISIONAL, PAID, VOID excluded)"
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list; ownership rules: CustomerContact may only act on resources of the Customer whose id == X-User-ID; Driver may only start/complete/fail visits whose manifest.driver_ref == X-User-ID"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path resources exist, validated left-to-right (customer before contract before child resources)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "request schema: required fields present, types valid, enum values in their declared sets, capacity_gallons within [30, 2000], pump_gallons > 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "state-machine precondition: the transition is defined from the entity's current state (covers e.g. complete from SCHEDULED, activate from ACTIVE, terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "container is not LOCKED: pickup complete requires container.status == ACTIVE"
    error_id: ERR_CONTAINER_LOCKED
    http_status: 409
    applies_to: "POST /api/pickup-visits/{id}/complete"
  - priority: 7
    category: state
    check: "contract engagement state: container placement requires an ACTIVE-era contract; settlement finalize requires the pricing contract in ACTIVE | AT_RISK | RENEWAL_OFFERED"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/customers/{id}/containers, POST /api/settlements/{id}/finalize"
  - priority: 8
    category: state
    check: "sample re-grade only via dispute: grade is rejected when sample.status == GRADED"
    error_id: ERR_SAMPLE_ALREADY_GRADED
    http_status: 409
    applies_to: "POST /api/quality-samples/{id}/grade"
  - priority: 9
    category: state
    check: "customer not SUSPENDED for container placement and manifest dispatch"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /api/customers/{id}/containers, POST /api/route-manifests/{id}/dispatch"
  - priority: 10
    category: state
    check: "optimistic concurrency: expected_contract_version / expected_manifest_version equals the entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/contracts/{id}/amend, PATCH /api/route-manifests/{id}"
  - priority: 11
    category: business_safety
    check: "dispatch only when truck.status == IN_SERVICE (maintenance safety)"
    error_id: ERR_TRUCK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/route-manifests/{id}/dispatch"
  - priority: 12
    category: business_safety
    check: "batch intake blocked while any SPILL complaint linked to the manifest's pickups is in OPEN | INVESTIGATING | ESCALATED | REOPENED"
    error_id: ERR_SPILL_COMPLAINT_OPEN
    http_status: 422
    applies_to: "POST /api/processing-batches"
  - priority: 13
    category: business_constraint
    check: "contract term windows of one customer are half-open [term_start, term_end) and must not overlap another non-terminal contract of the same customer; adjacency (new term_start == existing term_end) is allowed"
    error_id: ERR_CONTRACT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /api/customers/{id}/contracts, POST /api/contracts/{id}/activate"
  - priority: 14
    category: business_constraint
    check: "one manifest per truck per service_date (date-point uniqueness, not an interval rule)"
    error_id: ERR_MANIFEST_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /api/route-manifests"
  - priority: 15
    category: business_constraint
    check: "projected_fill_gallons <= truck.tank_capacity_gallons (strict-greater rejects; equality allowed)"
    error_id: ERR_TANK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/route-manifests/{id}/dispatch"
  - priority: 16
    category: business_constraint
    check: "pump_gallons <= container.capacity_gallons (meter sanity)"
    error_id: ERR_CONTAINER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/pickup-visits/{id}/complete"
  - priority: 17
    category: business_constraint
    check: "tank conservation within TANK_TOLERANCE_GAL at reconcile"
    error_id: ERR_TANK_IMBALANCE
    http_status: 422
    applies_to: "POST /api/route-manifests/{id}/reconcile"
  - priority: 18
    category: business_constraint
    check: "no other non-VOID settlement of the same customer overlaps [period_start, period_end)"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /api/settlements/generate"
  - priority: 19
    category: business_temporal
    check: "pickup may complete only on or after its scheduled_date (logical clock date >= scheduled_date)"
    error_id: ERR_PICKUP_WINDOW_FUTURE
    http_status: 422
    applies_to: "POST /api/pickup-visits/{id}/complete"
  - priority: 20
    category: business_temporal
    check: "billing period closed: logical clock date >= period_end for settlement generate and finalize"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /api/settlements/generate, POST /api/settlements/{id}/finalize"
  - priority: 21
    category: business_temporal
    check: "cooling-off: contract terminate rejected when logical clock < activated_at + 14 days"
    error_id: ERR_CONTRACT_IN_COOLING_OFF
    http_status: 422
    applies_to: "POST /api/contracts/{id}/terminate"
  - priority: 22
    category: business_temporal
    check: "complaint reopen window: logical clock <= resolved_at + 7 days"
    error_id: ERR_COMPLAINT_REOPEN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/complaints/{id}/reopen"
  - priority: 23
    category: business_referential
    check: "contract termination blocked while any settlement of the customer is PROVISIONAL or FINALIZED"
    error_id: ERR_OPEN_SETTLEMENTS
    http_status: 422
    applies_to: "POST /api/contracts/{id}/terminate"
  - priority: 24
    category: business_referential
    check: "settlement finalize requires every included pickup to have a GRADED sample"
    error_id: ERR_GRADE_PENDING
    http_status: 422
    applies_to: "POST /api/settlements/{id}/finalize"
  - priority: 25
    category: business_referential
    check: "index coverage: generate requires a PUBLISHED quote with week_start <= each included pickup's scheduled_date; finalize requires a PUBLISHED quote with week_start in [period_start, period_end)"
    error_id: ERR_QUOTE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /api/settlements/generate, POST /api/settlements/{id}/finalize"
  - priority: 26
    category: business_referential
    check: "container unlock/remove blocked while a TheftIncident of the container is CONFIRMED"
    error_id: ERR_THEFT_UNRESOLVED
    http_status: 409
    applies_to: "POST /api/containers/{id}/unlock, POST /api/containers/{id}/remove"
  - priority: 27
    category: business_fiscal
    check: "disbursement floor: pay requires final_total_cents >= MIN_PAYOUT_CENTS (100)"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /api/settlements/{id}/pay"

endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; lazy transitions (contract EXPIRED, complaint CLOSED) evaluate on next access"] }
  - { method: POST, path: "/api/customers", description: "Register a customer site", roles: [SystemAdmin, FieldOpsManager], code: 201, input: [name, site_address, site_max_container_gal], output: Customer, side_effects: ["status PROSPECT, missed_pickup_count 0, rebate_balance_cents 0"] }
  - { method: GET, path: "/api/customers", description: "List customers with pagination and optional status filter", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, BillingAnalyst, PlantOperator], code: 200, input: ["limit?", "offset?", "status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{id}", description: "Get one customer; CustomerContact restricted to own id", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, BillingAnalyst, PlantOperator, CustomerContact], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/api/customers/{id}/suspend", description: "Manually suspend a customer", roles: [SystemAdmin, FieldOpsManager], code: 200, input: ["reason?"], output: Customer, side_effects: ["ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/api/customers/{id}/reinstate", description: "Reinstate a suspended customer", roles: [SystemAdmin, FieldOpsManager], code: 200, input: [], output: Customer, side_effects: ["SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/api/customers/{id}/terminate", description: "Terminate a customer whose contracts are all terminal", roles: [SystemAdmin, FieldOpsManager], code: 200, input: [reason], output: Customer, side_effects: ["-> TERMINATED", "non-terminal containers -> REMOVED"] }
  - { method: POST, path: "/api/customers/{id}/contracts", description: "Draft a contract for the customer", roles: [SystemAdmin, FieldOpsManager], code: 201, input: [pricing_mode, index_code, term_start, term_end, "floor_cents_per_gal?", "cap_cents_per_gal?", "service_fee_cents?", "overage_threshold_gal?", "overage_rate_cents_per_gal?"], output: Contract, side_effects: ["overlap check against non-terminal sibling contracts", "status DRAFT"] }
  - { method: GET, path: "/api/customers/{id}/contracts", description: "List contracts of a customer", roles: [SystemAdmin, FieldOpsManager, BillingAnalyst, CustomerContact], code: 200, input: [], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{id}/containers", description: "List containers of a customer", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, CustomerContact], code: 200, input: [], output: "Container[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{id}/settlements", description: "List settlements of a customer", roles: [SystemAdmin, FieldOpsManager, BillingAnalyst, CustomerContact], code: 200, input: [], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{id}/complaints", description: "List complaints of a customer", roles: [SystemAdmin, FieldOpsManager, CustomerContact], code: 200, input: [], output: "Complaint[]", side_effects: [] }
  - { method: GET, path: "/api/contracts/{id}", description: "Get one contract", roles: [SystemAdmin, FieldOpsManager, BillingAnalyst, CustomerContact], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{id}/activate", description: "Activate a draft contract", roles: [SystemAdmin, FieldOpsManager], code: 200, input: [], output: Contract, side_effects: ["DRAFT -> ACTIVE", "activated_at set", "customer PROSPECT -> ACTIVE", "Contract.version + 1"] }
  - { method: POST, path: "/api/contracts/{id}/amend", description: "Amend rate fields (OCC-guarded); from AT_RISK this is the retention action returning the contract to ACTIVE", roles: [FieldOpsManager], code: 200, input: [expected_contract_version, "floor_cents_per_gal?", "cap_cents_per_gal?", "service_fee_cents?", "overage_threshold_gal?", "overage_rate_cents_per_gal?"], output: Contract, side_effects: ["increments Contract.version by 1", "AT_RISK -> ACTIVE on success"] }
  - { method: POST, path: "/api/contracts/{id}/offer-renewal", description: "Offer renewal terms", roles: [FieldOpsManager], code: 200, input: [new_term_start, new_term_end], output: Contract, side_effects: ["-> RENEWAL_OFFERED", "offered term recorded"] }
  - { method: POST, path: "/api/contracts/{id}/respond-renewal", description: "Accept or reject the pending renewal offer", roles: [CustomerContact, FieldOpsManager], code: 200, input: [accept], output: Contract, side_effects: ["accept: term replaced by offered term, -> ACTIVE", "reject: -> status_before_renewal"] }
  - { method: POST, path: "/api/contracts/{id}/flag-poach", description: "Record a competitor poaching offer", roles: [CustomerContact, FieldOpsManager], code: 200, input: [competitor_name, offer_cents_per_gal], output: Contract, side_effects: ["ACTIVE -> AT_RISK"] }
  - { method: POST, path: "/api/contracts/{id}/terminate", description: "Terminate contract with reason VOLUNTARY or POACHED", roles: [FieldOpsManager], code: 200, input: [reason], output: Contract, side_effects: ["-> TERMINATED_VOLUNTARY | TERMINATED_POACHED"] }
  - { method: POST, path: "/api/customers/{id}/containers", description: "Place a locked container at the customer site", roles: [FieldOpsManager], code: 201, input: [capacity_gallons, est_fill_rate_gal_per_week, lock_code], output: Container, side_effects: ["status PLACED", "aggregate capacity of non-REMOVED containers must stay <= customer.site_max_container_gal"] }
  - { method: GET, path: "/api/containers/{id}", description: "Get one container", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver, CustomerContact], code: 200, input: [], output: Container, side_effects: [] }
  - { method: POST, path: "/api/containers/{id}/unlock", description: "Unlock a theft-locked container after incidents are resolved", roles: [FieldOpsManager], code: 200, input: [], output: Container, side_effects: ["LOCKED -> ACTIVE"] }
  - { method: POST, path: "/api/containers/{id}/remove", description: "Remove a container from service", roles: [FieldOpsManager], code: 200, input: [], output: Container, side_effects: ["-> REMOVED"] }
  - { method: GET, path: "/api/containers/{id}/pickup-visits", description: "List visits of a container", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver, CustomerContact], code: 200, input: [], output: "PickupVisit[]", side_effects: [] }
  - { method: GET, path: "/api/containers/{id}/theft-incidents", description: "List theft incidents of a container", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, CustomerContact], code: 200, input: [], output: "TheftIncident[]", side_effects: [] }
  - { method: POST, path: "/api/market-index-quotes", description: "Create a draft market index quote", roles: [BillingAnalyst], code: 201, input: [index_code, week_start, price_cents_per_gal], output: MarketIndexQuote, side_effects: ["status DRAFT"] }
  - { method: POST, path: "/api/market-index-quotes/{id}/publish", description: "Publish a quote; supersedes same week/index and recomputes PROVISIONAL settlements", roles: [BillingAnalyst], code: 200, input: [], output: MarketIndexQuote, side_effects: ["DRAFT -> PUBLISHED", "same index_code+week_start PUBLISHED quotes -> SUPERSEDED", "PROVISIONAL settlement recompute cascade"] }
  - { method: GET, path: "/api/market-index-quotes", description: "List quotes with optional filters", roles: [SystemAdmin, FieldOpsManager, BillingAnalyst], code: 200, input: ["index_code?", "week_start?", "status?"], output: "MarketIndexQuote[]", side_effects: [] }
  - { method: POST, path: "/api/trucks", description: "Register a tanker", roles: [SystemAdmin, RouteDispatcher], code: 201, input: [plate, tank_capacity_gallons], output: Truck, side_effects: ["status IN_SERVICE"] }
  - { method: GET, path: "/api/trucks/{id}", description: "Get one truck", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver], code: 200, input: [], output: Truck, side_effects: [] }
  - { method: POST, path: "/api/trucks/{id}/service-status", description: "Set truck IN_SERVICE / OUT_OF_SERVICE", roles: [RouteDispatcher], code: 200, input: [status], output: Truck, side_effects: ["status updated"] }
  - { method: GET, path: "/api/trucks/{id}/manifests", description: "List manifests of a truck", roles: [SystemAdmin, RouteDispatcher, Driver], code: 200, input: [], output: "RouteManifest[]", side_effects: [] }
  - { method: POST, path: "/api/route-manifests", description: "Create a DRAFT manifest with a stop list; creates one SCHEDULED PickupVisit per container", roles: [RouteDispatcher], code: 201, input: [truck_id, driver_ref, service_date, container_ids], output: RouteManifest, side_effects: ["PickupVisit SCHEDULED rows created per stop", "projected_fill_gallons computed"] }
  - { method: GET, path: "/api/route-manifests/{id}", description: "Get one manifest", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver, PlantOperator], code: 200, input: [], output: RouteManifest, side_effects: [] }
  - { method: PATCH, path: "/api/route-manifests/{id}", description: "Replace the stop list of a DRAFT manifest (OCC-guarded)", roles: [RouteDispatcher], code: 200, input: [expected_manifest_version, container_ids], output: RouteManifest, side_effects: ["existing SCHEDULED visits deleted and recreated from the new stop list", "projected_fill_gallons recomputed", "increments RouteManifest.version by 1"] }
  - { method: POST, path: "/api/route-manifests/{id}/dispatch", description: "Dispatch the route", roles: [RouteDispatcher], code: 200, input: [start_level_gallons], output: RouteManifest, side_effects: ["DRAFT -> DISPATCHED", "PLACED stop containers -> ACTIVE"] }
  - { method: POST, path: "/api/route-manifests/{id}/complete", description: "Driver closes the route once all visits are terminal", roles: [Driver], code: 200, input: [], output: RouteManifest, side_effects: ["-> COMPLETED", "collected_gallons recomputed"] }
  - { method: POST, path: "/api/route-manifests/{id}/reconcile", description: "Reconcile tank levels against collected gallons", roles: [RouteDispatcher], code: 200, input: [end_level_gallons, spill_loss_gallons], output: RouteManifest, side_effects: ["-> RECONCILED"] }
  - { method: GET, path: "/api/route-manifests/{id}/pickup-visits", description: "List visits of a manifest", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver], code: 200, input: [], output: "PickupVisit[]", side_effects: [] }
  - { method: GET, path: "/api/route-manifests/{id}/processing-batches", description: "List processing batches fed by this manifest (0 or 1)", roles: [SystemAdmin, RouteDispatcher, PlantOperator], code: 200, input: [], output: "ProcessingBatch[]", side_effects: [] }
  - { method: GET, path: "/api/pickup-visits/{id}", description: "Get one visit", roles: [SystemAdmin, FieldOpsManager, RouteDispatcher, Driver, BillingAnalyst, CustomerContact], code: 200, input: [], output: PickupVisit, side_effects: [] }
  - { method: POST, path: "/api/pickup-visits/{id}/start", description: "Driver marks arrival (EN_ROUTE)", roles: [Driver], code: 200, input: [], output: PickupVisit, side_effects: ["SCHEDULED -> EN_ROUTE", "manifest DISPATCHED -> IN_PROGRESS"] }
  - { method: POST, path: "/api/pickup-visits/{id}/complete", description: "Record pump meter gallons and field moisture", roles: [Driver], code: 200, input: [pump_gallons, field_moisture_pct], output: PickupVisit, side_effects: ["EN_ROUTE -> COMPLETED", "net_gallons_provisional computed", "container.last_completed_pickup_date updated", "manifest.collected_gallons recomputed"] }
  - { method: POST, path: "/api/pickup-visits/{id}/fail", description: "Record a failed pickup attempt", roles: [Driver], code: 200, input: [reason], output: PickupVisit, side_effects: ["EN_ROUTE -> FAILED -> auto SCHEDULED", "retry_count + 1"] }
  - { method: POST, path: "/api/pickup-visits/{id}/void", description: "Compensating reversal of a completed pickup", roles: [RouteDispatcher], code: 200, input: [reason], output: PickupVisit, side_effects: ["COMPLETED -> VOID", "manifest.collected_gallons recomputed", "PROVISIONAL settlement lines for this visit removed and totals recomputed"] }
  - { method: POST, path: "/api/pickup-visits/{id}/samples", description: "Draw a quality sample at the visit", roles: [Driver], code: 201, input: [], output: QualitySample, side_effects: ["QualitySample COLLECTED"] }
  - { method: GET, path: "/api/pickup-visits/{id}/samples", description: "List samples of a visit", roles: [SystemAdmin, FieldOpsManager, Driver, PlantOperator, BillingAnalyst], code: 200, input: [], output: "QualitySample[]", side_effects: [] }
  - { method: GET, path: "/api/pickup-visits/{id}/settlement-lines", description: "List settlement lines billing this visit", roles: [SystemAdmin, BillingAnalyst, CustomerContact], code: 200, input: [], output: "SettlementLine[]", side_effects: [] }
  - { method: GET, path: "/api/pickup-visits/{id}/complaints", description: "List complaints linked to this visit", roles: [SystemAdmin, FieldOpsManager, CustomerContact], code: 200, input: [], output: "Complaint[]", side_effects: [] }
  - { method: POST, path: "/api/quality-samples/{id}/submit", description: "Submit sample to the lab", roles: [Driver], code: 200, input: [], output: QualitySample, side_effects: ["COLLECTED -> SUBMITTED"] }
  - { method: POST, path: "/api/quality-samples/{id}/grade", description: "Record lab results and compute grade", roles: [PlantOperator], code: 200, input: [lab_moisture_pct, lab_impurity_pct], output: QualitySample, side_effects: ["SUBMITTED|DISPUTED -> GRADED", "grade computed"] }
  - { method: POST, path: "/api/quality-samples/{id}/dispute", description: "Dispute a graded sample (opens re-grade loop)", roles: [FieldOpsManager], code: 200, input: [note], output: QualitySample, side_effects: ["GRADED -> DISPUTED"] }
  - { method: POST, "path": "/api/settlements/generate", description: "Generate a PROVISIONAL settlement for a closed period from COMPLETED non-VOID pickups", roles: [BillingAnalyst], code: 201, input: [customer_id, period_start, period_end], output: Settlement, side_effects: ["SettlementLine PROVISIONAL rows created for included pickups", "provisional_total_cents computed"] }
  - { method: GET, path: "/api/settlements/{id}", description: "Get one settlement", roles: [SystemAdmin, BillingAnalyst, CustomerContact], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: GET, path: "/api/settlements/{id}/lines", description: "List lines of a settlement", roles: [SystemAdmin, BillingAnalyst, CustomerContact], code: 200, input: [], output: "SettlementLine[]", side_effects: [] }
  - { method: POST, path: "/api/settlements/{id}/finalize", description: "Recompute lines under the FINAL variant and post to the rebate ledger", roles: [BillingAnalyst], code: 200, input: [], output: Settlement, side_effects: ["PROVISIONAL -> FINALIZED", "final_total_cents computed", "customer.rebate_balance_cents += final_total_cents"] }
  - { method: POST, path: "/api/settlements/{id}/pay", description: "Disburse a finalized settlement", roles: [BillingAnalyst], code: 200, input: [], output: Settlement, side_effects: ["FINALIZED -> PAID", "customer.rebate_balance_cents -= final_total_cents", "paid_at set"] }
  - { method: POST, path: "/api/settlements/{id}/void", description: "Void a settlement (compensating action)", roles: [BillingAnalyst], code: 200, input: [reason], output: Settlement, side_effects: ["-> VOID", "FINALIZED void reverses the ledger posting"] }
  - { method: POST, path: "/api/complaints", description: "File a spill/odor/nuisance/theft-attempt complaint", roles: [CustomerContact, FieldOpsManager], code: 201, input: [customer_id, category, severity, note, "pickup_visit_id?"], output: Complaint, side_effects: ["status OPEN", "CustomerContact: customer_id must equal X-User-ID"] }
  - { method: POST, path: "/api/complaints/{id}/investigate", description: "Open investigation", roles: [FieldOpsManager], code: 200, input: [], output: Complaint, side_effects: ["OPEN|REOPENED -> INVESTIGATING"] }
  - { method: POST, path: "/api/complaints/{id}/escalate", description: "Escalate an investigation", roles: [FieldOpsManager], code: 200, input: ["note?"], output: Complaint, side_effects: ["INVESTIGATING -> ESCALATED"] }
  - { method: POST, path: "/api/complaints/{id}/resolve", description: "Resolve the complaint", roles: [FieldOpsManager], code: 200, input: [resolution_note], output: Complaint, side_effects: ["-> RESOLVED", "resolved_at set"] }
  - { method: POST, path: "/api/complaints/{id}/reopen", description: "Reopen a resolved complaint within 7 days", roles: [CustomerContact], code: 200, input: [note], output: Complaint, side_effects: ["RESOLVED -> REOPENED", "reopen_count + 1"] }
  - { method: POST, path: "/api/processing-batches", description: "Tip a reconciled manifest into a rendering batch", roles: [PlantOperator], code: 201, input: [manifest_id, input_gallons], output: ProcessingBatch, side_effects: ["weighted_moisture_pct and est_yield_gallons computed", "blocked by open SPILL complaints on the manifest's pickups"] }
  - { method: POST, path: "/api/processing-batches/{id}/process", description: "Record metered output", roles: [PlantOperator], code: 200, input: [actual_output_gallons], output: ProcessingBatch, side_effects: ["INTAKE -> PROCESSED", "yield_rate computed"] }
  - { method: POST, path: "/api/processing-batches/{id}/sell", description: "Sell the rendered product", roles: [PlantOperator], code: 200, input: [sale_price_cents_per_gal], output: ProcessingBatch, side_effects: ["PROCESSED -> SOLD", "sale_revenue_cents computed"] }
  - { method: POST, path: "/api/theft-incidents", description: "Report container tampering", roles: [Driver, CustomerContact, FieldOpsManager], code: 201, input: [container_id, evidence_note], output: TheftIncident, side_effects: ["status REPORTED"] }
  - { method: POST, path: "/api/theft-incidents/{id}/confirm", description: "Confirm tampering: locks the container and cascades", roles: [FieldOpsManager], code: 200, input: [], output: TheftIncident, side_effects: ["REPORTED -> CONFIRMED", "container ACTIVE -> LOCKED", "SCHEDULED visits -> SKIPPED", "missed_pickup_count recompute and possible suspension"] }
  - { method: POST, path: "/api/theft-incidents/{id}/dismiss", description: "Dismiss a report", roles: [FieldOpsManager], code: 200, input: [note], output: TheftIncident, side_effects: ["REPORTED -> DISMISSED"] }
  - { method: POST, path: "/api/theft-incidents/{id}/resolve", description: "Resolve a confirmed incident (lock replaced)", roles: [FieldOpsManager], code: 200, input: [resolution_note], output: TheftIncident, side_effects: ["CONFIRMED -> RESOLVED"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not allowed on the endpoint, or ownership rule violated (CustomerContact acting on another customer's resource; Driver whose X-User-ID != manifest.driver_ref)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "schema violation: missing required field, bad type, enum outside its set, capacity_gallons outside [30, 2000], pump_gallons <= 0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state machine has no transition from the entity's current state for this trigger (incl. terminal lockdown)" }
  - { id: ERR_CONTAINER_LOCKED, http: 409, condition: "pickup complete attempted while the container is LOCKED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "operation requires an ACTIVE-era contract (container placement, settlement finalize) but the contract is DRAFT or terminal" }
  - { id: ERR_SAMPLE_ALREADY_GRADED, http: 409, condition: "grade attempted on a sample already GRADED (dispute first)" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "container placement or manifest dispatch attempted for a SUSPENDED customer" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_TRUCK_UNAVAILABLE, http: 409, condition: "dispatch attempted with truck OUT_OF_SERVICE" }
  - { id: ERR_SPILL_COMPLAINT_OPEN, http: 422, condition: "batch intake blocked by an unresolved SPILL complaint on one of the manifest's pickups" }
  - { id: ERR_CONTRACT_TERM_OVERLAP, http: 409, condition: "contract term window overlaps another non-terminal contract of the same customer (half-open semantics; adjacency allowed)" }
  - { id: ERR_MANIFEST_DATE_CONFLICT, http: 409, condition: "another manifest already exists for the same truck and service_date" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 422, condition: "projected_fill_gallons strictly greater than truck.tank_capacity_gallons at dispatch" }
  - { id: ERR_CONTAINER_CAPACITY_EXCEEDED, http: 422, condition: "pump_gallons exceeds container.capacity_gallons" }
  - { id: ERR_TANK_IMBALANCE, http: 422, condition: "reconcile end level deviates from start + collected - spill by more than 0.5 gallons" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "a non-VOID settlement of the same customer overlaps the requested period" }
  - { id: ERR_PICKUP_WINDOW_FUTURE, http: 422, condition: "pickup completion attempted before its scheduled_date" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "settlement generate/finalize attempted before period_end on the logical clock" }
  - { id: ERR_CONTRACT_IN_COOLING_OFF, http: 422, condition: "contract termination attempted within 14 days of activation" }
  - { id: ERR_COMPLAINT_REOPEN_WINDOW_EXPIRED, http: 422, condition: "complaint reopen attempted more than 7 days after resolution" }
  - { id: ERR_OPEN_SETTLEMENTS, http: 422, condition: "contract termination blocked by settlements in PROVISIONAL or FINALIZED" }
  - { id: ERR_GRADE_PENDING, http: 422, condition: "settlement finalize attempted with an included pickup lacking a GRADED sample" }
  - { id: ERR_QUOTE_NOT_PUBLISHED, http: 422, condition: "no PUBLISHED market index quote covers the required week(s)" }
  - { id: ERR_THEFT_UNRESOLVED, http: 409, condition: "unlock/remove attempted while a CONFIRMED theft incident exists on the container" }
  - { id: ERR_PAYOUT_BELOW_MINIMUM, http: 422, condition: "pay attempted on a settlement with final_total_cents < 100" }

roles:
  - name: SystemAdmin
    description: "Platform operator with full access including the test clock"
    identity: opaque
    exclusive_operations: ["POST /api/_clock/set_current_utc"]
    shared_operations: ["customer/truck registration", "all reads"]
  - name: FieldOpsManager
    description: "Owns contracts, containers, complaints, theft incidents"
    identity: opaque
    exclusive_operations: ["contract lifecycle (activate/amend/offer-renewal/terminate)", "container placement/unlock/remove", "complaint investigate/escalate/resolve", "theft incident confirm/dismiss/resolve", "sample dispute"]
    shared_operations: ["customer registration and reads", "complaint creation", "renewal response"]
  - name: RouteDispatcher
    description: "Builds and reconciles route manifests, voids pickups"
    identity: opaque
