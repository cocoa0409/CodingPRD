# =============================================================================
# Task 1222 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative breadth coverage of §1.1–§1.7 claims not covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections/claim_types follow
# references/claim-extraction-guide.md. Names are unique across BOTH design files.
# =============================================================================

scaffold_corner_design:

  # ============================================================== entities
  - section: entities
    instances:
      - name: client_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /customs/clients with the three required inputs returns 201 with engagement_status ACTIVE, lifetime_recovered_cents 0, projected_fee_accrual_cents 0, open_audit_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id", st: "$.data.engagement_status", v: "$.data.version", rec: "$.data.lifetime_recovered_cents "} }
          assert:
            - "captured st == ACTIVE, v == 1, rec == 0"
            - "GET /customs/clients/${cl}: projected_fee_accrual_cents == 0 and open_audit_count == 0"

      - name: client_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Client, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required contingency_fee_bps fails with ERR_INVALID_REQUEST (400); no client is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789" }, as: FirmAdmin, captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_INVALID_REQUEST (HTTP 400)"
            - "GET /customs/clients returns total_count == 0"

      - name: client_create_extra_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Client]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored; the server mints its own UUID id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500, id: "11111111-2222-3333-4444-555555555555", version: 99 }, as: FirmAdmin, captures: { cl: "$.data.id", v: "$.data.version "} }
          assert:
            - "captured cl != 11111111-2222-3333-4444-555555555555 (server-minted)"
            - "captured v == 1"

      - name: client_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /customs/clients/11111111-2222-3333-4444-555555555555", payload: {}, as: FirmAdmin, captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_NOT_FOUND (HTTP 404)"

      - name: client_list_pagination_fields
        claim_type: listing
        grounds: [entities.Client, response_envelope]
        distinguishing_aspect: "GET /customs/clients?limit=1 over 2 clients returns exactly 1 row with total_count 2 and has_more true; offset=1 returns the second."
        test_recipe:
          setup: ["two clients exist"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { clA: "$.data.id "} }
            - { call: "POST /customs/clients", payload: { name: "Beta Trade", importer_of_record_number: "98-7654321", contingency_fee_bps: 2000 }, as: FirmAdmin, captures: { clB: "$.data.id "} }
          trigger:
            - { call: "GET /customs/clients?limit=1", payload: {}, as: FirmAdmin }
            - { call: "GET /customs/clients?limit=1&offset=1", payload: {}, as: FirmAdmin, captures: { page2: "$.data[0].id "} }
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true"
            - "page 2: captured page2 is one of ${clA}/${clB} and differs from page 1's item; has_more == false"

      - name: classification_first_sale_computed_eligible
        claim_type: computed_fields
        grounds: [entities.HTSClassification.fields.first_sale_eligible, entities.HTSClassification.fields.appraised_unit_value_cents]
        distinguishing_aspect: "All three first-sale flags true and first_sale_price 4000 < declared 5000 -> first_sale_eligible true and appraised_unit_value_cents == 4000; any client-supplied value for these computed fields is ignored."
        test_recipe:
          setup: ["client ACTIVE"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
          trigger:
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000, first_sale_price_cents: 4000, bona_fide_sale: true, arms_length: true, clearly_destined_us: true }, as: Analyst, as_user_id: "u_an1", captures: { eligible: "$.data.first_sale_eligible", appraised: "$.data.appraised_unit_value_cents "} }
          assert:
            - "captured eligible == true and appraised == 4000"

      - name: classification_first_sale_computed_ineligible_when_price_higher
        claim_type: computed_fields
        grounds: [entities.HTSClassification.fields.first_sale_eligible, entities.HTSClassification.fields.appraised_unit_value_cents]
        distinguishing_aspect: "first_sale_price 6000 > declared 5000 fails the savings condition: eligible false and appraised falls back to declared 5000 even with all flags true."
        test_recipe:
          setup: ["client ACTIVE"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
          trigger:
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000, first_sale_price_cents: 6000, bona_fide_sale: true, arms_length: true, clearly_destined_us: true }, as: Analyst, as_user_id: "u_an1", captures: { eligible: "$.data.first_sale_eligible", appraised: "$.data.appraised_unit_value_cents "} }
          assert:
            - "captured eligible == false and appraised == 5000"

      - name: entry_computed_fields_on_create_without_measures
        claim_type: computed_fields
        grounds: [entities.ImportEntry.fields.non_drawbackable_cents, entities.ImportEntry.fields.drawback_eligible_duty_cents, entities.ImportEntry.fields.unclaimed_duty_cents]
        distinguishing_aspect: "With no matching ACTIVE measures, a new entry computes non_drawbackable_cents 0, drawback_eligible_duty_cents == duty_paid_cents == 82500, unclaimed_duty_cents == 82500, matched_quantity 0, status UNMATCHED."
        test_recipe:
          setup: ["client ACTIVE; classification CERTIFIED"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
          trigger:
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { nd: "$.data.non_drawbackable_cents", el: "$.data.drawback_eligible_duty_cents", un: "$.data.unclaimed_duty_cents", st: "$.data.status "} }
          assert:
            - "captured nd == 0, el == 82500, un == 82500, st == UNMATCHED"

      - name: export_defaults_value_pool
        claim_type: defaults
        grounds: [entities.ExportShipment.fields.value_pool_remaining_cents]
        distinguishing_aspect: "New export computes value_pool_remaining_cents == fob_value_cents and matched_quantity 0, status UNMATCHED."
        test_recipe:
          setup: ["client ACTIVE"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
          trigger:
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { pool: "$.data.value_pool_remaining_cents", st: "$.data.status", mq: "$.data.matched_quantity "} }
          assert:
            - "captured pool == 480000, mq == 0, st == UNMATCHED"

      - name: claim_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.DrawbackClaim.fields.claim_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "claim_type outside {DIRECT_IDENTIFICATION, SUBSTITUTION} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["client ACTIVE"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
          trigger:
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "UNUSED_MERCHANDISE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: cross_client_fk_integrity_on_entry
        claim_type: parent_relationships
        grounds: [entities.ImportEntry.fields.classification_id, "errors[ERR_CROSS_CLIENT_REFERENCE]"]
        distinguishing_aspect: "Entry referencing another client's CERTIFIED classification fails ERR_CROSS_CLIENT_REFERENCE (flat-topology FK integrity, distinct from the not-certified gate)."
        test_recipe:
          setup: ["client A ACTIVE; client B ACTIVE with CERTIFIED classification"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { clA: "$.data.id "} }
            - { call: "POST /customs/clients", payload: { name: "Beta Trade", importer_of_record_number: "98-7654321", contingency_fee_bps: 2000 }, as: FirmAdmin, captures: { clB: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${clB}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { clsB: "$.data.id "} }
            - { call: "POST /customs/classifications/${clsB}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${clsB}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
          trigger:
            - { call: "POST /customs/import-entries", payload: { client_id: "${clA}", classification_id: "${clsB}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_CROSS_CLIENT_REFERENCE (HTTP 422)"

  # ============================================================== state_machines
  - section: state_machines
    instances:
      - name: ruling_issued_re_rates_classification
        claim_type: side_effect_execution
        grounds: [state_machines.BindingRuling.SUBMITTED_to_ISSUED]
        distinguishing_aspect: "ISSUED outcome overwrites the linked classification's hts_code and duty_rate_bps (1650 -> 1200) and bumps its version — the ruling cascade lands on the classification, not the entry snapshots."
        test_recipe:
          setup: ["client ACTIVE; classification CERTIFIED at rate 1650"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/binding-rulings", payload: { classification_id: "${cls}", requested_hts_code: "6203.42.4011" }, as: LicensedBroker, as_user_id: "u_br1", captures: { br: "$.data.id", br_st: "$.data.status "} }
          trigger:
            - { call: "POST /customs/binding-rulings/${br}/outcome", payload: { outcome: "ISSUED", issued_hts_code: "6203.42.4036", issued_duty_rate_bps: 1200 }, as: LicensedBroker, as_user_id: "u_br1", captures: { br_final: "$.data.status "} }
          assert:
            - "captured br_st == SUBMITTED (initial state) and br_final == ISSUED"
            - "GET /customs/classifications/${cls}: duty_rate_bps == 1200 and hts_code == 6203.42.4036"

      - name: ruling_create_requires_certified_classification
        claim_type: precondition_enforcement
        grounds: ["validations[priority=8]", state_machines.BindingRuling]
        distinguishing_aspect: "A ruling request against a merely IN_REVIEW classification is rejected with ERR_CLASSIFICATION_NOT_CERTIFIED; the ruling path is gated exactly like entry registration."
        test_recipe:
          setup: ["client ACTIVE; classification IN_REVIEW (submitted, not yet decided)"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
          trigger:
            - { call: "POST /customs/binding-rulings", payload: { classification_id: "${cls}", requested_hts_code: "6203.42.4011" }, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_CLASSIFICATION_NOT_CERTIFIED (HTTP 409)"

      - name: file_from_filed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DrawbackClaim.DRAFT_to_FILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Filing an already-FILED claim is not idempotent: the second file fails ERR_INVALID_STATE (409) and no duplicate records or re-freeze occurs."
        test_recipe:
          setup: ["full pipeline: claim FILED with one line qty 40"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
          trigger:
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_INVALID_STATE (HTTP 409)"
            - "GET /customs/records?claim_id=${claimA} still returns exactly 3 records (no duplicate filing side effects)"

      - name: review_paid_claim_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DrawbackClaim, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "PAID is terminal: any further review outcome on it fails ERR_ALREADY_TERMINAL (409), proving terminal lockdown distinct from ordinary state mismatch."
        test_recipe:
          setup: ["claim fully processed to PAID (32670)"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin }
          trigger:
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "DENIED" }, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_ALREADY_TERMINAL (HTTP 409); claim stays PAID"

      - name: cancel_filed_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DrawbackClaim.DRAFT_to_CANCELLED]
        distinguishing_aspect: "Cancel exists only from DRAFT: cancelling a FILED claim fails ERR_INVALID_STATE, so filed claims can only leave via review outcomes."
        test_recipe:
          setup: ["claim FILED with one line qty 40"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
