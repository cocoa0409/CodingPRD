      - name: temporal_a_certification_window_that_does_not_move_forward_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=72].ERR_INVALID_VALIDITY_WINDOW
          - entities.Certification.valid_from
        distinguishing_aspect: |
          The window test is strict, so a zero-length interval (valid_until equal to
          valid_from) is rejected exactly like a reversed one — an implementation using
          `>=` would happily store a certification that can never cover anything.
        test_recipe:
          setup:
            - "One rule and one verified advertiser."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "TTB-NL-ZERO", issuing_country_code: "US", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_zero: "$.data.error_id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "TTB-NL-REVERSED", issuing_country_code: "US", valid_from: "2026-10-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_rev: "$.data.error_id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "TTB-NL-VALID", issuing_country_code: "US", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-01T00:00:01Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert_id: "$.data.id" }
            - call: "GET /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "Both rejected calls return HTTP 422 with error_id ERR_INVALID_VALIDITY_WINDOW"
            - "The one-second window is accepted with HTTP 201 and Certification.${cert_id}.status == SUBMITTED (it opens in the future)"
            - "GET /ad-policy/certifications?advertiser_id=${adv_id} reports total_count == 1 — neither rejected window left a row"

