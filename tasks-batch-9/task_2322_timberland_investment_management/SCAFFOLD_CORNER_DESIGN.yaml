  - section: validations
    instances:
      - name: income_appraisal_without_a_cap_rate_is_incomplete
        claim_type: violation_to_error
        grounds:
          - "validations[priority=65 ERR_APPRAISAL_INPUTS_INCOMPLETE]"
          - "errors[ERR_APPRAISAL_INPUTS_INCOMPLETE]"
          - "calculations.appraised_value_by_methodology"
          - "endpoints[POST /timberland/properties/{id}/appraisal]"
        distinguishing_aspect: |
          The required input set is methodology-dependent, not a fixed schema: stabilized_noi_usd
          alone is a complete MARKET-shaped payload but an incomplete INCOME one, and the
          divide-by-cap-rate step must be refused before it runs. Supplying the missing cap rate
          on the very next call must succeed and produce 3652173.91, proving the rule guards the
          inputs and not the methodology itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund and Piney Creek Tract (1200.00 acres, appraisal_status NONE)."
            - "The comparable price per acre is deliberately omitted from both calls, since INCOME does not need it."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: {fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI"}
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
          trigger:
