            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "BLACKOUT", start_at: "2026-12-24T00:00:00Z", end_at: "2026-12-26T00:00:00Z" }
              as: AssociationAdmin
              captures: { blk: $.data.id }
          assert:
            - "BranchDirector BLACKOUT create returns 403 ERR_UNAUTHORIZED"
            - "AssociationAdmin BLACKOUT create returns 201 with buffer_minutes == 0"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_membership_version_on_patch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[membership-update-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "PATCH /memberships with expected_membership_version one behind current (a draft creation bumped it) returns 412 ERR_STALE_VERSION; replaying with the fresh version succeeds."
        test_recipe:
          setup:
            - "Member with ACTIVE membership; client observed version V, then a draft creation advanced it to V+1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id, mship_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /memberships/${mship_id}/drafts"
              payload: {}
              as: BranchDirector
              captures: { draft2: $.data.id }
          trigger:
            - call: "PATCH /memberships/${mship_id}"
              payload: { member_ids: ["${member_id}"], expected_membership_version: "${mship_v1}" }
              as: BranchDirector
              captures: { err: $.data.error_id }
          assert:
            - "the stale PATCH returns 412 ERR_STALE_VERSION"
            - "Membership.${mship_id}.version is unchanged by the failed PATCH"

      - name: occ_stale_campaign_version_on_close
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[campaign-close-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Close with the version observed before a donation receive (which bumps campaign.version) returns 412; closing with the fresh version succeeds and freezes match_pct."
        test_recipe:
          setup:
            - "ACTIVE campaign with version captured; a donation receive then bumps the version."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 50000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 100000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
              captures: { camp_v: $.data.version }
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 10000, designation: "GENERAL" }
              as: BranchDirector
              captures: { don_id: $.data.id }
            - call: "POST /donations/${don_id}/receive"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "POST /campaigns/${camp_id}/close"
              payload: { expected_campaign_version: "${camp_v}" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the stale close returns 412 ERR_STALE_VERSION"
            - "Campaign.${camp_id}.status remains ACTIVE"

      - name: clock_default_is_fixed_startup_instant
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — a session created without touching the clock is SCHEDULED (not REG_OPEN) even if the wall clock is later."
        test_recipe:
          setup:
            - "Empty database; the clock endpoint is never called."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Studio 1", kind: "STUDIO", capacity: 30, dropin_capacity: 5 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Hoops", kind: "SPORTS", base_fee_cents: 4000, member_priority_days: 0 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-10", end_on: "2026-09-10", time_start: "18:00", time_end: "19:00", capacity: 10 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
          trigger:
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "ProgramSession.${sess_id}.status == REG_OPEN: with member_priority_days 0 the member window equals the public window and both open at 2026-08-27 (start_on 2026-09-10 minus 14 days), which precedes the default clock 2026-09-01"
            - "created_at timestamps on all created entities read 2026-09-01T00:00:00.000Z, proving the default clock, not wall time"
