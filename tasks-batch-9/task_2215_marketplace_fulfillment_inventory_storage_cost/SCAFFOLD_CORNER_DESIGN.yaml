            - "SkuListing.${l2_id}.suppression_reason == STRANDED_INVENTORY"
            - "SkuListing.${l2_id}.inventory_health == STRANDED"
            - "first call returns HTTP 409 with ${e_not_suppressed} == ERR_LISTING_NOT_SUPPRESSED"
            - "second call returns HTTP 409 with ${e_persists} == ERR_SUPPRESSION_CONDITION_PERSISTS"
            - "SkuListing.${l2_id}.listing_status == SUPPRESSED after the rejected reinstate"
            - "SellerAccount.${s_id}.suppressed_listing_count == 1"

      - name: excluded_parallel_state_dimensions_advance_independently
        claim_type: Parallel State Dimensions
        excluded_because:
          difficulty_instance: sku_listing_stays_suppressed_while_inventory_health_returns_to_healthy
          rationale: "The §1.8 non_linear_state_machine instance already drives listing_status and inventory_health to an inconsistent-looking pair (SUPPRESSED + HEALTHY) and then reinstates, which is the strongest available probe of the parallel dimensions; a breadth duplicate would assert a strict subset of the same transitions."

      - name: excluded_receipt_cascade_reaches_quota_and_seller_ledger
        claim_type: Cascading State Changes
        excluded_because:
          difficulty_instance: partial_receipt_cascade_depth_four_shortfall_to_quota_downgrade
          rationale: "§1.8 transitive_cascade already walks receipt -> plan PARTIALLY_RECEIVED -> lot DISCREPANCY_OPEN -> listing SUPPRESSED/MISSING_INVENTORY -> seller IPRS and quota downgrade in a single trigger, covering every hop a breadth test could inspect."

      - name: excluded_claim_approval_reverses_suppression_and_quota
        claim_type: Reverse Transitions
        excluded_because:
          difficulty_instance: claim_approval_cascade_depth_four_credit_to_quota_restoration
          rationale: "§1.8 already asserts the full reverse path (claim APPROVED -> missing_units 0 -> listing reinstatable -> IPRS restored -> restock limit back to 1500), including the exact credit of 750000 cents."

  # ===========================================================================
  - section: calculations
    instances:
      - name: iprs_penalty_stack_drops_seller_below_suspension_floor
        claim_type: Formula Correctness
        grounds:
          - calculations.iprs_score
          - calculations.restock_limit
          - state_machines.SellerAccount
          - endpoints[POST /fulfillment/sellers/{id}/restock-quotas]
        distinguishing_aspect: "Metric set (sell_through 0.0000, excess 0.0400, stranded 0.1000, in_stock 0.0000) yields raw 217; the stranded penalty 75 plus the discrepancy penalty 50 would drop it to 92, but open_discrepancy_units is 0 so only the 75 applies, giving 142 — below the 200 suspension floor, so tier RESTRICTED with limit floor(1000 * 0.5) = 500 and seller_status SUSPENDED."
        test_recipe:
          setup:
            - "One seller with no discrepancies (open_discrepancy_units 0), base_capacity_units 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 0.0000, excess_units_ratio: 0.0400, stranded_ratio: 0.1000, in_stock_rate: 0.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id", q_score: "$.data.iprs_score", q_tier: "$.data.capacity_tier", q_limit: "$.data.restock_limit_units" }
          assert:
            - "${q_score} == 142"
            - "${q_tier} == TIER_RESTRICTED"
            - "${q_limit} == 500"
            - "RestockQuota.${q_id}.status == ACTIVE"
            - "RestockQuota.${q_id}.utilized_units == 0"
            - "SellerAccount.${s_id}.seller_status == SUSPENDED"

