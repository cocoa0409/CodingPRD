            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { r1_id: $.data.id }
            - call: "POST /routes/${r1_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${r1_id}/dock-appointments"
              payload: { dock_id: "${dock1_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /routes/${r1_id}/dispatch"
              payload: {}
              as: DispatchPlanner
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "REFUSED", refusal_reason: "attempt 1 refused" }
              as: DeliveryLead
              as_user_id: "${team_id}"
            - call: "GET /delivery-orders/${order_id}"
              payload: {}
              as: DispatchPlanner
              captures: { o_v2: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-02", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v2}" }
              as: DispatchPlanner
              captures: { w2_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-02" }
              as: DispatchPlanner
              captures: { r2_id: $.data.id }
            - call: "POST /routes/${r2_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w2_id}" }
              as: DispatchPlanner
              captures: { s2_id: $.data.id }
            - call: "POST /routes/${r2_id}/dock-appointments"
              payload: { dock_id: "${dock2_id}", appt_date: "2026-06-02", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /routes/${r2_id}/dispatch"
              payload: {}
              as: DispatchPlanner
