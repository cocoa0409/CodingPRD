# =============================================================================
# Task 1937 — School Safety Drill & Emergency Operations Plan
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules × 2 instances each.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: evac_timing_standard_vs_unannounced_adjusted
        grounds:
          - calculations.evacuation_time_assessment
          - entities.DrillEvent.fields.met_target_standard
          - entities.DrillEvent.fields.met_target_adjusted
        distinguishing_aspect: |
          DrillEvent-domain dual variant: for one UNANNOUNCED drill with
          official_evac_seconds == 360 against target_evac_seconds == 300,
          the standard variant reports met_target_standard == false while the
          unannounced-adjusted variant (target 300 + ceil(300*0.25)=75 -> 375)
          reports met_target_adjusted == true on identical timing data.
        test_recipe:
          setup:
            - "Site with academic year 2026-08-01..2027-06-30, FIRE requirement (required 2, spacing 20, target 300s), CURRENT site plan, a COMPLETED walkthrough (2026-07-20), and an ACTIVE EOP"
            - "One UNANNOUNCED FIRE drill scheduled 2026-09-15 09:00, executed with roster student stu-1 accounted at 09:06:00 and all-clear at 09:06:00"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS", "UTILITY_SHUTOFFS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "Exits and assembly areas verified", recommendations_count: 1 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v2026.0", content_summary: "Evacuation and lockdown procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: UNANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-1", accommodation_required: false }
              as: SchoolSafetyOfficer
              captures: { entry_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:06:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /roster-entries/${entry_id}/account"
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
          assert:
            - "DrillEvent.${drill_id}.provisional_evac_seconds == 360"
            - "DrillEvent.${drill_id}.official_evac_seconds == 360"
            - "DrillEvent.${drill_id}.met_target_standard == false"
            - "DrillEvent.${drill_id}.met_target_adjusted == true"
            - "DrillEvent.${drill_id}.status == COMPLETED"

      - name: attainment_count_only_vs_count_and_spacing
        grounds:
          - calculations.statutory_attainment
          - entities.ComplianceReport.fields.type_attainments
        distinguishing_aspect: |
          ComplianceReport-domain dual variant: two completed FIRE drills five
          calendar days apart against min_spacing_days == 20 satisfy the
          count_only variant (2 >= 2) but fail the count_and_spacing variant —
          identical drill data, opposite compliance verdicts, on a different
          entity domain than the evacuation-timing variants.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP and FIRE requirement (required 2, spacing 20 days, target 300s)"
            - "Two FIRE drills completed on 2026-09-15 and 2026-09-20 (5 days apart, below the 20-day spacing rule), each with empty roster"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: POLICE, scheduled_date: "2026-07-22" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-22", findings_summary: "Access points verified", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v2026.0", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill1_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill1_id}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-20", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill2_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill2_id}/complete"
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_id: $.data.id }
          assert:
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].completed_count == 2"
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].spacing_compliant == false"
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].attainment_count_only == true"
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].attainment_strict == false"
            - "ComplianceReport.${rep_id}.overall_compliant_count_only == true"
            - "ComplianceReport.${rep_id}.overall_compliant_strict == false"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: strict_attainment_spacing_branch_persistence
        grounds:
          - calculations.statutory_attainment
        distinguishing_aspect: |
          Mode (a) combinatorial formula: statutory_attainment combines >=3
          inputs (completed counts, required_per_year, per-pair spacing gaps)
          with conditional branches; adding a THIRD well-spaced drill does not
          wash out the earlier clustered pair — spacing_compliant stays false
          because the 2026-09-15 -> 2026-09-17 gap (2 days < 20) persists,
          while attainment_count_only stays true (3 >= 2).
        test_recipe:
          setup:
            - "Site with ACTIVE EOP and FIRE requirement (required 2, spacing 20 days, target 300s)"
            - "Three FIRE drills completed on 2026-09-15, 2026-09-17 (gap 2 days), and 2026-10-20 (gap 33 days)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${d1}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${d1}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-17", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { d2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${d2}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${d2}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-10-20", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
