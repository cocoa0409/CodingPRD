              payload: {}
              as: BillingSpecialist
              captures: { allowable_after_4: $.data.monthly_allowable_cents, malf_after_4: $.data.malfunction_count, gap_after_4: $.data.cumulative_oxygen_gap_minutes }
            - call: "POST /home-oxygen/placements/${pl_stat}/malfunction"
