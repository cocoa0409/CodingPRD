              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_us: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_VARIETY_CERTIFICATE", jurisdiction_code: "CA", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_ca: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "MX", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_mx: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "AU", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_au: $.data.id }
            - call: "POST /protection-filings/${f_us}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_mx}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_au}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_us}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_au}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_mx}/abandon"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_au}/lapse"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /protection-filings/${f_ca}/schedule-annuity"
              payload: { annuity_due_date: "2026-10-01T00:00:00Z", annuity_grace_days: 90 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "ProtectionFiling.${f_ca}.status == MAINTENANCE_DUE and annuity_sequence_no == 1"
            - "Variety.${v_id}.protection_posture == PROTECTED (in_force = {US GRANTED, CA MAINTENANCE_DUE})"
            - "Variety.${v_id}.protected_jurisdictions == [\"CA\", \"US\"] in exactly that order - lexicographic ascending, not the US-first creation order"
            - "The AU LAPSED filing and the MX ABANDONED filing contribute no jurisdiction"
            - "After POST /protection-filings/${f_us}/lapse: posture is still PROTECTED and protected_jurisdictions == [\"CA\"]"
            - "After POST /protection-filings/${f_ca}/lapse as well: posture == LAPSED_PROTECTION and protected_jurisdictions == [] - it does NOT fall to PENDING, because the only non-in-force, non-lapsed filing is ABANDONED"

      - name: trial_performance_index_weights_sum_to_one_at_full_marks
        claim_type: weighted_scoring
        grounds:
