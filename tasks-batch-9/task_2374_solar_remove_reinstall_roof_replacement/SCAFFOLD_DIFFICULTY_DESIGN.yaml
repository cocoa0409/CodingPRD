              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 12, dc_kw: 4.92 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-05T13:00:00Z", end_utc: "2026-08-05T21:00:00Z" }
              as: ProjectCoordinator
              captures: { w1: $.data.id }
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/array-circuits/${c1}/energization"
