        distinguishing_aspect: |
          Entity = AMLCase (distinct from BrokerageAccount and PhysicalCertificateDeposit).
          Full cycle: INVESTIGATING -> DECIDED_NO_FILE -> CLOSED -> REOPENED ->
          INVESTIGATING -> SAR_RECOMMENDED, proving the machine loops rather than
          terminating at CLOSED; each hop increments version by exactly 1.
        test_recipe:
          setup:
            - "OPEN LOW account; STRUCTURING rule + 3x BUY 4000.00; scan -> alert; begin-review; escalate -> case."
