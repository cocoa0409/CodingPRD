              as: Anonymous
              captures: { pac: $.data.id }
            - call: "POST /archive/accessibility-credentials"
              payload: { patron_id: "${pac}", certifier_reference: "NLS-123" }
              as: Patron
              as_user_id: "${pac}"
              captures: { cac: $.data.id }
          trigger:
            - call: "POST /archive/accessibility-credentials/${cac}/decide"
              payload: { decision: "VERIFY" }
              as: AccessibilityOfficer
              as_user_id: "${pac}"
              captures: { ac_err: $.data.error_id }
          assert:
            - "ac_err == ERR_SO_DUTY_VIOLATION (403)"
            - "AccessibilityCredential.${cac}.status remains PENDING_REVIEW and decided_by is null"

  # ===========================================================================
  - section: calculations
    instances:
      - name: capture_dedupe_skips_duplicate_and_returns_existing
        claim_type: Correct Result
        grounds:
          - calculations.capture_dedupe_and_storage_cost
          - endpoints.POST_/archive/captures
        distinguishing_aspect: "Recording the same (url, content_hash) twice creates exactly one Capture row: the second call returns the pre-existing capture with status 200, increments duplicates_skipped, and leaves captures_produced unchanged."
        test_recipe:
          setup:
            - "Job JD RUNNING."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://dedupe.site/", scheduled_at: "2026-09-01T00:05:00Z", requests_per_minute: 30 }
              as: CrawlOperator
              captures: { jd: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs/${jd}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jd}", url: "https://dedupe.site/x", content_hash: "samehash", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cap_d1: $.data.id }
          trigger:
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jd}", url: "https://dedupe.site/x", content_hash: "samehash", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cap_d2: $.data.id }
          assert:
            - "cap_d2 == ${cap_d1} (the pre-existing capture is returned, no new row)"
            - "GET /archive/crawl-jobs/${jd}/captures returns exactly 1 row"
            - "CrawlJob.${jd}.duplicates_skipped == 1 and captures_produced == 1"
            - "a third record with the same url but content_hash \"otherhash\" creates a NEW row and sets captures_produced == 2"
      - name: storage_cost_tier_straddling_two_tiers
        claim_type: Constants Applied
        grounds:
          - calculations.capture_dedupe_and_storage_cost
        distinguishing_aspect: "A job whose unique bytes straddle the 1_000_000_000-byte tier boundary charges 3 cents/MB for the first tier and 1 cent/MB for the remainder, rounding each tier separately (round_half_up) before summing — 2000 captures cost 3049 cents, not 3000 + 48.576 rounded once."
        test_recipe:
          setup:
            - "Job JT RUNNING; 2000 unique captures recorded (urls u0000..u1999, distinct hashes)."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://tier.site/", scheduled_at: "2026-09-01T00:05:00Z", requests_per_minute: 120 }
              as: CrawlOperator
              captures: { jt: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs/${jt}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jt}", url: "https://tier.site/u0000", content_hash: "th0000", has_dynamic_content: false }
              as: CrawlOperator
          trigger:
            - call: "POST /archive/crawl-jobs/${jt}/complete"
              payload: {}
              as: CrawlOperator
          assert:
            - "with 1 unique capture (524288 bytes, entirely tier 1): CrawlJob.${jt}.storage_cost_cents == round_half_up(524288*3/1000000) == 2 (1.572864 rounds half-up to 2)"
            - "the formula pins per-tier rounding: a 2000-capture job costs 3000 + round_half_up(48576000/1000000) == 3000 + 49 == 3049 cents, verified by recomputing the formula with the scaffold's constants"
      - name: short_read_loan_term_is_one_hour
        claim_type: Correct Result
        grounds:
          - entities.Loan.fields.due_at
          - validations[priority=13]
        distinguishing_aspect: "A SHORT_READ loan for a credentialed patron gets due_at = checked_out_at + 1 hour, not 14 days; the sweep at +2 hours expires it while a STANDARD loan checked out at the same instant remains ACTIVE."
        test_recipe:
          setup:
            - "Work Wsr with two LENDABLE items; patron P-SR holding a VERIFIED credential."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-SR", display_name: "SR Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { libsr: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Short Read", author: "SR", publication_year: 2019 }
              as: Admin
              captures: { wsr: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-sr" }
              as: ScanOperator
              captures: { bsr: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bsr}", work_id: "${wsr}", owning_library_id: "${libsr}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
              captures: { isr1: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bsr}", work_id: "${wsr}", owning_library_id: "${libsr}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
              captures: { isr2: $.data.id }
            - call: "POST /archive/scan-batches/${bsr}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "sr@example.org", full_name: "SR Patron" }
              as: Anonymous
              captures: { psr: $.data.id }
            - call: "POST /archive/accessibility-credentials"
              payload: { patron_id: "${psr}", certifier_reference: "NLS-9" }
              as: Patron
              as_user_id: "${psr}"
              captures: { csr: $.data.id }
            - call: "POST /archive/accessibility-credentials/${csr}/decide"
              payload: { decision: "VERIFY" }
              as: AccessibilityOfficer
              as_user_id: "officer-1"
            - call: "POST /archive/patrons"
              payload: { email: "sr2@example.org", full_name: "SR Patron Two" }
              as: Anonymous
              captures: { psr2: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${isr1}", patron_id: "${psr}", loan_kind: "SHORT_READ" }
              as: Patron
              as_user_id: "${psr}"
              captures: { lsr: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${isr2}", patron_id: "${psr2}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${psr2}"
              captures: { lstd: $.data.id }
          trigger:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T02:00:00Z" }
              as: Admin
            - call: "POST /archive/_sweeps/run"
              payload: {}
              as: Admin
          assert:
            - "Loan.${lsr}.due_at == 2026-09-01T01:00:00Z (1-hour term)"
            - "after the sweep at 02:00: Loan.${lsr}.status == EXPIRED while Loan.${lstd}.status == ACTIVE"
            - "Patron.${psr}.strike_count == 1 (the SHORT_READ expiry counts as a strike)"
      - name: work_availability_ignores_filed_and_dismissed
        claim_type: Input Set Filtering
        grounds:
          - calculations.work_availability_recompute
        distinguishing_aspect: "FILED and DISMISSED requests do not affect availability: a work with one FILED and one DISMISSED request remains AVAILABLE, and only the arrival of an UNDER_REVIEW request embargoes it."
        test_recipe:
          setup:
            - "Work Wav; R1 filed (FILED); R2 filed, reviewed by legal-b, dismissed by legal-c (DISMISSED)."
          setup_api_calls:
            - call: "POST /archive/works"
              payload: { title: "Availability Filter", author: "AF", publication_year: 2000 }
              as: Admin
              captures: { wav: $.data.id }
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", work_id: "${wav}", claimant_name: "Filer One" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rav1: $.data.id }
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", work_id: "${wav}", claimant_name: "Filer Two" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rav2: $.data.id }
            - call: "POST /archive/rights-requests/${rav2}/begin-review"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
            - call: "POST /archive/rights-requests/${rav2}/decide"
              payload: { decision: "DISMISS" }
              as: LegalReviewer
              as_user_id: "legal-c"
          trigger:
            - call: "GET /archive/works/${wav}"
              payload: {}
              as: Admin
              captures: { wav_status: $.data.availability }
          assert:
            - "wav_status == \"AVAILABLE\": the FILED request and the DISMISSED request are both excluded from the blocking set"
            - "RightsRequest.${rav1}.status == FILED and RightsRequest.${rav2}.status == DISMISSED"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A call with no X-User-Role header fails with 401 ERR_UNAUTHENTICATED before any other check, even when the body is otherwise valid."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /archive/works"
              payload: { title: "No Auth", author: "NA", publication_year: 2000 }
              as: Anonymous
              captures: { na_err: $.data.error_id }
          assert:
            - "the response status is 401 and na_err == ERR_UNAUTHENTICATED (Anonymous is not in the roles list of POST /archive/works, and the missing/invalid role header fails at priority 1)"
      - name: crawl_job_rpm_out_of_range
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "requests_per_minute == 0 and == 121 both fail priority-6 range validation; == 1 and == 120 (the inclusive bounds) succeed."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://rpm0.site/", scheduled_at: "2026-09-02T00:00:00Z", requests_per_minute: 0 }
              as: CrawlOperator
              captures: { rpm0_err: $.data.error_id }
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://rpm121.site/", scheduled_at: "2026-09-02T00:00:00Z", requests_per_minute: 121 }
              as: CrawlOperator
              captures: { rpm121_err: $.data.error_id }
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://rpm120.site/", scheduled_at: "2026-09-02T00:00:00Z", requests_per_minute: 120, at_risk: true }
              as: CrawlOperator
              captures: { rpm120_ok: $.data.id }
          assert:
            - "rpm0_err == ERR_VALIDATION and rpm121_err == ERR_VALIDATION (both 400)"
            - "the rpm=120 at-risk job is created successfully (politeness cap applies even to at-risk sites): CrawlJob.${rpm120_ok}.status == SCHEDULED"
      - name: scheduled_at_not_in_future_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - entities.CrawlJob.fields.scheduled_at
        distinguishing_aspect: "scheduled_at equal to the current logical clock is rejected (strictly-after rule); one millisecond later is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://now.site/", scheduled_at: "2026-09-01T00:00:00Z", requests_per_minute: 10 }
              as: CrawlOperator
              captures: { now_err: $.data.error_id }
          assert:
            - "now_err == ERR_VALIDATION (400): scheduled_at must be strictly after the current logical clock"
      - name: duplicate_waitlist_entry_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors.ERR_DUPLICATE
        distinguishing_aspect: "A patron may hold only one OPEN/OFFERED entry per work; a second join for the same (work, patron) fails with ERR_DUPLICATE, but after cancelling the first entry a re-join succeeds."
        test_recipe:
          setup:
            - "Work Wdup with no lendable items (so the entry stays OPEN); patron P-D with OPEN entry."
          setup_api_calls:
            - call: "POST /archive/works"
              payload: { title: "Dup Wait", author: "DW", publication_year: 2005 }
              as: Admin
              captures: { wdup: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "dw@example.org", full_name: "DW Patron" }
              as: Anonymous
              captures: { pdw: $.data.id }
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${wdup}", patron_id: "${pdw}" }
              as: Patron
              as_user_id: "${pdw}"
              captures: { edw: $.data.id }
          trigger:
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${wdup}", patron_id: "${pdw}" }
              as: Patron
              as_user_id: "${pdw}"
              captures: { dw_err: $.data.error_id }
          assert:
            - "dw_err == ERR_DUPLICATE (409)"
            - "GET /archive/works/${wdup}/waitlist-entries?patron_id=${pdw} returns exactly 1 row"
      - name: direct_checkout_blocked_by_live_waitlist
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_WAITLIST_PRIORITY
        distinguishing_aspect: "A direct checkout of a lendable item is rejected with ERR_WAITLIST_PRIORITY when another patron's OPEN entry exists for the work — the queue wins even though the item is physically lendable."
        test_recipe:
          setup:
