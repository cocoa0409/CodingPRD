          Three impregnations on the same work order (each predecessor rejected so the replacement
          is legal) hit all three varnish multipliers and both sides of the cycle-bonus cap:
          VPI with 5 cycles would earn 0.16 uncapped but must be capped at 0.12 (2.78), DIP_BAKE
