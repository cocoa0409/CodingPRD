# =============================================================================
# PRD Benchmark Scaffold — RIA / Financial-Advisor Practice Management (Expert)
# §1.0–§1.7. Companion files: SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8),
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  711. RIA / Financial-Advisor Practice: client onboarding & risk/IPS, account
  aggregation & held-away assets, AUM-fee billing & calculation, portfolio model
  & rebalance/drift, financial-plan & goal tracking, meeting/review cadence & CRM,
  compliance (Reg BI/Form ADV) & archiving, householding & fee schedule

domain_name: ria-practice
api_prefix: /   # flat topology: all entity collections are peers rooted at the server root (no shared parent path segment)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Household.version for fee-run creation (true CREATE-with-supersede race)
    - dual_variant_calculation      # arrears vs advance AUM fee; projected vs actual goal funding
    - derived_field_reconciliation  # household billable_aum, drift_pct, plan on_track recomputed on source change
    - cascading_side_effects        # IPS lock -> account gating; fee-run finalize -> household balance + compliance task
    - rate_threshold_triggers       # householding breakpoints, drift threshold, suitability bands

  entity_topology: flat
  # Household is a top-level resource; Client, Account, Portfolio, FeeSchedule,
  # InvestmentPolicyStatement, FeeRun, FinancialPlan, Goal, Review, ComplianceItem,
  # RebalanceOrder are peer entities joined by explicit FK fields (no deep URL nesting).

  state_machine_shape: cyclic
  # IPS revision loop (cyclic), FeeRun branching fork-join, RebalanceOrder branching
  # with revert, ComplianceItem cyclic remediation, FinancialPlan parallel dimensions.

  relationship_patterns:
    - one_to_many        # Household -> Clients, Household -> Accounts, FinancialPlan -> Goals
    - cross_aggregate    # FeeRun reads Account balances; RebalanceOrder reads Portfolio + IPS
    - polymorphic        # ComplianceItem.subject_type references Client | Account | Household

  role_model: segregation_of_duties
  # Advisor builds/proposes; ComplianceOfficer approves IPS & archives; BillingAdmin
  # runs and finalizes fees; the advisor who proposes an IPS cannot self-approve it,
  # and the advisor who builds a fee run cannot finalize it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Household display name (e.g. 'The Carter Family')" }
      - { name: lead_advisor_id, type: string, source: input, description: "Opaque Advisor operator id who owns the relationship; X-User-ID of the lead advisor" }
      - { name: fee_schedule_id, type: string, source: input, description: "FK -> FeeSchedule.id; the tiered schedule applied to this household's AUM fee runs" }
      - { name: billing_method, type: enum, source: input, default: ARREARS, description: "ARREARS | ADVANCE — whether fees bill on period-end (arrears) or prior-period-end (advance) balance", constraints: "one of {ARREARS, ADVANCE}" }
      - { name: billable_aum_cents, type: integer, source: computed, default: 0, description: "Sum of Account.market_value_cents for member Accounts where status=ACTIVE AND billable=true AND held_away=false" }
      - { name: aggregated_aum_cents, type: integer, source: computed, default: 0, description: "Sum of Account.market_value_cents for ALL member Accounts where status=ACTIVE (includes held_away and non-billable) — drives householding breakpoint tier" }
      - { name: breakpoint_tier_index, type: integer, source: computed, default: 0, description: "0-based index of the FeeSchedule tier selected by aggregated_aum_cents; pins the marginal-rate schedule for the next fee run" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED — CLOSED households reject new fee runs and account additions", constraints: "one of {ACTIVE, CLOSED}" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Schedule label (e.g. 'Standard 2024')" }
      - { name: tiers, type: array, source: input, description: "Ordered ascending tiers; each {upper_bound_cents:int|null, annual_rate_bps:int}; final tier upper_bound_cents=null (open-ended). Marginal: a balance is split across tiers." }
      - { name: minimum_annual_fee_cents, type: integer, source: input, default: 0, description: "Floor applied to the annualized fee before proration" }
      - { name: is_locked, type: boolean, source: computed, default: false, description: "True once referenced by any FeeRun in state CALCULATED or FINALIZED; locked schedules reject tier edits" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household this client belongs to" }
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for age-based suitability" }
      - { name: risk_capacity_score, type: integer, source: input, description: "0-100 objective ability-to-bear-loss score from onboarding questionnaire", constraints: "0..100" }
      - { name: risk_tolerance_score, type: integer, source: input, description: "0-100 subjective willingness-to-bear-loss score from onboarding questionnaire", constraints: "0..100" }
      - { name: suitability_band, type: enum, source: computed, default: MODERATE, description: "CONSERVATIVE | MODERATE | AGGRESSIVE — derived from min(capacity,tolerance) bands", constraints: "one of {CONSERVATIVE, MODERATE, AGGRESSIVE}" }
      - { name: onboarding_status, type: enum, source: system, default: PROSPECT, description: "PROSPECT -> KYC_VERIFIED -> IPS_SIGNED -> ACTIVE; DISENGAGED terminal", constraints: "one of {PROSPECT, KYC_VERIFIED, IPS_SIGNED, ACTIVE, DISENGAGED}" }

  - name: InvestmentPolicyStatement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client whose IPS this is" }
      - { name: target_portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; the model portfolio this IPS mandates" }
      - { name: max_equity_pct, type: integer, source: input, description: "Hard ceiling on equity allocation 0..100 the advisor proposes", constraints: "0..100" }
      - { name: drift_tolerance_bps, type: integer, source: input, default: 500, description: "Absolute drift in bps beyond which a rebalance is mandated", constraints: ">0" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Increments each time a PROPOSED IPS is sent back to DRAFT for revision (cycle counter)" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque ComplianceOfficer X-User-ID who approved this IPS; null until APPROVED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PROPOSED -> APPROVED -> SUPERSEDED; PROPOSED -> DRAFT on changes-requested (cycle)", constraints: "one of {DRAFT, PROPOSED, APPROVED, SUPERSEDED}" }

  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model portfolio name (e.g. 'Balanced Growth')" }
      - { name: model_equity_pct, type: integer, source: input, description: "Target equity weight 0..100 for this model", constraints: "0..100" }
      - { name: target_weights, type: array, source: input, description: "List of {sleeve:string, target_pct:int}; the target_pct values MUST sum to 100" }
      - { name: is_published, type: boolean, source: computed, default: false, description: "True once published; only published portfolios may be referenced by an IPS target_portfolio_id" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household that aggregates this account" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the primary owner client" }
      - { name: custodian, type: string, source: input, description: "Custodian name (e.g. 'Schwab')" }
      - { name: account_type, type: enum, source: input, description: "TAXABLE | IRA | ROTH | TRUST | HELD_AWAY_401K", constraints: "one of {TAXABLE, IRA, ROTH, TRUST, HELD_AWAY_401K}" }
      - { name: held_away, type: boolean, source: input, default: false, description: "True for assets the RIA tracks but does not custody; excluded from billable_aum_cents but included in aggregated_aum_cents" }
      - { name: billable, type: boolean, source: input, default: true, description: "Whether this account participates in AUM fee billing" }
      - { name: market_value_cents, type: integer, source: input, default: 0, description: "Current marked value in cents; set on creation and updated via valuation endpoint", constraints: ">=0" }
      - { name: equity_value_cents, type: integer, source: input, default: 0, description: "Portion of market_value_cents currently in equities; used for drift", constraints: ">=0,<=market_value_cents" }
      - { name: drift_bps, type: integer, source: computed, default: 0, description: "abs(actual_equity_pct - linked IPS portfolio model_equity_pct) in bps; recomputed on valuation" }
      - { name: rebalance_flagged, type: boolean, source: computed, default: false, description: "True when drift_bps >= linked IPS drift_tolerance_bps" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACTIVE -> FROZEN -> CLOSED; FROZEN excluded from new rebalance orders", constraints: "one of {PENDING, ACTIVE, FROZEN, CLOSED}" }

  - name: FeeRun
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household being billed" }
      - { name: period_start, type: string, source: input, description: "ISO date YYYY-MM-DD inclusive period start" }
      - { name: period_end, type: string, source: input, description: "ISO date YYYY-MM-DD inclusive period end; must be > period_start" }
      - { name: billing_method_snapshot, type: enum, source: system, description: "Copy of Household.billing_method at run creation (ARREARS|ADVANCE) — pins the variant", constraints: "one of {ARREARS, ADVANCE}" }
      - { name: fee_schedule_snapshot_id, type: string, source: system, description: "FK -> FeeSchedule.id; schedule pinned at run creation, immune to later schedule edits" }
      - { name: basis_aum_cents, type: integer, source: computed, default: 0, description: "Billable AUM the fee is computed on, per the billing_method variant" }
      - { name: gross_fee_cents, type: integer, source: computed, default: 0, description: "Tiered marginal fee, prorated by period day-count, before minimum floor" }
      - { name: assessed_fee_cents, type: integer, source: computed, default: 0, description: "Final fee after applying minimum_annual_fee floor (prorated); equals gross unless floor binds" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> CALCULATED -> {FINALIZED | VOIDED}; CALCULATED -> DRAFT on recalc request", constraints: "one of {DRAFT, CALCULATED, FINALIZED, VOIDED}" }

  - name: FinancialPlan
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household this plan covers" }
      - { name: name, type: string, source: input, description: "Plan title (e.g. 'Retirement 2045')" }
      - { name: assumed_annual_return_bps, type: integer, source: input, default: 600, description: "Projection return assumption in bps (e.g. 600 = 6.00%)", constraints: ">=0" }
      - { name: monthly_contribution_cents, type: integer, source: input, default: 0, description: "Assumed recurring monthly contribution for projection", constraints: ">=0" }
      - { name: review_status, type: enum, source: system, default: NEEDS_REVIEW, description: "Independent review axis: NEEDS_REVIEW | REVIEWED | STALE (parallel to lifecycle_status)", constraints: "one of {NEEDS_REVIEW, REVIEWED, STALE}" }
      - { name: lifecycle_status, type: enum, source: system, default: DRAFT, description: "Independent lifecycle axis: DRAFT -> ACTIVE -> ARCHIVED (parallel to review_status)", constraints: "one of {DRAFT, ACTIVE, ARCHIVED}" }

  - name: Goal
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> FinancialPlan.id; the plan this goal belongs to" }
      - { name: name, type: string, source: input, description: "Goal name (e.g. 'College Fund')" }
      - { name: target_amount_cents, type: integer, source: input, description: "Future target in cents", constraints: ">0" }
      - { name: target_date, type: string, source: input, description: "ISO date YYYY-MM-DD the goal is due" }
      - { name: current_amount_cents, type: integer, source: input, default: 0, description: "Funds earmarked toward this goal today", constraints: ">=0" }
      - { name: funded_ratio_bps, type: integer, source: computed, default: 0, description: "Projected/actual funding ratio in bps per the active variant; 10000 = 100%" }
      - { name: on_track, type: boolean, source: computed, default: false, description: "True when funded_ratio_bps >= 10000 under the plan's projection variant" }
      - { name: priority, type: enum, source: input, default: SECONDARY, description: "ESSENTIAL | SECONDARY | ASPIRATIONAL — waterfall funding order", constraints: "one of {ESSENTIAL, SECONDARY, ASPIRATIONAL}" }

  - name: RebalanceOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account to be rebalanced" }
      - { name: target_portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; copied from the account's client's APPROVED IPS at order creation" }
      - { name: trade_equity_delta_cents, type: integer, source: computed, default: 0, description: "Signed cents to move into(+)/out of(-) equity to hit the model weight" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> APPROVED -> EXECUTED; PROPOSED -> REJECTED (revert)", constraints: "one of {PROPOSED, APPROVED, EXECUTED, REJECTED}" }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household being reviewed" }
      - { name: cadence_days, type: integer, source: input, default: 365, description: "Required days between completed reviews", constraints: ">0" }
      - { name: scheduled_for, type: string, source: input, description: "ISO date YYYY-MM-DD the review is scheduled" }
      - { name: completed_at, type: string, source: system, description: "ISO datetime when marked complete; null until COMPLETED" }
      - { name: next_due_date, type: string, source: computed, description: "completed_at date + cadence_days; null until COMPLETED" }
      - { name: is_overdue, type: boolean, source: computed, default: false, description: "True when logical clock date > scheduled_for and status=SCHEDULED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> {COMPLETED | MISSED}; MISSED when superseded by a later scheduled review", constraints: "one of {SCHEDULED, COMPLETED, MISSED}" }

  - name: ComplianceItem
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "CLIENT | ACCOUNT | HOUSEHOLD — polymorphic subject of the obligation", constraints: "one of {CLIENT, ACCOUNT, HOUSEHOLD}" }
      - { name: subject_id, type: string, source: input, description: "Id of the subject entity (Client.id, Account.id, or Household.id per subject_type)" }
      - { name: obligation_type, type: enum, source: input, description: "REG_BI_DISCLOSURE | FORM_ADV_DELIVERY | IPS_ARCHIVE | FEE_DISCLOSURE", constraints: "one of {REG_BI_DISCLOSURE, FORM_ADV_DELIVERY, IPS_ARCHIVE, FEE_DISCLOSURE}" }
      - { name: due_date, type: string, source: input, description: "ISO date YYYY-MM-DD the obligation is due" }
      - { name: archive_hash, type: string, source: system, description: "Tamper-evident hash stamped on ARCHIVED; null until archived" }
      - { name: remediation_round, type: integer, source: computed, default: 0, description: "Increments each REMEDIATION -> OPEN cycle" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> SATISFIED -> ARCHIVED; OPEN -> REMEDIATION -> OPEN (cycle); ARCHIVED terminal", constraints: "one of {OPEN, REMEDIATION, SATISFIED, ARCHIVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PROSPECT
    terminal_states: [DISENGAGED]
    transitions:
      - from: PROSPECT
        to: KYC_VERIFIED
        trigger: "POST /clients/{id}/state action=VERIFY_KYC"
        actor: Advisor
        preconditions:
          - "client.onboarding_status == PROSPECT"
          - "client.date_of_birth present and parses to a valid past date"
        side_effects:
          - "compute Client.suitability_band from min(risk_capacity_score, risk_tolerance_score)"
      - from: KYC_VERIFIED
        to: IPS_SIGNED
        trigger: "POST /clients/{id}/state action=SIGN_IPS"
        actor: Advisor
        preconditions:
          - "client.onboarding_status == KYC_VERIFIED"
          - "an InvestmentPolicyStatement exists for this client with status == APPROVED"
        side_effects:
          - "no field change beyond onboarding_status and updated_at/version"
      - from: IPS_SIGNED
        to: ACTIVE
        trigger: "POST /clients/{id}/state action=ACTIVATE"
        actor: Advisor
        preconditions:
          - "client.onboarding_status == IPS_SIGNED"
          - "at least one Account exists for this client with status IN {PENDING, ACTIVE}"
        side_effects:
          - "no cascade beyond onboarding_status"
      - from: PROSPECT
        to: DISENGAGED
        trigger: "POST /clients/{id}/state action=DISENGAGE"
        actor: Advisor
        preconditions:
          - "client.onboarding_status IN {PROSPECT, KYC_VERIFIED}"
        side_effects:
          - "no cascade"

  - entity: InvestmentPolicyStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /investment-policy-statements/{id}/state action=PROPOSE"
        actor: Advisor
        preconditions:
          - "ips.status == DRAFT"
          - "Portfolio target_portfolio_id exists with is_published == true"
          - "ips.max_equity_pct >= Portfolio.model_equity_pct (mandate must permit the model)"
        side_effects:
          - "record proposing_advisor = X-User-ID for the segregation-of-duties check at approval"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /investment-policy-statements/{id}/state action=REQUEST_CHANGES"
        actor: ComplianceOfficer
        preconditions:
          - "ips.status == PROPOSED"
        side_effects:
          - "increment ips.revision_round by 1 (cycle counter)"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /investment-policy-statements/{id}/state action=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "ips.status == PROPOSED"
          - "X-User-ID != the proposing_advisor recorded at propose time (segregation of duties)"
        side_effects:
          - "set ips.approved_by_user_id = X-User-ID"
          - "supersede any other IPS for the same client_id currently in status APPROVED: that prior IPS APPROVED -> SUPERSEDED"
          - "create a ComplianceItem {subject_type: CLIENT, subject_id: client_id, obligation_type: IPS_ARCHIVE, status: OPEN}"
        note: "Cyclic shape: DRAFT<->PROPOSED loop. Cascade origin for compliance-item creation."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer IPS for the same client is APPROVED"
        actor: system
        preconditions:
          - "ips.status == APPROVED"
        side_effects:
          - "no further cascade"

  - entity: Account
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /accounts/{id}/state action=ACTIVATE"
        actor: Advisor
        preconditions:
          - "account.status == PENDING"
          - "owning Client.onboarding_status IN {IPS_SIGNED, ACTIVE} (cross-entity gate)"
          - "owning Household.status == ACTIVE"
        side_effects:
          - "recompute Household.billable_aum_cents and aggregated_aum_cents (ledger sync)"
          - "recompute Household.breakpoint_tier_index from aggregated_aum_cents"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /accounts/{id}/state action=FREEZE"
        actor: Advisor
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "recompute Household.billable_aum_cents and aggregated_aum_cents (frozen value still aggregated but not billable)"
          - "cancel any RebalanceOrder for this account in status PROPOSED: PROPOSED -> REJECTED"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /accounts/{id}/state action=UNFREEZE"
        actor: Advisor
        preconditions:
          - "account.status == FROZEN"
          - "owning Household.status == ACTIVE"
        side_effects:
          - "recompute Household.billable_aum_cents and aggregated_aum_cents"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/state action=CLOSE"
        actor: Advisor
        preconditions:
          - "account.status == ACTIVE"
          - "no FeeRun referencing owning household in status DRAFT or CALCULATED (cross-entity gate: cannot close while an open fee run is in flight)"
        side_effects:
          - "recompute Household.billable_aum_cents and aggregated_aum_cents and breakpoint_tier_index"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /accounts/{id}/state action=CLOSE"
        actor: Advisor
        preconditions:
          - "account.status == FROZEN"
          - "no FeeRun referencing owning household in status DRAFT or CALCULATED"
        side_effects:
          - "recompute Household.billable_aum_cents and aggregated_aum_cents and breakpoint_tier_index"

  - entity: FeeRun
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /fee-runs/{id}/state action=CALCULATE"
        actor: BillingAdmin
        preconditions:
          - "feeRun.status == DRAFT"
          - "owning Household.status == ACTIVE (cross-entity gate)"
          - "feeRun.period_end > feeRun.period_start"
        side_effects:
          - "compute basis_aum_cents per billing_method_snapshot (aum_fee_basis_selection)"
          - "compute gross_fee_cents via tiered_marginal_fee using fee_schedule_snapshot tiers and prorate by day-count"
          - "compute assessed_fee_cents by applying prorated minimum_annual_fee floor"
          - "lock the referenced FeeSchedule (FeeSchedule.is_locked = true)"
      - from: CALCULATED
        to: DRAFT
        trigger: "POST /fee-runs/{id}/state action=RECALC"
        actor: BillingAdmin
        preconditions:
          - "feeRun.status == CALCULATED"
        side_effects:
          - "clear basis_aum_cents, gross_fee_cents, assessed_fee_cents to 0 (await recompute)"
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /fee-runs/{id}/state action=FINALIZE"
        actor: BillingAdmin
        preconditions:
          - "feeRun.status == CALCULATED"
          - "X-User-ID != the user who created the fee run (segregation of duties: builder cannot finalize)"
          - "no other FeeRun for the same household with overlapping [period_start, period_end] in status FINALIZED (resource_temporal_overlap)"
        side_effects:
          - "create a ComplianceItem {subject_type: HOUSEHOLD, subject_id: household_id, obligation_type: FEE_DISCLOSURE, status: OPEN}"
          - "increment Household.version by 1 (finalized fee run is a household-level mutation)"
      - from: CALCULATED
        to: VOIDED
        trigger: "POST /fee-runs/{id}/state action=VOID"
        actor: BillingAdmin
        preconditions:
          - "feeRun.status == CALCULATED"
        side_effects:
          - "no compliance item; fee run discarded"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /fee-runs/{id}/state action=VOID"
        actor: BillingAdmin
        preconditions:
          - "feeRun.status == DRAFT"
        side_effects:
          - "no compliance item"

  - entity: RebalanceOrder
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /rebalance-orders/{id}/state action=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == PROPOSED"
          - "linked Account.status == ACTIVE (cross-entity gate: cannot approve a rebalance for a FROZEN/CLOSED account)"
          - "the account's client has an InvestmentPolicyStatement in status APPROVED"
        side_effects:
          - "no field change beyond status"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /rebalance-orders/{id}/state action=EXECUTE"
        actor: Advisor
        preconditions:
          - "order.status == APPROVED"
          - "linked Account.status == ACTIVE"
        side_effects:
          - "set Account.equity_value_cents so actual equity pct == target_portfolio.model_equity_pct"
          - "recompute Account.drift_bps and rebalance_flagged (drift_evaluation) — drift collapses toward 0"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /rebalance-orders/{id}/state action=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == PROPOSED"
        side_effects:
          - "no field change beyond status"

  - entity: ComplianceItem
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /compliance-items/{id}/state action=SATISFY"
        actor: ComplianceOfficer
        preconditions:
          - "item.status == OPEN"
          - "logical clock date <= item.due_date (cannot satisfy after the obligation lapsed — must remediate)"
        side_effects:
          - "no field change beyond status"
      - from: OPEN
        to: REMEDIATION
        trigger: "POST /compliance-items/{id}/state action=FLAG_REMEDIATION"
        actor: ComplianceOfficer
        preconditions:
          - "item.status == OPEN"
          - "logical clock date > item.due_date (only overdue items enter remediation)"
        side_effects:
          - "no field change beyond status"
      - from: REMEDIATION
        to: OPEN
        trigger: "POST /compliance-items/{id}/state action=REOPEN"
        actor: ComplianceOfficer
        preconditions:
          - "item.status == REMEDIATION"
        side_effects:
          - "increment item.remediation_round by 1 (cycle counter)"
          - "advance item.due_date by 30 days from current logical clock date"
      - from: SATISFIED
        to: ARCHIVED
        trigger: "POST /compliance-items/{id}/state action=ARCHIVE"
        actor: ComplianceOfficer
        preconditions:
          - "item.status == SATISFIED"
        side_effects:
          - "stamp item.archive_hash = sha256(subject_type|subject_id|obligation_type|created_at)"

  - entity: FinancialPlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /financial-plans/{id}/state action=ACTIVATE"
        actor: Advisor
        preconditions:
          - "plan.lifecycle_status == DRAFT"
          - "at least one Goal exists for this plan"
        side_effects:
          - "recompute funded_ratio_bps and on_track for every Goal under this plan (goal_funding_projection)"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /financial-plans/{id}/state action=ARCHIVE"
        actor: Advisor
        preconditions:
          - "plan.lifecycle_status == ACTIVE"
        side_effects:
          - "no cascade beyond lifecycle_status"
        note: "Parallel dimension: review_status (NEEDS_REVIEW|REVIEWED|STALE) evolves independently of lifecycle_status via /review and /mark-stale."
      - from: NEEDS_REVIEW
        to: REVIEWED
        trigger: "POST /financial-plans/{id}/state action=MARK_REVIEWED"
        actor: Advisor
        preconditions:
          - "plan.review_status == NEEDS_REVIEW"
        side_effects:
          - "recompute funded_ratio_bps and on_track for every Goal under this plan"
        note: "review_status axis is orthogonal to lifecycle_status; both are tracked on the same FinancialPlan row (parallel state dimensions)."
      - from: REVIEWED
        to: STALE
        trigger: "POST /financial-plans/{id}/state action=MARK_STALE"
        actor: Advisor
        preconditions:
          - "plan.review_status == REVIEWED"
        side_effects:
          - "no field change beyond review_status"
      - from: STALE
        to: REVIEWED
        trigger: "POST /financial-plans/{id}/state action=MARK_REVIEWED"
        actor: Advisor
        preconditions:
          - "plan.review_status == STALE"
        side_effects:
          - "recompute funded_ratio_bps and on_track for every Goal under this plan"

  - entity: Review
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /reviews/{id}/complete"
        actor: Advisor
        preconditions:
          - "review.status == SCHEDULED"
          - "owning Household.status == ACTIVE"
        side_effects:
          - "stamp completed_at = current logical clock datetime"
          - "compute next_due_date = completed_at date + cadence_days"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: a later Review for the same household is created with scheduled_for after this review's scheduled_for"
        actor: system
        preconditions:
          - "review.status == SCHEDULED"
        side_effects:
          - "no further cascade"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: fee-run-create-stale-household
    parent_entity: Household
    write_endpoint: "POST /fee-runs"
    occ_field: "expected_household_version"
    description: |
      Creating a FeeRun against a Household whose version has advanced since the
      client last observed it is rejected. A finalized fee run legitimately
      supersedes the prior period's billing and bumps Household.version; a second
      create still carrying the stale version is rejected on the OCC check, not on
      any state precondition (the household remains ACTIVE and a new run is itself
      legitimate).
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aum_fee_basis_selection
    trigger: "FeeRun DRAFT -> CALCULATED (POST /fee-runs/{id}/calculate)"
    algorithm: forward_looking
    formula: |
      # basis_aum_cents depends on the run's billing_method_snapshot variant.
      # ARREARS: bill on the household's billable AUM AS OF period_end (current
      #          Account.market_value_cents for ACTIVE, billable, non-held-away accounts).
      # ADVANCE: bill on the household's billable AUM AS OF period_start, which the
      #          system snapshots as the most recently FINALIZED FeeRun's basis_aum_cents
      #          for this household whose period_end == this run's period_start; if no such
      #          prior finalized run exists, fall back to the current billable_aum_cents.
      def basis(run, household, prior_finalized_runs):
          if run.billing_method_snapshot == "ARREARS":
              return household.billable_aum_cents
          else:  # ADVANCE
              priors = [r for r in prior_finalized_runs
                        if r.household_id == household.id
                        and r.status == "FINALIZED"
                        and r.period_end == run.period_start]
              if priors:
                  # tie-break: latest by created_at ASC -> take the last (most recent)
                  priors.sort(key=lambda r: r.created_at)
                  return priors[-1].basis_aum_cents
              return household.billable_aum_cents
    input_set: "Accounts where status=ACTIVE AND billable=true AND held_away=false belonging to the household; ARREARS uses current values, ADVANCE uses prior finalized run snapshot."
    constants: {}
    precision: "integer cents; no rounding (values already in cents)"
    variants:
      - name: arrears
        when: "household.billing_method == ARREARS"
        difference: "basis is current billable AUM at period_end"
      - name: advance
        when: "household.billing_method == ADVANCE"
        difference: "basis is billable AUM at period_start (prior finalized run's basis, else current)"

  - name: tiered_marginal_fee
    trigger: "FeeRun DRAFT -> CALCULATED (POST /fee-runs/{id}/calculate), after aum_fee_basis_selection"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered fee over basis_aum_cents using fee_schedule_snapshot tiers
      # (ordered ascending by upper_bound_cents; final tier upper_bound_cents=null).
      # Annual fee, then prorated by period day-count, then minimum floor.
      #
      # Step 1 — marginal annual fee (per-tier rounding pinned: round EACH tier
      # slice to whole cents with round_half_up, THEN sum; NOT sum-then-round):
      def annual_fee_cents(basis, tiers):
          remaining = basis
          lower = 0
          total = 0
          for t in tiers:                       # tiers ordered ascending
              cap = t.upper_bound_cents if t.upper_bound_cents is not None else basis
              slice_amt = max(0, min(cap, basis) - lower)
              if slice_amt <= 0:
                  lower = cap
                  continue
              # bps -> fraction: rate_bps / 10000; round each slice independently
              tier_fee = round_half_up(slice_amt * t.annual_rate_bps / 10000)
              total += tier_fee
              lower = cap
              if t.upper_bound_cents is None:
                  break
          return total
      # Step 2 — prorate by inclusive day-count of [period_start, period_end]:
      days = (date(period_end) - date(period_start)).days + 1
      prorated = round_half_up(annual_fee_cents(basis, tiers) * days / 365)
      gross_fee_cents = prorated
      # Step 3 — apply prorated minimum floor:
      min_prorated = round_half_up(fee_schedule.minimum_annual_fee_cents * days / 365)
      assessed_fee_cents = max(gross_fee_cents, min_prorated)
    input_set: "basis_aum_cents from aum_fee_basis_selection; tiers + minimum from fee_schedule_snapshot."
    constants:
      DAYS_PER_YEAR: 365
      BPS_DENOMINATOR: 10000
    precision: "round_half_up to whole cents; ORDER PINNED — round each tier slice, then sum, then round proration, then round floor."
    variants:
      - name: floor_binds
        when: "prorated marginal fee < prorated minimum_annual_fee"
        difference: "assessed_fee_cents = prorated minimum (floor binds); gross_fee_cents still reflects pre-floor marginal fee"
      - name: floor_clear
        when: "prorated marginal fee >= prorated minimum_annual_fee"
        difference: "assessed_fee_cents == gross_fee_cents"

  - name: householding_breakpoint_tier
    trigger: "any Account status change to/from ACTIVE, or valuation update (POST /accounts/{id}/valuation), or account add"
    algorithm: threshold
    formula: |
      # Circular-looking dependency pinned by evaluation order:
      #   aggregated_aum_cents depends on member Account market values;
      #   breakpoint_tier_index depends on aggregated_aum_cents;
      #   the NEXT fee run's effective marginal rate depends on breakpoint_tier_index.
      # Evaluation order is fixed: (1) recompute aggregated_aum_cents from accounts,
      # (2) select tier index, (3) fee runs read the pinned index — never recurse.
      def aggregated_aum(household, accounts):
          return sum(a.market_value_cents for a in accounts
                     if a.household_id == household.id and a.status == "ACTIVE")
      def tier_index(aggregated, tiers):
          # tiers ascending; pick the index of the FIRST tier whose upper_bound_cents
          # is None OR aggregated < upper_bound_cents. Boundary is STRICT:
          # aggregated EXACTLY equal to a tier's upper_bound_cents falls into the NEXT tier.
          for i, t in enumerate(tiers):
              if t.upper_bound_cents is None or aggregated < t.upper_bound_cents:
                  return i
          return len(tiers) - 1
    input_set: "Member Accounts with status=ACTIVE (includes held_away and non-billable for AGGREGATION, unlike the billable basis)."
    constants: {}
    precision: "integer cents; strict < boundary (aggregated == upper_bound_cents => next tier)"
    variants:
      - name: at_boundary
        when: "aggregated_aum_cents == a tier's upper_bound_cents exactly"
        difference: "falls into the HIGHER tier (strict <), so an extra cent does not change tier but landing exactly on the bound does"

  - name: drift_evaluation
    trigger: "POST /accounts/{id}/valuation, and RebalanceOrder execute"
    algorithm: weighted_scoring
    formula: |
      # drift = |actual equity weight - model equity weight|, in bps.
      # actual_equity_pct = equity_value_cents / market_value_cents (0 if market_value 0).
      # model comes from the account's client's APPROVED IPS -> target Portfolio.model_equity_pct.
      def drift_bps(account, model_equity_pct):
          if account.market_value_cents == 0:
              actual_bps = 0
          else:
              actual_bps = round_half_up(account.equity_value_cents * 10000 / account.market_value_cents)
          model_bps = model_equity_pct * 100         # pct -> bps
          return abs(actual_bps - model_bps)
      rebalance_flagged = drift_bps >= ips.drift_tolerance_bps   # boundary: >= flags
    input_set: "Single account's market_value_cents and equity_value_cents; model_equity_pct from APPROVED IPS target Portfolio."
    constants:
      BPS_PER_PCT: 100
    precision: "round_half_up to whole bps; rebalance_flagged uses >= (at-tolerance flags)"
    variants:
      - name: no_approved_ips
        when: "the account's client has no APPROVED IPS"
        difference: "drift_bps = 0 and rebalance_flagged = false (no model to compare against)"

  - name: goal_funding_projection
    trigger: "Goal create, FinancialPlan activate, plan mark-reviewed; POST /goals/{id}"
    algorithm: forward_looking
    formula: |
      # Two variants on a DIFFERENT entity domain (FinancialPlan/Goal, not fees).
      # PROJECTED (plan.lifecycle_status == ACTIVE): future-value the current balance
      # plus monthly contributions to target_date at the plan's assumed return.
      # ACTUAL (plan.lifecycle_status == DRAFT): ratio of current funds to target only.
      def months_between(today, target_date):
          return max(0, (target_date.year - today.year) * 12 + (target_date.month - today.month))
      def projected_value_cents(goal, plan, today):
          n = months_between(today, date(goal.target_date))
          r = plan.assumed_annual_return_bps / 10000 / 12   # monthly rate
          fv = goal.current_amount_cents * ((1 + r) ** n)
          if r == 0:
              contrib_fv = plan.monthly_contribution_cents * n
          else:
              contrib_fv = plan.monthly_contribution_cents * (((1 + r) ** n - 1) / r)
          return round_half_up(fv + contrib_fv)
      def funded_ratio_bps(goal, plan, today):
          if plan.lifecycle_status == "ACTIVE":
              pv = projected_value_cents(goal, plan, today)
          else:  # ACTUAL
              pv = goal.current_amount_cents
          if goal.target_amount_cents == 0:
              return 0
          return round_half_up(pv * 10000 / goal.target_amount_cents)
      on_track = funded_ratio_bps >= 10000     # boundary: 100% exactly => on track
    input_set: "Single Goal current_amount_cents/target; plan assumed_annual_return_bps + monthly_contribution_cents; logical clock 'today'."
    constants:
      BPS_FULL: 10000
    precision: "round_half_up to whole cents/bps; on_track uses >= 10000 (exactly 100% counts)"
    variants:
      - name: projected
        when: "plan.lifecycle_status == ACTIVE"
        difference: "funded_ratio uses future-valued balance + contribution annuity to target_date"
      - name: actual
        when: "plan.lifecycle_status == DRAFT"
        difference: "funded_ratio uses current_amount only (no projection)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "all body FK references (household_id, client_id, fee_schedule_id, target_portfolio_id, plan_id, account_id) point to existing entities"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all creation endpoints with FK body fields"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: business_referential
    check: "segregation of duties — IPS approver != proposing advisor; FeeRun finalizer != creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /investment-policy-statements/{id}/approve, POST /fee-runs/{id}/finalize"
  - priority: 7
    category: business_safety
    check: "compliance gate — IPS max_equity_pct >= target Portfolio.model_equity_pct on propose; only published portfolios referenceable"
    error_id: ERR_IPS_MANDATE_VIOLATION
    http_status: 422
    applies_to: "POST /investment-policy-statements/{id}/propose"
  - priority: 8
    category: business_constraint
    check: "cross-entity gate — account activation requires owning client in {IPS_SIGNED, ACTIVE}; rebalance approval requires linked account ACTIVE and client IPS APPROVED"
    error_id: ERR_CROSS_ENTITY_PRECONDITION
    http_status: 409
    applies_to: "POST /accounts/{id}/activate, POST /rebalance-orders/{id}/approve"
  - priority: 9
    category: business_temporal
    check: "no two FINALIZED FeeRuns for the same household with overlapping inclusive [period_start, period_end] day-ranges"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fee-runs/{id}/finalize"
  - priority: 10
    category: business_temporal
    check: "two SCHEDULED reviews for the same household may not share the same scheduled_for date (zero-gap collision on the review calendar)"
    error_id: ERR_REVIEW_DATE_COLLISION
    http_status: 409
    applies_to: "POST /reviews"
  - priority: 11
    category: business_constraint
    check: "Portfolio target_weights target_pct values must sum to exactly 100; equity_value_cents <= market_value_cents on accounts"
    error_id: ERR_ALLOCATION_INVALID
    http_status: 422
    applies_to: "POST /portfolios, POST /accounts, POST /accounts/{id}/valuation"
  - priority: 12
    category: business_temporal
    check: "FeeRun period_end must be strictly after period_start"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /fee-runs"
  - priority: 13
    category: business_fiscal
    check: "OCC — expected_household_version must equal current Household.version on fee-run creation"
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412
    applies_to: "POST /fee-runs"
  - priority: 14
    category: business_constraint
    check: "field-level input validation — enums in declared set, scores within 0..100, non-negative cents, valid ISO dates, pagination limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [BillingAdmin, ComplianceOfficer, Advisor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances logical clock; is_overdue on SCHEDULED reviews recomputed lazily on read"]

  # ---- FeeSchedule ----
  - method: POST
    path: "/fee-schedules"
    description: "Create a tiered fee schedule"
    roles: [BillingAdmin]
    code: 201
    input: [name, tiers, "minimum_annual_fee_cents?"]
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/fee-schedules/{id}"
    description: "Read a fee schedule"
    roles: [BillingAdmin, Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/fee-schedules"
    description: "List fee schedules"
    roles: [BillingAdmin, Advisor, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
  - method: PATCH
    path: "/fee-schedules/{id}"
    description: "Edit tiers/minimum of an unlocked fee schedule (ERR_INVALID_STATE if is_locked)"
    roles: [BillingAdmin]
    code: 200
    input: ["tiers?", "minimum_annual_fee_cents?"]
    output: FeeSchedule
    side_effects: []

  # ---- Portfolio ----
  - method: POST
    path: "/portfolios"
    description: "Create a model portfolio (DRAFT, unpublished); target_weights must sum to 100"
    roles: [Advisor]
    code: 201
    input: [name, model_equity_pct, target_weights]
    output: Portfolio
    side_effects: ["validate target_weights sum to 100 (ERR_ALLOCATION_INVALID otherwise)"]
  - method: POST
    path: "/portfolios/{id}/publish"
    description: "Publish a portfolio so IPSs may target it (sets is_published=true)"
    roles: [Advisor]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["set is_published=true"]
  - method: GET
    path: "/portfolios/{id}"
    description: "Read a portfolio"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Portfolio
    side_effects: []
  - method: GET
    path: "/portfolios"
    description: "List portfolios"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Portfolio[]
    side_effects: []

  # ---- Household ----
  - method: POST
    path: "/households"
    description: "Create a household (billing root)"
    roles: [Advisor]
    code: 201
    input: [name, lead_advisor_id, fee_schedule_id, "billing_method?"]
    output: Household
    side_effects: ["billable_aum_cents/aggregated_aum_cents/breakpoint_tier_index initialized to 0"]
  - method: GET
    path: "/households/{id}"
    description: "Read a household with computed AUM and breakpoint tier"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/households"
    description: "List households, optionally filtered by fee_schedule_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["fee_schedule_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []
  - method: POST
    path: "/households/{id}/close"
    description: "Close a household (ACTIVE -> CLOSED; no further fee runs / account adds)"
    roles: [Advisor]
    code: 200
    input: []
    output: Household
    side_effects: ["set status=CLOSED"]
  - method: GET
    path: "/households/{id}/clients"
    description: "List clients in a household (FK reverse-reachability for Client.household_id)"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/households/{id}/accounts"
    description: "List accounts in a household (FK reverse-reachability for Account.household_id)"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Account[]
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a prospect client under a household"
    roles: [Advisor]
    code: 201
    input: [household_id, full_name, date_of_birth, risk_capacity_score, risk_tolerance_score]
    output: Client
    side_effects: ["onboarding_status=PROSPECT"]
  - method: GET
    path: "/clients/{id}"
    description: "Read a client"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients, optionally filtered by household_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/state"
    description: "Drive the Client onboarding state machine. action: VERIFY_KYC (PROSPECT->KYC_VERIFIED, computes suitability_band), SIGN_IPS (KYC_VERIFIED->IPS_SIGNED, requires APPROVED IPS), ACTIVATE (IPS_SIGNED->ACTIVE, requires an account), DISENGAGE (PROSPECT/KYC_VERIFIED->DISENGAGED)."
    roles: [Advisor]
    code: 200
    input: [action]
    output: Client
    side_effects: ["VERIFY_KYC computes suitability_band"]

  # ---- InvestmentPolicyStatement ----
  - method: POST
    path: "/investment-policy-statements"
    description: "Create a DRAFT IPS for a client"
    roles: [Advisor]
    code: 201
    input: [client_id, target_portfolio_id, max_equity_pct, "drift_tolerance_bps?"]
    output: InvestmentPolicyStatement
    side_effects: []
  - method: GET
    path: "/investment-policy-statements/{id}"
    description: "Read an IPS"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: []
  - method: GET
    path: "/investment-policy-statements"
    description: "List IPSs, optionally filtered by client_id or target_portfolio_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["client_id?", "target_portfolio_id?", "limit?", "offset?"]
    output: InvestmentPolicyStatement[]
    side_effects: []
  - method: POST
    path: "/investment-policy-statements/{id}/state"
    description: "Drive the IPS approval state machine. action: PROPOSE (Advisor, DRAFT->PROPOSED, records proposing advisor, mandate check), REQUEST_CHANGES (ComplianceOfficer, PROPOSED->DRAFT cycle, bumps revision_round), APPROVE (ComplianceOfficer, PROPOSED->APPROVED, SoD-gated, supersedes prior APPROVED IPS, spawns IPS_ARCHIVE ComplianceItem)."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: [action]
    output: InvestmentPolicyStatement
    side_effects: ["PROPOSE records proposing advisor", "REQUEST_CHANGES increments revision_round", "APPROVE sets approved_by_user_id, supersedes prior APPROVED IPS for same client, creates ComplianceItem IPS_ARCHIVE"]

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Add an account to a household/client (PENDING); equity_value_cents <= market_value_cents"
    roles: [Advisor]
    code: 201
    input: [household_id, client_id, custodian, account_type, "market_value_cents?", "equity_value_cents?", "held_away?", "billable?"]
    output: Account
    side_effects: ["validate equity_value_cents <= market_value_cents"]
  - method: GET
    path: "/accounts/{id}"
    description: "Read an account with computed drift"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts, optionally filtered by household_id or client_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["household_id?", "client_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/valuation"
    description: "Update market_value_cents/equity_value_cents; recompute drift and household AUM/tier"
    roles: [Advisor]
    code: 200
    input: [market_value_cents, equity_value_cents]
    output: Account
    side_effects: ["recompute drift_bps/rebalance_flagged (drift_evaluation)", "recompute Household billable_aum/aggregated_aum/breakpoint_tier_index (householding_breakpoint_tier)"]
  - method: POST
    path: "/accounts/{id}/state"
    description: "Drive the Account state machine. action: ACTIVATE (PENDING->ACTIVE, cross-entity gated on client+household), FREEZE (ACTIVE->FROZEN, cancels PROPOSED rebalance orders), UNFREEZE (FROZEN->ACTIVE), CLOSE (ACTIVE/FROZEN->CLOSED, blocked while an open fee run is in flight). All recompute Household AUM/tier."
    roles: [Advisor]
    code: 200
    input: [action]
    output: Account
    side_effects: ["recompute Household billable_aum/aggregated_aum/breakpoint_tier_index", "FREEZE cascades PROPOSED RebalanceOrders -> REJECTED"]
  - method: GET
    path: "/accounts/{id}/rebalance-orders"
    description: "List rebalance orders for an account (FK reverse-reachability for RebalanceOrder.account_id)"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RebalanceOrder[]
    side_effects: []

  # ---- FeeRun ----
  - method: POST
    path: "/fee-runs"
    description: "Create a DRAFT fee run for a household; OCC on Household.version; snapshots billing_method + schedule"
    roles: [BillingAdmin]
    code: 201
    input: [household_id, period_start, period_end, expected_household_version]
    output: FeeRun
    side_effects: ["snapshot billing_method_snapshot and fee_schedule_snapshot_id", "increments Household.version by 1"]
  - method: GET
    path: "/fee-runs/{id}"
    description: "Read a fee run with computed fee fields"
    roles: [BillingAdmin, Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: FeeRun
    side_effects: []
  - method: GET
    path: "/fee-runs"
    description: "List fee runs, optionally filtered by household_id or fee_schedule_snapshot_id"
    roles: [BillingAdmin, Advisor, ComplianceOfficer]
    code: 200
    input: ["household_id?", "fee_schedule_snapshot_id?", "limit?", "offset?"]
    output: FeeRun[]
    side_effects: []
  - method: POST
    path: "/fee-runs/{id}/state"
    description: "Drive the FeeRun state machine. action: CALCULATE (DRAFT->CALCULATED, runs basis selection + tiered marginal fee + floor, locks schedule), RECALC (CALCULATED->DRAFT, clears computed fee fields), FINALIZE (CALCULATED->FINALIZED, SoD-gated builder!=finalizer, overlap-checked, spawns FEE_DISCLOSURE item, bumps Household.version), VOID (DRAFT/CALCULATED->VOIDED)."
    roles: [BillingAdmin]
    code: 200
    input: [action]
    output: FeeRun
    side_effects: ["CALCULATE computes basis/gross/assessed and locks schedule", "RECALC clears basis/gross/assessed to 0", "FINALIZE creates ComplianceItem FEE_DISCLOSURE and increments Household.version by 1"]

  # ---- FinancialPlan ----
  - method: POST
    path: "/financial-plans"
    description: "Create a DRAFT financial plan for a household"
    roles: [Advisor]
    code: 201
    input: [household_id, name, "assumed_annual_return_bps?", "monthly_contribution_cents?"]
    output: FinancialPlan
    side_effects: []
  - method: GET
    path: "/financial-plans/{id}"
    description: "Read a plan with both status axes"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: FinancialPlan
    side_effects: []
  - method: GET
    path: "/financial-plans"
    description: "List financial plans, optionally filtered by household_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: FinancialPlan[]
    side_effects: []
  - method: POST
    path: "/financial-plans/{id}/state"
    description: "Drive the FinancialPlan parallel state machine (two independent axes on one row). lifecycle axis actions: ACTIVATE (DRAFT->ACTIVE, requires a goal, recomputes goal projections), ARCHIVE (ACTIVE->ARCHIVED). review axis actions: MARK_REVIEWED (NEEDS_REVIEW/STALE->REVIEWED, recomputes goal projections), MARK_STALE (REVIEWED->STALE)."
    roles: [Advisor]
    code: 200
    input: [action]
    output: FinancialPlan
    side_effects: ["ACTIVATE and MARK_REVIEWED recompute every child Goal funded_ratio_bps/on_track (goal_funding_projection)"]
  - method: GET
    path: "/financial-plans/{id}/goals"
    description: "List goals under a plan (FK reverse-reachability for Goal.plan_id)"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Goal[]
    side_effects: []

  # ---- Goal ----
  - method: POST
    path: "/goals"
    description: "Create a goal under a plan; computes funded ratio per active variant"
    roles: [Advisor]
    code: 201
    input: [plan_id, name, target_amount_cents, target_date, "current_amount_cents?", "priority?"]
    output: Goal
    side_effects: ["compute funded_ratio_bps/on_track (goal_funding_projection)"]
  - method: GET
    path: "/goals/{id}"
    description: "Read a goal"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Goal
    side_effects: []
  - method: POST
    path: "/goals/{id}/fund"
    description: "Add funds to current_amount_cents (amount_cents > 0); recomputes funded ratio"
    roles: [Advisor]
    code: 200
    input: [amount_cents]
    output: Goal
    side_effects: ["increase current_amount_cents", "recompute funded_ratio_bps/on_track"]

  # ---- RebalanceOrder ----
  - method: POST
    path: "/rebalance-orders"
    description: "Propose a rebalance for an account; copies target portfolio from client's APPROVED IPS; computes trade delta"
    roles: [Advisor]
    code: 201
    input: [account_id]
    output: RebalanceOrder
    side_effects: ["copy target_portfolio_id from client's APPROVED IPS", "compute trade_equity_delta_cents"]
  - method: GET
    path: "/rebalance-orders/{id}"
    description: "Read a rebalance order"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: RebalanceOrder
    side_effects: []
  - method: GET
    path: "/rebalance-orders"
    description: "List rebalance orders, optionally filtered by account_id or target_portfolio_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["account_id?", "target_portfolio_id?", "limit?", "offset?"]
    output: RebalanceOrder[]
    side_effects: []
  - method: POST
    path: "/rebalance-orders/{id}/state"
    description: "Drive the RebalanceOrder state machine. action: APPROVE (ComplianceOfficer, PROPOSED->APPROVED, cross-entity gated on account ACTIVE + client IPS APPROVED), REJECT (ComplianceOfficer, PROPOSED->REJECTED), EXECUTE (Advisor, APPROVED->EXECUTED, collapses account drift toward model)."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: [action]
    output: RebalanceOrder
    side_effects: ["EXECUTE sets Account.equity_value_cents to model weight and recomputes drift_bps/rebalance_flagged"]

  # ---- Review ----
  - method: POST
    path: "/reviews"
    description: "Schedule a household review; a later scheduled_for supersedes a prior SCHEDULED review (-> MISSED); two SCHEDULED reviews may not share the same scheduled_for"
    roles: [Advisor]
    code: 201
    input: [household_id, scheduled_for, "cadence_days?"]
    output: Review
    side_effects: ["mark prior SCHEDULED review with earlier scheduled_for as MISSED if this one is later"]
  - method: GET
    path: "/reviews/{id}"
    description: "Read a review with is_overdue/next_due_date"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/reviews"
    description: "List reviews, optionally filtered by household_id"
    roles: [Advisor, ComplianceOfficer, BillingAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Review[]
    side_effects: []
  - method: POST
    path: "/reviews/{id}/complete"
    description: "SCHEDULED -> COMPLETED; stamps completed_at, computes next_due_date"
    roles: [Advisor]
    code: 200
    input: []
    output: Review
    side_effects: ["stamp completed_at", "compute next_due_date"]

  # ---- ComplianceItem ----
  - method: POST
    path: "/compliance-items"
    description: "Manually open a compliance obligation"
    roles: [ComplianceOfficer]
    code: 201
    input: [subject_type, subject_id, obligation_type, due_date]
    output: ComplianceItem
    side_effects: []
  - method: GET
    path: "/compliance-items/{id}"
    description: "Read a compliance item"
    roles: [ComplianceOfficer, Advisor, BillingAdmin]
    code: 200
    input: []
    output: ComplianceItem
    side_effects: []
  - method: GET
    path: "/compliance-items"
    description: "List compliance items, optionally filtered by subject_id or status"
    roles: [ComplianceOfficer, Advisor, BillingAdmin]
    code: 200
    input: ["subject_id?", "status?", "limit?", "offset?"]
    output: ComplianceItem[]
    side_effects: []
  - method: POST
    path: "/compliance-items/{id}/state"
    description: "Drive the ComplianceItem remediation state machine. action: SATISFY (OPEN->SATISFIED, only on/before due_date), FLAG_REMEDIATION (OPEN->REMEDIATION, only when overdue), REOPEN (REMEDIATION->OPEN cycle, bumps remediation_round, advances due_date 30 days), ARCHIVE (SATISFIED->ARCHIVED, stamps archive_hash)."
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: ComplianceItem
    side_effects: ["REOPEN increments remediation_round and advances due_date by 30 days from clock", "ARCHIVE stamps archive_hash"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "body FK reference (household_id/client_id/fee_schedule_id/target_portfolio_id/plan_id/account_id) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not defined from the resource's current state, or edit of a locked fee schedule" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "IPS approver equals proposing advisor, or FeeRun finalizer equals creator" }
  - { id: ERR_IPS_MANDATE_VIOLATION, http: 422, condition: "IPS max_equity_pct < target Portfolio.model_equity_pct on propose, or target portfolio not published" }
  - { id: ERR_CROSS_ENTITY_PRECONDITION, http: 409, condition: "account activation without client in {IPS_SIGNED,ACTIVE}; rebalance approval without account ACTIVE or client IPS APPROVED" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "finalizing a fee run whose [period_start,period_end] overlaps another FINALIZED run for the same household" }
  - { id: ERR_REVIEW_DATE_COLLISION, http: 409, condition: "two SCHEDULED reviews for the same household share the same scheduled_for date" }
  - { id: ERR_ALLOCATION_INVALID, http: 422, condition: "portfolio target_weights do not sum to 100, or equity_value_cents > market_value_cents" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "fee run period_end not strictly after period_start" }
  - { id: ERR_STALE_HOUSEHOLD_VERSION, http: 412, condition: "expected_household_version != current Household.version on fee-run creation (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "field-level violation: bad enum, score out of 0..100, negative cents, malformed ISO date, pagination limit out of 1..100" }
  - { id: ERR_FEE_RUN_OPEN, http: 409, condition: "closing an account while a DRAFT/CALCULATED fee run for the household is in flight" }
  - { id: ERR_PORTFOLIO_NOT_PUBLISHED, http: 422, condition: "IPS targets a portfolio with is_published=false" }
  - { id: ERR_NO_APPROVED_IPS, http: 409, condition: "proposing/approving a rebalance order for an account whose client has no APPROVED IPS" }
  - { id: ERR_COMPLIANCE_NOT_DUE, http: 409, condition: "flag-remediation on an item not yet overdue, or satisfy on an item already past due_date" }
  - { id: ERR_DUPLICATE_APPROVED_IPS, http: 409, condition: "proposing a new IPS while the client already has a PROPOSED IPS in flight" }
  - { id: ERR_GOAL_AMOUNT_INVALID, http: 422, condition: "goal target_amount_cents <= 0, or fund amount_cents <= 0" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit < 1, limit > 100, or offset < 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Advisor
    description: "Builds the practice: onboards clients, builds portfolios/IPSs (proposes only), adds/manages accounts, runs financial plans and reviews, proposes & executes rebalances."
    identity: "opaque"   # X-User-ID is the advisor operator id stored as Household.lead_advisor_id / IPS proposing advisor; not an entity primary key
    exclusive_operations:
      - "POST /households"
      - "POST /clients (+ verify-kyc, sign-ips, activate, disengage)"
      - "POST /portfolios (+ publish)"
      - "POST /investment-policy-statements (+ propose)"
      - "POST /accounts (+ valuation, activate, freeze, unfreeze, close)"
      - "POST /financial-plans (+ activate, archive, mark-reviewed, mark-stale)"
      - "POST /goals (+ fund)"
      - "POST /reviews (+ complete)"
      - "POST /rebalance-orders (+ execute)"
      - "POST /households/{id}/close"
    shared_operations:
      - "all GET reads"
  - name: ComplianceOfficer
    description: "Independent oversight: approves/requests-changes IPSs (cannot be the proposing advisor), approves/rejects rebalances, manages and archives compliance obligations."
    identity: "opaque"   # operator id; recorded as IPS approved_by_user_id; SoD compares to proposing advisor's X-User-ID
    exclusive_operations:
      - "POST /investment-policy-statements/{id}/approve"
      - "POST /investment-policy-statements/{id}/request-changes"
      - "POST /rebalance-orders/{id}/approve"
      - "POST /rebalance-orders/{id}/reject"
      - "POST /compliance-items (+ satisfy, flag-remediation, reopen, archive)"
    shared_operations:
      - "all GET reads"
  - name: BillingAdmin
    description: "Owns fee mechanics: creates fee schedules, creates/calculates/finalizes/voids fee runs (cannot finalize a run it created), sets the logical clock."
    identity: "opaque"   # operator id; recorded as FeeRun creator; SoD compares finalizer to creator
    exclusive_operations:
      - "POST /fee-schedules (+ PATCH)"
      - "POST /fee-runs (+ calculate, recalc-request, finalize, void)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
