            - call: "POST /home-oxygen/rental-contracts/${c_id}/billing-months"
              payload: { service_month: "2026-08" }
              as: BillingSpecialist
              captures: { c_ver_2: $.data.version, life_2: $.data.lifetime_paid_cents }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-10T00:00:00Z", return_utc: "2026-08-11T00:00:00Z", expected_contract_version: "${c_ver_1}" }
              as: IntakeCoordinator
              captures: { e_stale_c: $.data.error_id }
            - call: "GET /home-oxygen/travel-authorizations"
              payload: { contract_id: "${c_id}" }
              as: IntakeCoordinator
              captures: { ta_list_empty: $.data }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-10T00:00:00Z", return_utc: "2026-08-11T00:00:00Z", expected_contract_version: "${c_ver_2}" }
              as: IntakeCoordinator
              captures: { ta_id: $.data.id, ta_status: $.data.status, ta_hours: $.data.trip_hours, ta_req: $.data.required_liters, ta_cyl: $.data.supply_cylinders_authorized }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { c_ver_3: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-20T00:00:00Z", return_utc: "2026-08-21T00:00:00Z", expected_contract_version: "${c_ver_2}" }
              as: IntakeCoordinator
              captures: { e_stale_c2: $.data.error_id }
          assert:
            - "${svc_1} == IN_SERVICE and ${life_2} == 5590 after the month posts, with ${c_ver_2} exactly one greater than ${c_ver_1}"
            - "${e_stale_c} == ERR_STALE_CONTRACT_VERSION (412): a billing action under a different role spent the travel clerk's token, and the clerk's own body was never at fault"
            - "${ta_list_empty} is an empty array and ${c_ver_3} is exactly one greater than ${c_ver_2}: the refused create wrote nothing, and only the accepted one advanced the contract"
            - "The retried create succeeds with ${ta_status} == REQUESTED, ${ta_hours} == 24, ${ta_req} == 5184 and ${ta_cyl} == 9 (4320 base + 864 reserve, 8 raw cylinders plus the handling surcharge)"
            - "${e_stale_c2} == ERR_STALE_CONTRACT_VERSION (412) for a second authorization whose interval and supply are both legal: the concurrency check at priority 28 masks the interval check at 76 and the supply cap at 92"

      - name: handling_surcharge_threshold_at_five_versus_six_raw_cylinders
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.travel_supply_authorization
          - entities.TravelAuthorization.handling_surcharge_cylinders
        distinguishing_aspect: |
          The surcharge is a threshold on an intermediate value, not on the answer: STEP 7 reads
          cylinders_raw, so one extra travel hour that pushes the raw count from 5 to 6 adds two
          cylinders to the authorization rather than one, and the surcharged total of 7 does not
          re-trigger the same threshold. The third leg pins that the trigger is the cylinder count and
          not the trip length: a 25-hour trip jumps to the 0.35 reserve tier and needs 738 more litres,
          yet it still lands on 6 raw cylinders and the same total of 7.
        test_recipe:
          setup:
            - "One HOMEBOUND patient at sea-level-ish 500 feet with an ACTIVE certificate at 2.0 L/min for 24 hours a day, and one open contract."
            - "Every trip below omits receiving_branch_id and destination_altitude_feet, so altitude_gain is 0 and altitude_factor is exactly 1.00; the three closed intervals are pairwise disjoint."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
