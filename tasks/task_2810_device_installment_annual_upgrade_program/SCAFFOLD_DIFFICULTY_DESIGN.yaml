  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_delinquency_cycle_current_grace_delinquent_current
        grounds:
          - state_machines.InstallmentLoan.delinquency_state
          - calculations.delinquency_progression
          - calculations.payment_waterfall_allocation
          - entities.DelinquencyEvent.fields.event_type
          - endpoints.POST_/servicing/daily-run
        distinguishing_aspect: |
          The InstallmentLoan.delinquency_state dimension is genuinely cyclic: the loan walks
          CURRENT -> GRACE -> DELINQUENT and then returns to CURRENT on a cure payment, so the
          same state is occupied twice in one life. The re-entry is not a reset: outstanding
          late fees already assessed must be collected on the way back (the cure costs
          4745 + 500 = 5245, not 4745), and Installment.late_fee_assessed stays true forever so
          a later sweep cannot assess a second fee on installment 1. An implementation that
          treats delinquency as a forward-only ladder, or that clears late_fee_assessed on
          cure, cannot reproduce both the 5245 cure amount and the four-event audit chain.
        test_recipe:
          setup:
            - "One PRIME customer with an ACTIVE 24-month Handset B loan (principal 89900, monthly_installment_cents 4745, obligation_balance_cents 113876), no payments posted, installment 1 due 2026-09-01."
          setup_api_calls:
