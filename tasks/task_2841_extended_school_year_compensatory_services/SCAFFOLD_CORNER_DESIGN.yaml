      - name: cascading_side_effect_chain_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.MakeupSession.SCHEDULED_to_DELIVERED
        excluded_because:
          difficulty_instance: transitive_cascade / makeup_delivery_cascades_award_to_student_to_due_process_resolution
          rationale: "That instance walks the full MakeupSession -> CompensatoryAward -> Student -> DueProcessRecord chain end to end and asserts every link, including the conditional third hop."
      - name: dual_variant_calculation_layer_is_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.compensatory_award_minutes.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / award_variant_divergence_minute_for_minute_vs_qualitative_benefit
          rationale: "Both award variants are computed from byte-identical service-log data there and the delta between them is asserted as pre-computed literals."
      - name: rate_threshold_trigger_layer_is_covered_by_the_difficulty_design
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.student_minutes_ledger.constants.AUTO_AWARD_THRESHOLD_MINUTES
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_day_cascades_log_to_commitment_to_student_alert_threshold
          rationale: "That instance sits on the 60-minute cumulative boundary, asserting esy_service_alert false at 59 pending minutes and true at 60."

  - section: consistency_model
    instances:
      - name: immediate_consistency_is_covered_by_the_difficulty_design
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.fund_charge_waterfall
        excluded_because:
          difficulty_instance: compensating_invariant / fund_encumbrance_conservation_survives_an_assignment_release
          rationale: "Every ledger figure there is read back inside the same request's response - no re-read or settling delay - which is exactly the immediate-consistency claim."
