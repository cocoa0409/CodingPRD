# Difficulty targeting index for task_2576_condominium_conversion_public_offering_statement.
# Every instance grounds in elements already declared in SCAFFOLD.yaml (§1.1-§1.7); deleting this
# file leaves the scaffold's declared behaviour identical.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: suitability_score_as_inspected_vs_post_remediation
        grounds:
          - calculations.building_suitability_score
          - entities.SuitabilityAssessment.fields.variant
          - entities.SuitabilityAssessment.fields.score
          - entities.SuitabilityAssessment.fields.verdict
          - entities.MajorComponent.fields.planned_remediation_gain_years
          - entities.MajorComponent.fields.condition_rating
          - state_machines.ConversionProject.SUITABILITY_REVIEW_to_DOCUMENTS_PREPARATION
          - validations[priority=18]
        distinguishing_aspect: |
          Both variants run over the identical VERIFIED MajorComponent population of one
          EngineeringReport, yet AS_INSPECTED uses remaining_useful_life_years and the full
          CONDITION_PENALTY while POST_REMEDIATION adds planned_remediation_gain_years and floors
          every penalty at POST_REMEDIATION_PENALTY_FLOOR, so the same building scores 65.83 and
          87.50 - the divergence lives in the per-component engineering domain (RUL horizon and
          condition penalty), not in any contract or money population.
        test_recipe:
          setup:
            - "One ConversionProject (3 declared units) exists with suitability_gate UNEVALUATED."
            - "One EngineeringReport ER-A carries exactly three MajorComponents: ROOF
               (RUL 20y, age 10y, 4000000c, GOOD, gain 10y), ELEVATOR (RUL 8y, age 22y, 6000000c,
               FAIR, gain 12y, is_life_safety true) and FOUNDATION (RUL 40y, age 20y, 10000000c,
               EXCELLENT, gain 0y, is_structural true)."
            - "The report is ACCEPTED by a peer reviewer distinct from the submitter, so all three
               components are VERIFIED and verified_component_count == 3."
            - "No ELEVATOR RUL is below CRITICAL_RUL_YEARS (5), so the life-safety critical cap is
               NOT armed in either variant."
            - "Logical clock is at the startup default 2026-08-01T00:00:00Z; no clock move needed."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "18 Harbor Row, Portland ME", year_built: 1972, total_unit_count: 3, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-A", inspection_date: "2026-07-15T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 20, effective_age_years: 10, replacement_cost_cents: 4000000, funded_pct_bp: 0, condition_rating: "GOOD", planned_remediation_gain_years: 10, is_life_safety: false, is_structural: false }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_roof_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ELEVATOR", remaining_useful_life_years: 8, effective_age_years: 22, replacement_cost_cents: 6000000, funded_pct_bp: 2000, condition_rating: "FAIR", planned_remediation_gain_years: 12, is_life_safety: true, is_structural: false }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_elev_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "FOUNDATION", remaining_useful_life_years: 40, effective_age_years: 20, replacement_cost_cents: 10000000, funded_pct_bp: 5000, condition_rating: "EXCELLENT", planned_remediation_gain_years: 0, is_life_safety: false, is_structural: true }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_found_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_roof_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_elev_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_found_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /engineering-reports/${er_id}/peer-review-decisions"
              payload: { decision: "ACCEPT", reviewed_by_user_id: "peer-1" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { er_v1: $.data.version }
          trigger:
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "AS_INSPECTED", expected_engineering_report_version: "${er_v1}" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { sa_as_id: $.data.id }
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { er_v2: $.data.version }
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "POST_REMEDIATION", expected_engineering_report_version: "${er_v2}" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { sa_post_id: $.data.id }
            - call: "GET /conversion-projects/${proj_id}"
              payload: {}
              as: ConverterSponsor
              as_user_id: "sponsor-1"
          assert:
            - "SuitabilityAssessment.${sa_as_id}.variant == AS_INSPECTED"
            - "SuitabilityAssessment.${sa_as_id}.score == 65.83"
            - "SuitabilityAssessment.${sa_as_id}.basis == VERIFIED_COMPONENTS"
            - "SuitabilityAssessment.${sa_as_id}.critical_cap_applied == false"
            - "SuitabilityAssessment.${sa_as_id}.verdict == PASSED"
            - "SuitabilityAssessment.${sa_post_id}.variant == POST_REMEDIATION"
            - "SuitabilityAssessment.${sa_post_id}.score == 87.50"
            - "SuitabilityAssessment.${sa_post_id}.verdict == PASSED"
            - "SuitabilityAssessment.${sa_as_id}.status == EFFECTIVE  # different variant, so NOT superseded by the POST_REMEDIATION row"
            - "SuitabilityAssessment.${sa_post_id}.score - SuitabilityAssessment.${sa_as_id}.score == 21.67"
            - "ConversionProject.${proj_id}.suitability_score == 87.50  # last assessment wins"
            - "ConversionProject.${proj_id}.suitability_gate == PASSED"
            - "ConversionProject.${proj_id}.status == DOCUMENTS_PREPARATION"
            - "EngineeringReport.${er_id}.verified_component_count == 3"
            - "EngineeringReport.${er_id}.total_replacement_cost_cents == 20000000"
      - name: warrantability_contract_basis_vs_closed_basis
        grounds:
          - calculations.warrantability_ratios
          - entities.ConversionProject.fields.owner_occupancy_pct_contract_basis
          - entities.ConversionProject.fields.owner_occupancy_pct_closed_basis
          - entities.ConversionProject.fields.investor_concentration_pct_contract_basis
          - entities.ConversionProject.fields.investor_concentration_pct_closed_basis
          - entities.ConversionProject.fields.single_investor_max_pct
          - entities.ConversionProject.fields.warrantability_verdict_closed_basis
          - entities.PurchaseAgreement.fields.purchaser_type
          - state_machines.PurchaseAgreement.HARD_to_CLOSED
        distinguishing_aspect: |
          CONTRACT_BASIS and CLOSED_BASIS differ only in the contract_status filter applied to the
          SAME PurchaseAgreement population ({SIGNED,HARD,CLOSED} versus {CLOSED}), so one CLOSED
          owner-occupant plus one SIGNED investor yields owner_occupancy 50.00/investor 50.00 on the
          contract basis and 100.00/0.00 on the closed basis - the divergence is a population filter
          over project-level contract rows, an entirely different entity domain from the
          per-MajorComponent engineering scoring of the suitability variants.
        test_recipe:
          setup:
            - "ConversionProject with total_unit_count 2, suitability_gate PASSED, DeclarationPackage
               RECORDED, PublicOfferingStatement EFFECTIVE, InitialBudget ADOPTED."
            - "Units U-1 and U-2, both INCLUDED, base_percentage_interest_bp 5000 each."
            - "U-1 carries a CLOSED OWNER_OCCUPANT agreement (tax id TAX-OO-1, deposit 3000000c,
               escrow DISBURSED); U-2 carries a SIGNED INVESTOR agreement (tax id TAX-INV-9,
               escrow PENDING, never assigned to a batch)."
            - "ClosingBatch 1 is RELEASED with window [2026-08-16T00:00:00Z, 2026-09-16T00:00:00Z)
               and the project is in CLOSINGS (U-2 is not SOLD, so COMPLETED is not reached)."
            - "Logical clock rests at 2026-08-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "41 Kestrel Street, Providence RI", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              captures: { proj_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "FOUNDATION", remaining_useful_life_years: 40, effective_age_years: 20, replacement_cost_cents: 10000000, funded_pct_bp: 5000, condition_rating: "EXCELLENT", planned_remediation_gain_years: 0, is_life_safety: false, is_structural: true }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_found_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_found_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /engineering-reports/${er_id}/peer-review-decisions"
              payload: { decision: "ACCEPT", reviewed_by_user_id: "peer-1" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: ConverterSponsor
              captures: { er_v: $.data.version }
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "AS_INSPECTED", expected_engineering_report_version: "${er_v}" }
              as: ConverterSponsor
              captures: { sa_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/declaration-packages"
              payload: { declaration_text_ref: "s3://decl/kestrel.pdf", bylaws_text_ref: "s3://bylaws/kestrel.pdf", boundary_convention: "PAINT_TO_PAINT" }
              as: ConverterSponsor
              captures: { dp_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "U-1", floor_level: 1, heated_square_feet: 900, boundary_note: "interior paint surfaces", base_percentage_interest_bp: 5000 }
              as: ConverterSponsor
              captures: { u1_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "U-2", floor_level: 2, heated_square_feet: 950, boundary_note: "interior paint surfaces", base_percentage_interest_bp: 5000 }
              as: ConverterSponsor
              captures: { u2_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/plat-certification"
              payload: {}
              as: ConverterSponsor
            - call: "POST /conversion-projects/${proj_id}/reserve-studies"
              payload: { engineering_report_id: "${er_id}", method: "COMPONENT_METHOD", opening_reserve_balance_cents: 0 }
              as: ConverterSponsor
              captures: { rs_id: $.data.id }
            - call: "GET /conversion-projects/${proj_id}"
              payload: {}
              as: ConverterSponsor
              captures: { proj_v: $.data.version }
            - call: "POST /conversion-projects/${proj_id}/initial-budgets"
              payload: { reserve_study_id: "${rs_id}", fiscal_year_label: "FY2027", annual_operating_expense_cents: 875000, expected_conversion_project_version: "${proj_v}" }
              as: ConverterSponsor
              captures: { ib_id: $.data.id }
            - call: "POST /initial-budgets/${ib_id}/adoption"
              payload: {}
              as: ConverterSponsor
            - call: "POST /declaration-packages/${dp_id}/record"
              payload: {}
              as: ConverterSponsor
            - call: "POST /conversion-projects/${proj_id}/public-offering-statements"
              payload: { declaration_package_id: "${dp_id}", reserve_study_id: "${rs_id}", initial_budget_id: "${ib_id}" }
              as: ConverterSponsor
              captures: { pos_id: $.data.id }
            - call: "PUT /public-offering-statements/${pos_id}/sections/UNIT_BOUNDARIES"
              payload: { body_ref: "s3://pos/unit-boundaries.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/COMMON_ELEMENTS"
              payload: { body_ref: "s3://pos/common-elements.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/PERCENTAGE_INTERESTS"
              payload: { body_ref: "s3://pos/percentage-interests.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/BUDGET"
              payload: { body_ref: "s3://pos/budget.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/RESERVES"
              payload: { body_ref: "s3://pos/reserves.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/ENGINEERING_CONDITION"
              payload: { body_ref: "s3://pos/engineering-condition.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/TENANT_RIGHTS"
              payload: { body_ref: "s3://pos/tenant-rights.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/WARRANTY"
              payload: { body_ref: "s3://pos/warranty.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "PUT /public-offering-statements/${pos_id}/sections/RESCISSION_RIGHTS"
              payload: { body_ref: "s3://pos/rescission-rights.md", word_count: 200, attested_by_user_id: "sponsor-1" }
              as: ConverterSponsor
            - call: "POST /public-offering-statements/${pos_id}/effectiveness"
              payload: {}
              as: StateRegulator
            - call: "GET /units/${u1_id}"
              payload: {}
              as: ConverterSponsor
              captures: { u1_v: $.data.version }
            - call: "POST /units/${u1_id}/purchase-agreements"
              payload: { purchaser_name: "Alice Owner", purchaser_tax_id: "TAX-OO-1", purchaser_type: "OWNER_OCCUPANT", price_cents: 30000000, deposit_cents: 3000000, expected_unit_version: "${u1_v}" }
              as: ConverterSponsor
              captures: { pa1_id: $.data.id }
            - call: "POST /purchase-agreements/${pa1_id}/pos-deliveries"
              payload: {}
              as: ConverterSponsor
            - call: "POST /purchase-agreements/${pa1_id}/escrow-deposits"
              payload: { amount_cents: 3000000 }
              as: EscrowAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /purchase-agreements/${pa1_id}/hardening"
              payload: {}
              as: EscrowAgent
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 1, window_start_at: "2026-08-16T00:00:00Z", window_end_at: "2026-09-16T00:00:00Z", min_presale_threshold_pct: 50.00, min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /closing-batches/${cb_id}/agreement-assignments"
              payload: { purchase_agreement_id: "${pa1_id}", expected_closing_batch_version: "${cb_v}" }
              as: EscrowAgent
            - call: "POST /closing-batches/${cb_id}/threshold-evaluations"
              payload: {}
              as: EscrowAgent
            - call: "POST /closing-batches/${cb_id}/release"
              payload: {}
              as: EscrowAgent
            - call: "POST /purchase-agreements/${pa1_id}/closing"
              payload: {}
              as: EscrowAgent
            - call: "GET /units/${u2_id}"
              payload: {}
              as: ConverterSponsor
              captures: { u2_v: $.data.version }
            - call: "POST /units/${u2_id}/purchase-agreements"
              payload: { purchaser_name: "Beta Holdings LLC", purchaser_tax_id: "TAX-INV-9", purchaser_type: "INVESTOR", price_cents: 28000000, deposit_cents: 2800000, expected_unit_version: "${u2_v}" }
              as: ConverterSponsor
              captures: { pa2_id: $.data.id }
          trigger:
            - call: "GET /conversion-projects/${proj_id}/warrantability-summary"
              payload: {}
              as: LenderUnderwriter
          assert:
            - "ConversionProject.${proj_id}.owner_occupancy_pct_contract_basis == 50.00  # 1 OWNER_OCCUPANT of {CLOSED pa1, SIGNED pa2}"
            - "ConversionProject.${proj_id}.investor_concentration_pct_contract_basis == 50.00"
            - "ConversionProject.${proj_id}.owner_occupancy_pct_closed_basis == 100.00  # denominator collapses to {pa1}"
            - "ConversionProject.${proj_id}.investor_concentration_pct_closed_basis == 0.00"
            - "ConversionProject.${proj_id}.single_investor_max_pct == 50.00  # max group size 1 over total_unit_count 2, always CONTRACT_BASIS population"
            - "ConversionProject.${proj_id}.presale_sold_pct == 50.00  # U-1 SOLD, U-2 UNDER_CONTRACT, 2 INCLUDED units"
            - "ConversionProject.${proj_id}.warrantability_verdict == NON_WARRANTABLE  # investor 50.00 > 25.00"
            - "ConversionProject.${proj_id}.warrantability_verdict_closed_basis == NON_WARRANTABLE  # single_investor 50.00 > 10.00 and presale_sold 50.00 < 51.00"
            - "PurchaseAgreement.${pa1_id}.contract_status == CLOSED and PurchaseAgreement.${pa1_id}.escrow_status == DISBURSED"
            - "PurchaseAgreement.${pa2_id}.contract_status == SIGNED and PurchaseAgreement.${pa2_id}.escrow_status == PENDING"
            - "Unit.${u1_id}.sale_status == SOLD and Unit.${u2_id}.sale_status == UNDER_CONTRACT"
            - "ConversionProject.${proj_id}.escrow_deposits_received_cents == 3000000"
            - "ConversionProject.${proj_id}.escrow_disbursed_cents == 3000000 and ConversionProject.${proj_id}.escrow_balance_cents == 0"
            - "ConversionProject.${proj_id}.escrow_reconciliation_delta_cents == 0"
            - "ConversionProject.${proj_id}.status == CLOSINGS  # U-2 unsold, so COMPLETED is not reached"
            - "ClosingBatch.${cb_id}.status == RELEASED and ClosingBatch.${cb_id}.presale_pct == 50.00"
  - rule_id: combinatorial_formula
    instances:
      - name: budget_single_pass_fee_tier_no_retier_on_total
        grounds:
          - calculations.initial_budget_developer_deficit
          - calculations.unit_assessment_allocation
          - calculations.reserve_funding_requirement
          - entities.InitialBudget.fields.base_expense_cents
          - entities.InitialBudget.fields.management_fee_bp
          - entities.InitialBudget.fields.total_annual_expense_cents
          - entities.Unit.fields.unit_annual_assessment_cents
          - validations[priority=19]
        distinguishing_aspect: |
          This instance is mode (c) - a circular-looking dependency whose evaluation order is pinned:
          total_annual_expense_cents includes management_fee_cents, the fee is a percentage of
          base_expense_cents, and the percentage tier is keyed on an amount that the fee itself
          pushes across the 12000000-cent ceiling, so the scaffold pins tier selection to
          base_expense_cents exactly once (no re-tiering, no fixed point).
        test_recipe:
          setup:
            - "ConversionProject with total_unit_count 3 and suitability_gate PASSED."
            - "DeclarationPackage PLAT_CERTIFIED with three INCLUDED units whose
               base_percentage_interest_bp are 3333 / 3333 / 3334, so percentage_interest_bp is
               3333 / 3333 / 3334 and allocated_bp_total is 10000."
            - "ReserveStudy by COMPONENT_METHOD over the single VERIFIED FOUNDATION component
               (10000000c replacement cost, effective age 20y, RUL 40y, funded 5000bp) with
               opening_reserve_balance_cents 0, giving
               recommended_annual_contribution_cents 125000."
            - "No InitialBudget exists yet; the project version is captured for the OCC guard."
            - "Logical clock rests at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "7 Larkspur Court, Albany NY", year_built: 1974, total_unit_count: 3, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              captures: { proj_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-B", inspection_date: "2026-07-12T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "FOUNDATION", remaining_useful_life_years: 40, effective_age_years: 20, replacement_cost_cents: 10000000, funded_pct_bp: 5000, condition_rating: "EXCELLENT", planned_remediation_gain_years: 0, is_life_safety: false, is_structural: true }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_found_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_found_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /engineering-reports/${er_id}/peer-review-decisions"
              payload: { decision: "ACCEPT", reviewed_by_user_id: "peer-1" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: ConverterSponsor
              captures: { er_v: $.data.version }
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "AS_INSPECTED", expected_engineering_report_version: "${er_v}" }
              as: ConverterSponsor
            - call: "POST /conversion-projects/${proj_id}/declaration-packages"
              payload: { declaration_text_ref: "s3://decl/larkspur.pdf", bylaws_text_ref: "s3://bylaws/larkspur.pdf", boundary_convention: "STUD_TO_STUD" }
              as: ConverterSponsor
              captures: { dp_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
