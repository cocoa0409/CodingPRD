          - state_machines.Patient.SCHEDULED_to_ABORTED
          - state_machines.MatchCandidate.WORKUP_OPEN_to_CLOSED
          - state_machines.SearchRequest.WORKUP_ACTIVE_to_STALLED
          - entities.CollectionBooking.fields.cancel_reason
        distinguishing_aspect: |
          The ABORT cascade is conditional on each child's state: only bookings in HELD or CONFIRMED are
          cancelled with cancel_reason CONDITIONING_ABORTED, while a booking that was already CANCELLED
          for another reason keeps its own reason and must not be re-stamped or double-refunded. The case
          carries two bookings of the same center - one pre-cancelled, one CONFIRMED - so the ledger
          restore (committed_slot_minutes, blocked_day_count, committed_cost_cents) can only reconcile
          if the cascade skips the terminal child.
        test_recipe:
          setup:
            - "domestic registry, capacity-1 center, donor D1, patient; CLEARED case with PBSC method and conditioning SCHEDULED 2026-10-05 at clock 2026-09-11T08:00:00Z"
            - "booking bk1 at 2026-10-11T08:00:00Z cancelled while HELD with reason CENTER_UNAVAILABLE; booking bk2 at the same slot then created and CONFIRMED"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Metro Apheresis Center", country_code: "US", concurrent_collection_capacity: 1 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}", candidate_role: "PRIMARY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc_id: "$.data.id" }
            - call: "GET /registry/reimbursement-claims"
              payload: { workup_case_id: "${wc_id}" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "GET /registry/workup-cases/${wc_id}/clearance-items"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { ci_phys: "$.data[0].id", ci_idm: "$.data[1].id", ci_consent: "$.data[2].id" }
            - call: "POST /registry/clearance-items/${ci_phys}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/clearance-items/${ci_idm}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/clearance-items/${ci_consent}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/workup-cases/${wc_id}/collection-method"
              payload: { method: "PBSC", rationale: "Apheresis selected with the donor" }
              as: MedicalDirector
              as_user_id: "md-2"
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_ver1: "$.data.version" }
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "SCHEDULE", conditioning_start_date: "2026-10-05", expected_patient_version: "${p_ver1}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_ver2: "$.data.version" }
            - call: "GET /registry/workup-cases/${wc_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { wc_ver1: "$.data.version" }
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${ctr_id}", start_at: "2026-10-11T08:00:00Z", expected_workup_case_version: "${wc_ver1}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk1_id: "$.data.id" }
            - call: "POST /registry/collection-bookings/${bk1_id}/cancel"
              payload: { reason: "CENTER_UNAVAILABLE" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk1_reason: "$.data.cancel_reason" }
            - call: "GET /registry/workup-cases/${wc_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { wc_ver2: "$.data.version" }
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${ctr_id}", start_at: "2026-10-11T08:00:00Z", expected_workup_case_version: "${wc_ver2}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk2_id: "$.data.id" }
            - call: "POST /registry/collection-bookings/${bk2_id}/confirm"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk2_state: "$.data.status" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_blocked_before: "$.data.blocked_day_count" }
          trigger:
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "ABORT", reason: "Patient developed sepsis", expected_patient_version: "${p_ver2}" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { p_state: "$.data.conditioning_status", p_abort: "$.data.conditioning_aborted_reason", p_committed: "$.data.committed_cost_cents" }
            - call: "GET /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk_first_reason: "$.data[0].cancel_reason", bk_second_reason: "$.data[1].cancel_reason" }
            - call: "GET /registry/donors/${d1_id}/unavailability-windows"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { win_state: "$.data[0].status", win_reason: "$.data[0].reason" }
            - call: "GET /registry/collection-centers/${ctr_id}"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_minutes: "$.data.committed_slot_minutes" }
            - call: "GET /registry/reimbursement-claims/${claim_id}"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { claim_state: "$.data.status" }
          assert:
            - "before the abort: bk1 is CANCELLED with cancel_reason \"CENTER_UNAVAILABLE\", bk2 is CONFIRMED, CollectionCenter.committed_slot_minutes == 300 and DonorProfile.blocked_day_count == 6"
            - "HTTP 200: conditioning_status == \"ABORTED\", conditioning_aborted_reason == \"Patient developed sepsis\" and Patient.version incremented by exactly 1"
            - "the cascade cancels only bk2: bk2.status == \"CANCELLED\" with cancel_reason \"CONDITIONING_ABORTED\", while bk1.cancel_reason is STILL \"CENTER_UNAVAILABLE\" - the terminal child is skipped, not re-stamped"
            - "the donor's single COLLECTION_WINDOW row (2026-10-07..2026-10-12, day_count 6) is now status \"RELEASED\" and blocked_day_count is back to 0; no second window was created or released twice"
            - "CollectionCenter.${ctr_id}.committed_slot_minutes == 0 - bk1's minutes were released at its own cancellation and are not released a second time"
            - "WorkupCase.${wc_id}.case_status == \"ABORTED\" with abort_reason \"CONDITIONING_ABORTED\" while clearance_status is still \"CLEARED\""
            - "ReimbursementClaim.${claim_id}.status == \"VOID\" and Patient.committed_cost_cents == 0 (the full 2072000 is restored)"
            - "MatchCandidate.${mc1_id}.status == \"CLOSED\" and SearchRequest.${sr_id}.status == \"STALLED\" (not BACKUP_REQUIRED: this search has no backup and the abort is the terminal outcome)"

      - name: parallel_dimensions_of_the_workup_case_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.WorkupCase.clearance_status
          - state_machines.WorkupCase.logistics_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: workup_case_clearance_and_logistics_dimensions_advance_independently
          rationale: |
            §1.8 already drives both dimensions of one case out of step and back, asserting the full
            combined-state matrix (PENDING x METHOD_SET, CLEARED x UNSCHEDULED, CLEARED x BOOKED) plus the
            coupling point at booking creation. A §1.9 restatement would test the identical claim.

      - name: match_candidate_loops_back_through_typing_expired
        claim_type: cyclic
        grounds:
          - state_machines.MatchCandidate.TYPING_EXPIRED_to_REQUESTED
          - state_machines.SearchRequest.BACKUP_REQUIRED_to_PRIMARY_ENGAGED
          - calculations.ct_deadline_and_expiry_sweep.constants.MAX_CT_ATTEMPTS
        excluded_because:
          difficulty_instance: match_candidate_cycles_typing_expired_twice_before_terminal_exclusion
          rationale: |
            The loop and its termination condition (ct_attempt_count reaching MAX_CT_ATTEMPTS == 2) are
            already walked end-to-end in §1.8, including the attempt counter after each pass and the
            terminal exclusion that closes the cycle.

      - name: conditioning_start_is_guarded_by_the_booking_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Patient.SCHEDULED_to_STARTED
          - validations.priority_27_ERR_CONDITIONING_PRECONDITION_UNMET
        excluded_because:
          difficulty_instance: conditioning_start_depends_on_booking_confirmation_state
          rationale: |
            §1.8 already tests the cross-entity guard in both directions: START refused with
            ERR_CONDITIONING_PRECONDITION_UNMET while the booking is only HELD, and accepted once the
            same booking reaches CONFIRMED, with no other input changed.

      - name: a_clearance_failure_cascades_down_to_the_children_of_the_case
        claim_type: Cascade down
        grounds:
          - state_machines.WorkupCase.OPEN_to_ABORTED
          - state_machines.WorkupCase.clearance_status.IN_PROGRESS_to_FAILED
          - endpoints.POST_registry_clearance_items_id_result
        excluded_because:
          difficulty_instance: idm_panel_failure_cascades_five_levels_to_backup_promotion
          rationale: |
            The downward cascade from one FAIL result - case ABORTED, claim VOID, donor
            TEMPORARILY_DEFERRED, candidate DEFERRED, backup promoted, search BACKUP_REQUIRED - is
            asserted level by level in §1.8, including which children are left untouched.

      - name: booking_cancellation_keeps_the_derived_ledgers_in_sync
        claim_type: Ledger sync
        grounds:
          - calculations.derived_counter_reconciliation
          - state_machines.CollectionBooking.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: booking_cancellation_restores_center_minutes_and_donor_blocked_days
          rationale: |
            §1.8 already reconciles CollectionCenter.committed_slot_minutes and
            DonorProfile.blocked_day_count before and after the same cancellation, which is exactly the
            ledger-sync claim for this transition.

      - name: voiding_a_claim_reverses_every_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.ReimbursementClaim.PROVISIONAL_to_VOID
          - entities.Patient.fields.committed_cost_cents
        excluded_because:
          difficulty_instance: claim_void_restores_patient_committed_cost_and_frees_the_budget
          rationale: |
            The compensating path - VOID restoring committed_cost_cents to its pre-claim value and
            re-opening the budget headroom that ERR_PATIENT_BUDGET_EXCEEDED had consumed - is asserted in
            §1.8 with the exact before/after ledger values, so no §1.9 duplicate is warranted.

  - section: calculations
    instances:
      - name: the_materialized_pool_is_ordered_and_role_assigned_by_rank_score
        claim_type: Correct Result
        grounds:
          - calculations.candidate_pool_materialization
          - entities.MatchCandidate.fields.rank_position
          - entities.MatchCandidate.fields.candidate_role
          - entities.SearchRequest.fields.match_pool_size
          - entities.SearchRequest.fields.backup_candidate_count
        distinguishing_aspect: |
          Four eligible donors are materialized in one creation call and the WHOLE ordering plus role
          split is asserted: rank_position 1..4 by rank_score DESC (97.113, 78.831, 76.869, 65.544),
          candidate_role PRIMARY for rank 1, BACKUP for ranks 2..3 (BACKUP_SLOTS == 2) and ARCHIVED_POOL
          for rank 4, with match_pool_size 4 and backup_candidate_count 2. The subject is the ordering
          and the role cut, not the rank formula itself.
        test_recipe:
          setup:
            - "one domestic and one international registry; four eligible donors D1, D2, D3, D5 created in that order"
            - "the canonical patient; the search is DOMESTIC_AND_INTERNATIONAL and omits min_preliminary_score so the 60.00 default applies"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "DKMS-DE", name: "DKMS Germany", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_intl_id}", donor_code: "D-0002", age_years: 41, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "11:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06", "02"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["DQB1"], prior_donation_count: 1 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_intl_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0005", age_years: 30, sex: "F", weight_kg: 72.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d5_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_AND_INTERNATIONAL" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id", sr_pool: "$.data.match_pool_size", sr_backups: "$.data.backup_candidate_count", sr_min: "$.data.min_preliminary_score" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { c1_donor: "$.data[0].donor_id", c1_rank: "$.data[0].rank_score", c1_role: "$.data[0].candidate_role", c2_donor: "$.data[1].donor_id", c2_rank: "$.data[1].rank_score", c3_donor: "$.data[2].donor_id", c4_donor: "$.data[3].donor_id", c4_role: "$.data[3].candidate_role" }
          assert:
            - "HTTP 201 with match_pool_size == 4, backup_candidate_count == 2, min_preliminary_score == 60.00 and status \"PRIMARY_ENGAGED\" NOT yet set (status is \"SEARCHING\")"
            - "the list (ordered rank_position ASC) is exactly D1, D5, D2, D3 with rank_score 97.113, 78.831, 76.869, 65.544 - D5 outranks D2 even though D2's preliminary_score 86.58 is higher than D5's 64.92, because the international logistics factor caps at 65"
            - "rank_position values are 1, 2, 3, 4 and candidate_role values are \"PRIMARY\", \"BACKUP\", \"BACKUP\", \"ARCHIVED_POOL\" (BACKUP_SLOTS == 2)"
            - "every candidate carries preliminary_score (94.75, 64.92, 86.58, 69.17), confirmed_score null, confirmed_match_grade null, ct_attempt_count 0, promoted_from_rank null and status \"IDENTIFIED\""
            - "backup_candidate_count counts only the two BACKUP rows: the ARCHIVED_POOL row at rank 4 is not a backup and is never auto-promoted"
            - "the four DonorProfile rows are untouched: all still availability_status \"AVAILABLE\" with blocked_day_count 0"

      - name: only_eligible_donors_enter_the_materialized_pool
        claim_type: Input Set Filtering
        grounds:
          - calculations.candidate_pool_materialization.input_set
          - entities.SearchRequest.fields.min_preliminary_score
          - entities.SearchRequest.fields.search_scope
          - entities.Registry.fields.cooperation_status
        distinguishing_aspect: |
          Five donors are rejected by five DIFFERENT clauses of the eligibility predicate in one call -
          availability_status WITHDRAWN, age 65 above DONOR_MAX_AGE, a SUSPENDED home registry, the
          DOMESTIC_ONLY scope and a preliminary_score below the explicit floor 70.00 - while the one
          eligible donor is materialized. The suspended-registry donor is a typing twin of D1, so if the
          cooperation clause were skipped it would tie at 94.75 and appear as rank 2.
        test_recipe:
          setup:
            - "domestic registry (ACTIVE), a second domestic registry with cooperation_status SUSPENDED, and an international registry"
            - "donors: D1 (eligible, 94.75), D2 (international, 86.58), D3 (domestic, 69.17), D5 (domestic, 64.92), D6 (domestic, age 65), D7 (domestic, WITHDRAWN), D8 (D1's typing twin under the SUSPENDED registry)"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US2", name: "Regional Marrow Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 3, ct_response_deadline_hours: 168, cooperation_status: "SUSPENDED" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_susp_id: "$.data.id", reg_susp_state: "$.data.cooperation_status" }
            - call: "POST /registry/registries"
              payload: { code: "DKMS-DE", name: "DKMS Germany", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: RegistryOperations
              as_user_id: "ops-1"
