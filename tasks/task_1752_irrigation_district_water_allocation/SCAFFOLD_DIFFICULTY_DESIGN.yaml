              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Direct D", parcel_number: "APN-006", irrigated_acres: 10.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Late L", parcel_number: "APN-007", irrigated_acres: 10.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct2: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct1}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv1: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct2}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv2: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv1}/issue"
              payload: { due_date: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/assessment-invoices/${inv2}/issue"
              payload: { due_date: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/assessment-invoices/${inv1}/pay"
              payload: {}
              as: WaterUser
              as_user_id: "${acct1}"
              captures: { inv1_status: "$.data.status" }
            - call: "GET /district/water-accounts/${acct1}"
              as: DistrictAdmin
              captures: { acct1_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
              captures: { swept: "$.data.swept_count" }
            - call: "POST /district/assessment-invoices/${inv2}/file-lien"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/water-accounts/${acct2}"
              as: DistrictAdmin
              captures: { acct2_status_lien: "$.data.status" }
          trigger:
            - call: "POST /district/assessment-invoices/${inv2}/pay"
              payload: {}
