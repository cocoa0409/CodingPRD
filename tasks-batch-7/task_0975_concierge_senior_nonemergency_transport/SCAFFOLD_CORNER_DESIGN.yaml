  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: ride_fare_dual_variant_correct_result
        claim_type: correct_result
        grounds: [calculations.ride_fare]
        excluded_because:
          difficulty_instance: ride_fare_provisional_vs_final_settlement
          rationale: "Both variants evaluated and asserted with literals (6300 vs 5250) in the named §1.8 instance."

      - name: per_line_rounding_correct_result
        claim_type: precision
        grounds: [calculations.invoice_aggregation]
        excluded_because:
          difficulty_instance: invoice_per_line_rounding_then_sum
          rationale: "Round-per-line-then-sum pinned and asserted (2502 not 2501) in the named §1.8 instance."

      - name: credit_application_correct_result
        claim_type: correct_result
        grounds: [calculations.invoice_credit_application]
        excluded_because:
          difficulty_instance: credit_share_capped_before_deduction
          rationale: "Pinned evaluation order and literals (applied 3000, due 8200) asserted in the named §1.8 instance."

      - name: cancellation_fee_tiers_correct_result
        claim_type: correct_result
        grounds: [calculations.cancellation_fee]
        excluded_because:
          difficulty_instance: cancellation_notice_exact_boundaries
          rationale: "All three tiers plus both boundary minutes asserted in the named §1.8 instance."

      - name: wait_threshold_correct_result
        claim_type: correct_result
        grounds: [calculations.wait_time_billing]
        excluded_because:
          difficulty_instance: wait_grace_exact_boundaries
          rationale: "wait == included (0 billable) and wait == included+1 (1 billable) asserted in the named §1.8 instance."

      - name: payment_waterfall_two_invoices_oldest_first
        claim_type: correct_result
        grounds: [calculations.payment_waterfall, entities.Payment.fields.applications]
        distinguishing_aspect: "A 2000 payment against two open invoices (1251 due 2026-05-22; 1251 due 2026-06-22) fills the earlier due_date first (PAID), then spills 749 into the second (PARTIALLY_PAID); nothing reaches credit."
        test_recipe:
          setup: ["client with two late-cancel fee invoices: inv1 [2026-05-01, 2026-05-08) due 2026-05-22 amount 1251 ISSUED; inv2 [2026-06-01, 2026-06-08) due 2026-06-22 amount 1251 ISSUED"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "BILLING_PAYER" }, as: Coordinator, captures: { fam: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-05-04T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride1: $.data.id } }
            - { call: "POST /rides/${ride1}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-05-01", period_end: "2026-05-08" }, as: BillingAdmin, captures: { inv1: $.data.id } }
