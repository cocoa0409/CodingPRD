            - "Plan.${plan_id}.total_plan_assets_cents == 7000000 unchanged — total_plan_assets_cents counts menu_status IN {ACTIVE, PENDING_REMOVAL}, so a PENDING_REMOVAL fund's 4000000 stays in the total"
            - "AssetClassSlot.${slot_cb_id}.status == ACTIVE and Fund.${fund_cb_id}.menu_status == ACTIVE (untouched)"
            - "QuarterlyReview.${rev_id}.status == FINALIZED and watch_additions_count == 1 (the retire does not rewrite review history)"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three instances, three DIFFERENT error-category pairs:
  #   (1) auth (20, 25) vs existence (30)
  #   (2) state (42) vs business_constraint/OCC (46)
  #   (3) business_safety (58) vs business_referential (78)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_ladder_20_and_25_precede_existence_30_on_convene
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=25]
          - validations[priority=30]
          - state_machines.CommitteeMeeting.SCHEDULED_to_IN_SESSION
          - entities.CommitteeSeat.fields.seat_class
        distinguishing_aspect: |
          Error-category pair auth versus existence: the same convene call against a meeting id that
          does not exist returns 403 ERR_ROLE_NOT_PERMITTED for a non-chair role (priority 20) but 404
          ERR_RESOURCE_NOT_FOUND for the real chair (priority 30), and on a meeting that DOES exist a
          CommitteeChair whose seat_class is FINANCE gets 403 ERR_ACTOR_NOT_COMMITTEE_MEMBER (priority
          25) — so a 404 is only ever reachable after both auth gates have passed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Plan with charter_status ADOPTED."
            - "CommitteeSeat CHAIR (seat_class CHAIR, voting) holding ACTIVE member CHAIR-A; CommitteeSeat FIN-1 (seat_class FINANCE, voting) holding ACTIVE member FIN-B."
            - "One CommitteeMeeting in status SCHEDULED for quarter_index 0."
            - "No CommitteeMeeting row exists with id 11111111-1111-4111-8111-111111111111."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
