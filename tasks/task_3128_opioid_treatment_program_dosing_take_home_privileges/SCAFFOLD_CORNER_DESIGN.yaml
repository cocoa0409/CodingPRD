# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3128_opioid_treatment_program_dosing_take_home_privileges
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: patient_create_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Patient
          - endpoints.POST_/otp/patients
          - error_catalog[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A patient registered with the nine required inputs comes back 201 with status PENDING_ADMISSION, diagnosis_confirmed false, treatment_phase INDUCTION, counseling_standing CURRENT, diversion_standing CLEAR, time_in_treatment_days 0, denial_count_12mo 0, carries_used 0, version 1, and non-null id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at the server default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - &c_prog
              call: "POST /otp/programs"
              payload: { name: "BayMark Riverside", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO", "TU", "WE", "TH", "FR", "SA"], max_daily_dose_slots: 120, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - &c_phys
              call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Paul Physician", staff_role: "PHYSICIAN", license_number: "MD-3001" }
              as: ProgramAdministrator
              captures: { phys_id: $.data.id }
          trigger:
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "NO_RELIABLE_TRANSPORT", one_way_travel_minutes: 95 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Patient.${pat_id}.status == PENDING_ADMISSION"
            - "Patient.${pat_id}.diagnosis_confirmed == false"
            - "Patient.${pat_id}.treatment_phase == INDUCTION"
            - "Patient.${pat_id}.counseling_standing == CURRENT and diversion_standing == CLEAR"
            - "Patient.${pat_id}.time_in_treatment_days == 0 and admission_datetime is null"
            - "Patient.${pat_id}.denial_count_12mo == 0 and carries_used == 0 and missed_dose_streak == 0"
            - "Patient.${pat_id}.version == 1 and the data carries non-null id, created_at and updated_at"

      - name: patient_read_and_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/otp/patients
          - response_envelope.pagination_fields
          - entities.Patient
        distinguishing_aspect: "GET /otp/patients honours limit and offset against a three-row set: limit=2&offset=0 returns two rows with total_count 3 and has_more true, while limit=2&offset=2 returns one row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program with a Physician and three registered patients."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - *c_phys
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Ada Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:aaaa0001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "1 Mesa Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 10 }
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Bea Patient", date_of_birth: "1988-01-19", government_id_hash: "sha256:aaaa0002", diagnosis_code: "F11_10", home_state_code: "CA", home_address: "2 Mesa Rd", transportation_type: "PUBLIC_TRANSIT", one_way_travel_minutes: 40 }
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Cara Patient", date_of_birth: "1992-06-30", government_id_hash: "sha256:aaaa0003", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "3 Mesa Rd", transportation_type: "RIDE_SHARE", one_way_travel_minutes: 25 }
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "GET /otp/patients"
              payload: { program_id: "${prog_id}", limit: 2, offset: 0 }
              as: Nurse
              as_user_id: "opaque-nurse-1"
            - call: "GET /otp/patients"
              payload: { program_id: "${prog_id}", limit: 2, offset: 2 }
              as: Nurse
              as_user_id: "opaque-nurse-1"
          assert:
            - "the first read returns response_type array with exactly 2 rows, total_count == 3 and has_more == true"
            - "the second read returns exactly 1 row, total_count == 3 and has_more == false"
            - "both reads carry meta.api_request_id and meta.api_request_timestamp"
            - "the two reads together cover 3 distinct patient ids with no duplicate"

      - name: program_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - validations[priority=4]
          - endpoints.GET_/otp/programs/{id}
        distinguishing_aspect: "GET /otp/programs with a well-formed but absent UUID returns 404 and ERR_PROGRAM_NOT_FOUND rather than 400, proving existence is checked with the 404 class and not folded into request validation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /otp/programs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "err_id == ERR_PROGRAM_NOT_FOUND"
            - "err_id != ERR_INVALID_REQUEST"

      - name: program_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=26]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/otp/programs
        distinguishing_aspect: "Omitting open_days, one of the nine required program inputs, is rejected at 400 ERR_INVALID_REQUEST, and the field is genuinely required because the default-bearing fields such as dose_checkin_grace_minutes and guest_dosing_enabled can be omitted in the same request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /otp/programs"
              payload: { name: "BayMark No Days", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", max_daily_dose_slots: 50 }
              as: ProgramAdministrator
              captures: { err_req: $.data.error_id }
            - call: "POST /otp/programs"
              payload: { name: "BayMark Minimal", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO"], max_daily_dose_slots: 50 }
              as: ProgramAdministrator
              captures: { prog_id_ok: $.data.id }
          assert:
            - "the first request returns 400 and err_req == ERR_INVALID_REQUEST"
            - "the second request returns 201 with response_type object"
            - "Program.${prog_id_ok}.dose_checkin_grace_minutes == 30, proving the omitted optional field took its default"
            - "Program.${prog_id_ok}.guest_dosing_enabled == true and max_daily_mg_methadone == 120.0, both defaults"

      - name: inventory_lot_on_hand_and_expiry_are_computed_from_the_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.InventoryLot.fields.running_on_hand_mg
          - entities.InventoryLot.fields.is_expired
          - calculations.inventory_variance_write_off
        distinguishing_aspect: "running_on_hand_mg and is_expired are derived, never client-supplied: a lot created with quantity_received_mg 1000.0 reports 1000.0 and is_expired false at 2026-10-01, then reads is_expired true at exactly 2026-11-01 (the expiration date, which is exclusive) with the on-hand figure unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program."
          setup_api_calls:
            - *c_clock
            - *c_prog
          trigger:
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-EXP", expiration_date: "2026-11-01", quantity_received_mg: 1000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: false }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
          assert:
            - "the response status is 201 and InventoryLot.${lot_id}.status == RECEIVED"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 1000.0, equal to quantity_received_mg with no transactions yet"
            - "InventoryLot.${lot_id}.is_expired == false at 2026-09-01"
            - "after POST /otp/_clock/set_current_utc with to_iso8601 2026-10-31T00:00:00Z, GET /otp/inventory-lots/${lot_id} reports is_expired == false"
            - "after POST /otp/_clock/set_current_utc with to_iso8601 2026-11-01T00:00:00Z, the same read reports is_expired == true, so the expiration date is exclusive"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 1000.0 at all three readings"

      - name: dose_dispense_status_is_never_client_supplied
        claim_type: System Fields
        grounds:
          - entities.DoseDispense.fields.status
          - endpoints.POST_/otp/dose-dispenses
        distinguishing_aspect: "status, version, arrived_at, completed_at and verification_result are server-owned and are not schedule-endpoint inputs at all: the row is created SCHEDULED with verification_result null, arrived_at null, completed_at null, carry_count 0 and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program, a lot, a Physician, a Nurse and one ACTIVE patient on a 90 mg order."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-A1", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
          assert:
            - "the response status is 201 and DoseDispense.${dose_id}.status == SCHEDULED"
            - "DoseDispense.${dose_id}.verification_result is null and arrived_at is null and completed_at is null"
            - "DoseDispense.${dose_id}.carry_count == 0 and carries_before == 0 and carries_after == 0"
            - "DoseDispense.${dose_id}.version == 1"
            - "DoseDispense.${dose_id}.ordered_mg == 90.0, snapshotted from the order rather than supplied"

      - name: dose_dispense_rejects_unknown_source_type_enum_value
        claim_type: Type Constraints
        grounds:
          - entities.DoseDispense.fields.source_type
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=26]
        distinguishing_aspect: "source_type is a closed three-member enum and an out-of-enum value is rejected at 400 ERR_INVALID_REQUEST rather than silently defaulting to OBSERVED_CLINIC."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program, a lot, a Physician, a Nurse and one ACTIVE patient on a 90 mg order."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-A1", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "CLINIC_DISPENSE", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err_enum: $.data.error_id }
          assert:
            - "the response status is 400 and err_enum == ERR_INVALID_REQUEST"
            - "GET /otp/dose-dispenses?dose_order_id=${ord_id} returns 0 rows"
            - "err_enum != ERR_OUTSIDE_CLINIC_HOURS, so the enum check runs before the temporal check"

      - name: guest_arrangement_reverse_lookup_from_both_programs
        claim_type: Parent Relationships
        grounds:
          - entities.GuestDosingArrangement.fields.originating_program_id
          - entities.GuestDosingArrangement.fields.receiving_program_id
          - endpoints.GET_/otp/guest-dosing-arrangements
        distinguishing_aspect: "The arrangement carries two foreign keys to the same parent entity type, and the flat-topology filtered list resolves each independently: filtering by originating_program_id and by receiving_program_id both return the same single row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Two CA programs with a Physician and one ACTIVE patient at the originating clinic."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/programs"
              payload: { name: "BayMark Coast", state_code: "CA", clinic_hours_start: "08:00", clinic_hours_end: "10:00", open_days: ["SA"], max_daily_dose_slots: 10, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog_recv: $.data.id }
            - *c_phys
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:dddd0001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PUBLIC_TRANSIT", one_way_travel_minutes: 40 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "BUPRENORPHINE", ordered_daily_mg: 16.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v: $.data.version }
          trigger:
            - call: "POST /otp/guest-dosing-arrangements"
              payload: { patient_id: "${pat_id}", receiving_program_id: "${prog_recv}", travel_start_date: "2026-12-19", travel_end_date: "2026-12-19", expected_patient_version: "${pat_v}" }
              as: ProgramAdministrator
              captures: { arr_id: $.data.id }
            - call: "GET /otp/guest-dosing-arrangements"
              payload: { originating_program_id: "${prog_id}" }
              as: ProgramAdministrator
            - call: "GET /otp/guest-dosing-arrangements"
              payload: { receiving_program_id: "${prog_recv}" }
              as: ProgramAdministrator
          assert:
            - "GuestDosingArrangement.${arr_id}.originating_program_id == ${prog_id}"
            - "GuestDosingArrangement.${arr_id}.receiving_program_id == ${prog_recv}"
            - "the originating-programs filter returns exactly 1 row whose id is ${arr_id}"
            - "the receiving-programs filter returns exactly 1 row whose id is ${arr_id}"
            - "GuestDosingArrangement.${arr_id}.status == DRAFT and authorized_mg is null before transmit"

      - name: exclusion_from_the_ordering_queue_after_the_cutoff
        claim_type: Exclusion From Ordering
        grounds:
          - entities.Program.fields.dose_checkin_grace_minutes
          - calculations.otp_lot_selector
        distinguishing_aspect: "A lot that is expired at the ordering instant is excluded from the otp_lot_selector candidate pool, so a second eligible lot with a later expiration is chosen and the expired one is never touched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program, a Physician, a Nurse and one ACTIVE patient on a 90 mg order."
            - "Two METHADONE lots exist: LOT-OLD expiring 2026-12-01 and LOT-NEW expiring 2027-06-30, both holding 50000.0 mg."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-OLD", expiration_date: "2026-12-01", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_old: $.data.id }
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-NEW", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_new: $.data.id }
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/dispense"
              payload: { dispensed_mg: 90.0, wasted_mg: 0.0, returned_mg: 0.0 }
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
