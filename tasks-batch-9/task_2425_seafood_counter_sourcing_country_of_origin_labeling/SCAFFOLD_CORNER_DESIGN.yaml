              as_user_id: "${counter_id}"
              captures: { e_frozen: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 422 with ${e_allowance} == ERR_CONVERSION_ALLOWANCE_EXCEEDED (allowance is min(8.000, 10.000 * 0.60) == 6.000)"
            - "trigger call 2 returns HTTP 422 with ${e_zero} == ERR_CONVERSION_NOT_PERMITTED"
            - "trigger call 3 returns HTTP 422 with ${e_frozen} == ERR_CONVERSION_NOT_PERMITTED (2.000 <= the 5.000 allowance, so only the frozen flag can be the cause)"
            - "all three ShrinkEvents remain in status VALUED with approved_conversion_kg == 0.000"
            - "SupplierLot.${lot_a}.remaining_weight_kg == 10.000 and SupplierLot.${lot_b}.remaining_weight_kg == 10.000"

      - name: temporal_input_order_rules_on_readings_ads_and_documents
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - validations[priority=48]
          - validations[priority=49]
          - errors.ERR_AD_WINDOW_INVALID
          - errors.ERR_READING_IN_FUTURE
          - errors.ERR_SIMP_DATE_ORDER
        distinguishing_aspect: |
          Three different timestamp orderings are policed against three different references:
          an advertising window against itself (end must be strictly after start, so equal
          instants are refused), an ice-bed reading against the logical clock (no
          post-dating), and an import document against its own harvest/landing pair -- and each
          has a legal sibling that must be accepted in the same run.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Red Snapper SupplierLot in intake_status RECEIVED (import-monitored species)"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Red Snapper", scientific_name: "Lutjanus campechanus", acceptable_market_names: ["Red Snapper"], simp_covered: true, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { snapper_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${snapper_id}", lot_code: "SNP-0801-D", harvest_method: "WILD_TRAP", production_method: "WILD", origin_country_code: "MX", previously_frozen: false, fresh_claim: false, received_weight_kg: 15.000, unit_cost_cents_per_kg: 2600, retail_price_cents_per_kg: 3400, cooked_retail_price_cents_per_kg: 3800 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/ad-items"
              payload: { counter_id: "${counter_id}", lot_id: "${lot_id}", headline: "Red Snapper Weekend", ad_start_at: "2026-08-01T12:00:00Z", ad_end_at: "2026-08-01T12:00:00Z" }
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
              captures: { e_window: $.data.error_id }
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 3, reading_at: "2026-08-01T09:00:00Z", temperature_c: 3.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_future: $.data.error_id }
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-25T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { e_dates: $.data.error_id }
            - call: "POST /seafood-ops/ad-items"
              payload: { counter_id: "${counter_id}", lot_id: "${lot_id}", headline: "Red Snapper Weekend", ad_start_at: "2026-08-01T12:00:00Z", ad_end_at: "2026-08-01T12:00:01Z" }
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
              captures: { ok_item: $.data.id }
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 3, reading_at: "2026-08-01T08:00:00Z", temperature_c: 3.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { ok_reading: $.data.id }
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-22T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { ok_doc: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with ${e_window} == ERR_AD_WINDOW_INVALID"
            - "trigger call 2 returns HTTP 422 with ${e_future} == ERR_READING_IN_FUTURE"
            - "trigger call 3 returns HTTP 422 with ${e_dates} == ERR_SIMP_DATE_ORDER"
            - "trigger call 4 returns HTTP 201 with AdvertisedItem.${ok_item}.status == DRAFT"
            - "trigger call 5 returns HTTP 201 with the reading at exactly the logical clock accepted and breach == false"
            - "trigger call 6 returns HTTP 201 with SimpDocument.${ok_doc}.status == DRAFT (harvest_date == landing_date is legal)"
            - "no ColdChainExcursion exists for Counter.${counter_id}"

      - name: settlement_amount_must_equal_outstanding_exactly
        claim_type: violation_error
        grounds:
          - validations[priority=54]
          - errors.ERR_SETTLEMENT_AMOUNT_MISMATCH
          - state_machines.SupplierLot.chargeback_status.ASSESSED_to_SETTLED
          - calculations.supplier_chargeback_assessment
        distinguishing_aspect: |
          Settlement is exact-amount, not at-least or at-most: a 40000 cent payment against a
          47840 cent chargeback is refused outright rather than recorded as a partial payment,
          and the ledger only moves when the payment equals chargeback_outstanding_cents to the
          cent.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod SupplierLot of 10.000 kg at retail 2300 cents/kg cased into slot 1"
            - "one MISMATCH VerificationSample, so cascade A assessed 25000 + 23000 + 4000 = 52000 pre-credit, tier 2 goodwill 4160, net 47840 at multiplier 1.00"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
