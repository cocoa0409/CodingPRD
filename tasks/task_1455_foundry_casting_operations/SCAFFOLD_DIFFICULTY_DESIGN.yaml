# =============================================================================
# Task 1455 — Foundry & Casting Operations — Scaffold Difficulty Design (§1.8)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All numeric asserts were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: scrap_credit_provisional_vs_final_reconciles_lot
        grounds:
          - calculations.scrap_credit
          - state_machines.ScrapRecord.PROVISIONAL_to_WEIGHED
          - entities.ScrapRecord.fields.provisional_weight_kg
        distinguishing_aspect: |
          Dual-variant calculation in the REMELT COST ACCOUNTING domain (ScrapRecord/ReturnLot):
          the provisional variant credits casting_weight_kg * 0.85 = 170.0 kg at disposition, while the
          final variant credits the 190.0 kg scale weight at weigh — identical scrap, different credit,
          and the +20.0 kg delta is reconciled onto the same ReturnLot.
        test_recipe:
          setup:
            - "Foundry with OPEN posture (1000 kg IN_SERVICE sand), furnace, line, ACTIVE pattern, order qty 1"
            - "Heat CERTIFIED by spectro_1 and TAPPED 1000 kg; mold (200 kg metal) poured via completed slot; casting at FINAL_INSPECTION"
            - "ReturnLot ASSAYED with collected_weight_kg 500.0 (remaining 500.0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1, 56.6, 31.3] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/return-lots", payload: { foundry_id: "${f_id}", alloy_grade: "GJS-400-15", collected_weight_kg: 500.0 }, as: MeltSupervisor, captures: { lot_id: $.data.id } }
            - { call: "POST /api/return-lots/${lot_id}/assay", payload: { assay_composition: { C: 3.40, Si: 2.40, Mn: 0.20, P: 0.02 }, chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 }, Si: { min: 2.2, max: 2.6 }, Mn: { min: 0.1, max: 0.4 }, P: { min: 0.0, max: 0.05 } }, ce_max: 4.30 } }, as: Spectrographer }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 }, Si: { min: 2.2, max: 2.6 }, Mn: { min: 0.1, max: 0.4 }, P: { min: 0.0, max: 0.05 } }, ce_max: 4.30 } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40, Si: 2.40, Mn: 0.20, P: 0.02 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40, Si: 2.40, Mn: 0.20, P: 0.02 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { heat_v3: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 1000 }, as: MeltSupervisor }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${mold_id}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/pour-slots/${slot_id}/complete", payload: {}, as: LineOperator }
            - { call: "GET /api/castings?mold_id=${mold_id}", as: LineOperator, captures: { cast_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: FoundryAdmin }
            - { call: "GET /api/foundries/${f_id}", as: FoundryAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin }
            - { call: "POST /api/molds/${mold_id}/shakeout", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/inspections", payload: { casting_id: "${cast_id}", porosity_grade: 6, defect_type: "POROSITY", zone: "A" }, as: QualityInspector, captures: { insp_id: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${insp_id}/disposition", payload: { disposition: "SCRAP", scrap_code: "POROSITY", return_lot_id: "${lot_id}" }, as: QualityInspector, as_user_id: "qi_1" }
            - { call: "GET /api/scrap-records?casting_id=${cast_id}", as: QualityInspector, captures: { scrap_id: "$.data[0].id" } }
            - { call: "POST /api/scrap-records/${scrap_id}/weigh", payload: { actual_weight_kg: 190.0 }, as: QualityInspector, captures: { scrap_final: $.data } }
          assert:
            - "ScrapRecord.${scrap_id}.provisional_weight_kg == 170.0 (200.0 * 0.85, provisional variant)"
            - "After disposition: GET /api/return-lots/${lot_id}.remaining_weight_kg == 670.0 (500.0 + 170.0 provisional credit)"
            - "After weigh: ScrapRecord.${scrap_id}.actual_weight_kg == 190.0 and status == WEIGHED (final variant)"
            - "After weigh: GET /api/return-lots/${lot_id}.scrap_credited_kg == 190.0 and remaining_weight_kg == 690.0 (delta +20.0 reconciled)"
            - "Provisional credit 170.0 != final credit 190.0 for the identical scrapped casting"

      - name: warranty_credit_standard_vs_machining_allowance
        grounds:
          - calculations.warranty_credit
          - state_machines.WarrantyClaim.APPROVED_to_SETTLED
          - entities.WarrantyClaim.fields.credit_variant_applied
        distinguishing_aspect: |
          Dual-variant calculation in the COMMERCIAL SETTLEMENT domain (WarrantyClaim/CustomerOrder),
          a different entity domain than scrap_credit: with identical claim_qty=4, claimed_amount=250000,
          unit_price=100000 the STANDARD variant settles 250000 cents while the MACHINING_ALLOWANCE
          variant settles 65000 cents (round(100000*0.15*4)=60000 + freight 5000).
        test_recipe:
          setup:
            - "Order FULFILLED (qty 1, one casting ACCEPTed), unit_price_cents 100000, machining_allowance_pct 0.15, warranty_budget_cents 500000"
            - "Claim A: DEFECT, claim_qty 4, claimed 250000, APPROVED by wm_1. Claim B: MACHINING_SHORTFALL, same numbers plus freight_cents 5000, APPROVED by wm_1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1, 56.6, 31.3] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 1000 }, as: MeltSupervisor }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${mold_id}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/pour-slots/${slot_id}/complete", payload: {}, as: LineOperator }
            - { call: "GET /api/castings?mold_id=${mold_id}", as: LineOperator, captures: { cast_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: FoundryAdmin }
            - { call: "GET /api/foundries/${f_id}", as: FoundryAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin }
            - { call: "POST /api/molds/${mold_id}/shakeout", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/castings/${cast_id}/advance", payload: {}, as: LineOperator }
            - { call: "POST /api/inspections", payload: { casting_id: "${cast_id}", porosity_grade: 1, defect_type: "NONE", zone: "C" }, as: QualityInspector, captures: { insp_id: $.data.id } }
            - { call: "POST /api/inspections/${insp_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityInspector, as_user_id: "qi_1" }
            - { call: "POST /api/claims", payload: { order_id: "${ord_id}", claim_type: "DEFECT", claim_qty: 4, claimed_amount_cents: 250000 }, as: Customer, as_user_id: "${cust_id}", captures: { claim_a: $.data.id } }
            - { call: "POST /api/claims/${claim_a}/review", payload: { action: "START" }, as: WarrantyManager, as_user_id: "wm_1" }
            - { call: "POST /api/claims/${claim_a}/review", payload: { action: "APPROVE" }, as: WarrantyManager, as_user_id: "wm_1" }
            - { call: "POST /api/claims", payload: { order_id: "${ord_id}", claim_type: "MACHINING_SHORTFALL", claim_qty: 4, claimed_amount_cents: 250000, freight_cents: 5000 }, as: Customer, as_user_id: "${cust_id}", captures: { claim_b: $.data.id } }
            - { call: "POST /api/claims/${claim_b}/review", payload: { action: "START" }, as: WarrantyManager, as_user_id: "wm_1" }
            - { call: "POST /api/claims/${claim_b}/review", payload: { action: "APPROVE" }, as: WarrantyManager, as_user_id: "wm_1" }
          trigger:
            - { call: "POST /api/claims/${claim_a}/settle", payload: {}, as: WarrantyManager, as_user_id: "wm_2", captures: { settled_a: $.data } }
            - { call: "POST /api/claims/${claim_b}/settle", payload: {}, as: WarrantyManager, as_user_id: "wm_2", captures: { settled_b: $.data } }
          assert:
            - "Claim A (${claim_a}): settled_credit_cents == 250000 and credit_variant_applied == STANDARD"
            - "Claim B (${claim_b}): settled_credit_cents == 65000 and credit_variant_applied == MACHINING_ALLOWANCE"
            - "Same claim_qty/claimed_amount/unit_price produce 250000 != 65000 across the two variants"
            - "GET /api/orders/${ord_id}.settled_total_cents == 315000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pattern_dimensions_process_branch_and_cap
        grounds:
          - calculations.pattern_dimensions
          - entities.Pattern.fields.pattern_dimensions_mm
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (finish_dimensions_mm, machining_allowance_mm,
          alloy_shrink_class, mold_process) with nested min() on the allowance cap AND conditional
          branches on mold_process. Identical inputs [100,50,25], ma=8.0, FERROUS yield
          [107.1, 56.6, 31.3] under SAND but [103.7, 53.1, 27.8] under INVESTMENT because both the
          cap (6.0 vs 2.5) and the shrink rate (0.0104 vs 0.0120) switch.
        test_recipe:
          setup:
            - "Foundry only; two patterns with identical numeric inputs but different mold_process"
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-S", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_sand: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-I", alloy_shrink_class: "FERROUS", mold_process: "INVESTMENT", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_inv: $.data.id } }
          trigger:
            - { call: "GET /api/patterns/${pat_sand}", as: PatternMaker, captures: { dims_sand: $.data.pattern_dimensions_mm } }
            - { call: "GET /api/patterns/${pat_inv}", as: PatternMaker, captures: { dims_inv: $.data.pattern_dimensions_mm } }
          assert:
            - "SAND pattern ${pat_sand}.pattern_dimensions_mm == [107.1, 56.6, 31.3]  (min(8.0,6.0)=6.0; (d+6.0)*1.0104 per axis, 1dp round_half_up)"
            - "INVESTMENT pattern ${pat_inv}.pattern_dimensions_mm == [103.7, 53.1, 27.8]  (min(8.0,2.5)=2.5; (d+2.5)*1.0120 per axis)"
            - "Identical numeric inputs diverge purely through the process-branch + cap interaction"

      - name: corrective_charge_frozen_baseline_order
        grounds:
          - calculations.corrective_charge_masses
          - entities.MeltHeat.fields.last_correction_masses
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the corrective carbon mass
          depends on total weight which the correction itself increases; the frozen-baseline rule
          (W0 taken BEFORE any correction mass is added, single pass) yields exactly 4.14 kg for
          W0=1000, C0=3.00, target=3.40 (0.004*1000/(1.0-0.034)); an iterative or post-addition
          baseline yields a different mass.
        test_recipe:
          setup:
            - "Heat with 1000 kg charged at C 3.00 (spec C [3.20,3.60]); a failing sample recorded so the heat is SAMPLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 }, Si: { min: 2.2, max: 2.6 }, P: { min: 0.0, max: 0.05 } }, ce_max: 4.30 } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.00, Si: 2.40, P: 0.02 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.00, Si: 2.40, P: 0.02 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { heat_v3: $.data.version } }
          trigger:
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v3}", mode: "AUTO_CORRECT" }, as: MeltSupervisor, captures: { heat_after: $.data } }
          assert:
            - "MeltHeat.${heat_id}.last_correction_masses.C == 4.14 (frozen W0=1000 baseline; deficit 0.40 pct; 0.004*1000/(1.0-0.034) = 4.14)"
            - "MeltHeat.${heat_id}.last_correction_masses holds no Si key (Si 2.40 already within [2.20,2.60])"
            - "MeltHeat.${heat_id}.charge_total_kg == 1004.14 and status == CHARGING (looped back from SAMPLED)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: melt_heat_correction_cycle
        grounds:
          - state_machines.MeltHeat.CHARGING_to_SAMPLED
          - state_machines.MeltHeat.SAMPLED_to_CHARGING
          - state_machines.MeltHeat.CHARGING_to_CERTIFIED
        distinguishing_aspect: |
          MeltHeat is a CYCLIC machine: CHARGING -> SAMPLED (fail) -> CHARGING (corrective charge)
          -> SAMPLED (re-sample) -> CERTIFIED. The loop consumes one full correction round and the
          version advances on every hop (1->2->3->4->5), proving the cycle rather than a linear pipeline.
        test_recipe:
          setup:
            - "Heat on a furnace with 1000 kg charged at C 2.90 (under spec min 3.20)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 }, Si: { min: 2.2, max: 2.6 }, P: { min: 0.0, max: 0.05 } }, ce_max: 4.30 } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 2.90, Si: 2.40, P: 0.02 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
          trigger:
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 2.90, Si: 2.40, P: 0.02 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { s1_status: $.data.status, heat_v3: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v3}", mode: "AUTO_CORRECT" }, as: MeltSupervisor, captures: { c_status: $.data.status, heat_v4: $.data.version, corr: $.data.last_correction_masses } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v4}", reading: { C: 3.45, Si: 2.40, P: 0.02 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { s2_status: $.data.status, heat_v5: $.data.version } }
          assert:
            - "First sample: status == SAMPLED and last_sample_passed == false (C 2.90 < 3.20)"
