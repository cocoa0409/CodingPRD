              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Athlete
              as_user_id: "${ck_c}"
              captures: { err_ck1: $.data.error_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Moderator
              captures: { err_ck2: $.data.error_id }
          assert:
            - "Athlete caller: error_id == ERR_FORBIDDEN, HTTP 403"
            - "Moderator caller: error_id == ERR_FORBIDDEN, HTTP 403"

      - name: non_admin_cannot_start_challenge
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Challenge start requires an ACTIVE ADMIN membership of the club: a plain ACTIVE member gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Athlete NA-O owns club NA-C (OPEN); athlete NA-M is an ACTIVE MEMBER; challenge NA-CH is DRAFT"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "nao@x.com", display_name: "NAO", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { nao: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "nam@x.com", display_name: "NAM", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { nam: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${nao}", name: "NoAdmin Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${nao}"
              captures: { club_na: $.data.id }
            - call: "POST /v1/clubs/${club_na}/memberships"
              payload: { athlete_id: "${nam}" }
              as: Athlete
              as_user_id: "${nam}"
            - call: "POST /v1/clubs/${club_na}/challenges"
              payload: { name: "NoAdmin Challenge", goal_type: "DISTANCE_M", goal_target: 10000, start_date: "2026-09-01", end_date: "2026-09-30", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${nao}"
              captures: { ch_na: $.data.id }
          trigger:
            - call: "POST /v1/clubs/${club_na}/challenges/${ch_na}/start"
              payload: {}
              as: Athlete
              as_user_id: "${nam}"
              captures: { err_na: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (member is not ADMIN)"

      - name: athlete_cannot_delete_other_athlete
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]", state_machines.Athlete]
        distinguishing_aspect: "DELETE /v1/athletes/{id} is self-only: an athlete deleting another athlete's account gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Athletes DEL1 and DEL2 exist"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "del1@x.com", display_name: "DEL1", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { del1: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "del2@x.com", display_name: "DEL2", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { del2: $.data.id }
          trigger:
            - call: "DELETE /v1/athletes/${del2}"
              as: Athlete
              as_user_id: "${del1}"
              captures: { err_del: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"
            - "Athlete ${del2}.status remains ACTIVE"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_zone_update
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[privacy-zone-update-stale-athlete]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /v1/privacy-zones/{id} with expected_athlete_version one behind the athlete's current version (bumped by an intervening disable) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Athlete OC has an ACTIVE zone; client observed athlete version at zone creation"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "oc_o@x.com", display_name: "OC O", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { oc_o: $.data.id }
            - call: "POST /v1/athletes/${oc_o}/privacy_zones"
              payload: { center_lat: 37.0, center_lng: -122.0, radius_m: 500 }
              as: Athlete
              as_user_id: "${oc_o}"
              captures: { zone_oc: $.data.id }
            - call: "GET /v1/athletes/${oc_o}"
              as: Athlete
              as_user_id: "${oc_o}"
              captures: { oc_v: $.data.version }
            - call: "POST /v1/privacy-zones/${zone_oc}/disable"
              payload: {}
              as: Athlete
              as_user_id: "${oc_o}"
          trigger:
            - call: "PUT /v1/privacy-zones/${zone_oc}"
              payload: { center_lat: 37.5, center_lng: -122.5, radius_m: 800, expected_athlete_version: "${oc_v}" }
              as: Athlete
              as_user_id: "${oc_o}"
              captures: { err_oc: $.data.error_id }
            - call: "GET /v1/athletes/${oc_o}"
              as: Athlete
              as_user_id: "${oc_o}"
              captures: { oc_v2: $.data.version }
            - call: "PUT /v1/privacy-zones/${zone_oc}"
              payload: { center_lat: 37.5, center_lng: -122.5, radius_m: 800, expected_athlete_version: "${oc_v2}" }
              as: Athlete
              as_user_id: "${oc_o}"
              captures: { zone_oc2: $.data.radius_m }
          assert:
            - "Stale PUT: error_id == ERR_STALE_VERSION, HTTP 412 (disable bumped Athlete.version past ${oc_v})"
            - "Fresh PUT with the re-read version succeeds (HTTP 200) and radius_m == 800"

      - name: heatmap_opt_out_withdraws_contribution
        claim_type: derived_field_reconciliation
        grounds: [calculations.heatmap_contribution, entities.Athlete.fields.heatmap_opt_out]
        excluded_because:
          difficulty_instance: boundary_precision_check / heatmap_min_count_boundary
          rationale: "The cell-visibility flip at MIN_CELL_COUNT is asserted by the named §1.8 instance; the withdrawal direction (removal of an existing contribution) is additionally exercised by heatmap_cell_drops_below_min_on_account_deletion in this section. No dedicated opt-out toggle endpoint exists, so a standalone toggle recipe cannot be expressed without weakening the claim."
      - name: heatmap_cell_drops_below_min_on_account_deletion
        claim_type: derived_field_reconciliation
        grounds: [calculations.heatmap_contribution, state_machines.Athlete]
        distinguishing_aspect: "Deleting one of three contributing athletes (erasure cascade REJECTS the activity and withdraws the contribution) drops the cell from 3 to 2 and removes it from GET /v1/heatmap."
        test_recipe:
          setup: ["Segment HD-S RIDE 1000m city Delville ACTIVE; athletes HD1, HD2, HD3 each contributed one RIDE activity"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "hd0@x.com", display_name: "HD0", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { hd0: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${hd0}", name: "Deletion Ride", sport_type: "RIDE", start_lat: 68.00, start_lng: -153.00, end_lat: 68.01, end_lng: -153.00, distance_m: 1000, city: "Delville" }
              as: Athlete
              as_user_id: "${hd0}"
              captures: { seg_hd: $.data.id }
            - call: "POST /v1/segments/${seg_hd}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${hd0}"
            - call: "POST /v1/athletes"
              payload: { email: "hd1@x.com", display_name: "HD1", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { hd1: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "hd2@x.com", display_name: "HD2", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { hd2: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "hd3@x.com", display_name: "HD3", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { hd3: $.data.id }
            - call: "POST /v1/athletes/${hd1}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T06:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 68.00, lng: -153.00, t_offset_s: 0}, {lat: 68.01, lng: -153.00, t_offset_s: 300}], start_lat: 68.00, start_lng: -153.00, end_lat: 68.01, end_lng: -153.00, idempotency_key: "hd-1" }
              as: Athlete
              as_user_id: "${hd1}"
            - call: "POST /v1/athletes/${hd2}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T07:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 68.00, lng: -153.00, t_offset_s: 0}, {lat: 68.01, lng: -153.00, t_offset_s: 300}], start_lat: 68.00, start_lng: -153.00, end_lat: 68.01, end_lng: -153.00, idempotency_key: "hd-2" }
              as: Athlete
              as_user_id: "${hd2}"
            - call: "POST /v1/athletes/${hd3}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T08:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 68.00, lng: -153.00, t_offset_s: 0}, {lat: 68.01, lng: -153.00, t_offset_s: 300}], start_lat: 68.00, start_lng: -153.00, end_lat: 68.01, end_lng: -153.00, idempotency_key: "hd-3" }
              as: Athlete
              as_user_id: "${hd3}"
          trigger:
            - call: "GET /v1/heatmap?city=Delville&sport_type=RIDE"
              as: Athlete
              as_user_id: "${hd2}"
              captures: { cells_hd1: "$.data[0].contribution_count" }
            - call: "DELETE /v1/athletes/${hd1}"
              as: Athlete
              as_user_id: "${hd1}"
            - call: "GET /v1/heatmap?city=Delville&sport_type=RIDE"
              as: Athlete
              as_user_id: "${hd2}"
              captures: { cells_hd2: $.data }
          assert:
            - "Before deletion: cell contribution_count == 3"
            - "After deleting athlete HD1: GET /v1/heatmap?city=Delville returns [] (count 2 < MIN_CELL_COUNT 3)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: upload_side_effects_visible_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile, calculations.segment_matching]
        distinguishing_aspect: "Immediate consistency: an upload that completes is matched, ranked, and accumulated atomically — the leaderboard shows rank 1 and the challenge progress shows the distance in the very next reads, with no reconciliation delay."
        test_recipe:
          setup: ["Athlete IC-O owns club IC-C (OPEN) with ACTIVE DISTANCE_M challenge IC-CH (window covering 2026-09-01); athlete IC-M is member + JOINED; segment IC-S RUN 1000m ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "ico@x.com", display_name: "ICO", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ico: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "icm@x.com", display_name: "ICM", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { icm: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${ico}", name: "Immediate Run", sport_type: "RUN", start_lat: 69.00, start_lng: -154.00, end_lat: 69.01, end_lng: -154.00, distance_m: 1000, city: "Immedville" }
              as: Athlete
              as_user_id: "${ico}"
              captures: { seg_ic: $.data.id }
            - call: "POST /v1/segments/${seg_ic}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ico}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${ico}", name: "Immediate Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${ico}"
              captures: { club_ic: $.data.id }
            - call: "POST /v1/clubs/${club_ic}/memberships"
              payload: { athlete_id: "${icm}" }
              as: Athlete
              as_user_id: "${icm}"
            - call: "POST /v1/clubs/${club_ic}/challenges"
              payload: { name: "Immediate Challenge", goal_type: "DISTANCE_M", goal_target: 50000, start_date: "2026-09-01", end_date: "2026-09-30", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${ico}"
              captures: { ch_ic: $.data.id }
            - call: "POST /v1/clubs/${club_ic}/challenges/${ch_ic}/start"
              payload: {}
              as: Athlete
              as_user_id: "${ico}"
            - call: "POST /v1/challenges/${ch_ic}/participations"
              payload: { athlete_id: "${icm}" }
              as: Athlete
              as_user_id: "${icm}"
              captures: { part_ic: $.data.id }
          trigger:
            - call: "POST /v1/athletes/${icm}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 69.00, lng: -154.00, t_offset_s: 0}, {lat: 69.01, lng: -154.00, t_offset_s: 100}], start_lat: 69.00, start_lng: -154.00, end_lat: 69.01, end_lng: -154.00, idempotency_key: "ic-1", effort_hints: [{segment_id: "${seg_ic}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${icm}"
              captures: { act_ic: $.data.id, st_ic: $.data.status }
            - call: "GET /v1/segments/${seg_ic}/leaderboard"
              as: Athlete
              as_user_id: "${ico}"
              captures: { lb_ic: "$.data[0].rank_snapshot" }
            - call: "GET /v1/participations/${part_ic}"
              as: Athlete
              as_user_id: "${icm}"
              captures: { prog_ic: $.data.progress_value }
          assert:
            - "Upload response: status == COMPLETED (no async delay)"
            - "Immediate leaderboard read: rank_snapshot == 1 for the new effort"
            - "Immediate participation read: progress_value == 1000"

      - name: account_deletion_erasure_atomicity
        claim_type: immediate_consistency
        grounds: [state_machines.Athlete, endpoints]
        distinguishing_aspect: "DELETE /v1/athletes/{id} applies the whole erasure cascade atomically: the response shows DELETED, and immediate reads show PII scrubbed, memberships LEFT, and the athlete's efforts EXCLUDED."
        test_recipe:
          setup: ["Athlete ER1 with one COMPLETED activity matched to segment ER-S (effort ELIGIBLE); ER1 is ACTIVE member of club ER-C owned by ER2"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "er1@x.com", display_name: "ER1", home_lat: 37.0, home_lng: -122.0 }
