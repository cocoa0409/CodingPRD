        distinguishing_aspect: "Three certification attempts separate two different identity rules on the same endpoint: a technician who is not flagged as an inspector is refused at priority 5, the visit's own submitting technician — who IS a flagged inspector — is refused at priority 34, and only an independent inspector can sign the document off."
