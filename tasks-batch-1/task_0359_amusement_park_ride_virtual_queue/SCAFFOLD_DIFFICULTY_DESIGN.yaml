              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: GuestApp
              as_user_id: "${ga_id}"
          assert:
            - "Reservation.${res_id}.reservation_status == FORFEITED"
            - "ReturnWindow.${win_id}.reserved_count == 0"
            - "ReturnWindow.${win_id}.window_status == OPEN"
            - "Ride.${ride_id}.booked_slot_count == 0"

      - name: park_admission_count_conserved_under_admit_then_exit
        grounds:
          - state_machines.GuestDayTicket.ISSUED_to_ADMITTED
          - state_machines.GuestDayTicket.ADMITTED_to_EXITED
          - entities.Park.fields.admitted_count
        distinguishing_aspect: |
          Conserved quantity = Park.admitted_count (gate occupancy), a different conserved quantity than
          window slot occupancy. An admit (admitted_count 0->1, day_phase OPEN->FULL when gate is 1) paired
          with its compensating exit (1->0) restores admitted_count to 0 and day_phase back to OPEN, no drift.
        test_recipe:
          setup:
            - "Park gate_capacity 1; a guest with a day-ticket admitted (admitted_count 1, FULL) then exited"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 1, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/day-tickets"
              payload: { guest_id: "${ga_id}", ticket_date: "2026-06-15" }
              as: ParkAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /parks/${park_id}/admissions"
              payload: { ticket_id: "${ta_id}" }
              as: ParkAdmin
          trigger:
            - call: "POST /parks/${park_id}/exits"
              payload: { ticket_id: "${ta_id}" }
              as: ParkAdmin
          assert:
            - "GuestDayTicket.${ta_id}.admission_status == EXITED"
            - "Park.${park_id}.admitted_count == 0"
            - "Park.${park_id}.day_phase == OPEN"
