            - *c_ma_act
            - call: "POST /commission-overrides"
              payload: { supplier_id: "${sup}", override_type: "COMMISSION_PCT", value: 0.19, effective_from: "2026-09-01", effective_to: "2026-09-30", justification: "negotiated peak commission" }
              as: CommercialManager
