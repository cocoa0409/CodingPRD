  # =======================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:

      - name: lost_return_shipment_cascades_seven_hops_to_a_cancelled_allocation
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_LOST
          - state_machines.BoxItem.RETURNING_to_LOST
          - state_machines.GarmentUnit.INBOUND_to_LOST_IN_TRANSIT
          - state_machines.Member.ACTIVE_to_DELINQUENT
          - state_machines.Cycle.OPEN_to_HELD
          - calculations.lost_assessed_value
          - calculations.delinquency_evaluation
        distinguishing_aspect: |
          TRIGGER = POST /kidswear/shipments/{id}/mark-lost. Seven CAUSED hops, each caused by
          the previous one and not by the original call: shipment LOST -> label LOST ->
          box item LOST/LOST_CHARGED -> unit LOST_IN_TRANSIT -> a 22000-cent
          LOST_LIABILITY charge -> member DELINQUENT -> the SECOND cycle goes HELD and its
          ALLOCATED item is CANCELLED, releasing its reserved unit back to IN_STOCK.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot and a 5000-cent fee; one ACTIVE member sized 5."
            - "A 40000-cent coat style with two units."
            - "Cycle 1 is OPEN, its box shipped and the single item now RETURNING on a departed return shipment."
            - "Cycle 2 is OPEN with a DRAFT box holding one ALLOCATED item whose unit is RESERVED."
            - "Member.outstanding_balance_cents is 10000 from two plan charges, below the 15000 delinquency threshold."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_csc: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_csc}", email: "cascade@kidswear.test", display_name: "Cascade Household", child_size_code: "5", protection_enrolled: false, auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_csc: $.data.id }
            - call: "POST /kidswear/members/${m_csc}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-COAT-40K", name: "Winter Coat", brand_tier: "PREMIUM", retail_price_cents: 40000, size_code: "5", season: "AW", category: "OUTERWEAR", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_csc: $.data.id }
            - call: "POST /kidswear/garment-units"
