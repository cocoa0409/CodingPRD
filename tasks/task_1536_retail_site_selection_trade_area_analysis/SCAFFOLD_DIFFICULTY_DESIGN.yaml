  - rule_id: cross_entity_state_dependency
    instances:
      - name: site_screening_requires_market_qualified
        grounds:
          - state_machines.Site.DRAFT_to_SCREENED
          - validations[priority=9]
          - errors[ERR_MARKET_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair Site -> Market: run-screening on the site is gated by the
          referenced market's market_status == QUALIFIED; a DISQUALIFIED market
          (final_score 44.00) forces ERR_MARKET_NOT_QUALIFIED and the site
          stays DRAFT.
        test_recipe:
          setup:
            - "Market evaluated to DISQUALIFIED (pop 100000, income 4500000, growth 100bp, psycho 60 -> final 44.00)"
            - "Site created in that market (creation is not gated; screening is)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro DQ", state_code: "WV", population: 100000, median_household_income_cents: 4500000, population_growth_bp: 100, psychographic_index: 60, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
              captures: { fin: $.data.final_score, mst: $.data.market_status }
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "3 Coal Rd", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Market.${mkt_id}.final_score == 44.00 and market_status == DISQUALIFIED"
            - "run-screening fails with ERR_MARKET_NOT_QUALIFIED (409): Site's transition depends on Market's state"
            - "Site.${site_id}.site_status remains DRAFT"

