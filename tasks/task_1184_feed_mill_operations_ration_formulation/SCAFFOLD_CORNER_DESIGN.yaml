# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Coverage Index for Non-Difficulty Tests (§1.9)
# Breadth probe: every testable §1.1-§1.7 claim not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_defaults_applied_on_creation
        claim_type: defaults
        grounds: ["entities.Bin.fields.status", "entities.Formula.fields.status", "entities.Customer.fields.credit_used_cents"]
        distinguishing_aspect: "New Bin is EMPTY with on_hand_tons 0 and null ingredient; new Formula is DRAFT with empty lines; new Customer is ACTIVE with credit_used_cents 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/bins", payload: { code: "BIN-1", capacity_tons: 50 }, as: MillManager, captures: { bin_id: $.data.id } }
            - { call: "POST /api/formulas", payload: { code: "F-1", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "GET /api/bins/${bin_id}", as: MillManager }
            - { call: "GET /api/formulas/${f_id}", as: MillManager }
            - { call: "GET /api/customers/${cust_id}", as: MillManager }
          assert:
            - "Bin.${bin_id}: status == EMPTY, on_hand_tons == 0, ingredient_id == null, version == 1"
            - "Formula.${f_id}: status == DRAFT, lines == [], meets_constraints == false"
            - "Customer.${cust_id}: status == ACTIVE, credit_used_cents == 0"

      - name: customer_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Customer.fields.credit_used_cents"]
        distinguishing_aspect: "Client-supplied credit_used_cents on creation is ignored; the server computes 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Sneaky Sam", credit_limit_cents: 1000000, credit_used_cents: 999999 }, as: MillManager, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "GET /api/customers/${cust_id}", as: MillManager }
          assert:
            - "Customer.${cust_id}.credit_used_cents == 0 (client input 999999 ignored)"

      - name: bin_get_with_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a non-existent bin id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/bins/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: MillManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: ingredient_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Ingredient.fields.hazard_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hazard_class outside {STANDARD, MEDICATED} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/ingredients", payload: { code: "X", name: "Mystery", hazard_class: "TOXIC", crude_protein_pct: 1.0, crude_fiber_pct: 1.0, metabolizable_energy_kcal_kg: 100 }, as: MillManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: order_create_with_unknown_formula_returns_404
        claim_type: parent_relationships
        grounds: ["entities.CustomerOrder.fields.formula_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK to a non-existent formula resolves at existence priority as ERR_NOT_FOUND (flat-topology cross-reference integrity)."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders", payload: { formula_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: bin_list_pagination_limit_offset
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "GET /api/bins honors limit/offset and reports total_count and has_more."
        test_recipe:
          setup: ["three bins exist"]
          setup_api_calls:
            - { call: "POST /api/bins", payload: { code: "BIN-1", capacity_tons: 50 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-2", capacity_tons: 50 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-3", capacity_tons: 50 }, as: MillManager }
          trigger:
            - { call: "GET /api/bins?limit=2", as: MillManager }
            - { call: "GET /api/bins?limit=2&offset=2", as: MillManager }
            - { call: "GET /api/bins", as: MillManager }
          assert:
            - "GET /api/bins?limit=2 returns 2 items with total_count == 3 and has_more == true"
            - "GET /api/bins?limit=2&offset=2 returns 1 item with has_more == false"
            - "default page (no params) uses limit 10 per pagination_defaults"

  - section: state_machines
    instances:
      - name: complete_quoted_order_rejected_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.CustomerOrder.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /complete is only defined from IN_PRODUCTION; from QUOTED it fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["catalog + F-GROW ACTIVE; order 10t still QUOTED"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${ord_id}/complete", payload: {}, as: MillManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "CustomerOrder.${ord_id}.status == QUOTED (unchanged)"

      - name: terminal_batch_released_accepts_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Batch.transitions"]
        distinguishing_aspect: "From terminal RELEASED, mix/rework/reject/cancel all fail ERR_INVALID_STATE; samples cannot be added either (batch not MIXED/HOLD)."
        test_recipe:
          setup: ["catalog + order CONFIRMED; batch fully released (weighed on target, sample PASS)"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Quinn Quality", capability: "QUALITY_TECH" }, as: MillManager, captures: { qt_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/mix", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/samples", payload: { batch_id: "${bat_id}", sample_type: "COMPOSITE" }, as: QualityTech, as_user_id: "${qt_id}", captures: { sam_id: $.data.id } }
            - { call: "POST /api/samples/${sam_id}/result", payload: { protein_pct_actual: 20.0, crude_fiber_pct_actual: 4.0, moisture_pct: 0 }, as: QualityTech, as_user_id: "${qt_id}" }
            - { call: "POST /api/batches/${bat_id}/release", payload: {}, as: QualityTech, as_user_id: "${qt_id}" }
          trigger:
            - { call: "POST /api/batches/${bat_id}/rework", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/batches/${bat_id}/cancel", payload: {}, as: MillManager, captures: { err2: $.data.error_id } }
          assert:
            - "rework from RELEASED: err1 == ERR_INVALID_STATE"
            - "cancel from RELEASED: err2 == ERR_INVALID_STATE"
            - "Batch.${bat_id}.status == RELEASED (unchanged)"

      - name: contract_auto_expires_on_clock_sweep
        claim_type: auto_transition
        grounds: ["state_machines.Contract.OPEN_to_EXPIRED", "calculations.contract_consumption"]
        distinguishing_aspect: "An OPEN contract whose window_end_date falls behind the logical clock with remaining_tons > 0 flips to EXPIRED at the clock-set sweep and leaves the pricing pool."
        test_recipe:
          setup: ["corn with spot tick; contract window [2026-04-01, 2026-04-30] (already past the default clock is NOT required: sweep fires on set)"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/contracts", payload: { ingredient_id: "${corn_id}", supplier_ref: "SUP-OLD", fixed_price_cents_per_ton: 29000, total_tons: 50, window_start_date: "2026-03-01", window_end_date: "2026-04-30" }, as: MillManager, captures: { con_id: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: MillManager }
            - { call: "GET /api/contracts/${con_id}", as: MillManager }
          assert:
            - "Contract.${con_id}.status == EXPIRED after the sweep (window ended 2026-04-30, remaining_tons == 50 > 0)"
            - "Contract.${con_id}.remaining_tons == 50 (expiry does not consume)"

      - name: flush_verify_by_recorder_rejected_sod
        claim_type: precondition_enforcement
        grounds: ["state_machines.FlushRecord.RECORDED_to_VERIFIED", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the recording operator cannot verify their own flush; a different operator succeeds."
        test_recipe:
          setup: ["line L1; flush material HULLS; two operators op1 and op2; flush recorded by op1"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "HULLS", name: "Rice hulls flush", hazard_class: "STANDARD", is_flush_material: true, crude_protein_pct: 3.0, crude_fiber_pct: 30.0, metabolizable_energy_kcal_kg: 1000 }, as: MillManager, captures: { hulls_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op1_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Omar Operator", capability: "OPERATOR" }, as: MillManager, captures: { op2_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/flush-records", payload: { line_id: "${line_id}", flush_material_ingredient_id: "${hulls_id}", quantity_tons: 0.5 }, as: Operator, as_user_id: "${op1_id}", captures: { fl_id: $.data.id } }
          trigger:
            - { call: "POST /api/flush-records/${fl_id}/verify", payload: {}, as: Operator, as_user_id: "${op1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/flush-records/${fl_id}/verify", payload: {}, as: Operator, as_user_id: "${op2_id}" }
          assert:
            - "self-verify rejected: err == ERR_SOD_VIOLATION, http 422"
            - "verify by op2 succeeds: FlushRecord.${fl_id}.status == VERIFIED, verified_by_employee_id == ${op2_id}"

      - name: batch_release_without_pass_sample_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Batch.MIXED_to_RELEASED", "errors[ERR_QUALITY_NOT_PASSED]"]
        distinguishing_aspect: "Release requires an existing PASS sample; with only a PENDING sample the release fails ERR_QUALITY_NOT_PASSED."
        test_recipe:
          setup: ["catalog + order CONFIRMED; batch MIXED; one sample collected but still PENDING"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Quinn Quality", capability: "QUALITY_TECH" }, as: MillManager, captures: { qt_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/mix", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/samples", payload: { batch_id: "${bat_id}", sample_type: "COMPOSITE" }, as: QualityTech, as_user_id: "${qt_id}", captures: { sam_id: $.data.id } }
          trigger:
            - { call: "POST /api/batches/${bat_id}/release", payload: {}, as: QualityTech, as_user_id: "${qt_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_QUALITY_NOT_PASSED, http 409"
            - "Batch.${bat_id}.status == MIXED (unchanged)"

      - name: order_moves_in_production_on_first_batch_start
        claim_type: side_effect_execution
        grounds: ["state_machines.CustomerOrder.CONFIRMED_to_IN_PRODUCTION"]
        excluded_because:
          difficulty_instance: "transitive_cascade / sample_fail_cascades_batch_hold_order_blocked_trips_cancelled"
          rationale: "That instance asserts CustomerOrder.status == IN_PRODUCTION after batch start as part of its cascade asserts."

  - section: calculations
    instances:
      - name: price_tie_break_latest_created_tick_wins
        claim_type: correct_result
        grounds: ["calculations.effective_spot_price"]
        distinguishing_aspect: "Two corn ticks share effective_from 2026-04-01; the one with the later created_at (31000) wins the tie-break, so the optimizer prices corn at 31000."
        test_recipe:
          setup: ["corn and SBM; corn has two ticks at the same effective_from (30000 first, 31000 second)"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
