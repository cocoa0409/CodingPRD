scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — dual-variant calculations on DIFFERENT entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: government_fee_basis_per_order_versus_per_applicant
        grounds:
          - calculations.government_fee_total
          - entities.ServiceCatalogItem.fields.government_fee_basis
          - entities.Order.fields.government_fee_quoted_cents
          - state_machines.Order.DRAFT_to_QUOTED
        distinguishing_aspect: |
          This dual variant lives on the Order money domain: the identical
          catalog fee of 16000 cents produces 48000 cents under PER_APPLICANT
          and 16000 cents under PER_ORDER for the same three-applicant order,
          while the SERVICE stream is byte-identical across both.
        test_recipe:
          setup:
            - "Two catalog items differing only in government_fee_basis, each with government_fee_cents 16000 and base_service_fee_cents 7500."
            - "Two STANDARD orders, one per catalog item, each carrying three applicants."
            - "Both orders quoted with no promo discount."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_pa_id: $.data.id }
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "BR", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_ORDER", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_po_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_pa_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_pa_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_po_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_po_id: $.data.id }
            - call: "POST /expediting/orders/${ord_pa_id}/applicants"
              payload: { full_name: "PA One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_pa_id}/applicants"
              payload: { full_name: "PA Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_pa_id}/applicants"
              payload: { full_name: "PA Three", date_of_birth: "1992-05-06", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_po_id}/applicants"
              payload: { full_name: "PO One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_po_id}/applicants"
              payload: { full_name: "PO Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_po_id}/applicants"
              payload: { full_name: "PO Three", date_of_birth: "1992-05-06", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_pa_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_po_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          assert:
            - "Order.${ord_pa_id}.government_fee_quoted_cents == 48000"
            - "Order.${ord_po_id}.government_fee_quoted_cents == 16000"
            - "Order.${ord_pa_id}.service_fee_quoted_cents == 20250"
            - "Order.${ord_po_id}.service_fee_quoted_cents == 20250"
            - "Order.${ord_pa_id}.total_quoted_cents == 68250"
            - "Order.${ord_po_id}.total_quoted_cents == 36250"
            - "Order.${ord_pa_id}.discount_pct_applied == 0.10"
            - "Order.${ord_pa_id}.handling_fee_waived == true"

      - name: document_validity_anchor_return_date_versus_travel_date
        grounds:
          - calculations.document_validity_check
          - entities.DocumentRequirement.fields.validity_rule
          - entities.ApplicantDocument.fields.expiry_date
          - validations[priority=22]
        distinguishing_aspect: |
          This dual variant lives on the ApplicantDocument date domain, not on
          money: one and the same pair of document dates (issue 2026-04-10,
          expiry 2026-12-31) is ACCEPTED under the issue_date_anchored rule and
          REJECTED with ERR_DOCUMENT_VALIDITY_INSUFFICIENT under the
          return_date_anchored rule, because the two rules anchor on the
          departure date and the return date respectively.
        test_recipe:
          setup:
            - "One catalog item carrying two required requirement lines: PASSPORT_BOOK under VALID_BEYOND_RETURN_MONTHS with validity_param 6, and EMPLOYMENT_LETTER under EXPIRES_AFTER_ISSUE_DAYS with validity_param 300."
            - "An order with travel_date 2026-07-01 and return_date 2026-07-20, one applicant, both document slots submitted with issue_date 2026-04-10 and expiry_date 2026-12-31."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "PASSPORT_BOOK", is_required: true, validity_rule: "VALID_BEYOND_RETURN_MONTHS", validity_param: 6 }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "EMPLOYMENT_LETTER", is_required: true, validity_rule: "EXPIRES_AFTER_ISSUE_DAYS", validity_param: 300 }
              as: PlatformAdmin
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-07-01", return_date: "2026-07-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Doc Anchor", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/documents"
              payload: { doc_type: "PASSPORT_BOOK", issue_date: "2026-04-10", expiry_date: "2026-12-31" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { doc_pb_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/documents"
              payload: { doc_type: "EMPLOYMENT_LETTER", issue_date: "2026-04-10", expiry_date: "2026-12-31" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { doc_el_id: $.data.id }
          trigger:
            - call: "POST /expediting/documents/${doc_el_id}/review"
              payload: { decision: "ACCEPT" }
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/documents/${doc_pb_id}/review"
              payload: { decision: "ACCEPT" }
              as: CaseManager
              as_user_id: "cm-review"
              captures: { pb_err: $.data.error_id }
          assert:
            - "ApplicantDocument.${doc_el_id}.review_status == ACCEPTED"
            - "the PASSPORT_BOOK review responds 422 with error_id ERR_DOCUMENT_VALIDITY_INSUFFICIENT"
            - "ApplicantDocument.${doc_pb_id}.review_status == RECEIVED"
            - "Applicant.${ap_id}.accepted_doc_count == 1"
            - "Applicant.${ap_id}.required_doc_count == 2"
            - "Applicant.${ap_id}.readiness_status == PENDING"

  # =======================================================================
  # Rule 2 — combinatorial formulas in DIFFERENT modes: (b) and (c)
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: service_line_rounded_per_applicant_then_summed
        grounds:
          - calculations.per_applicant_service_line
          - calculations.service_fee_total
          - entities.Order.fields.service_fee_quoted_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. Three EXPEDITED
          applicants at 7500 cents each give a raw line of 7500 * 1.35 * 0.90 =
          9112.5 cents; rounding per line then summing yields 27339 cents, while
          summing then rounding once yields 27338 cents. The scaffold pins
          round-per-line-then-sum, so 27339 is the only correct answer.
        test_recipe:
          setup:
            - "One catalog item with base_service_fee_cents 7500 and government_fee_cents 16000 on PER_APPLICANT basis."
            - "An EXPEDITED order carrying exactly three applicants, quoted with no promo discount so the automatic 10 percent multi-applicant discount alone applies."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "EXPEDITED" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Exp One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Exp Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Exp Three", date_of_birth: "1992-05-06", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          assert:
            - "Order.${ord_id}.service_fee_quoted_cents == 27339"
            - "Order.${ord_id}.service_fee_quoted_cents != 27338"
            - "Order.${ord_id}.handling_fee_waived == true"
            - "Order.${ord_id}.government_fee_quoted_cents == 48000"
            - "Order.${ord_id}.total_quoted_cents == 75339"

      - name: handling_waiver_reads_post_discount_subtotal_so_a_bigger_discount_costs_more
        grounds:
          - calculations.service_fee_total
          - entities.Order.fields.handling_fee_waived
          - entities.Order.fields.discount_pct_applied
          - entities.Order.fields.total_quoted_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order. The handling-fee waiver is decided from the POST-discount
          subtotal, so asking for a 5 percent promo drops the subtotal from
          20250 to 19125 cents, falls below the 20000 floor, forfeits the 3000
          waiver, and raises the order total from 68250 to 70125 cents.
        test_recipe:
          setup:
            - "One catalog item with base_service_fee_cents 7500, government_fee_cents 16000 on PER_APPLICANT basis."
            - "One STANDARD order with exactly three applicants, quoted twice: first with no promo, then with promo_discount_pct 0.05."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Trap One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Trap Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Trap Three", date_of_birth: "1992-05-06", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { total_no_promo: $.data.total_quoted_cents }
          trigger:
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: { promo_discount_pct: 0.05 }
              as: CaseManager
              as_user_id: "cm-quote"
          assert:
            - "the first quote produced Order.${ord_id}.total_quoted_cents == 68250 with handling_fee_waived == true"
            - "Order.${ord_id}.discount_pct_applied == 0.15"
            - "Order.${ord_id}.handling_fee_waived == false"
            - "Order.${ord_id}.service_fee_quoted_cents == 22125"
            - "Order.${ord_id}.total_quoted_cents == 70125"
            - "Order.${ord_id}.total_quoted_cents > ${total_no_promo}"

  # =======================================================================
  # Rule 3 — non-linear state machines on DIFFERENT entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: photo_capped_retake_cycle_on_photo_asset
        grounds:
          - state_machines.PhotoAsset.PENDING_to_FAILED
          - state_machines.PhotoAsset.FAILED_to_SUPERSEDED
          - calculations.photo_compliance
          - validations[priority=23]
          - entities.PhotoAsset.fields.retake_count
        distinguishing_aspect: |
          PhotoAsset is cyclic with a capped retry: FAILED -> SUPERSEDED spawns a
          fresh PENDING photo carrying retake_count + 1, and the loop closes at
          PHOTO_RETAKE_CAP = 3 so the fourth retake is refused with
          ERR_PHOTO_RETAKE_CAP_EXCEEDED while photo #4 stays FAILED.
        test_recipe:
          setup:
            - "A catalog item with no document requirement lines and an order with one applicant."
            - "Four photo submissions chained by retake, each with head_height_ratio 0.80 so the HEAD_HEIGHT criterion always fails."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Photo Loop", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.80, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph1_id: $.data.id }
            - call: "POST /expediting/photos/${ph1_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph1_id}/retake"
              payload: { taken_on: "2026-05-21", head_height_ratio: 0.80, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph2_id: $.data.id }
            - call: "POST /expediting/photos/${ph2_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph2_id}/retake"
              payload: { taken_on: "2026-05-22", head_height_ratio: 0.80, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph3_id: $.data.id }
            - call: "POST /expediting/photos/${ph3_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph3_id}/retake"
              payload: { taken_on: "2026-05-23", head_height_ratio: 0.80, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph4_id: $.data.id }
            - call: "POST /expediting/photos/${ph4_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
          trigger:
            - call: "POST /expediting/photos/${ph4_id}/retake"
              payload: { taken_on: "2026-05-24", head_height_ratio: 0.55, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { cap_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_PHOTO_RETAKE_CAP_EXCEEDED"
            - "PhotoAsset.${ph1_id}.compliance_status == SUPERSEDED"
            - "PhotoAsset.${ph1_id}.retake_count == 0"
            - "PhotoAsset.${ph4_id}.compliance_status == FAILED"
            - "PhotoAsset.${ph4_id}.retake_count == 3"
            - "PhotoAsset.${ph4_id}.failure_reasons == [HEAD_HEIGHT]"
            - "GET /expediting/applicants/${ap_id}/photos returns exactly 4 rows"

      - name: rfe_insufficient_reopen_cycle_on_rfe_entity
        grounds:
          - state_machines.RFE.RESPONDED_to_OPEN
          - state_machines.RFE.RESPONDED_to_INSUFFICIENT
          - state_machines.Order.AT_AGENCY_to_RFE_PENDING
          - entities.RFE.fields.response_count
          - calculations.rfe_deadline
        distinguishing_aspect: |
          RFE is cyclic on a different entity from PhotoAsset: a single RFE row
          walks OPEN -> RESPONDED -> OPEN once (response_count 1 < RFE_ROUND_CAP
          2, deadline re-issued) and only on the second INSUFFICIENT adjudication
          does it fall to the terminal INSUFFICIENT, dragging the Order to
          ABANDONED.
        test_recipe:
          setup:
            - "A STANDARD single-applicant order driven all the way to workflow_status AT_AGENCY with custody_holder AGENCY, at logical clock 2026-06-01T09:00:00Z."
            - "One RFE issued on that order."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/agency-forms"
              payload: { form_code: "DS-160", revision: 1, required_field_count: 12 }
              as: PlatformAdmin
              captures: { form_v1_id: $.data.id }
            - call: "POST /expediting/agency-forms/${form_v1_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "PASSPORT_BOOK", is_required: true, validity_rule: "VALID_BEYOND_RETURN_MONTHS", validity_param: 6 }
              as: PlatformAdmin
            - call: "POST /expediting/consulates"
              payload:
                name: "IN Consulate West"
                destination_country: "IN"
                jurisdiction_region_codes: ["CA", "NV"]
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD", consulate_id: "${cons_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Rfe Loop", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/documents"
              payload: { doc_type: "PASSPORT_BOOK", issue_date: "2020-01-15", expiry_date: "2030-01-15" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { doc_id: $.data.id }
            - call: "POST /expediting/documents/${doc_id}/review"
              payload: { decision: "ACCEPT" }
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/applicants/${ap_id}/photos"
