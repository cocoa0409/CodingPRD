            - "${lid} == ${case1}, ${lvol} == ${vol}, ${lsil} == ${sil} and ${lcnt} == ${cnt} - the zone sub-resource returns the identical stored row, not a recomputation"
            - "${apst} == RESERVED == ${pst} and ${aacid} == ${acid} == ${case1} - the junction side of the placement is visible immediately on the artifact"
