              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${cl}.settlement_cents == 950000"
            - "ScheduledItem.${it}.item_status == REMOVED"
            - "Policy.${pol}.total_insured_value_cents == 0"

      - name: terminal_claim_close_then_reapprove_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED claim rejects /approve with ERR_INVALID_STATE (409); terminal states accept no transitions."
        test_recipe:
          setup: ["ACTIVE policy; a TOTAL_LOSS claim driven to CLOSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
