        excluded_because:
          difficulty_instance: "transitive_cascade / non_arrival_claim_cascades_to_suspension_cancellation_and_bond_release"
          rationale: "Parent-to-children cascade with only non-terminal (FILED) children affected is asserted end-to-end there."

