      - name: campaign_pause_resume_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.OutreachCampaign.ACTIVE_to_PAUSED"
          - "state_machines.OutreachCampaign.PAUSED_to_ACTIVE"
        distinguishing_aspect: "Campaign cycles ACTIVE -> PAUSED -> ACTIVE via PATCH (cyclic machine distinct from Subscription and PickupTicket cycles); spent_cents frozen at launch value throughout."
        test_recipe:
          setup: ["campaign DRAFT (budget 100000, audience 1000, cost 100, end_date 2026-12-31); launched -> ACTIVE"]
          setup_api_calls:
            - { call: "POST /outreach-campaigns", payload: { zone_id: null, channel: "MAIL", topic: "ACCEPTABLE_MATERIALS", budget_cents: 100000, audience_size: 1000, cost_per_impression_cents: 100, end_date: "2026-12-31" }, as: OutreachCoordinator, as_user_id: "out_1", captures: { camp: $.data.id, cst0: $.data.status } }
            - { call: "POST /outreach-campaigns/${camp}/launch", payload: {}, as: OutreachCoordinator, as_user_id: "out_1", captures: { cst1: $.data.status, spent: $.data.spent_cents } }
          trigger:
            - { call: "PATCH /outreach-campaigns/${camp}", payload: { status: "PAUSED" }, as: OutreachCoordinator, as_user_id: "out_1", captures: { cst2: $.data.status } }
            - { call: "PATCH /outreach-campaigns/${camp}", payload: { status: "ACTIVE" }, as: OutreachCoordinator, as_user_id: "out_1", captures: { cst3: $.data.status } }
          assert:
