      - name: appraisal_create_stale_parcel_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-create-stale-parcel]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one appraisal create bumps Parcel.version, a second create carrying the pre-bump expected_parcel_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A parcel; its version observed once before any appraisal create."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
