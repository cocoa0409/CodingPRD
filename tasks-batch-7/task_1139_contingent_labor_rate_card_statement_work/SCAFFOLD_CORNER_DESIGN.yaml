            - "E2's offers remain OFFERED (due 2026-05-12): filtered list for E2 status OFFERED returns total_count == 2"
            - "S1.open_offers_count == 1 and S2.open_offers_count == 1 afterwards (only E2's offers still outstanding)"

      - name: invoice_void_returns_lines_to_fresh_open_invoice
        claim_type: cascading_side_effects
        grounds: ["state_machines.Invoice.FINALIZED_to_VOIDED", "state_machines.Milestone"]
        distinguishing_aspect: "Void compensation: finalizing then voiding an invoice migrates its lines to a fresh OPEN invoice and flips milestones INVOICED back to UNINVOICED; the VOIDED invoice keeps its identity."
        test_recipe:
          setup: ["SOW engagement ACTIVE; milestone 1000000 DELIVERED+ACCEPTED; invoice finalized"]
