# =============================================================================
# SCAFFOLD.yaml — Public-Assistance Fraud & Recovery Unit (§1.0–§1.7)
# =============================================================================

scenario: |
  Public-Assistance Fraud & Recovery Unit: referral & case (SNAP/TANF/Medicaid),
  investigation & evidence, overpayment calculation & claim type
  (IHE/inadvertent/agency), disqualification (IPV) & hearing, recovery
  (recoupment/offset/collection), restitution & interest, ADH referral, reporting

domain_name: public-assistance-fraud-recovery
api_prefix: /fraud-recovery

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit         # regulatory recovery workflow with tamper-evident trail
  secondary_archetype: ledger_reconciliation  # overpayment provisional vs finalized; principal/interest ledger
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys, all collections nested under a
  # single API namespace prefix (/fraud-recovery/<collection>). No entity is
  # nested under another entity's id in a URL; relationships are body-level FKs.

  state_machine_shape: cyclic
  # Case has a review/return loop (PENDING_REVIEW -> INVESTIGATION); Hearing is
  # branching fork (HELD -> {DECIDED_IPV, DECIDED_NO_IPV, DISMISSED}) with
  # divergent side-effect sets; the remaining machines are branching-with-revert.

  relationship_patterns:
    - one_to_many        # Case -> Evidence, Overpayment -> OverpaymentMonth, RecoveryPlan -> RecoveryTransaction
    - cross_aggregate    # Disqualification imposition reclassifies a linked Overpayment across aggregate boundaries

  role_model: segregation_of_duties
  # The Adjudicator who decides an ADH cannot be the Investigator assigned to the
  # underlying case (compared by X-User-ID). Supervisor holds hierarchical
  # override for establishment/write-off/rescission.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Subject
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Subject (household member) name" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 digits of SSN (identity display only, never a decision input)" }
      - { name: primary_program, type: enum, source: input, description: "SNAP | TANF | MEDICAID" }
      - { name: prior_ipv_count, type: integer, source: system, default: 0, description: "Count of currently-IMPOSED (non-rescinded) IPV disqualifications; incremented on imposition, decremented on rescission" }
      - { name: disqualification_status, type: enum, source: computed, description: "NONE | DISQUALIFIED | PERMANENTLY_DISQUALIFIED — derived from this subject's Disqualification records and the logical clock" }
      - { name: disqualified_until, type: datetime, source: computed, description: "Latest disqualified_until across IMPOSED non-permanent disqualifications; null when NONE or PERMANENTLY_DISQUALIFIED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; the alleged subject of the fraud referral" }
      - { name: program, type: enum, source: input, description: "SNAP | TANF | MEDICAID — program the allegation concerns" }
      - { name: source, type: enum, source: input, description: "HOTLINE | DATA_MATCH | CASEWORKER | PUBLIC" }
      - { name: allegation_summary, type: string, source: input, description: "Free-text description of the allegation" }
      - { name: priority_score, type: integer, source: computed, description: "Weighted intake score = PROGRAM_WEIGHT[program] + SOURCE_WEIGHT[source]" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> ACCEPTED/REJECTED; ACCEPTED -> CONVERTED (when a Case is opened)" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the referral this case was opened from" }
      - { name: subject_id, type: string, source: system, description: "FK -> Subject.id; copied from the referral at case creation" }
      - { name: program, type: enum, source: system, description: "SNAP | TANF | MEDICAID; copied from the referral" }
      - { name: assigned_investigator_id, type: string, source: system, description: "Opaque X-User-ID of the Investigator assigned; used for segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "OPEN -> INVESTIGATION -> PENDING_REVIEW -> {INVESTIGATION (return), SUBSTANTIATED, UNSUBSTANTIATED}" }

  - name: Evidence
    parent: Case
    common_fields: false   # append-only, immutable: id + created_at only, no version
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this evidence belongs to" }
      - { name: kind, type: enum, source: input, description: "DOCUMENT | INTERVIEW | DATA_MATCH | SURVEILLANCE" }
      - { name: description, type: string, source: input, description: "Description of the evidence item" }
      - { name: document_ref, type: string, source: input, description: "Optional external document reference" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the submitting Investigator" }

  - name: Overpayment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the substantiated case this overpayment claim derives from" }
      - { name: claim_type, type: enum, source: input, description: "IPV (intentional program violation) | IHE (inadvertent household error) | AE (agency error). May be reclassified to IPV by a cascade when a Disqualification is imposed." }
      - { name: status, type: enum, source: system, description: "DRAFT -> CALCULATED -> ESTABLISHED -> DEMANDED -> IN_RECOVERY -> SATISFIED; plus WRITTEN_OFF and TERMINATED" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Sum over months of max(0, benefits_issued_cents - benefits_entitled_reported_cents); set on calculate" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Sum over months of max(0, benefits_issued_cents - benefits_entitled_verified_cents) + total_adjustments_cents; set on establish and on each adjustment" }
      - { name: total_adjustments_cents, type: integer, source: system, default: 0, description: "Running signed sum of posted adjustments applied to the claim" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Simple monthly interest accrued on final_amount_cents from demand_date to the logical clock while outstanding_principal_cents > 0" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "final_amount_cents minus sum of applied_to_principal_cents over POSTED RecoveryTransactions of this overpayment" }
      - { name: outstanding_interest_cents, type: integer, source: computed, description: "accrued_interest_cents minus sum of applied_to_interest_cents over POSTED RecoveryTransactions of this overpayment" }
      - { name: demand_date, type: datetime, source: system, description: "Logical-clock timestamp when the claim was demanded; interest accrual anchor; null before demand" }
      - { name: due_date, type: datetime, source: system, description: "demand_date + PAYMENT_DUE_DAYS; null before demand" }

  - name: OverpaymentMonth
    parent: Overpayment
    common_fields: false   # immutable line item: id + created_at only
    fields:
      - { name: overpayment_id, type: string, source: input, description: "FK -> Overpayment.id; the claim this month line belongs to" }
      - { name: benefit_month, type: string, source: input, description: "Affected month in YYYY-MM format" }
      - { name: benefits_issued_cents, type: integer, source: input, description: "Benefits actually issued that month, in cents" }
      - { name: benefits_entitled_reported_cents, type: integer, source: input, description: "Benefits the household would have been entitled to using reported income, in cents" }
      - { name: benefits_entitled_verified_cents, type: integer, source: input, description: "Benefits the household would have been entitled to using verified income, in cents" }
      - { name: over_issuance_reported_cents, type: integer, source: computed, description: "max(0, benefits_issued_cents - benefits_entitled_reported_cents)" }
      - { name: over_issuance_verified_cents, type: integer, source: computed, description: "max(0, benefits_issued_cents - benefits_entitled_verified_cents)" }

  - name: Disqualification
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the substantiated case that grounds the IPV disqualification" }
      - { name: subject_id, type: string, source: system, description: "FK -> Subject.id; copied from the case at creation" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ADH_REFERRED -> {IMPOSED, DECLINED}; IMPOSED -> RESCINDED" }
      - { name: penalty_months, type: integer, source: computed, description: "Disqualification length by prior_ipv_count at imposition: 0->12, 1->24, >=2->null (permanent); null until imposed and for permanent bans" }
      - { name: is_permanent, type: boolean, source: computed, description: "True when the imposed penalty is a permanent (third-strike) ban" }
      - { name: imposed_at, type: datetime, source: system, description: "Logical-clock timestamp when IMPOSED; null otherwise" }
      - { name: disqualified_until, type: datetime, source: computed, description: "imposed_at + penalty_months months; null for permanent or non-imposed" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: disqualification_id, type: string, source: input, description: "FK -> Disqualification.id; the disqualification the ADH adjudicates" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled ADH date/time (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> HELD -> {DECIDED_IPV, DECIDED_NO_IPV, DISMISSED}" }
      - { name: outcome, type: enum, source: system, description: "IPV | NO_IPV | DISMISSED; null until decided" }
      - { name: held_at, type: datetime, source: system, description: "Logical-clock timestamp when the hearing was held; null otherwise" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the deciding Adjudicator; must differ from the case's assigned_investigator_id" }

  - name: RecoveryPlan
    parent: null
    common_fields: true
    fields:
      - { name: overpayment_id, type: string, source: input, description: "FK -> Overpayment.id; the demanded claim being recovered" }
      - { name: subject_id, type: string, source: system, description: "FK -> Subject.id; resolved from overpayment -> case -> subject at creation" }
      - { name: method, type: enum, source: input, description: "RECOUPMENT (benefit allotment reduction) | OFFSET (tax/other offset) | COLLECTION (cash installments)" }
      - { name: start_date, type: string, source: input, description: "Plan effective start date (YYYY-MM-DD); recoupment period lower bound (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Plan effective end date (YYYY-MM-DD); recoupment period upper bound (exclusive); null for open-ended COLLECTION" }
      - { name: monthly_allotment_cents, type: integer, source: input, description: "Current monthly benefit allotment; required for RECOUPMENT; basis for the recoupment-rate formula" }
      - { name: scheduled_monthly_cents, type: integer, source: input, description: "Agreed monthly payment amount used for the scheduled payoff projection" }
      - { name: monthly_recoupment_cents, type: integer, source: computed, description: "For RECOUPMENT: min(outstanding_balance, max(floor, round(rate*monthly_allotment_cents))) where rate/floor depend on claim_type" }
      - { name: projected_months_regulatory, type: integer, source: computed, description: "ceil(outstanding_principal_cents / monthly_recoupment_cents) — regulatory-minimum payoff horizon" }
      - { name: projected_months_scheduled, type: integer, source: computed, description: "ceil(outstanding_principal_cents / scheduled_monthly_cents) — agreed-schedule payoff horizon" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> {COMPLETED, DEFAULTED, CANCELLED}" }

  - name: RecoveryTransaction
    parent: RecoveryPlan
    common_fields: true
    fields:
      - { name: recovery_plan_id, type: string, source: input, description: "FK -> RecoveryPlan.id; the plan this posting is applied under" }
      - { name: overpayment_id, type: string, source: system, description: "FK -> Overpayment.id; resolved from the plan at posting" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount recovered by this posting, in cents" }
      - { name: transaction_date, type: string, source: input, description: "Effective date of the posting (YYYY-MM-DD); must be on/after the plan start_date" }
      - { name: method, type: enum, source: input, description: "PAYMENT | OFFSET | RECOUPMENT" }
      - { name: applied_to_interest_cents, type: integer, source: computed, description: "Waterfall: min(amount_cents, outstanding_interest_cents at posting)" }
      - { name: applied_to_principal_cents, type: integer, source: computed, description: "amount_cents - applied_to_interest_cents" }
      - { name: status, type: enum, source: system, description: "POSTED -> VOIDED (compensating reversal)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [REJECTED, CONVERTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /fraud-recovery/referrals/{id}/decide (decision=ACCEPT)"
        actor: Intake
        preconditions: ["referral in RECEIVED"]
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /fraud-recovery/referrals/{id}/decide (decision=REJECT)"
        actor: Intake
        preconditions: ["referral in RECEIVED"]
        side_effects: []
      - from: ACCEPTED
        to: CONVERTED
        trigger: "POST /fraud-recovery/cases (referral_id=this)"
        actor: Investigator
        preconditions: ["referral in ACCEPTED"]
        side_effects: ["A Case is created referencing this referral (cross-entity); referral.status -> CONVERTED"]

  - entity: Case
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: INVESTIGATION
        trigger: "POST /fraud-recovery/cases/{id}/assign"
        actor: Investigator
        preconditions: ["case in OPEN"]
        side_effects: ["assigned_investigator_id set to investigator_user_id (or acting X-User-ID)"]
      - from: INVESTIGATION
        to: PENDING_REVIEW
        trigger: "POST /fraud-recovery/cases/{id}/submit-review"
        actor: Investigator
        preconditions: ["case in INVESTIGATION", "at least one Evidence exists for this case (else ERR_NO_EVIDENCE)"]
        side_effects: []
      - from: PENDING_REVIEW
        to: INVESTIGATION
        trigger: "POST /fraud-recovery/cases/{id}/adjudicate (decision=RETURN)"
        actor: Supervisor
        preconditions: ["case in PENDING_REVIEW"]
        side_effects: []
        note: "Revision loop — case cycles back to INVESTIGATION for more evidence."
      - from: PENDING_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /fraud-recovery/cases/{id}/adjudicate (decision=SUBSTANTIATE)"
        actor: Supervisor
        preconditions: ["case in PENDING_REVIEW"]
        side_effects: ["Case becomes eligible to establish an Overpayment"]
      - from: PENDING_REVIEW
        to: UNSUBSTANTIATED
        trigger: "POST /fraud-recovery/cases/{id}/adjudicate (decision=UNSUBSTANTIATE)"
        actor: Supervisor
        preconditions: ["case in PENDING_REVIEW"]
        side_effects:
          - "CASCADE: any linked Overpayment (case_id == this case) in DRAFT or CALCULATED -> status TERMINATED (updated_at + version bump). No RecoveryPlan can exist yet (plans require DEMANDED, which requires an established claim on a SUBSTANTIATED case), so nothing further cascades."

  - entity: Overpayment
    initial_state: DRAFT
    terminal_states: [SATISFIED, WRITTEN_OFF, TERMINATED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /fraud-recovery/overpayments/{id}/calculate"
        actor: Investigator
        preconditions: ["overpayment in DRAFT", "at least one OverpaymentMonth exists (else ERR_NO_OVERPAYMENT_MONTHS)"]
        side_effects: ["provisional_amount_cents computed (reported-income variant)", "final_amount_cents computed (verified-income variant)"]
      - from: CALCULATED
        to: ESTABLISHED
        trigger: "POST /fraud-recovery/overpayments/{id}/establish"
        actor: Supervisor
        preconditions:
          - "overpayment in CALCULATED"
          - "linked Case (case_id) status == SUBSTANTIATED (else ERR_CASE_NOT_SUBSTANTIATED)"
          - "final_amount_cents >= establishment threshold for claim_type: ESTABLISHMENT_THRESHOLD_IPV_CENTS=0 for IPV; ESTABLISHMENT_THRESHOLD_NONIPV_CENTS=12500 for IHE/AE (else ERR_BELOW_ESTABLISHMENT_THRESHOLD)"
        side_effects: ["final_amount_cents re-affirmed (verified variant + total_adjustments_cents)"]
      - from: ESTABLISHED
        to: DEMANDED
        trigger: "POST /fraud-recovery/overpayments/{id}/demand"
        actor: RecoveryOfficer
        preconditions: ["overpayment in ESTABLISHED"]
        side_effects: ["demand_date = clock now", "due_date = demand_date + PAYMENT_DUE_DAYS", "interest accrual anchor set"]
      - from: DEMANDED
        to: IN_RECOVERY
        trigger: "POST /fraud-recovery/recovery-plans (overpayment_id=this)"
        actor: RecoveryOfficer
        preconditions: ["overpayment in DEMANDED"]
        side_effects: ["A RecoveryPlan is created (cross-entity); overpayment.status -> IN_RECOVERY"]
      - from: IN_RECOVERY
        to: SATISFIED
        trigger: "system: bubble-up when outstanding_principal_cents and outstanding_interest_cents both reach 0"
        actor: system
        preconditions: ["outstanding_principal_cents == 0 and outstanding_interest_cents == 0"]
        side_effects: ["each ACTIVE RecoveryPlan of this overpayment -> COMPLETED (bubble-up)"]
      - from: IN_RECOVERY
        to: WRITTEN_OFF
        trigger: "POST /fraud-recovery/overpayments/{id}/write-off"
        actor: Supervisor
        preconditions: ["overpayment in IN_RECOVERY", "outstanding_principal_cents > 0"]
        side_effects: ["each non-terminal RecoveryPlan of this overpayment -> CANCELLED"]
      - from: DRAFT
        to: TERMINATED
        trigger: "system: cascade from Case UNSUBSTANTIATE"
        actor: system
        preconditions: ["overpayment in DRAFT"]
        side_effects: []
        note: "Reachable only while the case is still PENDING_REVIEW; establishment requires SUBSTANTIATED, which is terminal, so a post-establishment claim can never be terminated by unsubstantiation."
      - from: CALCULATED
        to: TERMINATED
        trigger: "system: cascade from Case UNSUBSTANTIATE"
        actor: system
        preconditions: ["overpayment in CALCULATED"]
        side_effects: []
        note: "Same reachability window as DRAFT->TERMINATED: only before the case is substantiated."

  - entity: Disqualification
    initial_state: PROPOSED
    terminal_states: [DECLINED, RESCINDED]
    transitions:
      - from: PROPOSED
        to: ADH_REFERRED
        trigger: "POST /fraud-recovery/disqualifications/{id}/refer-adh"
        actor: Investigator
        preconditions: ["disqualification in PROPOSED", "linked Case status == SUBSTANTIATED (else ERR_CASE_NOT_SUBSTANTIATED)"]
        side_effects: ["Disqualification becomes eligible for ADH scheduling"]
      - from: ADH_REFERRED
        to: IMPOSED
        trigger: "system: cascade from Hearing DECIDED_IPV"
        actor: system
        preconditions: ["disqualification in ADH_REFERRED"]
        side_effects:
          - "penalty_months computed from subject.prior_ipv_count (0->12, 1->24, >=2->permanent)"
          - "imposed_at = clock now; disqualified_until computed"
          - "CASCADE link 1: subject.prior_ipv_count += 1 (recompute subject.disqualification_status)"
          - "CASCADE link 2 (caused by link 1): linked Case's Overpayment (if any, non-terminal) claim_type -> IPV (updated_at + version bump)"
          - "CASCADE link 3 (caused by link 2): that Overpayment's ACTIVE RecoveryPlan recomputes monthly_recoupment_cents (IPV rate/floor) and projections"
      - from: ADH_REFERRED
        to: DECLINED
        trigger: "system: cascade from Hearing DECIDED_NO_IPV or DISMISSED"
        actor: system
        preconditions: ["disqualification in ADH_REFERRED"]
        side_effects: []
      - from: IMPOSED
        to: RESCINDED
        trigger: "POST /fraud-recovery/disqualifications/{id}/rescind"
        actor: Supervisor
        preconditions: ["disqualification in IMPOSED"]
        side_effects:
          - "COMPENSATION: subject.prior_ipv_count -= 1 (recompute subject.disqualification_status)"
          - "disqualified_until cleared"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [DECIDED_IPV, DECIDED_NO_IPV, DISMISSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /fraud-recovery/hearings/{id}/hold"
        actor: Adjudicator
        preconditions: ["hearing in SCHEDULED"]
        side_effects: ["held_at = clock now"]
      - from: HELD
        to: DECIDED_IPV
        trigger: "POST /fraud-recovery/hearings/{id}/decide (outcome=IPV)"
        actor: Adjudicator
        preconditions:
          - "hearing in HELD"
          - "acting Adjudicator X-User-ID != linked Case.assigned_investigator_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome=IPV, decided_by_user_id set"
          - "CASCADE (branch IPV): linked Disqualification ADH_REFERRED -> IMPOSED (triggers the 3-hop impose cascade)"
      - from: HELD
        to: DECIDED_NO_IPV
        trigger: "POST /fraud-recovery/hearings/{id}/decide (outcome=NO_IPV)"
        actor: Adjudicator
        preconditions:
          - "hearing in HELD"
          - "acting Adjudicator X-User-ID != linked Case.assigned_investigator_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome=NO_IPV, decided_by_user_id set"
          - "CASCADE (branch NO_IPV): linked Disqualification ADH_REFERRED -> DECLINED (no penalty, no subject/overpayment change)"
      - from: HELD
        to: DISMISSED
        trigger: "POST /fraud-recovery/hearings/{id}/decide (outcome=DISMISSED)"
        actor: Adjudicator
        preconditions:
          - "hearing in HELD"
          - "acting Adjudicator X-User-ID != linked Case.assigned_investigator_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome=DISMISSED, decided_by_user_id set"
          - "CASCADE (branch DISMISSED): linked Disqualification ADH_REFERRED -> DECLINED"

  - entity: RecoveryPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /fraud-recovery/recovery-plans/{id}/default"
        actor: RecoveryOfficer
        preconditions: ["plan in ACTIVE", "logical clock > overpayment.due_date and outstanding_principal_cents > 0"]
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: bubble-up when overpayment fully satisfied"
        actor: system
        preconditions: ["overpayment outstanding_principal_cents == 0 and outstanding_interest_cents == 0"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: cascade from Overpayment TERMINATED or WRITTEN_OFF"
        actor: system
        preconditions: ["plan not terminal"]
        side_effects: []

  - entity: RecoveryTransaction
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /fraud-recovery/recovery-transactions/{id}/void"
        actor: RecoveryOfficer
        preconditions: ["transaction in POSTED"]
        side_effects:
          - "COMPENSATION: applied_to_principal_cents and applied_to_interest_cents removed from the overpayment ledger sums (outstanding_principal_cents / outstanding_interest_cents restored)"
          - "If overpayment was SATISFIED and now has outstanding balance, it is NOT auto-reopened (write a note); voids are only permitted while the overpayment is IN_RECOVERY"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: overpayment-adjustment-stale-version
    parent_entity: Overpayment
    write_endpoint: "POST /fraud-recovery/overpayments/{id}/adjustments"
    occ_field: "expected_overpayment_version"
    description: |
      Posting an adjustment against an Overpayment whose version has advanced
      since the client last observed it is rejected. A fair-hearing adjustment
      recomputes final_amount_cents from the currently observed base; if another
      adjustment (which legitimately supersedes the prior computed base) has
      already been applied, the current writer's view is stale and the write is
      refused. Reduces to a stale-version check triggerable by two strictly
      sequential requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: referral_priority_score
    trigger: "on POST /fraud-recovery/referrals (creation)"
    algorithm: weighted_scoring
    formula: |
      priority_score = PROGRAM_WEIGHT[program] + SOURCE_WEIGHT[source]
    input_set: "single referral's program and source fields"
    constants:
      PROGRAM_WEIGHT: { SNAP: 30, TANF: 20, MEDICAID: 40 }
      SOURCE_WEIGHT: { HOTLINE: 10, DATA_MATCH: 25, CASEWORKER: 15, PUBLIC: 5 }
    precision: "integer"

  - name: overpayment_amount
    trigger: "on calculate (both variants) and re-affirmed on establish (final variant)"
    algorithm: aggregation
    formula: |
      per month:
        over_issuance_reported_cents = max(0, benefits_issued_cents - benefits_entitled_reported_cents)
        over_issuance_verified_cents = max(0, benefits_issued_cents - benefits_entitled_verified_cents)
      provisional_amount_cents = SUM(over_issuance_reported_cents) over all OverpaymentMonth of this claim
      final_amount_cents       = SUM(over_issuance_verified_cents) over all OverpaymentMonth + total_adjustments_cents
    input_set: "all OverpaymentMonth rows for the overpayment (no status filter — months are immutable)"
    constants:
      ESTABLISHMENT_THRESHOLD_IPV_CENTS: 0
      ESTABLISHMENT_THRESHOLD_NONIPV_CENTS: 12500
    precision: "integer cents; per-month max clamps negatives to 0 BEFORE summing"
    variants:
      - name: provisional
        when: "computed at CALCULATE using reported-income entitlement"
        difference: "uses benefits_entitled_reported_cents; excludes adjustments"
      - name: final
        when: "computed at ESTABLISH (and each adjustment) using verified-income entitlement"
        difference: "uses benefits_entitled_verified_cents; includes total_adjustments_cents"

  - name: interest_accrual
    trigger: "computed on read of an Overpayment (and reports) once DEMANDED while outstanding_principal_cents > 0"
    algorithm: aggregation
    formula: |
      N = number of FULL elapsed months from demand_date to the logical clock (floor of whole month anniversaries)
      per_month_interest_cents = round_half_up(final_amount_cents * INTEREST_MONTHLY_RATE)
      accrued_interest_cents = SUM over m in 1..N of per_month_interest_cents
      # Rounding ORDER is pinned: round per month THEN sum.
      # (final_amount_cents * INTEREST_MONTHLY_RATE * N) rounded once is NOT used and gives a different result.
    input_set: "the single overpayment; interest base is final_amount_cents (established principal), constant across months"
    constants:
      INTEREST_MONTHLY_RATE: 0.01
      PAYMENT_DUE_DAYS: 30
    precision: "round_half_up to whole cents per month, then sum"

  - name: recoupment_amount
    trigger: "on RecoveryPlan creation (RECOUPMENT) and recomputed on claim_type reclassification cascade"
    algorithm: tiered_pricing
    formula: |
      rate  = 0.20 if claim_type == IPV else 0.10          # IHE and AE both 0.10
      floor = FLOOR_IPV_CENTS if claim_type == IPV else FLOOR_NONIPV_CENTS
      pct_amount_cents = round_half_up(monthly_allotment_cents * rate)
      monthly_recoupment_cents = min(outstanding_principal_cents, max(floor, pct_amount_cents))
    input_set: "the plan's claim_type (via overpayment), monthly_allotment_cents, and current outstanding_principal_cents"
    constants:
      FLOOR_IPV_CENTS: 2000
      FLOOR_NONIPV_CENTS: 1000
    precision: "round_half_up to whole cents"

  - name: recovery_projection
    trigger: "computed on read of a RecoveryPlan"
    algorithm: forward_looking
    formula: |
      projected_months_regulatory = ceil(outstanding_principal_cents / monthly_recoupment_cents)   # regulatory-minimum pace
      projected_months_scheduled  = ceil(outstanding_principal_cents / scheduled_monthly_cents)     # agreed-schedule pace
    input_set: "the single plan and its overpayment's outstanding_principal_cents"
    constants: {}
    precision: "integer months (ceiling)"
    variants:
      - name: regulatory_minimum
        when: "payoff horizon assuming only the regulatory-minimum monthly recoupment is collected"
        difference: "divides by monthly_recoupment_cents"
      - name: agreed_schedule
        when: "payoff horizon assuming the agreed scheduled_monthly_cents is collected"
        difference: "divides by scheduled_monthly_cents (typically higher -> fewer months)"

  - name: payment_allocation
    trigger: "on POST /fraud-recovery/recovery-transactions (posting)"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall ORDER is pinned: interest first, then principal.
      applied_to_interest_cents  = min(amount_cents, outstanding_interest_cents_at_posting)
      applied_to_principal_cents = amount_cents - applied_to_interest_cents
    input_set: "the posting amount plus the overpayment's outstanding_interest_cents at posting time"
    constants: {}
    precision: "integer cents"

  - name: disqualification_penalty
    trigger: "on Disqualification imposition (Hearing DECIDED_IPV cascade)"
    algorithm: threshold
    formula: |
      n = subject.prior_ipv_count observed at imposition (BEFORE the +1 increment)
      if n == 0: penalty_months = 12; is_permanent = false
      elif n == 1: penalty_months = 24; is_permanent = false
      else: penalty_months = null; is_permanent = true      # third strike -> permanent
      disqualified_until = imposed_at + penalty_months months (null when permanent)
    input_set: "the subject's prior_ipv_count at the moment of imposition"
    constants:
      FIRST_OFFENSE_MONTHS: 12
      SECOND_OFFENSE_MONTHS: 24
    precision: "integer months"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed; all required fields present and correctly typed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: business_constraint
    check: "Enum fields carry a declared member; benefit_month/date fields well-formatted"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "endpoints with enum/date inputs"

  - priority: 6
    category: business_constraint
    check: "benefit_month matches YYYY-MM; date fields match YYYY-MM-DD; datetimes ISO 8601"
    error_id: ERR_INVALID_MONTH_FORMAT
    http_status: 422
    applies_to: "POST months, POST recovery-plans, POST recovery-transactions, POST hearings"

  - priority: 7
    category: business_constraint
    check: "Pagination limit within [1,100] and offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

  - priority: 8
    category: state
    check: "Target resource is in a valid state for this transition (non-terminal where required)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "Transition attempted from a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "Cross-entity state precondition: establish/refer-adh require linked Case SUBSTANTIATED; create hearing requires Disqualification ADH_REFERRED; create plan requires Overpayment DEMANDED; submit-review requires >=1 Evidence"
    error_id: "varies (ERR_CASE_NOT_SUBSTANTIATED, ERR_ADH_NOT_REFERRED, ERR_OVERPAYMENT_NOT_DEMANDED, ERR_NO_EVIDENCE)"
    http_status: 409
    applies_to: "establish, refer-adh, POST hearings, POST recovery-plans, submit-review"

  - priority: 11
    category: auth
    check: "Segregation of duties: deciding Adjudicator X-User-ID must differ from linked Case.assigned_investigator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fraud-recovery/hearings/{id}/decide"

  - priority: 12
    category: business_constraint
    check: "Domain constraints: no duplicate benefit_month per overpayment; no overlapping ACTIVE recoupment plan per subject; subject has no active IMPOSED disqualification (disqualification_status NONE) when proposing"
    error_id: "varies (ERR_DUPLICATE_MONTH, ERR_OVERLAPPING_RECOVERY_PLAN, ERR_SUBJECT_ALREADY_DISQUALIFIED)"
    http_status: 409
    applies_to: "POST months, POST recovery-plans, POST disqualifications"

  - priority: 13
    category: business_temporal
    check: "transaction_date must be on/after plan.start_date; clock may not be set backwards"
    error_id: "varies (ERR_TRANSACTION_BEFORE_PLAN_START, ERR_CLOCK_BACKWARDS)"
    http_status: 422
    applies_to: "POST recovery-transactions, POST /_clock/set_current_utc"

  - priority: 14
    category: business_fiscal
    check: "Fiscal thresholds/limits: establishment threshold by claim_type; posting amount must not exceed outstanding balance; calculate requires >=1 month"
    error_id: "varies (ERR_BELOW_ESTABLISHMENT_THRESHOLD, ERR_AMOUNT_EXCEEDS_BALANCE, ERR_NO_OVERPAYMENT_MONTHS)"
    http_status: 422
    applies_to: "establish, POST recovery-transactions, calculate"

  - priority: 15
    category: business_constraint
    check: "Optimistic concurrency: expected_overpayment_version must equal current Overpayment.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fraud-recovery/overpayments/{id}/adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Subject ----
  - method: POST
    path: "/fraud-recovery/subjects"
    description: "Create a Subject (household member)"
    roles: [Intake]
    code: 201
    input: [name, ssn_last4, primary_program]
    output: Subject
    side_effects: ["prior_ipv_count=0, disqualification_status=NONE"]

  - method: GET
    path: "/fraud-recovery/subjects/{id}"
    description: "Fetch a Subject (with derived disqualification_status)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Subject
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/fraud-recovery/referrals"
    description: "Create a fraud Referral; computes priority_score"
    roles: [Intake]
    code: 201
    input: [subject_id, program, source, allegation_summary]
    output: Referral
    side_effects: ["status=RECEIVED", "priority_score computed via referral_priority_score"]

  - method: GET
    path: "/fraud-recovery/referrals/{id}"
    description: "Fetch a Referral"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/fraud-recovery/referrals"
    description: "List/filter Referrals (reverse-reachability for Referral.subject_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["subject_id?", "status?", "program?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/referrals/{id}/decide"
    description: "Accept or reject a Referral"
    roles: [Intake]
    code: 200
    input: [decision, "reason?"]
    output: Referral
    side_effects: ["status -> ACCEPTED or REJECTED"]

  # ---- Case ----
  - method: POST
    path: "/fraud-recovery/cases"
    description: "Open a Case from an ACCEPTED Referral"
    roles: [Investigator]
    code: 201
    input: [referral_id]
    output: Case
    side_effects: ["status=OPEN", "subject_id/program copied from referral", "referral.status -> CONVERTED (cross-entity)"]

  - method: GET
    path: "/fraud-recovery/cases/{id}"
    description: "Fetch a Case"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/fraud-recovery/cases"
    description: "List/filter Cases (reverse-reachability for Case.referral_id and Case.subject_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["referral_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/cases/{id}/assign"
    description: "Assign an Investigator and move OPEN -> INVESTIGATION"
    roles: [Investigator]
    code: 200
    input: ["investigator_user_id?"]
    output: Case
    side_effects: ["assigned_investigator_id set", "status -> INVESTIGATION"]

  - method: POST
    path: "/fraud-recovery/cases/{id}/submit-review"
    description: "Submit case for supervisory review (INVESTIGATION -> PENDING_REVIEW)"
    roles: [Investigator]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> PENDING_REVIEW"]

  - method: POST
    path: "/fraud-recovery/cases/{id}/adjudicate"
    description: "Supervisor decision on a PENDING_REVIEW case: SUBSTANTIATE, UNSUBSTANTIATE, or RETURN"
    roles: [Supervisor]
    code: 200
    input: [decision]
    output: Case
    side_effects:
      - "RETURN -> INVESTIGATION (revision loop)"
      - "SUBSTANTIATE -> SUBSTANTIATED"
      - "UNSUBSTANTIATE -> UNSUBSTANTIATED (cascade: terminate linked Overpayment -> cancel its RecoveryPlans)"

  - method: POST
    path: "/fraud-recovery/cases/{id}/evidence"
    description: "Attach an immutable Evidence item to a Case"
    roles: [Investigator]
    code: 201
    input: [kind, description, "document_ref?"]
    output: Evidence
    side_effects: ["submitted_by_user_id set to acting X-User-ID"]

  - method: GET
    path: "/fraud-recovery/cases/{id}/evidence"
    description: "List Evidence for a Case (reverse-reachability for Evidence.case_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Evidence[]
    side_effects: []

  # ---- Overpayment ----
  - method: POST
    path: "/fraud-recovery/overpayments"
    description: "Create a DRAFT Overpayment claim against a Case"
    roles: [Investigator]
    code: 201
    input: [case_id, claim_type]
    output: Overpayment
    side_effects: ["status=DRAFT", "amount fields 0"]

  - method: GET
    path: "/fraud-recovery/overpayments/{id}"
    description: "Fetch an Overpayment (with derived interest and outstanding balances)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Overpayment
    side_effects: []

  - method: GET
    path: "/fraud-recovery/overpayments"
    description: "List/filter Overpayments (reverse-reachability for Overpayment.case_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["case_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: Overpayment[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/months"
    description: "Add an immutable OverpaymentMonth line item"
    roles: [Investigator]
    code: 201
    input: [benefit_month, benefits_issued_cents, benefits_entitled_reported_cents, benefits_entitled_verified_cents]
    output: OverpaymentMonth
    side_effects: ["over_issuance_reported_cents/over_issuance_verified_cents computed", "duplicate benefit_month rejected (ERR_DUPLICATE_MONTH)"]

  - method: GET
    path: "/fraud-recovery/overpayments/{id}/months"
    description: "List OverpaymentMonth line items (reverse-reachability for OverpaymentMonth.overpayment_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: OverpaymentMonth[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/calculate"
    description: "Compute provisional and final amounts (DRAFT -> CALCULATED)"
    roles: [Investigator]
    code: 200
    input: []
    output: Overpayment
    side_effects: ["provisional_amount_cents and final_amount_cents set", "requires >=1 month (ERR_NO_OVERPAYMENT_MONTHS)"]

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/establish"
    description: "Establish the claim (CALCULATED -> ESTABLISHED)"
    roles: [Supervisor]
    code: 200
    input: []
    output: Overpayment
    side_effects: ["requires Case SUBSTANTIATED and final_amount_cents >= claim-type threshold"]

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/demand"
    description: "Issue demand (ESTABLISHED -> DEMANDED); starts interest"
    roles: [RecoveryOfficer]
    code: 200
    input: []
    output: Overpayment
    side_effects: ["demand_date=clock now", "due_date=demand_date+PAYMENT_DUE_DAYS"]

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/adjustments"
    description: "Post a fair-hearing adjustment to final_amount_cents (OCC-guarded)"
    roles: [Supervisor]
    code: 200
    input: [adjustment_amount_cents, reason, expected_overpayment_version]
    output: Overpayment
    side_effects: ["total_adjustments_cents += adjustment_amount_cents", "final_amount_cents recomputed", "increments Overpayment.version by 1"]

  - method: POST
    path: "/fraud-recovery/overpayments/{id}/write-off"
    description: "Write off an uncollectible claim (IN_RECOVERY -> WRITTEN_OFF)"
    roles: [Supervisor]
    code: 200
    input: [reason]
    output: Overpayment
    side_effects: ["non-terminal RecoveryPlans -> CANCELLED"]

  # ---- Disqualification ----
  - method: POST
    path: "/fraud-recovery/disqualifications"
    description: "Propose an IPV disqualification for a Case's subject"
    roles: [Investigator]
    code: 201
    input: [case_id]
    output: Disqualification
    side_effects: ["status=PROPOSED", "subject_id copied from case", "rejected if subject already has an active IMPOSED disqualification, i.e. disqualification_status IN {DISQUALIFIED, PERMANENTLY_DISQUALIFIED} (ERR_SUBJECT_ALREADY_DISQUALIFIED)"]

  - method: GET
    path: "/fraud-recovery/disqualifications/{id}"
    description: "Fetch a Disqualification"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Disqualification
    side_effects: []

  - method: GET
    path: "/fraud-recovery/disqualifications"
    description: "List/filter Disqualifications (reverse-reachability for case_id and subject_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["case_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: Disqualification[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/disqualifications/{id}/refer-adh"
    description: "Refer the disqualification to an Administrative Disqualification Hearing (PROPOSED -> ADH_REFERRED)"
    roles: [Investigator]
    code: 200
    input: []
    output: Disqualification
    side_effects: ["requires Case SUBSTANTIATED (ERR_CASE_NOT_SUBSTANTIATED)"]

  - method: POST
    path: "/fraud-recovery/disqualifications/{id}/rescind"
    description: "Rescind an imposed disqualification (IMPOSED -> RESCINDED); compensating action"
    roles: [Supervisor]
    code: 200
    input: [reason]
    output: Disqualification
    side_effects: ["subject.prior_ipv_count -= 1 (recompute subject.disqualification_status)"]

  # ---- Hearing (ADH) ----
  - method: POST
    path: "/fraud-recovery/hearings"
    description: "Schedule an ADH for an ADH_REFERRED Disqualification"
    roles: [Adjudicator]
    code: 201
    input: [disqualification_id, scheduled_date]
    output: Hearing
    side_effects: ["status=SCHEDULED", "requires Disqualification ADH_REFERRED (ERR_ADH_NOT_REFERRED)"]

  - method: GET
    path: "/fraud-recovery/hearings/{id}"
    description: "Fetch a Hearing"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/fraud-recovery/hearings"
    description: "List/filter Hearings (reverse-reachability for Hearing.disqualification_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["disqualification_id?", "status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/hearings/{id}/hold"
    description: "Mark the hearing held (SCHEDULED -> HELD)"
    roles: [Adjudicator]
    code: 200
    input: []
    output: Hearing
    side_effects: ["held_at=clock now"]

  - method: POST
    path: "/fraud-recovery/hearings/{id}/decide"
    description: "Decide the hearing (HELD -> DECIDED_IPV | DECIDED_NO_IPV | DISMISSED)"
    roles: [Adjudicator]
    code: 200
    input: [outcome]
    output: Hearing
    side_effects:
      - "segregation of duties enforced (ERR_SEGREGATION_OF_DUTIES)"
      - "IPV: linked Disqualification -> IMPOSED (3-hop impose cascade)"
      - "NO_IPV/DISMISSED: linked Disqualification -> DECLINED"

  # ---- Recovery ----
  - method: POST
    path: "/fraud-recovery/recovery-plans"
    description: "Create a RecoveryPlan for a DEMANDED Overpayment (moves it to IN_RECOVERY)"
    roles: [RecoveryOfficer]
    code: 201
    input: [overpayment_id, method, start_date, "end_date?", "monthly_allotment_cents?", "scheduled_monthly_cents?"]
    output: RecoveryPlan
    side_effects:
      - "status=ACTIVE, subject_id resolved from overpayment->case->subject"
      - "monthly_recoupment_cents and projections computed"
      - "overpayment.status -> IN_RECOVERY"
      - "requires Overpayment DEMANDED (ERR_OVERPAYMENT_NOT_DEMANDED); rejects overlapping ACTIVE recoupment plan for the subject (ERR_OVERLAPPING_RECOVERY_PLAN)"

  - method: GET
    path: "/fraud-recovery/recovery-plans/{id}"
    description: "Fetch a RecoveryPlan (with recovery_projection variants)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: RecoveryPlan
    side_effects: []

  - method: GET
    path: "/fraud-recovery/recovery-plans"
    description: "List/filter RecoveryPlans (reverse-reachability for RecoveryPlan.overpayment_id and RecoveryPlan.subject_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: ["overpayment_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: RecoveryPlan[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/recovery-plans/{id}/default"
    description: "Mark a plan DEFAULTED (ACTIVE -> DEFAULTED)"
    roles: [RecoveryOfficer]
    code: 200
    input: []
    output: RecoveryPlan
    side_effects: ["requires clock past overpayment.due_date and outstanding_principal_cents > 0"]

  - method: POST
    path: "/fraud-recovery/recovery-transactions"
    description: "Post a recovery transaction (payment/offset/recoupment) with interest-first waterfall"
    roles: [RecoveryOfficer]
    code: 201
    input: [recovery_plan_id, amount_cents, transaction_date, method]
    output: RecoveryTransaction
    side_effects:
      - "applied_to_interest_cents/applied_to_principal_cents computed via payment_allocation"
      - "overpayment outstanding balances reduced; if fully satisfied, overpayment -> SATISFIED and plans -> COMPLETED (bubble-up)"
      - "rejects transaction_date < plan.start_date (ERR_TRANSACTION_BEFORE_PLAN_START) and amount_cents > outstanding balance (ERR_AMOUNT_EXCEEDS_BALANCE)"

  - method: GET
    path: "/fraud-recovery/recovery-plans/{id}/transactions"
    description: "List transactions for a plan (reverse-reachability for RecoveryTransaction.recovery_plan_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: RecoveryTransaction[]
    side_effects: []

  - method: GET
    path: "/fraud-recovery/overpayments/{id}/transactions"
    description: "List all recovery transactions across the overpayment's plans (reverse-reachability for RecoveryTransaction.overpayment_id)"
    roles: [Intake, Investigator, Adjudicator, RecoveryOfficer, Supervisor]
    code: 200
    input: []
    output: RecoveryTransaction[]
    side_effects: []

  - method: POST
    path: "/fraud-recovery/recovery-transactions/{id}/void"
    description: "Void a posted transaction (POSTED -> VOIDED); restores the overpayment ledger"
    roles: [RecoveryOfficer]
    code: 200
    input: ["reason?"]
    output: RecoveryTransaction
    side_effects: ["applied amounts removed from ledger sums; outstanding balances restored"]

  # ---- Reporting ----
  - method: GET
    path: "/fraud-recovery/reports/recovery-summary"
    description: "Aggregate recovery report across overpayments"
    roles: [Supervisor]
    code: 200
    input: ["program?", "claim_type?"]
    output: "{ total_final_amount_cents: integer, total_accrued_interest_cents: integer, total_recovered_principal_cents: integer, total_outstanding_cents: integer, overpayment_count: integer }"
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time. Rejects times earlier than the current logical clock."
    roles: [Supervisor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced (ERR_CLOCK_BACKWARDS if earlier than current)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role/X-User-ID missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body or missing/mistyped required field" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside the declared set" }
  - { id: ERR_INVALID_MONTH_FORMAT, http: 422, condition: "benefit_month not YYYY-MM, date not YYYY-MM-DD, or datetime not ISO 8601" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid (non-terminal) state for this transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_NO_EVIDENCE, http: 409, condition: "submit-review attempted with zero Evidence on the case" }
  - { id: ERR_CASE_NOT_SUBSTANTIATED, http: 409, condition: "establish/refer-adh requires the linked Case to be SUBSTANTIATED" }
  - { id: ERR_ADH_NOT_REFERRED, http: 409, condition: "Scheduling a hearing requires the Disqualification to be ADH_REFERRED" }
  - { id: ERR_OVERPAYMENT_NOT_DEMANDED, http: 409, condition: "Creating a RecoveryPlan requires the Overpayment to be DEMANDED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Deciding Adjudicator X-User-ID equals the case's assigned_investigator_id" }
  - { id: ERR_SUBJECT_ALREADY_DISQUALIFIED, http: 409, condition: "Proposing a disqualification for a subject that already has an active IMPOSED disqualification (DISQUALIFIED or PERMANENTLY_DISQUALIFIED)" }
  - { id: ERR_DUPLICATE_MONTH, http: 409, condition: "An OverpaymentMonth with the same benefit_month already exists on the claim" }
  - { id: ERR_OVERLAPPING_RECOVERY_PLAN, http: 409, condition: "An ACTIVE recoupment plan for the same subject overlaps this plan's [start_date, end_date) range" }
  - { id: ERR_NO_OVERPAYMENT_MONTHS, http: 422, condition: "calculate attempted with zero OverpaymentMonth rows" }
  - { id: ERR_BELOW_ESTABLISHMENT_THRESHOLD, http: 422, condition: "final_amount_cents below the claim-type establishment threshold (IPV=0, IHE/AE=12500)" }
  - { id: ERR_AMOUNT_EXCEEDS_BALANCE, http: 422, condition: "Posting amount_cents exceeds the overpayment's outstanding (interest+principal) balance" }
  - { id: ERR_TRANSACTION_BEFORE_PLAN_START, http: 422, condition: "transaction_date is earlier than the plan's start_date" }
  - { id: ERR_CLOCK_BACKWARDS, http: 422, condition: "Attempt to set the logical clock earlier than its current value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_overpayment_version does not match current Overpayment.version" }
  - { id: ERR_ALREADY_VOIDED, http: 409, condition: "Voiding a transaction that is already VOIDED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Intake
    description: "Intake specialist: registers subjects, records and triages referrals"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-recovery/subjects"
      - "POST /fraud-recovery/referrals"
      - "POST /fraud-recovery/referrals/{id}/decide"
    shared_operations:
      - "GET (all read/list endpoints)"

  - name: Investigator
    description: "Fraud investigator: opens cases, collects evidence, builds overpayment claims, proposes disqualifications"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-recovery/cases"
      - "POST /fraud-recovery/cases/{id}/assign"
      - "POST /fraud-recovery/cases/{id}/submit-review"
      - "POST /fraud-recovery/cases/{id}/evidence"
      - "POST /fraud-recovery/overpayments"
      - "POST /fraud-recovery/overpayments/{id}/months"
      - "POST /fraud-recovery/overpayments/{id}/calculate"
      - "POST /fraud-recovery/disqualifications"
      - "POST /fraud-recovery/disqualifications/{id}/refer-adh"
    shared_operations:
      - "GET (all read/list endpoints)"

  - name: Adjudicator
    description: "Hearing officer: schedules, holds, and decides ADH hearings; cannot be the case's assigned investigator when deciding"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-recovery/hearings"
      - "POST /fraud-recovery/hearings/{id}/hold"
      - "POST /fraud-recovery/hearings/{id}/decide"
    shared_operations:
      - "GET (all read/list endpoints)"

  - name: RecoveryOfficer
    description: "Recovery officer: issues demands, sets up recovery plans, posts and voids transactions"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-recovery/overpayments/{id}/demand"
      - "POST /fraud-recovery/recovery-plans"
      - "POST /fraud-recovery/recovery-plans/{id}/default"
      - "POST /fraud-recovery/recovery-transactions"
      - "POST /fraud-recovery/recovery-transactions/{id}/void"
    shared_operations:
      - "GET (all read/list endpoints)"

  - name: Supervisor
    description: "Unit supervisor: adjudicates cases, establishes/adjusts/writes-off claims, rescinds disqualifications, runs reports, controls the logical clock (hierarchical override)"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-recovery/cases/{id}/adjudicate"
      - "POST /fraud-recovery/overpayments/{id}/establish"
      - "POST /fraud-recovery/overpayments/{id}/adjustments"
      - "POST /fraud-recovery/overpayments/{id}/write-off"
      - "POST /fraud-recovery/disqualifications/{id}/rescind"
      - "GET /fraud-recovery/reports/recovery-summary"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read/list endpoints)"
