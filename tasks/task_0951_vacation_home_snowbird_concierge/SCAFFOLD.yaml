  - id: ERR_ISSUANCE_NOT_OVERDUE
    http: 409
    condition: "mark-overdue is called before return_deadline_at plus KEY_OVERDUE_GRACE_HOURS (6) hours"
  - id: ERR_LOST_THRESHOLD_NOT_MET
    http: 409
    condition: "declare-lost is called while overdue_days is below KEY_LOST_THRESHOLD_DAYS (7)"
  - id: ERR_STEP_ALREADY_RECORDED
    http: 409
    condition: "a winterization step already recorded as done is submitted again"
  - id: ERR_TURNOVER_STAGE_INVALID
    http: 409
    condition: "an advance targets a stage that is not the declared successor of the current stage"
  - id: ERR_NO_TURNOVER_OVERLAP
    http: 409
    condition: "convert-to-turnover is called for a visit whose window does not overlap the turnover's padded window"
  - id: ERR_PACKAGES_OUTSTANDING
    http: 409
    condition: "a mail hold is released while package_count is greater than 0"
  - id: ERR_MAIL_HOLD_NOT_STARTED
    http: 409
