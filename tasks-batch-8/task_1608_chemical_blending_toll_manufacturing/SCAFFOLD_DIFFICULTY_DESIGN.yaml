          assert:
            - "At current_utc == effective_to (2026-09-01T00:00:00Z), /release returns error_id == ERR_AGREEMENT_NOT_ACTIVE (half-open boundary excludes the endpoint)"

      - name: residue_ppm_at_50_threshold_boundary
        grounds:
          - state_machines.Tank
          - entities.CleaningRecord.fields.residue_ppm
        distinguishing_aspect: |
          Boundary metric: CleaningRecord.residue_ppm compared against
          RESIDUE_LIMIT_PPM=50 with `<=` semantics (50 passes, 51 fails).
          Distinct metric from instance 1 (numeric PPM vs temporal) and
          distinct endpoint (cleaning-record validate vs batch release).
