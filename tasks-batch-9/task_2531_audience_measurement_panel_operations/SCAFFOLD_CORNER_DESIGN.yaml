        claim_type: cross_entity
        grounds:
          - state_machines.ProcessingRun.transitions.OPEN_to_SUPERSEDED
          - validations[priority 37]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / run_window_identical_supersedes_partial_overlap_rejected
          rationale: "The named §1.8 instance asserts both halves of priority 37 - the identical-window supersede with superseded_by_run_id set and the partial-overlap rejection."

      - name: methodology_change_notified_returns_to_draft_and_cancels_notifications
        claim_type: cyclic
        grounds:
          - state_machines.MethodologyChange.transitions.NOTIFIED_to_DRAFT
          - state_machines.ClientNotification.transitions.SENT_to_CANCELLED
        excluded_because:
          difficulty_instance: non_linear_state_machine / methodology_change_revision_cycle_returns_to_draft
          rationale: "The revision cycle, the cleared impact fields, the incremented revision_count and the SENT -> CANCELLED notification cascade are all asserted by the named §1.8 instance."

      - name: fault_report_cascades_through_meter_household_cell_and_market
        claim_type: cascade_down
        grounds:
          - endpoints[POST /meters/{meter_id}/fault-reports]
        excluded_because:
          difficulty_instance: transitive_cascade / fault_report_cascade_meter_household_cell_boost_posture
          rationale: "All five cascade links of a fault report (meter, household, cell intab_count, boost re-arm and market posture) are walked end-to-end by the named §1.8 instance."

  # ===========================================================================
  # SECTION 3 - Calculations (§1.2)
  #
  # Every literal below is derived from the formula in §1.2, not from intuition.
  # The chains A / B / C defined above SECTION 2 are reused verbatim.
  # ===========================================================================
  - section: calculations
    instances:

      - name: enumeration_due_window_at_exactly_fourteen_days_versus_fifteen
        claim_type: threshold
        grounds:
          - calculations.enumeration_verdict
          - calculations.enumeration_verdict.constants.ENUMERATION_DUE_DAYS
        distinguishing_aspect: "age_days is a FLOOR of whole days and the comparison is <=, so 14 days exactly is still on time and 15 is not; and the due-date term is dropped entirely from seq >= 2, which is the only reason a late household can ever recover."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-650, RANK 150, T 4, B 1000, BUDGET 500000."
            - "Two households h1 (persons_count 3) and h2 (persons_count 3) are both recruited at the startup clock 2026-08-01T00:00:00Z and both have a TV_TUNER install-confirmed at that same instant, so both sit in ENUM_PENDING with recruited_at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Fourteen", market_code: "DMA-650", dma_rank: 150, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m50_id: "$.data.id" }
            - call: "POST /markets/${m50_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c50_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m50_id}", quota_cell_id: "${c50_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h50a_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m50_id}", quota_cell_id: "${c50_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h50b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h50a_id}", meter_type: "TV_TUNER", serial_no: "MT-002050" }
              as: FieldTechnician
              captures: { mt50a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h50b_id}", meter_type: "TV_TUNER", serial_no: "MT-002051" }
              as: FieldTechnician
              captures: { mt50b_id: "$.data.id" }
            - call: "POST /meters/${mt50a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt50b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: FieldTechnician
            - call: "POST /households/${h50a_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: FieldTechnician
            - call: "POST /households/${h50b_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households/${h50b_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c50_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 2: age_days == floor((2026-08-15 - 2026-08-01) / 86400) == 14 == ENUMERATION_DUE_DAYS, so due_ok holds and data.enumeration_verdict == COMPLIANT with data.status == ACTIVE and data.enumeration_count == 1"
            - "Trigger call 4: age_days == 15 > 14, so due_ok fails even though roster_persons_count == persons_count and tv_sets_count >= 1; data.enumeration_verdict == NONCOMPLIANT, data.status == NONCOMPLIANT_HOLD, data.enumeration_count == 1, data.last_enumeration_at == 2026-08-16T00:00:00Z"
            - "Trigger call 5: the byte-identical payload now succeeds because seq == 2 sets due_ok = true unconditionally: data.enumeration_verdict == COMPLIANT, data.status == ACTIVE, data.enumeration_count == 2"
            - "Trigger call 6: data.intab_count == 2 and data.fill_rate == 0.5000 (2/4), data.quota_status == UNDER_TARGET with data.incentive_boost_active still true"

      - name: enumeration_verdict_reads_only_the_roster_and_the_tv_set_count
        claim_type: correct_result
        grounds:
          - calculations.enumeration_verdict
          - validations[priority 7]
        distinguishing_aspect: "roster_ok is EQUALITY, not >=, so an over-count fails exactly like an under-count; and tv_sets_count == 0 is a legal input (range 0..8) that nonetheless fails sets_ok, which is the only way to separate the two predicates."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-651, RANK 151, T 4, B 1000, BUDGET 500000, then one household h1 with persons_count 3 whose TV_TUNER MT-002052 is install-confirmed, so h1 is ENUM_PENDING at the startup clock 2026-08-01T00:00:00Z and every enumeration below is inside the 14-day window."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Roster", market_code: "DMA-651", dma_rank: 151, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m51_id: "$.data.id" }
            - call: "POST /markets/${m51_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c51_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m51_id}", quota_cell_id: "${c51_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h51_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h51_id}", meter_type: "TV_TUNER", serial_no: "MT-002052" }
              as: FieldTechnician
              captures: { mt51_id: "$.data.id" }
            - call: "POST /meters/${mt51_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h51_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households/${h51_id}/enumerations"
              payload: { roster_persons_count: 4, tv_sets_count: 2 }
              as: FieldTechnician
            - call: "POST /households/${h51_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 0 }
              as: FieldTechnician
            - call: "POST /households/${h51_id}/enumerations"
              payload: { roster_persons_count: 13, tv_sets_count: 1 }
              as: FieldTechnician
              captures: { e51: "$.data.error_id" }
            - call: "POST /households/${h51_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c51_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: roster 2 != persons_count 3 -> data.enumeration_verdict == NONCOMPLIANT, data.status == NONCOMPLIANT_HOLD, data.roster_persons_count == 2, data.enumeration_count == 1, and the cell's intab_count never moved off 0"
            - "Trigger call 2: roster 4 != 3 fails the SAME equality test in the other direction -> NONCOMPLIANT again, data.enumeration_count == 2, data.tv_sets_count == 2 stored anyway"
            - "Trigger call 3: roster matches but tv_sets_count == 0 fails sets_ok (>= 1) -> NONCOMPLIANT, data.enumeration_count == 3, data.tv_sets_count == 0 stored"
            - "Trigger call 4: HTTP 422 with ${e51} == ERR_INVALID_REQUEST - roster_persons_count is constrained to 1..12 by priority 7, so 13 never reaches the verdict calculation and data.enumeration_count stays 3"
            - "Trigger call 5: all three predicates hold -> data.enumeration_verdict == COMPLIANT, data.status == ACTIVE, data.enumeration_count == 4"
            - "Trigger call 6: data.intab_count == 1, data.fill_rate == 0.2500, data.quota_status == UNDER_TARGET - only the single COMPLIANT verdict ever moved the in-tab count"

      - name: quota_cell_fill_at_exactly_four_fifths_is_on_target_and_disarms_the_boost
        claim_type: aggregation
        grounds:
          - calculations.quota_cell_fill
          - calculations.quota_cell_fill.constants.ON_TARGET_THRESHOLD
          - calculations.market_recruitment_posture
        distinguishing_aspect: "The ON_TARGET boundary is >= 0.8000 exactly, and crossing it is what releases the reserved boost budget; the resulting market has zero UNDER_TARGET cells and zero FILLED cells, so clause 3 puts it in RESTRICTED - a posture that still accepts recruitment even though the market looks 'done'."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-652, RANK 152, T 5, B 1000, BUDGET 500000, so the empty cell reserves round_half_up(1000 * 0.25 * 5, 0) == 1250 boost cents and the market is OPEN."
            - "Four households h1..h4, each persons_count 2, each with a TV_TUNER (MT-002053, MT-002054, MT-002055, MT-002056) install-confirmed, all created before any enumeration so none of them is blocked by a FILLED cell."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Four Fifths", market_code: "DMA-652", dma_rank: 152, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
