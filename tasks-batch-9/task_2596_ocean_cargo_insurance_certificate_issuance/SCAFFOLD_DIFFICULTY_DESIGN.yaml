      - name: claim_settlement_depends_on_general_average_event_status
        entity_pair: "ClaimFile -> GeneralAverageEvent"
        grounds:
          - state_machines.ClaimFile.status.ADJUSTED_to_SETTLED
          - state_machines.GeneralAverageEvent.status.SECURITY_COMPLETE_to_ADJUSTED
          - validations.priority_13_ERR_GA_ADJUSTMENT_PENDING
          - entities.ClaimFile.fields.ga_event_id
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency: a
          GENERAL_AVERAGE ClaimFile may not leave ADJUSTED for SETTLED until the
          GeneralAverageEvent it is linked to has itself reached ADJUSTED, since
          the general-average contribution is not final until security is
          collected and the average is stated. While the event is
          SECURITY_COLLECTING the settle attempt returns
          ERR_GA_ADJUSTMENT_PENDING (409); after both security calls are posted
          and the adjustment is finalised the same settle call succeeds and pays
          141875.00. Certificate/OpenPolicy is not involved, so this is not a
          second copy of certificate_issue_depends_on_open_policy_status.
