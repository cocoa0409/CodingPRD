- section: errors
  instances:
  - name: response_envelope_success_and_error_shape
    claim_type: violation_to_error
    grounds:
    - response_envelope
    distinguishing_aspect: 'Envelope conformance: a success body carries meta.api_request_id + response_type object + data; an error body carries response_type error and data.error_id + data.message.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
      - call: GET /plasma-centers/00000000-0000-0000-0000-000000000000
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - 'success: response_type == ''object'', data is the PlasmaCenter, meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601'
      - 'error: response_type == ''error'', ${err} == ERR_NOT_FOUND and data.message is a non-empty string'
  - name: error_donor_not_eligible_on_deferred_checkin
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DONOR_NOT_ELIGIBLE]
    excluded_because:
      difficulty_instance: schedule_donation_safety_beats_referential
      rationale: ERR_DONOR_NOT_ELIGIBLE is the asserted winning error of that §1.8 priority-conflict instance (priority 8 fires on POST /donation-visits for a DEFERRED_TEMP donor).
  - name: error_visit_not_scheduled_on_double_checkin
    claim_type: violation_to_error
    grounds:
    - errors[ERR_VISIT_NOT_SCHEDULED]
    excluded_because:
      difficulty_instance: checkin_state_beats_fiscal_when_schedule_retired
      rationale: ERR_VISIT_NOT_SCHEDULED is the asserted winning error of that §1.8 priority-conflict instance (second check-in on an IN_PROGRESS visit).
  - name: error_no_bed_available_at_capacity
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NO_BED_AVAILABLE]
    excluded_because:
      difficulty_instance: donor_floor_bed_aggregate_capacity_and_reuse
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: error_no_observation_chair_at_capacity
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NO_OBSERVATION_CHAIR]
    excluded_because:
      difficulty_instance: observation_chair_aggregate_capacity_and_reuse
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: error_observation_too_early
    claim_type: violation_to_error
    grounds:
    - errors[ERR_OBSERVATION_TOO_EARLY]
    excluded_because:
      difficulty_instance: observation_dwell_exactly_fifteen_minutes
      rationale: Asserted at the 14:59 boundary in the named §1.8 instance.
  - name: error_invalid_actual_volume_bounds
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INVALID_ACTUAL_VOLUME]
    excluded_because:
      difficulty_instance: actual_volume_zero_and_overrun_bounds
      rationale: Asserted for both 0 and programmed+1 in the named §1.8 instance.
  - name: error_lookback_open_blocks_release
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LOOKBACK_OPEN]
    excluded_because:
      difficulty_instance: unit_release_gated_by_open_lookback_case
      rationale: Asserted as the blocking error of the named §1.8 instance.
  - name: error_donor_not_qualified_blocks_unit_release
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DONOR_NOT_QUALIFIED]
    excluded_because:
      difficulty_instance: unit_release_gated_by_donor_qualification
      rationale: Asserted as the blocking error of the named §1.8 instance.
  - name: error_stale_version_occ_family
    claim_type: violation_to_error
    grounds:
    - errors[ERR_STALE_VERSION]
    excluded_because:
      difficulty_instance: center_inspection_hold_cycle_with_visit_cascades
      rationale: OCC 412 mechanics (stale expected_*_version) are exercised by the three concurrency-rule instances in the cross_cutting_complexity_layers section below; this stub marks the catalog entry covered.
