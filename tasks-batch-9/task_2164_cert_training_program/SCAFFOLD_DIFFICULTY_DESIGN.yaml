            - { call: "POST /module-completions", payload: { trainee_id: "${t1_id}", class_session_id: "${ses_a_id}", attendance_minutes: 150 }, as: Instructor, as_user_id: "${ins_1_id}", captures: { mc_a_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /class-sessions/${ses_b_id}/deliver", payload: {}, as: Instructor, as_user_id: "${ins_1_id}" }
