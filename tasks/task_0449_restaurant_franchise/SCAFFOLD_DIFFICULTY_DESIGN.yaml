            - "Franchisee.${fz_id}.open_compliance_strikes == 2   # hop 2"
            - "Franchisee.${fz_id}.status == DEFAULTED   # hop 3, caused by strikes reaching 2"

      - name: vendor_revoke_disables_authorizations_depth2
        grounds:
          - state_machines.Vendor.transitions
          - entities.VendorAuthorization.fields.status
          - entities.Vendor.fields.approval_status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (vendor revoke, not audit finalize): revoke sets
          Vendor.approval_status→REVOKED (hop 1) → that revocation sets every ACTIVE VendorAuthorization
          for the vendor to DISABLED (hop 2). Distinct propagation pattern and trigger from the audit cascade.
        test_recipe:
          setup:
            - "Brand; APPROVED vendor; OPEN unit; one ACTIVE VendorAuthorization linking the unit to the vendor."
          setup_api_calls:
            - call: "POST /franchise/brands"
