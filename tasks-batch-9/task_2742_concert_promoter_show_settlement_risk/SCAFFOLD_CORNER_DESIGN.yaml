            - call: "POST /artists"
              payload: { name: "Band Act Four", agency: "Bnd Talent", tier: "CLUB", historical_sellthrough_pct: 63.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rt_a4_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Band Act Five", agency: "Bnd Talent", tier: "CLUB", historical_sellthrough_pct: 64.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rt_a5_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${rt_a1_id}", venue_id: "${rt_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
