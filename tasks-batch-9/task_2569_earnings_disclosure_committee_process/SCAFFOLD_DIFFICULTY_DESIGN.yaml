            - "${error_id} != ERR_SOD_SELF_REVIEW"
            - "TieOutItem.${to1_id}.review_decision == null and TieOutItem.${to1_id}.reviewer_member_id == null"
            - "After POST /disclosure/committee-members/${fin_id}/transitions with action=REINSTATE, the identical review request returns HTTP 409 with error_id ERR_SOD_SELF_REVIEW"

      - name: overlapping_and_past_deadline_milestone_reports_overlap_not_deadline
        grounds:
          - calculations.milestone_window_conflict
          - validations[priority=31]
          - validations[priority=39]
          - errors.ERR_MILESTONE_WINDOW_OVERLAP
          - errors.ERR_MILESTONE_PAST_DEADLINE
        distinguishing_aspect: |
          The candidate CLOSE window 2026-08-02T00:00:00Z -> 2026-08-11T00:00:00Z breaks RULE A (it
          overlaps the existing CLOSE window under half-open geometry) AND RULE C (its end is past the
          statutory deadline 2026-08-10T17:30:00Z), and the rules are 8 priority levels apart with
          different HTTP statuses, so the winner is observable in the status code alone: 409
          ERR_MILESTONE_WINDOW_OVERLAP, never 422 ERR_MILESTONE_PAST_DEADLINE. The control candidate
          2026-08-04T00:00:00Z -> 2026-08-11T00:00:00Z clears RULE A and must then return 422, proving
          the deadline rule is live rather than dead code.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with one ACTIVE voting FINANCE member."
            - "A ReportingCycle in PLANNING with statutory_deadline_utc 2026-08-10T17:30:00Z and a single CLOSE Milestone spanning 2026-08-01T00:00:00Z to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Calendar Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, deadline: $.data.statutory_deadline_utc }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
          trigger:
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-02T00:00:00Z", planned_end_utc: "2026-08-11T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "${deadline} == \"2026-08-10T17:30:00Z\""
            - "the trigger returns HTTP 409 with ${error_id} == ERR_MILESTONE_WINDOW_OVERLAP"
            - "${error_id} != ERR_MILESTONE_PAST_DEADLINE"
            - "GET /disclosure/reporting-cycles/${cycle_id}/milestones still returns exactly 1 row"
            - "A control request with kind CLOSE, planned_start_utc 2026-08-04T00:00:00Z and planned_end_utc 2026-08-11T00:00:00Z returns HTTP 422 with error_id ERR_MILESTONE_PAST_DEADLINE"
            - "A control request with kind CLOSE, planned_start_utc 2026-08-03T00:00:00Z and planned_end_utc 2026-08-04T00:00:00Z is accepted with 201, because touching endpoints do not overlap under half-open geometry"

  - rule_id: boundary_precision_check
    instances:
      - name: tie_out_variance_exactly_on_effective_tolerance_matches_and_one_bp_more_fails
        grounds:
          - calculations.tie_out_variance_and_tolerance_escalation
          - entities.TieOutItem.fields.raw_variance_bp
          - entities.TieOutItem.fields.effective_tolerance_bp
          - entities.DraftDocument.fields.tie_out_status
          - validations[priority=27]
        distinguishing_aspect: |
          The MATCHED test is `raw_variance_bp <= effective_tolerance_bp` with raw_variance_bp rounded
          half-up to whole basis points. Reported 1002.50 against 1000.00 is exactly 25 bp against an
          effective tolerance of 25, which MATCHES and leaves the document PASSED; reported 1002.60 is
          26 bp, which is VARIANCE and leaves the document FAILED. One basis point separates a document
          that can be approved from one that returns ERR_TIE_OUT_NOT_PASSED, and a strict `<` comparison
          or a floor/ceil rounding choice flips the first case.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with one ACTIVE voting non-officer FINANCE member."
            - "A ReportingCycle in CLOSE_OPEN carrying two DRAFT documents with no tie-out items yet: a PERIODIC_FILING and an EARNINGS_RELEASE, so each document's item set stays independent."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Boundary Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
