              payload: { to_status: "IN_REVIEW" }
              as: Attorney
              as_user_id: "${att}"
          trigger:
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "CANCELLED" }
              as: PlatformAdmin
