        grounds:
          - "validations priority 45 (state) - the referenced ModelRun's calibration_status IN {NOT_REQUIRED, CALIBRATED}, else ERR_CALIBRATION_STALE (409), applies_to POST /mmm/reconciliation-reports"
          - "validations priority 45 (state) - the run's calibration_status == PENDING_CALIBRATION, else ERR_CALIBRATION_NOT_PENDING (409) on POST /mmm/model-runs/{id}/recalibrate"
          - "entities.ReconciliationReport.basis - CALIBRATED when the run's calibration_status == CALIBRATED, RAW otherwise"
          - "calculations.calibration_application precision - multiplier 0.5296 on A_SEARCH gives calibrated units 1934.8053, calibrated revenue 9724331 and a baseline that RISES to 19050.9090"
        distinguishing_aspect: |
          Filing a report is allowed only while the run's calibration is live: with calibration_status
          STALE the create is 409 ERR_CALIBRATION_STALE and recalibrate is 409
          ERR_CALIBRATION_NOT_PENDING, and the escape is to file a fresh record (STALE ->
