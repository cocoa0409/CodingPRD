      - name: income_limit_exact_boundary
        claim_type: correct_result
        grounds: [calculations.income_eligibility, "errors[ERR_ELIGIBILITY_INCOME_EXCEEDED]"]
        distinguishing_aspect: "income boundary is inclusive: annual_income_cents == 2400000 is accepted (201) while 2400001 is rejected ERR_ELIGIBILITY_INCOME_EXCEEDED (422)."
        test_recipe:
          setup: ["clock pinned 2026-08-01"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Exact Income", date_of_birth: "1955-01-01", annual_income_cents: 2400000, residency_address: "38 Edge St" }, as: Applicant, captures: { ok_id: $.data.id } }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Over Income", date_of_birth: "1955-01-01", annual_income_cents: 2400001, residency_address: "38 Edge St" }, as: Applicant, captures: { err: $.data.error_id } }
          assert:
            - "income 2400000 -> 201 SUBMITTED (<= inclusive)"
            - "income 2400001 -> error_id == ERR_ELIGIBILITY_INCOME_EXCEEDED, http 422"

