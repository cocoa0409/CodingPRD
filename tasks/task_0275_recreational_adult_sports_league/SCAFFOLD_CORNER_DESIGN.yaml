# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Recreational Adult Sports League — breadth probe over §1.1–§1.7.
# Walks references/claim-extraction-guide.md row-by-row. Every active instance's
# setup_api_calls drives empty-DB -> precondition using only §1.5 endpoints; OCC
# version inputs are ${var} from a prior captures: $.data.version. Corners already
# asserted by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_season_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Season, endpoints]
        distinguishing_aspect: "POST /seasons with all required fields -> 201; response carries id, registration_status=DRAFT, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "S1", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
          assert:
            - "HTTP 201; Season.${s_id}.registration_status == DRAFT; Season.${s_id}.version == 1; refund_partial_pct == 50 (default applied)"

      - name: get_season_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Season, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /seasons/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /seasons/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_division_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Division, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /seasons/{id}/divisions without team_capacity -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A season exists."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "D", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST (team_capacity missing)"

      - name: create_division_invalid_enum_skill_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Division.fields.skill_tier, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "skill_tier=PRO is not in {REC, INTERMEDIATE, COMPETITIVE} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A season exists."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "D", skill_tier: "PRO", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: game_ends_at_not_after_starts_at_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Game.fields.ends_at, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ends_at <= starts_at on game create -> ERR_INVALID_REQUEST (422); a constraint boundary distinct from missing-field."
        test_recipe:
          setup: ["A division with two CONFIRMED teams and a venue in an OPEN season."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "GS", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "GD", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "GV", field_count: 1, turnover_buffer_minutes: 0 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: LeagueAdmin
              captures: { cap1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "G2", email: "g2@x.com" }
              as: LeagueAdmin
              captures: { cap2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "GH", captain_player_id: "${cap1_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "GA", captain_player_id: "${cap2_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/confirm"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${t1_id}", away_team_id: "${t2_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T19:30:00Z", ends_at: "2026-09-15T18:00:00Z" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST (ends_at <= starts_at)"

      - name: system_fields_ignored_on_player_create
        claim_type: System Fields
        grounds: [entities.Player.fields.conduct_points, entities.Player.fields.is_free_agent]
        distinguishing_aspect: "Client-supplied id/conduct_points are ignored; server mints id, conduct_points=0, is_free_agent=true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /players"
              payload: { full_name: "Newbie", email: "newbie@x.com" }
              as: LeagueAdmin
              captures: { p_id: $.data.id }
          assert:
            - "Player.${p_id}.conduct_points == 0; Player.${p_id}.is_free_agent == true; Player.${p_id}.suspension_status == CLEAR; id is a server-minted UUID"

      - name: duplicate_player_email_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Player.fields.email, "validations[priority=15]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second player with the same email among non-CANCELLED players -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["One player with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /players"
              payload: { full_name: "First", email: "dup@x.com" }
              as: LeagueAdmin
          trigger:
            - call: "POST /players"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_DUPLICATE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_score_from_pending_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Game.SUBMITTED_to_CONFIRMED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm-score requires score_status=SUBMITTED; calling it while PENDING -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED game whose score_status is still PENDING, with an ASSIGNED HEAD referee, season IN_PLAY."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "IS", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "ISD", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "ISV", field_count: 1, turnover_buffer_minutes: 0 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /referees"
              payload: { full_name: "Ref IS", certified_sports: ["SOCCER"] }
              as: LeagueAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "IS1", email: "is1@x.com" }
              as: LeagueAdmin
              captures: { cap1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "IS2", email: "is2@x.com" }
              as: LeagueAdmin
              captures: { cap2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
              captures: { s_v1: $.data.version }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "ISH", captain_player_id: "${cap1_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "ISA", captain_player_id: "${cap2_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${t1_id}", away_team_id: "${t2_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:30:00Z" }
              as: LeagueAdmin
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/referee-assignments"
              payload: { referee_id: "${ref_id}", role: "HEAD" }
              as: LeagueAdmin
          trigger:
            - call: "POST /games/${g_id}/confirm-score"
              payload: {}
              as: Referee
              as_user_id: "${ref_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (cannot confirm a PENDING score)"

      - name: review_already_dismissed_report_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ConductReport, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISMISSED is terminal; a further transition target on a DISMISSED report -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A ConductReport reviewed then dismissed (terminal)."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "TL", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "TLD", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "TLV", field_count: 1, turnover_buffer_minutes: 0 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "TL1", email: "tl1@x.com" }
              as: LeagueAdmin
              captures: { cap1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "TL2", email: "tl2@x.com" }
              as: LeagueAdmin
              captures: { cap2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "TLH", captain_player_id: "${cap1_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "TLA", captain_player_id: "${cap2_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${t1_id}", away_team_id: "${t2_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:30:00Z" }
              as: LeagueAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conduct-reports"
              payload: { game_id: "${g_id}", player_id: "${cap1_id}", severity: "YELLOW" }
              as: ConductOfficer
              captures: { r_id: $.data.id }
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "UNDER_REVIEW" }
              as: ConductOfficer
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "DISMISSED" }
              as: ConductOfficer
          trigger:
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "UPHELD" }
              as: ConductOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (DISMISSED is terminal)"

      - name: game_parallel_dimensions_covered_by_difficulty
        claim_type: parallel
        grounds: [state_machines.Game.SCHEDULED_to_FORFEITED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / game_parallel_schedule_x_score_dimensions
          rationale: "The schedule_status x score_status parallel evolution is asserted by the named §1.8 instance."

      - name: conduct_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.ConductReport.APPEALED_to_UPHELD]
        excluded_because:
          difficulty_instance: non_linear_state_machine / conduct_report_uphold_appeal_cycle
          rationale: "The UPHELD<->APPEALED loop is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: standings_points_win_draw_values
        claim_type: Correct Result
        grounds: [calculations.standings_points, entities.Team.fields.points]
        distinguishing_aspect: "A team with one confirmed win scores WIN_POINTS=3 and wins=1; a drawn confirmed game scores DRAW_POINTS=1."
        test_recipe:
          setup: ["A confirmed 2-1 game between two CONFIRMED teams in an IN_PLAY season."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "SP", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "SPD", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "SPV", field_count: 1, turnover_buffer_minutes: 0 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /referees"
              payload: { full_name: "Ref SP", certified_sports: ["SOCCER"] }
              as: LeagueAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "SP1", email: "sp1@x.com" }
              as: LeagueAdmin
              captures: { cap1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "SP2", email: "sp2@x.com" }
              as: LeagueAdmin
              captures: { cap2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
              captures: { s_v1: $.data.version }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "SPH", captain_player_id: "${cap1_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "SPA", captain_player_id: "${cap2_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${t1_id}", away_team_id: "${t2_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:30:00Z" }
              as: LeagueAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /games/${g_id}/referee-assignments"
              payload: { referee_id: "${ref_id}", role: "HEAD" }
              as: LeagueAdmin
            - call: "GET /seasons/${s_id}"
              payload: {}
              as: LeagueAdmin
              captures: { s_v2: $.data.version }
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "CLOSED", expected_season_version: "${s_v2}" }
              as: LeagueAdmin
              captures: { s_v3: $.data.version }
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "SCHEDULED", expected_season_version: "${s_v3}" }
              as: LeagueAdmin
              captures: { s_v4: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:30:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "IN_PLAY", expected_season_version: "${s_v4}" }
              as: LeagueAdmin
            - call: "POST /games/${g_id}/submit-score"
              payload: { home_score: 2, away_score: 1, expected_game_version: "${g_v}" }
              as: Referee
              as_user_id: "${ref_id}"
          trigger:
            - call: "POST /games/${g_id}/confirm-score"
              payload: {}
              as: Referee
              as_user_id: "${ref_id}"
          assert:
            - "Team.${t1_id}.points == 3 and Team.${t1_id}.wins == 1; Team.${t2_id}.points == 0 and Team.${t2_id}.losses == 1"

      - name: refund_variants_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: [calculations.team_withdraw_refund]
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_full_vs_partial_vs_none_diverges
          rationale: "Full vs partial refund divergence is asserted by the named §1.8 instance."

      - name: standings_seed_chains_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: [calculations.standings_seed]
        excluded_because:
          difficulty_instance: dual_variant_calc / standings_seed_h2h_vs_pointdiff_diverges
          rationale: "The two tiebreak chains are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: no_refund_after_first_game_returns_zero_refund
        claim_type: Violation to Error
        grounds: [calculations.team_withdraw_refund, "validations[priority=14]"]
