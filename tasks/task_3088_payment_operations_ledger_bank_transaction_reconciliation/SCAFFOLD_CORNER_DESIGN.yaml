          cutoffs:
          - rail: ACH
            cutoff_local_time: '14:00:00'
          - rail: WIRE
            cutoff_local_time: '15:00:00'
          - rail: RTP
            cutoff_local_time: '16:00:00'
          allowed_rails:
          - ACH
          - WIRE
          - RTP
        as: LedgerController
      - call: POST /payment-orders
        payload:
          legal_entity_id: ${c26_entity}
          ledger_id: ${c26_ledger}
          counterparty_id: ${c26_cp}
          source_account_id: ${c26_acct}
          rail: ACH
          direction: CREDIT
          amount_cents: 3300
          idempotency_key: idem-c26_o
          payable_to_name: Delta Supply Co
        as: PaymentInitiator
        captures:
          c26_po_o: $.data.id
          c26_po_o_v: $.data.version
      - call: POST /payment-orders/${c26_po_o}/approve
        payload:
          expected_payment_order_version: ${c26_po_o_v}
        as: PaymentApprover
      - call: POST /payment-orders/${c26_po_o}/dispatch
        payload:
          expected_payment_order_version: ${c26_po_o_v}
        as: PaymentApprover
      trigger:
      - call: POST /payment-orders/${c26_po_o}/approve
        payload:
          expected_payment_order_version: ${c26_po_o_v}
        as: PaymentInitiator
        captures:
          c26_err: $.data.error_id
      assert:
      - the response is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE
      - error_id != ERR_SELF_APPROVAL_FORBIDDEN, which is the separate error the same endpoint raises for an authorised
        approver who is also the initiator
      - PaymentOrder.${c26_po_o}.status is still PENDING_APPROVAL
