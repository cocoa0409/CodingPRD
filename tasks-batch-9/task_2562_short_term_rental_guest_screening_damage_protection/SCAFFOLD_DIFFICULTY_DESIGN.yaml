          - entities.Property.fields.turnover_buffer_nights
        distinguishing_aspect: |
          Resource = the listing calendar of one Property; geometry = HALF-OPEN intervals
          whose trailing edge is pushed out by turnover_buffer_nights 1. The blocked window
          for a 2026-08-10 -> 2026-08-12 stay is therefore [08-10, 08-13), so an arriving
