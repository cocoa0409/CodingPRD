          setup: ["DRAFT project (S1)"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
          trigger:
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_user_context_header_rejected
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "A request whose X-User-Role is not one of the declared roles -> ERR_MISSING_OR_INVALID_USER_CONTEXT (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /painting/projects"
              payload: {}
              as: Intruder
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_project_version_on_change_order_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-create-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]", endpoints]
        distinguishing_aspect: "After one change order is created+submitted+approved (Project.version advances), a second change-order create still carrying the pre-approval expected_project_version -> ERR_STALE_PROJECT_VERSION (412)."
        test_recipe:
          setup: ["ESTIMATED project (S1); client observed version V at finalize; first change order approved, bumping version."]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { v_stale: $.data.version }
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v_stale}", reason: "add study", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co1: $.data.id }
            - call: "POST /painting/change-orders/${co1}/submit"
              payload: {}
              as: Estimator
            - call: "POST /painting/change-orders/${co1}/approve"
              payload: {}
              as: Customer
          trigger:
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v_stale}", reason: "second order on stale view", action: "ADD_SURFACE", new_label: "Den", new_surface_kind: "INTERIOR", new_area_sqft: 200, new_coats: 1, new_prep_level: "LIGHT", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "data.error_id == ERR_STALE_PROJECT_VERSION"

      - name: occ_correct_version_on_change_order_create_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-create-stale-project]", endpoints]
        distinguishing_aspect: "Re-reading the project after the first approval and supplying the fresh version on a second change-order create -> 201 (OCC happy path; version match)."
        test_recipe:
