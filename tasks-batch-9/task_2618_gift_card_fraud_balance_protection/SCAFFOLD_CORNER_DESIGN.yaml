  # ==========================================================================
  - section: state_machines
    instances:

      - name: new_card_and_new_issuance_request_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.GiftCard.initial_state
          - state_machines.IssuanceRequest.initial_state
          - state_machines.CardRack.initial_state
          - state_machines.RetailStore.initial_state
        distinguishing_aspect: "A freshly created RetailStore is OPEN, a freshly created CardRack is INTACT (not SUSPECT and not null), a freshly created GiftCard is INACTIVE/CLEAR on both dimensions, and a freshly created IssuanceRequest is SUBMITTED — four declared initial_state values, none of them defaulted to the first alphabetical enum member."
        test_recipe:
          setup:
            - "Empty database. Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Initial State Foods", region_code: "NE", address_line: "1 Init Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id, store_posture0: $.data.floor_posture }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-I1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id, rack_state0: $.data.tamper_state }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4001" }
              as: PosAssociate
              captures: { card_id: $.data.id, act0: $.data.activation_state, posture0: $.data.risk_posture }
          trigger:
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-40", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id, ir_state0: $.data.state }
          assert:
            - "HTTP status == 201"
            - "${store_posture0} == OPEN"
            - "${rack_state0} == INTACT"
            - "${act0} == INACTIVE and ${posture0} == CLEAR"
            - "${ir_state0} == SUBMITTED"
            - "IssuanceRequest.${ir_id}.screened_at == null and decided_by_user_id == null and decline_reason == null"
            - "GiftCard.${card_id}.current_balance_cents == 0, face_value_cents == 0, activated_at == null"
            - "CardRack.${rack1_id}.last_audit_at == null and missing_card_count == 0"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 0 — no value moves at request time"

      - name: issuance_screen_activates_the_card_and_appends_the_activation_load
        claim_type: valid_transition
        grounds:
          - state_machines.IssuanceRequest.SUBMITTED_to_APPROVED
          - state_machines.GiftCard.INACTIVE_to_ACTIVE
          - entities.LedgerEvent.fields.type
          - entities.GiftCard.fields.total_loaded_cents
        distinguishing_aspect: "One screen call drives two machines and appends one event: IssuanceRequest SUBMITTED→APPROVED, GiftCard INACTIVE→ACTIVE with face_value 7500 / balance 7500 / total_loaded 7500 / available 7500 / activated_at 2026-08-01T00:00:00Z, and exactly one ACTIVATION_LOAD of +7500 — the load is not duplicated and it is not posted at request time."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN, one INTACT CardRack, one INACTIVE GiftCard, and one SUBMITTED PHYSICAL IssuanceRequest for 7500 cents with packaging_seal_intact true."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Activation Test Store", region_code: "MW", address_line: "2 Activate Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-A1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4101" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 7500, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-41", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { ir_state: $.data.state, ir_screened: $.data.screened_at }
            - call: "GET /ledger-events"
              payload: { card_id: "${card_id}", type: "ACTIVATION_LOAD" }
              as: LiabilityAccountant
              as_user_id: "acct-41"
          assert:
            - "HTTP status == 200"
            - "${ir_state} == APPROVED"
            - "${ir_screened} == 2026-08-01T00:00:00Z"
            - "GiftCard.${card_id}.activation_state == ACTIVE"
            - "GiftCard.${card_id}.channel == PHYSICAL"
            - "GiftCard.${card_id}.face_value_cents == 7500"
            - "GiftCard.${card_id}.current_balance_cents == 7500"
            - "GiftCard.${card_id}.total_loaded_cents == 7500"
            - "GiftCard.${card_id}.total_redeemed_cents == 0"
            - "GiftCard.${card_id}.held_amount_cents == 0 and available_balance_cents == 7500"
            - "GiftCard.${card_id}.activated_at == 2026-08-01T00:00:00Z"
            - "GiftCard.${card_id}.risk_posture == CLEAR — activation touches only the activation_state dimension"
            - "the second trigger call returns total_count == 1 with amount_cents 7500 and signed_amount_cents 7500"

      - name: redemption_on_inactive_card_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=45]
          - errors.ERR_CARD_NOT_ACTIVE
          - state_machines.GiftCard.initial_state
        distinguishing_aspect: "A never-screened card is INACTIVE, so POST /gift-cards/{id}/redemptions returns 409 ERR_CARD_NOT_ACTIVE and writes no LedgerEvent — a card with zero balance cannot be driven negative."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, and one GiftCard that was created but never screened, so it is still INACTIVE with balance 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Never Screened Store", region_code: "SE", address_line: "3 Idle Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-N1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4201" }
              as: PosAssociate
              captures: { card_id: $.data.id, cv0: $.data.version }
          trigger:
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 100, merchant_store_id: "${store1_id}", pos_terminal_id: "T-42" }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CARD_NOT_ACTIVE"
            - "GiftCard.${card_id}.activation_state == INACTIVE"
            - "GiftCard.${card_id}.current_balance_cents == 0 and total_redeemed_cents == 0"
            - "GiftCard.${card_id}.version == ${cv0} — the rejected redemption did not bump the card"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 0"

      - name: second_screen_on_approved_issuance_request_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=47]
          - errors.ERR_INVALID_ISSUANCE_STATE
          - state_machines.IssuanceRequest.terminal_states
        distinguishing_aspect: "Screening an already-APPROVED request returns 409 ERR_INVALID_ISSUANCE_STATE; crucially the card's balance stays at 7500 and the ledger still holds exactly one ACTIVATION_LOAD, so a replayed screen cannot double-fund a card."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one GiftCard, and one PHYSICAL IssuanceRequest for 7500 cents that has already been screened to APPROVED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Replay Screen Store", region_code: "NW", address_line: "4 Replay Ln" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-R1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4301" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 7500, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-43", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { first_state: $.data.state }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-43"
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "${first_state} == APPROVED"
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_ISSUANCE_STATE"
            - "IssuanceRequest.${ir_id}.state == APPROVED — unchanged"
            - "GiftCard.${card_id}.current_balance_cents == 7500 and total_loaded_cents == 7500"
            - "GiftCard.${card_id}.version == ${cv1} — the rejected replay bumped nothing"
            - "GET /ledger-events?card_id=${card_id}&type=ACTIVATION_LOAD returns total_count == 1"

      - name: alert_resolve_before_triage_is_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=49]
          - errors.ERR_INVALID_ALERT_STATE
          - state_machines.DrainingAlert.OPEN_to_TRIAGED
        distinguishing_aspect: "DrainingAlert has no OPEN→CONFIRMED edge, so resolving an OPEN alert returns 409 ERR_INVALID_ALERT_STATE and — decisively — the card's risk_posture stays CLEAR instead of being frozen by a skipped triage."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 9000 cents, and one OPEN MANUAL_REVIEW DrainingAlert on that card."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Skip Triage Store", region_code: "MW", address_line: "5 Skip St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-S1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4401" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 9000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-44", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "MANUAL_REVIEW", note: "clerk flagged an unusual purchase" }
              as: FraudAnalyst
              as_user_id: "analyst-44"
              captures: { alert_id: $.data.id, alert_state0: $.data.state, exposure0: $.data.exposure_cents }
          trigger:
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "CONFIRM", resolution_note: "trying to confirm without triage" }
              as: RiskManager
              as_user_id: "risk-44"
              captures: { err: $.data.error_id }
          assert:
            - "${alert_state0} == OPEN and ${exposure0} == 9000"
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_ALERT_STATE"
            - "DrainingAlert.${alert_id}.state == OPEN — unchanged"
            - "DrainingAlert.${alert_id}.triaged_by_user_id == null and resolution == null and resolved_by_user_id == null"
            - "GiftCard.${card_id}.risk_posture == CLEAR — no freeze leaked out of the rejected resolve"

      - name: resubmit_evidence_on_submitted_claim_is_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=50]
          - errors.ERR_INVALID_CLAIM_STATE
          - state_machines.VictimClaim.EVIDENCE_REQUESTED_to_SUBMITTED
        distinguishing_aspect: "resubmit-evidence is legal only from EVIDENCE_REQUESTED, so calling it on a SUBMITTED claim returns 409 ERR_INVALID_CLAIM_STATE and evidence_round stays 0 — a claimant cannot inflate the round counter by re-uploading unprompted."
        test_recipe:
          setup:
