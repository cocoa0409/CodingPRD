              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { v_sub: $.data.version }
          trigger:
            - call: "POST /timesheet-weeks/${tw}/approve"
              payload: { expected_timesheet_week_version: "${v_sub}" }
              as: Supervisor
              as_user_id: "sup-2"
              captures: { v_appr: $.data.version }
          assert:
            - "TimesheetWeek.${tw}.status == APPROVED"
            - "TimesheetWeek.${tw}.version == 3"

      - name: occ_stale_version_on_payroll_include
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payroll-include-stale-week]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Including a week with a stale expected_timesheet_week_version (one less than current) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; an APPROVED week; an OPEN payroll run; the client holds a version one behind current."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { v_sub: $.data.version }
            - call: "POST /timesheet-weeks/${tw}/approve"
              payload: { expected_timesheet_week_version: "${v_sub}" }
              as: Supervisor
              as_user_id: "sup-2"
              captures: { v_appr: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: PayrollAdmin
              captures: { run: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run}/include"
              payload: { timesheet_week_id: "${tw}", expected_timesheet_week_version: "${v_appr} - 1" }
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: void_punch_reconciles_timesheet_gross
        claim_type: derived_field_reconciliation
        grounds: [state_machines.TimePunch.CLOSED_to_VOIDED, calculations.gross_wages, entities.TimesheetWeek.fields.gross_wages_cents]
        distinguishing_aspect: "Voiding a CLOSED punch then resubmitting recomputes the week: a single 8h punch voided drops regular_minutes to 0 and gross_wages_cents to 0."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; one CLOSED 8h punch; DRAFT week submitted (gross 16000)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /punches/${p_ca}/void"
              payload: {}
              as: Supervisor
              as_user_id: "sup-9"
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { gross_after: $.data.gross_wages_cents }
          assert:
            - "TimePunch.${p_ca}.status == VOIDED"
            - "TimePunch.${p_ca}.worked_minutes == 0"
            - "TimesheetWeek.${tw}.regular_minutes == 0"
            - "TimesheetWeek.${tw}.gross_wages_cents == 0"

  # ===========================================================================
  - section: consistency_model
    instances:
