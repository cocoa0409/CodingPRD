            - "${reserved_mid} == 12"
            - "${avail_mid} == 28"
            - "${onhand_mid} == 40"
            - "InventoryLot.${lot}.quantity_reserved == 0"
            - "InventoryLot.${lot}.quantity_available == 40"
            - "InventoryLot.${lot}.quantity_on_hand == 40"
            - "OrderLine.${line}.allocated_lot_id == null"
            - "OrderLine.${line}.allocated_quantity == 0"
            - "Order.${ord}.fulfillment_status == CANCELLED"
            - "Order.${ord}.credit_status == CLOSED"

      - name: manifest_reject_conserves_global_recovered_lead_mass
        grounds:
          - state_machines.DisposalManifest.SUBMITTED_to_DRAFT
          - calculations.manifest_lead_totals
          - entities.CoreReturn.fields.disposal_manifest_id
          - entities.InventoryLot.fields.scrap_manifest_id
          - concurrency_rules[manifest-attach-stale-manifest]
        distinguishing_aspect: |
          Conserved quantity: recovered lead MASS in kilograms, a different type from the
          unit count. The named invariant is
          sum over manifests of total_lead_kg + lead sitting on unattached CREDITED
          CoreReturns and unscrapped SHELF_EXPIRED lots == 170.625 kg at every step.
          Attaching moves 120.625 kg and scrapping moves 50.000 kg onto the manifest;
          rejecting moves both back and leaves the manifest at exactly 0.0.
