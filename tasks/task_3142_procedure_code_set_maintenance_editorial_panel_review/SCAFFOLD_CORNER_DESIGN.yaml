          trigger:
            - call: "GET /cpt/specialty-societies/${soc_bl}"
              payload: {}
              as: EditorialStaff
          assert:
            - "SpecialtySociety.${soc_bl}.cea_credit_balance == 0"
            - "CodeChange.${chg_bl}.cea_credits == 0"
            - "CodeChange.${chg_bl}.determination == PENDING"

  - section: cross_cutting
    instances:
      - name: wrong_expected_license_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-reserve-stale-license]
          - errors[ERR_STALE_VERSION]
          - state_machines.ContentDeliveryOrder.PENDING_to_RESERVED
        distinguishing_aspect: |
          A delivery reservation carrying the licence version observed before a
          prior reservation advanced it fails with ERR_STALE_VERSION at status
          412 while the reservation carrying the current version succeeds.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and one ACTIVE provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One prior reservation already advanced the licence version"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-GULF", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_oc: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Gulf Clinic", vendor_worldwide: false, expected_users: 11, sales_unit_count: 7, base_fee_cents: 0, territory_id: "${ter_oc}" }
              as: LicensingOfficer
              captures: { lic_oc: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements/${lic_oc}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_oc_v1: $.data.version }
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_oc}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_oc_v1}" }
              as: Licensee
              as_user_id: "${lic_oc}"
              captures: { del_oc: $.data.id, lic_oc_v2: $.data.version }
            - call: "POST /cpt/content-delivery-orders/${del_oc}/withdrawals"
              payload: { reason: "Frees the slot for the concurrency probe" }
              as: Licensee
              as_user_id: "${lic_oc}"
              captures: { del_oc_w: $.data.version }
          trigger:
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_oc}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_oc_v2} - 1" }
              as: Licensee
