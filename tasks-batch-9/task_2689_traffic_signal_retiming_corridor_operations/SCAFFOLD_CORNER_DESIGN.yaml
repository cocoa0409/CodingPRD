            - "${w_res} == WAIVED, ${w_by} == cert-1 and ${w_just} is the supplied text — the waiver is attributed to the acting user"
            - "${plan_state} == WAIVED (not COMPLIANT) once no FAIL row remains, while ${plan_status} == COORDINATED — the two axes move independently"
            - "${st_ok} == SUBMITTED — the identical submit now passes, proving the waiver was the only thing standing in its way"

      - name: action_endpoint_implement_writes_its_declared_side_effects
