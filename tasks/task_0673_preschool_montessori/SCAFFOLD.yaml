scenario: "Preschool & Montessori Program: enrollment & age/classroom (Montessori levels), waitlist & sibling priority, tuition tier & deposit, curriculum & assessment/portfolio (work cycle), ratio & licensing compliance, parent conference & observation, summer/extended-day, withdrawal/refund"
domain_name: preschool-montessori
api_prefix: "/montessori"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys (Application, Enrollment, Payment, RefundRequest,
  # StaffAssignment, AssessmentRecord, ConferenceSlot, Observation all reference Classroom /
  # Student / TuitionTier by FK rather than nesting under them in the URL path).

  state_machine_shape: branching
  # Application carries a cyclic revision loop (UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW);
  # Enrollment carries TWO parallel state dimensions (placement_status x billing_status);
  # ConferenceSlot is a branching fork (OPEN -> {BOOKED -> {COMPLETED, NO_SHOW}, CANCELLED}).

  relationship_patterns:
    - one_to_many        # Classroom has many Enrollments; Student has many AssessmentRecords
    - self_referential   # Student.sibling_of_student_id references another Student (sibling priority)
    - cross_aggregate    # Enrollment references Classroom and Student and TuitionTier across aggregates

  role_model: peer_roles
  # Registrar (enrollment/waitlist/refund admin), Guide (Montessori teacher: assessment/observation/
  # conference), ComplianceOfficer (ratio/licensing + staff assignment), Parent (entity-backed, acts on
  # own Student/Application). Distinct non-overlapping resource ownership with a few shared reads.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ===========================================================================
entities:
  - name: TuitionTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique tier code, e.g. STANDARD / PREMIUM / TODDLER_HALFDAY"
        constraints: "unique across TuitionTier (case-sensitive); non-empty"
      - name: level
        type: enum
        source: input
        description: "Montessori level this tier prices"
        constraints: "one of {TODDLER, PRIMARY, ELEMENTARY}"
      - name: base_annual_cents
        type: integer
        source: input
        description: "Annual tuition before any discount/aid, in integer cents"
        constraints: ">= 0"
      - name: deposit_pct
        type: number
        source: input
        description: "Fraction of base_annual_cents charged as the non-refundable enrollment deposit"
        constraints: "0 <= deposit_pct <= 1"
      - name: installments
        type: integer
        source: input
        description: "Number of monthly tuition installments the annual tuition is split across"
        default: 10
        constraints: "1 <= installments <= 12"
      - name: extended_day_annual_cents
        type: integer
        source: input
        description: "Flat annual surcharge added when an Enrollment opts into extended day"
        default: 0
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: "Whether the tier may be assigned to new Enrollments"
        default: true

  - name: Classroom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable classroom name"
        constraints: "non-empty"
      - name: level
        type: enum
        source: input
        description: "Montessori level served; constrains which Students may enroll"
        constraints: "one of {TODDLER, PRIMARY, ELEMENTARY}"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of Enrollments in placement_status PLACED for this classroom"
        constraints: ">= 1"
      - name: min_age_months
        type: integer
        source: input
        description: "Minimum student age in months (inclusive) admissible to this classroom"
        constraints: ">= 0"
      - name: max_age_months
        type: integer
        source: input
        description: "Maximum student age in months (inclusive) admissible to this classroom"
        constraints: ">= min_age_months"
      - name: placed_count
        type: integer
        source: computed
        description: "Number of Enrollments with placement_status == PLACED in this classroom; recomputed on every placement/withdrawal cascade"
        default: 0
      - name: assigned_staff_count
        type: integer
        source: computed
        description: "Count of StaffAssignment rows with status ACTIVE for this classroom; recomputed when staff assignments change"
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: "Derived ratio/licensing posture gating new placements; recomputed by the ratio calculation. COMPLIANT or OVER_RATIO or OVER_CAPACITY"
        constraints: "one of {COMPLIANT, OVER_RATIO, OVER_CAPACITY}"
        default: COMPLIANT

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: parent_user_id
        type: string
        source: input
        description: "Opaque operator id of the Parent who owns this Student (X-User-ID of the Parent role); ownership checks compare X-User-ID to this stored value. NOT an entity FK."
      - name: full_name
        type: string
        source: input
        description: "Student full name"
        constraints: "non-empty"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Student date of birth (ISO 8601); used with the logical clock to derive age in months"
      - name: sibling_of_student_id
        type: string
        source: input
        description: "FK -> Student.id; optional self-reference to an older sibling already known to the program; drives sibling priority on the waitlist"
        default: null
      - name: staff_child
        type: boolean
        source: input
        description: "Whether this student is the child of a program staff member (drives waitlist priority)"
        default: false

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the applicant student"
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id; the classroom applied to (must match the student's eligible level)"
      - name: tier_id
        type: string
        source: input
        description: "FK -> TuitionTier.id; the requested tuition tier"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, WAITLISTED, OFFERED, ENROLLED, WITHDRAWN, DECLINED}"
        default: SUBMITTED
      - name: priority_score
        type: integer
        source: computed
        description: "Weighted waitlist priority score; recomputed when the application is WAITLISTED and at each promotion sweep"
        default: 0
      - name: waitlisted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp captured when the application entered WAITLISTED; tenure input to priority_score; null until first WAITLISTED"
        default: null
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; set when this application converts to an Enrollment"
        default: null
      - name: extended_day_opt_in
        type: boolean
        source: input
        description: "Whether the family requests the extended-day add-on (affects tuition net and Enrollment)"
        default: false
      - name: financial_aid_pct
        type: number
        source: input
        description: "Approved financial-aid fraction applied to the post-sibling-discount tuition; 0 means none"
        default: 0
        constraints: "0 <= financial_aid_pct < 1"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this enrollment was created from"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id"
      - name: tier_id
        type: string
        source: input
        description: "FK -> TuitionTier.id"
      - name: placement_status
        type: enum
        source: system
        description: "Placement dimension (parallel to billing_status)"
        constraints: "one of {PLACED, ON_LEAVE, WITHDRAWN}"
        default: PLACED
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension (parallel to placement_status), evolves independently"
        constraints: "one of {DEPOSIT_DUE, ACTIVE, PAST_DUE, SETTLED}"
        default: DEPOSIT_DUE
      - name: extended_day_opt_in
        type: boolean
        source: input
        description: "Whether extended day is included (copied from the originating Application)"
        default: false
      - name: program_start_date
        type: datetime
        source: input
        description: "First instructional day of the enrollment year (ISO 8601); anchor for refund accrual"
      - name: net_annual_cents
        type: integer
        source: computed
        description: "Computed net annual tuition after sibling discount, extended-day surcharge, and financial aid (see tuition_net calc)"
        default: 0
      - name: monthly_installment_cents
        type: integer
        source: computed
        description: "Computed per-month installment = round_half_up(net_annual_cents / tier.installments)"
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "Computed non-refundable deposit = round_half_up(tier.base_annual_cents * tier.deposit_pct)"
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents for Payments on this enrollment with status CAPTURED; recomputed on each payment capture cascade"
        default: 0

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being paid"
      - name: kind
        type: enum
        source: input
        description: "Whether this is the deposit or a monthly installment"
        constraints: "one of {DEPOSIT, INSTALLMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in integer cents"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle"
        constraints: "one of {CAPTURED, REFUNDED}"
        default: CAPTURED
      - name: captured_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when captured"

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the withdrawn enrollment a refund is computed for"
      - name: effective_date
        type: datetime
        source: input
        description: "Withdrawal effective date (ISO 8601); the as-of date for refund accrual"
      - name: method
        type: enum
        source: input
        description: "Which refund accrual algorithm to apply"
        constraints: "one of {FORWARD, CHRONOLOGICAL}"
      - name: status
        type: enum
        source: system
        description: "RefundRequest lifecycle"
        constraints: "one of {COMPUTED, APPROVED, PAID, VOID}"
        default: COMPUTED
      - name: earned_cents
        type: integer
        source: computed
        description: "Tuition the school has earned as of effective_date under the chosen method (see refund_amount calc)"
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Refund owed to family = max(0, paid_to_date_cents - earned_cents); pinned per chosen method"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Amount the family still owes = max(0, earned_cents - paid_to_date_cents)"
        default: 0

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id; the classroom this staff member is assigned to"
      - name: staff_name
        type: string
        source: input
        description: "Assigned staff member name"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        constraints: "one of {ACTIVE, ENDED}"
        default: ACTIVE
      - name: expected_classroom_version
        type: integer
        source: input
        description: "OCC: the Classroom.version the caller last observed; rejected if stale"

  - name: AssessmentRecord
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the assessed student"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment context"
      - name: work_area
        type: enum
        source: input
        description: "Montessori curriculum work area"
        constraints: "one of {PRACTICAL_LIFE, SENSORIAL, LANGUAGE, MATHEMATICS, CULTURAL}"
      - name: mastery_level
        type: enum
        source: input
        description: "Observed mastery on this record"
        constraints: "one of {INTRODUCED, PRACTICING, MASTERED}"
      - name: work_cycle_date
        type: datetime
        source: input
        description: "Logical-clock date of the work-cycle observation"
      - name: portfolio_included
        type: boolean
        source: input
        description: "Whether this record is included in the conference portfolio"
        default: true

  - name: ConferenceSlot
    parent: null
    common_fields: true
    fields:
      - name: guide_user_id
        type: string
        source: input
        description: "Opaque operator id of the Guide hosting the slot (X-User-ID of the Guide role); complete/no-show/cancel require acting Guide's X-User-ID == this value. NOT an entity FK."
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id; the classroom whose families this slot serves"
      - name: start_at
        type: datetime
        source: input
        description: "Slot start instant (ISO 8601, inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Slot end instant (ISO 8601, exclusive); end_at > start_at"
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle"
        constraints: "one of {OPEN, BOOKED, COMPLETED, NO_SHOW, CANCELLED}"
        default: OPEN
      - name: booked_student_id
        type: string
        source: system
        description: "FK -> Student.id; set when a Parent books the slot"
        default: null

  - name: Observation
    parent: null
    common_fields: false
    fields:
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id; the classroom being observed"
      - name: observer_name
        type: string
        source: input
        description: "Name of the observing parent/visitor"
        constraints: "non-empty"
      - name: window_start_at
        type: datetime
        source: input
        description: "Observation window start (ISO 8601, inclusive)"
      - name: window_end_at
        type: datetime
        source: input
        description: "Observation window end (ISO 8601, exclusive); end > start"

# ===========================================================================
# §1.2 STATE MACHINE TABLE
# ===========================================================================
state_machines:
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ENROLLED, WITHDRAWN, DECLINED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review"
        actor: Registrar
        preconditions:
          - "application.status == SUBMITTED"
        side_effects: ["increments Application.version by 1"]

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /applications/{id}/request-changes"
        actor: Registrar
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects: ["increments Application.version by 1"]
        note: "Cyclic revision loop: family revises, Registrar re-reviews."

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/resubmit"
        actor: Parent
        preconditions:
          - "application.status == CHANGES_REQUESTED"
          - "acting Parent owns Student referenced by application.student_id"
        side_effects: ["increments Application.version by 1"]
        note: "Closes the revision cycle UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /applications/{id}/waitlist"
        actor: Registrar
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "Student.age_in_months derived from clock is within [Classroom.min_age_months, Classroom.max_age_months]"
          - "Classroom.level == TuitionTier.level for application.tier_id"
        side_effects:
          - "sets Application.waitlisted_at = current logical clock"
          - "computes Application.priority_score via waitlist_priority calc"
          - "increments Application.version by 1"

      - from: UNDER_REVIEW
        to: OFFERED
        trigger: "POST /applications/{id}/offer"
        actor: Registrar
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "Classroom.compliance_status == COMPLIANT"
          - "Classroom.placed_count < Classroom.capacity"
          - "Student.age_in_months within [Classroom.min_age_months, Classroom.max_age_months]"
        side_effects: ["increments Application.version by 1"]
        note: "Direct offer when a seat is open and the room is compliant (no waitlisting needed)."

      - from: WAITLISTED
        to: OFFERED
        trigger: "POST /classrooms/{id}/promote-waitlist (system selection) OR auto-promotion cascade on withdrawal"
        actor: Registrar | system
        preconditions:
          - "application.status == WAITLISTED"
          - "Classroom.compliance_status == COMPLIANT"
          - "Classroom.placed_count < Classroom.capacity"
          - "application is the selected top-ranked WAITLISTED application for the classroom (see waitlist_priority calc selector)"
        side_effects: ["increments Application.version by 1"]

      - from: OFFERED
        to: ENROLLED
        trigger: "POST /applications/{id}/accept-offer"
        actor: Parent
        preconditions:
          - "application.status == OFFERED"
          - "acting Parent owns Student referenced by application.student_id"
          - "Classroom.compliance_status == COMPLIANT"
          - "Classroom.placed_count < Classroom.capacity"
        side_effects:
          - "creates an Enrollment (placement_status=PLACED, billing_status=DEPOSIT_DUE)"
          - "computes Enrollment.net_annual_cents, monthly_installment_cents, deposit_cents (tuition_net + deposit calcs)"
          - "sets Application.enrollment_id to the new Enrollment.id"
          - "increments Classroom.placed_count by 1 and recomputes Classroom.compliance_status (ratio_compliance calc)"
          - "increments Application.version by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /applications/{id}/decline-offer"
        actor: Parent
        preconditions:
          - "application.status == OFFERED"
          - "acting Parent owns Student referenced by application.student_id"
        side_effects: ["increments Application.version by 1"]

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Registrar
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects: ["increments Application.version by 1"]

  - entity: Enrollment
    initial_state: "PLACED / DEPOSIT_DUE"
    terminal_states: [WITHDRAWN]
    note: "Two parallel dimensions: placement_status {PLACED, ON_LEAVE, WITHDRAWN} and billing_status {DEPOSIT_DUE, ACTIVE, PAST_DUE, SETTLED} evolve independently on the same row."
    transitions:
      # placement dimension
      - from: "placement:PLACED"
        to: "placement:ON_LEAVE"
        trigger: "POST /enrollments/{id}/leave"
        actor: Registrar
        preconditions:
          - "enrollment.placement_status == PLACED"
        side_effects:
          - "decrements Classroom.placed_count by 1 and recomputes Classroom.compliance_status (ratio_compliance calc)"
          - "increments Enrollment.version by 1"

      - from: "placement:ON_LEAVE"
        to: "placement:PLACED"
        trigger: "POST /enrollments/{id}/return"
        actor: Registrar
        preconditions:
          - "enrollment.placement_status == ON_LEAVE"
          - "Classroom.placed_count < Classroom.capacity"
          - "Classroom.compliance_status == COMPLIANT"
        side_effects:
          - "increments Classroom.placed_count by 1 and recomputes Classroom.compliance_status"
          - "increments Enrollment.version by 1"

      - from: "placement:PLACED or placement:ON_LEAVE"
        to: "placement:WITHDRAWN"
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "enrollment.placement_status in {PLACED, ON_LEAVE}"
        side_effects:
          - "if enrollment was PLACED: decrements Classroom.placed_count by 1, recomputes Classroom.compliance_status (ratio_compliance calc)"
          - "the freed seat triggers auto-promotion: system selects the top-ranked WAITLISTED Application for the classroom and transitions it WAITLISTED -> OFFERED (cascade hop 2); that promotion increments that Application.version (cascade hop 3)"
          - "sets Application (linked via enrollment.application_id) status -> WITHDRAWN"
          - "increments Enrollment.version by 1"
        note: "Depth-3 cascade: withdraw mutates Enrollment+Classroom; Classroom's freed seat mutates the promoted Application; the promotion itself mutates that Application's version/state."

      # billing dimension (independent)
      - from: "billing:DEPOSIT_DUE"
        to: "billing:ACTIVE"
        trigger: "system: a CAPTURED Payment of kind DEPOSIT with amount_cents == Enrollment.deposit_cents posted via POST /payments"
        actor: system
        preconditions:
          - "enrollment.billing_status == DEPOSIT_DUE"
          - "the captured DEPOSIT payment amount equals Enrollment.deposit_cents"
        side_effects:
          - "recomputes Enrollment.paid_to_date_cents (paid_to_date calc)"
          - "increments Enrollment.version by 1"

      - from: "billing:ACTIVE"
        to: "billing:PAST_DUE"
        trigger: "POST /enrollments/{id}/mark-past-due"
        actor: Registrar
        preconditions:
          - "enrollment.billing_status == ACTIVE"
        side_effects: ["increments Enrollment.version by 1"]

      - from: "billing:PAST_DUE"
        to: "billing:ACTIVE"
        trigger: "system: a CAPTURED INSTALLMENT Payment posted via POST /payments while billing_status == PAST_DUE"
        actor: system
        preconditions:
          - "enrollment.billing_status == PAST_DUE"
        side_effects:
          - "recomputes Enrollment.paid_to_date_cents (paid_to_date calc)"
          - "increments Enrollment.version by 1"

      - from: "billing:ACTIVE or billing:PAST_DUE"
        to: "billing:SETTLED"
        trigger: "system: RefundRequest for this enrollment reaches status PAID via POST /refund-requests/{id}/pay"
        actor: system
        preconditions:
          - "enrollment.placement_status == WITHDRAWN"
          - "enrollment.billing_status in {ACTIVE, PAST_DUE}"
        side_effects: ["increments Enrollment.version by 1"]

  - entity: RefundRequest
    initial_state: COMPUTED
    terminal_states: [PAID, VOID]
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /refund-requests/{id}/approve"
        actor: Registrar
        preconditions:
          - "refund_request.status == COMPUTED"
          - "Enrollment (refund_request.enrollment_id) placement_status == WITHDRAWN"
        side_effects: ["increments RefundRequest.version by 1"]

      - from: APPROVED
        to: PAID
        trigger: "POST /refund-requests/{id}/pay"
        actor: Registrar
        preconditions:
          - "refund_request.status == APPROVED"
        side_effects:
          - "for each CAPTURED Payment on the enrollment, marks Payment.status = REFUNDED up to refund_cents in payment-creation order (created_at ASC, ties by created_at then by deposit-before-installment); compensating action"
          - "recomputes Enrollment.paid_to_date_cents (paid_to_date calc) so paid_to_date_cents - refund_cents invariant holds (refund_conservation)"
          - "transitions Enrollment billing_status -> SETTLED"
          - "increments RefundRequest.version by 1"

      - from: COMPUTED
        to: VOID
        trigger: "POST /refund-requests/{id}/void"
        actor: Registrar
        preconditions:
          - "refund_request.status == COMPUTED"
        side_effects: ["increments RefundRequest.version by 1"]

  - entity: ConferenceSlot
    initial_state: OPEN
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /conference-slots/{id}/book"
        actor: Parent
        preconditions:
          - "slot.status == OPEN"
          - "acting Parent owns the booked_student_id Student"
          - "the Student has an Enrollment with placement_status==PLACED in slot.classroom_id"
          - "no other ConferenceSlot for the same guide_user_id whose [start_at, end_at) overlaps this slot is BOOKED (guide double-booking guard)"
        side_effects:
          - "sets ConferenceSlot.booked_student_id"
          - "increments ConferenceSlot.version by 1"

      - from: BOOKED
        to: COMPLETED
        trigger: "POST /conference-slots/{id}/complete"
        actor: Guide
        preconditions:
          - "slot.status == BOOKED"
          - "acting Guide == slot.guide_user_id"
        side_effects: ["increments ConferenceSlot.version by 1"]

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /conference-slots/{id}/no-show"
        actor: Guide
        preconditions:
          - "slot.status == BOOKED"
          - "acting Guide == slot.guide_user_id"
          - "current logical clock >= slot.end_at"
        side_effects: ["increments ConferenceSlot.version by 1"]

      - from: "OPEN or BOOKED"
        to: CANCELLED
        trigger: "POST /conference-slots/{id}/cancel"
        actor: Guide
        preconditions:
          - "slot.status in {OPEN, BOOKED}"
          - "acting Guide == slot.guide_user_id"
        side_effects:
          - "clears ConferenceSlot.booked_student_id"
          - "increments ConferenceSlot.version by 1"

# ===========================================================================
# §1.2.1 CONCURRENCY RULES
# ===========================================================================
concurrency_rules:
  - rule_id: staff-assign-stale-classroom
    parent_entity: Classroom
    write_endpoint: "POST /staff-assignments"
    occ_field: "expected_classroom_version"
    description: |
      Creating a StaffAssignment against a Classroom whose version has advanced
      since the caller last observed it is rejected. A StaffAssignment legitimately
      raises assigned_staff_count and recomputes the classroom's compliance_status;
      if another writer has already ended or added an assignment (advancing
      Classroom.version and shifting compliance), the current caller's view of the
      room is stale and the create must be refused so the compliance recompute is
      not applied on top of an outdated staffing picture.
    error_id: ERR_STALE_CLASSROOM_VERSION
    http_status: 412

# ===========================================================================
# §1.3 CALCULATION RULES TABLE
# ===========================================================================
calculations:
  - name: tuition_net
    trigger: "On POST /applications/{id}/accept-offer (Application OFFERED -> ENROLLED), when the Enrollment is created"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order — step values feed the next step.
      net = tier.base_annual_cents
      step1_sibling:
        if application's Student.sibling_of_student_id references a Student that has an
        Enrollment with placement_status == PLACED:
            net = round_half_up(net * (1 - SIBLING_DISCOUNT_PCT))
      step2_extended_day:
        if enrollment.extended_day_opt_in == true:
            net = net + tier.extended_day_annual_cents
      step3_financial_aid:
        if application.financial_aid_pct > 0:
            net = round_half_up(net * (1 - application.financial_aid_pct))
            net = max(net, FINANCIAL_AID_FLOOR_CENTS)
      Enrollment.net_annual_cents = net
      Enrollment.monthly_installment_cents = round_half_up(net / tier.installments)
    input_set: "Single Application/Enrollment under accept-offer; sibling lookup considers only Enrollments whose placement_status == PLACED."
    constants:
      SIBLING_DISCOUNT_PCT: 0.10
      FINANCIAL_AID_FLOOR_CENTS: 300000
    precision: "integer cents, round_half_up at each step; the sibling-discount, extended-day, then financial-aid order is fixed (financial aid is applied last, after the extended-day surcharge is added — applying aid before the add-on yields a different total)."
    variants:
      - name: monthly_installment
        when: "after net_annual_cents is fixed"
        difference: "monthly_installment_cents = round_half_up(net_annual_cents / tier.installments); rounding once on the quotient, not per-month accumulation."

  - name: deposit
    trigger: "On POST /applications/{id}/accept-offer, alongside tuition_net"
    algorithm: tiered_pricing
    formula: |
      Enrollment.deposit_cents = round_half_up(tier.base_annual_cents * tier.deposit_pct)
    input_set: "tier.base_annual_cents and tier.deposit_pct only; deposit ignores sibling discount, extended day, and financial aid."
    constants: {}
    precision: "integer cents, round_half_up. Deposit is computed off base_annual_cents, NOT off net_annual_cents."

  - name: refund_amount
    trigger: "On POST /refund-requests when a RefundRequest is created for a WITHDRAWN Enrollment"
    algorithm: chronological
    formula: |
      # Anchor: enrollment.program_start_date; as-of: refund_request.effective_date.
      monthly = enrollment.monthly_installment_cents
      deposit_nonref = enrollment.deposit_cents   # always retained, non-refundable
      VARIANT FORWARD (method == FORWARD):
        # School earns the FULL installment of every calendar month the child has STARTED,
        # where month M is "started" if program_start_date <= effective_date AND the 1st of
        # month M is <= effective_date. Count such started months (n_forward).
        earned = deposit_nonref + n_forward * monthly
      VARIANT CHRONOLOGICAL (method == CHRONOLOGICAL):
        # Calendar months strictly BEFORE the withdrawal month and on/after program_start month
        # are earned in full (n_full). The withdrawal month itself is pro-rated by days attended:
        #   attended_days = day-of-month(effective_date)   # inclusive, 1-based
        #   days_in_month = number of days in the withdrawal month
        #   prorated = round_half_up(monthly * attended_days / days_in_month)
        earned = deposit_nonref + n_full * monthly + prorated
      refund_cents = max(0, paid_to_date_cents - earned)
      balance_due_cents = max(0, earned - paid_to_date_cents)
      RefundRequest.earned_cents = earned
    input_set: "Single WITHDRAWN Enrollment; paid_to_date_cents reflects CAPTURED Payments only (REFUNDED excluded)."
    constants: {}
    precision: "integer cents, round_half_up on the single pro-rata quotient (CHRONOLOGICAL only). FORWARD does no division."
    variants:
      - name: forward
        when: "method == FORWARD"
        difference: "month of withdrawal counts as fully earned; no proration."
      - name: chronological
        when: "method == CHRONOLOGICAL"
        difference: "month of withdrawal is pro-rated by attended days/days-in-month; for identical inputs the two variants yield different earned_cents and therefore different refund_cents."

  - name: waitlist_priority
    trigger: "On Application WAITLISTED (waitlist transition) and recomputed at each promotion selection"
    algorithm: weighted_scoring
    formula: |
      days_on_waitlist = floor((current_clock - application.waitlisted_at) in whole days)
      tenure = min(TENURE_CAP_DAYS, days_on_waitlist) * DAYS_WEIGHT
      sibling_component = SIBLING_WEIGHT if Student.sibling_of_student_id references a Student
                          that has an Enrollment with placement_status == PLACED else 0
      staff_component   = STAFF_CHILD_WEIGHT if Student.staff_child == true else 0
      priority_score = sibling_component + staff_component + tenure
    input_set: "All Applications with status == WAITLISTED and classroom_id == the promoting classroom."
    constants:
      SIBLING_WEIGHT: 1000
      STAFF_CHILD_WEIGHT: 1500
      DAYS_WEIGHT: 1
      TENURE_CAP_DAYS: 365
    precision: "integer score."
    variants:
      - name: promotion_selector
        when: "selecting which WAITLISTED Application to promote when a seat frees"
        difference: |
          Candidate set: Applications with status == WAITLISTED AND classroom_id == freed classroom.
          Ranking: priority_score DESC. Tie-break: waitlisted_at ASC (earliest first), then created_at ASC.
          Empty candidate set: no promotion occurs (seat stays open); not an error.

  - name: ratio_compliance
    trigger: "Recomputed whenever Classroom.placed_count or Classroom.assigned_staff_count changes (placement, withdrawal, leave/return, staff assignment create/end)"
    algorithm: threshold
    formula: |
      ratio = LEVEL_RATIO[classroom.level]   # students-per-staff cap
      required_staff = 0 if placed_count == 0 else ceil(placed_count / ratio)
      if placed_count > capacity:
          compliance_status = OVER_CAPACITY
      elif assigned_staff_count < required_staff:
          compliance_status = OVER_RATIO
      else:
          compliance_status = COMPLIANT
    input_set: "Single Classroom; placed_count counts Enrollments with placement_status == PLACED; assigned_staff_count counts StaffAssignment rows with status == ACTIVE."
    constants:
      LEVEL_RATIO: { TODDLER: 6, PRIMARY: 10, ELEMENTARY: 12 }
    precision: "integer counts; ceil for required_staff. Boundary: placed_count == capacity is COMPLIANT (uses >, not >=, for OVER_CAPACITY); placed_count == ratio*staff is COMPLIANT, placed_count == ratio*staff + 1 is OVER_RATIO."

  - name: paid_to_date
    trigger: "Recomputed on Payment capture (POST /payments) and on RefundRequest pay (Payments marked REFUNDED)"
    algorithm: aggregation
    formula: |
      Enrollment.paid_to_date_cents = sum(p.amount_cents for p in Payments
                                          where p.enrollment_id == enrollment.id
                                            and p.status == CAPTURED)
    input_set: "Payments with status == CAPTURED on the enrollment; REFUNDED payments excluded (so a refund pay reduces paid_to_date_cents)."
    constants: {}
    precision: "integer cents; exact sum, no rounding."

# ===========================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Parent-owned resources, the acting Parent's X-User-ID matches the owning Student.parent_user_id (booking, accept/decline-offer, resubmit)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /applications/{id}/accept-offer, /decline-offer, /resubmit; POST /conference-slots/{id}/book"

  - priority: 4
    category: existence
    check: "Path/body-referenced resources exist (validated left-to-right in the path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or body FK"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_classroom_version on POST /staff-assignments equals the current Classroom.version"
    error_id: ERR_STALE_CLASSROOM_VERSION
    http_status: 412
    applies_to: "POST /staff-assignments"

  - priority: 7
    category: business_referential
    check: "Classroom.level == TuitionTier.level for the application's tier; and tier.active == true at offer/accept time"
    error_id: ERR_TIER_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /applications, /applications/{id}/waitlist, /offer, /accept-offer"

  - priority: 8
    category: business_constraint
    check: "Student age in months (derived from clock) is within [Classroom.min_age_months, Classroom.max_age_months] inclusive"
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /applications, /applications/{id}/waitlist, /offer"

  - priority: 9
    category: business_safety
    check: "Classroom.compliance_status == COMPLIANT before a seat is offered/accepted/returned (ratio/licensing gate)"
    error_id: ERR_CLASSROOM_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /applications/{id}/offer, /accept-offer; POST /enrollments/{id}/return; POST /classrooms/{id}/promote-waitlist"

  - priority: 10
    category: business_temporal
    check: "ConferenceSlot booking does not overlap (half-open [start_at, end_at)) any other BOOKED slot for the same guide_user_id"
    error_id: ERR_GUIDE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /conference-slots/{id}/book"

  - priority: 11
    category: business_temporal
    check: "Observation window does not overlap (closed-interval: shared endpoints DO conflict) any other Observation window for the same classroom_id"
    error_id: ERR_OBSERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /observations"

  - priority: 12
    category: business_temporal
    check: "ConferenceSlot end_at > start_at; Observation window_end_at > window_start_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /conference-slots, POST /observations"

  - priority: 13
    category: business_constraint
    check: "Classroom.placed_count < Classroom.capacity before placing (offer/accept/return/promote)"
    error_id: ERR_CLASSROOM_FULL
    http_status: 409
    applies_to: "POST /applications/{id}/offer, /accept-offer; POST /enrollments/{id}/return; POST /classrooms/{id}/promote-waitlist"

  - priority: 14
    category: business_fiscal
    check: "A DEPOSIT Payment amount_cents must equal Enrollment.deposit_cents; deposit may be posted only while billing_status == DEPOSIT_DUE"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payments"

  - priority: 15
    category: business_fiscal
    check: "RefundRequest may be created only for an Enrollment whose placement_status == WITHDRAWN; only one non-VOID RefundRequest per enrollment"
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /refund-requests"

  - priority: 16
    category: business_constraint
    check: "Pagination params within bounds (limit 1..100, offset >= 0); unknown enum values rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# ===========================================================================
# §1.5 API ENDPOINT TABLE
# ===========================================================================
endpoints:
  # ---- TuitionTier ----
  - method: POST
    path: "/montessori/tiers"
    description: "Create a tuition tier"
    roles: [Registrar]
    code: 201
    input: [code, level, base_annual_cents, deposit_pct, "installments?", "extended_day_annual_cents?", "active?"]
    output: TuitionTier
    side_effects: []
  - method: GET
    path: "/montessori/tiers/{id}"
    description: "Fetch a tuition tier"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: TuitionTier
    side_effects: []
  - method: GET
    path: "/montessori/tiers"
    description: "List tuition tiers"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: ["level?", "active?", "limit?", "offset?"]
    output: TuitionTier[]
    side_effects: []

  # ---- Classroom ----
  - method: POST
    path: "/montessori/classrooms"
    description: "Create a classroom"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, level, capacity, min_age_months, max_age_months]
    output: Classroom
    side_effects: ["initializes placed_count=0, assigned_staff_count=0, compliance_status=COMPLIANT"]
  - method: GET
    path: "/montessori/classrooms/{id}"
    description: "Fetch a classroom (includes computed placed_count, assigned_staff_count, compliance_status)"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: Classroom
    side_effects: []
  - method: GET
    path: "/montessori/classrooms"
    description: "List classrooms"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: ["level?", "compliance_status?", "limit?", "offset?"]
    output: Classroom[]
    side_effects: []
  - method: GET
    path: "/montessori/classrooms/{id}/staff-assignments"
    description: "List StaffAssignments for a classroom (FK reverse-reachability for StaffAssignment.classroom_id; this sub-resource is the only reverse path for that FK)"
    roles: [Registrar, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []
  - method: POST
    path: "/montessori/classrooms/{id}/promote-waitlist"
    description: "Manually trigger a waitlist promotion sweep for a classroom: selects the top-ranked WAITLISTED Application and transitions it WAITLISTED -> OFFERED"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["selects top-ranked WAITLISTED Application (waitlist_priority selector), transitions it OFFERED, increments that Application.version"]

  # ---- Student ----
  - method: POST
    path: "/montessori/students"
    description: "Register a student (Parent creates own child; parent_user_id is set to the acting Parent)"
    roles: [Parent, Registrar]
    code: 201
    input: [parent_user_id, full_name, date_of_birth, "sibling_of_student_id?", "staff_child?"]
    output: Student
    side_effects: []
  - method: GET
    path: "/montessori/students/{id}"
    description: "Fetch a student"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/montessori/students"
    description: "List students; filter by parent_user_id (reverse-reachability for Student.parent_user_id) or sibling_of_student_id (self-ref reverse-reachability)"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: ["parent_user_id?", "sibling_of_student_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/montessori/applications"
    description: "Submit an application for a student to a classroom+tier"
    roles: [Parent, Registrar]
    code: 201
    input: [student_id, classroom_id, tier_id, "extended_day_opt_in?", "financial_aid_pct?"]
    output: Application
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/montessori/applications/{id}"
    description: "Fetch an application"
    roles: [Registrar, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/montessori/applications"
    description: "List applications; filter by student_id (FK reverse-reachability for Application.student_id), tier_id (Application.tier_id), enrollment_id (Application.enrollment_id), classroom_id (Application.classroom_id), or status"
    roles: [Registrar, ComplianceOfficer, Parent]
    code: 200
    input: ["student_id?", "status?", "classroom_id?", "tier_id?", "enrollment_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/montessori/applications/{id}/start-review"
    description: "Registrar moves SUBMITTED -> UNDER_REVIEW"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]
  - method: POST
    path: "/montessori/applications/{id}/request-changes"
    description: "Registrar moves UNDER_REVIEW -> CHANGES_REQUESTED"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]
  - method: POST
    path: "/montessori/applications/{id}/resubmit"
    description: "Parent moves CHANGES_REQUESTED -> UNDER_REVIEW (closes revision cycle)"
    roles: [Parent]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]
  - method: POST
    path: "/montessori/applications/{id}/waitlist"
    description: "Registrar moves UNDER_REVIEW -> WAITLISTED; stamps waitlisted_at and computes priority_score"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["sets waitlisted_at, computes priority_score (waitlist_priority calc), increments version"]
  - method: POST
    path: "/montessori/applications/{id}/offer"
    description: "Registrar moves UNDER_REVIEW -> OFFERED directly (open compliant seat)"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]
  - method: POST
    path: "/montessori/applications/{id}/decline"
    description: "Registrar moves UNDER_REVIEW -> DECLINED"
    roles: [Registrar]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]
  - method: POST
    path: "/montessori/applications/{id}/accept-offer"
    description: "Parent moves OFFERED -> ENROLLED; creates Enrollment, computes tuition/deposit, places the child, bumps classroom counts"
    roles: [Parent]
    code: 200
    input: [program_start_date]
    output: Enrollment
    side_effects:
      - "creates Enrollment (placement_status=PLACED, billing_status=DEPOSIT_DUE)"
      - "computes net_annual_cents/monthly_installment_cents (tuition_net) and deposit_cents (deposit)"
      - "sets Application.enrollment_id, status=ENROLLED"
      - "increments Classroom.placed_count, recomputes compliance_status (ratio_compliance)"
      - "increments Application.version"
  - method: POST
    path: "/montessori/applications/{id}/decline-offer"
    description: "Parent moves OFFERED -> DECLINED"
    roles: [Parent]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version"]

  # ---- Enrollment ----
  - method: GET
    path: "/montessori/enrollments/{id}"
    description: "Fetch an enrollment (includes computed tuition/deposit/paid_to_date fields)"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/montessori/enrollments"
    description: "List enrollments; filter by student_id (FK reverse-reachability for Enrollment.student_id), application_id (Application.enrollment_id reverse-reachability), tier_id (TuitionTier reverse-reachability)"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: ["student_id?", "application_id?", "classroom_id?", "tier_id?", "placement_status?", "billing_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/montessori/enrollments/{id}/leave"
    description: "Registrar moves placement PLACED -> ON_LEAVE; frees a seat"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["decrements Classroom.placed_count, recomputes compliance_status, increments version"]
  - method: POST
    path: "/montessori/enrollments/{id}/return"
    description: "Registrar moves placement ON_LEAVE -> PLACED; re-places into a compliant open seat"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["increments Classroom.placed_count, recomputes compliance_status, increments version"]
  - method: POST
    path: "/montessori/enrollments/{id}/withdraw"
    description: "Registrar moves placement -> WITHDRAWN; frees the seat, triggers auto waitlist promotion cascade, withdraws the linked Application"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "if was PLACED: decrements Classroom.placed_count, recomputes compliance_status (ratio_compliance)"
      - "auto-promotes top-ranked WAITLISTED Application of the classroom to OFFERED (cascade depth 3)"
      - "sets linked Application.status=WITHDRAWN"
      - "increments Enrollment.version"
  - method: POST
    path: "/montessori/enrollments/{id}/mark-past-due"
    description: "Registrar moves billing ACTIVE -> PAST_DUE"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["increments Enrollment.version"]

  # ---- Payment ----
  - method: POST
    path: "/montessori/payments"
    description: "Capture a deposit or installment payment for an enrollment; may auto-advance billing_status"
    roles: [Registrar, Parent]
    code: 201
    input: [enrollment_id, kind, amount_cents]
    output: Payment
    side_effects:
      - "recomputes Enrollment.paid_to_date_cents (paid_to_date)"
      - "if DEPOSIT of exact deposit_cents while DEPOSIT_DUE: billing_status DEPOSIT_DUE -> ACTIVE"
      - "if INSTALLMENT while PAST_DUE: billing_status PAST_DUE -> ACTIVE"
      - "increments Enrollment.version"
  - method: GET
    path: "/montessori/payments/{id}"
    description: "Fetch a payment"
    roles: [Registrar, Parent]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/montessori/payments"
    description: "List payments; filter by enrollment_id (FK reverse-reachability for Payment.enrollment_id)"
    roles: [Registrar, Parent]
    code: 200
    input: ["enrollment_id?", "status?", "kind?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- RefundRequest ----
  - method: POST
    path: "/montessori/refund-requests"
    description: "Create a refund computation for a WITHDRAWN enrollment under the chosen method"
    roles: [Registrar]
    code: 201
    input: [enrollment_id, effective_date, method]
    output: RefundRequest
    side_effects: ["computes earned_cents, refund_cents, balance_due_cents (refund_amount calc)"]
  - method: GET
    path: "/montessori/refund-requests/{id}"
    description: "Fetch a refund request"
    roles: [Registrar, Parent]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: GET
    path: "/montessori/refund-requests"
    description: "List refund requests; filter by enrollment_id (FK reverse-reachability for RefundRequest.enrollment_id)"
    roles: [Registrar, Parent]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: POST
    path: "/montessori/refund-requests/{id}/approve"
    description: "Registrar moves COMPUTED -> APPROVED"
    roles: [Registrar]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["increments RefundRequest.version"]
  - method: POST
    path: "/montessori/refund-requests/{id}/pay"
    description: "Registrar moves APPROVED -> PAID; marks Payments REFUNDED, recomputes paid_to_date, settles billing"
    roles: [Registrar]
    code: 200
    input: []
    output: RefundRequest
    side_effects:
      - "marks CAPTURED Payments REFUNDED in created_at ASC order up to refund_cents (compensation)"
      - "recomputes Enrollment.paid_to_date_cents (paid_to_date) preserving refund_conservation"
      - "transitions Enrollment billing_status -> SETTLED"
      - "increments RefundRequest.version"
  - method: POST
    path: "/montessori/refund-requests/{id}/void"
    description: "Registrar moves COMPUTED -> VOID"
    roles: [Registrar]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["increments RefundRequest.version"]

  # ---- StaffAssignment ----
  - method: POST
    path: "/montessori/staff-assignments"
    description: "Assign a staff member to a classroom (OCC on Classroom.version); recomputes compliance"
    roles: [ComplianceOfficer]
    code: 201
    input: [classroom_id, staff_name, expected_classroom_version]
    output: StaffAssignment
    side_effects:
      - "increments Classroom.assigned_staff_count, recomputes compliance_status (ratio_compliance)"
      - "increments Classroom.version by 1"
  - method: GET
    path: "/montessori/staff-assignments/{id}"
    description: "Fetch a staff assignment"
    roles: [Registrar, ComplianceOfficer]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/montessori/staff-assignments/{id}/end"
    description: "End an ACTIVE staff assignment; recomputes compliance"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_classroom_version]
    output: StaffAssignment
    side_effects:
      - "sets status=ENDED, decrements Classroom.assigned_staff_count, recomputes compliance_status (ratio_compliance)"
      - "increments Classroom.version by 1"

  # ---- AssessmentRecord ----
  - method: POST
    path: "/montessori/assessment-records"
    description: "Guide records a work-cycle assessment for a student"
    roles: [Guide]
    code: 201
    input: [student_id, enrollment_id, work_area, mastery_level, work_cycle_date, "portfolio_included?"]
    output: AssessmentRecord
    side_effects: []
  - method: GET
    path: "/montessori/assessment-records/{id}"
    description: "Fetch an assessment record"
    roles: [Registrar, Guide, Parent]
    code: 200
    input: []
    output: AssessmentRecord
    side_effects: []
  - method: GET
    path: "/montessori/assessment-records"
    description: "List assessment records; filter by enrollment_id (FK reverse-reachability for AssessmentRecord.enrollment_id) or student_id"
    roles: [Registrar, Guide, Parent]
    code: 200
    input: ["student_id?", "enrollment_id?", "work_area?", "limit?", "offset?"]
    output: AssessmentRecord[]
    side_effects: []

  # ---- ConferenceSlot ----
  - method: POST
    path: "/montessori/conference-slots"
    description: "Guide opens a conference slot"
    roles: [Guide]
    code: 201
    input: [guide_user_id, classroom_id, start_at, end_at]
    output: ConferenceSlot
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/montessori/conference-slots/{id}"
    description: "Fetch a conference slot"
    roles: [Registrar, Guide, Parent]
    code: 200
    input: []
    output: ConferenceSlot
    side_effects: []
  - method: GET
    path: "/montessori/conference-slots"
    description: "List conference slots; filter by guide_user_id (FK reverse-reachability for ConferenceSlot.guide_user_id) or booked_student_id"
    roles: [Registrar, Guide, Parent]
    code: 200
    input: ["guide_user_id?", "classroom_id?", "status?", "booked_student_id?", "limit?", "offset?"]
    output: ConferenceSlot[]
    side_effects: []
  - method: POST
    path: "/montessori/conference-slots/{id}/book"
    description: "Parent books an OPEN slot for their enrolled child"
    roles: [Parent]
    code: 200
    input: [booked_student_id]
    output: ConferenceSlot
    side_effects: ["status=BOOKED, sets booked_student_id, increments version"]
  - method: POST
    path: "/montessori/conference-slots/{id}/complete"
    description: "Guide marks a BOOKED slot COMPLETED"
    roles: [Guide]
    code: 200
    input: []
    output: ConferenceSlot
    side_effects: ["increments version"]
  - method: POST
    path: "/montessori/conference-slots/{id}/no-show"
    description: "Guide marks a BOOKED slot NO_SHOW (only after end_at)"
    roles: [Guide]
    code: 200
    input: []
    output: ConferenceSlot
    side_effects: ["increments version"]
  - method: POST
    path: "/montessori/conference-slots/{id}/cancel"
    description: "Guide cancels an OPEN or BOOKED slot"
    roles: [Guide]
    code: 200
    input: []
    output: ConferenceSlot
    side_effects: ["clears booked_student_id, increments version"]

  # ---- Observation ----
  - method: POST
    path: "/montessori/observations"
    description: "Schedule a parent classroom observation window (closed-interval overlap guard per classroom)"
    roles: [Registrar, ComplianceOfficer]
    code: 201
    input: [classroom_id, observer_name, window_start_at, window_end_at]
    output: Observation
    side_effects: []
  - method: GET
    path: "/montessori/observations/{id}"
    description: "Fetch an observation"
    roles: [Registrar, ComplianceOfficer]
    code: 200
    input: []
    output: Observation
    side_effects: []
  - method: GET
    path: "/montessori/observations"
    description: "List observations; filter by classroom_id"
    roles: [Registrar, ComplianceOfficer]
    code: 200
    input: ["classroom_id?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/montessori/_clock/set_current_utc"
    description: "Set the server logical clock to an explicit UTC instant. The startup default before any call is 2026-04-01T00:00:00Z; the clock never falls back to wall-clock time. Drives age-in-months derivation, waitlist tenure, payment captured_at, no-show eligibility, and refund accrual deterministically."
    roles: [Registrar, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock used by all time-dependent calculations"]
  - method: GET
    path: "/montessori/_clock"
    description: "Read the current logical clock"
    roles: [Registrar, Guide, ComplianceOfficer, Parent]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

# ===========================================================================
# §1.6 ERROR CODE CATALOG
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting Parent does not own the Student/resource being acted on"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or body FK) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_STALE_CLASSROOM_VERSION
    http: 412
    condition: "expected_classroom_version does not match current Classroom.version (OCC)"
  - id: ERR_TIER_LEVEL_MISMATCH
    http: 422
    condition: "Classroom.level != TuitionTier.level, or tier.active == false at offer/accept"
  - id: ERR_AGE_OUT_OF_RANGE
    http: 422
    condition: "Student age in months outside [min_age_months, max_age_months]"
  - id: ERR_CLASSROOM_NOT_COMPLIANT
    http: 409
    condition: "Classroom.compliance_status != COMPLIANT when a placement is attempted"
  - id: ERR_CLASSROOM_FULL
    http: 409
    condition: "Classroom.placed_count >= Classroom.capacity when a placement is attempted"
  - id: ERR_GUIDE_DOUBLE_BOOKED
    http: 409
    condition: "Booking overlaps (half-open) another BOOKED slot for the same guide"
  - id: ERR_OBSERVATION_OVERLAP
    http: 409
    condition: "Observation window overlaps (closed-interval) another window for the same classroom"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Interval end is not strictly after start"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "DEPOSIT payment amount != Enrollment.deposit_cents, or deposit posted when billing_status != DEPOSIT_DUE"
  - id: ERR_REFUND_NOT_ELIGIBLE
    http: 409
    condition: "Enrollment not WITHDRAWN, or a non-VOID RefundRequest already exists for it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, invalid enum, out-of-range pagination, missing required field, or invalid numeric value"

# ===========================================================================
# §1.7 RBAC MATRIX
# ===========================================================================
roles:
  - name: Registrar
    description: "Enrollment/admissions operations: applications lifecycle, offers, enrollment placement, payments, refunds, manual waitlist promotion."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/start-review, /request-changes, /waitlist, /offer, /decline"
      - "POST /classrooms/{id}/promote-waitlist"
      - "POST /enrollments/{id}/leave, /return, /withdraw, /mark-past-due"
      - "POST /refund-requests and /approve, /pay, /void"
      - "POST /tiers"
    shared_operations:
      - "POST /students, /applications, /payments"
      - "GET reads across tiers, classrooms, students, applications, enrollments, payments, refund-requests, assessment-records, conference-slots, observations, staff-assignments"

  - name: Guide
    description: "Montessori teacher: records assessments/portfolio, opens/runs conference slots. X-User-ID is the opaque guide id stored on ConferenceSlot.guide_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /assessment-records"
      - "POST /conference-slots and /complete, /no-show, /cancel"
    shared_operations:
      - "GET reads across tiers, classrooms, students, enrollments, assessment-records, conference-slots"

  - name: ComplianceOfficer
    description: "Licensing/ratio compliance: manages classrooms, staff assignments, observations."
    identity: opaque
    exclusive_operations:
      - "POST /classrooms"
      - "POST /staff-assignments and /end"
      - "POST /observations"
    shared_operations:
      - "GET reads across classrooms, students, applications, enrollments, staff-assignments, observations, conference-slots, tiers"

  - name: Parent
    description: "Family member acting on their own Student/Application: registers child, applies, accepts/declines offers, resubmits, pays, books conferences. X-User-ID is the opaque parent id stored on Student.parent_user_id; ownership = X-User-ID == Student.parent_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/resubmit, /accept-offer, /decline-offer"
      - "POST /conference-slots/{id}/book"
    shared_operations:
      - "POST /students, /applications, /payments"
      - "GET reads of own students, applications, enrollments, payments, refund-requests, assessment-records, conference-slots, tiers, classrooms"
