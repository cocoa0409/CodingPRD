      - name: nineteen_units_at_list_price_cost_the_same_as_twenty_at_the_first_discount
        claim_type: tiered_pricing
        grounds:
          - calculations.batch_purchase_price
          - endpoints[POST /access-code-batches]
        distinguishing_aspect: |
          The first VOLUME_DISCOUNT_TIERS boundary is quantity >= 20 at 0.05, and it is a whole-order
          discount, not a marginal one: 19 EXAM_ONLY units cost 68400 + 3078 == 71478 and 20 units cost
          round_half_up(72000 * 0.95) == 68400 plus the same 3078 == 71478. The 20th code is therefore
          free, and an implementation that discounts only the units above 19 (or applies the tier at
          quantity > 20) produces 75240 or 71478 for the wrong reason.
        test_recipe:
          setup:
            - "Baseline jurisdiction (exam_fee_surcharge_pct 0.045) and one provider prepaid 500000."
            - "One EN exam form to purchase against."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
          trigger:
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 19 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { b19: $.data.id, t19: $.data.total_price_cents, q19: $.data.quantity_purchased }
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 20 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { b20: $.data.id, t20: $.data.total_price_cents, q20: $.data.quantity_purchased }
          assert:
            - "the 19-unit batch: quantity_purchased == 19, total_price_cents == 71478 (subtotal 68400 at 0.00 discount plus surcharge 3078)"
            - "the 20-unit batch: quantity_purchased == 20, total_price_cents == 71478 (subtotal round_half_up(72000 * 0.95) == 68400 plus surcharge 3078)"
            - "t19 == t20 exactly — the tier applies to the whole order, so the marginal cost of the 20th unit is 0"
            - "both batches mint their codes: GET /access-codes?batch_id=${b19}&status=AVAILABLE returns total_count 19 and GET /access-codes?batch_id=${b20}&status=AVAILABLE returns total_count 20"
            - "TrainingProvider.${prov_id}: lifetime_charged_cents == 142956 and credit_balance_cents == 357044"
