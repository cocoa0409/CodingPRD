              as: StudentServicesDirector
              as_user_id: "ssd_1"
              captures: { plan_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - call: "POST /re-entry-plans/${plan_id}/activate"
              payload: {}
              as: StudentServicesDirector
              as_user_id: "ssd_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLACEMENT_NOT_ACTIVE (HTTP 409): plan activation gated on placement.status == ACTIVE while placement is PLACED"
            - "ReEntryPlan ${plan_id} remains DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: half-open pairwise officer calendar vs
  # closed-interval aggregate site capacity (different semantics, different
  # resources).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_officer_half_open_adjacency_allowed
        grounds:
          - "errors[ERR_HEARING_OVERLAP]"
          - entities.ExpulsionHearing.fields.scheduled_start
          - entities.ExpulsionHearing.fields.scheduled_end
        distinguishing_aspect: |
          Resource = hearing officer calendar; interval semantics = half-open
          [start, end): a second hearing starting exactly when the first ends
          (12:00 == 12:00) does NOT overlap and is accepted.
        test_recipe:
