  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_check_beats_fiscal_quota_check_on_referral_review
        grounds:
          - validations[priority=11]
          - validations[priority=28]
          - errors[ERR_REFERRAL_NOT_SUBMITTED]
          - errors[ERR_AGENCY_QUOTA_EXHAUSTED]
        distinguishing_aspect: |
          The failing pair here is category `state` (priority 11) against category
          `business_fiscal` (priority 28): one request violates both rules at once - the referral
          is already APPROVED and the agency's quota is fully consumed - and the response must be
          ERR_REFERRAL_NOT_SUBMITTED, never ERR_AGENCY_QUOTA_EXHAUSTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "PartnerAgency CENTRAL with quarterly_voucher_quota exactly 1."
            - "One Referral that has been SUBMITTED and then APPROVED, so its status is APPROVED and agency.quota_used is 1, equal to the quota."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Quarry Road Partners", county: "CENTRAL", quarterly_voucher_quota: 1 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
