# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Juice & Beverage Bottling Plant
# Breadth probe: enumerates every testable claim of §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). excluded_because stubs
# cite the covering §1.8 instance by "rule_id / instance_name".
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities (claim-extraction-guide Table 1)
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_defaults_and_pallet_account
        claim_type: creation
        grounds:
          - entities.CustomerAccount.fields.status
          - entities.CustomerAccount.fields.outstanding_balance_cents
          - entities.PalletAccount.fields.customer_id
        distinguishing_aspect: |
          POST /v1/customer-accounts returns 201 with status PENDING_CREDIT,
          outstanding_balance_cents 0, version 1, and a prefix-less UUID id;
          exactly one PalletAccount is auto-created alongside (FK reverse GET
          returns a 1-element array with all counters 0).
        test_recipe:
          setup:
            - "Empty DB; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Corner One", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id, cust_status: $.data.status, cust_out: $.data.outstanding_balance_cents, cust_v: $.data.version } }
          trigger:
            - { call: "GET /v1/customer-accounts/${cust_id}/pallet-account", payload: {}, as: Any, captures: { pa_list: "$.data", pa_id: "$.data[0].id", pa_out: "$.data[0].pallets_outstanding", pa_esc: "$.data[0].escrow_balance_cents", pa_ship: "$.data[0].pallets_out_total", pa_ret: "$.data[0].pallets_returned_total", pa_conv: "$.data[0].pallets_converted_total" } }
          assert:
            - "cust_status == PENDING_CREDIT (initial_state)"
            - "cust_out == 0 and cust_v == 1"
            - "CustomerAccount.${cust_id}.id is a server-minted UUID with no type prefix"
            - "PalletAccount array has exactly 1 element with customer_id == ${cust_id}"
            - "pa_out == 0, pa_ship == 0, pa_ret == 0, pa_conv == 0, pa_esc == 0"

      - name: formula_create_defaults
        claim_type: creation
        grounds:
          - entities.Formula.fields.label_version
          - entities.Formula.fields.status
          - entities.Formula.fields.submitted_by_user_id
        distinguishing_aspect: |
          A new formula starts DRAFT with label_version 0, version 1, and
          submitted_by_user_id null — the SoD marker is only stamped by a
          submit-label-review call.
        test_recipe:
          setup:
            - "One customer exists (PENDING_CREDIT is sufficient; formula creation has no customer-status gate)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Formula Corner", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "FC-1", name: "Corner Cola", target_brix: 11.0, brix_tolerance: 0.2, process_type: "PASTEURIZATION", container_fill_ml: 355, concentrate_brix: 60.0, allergen_group: "SULFITE", shelf_life_days: 60, claims: ["NO_ADDED_SUGAR"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, f_status: $.data.status, f_lv: $.data.label_version, f_v: $.data.version, f_sub: $.data.submitted_by_user_id, f_allergen: $.data.allergen_group } }
          assert:
            - "f_status == DRAFT (initial_state)"
            - "f_lv == 0 and f_v == 1"
            - "f_sub is null (no submission yet)"
            - "f_allergen == SULFITE (input enum stored verbatim)"

      - name: batch_create_side_effects_and_copies
        claim_type: creation
        grounds:
          - entities.Batch.fields.initial_quantity_liters
          - state_machines.BlendingTank.AVAILABLE_to_OCCUPIED
        distinguishing_aspect: |
          Batch creation copies quantity_liters into initial_quantity_liters
          (mass-balance anchor), zeroes the adjustment counters, and flips the
          tank AVAILABLE -> OCCUPIED with allergen_group copied from the formula.
        test_recipe:
          setup:
            - "Customer and TREE_NUT formula exist (DRAFT formula is enough for batch creation); tank T-E3 cap 5000 AVAILABLE"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Batch Corner", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "BC-1", name: "Nut Blend", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "TREE_NUT", shelf_life_days: 90, claims: ["NON_GMO"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-E3", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
          trigger:
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1500 }, as: BlendOperator, captures: { batch_id: $.data.id, b_status: $.data.status, b_init: $.data.initial_quantity_liters, b_count: $.data.adjustment_count, b_water: $.data.added_water_liters, b_brix: $.data.measured_brix, b_link: $.data.linked_run_id } }
            - { call: "GET /v1/blending-tanks/${tank_id}", payload: {}, as: Any, captures: { t_posture: $.data.posture, t_batch: $.data.occupying_batch_id, t_allergen: $.data.allergen_group } }
          assert:
            - "b_status == PLANNED (initial_state) and b_init == 1500 (copied anchor)"
            - "b_count == 0, b_water == 0, b_brix is null, b_link is null"
            - "t_posture == OCCUPIED and t_batch == ${batch_id}"
            - "t_allergen == TREE_NUT (copied from formula.allergen_group at occupation)"

      - name: container_lot_line_zone_create_defaults
        claim_type: creation
        grounds:
          - entities.ContainerLot.fields.quantity_available
          - entities.BottlingLine.fields.status
          - entities.WarehouseZone.fields.pallets_stored
        distinguishing_aspect: |
          ContainerLot starts RECEIVED with quantity_available == received and
          reserved/consumed 0; BottlingLine starts ACTIVE; WarehouseZone starts
          with pallets_stored 0.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 8000, supplier_lot_code: "SUP-E4" }, as: WarehouseLead, captures: { clot_id: $.data.id, cl_status: $.data.status, cl_avail: $.data.quantity_available, cl_res: $.data.quantity_reserved, cl_cons: $.data.quantity_consumed } }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-E4", supported_container_types: ["CAN_330", "PET_473"], nominal_cpm: 300 }, as: PlantManager, captures: { line_id: $.data.id, l_status: $.data.status } }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-E4", temperature_class: "FROZEN", pallet_capacity: 40 }, as: PlantManager, captures: { zone_id: $.data.id, z_stored: $.data.pallets_stored } }
          assert:
            - "cl_status == RECEIVED and cl_avail == 8000 and cl_res == 0 and cl_cons == 0"
            - "l_status == ACTIVE (initial_state)"
            - "z_stored == 0 (computed field initialized)"

      - name: run_and_order_initial_states
        claim_type: initial_state
        grounds:
          - entities.ProductionRun.fields.production_status
          - entities.ProductionRun.fields.invoice_status
          - entities.ShipmentOrder.fields.status
        distinguishing_aspect: |
          A new ProductionRun starts with production_status QUOTED and the
          parallel invoice_status NOT_INVOICED; a new ShipmentOrder starts
          PLACED with empty allocations and allocated_units 0.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula owned by that customer (order/run creation does not gate on formula status)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "InitCorner", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "IC-1", name: "Init Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
          trigger:
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, r_prod: $.data.production_status, r_inv: $.data.invoice_status, r_v: $.data.version } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "CLUB", requested_delivery_date: "2026-08-15", units_requested: 240 }, as: CustomerServiceRep, captures: { ord_id: $.data.id, o_status: $.data.status, o_alloc: $.data.allocated_units, o_allocs: $.data.allocations, o_v: $.data.version } }
          assert:
            - "r_prod == QUOTED and r_inv == NOT_INVOICED (both initial states) and r_v == 1"
            - "o_status == PLACED and o_alloc == 0 and o_allocs == [] and o_v == 1"

      - name: channel_min_shelf_life_derivation
        claim_type: computed_fields
        grounds:
          - entities.ShipmentOrder.fields.min_shelf_life_days
          - calculations.fefo_allocation
        distinguishing_aspect: |
          min_shelf_life_days is derived from channel at order creation:
          CLUB -> 45 and FOODSERVICE -> 21 (DIRECT_RETAIL 30 / EXPORT 60 are
          asserted by the §1.8 instance shelf_life_label_vs_stability_export).
        test_recipe:
          setup:
            - "ACTIVE customer with a DRAFT formula"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ChannelCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CH-1", name: "Channel Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
          trigger:
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "CLUB", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerServiceRep, captures: { o_club: $.data.min_shelf_life_days } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "FOODSERVICE", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerServiceRep, captures: { o_fs: $.data.min_shelf_life_days } }
          assert:
            - "o_club == 45 (MIN_SHELF_CLUB constant applied)"
            - "o_fs == 21 (MIN_SHELF_FOODSERVICE constant applied)"

      - name: required_fields_and_enum_validation
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=1]
        distinguishing_aspect: |
          Missing required input fields and invalid enum members are rejected
          with ERR_INVALID_REQUEST (400): customer without credit_limit_cents,
          formula with process_type ULTRA, order with channel WHOLESALE, batch
          without tank_id.
        test_recipe:
          setup:
            - "ACTIVE customer with one formula (needed so enum/body checks are reached on existing parents)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ReqCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RQ-1", name: "Req Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
          trigger:
            - { call: "POST /v1/customer-accounts", payload: { name: "NoLimit", minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { err1: $.data.error_id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RQ-2", name: "Bad Enum", target_brix: 12.0, brix_tolerance: 0.3, process_type: "ULTRA", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { err2: $.data.error_id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "WHOLESALE", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerServiceRep, captures: { err3: $.data.error_id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { err4: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST, HTTP 400 (missing credit_limit_cents)"
            - "err2 == ERR_INVALID_REQUEST, HTTP 400 (process_type ULTRA not an enum member)"
            - "err3 == ERR_INVALID_REQUEST, HTTP 400 (channel WHOLESALE not an enum member)"
            - "err4 == ERR_INVALID_REQUEST, HTTP 400 (missing tank_id)"

      - name: conditional_setpoint_requirement_per_process_type
        claim_type: required_fields
        grounds:
          - entities.ProcessRun.fields.setpoint_temp_c
          - entities.ProcessRun.fields.setpoint_pressure_mpa
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Conditional requiredness: a PASTEURIZATION process run without
          setpoint_temp_c/setpoint_hold_seconds and an HPP run without
          setpoint_pressure_mpa/setpoint_pressure_hold_seconds are both
          ERR_INVALID_REQUEST; supplying the right pair succeeds.
        test_recipe:
          setup:
            - "Customer; PASTE formula FP and HPP formula FH (DRAFT ok); batch BP of FP QA_PASSED; batch BH of FH QA_PASSED"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "SetpointCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SP-P", name: "Paste", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_p: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SP-H", name: "HPP", target_brix: 8.0, brix_tolerance: 0.3, process_type: "HPP", container_fill_ml: 473, concentrate_brix: 60.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["COLD_PRESSED"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_h: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-SP1", capacity_liters: 5000 }, as: PlantManager, captures: { tank_p: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-SP2", capacity_liters: 5000 }, as: PlantManager, captures: { tank_h: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_p}", tank_id: "${tank_p}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_p: $.data.id } }
            - { call: "POST /v1/batches/${batch_p}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_p}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_p}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_h}", tank_id: "${tank_h}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_h: $.data.id } }
            - { call: "POST /v1/batches/${batch_h}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_h}/record-blend", payload: { measured_brix: 8.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_h}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_p}" }, as: BlendOperator, captures: { err_p: $.data.error_id } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_h}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { err_h: $.data.error_id } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_p}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_p: $.data.id, prun_p_type: $.data.process_type } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_h}", setpoint_pressure_mpa: 600.0, setpoint_pressure_hold_seconds: 180 }, as: BlendOperator, captures: { prun_h: $.data.id, prun_h_type: $.data.process_type } }
          assert:
            - "err_p == ERR_INVALID_REQUEST, HTTP 400 (PASTEURIZATION requires temp setpoints)"
            - "err_h == ERR_INVALID_REQUEST, HTTP 400 (HPP run rejects temp setpoints / requires pressure setpoints)"
            - "prun_p created with prun_p_type == PASTEURIZATION (process_type copied from formula)"
            - "prun_h created with prun_h_type == HPP"

      - name: not_found_reads_across_entities
        claim_type: not_found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_FORMULA_NOT_FOUND]
          - errors[ERR_LABEL_REVIEW_NOT_FOUND]
          - errors[ERR_TANK_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_PROCESS_RUN_NOT_FOUND]
          - errors[ERR_CONTAINER_LOT_NOT_FOUND]
          - errors[ERR_LINE_NOT_FOUND]
          - errors[ERR_PRODUCTION_RUN_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_ZONE_NOT_FOUND]
          - errors[ERR_SHIPMENT_ORDER_NOT_FOUND]
          - errors[ERR_PALLET_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: |
          Every GET-by-id endpoint maps an unknown UUID to its domain-specific
          404 error_id (existence priority 3) — thirteen distinct error codes,
          one per entity type.
        test_recipe:
          setup:
            - "Empty DB (no ids exist)"
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/customer-accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e1: $.data.error_id } }
            - { call: "GET /v1/formulas/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e2: $.data.error_id } }
            - { call: "GET /v1/label-reviews/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e3: $.data.error_id } }
            - { call: "GET /v1/blending-tanks/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e4: $.data.error_id } }
            - { call: "GET /v1/batches/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e5: $.data.error_id } }
            - { call: "GET /v1/process-runs/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e6: $.data.error_id } }
            - { call: "GET /v1/container-lots/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e7: $.data.error_id } }
            - { call: "GET /v1/bottling-lines/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e8: $.data.error_id } }
            - { call: "GET /v1/production-runs/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e9: $.data.error_id } }
            - { call: "GET /v1/finished-good-lots/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e10: $.data.error_id } }
            - { call: "GET /v1/warehouse-zones/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e11: $.data.error_id } }
            - { call: "GET /v1/shipment-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e12: $.data.error_id } }
            - { call: "GET /v1/pallet-accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e13: $.data.error_id } }
          assert:
            - "e1 == ERR_CUSTOMER_NOT_FOUND, HTTP 404"
            - "e2 == ERR_FORMULA_NOT_FOUND, HTTP 404"
            - "e3 == ERR_LABEL_REVIEW_NOT_FOUND, HTTP 404"
            - "e4 == ERR_TANK_NOT_FOUND, HTTP 404"
            - "e5 == ERR_BATCH_NOT_FOUND, HTTP 404"
            - "e6 == ERR_PROCESS_RUN_NOT_FOUND, HTTP 404"
            - "e7 == ERR_CONTAINER_LOT_NOT_FOUND, HTTP 404"
            - "e8 == ERR_LINE_NOT_FOUND, HTTP 404"
            - "e9 == ERR_PRODUCTION_RUN_NOT_FOUND, HTTP 404"
            - "e10 == ERR_LOT_NOT_FOUND, HTTP 404"
            - "e11 == ERR_ZONE_NOT_FOUND, HTTP 404"
            - "e12 == ERR_SHIPMENT_ORDER_NOT_FOUND, HTTP 404"
            - "e13 == ERR_PALLET_ACCOUNT_NOT_FOUND, HTTP 404"

      - name: pallet_entry_immutable_shape
        claim_type: immutability
        grounds:
          - entities.PalletEntry
          - entities.PalletEntry.fields.running_balance
        distinguishing_aspect: |
          PalletEntry is common_fields: false — entries carry id and created_at
          but NO version/updated_at keys, and the ledger is append-only (no
          update endpoint exists); running_balance reflects the post-entry
          outstanding count.
        test_recipe:
          setup:
