              payload: { case_number: "26-20070", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/avoidance_actions"
              payload: { transferee_creditor_id: "${cred}", transfer_date: "2025-12-01T00:00:00Z", transfer_amount_cents: 100000, action_type: "PREFERENCE_547", demand_amount_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { act: $.data.id }
            - call: "POST /trustee/avoidance_actions/${act}/analyze"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/avoidance_actions/${act}/demand"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
          trigger:
            - call: "POST /trustee/avoidance_actions/${act}/settle"
              payload: { settled_amount_cents: 60000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { st: $.data.status, rec: $.data.recovered_amount_cents }
            - call: "GET /trustee/cases/${cid}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { cash: $.data.estate_cash_on_hand_cents }
            - call: "GET /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { comp_amt: "$.data[0].filed_amount_cents", comp_class: "$.data[0].priority_class" }
          assert:
            - "st == SETTLED"
            - "rec == 60000"
            - "cash == 60000"
            - "comp_amt == 40000   # compensating claim for the shortfall, visible immediately"
            - "comp_class == GENERAL_UNSECURED"
