              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-01", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version" }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
