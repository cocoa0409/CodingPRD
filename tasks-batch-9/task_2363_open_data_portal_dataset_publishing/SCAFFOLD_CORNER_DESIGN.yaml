  - section: state_machines
    instances:
      - name: dataset_request_review_defer_and_accept_path
        claim_type: valid_transition
        grounds:
          - state_machines.DatasetRequest.OPEN_to_UNDER_REVIEW
          - state_machines.DatasetRequest.UNDER_REVIEW_to_OPEN
          - state_machines.DatasetRequest.UNDER_REVIEW_to_ACCEPTED
          - calculations.request_demand_signal
        distinguishing_aspect: "The request walks OPEN -> UNDER_REVIEW -> OPEN (DEFER) -> UNDER_REVIEW -> ACCEPTED; the DEFER edge returns it to OPEN with its votes intact, so the second review passes the demand floor without any new vote."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Two registered members with vote_weight 2 each"
            - "One DatasetRequest filed by the first member and upvoted by both (weighted_vote_total 4, demand_signal 20.00)"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/members/register"
              payload: { email: "ana@civic.example", display_name: "Ana Reuser", organization: "Civic Data Lab" }
              as: Anonymous
