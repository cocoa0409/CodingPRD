              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-015", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-INV2", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-INV2", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 1000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /survey-runs/${run_id}/accept"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 30000.0, distance_to_building_feet: 2.0, bar_hole_reading_pct_lel: 40.0, is_migration_evidence: true }
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 500.0, distance_to_building_feet: 300.0, bar_hole_reading_pct_lel: 1.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 600.0, distance_to_building_feet: 350.0, bar_hole_reading_pct_lel: 1.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { pre_g1: $.data.open_grade1_count, pre_g3: $.data.open_grade3_count, pre_posture: $.data.posture }
          trigger:
            - call: "POST /pipe-segments/${seg_id}/out-of-service"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { post_g1: $.data.open_grade1_count, post_g2: $.data.open_grade2_count, post_g3: $.data.open_grade3_count, post_posture: $.data.posture }
          assert:
            - "pre_g1 == 1 AND pre_g3 == 2 AND pre_posture == CRITICAL"
            - "post_g1 == 0 AND post_g2 == 0 AND post_g3 == 0 (all counters cleared)"
            - "post_posture == NORMAL (posture recomputed to base)"
            - "All Leaks on segment have status == ABANDONED_SEGMENT (forward + compensating cascade left no drift)"
