  - rule_id: transitive_cascade
    instances:
      - name: cause_approval_cascade_depth3
        grounds:
          - state_machines.Charge.DETERMINATION_REVIEW_to_CONCILIATION
          - state_machines.Determination.PENDING_REVIEW_to_APPROVED
          - calculations.remedy_valuation
        distinguishing_aspect: |
          Depth-3 chain fired by the Director's APPROVE (a different trigger from
          the clock-driven evidence cascade): Determination APPROVED (A) moves
          Charge to CONCILIATION (B); entering CONCILIATION creates the
          ConciliationProcess INITIATED (C); C's creation computes the
          RemedyPackage PROVISIONAL (D). Each link is caused by the previous
          link, and D's numbers are verifiable to the cent (total 809904).
        test_recipe:
          setup:
            - "CA agency (300 days) so the 2026-03-05 incident is timely; employer steady at 60 staff (band FROM_20_TO_100 in both variants)"
            - "charge at DETERMINATION_REVIEW with a CAUSE draft (back 200000, front 100000, compensatory 400000, punitive 100000, harm_start 2026-03-05); clock advanced to 2026-11-01 before review"
