          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The parent version advances for a reason the client never sees — a personnel activation recomputing committed_effort_pct — so the stale disclosure create must be refused with 412 and must not be treated as a legitimate supersession; re-reading the parent then makes the identical payload succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; investigator INV read at version 1, then activated as PI on project P at 3.00 person-months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
