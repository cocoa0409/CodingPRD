              payload: { arbitrator_user_id: "arb-neutral-1", hearing_date: "2027-07-01T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
          assert:
            - "after setup: divergence_bps == 1000 exactly"
            - "trigger[0] returns ERR_DIVERGENCE_BELOW_THRESHOLD (409); no ArbitrationProceeding row exists and Lease.${lease_id}.rent_status stays REVALUATION_OPEN"
            - "trigger[1] returns 200: RentRevaluation.${reval_id}.status == RESOLVED, resolution_method MIDPOINT_SETTLEMENT, resolved_annual_base_rent_cents 11000000"
            - "after trigger[1]: Lease.${lease_id}.rent_status == RESET_APPLIED and current_annual_base_rent_cents == 11000000"

      - name: restoration_election_on_a_condemnation_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LossEvent.ADJUSTED_to_RESTORATION_ELECTED
          - errors.ERR_ELECTION_NOT_AVAILABLE
          - endpoints.POST_/portfolio/loss-events/{id}/election
        distinguishing_aspect: |
          A condemnation award has no restore-or-terminate choice - the taking already happened - so the
          election endpoint must refuse both RESTORE and TERMINATE on a CONDEMNATION event with its own
          code, while allocation remains available directly from ADJUSTED for exactly that reason.
        test_recipe:
          setup:
            - "One lease with a CONDEMNATION loss event adjusted to a 4000000 pool with method BONUS_VALUE."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
