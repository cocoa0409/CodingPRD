  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: loan_window_half_open_adjacency
        grounds:
          - validations[priority=12]
          - errors[ERR_LOAN_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource: the borrowing Member's loan schedule (p12 scans the
          member's own non-terminal reservations across ALL telescopes).
          Semantics: HALF-OPEN [start, end) — a new loan starting exactly
          when the member's prior loan ends (window_start == prior
          window_end) is LEGAL (touching windows do not intersect), while a
          one-hour earlier start conflicts. Different telescope on the
          second loan keeps p11 (telescope reservability) out of the way so
          p12 is the check under test.
        test_recipe:
          setup:
            - "Member ACTIVE dues-current, REFRACTOR cert; telescopes T1/T2 AVAILABLE; member's standing loan L1 RESERVED on T1 with window 08-05..08-09"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
