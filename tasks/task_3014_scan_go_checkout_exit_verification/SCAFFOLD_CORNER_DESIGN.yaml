  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: catalog_list_pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Pagination contract: limit=1 on a 2-item club catalog returns total_count 2 and has_more true; offset=1 returns the second page with has_more false."
        test_recipe:
          setup: ["Club with two catalog items"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club PG", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "A-1", item_name: "Item A", pricing_mode: "UNIT", unit_price_cents: 100 }
              as: PlatformAdmin
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "B-2", item_name: "Item B", pricing_mode: "UNIT", unit_price_cents: 200 }
              as: PlatformAdmin
          trigger:
            - call: "GET /clubs/${club_id}/catalog-items?limit=1&offset=0"
              as: PlatformAdmin
              captures: { total: $.total_count, more1: $.has_more }
            - call: "GET /clubs/${club_id}/catalog-items?limit=1&offset=1"
              as: PlatformAdmin
              captures: { more2: $.has_more }
          assert:
            - "total == 2 and more1 == true"
            - "more2 == false"

      - name: filtered_intercepts_list_by_session
        claim_type: listing
        grounds: [endpoints, entities.RestrictedIntercept.fields.session_id]
        distinguishing_aspect: "The flat filtered list GET /intercepts?session_id=... returns exactly the intercepts of that session (FK reverse reachability for RestrictedIntercept.session_id)."
