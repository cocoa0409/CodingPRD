              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "GET /abatement/sites/${site_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { site_v: $.data.version }
            - call: "POST /abatement/sites/${site_id}/notices"
              payload: { notice_type: "COST_RECOVERY_NOTICE", cure_days: 30, expected_site_version: "${site_v}", cost_recovery_id: "${cr_id}" }
              as: AbatementCoordinator
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /abatement/notices/${notice_id}/dispute"
              payload: { reason: "not my tag" }
              as: PropertyOwnerUser
              as_user_id: "${owner_id}"
          assert:
            - "Notice.${notice_id}.status == DISPUTED"
            - "CostRecovery.${cr_id}.status == DISPUTED"
            - "Site.${site_id}.outstanding_recovery_cents == 26565"

      - name: outstanding_recovery_reconciles_after_pay
        claim_type: derived_field_reconciliation
        grounds: [calculations.outstanding_recovery_total, state_machines.CostRecovery.ASSESSED_to_PAID]
        distinguishing_aspect: "Paying the only ASSESSED CostRecovery debits Site.outstanding_recovery_cents from 26565 to 0, reconciling the derived ledger, and closes the linked report."
        test_recipe:
          setup: ["A private site fully remediated (CostRecovery ASSESSED, recoverable 26565, outstanding 26565)."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.5, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/cost-recoveries/${cr_id}/pay"
              payload: {}
              as: PropertyOwnerUser
              as_user_id: "${owner_id}"
          assert:
            - "CostRecovery.${cr_id}.status == PAID"
            - "Site.${site_id}.outstanding_recovery_cents == 0"
            - "Report.${rep_id}.status == CLOSED"

      - name: hotspot_threshold_boundary_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Site.MONITORED_to_HOTSPOT]
        excluded_because:
          difficulty_instance: boundary_precision_check / hotspot_threshold_third_report_flips_hotspot
          rationale: "The >=3 report-count boundary that flips a site to HOTSPOT is asserted by the named §1.8 boundary instance."

      - name: material_exact_available_boundary_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=17]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / dispatch_material_exact_available_succeeds_boundary
          rationale: "The reserve-exactly-available boundary is asserted by the named §1.8 boundary instance."

      - name: cost_dual_variant_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.abatement_cost]
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_provisional_vs_final_on_costrecovery
          rationale: "Provisional-vs-final CostRecovery divergence is asserted by the named §1.8 dual-variant instance."

  # =================================================================
  - section: consistency_model
    instances:
      - name: dispatch_response_immediately_reflects_report_dispatched
        claim_type: immediate
        grounds: [state_machines.Report.TRIAGED_to_DISPATCHED]
        distinguishing_aspect: "Immediately after POST /abatement/work-orders returns, GET on the report shows status DISPATCHED and a PENDING CostRecovery exists — all cascades visible in the same request cycle."
        test_recipe:
          setup: ["A HIGH report triaged, an AVAILABLE crew, and ample material."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat_id}", quantity: 2.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/reports/${rep_id}"
