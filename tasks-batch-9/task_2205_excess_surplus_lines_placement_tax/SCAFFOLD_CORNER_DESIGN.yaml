          rationale: "The priority-8 concurrency check pre-empting the priority-9 state check is covered there with a fixture that violates both at once."

      - name: broker_license_cross_entity_validation_corner
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: batch_submission_depends_on_the_brokers_license_status
          rationale: "The priority-11 licence check reading the Broker's computed licence status at request time, in both the satisfied and violated direction, is covered there."

      - name: carrier_security_cross_entity_validation_corner
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: policy_issuance_depends_on_the_carriers_security_status
          rationale: "The priority-12 carrier security check across all four security_status values, including CONDITIONAL being accepted, is covered there."

      - name: temporal_validation_corner
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: policy_terms_on_one_placement_are_half_open_so_adjacency_is_legal
          rationale: "The priority-14 interval-overlap detection on successive policy terms, including the legal half-open adjacency case, is covered there; the sibling eligibility-window semantics are covered by eligibility_windows_are_closed_intervals_with_a_thirty_day_cooling_off_buffer."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: patching_a_state_program_rate_leaves_already_pinned_allocation_rows_alone
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/state-programs/{id}
          - calculations.premium_tax_and_stamping_fee
          - complexity_profile.complexity_layers.version_pinning_on_approval
        distinguishing_aspect: "PATCH updates only the fields present in the body and returns the whole StateProgram; but a policy whose tax was already calculated keeps premium_tax_rate_applied 0.0485 on its TX allocation row and total_tax_cents 38779, because rates are pinned at calculation time. A later endorsement still uses the pinned 0.0485, not the new 0.0600."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home ALLOCATED_MULTI policy with tax calculated (total_tax_cents 38779, TX allocation row pinned at 0.0485)."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_calc_tax
          trigger:
            - call: "PATCH /state-programs/${tx_program_id}"
              payload: { premium_tax_rate: 0.0600 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and StateProgram.${tx_program_id}.premium_tax_rate == 0.06"
            - "StateProgram.${tx_program_id}.stamping_fee_rate is still 0.0015 and required_notice_codes is still [\"TX-SL-1\", \"TX-SL-2\"]"
            - "the TX allocation row on ${policy_id} still has premium_tax_rate_applied == 0.0485 and tax_cents == 16571"
            - "Policy.${policy_id}.total_tax_cents is still 38779"

      - name: request_changes_after_the_placement_is_bound_returns_already_bound
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/placements/{id}/request-changes
          - errors.ERR_PLACEMENT_ALREADY_BOUND
        distinguishing_aspect: "request-changes is legal from SEARCH_COMPLETE, but only while no Policy references the placement. Once a policy is issued the same call is 409 ERR_PLACEMENT_ALREADY_BOUND, and declination_count is NOT reset — the reset side effect is skipped along with the transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup with one ISSUED policy on the placement, whose declination_count is 3."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
          trigger:
            - call: "POST /placements/${placement_id}/request-changes"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PLACEMENT_ALREADY_BOUND"
            - "Placement.${placement_id}.status is still BOUND"
            - "Placement.${placement_id}.declination_count is still 3"
            - "GET /policies?placement_id=${placement_id} still returns exactly 1 row"

      - name: white_listing_a_carrier_below_the_state_capital_minimum_is_refused
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/carrier-eligibilities
          - errors.ERR_CARRIER_BELOW_STATE_CAPITAL_MINIMUM
          - entities.StateProgram.fields.min_carrier_capital_surplus_cents
        distinguishing_aspect: "The eligibility junction row links a Carrier to a StateProgram, and the link is refused with 409 ERR_CARRIER_BELOW_STATE_CAPITAL_MINIMUM when the carrier's capital_surplus_cents is under that program's minimum. The very same carrier links successfully to NV, whose minimum is 500,000,000 — the check is per-program, not global, and it applies ONLY at eligibility creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the TX program (minimum 1,500,000,000) and the NV program (minimum 500,000,000) on file, plus a thinly capitalised carrier holding 1,000,000,000 cents."
          setup_api_calls:
            - *k_clock
            - *k_prog_tx
            - *k_prog_nv
            - call: "POST /carriers"
              payload: { naic_number: "33333", legal_name: "Thin Capital Specialty Company", domicile_type: "US_STATE", capital_surplus_cents: 1000000000, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
