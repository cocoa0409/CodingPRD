            - { call: "POST /api/account-applications/${app_id}/decision", payload: { outcome: "DECLINE", decline_reason: "CHEX" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "GET /api/barrier-cases?application_id=${app_id}", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { case_id: "$.data[0].id" } }
            - { call: "POST /api/barrier-cases/${case_id}/propose", payload: { proposed_settlement_cents: 20000 }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/barrier-cases/${case_id}/counter", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
          trigger:
            - { call: "POST /api/barrier-cases/${case_id}/escalate", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Escalate fails with error_id == ERR_NEGOTIATION_ROUNDS_REMAINING (rounds 1 < 3)"
            - "BarrierCase.${case_id}.status remains COUNTERED and the application remains DECLINED_CHEX"

      - name: reinstate_after_expiry_rejected
        claim_type: violation_to_error
        grounds: [state_machines.PartnerInstitution.SUSPENDED_to_CERTIFIED, "errors[ERR_CERTIFICATION_LAPSED]"]
        distinguishing_aspect: "Reinstate of a SUSPENDED institution whose 24-month certification expired while suspended fails with ERR_CERTIFICATION_LAPSED (state precondition passes; temporal check fails)."
        test_recipe:
          setup: ["Institution CERTIFIED at 2026-05-01 (expires 2028-05-01); SUSPENDED; clock advanced to 2028-06-01"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/partner-institutions/${inst_id}/suspend", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2028-06-01T00:00:00Z" }, as: CoalitionAdmin }
          trigger:
            - { call: "POST /api/partner-institutions/${inst_id}/reinstate", payload: {}, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Reinstate fails with error_id == ERR_CERTIFICATION_LAPSED (clock 2028-06-01 >= expires 2028-05-01)"
            - "Institution remains SUSPENDED (not auto-lapsed: lapse fires only via the ops epoch)"

      - name: event_window_conflict_same_venue_only
        claim_type: violation_to_error
        grounds: [calculations.campaign_overlap_check, "errors[ERR_EVENT_WINDOW_CONFLICT]", "validations[priority=8]"]
        distinguishing_aspect: "Event overlap is scoped to (institution, venue_code) with half-open windows: same-venue overlap rejected; adjacent same-venue and overlapping different-venue both allowed."
        test_recipe:
          setup: ["CERTIFIED institution; event E1 at BR-1 [2026-05-10T09:00Z, 2026-05-10T13:00Z)"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T09:00:00Z", ends_at: "2026-05-10T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T13:00:00Z", ends_at: "2026-05-10T17:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { e2: $.data.id } }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T12:00:00Z", ends_at: "2026-05-10T15:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-2", starts_at: "2026-05-10T12:00:00Z", ends_at: "2026-05-10T15:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { e4: $.data.id } }
          assert:
            - "Adjacent same-venue event (start == E1.end) is created (half-open semantics)"
            - "Overlapping same-venue event fails with error_id == ERR_EVENT_WINDOW_CONFLICT"
            - "Same-time different-venue (BR-2) event is created (overlap scope includes venue_code)"

      - name: referral_event_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_REFERRAL_MISMATCH]"]
        distinguishing_aspect: "Application carrying both referral_id and an event_id different from referral.booked_event_id fails with ERR_REFERRAL_MISMATCH (docs are complete, isolating the referential rule)."
        test_recipe:
          setup: ["CERTIFIED institution; events E1, E2 SCHEDULED; documented participant; referral BOOKED onto E1"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T09:00:00Z", ends_at: "2026-05-10T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { e1: $.data.id } }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-2", starts_at: "2026-05-11T09:00:00Z", ends_at: "2026-05-11T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { e2: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
