scenario: "generate task hard than expert level! 995. Non-Alcoholic Bottle Shop & Tasting: SKU & category, tasting-flight & event, club/subscription, age-neutral compliance, retail & DTC shipping-state, loyalty, special order, inventory"

domain_name: non-alcoholic-bottle-shop
api_prefix: /nabs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique kebab-case category code (e.g. 'sparkling-tea', 'adaptogenic-soda')"
        constraints: "Unique across all categories; lowercase alphanumeric plus dashes; 2..48 chars"
      - name: display_name
        type: string
        source: input
        description: "Human-readable category name"
      - name: compliance_class
        type: enum
        source: input
        description: "Age-neutral compliance tier applied to every SKU under this category"
        constraints: "Enum {STANDARD, SENSITIVE_INGREDIENT, HEMP_DERIVED, KAVA, FUNCTIONAL_MUSHROOM}. HEMP_DERIVED/KAVA trigger shipping-state restrictions."
      - name: active
        type: boolean
        source: input
        description: "Whether SKUs may be filed under this category"
        default: true

  - name: SKU
    parent: Category
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; owning category"
      - name: sku_code
        type: string
        source: input
        description: "Merchant-facing SKU code"
        constraints: "Unique across all SKUs; 3..32 chars"
      - name: title
        type: string
        source: input
        description: "Display title"
      - name: base_price_cents
        type: integer
        source: input
        description: "List price in cents before any discount; must be >= 0"
      - name: abv_basis_points
        type: integer
        source: input
        description: "Alcohol-by-volume in basis points; 0 means certified zero; <=50 means 'non-alcoholic' federally; 51..500 means 'dealcoholized' and is RESTRICTED in some states"
        constraints: "0 <= abv_basis_points <= 500; SKUs above 500 are rejected at creation"
      - name: age_neutral_class
        type: enum
        source: computed
        description: "Derived compliance class. Computed from Category.compliance_class + abv_basis_points per calculation age_neutral_classification. Values: OPEN, ADULT_ONLY_SUGGESTED, ADULT_ONLY_REQUIRED, PROHIBITED_STATE_LIST"
      - name: ship_state_overrides
        type: array
        source: input
        description: "Optional list of state codes (ISO 3166-2:US) where this SKU is explicitly PROHIBITED or ALLOWED, overriding category-level compliance"
        default: []
      - name: discontinued
        type: boolean
        source: input
        description: "When true, SKU cannot be added to new Orders or TastingEvents"
        default: false
      - name: on_hand_cached
        type: integer
        source: computed
        description: "Derived: sum of InventoryLot.qty_remaining for this SKU across non-EXPIRED lots; updated on every lot mutation per calculation sku_on_hand_recompute"

  - name: InventoryLot
    parent: SKU
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id; owning SKU"
      - name: lot_code
        type: string
        source: input
        description: "Vendor lot/batch code"
        constraints: "Unique within (sku_id, lot_code)"
      - name: qty_received
        type: integer
        source: input
        description: "Initial quantity received; must be >= 1"
      - name: qty_remaining
        type: integer
        source: computed
        description: "qty_received minus sum of committed/fulfilled OrderLine and TastingSeat pours; updated by calculation lot_allocation_walk"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Per-unit acquisition cost in cents"
      - name: expires_on
        type: string
        source: input
        description: "ISO-8601 date (YYYY-MM-DD) after which the lot is EXPIRED"
      - name: status
        type: enum
        source: computed
        description: "Enum {ACTIVE, DEPLETED, EXPIRED, QUARANTINED}. ACTIVE: qty_remaining>0 and today<=expires_on. DEPLETED: qty_remaining==0. EXPIRED: today>expires_on. QUARANTINED: held by compliance hold"
      - name: quarantine_reason
        type: string
        source: input
        description: "Optional reason recorded when lot is QUARANTINED"
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique email; case-insensitive"
        constraints: "Unique; RFC 5322"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD; used for age-attestation workflows (ADULT_ONLY_* SKUs)"
      - name: home_state_code
        type: string
        source: input
        description: "ISO 3166-2:US two-letter state code used as default shipping state and for shipping-state compliance gating"
      - name: age_attestation_status
        type: enum
        source: computed
        description: "Enum {UNVERIFIED, PENDING_REVIEW, ATTESTED, REJECTED, REVOKED}. Drives whether Member may purchase ADULT_ONLY_REQUIRED SKUs"
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Enum {BRONZE, SILVER, GOLD, PLATINUM}; derived from loyalty_points_lifetime per calculation loyalty_tier_derive"
      - name: loyalty_points_balance
        type: integer
        source: computed
        description: "Redeemable points; incremented by order/tasting accrual, decremented by redemption; never negative"
      - name: loyalty_points_lifetime
        type: integer
        source: computed
        description: "Cumulative points earned; monotonic (never decremented by redemption; decremented only on order refund clawback)"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Store credit from refunds/voids; never negative; consumed before card on checkout"

  - name: ClubPlan
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique plan code (e.g. 'CURATED-MONTHLY')"
      - name: cadence
        type: enum
        source: input
        description: "Enum {MONTHLY, QUARTERLY, ANNUAL}"
      - name: bottles_per_shipment
        type: integer
        source: input
        description: "How many bottles ship per cycle; >= 1"
      - name: price_cents_per_cycle
        type: integer
        source: input
        description: "Subscription charge per cycle in cents"
      - name: allowed_category_ids
        type: array
        source: input
        description: "Whitelist of Category.id values; club-curated bottles must come from these categories"
      - name: discount_bps_on_retail
        type: integer
        source: input
        description: "Basis-points discount applied to all retail Orders for active subscribers (0..5000)"
      - name: max_active_subscriptions
        type: integer
        source: input
        description: "Plan-level capacity cap; >= 1"
      - name: active_subscription_count
        type: integer
        source: computed
        description: "Derived: count of ClubSubscription rows where status IN {ACTIVE, PAST_DUE} and plan_id == this.id; updated by calculation club_capacity_recompute"

  - name: ClubSubscription
    parent: ClubPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ClubPlan.id"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; subscribing member"
      - name: status
        type: enum
        source: computed
        description: "Enum {TRIALING, ACTIVE, PAST_DUE, PAUSED, CANCELLED, EXPIRED}. Initial TRIALING if trial_days > 0 else ACTIVE"
      - name: started_on
        type: string
        source: input
        description: "ISO date the subscription began"
      - name: trial_days
        type: integer
        source: input
        description: "Length of trial; 0 means no trial"
        default: 0
      - name: next_billing_on
        type: string
        source: computed
        description: "ISO date of next charge; advanced on successful billing per calculation subscription_billing_advance"
      - name: failed_billing_count
        type: integer
        source: computed
        description: "Consecutive billing failures; reset to 0 on success"
      - name: shipments_fulfilled
        type: integer
        source: computed
        description: "Count of club shipments dispatched; drives loyalty accrual"
      - name: pause_reason
        type: string
        source: input
        description: "Optional reason for PAUSED transition"
        default: null

  - name: TastingEvent
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Event title"
      - name: host_member_id
        type: string
        source: input
        description: "FK -> Member.id; staff member hosting (must have role ShopStaff or higher)"
      - name: starts_at
        type: string
        source: input
        description: "ISO-8601 UTC start time"
      - name: ends_at
        type: string
        source: input
        description: "ISO-8601 UTC end time; must be strictly after starts_at"
      - name: capacity
        type: integer
        source: input
        description: "Maximum seats; >= 1"
      - name: seats_booked
        type: integer
        source: computed
        description: "Count of TastingSeat rows with status IN {RESERVED, CONFIRMED, ATTENDED}"
      - name: status
        type: enum
        source: computed
        description: "Enum {DRAFT, PUBLISHED, LOCKED, IN_SESSION, COMPLETED, CANCELLED, RESCHEDULED}"
      - name: flight_price_cents
        type: integer
        source: input
        description: "Per-seat flight price in cents; >= 0"
      - name: min_attendee_age_years
        type: integer
        source: input
        description: "Minimum age in years; 0 = open-to-all (age-neutral), 21 = alcohol-adjacent service"
        default: 0
      - name: compliance_hold
        type: boolean
        source: computed
        description: "True while any FlightItem's SKU has age_neutral_class=PROHIBITED_STATE_LIST for the shop's home state; gates PUBLISHED transition"

  - name: FlightItem
    parent: TastingEvent
    common_fields: true
    fields:
      - name: tasting_event_id
        type: string
        source: input
        description: "FK -> TastingEvent.id"
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id; bottle being poured"
      - name: pour_size_ml
        type: integer
        source: input
        description: "Per-seat pour size in ml; 5..60"
      - name: sequence_no
        type: integer
        source: input
        description: "Order within flight; unique within event; >= 1"
      - name: estimated_bottle_consumption
        type: number
        source: computed
        description: "Decimal bottles expected = pour_size_ml * capacity / 750; used to reserve inventory"

  - name: TastingSeat
    parent: TastingEvent
    common_fields: true
    fields:
      - name: tasting_event_id
        type: string
        source: input
        description: "FK -> TastingEvent.id"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; seat holder"
      - name: status
        type: enum
        source: computed
        description: "Enum {RESERVED, CONFIRMED, ATTENDED, NO_SHOW, CANCELLED, REFUNDED}"
      - name: price_paid_cents
        type: integer
        source: computed
        description: "Locked-in price at booking time (after member-tier discount); never re-priced"
      - name: booked_at
        type: string
        source: system
        description: "ISO-8601 UTC booking timestamp"
      - name: loyalty_points_awarded
        type: integer
        source: computed
        description: "Points granted on ATTENDED transition; clawed back on REFUNDED"

  - name: SpecialOrder
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; requesting member"
      - name: requested_sku_code
        type: string
        source: input
        description: "Free-form code/name of the bottle the member wants; resolved to sku_id upon approval"
      - name: quantity
        type: integer
        source: input
        description: "Bottles requested; >= 1"
      - name: resolved_sku_id
        type: string
        source: input
        description: "FK -> SKU.id; populated when ShopStaff approves and links to a real SKU"
        default: null
      - name: deposit_cents
        type: integer
        source: input
        description: "Non-refundable deposit in cents; >= 0"
      - name: status
        type: enum
        source: computed
        description: "Enum {REQUESTED, APPROVED, SOURCED, RECEIVED, FULFILLED, DECLINED, CANCELLED}"
      - name: approved_by_user_id
        type: string
        source: input
        description: "Opaque user id of approving ShopStaff; segregation-of-duties: cannot equal requesting member id"
        default: null
      - name: decline_reason
        type: string
        source: input
        description: "Required when status -> DECLINED"
        default: null

  - name: Order
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; ordering member"
      - name: channel
        type: enum
        source: input
        description: "Enum {RETAIL, DTC}; RETAIL = in-store pickup, DTC = direct-to-consumer ship"
      - name: ship_to_state_code
        type: string
        source: input
        description: "ISO 3166-2:US two-letter destination state; required for DTC, ignored for RETAIL"
      - name: payment_status
        type: enum
        source: computed
        description: "Enum {UNPAID, AUTHORIZED, CAPTURED, REFUNDED_PARTIAL, REFUNDED_FULL, VOIDED}. Parallel dimension 1."
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Enum {DRAFT, PICKING, PACKED, SHIPPED, DELIVERED, PICKED_UP, CANCELLED}. Parallel dimension 2."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of OrderLine.extended_price_cents; recomputed on every line mutation"
      - name: discount_cents
        type: integer
        source: computed
        description: "Total discount (club discount + loyalty redemption); computed by calculation order_total_compose"
      - name: shipping_charge_cents
        type: integer
        source: computed
        description: "Flat + per-bottle + state surcharge; computed by calculation shipping_charge_compose"
      - name: tax_cents
        type: integer
        source: computed
        description: "Destination-based sales tax; computed by calculation order_tax_compose"
      - name: grand_total_cents
        type: integer
        source: computed
        description: "subtotal - discount + shipping + tax; invariant with line-level detail"
      - name: loyalty_points_redeemed
        type: integer
        source: input
        description: "Points redeemed against this order; 100 pts = $1; <= Member.loyalty_points_balance at CAPTURED"
        default: 0
      - name: loyalty_points_earned
        type: integer
        source: computed
        description: "Points to award upon DELIVERED / PICKED_UP; 1 pt per $1 of grand_total_cents, tier multiplier applies"
      - name: applied_club_subscription_id
        type: string
        source: input
        description: "FK -> ClubSubscription.id; set when member is an ACTIVE subscriber at order creation (drives club discount)"
        default: null

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id"
      - name: qty
        type: integer
        source: input
        description: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Locked at creation: SKU.base_price_cents less club discount (if applied_club_subscription_id set) at that moment"
      - name: extended_price_cents
        type: integer
        source: computed
        description: "Round per line: round_half_up(unit_price_cents * qty, 2). Sum of extended_price_cents across lines MUST equal Order.subtotal_cents (per-line rounding wins, no reallocation)."
      - name: lot_allocation
        type: array
        source: computed
        description: "FEFO walk: list of {lot_id, qty_taken} chosen by calculation lot_allocation_walk; empty until PICKING"

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: club_subscription_id
        type: string
        source: input
        description: "FK -> ClubSubscription.id; set when this shipment is a club-cycle dispatch rather than ad-hoc"
        default: null
      - name: carrier
        type: string
        source: input
        description: "Carrier name"
      - name: tracking_no
        type: string
        source: input
        description: "Carrier tracking number"
      - name: status
        type: enum
        source: computed
        description: "Enum {LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, RETURNED, LOST}"
      - name: shipped_on
        type: string
        source: input
        description: "ISO date label created"
      - name: delivered_on
        type: string
        source: input
        description: "ISO date delivered"
        default: null

  - name: ShippingStateRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "ISO 3166-2:US two-letter code; unique"
      - name: allows_dtc
        type: boolean
        source: input
        description: "If false, no DTC order may ship here (ERR_DTC_STATE_PROHIBITED)"
      - name: min_age_years
        type: integer
        source: input
        description: "Minimum recipient age for ADULT_ONLY_* SKUs; federal default 21; 0 for fully-open states"
      - name: abv_cap_basis_points
        type: integer
        source: input
        description: "Maximum ABV in basis points allowed for DTC into this state; SKUs above this trigger ERR_SKU_ABV_STATE_EXCEEDED"
      - name: surcharge_cents_per_order
        type: integer
        source: input
        description: "Flat state-mandated surcharge per order"
        default: 0
      - name: tax_rate_bps
        type: integer
        source: input
        description: "Destination-based sales-tax rate in basis points; 0..5000"

  - name: ComplianceAttestation
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id"
      - name: attested_by_user_id
        type: string
        source: input
        description: "Opaque id of ShopStaff/ComplianceOfficer who performed attestation; segregation-of-duties: cannot equal member_id"
      - name: outcome
        type: enum
        source: input
        description: "Enum {APPROVED, REJECTED}"
      - name: attested_on
        type: string
        source: input
        description: "ISO date"
      - name: document_reference
        type: string
        source: input
        description: "External reference (e.g., ID-scan transaction id)"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: UNVERIFIED
    terminal_states: [REVOKED]
    # state field: age_attestation_status
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /nabs/members/{id}/attestations"
        actor: ShopStaff
        preconditions:
          - "Member.age_attestation_status == UNVERIFIED"
          - "attested_by_user_id != member_id (segregation of duties)"
        side_effects:
          - "Creates ComplianceAttestation row"
          - "Member.updated_at bumped"
      - from: PENDING_REVIEW
        to: ATTESTED
        trigger: "POST /nabs/members/{id}/attestations/{att_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Member.age_attestation_status == PENDING_REVIEW"
          - "Attestation outcome == APPROVED"
          - "Approving officer user_id != original attested_by_user_id (segregation of duties)"
        side_effects:
          - "Member.age_attestation_status := ATTESTED"
          - "Recalculate Member.loyalty_tier (no change unless tier thresholds crossed)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /nabs/members/{id}/attestations/{att_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Member.age_attestation_status == PENDING_REVIEW"
        side_effects:
          - "Member.age_attestation_status := REJECTED"
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /nabs/members/{id}/attestations"
        actor: ShopStaff
        preconditions:
          - "Member.age_attestation_status == REJECTED"
        side_effects:
          - "Cycle allowed: re-attestation after rejection"
      - from: ATTESTED
        to: REVOKED
        trigger: "POST /nabs/members/{id}/attestations/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "Member.age_attestation_status == ATTESTED"
        side_effects:
          - "All future orders containing ADULT_ONLY_REQUIRED SKUs for this member are blocked"
          - "Any DRAFT/PICKING Order for this member containing ADULT_ONLY_REQUIRED SKUs transitions to CANCELLED (cascade)"

  - entity: ClubSubscription
    initial_state: TRIALING
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: TRIALING
        to: ACTIVE
        trigger: "System: clock advances past trial_days"
        actor: system
        preconditions:
          - "current date >= started_on + trial_days"
        side_effects:
          - "ClubPlan.active_subscription_count recalculated"
      - from: TRIALING
        to: CANCELLED
        trigger: "POST /nabs/club-subscriptions/{id}/cancel"
        actor: [Member, ShopStaff]
        preconditions:
          - "actor is owner (member_id == X-User-ID) OR ShopStaff"
        side_effects:
          - "ClubPlan.active_subscription_count -= 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /nabs/_billing/simulate (outcome=FAILED)"
        actor: PlatformAdmin
        preconditions:
          - "ClubSubscription.status == ACTIVE"
        side_effects:
          - "failed_billing_count += 1"
          - "If failed_billing_count >= 3, auto-transition to EXPIRED via system rule"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /nabs/club-subscriptions/{id}/pause"
        actor: [Member, ShopStaff]
        preconditions:
          - "ClubSubscription.status == ACTIVE"
        side_effects:
          - "next_billing_on pushed forward on resume (recalculated at resume time)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /nabs/_billing/simulate (outcome=SUCCEEDED)"
        actor: PlatformAdmin
        preconditions:
          - "ClubSubscription.status == PAST_DUE"
        side_effects:
          - "failed_billing_count := 0"
          - "next_billing_on advanced per cadence"
      - from: PAST_DUE
        to: EXPIRED
        trigger: "System: failed_billing_count reaches 3"
        actor: system
        preconditions:
          - "failed_billing_count >= 3"
        side_effects:
          - "ClubPlan.active_subscription_count -= 1"
          - "Member loses club discount immediately; future DRAFT orders do not see applied_club_subscription_id"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /nabs/club-subscriptions/{id}/resume"
        actor: [Member, ShopStaff]
        preconditions:
          - "ClubSubscription.status == PAUSED"
        side_effects:
          - "next_billing_on recomputed as max(today, started_on + N*cadence)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /nabs/club-subscriptions/{id}/cancel"
        actor: [Member, ShopStaff]
        preconditions: []
        side_effects:
          - "ClubPlan.active_subscription_count -= 1"

  - entity: TastingEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /nabs/tasting-events/{id}/publish"
        actor: ShopStaff
        preconditions:
          - "TastingEvent.compliance_hold == false"
          - "TastingEvent has >= 1 FlightItem"
          - "starts_at > current UTC time"
        side_effects:
          - "Inventory reserved: for each FlightItem, estimated_bottle_conversation * 750ml deducted from FEFO walk; corresponding InventoryLot.qty_remaining decremented"
          - "SKU.on_hand_cached recomputed for affected SKUs"
      - from: PUBLISHED
        to: LOCKED
        trigger: "System: clock reaches starts_at - 24h"
        actor: system
        preconditions:
          - "TastingEvent.status == PUBLISHED"
        side_effects:
          - "No new TastingSeat reservations accepted after this point"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /nabs/tasting-events/{id}/cancel"
        actor: ShopStaff
        preconditions:
          - "TastingEvent.status == PUBLISHED"
        side_effects:
          - "All TastingSeat with status IN {RESERVED, CONFIRMED} transition to CANCELLED (cascade)"
          - "Reserved InventoryLot.qty_remaining restored; SKU.on_hand_cached recomputed"
      - from: LOCKED
        to: IN_SESSION
        trigger: "System: clock reaches starts_at"
        actor: system
        preconditions:
          - "TastingEvent.status == LOCKED"
        side_effects: []
      - from: IN_SESSION
        to: COMPLETED
        trigger: "System: clock reaches ends_at AND all TastingSeat terminal"
        actor: system
        preconditions:
          - "TastingEvent.status == IN_SESSION"
          - "All TastingSeat.status IN {ATTENDED, NO_SHOW, CANCELLED, REFUNDED}"
        side_effects:
          - "For each ATTENDED seat, award TastingSeat.loyalty_points_awarded to Member"
          - "Member.loyalty_points_balance and loyalty_points_lifetime recomputed"
      - from: LOCKED
        to: RESCHEDULED
        trigger: "POST /nabs/tasting-events/{id}/reschedule"
        actor: ShopStaff
        preconditions:
          - "TastingEvent.status == LOCKED"
          - "new starts_at > current UTC time"
        side_effects:
          - "Existing TastingSeat remain valid (no re-booking needed)"
      - from: RESCHEDULED
        to: PUBLISHED
        trigger: "System: reschedule completes"
        actor: system
        preconditions:
          - "TastingEvent.status == RESCHEDULED"
        side_effects: []

  - entity: TastingSeat
    initial_state: RESERVED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED, REFUNDED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /nabs/tasting-seats/{id}/confirm (payment authorized)"
        actor: [Member, ShopStaff]
        preconditions:
          - "TastingEvent.status IN {PUBLISHED, RESCHEDULED} (not LOCKED)"
          - "TastingEvent.seats_booked < TastingEvent.capacity"
          - "Member age >= TastingEvent.min_attendee_age_years at event date (computed from date_of_birth)"
        side_effects:
          - "TastingEvent.seats_booked += 1"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /nabs/tasting-seats/{id}/check-in"
        actor: ShopStaff
        preconditions:
          - "TastingEvent.status == IN_SESSION"
        side_effects:
          - "TastingSeat.loyalty_points_awarded = flight_price_cents / 100 * member-tier multiplier, rounded half-up"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "System: event IN_SESSION ends and seat never checked in"
        actor: system
        preconditions:
          - "TastingEvent.status transitioned to COMPLETED"
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /nabs/tasting-seats/{id}/cancel"
        actor: [Member, ShopStaff]
        preconditions:
          - "TastingSeat.status IN {RESERVED, CONFIRMED}"
          - "TastingEvent.status != IN_SESSION and != COMPLETED"
        side_effects:
          - "TastingEvent.seats_booked -= 1"
          - "If status was CONFIRMED, refund price_paid_cents to Member.wallet_credit_cents"
      - from: CANCELLED
        to: REFUNDED
        trigger: "POST /nabs/tasting-seats/{id}/refund"
        actor: ShopStaff
        preconditions:
          - "TastingSeat.status == CANCELLED"
        side_effects:
          - "Member.wallet_credit_cents += price_paid_cents (if not already refunded in cancel)"
          - "Member.loyalty_points_lifetime unchanged (no clawback for un-awarded points)"

  - entity: Order
    initial_state: DRAFT  # payment_status=UNPAID, fulfillment_status=DRAFT
    terminal_states: [DELIVERED, PICKED_UP, CANCELLED]  # on fulfillment axis; payment terminal states REFUNDED_FULL / VOIDED
    # PARALLEL state dimensions: payment_status × fulfillment_status
    transitions:
      - from: DRAFT
        to: PICKING
        trigger: "POST /nabs/orders/{id}/submit"
        actor: [Member, ShopStaff]
        preconditions:
          - "Order has >= 1 OrderLine"
          - "For every line: SKU.discontinued == false"
          - "For every line: SKU.age_neutral_class permits sale to Member given Member.age_attestation_status and Order.ship_to_state_code (if channel=DTC)"
          - "If channel=DTC: ShippingStateRule[ship_to_state_code].allows_dtc == true"
          - "If channel=DTC: for every line, SKU.abv_basis_points <= ShippingStateRule[ship_to_state_code].abv_cap_basis_points"
          - "Member.loyalty_points_balance >= Order.loyalty_points_redeemed"
        side_effects:
          - "Run lot_allocation_walk (FEFO) for each line, decrementing InventoryLot.qty_remaining"
          - "SKU.on_hand_cached recomputed for affected SKUs"
          - "payment_status := AUTHORIZED"
          - "fulfillment_status := PICKING"
          - "order totals computed via order_total_compose"
      - from: PICKING
        to: PACKED
        trigger: "POST /nabs/orders/{id}/pack"
        actor: ShopStaff
        preconditions:
          - "fulfillment_status == PICKING"
        side_effects:
          - "fulfillment_status := PACKED"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /nabs/orders/{id}/shipments (creates Shipment row)"
        actor: ShopStaff
        preconditions:
          - "fulfillment_status == PACKED"
          - "channel == DTC"
        side_effects:
          - "Creates Shipment with status LABEL_CREATED"
          - "fulfillment_status := SHIPPED"
      - from: PACKED
        to: PICKED_UP
        trigger: "POST /nabs/orders/{id}/pickup"
        actor: ShopStaff
        preconditions:
          - "fulfillment_status == PACKED"
          - "channel == RETAIL"
        side_effects:
          - "payment_status := CAPTURED"
          - "loyalty_points_earned credited to Member"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /nabs/shipments/{id}/mark-delivered"
        actor: [ShopStaff, PlatformAdmin]
        preconditions:
          - "Shipment.status IN {LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY}"
        side_effects:
          - "Order.payment_status := CAPTURED"
          - "Order.fulfillment_status := DELIVERED"
          - "Member.loyalty_points_balance += loyalty_points_earned"
          - "Member.loyalty_points_lifetime += loyalty_points_earned"
          - "If Shipment.club_subscription_id set: ClubSubscription.shipments_fulfilled += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /nabs/orders/{id}/cancel"
        actor: [Member, ShopStaff]
        preconditions:
          - "fulfillment_status == DRAFT"
        side_effects:
          - "Loyalty redemption reversed"
      - from: PICKING
        to: CANCELLED
        trigger: "POST /nabs/orders/{id}/cancel"
        actor: ShopStaff
        preconditions:
          - "fulfillment_status IN {PICKING}"
          - "payment_status IN {AUTHORIZED, UNPAID}"
        side_effects:
          - "InventoryLot.qty_remaining restored for all lot_allocation entries"
          - "SKU.on_hand_cached recomputed"
          - "payment_status := VOIDED"
          - "Loyalty redemption reversed"

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, DECLINED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /nabs/special-orders/{id}/approve"
        actor: ShopStaff
        preconditions:
          - "approved_by_user_id != member_id (segregation of duties)"
          - "resolved_sku_id provided and SKU.discontinued == false"
        side_effects:
          - "Member.wallet_credit_cents -= deposit_cents (hold)"
      - from: APPROVED
        to: SOURCED
        trigger: "POST /nabs/special-orders/{id}/mark-sourced"
        actor: ShopStaff
        preconditions:
          - "SpecialOrder.status == APPROVED"
        side_effects:
          - "A new InventoryLot may be created on SKU.resolved_sku_id"
      - from: SOURCED
        to: RECEIVED
        trigger: "POST /nabs/special-orders/{id}/receive"
        actor: ShopStaff
        preconditions:
          - "SpecialOrder.status == SOURCED"
        side_effects:
          - "InventoryLot.qty_received incremented"
      - from: RECEIVED
        to: FULFILLED
        trigger: "POST /nabs/special-orders/{id}/fulfill"
        actor: ShopStaff
        preconditions:
          - "SpecialOrder.status == RECEIVED"
          - "A linked Order in terminal state consumed the bottles"
        side_effects:
          - "Member.loyalty_points_balance += bonus (10 pts per bottle)"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /nabs/special-orders/{id}/decline"
        actor: ShopStaff
        preconditions:
          - "SpecialOrder.status == REQUESTED"
          - "decline_reason non-empty"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /nabs/special-orders/{id}/cancel"
        actor: [Member, ShopStaff]
        preconditions:
          - "SpecialOrder.status == APPROVED"
        side_effects:
          - "Deposit held in wallet_credit_cents is forfeited (transferred to shop revenue)"

  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, RETURNED, LOST]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /nabs/shipments/{id}/mark-in-transit"
        actor: [ShopStaff, PlatformAdmin]
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: OUT_FOR_DELIVERY
        trigger: "POST /nabs/shipments/{id}/mark-out-for-delivery"
        actor: [ShopStaff, PlatformAdmin]
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /nabs/shipments/{id}/mark-delivered"
        actor: [ShopStaff, PlatformAdmin]
        preconditions: []
        side_effects:
          - "Bubbles up to Order: payment_status := CAPTURED, fulfillment_status := DELIVERED, loyalty accrual"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /nabs/shipments/{id}/mark-returned"
        actor: [ShopStaff, PlatformAdmin]
        preconditions: []
        side_effects:
          - "Order.payment_status := REFUNDED_FULL; lot_allocation restored; loyalty clawed back"
      - from: OUT_FOR_DELIVERY
        to: LOST
        trigger: "POST /nabs/shipments/{id}/mark-lost"
        actor: [ShopStaff, PlatformAdmin]
        preconditions: []
        side_effects:
          - "Order.payment_status := REFUNDED_FULL; loyalty clawed back; lot_allocation NOT restored (bottles lost)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-submit-stale-order
    parent_entity: Order
    write_endpoint: "POST /nabs/orders/{id}/submit"
    occ_field: "expected_order_version"
    description: |
      Submitting an Order whose version has advanced since the client last observed it
      (e.g., because another writer added/removed OrderLine rows or modified
      loyalty_points_redeemed, each of which bumps Order.version) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tasting-seat-book-stale-event
    parent_entity: TastingEvent
    write_endpoint: "POST /nabs/tasting-events/{id}/seats"
    occ_field: "expected_event_version"
    description: |
      Booking a seat against a TastingEvent whose version has advanced since the client
      last observed it (because another seat was booked or cancelled, mutating
      seats_booked and bumping version) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: club-plan-subscribe-stale-plan
    parent_entity: ClubPlan
    write_endpoint: "POST /nabs/club-subscriptions"
    occ_field: "expected_plan_version"
    description: |
      Subscribing against a ClubPlan whose version has advanced since the client last
      observed it (because active_subscription_count moved closer to or further from
      max_active_subscriptions) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_compose
    trigger: "On Order submit; on OrderLine create/update/delete while order is DRAFT"
    algorithm: tiered_pricing
    formula: |
      # Inputs: lines, member, club_sub, ship_state_rule, redeem_pts
      # Step 1 (per-line rounding — per-line wins; do NOT sum-then-round):
      for line in lines:
        list_cents = line.sku.base_price_cents
        if order.applied_club_subscription_id:
          discount_bps = club_sub.plan.discount_bps_on_retail
          unit_price_cents = round_half_up(list_cents * (10000 - discount_bps) / 10000, 0)
        else:
          unit_price_cents = list_cents
        line.unit_price_cents = unit_price_cents
        line.extended_price_cents = unit_price_cents * line.qty
      subtotal_cents = sum(line.extended_price_cents)
      # Step 2: loyalty redemption (100 pts = $1 = 100 cents)
      loyalty_discount_cents = redeem_pts * 1
      # Step 3: shipping charge (DTC only, before tax)
      if channel == DTC:
        shipping_charge_cents = ship_state_rule.surcharge_cents_per_order + 500 + 150 * total_bottles
      else:
        shipping_charge_cents = 0
      # Step 4: tax — computed on (subtotal - loyalty_discount + shipping)
      taxable = subtotal_cents - loyalty_discount_cents + shipping_charge_cents
      tax_cents = round_half_up(taxable * ship_state_rule.tax_rate_bps / 10000, 0)
      # Step 5: grand total
      grand_total_cents = subtotal_cents - loyalty_discount_cents + shipping_charge_cents + tax_cents
    input_set: "Order lines in current order, Member.loyalty_tier at submit time, applied ClubSubscription (must be ACTIVE), ShippingStateRule for ship_to_state_code"
    constants:
      LOYALTY_REDEEM_CENTS_PER_POINT: 1
      DTC_BASE_SHIP_CENTS: 500
      DTC_PER_BOTTLE_CENTS: 150
    precision: "integer cents; round_half_up per line"
    variants:
      - name: retail_channel
        when: "channel == RETAIL"
        difference: "shipping_charge_cents = 0 and tax_rate_bps uses shop's home state rule (looked up via ShopStaff's store, pinned to 'CA' for this scaffold)"
      - name: dtc_channel
        when: "channel == DTC"
        difference: "shipping + destination-state tax_rate_bps apply"

  - name: lot_allocation_walk
    trigger: "On Order submit (per line) and on TastingEvent publish (per FlightItem)"
    algorithm: chronological
    formula: |
      # FEFO: First-Expired-First-Out. Walk InventoryLot rows for SKU ordered by
      # expires_on ASC, then created_at ASC (tie-break — never use id).
      # Take from each lot until demand satisfied.
      # If insufficient qty_remaining across all non-EXPIRED non-QUARANTINED lots,
      # reject with ERR_INSUFFICIENT_INVENTORY.
      lots = InventoryLot.where(sku_id=sku_id, status=ACTIVE).order_by(expires_on ASC, created_at ASC)
      remaining = demand_qty
      for lot in lots:
        take = min(lot.qty_remaining, remaining)
        lot.qty_remaining -= take
        if lot.qty_remaining == 0: lot.status = DEPLETED
        remaining -= take
        if remaining == 0: break
      if remaining > 0: raise ERR_INSUFFICIENT_INVENTORY
    input_set: "InventoryLot rows for the SKU with status=ACTIVE ordered by expires_on ASC, created_at ASC"
    constants: {}
    precision: "integer bottle counts"
    variants:
      - name: retail_channel
        when: "Order.channel == RETAIL"
        difference: "Allows allocation from QUARANTINED lots if ShopStaff overrides (records override in Order metadata)"
      - name: dtc_channel
        when: "Order.channel == DTC"
        difference: "Strictly non-QUARANTINED lots; no override permitted"

  - name: age_neutral_classification
    trigger: "On SKU create/update; on Category.compliance_class change"
    algorithm: constraint_propagation
    formula: |
      # Inputs: Category.compliance_class, SKU.abv_basis_points, SKU.ship_state_overrides
      if sku.abv_basis_points > 500: reject at creation
      if category.compliance_class == HEMP_DERIVED: return PROHIBITED_STATE_LIST
      if category.compliance_class == KAVA: return PROHIBITED_STATE_LIST
      if category.compliance_class == FUNCTIONAL_MUSHROOM: return ADULT_ONLY_SUGGESTED
      if sku.abv_basis_points > 50: return ADULT_ONLY_REQUIRED
      return OPEN
    input_set: "SKU + Category"
    constants:
      ABV_DEALCOHOLIZED_THRESHOLD_BPS: 50
      ABV_MAX_ALLOWED_BPS: 500
    precision: "deterministic enum"
    variants:
      - name: override_applied
        when: "SKU.ship_state_overrides contains PROHIBITED for target state"
        difference: "Returns PROHIBITED_STATE_LIST for that state regardless of category class"

  - name: loyalty_tier_derive
    trigger: "On Member.loyalty_points_lifetime change"
    algorithm: threshold
    formula: |
      # Thresholds on lifetime points (inclusive lower bound, exclusive upper):
      # 0..4999 -> BRONZE; 5000..19999 -> SILVER; 20000..49999 -> GOLD; >= 50000 -> PLATINUM
      # Boundary precision: at exactly 5000 pts the tier flips SILVER (>= 5000, not >).
      pts = member.loyalty_points_lifetime
      if pts >= 50000: return PLATINUM
      if pts >= 20000: return GOLD
      if pts >= 5000: return SILVER
      return BRONZE
    input_set: "Member.loyalty_points_lifetime"
    constants:
      SILVER_MIN: 5000
      GOLD_MIN: 20000
      PLATINUM_MIN: 50000
    precision: "integer points"
    variants:
      - name: multiplier_per_tier
        when: "applied to loyalty accrual"
        difference: "BRONZE 1.0x, SILVER 1.25x, GOLD 1.5x, PLATINUM 2.0x — applied to points_earned before rounding half-up"

  - name: club_capacity_recompute
    trigger: "On ClubSubscription create / status change in/out of {ACTIVE, PAST_DUE}"
    algorithm: aggregation
    formula: |
      plan.active_subscription_count = count(ClubSubscription where plan_id=plan.id and status IN {ACTIVE, PAST_DUE})
    input_set: "ClubSubscription rows for the plan with status in {ACTIVE, PAST_DUE}"
    constants: {}
    precision: "integer count"
    variants: []

  - name: subscription_billing_advance
    trigger: "On successful billing (via _billing/simulate outcome=SUCCEEDED)"
    algorithm: chronological
    formula: |
      # Advance next_billing_on by cadence. If new date is in the past (catch-up), keep advancing until >= today.
      cadence_months = {MONTHLY: 1, QUARTERLY: 3, ANNUAL: 12}[plan.cadence]
      next = sub.next_billing_on + cadence_months
      while next < today: next += cadence_months
      sub.next_billing_on = next
    input_set: "ClubSubscription + ClubPlan.cadence"
    constants: {}
    precision: "ISO date"
    variants: []

  - name: seat_loyalty_award
    trigger: "On TastingSeat -> ATTENDED"
    algorithm: threshold
    formula: |
      # Base: 1 pt per 100 cents spent, multiplied by tier multiplier
      base_pts = floor(seat.price_paid_cents / 100)
      multiplier = {BRONZE: 1.0, SILVER: 1.25, GOLD: 1.5, PLATINUM: 2.0}[member.loyalty_tier]
      seat.loyalty_points_awarded = round_half_up(base_pts * multiplier, 0)
    input_set: "TastingSeat.price_paid_cents, Member.loyalty_tier at check-in time"
    constants: {}
    precision: "integer points; round_half_up"
    variants: []

  - name: shipping_charge_compose
    trigger: "On Order submit when channel=DTC"
    algorithm: tiered_pricing
    formula: |
      # Three components summed: flat base + per-bottle + state surcharge
      # Boundary: 0-bottle order is impossible (>=1 line with qty>=1), so surcharge always applies.
      # Total bottles = sum(qty across lines)
      shipping_charge_cents = 500 + 150 * total_bottles + state_rule.surcharge_cents_per_order
    input_set: "Order lines, ShippingStateRule for destination"
    constants:
      DTC_BASE_CENTS: 500
      DTC_PER_BOTTLE_CENTS: 150
    precision: "integer cents"
    variants: []

  - name: order_tax_compose
    trigger: "On Order submit; on line mutation while DRAFT"
    algorithm: tiered_pricing
    formula: |
      # tax = round_half_up((subtotal - loyalty_discount + shipping) * tax_rate_bps / 10000)
      # Boundary precision: tax is computed AFTER loyalty redemption (so reducing taxable).
      # State tax_rate_bps = 0 produces tax_cents = 0.
      taxable = subtotal_cents - loyalty_discount_cents + shipping_charge_cents
      tax_cents = round_half_up(taxable * state_rule.tax_rate_bps / 10000, 0)
    input_set: "Order subtotal/discount/shipping, ShippingStateRule.tax_rate_bps"
    constants: {}
    precision: "integer cents; round_half_up"
    variants: []

  - name: sku_on_hand_recompute
    trigger: "On any InventoryLot insert/update/delete for the SKU"
    algorithm: aggregation
    formula: |
      sku.on_hand_cached = sum(lot.qty_remaining for lot in InventoryLot.where(sku_id=sku.id, status IN {ACTIVE, DEPLETED}))
      # QUARANTINED and EXPIRED lots are excluded.
    input_set: "InventoryLot rows for the SKU with status IN {ACTIVE, DEPLETED}"
    constants: {}
    precision: "integer"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and (where required) X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template and FK-referenced entities exist (Category, SKU, Member, Order, TastingEvent, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Required input fields present and well-typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target entity's current state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Age-attestation: when an Order or TastingSeat involves a SKU with age_neutral_class=ADULT_ONLY_REQUIRED, Member.age_attestation_status MUST be ATTESTED"
    error_id: ERR_AGE_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit", "POST /nabs/tasting-seats", "POST /nabs/orders"]

  - priority: 7
    category: business_safety
    check: "Compliance hold: TastingEvent cannot transition DRAFT -> PUBLISHED while compliance_hold == true (any FlightItem SKU is PROHIBITED_STATE_LIST in shop state)"
    error_id: ERR_COMPLIANCE_HOLD
    http_status: 422
    applies_to: ["POST /nabs/tasting-events/{id}/publish"]

  - priority: 8
    category: business_safety
    check: "Segregation of duties: SpecialOrder approve requires approved_by_user_id != member_id; ComplianceAttestation approve requires officer != original attested_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /nabs/special-orders/{id}/approve", "POST /nabs/members/{id}/attestations/{att_id}/approve"]

  - priority: 9
    category: business_temporal
    check: "TastingEvent temporal: ends_at strictly after starts_at; new starts_at (on reschedule) strictly in future"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: ["POST /nabs/tasting-events", "PUT /nabs/tasting-events/{id}", "POST /nabs/tasting-events/{id}/reschedule"]

  - priority: 10
    category: business_temporal
    check: "Seat booking window: TastingSeat can only be created/confirmed while TastingEvent.status IN {PUBLISHED, RESCHEDULED} (not LOCKED, IN_SESSION, COMPLETED, CANCELLED)"
    error_id: ERR_BOOKING_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /nabs/tasting-seats", "POST /nabs/tasting-seats/{id}/confirm"]

  - priority: 11
    category: business_constraint
    check: "Capacity: TastingEvent.seats_booked < capacity at booking; ClubPlan.active_subscription_count < max_active_subscriptions at subscribe"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /nabs/tasting-seats", "POST /nabs/club-subscriptions"]

  - priority: 12
    category: business_constraint
    check: "Uniqueness: SKU.sku_code, Category.code, ClubPlan.code, Member.email, ShippingStateRule.state_code, InventoryLot (sku_id, lot_code)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /nabs/skus", "POST /nabs/categories", "POST /nabs/club-plans", "POST /nabs/members", "POST /nabs/shipping-state-rules", "POST /nabs/skus/{id}/lots"]

  - priority: 13
    category: business_referential
    check: "Shipping state allows DTC: ShippingStateRule[ship_to_state_code].allows_dtc == true"
    error_id: ERR_DTC_STATE_PROHIBITED
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit"]

  - priority: 14
    category: business_referential
    check: "SKU ABV under state cap: every line's SKU.abv_basis_points <= ShippingStateRule[ship_to_state_code].abv_cap_basis_points"
    error_id: ERR_SKU_ABV_STATE_EXCEEDED
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit"]

  - priority: 15
    category: business_referential
    check: "SKU shippable to state: SKU.ship_state_overrides does not contain PROHIBITED entry for ship_to_state_code, and category is not in the state's prohibited list"
    error_id: ERR_SKU_STATE_PROHIBITED
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit"]

  - priority: 16
    category: business_fiscal
    check: "Loyalty redemption: Member.loyalty_points_balance >= loyalty_points_redeemed at submit"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit"]

  - priority: 17
    category: business_fiscal
    check: "Inventory: sufficient qty_remaining across FEFO lot walk for every line"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: ["POST /nabs/orders/{id}/submit", "POST /nabs/tasting-events/{id}/publish"]

  - priority: 18
    category: business_fiscal
    check: "Wallet hold: SpecialOrder approve requires Member.wallet_credit_cents >= deposit_cents"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 422
    applies_to: ["POST /nabs/special-orders/{id}/approve"]

  - priority: 19
    category: state
    check: "Optimistic concurrency: expected_<parent>_version matches parent's current version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /nabs/orders/{id}/submit", "POST /nabs/tasting-events/{id}/seats", "POST /nabs/club-subscriptions"]

