# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances. Every grounds[] resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every setup_api_calls/trigger chain is executable from empty-DB
# using only §1.5 endpoints; literals pre-computed against §1.3 formulas.
#
# Canonical fixtures used across instances:
#   - Institution clock set via POST /institutions/{id}/_clock/set_current_utc.
#   - Term FALL2026: term_start 2026-09-01, term_end 2026-12-31 (122 days),
#     enroll_open 2026-08-01, enroll_close 2026-09-30.
#   - Template 4PAY: installment_count=4, down_payment_pct=0.20, plan_fee=4500,
#     grace=3. Schedule for net 320000 -> [80000,80000,80000,80000], dues
#     2026-09-25 / 10-19 / 11-12 / 12-06 (cadence floor(122/5)=24).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_variant_diverges_date_vs_schedule
        grounds:
          - calculations.refund_proration
          - entities.Withdrawal.fields.retained_charges_cents
          - entities.Withdrawal.fields.refund_to_student_cents
          - entities.Institution.fields.refund_policy
        distinguishing_aspect: |
          Identical inputs (gross 500000, aid 100000, paid_principal 240000,
          withdrawal at day 30 of a 122-day term) yield retained_charges 122951
          under DATE_BASED (continuous days_elapsed/term_total_days) but 250000
          under SCHEDULE_BASED (22-42 day bracket = 50%); refund_to_student is
          217049 vs 90000 — a different result on the Withdrawal entity domain.
        test_recipe:
          setup:
            - "Institution INST_A refund_policy=DATE_BASED, clock 2026-09-15."
            - "Term FALL2026 OPEN; Student S1; Template 4PAY; Enrollment E1 ACTIVE on 4PAY with charges 500000, aid 100000; down 80000 + installments 1 and 2 (80000 each) SETTLED -> paid_principal 240000."
            - "Clock advanced to 2026-09-30 (day 30)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst A", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_a: $.data.id }
            - call: "POST /institutions/${inst_a}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_a}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_a: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_a}", external_ref: "S1", full_name: "Stu One", email: "s1@x.edu" }
              as: Registrar
              captures: { stu_1: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_a}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_4pay: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_1}", term_id: "${term_a}", plan_template_id: "${tpl_4pay}" }
              as: Registrar
              captures: { enr_1: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_1}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${enr_1}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_1}"
              as: Registrar
              captures: { enr1_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_1}/activate"
              payload: { expected_enrollment_version: "${enr1_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_1}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { pay_down: $.data.id }
            - call: "POST /institutions/payments/${pay_down}/settle"
              as: Bursar
            - call: "GET /institutions/installments?enrollment_id=${enr_1}"
              as: Registrar
              captures: { inst1: $.data.0.id, inst2: $.data.1.id }
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_1}", purpose: "INSTALLMENT", amount_cents: 80000, installment_id: "${inst1}" }
              as: Bursar
              captures: { pay_i1: $.data.id }
            - call: "POST /institutions/payments/${pay_i1}/settle"
              as: Bursar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_1}", purpose: "INSTALLMENT", amount_cents: 80000, installment_id: "${inst2}" }
              as: Bursar
              captures: { pay_i2: $.data.id }
            - call: "POST /institutions/payments/${pay_i2}/settle"
              as: Bursar
            - call: "POST /institutions/${inst_a}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00.000Z" }
              as: Registrar
          trigger:
            - call: "GET /institutions/enrollments/${enr_1}"
              as: Registrar
              captures: { enr1_vw: $.data.version }
            - call: "POST /institutions/enrollments/${enr_1}/withdraw"
              payload: { effective_date: "2026-09-30T00:00:00.000Z", expected_enrollment_version: "${enr1_vw}" }
              as: Registrar
            - call: "GET /institutions/withdrawals?enrollment_id=${enr_1}"
              as: Registrar
              captures: { wd_retained: $.data.0.retained_charges_cents, wd_refund: $.data.0.refund_to_student_cents }
          assert:
            - "Withdrawal.${enr_1}.variant_used == DATE_BASED"
            - "Withdrawal.${enr_1}.retained_charges_cents == 122951"
            - "Withdrawal.${enr_1}.refund_to_student_cents == 217049"

      - name: hold_reason_count_vs_amount_distinct_thresholds
        grounds:
          - calculations.delinquency_evaluation
          - entities.Hold.fields.reason
          - state_machines.Installment.SCHEDULED_to_OVERDUE
        distinguishing_aspect: |
          delinquency_evaluation produces a Hold whose reason differs by which
          conserved threshold tripped: 3 overdue installments of 40000 (total
          120000 < 150000) -> reason DELINQUENCY_COUNT, while 2 overdue
          installments of 80000 (total 160000 >= 150000, count 2 < 3) ->
          reason DELINQUENCY_AMOUNT. Same evaluation, two distinct cause domains
          (installment count vs overdue cents).
        test_recipe:
          setup:
            - "Institution INST_B clock 2026-09-15; Term FALL2026 OPEN; Student S2; Template 5PAY (installment_count=5, down 0, plan_fee 0, grace 3)."
            - "Enrollment ACTIVE with charges 200000 -> installments [40000 x5] dues 09-21/10-11/10-31/11-20/12-10."
            - "Clock advanced to 2026-11-05 so installments 1,2,3 are past due+grace (count=3, total 120000)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst B", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_b: $.data.id }
            - call: "POST /institutions/${inst_b}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_b}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_b: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_b}", external_ref: "S2", full_name: "Stu Two", email: "s2@x.edu" }
              as: Registrar
              captures: { stu_2: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_b}", name: "5PAY", installment_count: 5, down_payment_pct: 0, plan_fee_cents: 0, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_5pay: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_2}", term_id: "${term_b}", plan_template_id: "${tpl_5pay}" }
              as: Registrar
              captures: { enr_2: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_2}", kind: "TUITION", amount_cents: 200000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_2}"
              as: Registrar
              captures: { enr2_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_2}/activate"
              payload: { expected_enrollment_version: "${enr2_v0}" }
              as: Registrar
            - call: "POST /institutions/${inst_b}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00.000Z" }
              as: Registrar
          trigger:
            - call: "POST /institutions/enrollments/${enr_2}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/holds?enrollment_id=${enr_2}"
              as: Registrar
              captures: { hold_reason: $.data.0.reason }
          assert:
            - "Enrollment.${enr_2}.delinquent_installment_count == 3"
            - "Hold for enrollment ${enr_2} exists with status ACTIVE and reason == DELINQUENCY_COUNT"
            - "Student.${stu_2}.has_active_hold == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_tiered_clamp_three_inputs
        grounds:
          - calculations.late_fee_assessment
          - entities.LateFee.fields.amount_cents
          - state_machines.Installment.SCHEDULED_to_OVERDUE
        distinguishing_aspect: |
          MODE (a): late_fee = clamp(max(FLAT 2500, round_half_up(overdue*pct)),
          MIN 2500, MAX 7500) with pct selected by a day-tier branch — three
          interacting inputs (overdue amount, days_late tier, running cap) and
          nested max/min. overdue 80000 at 12 days late (tier 4%) -> 3200, NOT
          the flat floor and NOT the cap.
        test_recipe:
          setup:
            - "Institution INST_C clock 2026-09-15; Term FALL2026 OPEN; Student S3; Template 4PAY."
            - "Enrollment ACTIVE charges 500000 aid 100000 -> installment[1]=80000 due 2026-09-25; down 80000 SETTLED."
            - "Clock advanced to 2026-10-07 so installment 1 is 12 days late."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst C", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_c: $.data.id }
            - call: "POST /institutions/${inst_c}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_c}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_c: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_c}", external_ref: "S3", full_name: "Stu Three", email: "s3@x.edu" }
              as: Registrar
              captures: { stu_3: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_c}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_c: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_3}", term_id: "${term_c}", plan_template_id: "${tpl_c}" }
              as: Registrar
              captures: { enr_3: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_3}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${enr_3}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_3}"
              as: Registrar
              captures: { enr3_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_3}/activate"
              payload: { expected_enrollment_version: "${enr3_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_3}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { pay_d3: $.data.id }
            - call: "POST /institutions/payments/${pay_d3}/settle"
              as: Bursar
            - call: "POST /institutions/${inst_c}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-07T00:00:00.000Z" }
              as: Registrar
          trigger:
            - call: "POST /institutions/enrollments/${enr_3}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/late-fees?enrollment_id=${enr_3}"
              as: Registrar
              captures: { lf_amt: $.data.0.amount_cents, lf_days: $.data.0.days_late }
          assert:
            - "LateFee for enrollment ${enr_3} has amount_cents == 3200"
            - "LateFee.days_late == 12"
            - "Enrollment.${enr_3}.late_fee_balance_cents == 3200"

      - name: installment_schedule_round_then_floor_remainder
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount_cents
          - state_machines.Enrollment.PENDING_to_ACTIVE
        distinguishing_aspect: |
          MODE (b): the activation pins a rounding ORDER — round_half_up the down
          payment FIRST (net 533300 * 0.15 -> 79995), THEN floor the financed
          split (453305 / 5 = 90661 each, remainder 0). Reversing the order
          (floor financed before rounding down) would mis-distribute cents; the
          scaffold fixes round-then-floor and the test pins the exact per-line
          amounts.
        test_recipe:
          setup:
            - "Institution INST_D clock 2026-09-15; Term FALL2026 OPEN; Student S4; Template 5PAY15 (installment_count=5, down_payment_pct=0.15, plan_fee 0, grace 3)."
            - "Enrollment PENDING with charges 533300, no aid."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst D", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_d: $.data.id }
            - call: "POST /institutions/${inst_d}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_d}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_d: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_d}", external_ref: "S4", full_name: "Stu Four", email: "s4@x.edu" }
              as: Registrar
              captures: { stu_4: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_d}", name: "5PAY15", installment_count: 5, down_payment_pct: 0.15, plan_fee_cents: 0, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_d: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_4}", term_id: "${term_d}", plan_template_id: "${tpl_d}" }
              as: Registrar
              captures: { enr_4: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_4}", kind: "TUITION", amount_cents: 533300 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_4}"
              as: Registrar
              captures: { enr4_v0: $.data.version }
          trigger:
            - call: "POST /institutions/enrollments/${enr_4}/activate"
              payload: { expected_enrollment_version: "${enr4_v0}" }
              as: Registrar
            - call: "GET /institutions/installments?enrollment_id=${enr_4}"
              as: Registrar
              captures: { i0_amt: $.data.0.amount_cents }
          assert:
            - "Enrollment.${enr_4}.down_payment_cents == 79995"
            - "Enrollment.${enr_4}.financed_principal_cents == 453305"
            - "Every Installment.amount_cents for ${enr_4} == 90661 (5 installments summing to 453305)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: installment_parallel_dimension_independent_of_enrollment
        grounds:
          - state_machines.Installment
          - state_machines.Enrollment
          - entities.Installment.fields.status
        distinguishing_aspect: |
          Installment carries its own SCHEDULED/OVERDUE/PAID axis that evolves
          independently of the parent Enrollment's PENDING/ACTIVE/COMPLETED axis:
          one installment can be PAID while siblings are OVERDUE and the
          Enrollment stays ACTIVE — two parallel state dimensions on different
          entities, not a single linear pipeline.
        test_recipe:
          setup:
            - "Reuse the count-hold fixture style: Institution INST_E clock 2026-09-15; Term FALL2026; Student S5; Template 5PAY (down 0)."
            - "Enrollment ACTIVE charges 200000 -> [40000 x5]; clock 2026-11-05 so installments 1,2,3 OVERDUE."
            - "Installment 1 then fully paid (40000 SETTLED) while 2,3 remain OVERDUE."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst E", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_e: $.data.id }
            - call: "POST /institutions/${inst_e}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_e}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_e: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_e}", external_ref: "S5", full_name: "Stu Five", email: "s5@x.edu" }
              as: Registrar
              captures: { stu_5: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_e}", name: "5PAY", installment_count: 5, down_payment_pct: 0, plan_fee_cents: 0, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_e: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_5}", term_id: "${term_e}", plan_template_id: "${tpl_e}" }
              as: Registrar
              captures: { enr_5: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_5}", kind: "TUITION", amount_cents: 200000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_5}"
              as: Registrar
              captures: { enr5_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_5}/activate"
              payload: { expected_enrollment_version: "${enr5_v0}" }
              as: Registrar
            - call: "POST /institutions/${inst_e}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/enrollments/${enr_5}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/installments?enrollment_id=${enr_5}"
              as: Registrar
              captures: { e5_i1: $.data.0.id }
          trigger:
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_5}", purpose: "INSTALLMENT", amount_cents: 40000, installment_id: "${e5_i1}" }
              as: Bursar
              captures: { e5_pay1: $.data.id }
            - call: "POST /institutions/payments/${e5_pay1}/settle"
              as: Bursar
            - call: "GET /institutions/installments/${e5_i1}"
              as: Registrar
              captures: { e5_i1_status: $.data.status }
          assert:
            - "Installment ${e5_i1} status == PAID"
            - "Enrollment.${enr_5}.status == ACTIVE (unchanged; installments 2,3 still OVERDUE)"
            - "Enrollment.${enr_5}.delinquent_installment_count == 2"

      - name: charge_cycle_posted_reversed_recalc
        grounds:
          - state_machines.Charge
          - state_machines.Enrollment
          - calculations.balance_recalc_on_charge
        distinguishing_aspect: |
          Charge has a POSTED->REVERSED branch whose REVERSED side-effect runs a
          NEGATIVE balance_recalc that mutates the Enrollment's installment
          amounts — a branch with a divergent side-effect set (reversal shrinks
          scheduled_balance) living on a different entity (Charge) than the
          Installment parallel machine in the sibling instance.
        test_recipe:
          setup:
            - "Institution INST_F clock 2026-09-15; Term FALL2026; Student S6; Template 4PAY."
            - "Enrollment ACTIVE with two charges: base 500000 and extra 60000, aid 100000; activated when only base present -> [80000 x4]; extra charge 60000 posted after activation -> [95000 x4]."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst F", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_f: $.data.id }
            - call: "POST /institutions/${inst_f}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_f}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_f: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_f}", external_ref: "S6", full_name: "Stu Six", email: "s6@x.edu" }
              as: Registrar
              captures: { stu_6: $.data.id }
            - call: "POST /institutions/plan-templates"
