# =============================================================================
# §1.8 Scaffold Difficulty Design — Specialty Pharmacy Hub & Copay Assistance
# Nine Difficulty Rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: copay_accumulator_plan_split_divergence
        grounds:
          - calculations.patient_responsibility_split
          - entities.BenefitsInvestigation.fields.plan_has_accumulator
          - entities.Enrollment.fields.payer_accumulated_oop_cents
        distinguishing_aspect: |
          Same fill economics (cost share 20000, card per-fill cap 15000) produce
          payer_accumulator_delta_cents == 5000 on an accumulator plan but == 20000 on a
          non-accumulator plan — dual-variant behavior on the Enrollment/CopayAssistance
          fiscal domain (distinct from the shipment-adherence domain of the other instance).
        test_recipe:
          setup:
            - "One program (no training, no cold chain) with card caps 15000/100000"
            - "Enrollment A with BI plan_has_accumulator=true, cost share 20000, oop_max 500000, no PA required -> APPROVED"
            - "Enrollment B identical except plan_has_accumulator=false"
            - "Both matched to COPAY_CARD (ACTIVE) and each has one SCHEDULED fill"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgX", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-A", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_a: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_a}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-A", requires_prior_auth: false, plan_has_accumulator: true, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_a}", as: CaseManager, captures: { enr_a_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_a}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_a_v}" }, as: FinancialCounselor, captures: { asst_a: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_a}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_a: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-B", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_b: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_b}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-B", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_b}", as: CaseManager, captures: { enr_b_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_b}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_b_v}" }, as: FinancialCounselor }
            - { call: "POST /hub/enrollments/${enr_b}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_b: $.data.id } }
          trigger:
            - { call: "POST /hub/shipments/${ship_a}/ship", payload: {}, as: PharmacyPartner, captures: { delta_a: $.data.payer_accumulator_delta_cents, apay_a: $.data.assistance_pay_cents } }
            - { call: "POST /hub/shipments/${ship_b}/ship", payload: {}, as: PharmacyPartner, captures: { delta_b: $.data.payer_accumulator_delta_cents, apay_b: $.data.assistance_pay_cents } }
          assert:
            - "both splits agree on the assistance side: ${apay_a} == 15000 and ${apay_b} == 15000; patient_pay_cents == 5000 on both"
            - "accumulator plan: ${delta_a} == 5000 (assistance excluded from OOP accrual)"
            - "non-accumulator plan: ${delta_b} == 20000 (assistance counts toward OOP)"
            - "GET enrollment A: payer_accumulated_oop_cents == 5000, remaining_oop_cents == 495000; enrollment B: 20000 / 480000"
      - name: pdc_provisional_vs_confirmed_divergence
        grounds:
          - calculations.pdc_adherence
          - entities.Enrollment.fields.pdc_confirmed_pct
          - entities.Enrollment.fields.pdc_provisional_pct
        distinguishing_aspect: |
          With one DELIVERED 30-day fill, one SHIPPED-not-delivered 30-day fill, and a
          40-day therapy window, the confirmed variant reads 75.0 while the provisional
          variant reads 100.0 on the same data — dual-variant behavior on the
          Shipment/adherence domain (distinct from the fiscal domain of the other instance).
        test_recipe:
          setup:
            - "Enrollment APPROVED->ACTIVE via first fill delivered 2026-08-01 (30 days supply); refill shipped 2026-08-21 and still in SHIPPED"
            - "logical clock advanced to 2026-09-10 (window = 40 days)"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgY", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-C", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-C", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-01" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: HubAdmin }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-22", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_2: $.data.id } }
            - { call: "POST /hub/shipments/${ship_2}/ship", payload: {}, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: HubAdmin }
          trigger:
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { pdc_c: $.data.pdc_confirmed_pct, pdc_p: $.data.pdc_provisional_pct } }
          assert:
            - "${pdc_c} == 75.0  (confirmed counts only DELIVERED: min(40, 30)/40)"
            - "${pdc_p} == 100.0 (provisional counts SHIPPED+DELIVERED: min(40, 60)/40)"
            - "the two variants disagree on identical shipment data; neither uses shipment ids for any ordering"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: copay_card_nested_min_branch_switching
        grounds:
          - calculations.patient_responsibility_split
          - entities.CopayAssistance.fields.remaining_annual_benefit_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: the 3-input nested min switches binding branch across two
          fills of one card — fill 1 binds on per_fill_cap (15000 of 20000 annual), fill 2
          binds on remaining_annual_benefit (5000 left) — exercising non-linear interaction
          of cap, remaining balance, and cost share.
        test_recipe:
          setup:
            - "Program with per_fill_cap 15000 and annual_cap 20000; enrollment APPROVED with BI cost share 20000, no accumulator, COPAY_CARD ACTIVE"
            - "fill 1 shipped; clock advanced 21 days so the refill gate passes (pdc 100.0)"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgCap", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 20000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-D", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-D", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor, captures: { asst_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner, captures: { apay_1: $.data.assistance_pay_cents, ppay_1: $.data.patient_pay_cents } }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-01" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: HubAdmin }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-23", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_2: $.data.id } }
          trigger:
            - { call: "POST /hub/shipments/${ship_2}/ship", payload: {}, as: PharmacyPartner, captures: { apay_2: $.data.assistance_pay_cents, ppay_2: $.data.patient_pay_cents } }
          assert:
            - "fill 1: ${apay_1} == 15000 (per_fill_cap branch of the nested min) and ${ppay_1} == 5000"
            - "fill 2: ${apay_2} == 5000 (remaining-annual branch: 20000 - 15000 left) and ${ppay_2} == 15000"
            - "CopayAssistance ${asst_id}: remaining_annual_benefit_cents == 0, disbursed_cents == 20000, status == EXHAUSTED"
            - "enrollment.payer_accumulated_oop_cents == 40000 (non-accumulator: full cost share accrues per fill)"
      - name: foundation_per_fill_rounding_order
        grounds:
          - calculations.foundation_split
          - entities.CopayAssistance.fields.disbursed_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct mode from the nested-min instance): per-fill
          round_half_up THEN sum is pinned — cost share 999 at 50% over 3 fills yields
          500+500+500 = 1500, while the forbidden sum-then-round order yields
          round_half_up(1498.5) = 1499; the test pins 1500.
        test_recipe:
          setup:
            - "Foundation pool (coverage 50%, grant 200000) eligible for enrollment (diagnosis C50, window covers clock)"
            - "Enrollment APPROVED with BI cost share 999 (odd cents to expose rounding order), FOUNDATION grant ACTIVE"
            - "three fills shipped, each after satisfying adherence and spacing gates via clock advances"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgF", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/foundation-pools", payload: { name: "Fund50", diagnosis_code: "C50", total_funding_cents: 5000000, grant_amount_cents: 200000, coverage_pct: 50, start_date: "2026-01-01", end_date: "2026-12-31" }, as: HubAdmin, captures: { pool_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-E", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-E", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 999, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "FOUNDATION", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor, captures: { asst_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner, captures: { apay_1: $.data.assistance_pay_cents } }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-01" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: HubAdmin }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-22", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_2: $.data.id } }
            - { call: "POST /hub/shipments/${ship_2}/ship", payload: {}, as: PharmacyPartner, captures: { apay_2: $.data.assistance_pay_cents } }
            - { call: "POST /hub/shipments/${ship_2}/deliver", payload: { delivered_date: "2026-08-22" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T00:00:00Z" }, as: HubAdmin }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-09-12", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_3: $.data.id } }
          trigger:
            - { call: "POST /hub/shipments/${ship_3}/ship", payload: {}, as: PharmacyPartner, captures: { apay_3: $.data.assistance_pay_cents } }
            - { call: "GET /hub/enrollments/${enr_id}/copay-assistances", as: FinancialCounselor, captures: { disbursed: "$.data[0].disbursed_cents", remaining: "$.data[0].remaining_annual_benefit_cents" } }
          assert:
            - "per-fill payout is round_half_up(999 * 50 / 100) = round_half_up(499.5) == 500 on every fill: ${apay_1} == 500, ${apay_2} == 500, ${apay_3} == 500"
            - "${disbursed} == 1500 (per-fill-then-sum); the sum-then-round alternative 1499 is non-conforming"
            - "${remaining} == 198500 (grant 200000 - 1500)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_pa_denial_appeal_cycle
        grounds:
          - state_machines.Enrollment.PA_PENDING_to_PA_DENIED
          - state_machines.Enrollment.PA_DENIED_to_PA_PENDING
        distinguishing_aspect: |
          Enrollment carries a denial/appeal CYCLE (PA_PENDING -> PA_DENIED -> PA_PENDING);
          the other non-linear instance lives on a different entity (PriorAuthorization).
        test_recipe:
          setup: ["enrollment with BI requires_prior_auth=true and a SUBMITTED PA (enrollment PA_PENDING)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgPA", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-F", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-F", requires_prior_auth: true, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/prior-authorization", payload: { clinical_notes: "notes", payer_reference: "PA-1" }, as: CaseManager, captures: { pa_id: $.data.id } }
          trigger:
            - { call: "POST /hub/prior-authorizations/${pa_id}/decision", payload: { outcome: "DENIED", rationale: "insufficient documentation" }, as: PayerReviewer }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { st_denied: $.data.status } }
            - { call: "POST /hub/prior-authorizations/${pa_id}/appeal", payload: { clinical_notes: "additional chart notes" }, as: CaseManager, captures: { round_after: $.data.appeal_round } }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { st_appealed: $.data.status } }
          assert:
            - "after denial: ${st_denied} == PA_DENIED (cycle's backward arc entered)"
            - "after appeal: ${st_appealed} == PA_PENDING (cycle returns to the earlier state, not a new one)"
            - "${round_after} == 1"
      - name: prior_authorization_appeal_rounds_to_final_denial
        grounds:
          - state_machines.PriorAuthorization.DENIED_to_APPEALED
          - state_machines.PriorAuthorization.APPEALED_to_DENIED
          - state_machines.PriorAuthorization.APPEALED_to_DENIED_FINAL
        distinguishing_aspect: |
          PriorAuthorization cycles SUBMITTED/APPEALED -> DENIED -> APPEALED until
          appeal_round hits the cap 2, when a denial lands on DENIED_FINAL and the
          enrollment closes — a cycle on a DIFFERENT entity than Enrollment.
        test_recipe:
          setup: ["enrollment PA_PENDING with a SUBMITTED PA (appeal_round 0)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgPA2", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-G", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-G", requires_prior_auth: true, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/prior-authorization", payload: { clinical_notes: "notes", payer_reference: "PA-1" }, as: CaseManager, captures: { pa_id: $.data.id } }
          trigger:
            - { call: "POST /hub/prior-authorizations/${pa_id}/decision", payload: { outcome: "DENIED", rationale: "r1" }, as: PayerReviewer, captures: { st1: $.data.status } }
            - { call: "POST /hub/prior-authorizations/${pa_id}/appeal", payload: {}, as: CaseManager }
            - { call: "POST /hub/prior-authorizations/${pa_id}/decision", payload: { outcome: "DENIED", rationale: "r2" }, as: PayerReviewer, captures: { st2: $.data.status } }
            - { call: "POST /hub/prior-authorizations/${pa_id}/appeal", payload: {}, as: CaseManager, captures: { round2: $.data.appeal_round } }
            - { call: "POST /hub/prior-authorizations/${pa_id}/decision", payload: { outcome: "DENIED", rationale: "r3" }, as: PayerReviewer, captures: { st3: $.data.status } }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_st: $.data.status } }
            - { call: "POST /hub/prior-authorizations/${pa_id}/appeal", payload: {}, as: CaseManager, captures: { err4: $.data.error_id } }
          assert:
            - "${st1} == DENIED (round 0 denial stays appealable)"
            - "${st2} == DENIED (round 1 denial still below the cap) and ${round2} == 2"
            - "${st3} == DENIED_FINAL (round 2 denial is terminal)"
            - "${enr_st} == DENIED_CLOSED"
            - "further appeal rejected: ${err4} == ERR_ALREADY_TERMINAL"
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pa_approval_cascade_activates_assistance_and_shipment
        grounds:
          - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
          - state_machines.Enrollment.PA_PENDING_to_APPROVED
          - state_machines.CopayAssistance.RESERVED_to_ACTIVE
          - state_machines.Shipment.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Depth-3 chain from the PA-approval trigger: PA.APPROVED mutates Enrollment
          (PA_PENDING -> APPROVED); that enrollment transition itself activates the
          RESERVED CopayAssistance; and the assistance activation (not the PA decision
          directly) releases the financial-clearance gate so the REQUESTED shipment
          becomes SCHEDULED. The other cascade instance starts from a different trigger
          (shipment spoilage).
        test_recipe:
          setup:
            - "enrollment PA_PENDING (BI required PA), injection training completed, COPAY_CARD matched while PA pending (assistance RESERVED), one fill created (shipment REQUESTED, blocked by the RESERVED assistance)"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgCas", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: true, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-H", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-H", requires_prior_auth: true, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/prior-authorization", payload: { clinical_notes: "notes", payer_reference: "PA-1" }, as: CaseManager, captures: { pa_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/nurse-visits", payload: { nurse_id: "nurse-1", window_start: "2026-08-02T14:00:00Z", window_end: "2026-08-02T15:00:00Z" }, as: CaseManager, captures: { visit_id: $.data.id } }
            - { call: "POST /hub/nurse-visits/${visit_id}/resolve", payload: { outcome: "COMPLETED" }, as: NurseEducator, as_user_id: "nurse-1" }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor, captures: { asst_status_pre: $.data.status } }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-05", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_id: $.data.id, ship_status_pre: $.data.status } }
          trigger:
            - { call: "POST /hub/prior-authorizations/${pa_id}/decision", payload: { outcome: "APPROVED", rationale: "criteria met" }, as: PayerReviewer, captures: { pa_st: $.data.status } }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_st: $.data.status } }
            - { call: "GET /hub/enrollments/${enr_id}/copay-assistances", as: FinancialCounselor, captures: { asst_st: "$.data[0].status" } }
            - { call: "GET /hub/enrollments/${enr_id}/shipments", as: CaseManager, captures: { ship_st: "$.data[0].status" } }
          assert:
            - "pre-approval: ${asst_status_pre} == RESERVED and ${ship_status_pre} == REQUESTED"
            - "link 1: ${pa_st} == APPROVED; link 2: ${enr_st} == APPROVED"
            - "link 3: ${asst_st} == ACTIVE (reservation activated by the enrollment transition)"
            - "link 4 (depth-3 terminus): ${ship_st} == SCHEDULED (financial clearance opened by the assistance activation)"
      - name: spoil_reversal_cascade_restores_benefit_and_accumulator
        grounds:
          - state_machines.Shipment.SHIPPED_to_SPOILED
          - entities.CopayAssistance.fields.remaining_annual_benefit_cents
          - entities.Enrollment.fields.payer_accumulated_oop_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (shipment spoilage, not PA approval):
          Shipment.SPOILED mutates the CopayAssistance ledger (credit 15000 back); that
          reversal itself rolls back Enrollment.payer_accumulated_oop_cents by the fill's
          payer_accumulator_delta_cents — compensation chained hop-by-hop, not fan-out.
        test_recipe:
          setup:
            - "enrollment APPROVED (no PA), COPAY_CARD ACTIVE, one fill SHIPPED with assistance_pay 15000 and accumulator delta 20000 (non-accumulator plan)"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgSp", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-I", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-I", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_id: $.data.id } }
            - { call: "POST /hub/shipments/${ship_id}/ship", payload: {}, as: PharmacyPartner }
          trigger:
            - { call: "POST /hub/shipments/${ship_id}/spoil", payload: { reason: "temperature excursion" }, as: PharmacyPartner, captures: { ship_st: $.data.status } }
            - { call: "GET /hub/enrollments/${enr_id}/copay-assistances", as: FinancialCounselor, captures: { rem: "$.data[0].remaining_annual_benefit_cents", disb: "$.data[0].disbursed_cents" } }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { acc: $.data.payer_accumulated_oop_cents, rem_oop: $.data.remaining_oop_cents } }
          assert:
            - "${ship_st} == SPOILED"
            - "link 1 (assistance ledger reversed): ${rem} == 100000 and ${disb} == 0"
            - "link 2 (caused by link 1): ${acc} == 0 and ${rem_oop} == 500000 — the 20000 accrual was rolled back by the reversal, not by the spoil directly"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_terminal_enrollment_match
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: a FOUNDATION match against a
          DISCONTINUED enrollment with zero eligible pools violates both priority 4
          (ERR_ENROLLMENT_DISCONTINUED) and priority 8 (ERR_NO_ELIGIBLE_FOUNDATION);
          priority 4 must win. The other instance exercises a different pair
          (business_safety x business_temporal).
        test_recipe:
          setup: ["enrollment DISCONTINUED (discontinued after approval); no foundation pools exist, so eligibility would also fail"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgPr1", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-J", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-J", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/discontinue", payload: { reason: "patient withdrew" }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "FOUNDATION", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ENROLLMENT_DISCONTINUED (priority 4 state) — never ERR_NO_ELIGIBLE_FOUNDATION (priority 8 fiscal)"
      - name: cold_chain_beats_refill_spacing
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair business_safety x business_temporal (different pair than the
          other instance): a refill with transit_hours 72 > max 48 AND a delivery date
          inside the minimum spacing window fails both priority 5 and priority 7; the
          safety error ERR_COLD_CHAIN_EXCEEDED must win.
        test_recipe:
          setup:
            - "cold-chain program (max_transit_hours 48, min_days_between_fills 20); enrollment ACTIVE with fill 1 delivered 2026-08-10"
            - "logical clock at 2026-08-10 so requested_delivery_date 2026-08-20 is schema-valid but violates spacing (08-10 + 20 = 08-30)"
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgCC", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: true, max_transit_hours: 48, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-K", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-K", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: HubAdmin }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-10" }, as: PharmacyPartner }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-20", transit_hours: 72, days_supply: 30 }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_COLD_CHAIN_EXCEEDED (priority 5 safety) — never ERR_REFILL_SPACING_VIOLATION (priority 7 temporal), although both are violated"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refill_gate_adherence_exactly_80_passes
        grounds:
          - calculations.pdc_adherence
          - errors[ERR_ADHERENCE_TOO_LOW]
        distinguishing_aspect: |
          Metric = PDC percent, reached via POST /hub/enrollments/{id}/shipments: exactly
          80.0 (20 covered days / 25 window days) PASSES the >= 80.0 refill gate — the
          boundary is inclusive. Distinct metric and distinct endpoint from the
          cents-exhaustion instance.
        test_recipe:
          setup: ["fill 1 (days_supply 20) delivered 2026-08-01; logical clock at 2026-08-26 so the PDC window is exactly 25 days"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgB1", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 20 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-L", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-L", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 20 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-01" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: HubAdmin }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-26", transit_hours: 24, days_supply: 20 }, as: CaseManager, captures: { fill_no: $.data.fill_number, ftype: $.data.fill_type, st: $.data.status } }
          assert:
            - "pdc_confirmed_pct at creation is exactly 80.0 (20/25) and the >= gate admits the refill: HTTP 201"
            - "${fill_no} == 2 and ${ftype} == REFILL and ${st} == SCHEDULED"
      - name: copay_benefit_exact_exhaustion
        grounds:
          - calculations.patient_responsibility_split
          - state_machines.CopayAssistance.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Metric = remaining benefit cents hitting exactly zero, reached via
          POST /hub/shipments/{id}/ship (different metric, different endpoint than the
          PDC instance): when assistance_pay exactly equals the remaining annual benefit,
          remaining lands on == 0 and the card auto-transitions ACTIVE -> EXHAUSTED.
        test_recipe:
          setup: ["program with per_fill_cap == annual_cap == 15000; enrollment APPROVED with cost share 20000 and COPAY_CARD ACTIVE"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgEx", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 15000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-M", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-M", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_id: $.data.id } }
          trigger:
            - { call: "POST /hub/shipments/${ship_id}/ship", payload: {}, as: PharmacyPartner, captures: { apay: $.data.assistance_pay_cents } }
            - { call: "GET /hub/enrollments/${enr_id}/copay-assistances", as: FinancialCounselor, captures: { rem: "$.data[0].remaining_annual_benefit_cents", st: "$.data[0].status" } }
          assert:
            - "${apay} == 15000 (min of cap 15000, remaining 15000, share 20000)"
            - "${rem} == 0 exactly (zero boundary) and ${st} == EXHAUSTED (auto-transition fires at == 0, not below)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shipment_creation_gated_on_enrollment_state
        grounds:
          - state_machines.Shipment
          - validations[priority=4]
          - errors[ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT]
        distinguishing_aspect: |
          Entity pair Shipment -> Enrollment: shipment creation is legal only while the
          Enrollment is in {PA_PENDING, APPROVED, ACTIVE}; INTAKE rejects with
          ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT. Different entity pair than the PA -> BI
          instance.
        test_recipe:
          setup: ["program with no gates; enrollment still in INTAKE (no benefits investigation)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgX1", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-N", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-N", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { st: $.data.status, ftype: $.data.fill_type } }
          assert:
            - "INTAKE arm: ${err} == ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT"
            - "after the BI flips the enrollment to APPROVED the identical request succeeds: ${st} == SCHEDULED and ${ftype} == FIRST_FILL"
      - name: pa_creation_gated_on_bi_requires_prior_auth
        grounds:
          - validations[priority=6]
          - errors[ERR_PA_NOT_REQUIRED]
          - entities.BenefitsInvestigation.fields.requires_prior_auth
        distinguishing_aspect: |
          Entity pair PriorAuthorization -> BenefitsInvestigation (different pair than
          Shipment -> Enrollment): PA creation reads the sibling BI record and rejects
          with ERR_PA_NOT_REQUIRED when requires_prior_auth is false.
        test_recipe:
          setup: ["enrollment whose BI says requires_prior_auth=false (enrollment auto-approved)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgX2", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-O", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-O", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/prior-authorization", payload: { clinical_notes: "notes", payer_reference: "PA-X" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PA_NOT_REQUIRED (the BI flag, not the enrollment state alone, decides)"
            - "no PriorAuthorization row exists afterwards: GET /hub/enrollments/{id}/prior-authorizations returns total_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: nurse_visit_half_open_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_VISIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = nurse schedule (NurseVisit.nurse_id); interval semantics = half-open
          [window_start, window_end): strictly overlapping windows are rejected while
          touching windows (prior end == new start) are ACCEPTED. Different resource and
          different interval semantics than the refill-spacing instance.
        test_recipe:
          setup: ["enrollment INTAKE (visits allowed on non-terminal enrollments); nurse-1 already booked 2026-08-02 14:00-15:00 UTC"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgNV", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: true, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-P", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/nurse-visits", payload: { nurse_id: "nurse-1", window_start: "2026-08-02T14:00:00Z", window_end: "2026-08-02T15:00:00Z" }, as: CaseManager, captures: { visit_a: $.data.id } }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/nurse-visits", payload: { nurse_id: "nurse-1", window_start: "2026-08-02T14:30:00Z", window_end: "2026-08-02T15:30:00Z" }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /hub/enrollments/${enr_id}/nurse-visits", payload: { nurse_id: "nurse-1", window_start: "2026-08-02T15:00:00Z", window_end: "2026-08-02T16:00:00Z" }, as: CaseManager, captures: { visit_c: $.data.id } }
          assert:
            - "overlapping arm: ${err} == ERR_VISIT_WINDOW_OVERLAP (14:30-15:30 intersects 14:00-15:00)"
            - "adjacent arm: HTTP 201 for 15:00-16:00 (end == start is NOT an overlap under half-open semantics)"
      - name: refill_minimum_gap_spacing
        grounds:
          - validations[priority=7]
          - errors[ERR_REFILL_SPACING_VIOLATION]
        distinguishing_aspect: |
          Resource = the patient's therapy calendar (Shipment per enrollment); interval
          semantics = minimum-gap spacing: requested_delivery_date must be >= last
          delivered_date + min_days_between_fills — a gap of exactly min_days passes and
          min_days - 1 fails. This is an aggregate spacing rule, not the pairwise
          half-open overlap arithmetic of the nurse-schedule instance.
        test_recipe:
          setup: ["program min_days_between_fills 20; fill 1 delivered 2026-08-01; clock at 2026-08-15 (adherence 100.0 so only spacing is exercised)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgSp2", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-Q", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-Q", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-01", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_1: $.data.id } }
            - { call: "POST /hub/shipments/${ship_1}/ship", payload: {}, as: PharmacyPartner }
            - { call: "POST /hub/shipments/${ship_1}/deliver", payload: { delivered_date: "2026-08-01" }, as: PharmacyPartner }
            - { call: "POST /hub/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: HubAdmin }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-20", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-21", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { fill_no: $.data.fill_number } }
          assert:
            - "gap 19 days: ${err} == ERR_REFILL_SPACING_VIOLATION"
            - "gap exactly 20 days (== min_days_between_fills): HTTP 201, fill_number == 2 — the spacing comparison is inclusive"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: foundation_pool_reserve_release_conservation
        grounds:
          - entities.FoundationPool.fields.remaining_balance_cents
          - state_machines.CopayAssistance
          - calculations.assistance_match_selector
        distinguishing_aspect: |
          Conserved quantity = foundation pool dollars: total_funding_cents ==
          remaining_balance_cents + SUM(grant_amount_cents - returned_cents) over all
          grants; a reserve (match) paired with its compensating release returns the pool
          to 5000000 exactly. Different conserved quantity than the payer-OOP partition.
        test_recipe:
          setup: ["eligible pool (total 5000000, grant 200000, coverage 80); enrollment APPROVED (diagnosis C50)"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgInv", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/foundation-pools", payload: { name: "FundA", diagnosis_code: "C50", total_funding_cents: 5000000, grant_amount_cents: 200000, coverage_pct: 80, start_date: "2026-01-01", end_date: "2026-12-31" }, as: HubAdmin, captures: { pool_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-R", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-R", requires_prior_auth: false, plan_has_accumulator: false, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
          trigger:
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "FOUNDATION", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor, as_user_id: "fc-1", captures: { asst_id: $.data.id, pool_after_match_needed: $.data.foundation_pool_id } }
            - { call: "GET /hub/foundation-pools/${pool_id}", as: FinancialCounselor, captures: { bal_after_match: $.data.remaining_balance_cents } }
            - { call: "POST /hub/copay-assistances/${asst_id}/release", payload: {}, as: FinancialCounselor, as_user_id: "fc-2", captures: { returned: $.data.returned_cents, asst_st: $.data.status } }
            - { call: "GET /hub/foundation-pools/${pool_id}", as: FinancialCounselor, captures: { bal_after_release: $.data.remaining_balance_cents } }
          assert:
            - "forward action (reserve): ${bal_after_match} == 4800000 (5000000 - 200000)"
            - "compensating action (release by a different counselor): ${bal_after_release} == 5000000 — pool conserved exactly"
            - "${returned} == 200000 (nothing disbursed) and ${asst_st} == RELEASED"
      - name: payer_oop_partition_identity
        grounds:
          - entities.Enrollment.fields.payer_accumulated_oop_cents
          - entities.Enrollment.fields.remaining_oop_cents
          - calculations.patient_responsibility_split
        distinguishing_aspect: |
          Conserved quantity = the payer OOP partition (different TYPE than a fund pool):
          BI.oop_max_cents == payer_accumulated_oop_cents + remaining_oop_cents must hold
          after the forward accrual (ship) and again after its compensating reversal
          (spoil) returns both fields to baseline.
        test_recipe:
          setup: ["enrollment APPROVED, accumulator plan (delta = patient_pay), cost share 20000, oop_max 500000, COPAY_CARD ACTIVE, one fill ready"]
          setup_api_calls:
            - { call: "POST /hub/drug-programs", payload: { name: "ProgInv2", manufacturer_name: "Mfr", diagnosis_code: "C50", requires_injection_training: false, requires_cold_chain: false, max_transit_hours: 0, min_days_between_fills: 20, copay_card_per_fill_cap_cents: 15000, copay_card_annual_cap_cents: 100000, default_days_supply: 30 }, as: HubAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /hub/enrollments", payload: { program_id: "${prog_id}", patient_ref: "PAT-S", diagnosis_code: "C50" }, as: CaseManager, captures: { enr_id: $.data.id } }
            - { call: "POST /hub/enrollments/${enr_id}/benefits-investigation", payload: { payer_name: "Acme", member_id: "M-S", requires_prior_auth: false, plan_has_accumulator: true, patient_cost_share_cents: 20000, oop_max_cents: 500000 }, as: CaseManager }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { enr_v: $.data.version } }
            - { call: "POST /hub/enrollments/${enr_id}/copay-assistance/match", payload: { assistance_type: "COPAY_CARD", expected_enrollment_version: "${enr_v}" }, as: FinancialCounselor }
            - { call: "POST /hub/enrollments/${enr_id}/shipments", payload: { requested_delivery_date: "2026-08-03", transit_hours: 24, days_supply: 30 }, as: CaseManager, captures: { ship_id: $.data.id } }
          trigger:
            - { call: "POST /hub/shipments/${ship_id}/ship", payload: {}, as: PharmacyPartner }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { acc_mid: $.data.payer_accumulated_oop_cents, rem_mid: $.data.remaining_oop_cents } }
            - { call: "POST /hub/shipments/${ship_id}/spoil", payload: { reason: "excursion" }, as: PharmacyPartner }
            - { call: "GET /hub/enrollments/${enr_id}", as: CaseManager, captures: { acc_end: $.data.payer_accumulated_oop_cents, rem_end: $.data.remaining_oop_cents } }
          assert:
            - "after ship (accumulator variant): ${acc_mid} == 5000 and ${rem_mid} == 495000 — partition sums to 500000"
            - "after compensating spoil: ${acc_end} == 0 and ${rem_end} == 500000 — partition identity restored with zero drift"
