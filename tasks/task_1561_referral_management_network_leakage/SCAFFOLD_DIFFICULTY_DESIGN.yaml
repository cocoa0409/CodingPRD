  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_overlap_buffer_semantics
        grounds:
          - state_machines.Referral.ACCEPTED_to_SCHEDULED
          - errors[ERR_APPOINTMENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open datetimes PLUS a 15-minute trailing buffer
          — the occupied interval is [start, end + 15m), so a new appointment
          starting exactly at the previous one's end (11:00) still collides, while
          11:15 is free. Resource: SpecialistProvider schedule.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan; S1 CARDIOLOGY capacity 10 with PREFERRED participation; provider PA; patient PT"
            - "R1 booked for S1 2026-08-02T10:00:00Z-11:00:00Z; R2/R3/R4 accepted and assigned S1, awaiting bookings"
