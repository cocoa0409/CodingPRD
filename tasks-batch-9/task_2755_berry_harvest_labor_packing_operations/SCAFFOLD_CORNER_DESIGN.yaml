            - "BuyerCommitment.${com}.committed_lbs == 100.00 and BuyerCommitment.${com}.shipped_lbs == 50.00 and BuyerCommitment.${com}.open_lbs == 100.00 and BuyerCommitment.${com}.fill_pct == 0.2500 and BuyerCommitment.${com}.status == OPEN"

      - name: ship_from_a_provisional_water_block_returns_water_not_compliant
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=41]
          - errors[ERR_BLOCK_WATER_NOT_COMPLIANT]
          - entities.Block.fields.water_status
        distinguishing_aspect: |
          A single passing sample makes the block PROVISIONAL, which is enough to
          confirm and open a window and to pack, cool and allocate its fruit, but
          NOT enough to ship: the ship call returns 409
          ERR_BLOCK_WATER_NOT_COMPLIANT because priority 41 demands water_status
          COMPLIANT (three samples), so the allocation stays RESERVED and the lot
          stays COOLED.
        test_recipe:
          setup:
            - "One STRAWBERRY block with exactly one 40 MPN sample: water_status PROVISIONAL, water_sample_count 1, posture CLEARED."
            - "One grade-A lot of 50 clamshells cooled to COOLED, allocated 50.00 lb to an OPEN commitment over 2026-08-01..2026-08-10."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V14", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V14" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
