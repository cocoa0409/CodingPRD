              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_dee_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Eli Cross", email: "eli@u.edu", class_year: "SENIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_eli_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Fay Ito", email: "fay@u.edu", class_year: "SOPHOMORE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_fay_id: $.data.id }
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { dee_v: $.data.version }
            - call: "POST /residence-life/students/${s_eli_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/students/${s_fay_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r202_id}" }
              as: ResidenceDirector
