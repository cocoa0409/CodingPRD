        excluded_because:
          difficulty_instance: boundary_precision_check / stall_rate_exact_half_cfm_per_minute_does_not_pause
          rationale: "The 3-sample backward window rate of exactly 0.50 and its non-pausing outcome are asserted by that §1.8 instance."

      - name: inspector_variance_at_the_exact_ten_percent_tolerance
        claim_type: threshold
        grounds:
          - calculations.inspector_spot_check_variance
        excluded_because:
          difficulty_instance: transitive_cascade / inspector_failure_cascade_depth_three
          rationale: "The variance computation and its FAIL side of the 10.00% boundary (10.91%) are asserted by that §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: empty_user_id_header_is_rejected_before_existence_is_even_checked
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 10 fires on an EMPTY X-User-ID header, not only an absent one, and it outranks the existence check: the same unknown project id that would answer 404 for an authenticated caller answers 401 for an unauthenticated one."
        test_recipe:
          setup:
            - "Empty database; no rows of any kind are needed because authentication is decided before any lookup"
          setup_api_calls: []
          trigger:
            - call: "GET /duct-sealing/projects"
              as: ProgramAdmin
              as_user_id: ""
              captures: { unauth_status: $.data.error_id }
            - call: "GET /duct-sealing/projects/11111111-1111-4111-8111-111111111111"
              as: QAVerifier
              as_user_id: ""
          assert:
            - "Both calls are sent with an X-User-ID header whose value is the empty string"
            - "First call: HTTP 401 with response_type == error and ${unauth_status} == ERR_UNAUTHENTICATED"
            - "Second call: HTTP 401 ERR_UNAUTHENTICATED, NOT 404 ERR_PROJECT_NOT_FOUND — priority 10 outranks priority 40 even though the path id resolves to nothing"
            - "The error envelope still carries meta.api_request_id and meta.api_request_timestamp"

      - name: unauthorized_role_beats_not_found_on_an_unknown_duct_system
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=40]
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_DUCT_SYSTEM_NOT_FOUND
        distinguishing_aspect: "Both the role check (20) and the existence check (40) are violated by one call; the 403 must win, and the identical call from the allowed role then reveals the 404 that was hiding behind it."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; a QAVerifier user qa-1 exists; no DuctSystem with the probed id exists"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /duct-sealing/duct-systems/22222222-2222-4222-8222-222222222222/exclude"
              payload: { exclusion_reason: "STRUCTURAL_DAMAGE" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/duct-systems/22222222-2222-4222-8222-222222222222/exclude"
              payload: { exclusion_reason: "STRUCTURAL_DAMAGE" }
              as: ProgramAdmin
          assert:
            - "First call (QAVerifier, not in the endpoint's roles [ProgramAdmin]): HTTP 403 ERR_UNAUTHORIZED"
            - "The 403 is returned even though the path id matches no DuctSystem — priority 20 precedes priority 40"
            - "Second call (ProgramAdmin, an allowed role): HTTP 404 ERR_DUCT_SYSTEM_NOT_FOUND, proving the 403 was not masking a different defect"
            - "Neither call creates or mutates any row"

      - name: existence_beats_request_validity_on_an_unknown_parent_project
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=50]
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "One request violates priority 40 (unknown parent in the path) and priority 50 twice over (unknown duct_material enum plus a non-positive design_cfm); the 404 must win. Replaying the same malformed body against a REAL project then yields the 400, so the two rules are demonstrably ordered rather than merely both present."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one program and one project exist"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /duct-sealing/projects/33333333-3333-4333-8333-333333333333/duct-systems"
              payload: { system_label: "GHOST-1", total_register_count: 4, design_cfm: -50.0, duct_material: "TITANIUM_ALLOY", condition_grade: "B" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "GHOST-1", total_register_count: 4, design_cfm: -50.0, duct_material: "TITANIUM_ALLOY", condition_grade: "B" }
              as: ProgramAdmin
          assert:
            - "First call: HTTP 404 ERR_PROJECT_NOT_FOUND — the unknown path parent is reported even though the body is doubly malformed"
            - "Second call: HTTP 400 ERR_INVALID_REQUEST for the same body against an existing project"
            - "GET /duct-sealing/projects/${proj_id}/duct-systems returns total_count == 0: no partial DuctSystem was written by either attempt"
            - "Project.${proj_id}.duct_system_count == 0 and eligible_duct_system_count == 0"

      - name: stale_parent_version_beats_the_exclusion_referential_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=70]
          - validations[priority=90]
          - concurrency_rules[seal-job-create-stale-duct-system]
          - errors.ERR_STALE_DUCT_SYSTEM_VERSION
          - errors.ERR_DUCT_SYSTEM_EXCLUDED
        distinguishing_aspect: "The very act that makes the duct system ineligible (exclusion) is also what makes the caller's cached version stale, so both priority 70 and priority 90 are violated by one create; the 412 must win. Retrying with the refreshed version then surfaces the 422 that was queued behind it — the OCC check is not a substitute for the business check."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; program, technician, project, one CLEARED duct system AHU-1, and an ACCEPTED PRE-phase leakage test of 300.0 CFM at 25 Pa"
            - "The FieldTechnician reads DuctSystem.version BEFORE the ProgramAdmin excludes the system, so the cached value is one behind"
          setup_api_calls:
