      - name: logical_clock_cannot_be_rewound
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_CLOCK_REWIND]
          - endpoints["POST /stewardship/_clock/set_current_utc"]
        distinguishing_aspect: |
          The logical clock is monotonic and starts at the fixed default 2026-08-01T00:00:00Z;
          setting it to an earlier or equal instant returns HTTP 422 ERR_CLOCK_REWIND and leaves the
          clock where it was.
        test_recipe:
          setup:
            - "Empty database; the clock advanced once to 2026-09-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { t1: $.data.current_utc }
          trigger:
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { rw_error: $.data.error_id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { t2: $.data.current_utc }
          assert:
            - "${t1} == 2026-09-05T09:00:00.000Z"
            - "HTTP status is 422 and ${rw_error} == ERR_CLOCK_REWIND"
            - "${t2} == 2026-09-06T00:00:00.000Z"
