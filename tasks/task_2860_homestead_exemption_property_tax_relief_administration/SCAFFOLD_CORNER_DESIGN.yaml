      - name: claim_filing_derives_the_closed_eligible_year_window
        claim_type: chronological
        grounds:
          - calculations.retroactive_refund_amount
          - entities.RetroactiveClaim.fields.first_eligible_tax_year
          - entities.RetroactiveClaim.fields.last_eligible_tax_year
          - entities.RetroactiveClaim.fields.eligible_year_count
          - endpoints[POST /retroactive-claims]
        distinguishing_aspect: "Filing in 2026 with requested_start_tax_year 2024 against a grant whose first_eligible_tax_year is 2019 and a 3-year lookback yields the closed window 2024..2025 — last_eligible is filing_tax_year - 1, not filing_tax_year — so eligible_year_count is 2 and gross_refund_cents is 2 * round_half_up(8400000 * 125/10000) = 210000."
        test_recipe:
          setup:
            - "Grant G1 on Parcel P1 has benefit_amount_cents 8400000 and first_eligible_tax_year 2019 (verified occupancy from 2019-06-01)."
            - "HOMESTEAD_BASIC declares statutory_lookback_years 3, so the lookback floor is 2023 and the requested start 2024 is the binding floor."
            - "No FraudCase exists, so the GROSS_PROVISIONAL variant is the only one that runs at filing."
