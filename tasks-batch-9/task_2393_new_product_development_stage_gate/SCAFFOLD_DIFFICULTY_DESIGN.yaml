  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: pilot_line_buffer_extended_half_open_overlap
        grounds:
          - errors.ERR_PILOT_LINE_CONFLICT
          - entities.PilotRun.fields.effective_buffer_minutes
          - entities.PilotLine.fields.changeover_buffer_minutes
        distinguishing_aspect: |
          Resource: the PilotLine, with half-open interval semantics
          [window_start, window_end + effective_buffer_minutes). A run ending 16:00 on a 240-minute
          line blocks up to but not including 20:00, so a 19:59 start conflicts and a 20:00 start is
          accepted; the accepted run's buffer doubles to 480 because a DAIRY formulation is booked on
          a NONE-regime line, which then blocks up to but not including 06:00 the next day.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "One pilot line with changeover_buffer_minutes 240 and allergen_regime NONE."
            - "A BEVERAGE project whose formulation is allergen_regime NONE."
            - "A DAIRY project whose formulation is allergen_regime DAIRY."
            - "A SCHEDULED run on the NONE formulation occupying 08:00 to 16:00 on 2026-08-06."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo Pilot", line_code: "TOL-1", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 850.00 }
              as: PortfolioAdmin
              captures: { bl_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Buffer Probe NONE", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { bn_id: $.data.id, bn_v1: $.data.version }
            - call: "POST /innovation-projects"
              payload: { name: "Buffer Probe DAIRY", brand: "DairyBest", category: "DAIRY", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { bd_id: $.data.id, bd_v1: $.data.version }
            - call: "POST /innovation-projects/${bn_id}/formulations"
              payload: { expected_project_version: "${bn_v1}", spec_summary: "Yuzu base A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { bnf_id: $.data.id }
            - call: "POST /innovation-projects/${bd_id}/formulations"
              payload: { expected_project_version: "${bd_v1}", spec_summary: "Cultured base A", allergen_regime: "DAIRY", target_shelf_life_days: 120, unit_cost_usd: 1.4000 }
              as: RnDLead
              captures: { bdf_id: $.data.id }
            - call: "POST /formulations/${bnf_id}/pilot-runs"
              payload: { pilot_line_id: "${bl_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 20000.00 }
              as: RnDLead
              captures: { brun_a_id: $.data.id }
          trigger:
            - call: "POST /formulations/${bdf_id}/pilot-runs"
              payload: { pilot_line_id: "${bl_id}", window_start: "2026-08-06T19:59:00Z", window_end: "2026-08-06T23:00:00Z", planned_units: 5000, committed_cost_usd: 10000.00 }
              as: RnDLead
            - call: "POST /formulations/${bdf_id}/pilot-runs"
              payload: { pilot_line_id: "${bl_id}", window_start: "2026-08-06T20:00:00Z", window_end: "2026-08-06T22:00:00Z", planned_units: 5000, committed_cost_usd: 10000.00 }
              as: RnDLead
              captures: { brun_c_id: $.data.id }
            - call: "POST /formulations/${bdf_id}/pilot-runs"
              payload: { pilot_line_id: "${bl_id}", window_start: "2026-08-07T05:59:00Z", window_end: "2026-08-07T09:00:00Z", planned_units: 5000, committed_cost_usd: 10000.00 }
              as: RnDLead
          assert:
            - "PilotRun.${brun_a_id}.effective_buffer_minutes == 240 because the formulation and line regimes are both NONE"
            - "the 19:59 request returns 409 with error_id ERR_PILOT_LINE_CONFLICT, since 19:59 is inside [08:00, 20:00)"
            - "the 20:00 request returns 201, since the upper bound of the blocked interval is exclusive"
            - "PilotRun.${brun_c_id}.effective_buffer_minutes == 480 because a DAIRY formulation on a NONE line doubles 240"
            - "the 2026-08-07T05:59 request returns 409 with error_id ERR_PILOT_LINE_CONFLICT, since it falls inside [20:00, 2026-08-07T06:00)"
            - "GET /pilot-runs?pilot_line_id=${bl_id} returns total_count 2"
            - "InnovationProject.${bd_id}.development_budget_committed_usd == 10000.00, so neither rejected request committed money"

      - name: shelf_reset_window_aggregate_slot_capacity
        grounds:
          - errors.ERR_RESET_WINDOW_CAPACITY_FULL
          - entities.ShelfResetWindow.fields.booked_slot_count
          - entities.ShelfResetWindow.fields.max_presentations
