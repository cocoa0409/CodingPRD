          One emergency completion builds exactly five invoice lines in the pinned
          order PARTS, LABOR, DISPATCH_SURCHARGE, TRIP_FEE, TAX, numbered 1..5, with
          PERMIT_FEE, WARRANTY_CREDIT and LOYALTY_DISCOUNT absent because no permit,
          no remedy and no eligible tier apply. Arithmetic: parts
          round_half_up(5000*1.60) = 8000 per unit x 2 = 16000; labor JOURNEYMAN
          STANDARD round_half_up(9500*60/60) = 9500; severity 25+6+9 = 40 -> MID
          surcharge 14000 with a NONE-tier credit of 0; ZONE_1 trip fee 8500 ->
          dispatch_subtotal 22500; taxable 16000 -> tax
