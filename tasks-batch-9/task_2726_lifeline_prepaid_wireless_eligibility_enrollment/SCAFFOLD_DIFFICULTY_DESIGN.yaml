  # =========================================================================
  # RULE 6 - boundary_precision_check
  # Three boundaries on DIFFERENT METRICS reached through DISTINCT ENDPOINTS:
  #   6A -> idle-day count / cure instant, via compliance-sweep + usage
  #   6B -> collection cardinality (sample_size and pool size), via audit-draw
  #   6C -> money threshold equality, via eligibility-checks
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: non_usage_thirtieth_day_and_inclusive_cure_instant_boundaries
        grounds:
          - calculations.non_usage_cure_window
          - calculations.compliance_sweep_processing_order
          - validations[priority=82]
          - state_machines.Enrollment.usage_status.NON_USAGE_FLAGGED_to_USING
        distinguishing_aspect: |
          The metric is the floor-of-elapsed-days idle counter plus the millisecond edge of
          the cure window, reached through POST /lifeline/providers/{id}/compliance-sweep
          and POST /lifeline/enrollments/{id}/usage: 29 days elapsed does not flag, exactly
          30 days does, and usage at exactly 2026-09-15T23:59:59.999Z still cures while
          2026-09-16T00:00:00Z is already too late.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX with enrollment_cap 50."
            - "Two VOICE enrollments E1 and E2 at two distinct addresses, both benefit_start_date 2026-08-01, neither with any recorded usage, so both anchor their idle counter at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143013", study_area_code: "489013", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1 Alpha St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-L1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "2 Bravo St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-L2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk2_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk2_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr2_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers/${prov_a_id}/compliance-sweep"
              payload: {}
              as: ProgramAdministrator
              captures: { flagged_day29: $.data.non_usage_flagged_enrollment_ids, evaluated_day29: $.data.evaluated_enrollment_count }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers/${prov_a_id}/compliance-sweep"
              payload: {}
              as: ProgramAdministrator
              captures: { flagged_day30: $.data.non_usage_flagged_enrollment_ids, expired_day30: $.data.cure_expired_de_enrolled_enrollment_ids }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T23:59:59.999Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr1_id}/usage"
              payload: { usage_kind: "OUTBOUND_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr2_id}/usage"
              payload: { usage_kind: "OUTBOUND_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { late_err: $.data.error_id }
          assert:
            - "${flagged_day29} == []"
            - "${evaluated_day29} == 2"
            - "${flagged_day30} == [${enr1_id}, ${enr2_id}]"
            - "${expired_day30} == []"
            - "Enrollment.${enr1_id}.usage_status == USING"
            - "Enrollment.${enr1_id}.last_usage_at == 2026-09-15T23:59:59.999Z"
            - "Enrollment.${enr1_id}.non_usage_flagged_at == null"
            - "Enrollment.${enr1_id}.cure_deadline_at == null"
            - "Enrollment.${enr1_id}.benefit_status == ACTIVE"
            - "the last trigger call returns HTTP 409 and ${late_err} == ERR_CURE_PERIOD_EXPIRED"
            - "Enrollment.${enr2_id}.usage_status == NON_USAGE_FLAGGED"
            - "Enrollment.${enr2_id}.non_usage_flagged_at == 2026-08-31T00:00:00Z"
            - "Enrollment.${enr2_id}.cure_deadline_at == 2026-09-15T23:59:59.999Z"
            - "Enrollment.${enr2_id}.last_usage_at == null"
            - "Enrollment.${enr2_id}.benefit_status == ACTIVE"

      - name: audit_draw_zero_size_and_empty_pool_cardinality_boundaries
        grounds:
          - calculations.audit_sample_selection
          - calculations.claim_support_amount
          - validations[priority=92]
          - validations[priority=94]
          - entities.ReimbursementClaim.fields.covered_enrollment_count
        distinguishing_aspect: |
          The metric here is collection CARDINALITY rather than time, reached only through
          POST /lifeline/reimbursement-claims/{id}/audit-draw: a legitimately FILED claim
          whose input set filtered down to covered_enrollment_count 0 rejects sample_size 1
          with ERR_EMPTY_SAMPLE_POOL (409) and sample_size 0 with ERR_INVALID_SAMPLE_SIZE
          (422), and neither attempt moves the claim off FILED.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-02T00:00:00Z."
            - "Provider licensed in TX with enrollment_cap 50."
            - "One VOICE enrollment whose benefit_start_date is 2026-07-01 - i.e. entirely AFTER service_month 2026-06, so it is filtered out of both the provisional and the final input set."
            - "A claim for 2026-06 filed at 2026-07-02 with final_amount_cents 0 and covered_enrollment_count 0."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143014", study_area_code: "489014", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
