# =============================================================================
# SCAFFOLD.yaml — Multistate Investigation Coordination & Settlement Fund
# Distribution (state attorneys general)
# =============================================================================

scenario: |
  Multistate Investigation Coordination & Settlement Fund Distribution (state attorneys general): multistate executive committee formation with lead states coordinating an investigation across jurisdictions, common interest agreements and information sharing among participating offices with confidentiality protections, investigative demands issued under each state's own authority with negotiated consolidated responses, settlement negotiation producing injunctive terms applicable nationally and monetary allocation among states, allocation formulas based on population, harm measures or negotiated shares with sign-on deadlines, state-level use of proceeds subject to legislative appropriation rules that vary, consumer restitution administration where individual claimants are identified and paid, compliance monitoring and enforcement of settlement terms over multi-year periods

domain_name: multistate-settlement-coordination
api_prefix: /multistate

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateOffice
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique across all StateOffice rows (duplicate -> ERR_INVALID_REQUEST)" }
      - { name: population, type: integer, source: input, description: "State population; input to POPULATION allocation basis" }
      - { name: harm_measure_cents, type: integer, source: input, description: "Estimated in-state harm in cents; input to HARM_MEASURE allocation basis" }
      - { name: appropriation_rule, type: enum, source: input, description: "PREAPPROPRIATED | CERTIFICATION_REQUIRED | GENERAL_FUND_ONLY — legislative appropriation rule governing this state's use of proceeds" }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Investigation title" }
      - { name: target_name, type: string, source: input, description: "Name of the investigated target company" }
      - { name: summary, type: string, source: input, description: "Matter summary" }
      - { name: phase, type: enum, source: system, description: "DRAFT | OPEN | DISCOVERY | NEGOTIATION | SETTLEMENT_PENDING | SETTLED | MONITORING | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "Logical time phase became OPEN; start of each lead office's lead-capacity window; null before" }
      - { name: settled_at, type: datetime, source: system, description: "Logical time phase became SETTLED; end (exclusive) of each lead office's lead-capacity window; null before" }
      - { name: active_settlement_id, type: string, source: system, description: "id of the single non-terminal Settlement for this investigation; null when none" }

  - name: Participation
    parent: Investigation
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id; the multistate matter this office participates in" }
      - { name: state_office_id, type: string, source: input, description: "FK -> StateOffice.id; the participating attorney general office" }
      - { name: status, type: enum, source: system, description: "INVITED | ACTIVE | WITHDRAWN" }
      - { name: cia_status, type: enum, source: system, description: "NOT_EXECUTED | EXECUTED — common interest agreement execution flag" }
      - { name: cia_tier, type: enum, source: system, description: "STANDARD | RESTRICTED | LEAD_ONLY confidentiality tier set at CIA execution; null while NOT_EXECUTED" }
      - { name: committee_role, type: enum, source: system, description: "MEMBER | LEAD — executive committee designation" }
      - { name: invited_at, type: datetime, source: system, description: "Logical time of invitation" }
      - { name: cia_executed_at, type: datetime, source: system, description: "Logical time of CIA execution; null while NOT_EXECUTED" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical time of withdrawal; null unless WITHDRAWN" }

  - name: Demand
    parent: Participation
    common_fields: true
    fields:
      - { name: participation_id, type: string, source: system, description: "FK -> Participation.id; the office issuing this investigative demand under its own state authority" }
      - { name: scope_text, type: string, source: input, description: "Scope of the investigative demand" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONSOLIDATED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical time of issuance (creation)" }
      - { name: consolidated_at, type: datetime, source: system, description: "Logical time the demand was folded into an accepted consolidated response; null until then" }
      - { name: consolidated_response_id, type: string, source: system, description: "id of the ConsolidatedResponse that consolidated this demand; null until then" }

  - name: ConsolidatedResponse
    parent: Investigation
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id" }
      - { name: demand_ids, type: array, source: input, description: "ids of Demands covered by this negotiated consolidated response; non-empty; all must be ISSUED and belong to this investigation" }
      - { name: coverage_summary, type: string, source: input, description: "Summary of the negotiated consolidated production" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | FULFILLED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical time of submission" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical time of acceptance; null until ACCEPTED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical time of fulfillment; null until FULFILLED" }

  - name: Settlement
    parent: Investigation
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id" }
      - { name: monetary_total_cents, type: integer, source: input, description: "Total monetary settlement in cents; must exceed restitution_reserve_cents" }
      - { name: restitution_reserve_cents, type: integer, source: input, description: "Cents reserved for consumer restitution; >= 0" }
      - { name: allocation_basis, type: enum, source: input, description: "POPULATION | HARM_MEASURE | NEGOTIATED" }
      - { name: negotiated_shares, type: object, source: input, description: "Required iff allocation_basis == NEGOTIATED: map state_code -> basis points; keys must equal the set of ACTIVE participations' state codes and values must sum to 10000" }
      - { name: injunctive_terms, type: array, source: input, description: "Nationally applicable injunctive terms (array of strings); at least one" }
      - { name: term_status, type: enum, source: system, description: "PROPOSED | COUNTERED | TERMS_AGREED | SIGN_ON_OPEN | EXECUTED | COLLAPSED | CLOSED_OUT" }
      - { name: fund_status, type: enum, source: system, description: "UNFUNDED | PARTIALLY_FUNDED | FUNDED | DISBURSING | DISBURSED — parallel dimension to term_status" }
      - { name: negotiation_round, type: integer, source: system, description: "Number of defendant counters so far; starts 0; counter rejected when it would exceed MAX_SETTLEMENT_ROUNDS" }
      - { name: counter_total_cents, type: integer, source: system, description: "Defendant's countered total; null until first counter" }
      - { name: sign_on_opened_at, type: datetime, source: system, description: "Logical time sign-on opened; null before" }
      - { name: sign_on_deadline, type: datetime, source: system, description: "sign_on_opened_at + SIGN_ON_WINDOW_DAYS; null before" }
      - { name: executed_at, type: datetime, source: system, description: "Logical time of execution; null until EXECUTED" }
      - { name: sign_ons, type: array, source: system, description: "Embedded sign-on entries {state_office_id, state_code, decision: SIGNED|DECLINED, status: SIGNED|DECLINED|LOCKED|LAPSED, decided_at}; one per acting or eligible-silent state" }
      - { name: provisional_distributable_cents, type: integer, source: computed, description: "Provisional variant: distributable pool computed at PROPOSED time over ACTIVE participations" }
      - { name: provisional_weight_bps_by_state, type: object, source: computed, description: "Provisional variant: map state_code -> normalized basis points over ACTIVE participations at proposal time" }
      - { name: distributable_cents, type: integer, source: computed, description: "Final variant: monetary_total - restitution_reserve - lead_cost, computed at execution; null before" }
      - { name: lead_cost_cents, type: integer, source: computed, description: "Final lead-state cost pool, computed at execution; null before" }
      - { name: compliance_hold, type: boolean, source: system, description: "true while a breach-escalated monitoring hold blocks disbursement creation and release" }
      - { name: deposited_cents, type: integer, source: system, description: "Cumulative defendant deposits; drives fund_status" }
      - { name: released_cents, type: integer, source: system, description: "Cumulative released disbursements" }
      - { name: reverted_cents, type: integer, source: system, description: "Cumulative cents reverted from stale uncertified disbursements into the restitution reserve" }
      - { name: restitution_reserve_balance_cents, type: integer, source: system, description: "Restitution reserve plus reversions minus paid claimant payouts" }
      - { name: restitution_computed, type: boolean, source: system, description: "true once the restitution proration has been computed; locks recompute" }
      - { name: restitution_remainder_cents, type: integer, source: system, description: "Unclaimed reserve remainder after proration; null until computed" }

  - name: AllocationLine
    parent: Settlement
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id" }
      - { name: state_office_id, type: string, source: system, description: "FK -> StateOffice.id; the state this allocation line pays" }
      - { name: state_code, type: string, source: system, description: "Denormalized state code for readability" }
      - { name: basis_value_snapshot, type: integer, source: system, description: "Population, harm_measure_cents, or negotiated bps snapshot taken at execution time" }
      - { name: weight_bps, type: integer, source: computed, description: "Normalized weight in basis points over the locked sign-on set; all lines of a settlement sum to exactly 10000" }
      - { name: share_cents, type: integer, source: computed, description: "floor(distributable_cents * weight_bps / 10000) plus remainder cents per the pinned rounding order" }
      - { name: lead_bonus_cents, type: integer, source: computed, description: "Equal split of lead_cost_cents among SIGNED lead states; 0 for non-leads" }
      - { name: gross_share_cents, type: integer, source: computed, description: "share_cents + lead_bonus_cents" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of RELEASED disbursement amounts on this line" }
      - { name: reverted_cents, type: integer, source: computed, description: "Sum of REVERTED disbursement amounts on this line" }
      - { name: remaining_cents, type: integer, source: computed, description: "gross_share_cents - disbursed_cents - reverted_cents; invariant: the three right-hand fields always sum to gross" }
      - { name: status, type: enum, source: system, description: "ELIGIBLE | DISBURSING | DISBURSED | REVERTED" }

  - name: Disbursement
    parent: AllocationLine
    common_fields: true
    fields:
      - { name: allocation_line_id, type: string, source: system, description: "FK -> AllocationLine.id" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement amount; must be > 0 and <= line remaining_cents" }
      - { name: use_code, type: enum, source: input, description: "PROGRAM | GENERAL_FUND | RESTITUTION_ADMIN — permitted use of proceeds" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CERTIFIED | RELEASED | HELD | REVERTED" }
      - { name: requested_at, type: datetime, source: system, description: "Logical time of request" }
      - { name: certified_at, type: datetime, source: system, description: "Logical time of legislative certification; null until CERTIFIED" }
      - { name: released_at, type: datetime, source: system, description: "Logical time of release; null until RELEASED" }

  - name: Claimant
    parent: Settlement
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id" }
      - { name: state_code, type: string, source: input, description: "Consumer's state code (informational; no FK)" }
      - { name: contact_ref, type: string, source: input, description: "Administrator-assigned contact reference" }
      - { name: claimed_loss_cents, type: integer, source: input, description: "Claimed loss in cents; > 0" }
      - { name: validated_loss_cents, type: integer, source: system, description: "Validated loss set by the administrator; null until VALIDATED" }
      - { name: estimated_payout_cents, type: integer, source: computed, description: "Estimated variant: set to validated_loss_cents at validation (assumes no proration)" }
      - { name: payout_cents, type: integer, source: computed, description: "Final variant: pro-rata payout assigned at restitution compute; null until computed" }
      - { name: status, type: enum, source: system, description: "REGISTERED | VALIDATED | DENIED | LAPSED | PAID" }

  - name: MonitoringPeriod
    parent: Settlement
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id" }
      - { name: period_index, type: integer, source: system, description: "1-based period index; at most MONITORING_MAX_PERIODS" }
      - { name: window_start, type: datetime, source: computed, description: "executed_at + (period_index - 1) * MONITORING_PERIOD_DAYS" }
      - { name: window_end, type: datetime, source: computed, description: "window_start + MONITORING_PERIOD_DAYS; next period must start exactly here (half-open contiguity)" }
      - { name: findings, type: array, source: system, description: "Embedded findings {term_index, outcome: COMPLIANT|BREACH, note, filed_at}; at most one per injunctive term per period" }
      - { name: breach_count, type: integer, source: computed, description: "Count of findings with outcome BREACH in this period" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_COMPLIANT | CLOSED_BREACH — auto-closes when every injunctive term has a finding" }
      - { name: closed_at, type: datetime, source: system, description: "Logical time of auto-close; null while OPEN" }

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-counter-stale-version
    parent_entity: Settlement
    write_endpoint: "POST /multistate/settlements/{id}/counter"
    occ_field: expected_settlement_version
    description: |
      Countering a Settlement whose version has advanced since the caller last
      observed it is rejected; the caller's view of the negotiation is stale
      (e.g., a counter or revise has already landed). Deterministic via OCC on
      Settlement.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-revise-stale-version
    parent_entity: Settlement
    write_endpoint: "POST /multistate/settlements/{id}/revise"
    occ_field: expected_settlement_version
    description: |
      Revising a Settlement whose version has advanced since the caller last
      observed it is rejected as a stale write via OCC on Settlement.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: state-office-patch-stale-version
    parent_entity: StateOffice
    write_endpoint: "PATCH /multistate/state-offices/{id}"
    occ_field: expected_state_office_version
    description: |
      Updating a StateOffice whose version has advanced since the caller last
      observed it is rejected; allocation-relevant fields (population,
      harm_measure_cents) may have changed underneath the caller.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Investigation
    field: phase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: OPEN}"
        actor: CommitteeChair
        preconditions:
          - "at least LEAD_MIN_COUNT ACTIVE participations with committee_role == LEAD (else ERR_ACTIVATION_QUORUM_MISSING)"
          - "at least ACTIVE_PARTICIPATION_MIN ACTIVE participations in total (else ERR_ACTIVATION_QUORUM_MISSING)"
          - "no LEAD office of this investigation already holds committee_role == LEAD on another investigation whose phase is in {OPEN, DISCOVERY, NEGOTIATION, SETTLEMENT_PENDING} — half-open lead window [opened_at, settled_at) still occupied (else ERR_LEAD_WINDOW_OVERLAP)"
        side_effects:
          - "opened_at = current logical time"
      - from: OPEN
        to: DISCOVERY
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: DISCOVERY}"
        actor: CommitteeChair
        preconditions: []
        side_effects: []
      - from: DISCOVERY
        to: NEGOTIATION
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: NEGOTIATION}"
        actor: CommitteeChair
        preconditions:
          - "at least one ConsolidatedResponse of this investigation has status in {ACCEPTED, FULFILLED} (else ERR_NO_ACCEPTED_RESPONSE)"
        side_effects: []
      - from: NEGOTIATION
        to: SETTLEMENT_PENDING
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: SETTLEMENT_PENDING}"
        actor: CommitteeChair
        preconditions:
          - "the investigation's active settlement has term_status in {TERMS_AGREED, SIGN_ON_OPEN} (else ERR_NO_AGREED_SETTLEMENT)"
        side_effects: []
      - from: SETTLEMENT_PENDING
        to: SETTLED
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: SETTLED}"
        actor: CommitteeChair
        preconditions:
          - "the investigation's active settlement has term_status == EXECUTED (else ERR_INVALID_STATE)"
        side_effects:
          - "settled_at = current logical time"
      - from: SETTLED
        to: MONITORING
        trigger: "POST /multistate/investigations/{id}/advance {to_phase: MONITORING}"
        actor: CommitteeChair
        preconditions:
          - "the active settlement's fund_status is in {FUNDED, DISBURSING, DISBURSED} (else ERR_SETTLEMENT_NOT_FUNDED)"
        side_effects: []
      - from: MONITORING
        to: CLOSED
        trigger: "AUTO: active settlement term_status becomes CLOSED_OUT"
        actor: system
        preconditions:
          - "active settlement term_status == CLOSED_OUT"
        side_effects: []
      - from: NEGOTIATION
        to: DISCOVERY
        trigger: "AUTO: active settlement transitions PROPOSED -> COUNTERED (negotiation bounce-back)"
        actor: system
        preconditions:
          - "investigation phase == NEGOTIATION"
        side_effects: []
      - from: DISCOVERY
        to: NEGOTIATION
        trigger: "AUTO: active settlement transitions COUNTERED -> PROPOSED (revise returns to negotiation; skips the accepted-response gate)"
        actor: system
        preconditions:
          - "investigation phase == DISCOVERY and the bounce originated from this settlement's counter"
        side_effects: []
      - from: SETTLEMENT_PENDING
        to: NEGOTIATION
        trigger: "AUTO: active settlement transitions SIGN_ON_OPEN -> COLLAPSED (quorum missed past deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "active_settlement_id cleared to null"

  - entity: Participation
    field: status
    initial_state: INVITED
    terminal_states: [WITHDRAWN]
    note: "Parallel dimensions: status (INVITED|ACTIVE|WITHDRAWN) x cia_status (NOT_EXECUTED|EXECUTED) x committee_role (MEMBER|LEAD) evolve on one row; execute-cia flips the first two atomically, designate-lead moves the third."
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /multistate/participations/{id}/execute-cia"
        actor: "ParticipatingStateAG or LeadStateAG (X-User-ID == participation.state_office_id)"
        preconditions:
          - "status == INVITED (else ERR_INVALID_STATE)"
          - "confidentiality_tier in {STANDARD, RESTRICTED, LEAD_ONLY}"
        side_effects:
          - "cia_status = EXECUTED; cia_tier = input tier; cia_executed_at = current logical time"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /multistate/participations/{id}/withdraw"
        actor: "ParticipatingStateAG or LeadStateAG (own office) or CommitteeChair"
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
          - "no sign_ons entry for this office with status in {SIGNED, LOCKED} on a settlement of this investigation whose term_status is not in {COLLAPSED, CLOSED_OUT} (else ERR_SIGNED_STATE_CANNOT_WITHDRAW)"
        side_effects:
          - "committee_role reset to MEMBER; withdrawn_at = current logical time"
  - entity: Participation
    field: committee_role
    initial_state: MEMBER
    terminal_states: []
    transitions:
      - from: MEMBER
        to: LEAD
        trigger: "POST /multistate/participations/{id}/designate-lead"
        actor: CommitteeChair
        preconditions:
          - "status == ACTIVE (else ERR_PARTICIPATION_INACTIVE)"
          - "cia_tier in {RESTRICTED, LEAD_ONLY} (else ERR_CIA_TIER_INSUFFICIENT)"
          - "investigation phase in {DRAFT, OPEN} (else ERR_INVALID_PHASE)"
        side_effects: []
      - from: LEAD
        to: MEMBER
        trigger: "AUTO: side effect of withdraw"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Demand
    field: status
    initial_state: ISSUED
    terminal_states: [CONSOLIDATED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /multistate/participations/{id}/demands (creation issues the demand immediately)"
        actor: "ParticipatingStateAG or LeadStateAG (own office)"
        preconditions:
          - "participation.status == ACTIVE — CIA must be executed before issuing under state authority (else ERR_PARTICIPATION_INACTIVE)"
          - "investigation phase in {OPEN, DISCOVERY} (else ERR_INVALID_PHASE)"
        side_effects:
          - "issued_at = current logical time"
      - from: ISSUED
        to: CONSOLIDATED
        trigger: "AUTO: a ConsolidatedResponse listing this demand is accepted"
        actor: system
        preconditions: []
        side_effects:
          - "consolidated_at = current logical time; consolidated_response_id = the accepted response id"

  - entity: ConsolidatedResponse
    field: status
    initial_state: SUBMITTED
    terminal_states: [FULFILLED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /multistate/investigations/{id}/responses"
        actor: DefendantCounsel
        preconditions:
          - "investigation phase in {DISCOVERY, NEGOTIATION} (else ERR_INVALID_PHASE)"
          - "demand_ids non-empty, every id resolves to a Demand of this investigation with status == ISSUED (else ERR_RESPONSE_DEMANDS_INVALID)"
        side_effects:
          - "submitted_at = current logical time"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /multistate/responses/{id}/accept"
        actor: "LeadStateAG (office holds a LEAD, ACTIVE participation in this investigation)"
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "accepted_at = current logical time"
          - "each listed Demand transitions ISSUED -> CONSOLIDATED"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /multistate/responses/{id}/fulfill"
        actor: DefendantCounsel
        preconditions:
          - "status == ACCEPTED (else ERR_INVALID_STATE)"
        side_effects:
          - "fulfilled_at = current logical time"

  - entity: Settlement
    field: term_status
    initial_state: PROPOSED
    terminal_states: [COLLAPSED, CLOSED_OUT]
    note: "Cyclic negotiation loop PROPOSED <-> COUNTERED bounded by MAX_SETTLEMENT_ROUNDS; parallel dimension fund_status evolves independently below."
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /multistate/investigations/{id}/settlements"
        actor: "LeadStateAG (office holds LEAD, ACTIVE participation in this investigation)"
        preconditions:
          - "investigation phase == NEGOTIATION (else ERR_INVALID_PHASE)"
          - "no existing settlement of this investigation with term_status not in {COLLAPSED} (else ERR_INVALID_STATE)"
          - "monetary_total_cents > restitution_reserve_cents >= 0 and injunctive_terms has >= 1 entry (else ERR_INVALID_REQUEST)"
          - "if allocation_basis == NEGOTIATED: negotiated_shares keys equal the state codes of ACTIVE participations and values sum to TOTAL_WEIGHT_BPS (else ERR_NEGOTIATED_SHARES_INVALID)"
        side_effects:
          - "negotiation_round = 0; fund_status = UNFUNDED; deposited_cents = 0; compliance_hold = false; restitution_computed = false; restitution_reserve_balance_cents = restitution_reserve_cents"
          - "run provisional_vs_final_allocation (provisional variant) -> provisional_distributable_cents, provisional_weight_bps_by_state"
          - "investigation.active_settlement_id = this settlement"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /multistate/settlements/{id}/counter"
        actor: DefendantCounsel
        preconditions:
          - "term_status == PROPOSED (else ERR_INVALID_STATE)"
          - "expected_settlement_version == settlement.version (else ERR_STALE_VERSION)"
          - "negotiation_round + 1 <= MAX_SETTLEMENT_ROUNDS (else ERR_NEGOTIATION_EXHAUSTED)"
        side_effects:
          - "negotiation_round += 1; counter_total_cents = input counter_total_cents when provided"
          - "investigation phase auto-bounces NEGOTIATION -> DISCOVERY when phase == NEGOTIATION"
          - "increments Settlement.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /multistate/settlements/{id}/revise"
        actor: LeadStateAG
        preconditions:
          - "term_status == COUNTERED (else ERR_INVALID_STATE)"
          - "expected_settlement_version == settlement.version (else ERR_STALE_VERSION)"
        side_effects:
          - "when revised_total_cents provided: monetary_total_cents updated and provisional variant recomputed"
          - "investigation phase auto-returns DISCOVERY -> NEGOTIATION"
          - "increments Settlement.version by 1"
      - from: PROPOSED
        to: TERMS_AGREED
        trigger: "POST /multistate/settlements/{id}/agree-terms"
        actor: DefendantCounsel
        preconditions:
          - "term_status == PROPOSED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: TERMS_AGREED
        to: SIGN_ON_OPEN
        trigger: "POST /multistate/settlements/{id}/open-sign-on"
        actor: CommitteeChair
        preconditions:
          - "term_status == TERMS_AGREED (else ERR_INVALID_STATE)"
          - "investigation phase == SETTLEMENT_PENDING (else ERR_INVALID_PHASE)"
        side_effects:
          - "sign_on_opened_at = current logical time; sign_on_deadline = opened + SIGN_ON_WINDOW_DAYS"
      - from: SIGN_ON_OPEN
        to: EXECUTED
        trigger: "POST /multistate/settlements/{id}/execute (quorum met)"
        actor: CommitteeChair
        preconditions:
          - "term_status == SIGN_ON_OPEN (else ERR_INVALID_STATE)"
          - "investigation phase == SETTLEMENT_PENDING (else ERR_INVALID_PHASE)"
          - "sign_on_quorum met (else ERR_QUORUM_NOT_MET when now <= deadline; COLLAPSED transition when now > deadline)"
        side_effects:
          - "executed_at = current logical time"
          - "every sign_ons entry with status SIGNED becomes LOCKED; every ACTIVE participation with no entry gets an embedded entry with status LAPSED"
          - "run lead_cost_and_distributable, allocation_weight_normalization, line_share_cents (final variant); create one AllocationLine per LOCKED state in decided_at ASC order"
          - "set distributable_cents and lead_cost_cents"
      - from: SIGN_ON_OPEN
        to: COLLAPSED
        trigger: "POST /multistate/settlements/{id}/execute when now > sign_on_deadline and quorum unmet"
        actor: CommitteeChair
        preconditions:
          - "current logical time > sign_on_deadline"
          - "sign_on_quorum not met"
        side_effects:
          - "investigation phase auto-returns SETTLEMENT_PENDING -> NEGOTIATION; active_settlement_id cleared"
      - from: EXECUTED
        to: CLOSED_OUT
        trigger: "AUTO: final monitoring period closes compliant while fund fully disbursed"
        actor: system
        preconditions:
          - "a MonitoringPeriod with period_index == MONITORING_MAX_PERIODS closes with breach_count == 0"
          - "fund_status == DISBURSED"
        side_effects:
          - "investigation phase MONITORING -> CLOSED"

  - entity: Settlement
    field: fund_status
    initial_state: UNFUNDED
    terminal_states: [DISBURSED]
    note: "Parallel to term_status; deposit/release events drive it."
    transitions:
      - from: UNFUNDED
        to: PARTIALLY_FUNDED
        trigger: "POST /multistate/settlements/{id}/deposit with 0 < deposited_cents < monetary_total_cents"
        actor: DefendantCounsel
        preconditions:
          - "term_status == EXECUTED (else ERR_INVALID_STATE)"
          - "deposited_cents + amount_cents <= monetary_total_cents (else ERR_DEPOSIT_EXCEEDS_TOTAL)"
        side_effects:
          - "deposited_cents += amount_cents"
      - from: PARTIALLY_FUNDED
        to: FUNDED
        trigger: "POST /multistate/settlements/{id}/deposit reaching deposited_cents == monetary_total_cents exactly"
        actor: DefendantCounsel
        preconditions:
          - "deposited_cents + amount_cents == monetary_total_cents (overshoot -> ERR_DEPOSIT_EXCEEDS_TOTAL)"
        side_effects:
          - "deposited_cents += amount_cents"
      - from: FUNDED
        to: DISBURSING
        trigger: "AUTO: first disbursement release"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_FUNDED
        to: DISBURSING
        trigger: "AUTO: first disbursement release (partial funding permits release up to available balance)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSING
        to: DISBURSED
        trigger: "AUTO: every AllocationLine of this settlement reaches a terminal status (DISBURSED or REVERTED)"
        actor: system
        preconditions: []
        side_effects:
          - "enables the CLOSED_OUT cascade once the final monitoring period closes compliant"

  - entity: Settlement
    field: sign_ons
    initial_state: NONE
    terminal_states: [LOCKED, DECLINED, LAPSED]
    note: "Per-entry embedded machine over settlement.sign_ons[]; NONE means no entry exists yet for an eligible office."
    transitions:
      - from: NONE
        to: SIGNED
        trigger: "POST /multistate/settlements/{id}/sign-ons {decision: SIGNED}"
        actor: "ParticipatingStateAG or LeadStateAG (own office)"
        preconditions:
          - "term_status == SIGN_ON_OPEN (else ERR_INVALID_STATE)"
          - "caller office holds an ACTIVE participation in this settlement's investigation (else ERR_NOT_A_PARTICIPANT)"
          - "current logical time <= sign_on_deadline (else ERR_SIGN_ON_WINDOW_CLOSED)"
          - "no existing sign_ons entry for this office (else ERR_DUPLICATE_SIGN_ON)"
        side_effects:
          - "append entry {state_office_id, state_code, decision: SIGNED, status: SIGNED, decided_at: now}"
      - from: NONE
        to: DECLINED
        trigger: "POST /multistate/settlements/{id}/sign-ons {decision: DECLINED}"
        actor: "ParticipatingStateAG or LeadStateAG (own office)"
        preconditions:
          - "same gates as SIGNED"
        side_effects:
          - "append entry with decision DECLINED, status DECLINED"
      - from: SIGNED
        to: LOCKED
        trigger: "AUTO: settlement execute succeeds"
        actor: system
        preconditions: []
        side_effects:
          - "an AllocationLine is created for the office"
      - from: NONE
        to: LAPSED
        trigger: "AUTO: settlement execute while the office held an ACTIVE participation and never recorded a decision"
        actor: system
        preconditions: []
        side_effects:
          - "lapsed offices receive no AllocationLine"

  - entity: AllocationLine
    field: status
    initial_state: ELIGIBLE
    terminal_states: [DISBURSED, REVERTED]
    transitions:
      - from: ELIGIBLE
        to: DISBURSING
        trigger: "AUTO: first Disbursement created on the line"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSING
        to: DISBURSED
        trigger: "AUTO: a release makes disbursed_cents == gross_share_cents"
        actor: system
        preconditions: []
        side_effects:
          - "when all sibling lines are terminal, settlement fund_status -> DISBURSED"
      - from: ELIGIBLE
        to: DISBURSED
        trigger: "AUTO: a single release covers the full gross share of a line with no prior activity"
        actor: system
        preconditions: []
        side_effects:
          - "same all-terminal check as DISBURSING -> DISBURSED"
      - from: ELIGIBLE
        to: REVERTED
        trigger: "AUTO: restitution sweep reverts the line's full remaining balance"
        actor: system
        preconditions: []
        side_effects:
          - "reverted cents flow into settlement.restitution_reserve_balance_cents"
      - from: DISBURSING
        to: REVERTED
        trigger: "AUTO: reversion makes remaining_cents == 0 with disbursed_cents < gross_share_cents"
        actor: system
        preconditions: []
        side_effects:
          - "same reserve top-up side effect"

  - entity: Disbursement
    field: status
    initial_state: REQUESTED
    terminal_states: [RELEASED, REVERTED]
    transitions:
      - from: null
        to: CERTIFIED
        trigger: "POST /multistate/allocation-lines/{id}/disbursements when the line's office has appropriation_rule == PREAPPROPRIATED (creation auto-certifies)"
        actor: "ParticipatingStateAG or LeadStateAG (own office)"
        preconditions:
          - "line status in {ELIGIBLE, DISBURSING} (else ERR_LINE_NOT_DISBURSABLE)"
          - "settlement fund_status in {PARTIALLY_FUNDED, FUNDED, DISBURSING} (else ERR_SETTLEMENT_NOT_FUNDED)"
          - "settlement compliance_hold == false (else ERR_COMPLIANCE_HOLD_ACTIVE)"
          - "amount_cents > 0 and <= line.remaining_cents (else ERR_AMOUNT_EXCEEDS_REMAINING)"
          - "office appropriation_rule == GENERAL_FUND_ONLY requires use_code == GENERAL_FUND (else ERR_USE_CODE_NOT_PERMITTED)"
        side_effects:
          - "requested_at = certified_at = current logical time; line ELIGIBLE -> DISBURSING"
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /multistate/disbursements/{id}/certify"
        actor: "StateLegislature (X-User-ID == the line's state_office_id)"
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "current logical time <= settlement.executed_at + APPROPRIATION_WINDOW_DAYS (else ERR_CERTIFICATION_WINDOW_CLOSED; no mutation)"
        side_effects:
          - "certified_at = current logical time"
      - from: CERTIFIED
        to: RELEASED
        trigger: "POST /multistate/disbursements/{id}/release"
        actor: FundAdministrator
        preconditions:
          - "status == CERTIFIED (else ERR_INVALID_STATE)"
          - "settlement compliance_hold == false (else ERR_COMPLIANCE_HOLD_ACTIVE)"
          - "settlement.deposited_cents - settlement.released_cents >= amount_cents (else ERR_INSUFFICIENT_FUND_BALANCE)"
        side_effects:
          - "released_at = now; settlement.released_cents += amount_cents"
          - "line.disbursed_cents += amount_cents; line.remaining_cents recomputed; line -> DISBURSED when disbursed == gross"
          - "settlement fund_status -> DISBURSING on first release; -> DISBURSED when all lines terminal"
      - from: CERTIFIED
        to: HELD
        trigger: "AUTO: compliance_hold raised by a breach-escalated monitoring period close"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD
        to: CERTIFIED
        trigger: "AUTO: a later monitoring period closes with breach_count == 0, clearing the hold"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: REVERTED
        trigger: "AUTO: restitution compute sweep finds the request stale (now > executed_at + APPROPRIATION_WINDOW_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "line.reverted_cents += amount_cents; settlement.reverted_cents += amount_cents; restitution_reserve_balance_cents += amount_cents; line -> REVERTED when remaining hits 0"

  - entity: Claimant
    field: status
    initial_state: REGISTERED
    terminal_states: [PAID, DENIED, LAPSED]
    transitions:
      - from: null
        to: REGISTERED
        trigger: "POST /multistate/settlements/{id}/claimants"
        actor: FundAdministrator
        preconditions:
          - "settlement term_status == EXECUTED (else ERR_INVALID_STATE)"
          - "current logical time <= settlement.executed_at + CLAIM_WINDOW_DAYS (else ERR_CLAIM_WINDOW_CLOSED)"
          - "claimed_loss_cents > 0 (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: REGISTERED
        to: VALIDATED
        trigger: "POST /multistate/claimants/{id}/validate {decision: VALIDATED}"
        actor: FundAdministrator
        preconditions:
          - "status == REGISTERED (else ERR_INVALID_STATE)"
          - "0 < validated_loss_cents <= claimed_loss_cents (else ERR_VALIDATION_EXCEEDS_CLAIM)"
        side_effects:
          - "estimated_payout_cents = validated_loss_cents (estimated variant)"
      - from: REGISTERED
        to: DENIED
        trigger: "POST /multistate/claimants/{id}/validate {decision: DENIED}"
        actor: FundAdministrator
        preconditions:
          - "status == REGISTERED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REGISTERED
        to: LAPSED
        trigger: "AUTO: restitution compute finds the claim unvalidated after the claim window"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: PAID
        trigger: "AUTO: restitution compute assigns payout_cents"
        actor: system
        preconditions: []
        side_effects:
          - "payout_cents set per restitution_proration; restitution_reserve_balance_cents decremented by each payout"

  - entity: MonitoringPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED_COMPLIANT, CLOSED_BREACH]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /multistate/settlements/{id}/monitoring-periods"
        actor: CommitteeChair
        preconditions:
          - "settlement term_status == EXECUTED (else ERR_INVALID_STATE)"
          - "previous period exists and is CLOSED_* (else ERR_PERIOD_NOT_CONTIGUOUS); period_index would exceed MONITORING_MAX_PERIODS -> ERR_PERIOD_LIMIT_REACHED"
          - "current logical time >= window_start (else ERR_PERIOD_NOT_STARTED)"
        side_effects:
          - "window [window_start, window_end) computed from executed_at; half-open; contiguous with the previous period"
      - from: OPEN
        to: CLOSED_BREACH
        trigger: "AUTO: a filing completes findings for every injunctive term and breach_count >= BREACH_ESCALATION_THRESHOLD"
        actor: system
        preconditions: []
        side_effects:
          - "settlement.compliance_hold = true"
          - "every CERTIFIED Disbursement of this settlement's lines -> HELD"
      - from: OPEN
        to: CLOSED_COMPLIANT
        trigger: "AUTO: a filing completes findings for every injunctive term and breach_count < BREACH_ESCALATION_THRESHOLD"
        actor: system
        preconditions: []
        side_effects:
          - "when breach_count == 0 and compliance_hold was true: compliance_hold = false and every HELD Disbursement -> CERTIFIED (cure)"
          - "when period_index == MONITORING_MAX_PERIODS and breach_count == 0 and settlement fund_status == DISBURSED: settlement term_status -> CLOSED_OUT (which closes the investigation)"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: committee_activation_quorum
    trigger: "POST /multistate/investigations/{id}/advance {to_phase: OPEN}"
    algorithm: threshold
    formula: |
      leads = count(Participation where investigation_id == inv AND status == ACTIVE AND committee_role == LEAD)
      actives = count(Participation where investigation_id == inv AND status == ACTIVE)
      passes iff leads >= LEAD_MIN_COUNT AND actives >= ACTIVE_PARTICIPATION_MIN
    input_set: "Participations of this investigation; WITHDRAWN excluded from both counts"
    constants:
      LEAD_MIN_COUNT: 2
      ACTIVE_PARTICIPATION_MIN: 3
    precision: "integer counts; boundary is inclusive (>=)"

  - name: negotiation_round_cap
    trigger: "POST /multistate/settlements/{id}/counter"
    algorithm: threshold
    formula: |
      # reject the counter when negotiation_round + 1 > MAX_SETTLEMENT_ROUNDS;
      # the cap bounds the PROPOSED <-> COUNTERED negotiation cycle
    input_set: "the target Settlement's negotiation_round"
    constants:
      MAX_SETTLEMENT_ROUNDS: 4
    precision: "integer round counter; cap inclusive (rounds 1..4 allowed)"

  - name: lead_cost_and_distributable
    trigger: "Settlement execute (final); also run provisionally at settlement create"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order — the dependency is circular-looking and MUST be evaluated in this order:
      # (1) base   = monetary_total_cents - restitution_reserve_cents
      # (2) lead_cost_cents = min(LEAD_COST_CAP_CENTS, round_half_up(base * LEAD_COST_BPS / 10000))
      # (3) distributable_cents = base - lead_cost_cents
      # Never solve the equations jointly; the provisional and final variants both use this order.
    input_set: "Settlement monetary_total_cents and restitution_reserve_cents"
    constants:
      LEAD_COST_BPS: 500
      LEAD_COST_CAP_CENTS: 25000000
    precision: "integer cents; round_half_up at step (2) only"

  - name: allocation_weight_normalization
    trigger: "Settlement execute (final, over LOCKED sign-ons); settlement create (provisional, over ACTIVE participations)"
    algorithm: weighted_scoring
    formula: |
      # raw_i = basis value of state i: population (POPULATION) | harm_measure_cents (HARM_MEASURE) | negotiated_shares[state_code] (NEGOTIATED)
      # S = sum(raw_i) over the inclusion set
      # weight_bps_i = floor(TOTAL_WEIGHT_BPS * raw_i / S)
      # remainder = TOTAL_WEIGHT_BPS - sum(weight_bps_i); distribute remainder 1 bps at a time to the largest raw_i,
      # tie-break by sign_on decided_at ASC (final) or participation invited_at ASC (provisional); never by id.
      # Final weights are normalized over the LOCKED set only, so excluded (DECLINED/LAPSED) states' weight is redistributed.
    input_set: "Final: sign_ons entries LOCKED at execution. Provisional: ACTIVE participations at proposal time."
    constants:
      TOTAL_WEIGHT_BPS: 10000
    precision: "integer basis points; floor per line then deterministic remainder distribution"

  - name: line_share_cents
    trigger: "Settlement execute, after allocation_weight_normalization"
    algorithm: waterfall_allocation
    formula: |
      # Pinned rounding order — per-line floor FIRST, remainder distribution SECOND:
      # share_i = floor(distributable_cents * weight_bps_i / TOTAL_WEIGHT_BPS)
      # remainder_cents = distributable_cents - sum(share_i)
      # distribute remainder one cent at a time in order (weight_bps_i DESC, sign_on decided_at ASC); never by id.
      # lead_bonus: split lead_cost_cents equally across LOCKED lines whose office holds committee_role == LEAD;
      # split remainder cents go to the lead line whose Participation was designated earliest (designated order);
      # if no lead state signed, fold the entire lead_cost pool into distributable before share computation.
      # gross_share_cents_i = share_i + lead_bonus_cents_i
    input_set: "AllocationLines created for LOCKED sign-on states, in decided_at ASC creation order"
    constants:
      TOTAL_WEIGHT_BPS: 10000
    precision: "integer cents; round DOWN per line; remainder cents distributed per pinned order"

  - name: provisional_vs_final_allocation
    trigger: "provisional variant at settlement create/revise; final variant at settlement execute"
    algorithm: aggregation
    formula: |
      # Both variants run lead_cost_and_distributable + allocation_weight_normalization.
      # Provisional inclusion set: ACTIVE participations at proposal time, using live StateOffice registry values.
      # Final inclusion set: LOCKED sign_ons at execution time, using basis_value_snapshot captured at execution.
      # Same formula, different inclusion sets and timing; the two produce different per-state weights whenever the
      # participant set or registry values changed between proposal and execution.
    input_set: "see inclusion-set rule in formula"
    constants: {}
    precision: "integer cents and basis points per the invoked sub-calculations"
    variants:
      - name: provisional
        when: "settlement PROPOSED (create or revise)"
        difference: "stores provisional_distributable_cents and provisional_weight_bps_by_state; creates no AllocationLines"
      - name: final
        when: "settlement execute"
        difference: "stores distributable_cents/lead_cost_cents and creates AllocationLines over the LOCKED set only"

  - name: sign_on_quorum
    trigger: "POST /multistate/settlements/{id}/execute"
    algorithm: threshold
    formula: |
      # eligible = ACTIVE participations at open-sign-on time (the offices entitled to sign)
      # signed   = sign_ons entries with status in {SIGNED, LOCKED} at execution
      # quorum_ratio_bps = round_half_up(TOTAL_WEIGHT_BPS * sum(raw_i over signed) / sum(raw_i over eligible))
      #   where raw_i uses the settlement's allocation_basis and live registry values
      # quorum met iff quorum_ratio_bps >= SIGN_ON_QUORUM_BPS AND count(signed) >= SIGN_ON_MIN_STATES
      # boundary: exactly SIGN_ON_QUORUM_BPS passes (inclusive)
    input_set: "sign_ons entries and ACTIVE participations of the settlement's investigation"
    constants:
      SIGN_ON_WINDOW_DAYS: 45
      SIGN_ON_QUORUM_BPS: 8000
      SIGN_ON_MIN_STATES: 3
      TOTAL_WEIGHT_BPS: 10000
    precision: "integer basis points; round_half_up on the ratio"

  - name: restitution_proration
    trigger: "POST /multistate/settlements/{id}/restitution-compute"
    algorithm: waterfall_allocation
    formula: |
      # pool = restitution_reserve_balance_cents at compute time (reserve + any reverted disbursement cents)
      # claimants = VALIDATED claimants only; REGISTERED are lapsed first, DENIED excluded
      # if sum(validated_loss_cents) <= pool: payout_i = validated_loss_cents each; remainder = pool - sum
      # else: payout_i = floor(pool * validated_i / sum_validated); then distribute the remaining cents
      #   one at a time in order (validated_loss_cents DESC, created_at ASC); never by id
      # every VALIDATED claimant transitions to PAID with its payout_cents; remainder stored as
      # restitution_remainder_cents and reserve balance becomes the remainder
    input_set: "Claimants of this settlement in status VALIDATED after lapsing REGISTERED ones"
    constants:
      CLAIM_WINDOW_DAYS: 90
    precision: "integer cents; floor per claimant then deterministic remainder distribution"
    variants:
      - name: estimated
        when: "claimant validation"
        difference: "estimated_payout_cents = validated_loss_cents (assumes no oversubscription)"
      - name: final
        when: "restitution compute"
        difference: "payout_cents after pro-rata scaling; strictly smaller than estimated whenever oversubscribed"

  - name: appropriation_reversion_sweep
    trigger: "POST /multistate/settlements/{id}/restitution-compute (sweeps before proration)"
    algorithm: chronological
    formula: |
      # For each Disbursement of this settlement's lines still in REQUESTED whose certification deadline
      # (settlement.executed_at + APPROPRIATION_WINDOW_DAYS) is in the past at compute time:
      #   transition REQUESTED -> REVERTED; move amount_cents from the line into the restitution reserve.
      # Process stale disbursements in requested_at ASC order (chronological); never by id.
      # Each reversion updates line.reverted_cents / remaining_cents and settlement.reverted_cents /
      # restitution_reserve_balance_cents before proration runs, so reverted cents enlarge the payout pool.
    input_set: "Disbursements in REQUESTED on this settlement's lines at compute time"
    constants:
      APPROPRIATION_WINDOW_DAYS: 180
    precision: "integer cents; chronological sweep order"

  - name: monitoring_breach_escalation
    trigger: "AUTO: a finding completes the last unfilled term of an OPEN MonitoringPeriod"
    algorithm: threshold
    formula: |
      # breach_count = count(findings where outcome == BREACH) in this period
      # breach_count >= BREACH_ESCALATION_THRESHOLD  -> CLOSED_BREACH: compliance_hold = true, CERTIFIED -> HELD
      # breach_count == 0                            -> CLOSED_COMPLIANT: clears hold, HELD -> CERTIFIED
      # 0 < breach_count < threshold                 -> CLOSED_COMPLIANT without touching the hold
      # period windows are half-open [window_start, window_end) and must be exactly contiguous
    input_set: "Findings of the period; injunctive_terms array of the settlement"
    constants:
      BREACH_ESCALATION_THRESHOLD: 2
      MONITORING_PERIOD_DAYS: 180
      MONITORING_MAX_PERIODS: 6
    precision: "integer counts; boundary inclusive (>=)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID required iff the role is entity_backed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request body schema: required fields present, types valid, enum members valid, unknown id fields ignored", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right: state office", error_id: ERR_STATE_OFFICE_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/state-offices/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: investigation", error_id: ERR_INVESTIGATION_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/investigations/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: participation", error_id: ERR_PARTICIPATION_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/participations/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: consolidated response", error_id: ERR_RESPONSE_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/responses/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: settlement", error_id: ERR_SETTLEMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/settlements/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: allocation line", error_id: ERR_ALLOCATION_LINE_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/allocation-lines/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: disbursement", error_id: ERR_DISBURSEMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/disbursements/{id}" }
  - { priority: 4, category: existence, check: "Path ids resolve: claimant", error_id: ERR_CLAIMANT_NOT_FOUND, http_status: 404, applies_to: "endpoints under /multistate/claimants/{id}" }
