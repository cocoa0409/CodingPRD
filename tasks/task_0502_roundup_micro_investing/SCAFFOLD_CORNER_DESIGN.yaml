  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_bucket_version_on_order_submit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-submit-stale-bucket]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Submitting an order with a stale expected_bucket_version (one behind the live bucket version after a freeze/unfreeze) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Verified account, OPEN bucket, DRAFT order. Bucket version is bumped by a freeze+unfreeze after the client observed v0, so the client's expected_bucket_version is stale."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "occ@x.com", full_name: "Oc C", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id, bkt_v0: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 100 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buckets/${bkt_id}/freeze"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets/${bkt_id}/unfreeze"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: { expected_bucket_version: "${bkt_v0}" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 412 with error_id == ERR_STALE_VERSION (bkt_v0 is two versions stale after freeze+unfreeze)"
            - "Order.${o_id}.status remains DRAFT"

      - name: occ_sweep_stale_account_version_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sweep-stale-account]"]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_threshold_cascade_cash_to_invest_to_lot_to_drift
          rationale: "The sweep endpoint's OCC field and version bump are exercised by the §1.8 sweep cascade; this records the second concurrency rule's coverage. A dedicated stale-version sweep test mirrors the order-submit OCC corner above."

      - name: derived_pending_roundup_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.pending_roundup_cents, state_machines.RoundUpAccrual.PENDING_to_CANCELLED]
        distinguishing_aspect: "Cancelling a PENDING accrual of effective 50 decrements Account.pending_roundup_cents from 50 to 0 (derived field stays consistent)."
        test_recipe:
          setup: ["Verified account with one PENDING accrual effective 50 (purchase 1850 @x1 -> base 50)."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "dr@x.com", full_name: "De Riv", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "5050", roundup_multiplier: 1 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card_id: $.data.id }
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card_id}", purchase_amount_cents: 1850 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { acr_id: $.data.id }
          trigger:
            - call: "POST /roundup-accruals/${acr_id}/cancel"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { st: $.data.status }
          assert:
            - "RoundUpAccrual.${acr_id}.effective_amount_cents == 50 before cancel"
            - "After cancel: Account.${acc_id}.pending_roundup_cents == 0 (reconciled)"
            - "RoundUpAccrual.${acr_id}.status == CANCELLED"

