# =============================================================================
# Task 1744 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk per claim-extraction-guide; complements §1.8's 21 difficulty probes
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: ent_production_create_defaults
        claim_type: creation_defaults_system_fields
        grounds: [entities.Production]
        distinguishing_aspect: "A created Production starts posture=SETUP, insurance_status=UNFILED, committed_pay_cents=0, version=1, with server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/productions"
              payload: { name: "Fresh Prod", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { posture: $.data.posture, ins: $.data.insurance_status, committed: $.data.committed_pay_cents, ver: $.data.version, pid: $.data.id }
          assert:
            - "posture == SETUP and ins == UNFILED and committed == 0 and ver == 1"
            - "pid is a server-minted UUID (no client id supplied)"

      - name: ent_production_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Production, "errors[ERR_PRODUCTION_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_PRODUCTION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/productions/00000000-0000-0000-0000-000000000000"
              as: ProductionExecutive
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCTION_NOT_FOUND, http 404"

      - name: ent_sequence_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.StuntSequence, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/stunt-sequences without required hazard_class is rejected ERR_VALIDATION 400."
        test_recipe:
          setup: ["one production"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "No Hazard", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION, http 400 (missing hazard_class)"

      - name: ent_sequence_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.StuntSequence.fields.risk_category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "risk_category 'EXTREME' is not in the declared enum and is rejected ERR_VALIDATION 400."
        test_recipe:
          setup: ["one production"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Bad Enum", hazard_class: "FIGHT", risk_category: "EXTREME", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION, http 400 (EXTREME not in LOW|MEDIUM|HIGH|CRITICAL)"

      - name: ent_sequence_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.StuntSequence.fields.status, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied computed/system field (status) in a create payload is rejected as an unknown field ERR_VALIDATION 400; the server alone owns status."
        test_recipe:
          setup: ["one production"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Sneaky", hazard_class: "FIGHT", risk_category: "LOW", status: "READY", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION, http 400 (status is computed, not client-settable)"

      - name: ent_performer_list_pagination
        claim_type: listing
        grounds: [entities.StuntPerformer, response_envelope.pagination_fields]
        distinguishing_aspect: "Pagination envelope: limit=2 over 3 performers yields has_more=true and total_count=3; offset=2 yields the last item with has_more=false."
        test_recipe:
          setup: ["one production with three performers"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "A", last_name: "One", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "B", last_name: "Two", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "C", last_name: "Three", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /api/performers?production_id=${prod_id}&limit=2&offset=0"
              as: StuntCoordinator
            - call: "GET /api/performers?production_id=${prod_id}&limit=2&offset=2"
              as: StuntCoordinator
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: ent_equipment_fk_integrity_rejected
        claim_type: parent_relationships
        grounds: [entities.StuntSequence.fields.required_equipment_ids, "errors[ERR_CROSS_PRODUCTION_REFERENCE]"]
        distinguishing_aspect: "A sequence in production P1 cannot name an equipment item of production P2 in required_equipment_ids — flat-topology cross-reference integrity."
        test_recipe:
          setup: ["productions P1 and P2; equipment registered in P2"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P1", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { p1: $.data.id }
            - call: "POST /api/productions"
              payload: { name: "P2", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { p2: $.data.id }
            - call: "POST /api/equipment"
              payload: { production_id: "${p2}", name: "Foreign rig", equipment_type: "RIGGING", serial_number: "RG-X", inspection_interval_hours: 72 }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { eq_foreign: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${p1}", name: "Bad FK", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: ["${eq_foreign}"] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_PRODUCTION_REFERENCE, http 422"

      - name: ent_certification_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Certification]
        distinguishing_aspect: "Certification has common_fields: false — its GET representation carries id and created_at but no version/updated_at, evidencing the immutable-record design."
        test_recipe:
          setup: ["one production, one performer, one certification"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Im", last_name: "Mut", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /api/certifications/${cert_id}"
              as: StuntCoordinator
          assert:
            - "Response data contains id and created_at and does NOT contain version or updated_at keys"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_sequence_initial_state
        claim_type: initial_state
        grounds: [state_machines.StuntSequence]
        distinguishing_aspect: "A new StuntSequence starts DRAFT with design_revision 1 and zero completed rehearsal counters."
        test_recipe:
          setup: ["one production"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Init Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { st: $.data.status, rev: $.data.design_revision, cnt: $.data.completed_rehearsal_count, coord: $.data.coordinator_user_id }
          assert:
            - "st == DRAFT and rev == 1 and cnt == 0"
            - "coord == coord-1 (creator X-User-ID stamped for SoD)"

      - name: sm_cancel_terminal_sequence_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.StuntSequence, "errors[ERR_SEQUENCE_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected ERR_SEQUENCE_INVALID_STATE and fires no further side effects."
        test_recipe:
          setup: ["one production with a DRAFT sequence, already cancelled once"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Term Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/stunt-sequences/${seq_id}/cancel"
              payload: { reason: "cut" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /api/stunt-sequences/${seq_id}/cancel"
              payload: { reason: "again" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "st1 == CANCELLED after first cancel"
            - "err == ERR_SEQUENCE_INVALID_STATE, http 409 on the second cancel"

      - name: sm_signoff_decided_lockout_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DepartmentSignoff, "errors[ERR_SIGNOFF_ALREADY_DECIDED]"]
        distinguishing_aspect: "A SIGNED signoff is terminal: a subsequent refuse returns ERR_SIGNOFF_ALREADY_DECIDED."
        test_recipe:
          setup: ["ACTIVE production; DESIGN_LOCKED sequence; meeting IN_SESSION with 4 PENDING signoffs"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "So Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", facility: "Stage 2", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_id: $.data.id }
            - call: "POST /api/safety-meetings/${mtg_id}/start"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=CAMERA"
              as: SafetyOfficer
              captures: { sg_cam: "$.data[0].id" }
            - call: "POST /api/department-signoffs/${sg_cam}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
              captures: { sg_status: $.data.status }
          trigger:
            - call: "POST /api/department-signoffs/${sg_cam}/refuse"
              payload: { reason: "changed my mind" }
              as: DepartmentHead
              as_user_id: "dh-1"
              captures: { err: $.data.error_id }
          assert:
            - "sg_status == SIGNED after the first decision"
            - "err == ERR_SIGNOFF_ALREADY_DECIDED, http 409 — decided signoffs are terminal"

      - name: sm_signoff_requires_in_session_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DepartmentSignoff, "errors[ERR_MEETING_INVALID_STATE]"]
        distinguishing_aspect: "Signing is only possible while the meeting is IN_SESSION; a sign against a SCHEDULED meeting returns ERR_MEETING_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE production; DESIGN_LOCKED sequence; meeting created but NOT started"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "So2 Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", facility: "Stage 2", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_id: $.data.id }
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=CAMERA"
              as: SafetyOfficer
              captures: { sg_cam: "$.data[0].id" }
          trigger:
            - call: "POST /api/department-signoffs/${sg_cam}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEETING_INVALID_STATE, http 409 (meeting still SCHEDULED, not IN_SESSION)"

      - name: sm_meeting_complete_blocked_pending_signoffs
        claim_type: precondition_enforcement
        grounds: [state_machines.SafetyMeeting, "errors[ERR_SIGNOFFS_PENDING]"]
        distinguishing_aspect: "Compound gate: meeting complete requires ALL child signoffs decided; with any PENDING the completion fails ERR_SIGNOFFS_PENDING."
        test_recipe:
          setup: ["ACTIVE production; DESIGN_LOCKED sequence; meeting IN_SESSION; only CAMERA signed, 3 PENDING"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Pend Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", facility: "Stage 2", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_id: $.data.id }
            - call: "POST /api/safety-meetings/${mtg_id}/start"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=CAMERA"
              as: SafetyOfficer
              captures: { sg_cam: "$.data[0].id" }
            - call: "POST /api/department-signoffs/${sg_cam}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
          trigger:
            - call: "POST /api/safety-meetings/${mtg_id}/complete"
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SIGNOFFS_PENDING, http 409 — 3 signoffs still PENDING"

      - name: sm_meeting_refusal_completes_but_blocks_readiness
        claim_type: valid_transition_with_conditional_cascade
        grounds: [state_machines.SafetyMeeting, state_machines.StuntSequence, "errors[ERR_MEETING_REQUIREMENT_UNSATISFIED]"]
        distinguishing_aspect: "A meeting with a REFUSED signoff still completes (no PENDING), but the completed meeting does not satisfy readiness — mark-ready fails ERR_MEETING_REQUIREMENT_UNSATISFIED."
        test_recipe:
          setup:
            - "ACTIVE production; DESIGN_LOCKED LOW/FIGHT sequence; quota met (1 COMPLETED rehearsal)"
            - "Meeting where CAMERA/ELECTRIC/GRIP signed but STUNTS refused; meeting COMPLETED"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Ref Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Ra", last_name: "Qi", base_day_rate_cents: 150000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
