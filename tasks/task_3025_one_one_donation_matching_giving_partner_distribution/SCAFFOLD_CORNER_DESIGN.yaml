  - section: errors
    instances:

      - name: shipping_more_than_the_allocation_returns_shipment_exceeds_allocation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHIPMENT_EXCEEDS_ALLOCATION]
          - state_machines.DonationAllocation.APPROVED_to_SHIPPED
        distinguishing_aspect: "The ship action is bounded by the allocation's allocated_units, so a shipment one unit over is refused at the boundary rather than clamped down to the allocation."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved allocation of 40 units."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 40, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 41, shipment_reference: "TRK-ERR-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SHIPMENT_EXCEEDS_ALLOCATION"
            - "DonationAllocation.${alloc_id}.status is still APPROVED"
            - "the identical call with shipped_units 40 returns 201 and moves the allocation to SHIPPED"

      - name: confirming_more_units_than_were_shipped_returns_receipt_exceeds_shipment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RECEIPT_EXCEEDS_SHIPMENT]
          - state_machines.DonationDistribution.SHIPPED_to_PARTIALLY_RECEIVED
        distinguishing_aspect: "Confirmed units accumulate against a fixed shipment, so the second receipt that would push the total past shipped_units is refused rather than resizing the shipment."
        test_recipe:
          setup:
            - "Logical clock at the default; a 10-unit distribution shipped and 6 units already confirmed."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 10, shipment_reference: "TRK-ERR-2", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 6, receipt_reference: "RCV-ERR-2A" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 5, receipt_reference: "RCV-ERR-2B" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RECEIPT_EXCEEDS_SHIPMENT"
            - "DonationDistribution.${dist_id}.received_units == 6 and status == PARTIALLY_RECEIVED"
            - "the identical call with received_units 4 returns 200 and moves the row to RECEIVED with received_units == 10"

      - name: the_auditor_who_started_the_audit_cannot_finalize_it
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AUDIT_SOD_VIOLATION]
          - state_machines.ImpactAudit.IN_PROGRESS_to_FINALIZED
        distinguishing_aspect: "Segregation of duties is enforced on the acting X-User-ID, so the same auditor who opened the field work is refused at finalization with 403 while a second auditor identifier finalizes the identical audit."
        test_recipe:
          setup:
            - "Logical clock past freezes_at; a FROZEN season with one received distribution and an IN_PROGRESS audit opened by auditor aud-alpha."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-SOD-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 100, receipt_reference: "RCV-SOD-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/impact-seasons/${s_id}"
              payload: {}
              as: ImpactAuditor
              captures: { s_v: $.data.version }
            - call: "PUT /impact-program/impact-seasons/${s_id}/frozen-state"
              payload: { is_final: true, expected_season_version: "${s_v}" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-audits"
              payload: { impact_season_id: "${s_id}", claim_id: "${claim_id}", audit_kind: "ANNUAL_IMPACT" }
              as: ImpactAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              as_user_id: "aud-alpha"
              captures: { audit_v: $.data.version }
          trigger:
            - call: "POST /impact-program/impact-audits/${audit_id}/finalize"
              payload: { transaction_test_sample_size: 20, transaction_test_exceptions: 0, claimed_donation_units: 100, expected_audit_version: "${audit_v}" }
              as: ImpactAuditor
              as_user_id: "aud-alpha"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_AUDIT_SOD_VIOLATION"
            - "ImpactAudit.${audit_id}.status is still IN_PROGRESS"
            - "the identical finalize sent with as_user_id aud-beta returns 200 and the audit reaches FINALIZED"

      - name: an_expired_vetting_round_refuses_a_late_outcome
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VETTING_ROUND_TERMINAL]
          - state_machines.GivingPartnerVetting.REQUESTED_to_EXPIRED
        distinguishing_aspect: "A round whose valid_until has passed is moved to EXPIRED by the clock, and the identical outcome write that succeeded before the boundary is then refused."
        test_recipe:
          setup:
            - "Logical clock at the default; one candidate partner whose round expires at 2026-09-10."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Psi Short Window Coop", partner_type: "YOUTH_OUTREACH", operating_region: "SOUTHEAST", operating_state_code: "NC", service_radius_miles: 25, registry_id: "NC-CHR-230023", ein: "300400700", founded_year: 2013, unduplicated_recipients_per_facility: 2500, need_tier: "YOUTH_OUTREACH" }
              as: GivingPartnerCoordinator
              captures: { p_id: $.data.id, vt_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "DOCUMENTS_SUBMITTED", registry_check_passed: true, tax_check_passed: true, valid_until: "2026-09-10T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: ImpactAuditor
          trigger:
            - call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_VETTING_ROUND_TERMINAL"
            - "GivingPartnerVetting.${vt_id}.outcome == EXPIRED and GivingPartner.${p_id}.status == CANDIDATE"
            - "the identical outcome write issued before the clock moved returned 200"

