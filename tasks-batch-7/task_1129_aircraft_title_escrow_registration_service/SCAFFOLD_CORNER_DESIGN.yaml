          assert:
            - "rejected ERR_FILE_ON_HOLD (state, priority 6) despite correct OCC version"
            - "no Deposit persisted; file remains ON_HOLD"
      - name: s_filing_parallel_verification
        claim_type: invalid_transition
        grounds: [entities.Filing.fields.verification_status]
        excluded_because:
          difficulty_instance: n1_filing_reject_resubmit_cycle_with_parallel_verification
          rationale: "Parallel-dimension independence (status ACCEPTED while verification flips PENDING->MISMATCHED->MATCHED) asserted there."
      - name: s_search_stale_on_close
        claim_type: violation_to_error
