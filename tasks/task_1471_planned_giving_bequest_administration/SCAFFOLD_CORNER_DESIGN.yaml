          setup: ["Donor D; ACTIVE table; DRAFT CRAT with VERIFIED PRIMARY_1 designation"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "RBAC Exec", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
