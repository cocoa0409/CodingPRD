            - "compliance_score == 100.00 with posture COMPLIANT — d6 is not charged under PROVISIONAL, so the ceiling rejection is not a score effect"

      - name: conditional_schema_rules_on_receipt_and_transmission_lines
        claim_type: conditional_validation
        grounds:
          - "§1.4 priority 3 (request_schema): '... source_call_sign present for RECEIPT entries and absent for TRANSMISSION entries' -> ERR_INVALID_REQUEST (400)"
          - "§1.5 POST /test-log-entries input [test_event_id, device_id, entry_kind, source_call_sign?]"
          - "§1.1 TestLogEntry.entry_kind constraints 'one of {TRANSMISSION, RECEIPT}'"
        distinguishing_aspect: "The optional field is conditionally required in one direction and conditionally forbidden in the other: RECEIPT without source_call_sign and TRANSMISSION with it are both ERR_INVALID_REQUEST, and the check runs before the referential source-call-sign lookup (which is what turns a present-but-unknown call sign into ERR_LOG_ENTRY_SOURCE_UNKNOWN instead)."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP'] activated; station KWEA; dev1 READY; ma1 PEP/WXPEP."
            - "te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z); READY at 2026-08-12T00:30:00Z (readiness 80.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
          trigger:
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT" }
              captures: { err_missing_call_sign: "$.data.error_id" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "TRANSMISSION", source_call_sign: "WXPEP" }
              captures: { err_extra_call_sign: "$.data.error_id" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "BEACON" }
              captures: { err_bad_kind: "$.data.error_id" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT", source_call_sign: "WXPEP" }
              captures: { entry_ok: "$.data.id" }
          assert:
            - "${err_missing_call_sign} == 'ERR_INVALID_REQUEST' with HTTP 400 — source_call_sign is required when entry_kind == 'RECEIPT'"
            - "${err_extra_call_sign} == 'ERR_INVALID_REQUEST' with HTTP 400 — the same field is forbidden when entry_kind == 'TRANSMISSION'"
            - "${err_bad_kind} == 'ERR_INVALID_REQUEST' with HTTP 400 — 'BEACON' is not a declared entry_kind member"
            - "the well-formed RECEIPT returns 201 with logged_at == '2026-08-12T00:30:00Z', retention_days_applied == 730 and retention_until == '2028-08-11T00:30:00Z'"
