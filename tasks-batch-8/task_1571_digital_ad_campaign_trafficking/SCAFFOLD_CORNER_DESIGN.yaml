          assert: ["a == 0", "d == null", "b == 0", "c == 0"]

      - name: attribution_view_weighted_variant
        claim_type: variant_divergence
        grounds: [calculations.attribution]
        distinguishing_aspect: "On identical delivery, LINEAR_CLICKS (clicks 150/100 → 60/40) and VIEW_WEIGHTED (viewable 70000/30000 → 70/30) attribute 100 conversions differently; both variants are selectable per wrap report."
