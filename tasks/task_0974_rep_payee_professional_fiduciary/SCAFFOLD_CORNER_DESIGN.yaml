            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 100000, received_date: "2026-06-05" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Round One", category: "HOUSING", amount_cents: 3333, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w1_id: $.data.id } }
            - { call: "POST /disbursements/${w1_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w1_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f1: $.data.fee_cents } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Round Two", category: "HOUSING", amount_cents: 3333, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w2_id: $.data.id } }
            - { call: "POST /disbursements/${w2_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w2_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f2: $.data.fee_cents } }
          assert:
            - "f1 == 167 and f2 == 167 (round_half_up(3333 * 0.05) = round_half_up(166.65) = 167 per disbursement)"
            - "Month fee total f1 + f2 == 334, not 333 (per-disbursement rounding order is pinned)"

