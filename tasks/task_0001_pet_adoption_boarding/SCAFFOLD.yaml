# =============================================================================
# Pet Adoption & Boarding Platform benchmark seed tables (v1)
# =============================================================================

scenario: |
  Pet adoption and boarding platform: animal records, adoption application approval
  process, home visit assessment, boarding matching, vaccination record compliance,
  and fee settlement.

domain_name: pet-adoption-boarding
api_prefix: /shelters

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

  difficulty_target: Advanced
  entity_count: 9
  state_machine_count: 4
  calculation_count: 5
  validation_layers: 10
  endpoint_count: 26
  error_code_count: 22
  role_count: 5

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: name, type: string, source: input, description: "Shelter name" }
      - { name: boarding_capacity, type: integer, source: input, description: "Maximum concurrent boarding reservations" }
      - { name: reserved_slots, type: integer, source: computed, description: "Count of BookingReservations currently in RESERVED or ACTIVE state" }
      - { name: available_slots, type: integer, source: computed, description: "boarding_capacity - reserved_slots" }
      - { name: adoption_fee_base, type: number, source: input, description: "Base adoption fee in cents" }
      - { name: boarding_rate_per_night, type: number, source: input, description: "Nightly boarding rate in cents" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED" }

  - name: Animal
    parent: Shelter
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: shelter_id, type: string, source: system, description: "Parent shelter" }
      - { name: name, type: string, source: input, description: "Animal display name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | OTHER" }
      - { name: age_months, type: integer, source: input, description: "Age in months" }
      - { name: temperament_tags, type: array, source: input, default: [], description: "e.g., KID_FRIENDLY, HIGH_ENERGY, NEEDS_YARD" }
      - { name: adoption_fee_override, type: number, source: input, default: null, description: "Overrides shelter base if set" }
      - { name: special_care_level, type: enum, source: input, default: "NONE", description: "NONE | MEDICAL | BEHAVIORAL (drives boarding rate multiplier)" }
      - { name: intake_date, type: datetime, source: system, description: "When the animal entered the shelter" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | HELD | ADOPTED | BOARDING_ONLY | RETIRED" }

  - name: VaccinationRecord
    parent: Animal
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: animal_id, type: string, source: system, description: "Parent animal" }
      - { name: vaccine_type, type: enum, source: input, description: "RABIES | DISTEMPER | PARVO | BORDETELLA | FELV" }
      - { name: administered_date, type: datetime, source: input, description: "Date the vaccine was given" }
      - { name: expires_date, type: datetime, source: input, description: "Expiration date; compliance based on this" }
      - { name: lot_number, type: string, source: input, description: "Vaccine lot / batch identifier" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }
    note: "Append-only; never updated or deleted. Compliance evaluated against latest record per vaccine_type."

  - name: Adopter
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: household_size, type: integer, source: input, description: "Number of household members" }
      - { name: has_yard, type: boolean, source: input, description: "Whether residence has a yard" }
      - { name: home_visit_status, type: enum, source: computed, description: "PENDING | PASSED | FAILED | EXPIRED — derived from latest HomeVisit" }
      - { name: home_visit_expires_at, type: datetime, source: computed, description: "PASSED visits valid for HOME_VISIT_TTL_DAYS" }
      - { name: disqualified, type: boolean, source: system, default: false, description: "Manual or cascading disqualification flag" }

  - name: HomeVisit
    parent: Adopter
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: adopter_id, type: string, source: system, description: "Parent adopter" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned visit time" }
      - { name: completed_at, type: datetime, source: system, description: "Set when SUBMITTED" }
      - { name: safety_score, type: integer, source: input, description: "0-100 assessment score, required on submit" }
      - { name: yard_verified, type: boolean, source: input, default: false, description: "Visitor confirms yard presence" }
      - { name: inspector_id, type: string, source: input, description: "User ID of HomeVisitInspector" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | PASSED | FAILED | CANCELLED" }

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: adopter_id, type: string, source: input, description: "Applying adopter" }
      - { name: animal_id, type: string, source: input, description: "Target animal" }
      - { name: shelter_id, type: string, source: system, description: "Resolved from animal" }
      - { name: pinned_animal_version, type: integer, source: system, description: "Animal.version at APPROVED; re-validated at FINALIZE" }
      - { name: pinned_vaccination_snapshot, type: array, source: system, description: "Snapshot of vaccine compliance at APPROVED time" }
      - { name: pinned_fee, type: number, source: system, description: "Adoption fee locked at APPROVED time" }
      - { name: review_notes, type: string, source: input, default: "", description: "Reviewer commentary" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | HOME_VISIT_REQUIRED | APPROVED | REJECTED | FINALIZED | WITHDRAWN" }

  - name: BoardingReservation
    parent: Shelter
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: shelter_id, type: string, source: system, description: "Parent shelter" }
      - { name: animal_id, type: string, source: input, description: "Animal being boarded (must belong to this shelter)" }
      - { name: owner_id, type: string, source: input, description: "Adopter id acting as owner" }
      - { name: check_in_date, type: datetime, source: input, description: "Start date (inclusive)" }
      - { name: check_out_date, type: datetime, source: input, description: "End date (exclusive)" }
      - { name: nights, type: integer, source: computed, description: "(check_out - check_in) in whole days, must be >= 1" }
      - { name: quoted_total, type: number, source: computed, description: "Provisional charge including special-care multiplier and peak surcharge" }
      - { name: final_total, type: number, source: computed, description: "Set at SETTLED; may differ if nights adjusted at check-out" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | COMPLETED | SETTLED | CANCELLED" }

  - name: FeeSettlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: subject_type, type: enum, source: input, description: "ADOPTION | BOARDING" }
      - { name: subject_id, type: string, source: input, description: "AdoptionApplication.id or BoardingReservation.id" }
      - { name: amount, type: number, source: computed, description: "Charge amount in cents" }
      - { name: method, type: enum, source: input, description: "CARD | BANK_TRANSFER | CASH" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | REFUNDED | FAILED" }
      - { name: settled_at, type: datetime, source: system, description: "Set when transitioning to COMPLETED" }
    note: "Exactly one COMPLETED settlement may exist per (subject_type, subject_id)."

  - name: ComplianceIncident
    parent: Animal
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: animal_id, type: string, source: system, description: "Subject animal" }
      - { name: incident_type, type: enum, source: system, description: "VACCINE_EXPIRED | VACCINE_MISSING | ADOPTION_BLOCKED | BOARDING_BLOCKED" }
      - { name: triggered_by, type: string, source: system, description: "Endpoint or system event that raised the incident" }
      - { name: detail, type: string, source: system, description: "Human-readable detail" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
    note: "Append-only audit log; written whenever vaccination compliance blocks an operation."

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AdoptionApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [FINALIZED, REJECTED, WITHDRAWN]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /adoption-applications/{id}/begin-review"
        actor: AdoptionReviewer
        preconditions:
          - "Application in SUBMITTED (ERR_INVALID_STATE)"
          - "Adopter.disqualified == false (ERR_ADOPTER_DISQUALIFIED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: HOME_VISIT_REQUIRED
        trigger: "POST /adoption-applications/{id}/request-home-visit"
        actor: AdoptionReviewer
        preconditions:
          - "Adopter.home_visit_status != PASSED OR expired (else skip to APPROVED path)"
        side_effects:
          - "If no active HomeVisit for adopter, reviewer should schedule one via POST /adopters/{id}/home-visits"

      - from: [UNDER_REVIEW, HOME_VISIT_REQUIRED]
        to: APPROVED
        trigger: "POST /adoption-applications/{id}/approve"
        actor: AdoptionApprover
        preconditions:
          - "Segregation: approver.user_id != application.reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Adopter.home_visit_status == PASSED and not expired (ERR_HOME_VISIT_REQUIRED)"
          - "Animal in AVAILABLE or HELD-by-this-application (ERR_ANIMAL_UNAVAILABLE)"
          - "Vaccination compliance satisfied for required vaccines (ERR_VACCINATION_NON_COMPLIANT)"
          - "No other APPROVED or FINALIZED application exists for same animal (ERR_ANIMAL_ALREADY_RESERVED)"
        side_effects:
          - "Animal.status → HELD"
          - "pinned_animal_version = Animal.version"
          - "pinned_vaccination_snapshot = current compliance set"
          - "pinned_fee = calculate_adoption_fee(animal)"
          - "All other SUBMITTED/UNDER_REVIEW/HOME_VISIT_REQUIRED applications for same animal → REJECTED with ERR_ANIMAL_ALREADY_RESERVED"

      - from: [SUBMITTED, UNDER_REVIEW, HOME_VISIT_REQUIRED]
        to: REJECTED
        trigger: "POST /adoption-applications/{id}/reject"
        actor: AdoptionApprover
        preconditions:
          - "Segregation: approver.user_id != application.reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If Animal was HELD exclusively for this application, Animal.status → AVAILABLE"

      - from: APPROVED
        to: FINALIZED
        trigger: "POST /adoption-applications/{id}/finalize"
        actor: AdoptionApprover
        preconditions:
          - "A COMPLETED FeeSettlement exists for (ADOPTION, applicationId) (ERR_FEE_NOT_SETTLED)"
          - "Animal.version == pinned_animal_version (ERR_STALE_PINNED_REFERENCE)"
          - "Current vaccination compliance still satisfied (ERR_VACCINATION_NON_COMPLIANT)"
        side_effects:
          - "Animal.status → ADOPTED"
          - "Any RESERVED BoardingReservation for this animal → CANCELLED with ERR_ANIMAL_ADOPTED (released slots)"

      - from: [SUBMITTED, UNDER_REVIEW, HOME_VISIT_REQUIRED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Requesting user is the application's adopter (ERR_INSUFFICIENT_PERMISSIONS)"
          - "Status != FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "If Animal was HELD for this application and no other APPROVED app exists, Animal.status → AVAILABLE"
          - "Any PENDING FeeSettlement for (ADOPTION, applicationId) → FAILED"

  - entity: HomeVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /adopters/{id}/home-visits/{hvId}/submit"
        actor: HomeVisitInspector
        preconditions:
          - "Inspector is the assigned inspector_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "safety_score in [0..100] (ERR_INVALID_SCORE)"
        side_effects:
          - "completed_at = now"

      - from: SUBMITTED
        to: PASSED
        trigger: "system (auto on submit when safety_score >= HOME_VISIT_PASS_THRESHOLD AND yard_verified satisfies animal constraints at review time)"
        actor: system
        preconditions:
          - "safety_score >= HOME_VISIT_PASS_THRESHOLD (70)"
        side_effects:
          - "Adopter.home_visit_status = PASSED"
          - "Adopter.home_visit_expires_at = now + HOME_VISIT_TTL_DAYS"

      - from: SUBMITTED
        to: FAILED
        trigger: "system (auto on submit when safety_score < threshold)"
        actor: system
        preconditions:
          - "safety_score < HOME_VISIT_PASS_THRESHOLD"
        side_effects:
          - "Adopter.home_visit_status = FAILED"
          - "Any applications in HOME_VISIT_REQUIRED for this adopter → REJECTED with ERR_HOME_VISIT_FAILED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /adopters/{id}/home-visits/{hvId}/cancel"
        actor: [Adopter, HomeVisitInspector]
        preconditions: []
        side_effects: []

  - entity: BoardingReservation
    field: status
    initial_state: RESERVED
    terminal_states: [SETTLED, CANCELLED]
    shape: linear_with_cancel
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /shelters/{sid}/boarding-reservations/{rid}/check-in"
        actor: BoardingCoordinator
        preconditions:
          - "now >= check_in_date - EARLY_CHECKIN_GRACE_HOURS (ERR_TOO_EARLY_FOR_CHECKIN)"
          - "Vaccination compliance for animal still satisfied (ERR_VACCINATION_NON_COMPLIANT)"
        side_effects:
          - "Animal.status transitions to BOARDING_ONLY if it was AVAILABLE (otherwise unchanged)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /shelters/{sid}/boarding-reservations/{rid}/check-out"
        actor: BoardingCoordinator
        preconditions: []
        side_effects:
          - "final_total recomputed based on actual check-out date (may change nights)"
          - "Shelter.reserved_slots decremented by 1"
          - "If Animal was BOARDING_ONLY solely due to this reservation → AVAILABLE"

      - from: COMPLETED
        to: SETTLED
        trigger: "POST /shelters/{sid}/boarding-reservations/{rid}/settle"
        actor: FinanceOfficer
        preconditions:
          - "A COMPLETED FeeSettlement exists for (BOARDING, rid) (ERR_FEE_NOT_SETTLED)"
        side_effects: []

      - from: [RESERVED, ACTIVE]
        to: CANCELLED
        trigger: "POST /shelters/{sid}/boarding-reservations/{rid}/cancel OR system (animal adopted / shelter suspended / vaccination lapse)"
        actor: [BoardingCoordinator, system]
        preconditions: []
        side_effects:
          - "Shelter.reserved_slots decremented by 1 (if was RESERVED or ACTIVE)"
          - "Any PENDING FeeSettlement for (BOARDING, rid) → FAILED"
          - "If Animal.status was BOARDING_ONLY solely due to this reservation → AVAILABLE"

  - entity: FeeSettlement
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, REFUNDED, FAILED]
    shape: branching
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /fee-settlements/{id}/capture"
        actor: FinanceOfficer
        preconditions:
          - "Subject still exists and in settle-eligible state (APPROVED for adoption, COMPLETED for boarding) (ERR_INVALID_STATE)"
          - "No other COMPLETED settlement already exists for same (subject_type, subject_id) (ERR_DUPLICATE_SETTLEMENT)"
          - "amount == authoritative quoted amount (ERR_AMOUNT_MISMATCH)"
        side_effects:
          - "settled_at = now"

      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /fee-settlements/{id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "Subject not in FINALIZED/SETTLED terminal state (ERR_INVALID_STATE)"
        side_effects:
          - "If subject is AdoptionApplication in APPROVED → REJECTED (with ERR_FEE_REFUNDED), Animal released"

      - from: PENDING
        to: FAILED
        trigger: "system (subject cancelled or withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two approvers simultaneously approve different applications for the same animal"
    guarantee: "At most one application reaches APPROVED for a given animal_id; second receives ERR_ANIMAL_ALREADY_RESERVED"
    error_id: ERR_ANIMAL_ALREADY_RESERVED
    http_status: 409
    serialization: "First-writer-wins on Animal.status transition AVAILABLE → HELD"

  - scenario: "Boarding reservation created while Shelter.available_slots == 1 and another reservation is in flight"
    guarantee: "At most one reservation succeeds; loser receives ERR_SHELTER_AT_CAPACITY"
    error_id: ERR_SHELTER_AT_CAPACITY
    http_status: 409
    serialization: "Atomic decrement of Shelter.available_slots under row lock"

  - scenario: "Capture and refund invoked simultaneously on the same FeeSettlement"
    guarantee: "Exactly one succeeds; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409

  - scenario: "Finalize adoption while Animal is edited (new vaccination expiring) concurrently"
    guarantee: "Finalize either succeeds with current valid state or rejects with ERR_STALE_PINNED_REFERENCE or ERR_VACCINATION_NON_COMPLIANT"
    error_id: [ERR_STALE_PINNED_REFERENCE, ERR_VACCINATION_NON_COMPLIANT]
    http_status: 409
    note: "Version check on Animal uses OCC version field; pinned_animal_version must equal Animal.version"

  - scenario: "PATCH with stale version header"
    guarantee: "Stale updates rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vaccination_compliance
    trigger: "adoption approval, adoption finalize, boarding reservation create, boarding check-in"
    algorithm: set_coverage_with_recency
    formula: |
      REQUIRED_VACCINES(species) = {
        DOG    -> {RABIES, DISTEMPER, PARVO, BORDETELLA},
        CAT    -> {RABIES, DISTEMPER, FELV},
        RABBIT -> {RABIES},
        OTHER  -> {RABIES}
      }
      For each required vaccine_type v:
        latest = VaccinationRecord with max administered_date for (animal, v)
        if latest is None -> NON_COMPLIANT (reason=VACCINE_MISSING)
        if latest.expires_date <= now -> NON_COMPLIANT (reason=VACCINE_EXPIRED)
      Else COMPLIANT.
    note: |
      Boundary precision: expires_date == now is treated as EXPIRED (strict <).
      On NON_COMPLIANT, a ComplianceIncident is created with the reason.

  - name: adoption_fee
    trigger: "application approval (locks pinned_fee), settlement amount verification"
    algorithm: conditional_override
    formula: |
      if animal.adoption_fee_override is not null:
        fee = animal.adoption_fee_override
      else:
        fee = shelter.adoption_fee_base
      if animal.age_months >= SENIOR_AGE_MONTHS (96):
        fee = fee * SENIOR_DISCOUNT (0.5, round_half_up to cents)
    constants:
      SENIOR_AGE_MONTHS: 96
      SENIOR_DISCOUNT: 0.5
    variants:
      - name: at_approval
        when: "Computed and pinned on APPROVE transition"
        difference: "Uses animal state at approval time; immune to later animal edits"
      - name: at_capture
        when: "Re-evaluated when FeeSettlement is captured"
        difference: "Must match pinned_fee exactly (else ERR_AMOUNT_MISMATCH). Demonstrates dual-variant calculation."

  - name: boarding_quote
    trigger: "boarding reservation create (quoted_total); check-out (final_total)"
    algorithm: tiered_multiplier
    formula: |
      nights = days_between(check_in_date, check_out_date)  # whole days, check-out exclusive
      base = shelter.boarding_rate_per_night * nights
      multiplier = 1.0
      if animal.special_care_level == MEDICAL:    multiplier = 1.5
      if animal.special_care_level == BEHAVIORAL: multiplier = 1.25
      if shelter.reserved_slots / shelter.boarding_capacity >= PEAK_UTILIZATION (0.8) at time of RESERVATION:
         surcharge = base * PEAK_SURCHARGE (0.1)
      else:
         surcharge = 0
      quoted_total = round_half_up((base * multiplier) + surcharge, 0)   # integer cents
    constants:
      PEAK_UTILIZATION: 0.8
      PEAK_SURCHARGE: 0.1
      MEDICAL_MULTIPLIER: 1.5
      BEHAVIORAL_MULTIPLIER: 1.25
    variants:
      - name: quoted_total
        when: "Set at RESERVED; uses planned nights and peak status at reservation time"
        difference: "Peak surcharge pinned to the reservation-time utilization"
      - name: final_total
        when: "Set at COMPLETED; nights recomputed using actual check-out date"
        difference: "Peak surcharge from quote is NOT re-evaluated; only nights change"

  - name: available_slots
    trigger: "any reservation state change; shelter status change"
    algorithm: aggregation
    formula: |
      reserved_slots = count(BoardingReservation where shelter_id = S and status in {RESERVED, ACTIVE})
      available_slots = max(0, boarding_capacity - reserved_slots)
    note: "Decrement is atomic with transition into RESERVED; increment atomic with transition out of RESERVED/ACTIVE."

  - name: home_visit_validity
    trigger: "application approve; HomeVisit submit"
    algorithm: recency_threshold
    formula: |
      Let hv = latest HomeVisit for adopter in terminal states {PASSED, FAILED}.
      if hv is None or status==FAILED -> adopter.home_visit_status = hv.status or PENDING
      if hv.status == PASSED:
        if now < hv.completed_at + HOME_VISIT_TTL_DAYS:
          home_visit_status = PASSED
        else:
          home_visit_status = EXPIRED
    constants:
      HOME_VISIT_PASS_THRESHOLD: 70
      HOME_VISIT_TTL_DAYS: 180
    note: "EXPIRED is treated like PENDING for approval purposes; requires a new visit."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_SHELTER_NOT_FOUND / ERR_ANIMAL_NOT_FOUND / ERR_ADOPTER_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_HOME_VISIT_NOT_FOUND / ERR_RESERVATION_NOT_FOUND / ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: all nested or id-referenced endpoints

  - priority: 4
    category: request
    check: "Payload well-formed; required fields present; enum values recognized; nights >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints

  - priority: 5
    category: occ
    check: "version header (if supplied on PATCH) matches current resource version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: PATCH endpoints

  - priority: 6
    category: state
    check: "Target resource in correct state for operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7a
    category: business_compliance
    check: "Segregation of duties: the AdoptionApprover on approve/reject must not be the same user who called begin-review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /adoption-applications/{id}/approve, /reject"

  - priority: 7b
    category: business_compliance
    check: "Adopter home-visit must be PASSED and not EXPIRED before approval"
    error_id: ERR_HOME_VISIT_REQUIRED
    http_status: 409
    applies_to: "POST /adoption-applications/{id}/approve"

  - priority: 7c
    category: business_compliance
    check: "Vaccination compliance satisfied for species-specific required vaccines; expired == strictly <= now"
    error_id: ERR_VACCINATION_NON_COMPLIANT
    http_status: 409
    applies_to: "approve, finalize, create-boarding-reservation, check-in"

  - priority: 8a
    category: business_constraint
    check: "Animal available and not already reserved by another APPROVED/FINALIZED application"
    error_id: "ERR_ANIMAL_UNAVAILABLE / ERR_ANIMAL_ALREADY_RESERVED"
    http_status: 409
    applies_to: "POST /adoption-applications, POST .../approve"

  - priority: 8b
    category: business_constraint
    check: "Boarding animal must belong to the target shelter and not currently ADOPTED/RETIRED"
    error_id: ERR_ANIMAL_NOT_BOARDABLE
    http_status: 409
    applies_to: "POST /shelters/{sid}/boarding-reservations"

  - priority: 8c
    category: business_constraint
    check: "Adopter not disqualified"
    error_id: ERR_ADOPTER_DISQUALIFIED
    http_status: 409
    applies_to: "POST /adoption-applications, begin-review, approve"

  - priority: 9
    category: business_capacity
    check: "Shelter has available boarding slots at time of reservation"
    error_id: ERR_SHELTER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /shelters/{sid}/boarding-reservations"

  - priority: 10
    category: business_fiscal
    check: "FeeSettlement amount equals authoritative quote (pinned_fee for adoption, quoted_total for boarding reservations; final_total after check-out)"
    error_id: ERR_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /fee-settlements/{id}/capture"

  - priority: 11
    category: business_fiscal
    check: "No duplicate COMPLETED settlement per (subject_type, subject_id)"
    error_id: ERR_DUPLICATE_SETTLEMENT
    http_status: 409
    applies_to: "POST /fee-settlements/{id}/capture"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 50, min: 1, max: 200, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (26 endpoints)
# =============================================================================
endpoints:
  # --- Shelter ---
  - method: POST
    path: "/shelters"
    description: "Create a shelter"
    roles: [ShelterAdmin]
    code: 201
    input: [name, boarding_capacity, adoption_fee_base, boarding_rate_per_night]
    output: Shelter
    side_effects: ["status=OPEN, reserved_slots=0"]

  - method: GET
    path: "/shelters"
    description: "List shelters"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Shelter[]"
    side_effects: []

  - method: GET
    path: "/shelters/{sid}"
    description: "Get shelter"
    roles: [Any]
    code: 200
    input: []
    output: Shelter
    side_effects: []

  # --- Animal ---
  - method: POST
    path: "/shelters/{sid}/animals"
    description: "Create animal record"
    roles: [ShelterAdmin]
    code: 201
    input: [name, species, age_months, "temperament_tags?", "adoption_fee_override?", "special_care_level?"]
    output: Animal
    side_effects: ["status=AVAILABLE, intake_date=now"]

  - method: GET
    path: "/shelters/{sid}/animals"
    description: "List animals"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "species?"]
    output: "Animal[]"
    side_effects: []

  - method: GET
    path: "/shelters/{sid}/animals/{aid}"
    description: "Get animal"
    roles: [Any]
    code: 200
    input: []
    output: Animal
    side_effects: []

  - method: PATCH
    path: "/shelters/{sid}/animals/{aid}"
    description: "Update animal fields (requires version header)"
    roles: [ShelterAdmin]
    code: 200
    input: ["name?", "temperament_tags?", "adoption_fee_override?", "special_care_level?", "version"]
    output: Animal
    side_effects: ["version incremented"]

  # --- Vaccinations ---
  - method: POST
    path: "/shelters/{sid}/animals/{aid}/vaccinations"
    description: "Record a vaccination (append-only)"
    roles: [ShelterAdmin, Veterinarian]
    code: 201
    input: [vaccine_type, administered_date, expires_date, lot_number]
    output: VaccinationRecord
    side_effects: ["Updates derived compliance; may clear prior VACCINE_EXPIRED incidents (no deletion)"]

  - method: GET
    path: "/shelters/{sid}/animals/{aid}/vaccinations"
    description: "List vaccinations for animal"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "vaccine_type?"]
    output: "VaccinationRecord[]"
    side_effects: []

  - method: GET
    path: "/shelters/{sid}/animals/{aid}/compliance"
    description: "Get vaccination compliance summary"
    roles: [Any]
    code: 200
    input: []
    output: "{status: COMPLIANT|NON_COMPLIANT, missing: [...], expired: [...]}"
    side_effects: []

  # --- Adopter ---
  - method: POST
    path: "/adopters"
    description: "Register adopter"
    roles: [Adopter, ShelterAdmin]
    code: 201
    input: [full_name, household_size, has_yard]
    output: Adopter
    side_effects: ["home_visit_status=PENDING, disqualified=false"]

  - method: GET
    path: "/adopters/{id}"
    description: "Get adopter"
    roles: [Adopter, AdoptionReviewer, AdoptionApprover, ShelterAdmin]
    code: 200
    input: []
    output: Adopter
    side_effects: []

  # --- Home Visit ---
  - method: POST
    path: "/adopters/{id}/home-visits"
    description: "Schedule a home visit"
    roles: [AdoptionReviewer]
    code: 201
    input: [scheduled_for, inspector_id]
    output: HomeVisit
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/adopters/{id}/home-visits"
    description: "List home visits for adopter"
    roles: [AdoptionReviewer, AdoptionApprover, Adopter]
    code: 200
    input: ["limit?", "offset?"]
    output: "HomeVisit[]"
    side_effects: []

  - method: POST
    path: "/adopters/{id}/home-visits/{hvId}/submit"
    description: "Submit home visit assessment (auto-resolves PASSED/FAILED)"
    roles: [HomeVisitInspector]
    code: 200
    input: [safety_score, "yard_verified?"]
    output: HomeVisit
    side_effects: ["status→SUBMITTED then auto PASSED/FAILED; adopter.home_visit_status updated"]

  - method: POST
    path: "/adopters/{id}/home-visits/{hvId}/cancel"
    description: "Cancel scheduled home visit"
    roles: [Adopter, HomeVisitInspector]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["status=CANCELLED"]

  # --- Adoption Application ---
  - method: POST
    path: "/adoption-applications"
    description: "Submit adoption application"
    roles: [Adopter]
    code: 201
    input: [adopter_id, animal_id, "review_notes?"]
    output: AdoptionApplication
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/adoption-applications"
    description: "List applications (filterable)"
    roles: [AdoptionReviewer, AdoptionApprover, ShelterAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "adopter_id?", "animal_id?"]
    output: "AdoptionApplication[]"
    side_effects: []

  - method: GET
    path: "/adoption-applications/{id}"
    description: "Get application"
    roles: [AdoptionReviewer, AdoptionApprover, Adopter, ShelterAdmin]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: []

  - method: POST
    path: "/adoption-applications/{id}/begin-review"
    description: "Move application to UNDER_REVIEW"
    roles: [AdoptionReviewer]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["reviewer_user_id recorded for segregation-of-duties check"]

  - method: POST
    path: "/adoption-applications/{id}/request-home-visit"
    description: "Advance to HOME_VISIT_REQUIRED"
    roles: [AdoptionReviewer]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status → HOME_VISIT_REQUIRED"]

  - method: POST
    path: "/adoption-applications/{id}/approve"
    description: "Approve application (pins version, vaccine snapshot, fee; cascades reject to siblings)"
    roles: [AdoptionApprover]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects:
      - "status → APPROVED"
      - "Animal → HELD"
      - "Sibling applications for same animal → REJECTED (ERR_ANIMAL_ALREADY_RESERVED)"
      - "pinned_animal_version, pinned_vaccination_snapshot, pinned_fee set"

  - method: POST
    path: "/adoption-applications/{id}/reject"
    description: "Reject application"
    roles: [AdoptionApprover]
    code: 200
    input: ["review_notes?"]
    output: AdoptionApplication
    side_effects: ["status → REJECTED; release Animal hold if applicable"]

  - method: POST
    path: "/adoption-applications/{id}/finalize"
    description: "Finalize adoption after settlement"
    roles: [AdoptionApprover]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects:
      - "Animal.status → ADOPTED"
      - "Any RESERVED BoardingReservation for this animal → CANCELLED"
      - "Revalidate pinned_animal_version and vaccination compliance"

  - method: POST
    path: "/adoption-applications/{id}/withdraw"
    description: "Applicant withdraws application"
    roles: [Adopter]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status → WITHDRAWN; release Animal hold if applicable; fail pending settlements"]

  # --- Boarding ---
  - method: POST
    path: "/shelters/{sid}/boarding-reservations"
    description: "Reserve boarding for an animal"
    roles: [BoardingCoordinator, Adopter]
    code: 201
    input: [animal_id, owner_id, check_in_date, check_out_date]
    output: BoardingReservation
    side_effects:
      - "Validate capacity, vaccination, animal boardable"
      - "status=RESERVED; shelter.reserved_slots += 1"
      - "quoted_total computed with peak surcharge snapshot"

  - method: GET
    path: "/shelters/{sid}/boarding-reservations"
    description: "List reservations"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "animal_id?"]
    output: "BoardingReservation[]"
    side_effects: []

  - method: POST
    path: "/shelters/{sid}/boarding-reservations/{rid}/check-in"
    description: "Check in animal for boarding"
    roles: [BoardingCoordinator]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status=ACTIVE; re-validate vaccination compliance"]

  - method: POST
    path: "/shelters/{sid}/boarding-reservations/{rid}/check-out"
    description: "Check out animal; recompute final_total"
    roles: [BoardingCoordinator]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status=COMPLETED; final_total computed; reserved_slots -= 1"]

  - method: POST
    path: "/shelters/{sid}/boarding-reservations/{rid}/settle"
    description: "Mark reservation SETTLED after fee captured"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status=SETTLED"]

  - method: POST
    path: "/shelters/{sid}/boarding-reservations/{rid}/cancel"
    description: "Cancel reservation"
    roles: [BoardingCoordinator, Adopter]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status=CANCELLED; release slot; fail pending settlement"]

  # --- Fee Settlement ---
  - method: POST
    path: "/fee-settlements"
    description: "Create a PENDING settlement for an adoption or boarding subject"
    roles: [FinanceOfficer, Adopter]
    code: 201
    input: [subject_type, subject_id, amount, method]
    output: FeeSettlement
    side_effects: ["status=PENDING; amount validated later at capture"]

  - method: POST
    path: "/fee-settlements/{id}/capture"
    description: "Capture payment"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FeeSettlement
    side_effects: ["status=COMPLETED; settled_at=now; enforces amount match and duplicate check"]

  - method: POST
    path: "/fee-settlements/{id}/refund"
    description: "Refund a completed settlement"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FeeSettlement
    side_effects: ["status=REFUNDED; if subject was APPROVED adoption, reject it"]

  - method: GET
    path: "/fee-settlements/{id}"
    description: "Get settlement"
    roles: [FinanceOfficer, Adopter]
    code: 200
    input: []
    output: FeeSettlement
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (22 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing or invalid X-User-ID / X-User-Role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload / missing required field / bad enum" }
  - { id: ERR_INVALID_SCORE, http: 400, condition: "safety_score out of [0..100]" }
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "Stale OCC version on PATCH" }
  - { id: ERR_SHELTER_NOT_FOUND, http: 404, condition: "Shelter id does not exist" }
  - { id: ERR_ANIMAL_NOT_FOUND, http: 404, condition: "Animal id does not exist" }
  - { id: ERR_ADOPTER_NOT_FOUND, http: 404, condition: "Adopter id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Adoption application id does not exist" }
  - { id: ERR_HOME_VISIT_NOT_FOUND, http: 404, condition: "Home visit id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Boarding reservation id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "FeeSettlement id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in valid state for operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver user equals reviewer user on same application" }
  - { id: ERR_HOME_VISIT_REQUIRED, http: 409, condition: "Adopter lacks a PASSED unexpired home visit at approval" }
  - { id: ERR_HOME_VISIT_FAILED, http: 409, condition: "Cascade reject when associated home visit FAILED" }
  - { id: ERR_VACCINATION_NON_COMPLIANT, http: 409, condition: "Animal missing required vaccines or latest vaccine expired (expires_date <= now)" }
  - { id: ERR_ADOPTER_DISQUALIFIED, http: 409, condition: "Adopter flagged disqualified" }
  - { id: ERR_ANIMAL_UNAVAILABLE, http: 409, condition: "Animal not in AVAILABLE/HELD-for-me state" }
  - { id: ERR_ANIMAL_ALREADY_RESERVED, http: 409, condition: "Another APPROVED or FINALIZED application exists for the animal" }
  - { id: ERR_ANIMAL_NOT_BOARDABLE, http: 409, condition: "Animal status is ADOPTED or RETIRED; cannot board" }
  - { id: ERR_SHELTER_AT_CAPACITY, http: 409, condition: "No available boarding slots for the shelter" }
  - { id: ERR_TOO_EARLY_FOR_CHECKIN, http: 409, condition: "Attempt to check in before EARLY_CHECKIN_GRACE_HOURS window" }
  - { id: ERR_AMOUNT_MISMATCH, http: 409, condition: "Settlement amount does not match authoritative quote" }
  - { id: ERR_DUPLICATE_SETTLEMENT, http: 409, condition: "Another COMPLETED settlement already exists for (subject_type, subject_id)" }
  - { id: ERR_FEE_NOT_SETTLED, http: 409, condition: "finalize/settle called before settlement COMPLETED" }
  - { id: ERR_FEE_REFUNDED, http: 409, condition: "Adoption rejected because its fee was refunded" }
  - { id: ERR_STALE_PINNED_REFERENCE, http: 409, condition: "Animal.version changed after APPROVE; finalize must re-validate" }
  - { id: ERR_ANIMAL_ADOPTED, http: 409, condition: "Boarding action blocked because animal has been ADOPTED" }

# =============================================================================
# Table 7: RBAC Role Permission Matrix (approval chain)
# =============================================================================
roles:
  - name: ShelterAdmin
    description: "Manages shelters and animal intake/records"
    exclusive_operations:
      - "POST /shelters"
      - "POST /shelters/{sid}/animals"
      - "PATCH /shelters/{sid}/animals/{aid}"
    shared_operations:
      - "POST /shelters/{sid}/animals/{aid}/vaccinations (with Veterinarian)"
      - "POST /adopters (with Adopter)"

  - name: Veterinarian
    description: "Records vaccinations"
    exclusive_operations: []
    shared_operations:
      - "POST /shelters/{sid}/animals/{aid}/vaccinations (with ShelterAdmin)"

  - name: AdoptionReviewer
    description: "First-level application reviewer; schedules home visits"
    exclusive_operations:
      - "POST /adoption-applications/{id}/begin-review"
      - "POST /adoption-applications/{id}/request-home-visit"
      - "POST /adopters/{id}/home-visits"
    shared_operations: []

  - name: AdoptionApprover
    description: "Final approver; may NOT also have acted as reviewer on same application (segregation of duties)"
    exclusive_operations:
      - "POST /adoption-applications/{id}/approve"
      - "POST /adoption-applications/{id}/reject"
      - "POST /adoption-applications/{id}/finalize"
    shared_operations: []

  - name: HomeVisitInspector
    description: "Conducts and submits home visit assessments"
    exclusive_operations:
      - "POST /adopters/{id}/home-visits/{hvId}/submit"
    shared_operations:
      - "POST /adopters/{id}/home-visits/{hvId}/cancel (with Adopter)"

  - name: BoardingCoordinator
    description: "Manages boarding reservations, check-in, check-out"
    exclusive_operations:
      - "POST /shelters/{sid}/boarding-reservations/{rid}/check-in"
      - "POST /shelters/{sid}/boarding-reservations/{rid}/check-out"
    shared_operations:
      - "POST /shelters/{sid}/boarding-reservations (with Adopter)"
      - "POST /shelters/{sid}/boarding-reservations/{rid}/cancel (with Adopter)"

  - name: FinanceOfficer
    description: "Captures and refunds fees; settles boarding reservations"
    exclusive_operations:
      - "POST /fee-settlements/{id}/capture"
      - "POST /fee-settlements/{id}/refund"
      - "POST /shelters/{sid}/boarding-reservations/{rid}/settle"
    shared_operations:
      - "POST /fee-settlements (with Adopter)"

  - name: Adopter
    description: "End user applying for adoption or booking boarding"
    exclusive_operations:
      - "POST /adoption-applications"
      - "POST /adoption-applications/{id}/withdraw"
    shared_operations:
      - "POST /adopters (with ShelterAdmin)"
      - "POST /shelters/{sid}/boarding-reservations (with BoardingCoordinator)"
      - "POST /shelters/{sid}/boarding-reservations/{rid}/cancel (with BoardingCoordinator)"
      - "POST /fee-settlements (with FinanceOfficer)"

  - name: Any
    description: "Read-only access for list/get endpoints"
    shared_operations:
      - "GET /shelters, /shelters/{sid}"
      - "GET /shelters/{sid}/animals(/{aid})"
      - "GET /shelters/{sid}/animals/{aid}/vaccinations"
      - "GET /shelters/{sid}/animals/{aid}/compliance"
      - "GET /shelters/{sid}/boarding-reservations"
