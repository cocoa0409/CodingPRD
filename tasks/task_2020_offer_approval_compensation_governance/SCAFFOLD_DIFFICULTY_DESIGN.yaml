        distinguishing_aspect: |
          Category pair business_constraint (p10) vs business_fiscal (p12): the
          4th round create violates BOTH the round limit and the proposed-base
          hard cap (27000000 > 26250000); ERR_NEGOTIATION_ROUND_LIMIT must win.
