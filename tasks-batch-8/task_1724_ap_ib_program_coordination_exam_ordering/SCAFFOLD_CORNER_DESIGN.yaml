  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers AND a non-existent path id fails authentication first: 401 ERR_UNAUTHENTICATED, never 404 (priority 1 beats priority 3)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Send WITHOUT X-User-Role and X-User-ID headers: HTTP 401 and error_id == ERR_UNAUTHENTICATED (auth precedes existence even though the id would 404)"

      - name: order_submit_over_budget_returns_budget_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Fiscal gate at submit: estimate 29400 against budget_cap 20000 is rejected 422 ERR_BUDGET_EXCEEDED and the order stays DRAFT."
        test_recipe:
          setup: ["Cycle OPEN with budget_cap_cents 20000; course fee 9800; three registrations; DRAFT order"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 20000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu C", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s3: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co}" }
              as: Student
              as_user_id: "${s3}"
            - call: "POST /exam-orders"
