              captures: { e_notallowed: $.data.error_id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "MOBILE_PREORDER" }
              as: StoreTerminal
              captures: { e_required: $.data.error_id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "CATERING", pickup_window_start: "2026-08-01T23:00:00Z", pickup_window_end: "2026-08-01T23:00:00Z" }
              as: StoreTerminal
              captures: { e_invalid: $.data.error_id }
            - call: "POST /orders/${cater_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
              captures: { e_cater: $.data.error_id }
            - call: "POST /orders/${cater_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1, modifiers: [{ modifier_option_id: "${prov_id}", qty: 5 }] }
              as: StoreTerminal
              captures: { e_modlimit: $.data.error_id }
            - call: "POST /orders/${cater_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
              captures: { good_line: $.data.id }
            - call: "POST /orders/${cater_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { e_min: $.data.error_id }
          assert:
            - "${e_notallowed} == ERR_PICKUP_WINDOW_NOT_ALLOWED"
            - "${e_required} == ERR_PICKUP_WINDOW_REQUIRED"
            - "${e_invalid} == ERR_PICKUP_WINDOW_INVALID"
            - "${e_cater} == ERR_ITEM_NOT_CATERING_ELIGIBLE"
            - "${e_modlimit} == ERR_MODIFIER_LIMIT_EXCEEDED"
            - "${e_min} == ERR_ORDER_MINIMUM_NOT_MET"
            - "the first five trigger calls return HTTP status 422 and the last one returns 422"
            - "OrderLine.${good_line}.line_gross_cents == 899"
            - "Order.${cater_id}.subtotal_gross_cents == 899"
            - "Order.${cater_id}.production_status == DRAFT"
            - "GET /order-lines?order_id=${cater_id} -> total_count == 1"
            - "GET /orders?store_id=${store_id} -> total_count == 1"

      - name: platform_rejections_cover_the_clock_points_and_plan_error_ids
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - validations[priority=28]
          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_PLAN_LOCKED]
          - errors[ERR_DAYPART_NOT_DUE]
          - errors[ERR_CLOCK_REGRESSION]
          - errors[ERR_POINTS_BALANCE_NEGATIVE]
        distinguishing_aspect: |
          Four platform-level guards that no other instance reaches: a LOCKED plan refuses to be superseded
          (409) rather than silently creating a second plan for the same key; a DINNER transition requested
          at 11:00:00Z is not due (409) even though DINNER is a legal enum value; the clock refuses to step
          back by one second (422); and a -50 adjustment against a zero balance is refused (422) rather than
          producing a negative points_balance.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store WAWA-0101 transitioned to LUNCH"
            - "its LUNCH plan for 2026-08-01 has been published and then LOCKED"
            - "member M-1 exists with points_balance 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /staffing-plans/${plan_id}/lock"
              payload: {}
              as: StoreManager
              captures: { locked: $.data.status }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v2: $.data.version }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-1", email: "m1@example.com" }
              as: ChainAdmin
              captures: { member_id: $.data.id, bal0: $.data.points_balance }
          trigger:
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 500, mto_share_bp: 6000, expected_store_version: "${st_v2}" }
              as: StoreManager
              captures: { e_locked: $.data.error_id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "DINNER" }
              as: StoreManager
              captures: { e_notdue: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:59:59Z" }
              as: ChainAdmin
              captures: { e_clock: $.data.error_id }
            - call: "POST /loyalty-accounts/${member_id}/points-adjustments"
              payload: { delta_points: -50, reason: "MANUAL_CORRECTION" }
              as: ChainAdmin
              captures: { e_points: $.data.error_id }
          assert:
            - "${locked} == LOCKED"
            - "${bal0} == 0"
            - "${e_locked} == ERR_PLAN_LOCKED"
            - "${e_notdue} == ERR_DAYPART_NOT_DUE"
            - "${e_clock} == ERR_CLOCK_REGRESSION"
            - "${e_points} == ERR_POINTS_BALANCE_NEGATIVE"
            - "StaffingPlan.${plan_id}.status == LOCKED"
            - "Store.${store_id}.current_daypart == LUNCH"
            - "LoyaltyAccount.${member_id}.points_balance == 0"
            - "LoyaltyAccount.${member_id}.lifetime_points_earned == 0"
            - "GET /stores/${store_id}/staffing-plans?service_date=2026-08-01 -> total_count == 1"
            - "GET /_clock reads 2026-08-01T11:00:00Z after the rejected regression"

      - name: corrective_action_rejections_cover_the_unit_error_ids
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_UNIT_NOT_IMPAIRED]
          - errors[ERR_ACTION_ALREADY_VERIFIED]
          - state_machines.CorrectiveAction.OPEN_to_VERIFIED
        distinguishing_aspect: |
          The verify endpoint has two different 409s and they must not be swapped: with an OPEN action on an
          OPERATIONAL unit the answer is ERR_UNIT_NOT_IMPAIRED, and once the same action has been VERIFIED
          the answer becomes ERR_ACTION_ALREADY_VERIFIED even though the unit is OPERATIONAL again by then -
          so the action's own state must be checked before the unit's.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 banded 135..185 F, OPERATIONAL"
            - "associate assoc-1 logged an in-range 160 F reading and lead-1 opened a corrective action on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 160 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_ok: $.data.id }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "${log_ok}", action_taken: "PREVENTIVE_GASKET_CHECK" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-2"
              captures: { e_notimpaired: $.data.error_id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_bad: $.data.id }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-2"
              captures: { ca_status: $.data.status }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-2"
              captures: { e_already: $.data.error_id }
          assert:
            - "first trigger HTTP status == 409"
            - "${e_notimpaired} == ERR_UNIT_NOT_IMPAIRED"
            - "third trigger HTTP status == 200"
            - "${ca_status} == VERIFIED"
            - "fourth trigger HTTP status == 409"
            - "${e_already} == ERR_ACTION_ALREADY_VERIFIED"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "GET /corrective-actions?status=VERIFIED -> total_count == 1"
            - "GET /corrective-actions?status=OPEN -> total_count == 0"

      - name: slot_conflict_and_holding_safety_error_ids_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNIT_SLOT_CONFLICT]
          - errors[ERR_HOLDING_UNIT_NOT_OPERATIONAL]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / batch_plan_into_impaired_unit_reports_safety_error_before_slot_conflict"
          rationale: "Both ids are triggered from the same request there, first the safety id and then the conflict id after the unit is cleared."

      - name: order_not_draft_and_window_elapsed_error_ids_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ORDER_NOT_DRAFT]
          - errors[ERR_PICKUP_WINDOW_ELAPSED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / place_on_already_placed_order_with_elapsed_window_yields_order_not_draft"
          rationale: "That instance triggers ERR_ORDER_NOT_DRAFT with both rules violated and then ERR_PICKUP_WINDOW_ELAPSED on its own."

      - name: pickup_window_full_error_id_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PICKUP_WINDOW_FULL]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / half_open_pickup_capacity_counts_concurrent_windows_not_exclusive_slots"
          rationale: "The capacity breach that raises this id is the trigger of that instance."

      - name: order_not_authorized_and_plan_not_published_error_ids_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ORDER_NOT_AUTHORIZED]
          - errors[ERR_DAYPART_PLAN_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ticket_start_is_gated_on_the_owning_orders_settlement_axis"
          rationale: "ERR_ORDER_NOT_AUTHORIZED is triggered there and ERR_DAYPART_PLAN_NOT_PUBLISHED in the sibling instance placement_is_gated_on_the_staffing_plans_publication_state."

  # =========================================================================
  # Section 7 - RBAC (claim types: role_permitted, role_denied,
  # segregation_of_duties from the role_model row). role_model is
  # segregation_of_duties over seven roles, five of which are peer operational
  # roles at one site; identity is opaque for six roles and
  # entity_backed:LoyaltyAccount for Customer.
  # =========================================================================
  - section: rbac
    instances:
      - name: kitchen_associate_cannot_publish_a_staffing_plan
        claim_type: role_denied
        grounds:
          - roles.StoreManager.exclusive_operations
          - roles.KitchenAssociate
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Labor planning is StoreManager-exclusive, and the three plan endpoints must all reject a
          KitchenAssociate even though that role is one of the busiest writers in the API. A permissive
          implementation that only guards the plan CREATE would let an associate publish or lock the plan
          another role drafted, which is exactly the control this role split exists for. The same instance
          then proves the StoreManager path succeeds, so the 403s are not a blanket denial.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 in its initial BREAKFAST daypart"
            - "no staffing plan exists yet for 2026-08-01 BREAKFAST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: KitchenAssociate
              captures: { e_create: $.data.error_id }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id, plan_status: $.data.status }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: KitchenAssociate
              captures: { e_publish: $.data.error_id }
            - call: "POST /staffing-plans/${plan_id}/lock"
              payload: {}
              as: ShiftLead
              captures: { e_lock: $.data.error_id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
              captures: { published: $.data.status }
          assert:
            - "${e_create} == ERR_ROLE_NOT_PERMITTED"
            - "${e_publish} == ERR_ROLE_NOT_PERMITTED"
            - "${e_lock} == ERR_ROLE_NOT_PERMITTED"
            - "all three denials return HTTP status 403"
            - "${plan_status} == DRAFT"
            - "${published} == PUBLISHED"
            - "StaffingPlan.${plan_id}.status == PUBLISHED"
            - "StaffingPlan.${plan_id}.version == 2"
            - "GET /stores/${store_id}/staffing-plans?service_date=2026-08-01 -> total_count == 1"

      - name: same_associate_cannot_verify_their_own_temperature_log
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=8]
          - state_machines.CorrectiveAction.OPEN_to_VERIFIED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The gate is on X-User-ID, not on X-User-Role: lead-1 holds a role that is allowed to verify, and
          the action's own state and the unit's IMPAIRED posture both permit it, yet because lead-1 is the
          user recorded in TemperatureLog.logged_by_user_id the request is refused. A second lead with the
          identical role succeeds on the identical action, which isolates identity as the only differing
          input. Note the identity checked is the LOG's actor, not the corrective action's creator.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 banded 135..185 F"
            - "lead-1 (ShiftLead) probes the case at 120 F, which impairs the unit"
            - "lead-1 opens a corrective action on that reading"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { log_id: $.data.id, logger: $.data.logged_by_user_id }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "${log_id}", action_taken: "RESEATED_THE_CASE_DOOR_AND_REPROBED" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-2"
              captures: { ca_status: $.data.status, verifier: $.data.verified_by_user_id }
          assert:
            - "${logger} == lead-1"
            - "first trigger HTTP status == 403"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "second trigger HTTP status == 200"
            - "${ca_status} == VERIFIED"
            - "${verifier} == lead-2"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "CorrectiveAction.${ca_id}.verified_at == 2026-08-01T06:00:00Z"

      - name: only_food_safety_lead_can_clear_a_locked_out_unit
        claim_type: role_denied
        grounds:
          - roles.FoodSafetyLead.exclusive_operations
          - validations[priority=9]
          - state_machines.HoldingUnit.LOCKED_OUT_to_OPERATIONAL
          - errors[ERR_LOCKOUT_REQUIRES_SAFETY_LEAD]
        distinguishing_aspect: |
          FoodSafetyLead's only exclusive operation is conditional on the unit's posture, so the same
          endpoint and the same role pair behave differently before and after the second out-of-range
          reading: a ShiftLead may clear an IMPAIRED unit but not a LOCKED_OUT one. The denial is 403
          ERR_LOCKOUT_REQUIRES_SAFETY_LEAD rather than ERR_ROLE_NOT_PERMITTED, because ShiftLead IS in the
          endpoint's roles list - a role-list-only implementation would let the lockout be cleared.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 banded 135..185 F"
            - "assoc-1 probes 120 F (unit -> IMPAIRED) and then 118 F (unit -> LOCKED_OUT, strike count 2)"
            - "lead-1 opens a corrective action on the second reading"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_1: $.data.id }
            - call: "GET /holding-units/${unit_id}"
              payload: {}
              as: FoodSafetyLead
              captures: { s_after_1: $.data.status }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 118 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_2: $.data.id }
            - call: "GET /holding-units/${unit_id}"
              payload: {}
              as: FoodSafetyLead
              captures: { s_after_2: $.data.status, strikes: $.data.consecutive_out_of_range_count }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "${log_2}", action_taken: "CALLED_REFRIGERATION_VENDOR_AND_MOVED_PRODUCT" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { e_lockout: $.data.error_id }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: FoodSafetyLead
              as_user_id: "fsl-1"
              captures: { ca_status: $.data.status, verifier: $.data.verified_by_user_id }
          assert:
            - "${s_after_1} == IMPAIRED"
            - "${s_after_2} == LOCKED_OUT"
            - "${strikes} == 2"
            - "first trigger HTTP status == 403"
            - "${e_lockout} == ERR_LOCKOUT_REQUIRES_SAFETY_LEAD"
            - "${e_lockout} != ERR_ROLE_NOT_PERMITTED"
            - "second trigger HTTP status == 200"
            - "${ca_status} == VERIFIED"
            - "${verifier} == fsl-1"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "GET /stores/${store_id}/readiness -> units_locked_out_count == 0"

      - name: same_user_cannot_reopen_the_ticket_they_completed
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=8]
          - state_machines.KitchenTicket.DONE_to_IN_PROGRESS
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The second segregation site keys off a different field - KitchenTicket.completed_by_user_id - and
          the interesting wrinkle is that one human can legitimately hold two role headers: user u-7 closes
          the ticket while wearing KitchenAssociate, then comes back as ShiftLead and is still refused,
          because the check compares identities and not roles. Only two of the order's three tickets are
          worked so the order sits at IN_PRODUCTION and the rework gate itself is satisfied, isolating
          identity as the sole cause of the 403.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store WAWA-0101 in LUNCH with a PUBLISHED LUNCH plan"
            - "hoagie 899c SANDWICH prep 180s and coffee 249c BEVERAGE prep 45s"
            - "order Z is an anonymous TOUCHSCREEN order with one hoagie line and one coffee line, PLACED and AUTHORIZED"
            - "user u-7 starts and completes the SANDWICH ticket as KitchenAssociate; the BEVERAGE ticket is left QUEUED so the order stays IN_PRODUCTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
