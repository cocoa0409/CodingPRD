          - entities.EditorialPanelMeeting.fields.weighted_yes
        distinguishing_aspect: |
          A numeric threshold crossing measured in tenths of a percent on the
          vote metrics: the citation-mode tally that resolves to exactly 66.6667
          percent truncates to 66.666 and is rejected, while a 67.0000 percent
          tally on the same metric clears the 66.667 floor and is approved.
