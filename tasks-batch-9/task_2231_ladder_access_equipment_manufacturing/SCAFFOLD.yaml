      - "recomputes lot.joint_sample_count, lot.joint_fail_count and lot.conformance_index"
    errors: [ERR_PRODUCTION_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_LOT_STATE_INVALID, ERR_DUPLICATE_KEY]

  - method: GET
