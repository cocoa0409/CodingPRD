    roles: [DealerPrincipal]
    code: 201
    input: [floor_plan_loan_id, principal_cents, "reason?", expected_floor_plan_loan_version]
    output: Curtailment
    side_effects:
      - "FloorPlanLoan.principal_outstanding_cents reduced; cumulative_curtailment_cents increased"
      - "increments FloorPlanLoan.version by 1"
      - "If reason SCHEDULED and loan CURTAILMENT_DUE: loan -> OPEN"
      - "If reason SALE_PAYOFF and principal == principal_outstanding: loan -> PAID_OFF"

  - method: GET
    path: "/curtailments"
    description: "List curtailments (filterable by floor_plan_loan_id)"
    roles: [DealerPrincipal, FinanceManager]
