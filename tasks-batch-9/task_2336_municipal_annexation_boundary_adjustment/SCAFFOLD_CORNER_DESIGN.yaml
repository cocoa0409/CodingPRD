            - "${r3_e_withdraw} == ERR_OWNER_SCOPE_VIOLATION with status 403"
            - "ParcelOwnerConsent.${cons_r3}.consent_status == SIGNED"
            - "Petition.${pet_r3}.qualified_signature_assessed_value_cents == 50000000"
            - "GET /parcel-owner-consents?petition_id=${pet_r3} returns total_count == 1"

      - name: the_operator_who_finalized_the_fiscal_analysis_cannot_decide_as_the_commission
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=5]
          - roles[FiscalAnalyst]
          - roles[BoundaryCommissioner]
        distinguishing_aspect: |
          The one truly identity-sensitive rule in the scaffold: operator dual-01 holds both the
          FiscalAnalyst and BoundaryCommissioner roles, so both role checks pass, yet the
          commission decision is refused because the case's fiscal_finalized_by_user_id is dual-01.
