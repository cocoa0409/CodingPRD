          event_date + 31 days is inside and one millisecond past midnight of
          day 32 is outside. The instance probes 2027-03-08T00:00:00Z (admitted)
          and 2027-03-09T00:00:00Z (refused) for the same event_date 2027-02-05,
          which distinguishes the closed upper bound from a half-open one.
