            - "CapitalNeedItem.${gen1_first_item}.status == SUPERSEDED and CapitalNeedItem.${gen1_first_item}.allocated_reserve_cents == 0"
            - "the ACTIVE CapitalNeedItem for defect_definition_id ${dd_door} has recurrence_count == 2, priority_score == 32.00, allocation_rank == 1 and allocated_reserve_cents == 400000"
            - "the ACTIVE CapitalNeedItem for defect_definition_id ${dd_window} has recurrence_count == 2, priority_score == 32.00, allocation_rank == 2 and allocated_reserve_cents == 400000"
            - "the ACTIVE CapitalNeedItem for defect_definition_id ${dd_floor} has recurrence_count == 2, priority_score == 16.00, allocation_rank == 3 and allocated_reserve_cents == 200000"
            - "the three ACTIVE allocated_reserve_cents values sum to exactly 1000000"
            - "Property.${prop_id}.allocated_reserve_total_cents == 1000000"
            - "Property.${prop_id}.capital_reserve_cents == 1000000"

      - name: voiding_an_unverified_work_order_compensates_the_sweep_closure_gate
        grounds:
          - calculations.sweep_closure_verified_rate
          - state_machines.WorkOrder.repair_status_to_VOID
          - state_machines.SelfAssessmentSweep.IN_PROGRESS_to_CLOSED
          - validations[priority=68]
          - errors[ERR_SWEEP_CLOSURE_RATE_TOO_LOW]
          - entities.SelfAssessmentSweep.fields.generated_work_order_count
        distinguishing_aspect: |
          Voiding a work order is a compensating action: it removes the row from the closure-rate
          DENOMINATOR only, lifting closure_verified_rate from 50.00 to 100.00 and unblocking the
          sweep closure that was rejected seconds earlier - while generated_work_order_count, which
          counts VOID rows too, must stay at 2. An implementation that also drops the voided row
          from generated_work_order_count, or that keeps it in the rate denominator, fails one half
          of the pair. The void additionally compensates the orphaned Deficiency down to
          points_deducted 0.00, so the property's open_severe_count returns to 0.
        test_recipe:
          setup:
            - "ADOPTED standard with LT_GAS and SEV_WINDOW; Property Cedar Walk with unit 101."
            - "An IN_PROGRESS ALL_AREAS sweep records two SEV_WINDOW findings, creating work orders W1 and W2 and deficiencies D1 and D2."
            - "W1 is completed by tech-1 and verified PASSED by qa-1, so D1 reaches VERIFIED and closure_verified_rate is 50.00 with W2 still UNVERIFIED."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo1_id: $.data.id, d1_id: $.data.deficiency_id }
            - call: "GET /self-assessment-sweeps/${sw_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v2: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v2}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:30:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo2_id: $.data.id, d2_id: $.data.deficiency_id }
            - call: "POST /work-orders/${wo1_id}/complete"
              payload: { completed_at: "2026-08-04T09:00:00.000Z", resolution_note: "Sash replaced and tested" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /work-orders/${wo1_id}/verify-closure"
              payload: { verification_result: "PASSED", verified_at: "2026-08-05T09:00:00.000Z" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - call: "GET /self-assessment-sweeps/${sw_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { rate_before_void: $.data.closure_verified_rate, generated_before_void: $.data.generated_work_order_count }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/close"
              payload: { closed_at: "2026-08-06T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /work-orders/${wo2_id}/void"
              payload: { void_reason: "Duplicate of the first finding; raised in error" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /self-assessment-sweeps/${sw_id}/close"
              payload: { closed_at: "2026-08-06T10:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "${rate_before_void} == 50.00 and ${generated_before_void} == 2"
            - "the first trigger call returns HTTP 409 with error_id ERR_SWEEP_CLOSURE_RATE_TOO_LOW"
            - "the second trigger call succeeds and WorkOrder.${wo2_id}.repair_status == VOID"
            - "the third trigger call succeeds with HTTP 200"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 100.00"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 2"
            - "SelfAssessmentSweep.${sw_id}.void_work_order_count == 1"
            - "SelfAssessmentSweep.${sw_id}.verified_work_order_count == 1"
            - "SelfAssessmentSweep.${sw_id}.open_work_order_count == 0"
            - "SelfAssessmentSweep.${sw_id}.status == CLOSED and closed_at == 2026-08-06T10:00:00.000Z"
            - "Property.${prop_id}.last_sweep_closed_at == 2026-08-06T10:00:00.000Z"
            - "Deficiency.${d2_id}.status == VOIDED and Deficiency.${d2_id}.points_deducted == 0.00"
            - "Deficiency.${d1_id}.status == VERIFIED and Deficiency.${d1_id}.points_deducted == 16.00"
            - "Property.${prop_id}.open_severe_count == 0"

      - name: failed_verification_restores_the_life_threatening_counters_without_drift
        grounds:
          - state_machines.Deficiency.OPEN_to_CORRECTED
          - state_machines.Deficiency.CORRECTED_to_OPEN
          - calculations.property_readiness_posture
          - entities.Property.fields.open_life_threatening_count
          - entities.Deficiency.fields.correction_due_at
        distinguishing_aspect: |
          The OPEN -> CORRECTED -> OPEN cycle must undo EXACTLY what it did: corrected_at goes back
          to null, open_life_threatening_count returns to 1 and readiness_posture returns to
          RESTRICTED, while the two things a failed verification must never touch - points_deducted
          (36.00, including the occupancy multiplier) and correction_due_at (never extended by a
          failed verification) - stay put. Implementations that recompute the deadline from the
          reopen instant, that decrement the counter twice, or that leave the property READY
          because "the deficiency was already corrected once" all diverge here.
        test_recipe:
          setup:
            - "ADOPTED standard with LT_GAS; Property Cedar Walk with unit 101 OCCUPIED."
            - "An IN_PROGRESS sweep records an LT_GAS finding observed 2026-08-03T09:00:00.000Z, so points_deducted is 36.00 (10.00 x 3.0 x 1.0 x 1.2) and correction_due_at is 2026-08-04T09:00:00.000Z; the property is RESTRICTED with open_life_threatening_count 1."
            - "The owner records a direct correction at 2026-08-03T12:00:00.000Z, inside the 24-hour window, so the deficiency is CORRECTED, the counter is 0 and the posture is READY."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, def_id: $.data.deficiency_id }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { posture_open: $.data.readiness_posture, lt_open: $.data.open_life_threatening_count }
            - call: "POST /deficiencies/${def_id}/correction"
              payload: { corrected_at: "2026-08-03T12:00:00.000Z", note: "Union replaced, leak test passed" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { posture_corrected: $.data.readiness_posture, lt_corrected: $.data.open_life_threatening_count, pv_corrected: $.data.version }
          trigger:
            - call: "POST /deficiencies/${def_id}/verification"
              payload: { verification_result: "FAILED", verified_at: "2026-08-03T15:00:00.000Z", note: "Fitting still weeping under pressure" }
              as: HousingAgencyInspector
          assert:
            - "${posture_open} == RESTRICTED and ${lt_open} == 1"
            - "${posture_corrected} == READY and ${lt_corrected} == 0"
            - "the trigger succeeds with HTTP 200"
            - "Deficiency.${def_id}.status == OPEN"
            - "Deficiency.${def_id}.corrected_at is null"
            - "Deficiency.${def_id}.correction_due_at == 2026-08-04T09:00:00.000Z"
            - "Deficiency.${def_id}.points_deducted == 36.00"
            - "Property.${prop_id}.open_life_threatening_count == 1"
            - "Property.${prop_id}.overdue_life_threatening_count == 0"
            - "Property.${prop_id}.open_severe_count == 0"
            - "Property.${prop_id}.readiness_posture == RESTRICTED"
            - "Property.${prop_id}.version == ${pv_corrected} + 1"
            - "WorkOrder.${wo_id}.repair_status == OPEN and WorkOrder.${wo_id}.completed_at is null"
