      - name: consumer_favor_resolution_cascade_is_covered_in_depth
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DisputeCase.MERCHANT_RESPONSE_PENDING_to_RESOLVED_CONSUMER_FAVOR
          - calculations[chargeback_allocation_waterfall]
        excluded_because:
          difficulty_instance: consumer_favor_resolution_four_hop_reserve_suspension_cascade
          rationale: "That §1.8 instance already walks the full four-hop fan-out of one CONSUMER_FAVOR resolution (dispute -> chargeback waterfall -> reserve and coverage -> merchant/enrollment suspension -> project abandonment -> loan principal), which is the deepest form this layer takes; the §1.9 rate-threshold and scheduled-action instances above exercise the same cascade from two further entry points, so a third breadth instance would add no new claim."

      - name: provisional_versus_final_settlement_variant_is_covered_in_depth
        claim_type: dual_variant_calculation
        grounds:
          - calculations[draw_settlement_economics]
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
        excluded_because:
          difficulty_instance: draw_provisional_versus_final_settlement_divergence
          rationale: "The PROVISIONAL variant (plan rate plus trade holdback, settlement speed ignored) and the FINAL variant (component-wise negotiated rate plus speed surcharge minus credit, with the reserve gap applied) are the same two-variant claim; the §1.8 instance already pins both variants of one draw against each other, so this layer needs no separate breadth row."

