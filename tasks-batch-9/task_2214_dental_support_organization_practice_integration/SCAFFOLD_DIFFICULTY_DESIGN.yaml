              as: DsoIntegrationLead
              captures: { b1_id: "$.data.id" }
            - call: "POST /dso/migration-batches/${b1_id}/schedule-cutover"
              payload: { cutover_start_at: "2026-10-01T00:00:00Z", cutover_end_at: "2026-10-02T00:00:00Z" }
