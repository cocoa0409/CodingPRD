  # ===========================================================================
  # Section 8: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_taxonomy_recode_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[taxonomy-recode-stale-complaint]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC: client reads complaint version, a triage bumps it, then a recode carrying the stale expected_complaint_version is rejected with ERR_STALE_VERSION (412); the same recode with the fresh version succeeds."
        test_recipe:
          setup: ["Complaint INTAKE at version 1; client captured version 1; triage advances it to 2"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-X1", display_name: "X1" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.X1A" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.X1B" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-X1", channel_code: "WEB", product_code: "P-X1", category_code: "C.X1A", narrative: "occ" }
              as: IntakeSpecialist
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/taxonomy_recodes"
              payload: { new_category_code: "C.X1B", expected_complaint_version: "${cv}" }
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"
            - "Complaint.${cid}.category_code == C.X1A (unchanged)"
            - "Complaint.${cid}.version == 2"

      - name: occ_remediation_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[remediation-create-stale-complaint]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on the second write endpoint: after capturing version, a start_investigation bump makes the captured version stale; the remediation create with the stale version is 412, and a retry with the re-read version succeeds."
        test_recipe:
          setup: ["Complaint TRIAGED at version 2; client captured version 2; start_investigation advances to 3"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-X2", display_name: "X2" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.X2" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-X2", channel_code: "WEB", product_code: "P-X2", category_code: "C.X2", narrative: "occ2" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${cid}"
              payload: {}
              as: CaseHandler
              captures: { cv_stale: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/remediation_decisions"
              payload: { decision_type: "CORRECTION", line_items: [], expected_complaint_version: "${cv_stale}" }
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "no RemediationDecision created for complaint ${cid}"

      - name: cascading_side_effects_resolve_decrements_open_count
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Complaint.RESPONSE_QA_to_RESOLVED
          - entities.Product.fields.open_complaint_count
        excluded_because:
          difficulty_instance: transitive_cascade / regulator_reopen_cascades_referral_to_complaint_to_product
          rationale: "The §1.8 instance asserts open_complaint_count 0 -> 1 on the reopen cascade; the forward resolve decrement is the symmetric hop covered by that same chain's setup (resolve drives it 1 -> 0)."

      - name: derived_field_reconciliation_referral_list_after_portal_intake
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.referral_auto_creation
          - entities.RegulatoryReferral.fields.response_due_at
        distinguishing_aspect: "Portal-channel intake atomically creates the referral: GET referrals shows exactly one OPEN referral with received_via_portal_at == complaint.received_at and response_due_at == received_at + 15 days."
        test_recipe:
          setup: ["Portal channel; complaint intake at default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-X4", display_name: "X4" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.X4" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-X4", channel_code: "CFPB_PORTAL", product_code: "P-X4", category_code: "C.X4", narrative: "auto referral", portal_ref: "R-X4" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /complaint-office/complaints/${cid}/referrals"
              payload: {}
              as: Auditor
          assert:
            - "exactly 1 referral exists for complaint ${cid}"
            - "referral.status == OPEN and referral.timeliness == PENDING"
            - "referral.received_via_portal_at == 2026-08-01T00:00:00Z"
            - "referral.response_due_at == 2026-08-16T00:00:00Z"
            - "referral.portal_ref == R-X4"

      - name: rate_threshold_posture_drop_when_clock_moves_past_90d
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.product_posture
          - endpoints[POST /complaint-office/_clock/set_current_utc]
        distinguishing_aspect: "The 90-day substantiated window is clock-relative: a product at substantiated_count_90d == 3 (WATCH) drops to OPEN when the clock advances 91 days past the complaints' received_at (window membership expires), without any new writes to the product."
        test_recipe:
          setup: ["Product with 3 SUBSTANTIATED complaints received 2026-08-01; clock then set to 2026-11-01T00:00:00Z (92 days later)"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-X5", display_name: "X5" }
              as: ComplaintManager
              captures: { pid: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.X5" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-X51", channel_code: "WEB", product_code: "P-X5", category_code: "C.X5", narrative: "w1" }
              as: IntakeSpecialist
              captures: { x1: $.data.id }
            - call: "POST /complaint-office/complaints/${x1}/rcas"
