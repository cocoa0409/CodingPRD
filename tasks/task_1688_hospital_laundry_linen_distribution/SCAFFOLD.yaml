# =============================================================================
# Hospital Laundry & Linen Distribution — PRD Benchmark Seed Tables
# =============================================================================

scenario: |
  Hospital Laundry & Linen Distribution (hospital linen services): par level by unit
  & exchange cart cycle, soiled collection & weight-based vendor billing, clean linen
  delivery scheduling & storage compliance, linen loss/shrinkage tracking & cost per
  adjusted patient day, isolation linen handling protocol, textile inventory rotation
  & replacement, emergency linen supply during surge, quality complaint & rewash

domain_name: hospital-linen-distribution
api_prefix: ""

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  # Weight-based provisional vendor billing vs piece-count reconciled final billing;
  # posted vs accrual cost-per-adjusted-patient-day.
  secondary_archetype: quota_allocation
  # Par levels per unit and surge-time waterfall allocation of a finite reserve pool.
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # All resources are peers under the API root; relationships are FK references
  # carried in request bodies (unit_id, stock_id, manifest_id, ...), never nested
  # in URL paths.

  state_machine_shape: cyclic
  # CartExchangeRun (COMPLETED -> DISPUTED -> RECOUNTED -> DISPUTED loop) and
  # VendorInvoice (FINALIZED -> DISPUTED -> FINALIZED loop) are cyclic; Complaint
  # branches; SoiledManifest and SurgeEvent are linear.

  relationship_patterns:
    - one_to_many      # Facility -> Unit/LinenStock/Invoice/... ; Unit -> ParLevel/CartExchangeRun
    - cross_aggregate  # Complaint -> (Unit, LinenStock, SoiledManifest); CartExchangeRun -> SoiledManifest

  role_model: segregation_of_duties
  # Invoice creator (LinenManager user A) cannot finalize the same invoice
  # (must be a different LinenManager user); weight recording (EVSOperator) is
  # organizationally separate from billing finalization (LinenManager) and vendor
  # returns (LaundryVendor). Unit-side confirmations belong to UnitClerk only.

  consistency_model: immediate
  # All cascades and derived-field recomputes are atomic within the request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs carried in bodies)
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: rate_per_lb_cents, type: integer, source: input, description: "Contracted vendor wash rate, cents per pound, applied to all categories" }
      - { name: isolation_surcharge_pct, type: number, source: input, description: "Surcharge fraction (e.g. 0.25) applied to any manifest/invoice line flagged isolation" }
      - { name: monthly_cap_cents, type: integer, source: input, required: false, default: null, description: "Optional contract cap on a single invoice's final_total_cents; null = no cap enforced" }
      - { name: surge_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | SURGE — stored field flipped only by SurgeEvent activate/close transitions" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Vendor credit balance; receives credits for verified complaints whose invoice is SETTLED or not yet FINALIZED" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Nursing unit name (e.g. '4 West', 'ICU')" }
      - { name: unit_tier, type: enum, source: input, description: "CRITICAL | STANDARD — drives surge reserve allocation order" }
      - { name: quality_flag, type: enum, source: computed, default: CLEAR, description: "CLEAR | WATCH — WATCH when count of the unit's Complaints with status in {VERIFIED, RESOLVED} created within the trailing 30 days (logical clock) is >= 3" }

  - name: LinenStock
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: sku, type: string, source: input, description: "Item code, unique per facility" }
      - { name: display_name, type: string, source: input, description: "Item name (e.g. 'Flat Sheet Twin')" }
      - { name: category, type: enum, source: input, description: "FLATWORK | TERRY | PATIENT_APPAREL | ISOLATION" }
      - { name: piece_weight_lbs, type: number, source: input, description: "Clean weight of one piece in pounds (drives weight<->piece conversions)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Replacement cost per piece, cents" }
      - { name: max_wash_cycles, type: integer, source: input, description: "Wash-life limit; cumulative-wash crossings retire pieces" }
      - { name: reorder_point_pieces, type: integer, source: input, description: "Available-pieces threshold driving posture" }
      - { name: opening_pieces, type: integer, source: input, description: "Initial clean circulation pieces (seeded at creation)" }
      - { name: opening_reserve_pieces, type: integer, source: input, description: "Initial emergency reserve pieces (seeded at creation)" }
      - { name: in_circulation, type: integer, source: computed, default: 0, description: "Clean pieces at the facility available to restock (starts at opening_pieces)" }
      - { name: in_wash, type: integer, source: computed, default: 0, description: "Pieces in the soiled->vendor pipeline" }
      - { name: reserve_pieces, type: integer, source: computed, default: 0, description: "Emergency reserve pieces (starts at opening_reserve_pieces; drawn by surge allocation)" }
      - { name: retired_pieces, type: integer, source: computed, default: 0, description: "Pieces retired (condemned on return or wash-life crossing)" }
      - { name: lost_pieces, type: integer, source: computed, default: 0, description: "Cumulative pieces lost per manifest reconciliations" }
      - { name: wash_cycles_completed, type: integer, source: computed, default: 0, description: "Cumulative piece-washes; incremented by returned piece counts" }
      - { name: posture, type: enum, source: computed, default: SUFFICIENT, description: "SUFFICIENT | LOW | CRITICAL — from in_circulation + reserve_pieces vs reorder_point_pieces (see stock_posture calc)" }
      - { name: shrinkage_status, type: enum, source: computed, default: NORMAL, description: "NORMAL | INVESTIGATION — INVESTIGATION once cumulative loss_rate_pct >= 5.00 at a manifest reconcile; sticky" }

  - name: ParLevel
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unique together with stock_id" }
      - { name: stock_id, type: string, source: input, description: "FK -> LinenStock.id; unique together with unit_id" }
      - { name: base_par_quantity, type: integer, source: input, description: "Configured par level (pieces) for this unit/item" }
      - { name: cart_cycle, type: enum, source: input, description: "DAILY | TWICE_DAILY | WEEKLY — exchange cart cadence label" }
      - { name: on_hand, type: integer, source: computed, default: 0, description: "Pieces currently at the unit (mutated by cart-run complete/recount and surge allocation)" }
      - { name: effective_par, type: integer, source: computed, description: "ceil(base_par_quantity * active surge par_multiplier) while facility surge_posture == SURGE, else base_par_quantity" }

  - name: CartExchangeRun
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: manifest_id, type: string, source: computed, default: null, description: "FK -> SoiledManifest.id; set when the run is linked into a manifest, null until then" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start (ISO 8601)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end (ISO 8601), must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | DISPUTED | RECOUNTED | RECONCILED" }
      - { name: soiled_lines, type: array, source: input, description: "On complete: [{stock_id, pieces}] soiled counts collected from the unit" }
      - { name: restock_lines, type: array, source: computed, description: "On complete: [{stock_id, pieces}] clean pieces actually delivered per restock_quantity calc" }
      - { name: shortage_flag, type: boolean, source: computed, default: false, description: "True when any restock line delivered fewer pieces than its deficit" }
      - { name: storage_attested, type: boolean, source: input, description: "Unit clean-storage compliance attestation recorded at completion" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when completed" }
      - { name: late_delivery, type: boolean, source: computed, default: false, description: "completed_at > scheduled_end (logical clock)" }

  - name: SoiledManifest
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: invoice_id, type: string, source: computed, default: null, description: "FK -> VendorInvoice.id; set when invoiced, null until then" }
      - { name: lines, type: array, source: input, description: "[{stock_id, weight_lbs, isolation_flag}] weighed soiled lines" }
      - { name: isolation_protocol_ack, type: boolean, source: input, default: false, description: "Double-bag/red-bag isolation handling acknowledgement; required true when any line.isolation_flag is true" }
      - { name: returned_lines, type: array, source: input, description: "On return: [{stock_id, pieces, condemned_pieces}] clean pieces returned per item" }
      - { name: status, type: enum, source: system, description: "DISPATCHED | RETURNED | RECONCILED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the creator (weight recorder)" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (inclusive), must be > period_start" }
      - { name: period_adjusted_patient_days, type: integer, source: input, description: "Adjusted patient days for the billing period (>= 1)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED | SETTLED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Weight-based provisional billing total (see provisional_invoice_total)" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Piece-count reconciled total before credits (null until finalize)" }
      - { name: credit_total_cents, type: integer, source: computed, default: 0, description: "Sum of credits from verified complaints routed to this invoice" }
      - { name: billed_total_cents, type: integer, source: computed, default: null, description: "final_total_cents - credit_total_cents; recomputed on every credit change" }
      - { name: cost_per_apd_cents, type: number, source: computed, default: null, description: "billed_total_cents / period_adjusted_patient_days, 2dp round_half_up; null until finalize" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the LinenManager who created the invoice (segregation-of-duties anchor)" }
      - { name: finalized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LinenManager who last finalized" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; must equal the UnitClerk's X-User-ID" }
      - { name: manifest_id, type: string, source: input, description: "FK -> SoiledManifest.id the complaint refers to" }
      - { name: stock_id, type: string, source: input, description: "FK -> LinenStock.id the complaint refers to" }
      - { name: complaint_type, type: enum, source: input, description: "STAINS | TEARS | FOREIGN_OBJECT | ODOR | ISOLATION_BREACH" }
      - { name: pieces_affected, type: integer, source: input, description: "Pieces affected (>= 1)" }
      - { name: status, type: enum, source: system, description: "OPEN | VERIFIED | REJECTED | RESCINDED | RESOLVED" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "pieces_affected * per_piece_rate_cents(stock) at verify time" }
      - { name: routed_invoice_id, type: string, source: computed, default: null, description: "Invoice containing the manifest at verify time; null when manifest not yet invoiced" }

  - name: SurgeEvent
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: severity, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 (label only)" }
      - { name: par_multiplier, type: number, source: input, description: "Par multiplier applied to effective_par while ACTIVE (e.g. 1.5)" }
      - { name: starts_at, type: datetime, source: input, description: "Surge window start (closed interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Surge window end (closed interval), must be > starts_at" }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CartExchangeRun
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cart-runs/{cartRunId}/complete"
        actor: EVSOperator
        preconditions:
          - "status == SCHEDULED"
          - "storage_attested == true (ERR_STORAGE_NOT_ATTESTED)"
          - "for every soiled line: pieces <= ParLevel(stock_id, run.unit_id).on_hand (ERR_COUNT_EXCEEDS_ON_HAND)"
        side_effects:
          - "per unit ParLevel: on_hand -= soiled pieces; restock per restock_quantity calc; on_hand += restocked pieces"
          - "per restock line: LinenStock.in_circulation -= restocked pieces (driven by the ParLevel on_hand mutation)"
          - "per soiled line: LinenStock.in_wash += soiled pieces"
          - "completed_at = logical clock now; late_delivery = completed_at > scheduled_end"
      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /cart-runs/{cartRunId}/dispute"
        actor: UnitClerk
        preconditions:
          - "status == COMPLETED"
          - "acting UnitClerk's X-User-ID == run.unit_id (ERR_UNIT_OWNERSHIP)"
        side_effects: []
      - from: DISPUTED
        to: RECOUNTED
        trigger: "POST /cart-runs/{cartRunId}/recount"
        actor: UnitClerk
        preconditions:
          - "status == DISPUTED"
          - "acting UnitClerk's X-User-ID == run.unit_id (ERR_UNIT_OWNERSHIP)"
          - "for every corrected line: pieces <= original soiled pieces for that stock (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "per corrected line: ParLevel.on_hand += (original_soiled - corrected_soiled); LinenStock.in_wash -= (original_soiled - corrected_soiled)"
          - "restock top-up: additional = min(max(effective_par - on_hand, 0), LinenStock.in_circulation); on_hand += additional; LinenStock.in_circulation -= additional (overstock above par is allowed and not clamped)"
      - from: RECOUNTED
        to: DISPUTED
        trigger: "POST /cart-runs/{cartRunId}/dispute"
        actor: UnitClerk
        preconditions:
          - "status == RECOUNTED"
          - "acting UnitClerk's X-User-ID == run.unit_id (ERR_UNIT_OWNERSHIP)"
        side_effects: []
        note: "recount may be disputed again — RECOUNTED <-> DISPUTED cycle"
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /cart-runs/{cartRunId}/reconcile"
        actor: UnitClerk
        preconditions:
          - "status == COMPLETED"
          - "acting UnitClerk's X-User-ID == run.unit_id (ERR_UNIT_OWNERSHIP)"
        side_effects: []
      - from: RECOUNTED
        to: RECONCILED
        trigger: "POST /cart-runs/{cartRunId}/reconcile"
        actor: UnitClerk
        preconditions:
          - "status == RECOUNTED"
          - "acting UnitClerk's X-User-ID == run.unit_id (ERR_UNIT_OWNERSHIP)"
        side_effects: []

  - entity: SoiledManifest
    initial_state: DISPATCHED
    terminal_states: [RECONCILED]
    transitions:
      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /soiled-manifests/{manifestId}/return"
        actor: LaundryVendor
        preconditions:
          - "status == DISPATCHED"
          - "every returned line stock appears in manifest.lines (ERR_INVALID_REQUEST otherwise)"
          - "for every line: LinenStock.in_wash - (pieces + condemned_pieces + max(0, expected_pieces - pieces - condemned_pieces)) >= 0 (ERR_NEGATIVE_INVENTORY)"
        side_effects:
          - "per line: LinenStock.wash_cycles_completed += pieces; newly_retired per wash_life_retirement; LinenStock.retired_pieces += condemned_pieces + newly_retired"
          - "per line: LinenStock.in_circulation += (pieces - newly_retired) — retired pieces leave circulation, keeping total accounted pieces conserved"
          - "per line: LinenStock.in_wash -= (pieces + condemned_pieces + lost_line) where lost_line = max(0, expected_pieces - pieces - condemned_pieces)"
      - from: RETURNED
        to: RECONCILED
        trigger: "POST /soiled-manifests/{manifestId}/reconcile"
        actor: LinenManager
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "per line: lost_line = max(0, expected_pieces - pieces - condemned_pieces); LinenStock.lost_pieces += lost_line"
          - "per affected LinenStock: recompute cumulative loss_rate_pct; if >= 5.00 then shrinkage_status = INVESTIGATION (sticky)"
          - "every Complaint with manifest_id == this manifest and status == VERIFIED auto-transitions to RESOLVED"

  - entity: VendorInvoice
    initial_state: PROVISIONAL
    terminal_states: [SETTLED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /invoices/{invoiceId}/finalize"
        actor: LinenManager
        preconditions:
          - "status == PROVISIONAL"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "every linked manifest status == RECONCILED (ERR_MANIFEST_NOT_RECONCILED)"
          - "if facility.monthly_cap_cents is not null: final_total_cents <= monthly_cap_cents (ERR_CONTRACT_CAP_EXCEEDED)"
        side_effects:
          - "final_total_cents computed per final_invoice_total; billed_total_cents = final_total_cents - credit_total_cents"
          - "cost_per_apd_cents = round_half_up(billed_total_cents / period_adjusted_patient_days, 2)"
          - "finalized_by_user_id = X-User-ID"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /invoices/{invoiceId}/finalize"
        actor: LinenManager
        preconditions:
          - "status == DISPUTED"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "every linked manifest status == RECONCILED (ERR_MANIFEST_NOT_RECONCILED)"
          - "if facility.monthly_cap_cents is not null: recomputed final_total_cents <= monthly_cap_cents (ERR_CONTRACT_CAP_EXCEEDED)"
        side_effects:
          - "final_total_cents, billed_total_cents, cost_per_apd_cents recomputed (re-finalize after dispute)"
        note: "FINALIZED -> DISPUTED -> FINALIZED cycle"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /invoices/{invoiceId}/dispute"
        actor: LaundryVendor
        preconditions:
          - "status == FINALIZED"
        side_effects: []
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /invoices/{invoiceId}/settle"
        actor: LinenManager
        preconditions:
          - "status == FINALIZED"
        side_effects: []

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [REJECTED, RESCINDED, RESOLVED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /complaints/{complaintId}/verify"
        actor: "LinenManager, or InfectionControlOfficer when complaint_type == ISOLATION_BREACH"
        preconditions:
          - "status == OPEN"
          - "role check: ISOLATION_BREACH requires InfectionControlOfficer; other types require LinenManager (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "credit_cents = pieces_affected * per_piece_rate_cents(stock, facility rate at verify time)"
          - "if the manifest is on an invoice with status FINALIZED or DISPUTED: invoice.credit_total_cents += credit_cents and invoice.billed_total_cents -= credit_cents"
          - "if the manifest is on a SETTLED invoice or on no invoice: facility.credit_balance_cents += credit_cents"
      - from: OPEN
        to: REJECTED
        trigger: "POST /complaints/{complaintId}/reject"
        actor: "LinenManager, or InfectionControlOfficer when complaint_type == ISOLATION_BREACH"
        preconditions:
          - "status == OPEN"
          - "same conditional role check as verify (ERR_UNAUTHORIZED_ROLE)"
        side_effects: []
      - from: VERIFIED
        to: RESCINDED
        trigger: "POST /complaints/{complaintId}/rescind"
        actor: LinenManager
        preconditions:
          - "status == VERIFIED"
        side_effects:
          - "exact compensation of verify: if credit was routed to an invoice: invoice.credit_total_cents -= credit_cents and invoice.billed_total_cents += credit_cents; else facility.credit_balance_cents -= credit_cents"
      - from: VERIFIED
        to: RESOLVED
        trigger: "system (automatic when the linked SoiledManifest transitions RETURNED -> RECONCILED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "rewash resolution is implied by manifest reconciliation"

  - entity: SurgeEvent
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /surge-events/{surgeEventId}/activate"
        actor: LinenManager
        preconditions:
          - "status == DECLARED"
          - "facility.surge_posture == NORMAL (ERR_FACILITY_IN_SURGE)"
        side_effects:
          - "Facility.surge_posture: NORMAL -> SURGE"
          - "every ParLevel of the facility: effective_par = ceil(base_par_quantity * par_multiplier) (driven by the posture flip)"
          - "reserve waterfall allocation per reserve_allocation calc (driven by the effective_par increases): LinenStock.reserve_pieces decremented, ParLevel.on_hand incremented"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /surge-events/{surgeEventId}/close"
        actor: LinenManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Facility.surge_posture: SURGE -> NORMAL (when no other ACTIVE surge exists for the facility)"
          - "every ParLevel of the facility: effective_par = base_par_quantity"
          - "allocated reserve pieces remain at units (no clawback)"

  - entity: Facility
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: SURGE
        trigger: "system (SurgeEvent DECLARED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["ParLevel effective_par recompute cascade (see SurgeEvent activate)"]
      - from: SURGE
        to: NORMAL
        trigger: "system (SurgeEvent ACTIVE -> CLOSED, when no other ACTIVE surge)"
        actor: system
        preconditions: []
        side_effects: ["ParLevel effective_par revert to base"]

  - entity: LinenStock
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: INVESTIGATION
        trigger: "system (manifest reconcile when cumulative loss_rate_pct >= 5.00)"
        actor: system
        preconditions: []
        side_effects: []
        note: "field: shrinkage_status; sticky — no automatic return to NORMAL"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: par_level_update_stale
    parent_entity: ParLevel
    write_endpoint: "PUT /par-levels/{parLevelId}"
    occ_field: expected_par_level_version
    description: |
      Updating a ParLevel whose version has advanced since the client last
      observed it is rejected. Surge activate/close cascades rewrite
      effective_par and bump par.version, so a base-par edit carrying the
      pre-cascade version is acting on a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stock_adjustment_stale
    parent_entity: LinenStock
    write_endpoint: "POST /linen-stocks/{stockId}/adjustments"
    occ_field: expected_linen_stock_version
    description: |
      Recording a stock adjustment against a LinenStock whose version has
      advanced since the client last observed it is rejected. Cart-run
      completions and manifest returns mutate stock counters and bump
      stock.version, so an adjustment carrying an older version is acting on
      a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: restock_quantity
    trigger: "CartExchangeRun complete (and recount top-up)"
    algorithm: threshold
    formula: |
      effective_par = (facility.surge_posture == SURGE)
                      ? ceil(base_par_quantity * active_surge.par_multiplier)
                      : base_par_quantity
      on_hand_after_soiled = on_hand - soiled_pieces
      deficit = max(effective_par - on_hand_after_soiled, 0)
      if LinenStock.posture == CRITICAL and unit.unit_tier == STANDARD:
          deficit = floor(deficit / 2)          # triage: critical stock halves STANDARD-unit restock
      restock_pieces = min(deficit, LinenStock.in_circulation)
      shortage_flag = shortage_flag or (restock_pieces < deficit)
    input_set: "ParLevels of the run's unit; the linked LinenStock rows; facility surge posture and active SurgeEvent multiplier"
    precision: "integer pieces; ceil rounds up to the next whole piece"
    constants:
      CRITICAL_TRIAGE_DIVISOR: 2

  - name: provisional_invoice_total
    trigger: "VendorInvoice creation"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each line first, then sum.
      for each manifest, for each line:
          line_cents = round_half_up(line.weight_lbs * facility.rate_per_lb_cents, 0)
          if line.isolation_flag:
              line_cents += round_half_up(line_cents * facility.isolation_surcharge_pct, 0)
      provisional_total_cents = sum(all line_cents)   # sum AFTER per-line rounding
    input_set: "all lines of all manifests linked to the invoice, regardless of manifest status at creation time"
    precision: "integer cents; round_half_up per line BEFORE summation"
    variants:
      - name: weight_based_provisional
        when: "at invoice creation (status PROVISIONAL)"
        difference: "uses vendor-scale weights and per-pound rate; ignores returned piece counts"

  - name: final_invoice_total
    trigger: "VendorInvoice finalize"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED to break the apparent credit<->total cycle:
      # (1) per-piece rates, (2) final total, (3) credits, (4) billed total.
      per_piece_rate_cents(stock) = round_half_up(stock.piece_weight_lbs * facility.rate_per_lb_cents, 0)
      for each manifest, for each returned line:
          line_cents = line.pieces * per_piece_rate_cents(stock)
          if corresponding manifest line.isolation_flag:
              line_cents += round_half_up(line_cents * facility.isolation_surcharge_pct, 0)
      final_total_cents = sum(all line_cents)
      billed_total_cents = final_total_cents - credit_total_cents   # credits computed independently by complaint_credit
    input_set: "returned_lines of RECONCILED manifests linked to the invoice; credits from VERIFIED complaints routed to the invoice"
    precision: "integer cents; per-piece rate rounded once (round_half_up), surcharge rounded per line"
    variants:
      - name: piece_count_reconciled
        when: "at finalize (status PROVISIONAL/DISPUTED -> FINALIZED)"
        difference: "uses returned clean piece counts and per-piece rates; diverges from weight-based provisional for identical manifests"

  - name: complaint_credit
    trigger: "Complaint verify / rescind"
    algorithm: aggregation
    formula: |
      credit_cents = pieces_affected * per_piece_rate_cents(stock)
      # per_piece_rate_cents uses the FACILITY's current contracted rate at verify time,
      # independent of any invoice's computed totals (breaks circularity).
    input_set: "the complaint; its LinenStock; the facility rate"
    precision: "integer cents"

  - name: loss_rate_pct
    trigger: "SoiledManifest reconcile"
    algorithm: threshold
    formula: |
      per reconciled line: lost_line = max(0, expected_pieces - pieces - condemned_pieces)
      cumulative per stock over ALL RECONCILED manifests of the facility:
          loss_rate_pct = round_half_up(100.0 * total_lost_pieces / total_expected_pieces, 2)
      if loss_rate_pct >= 5.00: shrinkage_status = INVESTIGATION   # boundary is >=
    input_set: "lines of all RECONCILED manifests for the stock's facility; manifests in DISPATCHED/RETURNED are excluded"
    precision: "2 decimal places, round_half_up; comparison is >="
    constants:
      LOSS_THRESHOLD_PCT: 5.00

  - name: expected_pieces
    trigger: "SoiledManifest creation (per line)"
    algorithm: aggregation
    formula: |
      expected_pieces = round_half_up(line.weight_lbs / stock.piece_weight_lbs, 0)
    input_set: "each manifest line + its stock's piece_weight_lbs"
    precision: "integer pieces, round_half_up (10.125 lbs / 0.75 lbs = 13.5 -> 14)"

  - name: wash_life_retirement
    trigger: "SoiledManifest return (per returned line)"
    algorithm: chronological
    formula: |
      before = wash_cycles_completed
      wash_cycles_completed += line.pieces
      newly_retired = min(line.pieces,
                          floor(wash_cycles_completed / max_wash_cycles) - floor(before / max_wash_cycles))
      retired_pieces += newly_retired
      # FIFO-rotation approximation: the longest-serving pieces retire whenever the
      # cumulative wash count crosses a multiple of max_wash_cycles (boundary uses >=).
    input_set: "returned pieces of the line; stock wash_cycles_completed and max_wash_cycles"
    precision: "integer pieces"

  - name: stock_posture
    trigger: "any change to LinenStock.in_circulation or reserve_pieces"
    algorithm: threshold
    formula: |
      available = in_circulation + reserve_pieces
      if available < reorder_point_pieces: posture = CRITICAL
      else if available < floor(1.5 * reorder_point_pieces): posture = LOW
      else: posture = SUFFICIENT
    input_set: "the stock row"
    precision: "integer pieces; boundaries use < (strictly below)"

  - name: cost_per_adjusted_patient_day
    trigger: "GET /facilities/{facilityId}/metrics"
    algorithm: aggregation
    formula: |
      posted   = round_half_up(sum(billed_total_cents over SETTLED invoices)
                               / sum(period_adjusted_patient_days over SETTLED invoices), 2)
      accrual  = round_half_up((sum(billed_total_cents over FINALIZED/DISPUTED/SETTLED invoices)
                               + sum(provisional_total_cents over PROVISIONAL invoices))
                               / sum(period_adjusted_patient_days over ALL invoices), 2)
      # either variant: 0 when its invoice set is empty
    input_set: "all invoices of the facility, grouped by status"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: posted_basis
        when: "cash-basis reporting"
        difference: "SETTLED invoices only"
      - name: accrual_basis
        when: "management reporting"
        difference: "includes open invoices (PROVISIONAL at provisional total) — diverges from posted for identical data"

  - name: unit_quality_flag
    trigger: "Unit read / complaint verify"
    algorithm: aggregation
    formula: |
      n = count of Complaints with unit_id == unit.id, status in {VERIFIED, RESOLVED},
          and created_at >= (logical_clock_now - 30 days)
      quality_flag = WATCH if n >= 3 else CLEAR
    input_set: "complaints of the unit within the trailing 30-day window (logical clock)"
    constants:
      WATCH_COUNT: 3
      WATCH_WINDOW_DAYS: 30

  - name: reserve_allocation
    trigger: "SurgeEvent activate"
    algorithm: waterfall_allocation
    formula: |
      for each LinenStock of the facility with reserve_pieces > 0, in LinenStock.created_at ASC order:
          candidates = ParLevels of that stock whose unit belongs to the facility
          rank: unit_tier CRITICAL before STANDARD;
                then deficit_ratio = deficit / effective_par DESC;
                tie-break: unit.created_at ASC
          for each candidate in rank order while reserve_pieces > 0:
              deficit = max(effective_par - on_hand, 0)
              alloc = min(deficit, reserve_pieces)
              reserve_pieces -= alloc; ParLevel.on_hand += alloc
      # empty candidate pool or zero reserve: activation still succeeds, zero allocations
    input_set: "facility's stocks with reserve_pieces > 0; their ParLevels with post-multiplier effective_par"
    precision: "integer pieces"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this endpoint per §1.5 roles (incl. conditional complaint verify/reject role by complaint_type)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "segregation of duties: invoice finalize X-User-ID != invoice.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /invoices/{invoiceId}/finalize" }
  - { priority: 4, category: existence, check: "path ids and body FK references exist, validated left-to-right (cart_run_ids/manifest_ids elements must exist and belong to the given facility)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "request shape: required fields present, enum members valid, numeric ranges (pieces >= 0, pieces_affected >= 1, weight_lbs > 0, period_adjusted_patient_days >= 1, counts >= 0)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /par-levels/{parLevelId}, POST /linen-stocks/{stockId}/adjustments" }
  - { priority: 7, category: state, check: "resource in a valid from-state for the transition (ERR_ALREADY_TERMINAL when current state is terminal, else ERR_INVALID_STATE); UnitClerk ownership: acting clerk's X-User-ID == target run's/complaint's unit_id (ERR_UNIT_OWNERSHIP); PUT /par-levels and surge activate rejected while facility in SURGE posture (ERR_FACILITY_IN_SURGE); invoice creation requires every linked manifest in RETURNED or RECONCILED status (ERR_INVALID_STATE)", error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | ERR_UNIT_OWNERSHIP | ERR_FACILITY_IN_SURGE", http_status: 409, applies_to: "state-transition endpoints, PUT /par-levels/{parLevelId}, surge activate, complaint create, cart-run dispute/recount/reconcile, POST /invoices" }
  - { priority: 8, category: business_safety, check: "isolation protocol: manifest with any isolation_flag=true line requires isolation_protocol_ack == true (ERR_ISOLATION_PROTOCOL_REQUIRED); cart-run completion requires storage_attested == true (ERR_STORAGE_NOT_ATTESTED)", error_id: "ERR_ISOLATION_PROTOCOL_REQUIRED | ERR_STORAGE_NOT_ATTESTED", http_status: 422, applies_to: "POST /soiled-manifests, POST /cart-runs/{cartRunId}/complete" }
  - { priority: 9, category: business_temporal, check: "windows valid (end > start: ERR_INVALID_WINDOW); cart-run windows for the same unit must not overlap and must leave >= 120 minutes between windows (ERR_RUN_WINDOW_CONFLICT); surge windows for the same facility are closed intervals — any overlap including shared endpoints conflicts (ERR_SURGE_WINDOW_CONFLICT)", error_id: "ERR_INVALID_WINDOW | ERR_RUN_WINDOW_CONFLICT | ERR_SURGE_WINDOW_CONFLICT", http_status: 409, applies_to: "POST /cart-runs, POST /surge-events" }
  - { priority: 10, category: business_referential, check: "referential integrity: cart run not already linked to another manifest and status RECONCILED (ERR_CART_RUN_ALREADY_LINKED); manifest not already invoiced (ERR_MANIFEST_ALREADY_INVOICED); unique (unit_id, stock_id) par level (ERR_PAR_LEVEL_CONFLICT); ISOLATION_BREACH complaint requires an isolation-flagged manifest line for the stock (ERR_NO_ISOLATION_LINE); cart-run unit has >= 1 ParLevel (ERR_NO_PAR_LEVEL)", error_id: "ERR_CART_RUN_ALREADY_LINKED | ERR_MANIFEST_ALREADY_INVOICED | ERR_PAR_LEVEL_CONFLICT | ERR_NO_ISOLATION_LINE | ERR_NO_PAR_LEVEL", http_status: 409, applies_to: "POST /soiled-manifests, POST /invoices, POST /par-levels, POST /complaints, POST /cart-runs" }
  - { priority: 11, category: business_fiscal, check: "soiled counts <= unit on_hand (ERR_COUNT_EXCEEDS_ON_HAND); returns/adjustments must not drive in_wash or in_circulation negative (ERR_NEGATIVE_INVENTORY); final_total_cents <= facility.monthly_cap_cents when cap set (ERR_CONTRACT_CAP_EXCEEDED)", error_id: "ERR_COUNT_EXCEEDS_ON_HAND | ERR_NEGATIVE_INVENTORY | ERR_CONTRACT_CAP_EXCEEDED", http_status: 409, applies_to: "POST /cart-runs/{cartRunId}/complete, POST /soiled-manifests/{manifestId}/return, POST /linen-stocks/{stockId}/adjustments, POST /invoices/{invoiceId}/finalize" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility ---
  - { method: POST, path: "/facilities", description: "Create a facility with its vendor contract terms", roles: [LinenManager], code: 201, input: [name, rate_per_lb_cents, isolation_surcharge_pct, "monthly_cap_cents?"], output: Facility, side_effects: ["surge_posture=NORMAL, credit_balance_cents=0"] }
  - { method: GET, path: "/facilities/{facilityId}", description: "Get a facility", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: Facility, side_effects: [] }
  - { method: GET, path: "/facilities/{facilityId}/metrics", description: "Computed read: cost per adjusted patient day on posted and accrual bases", roles: [LinenManager], code: 200, input: [], output: { cost_per_apd_posted_cents: number, cost_per_apd_accrual_cents: number, posted_invoice_count: integer, accrual_invoice_count: integer }, side_effects: ["runs cost_per_adjusted_patient_day"] }

  # --- Unit ---
  - { method: POST, path: "/units", description: "Create a nursing unit", roles: [LinenManager], code: 201, input: [facility_id, name, unit_tier], output: Unit, side_effects: ["quality_flag=CLEAR"] }
  - { method: GET, path: "/units/{unitId}", description: "Get a unit", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: GET, path: "/units", description: "List units", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["facility_id?", "unit_tier?", "limit?", "offset?"], output: "Unit[]", side_effects: [] }

  # --- LinenStock ---
  - { method: POST, path: "/linen-stocks", description: "Register a linen item with opening circulation and reserve", roles: [LinenManager], code: 201, input: [facility_id, sku, display_name, category, piece_weight_lbs, unit_cost_cents, max_wash_cycles, reorder_point_pieces, opening_pieces, opening_reserve_pieces], output: LinenStock, side_effects: ["in_circulation=opening_pieces, reserve_pieces=opening_reserve_pieces, posture computed, shrinkage_status=NORMAL"] }
  - { method: GET, path: "/linen-stocks/{stockId}", description: "Get a linen stock row", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: LinenStock, side_effects: [] }
  - { method: GET, path: "/linen-stocks", description: "List linen stock rows", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["facility_id?", "category?", "posture?", "limit?", "offset?"], output: "LinenStock[]", side_effects: [] }
  - { method: POST, path: "/linen-stocks/{stockId}/adjustments", description: "Record a found/donation/write-off adjustment (OCC-guarded)", roles: [LinenManager], code: 201, input: [delta_pieces, reason, expected_linen_stock_version], output: LinenStock, side_effects: ["in_circulation += delta_pieces (reject when any counter would go negative: ERR_NEGATIVE_INVENTORY)", "increments LinenStock.version by 1"] }

  # --- ParLevel ---
  - { method: POST, path: "/par-levels", description: "Configure par level for a unit/item pair", roles: [LinenManager], code: 201, input: [unit_id, stock_id, base_par_quantity, cart_cycle], output: ParLevel, side_effects: ["on_hand=0, effective_par=base_par_quantity"] }
  - { method: GET, path: "/par-levels/{parLevelId}", description: "Get a par level", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: ParLevel, side_effects: [] }
  - { method: GET, path: "/par-levels", description: "List par levels", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["unit_id?", "stock_id?", "limit?", "offset?"], output: "ParLevel[]", side_effects: [] }
  - { method: PUT, path: "/par-levels/{parLevelId}", description: "Update base par and/or cart cycle (OCC-guarded; blocked during facility surge)", roles: [LinenManager], code: 200, input: [expected_par_level_version, "base_par_quantity?", "cart_cycle?"], output: ParLevel, side_effects: ["effective_par recomputed when not in surge", "increments ParLevel.version by 1"] }

  # --- CartExchangeRun ---
  - { method: POST, path: "/cart-runs", description: "Schedule an exchange cart run for a unit", roles: [EVSOperator], code: 201, input: [unit_id, scheduled_start, scheduled_end], output: CartExchangeRun, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/cart-runs/{cartRunId}", description: "Get a cart run", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: CartExchangeRun, side_effects: [] }
  - { method: GET, path: "/cart-runs", description: "List cart runs", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["unit_id?", "status?", "manifest_id?", "limit?", "offset?"], output: "CartExchangeRun[]", side_effects: [] }
  - { method: POST, path: "/cart-runs/{cartRunId}/complete", description: "Record soiled counts and restock the unit to par", roles: [EVSOperator], code: 200, input: [soiled_lines, storage_attested], output: CartExchangeRun, side_effects: ["status -> COMPLETED; ParLevel.on_hand and LinenStock.in_circulation/in_wash mutations per restock_quantity calc; completed_at and late_delivery set"] }
  - { method: POST, path: "/cart-runs/{cartRunId}/dispute", description: "Unit disputes recorded counts", roles: [UnitClerk], code: 200, input: ["reason?"], output: CartExchangeRun, side_effects: ["status -> DISPUTED (from COMPLETED or RECOUNTED)"] }
  - { method: POST, path: "/cart-runs/{cartRunId}/recount", description: "Unit submits corrected soiled counts", roles: [UnitClerk], code: 200, input: [corrected_soiled_lines], output: CartExchangeRun, side_effects: ["status -> RECOUNTED; compensation deltas on ParLevel.on_hand, LinenStock.in_wash, plus restock top-up"] }
  - { method: POST, path: "/cart-runs/{cartRunId}/reconcile", description: "Unit confirms final counts (terminal)", roles: [UnitClerk], code: 200, input: [], output: CartExchangeRun, side_effects: ["status -> RECONCILED (from COMPLETED or RECOUNTED)"] }

  # --- SoiledManifest ---
  - { method: POST, path: "/soiled-manifests", description: "Create a weighed vendor-bound soiled manifest from reconciled cart runs", roles: [EVSOperator], code: 201, input: [facility_id, cart_run_ids, lines, "isolation_protocol_ack?"], output: SoiledManifest, side_effects: ["status=DISPATCHED; expected_pieces computed per line; per line: LinenStock.in_wash += (expected_pieces - soiled pieces for that stock across the linked cart runs) — dock-scale recount adjustment; linked cart runs' manifest_id set; recorded_by_user_id = X-User-ID"] }
  - { method: GET, path: "/soiled-manifests/{manifestId}", description: "Get a manifest", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: SoiledManifest, side_effects: [] }
  - { method: GET, path: "/soiled-manifests", description: "List manifests", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["facility_id?", "status?", "invoice_id?", "limit?", "offset?"], output: "SoiledManifest[]", side_effects: [] }
  - { method: POST, path: "/soiled-manifests/{manifestId}/return", description: "Vendor records returned clean pieces per item", roles: [LaundryVendor], code: 200, input: [returned_lines], output: SoiledManifest, side_effects: ["status -> RETURNED; LinenStock circulation/wash/retirement mutations per wash_life_retirement"] }
  - { method: POST, path: "/soiled-manifests/{manifestId}/reconcile", description: "Reconcile expected vs returned; compute shrinkage", roles: [LinenManager], code: 200, input: [], output: SoiledManifest, side_effects: ["status -> RECONCILED; lost_pieces and shrinkage_status updates per loss_rate_pct; VERIFIED complaints on this manifest auto-RESOLVED"] }

  # --- VendorInvoice ---
  - { method: POST, path: "/invoices", description: "Create a provisional weight-based invoice over manifests", roles: [LinenManager], code: 201, input: [facility_id, manifest_ids, period_start, period_end, period_adjusted_patient_days], output: VendorInvoice, side_effects: ["status=PROVISIONAL; provisional_total_cents per provisional_invoice_total; manifests' invoice_id set; created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/invoices/{invoiceId}", description: "Get an invoice", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: VendorInvoice, side_effects: [] }
  - { method: GET, path: "/invoices", description: "List invoices", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["facility_id?", "status?", "limit?", "offset?"], output: "VendorInvoice[]", side_effects: [] }
  - { method: POST, path: "/invoices/{invoiceId}/finalize", description: "Reconcile to piece-count billing (from PROVISIONAL or DISPUTED)", roles: [LinenManager], code: 200, input: [], output: VendorInvoice, side_effects: ["status -> FINALIZED; final_total_cents/billed_total_cents/cost_per_apd_cents per final_invoice_total"] }
  - { method: POST, path: "/invoices/{invoiceId}/dispute", description: "Vendor disputes a finalized invoice", roles: [LaundryVendor], code: 200, input: ["reason?"], output: VendorInvoice, side_effects: ["status -> DISPUTED"] }
  - { method: POST, path: "/invoices/{invoiceId}/settle", description: "Record payment of a finalized invoice", roles: [LinenManager], code: 200, input: [], output: VendorInvoice, side_effects: ["status -> SETTLED"] }

  # --- Complaint ---
  - { method: POST, path: "/complaints", description: "Unit files a linen quality complaint", roles: [UnitClerk], code: 201, input: [unit_id, manifest_id, stock_id, complaint_type, pieces_affected], output: Complaint, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/complaints/{complaintId}", description: "Get a complaint", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: Complaint, side_effects: [] }
  - { method: GET, path: "/complaints", description: "List complaints", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["unit_id?", "stock_id?", "manifest_id?", "status?", "limit?", "offset?"], output: "Complaint[]", side_effects: [] }
  - { method: POST, path: "/complaints/{complaintId}/verify", description: "Verify a complaint and route its credit (ISOLATION_BREACH requires InfectionControlOfficer)", roles: [LinenManager, InfectionControlOfficer], code: 200, input: [], output: Complaint, side_effects: ["status -> VERIFIED; credit_cents computed; invoice credit_total/billed_total mutation, or facility.credit_balance_cents when invoice SETTLED/absent"] }
  - { method: POST, path: "/complaints/{complaintId}/reject", description: "Reject a complaint (same conditional role rule as verify)", roles: [LinenManager, InfectionControlOfficer], code: 200, input: ["reason?"], output: Complaint, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/complaints/{complaintId}/rescind", description: "Rescind a verified complaint; exactly reverses its credit", roles: [LinenManager], code: 200, input: [], output: Complaint, side_effects: ["status -> RESCINDED; compensating credit reversal on the routed invoice or facility credit balance"] }

  # --- SurgeEvent ---
  - { method: POST, path: "/surge-events", description: "Declare a surge event with par multiplier and window", roles: [LinenManager], code: 201, input: [facility_id, severity, par_multiplier, starts_at, ends_at], output: SurgeEvent, side_effects: ["status=DECLARED"] }
  - { method: GET, path: "/surge-events/{surgeEventId}", description: "Get a surge event", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: [], output: SurgeEvent, side_effects: [] }
  - { method: GET, path: "/surge-events", description: "List surge events", roles: [LinenManager, EVSOperator, LaundryVendor, UnitClerk, InfectionControlOfficer], code: 200, input: ["facility_id?", "status?", "limit?", "offset?"], output: "SurgeEvent[]", side_effects: [] }
  - { method: POST, path: "/surge-events/{surgeEventId}/activate", description: "Activate a surge: posture flip, effective_par cascade, reserve waterfall", roles: [LinenManager], code: 200, input: [], output: SurgeEvent, side_effects: ["status -> ACTIVE; Facility.surge_posture -> SURGE; ParLevel effective_par recompute; reserve_allocation waterfall"] }
  - { method: POST, path: "/surge-events/{surgeEventId}/close", description: "Close an active surge: posture and pars revert", roles: [LinenManager], code: 200, input: [], output: SurgeEvent, side_effects: ["status -> CLOSED; Facility.surge_posture -> NORMAL when no other ACTIVE surge; ParLevel effective_par -> base"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [LinenManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint (incl. conditional complaint-role rule)" }
  - { id: ERR_UNIT_OWNERSHIP, http: 403, condition: "UnitClerk acting on a resource whose unit_id != clerk's X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Invoice finalize attempted by the same user who created the invoice" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist (or wrong facility scope)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or numeric range violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_FACILITY_IN_SURGE, http: 409, condition: "Operation blocked while facility surge_posture == SURGE (par edits, second surge activation)" }
  - { id: ERR_ISOLATION_PROTOCOL_REQUIRED, http: 422, condition: "Manifest contains an isolation-flagged line but isolation_protocol_ack is not true" }
  - { id: ERR_STORAGE_NOT_ATTESTED, http: 422, condition: "Cart-run completion without clean-storage compliance attestation" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window end is not after window start" }
  - { id: ERR_RUN_WINDOW_CONFLICT, http: 409, condition: "Cart-run window overlaps or leaves < 120 minutes gap vs another non-terminal run of the same unit" }
  - { id: ERR_SURGE_WINDOW_CONFLICT, http: 409, condition: "Surge closed-interval window overlaps another DECLARED/ACTIVE surge of the same facility (shared endpoints count)" }
  - { id: ERR_CART_RUN_ALREADY_LINKED, http: 409, condition: "Cart run already linked to a manifest, or not in RECONCILED status" }
  - { id: ERR_MANIFEST_ALREADY_INVOICED, http: 409, condition: "Manifest already belongs to an invoice" }
  - { id: ERR_PAR_LEVEL_CONFLICT, http: 409, condition: "A par level already exists for this (unit_id, stock_id) pair" }
  - { id: ERR_NO_ISOLATION_LINE, http: 422, condition: "ISOLATION_BREACH complaint but the manifest has no isolation-flagged line for the stock" }
  - { id: ERR_NO_PAR_LEVEL, http: 409, condition: "Cart run cannot be scheduled: unit has no par levels configured" }
  - { id: ERR_COUNT_EXCEEDS_ON_HAND, http: 409, condition: "Soiled pieces recorded exceed the unit's on_hand for that stock" }
  - { id: ERR_NEGATIVE_INVENTORY, http: 409, condition: "Return or adjustment would drive in_wash or in_circulation negative" }
  - { id: ERR_CONTRACT_CAP_EXCEEDED, http: 422, condition: "final_total_cents exceeds facility.monthly_cap_cents at finalize" }
  - { id: ERR_MANIFEST_NOT_RECONCILED, http: 409, condition: "Invoice finalize with a linked manifest not in RECONCILED status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LinenManager
    description: "Hospital linen services manager — administers catalog, pars, billing finalization, surge, and complaint adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /facilities, /units, /linen-stocks, /par-levels — configuration"
      - "PUT /par-levels/{id} — par updates (OCC)"
      - "POST /linen-stocks/{id}/adjustments — inventory adjustments (OCC)"
      - "POST /invoices, /invoices/{id}/finalize, /invoices/{id}/settle — billing (finalize requires a different user than creation)"
      - "POST /soiled-manifests/{id}/reconcile — shrinkage reconciliation"
      - "POST /complaints/{id}/verify|reject (non-isolation types), /complaints/{id}/rescind"
      - "POST /surge-events, /surge-events/{id}/activate|close"
      - "GET /facilities/{id}/metrics"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all roles may read)"

  - name: EVSOperator
    description: "Environmental services / linen aide — runs exchange carts and weighs soiled outbound linen"
    identity: opaque
    exclusive_operations:
      - "POST /cart-runs, /cart-runs/{id}/complete"
      - "POST /soiled-manifests — weight recording (organizationally separate from billing)"
    shared_operations:
      - "GET endpoints (all roles may read)"

  - name: LaundryVendor
    description: "External laundry vendor operator — returns clean linen and may dispute invoices"
    identity: opaque
    exclusive_operations:
      - "POST /soiled-manifests/{id}/return"
      - "POST /invoices/{id}/dispute"
    shared_operations:
      - "GET endpoints (all roles may read)"

  - name: UnitClerk
    description: "Nursing unit clerk — confirms cart counts and files complaints for their own unit only"
    identity: "entity_backed:Unit"
    exclusive_operations:
      - "POST /cart-runs/{id}/dispute|recount|reconcile (only when run.unit_id == X-User-ID)"
      - "POST /complaints (only when complaint unit_id == X-User-ID)"
    shared_operations:
      - "GET endpoints (all roles may read)"

  - name: InfectionControlOfficer
    description: "Infection prevention — adjudicates isolation-protocol complaints"
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/verify|reject when complaint_type == ISOLATION_BREACH"
    shared_operations:
      - "GET endpoints (all roles may read)"
