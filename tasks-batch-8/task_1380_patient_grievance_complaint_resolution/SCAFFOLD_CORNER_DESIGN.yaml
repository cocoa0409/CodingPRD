        test_recipe:
          setup: ["invA created before invB (both 0 open); invC on_leave; two CLASSIFIED cases"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Renal", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
