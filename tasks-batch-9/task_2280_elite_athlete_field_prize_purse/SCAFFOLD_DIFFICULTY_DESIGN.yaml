  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict (3 instances, distinct pairs)
  # ===========================================================================

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_ceiling_on_double_accept
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors.ERR_INVALID_INVITATION_STATE
          - errors.ERR_APPEARANCE_BUDGET_EXCEEDED
        distinguishing_aspect: >-
          The second ACCEPT on an already-ACCEPTED invitation violates BOTH the target-state check
          (priority 8, category state) and the appearance-budget ceiling (priority 16, category
          business_fiscal — re-committing 2,000,000 on top of the 2,000,000 already committed would
          need 4,000,000 out of a 2,500,000 budget), and the lower priority number must win.
          Falsifiable in one sentence: an implementation that checks money before state returns 422
          ERR_APPEARANCE_BUDGET_EXCEEDED here instead of 409 ERR_INVALID_INVITATION_STATE.
        test_recipe:
          setup: >-
            Edition with appearance_budget_cents = 2,500,000, FIELD_OPEN. One invitation whose
            guaranteed package is exactly 2,000,000 (1,702,000 fee + 120,000 ECONOMY + 160,000 for 5
            hotel nights + 18,000 ground transport) is ACCEPTED, leaving 500,000 uncommitted — less
            than a second commitment of the same size.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
