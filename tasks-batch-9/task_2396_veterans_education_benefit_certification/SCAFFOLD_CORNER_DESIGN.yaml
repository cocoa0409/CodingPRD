      - name: catalog_suspension_only_returns_submitted_certifications
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: catalog_suspension_cascade_returns_only_submitted_certifications
          rationale: "That §1.8 non_linear_state_machine instance already suspends an APPROVED catalog with one DRAFT, one SUBMITTED, one CERTIFIED and one VOID certification attached and asserts that exactly the SUBMITTED row moves to RETURNED with a CERTIFICATION_AUTO_RETURNED audit entry while the others keep their state — the full conditional-cascade claim."

      - name: award_reversal_compensates_the_agreement_counters
        claim_type: compensation
        excluded_because:
          difficulty_instance: yellow_ribbon_award_reversal_restores_pool_and_participant_count_exactly
          rationale: "That §1.8 compensating_invariant instance asserts pool_remaining_cents and participant_count return to their pre-award values after a reverse, including the two-award interleaving that makes an order-dependent restore visible."

      - name: saa_decision_cascades_down_to_the_program_row
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: catalog_pending_saa_three_way_fork_with_divergent_program_effects
          rationale: "That §1.8 non_linear_state_machine instance drives all three saa-decision outcomes from PENDING_SAA and asserts the divergent Program.approval_status and approved_catalog_version_id each one cascades, which subsumes a single-decision cascade_down check."

      - name: reconciliation_bubbles_up_into_debts_and_awards
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: reconcile_cascade_depth_five_debt_and_award_reversal
          rationale: "That §1.8 transitive_cascade instance walks CASCADE-A L1 through L5 from a single reconcile call and asserts the certification, student entitlement, debt, award and audit-trail effects that a bubble_up claim would test."
