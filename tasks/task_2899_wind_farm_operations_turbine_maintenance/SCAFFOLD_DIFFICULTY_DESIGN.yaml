              payload: { crew_id: "${crew_id}", weather_window_id: "${ww_id}", planned_start_utc: "2026-08-10T14:00:00Z", planned_end_utc: "2026-08-10T16:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_d_id}/schedule"
              payload: { crew_id: "${crew_id}", weather_window_id: "${ww_id}", planned_start_utc: "2026-08-10T04:00:00Z", planned_end_utc: "2026-08-10T06:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "WorkOrder.${wo_a_id}.state == SCHEDULED with crew_id ${crew_id} and weather_window_id ${ww_id}"
            - "the 10:00-14:00 schedule returns HTTP 200 and WorkOrder.${wo_b_id}.state == SCHEDULED, proving planned_start_utc == another order's planned_end_utc is NOT an overlap"
            - "the 13:59-16:00 schedule returns HTTP 409 with ${err_one_minute} == ERR_CREW_WINDOW_CONFLICT"
            - "the 09:00-09:30 schedule returns HTTP 409 with ${err_contained} == ERR_CREW_WINDOW_CONFLICT, so full containment counts as overlap too"
            - "after both refusals WorkOrder.${wo_c_id}.state is still SUBMITTED with crew_id null, weather_window_id null, planned_start_utc null and planned_end_utc null"
            - "the retried 14:00-16:00 schedule returns HTTP 200 and WorkOrder.${wo_c_id}.state == SCHEDULED"
            - "the 04:00-06:00 schedule returns HTTP 200 and WorkOrder.${wo_d_id}.state == SCHEDULED, so adjacency is symmetric and holds on the lower edge as well"
            - "the 2026-08-11T00:00:00Z schedule returns HTTP 422 with ${err_outside} == ERR_WORK_ORDER_OUTSIDE_WINDOW, since the window's half-open interval excludes its own end instant even though the crew is free then"
            - "WeatherWindow.${ww_id}.state == CONFIRMED and active_work_order_count == 4, counting only the three orders plus the retried one and none of the three refusals"
            - "Crew.${crew_id}.status == ON_SHIFT and the crew holds exactly four SCHEDULED orders whose planned intervals tile 04:00-16:00 without a gap or an overlap"
      - name: crane_buffer_closes_at_the_touch_point_while_weather_window_adjacency_stays_open
        grounds:
          - validations[priority=63]
          - validations[priority=61]
          - endpoints.POST_/wind-ops/crane-mobilizations
          - endpoints.POST_/wind-ops/weather-windows
          - calculations.crane_cost_and_allocation.constants.CRANE_BUFFER_HOURS
          - entities.CraneMobilization.fields.mobilization_start_utc
          - entities.WeatherWindow.fields.start_utc
        distinguishing_aspect: |
          The same geometric question - may a new interval start exactly where an existing one
          ends - is answered in opposite directions by two rules on the same farm in the same
          test. A crane mobilization whose 48-hour-padded interval touches an existing padded
          interval at a single instant is REFUSED with ERR_CRANE_BUFFER_CONFLICT, and moving it
          one second later makes it legal, on both the upper and the lower edge. A weather
          window whose interval touches an existing window's end exactly is ACCEPTED, and only
          a one-minute genuine overlap is refused with ERR_WEATHER_WINDOW_OVERLAP. The buffer
          is therefore a closed pad measured in hours off both endpoints, while window
          exclusivity is plain half-open comparison.
        test_recipe:
          setup:
            - "one farm and no turbines, since neither crane mobilizations nor weather windows need any"
            - "one REQUESTED CraneMobilization anchoring the geometry from 2026-09-10T00:00:00Z to 2026-09-12T00:00:00Z, whose CRANE_BUFFER_HOURS 48 pad spans 2026-09-08T00:00:00Z to 2026-09-14T00:00:00Z"
            - "one FORECAST weather window from 2026-09-10T00:00:00Z to 2026-09-10T12:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Sand Hills", region_code: "NE-C", grid_operator_code: "SPP", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-09-10T00:00:00Z", demobilization_end_utc: "2026-09-12T00:00:00Z", day_rate_cents: 3800000, mobilization_fee_cents: 12000000, max_lift_wind_speed_ms: 9.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { crane_anchor_id: $.data.id }
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-09-10T00:00:00Z", end_utc: "2026-09-10T12:00:00Z", forecast_wind_speed_ms: 7.0, forecast_gust_ms: 10.0, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { ww_anchor_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "TOWER_ASSIST", mobilization_start_utc: "2026-09-16T00:00:00Z", demobilization_end_utc: "2026-09-17T00:00:00Z", day_rate_cents: 1200000, mobilization_fee_cents: 4000000, max_lift_wind_speed_ms: 11.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_pad_touch_upper: $.data.error_id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "TOWER_ASSIST", mobilization_start_utc: "2026-09-16T00:00:01Z", demobilization_end_utc: "2026-09-17T00:00:00Z", day_rate_cents: 1200000, mobilization_fee_cents: 4000000, max_lift_wind_speed_ms: 11.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { crane_upper_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "SELF_ERECTING", mobilization_start_utc: "2026-09-04T00:00:00Z", demobilization_end_utc: "2026-09-06T00:00:00Z", day_rate_cents: 700000, mobilization_fee_cents: 1500000, max_lift_wind_speed_ms: 12.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_pad_touch_lower: $.data.error_id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "SELF_ERECTING", mobilization_start_utc: "2026-09-03T23:59:59Z", demobilization_end_utc: "2026-09-05T23:59:59Z", day_rate_cents: 700000, mobilization_fee_cents: 1500000, max_lift_wind_speed_ms: 12.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { crane_lower_id: $.data.id }
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-09-10T12:00:00Z", end_utc: "2026-09-11T00:00:00Z", forecast_wind_speed_ms: 7.5, forecast_gust_ms: 10.5, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { ww_adjacent_id: $.data.id }
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-09-10T11:59:00Z", end_utc: "2026-09-10T13:00:00Z", forecast_wind_speed_ms: 7.5, forecast_gust_ms: 10.5, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_window_overlap: $.data.error_id }
            - call: "POST /wind-ops/weather-windows/${ww_anchor_id}/confirm"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-09-10T06:00:00Z", end_utc: "2026-09-10T07:00:00Z", forecast_wind_speed_ms: 7.5, forecast_gust_ms: 10.5, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_confirmed_overlap: $.data.error_id }
            - call: "GET /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", state: "REQUESTED" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "the 2026-09-16T00:00:00Z mobilization returns HTTP 409 with ${err_pad_touch_upper} == ERR_CRANE_BUFFER_CONFLICT, because its padded start 2026-09-14T00:00:00Z equals the anchor's padded end"
            - "the 2026-09-16T00:00:01Z mobilization returns HTTP 201 with CraneMobilization.${crane_upper_id}.state == REQUESTED, so one second of clearance past the pad is sufficient"
            - "the 2026-09-04T00:00:00Z mobilization returns HTTP 409 with ${err_pad_touch_lower} == ERR_CRANE_BUFFER_CONFLICT, because its padded end 2026-09-08T00:00:00Z equals the anchor's padded start, proving the pad is closed on both edges"
            - "the 2026-09-03T23:59:59Z mobilization returns HTTP 201 with CraneMobilization.${crane_lower_id}.state == REQUESTED"
            - "the 2026-09-10T12:00:00Z weather window returns HTTP 201 with WeatherWindow.${ww_adjacent_id}.state == FORECAST, the OPPOSITE verdict to the crane touch point on the same farm"
            - "the 2026-09-10T11:59:00Z weather window returns HTTP 409 with ${err_window_overlap} == ERR_WEATHER_WINDOW_OVERLAP, so only a genuine one-minute intersection is refused"
            - "the 2026-09-10T06:00:00Z weather window returns HTTP 409 with ${err_confirmed_overlap} == ERR_WEATHER_WINDOW_OVERLAP after the anchor was confirmed, so a CONFIRMED window blocks just as a FORECAST one does"
            - "CraneMobilization.${crane_anchor_id}.state == REQUESTED with lift_days 0, standby_days 0, billable_days 0 and total_crane_cost_cents 0, since no replacement has reserved it"
            - "GET /wind-ops/crane-mobilizations for the farm in state REQUESTED returns exactly 3 rows, so neither refusal left a persisted mobilization"
            - "GET /wind-ops/weather-windows for the farm returns exactly 2 rows, one CONFIRMED and one FORECAST"
      - name: curtailment_stack_limit_is_an_aggregate_gate_that_reopens_only_as_orders_release
        grounds:
          - validations[priority=65]
          - endpoints.POST_/wind-ops/curtailment-orders/{id}/activate
          - endpoints.POST_/wind-ops/curtailment-orders/{id}/release
          - state_machines.CurtailmentOrder.PENDING_to_ACTIVE
          - state_machines.CurtailmentOrder.ACTIVE_to_RELEASED
          - entities.Turbine.fields.active_curtailment_count
          - entities.Turbine.fields.effective_power_limit_kw
          - entities.Turbine.fields.curtailment_state
        distinguishing_aspect: |
          Four curtailment orders overlap on one turbine and every one of them is individually
          legal, yet only two may be ACTIVE at a time: the limit is an aggregate over live rows,
          not a property of the order being activated. The refused activations are not permanent
          - each release frees exactly one slot, so the same order that was refused twice
          succeeds later - and the derived turbine fields must be recomputed from the surviving
          ACTIVE set at every step, including the fall back to TurbineModel.rated_power_kw and
          UNCONSTRAINED once the set empties. Because curtailed_hours is measured from
          released_at and not from end_utc, every release accrues less than its order asked for,
          and only the non-compensable ones feed counted_downtime_hours_period.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine, expected_kwh_per_hour 2000 on a model whose rated_power_kw is 4200"
            - "four PENDING curtailment orders on that turbine, all overlapping in time: GRID 00:00-06:00 limit 1500 deemed 500, NOISE 02:00-08:00 limit 800 deemed 400, WILDLIFE 03:00-04:00 limit 0 deemed 0, ICING 05:00-09:00 limit 1200 deemed 300, all on 2026-08-01"
            - "the turbine version is re-read before each create because every create increments it"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Basin Mesa", region_code: "NM-N", grid_operator_code: "PNM", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v1: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "GRID", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-01T06:00:00Z", power_limit_kw: 1500, deemed_kwh_per_hour: 500, expected_turbine_version: "${t_v1}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_grid_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v2: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "NOISE", start_utc: "2026-08-01T02:00:00Z", end_utc: "2026-08-01T08:00:00Z", power_limit_kw: 800, deemed_kwh_per_hour: 400, expected_turbine_version: "${t_v2}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_noise_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v3: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "WILDLIFE", start_utc: "2026-08-01T03:00:00Z", end_utc: "2026-08-01T04:00:00Z", power_limit_kw: 0, deemed_kwh_per_hour: 0, expected_turbine_version: "${t_v3}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_wildlife_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v4: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "ICING", start_utc: "2026-08-01T05:00:00Z", end_utc: "2026-08-01T09:00:00Z", power_limit_kw: 1200, deemed_kwh_per_hour: 300, expected_turbine_version: "${t_v4}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_icing_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/curtailment-orders/${co_grid_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_noise_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_wildlife_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_stack_1: $.data.error_id }
            - call: "POST /wind-ops/curtailment-orders/${co_icing_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_stack_2: $.data.error_id }
            - call: "POST /wind-ops/curtailment-orders/${co_grid_id}/release"
              payload: { released_at: "2026-08-01T04:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_wildlife_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_icing_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_stack_3: $.data.error_id }
            - call: "POST /wind-ops/curtailment-orders/${co_noise_id}/release"
              payload: { released_at: "2026-08-01T05:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_wildlife_id}/release"
              payload: { released_at: "2026-08-01T03:30:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v_empty: $.data.version }
            - call: "POST /wind-ops/curtailment-orders/${co_icing_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
          assert:
            - "after the GRID activation Turbine.${t1_id}.active_curtailment_count == 1, effective_power_limit_kw == 1500 and curtailment_state == CURTAILED"
            - "after the NOISE activation active_curtailment_count == 2 and effective_power_limit_kw == 800, the minimum across the ACTIVE set and not the newest order's limit"
            - "the WILDLIFE activation returns HTTP 409 with ${err_stack_1} == ERR_CURTAILMENT_STACK_LIMIT even though that order alone is perfectly legal"
            - "the ICING activation returns HTTP 409 with ${err_stack_2} == ERR_CURTAILMENT_STACK_LIMIT, so the gate is about the live count and not about which order is presented"
            - "after both refusals CurtailmentOrder.${co_wildlife_id}.state and CurtailmentOrder.${co_icing_id}.state are both still PENDING and Turbine.${t1_id}.active_curtailment_count is still 2"
            - "the GRID release yields CurtailmentOrder.${co_grid_id}.state == RELEASED with curtailed_hours == 4.0 and lost_energy_kwh == 2000.00, measured from released_at 04:00 rather than the order's end_utc 06:00"
            - "the GRID order is compensable true, so Turbine.${t1_id}.counted_downtime_hours_period is still 0 after its release"
            - "after the GRID release active_curtailment_count == 1, effective_power_limit_kw == 800 and curtailment_state == CURTAILED"
            - "the retried WILDLIFE activation now returns HTTP 200 with state ACTIVE, active_curtailment_count == 2, effective_power_limit_kw == 0 and curtailment_state == FORCED_STOP, because a zero limit dominates the minimum"
            - "the third ICING activation returns HTTP 409 with ${err_stack_3} == ERR_CURTAILMENT_STACK_LIMIT, since the freed slot was immediately taken"
            - "the NOISE release yields curtailed_hours == 3.0 and lost_energy_kwh == 1200.00, and because NOISE is not compensable Turbine.${t1_id}.counted_downtime_hours_period == 3.0"
            - "after the NOISE release active_curtailment_count == 1, effective_power_limit_kw == 0 and curtailment_state is still FORCED_STOP because the surviving WILDLIFE order carries limit 0"
            - "the WILDLIFE release yields curtailed_hours == 0.5 and lost_energy_kwh == 0.00, and counted_downtime_hours_period == 3.5 since WILDLIFE is not compensable either"
            - "with the ACTIVE set empty Turbine.${t1_id}.active_curtailment_count == 0, curtailment_state == UNCONSTRAINED and effective_power_limit_kw == 4200, falling back to TurbineModel.rated_power_kw and not to expected_kwh_per_hour"
            - "the final ICING activation returns HTTP 200 with active_curtailment_count == 1, effective_power_limit_kw == 1200 and curtailment_state == CURTAILED, so an order refused three times is still activatable while it stays PENDING"

  - rule_id: compensating_invariant
    instances:
      - name: spare_part_unit_conservation_survives_refusals_cancellation_execution_and_a_receipt
        grounds:
          - entities.SparePart.fields.total_units_accounted
          - entities.SparePart.fields.quantity_on_hand
          - entities.SparePart.fields.quantity_reserved
          - entities.SparePart.fields.quantity_consumed
          - entities.SparePart.fields.status
          - entities.SparePart.fields.procurement_flag
          - endpoints.POST_/wind-ops/component-replacements
          - endpoints.POST_/wind-ops/component-replacements/{id}/cancel
          - endpoints.POST_/wind-ops/component-replacements/{id}/execute
          - endpoints.POST_/wind-ops/spare-parts/{id}/receipts
          - validations[priority=68]
          - validations[priority=73]
          - validations[priority=69]
        distinguishing_aspect: |
          total_units_accounted == quantity_on_hand + quantity_reserved + quantity_consumed must
          hold after EVERY operation on one stock line, including the operations that fail. Two
          refusals (a component-type mismatch and an out-of-stock draw), one cancellation that
          hands a reserved unit back, one execution that converts a reserved unit into a consumed
          one, and one goods receipt that legitimately RAISES the conserved total are walked in
          sequence. The three sub-counters move in opposite directions at different steps while
          the total only ever changes on the receipt, and status / procurement_flag must be
          re-derived from quantity_on_hand alone at each step - so the line reads OUT_OF_STOCK
          while still accounting for two units.
        test_recipe:
          setup:
            - "one farm, one ONLINE turbine and one GEARBOX stock line opening at quantity_on_hand 2 with reorder_point 2, so it starts IN_STOCK with total_units_accounted 2"
            - "the line has uptower_repairable false, so the up-tower branch is unavailable to it"
            - "one MAJOR_COMPONENT work order driven all the way to IN_PROGRESS, since execute requires it"
            - "one CRAWLER_600T mobilization from 2026-08-10T00:00:00Z to 2026-08-12T00:00:00Z, day_rate 3800000 and mobilization_fee 12000000, whose two calendar dates are both workable at max_lift_wind_speed_ms 9.0 against a forecast of 8.0"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Cedar Bluff", region_code: "KS-W", grid_operator_code: "SPP", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
