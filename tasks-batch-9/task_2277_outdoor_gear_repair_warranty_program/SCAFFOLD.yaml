      - "Customer.trade_in_credit_cents += trade_in_credit_cents"
      - "the driving WarrantyClaim -> CLOSED_REPLACED, its OPEN LiabilityEntry rows -> RELEASED (release_reason CLAIM_CLOSED), ServiceCenter.open_liability_cents and liability_posture recomputed"
  - method: POST
    path: "/gear-service/gear-items/{id}/disposition"
    description: "move a traded-in unit through the refurbished resale channel"
    roles: [PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["to", "sale_price_cents?"]
    output: GearItem
    side_effects: ["disposition_status -> to", "resale_price_cents stamped when to == RESOLD"]

  # ---------------------------------------------------------------- technicians & blocks
  - method: POST
    path: "/gear-service/technicians"
    description: "register a bench technician with a certification matrix"
    roles: [ProgramAdmin]
    code: 201
    input: ["service_center_id", "employee_code", "full_name", "certifications", "status?"]
    output: Technician
    side_effects: ["scheduled_minutes_open = 0, completed_minutes = 0"]
  - method: GET
    path: "/gear-service/technicians/{id}"
    description: "read a technician with the live minute counters"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/gear-service/technicians"
    description: "list technicians; service_center_id filter is the reverse-reachability channel"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["service_center_id?", "status?", "work_type?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: PATCH
    path: "/gear-service/technicians/{id}"
    description: "update a technician's roster status or certification matrix"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "certifications?"]
    output: Technician
    side_effects: ["an ON_LEAVE/INACTIVE technician leaves the routing candidate pool immediately; existing SCHEDULED blocks are untouched"]
  - method: POST
    path: "/gear-service/work-blocks"
    description: "schedule bench time; omit technician_id to invoke calculations.technician_routing_selector"
    roles: [ServiceAgent, RepairTechnician]
    code: 201
    input: ["repair_order_id", "work_type", "start_at", "end_at", "technician_id?"]
    output: WorkBlock
    side_effects:
      - "duration_minutes = whole minutes between start_at and end_at"
      - "when technician_id is omitted the selector picks the winner and sets routed_by_selector = true"
      - "Technician.scheduled_minutes_open += duration_minutes"
      - "RepairOrder.work_status QUEUED -> IN_WORK on the first block"
  - method: GET
    path: "/gear-service/work-blocks/{id}"
    description: "read a work block"
    roles: [ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: []
    output: WorkBlock
    side_effects: []
  - method: GET
    path: "/gear-service/work-blocks"
    description: "list work blocks; technician_id and repair_order_id filters are the reverse-reachability channels for both FKs"
    roles: [ServiceAgent, RepairTechnician, ProgramAdmin]
    code: 200
    input: ["technician_id?", "repair_order_id?", "work_type?", "status?", "limit?", "offset?"]
    output: WorkBlock[]
    side_effects: []
  - method: POST
    path: "/gear-service/work-blocks/{id}/cancel"
    description: "cancel a scheduled block and give its minutes back"
    roles: [ServiceAgent, RepairTechnician]
    code: 200
    input: ["reason?"]
    output: WorkBlock
    side_effects: ["status -> CANCELLED", "Technician.scheduled_minutes_open -= duration_minutes", "the window is freed for validations[priority=34]"]

  # ---------------------------------------------------------------- parts
  - method: POST
