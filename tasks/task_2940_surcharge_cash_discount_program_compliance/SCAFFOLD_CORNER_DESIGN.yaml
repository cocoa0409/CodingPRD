      - name: request_with_blank_identity_headers_is_unauthenticated
        claim_type: role_denied_operation
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Both headers must be present and non-empty: a request sending X-User-Role and X-User-ID as empty strings is refused 401 ERR_UNAUTHENTICATED, which outranks even the NOT_FOUND check on the path id."
        test_recipe:
          setup:
