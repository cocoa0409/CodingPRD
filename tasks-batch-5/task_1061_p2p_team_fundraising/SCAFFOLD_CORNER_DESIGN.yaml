            - call: "GET /api/donations"
              payload: { match_pool_id: "${pool_id}" }
              as: CampaignManager
              as_user_id: "${org_id}"
          assert:
            - "total_count == 1"
            - "rows[0].id == ${don_matched_id} with matched_amount_cents == 5000"
            - "Donation.${don_unmatched_id}.match_status == NOT_ELIGIBLE"
            - "MatchPool.${pool_id}.status == CLOSED"

