# =============================================================================
# PRD Benchmark Scaffold — Catastrophe Response & Claim Surge Staffing
# Difficulty target: beyond Expert (§0.4 Expert band, upper end)
# =============================================================================

scenario: |
  2196. Catastrophe Response & Claim Surge Staffing (insurer catastrophe team): event declaration & catastrophe code assignment, adjuster deployment (staff/independent) & housing logistics, claim triage by severity & advance payment issuance, aerial/desk adjusting for inaccessible areas, reserve setting & event loss estimation, vendor (mitigation/contractor) network activation, regulatory bulletin compliance (moratoriums/deadlines), demobilization & file transfer to routine handling

domain_name: catastrophe-response-claim-surge-staffing
api_prefix: ""   # flat topology: peer collections live at the root, there is no common path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity is addressed through a
  # nested URL path. Every collection lives at its own top-level path and is filtered
  # by FK query parameters.

  state_machine_shape: parallel
  # Claim carries two independent axes (handling_status x payment_status); Adjuster
  # carries two independent axes (deployment_status x credential_status); Claim's
  # handling axis additionally cycles (CLOSED -> REOPENED -> INSPECTION_PENDING ->
  # INSPECTED -> CLOSED). CatastropheEvent is compound (posture derived from children).

  relationship_patterns:
    - one_to_many
    - many_to_many        # InspectionAssignment joins Claim x Adjuster; VendorAssignment joins Claim x VendorFirm
    - self_referential    # ReserveEntry.reverses_entry_id -> ReserveEntry.id
    - cross_aggregate     # Deployment spans CatastropheEvent, Adjuster and HousingBlock

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CatastropheEvent
    parent: null
    common_fields: true
    fields:
      - { name: cat_code, type: string, source: input, description: "Industry catastrophe code assigned at declaration, e.g. 'CAT-2026-114'", constraints: "3-24 chars; globally unique across all CatastropheEvent rows (case-sensitive)" }
      - { name: peril_type, type: enum, source: input, description: "Peril driving the event", constraints: "HURRICANE | WILDFIRE | HAIL | FLOOD | WINTER_STORM | EARTHQUAKE" }
      - { name: jurisdiction_state, type: string, source: input, description: "Primary regulator jurisdiction (2-letter US state code, uppercase)" }
      - { name: event_start_utc, type: datetime, source: input, description: "First-loss timestamp of the event footprint (ISO 8601 UTC, 3 fractional digits)" }
      - { name: exposure_count, type: integer, source: input, description: "Number of insured risks inside the declared footprint", constraints: ">= 0" }
      - { name: avg_insured_value, type: number, source: input, description: "Average total insured value per exposed risk, in whole dollars", constraints: ">= 0" }
      - { name: expected_severity_index, type: number, source: input, description: "Underwriting-supplied damage ratio expectation for this peril footprint", constraints: "0.0 <= value <= 1.0, 4 decimal places" }
      - { name: status, type: enum, source: system, description: "Lifecycle axis: MONITORING | DECLARED | SURGE_ACTIVE | DEMOBILIZING | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "Read-only gate over child operations, recomputed by calculations.event_posture_recompute: OPEN | RESTRICTED | FROZEN" }
      - { name: declared_at_utc, type: datetime, source: system, description: "Logical-clock timestamp stamped when status became DECLARED; null while MONITORING" }
      - { name: open_claim_count, type: integer, source: computed, description: "Read-only: count of Claim rows with event_id == this.id and handling_status NOT IN {CLOSED, TRANSFERRED}" }
      - { name: case_reserve_total, type: number, source: computed, description: "Read-only: sum of ReserveEntry.delta_case_reserve over all ReserveEntry with event_id == this.id, 2dp" }
      - { name: paid_total, type: number, source: computed, description: "Read-only: sum of ReserveEntry.delta_paid over all ReserveEntry with event_id == this.id, 2dp" }
      - { name: incurred_total, type: number, source: computed, description: "Read-only: case_reserve_total + paid_total, 2dp. Conserved quantity of invariant reserve_conservation" }
      - { name: housing_committed_cost, type: number, source: computed, description: "Read-only: sum over HousingBlock rows with event_id == this.id and status IN {PENDING, ACTIVE, EXHAUSTED} of (nightly_rate * rooms_total * block_night_count), 2dp" }
      - { name: deployment_settled_cost, type: number, source: computed, description: "Read-only: sum of Deployment.final_settled_cost over Deployment with event_id == this.id and status == DEMOBILIZED, 2dp" }
      - { name: gross_loss_estimate, type: number, source: computed, description: "Read-only: gross_estimate of the LossEstimateSnapshot with event_id == this.id having the greatest computed_at_utc; ties broken by created_at ASC (earliest wins); 0.00 when no snapshot exists" }
      - { name: moratorium_active, type: boolean, source: computed, description: "Read-only: true iff at least one RegulatoryBulletin with event_id == this.id has bulletin_type == CANCELLATION_MORATORIUM, status == EFFECTIVE, and effective_from <= clock_now < effective_to" }
      - { name: surge_adjuster_count, type: integer, source: computed, description: "Read-only: count of Deployment rows with event_id == this.id and status IN {CONFIRMED, ON_SITE}" }

  - name: RegulatoryBulletin
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CatastropheEvent.id; the event this bulletin regulates" }
      - { name: bulletin_number, type: string, source: input, description: "Regulator-issued bulletin identifier", constraints: "unique per (event_id, bulletin_number)" }
      - { name: jurisdiction_state, type: string, source: input, description: "2-letter uppercase state code the bulletin binds" }
      - { name: bulletin_type, type: enum, source: input, description: "CANCELLATION_MORATORIUM | CLAIM_DEADLINE_EXTENSION | ADVANCE_PAYMENT_MANDATE | ADJUSTER_LICENSE_WAIVER" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | EXPIRED | WITHDRAWN" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the bulletin's binding window (ISO 8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the bulletin's binding window (ISO 8601 UTC); must be > effective_from" }
      - { name: mandated_advance_pct, type: number, source: input, default: 0.0, description: "For ADVANCE_PAYMENT_MANDATE: minimum fraction of Claim.reported_loss_amount that must be advanced", constraints: "0.0 <= value <= 1.0, 4 decimal places" }
      - { name: deadline_extension_days, type: integer, source: input, default: 0, description: "For CLAIM_DEADLINE_EXTENSION: whole days added to Claim.deadline_utc", constraints: ">= 0 and <= 365" }
      - { name: activated_at_utc, type: datetime, source: system, description: "Logical-clock timestamp when status became EFFECTIVE; null while DRAFT" }

  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Adjuster display name" }
      - { name: employment_type, type: enum, source: input, description: "STAFF | INDEPENDENT — drives cost formulas and license waiver eligibility" }
      - { name: home_state, type: string, source: input, description: "2-letter uppercase resident state code" }
      - { name: licensed_states, type: array, source: input, description: "Array of 2-letter uppercase state codes the adjuster holds an active licence in" }
      - { name: license_expiry_utc, type: datetime, source: input, description: "Expiry instant of the adjuster's licence (ISO 8601 UTC)" }
      - { name: credential_status, type: enum, source: system, description: "Credential axis (independent of deployment_status): VALID | EXPIRING | EXPIRED | WAIVED" }
      - { name: deployment_status, type: enum, source: system, description: "Deployment axis (independent of credential_status): AVAILABLE | DEPLOYED | RESTING | UNAVAILABLE" }
      - { name: desk_certified, type: boolean, source: input, default: false, description: "Eligible for DESK inspection assignments" }
      - { name: aerial_certified, type: boolean, source: input, default: false, description: "Eligible for AERIAL inspection assignments" }
      - { name: max_open_claims, type: integer, source: input, description: "Hard ceiling on concurrently open inspection assignments", constraints: ">= 1 and <= 60" }
      - { name: open_assignment_count, type: integer, source: computed, description: "Read-only: count of InspectionAssignment with adjuster_id == this.id and status IN {SCHEDULED, IN_PROGRESS}" }
      - { name: daily_rate, type: number, source: input, description: "Contracted day rate in whole dollars", constraints: "> 0" }
      - { name: per_diem_rate, type: number, source: input, description: "Daily per-diem in whole dollars", constraints: ">= 0" }
      - { name: surge_capacity_score, type: number, source: computed, description: "Read-only output of calculations.adjuster_surge_capacity_score, 2dp; ranking key for the deployment selector" }
      - { name: cumulative_deployed_hours, type: number, source: computed, description: "Read-only: sum over Deployment with adjuster_id == this.id and status IN {ON_SITE, DEMOBILIZED} of (window_end_utc - window_start_utc) in hours, 2dp" }
      - { name: last_demobilized_at_utc, type: datetime, source: system, description: "Logical-clock timestamp of the most recent Deployment transition into DEMOBILIZED for this adjuster; null if never demobilized" }

  - name: HousingBlock
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CatastropheEvent.id; the event this room block supports" }
      - { name: hotel_name, type: string, source: input, description: "Property name" }
      - { name: city, type: string, source: input, description: "Staging city" }
      - { name: rooms_total, type: integer, source: input, description: "Rooms held in the block", constraints: ">= 0 and <= 400" }
      - { name: rooms_occupied, type: integer, source: computed, description: "Read-only: sum of Deployment.rooms_reserved over Deployment with housing_block_id == this.id and status IN {CONFIRMED, ON_SITE}" }
      - { name: rooms_available, type: integer, source: computed, description: "Read-only: rooms_total - rooms_occupied. Conserved quantity of invariant housing_room_conservation" }
      - { name: nightly_rate, type: number, source: input, description: "Per-room nightly rate in whole dollars", constraints: "> 0" }
      - { name: block_start_date, type: datetime, source: input, description: "First night of the block, inclusive (ISO 8601 UTC, midnight-aligned)" }
      - { name: block_end_date, type: datetime, source: input, description: "Checkout morning, exclusive as a night but inclusive as a same-day turnover date (ISO 8601 UTC, midnight-aligned); must be > block_start_date" }
      - { name: block_night_count, type: integer, source: computed, description: "Read-only: whole days between block_start_date and block_end_date (exclusive end)" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXHAUSTED | RELEASED" }

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CatastropheEvent.id; the event the adjuster is surged onto" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; the deployed adjuster. Null when the request asked the server to select one" }
      - { name: housing_block_id, type: string, source: input, description: "FK -> HousingBlock.id; the room block backing this deployment; null for DESK deployments" }
      - { name: role_type, type: enum, source: input, description: "FIELD | DESK | AERIAL" }
      - { name: window_start_utc, type: datetime, source: input, description: "Half-open occupancy start, inclusive (ISO 8601 UTC)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Half-open occupancy end, exclusive (ISO 8601 UTC); must be > window_start_utc" }
      - { name: rooms_reserved, type: integer, source: input, default: 1, description: "Rooms drawn from housing_block_id while CONFIRMED or ON_SITE", constraints: ">= 0 and <= 4; must be 0 when role_type == DESK" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | ON_SITE | DEMOBILIZED | CANCELLED" }
      - { name: selection_reason, type: enum, source: system, description: "EXPLICIT_ADJUSTER | SELECTOR_RANKED — records whether the client pinned adjuster_id or the server ranked a pool" }
      - { name: provisional_cost, type: number, source: computed, description: "Read-only output of calculations.deployment_cost variant PROVISIONAL, 2dp; stamped on CONFIRMED" }
      - { name: final_settled_cost, type: number, source: computed, description: "Read-only output of calculations.deployment_cost variant FINAL_SETTLED, 2dp; stamped on DEMOBILIZED, else 0.00" }
      - { name: surge_premium_tier, type: enum, source: computed, description: "Read-only tier picked by calculations.deployment_cost step 4: TIER_NONE | TIER_MID | TIER_HIGH" }
      - { name: demobilized_at_utc, type: datetime, source: system, description: "Logical-clock timestamp of the transition into DEMOBILIZED; null otherwise" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CatastropheEvent.id; null at intake until a cat code is assigned" }
      - { name: policy_number, type: string, source: input, description: "Policy identifier", constraints: "unique per (policy_number, loss_date_utc)" }
      - { name: loss_state, type: string, source: input, description: "2-letter uppercase state code where the loss occurred" }
      - { name: loss_date_utc, type: datetime, source: input, description: "Date of loss (ISO 8601 UTC)" }
      - { name: reported_at_utc, type: datetime, source: system, description: "Logical-clock timestamp at intake" }
      - { name: reported_loss_amount, type: number, source: input, description: "First-notice-of-loss estimate in whole dollars", constraints: ">= 0" }
      - { name: coverage_lines, type: array, source: input, description: "Ordered array of objects { coverage_code (DWELLING|CONTENTS|ALE|OTHER_STRUCTURES), limit_amount, deductible_amount, estimated_damage_amount }; array order is the pinned iteration order for calculations.advance_payment_amount", constraints: "1 to 6 entries; coverage_code unique within the array" }
      - { name: access_status, type: enum, source: input, default: "ACCESSIBLE", description: "ACCESSIBLE | INACCESSIBLE | RESTRICTED — footprint accessibility asserted at intake or by a field report" }
      - { name: handling_status, type: enum, source: system, description: "Handling axis (independent of payment_status): INTAKE | TRIAGED | INSPECTION_PENDING | INSPECTED | CLOSED | REOPENED | TRANSFERRED" }
      - { name: payment_status, type: enum, source: system, description: "Payment axis (independent of handling_status): NONE | ADVANCE_ISSUED | PARTIAL_PAID | SETTLED" }
      - { name: severity_score, type: number, source: computed, description: "Read-only output of calculations.claim_triage_severity_score, 2dp; 0.00 while INTAKE" }
      - { name: triage_tier, type: enum, source: computed, description: "Read-only band derived from severity_score by calculations.claim_triage_severity_score: FAST_TRACK | STANDARD | COMPLEX | CAT_SEVERE" }
      - { name: inspection_mode, type: enum, source: computed, description: "Read-only mode required for this claim, from calculations.inspection_mode_resolution: FIELD | DESK | AERIAL" }
      - { name: advance_cap, type: number, source: computed, description: "Read-only ceiling on cumulative advance payments from calculations.advance_payment_amount step 5, 2dp" }
      - { name: advance_paid_total, type: number, source: computed, description: "Read-only: sum of AdvancePayment.amount over AdvancePayment with claim_id == this.id and status == ISSUED, 2dp" }
      - { name: case_reserve, type: number, source: computed, description: "Read-only: sum of ReserveEntry.delta_case_reserve over ReserveEntry with claim_id == this.id, 2dp" }
      - { name: paid_amount, type: number, source: computed, description: "Read-only: sum of ReserveEntry.delta_paid over ReserveEntry with claim_id == this.id, 2dp" }
      - { name: verified_damage_amount, type: number, source: computed, description: "Read-only: verified_damage_amount of the InspectionAssignment with claim_id == this.id, status == COMPLETED, having the greatest report_submitted_at_utc; ties broken by created_at ASC; null when no completed inspection exists" }
      - { name: deadline_utc, type: datetime, source: computed, description: "Read-only statutory acknowledgement deadline from calculations.claim_deadline_resolution" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Read-only: number of completed CLOSED -> REOPENED transitions on this claim" }
      - { name: closing_examiner_user_id, type: string, source: system, description: "X-User-ID of the ClaimsExaminer who closed the claim; null while open. Segregation-of-duties anchor" }
      - { name: advance_issuing_examiner_user_id, type: string, source: system, description: "X-User-ID of the ClaimsExaminer who issued the first AdvancePayment on this claim; null when none. Segregation-of-duties anchor" }
      - { name: transfer_batch_id, type: string, source: system, description: "FK -> FileTransferBatch.id; set when the claim joins a demobilization batch, null otherwise" }

  - name: InspectionAssignment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being inspected" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; null when the request asked the server to select one" }
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; the deployment that funds this assignment; null for DESK assignments" }
      - { name: mode, type: enum, source: input, description: "FIELD | DESK | AERIAL — must equal Claim.inspection_mode at scheduling time" }
      - { name: window_start_utc, type: datetime, source: input, description: "Half-open assignment start, inclusive (ISO 8601 UTC)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Half-open assignment end, exclusive (ISO 8601 UTC); must be > window_start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | NO_ACCESS | CANCELLED" }
      - { name: verified_damage_amount, type: number, source: input, description: "Damage figure submitted with the completion report, whole dollars", constraints: ">= 0; required on completion, null before" }
      - { name: report_submitted_at_utc, type: datetime, source: system, description: "Logical-clock timestamp of the transition into COMPLETED or NO_ACCESS; null otherwise" }
      - { name: selection_reason, type: enum, source: system, description: "EXPLICIT_ADJUSTER | SELECTOR_RANKED" }

  - name: AdvancePayment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being advanced against" }
      - { name: reserve_entry_id, type: string, source: system, description: "FK -> ReserveEntry.id; the PAYMENT entry minted by issuance" }
      - { name: requested_amount, type: number, source: input, description: "Amount the examiner asked for, whole dollars or cents", constraints: "> 0" }
      - { name: amount, type: number, source: computed, description: "Read-only issued amount from calculations.advance_payment_amount, 2dp; may be less than requested_amount when capped" }
      - { name: basis, type: enum, source: input, description: "ALE_MANDATE | STRUCTURE_PARTIAL | CONTENTS_PARTIAL" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }
      - { name: void_reason, type: string, source: input, description: "Free-text reason recorded on void; null while ISSUED" }
      - { name: voided_at_utc, type: datetime, source: system, description: "Logical-clock timestamp of the transition into VOIDED; null while ISSUED" }

  - name: ReserveEntry
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CatastropheEvent.id; denormalised from the claim for event roll-ups" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim whose reserve moved" }
      - { name: reverses_entry_id, type: string, source: system, description: "FK -> ReserveEntry.id; self-reference set only on entry_type == REVERSAL, null otherwise" }
      - { name: entry_type, type: enum, source: system, description: "INITIAL_CASE | REVISION | PAYMENT | REVERSAL" }
      - { name: delta_case_reserve, type: number, source: system, description: "Signed change to case reserve in dollars, 2dp" }
      - { name: delta_paid, type: number, source: system, description: "Signed change to paid loss in dollars, 2dp" }
      - { name: sequence_no, type: integer, source: system, description: "Per-event monotone sequence starting at 1, assigned in append order; the pinned replay order for calculations.event_loss_estimate variant INCURRED_DEVELOPMENT" }
      - { name: effective_utc, type: datetime, source: system, description: "Logical-clock timestamp at append time (ISO 8601 UTC)" }
      - { name: memo, type: string, source: system, description: "Machine-generated description of the originating action" }

  - name: VendorFirm
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Vendor legal name", constraints: "globally unique" }
      - { name: vendor_type, type: enum, source: input, description: "MITIGATION | TARP | TREE_REMOVAL | CONTRACTOR" }
      - { name: service_states, type: array, source: input, description: "Array of 2-letter uppercase state codes the firm is licensed to work in" }
      - { name: status, type: enum, source: system, description: "NETWORK_INACTIVE | ACTIVATED | CAPACITY_HOLD | SUSPENDED" }
      - { name: activated_for_event_id, type: string, source: system, description: "FK -> CatastropheEvent.id; the event this firm is activated onto; null while NETWORK_INACTIVE or SUSPENDED" }
      - { name: max_concurrent_jobs, type: integer, source: input, description: "Concurrency ceiling on open vendor jobs", constraints: ">= 1 and <= 200" }
      - { name: open_job_count, type: integer, source: computed, description: "Read-only: count of VendorAssignment with vendor_firm_id == this.id and status IN {DISPATCHED, ACCEPTED}" }
      - { name: performance_score, type: number, source: input, description: "Network scorecard, 0-100, 2dp; ranking key for the vendor selector", constraints: "0 <= value <= 100" }

  - name: VendorAssignment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim needing mitigation work" }
      - { name: vendor_firm_id, type: string, source: input, description: "FK -> VendorFirm.id; null when the request asked the server to select one" }
      - { name: scope_amount, type: number, source: input, description: "Authorised scope of work in whole dollars", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DISPATCHED | ACCEPTED | COMPLETED | DECLINED | CANCELLED" }
      - { name: dispatched_at_utc, type: datetime, source: system, description: "Logical-clock timestamp at dispatch" }
      - { name: selection_reason, type: enum, source: system, description: "EXPLICIT_VENDOR | SELECTOR_RANKED" }

  - name: LossEstimateSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CatastropheEvent.id; the event estimated" }
      - { name: method, type: enum, source: input, description: "EXPOSURE_BASED | INCURRED_DEVELOPMENT — the two variants of calculations.event_loss_estimate" }
      - { name: gross_estimate, type: number, source: computed, description: "Read-only output of calculations.event_loss_estimate for the chosen method, 2dp" }
      - { name: ibnr_component, type: number, source: computed, description: "Read-only incurred-but-not-reported loading inside gross_estimate, 2dp" }
      - { name: reported_component, type: number, source: computed, description: "Read-only reported/incurred portion of gross_estimate, 2dp" }
      - { name: input_reserve_sequence_high_water, type: integer, source: system, description: "Greatest ReserveEntry.sequence_no for this event at snapshot time; 0 when none existed" }
      - { name: stale, type: boolean, source: computed, description: "Read-only: true iff a ReserveEntry with event_id == this.id exists whose sequence_no > input_reserve_sequence_high_water" }
      - { name: computed_at_utc, type: datetime, source: system, description: "Logical-clock timestamp at snapshot time (ISO 8601 UTC)" }

  - name: FileTransferBatch
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CatastropheEvent.id; the demobilizing event whose files move to routine handling" }
      - { name: target_unit, type: string, source: input, description: "Receiving routine-handling unit code, e.g. 'PROPERTY-EAST'" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: claim_count, type: integer, source: computed, description: "Read-only: count of Claim rows with transfer_batch_id == this.id" }
      - { name: blocking_claim_count, type: integer, source: computed, description: "Read-only: count of Claim rows with transfer_batch_id == this.id and (payment_status == ADVANCE_ISSUED or case_reserve == 0)" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical-clock timestamp of the transition into SUBMITTED; null otherwise" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded by the receiving unit on REJECTED; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CatastropheEvent
    initial_state: MONITORING
    terminal_states: [CLOSED]
    transitions:
      - from: MONITORING
        to: DECLARED
        trigger: "POST /catastrophe-events/{eventId}/declare"
        actor: CatastropheManager
        preconditions:
          - "Event status == MONITORING (ERR_EVENT_NOT_MONITORING)"
          - "cat_code is set and no other CatastropheEvent holds the same cat_code (ERR_CAT_CODE_TAKEN)"
        side_effects:
          - "declared_at_utc = clock_now"
          - "status = DECLARED; the event becomes the only legal target for POST /claims/{claimId}/assign-cat-code"
          - "posture recomputed via calculations.event_posture_recompute (MONITORING events always read OPEN)"
        note: "Declaration is the gate for every claim/deployment/vendor operation on the event."
      - from: DECLARED
        to: SURGE_ACTIVE
        trigger: "POST /catastrophe-events/{eventId}/activate-surge"
        actor: CatastropheManager
        preconditions:
          - "Event status == DECLARED (ERR_EVENT_NOT_DECLARED)"
          - "At least one HousingBlock with event_id == this.id and status == ACTIVE exists (ERR_NO_ACTIVE_HOUSING)"
          - "At least one LossEstimateSnapshot with event_id == this.id exists whose stale == false (ERR_LOSS_ESTIMATE_STALE)"
        side_effects:
          - "posture recomputed via calculations.event_posture_recompute"
      - from: SURGE_ACTIVE
        to: DEMOBILIZING
        trigger: "POST /catastrophe-events/{eventId}/demobilize"
        actor: CatastropheManager
        preconditions:
          - "Event status == SURGE_ACTIVE (ERR_EVENT_NOT_SURGE_ACTIVE)"
          - "moratorium_active == false (ERR_MORATORIUM_ACTIVE)"
          - "No Claim with event_id == this.id has handling_status IN {INTAKE, TRIAGED} (ERR_UNTRIAGED_CLAIMS_REMAIN)"
        side_effects:
          - "Every Deployment with event_id == this.id and status == REQUESTED -> CANCELLED (housing rooms never having been drawn, rooms_occupied unchanged)"
          - "posture recomputed; DEMOBILIZING events read RESTRICTED at minimum"
      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /catastrophe-events/{eventId}/close"
        actor: CatastropheManager
        preconditions:
          - "Event status == DEMOBILIZING (ERR_EVENT_NOT_DEMOBILIZING)"
          - "No Deployment with event_id == this.id has status IN {REQUESTED, CONFIRMED, ON_SITE} (ERR_DEPLOYMENTS_STILL_OPEN)"
          - "Every Claim with event_id == this.id has handling_status IN {CLOSED, TRANSFERRED} (ERR_CLAIMS_STILL_OPEN)"
          - "Every FileTransferBatch with event_id == this.id has status == ACCEPTED (ERR_TRANSFER_BATCH_UNACCEPTED)"
        side_effects:
          - "Every HousingBlock with event_id == this.id and status IN {PENDING, ACTIVE, EXHAUSTED} -> RELEASED"
          - "Every VendorFirm with activated_for_event_id == this.id -> NETWORK_INACTIVE, activated_for_event_id = null"
          - "posture = FROZEN"
      - from: DECLARED
        to: CLOSED
        trigger: "POST /catastrophe-events/{eventId}/close"
        actor: CatastropheManager
        preconditions:
          - "Event status == DECLARED and open_claim_count == 0 and surge_adjuster_count == 0 (ERR_EVENT_NOT_STANDDOWN_ELIGIBLE)"
        side_effects:
          - "Every HousingBlock with event_id == this.id and status IN {PENDING, ACTIVE} -> RELEASED"
          - "posture = FROZEN"
        note: "Stand-down branch: a declared event that never surged closes directly, skipping DEMOBILIZING. Branch side-effect set is strictly smaller than the DEMOBILIZING -> CLOSED branch (no vendor deactivation, no transfer-batch gate)."

  - entity: RegulatoryBulletin
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /regulatory-bulletins/{bulletinId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Bulletin status == DRAFT (ERR_BULLETIN_NOT_DRAFT)"
          - "Parent CatastropheEvent.status IN {DECLARED, SURGE_ACTIVE} (ERR_EVENT_NOT_DECLARED)"
          - "bulletin.jurisdiction_state == parent CatastropheEvent.jurisdiction_state (ERR_JURISDICTION_MISMATCH)"
        side_effects:
          - "activated_at_utc = clock_now"
          - "For bulletin_type == CLAIM_DEADLINE_EXTENSION: every Claim with event_id == this.event_id and handling_status NOT IN {CLOSED, TRANSFERRED} has deadline_utc recomputed via calculations.claim_deadline_resolution"
          - "For bulletin_type == CANCELLATION_MORATORIUM: parent event moratorium_active recomputed; parent event posture recomputed via calculations.event_posture_recompute"
      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system (evaluated on every read and write once clock_now >= effective_to)"
        actor: system
        preconditions:
          - "clock_now >= effective_to"
        side_effects:
          - "Parent event moratorium_active recomputed; parent event posture recomputed"
          - "Claim.deadline_utc recomputed for every Claim with event_id == this.event_id and handling_status NOT IN {CLOSED, TRANSFERRED}"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /regulatory-bulletins/{bulletinId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Bulletin status IN {DRAFT, EFFECTIVE} (ERR_BULLETIN_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: EFFECTIVE
        to: WITHDRAWN
        trigger: "POST /regulatory-bulletins/{bulletinId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Bulletin status IN {DRAFT, EFFECTIVE} (ERR_BULLETIN_NOT_WITHDRAWABLE)"
        side_effects:
          - "Parent event moratorium_active recomputed; parent event posture recomputed"
          - "Claim.deadline_utc recomputed for every Claim with event_id == this.event_id and handling_status NOT IN {CLOSED, TRANSFERRED}"

  - entity: Adjuster
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DEPLOYED
        trigger: "system (a Deployment for this adjuster transitions REQUESTED -> CONFIRMED)"
        actor: system
        preconditions:
          - "Adjuster.deployment_status == AVAILABLE"
        side_effects:
          - "surge_capacity_score recomputed via calculations.adjuster_surge_capacity_score"
        note: "Deployment axis. Independent of credential_status: a WAIVED adjuster can be DEPLOYED, and an AVAILABLE adjuster can be EXPIRED."
      - from: DEPLOYED
        to: RESTING
        trigger: "system (link 2 of cascade demobilize_deployment_chain: a Deployment for this adjuster transitions to DEMOBILIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "last_demobilized_at_utc = clock_now"
          - "Link 3 (caused by this adjuster leaving DEPLOYED): every InspectionAssignment with adjuster_id == this.id and status IN {SCHEDULED, IN_PROGRESS} -> CANCELLED"
          - "surge_capacity_score recomputed"
      - from: RESTING
        to: AVAILABLE
        trigger: "system (evaluated on every read and write once clock_now >= last_demobilized_at_utc + REST_BUFFER_HOURS)"
        actor: system
        preconditions:
          - "clock_now >= last_demobilized_at_utc + REST_BUFFER_HOURS (12 hours)"
        side_effects:
          - "surge_capacity_score recomputed"
        note: "Cycle: AVAILABLE -> DEPLOYED -> RESTING -> AVAILABLE."
      - from: AVAILABLE
        to: UNAVAILABLE
        trigger: "POST /adjusters/{adjusterId}/set-unavailable"
        actor: DeploymentCoordinator
        preconditions:
          - "Adjuster.deployment_status == AVAILABLE (ERR_ADJUSTER_NOT_AVAILABLE)"
        side_effects: []
      - from: UNAVAILABLE
        to: AVAILABLE
        trigger: "POST /adjusters/{adjusterId}/set-available"
        actor: DeploymentCoordinator
        preconditions:
          - "Adjuster.deployment_status == UNAVAILABLE (ERR_ADJUSTER_NOT_UNAVAILABLE)"
        side_effects:
          - "surge_capacity_score recomputed"
      - from: VALID
        to: EXPIRING
        trigger: "system (evaluated on every read and write once clock_now >= license_expiry_utc - 30 days)"
        actor: system
        preconditions:
          - "clock_now >= license_expiry_utc - LICENSE_WARNING_DAYS (30 days) and clock_now < license_expiry_utc"
        side_effects:
          - "surge_capacity_score recomputed (EXPIRING applies a -15 credential penalty)"
        note: "Credential axis, evolving independently of deployment_status on the same row."
      - from: EXPIRING
        to: EXPIRED
        trigger: "system (evaluated on every read and write once clock_now >= license_expiry_utc)"
        actor: system
        preconditions:
          - "clock_now >= license_expiry_utc"
        side_effects:
          - "surge_capacity_score recomputed"
          - "Every InspectionAssignment with adjuster_id == this.id and status == SCHEDULED -> CANCELLED"
      - from: EXPIRED
        to: WAIVED
        trigger: "POST /adjusters/{adjusterId}/apply-license-waiver"
        actor: ComplianceOfficer
        preconditions:
          - "Adjuster.credential_status == EXPIRED (ERR_CREDENTIAL_NOT_EXPIRED)"
          - "An ADJUSTER_LICENSE_WAIVER RegulatoryBulletin exists with status == EFFECTIVE, jurisdiction_state == body.event's jurisdiction_state, and effective_from <= clock_now < effective_to (ERR_NO_LICENSE_WAIVER_IN_FORCE)"
          - "Adjuster.employment_type == INDEPENDENT (ERR_WAIVER_NOT_ELIGIBLE)"
        side_effects:
          - "surge_capacity_score recomputed (WAIVED applies a -8 credential penalty)"
      - from: WAIVED
        to: EXPIRED
        trigger: "system (evaluated on every read and write once the sustaining ADJUSTER_LICENSE_WAIVER bulletin leaves EFFECTIVE or its window ends)"
        actor: system
        preconditions:
          - "No ADJUSTER_LICENSE_WAIVER RegulatoryBulletin with status == EFFECTIVE covers clock_now for this adjuster's licensed jurisdiction"
        side_effects:
          - "surge_capacity_score recomputed"
          - "Every InspectionAssignment with adjuster_id == this.id and status == SCHEDULED -> CANCELLED"
        note: "Credential-axis cycle: EXPIRED -> WAIVED -> EXPIRED."

  - entity: HousingBlock
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /housing-blocks/{housingBlockId}/open"
        actor: DeploymentCoordinator
        preconditions:
          - "HousingBlock.status == PENDING (ERR_HOUSING_NOT_PENDING)"
          - "rooms_total >= 1 (ERR_HOUSING_BLOCK_EMPTY)"
          - "Parent CatastropheEvent.status IN {DECLARED, SURGE_ACTIVE} (ERR_EVENT_NOT_DECLARED)"
        side_effects:
          - "Parent CatastropheEvent.housing_committed_cost recomputed"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (a Deployment transition REQUESTED -> CONFIRMED drives rooms_available to exactly 0)"
        actor: system
        preconditions:
          - "rooms_available == 0 after the draw"
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (link 2 of cascade cancel_deployment_chain: rooms are returned and rooms_available becomes >= 1)"
        actor: system
        preconditions:
          - "rooms_available >= 1 after the return"
        side_effects: []
        note: "Cycle: ACTIVE -> EXHAUSTED -> ACTIVE."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /housing-blocks/{housingBlockId}/release"
        actor: DeploymentCoordinator
        preconditions:
          - "HousingBlock.status IN {PENDING, ACTIVE, EXHAUSTED} (ERR_HOUSING_NOT_RELEASABLE)"
          - "rooms_occupied == 0 (ERR_HOUSING_STILL_OCCUPIED)"
        side_effects:
          - "Parent CatastropheEvent.housing_committed_cost recomputed (released blocks drop out of the sum)"
      - from: PENDING
        to: RELEASED
        trigger: "POST /housing-blocks/{housingBlockId}/release"
        actor: DeploymentCoordinator
        preconditions:
          - "HousingBlock.status IN {PENDING, ACTIVE, EXHAUSTED} (ERR_HOUSING_NOT_RELEASABLE)"
          - "rooms_occupied == 0 (ERR_HOUSING_STILL_OCCUPIED)"
        side_effects: []
      - from: EXHAUSTED
        to: RELEASED
        trigger: "system (parent CatastropheEvent transitions DEMOBILIZING -> CLOSED or DECLARED -> CLOSED)"
        actor: system
        preconditions:
          - "rooms_occupied == 0 (guaranteed by the event's ERR_DEPLOYMENTS_STILL_OPEN precondition)"
        side_effects:
          - "Parent CatastropheEvent.housing_committed_cost recomputed"

  - entity: Deployment
    initial_state: REQUESTED
    terminal_states: [DEMOBILIZED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /deployments/{deploymentId}/confirm"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status == REQUESTED (ERR_DEPLOYMENT_NOT_REQUESTED)"
          - "Parent CatastropheEvent.posture IN {OPEN, RESTRICTED} (ERR_EVENT_POSTURE_FROZEN)"
          - "Adjuster.deployment_status == AVAILABLE (ERR_ADJUSTER_NOT_AVAILABLE) -- cross-entity dependency Deployment -> Adjuster"
          - "Adjuster.credential_status IN {VALID, EXPIRING, WAIVED} (ERR_ADJUSTER_CREDENTIAL_INVALID)"
          - "Adjuster.licensed_states contains parent CatastropheEvent.jurisdiction_state, OR Adjuster.credential_status == WAIVED (ERR_ADJUSTER_NOT_LICENSED_IN_STATE)"
          - "No other Deployment for this adjuster with status IN {CONFIRMED, ON_SITE, DEMOBILIZED} has a window within REST_BUFFER_HOURS of this window per validations priority 23 (ERR_DEPLOYMENT_WINDOW_CONFLICT)"
          - "When role_type != DESK: housing_block_id is set, HousingBlock.status == ACTIVE, and HousingBlock.rooms_available >= rooms_reserved (ERR_HOUSING_CAPACITY_EXCEEDED) -- cross-entity dependency Deployment -> HousingBlock"
        side_effects:
          - "provisional_cost stamped from calculations.deployment_cost variant PROVISIONAL; surge_premium_tier stamped"
          - "HousingBlock.rooms_occupied += rooms_reserved; rooms_available recomputed"
          - "If HousingBlock.rooms_available becomes 0: HousingBlock ACTIVE -> EXHAUSTED"
          - "Adjuster.deployment_status AVAILABLE -> DEPLOYED"
          - "Parent CatastropheEvent.surge_adjuster_count and posture recomputed"
      - from: CONFIRMED
        to: ON_SITE
        trigger: "POST /deployments/{deploymentId}/check-in"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status == CONFIRMED (ERR_DEPLOYMENT_NOT_CONFIRMED)"
          - "clock_now >= window_start_utc (ERR_DEPLOYMENT_WINDOW_NOT_STARTED)"
        side_effects:
          - "Adjuster.cumulative_deployed_hours recomputed"
      - from: ON_SITE
        to: DEMOBILIZED
        trigger: "POST /deployments/{deploymentId}/demobilize"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status IN {CONFIRMED, ON_SITE} (ERR_DEPLOYMENT_NOT_DEMOBILIZABLE)"
        side_effects:
          - "Link 1: demobilized_at_utc = clock_now; final_settled_cost stamped from calculations.deployment_cost variant FINAL_SETTLED; surge_premium_tier re-stamped"
          - "HousingBlock.rooms_occupied -= rooms_reserved; rooms_available recomputed; if the block was EXHAUSTED and rooms_available >= 1 it returns to ACTIVE"
          - "Link 2 (caused by link 1): Adjuster.deployment_status DEPLOYED -> RESTING, last_demobilized_at_utc = clock_now"
          - "Link 3 (caused by link 2, the adjuster leaving DEPLOYED): every InspectionAssignment with adjuster_id == this.adjuster_id and status IN {SCHEDULED, IN_PROGRESS} -> CANCELLED"
          - "Link 4 (caused by link 3, each assignment cancellation): each affected Claim with handling_status == INSPECTION_PENDING and zero remaining assignments in {SCHEDULED, IN_PROGRESS} regresses INSPECTION_PENDING -> TRIAGED"
          - "Link 5 (caused by link 4, the claim regression raising unassigned CAT_SEVERE/COMPLEX counts): parent CatastropheEvent.posture recomputed via calculations.event_posture_recompute, which may flip OPEN -> RESTRICTED"
          - "Parent CatastropheEvent.deployment_settled_cost and surge_adjuster_count recomputed"
        note: "Cascade demobilize_deployment_chain, depth 5, each link caused strictly by the previous link."
      - from: CONFIRMED
        to: DEMOBILIZED
        trigger: "POST /deployments/{deploymentId}/demobilize"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status IN {CONFIRMED, ON_SITE} (ERR_DEPLOYMENT_NOT_DEMOBILIZABLE)"
        side_effects:
          - "Identical cascade to ON_SITE -> DEMOBILIZED (links 1-5)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /deployments/{deploymentId}/cancel"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status IN {REQUESTED, CONFIRMED} (ERR_DEPLOYMENT_NOT_CANCELLABLE)"
        side_effects:
          - "No housing rooms were drawn while REQUESTED, so HousingBlock.rooms_occupied is unchanged"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /deployments/{deploymentId}/cancel"
        actor: DeploymentCoordinator
        preconditions:
          - "Deployment.status IN {REQUESTED, CONFIRMED} (ERR_DEPLOYMENT_NOT_CANCELLABLE)"
          - "No InspectionAssignment with deployment_id == this.id has status IN {IN_PROGRESS, COMPLETED} (ERR_ASSIGNMENTS_IN_FLIGHT)"
        side_effects:
          - "Link 1 of cascade cancel_deployment_chain: final_settled_cost = 0.00; provisional_cost retained for audit"
          - "Link 2 (caused by link 1 releasing the draw): HousingBlock.rooms_occupied -= rooms_reserved, rooms_available restored to exactly its pre-confirm value (invariant housing_room_conservation)"
          - "Link 3 (caused by link 2): if HousingBlock was EXHAUSTED and rooms_available >= 1 it returns EXHAUSTED -> ACTIVE"
          - "Adjuster.deployment_status DEPLOYED -> RESTING with last_demobilized_at_utc = clock_now"
          - "Parent CatastropheEvent.surge_adjuster_count, housing_committed_cost and posture recomputed"
        note: "Compensating action of REQUESTED -> CONFIRMED for the conserved quantity HousingBlock.rooms_available."

  - entity: Claim
    initial_state: INTAKE
    terminal_states: [TRANSFERRED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /claims/{claimId}/triage"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.handling_status == INTAKE (ERR_CLAIM_NOT_IN_INTAKE)"
          - "Claim.event_id is not null (ERR_CLAIM_NOT_CAT_CODED)"
          - "Parent CatastropheEvent.status IN {DECLARED, SURGE_ACTIVE} (ERR_EVENT_NOT_DECLARED) -- cross-entity dependency Claim -> CatastropheEvent"
          - "Parent CatastropheEvent.posture != FROZEN (ERR_EVENT_POSTURE_FROZEN)"
        side_effects:
          - "severity_score and triage_tier stamped from calculations.claim_triage_severity_score"
          - "inspection_mode stamped from calculations.inspection_mode_resolution"
          - "deadline_utc stamped from calculations.claim_deadline_resolution"
          - "An INITIAL_CASE ReserveEntry is appended: delta_case_reserve = calculations.initial_case_reserve output, delta_paid = 0.00, sequence_no = next per-event sequence"
          - "Claim.case_reserve, parent CatastropheEvent.case_reserve_total and incurred_total recomputed"
          - "Every LossEstimateSnapshot for the event whose input_reserve_sequence_high_water < the new sequence_no flips stale = true"
          - "Parent CatastropheEvent.posture recomputed"
        note: "Handling axis. Independent of payment_status: the two axes never gate each other, so a claim may be TRIAGED while payment_status is already ADVANCE_ISSUED and vice versa."
      - from: TRIAGED
        to: INSPECTION_PENDING
        trigger: "system (an InspectionAssignment for this claim is created in SCHEDULED)"
        actor: system
        preconditions:
          - "Claim.handling_status IN {TRIAGED, REOPENED}"
        side_effects: []
      - from: REOPENED
        to: INSPECTION_PENDING
        trigger: "system (an InspectionAssignment for this claim is created in SCHEDULED)"
        actor: system
        preconditions:
          - "Claim.handling_status IN {TRIAGED, REOPENED}"
        side_effects: []
      - from: INSPECTION_PENDING
        to: TRIAGED
        trigger: "system (link 4 of cascade demobilize_deployment_chain, or the last SCHEDULED/IN_PROGRESS assignment on the claim is CANCELLED)"
        actor: system
        preconditions:
          - "Zero InspectionAssignment rows for this claim remain with status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "Parent CatastropheEvent.posture recomputed"
      - from: INSPECTION_PENDING
        to: INSPECTED
        trigger: "system (an InspectionAssignment for this claim transitions to COMPLETED or NO_ACCESS)"
        actor: system
        preconditions: []
        side_effects:
          - "verified_damage_amount refreshed from the latest COMPLETED assignment (null when the assignment ended NO_ACCESS)"
          - "A REVISION ReserveEntry is appended when verified_damage_amount is not null: delta_case_reserve = calculations.reserve_revision_delta output, delta_paid = 0.00"
          - "Claim.case_reserve, parent CatastropheEvent.case_reserve_total, incurred_total recomputed; snapshots staled"
      - from: INSPECTED
        to: CLOSED
        trigger: "POST /claims/{claimId}/close"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.handling_status == INSPECTED (ERR_CLAIM_NOT_INSPECTED)"
          - "Parent CatastropheEvent.moratorium_active == false (ERR_MORATORIUM_ACTIVE)"
          - "X-User-ID != Claim.advance_issuing_examiner_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Claim.payment_status IN {NONE, SETTLED} (ERR_ADVANCE_OUTSTANDING)"
          - "No VendorAssignment with claim_id == this.id has status IN {DISPATCHED, ACCEPTED} (ERR_VENDOR_JOB_OPEN)"
        side_effects:
          - "closing_examiner_user_id = X-User-ID"
          - "Parent CatastropheEvent.open_claim_count and posture recomputed"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /claims/{claimId}/reopen"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.handling_status == CLOSED (ERR_CLAIM_NOT_CLOSED)"
          - "Claim.reopen_count < MAX_REOPENS (2) (ERR_REOPEN_LIMIT_REACHED)"
          - "Parent CatastropheEvent.status != CLOSED (ERR_EVENT_CLOSED)"
        side_effects:
          - "reopen_count += 1; closing_examiner_user_id = null"
          - "deadline_utc recomputed via calculations.claim_deadline_resolution"
          - "Parent CatastropheEvent.open_claim_count and posture recomputed"
        note: "Handling-axis cycle: INSPECTED -> CLOSED -> REOPENED -> INSPECTION_PENDING -> INSPECTED -> CLOSED."
      - from: CLOSED
        to: TRANSFERRED
        trigger: "POST /file-transfer-batches/{batchId}/submit"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.handling_status == CLOSED and Claim.transfer_batch_id == batchId (ERR_CLAIM_NOT_TRANSFERABLE)"
        side_effects:
          - "Parent CatastropheEvent.open_claim_count and posture recomputed"
      - from: NONE
        to: ADVANCE_ISSUED
        trigger: "POST /advance-payments (an AdvancePayment for this claim is created ISSUED)"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.payment_status == NONE"
        side_effects:
          - "advance_issuing_examiner_user_id = X-User-ID when previously null"
          - "A PAYMENT ReserveEntry is appended per calculations.advance_reserve_movement: delta_paid = +amount, delta_case_reserve = -amount, sequence_no = next per-event sequence"
          - "Claim.advance_paid_total, Claim.paid_amount, Claim.case_reserve, parent CatastropheEvent.paid_total, case_reserve_total and incurred_total recomputed (incurred_total unchanged - see calculations.reserve_conservation_invariant)"
          - "Every LossEstimateSnapshot for the event whose input_reserve_sequence_high_water < the new sequence_no flips stale = true; parent CatastropheEvent.posture recomputed"
        note: "Payment axis, evolving independently of handling_status on the same row."
      - from: ADVANCE_ISSUED
        to: NONE
        trigger: "system (link 2b of cascade void_advance_chain: advance_paid_total returns to exactly 0.00)"
        actor: system
        preconditions:
          - "Claim.advance_paid_total == 0.00 after the reversal"
        side_effects:
          - "advance_issuing_examiner_user_id is retained (the segregation-of-duties record is not erased by a void)"
      - from: ADVANCE_ISSUED
        to: PARTIAL_PAID
        trigger: "POST /claims/{claimId}/reserve-entries with entry_type == PAYMENT and settles_claim == false"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.payment_status IN {NONE, ADVANCE_ISSUED}"
        side_effects:
          - "Claim.paid_amount, case_reserve, parent event roll-ups recomputed; snapshots staled"
      - from: NONE
        to: PARTIAL_PAID
        trigger: "POST /claims/{claimId}/reserve-entries with entry_type == PAYMENT and settles_claim == false"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.payment_status IN {NONE, ADVANCE_ISSUED}"
        side_effects:
          - "Claim.paid_amount, case_reserve, parent event roll-ups recomputed; snapshots staled"
      - from: PARTIAL_PAID
        to: SETTLED
        trigger: "POST /claims/{claimId}/reserve-entries with entry_type == PAYMENT and settles_claim == true"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.payment_status IN {ADVANCE_ISSUED, PARTIAL_PAID}"
          - "Claim.handling_status == INSPECTED (ERR_CLAIM_NOT_INSPECTED)"
        side_effects:
          - "Residual case reserve is zeroed by the same entry: delta_case_reserve = -Claim.case_reserve"
          - "Claim.paid_amount, case_reserve, parent event roll-ups recomputed; snapshots staled"
      - from: ADVANCE_ISSUED
        to: SETTLED
        trigger: "POST /claims/{claimId}/reserve-entries with entry_type == PAYMENT and settles_claim == true"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.payment_status IN {ADVANCE_ISSUED, PARTIAL_PAID}"
          - "Claim.handling_status == INSPECTED (ERR_CLAIM_NOT_INSPECTED)"
        side_effects:
          - "Residual case reserve is zeroed by the same entry: delta_case_reserve = -Claim.case_reserve"
          - "Claim.paid_amount, case_reserve, parent event roll-ups recomputed; snapshots staled"

  - entity: InspectionAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_ACCESS, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspection-assignments/{assignmentId}/start"
        actor: Adjuster
        preconditions:
          - "Assignment.status == SCHEDULED (ERR_ASSIGNMENT_NOT_SCHEDULED)"
          - "X-User-ID == Assignment.adjuster_id (ERR_NOT_ASSIGNED_ADJUSTER)"
          - "clock_now >= window_start_utc (ERR_ASSIGNMENT_WINDOW_NOT_STARTED)"
          - "Adjuster.credential_status IN {VALID, EXPIRING, WAIVED} (ERR_ADJUSTER_CREDENTIAL_INVALID) -- cross-entity dependency InspectionAssignment -> Adjuster"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /inspection-assignments/{assignmentId}/complete"
        actor: Adjuster
        preconditions:
          - "Assignment.status == IN_PROGRESS (ERR_ASSIGNMENT_NOT_IN_PROGRESS)"
          - "X-User-ID == Assignment.adjuster_id (ERR_NOT_ASSIGNED_ADJUSTER)"
          - "body.verified_damage_amount is present and >= 0 (ERR_VERIFIED_AMOUNT_REQUIRED)"
        side_effects:
          - "report_submitted_at_utc = clock_now"
          - "Adjuster.open_assignment_count and surge_capacity_score recomputed"
          - "Claim INSPECTION_PENDING -> INSPECTED with the REVISION ReserveEntry cascade"
      - from: IN_PROGRESS
        to: NO_ACCESS
        trigger: "POST /inspection-assignments/{assignmentId}/report-no-access"
        actor: Adjuster
        preconditions:
          - "Assignment.status == IN_PROGRESS (ERR_ASSIGNMENT_NOT_IN_PROGRESS)"
          - "X-User-ID == Assignment.adjuster_id (ERR_NOT_ASSIGNED_ADJUSTER)"
        side_effects:
          - "report_submitted_at_utc = clock_now"
          - "Claim.access_status -> INACCESSIBLE; Claim.inspection_mode recomputed via calculations.inspection_mode_resolution"
          - "Claim INSPECTION_PENDING -> INSPECTED with no REVISION entry (verified_damage_amount stays null)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspection-assignments/{assignmentId}/cancel, or system links 3 of the demobilize/credential cascades"
        actor: DeploymentCoordinator
        preconditions:
          - "Assignment.status IN {SCHEDULED, IN_PROGRESS} (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Adjuster.open_assignment_count and surge_capacity_score recomputed"
          - "When the claim has no remaining SCHEDULED/IN_PROGRESS assignment: Claim INSPECTION_PENDING -> TRIAGED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /inspection-assignments/{assignmentId}/cancel"
        actor: DeploymentCoordinator
        preconditions:
          - "Assignment.status IN {SCHEDULED, IN_PROGRESS} (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Same as SCHEDULED -> CANCELLED"

  - entity: AdvancePayment
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /advance-payments/{advanceId}/void"
        actor: ClaimsExaminer
        preconditions:
          - "AdvancePayment.status == ISSUED (ERR_ADVANCE_NOT_ISSUED)"
          - "Claim.payment_status != SETTLED (ERR_CLAIM_ALREADY_SETTLED)"
          - "Parent CatastropheEvent has no EFFECTIVE ADVANCE_PAYMENT_MANDATE bulletin covering clock_now, or Claim.advance_paid_total minus this amount still satisfies the mandated floor (ERR_ADVANCE_MANDATE_FLOOR)"
        side_effects:
          - "Link 1: status = VOIDED; voided_at_utc = clock_now"
          - "Link 2 (caused by link 1): a REVERSAL ReserveEntry is appended with reverses_entry_id = this.reserve_entry_id, delta_paid = -amount, delta_case_reserve = +amount, sequence_no = next per-event sequence. CatastropheEvent.incurred_total is therefore unchanged (invariant reserve_conservation)"
          - "Link 2b (caused by link 2): when Claim.advance_paid_total returns to 0.00, Claim.payment_status ADVANCE_ISSUED -> NONE"
          - "Link 3 (caused by link 2 raising the event's ReserveEntry sequence high-water): every LossEstimateSnapshot with event_id == the claim's event_id and input_reserve_sequence_high_water < the new sequence_no flips stale = false -> true"
          - "Link 4 (caused by link 3 staling the latest snapshot): parent CatastropheEvent.posture recomputed via calculations.event_posture_recompute, which may flip OPEN -> RESTRICTED"
        note: "Cascade void_advance_chain, depth 4, distinct trigger from demobilize_deployment_chain. Compensating action for the conserved quantity CatastropheEvent.incurred_total."

  - entity: VendorFirm
    initial_state: NETWORK_INACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: NETWORK_INACTIVE
        to: ACTIVATED
        trigger: "POST /vendor-firms/{vendorFirmId}/activate"
        actor: VendorCoordinator
        preconditions:
          - "VendorFirm.status == NETWORK_INACTIVE (ERR_VENDOR_NOT_INACTIVE)"
          - "Target CatastropheEvent.status IN {DECLARED, SURGE_ACTIVE} (ERR_EVENT_NOT_DECLARED) -- cross-entity dependency VendorFirm -> CatastropheEvent"
          - "VendorFirm.service_states contains the event's jurisdiction_state (ERR_VENDOR_NOT_LICENSED_IN_STATE)"
        side_effects:
          - "activated_for_event_id = body.event_id"
      - from: ACTIVATED
        to: CAPACITY_HOLD
        trigger: "system (a VendorAssignment transition DISPATCHED -> ACCEPTED drives open_job_count to exactly max_concurrent_jobs)"
        actor: system
        preconditions:
          - "open_job_count == max_concurrent_jobs after the accept"
        side_effects: []
      - from: CAPACITY_HOLD
        to: ACTIVATED
        trigger: "system (a VendorAssignment leaves {DISPATCHED, ACCEPTED} and open_job_count falls below max_concurrent_jobs)"
        actor: system
        preconditions:
          - "open_job_count < max_concurrent_jobs after the release"
        side_effects: []
        note: "Cycle: ACTIVATED -> CAPACITY_HOLD -> ACTIVATED."
      - from: ACTIVATED
        to: NETWORK_INACTIVE
        trigger: "system (parent CatastropheEvent transitions DEMOBILIZING -> CLOSED)"
        actor: system
        preconditions:
          - "activated_for_event_id == the closing event's id"
        side_effects:
          - "activated_for_event_id = null"
      - from: ACTIVATED
        to: SUSPENDED
        trigger: "POST /vendor-firms/{vendorFirmId}/suspend"
        actor: VendorCoordinator
        preconditions:
          - "VendorFirm.status IN {ACTIVATED, CAPACITY_HOLD, NETWORK_INACTIVE} (ERR_VENDOR_NOT_SUSPENDABLE)"
        side_effects:
          - "activated_for_event_id = null"
          - "Every VendorAssignment with vendor_firm_id == this.id and status == DISPATCHED -> CANCELLED"
      - from: CAPACITY_HOLD
        to: SUSPENDED
        trigger: "POST /vendor-firms/{vendorFirmId}/suspend"
        actor: VendorCoordinator
        preconditions:
          - "VendorFirm.status IN {ACTIVATED, CAPACITY_HOLD, NETWORK_INACTIVE} (ERR_VENDOR_NOT_SUSPENDABLE)"
        side_effects:
          - "Same as ACTIVATED -> SUSPENDED"
      - from: NETWORK_INACTIVE
        to: SUSPENDED
        trigger: "POST /vendor-firms/{vendorFirmId}/suspend"
        actor: VendorCoordinator
        preconditions:
          - "VendorFirm.status IN {ACTIVATED, CAPACITY_HOLD, NETWORK_INACTIVE} (ERR_VENDOR_NOT_SUSPENDABLE)"
        side_effects: []

  - entity: VendorAssignment
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /vendor-assignments/{vendorAssignmentId}/accept"
        actor: VendorCoordinator
        preconditions:
          - "Assignment.status == DISPATCHED (ERR_VENDOR_ASSIGNMENT_NOT_DISPATCHED)"
          - "X-User-ID == Assignment.vendor_firm_id (ERR_NOT_ASSIGNED_VENDOR)"
          - "VendorFirm.status == ACTIVATED (ERR_VENDOR_NOT_ACTIVATED)"
          - "VendorFirm.open_job_count < VendorFirm.max_concurrent_jobs (ERR_VENDOR_CAPACITY_EXCEEDED)"
        side_effects:
          - "VendorFirm.open_job_count recomputed; when it reaches max_concurrent_jobs the firm goes ACTIVATED -> CAPACITY_HOLD"
      - from: DISPATCHED
        to: DECLINED
        trigger: "POST /vendor-assignments/{vendorAssignmentId}/decline"
        actor: VendorCoordinator
        preconditions:
          - "Assignment.status == DISPATCHED (ERR_VENDOR_ASSIGNMENT_NOT_DISPATCHED)"
          - "X-User-ID == Assignment.vendor_firm_id (ERR_NOT_ASSIGNED_VENDOR)"
        side_effects:
          - "VendorFirm.open_job_count recomputed"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /vendor-assignments/{vendorAssignmentId}/complete"
        actor: VendorCoordinator
        preconditions:
          - "Assignment.status == ACCEPTED (ERR_VENDOR_ASSIGNMENT_NOT_ACCEPTED)"
          - "X-User-ID == Assignment.vendor_firm_id (ERR_NOT_ASSIGNED_VENDOR)"
        side_effects:
          - "VendorFirm.open_job_count recomputed; CAPACITY_HOLD -> ACTIVATED when it falls below max_concurrent_jobs"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /vendor-assignments/{vendorAssignmentId}/cancel, or system on VendorFirm suspension"
        actor: ClaimsExaminer
        preconditions:
          - "Assignment.status IN {DISPATCHED, ACCEPTED} (ERR_VENDOR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "VendorFirm.open_job_count recomputed"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /vendor-assignments/{vendorAssignmentId}/cancel"
        actor: ClaimsExaminer
        preconditions:
          - "Assignment.status IN {DISPATCHED, ACCEPTED} (ERR_VENDOR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "VendorFirm.open_job_count recomputed; CAPACITY_HOLD -> ACTIVATED when it falls below max_concurrent_jobs"

  - entity: FileTransferBatch
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /file-transfer-batches/{batchId}/submit"
        actor: ClaimsExaminer
        preconditions:
          - "Batch.status == OPEN (ERR_BATCH_NOT_OPEN)"
          - "Parent CatastropheEvent.status == DEMOBILIZING (ERR_EVENT_NOT_DEMOBILIZING) -- cross-entity dependency FileTransferBatch -> CatastropheEvent"
          - "claim_count >= 1 (ERR_BATCH_EMPTY)"
          - "blocking_claim_count == 0 (ERR_BATCH_HAS_BLOCKING_CLAIMS)"
        side_effects:
          - "submitted_at_utc = clock_now"
          - "Every Claim with transfer_batch_id == this.id: handling_status CLOSED -> TRANSFERRED"
          - "Parent CatastropheEvent.open_claim_count and posture recomputed"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /file-transfer-batches/{batchId}/accept"
        actor: CatastropheManager
        preconditions:
          - "Batch.status == SUBMITTED (ERR_BATCH_NOT_SUBMITTED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /file-transfer-batches/{batchId}/reject"
        actor: CatastropheManager
        preconditions:
          - "Batch.status == SUBMITTED (ERR_BATCH_NOT_SUBMITTED)"
          - "body.rejection_reason is present and non-empty (ERR_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "Every Claim with transfer_batch_id == this.id: handling_status TRANSFERRED -> CLOSED"
          - "Parent CatastropheEvent.open_claim_count and posture recomputed"
      - from: REJECTED
        to: OPEN
        trigger: "POST /file-transfer-batches/{batchId}/reopen-batch"
        actor: ClaimsExaminer
        preconditions:
          - "Batch.status == REJECTED (ERR_BATCH_NOT_REJECTED)"
        side_effects:
          - "rejection_reason = null"
        note: "Cycle: OPEN -> SUBMITTED -> REJECTED -> OPEN."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: loss-estimate-stale-event
    parent_entity: CatastropheEvent
    write_endpoint: "POST /loss-estimates"
    occ_field: "expected_event_version"
    description: |
      Creating a LossEstimateSnapshot against a CatastropheEvent whose version has
      advanced since the client last observed it is rejected. A new snapshot
      legitimately supersedes the prior latest snapshot as the event's
      gross_loss_estimate, so the write itself is valid product behaviour; what is
      not valid is basing it on a stale view of the event's reserve roll-ups.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: reserve-revision-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{claimId}/reserve-entries"
    occ_field: "expected_claim_version"
    description: |
      Appending a manual ReserveEntry against a Claim whose version has advanced
      since the client last observed it is rejected. A later revision legitimately
      supersedes the previous reserve position, so the append is valid product
      behaviour; rejecting the stale-version form prevents a revision computed
      against a superseded case_reserve from landing.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: event_posture_recompute
    trigger: "Recomputed at the end of every mutation that touches a CatastropheEvent or any of its Claim / Deployment / LossEstimateSnapshot / RegulatoryBulletin children, and on every read of the event"
    algorithm: constraint_propagation
    formula: |
      # Step 1 - status floor. Ordering used for max(): OPEN < RESTRICTED < FROZEN.
      if event.status == CLOSED:        floor = FROZEN
      elif event.status == DEMOBILIZING: floor = RESTRICTED
      else:                              floor = OPEN

      # Step 2 - strain terms (each a count/flag over child entities)
      unassigned_severe = count(Claim
                                where event_id == event.id
                                  and triage_tier IN {COMPLEX, CAT_SEVERE}
                                  and handling_status IN {TRIAGED, REOPENED})
      latest_snapshot   = LossEstimateSnapshot with event_id == event.id
                          ordered by computed_at_utc DESC, created_at ASC, take first
      stale_flag        = 1 if latest_snapshot exists and latest_snapshot.stale == true else 0
      moratorium_flag   = 1 if event.moratorium_active == true else 0

      strain = unassigned_severe + (3 * stale_flag) + (4 * moratorium_flag)

      # Step 3 - band. Boundaries are inclusive on the lower edge.
      if   strain >= FROZEN_STRAIN_THRESHOLD:      band = FROZEN
      elif strain >= RESTRICTED_STRAIN_THRESHOLD:  band = RESTRICTED
      else:                                        band = OPEN

      # Step 4 - posture is the stricter of floor and band
      event.posture = max(floor, band)
    input_set: "Claim rows with handling_status IN {TRIAGED, REOPENED} only (INTAKE, INSPECTION_PENDING, INSPECTED, CLOSED and TRANSFERRED claims never contribute to unassigned_severe). All LossEstimateSnapshot rows for the event are candidates for latest_snapshot; when zero snapshots exist stale_flag is 0."
    constants:
      RESTRICTED_STRAIN_THRESHOLD: 3
      FROZEN_STRAIN_THRESHOLD: 8
    precision: "strain is an exact integer; no rounding"
    variants: []

  - name: claim_triage_severity_score
    trigger: "POST /claims/{claimId}/triage (stamps Claim.severity_score and Claim.triage_tier); re-run on POST /claims/{claimId}/reopen"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): 5 inputs, nested min/max, conditional branches on
      # peril_type and access_status, and a tier selection on the result.
      total_limit    = sum over claim.coverage_lines of limit_amount
      exposure_ratio = claim.reported_loss_amount / max(total_limit, 1)
      base           = 100.0 * min(1.0, exposure_ratio)
      peril_weight   = PERIL_WEIGHT[event.peril_type]
      access_adj     = ACCESS_ADJUSTMENT[claim.access_status]
      ale_flag       = 1 if any coverage_line has coverage_code == ALE
                            and estimated_damage_amount > 0 else 0
      raw            = (base * peril_weight)
                       + access_adj
                       + (ALE_BONUS * ale_flag)
                       + (SEVERITY_INDEX_WEIGHT * event.expected_severity_index)
      severity_score = round(min(100.0, max(0.0, raw)), 2)   # single rounding, half-up

      if   severity_score >= CAT_SEVERE_FLOOR: triage_tier = CAT_SEVERE
      elif severity_score >= COMPLEX_FLOOR:    triage_tier = COMPLEX
      elif severity_score >= STANDARD_FLOOR:   triage_tier = STANDARD
      else:                                    triage_tier = FAST_TRACK
    input_set: "All entries of claim.coverage_lines participate in total_limit and in the ALE test; the parent CatastropheEvent supplies peril_type and expected_severity_index as read at triage time (never re-read later)."
    constants:
      PERIL_WEIGHT: { HURRICANE: 1.15, WILDFIRE: 1.25, FLOOD: 1.20, HAIL: 0.95, WINTER_STORM: 0.90, EARTHQUAKE: 1.30 }
      ACCESS_ADJUSTMENT: { ACCESSIBLE: 0.0, RESTRICTED: 6.0, INACCESSIBLE: 12.0 }
      ALE_BONUS: 10.0
      SEVERITY_INDEX_WEIGHT: 20.0
      CAT_SEVERE_FLOOR: 75.0
      COMPLEX_FLOOR: 50.0
      STANDARD_FLOOR: 25.0
    precision: "2 decimal places, round_half_up; the clamp to [0, 100] is applied BEFORE rounding"
    variants: []

  - name: advance_payment_amount
    trigger: "POST /advance-payments (stamps AdvancePayment.amount and refreshes Claim.advance_cap)"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (b): NESTED ROUNDING WHERE ORDER MATTERS.
      # PINNED ORDER: round each coverage line to cents FIRST (half-up), then sum
      # the already-rounded line values, then apply the tier multiplier, then round
      # once more. Summing the raw line values and rounding once at the end is
      # explicitly NOT the pinned order and yields different cents.
      line_advance_values = []
      for line in claim.coverage_lines:                     # array order as supplied at intake
          line_eligible = max(0.0, min(line.estimated_damage_amount, line.limit_amount)
                                    - line.deductible_amount)
          line_advance  = round(line_eligible * LINE_ADVANCE_PCT[line.coverage_code], 2)
          line_advance_values.append(line_advance)

      cap_from_lines = sum(line_advance_values)              # sum of ROUNDED values

      mandate = the RegulatoryBulletin with event_id == claim.event_id,
                bulletin_type == ADVANCE_PAYMENT_MANDATE, status == EFFECTIVE,
                effective_from <= clock_now < effective_to,
                ordered by mandated_advance_pct DESC, created_at ASC, take first
      mandate_floor = round(claim.reported_loss_amount * mandate.mandated_advance_pct, 2)
                      if mandate exists else 0.00

      tiered        = round(cap_from_lines * TIER_MULTIPLIER[claim.triage_tier], 2)
      advance_cap   = max(tiered, mandate_floor)

      headroom = round(advance_cap - claim.advance_paid_total, 2)
      if headroom <= 0.00: reject with ERR_ADVANCE_CAP_EXCEEDED
      amount = min(requested_amount, headroom)
    input_set: "Only coverage_lines present on the Claim at issuance time. advance_paid_total counts AdvancePayment rows with status == ISSUED only; VOIDED advances are excluded, which is what makes issue-then-void-then-reissue land on the same cap."
    constants:
      LINE_ADVANCE_PCT: { DWELLING: 0.30, CONTENTS: 0.25, ALE: 0.50, OTHER_STRUCTURES: 0.20 }
      TIER_MULTIPLIER: { CAT_SEVERE: 1.00, COMPLEX: 0.85, STANDARD: 0.60, FAST_TRACK: 0.40 }
    precision: "2 decimal places, round_half_up at every step named above; no other rounding occurs"
    variants: []

  - name: deployment_cost
    trigger: "Deployment REQUESTED -> CONFIRMED stamps provisional_cost (variant PROVISIONAL); Deployment {CONFIRMED,ON_SITE} -> DEMOBILIZED stamps final_settled_cost (variant FINAL_SETTLED); both stamp surge_premium_tier"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (c): CIRCULAR-LOOKING DEPENDENCY WITH PINNED EVALUATION
      # ORDER. total = subtotal + surge_premium, and surge_premium's rate is keyed
      # on a dollar tier. The tier is selected from subtotal_pre_premium ONLY -
      # never from the post-premium total - so the value is well-defined in one
      # pass and NO fixed-point iteration is performed.
      # Step 1 - nights (variant-dependent, see variants below)
      nights = max(1, whole_days_between(window_start_utc, settle_end_utc))   # exclusive end

      # Step 2 - labour
      rate_factor  = 1.00 if adjuster.employment_type == STAFF else INDEPENDENT_RATE_FACTOR
      base_labor   = round(adjuster.daily_rate * rate_factor * nights, 2)

      # Step 3 - per diem and housing
      per_diem_total = round(adjuster.per_diem_rate * nights * per_diem_eligible, 2)
      housing_share  = round(housing_block.nightly_rate * deployment.rooms_reserved * nights, 2)
                       if deployment.role_type != DESK and deployment.housing_block_id is not null
                       else 0.00

      subtotal_pre_premium = round(base_labor + per_diem_total + housing_share, 2)

      # Step 4 - tier keyed on subtotal_pre_premium (NOT on total)
      if   subtotal_pre_premium >= PREMIUM_HIGH_FLOOR: tier = TIER_HIGH; rate = PREMIUM_HIGH_RATE
      elif subtotal_pre_premium >= PREMIUM_MID_FLOOR:  tier = TIER_MID;  rate = PREMIUM_MID_RATE
      else:                                            tier = TIER_NONE; rate = 0.00

      surge_premium = round(subtotal_pre_premium * rate, 2)
      total         = round(subtotal_pre_premium + surge_premium, 2)
      deployment.surge_premium_tier = tier
    input_set: "One Deployment row plus its Adjuster and (when role_type != DESK) its HousingBlock. No sibling deployments participate."
    constants:
      INDEPENDENT_RATE_FACTOR: 1.35
      PREMIUM_MID_FLOOR: 5000.00
      PREMIUM_HIGH_FLOOR: 20000.00
      PREMIUM_MID_RATE: 0.06
      PREMIUM_HIGH_RATE: 0.11
    precision: "2 decimal places, round_half_up at each named step"
    variants:
      - name: PROVISIONAL
        when: "Deployment REQUESTED -> CONFIRMED; written to Deployment.provisional_cost"
        difference: "settle_end_utc = deployment.window_end_utc (the full requested window), and per_diem_eligible = 1 unconditionally, so an INDEPENDENT adjuster with a hotel room is charged per-diem as well as housing."
      - name: FINAL_SETTLED
        when: "Deployment {CONFIRMED, ON_SITE} -> DEMOBILIZED; written to Deployment.final_settled_cost"
        difference: "settle_end_utc = min(deployment.window_end_utc, deployment.demobilized_at_utc), so an early demobilization shortens nights; and per_diem_eligible = 1 only when adjuster.employment_type == STAFF or deployment.housing_block_id is null, so an INDEPENDENT adjuster in company housing loses per-diem entirely. Both differences change nights and per_diem_total, and can change surge_premium_tier, so PROVISIONAL and FINAL_SETTLED differ for identical stored inputs."

  - name: event_loss_estimate
    trigger: "POST /loss-estimates (stamps LossEstimateSnapshot.gross_estimate, reported_component, ibnr_component, input_reserve_sequence_high_water)"
    algorithm: forward_looking
    formula: |
      # Common reported/incurred base for both variants
      reported_component = event.incurred_total          # case_reserve_total + paid_total
      # Variant-specific ibnr_component, see variants below.
      gross_estimate = round(reported_component + ibnr_component, 2)
    input_set: "All ReserveEntry rows with event_id == event.id, no status filter (reserve entries are append-only and never retracted; a void is represented by a REVERSAL entry that also participates). Replay order, where order matters, is ReserveEntry.sequence_no ASC - unique per event, so no tie-break is required."
    constants:
      PERIL_DEV_FACTOR: { HURRICANE: 1.40, WILDFIRE: 1.55, FLOOD: 1.65, HAIL: 1.20, WINTER_STORM: 1.10, EARTHQUAKE: 1.80 }
      REPORT_RATE: 0.35
    precision: "2 decimal places, round_half_up; ultimate_claim_count uses ceil() on an exact rational, never a float shortcut"
    variants:
      - name: EXPOSURE_BASED
        when: "method == EXPOSURE_BASED — the catastrophe-modelling view used before enough claims have developed"
        difference: |
          modeled = event.exposure_count * event.avg_insured_value
                    * event.expected_severity_index * PERIL_DEV_FACTOR[event.peril_type]
          ibnr_component = round(max(0.00, modeled - reported_component), 2)
          Ignores how many claims have actually reported; driven entirely by footprint exposure.
      - name: INCURRED_DEVELOPMENT
        when: "method == INCURRED_DEVELOPMENT — the chronological view that develops observed reserves forward"
        difference: |
          reported_claim_count = count of DISTINCT claim_id among ReserveEntry
                                 with event_id == event.id and entry_type == INITIAL_CASE
          avg_incurred_per_claim = reported_component / max(reported_claim_count, 1)
          ultimate_claim_count   = ceil(event.exposure_count * event.expected_severity_index
                                        * REPORT_RATE)
          ibnr_component = round(max(0.00, avg_incurred_per_claim
                                          * max(0, ultimate_claim_count - reported_claim_count)), 2)
          Driven by observed average severity per reported claim; for identical stored
          inputs this yields a different gross_estimate than EXPOSURE_BASED whenever
          avg_incurred_per_claim differs from the modelled per-risk severity.

  - name: initial_case_reserve
    trigger: "Claim INTAKE -> TRIAGED; supplies delta_case_reserve of the INITIAL_CASE ReserveEntry"
    algorithm: threshold
    formula: |
      eligible_damage = sum over claim.coverage_lines of
                        max(0.0, min(estimated_damage_amount, limit_amount) - deductible_amount)
      basis  = max(claim.reported_loss_amount, eligible_damage)
      delta_case_reserve = round(basis * TIER_RESERVE_FACTOR[claim.triage_tier], 2)
      delta_paid = 0.00
    input_set: "All coverage_lines on the Claim; triage_tier as stamped by claim_triage_severity_score in the same request (the tier is computed before the reserve entry is appended)"
    constants:
      TIER_RESERVE_FACTOR: { CAT_SEVERE: 0.85, COMPLEX: 0.65, STANDARD: 0.45, FAST_TRACK: 0.25 }
    precision: "2 decimal places, round_half_up; eligible_damage is summed on raw line values and rounded once at the end (deliberately the OPPOSITE order from advance_payment_amount)"
    variants: []

  - name: reserve_revision_delta
    trigger: "Claim INSPECTION_PENDING -> INSPECTED when the driving InspectionAssignment ended COMPLETED; supplies delta_case_reserve of the REVISION ReserveEntry"
    algorithm: aggregation
    formula: |
      total_deductible     = sum over claim.coverage_lines of deductible_amount
      target_case_reserve  = round(max(0.00, claim.verified_damage_amount - total_deductible), 2)
      delta_case_reserve   = round(target_case_reserve - claim.case_reserve, 2)   # may be negative
      delta_paid           = 0.00
    input_set: "claim.case_reserve as it stands immediately before the append - which already reflects any INITIAL_CASE entry, any PAYMENT entry from an issued advance, and any REVERSAL entry from a voided advance."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: advance_reserve_movement
    trigger: "POST /advance-payments (AdvancePayment created ISSUED); supplies the PAYMENT ReserveEntry, and its mirror on POST /advance-payments/{advanceId}/void supplies the REVERSAL ReserveEntry"
    algorithm: aggregation
    formula: |
      # Forward action - issuance
      PAYMENT  entry: delta_paid = +AdvancePayment.amount
                      delta_case_reserve = -AdvancePayment.amount
                      reverses_entry_id = null
      # Compensating action - void
      REVERSAL entry: delta_paid = -AdvancePayment.amount
                      delta_case_reserve = +AdvancePayment.amount
                      reverses_entry_id = AdvancePayment.reserve_entry_id
      # Both entries are net-zero in (delta_case_reserve + delta_paid), which is what
      # makes CatastropheEvent.incurred_total invariant across issue and void.
    input_set: "Exactly one AdvancePayment row; sequence_no is the next per-event integer in append order"
    constants: {}
    precision: "2 decimal places, round_half_up; amount is already rounded by advance_payment_amount so no further rounding occurs"
    variants: []

  - name: reserve_conservation_invariant
    trigger: "Asserted after every mutation that appends a ReserveEntry (triage, advance issuance, advance void, manual reserve entry, inspection revision)"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: incurred dollars.
      CatastropheEvent.incurred_total
        == round(sum over ReserveEntry where event_id == event.id of
                 (delta_case_reserve + delta_paid), 2)
      # Compensating-action invariant: for any AdvancePayment A on a Claim of this
      # event, executing POST /advance-payments (issue A) followed by
      # POST /advance-payments/{A}/void leaves
      #   CatastropheEvent.incurred_total  EXACTLY equal to its pre-issuance value, and
      #   Claim.case_reserve               EXACTLY equal to its pre-issuance value, and
      #   Claim.paid_amount                EXACTLY equal to its pre-issuance value.
      # Only ReserveEntry row count and sequence_no high-water advance.
    input_set: "All ReserveEntry rows for the event, no status filter, no time window (append-only log; REVERSAL rows participate rather than deleting their target)"
    constants: {}
    precision: "2 decimal places, round_half_up; the assertion is exact equality on the rounded values"
    variants: []

  - name: housing_room_conservation_invariant
    trigger: "Asserted after every mutation that changes a Deployment's status (confirm, demobilize, cancel) or a HousingBlock's status"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: physical hotel rooms (a count, not money).
      HousingBlock.rooms_total
        == HousingBlock.rooms_available + HousingBlock.rooms_occupied
      HousingBlock.rooms_occupied
        == sum over Deployment where housing_block_id == block.id
                                 and status IN {CONFIRMED, ON_SITE} of rooms_reserved
      # Compensating-action invariant: for any Deployment D on this block, executing
      # POST /deployments/{D}/confirm followed by POST /deployments/{D}/cancel leaves
      #   HousingBlock.rooms_available EXACTLY equal to its pre-confirm value, and
      #   HousingBlock.status          EXACTLY equal to its pre-confirm value.
      # The same holds for confirm followed by POST /deployments/{D}/demobilize.
    input_set: "Deployment rows with status IN {CONFIRMED, ON_SITE} only; REQUESTED, DEMOBILIZED and CANCELLED deployments hold zero rooms"
    constants: {}
    precision: "integer counts; no rounding"
    variants: []

  - name: adjuster_surge_capacity_score
    trigger: "Recomputed whenever an Adjuster's deployment_status or credential_status changes, whenever an InspectionAssignment for the adjuster is created or leaves {SCHEDULED, IN_PROGRESS}, and whenever a Deployment for the adjuster reaches ON_SITE or DEMOBILIZED"
    algorithm: weighted_scoring
    formula: |
      load_ratio         = adjuster.open_assignment_count / adjuster.max_open_claims
      availability_pts   = 100.0 * (1.0 - min(1.0, load_ratio))
      credential_penalty = CREDENTIAL_PENALTY[adjuster.credential_status]
      fatigue_penalty    = min(FATIGUE_CAP,
                               floor(adjuster.cumulative_deployed_hours / 24) * FATIGUE_STEP)
      cert_bonus         = (CERT_BONUS if adjuster.desk_certified else 0.0)
                           + (CERT_BONUS if adjuster.aerial_certified else 0.0)
      raw   = availability_pts - credential_penalty - fatigue_penalty + cert_bonus
      score = round(min(100.0, max(0.0, raw)), 2)
    input_set: "InspectionAssignment rows with status IN {SCHEDULED, IN_PROGRESS} only; Deployment rows with status IN {ON_SITE, DEMOBILIZED} only for cumulative_deployed_hours"
    constants:
      CREDENTIAL_PENALTY: { VALID: 0.0, EXPIRING: 15.0, WAIVED: 8.0, EXPIRED: 100.0 }
      FATIGUE_STEP: 3.0
      FATIGUE_CAP: 30.0
      CERT_BONUS: 5.0
    precision: "2 decimal places, round_half_up; clamp to [0, 100] applied BEFORE rounding"
    variants: []

  - name: inspection_mode_resolution
    trigger: "Claim INTAKE -> TRIAGED, Claim CLOSED -> REOPENED, and InspectionAssignment IN_PROGRESS -> NO_ACCESS (which first flips Claim.access_status to INACCESSIBLE)"
    algorithm: threshold
    formula: |
      # First matching branch wins; branches are evaluated top to bottom.
      if claim.access_status == INACCESSIBLE and claim.triage_tier IN {COMPLEX, CAT_SEVERE}:
          inspection_mode = AERIAL
      elif claim.access_status == INACCESSIBLE:
          inspection_mode = DESK
      elif claim.access_status == RESTRICTED and claim.triage_tier == FAST_TRACK:
          inspection_mode = DESK
      elif claim.triage_tier == FAST_TRACK and claim.reported_loss_amount <= DESK_LOSS_CEILING:
          inspection_mode = DESK
      else:
          inspection_mode = FIELD
    input_set: "One Claim row; access_status and triage_tier as they stand at the moment of the recompute"
    constants:
      DESK_LOSS_CEILING: 10000.00
    precision: "no rounding; DESK_LOSS_CEILING comparison is <= (10000.00 resolves to DESK, 10000.01 to FIELD)"
    variants: []

  - name: claim_deadline_resolution
    trigger: "Claim INTAKE -> TRIAGED, Claim CLOSED -> REOPENED, RegulatoryBulletin DRAFT -> EFFECTIVE (CLAIM_DEADLINE_EXTENSION only), RegulatoryBulletin EFFECTIVE -> EXPIRED, RegulatoryBulletin EFFECTIVE -> WITHDRAWN"
    algorithm: interval_merge
    formula: |
      anchor = claim.reported_at_utc
               if claim.reopen_count == 0
               else the clock_now value stamped by the most recent CLOSED -> REOPENED transition
      base_deadline = anchor + BASE_ACK_DAYS days

      # SUM, not max: multiple concurrently-effective extension bulletins stack.
      # Iteration order is created_at ASC (deterministic, though addition commutes).
      extension_days = sum over RegulatoryBulletin
                       where event_id == claim.event_id
                         and bulletin_type == CLAIM_DEADLINE_EXTENSION
                         and status == EFFECTIVE
                         and effective_from <= clock_now < effective_to
                       of deadline_extension_days
                       (ordered by created_at ASC)

      claim.deadline_utc = base_deadline + extension_days days
    input_set: "RegulatoryBulletin rows with status == EFFECTIVE only; DRAFT, EXPIRED and WITHDRAWN bulletins contribute 0 days. The window test is half-open: effective_from inclusive, effective_to exclusive."
    constants:
      BASE_ACK_DAYS: 15
    precision: "whole days added to an ISO 8601 UTC instant; the time-of-day component of anchor is preserved exactly"
    variants: []

  - name: adjuster_deployment_selector
    trigger: "POST /deployments when the request body omits adjuster_id; also POST /inspection-assignments when the request body omits adjuster_id"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER - explicit predicate over entity fields
      candidates = Adjuster rows where
          deployment_status == AVAILABLE
          and credential_status IN {VALID, EXPIRING, WAIVED}
          and (event.jurisdiction_state IN licensed_states or credential_status == WAIVED)
          and open_assignment_count < max_open_claims
          and (role_type != DESK   or desk_certified == true)
          and (role_type != AERIAL or aerial_certified == true)
          and no Deployment for this adjuster with status IN {CONFIRMED, ON_SITE, DEMOBILIZED}
              violates the REST_BUFFER_HOURS separation rule (validations priority 23)
      # (b) RANKING EXPRESSION
      order by surge_capacity_score DESC
      # (c) TIE-BREAK when surge_capacity_score ties exactly
      then by max_open_claims DESC
      then by created_at ASC          # never id
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: reject with ERR_NO_ELIGIBLE_ADJUSTER (409); nothing is created
      selected = first row; Deployment.selection_reason = SELECTOR_RANKED
    input_set: "All Adjuster rows in the system pass through the eligibility filter; no pre-filtering by event."
    constants:
      REST_BUFFER_HOURS: 12
    precision: "surge_capacity_score comparison is exact on the stored 2dp value"
    variants: []

  - name: vendor_selector
    trigger: "POST /vendor-assignments when the request body omits vendor_firm_id"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER
      candidates = VendorFirm rows where
          status == ACTIVATED
          and activated_for_event_id == claim.event_id
          and claim.loss_state IN service_states
          and open_job_count < max_concurrent_jobs
          and vendor_type == body.required_vendor_type
      # (b) RANKING EXPRESSION
      order by performance_score DESC
      # (c) TIE-BREAK when performance_score ties exactly
      then by (max_concurrent_jobs - open_job_count) DESC     # most spare capacity
      then by created_at ASC                                   # never id
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: reject with ERR_NO_ELIGIBLE_VENDOR (409); nothing is created
      selected = first row; VendorAssignment.selection_reason = SELECTOR_RANKED
    input_set: "VendorFirm rows with status == ACTIVATED only; NETWORK_INACTIVE, CAPACITY_HOLD and SUSPENDED firms are excluded even when they have spare capacity."
    constants: {}
    precision: "performance_score comparison is exact on the stored 2dp value"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in strict ascending priority order;
# the first failing row determines the response error_id and HTTP status)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (X-User-ID may be omitted only for the Anonymous role, which no endpoint here grants)"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Referenced CatastropheEvent exists (path segment first, then body event_id)"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {eventId} in the path or event_id in the body"
  - priority: 5
    category: existence
    check: "Referenced Claim exists (path {claimId} before body claim_id)"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {claimId} or claim_id"
  - priority: 6
    category: existence
    check: "Referenced Adjuster exists"
    error_id: ERR_ADJUSTER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {adjusterId} or a non-null adjuster_id"
  - priority: 7
    category: existence
    check: "Referenced HousingBlock exists"
    error_id: ERR_HOUSING_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {housingBlockId} or a non-null housing_block_id"
  - priority: 8
    category: existence
    check: "Referenced Deployment exists"
    error_id: ERR_DEPLOYMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {deploymentId} or a non-null deployment_id"
  - priority: 9
    category: existence
    check: "Referenced InspectionAssignment exists"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {assignmentId}"
  - priority: 10
    category: existence
    check: "Referenced AdvancePayment exists"
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {advanceId}"
  - priority: 11
    category: existence
    check: "Referenced VendorFirm exists"
    error_id: ERR_VENDOR_FIRM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {vendorFirmId} or a non-null vendor_firm_id"
  - priority: 12
    category: existence
    check: "Referenced VendorAssignment exists"
    error_id: ERR_VENDOR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {vendorAssignmentId}"
  - priority: 13
    category: existence
    check: "Referenced RegulatoryBulletin exists"
    error_id: ERR_BULLETIN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {bulletinId}"
  - priority: 14
    category: existence
    check: "Referenced FileTransferBatch exists"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {batchId}"
  - priority: 15
    category: business_constraint
    check: "Request body satisfies the endpoint's input schema: all required fields present, types correct, enums within the declared member sets, numeric ranges honoured (rooms_total 0..400, max_open_claims 1..60, expected_severity_index 0.0..1.0, mandated_advance_pct 0.0..1.0, deadline_extension_days 0..365, coverage_lines 1..6 entries with unique coverage_code, performance_score 0..100, limit/offset within pagination bounds)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 16
    category: business_temporal
    check: "Every submitted interval is well-formed and strictly positive: effective_to > effective_from, window_end_utc > window_start_utc, block_end_date > block_start_date"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /regulatory-bulletins, POST /deployments, POST /housing-blocks, POST /inspection-assignments"
  - priority: 17
    category: auth
    check: "For entity_backed roles the acting identity owns the resource: X-User-ID == InspectionAssignment.adjuster_id for Adjuster actions (ERR_NOT_ASSIGNED_ADJUSTER); X-User-ID == VendorAssignment.vendor_firm_id for VendorCoordinator accept/decline/complete (ERR_NOT_ASSIGNED_VENDOR)"
    error_id: ERR_NOT_ASSIGNED_ADJUSTER
    http_status: 403
    applies_to: "POST /inspection-assignments/{assignmentId}/start, /complete, /report-no-access, POST /vendor-assignments/{vendorAssignmentId}/accept, /decline, /complete"
  - priority: 18
    category: state
    check: "OCC: body expected_event_version == CatastropheEvent.version (ERR_STALE_EVENT_VERSION) or body expected_claim_version == Claim.version (ERR_STALE_CLAIM_VERSION)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /loss-estimates, POST /claims/{claimId}/reserve-entries"
  - priority: 19
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2; the endpoint-specific error_id from the transition's preconditions is returned (ERR_EVENT_NOT_MONITORING, ERR_EVENT_NOT_DECLARED, ERR_EVENT_NOT_SURGE_ACTIVE, ERR_EVENT_NOT_DEMOBILIZING, ERR_EVENT_NOT_STANDDOWN_ELIGIBLE, ERR_EVENT_CLOSED, ERR_CLAIM_NOT_IN_INTAKE, ERR_CLAIM_NOT_INSPECTED, ERR_CLAIM_NOT_CLOSED, ERR_CLAIM_NOT_CAT_CODED, ERR_CLAIM_NOT_TRANSFERABLE, ERR_CLAIM_ALREADY_SETTLED, ERR_DEPLOYMENT_NOT_REQUESTED, ERR_DEPLOYMENT_NOT_CONFIRMED, ERR_DEPLOYMENT_NOT_DEMOBILIZABLE, ERR_DEPLOYMENT_NOT_CANCELLABLE, ERR_DEPLOYMENT_WINDOW_NOT_STARTED, ERR_ASSIGNMENT_NOT_SCHEDULED, ERR_ASSIGNMENT_NOT_IN_PROGRESS, ERR_ASSIGNMENT_NOT_CANCELLABLE, ERR_ASSIGNMENT_WINDOW_NOT_STARTED, ERR_ASSIGNMENTS_IN_FLIGHT, ERR_ADVANCE_NOT_ISSUED, ERR_ADJUSTER_NOT_AVAILABLE, ERR_ADJUSTER_NOT_UNAVAILABLE, ERR_ADJUSTER_CREDENTIAL_INVALID, ERR_CREDENTIAL_NOT_EXPIRED, ERR_HOUSING_NOT_PENDING, ERR_HOUSING_NOT_RELEASABLE, ERR_HOUSING_STILL_OCCUPIED, ERR_VENDOR_NOT_INACTIVE, ERR_VENDOR_NOT_ACTIVATED, ERR_VENDOR_NOT_SUSPENDABLE, ERR_VENDOR_ASSIGNMENT_NOT_DISPATCHED, ERR_VENDOR_ASSIGNMENT_NOT_ACCEPTED, ERR_VENDOR_ASSIGNMENT_NOT_CANCELLABLE, ERR_VENDOR_JOB_OPEN, ERR_BULLETIN_NOT_DRAFT, ERR_BULLETIN_NOT_WITHDRAWABLE, ERR_BATCH_NOT_OPEN, ERR_BATCH_NOT_SUBMITTED, ERR_BATCH_NOT_REJECTED, ERR_UNTRIAGED_CLAIMS_REMAIN, ERR_DEPLOYMENTS_STILL_OPEN, ERR_CLAIMS_STILL_OPEN, ERR_TRANSFER_BATCH_UNACCEPTED, ERR_NO_ACTIVE_HOUSING, ERR_LOSS_ESTIMATE_STALE, ERR_ADVANCE_OUTSTANDING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 20
    category: state
    check: "Parent CatastropheEvent.posture != FROZEN for every child-entity mutation on that event"
    error_id: ERR_EVENT_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /claims/{claimId}/triage, POST /claims/{claimId}/reserve-entries, POST /deployments, POST /deployments/{deploymentId}/confirm, POST /inspection-assignments, POST /advance-payments, POST /vendor-assignments"
  - priority: 21
    category: business_safety
    check: "No CANCELLATION_MORATORIUM RegulatoryBulletin with status == EFFECTIVE covers clock_now on the parent event (moratorium_active == false) when closing a claim or demobilizing the event"
    error_id: ERR_MORATORIUM_ACTIVE
    http_status: 409
    applies_to: "POST /claims/{claimId}/close, POST /catastrophe-events/{eventId}/demobilize"
  - priority: 22
    category: business_safety
    check: "Segregation of duties: the X-User-ID closing a Claim differs from Claim.advance_issuing_examiner_user_id; and the X-User-ID accepting a FileTransferBatch differs from the X-User-ID that submitted it (FileTransferBatch submission is recorded against the submitting ClaimsExaminer)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /claims/{claimId}/close, POST /file-transfer-batches/{batchId}/accept"
  - priority: 23
    category: business_temporal
    check: "BUFFERED HALF-OPEN semantics on the Adjuster resource: for the deployment being confirmed, no other Deployment of the same adjuster with status IN {CONFIRMED, ON_SITE, DEMOBILIZED} satisfies new.window_start_utc < other.window_end_utc + REST_BUFFER_HOURS AND other.window_start_utc < new.window_end_utc + REST_BUFFER_HOURS. Exact adjacency is therefore REJECTED unless a full 12-hour gap separates the windows"
    error_id: ERR_DEPLOYMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /deployments/{deploymentId}/confirm"
  - priority: 24
    category: business_temporal
    check: "AGGREGATE-CAPACITY NIGHTLY semantics on the HousingBlock resource: overlap alone is legal - many deployments share a block - and is rejected only when the aggregate rooms_reserved over deployments occupying any shared night would exceed rooms_total. The night set of an interval is the whole days in [start_date, end_date), so a checkout on the same date as another deployment's arrival consumes no shared night and never conflicts"
    error_id: ERR_HOUSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deployments/{deploymentId}/confirm"
  - priority: 25
    category: business_temporal
    check: "STRICT HALF-OPEN semantics on the Adjuster resource for inspection work: no other InspectionAssignment of the same adjuster with status IN {SCHEDULED, IN_PROGRESS} satisfies new.window_start_utc < other.window_end_utc AND other.window_start_utc < new.window_end_utc. Zero buffer, so exact adjacency (new.window_start_utc == other.window_end_utc) is ACCEPTED"
    error_id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspection-assignments"
  - priority: 26
    category: business_temporal
    check: "CONTAINMENT semantics: when deployment_id is supplied, the assignment window must satisfy deployment.window_start_utc <= new.window_start_utc AND new.window_end_utc <= deployment.window_end_utc"
    error_id: ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT
    http_status: 422
    applies_to: "POST /inspection-assignments"
  - priority: 27
    category: business_referential
    check: "Adjuster.licensed_states contains the parent CatastropheEvent.jurisdiction_state, unless Adjuster.credential_status == WAIVED"
    error_id: ERR_ADJUSTER_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /deployments/{deploymentId}/confirm, POST /inspection-assignments"
  - priority: 28
    category: business_referential
    check: "VendorFirm.service_states contains Claim.loss_state"
    error_id: ERR_VENDOR_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /vendor-firms/{vendorFirmId}/activate, POST /vendor-assignments"
  - priority: 29
    category: business_referential
    check: "body.mode == Claim.inspection_mode as currently computed by calculations.inspection_mode_resolution"
    error_id: ERR_INSPECTION_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /inspection-assignments"
  - priority: 30
    category: business_referential
    check: "Cross-aggregate scope: the supplied Deployment.event_id equals the Claim.event_id, and the supplied HousingBlock.event_id equals the Deployment.event_id; the RegulatoryBulletin.jurisdiction_state equals its event's jurisdiction_state (ERR_JURISDICTION_MISMATCH); a Claim joining a FileTransferBatch has the same event_id as the batch"
    error_id: ERR_EVENT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /inspection-assignments, POST /deployments, POST /regulatory-bulletins/{bulletinId}/activate, POST /file-transfer-batches/{batchId}/claims"
  - priority: 31
    category: business_constraint
    check: "Uniqueness: CatastropheEvent.cat_code globally unique (ERR_CAT_CODE_TAKEN); (event_id, bulletin_number) unique (ERR_BULLETIN_NUMBER_TAKEN); (policy_number, loss_date_utc) unique on Claim (ERR_DUPLICATE_CLAIM); VendorFirm.firm_name globally unique (ERR_VENDOR_NAME_TAKEN)"
    error_id: ERR_CAT_CODE_TAKEN
    http_status: 409
    applies_to: "POST /catastrophe-events, POST /catastrophe-events/{eventId}/declare, POST /regulatory-bulletins, POST /claims, POST /vendor-firms"
  - priority: 32
    category: business_constraint
    check: "Adjuster.open_assignment_count < Adjuster.max_open_claims, evaluated before the new assignment is counted"
    error_id: ERR_ADJUSTER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /inspection-assignments"
  - priority: 33
    category: business_constraint
    check: "VendorFirm.open_job_count < VendorFirm.max_concurrent_jobs, evaluated before the new job is counted"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /vendor-assignments, POST /vendor-assignments/{vendorAssignmentId}/accept"
  - priority: 34
    category: business_constraint
    check: "Claim.reopen_count < MAX_REOPENS (2)"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /claims/{claimId}/reopen"
  - priority: 35
    category: business_constraint
    check: "Selector pools are non-empty when the request omitted the explicit id: at least one Adjuster passes calculations.adjuster_deployment_selector's eligibility filter (ERR_NO_ELIGIBLE_ADJUSTER); at least one VendorFirm passes calculations.vendor_selector's eligibility filter (ERR_NO_ELIGIBLE_VENDOR)"
    error_id: ERR_NO_ELIGIBLE_ADJUSTER
    http_status: 409
    applies_to: "POST /deployments, POST /inspection-assignments, POST /vendor-assignments"
  - priority: 36
    category: business_constraint
    check: "HousingBlock.rooms_total >= 1 when opening a block; a block created with rooms_total == 0 can never be opened"
    error_id: ERR_HOUSING_BLOCK_EMPTY
    http_status: 409
    applies_to: "POST /housing-blocks/{housingBlockId}/open"
  - priority: 37
    category: business_constraint
    check: "FileTransferBatch.claim_count >= 1 on submit (ERR_BATCH_EMPTY) and blocking_claim_count == 0 on submit (ERR_BATCH_HAS_BLOCKING_CLAIMS)"
    error_id: ERR_BATCH_EMPTY
    http_status: 422
    applies_to: "POST /file-transfer-batches/{batchId}/submit"
  - priority: 38
    category: business_fiscal
    check: "HousingBlock.rooms_available >= Deployment.rooms_reserved at confirm time"
    error_id: ERR_HOUSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deployments/{deploymentId}/confirm"
  - priority: 39
    category: business_fiscal
    check: "Advance headroom is strictly positive: round(Claim.advance_cap - Claim.advance_paid_total, 2) > 0.00"
    error_id: ERR_ADVANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /advance-payments"
  - priority: 40
    category: business_fiscal
    check: "Voiding an advance must not drop Claim.advance_paid_total below the mandated floor of any EFFECTIVE ADVANCE_PAYMENT_MANDATE bulletin covering clock_now"
    error_id: ERR_ADVANCE_MANDATE_FLOOR
    http_status: 409
    applies_to: "POST /advance-payments/{advanceId}/void"
  - priority: 41
    category: business_fiscal
    check: "A manual ReserveEntry must not drive Claim.case_reserve below 0.00: round(Claim.case_reserve + body.delta_case_reserve, 2) >= 0.00"
    error_id: ERR_RESERVE_WOULD_GO_NEGATIVE
    http_status: 422
    applies_to: "POST /claims/{claimId}/reserve-entries"

# Declared priority-conflict pairs (Difficulty Rule 5), each on a distinct
# error-category pair:
#   Pair A - state (19, ERR_CLAIM_NOT_INSPECTED) vs business_safety
#            (21, ERR_MORATORIUM_ACTIVE): closing a TRIAGED claim while a
#            CANCELLATION_MORATORIUM is EFFECTIVE returns ERR_CLAIM_NOT_INSPECTED.
#   Pair B - business_temporal (23, ERR_DEPLOYMENT_WINDOW_CONFLICT) vs
#            business_fiscal (38, ERR_HOUSING_CAPACITY_EXCEEDED): confirming a
#            deployment that both breaches the 12-hour rest buffer and exceeds the
#            block's rooms_available returns ERR_DEPLOYMENT_WINDOW_CONFLICT.
#   Pair C - business_referential (29, ERR_INSPECTION_MODE_MISMATCH) vs
#            business_constraint (32, ERR_ADJUSTER_AT_CAPACITY): scheduling a
#            FIELD assignment on an AERIAL-mode claim with an at-capacity adjuster
#            returns ERR_INSPECTION_MODE_MISMATCH.

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock -----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every rule that reads clock_now observes that default and MUST NOT fall back to real wall-clock time. Moving the clock forward also re-evaluates all time-driven system transitions (RegulatoryBulletin EFFECTIVE -> EXPIRED, Adjuster VALID -> EXPIRING -> EXPIRED, Adjuster RESTING -> AVAILABLE, Adjuster WAIVED -> EXPIRED)."
    roles: [CatastropheManager, DeploymentCoordinator, ClaimsExaminer, ComplianceOfficer, VendorCoordinator, Adjuster]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "clock_now = to_iso8601"
      - "All time-driven system transitions listed above are evaluated for every affected row"
      - "CatastropheEvent.moratorium_active, posture and Claim.deadline_utc recomputed for every affected event"

  # --- CatastropheEvent -------------------------------------------------------
  - method: POST
    path: "/catastrophe-events"
    description: "Creates a catastrophe event in MONITORING with a provisional cat code."
    roles: [CatastropheManager]
    code: 201
    input: [cat_code, peril_type, jurisdiction_state, event_start_utc, exposure_count, avg_insured_value, expected_severity_index]
    output: CatastropheEvent
    side_effects:
      - "status = MONITORING; posture = OPEN; version = 1"
      - "cat_code uniqueness enforced per validations priority 31"
  - method: GET
    path: "/catastrophe-events"
    description: "Lists catastrophe events with filtering, sorting by created_at ASC, and pagination."
    roles: [CatastropheManager, DeploymentCoordinator, ClaimsExaminer, ComplianceOfficer, VendorCoordinator]
    code: 200
    input: ["status?", "peril_type?", "jurisdiction_state?", "posture?", "limit?", "offset?"]
    output: CatastropheEvent[]
    side_effects: []
  - method: GET
    path: "/catastrophe-events/{eventId}"
    description: "Reads one catastrophe event including every computed roll-up (posture, incurred_total, paid_total, case_reserve_total, housing_committed_cost, deployment_settled_cost, gross_loss_estimate, moratorium_active, open_claim_count, surge_adjuster_count, version)."
    roles: [CatastropheManager, DeploymentCoordinator, ClaimsExaminer, ComplianceOfficer, VendorCoordinator]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects: []
  - method: POST
    path: "/catastrophe-events/{eventId}/declare"
    description: "Declares the event, locking in the catastrophe code and opening the event to claims, deployments and vendor activation."
    roles: [CatastropheManager]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects:
      - "MONITORING -> DECLARED with declared_at_utc = clock_now"
      - "posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/catastrophe-events/{eventId}/activate-surge"
    description: "Moves a declared event into full surge operations. Requires an ACTIVE housing block and a non-stale loss estimate."
    roles: [CatastropheManager]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects:
      - "DECLARED -> SURGE_ACTIVE; posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/catastrophe-events/{eventId}/demobilize"
    description: "Begins demobilization. Blocked while a cancellation moratorium is in force or untriaged claims remain."
    roles: [CatastropheManager]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects:
      - "SURGE_ACTIVE -> DEMOBILIZING; every REQUESTED Deployment on the event -> CANCELLED"
      - "posture recomputed (floor RESTRICTED); increments CatastropheEvent.version by 1"
  - method: POST
    path: "/catastrophe-events/{eventId}/close"
    description: "Closes the event from DEMOBILIZING (full path) or directly from DECLARED (stand-down branch when no claims and no deployments exist)."
    roles: [CatastropheManager]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects:
      - "DEMOBILIZING -> CLOSED: HousingBlocks released, activated VendorFirms returned to NETWORK_INACTIVE, posture = FROZEN"
      - "DECLARED -> CLOSED: HousingBlocks released, posture = FROZEN, no vendor deactivation"
      - "increments CatastropheEvent.version by 1"

  # --- RegulatoryBulletin -----------------------------------------------------
  - method: POST
    path: "/regulatory-bulletins"
    description: "Records a regulator bulletin against an event in DRAFT."
    roles: [ComplianceOfficer]
    code: 201
    input: [event_id, bulletin_number, jurisdiction_state, bulletin_type, effective_from, effective_to, "mandated_advance_pct?", "deadline_extension_days?"]
    output: RegulatoryBulletin
    side_effects:
      - "status = DRAFT; activated_at_utc = null"
  - method: GET
    path: "/regulatory-bulletins"
    description: "Lists bulletins, filterable by parent event (FK reverse-reachability for RegulatoryBulletin.event_id)."
    roles: [ComplianceOfficer, CatastropheManager, ClaimsExaminer]
    code: 200
    input: ["event_id?", "bulletin_type?", "status?", "limit?", "offset?"]
    output: RegulatoryBulletin[]
    side_effects: []
  - method: GET
    path: "/regulatory-bulletins/{bulletinId}"
    description: "Reads one regulatory bulletin including bulletin_type, status, event_id, jurisdiction_state, moratorium_days, deadline_days and effective/expiry timestamps."
    roles: [ComplianceOfficer, CatastropheManager, ClaimsExaminer]
    code: 200
    input: []
    output: RegulatoryBulletin
    side_effects: []
  - method: POST
    path: "/regulatory-bulletins/{bulletinId}/activate"
    description: "Puts a DRAFT bulletin into force, cascading deadline recomputation and/or moratorium posture."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryBulletin
    side_effects:
      - "DRAFT -> EFFECTIVE with activated_at_utc = clock_now"
      - "CLAIM_DEADLINE_EXTENSION: Claim.deadline_utc recomputed for every Claim with event_id == this.event_id and handling_status NOT IN {CLOSED, TRANSFERRED}"
      - "CANCELLATION_MORATORIUM: event moratorium_active and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/regulatory-bulletins/{bulletinId}/withdraw"
    description: "Withdraws a DRAFT or EFFECTIVE bulletin, reversing its deadline and posture effects."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryBulletin
    side_effects:
      - "{DRAFT, EFFECTIVE} -> WITHDRAWN"
      - "event moratorium_active, posture and Claim.deadline_utc recomputed"

  # --- Adjuster ---------------------------------------------------------------
  - method: POST
    path: "/adjusters"
    description: "Registers a staff or independent adjuster in AVAILABLE / VALID."
    roles: [DeploymentCoordinator]
    code: 201
    input: [full_name, employment_type, home_state, licensed_states, license_expiry_utc, max_open_claims, daily_rate, per_diem_rate, "desk_certified?", "aerial_certified?"]
    output: Adjuster
    side_effects:
      - "deployment_status = AVAILABLE; credential_status = VALID unless clock_now already crosses the licence windows, in which case EXPIRING or EXPIRED is stamped immediately"
      - "surge_capacity_score computed via calculations.adjuster_surge_capacity_score"
  - method: GET
    path: "/adjusters"
    description: "Lists adjusters with filters and pagination; the ranked pool used by calculations.adjuster_deployment_selector is observable here."
    roles: [DeploymentCoordinator, CatastropheManager, ClaimsExaminer, ComplianceOfficer]
    code: 200
    input: ["deployment_status?", "credential_status?", "employment_type?", "licensed_state?", "limit?", "offset?"]
    output: Adjuster[]
    side_effects: []
  - method: GET
    path: "/adjusters/{adjusterId}"
    description: "Reads one adjuster including credential_status, deployment_status, open_assignment_count, cumulative_deployed_hours, surge_capacity_score, last_demobilized_at_utc and version."
    roles: [DeploymentCoordinator, CatastropheManager, ClaimsExaminer, ComplianceOfficer, Adjuster]
    code: 200
    input: []
    output: Adjuster
    side_effects: []
  - method: POST
    path: "/adjusters/{adjusterId}/set-unavailable"
    description: "Marks an AVAILABLE adjuster as UNAVAILABLE, removing them from the deployment selector pool."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Adjuster
    side_effects:
      - "deployment_status AVAILABLE -> UNAVAILABLE"
  - method: POST
    path: "/adjusters/{adjusterId}/set-available"
    description: "Returns an UNAVAILABLE adjuster to the pool."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Adjuster
    side_effects:
      - "deployment_status UNAVAILABLE -> AVAILABLE; surge_capacity_score recomputed"
  - method: POST
    path: "/adjusters/{adjusterId}/apply-license-waiver"
    description: "Applies an emergency licence waiver to an EXPIRED independent adjuster, backed by an EFFECTIVE ADJUSTER_LICENSE_WAIVER bulletin on the named event."
    roles: [ComplianceOfficer]
    code: 200
    input: [event_id]
    output: Adjuster
    side_effects:
      - "credential_status EXPIRED -> WAIVED; surge_capacity_score recomputed (-8 credential penalty)"

  # --- HousingBlock -----------------------------------------------------------
  - method: POST
    path: "/housing-blocks"
    description: "Holds a hotel room block for an event in PENDING."
    roles: [DeploymentCoordinator]
    code: 201
    input: [event_id, hotel_name, city, rooms_total, nightly_rate, block_start_date, block_end_date]
    output: HousingBlock
    side_effects:
      - "status = PENDING; rooms_occupied = 0; rooms_available = rooms_total; block_night_count computed"
  - method: GET
    path: "/housing-blocks"
    description: "Lists housing blocks, filterable by parent event (FK reverse-reachability for HousingBlock.event_id)."
    roles: [DeploymentCoordinator, CatastropheManager]
    code: 200
    input: ["event_id?", "status?", "city?", "limit?", "offset?"]
    output: HousingBlock[]
    side_effects: []
  - method: GET
    path: "/housing-blocks/{housingBlockId}"
    description: "Reads one housing block including rooms_occupied, rooms_available, block_night_count, status and version."
    roles: [DeploymentCoordinator, CatastropheManager]
    code: 200
    input: []
    output: HousingBlock
    side_effects: []
  - method: POST
    path: "/housing-blocks/{housingBlockId}/open"
    description: "Opens a PENDING block for occupancy. A block with rooms_total == 0 can never be opened."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: HousingBlock
    side_effects:
      - "PENDING -> ACTIVE; parent CatastropheEvent.housing_committed_cost recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/housing-blocks/{housingBlockId}/release"
    description: "Releases an unoccupied block back to the hotel."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: HousingBlock
    side_effects:
      - "{PENDING, ACTIVE, EXHAUSTED} -> RELEASED; parent CatastropheEvent.housing_committed_cost recomputed"

  # --- Deployment -------------------------------------------------------------
  - method: POST
    path: "/deployments"
    description: "Requests a deployment. Omit adjuster_id to let the server pick one via calculations.adjuster_deployment_selector (eligibility filter, surge_capacity_score DESC ranking, max_open_claims DESC then created_at ASC tie-break, ERR_NO_ELIGIBLE_ADJUSTER on an empty pool)."
    roles: [DeploymentCoordinator]
    code: 201
    input: [event_id, role_type, window_start_utc, window_end_utc, "adjuster_id?", "housing_block_id?", "rooms_reserved?"]
    output: Deployment
    side_effects:
      - "status = REQUESTED; selection_reason = EXPLICIT_ADJUSTER when adjuster_id was supplied, else SELECTOR_RANKED"
      - "No housing rooms are drawn while REQUESTED; provisional_cost and final_settled_cost are 0.00"
  - method: GET
    path: "/deployments"
    description: "Lists deployments; FK reverse-reachability for Deployment.event_id, Deployment.adjuster_id and Deployment.housing_block_id."
    roles: [DeploymentCoordinator, CatastropheManager, Adjuster]
    code: 200
    input: ["event_id?", "adjuster_id?", "housing_block_id?", "status?", "role_type?", "limit?", "offset?"]
    output: Deployment[]
    side_effects: []
  - method: GET
    path: "/deployments/{deploymentId}"
    description: "Reads one deployment including provisional_cost, final_settled_cost, surge_premium_tier, selection_reason, demobilized_at_utc and version."
    roles: [DeploymentCoordinator, CatastropheManager, Adjuster]
    code: 200
    input: []
    output: Deployment
    side_effects: []
  - method: POST
    path: "/deployments/{deploymentId}/confirm"
    description: "Confirms a requested deployment: draws housing rooms, locks the adjuster, and stamps provisional_cost."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Deployment
    side_effects:
      - "REQUESTED -> CONFIRMED; provisional_cost and surge_premium_tier stamped from calculations.deployment_cost variant PROVISIONAL"
      - "HousingBlock.rooms_occupied += rooms_reserved; block ACTIVE -> EXHAUSTED when rooms_available hits 0"
      - "Adjuster.deployment_status AVAILABLE -> DEPLOYED; surge_capacity_score recomputed"
      - "CatastropheEvent.surge_adjuster_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/deployments/{deploymentId}/check-in"
    description: "Records the adjuster arriving on site once the window has opened."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Deployment
    side_effects:
      - "CONFIRMED -> ON_SITE; Adjuster.cumulative_deployed_hours and surge_capacity_score recomputed"
  - method: POST
    path: "/deployments/{deploymentId}/demobilize"
    description: "Demobilizes the deployment and settles it, firing the five-link cascade demobilize_deployment_chain."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Deployment
    side_effects:
      - "{CONFIRMED, ON_SITE} -> DEMOBILIZED; final_settled_cost and surge_premium_tier stamped from calculations.deployment_cost variant FINAL_SETTLED; demobilized_at_utc = clock_now"
      - "HousingBlock rooms returned; EXHAUSTED -> ACTIVE when rooms_available becomes >= 1"
      - "Adjuster DEPLOYED -> RESTING -> that adjuster's SCHEDULED/IN_PROGRESS InspectionAssignments -> CANCELLED -> affected Claims INSPECTION_PENDING -> TRIAGED -> CatastropheEvent.posture recomputed"
      - "CatastropheEvent.deployment_settled_cost and surge_adjuster_count recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/deployments/{deploymentId}/cancel"
    description: "Cancels a REQUESTED or CONFIRMED deployment, restoring housing rooms exactly (compensating action for housing_room_conservation_invariant)."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: Deployment
    side_effects:
      - "{REQUESTED, CONFIRMED} -> CANCELLED; final_settled_cost = 0.00"
      - "From CONFIRMED: HousingBlock.rooms_occupied -= rooms_reserved, rooms_available restored to its pre-confirm value, EXHAUSTED -> ACTIVE when applicable, Adjuster DEPLOYED -> RESTING"
      - "CatastropheEvent.surge_adjuster_count, housing_committed_cost and posture recomputed; increments CatastropheEvent.version by 1"

  # --- Claim ------------------------------------------------------------------
  - method: POST
    path: "/claims"
    description: "Takes first notice of loss. event_id may be supplied at intake or left null and assigned later via assign-cat-code."
    roles: [ClaimsExaminer]
    code: 201
    input: [policy_number, loss_state, loss_date_utc, reported_loss_amount, coverage_lines, "event_id?", "access_status?"]
    output: Claim
    side_effects:
      - "handling_status = INTAKE; payment_status = NONE; reported_at_utc = clock_now"
      - "severity_score = 0.00; triage_tier, inspection_mode, deadline_utc, verified_damage_amount all null; reopen_count = 0"
      - "Parent CatastropheEvent.open_claim_count and posture recomputed when event_id was supplied; increments CatastropheEvent.version by 1"
  - method: GET
    path: "/claims"
    description: "Lists claims; FK reverse-reachability for Claim.event_id and Claim.transfer_batch_id."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer, DeploymentCoordinator]
    code: 200
    input: ["event_id?", "transfer_batch_id?", "handling_status?", "payment_status?", "triage_tier?", "loss_state?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claims/{claimId}"
    description: "Reads one claim including severity_score, triage_tier, inspection_mode, advance_cap, advance_paid_total, case_reserve, paid_amount, verified_damage_amount, deadline_utc, reopen_count, closing_examiner_user_id, advance_issuing_examiner_user_id, transfer_batch_id and version."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer, Adjuster, VendorCoordinator]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/assign-cat-code"
    description: "Attaches an INTAKE claim to a DECLARED or SURGE_ACTIVE catastrophe event, setting Claim.event_id."
    roles: [ClaimsExaminer]
    code: 200
    input: [event_id]
    output: Claim
    side_effects:
      - "Claim.event_id = body.event_id"
      - "Parent CatastropheEvent.open_claim_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/claims/{claimId}/triage"
    description: "Triages a cat-coded claim: stamps severity_score, triage_tier, inspection_mode and deadline_utc, and opens the initial case reserve."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "INTAKE -> TRIAGED; severity_score and triage_tier from calculations.claim_triage_severity_score; inspection_mode from calculations.inspection_mode_resolution; deadline_utc from calculations.claim_deadline_resolution"
      - "An INITIAL_CASE ReserveEntry is appended with delta_case_reserve from calculations.initial_case_reserve and delta_paid = 0.00"
      - "Claim.case_reserve, CatastropheEvent.case_reserve_total and incurred_total recomputed; snapshots with a lower sequence high-water flip stale = true; posture recomputed"
      - "increments Claim.version by 1 and CatastropheEvent.version by 1"
  - method: POST
    path: "/claims/{claimId}/close"
    description: "Closes an inspected claim. Blocked by an active moratorium, by an outstanding advance, by open vendor jobs, and by segregation of duties against the advance-issuing examiner."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "INSPECTED -> CLOSED; closing_examiner_user_id = X-User-ID"
      - "CatastropheEvent.open_claim_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/claims/{claimId}/reopen"
    description: "Reopens a closed claim (at most twice), resetting the acknowledgement deadline anchor."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "CLOSED -> REOPENED; reopen_count += 1; closing_examiner_user_id = null"
      - "deadline_utc, severity_score, triage_tier and inspection_mode recomputed"
      - "CatastropheEvent.open_claim_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/claims/{claimId}/reserve-entries"
    description: "Appends a manual reserve movement (REVISION or PAYMENT) to a claim under optimistic concurrency on the claim's version."
    roles: [ClaimsExaminer]
    code: 201
    input: [expected_claim_version, entry_type, delta_case_reserve, delta_paid, "settles_claim?", "memo?"]
    output: ReserveEntry
    side_effects:
      - "Appends a ReserveEntry with sequence_no = next per-event integer, effective_utc = clock_now, reverses_entry_id = null"
      - "entry_type == PAYMENT: Claim.payment_status advances per §1.2 (NONE/ADVANCE_ISSUED -> PARTIAL_PAID, or -> SETTLED when settles_claim == true, which also zeroes the residual case reserve)"
      - "Claim.case_reserve, Claim.paid_amount, CatastropheEvent.case_reserve_total, paid_total, incurred_total recomputed; snapshots staled; posture recomputed"
      - "increments Claim.version by 1 and CatastropheEvent.version by 1"
  - method: GET
    path: "/reserve-entries"
    description: "Lists reserve ledger entries in sequence_no ASC order; FK reverse-reachability for ReserveEntry.event_id, ReserveEntry.claim_id and the self-reference ReserveEntry.reverses_entry_id."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer]
    code: 200
    input: ["event_id?", "claim_id?", "reverses_entry_id?", "entry_type?", "limit?", "offset?"]
    output: ReserveEntry[]
    side_effects: []

  # --- InspectionAssignment ---------------------------------------------------
  - method: GET
    path: "/reserve-entries/{reserveEntryId}"
    description: "Reads one reserve ledger entry including entry_type, sequence_no, delta_case_reserve, delta_paid_amount, event_id, claim_id and reverses_entry_id."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer]
    code: 200
    input: []
    output: ReserveEntry
    side_effects: []
  - method: POST
    path: "/inspection-assignments"
    description: "Schedules an inspection. Omit adjuster_id to let the server pick one via calculations.adjuster_deployment_selector. mode must equal the claim's currently computed inspection_mode."
    roles: [DeploymentCoordinator]
    code: 201
    input: [claim_id, mode, window_start_utc, window_end_utc, "adjuster_id?", "deployment_id?"]
    output: InspectionAssignment
    side_effects:
      - "status = SCHEDULED; selection_reason = EXPLICIT_ADJUSTER or SELECTOR_RANKED; report_submitted_at_utc = null; verified_damage_amount = null"
      - "Claim {TRIAGED, REOPENED} -> INSPECTION_PENDING"
      - "Adjuster.open_assignment_count and surge_capacity_score recomputed"
      - "CatastropheEvent.posture recomputed; increments CatastropheEvent.version by 1"
  - method: GET
    path: "/inspection-assignments"
    description: "Lists inspection assignments; FK reverse-reachability for InspectionAssignment.claim_id, adjuster_id and deployment_id."
    roles: [DeploymentCoordinator, ClaimsExaminer, CatastropheManager, Adjuster]
    code: 200
    input: ["claim_id?", "adjuster_id?", "deployment_id?", "status?", "mode?", "limit?", "offset?"]
    output: InspectionAssignment[]
    side_effects: []
  - method: GET
    path: "/inspection-assignments/{assignmentId}"
    description: "Reads one inspection assignment including status, mode, claim_id, adjuster_id, deployment_id, window timestamps and no_access_count."
    roles: [DeploymentCoordinator, ClaimsExaminer, CatastropheManager, Adjuster]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects: []
  - method: POST
    path: "/inspection-assignments/{assignmentId}/start"
    description: "The assigned adjuster starts the inspection once the window has opened."
    roles: [Adjuster]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects:
      - "SCHEDULED -> IN_PROGRESS"
  - method: POST
    path: "/inspection-assignments/{assignmentId}/complete"
    description: "The assigned adjuster submits a verified damage figure, moving the claim to INSPECTED and revising the case reserve."
    roles: [Adjuster]
    code: 200
    input: [verified_damage_amount]
    output: InspectionAssignment
    side_effects:
      - "IN_PROGRESS -> COMPLETED; report_submitted_at_utc = clock_now"
      - "Claim INSPECTION_PENDING -> INSPECTED; Claim.verified_damage_amount refreshed"
      - "A REVISION ReserveEntry is appended with delta_case_reserve from calculations.reserve_revision_delta and delta_paid = 0.00"
      - "Claim.case_reserve, CatastropheEvent roll-ups recomputed; snapshots staled; posture recomputed"
      - "Adjuster.open_assignment_count and surge_capacity_score recomputed; increments Claim.version by 1 and CatastropheEvent.version by 1"
  - method: POST
    path: "/inspection-assignments/{assignmentId}/report-no-access"
    description: "The assigned adjuster reports the property inaccessible; the claim flips to INACCESSIBLE and its inspection_mode is re-resolved (typically to AERIAL or DESK)."
    roles: [Adjuster]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects:
      - "IN_PROGRESS -> NO_ACCESS; report_submitted_at_utc = clock_now"
      - "Claim.access_status = INACCESSIBLE; Claim.inspection_mode recomputed; Claim INSPECTION_PENDING -> INSPECTED with verified_damage_amount left null and NO REVISION entry"
      - "Adjuster.open_assignment_count and surge_capacity_score recomputed; increments Claim.version by 1"
  - method: POST
    path: "/inspection-assignments/{assignmentId}/cancel"
    description: "Cancels a scheduled or in-progress inspection, regressing the claim to TRIAGED when it has no other live assignment."
    roles: [DeploymentCoordinator]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects:
      - "{SCHEDULED, IN_PROGRESS} -> CANCELLED"
      - "Claim INSPECTION_PENDING -> TRIAGED when no SCHEDULED/IN_PROGRESS assignment remains"
      - "Adjuster.open_assignment_count and surge_capacity_score recomputed; CatastropheEvent.posture recomputed; increments CatastropheEvent.version by 1"

  # --- AdvancePayment ---------------------------------------------------------
  - method: POST
    path: "/advance-payments"
    description: "Issues an advance payment against a triaged claim, capped by calculations.advance_payment_amount (per-coverage-line rounding, then tier multiplier, floored by any ADVANCE_PAYMENT_MANDATE bulletin)."
    roles: [ClaimsExaminer]
    code: 201
    input: [claim_id, requested_amount, basis]
    output: AdvancePayment
    side_effects:
      - "status = ISSUED; amount from calculations.advance_payment_amount; Claim.advance_cap refreshed"
      - "A PAYMENT ReserveEntry is appended per calculations.advance_reserve_movement (delta_paid = +amount, delta_case_reserve = -amount); reserve_entry_id set to its id"
      - "Claim.payment_status NONE -> ADVANCE_ISSUED; advance_issuing_examiner_user_id = X-User-ID when previously null"
      - "Claim.advance_paid_total, paid_amount, case_reserve and CatastropheEvent.paid_total, case_reserve_total recomputed; incurred_total UNCHANGED; snapshots staled; posture recomputed"
      - "increments Claim.version by 1 and CatastropheEvent.version by 1"
  - method: GET
    path: "/advance-payments"
    description: "Lists advance payments; FK reverse-reachability for AdvancePayment.claim_id and AdvancePayment.reserve_entry_id."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer]
    code: 200
    input: ["claim_id?", "reserve_entry_id?", "status?", "limit?", "offset?"]
    output: AdvancePayment[]
    side_effects: []
  - method: GET
    path: "/advance-payments/{advanceId}"
    description: "Reads one advance payment including status, amount, claim_id, reserve_entry_id, issued_at_utc and voided_at_utc."
    roles: [ClaimsExaminer, CatastropheManager, ComplianceOfficer]
    code: 200
    input: []
    output: AdvancePayment
    side_effects: []
  - method: POST
    path: "/advance-payments/{advanceId}/void"
    description: "Voids an issued advance, firing the four-link cascade void_advance_chain and preserving CatastropheEvent.incurred_total exactly."
    roles: [ClaimsExaminer]
    code: 200
    input: [void_reason]
    output: AdvancePayment
    side_effects:
      - "ISSUED -> VOIDED; voided_at_utc = clock_now"
      - "A REVERSAL ReserveEntry is appended with reverses_entry_id = this.reserve_entry_id, delta_paid = -amount, delta_case_reserve = +amount"
      - "Claim.payment_status ADVANCE_ISSUED -> NONE when advance_paid_total returns to 0.00; advance_issuing_examiner_user_id retained"
      - "LossEstimateSnapshots below the new sequence high-water flip stale = true; CatastropheEvent.posture recomputed; incurred_total UNCHANGED"
      - "increments Claim.version by 1 and CatastropheEvent.version by 1"

  # --- VendorFirm / VendorAssignment -----------------------------------------
  - method: POST
    path: "/vendor-firms"
    description: "Registers a mitigation or contractor firm in NETWORK_INACTIVE."
    roles: [VendorCoordinator]
    code: 201
    input: [firm_name, vendor_type, service_states, max_concurrent_jobs, performance_score]
    output: VendorFirm
    side_effects:
      - "status = NETWORK_INACTIVE; activated_for_event_id = null; open_job_count = 0"
  - method: GET
    path: "/vendor-firms"
    description: "Lists vendor firms; FK reverse-reachability for VendorFirm.activated_for_event_id."
    roles: [VendorCoordinator, ClaimsExaminer, CatastropheManager]
    code: 200
    input: ["activated_for_event_id?", "vendor_type?", "status?", "service_state?", "limit?", "offset?"]
    output: VendorFirm[]
    side_effects: []
  - method: GET
    path: "/vendor-firms/{vendorFirmId}"
    description: "Reads one vendor firm including vendor_type, status, service_state, activated_for_event_id, concurrency_limit and open_assignment_count."
    roles: [VendorCoordinator, ClaimsExaminer, CatastropheManager]
    code: 200
    input: []
    output: VendorFirm
    side_effects: []
  - method: POST
    path: "/vendor-firms/{vendorFirmId}/activate"
    description: "Activates a network firm onto a declared event, subject to state licensing."
    roles: [VendorCoordinator]
    code: 200
    input: [event_id]
    output: VendorFirm
    side_effects:
      - "NETWORK_INACTIVE -> ACTIVATED; activated_for_event_id = body.event_id"
  - method: POST
    path: "/vendor-firms/{vendorFirmId}/suspend"
    description: "Suspends a firm from the network, cancelling its undelivered dispatches."
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorFirm
    side_effects:
      - "{NETWORK_INACTIVE, ACTIVATED, CAPACITY_HOLD} -> SUSPENDED; activated_for_event_id = null"
      - "Every DISPATCHED VendorAssignment of the firm -> CANCELLED; open_job_count recomputed"
  - method: POST
    path: "/vendor-assignments"
    description: "Dispatches mitigation work on a claim. Omit vendor_firm_id to let the server pick one via calculations.vendor_selector (performance_score DESC, spare-capacity DESC, created_at ASC; ERR_NO_ELIGIBLE_VENDOR on an empty pool)."
    roles: [ClaimsExaminer]
    code: 201
    input: [claim_id, scope_amount, required_vendor_type, "vendor_firm_id?"]
    output: VendorAssignment
    side_effects:
      - "status = DISPATCHED; dispatched_at_utc = clock_now; selection_reason = EXPLICIT_VENDOR or SELECTOR_RANKED"
      - "VendorFirm.open_job_count recomputed"
  - method: GET
    path: "/vendor-assignments"
    description: "Lists vendor assignments; FK reverse-reachability for VendorAssignment.claim_id and VendorAssignment.vendor_firm_id."
    roles: [VendorCoordinator, ClaimsExaminer, CatastropheManager]
    code: 200
    input: ["claim_id?", "vendor_firm_id?", "status?", "limit?", "offset?"]
    output: VendorAssignment[]
    side_effects: []
  - method: GET
    path: "/vendor-assignments/{vendorAssignmentId}"
    description: "Reads one vendor assignment including status, claim_id, vendor_firm_id, scope, dispatched_at_utc and completed_at_utc."
    roles: [VendorCoordinator, ClaimsExaminer, CatastropheManager]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: []
  - method: POST
    path: "/vendor-assignments/{vendorAssignmentId}/accept"
    description: "The dispatched firm accepts the job, consuming one of its concurrency slots."
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorAssignment
    side_effects:
      - "DISPATCHED -> ACCEPTED; VendorFirm.open_job_count recomputed; ACTIVATED -> CAPACITY_HOLD when open_job_count reaches max_concurrent_jobs"
  - method: POST
    path: "/vendor-assignments/{vendorAssignmentId}/decline"
    description: "The dispatched firm declines the job."
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorAssignment
    side_effects:
      - "DISPATCHED -> DECLINED; VendorFirm.open_job_count recomputed"
  - method: POST
    path: "/vendor-assignments/{vendorAssignmentId}/complete"
    description: "The firm reports the mitigation work finished, freeing a concurrency slot."
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorAssignment
    side_effects:
      - "ACCEPTED -> COMPLETED; VendorFirm.open_job_count recomputed; CAPACITY_HOLD -> ACTIVATED when it falls below max_concurrent_jobs"
  - method: POST
    path: "/vendor-assignments/{vendorAssignmentId}/cancel"
    description: "The examiner cancels a dispatched or accepted vendor job, unblocking claim closure."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: VendorAssignment
    side_effects:
      - "{DISPATCHED, ACCEPTED} -> CANCELLED; VendorFirm.open_job_count recomputed; CAPACITY_HOLD -> ACTIVATED when it falls below max_concurrent_jobs"

  # --- LossEstimateSnapshot ---------------------------------------------------
  - method: POST
    path: "/loss-estimates"
    description: "Computes and stores a gross loss estimate for an event under optimistic concurrency on the event's version. method selects between the two variants of calculations.event_loss_estimate."
    roles: [CatastropheManager]
    code: 201
    input: [event_id, method, expected_event_version]
    output: LossEstimateSnapshot
    side_effects:
      - "gross_estimate, reported_component and ibnr_component stamped from calculations.event_loss_estimate for the chosen method"
      - "input_reserve_sequence_high_water = greatest ReserveEntry.sequence_no for the event (0 when none); stale = false; computed_at_utc = clock_now"
      - "CatastropheEvent.gross_loss_estimate refreshed; posture recomputed; increments CatastropheEvent.version by 1"
  - method: GET
    path: "/loss-estimates"
    description: "Lists loss estimate snapshots in computed_at_utc ASC order; FK reverse-reachability for LossEstimateSnapshot.event_id. Each row's stale flag is re-evaluated on read."
    roles: [CatastropheManager, ClaimsExaminer, ComplianceOfficer]
    code: 200
    input: ["event_id?", "method?", "stale?", "limit?", "offset?"]
    output: LossEstimateSnapshot[]
    side_effects: []

  # --- FileTransferBatch ------------------------------------------------------
  - method: GET
    path: "/loss-estimates/{snapshotId}"
    description: "Reads one loss estimate snapshot including method, estimated_loss_total, event_id, stale flag and computed_at_utc."
    roles: [CatastropheManager, ClaimsExaminer, ComplianceOfficer]
    code: 200
    input: []
    output: LossEstimateSnapshot
    side_effects: []
  - method: POST
    path: "/file-transfer-batches"
    description: "Opens a demobilization file-transfer batch targeting a routine handling unit."
    roles: [ClaimsExaminer]
    code: 201
    input: [event_id, target_unit]
    output: FileTransferBatch
    side_effects:
      - "status = OPEN; claim_count = 0; blocking_claim_count = 0; rejection_reason = null"
  - method: GET
    path: "/file-transfer-batches"
    description: "Lists batches; FK reverse-reachability for FileTransferBatch.event_id."
    roles: [ClaimsExaminer, CatastropheManager]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: FileTransferBatch[]
    side_effects: []
  - method: GET
    path: "/file-transfer-batches/{batchId}"
    description: "Reads one file transfer batch including status, event_id, claim_count, blocking_claim_count, submitted/accepted/rejected metadata and rejection_reason."
    roles: [ClaimsExaminer, CatastropheManager]
    code: 200
    input: []
    output: FileTransferBatch
    side_effects: []
  - method: POST
    path: "/file-transfer-batches/{batchId}/claims"
    description: "Adds a CLOSED claim of the same event to an OPEN batch by setting Claim.transfer_batch_id."
    roles: [ClaimsExaminer]
    code: 200
    input: [claim_id]
    output: FileTransferBatch
    side_effects:
      - "Claim.transfer_batch_id = batchId; batch claim_count and blocking_claim_count recomputed"
      - "increments Claim.version by 1"
  - method: POST
    path: "/file-transfer-batches/{batchId}/submit"
    description: "Submits the batch to routine handling, transferring every member claim."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: FileTransferBatch
    side_effects:
      - "OPEN -> SUBMITTED; submitted_at_utc = clock_now; the submitting X-User-ID is recorded for the segregation-of-duties check on accept"
      - "Every member Claim: CLOSED -> TRANSFERRED"
      - "CatastropheEvent.open_claim_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/file-transfer-batches/{batchId}/accept"
    description: "The receiving unit accepts the batch. Must be a different X-User-ID than the submitter."
    roles: [CatastropheManager]
    code: 200
    input: []
    output: FileTransferBatch
    side_effects:
      - "SUBMITTED -> ACCEPTED"
  - method: POST
    path: "/file-transfer-batches/{batchId}/reject"
    description: "The receiving unit rejects the batch, returning every member claim to CLOSED."
    roles: [CatastropheManager]
    code: 200
    input: [rejection_reason]
    output: FileTransferBatch
    side_effects:
      - "SUBMITTED -> REJECTED; rejection_reason recorded"
      - "Every member Claim: TRANSFERRED -> CLOSED; CatastropheEvent.open_claim_count and posture recomputed; increments CatastropheEvent.version by 1"
  - method: POST
    path: "/file-transfer-batches/{batchId}/reopen-batch"
    description: "Returns a rejected batch to OPEN so its membership can be corrected and resubmitted."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: FileTransferBatch
    side_effects:
      - "REJECTED -> OPEN; rejection_reason = null"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-Role or X-User-ID header absent or empty" }
  - { id: ERR_UNKNOWN_ROLE, http: 401, condition: "X-User-Role is not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the target endpoint's roles" }
  - { id: ERR_NOT_ASSIGNED_ADJUSTER, http: 403, condition: "Adjuster role acting on an InspectionAssignment whose adjuster_id != X-User-ID" }
  - { id: ERR_NOT_ASSIGNED_VENDOR, http: 403, condition: "VendorCoordinator accepting/declining/completing a VendorAssignment whose vendor_firm_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The examiner closing a Claim is the same X-User-ID recorded in Claim.advance_issuing_examiner_user_id, or the user accepting a FileTransferBatch is the user who submitted it" }
  # --- existence ---
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Referenced CatastropheEvent id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced Claim id does not exist" }
  - { id: ERR_ADJUSTER_NOT_FOUND, http: 404, condition: "Referenced Adjuster id does not exist" }
  - { id: ERR_HOUSING_BLOCK_NOT_FOUND, http: 404, condition: "Referenced HousingBlock id does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "Referenced Deployment id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Referenced InspectionAssignment id does not exist" }
  - { id: ERR_ADVANCE_NOT_FOUND, http: 404, condition: "Referenced AdvancePayment id does not exist" }
  - { id: ERR_VENDOR_FIRM_NOT_FOUND, http: 404, condition: "Referenced VendorFirm id does not exist" }
  - { id: ERR_VENDOR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Referenced VendorAssignment id does not exist" }
  - { id: ERR_BULLETIN_NOT_FOUND, http: 404, condition: "Referenced RegulatoryBulletin id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Referenced FileTransferBatch id does not exist" }
  # --- payload / shape ---
  - { id: ERR_VALIDATION, http: 422, condition: "Request body violates the endpoint input schema: missing required field, wrong type, enum member not recognised, or numeric value outside its declared range" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "A submitted interval is non-positive or inverted: effective_to <= effective_from, window_end_utc <= window_start_utc, or block_end_date <= block_start_date" }
  - { id: ERR_VERIFIED_AMOUNT_REQUIRED, http: 422, condition: "POST /inspection-assignments/{assignmentId}/complete omitted verified_damage_amount or supplied a negative value" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 422, condition: "POST /file-transfer-batches/{batchId}/reject omitted rejection_reason or supplied an empty string" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "body expected_event_version does not equal the current CatastropheEvent.version on POST /loss-estimates" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "body expected_claim_version does not equal the current Claim.version on POST /claims/{claimId}/reserve-entries" }
  # --- state: CatastropheEvent ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic fallback for a state-transition endpoint invoked from a from-state that §1.2 does not declare and for which no more specific error_id above applies" }
  - { id: ERR_EVENT_NOT_MONITORING, http: 409, condition: "POST /catastrophe-events/{eventId}/declare on an event whose status != MONITORING" }
  - { id: ERR_EVENT_NOT_DECLARED, http: 409, condition: "An operation requiring status IN {DECLARED, SURGE_ACTIVE} on an event outside that set (activate-surge, bulletin activation, housing open, vendor activation, claim triage)" }
  - { id: ERR_EVENT_NOT_SURGE_ACTIVE, http: 409, condition: "POST /catastrophe-events/{eventId}/demobilize on an event whose status != SURGE_ACTIVE" }
  - { id: ERR_EVENT_NOT_DEMOBILIZING, http: 409, condition: "POST /catastrophe-events/{eventId}/close from a status other than DEMOBILIZING when the stand-down branch does not apply, or POST /file-transfer-batches/{batchId}/submit while the event is not DEMOBILIZING" }
  - { id: ERR_EVENT_NOT_STANDDOWN_ELIGIBLE, http: 409, condition: "POST /catastrophe-events/{eventId}/close from DECLARED when open_claim_count > 0 or surge_adjuster_count > 0" }
  - { id: ERR_EVENT_CLOSED, http: 409, condition: "POST /claims/{claimId}/reopen on a claim whose parent event status == CLOSED" }
  - { id: ERR_EVENT_POSTURE_FROZEN, http: 409, condition: "A child-entity mutation attempted while the parent CatastropheEvent.posture == FROZEN" }
  - { id: ERR_NO_ACTIVE_HOUSING, http: 409, condition: "POST /catastrophe-events/{eventId}/activate-surge with zero HousingBlock rows on the event in status ACTIVE" }
  - { id: ERR_LOSS_ESTIMATE_STALE, http: 409, condition: "POST /catastrophe-events/{eventId}/activate-surge with zero LossEstimateSnapshot rows on the event whose stale == false" }
  - { id: ERR_UNTRIAGED_CLAIMS_REMAIN, http: 409, condition: "POST /catastrophe-events/{eventId}/demobilize while at least one Claim on the event has handling_status IN {INTAKE, TRIAGED}" }
  - { id: ERR_DEPLOYMENTS_STILL_OPEN, http: 409, condition: "POST /catastrophe-events/{eventId}/close while at least one Deployment on the event has status IN {REQUESTED, CONFIRMED, ON_SITE}" }
  - { id: ERR_CLAIMS_STILL_OPEN, http: 409, condition: "POST /catastrophe-events/{eventId}/close while at least one Claim on the event has handling_status NOT IN {CLOSED, TRANSFERRED}" }
  - { id: ERR_TRANSFER_BATCH_UNACCEPTED, http: 409, condition: "POST /catastrophe-events/{eventId}/close while at least one FileTransferBatch on the event has status != ACCEPTED" }
  - { id: ERR_CAT_CODE_TAKEN, http: 409, condition: "cat_code already held by another CatastropheEvent" }
  # --- state: RegulatoryBulletin ---
  - { id: ERR_BULLETIN_NOT_DRAFT, http: 409, condition: "POST /regulatory-bulletins/{bulletinId}/activate on a bulletin whose status != DRAFT" }
  - { id: ERR_BULLETIN_NOT_WITHDRAWABLE, http: 409, condition: "POST /regulatory-bulletins/{bulletinId}/withdraw on a bulletin whose status NOT IN {DRAFT, EFFECTIVE}" }
  - { id: ERR_BULLETIN_NUMBER_TAKEN, http: 409, condition: "(event_id, bulletin_number) already exists" }
  - { id: ERR_JURISDICTION_MISMATCH, http: 409, condition: "Bulletin jurisdiction_state does not equal its parent CatastropheEvent.jurisdiction_state on activation" }
  # --- state: Adjuster ---
  - { id: ERR_ADJUSTER_NOT_AVAILABLE, http: 409, condition: "Confirming a deployment for, or marking unavailable, an adjuster whose deployment_status != AVAILABLE" }
  - { id: ERR_ADJUSTER_NOT_UNAVAILABLE, http: 409, condition: "POST /adjusters/{adjusterId}/set-available on an adjuster whose deployment_status != UNAVAILABLE" }
  - { id: ERR_ADJUSTER_CREDENTIAL_INVALID, http: 409, condition: "An operation requiring credential_status IN {VALID, EXPIRING, WAIVED} attempted on an EXPIRED adjuster" }
  - { id: ERR_CREDENTIAL_NOT_EXPIRED, http: 409, condition: "POST /adjusters/{adjusterId}/apply-license-waiver on an adjuster whose credential_status != EXPIRED" }
  - { id: ERR_NO_LICENSE_WAIVER_IN_FORCE, http: 409, condition: "POST /adjusters/{adjusterId}/apply-license-waiver with no ADJUSTER_LICENSE_WAIVER bulletin EFFECTIVE and covering clock_now on the named event" }
  - { id: ERR_WAIVER_NOT_ELIGIBLE, http: 422, condition: "POST /adjusters/{adjusterId}/apply-license-waiver on an adjuster whose employment_type != INDEPENDENT" }
  - { id: ERR_ADJUSTER_NOT_LICENSED_IN_STATE, http: 422, condition: "Adjuster.licensed_states does not contain the event's jurisdiction_state and credential_status != WAIVED" }
  - { id: ERR_ADJUSTER_AT_CAPACITY, http: 409, condition: "Adjuster.open_assignment_count is already equal to max_open_claims when a new InspectionAssignment is scheduled" }
  - { id: ERR_NO_ELIGIBLE_ADJUSTER, http: 409, condition: "adjuster_id omitted and calculations.adjuster_deployment_selector's candidate set is empty" }
  # --- state: HousingBlock ---
  - { id: ERR_HOUSING_NOT_PENDING, http: 409, condition: "POST /housing-blocks/{housingBlockId}/open on a block whose status != PENDING" }
  - { id: ERR_HOUSING_NOT_RELEASABLE, http: 409, condition: "POST /housing-blocks/{housingBlockId}/release on a block already RELEASED" }
  - { id: ERR_HOUSING_STILL_OCCUPIED, http: 409, condition: "POST /housing-blocks/{housingBlockId}/release while rooms_occupied > 0" }
  - { id: ERR_HOUSING_BLOCK_EMPTY, http: 409, condition: "POST /housing-blocks/{housingBlockId}/open on a block whose rooms_total == 0 (zero-quantity boundary)" }
  - { id: ERR_HOUSING_CAPACITY_EXCEEDED, http: 409, condition: "Confirming a deployment whose rooms_reserved exceeds HousingBlock.rooms_available on a shared night" }
  # --- state: Deployment ---
  - { id: ERR_DEPLOYMENT_NOT_REQUESTED, http: 409, condition: "POST /deployments/{deploymentId}/confirm on a deployment whose status != REQUESTED" }
  - { id: ERR_DEPLOYMENT_NOT_CONFIRMED, http: 409, condition: "POST /deployments/{deploymentId}/check-in on a deployment whose status != CONFIRMED" }
  - { id: ERR_DEPLOYMENT_NOT_DEMOBILIZABLE, http: 409, condition: "POST /deployments/{deploymentId}/demobilize on a deployment whose status NOT IN {CONFIRMED, ON_SITE}" }
  - { id: ERR_DEPLOYMENT_NOT_CANCELLABLE, http: 409, condition: "POST /deployments/{deploymentId}/cancel on a deployment whose status NOT IN {REQUESTED, CONFIRMED}" }
  - { id: ERR_DEPLOYMENT_WINDOW_NOT_STARTED, http: 409, condition: "POST /deployments/{deploymentId}/check-in while clock_now < window_start_utc" }
  - { id: ERR_DEPLOYMENT_WINDOW_CONFLICT, http: 409, condition: "Confirming a deployment whose window is separated from another CONFIRMED/ON_SITE/DEMOBILIZED deployment of the same adjuster by less than REST_BUFFER_HOURS (12h) on either side" }
  - { id: ERR_ASSIGNMENTS_IN_FLIGHT, http: 409, condition: "POST /deployments/{deploymentId}/cancel while an InspectionAssignment funded by it has status IN {IN_PROGRESS, COMPLETED}" }
  # --- state: Claim ---
  - { id: ERR_CLAIM_NOT_IN_INTAKE, http: 409, condition: "POST /claims/{claimId}/triage or /assign-cat-code on a claim whose handling_status != INTAKE" }
  - { id: ERR_CLAIM_NOT_CAT_CODED, http: 409, condition: "POST /claims/{claimId}/triage on a claim whose event_id is null" }
  - { id: ERR_CLAIM_NOT_INSPECTED, http: 409, condition: "POST /claims/{claimId}/close, or a settling PAYMENT reserve entry, on a claim whose handling_status != INSPECTED" }
  - { id: ERR_CLAIM_NOT_CLOSED, http: 409, condition: "POST /claims/{claimId}/reopen on a claim whose handling_status != CLOSED" }
  - { id: ERR_CLAIM_NOT_TRANSFERABLE, http: 409, condition: "A batch submit encountered a member Claim whose handling_status != CLOSED, or whose transfer_batch_id != the batch, or POST /file-transfer-batches/{batchId}/claims on a claim that is not CLOSED" }
  - { id: ERR_CLAIM_ALREADY_SETTLED, http: 409, condition: "POST /advance-payments/{advanceId}/void on a claim whose payment_status == SETTLED" }
  - { id: ERR_ADVANCE_OUTSTANDING, http: 409, condition: "POST /claims/{claimId}/close while Claim.payment_status == ADVANCE_ISSUED or PARTIAL_PAID" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "POST /claims/{claimId}/reopen when Claim.reopen_count is already 2 (MAX_REOPENS boundary)" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "(policy_number, loss_date_utc) already exists on another Claim" }
  - { id: ERR_MORATORIUM_ACTIVE, http: 409, condition: "POST /claims/{claimId}/close or POST /catastrophe-events/{eventId}/demobilize while a CANCELLATION_MORATORIUM bulletin is EFFECTIVE and covers clock_now" }
  - { id: ERR_RESERVE_WOULD_GO_NEGATIVE, http: 422, condition: "A manual ReserveEntry would drive Claim.case_reserve below 0.00" }
  # --- state: InspectionAssignment ---
  - { id: ERR_ASSIGNMENT_NOT_SCHEDULED, http: 409, condition: "POST /inspection-assignments/{assignmentId}/start on an assignment whose status != SCHEDULED" }
  - { id: ERR_ASSIGNMENT_NOT_IN_PROGRESS, http: 409, condition: "POST /inspection-assignments/{assignmentId}/complete or /report-no-access on an assignment whose status != IN_PROGRESS" }
  - { id: ERR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "POST /inspection-assignments/{assignmentId}/cancel on an assignment whose status NOT IN {SCHEDULED, IN_PROGRESS}" }
  - { id: ERR_ASSIGNMENT_WINDOW_NOT_STARTED, http: 409, condition: "POST /inspection-assignments/{assignmentId}/start while clock_now < window_start_utc" }
  - { id: ERR_ASSIGNMENT_WINDOW_CONFLICT, http: 409, condition: "A new InspectionAssignment strictly overlaps another SCHEDULED/IN_PROGRESS assignment of the same adjuster under half-open, zero-buffer semantics" }
  - { id: ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT, http: 422, condition: "The assignment window is not fully contained in the funding Deployment's window" }
  - { id: ERR_INSPECTION_MODE_MISMATCH, http: 422, condition: "body.mode != Claim.inspection_mode as currently computed" }
  - { id: ERR_EVENT_SCOPE_MISMATCH, http: 409, condition: "Cross-aggregate scope violation: deployment.event_id != claim.event_id, housing_block.event_id != deployment.event_id, or a claim's event_id != the FileTransferBatch's event_id" }
  # --- state: AdvancePayment ---
  - { id: ERR_ADVANCE_NOT_ISSUED, http: 409, condition: "POST /advance-payments/{advanceId}/void on an advance whose status != ISSUED" }
  - { id: ERR_ADVANCE_CAP_EXCEEDED, http: 422, condition: "round(Claim.advance_cap - Claim.advance_paid_total, 2) <= 0.00 at issuance (exact-zero-headroom boundary included)" }
  - { id: ERR_ADVANCE_MANDATE_FLOOR, http: 409, condition: "Voiding an advance would leave Claim.advance_paid_total below the mandated floor of an EFFECTIVE ADVANCE_PAYMENT_MANDATE bulletin" }
  # --- state: VendorFirm / VendorAssignment ---
  - { id: ERR_VENDOR_NOT_INACTIVE, http: 409, condition: "POST /vendor-firms/{vendorFirmId}/activate on a firm whose status != NETWORK_INACTIVE" }
  - { id: ERR_VENDOR_NOT_ACTIVATED, http: 409, condition: "Accepting a vendor assignment while the firm's status != ACTIVATED (including CAPACITY_HOLD and SUSPENDED)" }
  - { id: ERR_VENDOR_NOT_SUSPENDABLE, http: 409, condition: "POST /vendor-firms/{vendorFirmId}/suspend on a firm already SUSPENDED" }
  - { id: ERR_VENDOR_NOT_LICENSED_IN_STATE, http: 422, condition: "VendorFirm.service_states does not contain the event's jurisdiction_state on activation, or the Claim.loss_state on dispatch" }
  - { id: ERR_VENDOR_ASSIGNMENT_NOT_DISPATCHED, http: 409, condition: "Accept or decline on a VendorAssignment whose status != DISPATCHED" }
  - { id: ERR_VENDOR_ASSIGNMENT_NOT_ACCEPTED, http: 409, condition: "POST /vendor-assignments/{vendorAssignmentId}/complete on an assignment whose status != ACCEPTED" }
  - { id: ERR_VENDOR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "POST /vendor-assignments/{vendorAssignmentId}/cancel on an assignment whose status NOT IN {DISPATCHED, ACCEPTED}" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "VendorFirm.open_job_count is already equal to max_concurrent_jobs when a job is dispatched or accepted" }
  - { id: ERR_VENDOR_NAME_TAKEN, http: 409, condition: "firm_name already held by another VendorFirm" }
  - { id: ERR_NO_ELIGIBLE_VENDOR, http: 409, condition: "vendor_firm_id omitted and calculations.vendor_selector's candidate set is empty" }
  - { id: ERR_VENDOR_JOB_OPEN, http: 409, condition: "POST /claims/{claimId}/close while a VendorAssignment on the claim has status IN {DISPATCHED, ACCEPTED}" }
  # --- state: FileTransferBatch ---
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "POST /file-transfer-batches/{batchId}/submit or /claims on a batch whose status != OPEN" }
  - { id: ERR_BATCH_NOT_SUBMITTED, http: 409, condition: "POST /file-transfer-batches/{batchId}/accept or /reject on a batch whose status != SUBMITTED" }
  - { id: ERR_BATCH_NOT_REJECTED, http: 409, condition: "POST /file-transfer-batches/{batchId}/reopen-batch on a batch whose status != REJECTED" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "POST /file-transfer-batches/{batchId}/submit with claim_count == 0 (empty-collection boundary)" }
  - { id: ERR_BATCH_HAS_BLOCKING_CLAIMS, http: 409, condition: "POST /file-transfer-batches/{batchId}/submit while blocking_claim_count > 0 (a member claim still has payment_status == ADVANCE_ISSUED or case_reserve == 0.00)" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: CatastropheManager
    description: "Owns the catastrophe event lifecycle, reserve governance and loss estimation. Declares events, activates surge, demobilizes, closes, and accepts or rejects file-transfer batches."
    identity: opaque
    exclusive_operations:
      - "POST /catastrophe-events"
      - "POST /catastrophe-events/{eventId}/declare"
      - "POST /catastrophe-events/{eventId}/activate-surge"
      - "POST /catastrophe-events/{eventId}/demobilize"
      - "POST /catastrophe-events/{eventId}/close"
      - "POST /loss-estimates"
      - "POST /file-transfer-batches/{batchId}/accept"
      - "POST /file-transfer-batches/{batchId}/reject"
    shared_operations:
      - "GET /catastrophe-events, GET /catastrophe-events/{eventId}"
      - "GET /regulatory-bulletins, GET /adjusters, GET /adjusters/{adjusterId}"
      - "GET /housing-blocks, GET /housing-blocks/{housingBlockId}"
      - "GET /deployments, GET /deployments/{deploymentId}"
      - "GET /claims, GET /claims/{claimId}, GET /reserve-entries, GET /advance-payments"
      - "GET /inspection-assignments, GET /vendor-firms, GET /vendor-assignments"
      - "GET /loss-estimates, GET /file-transfer-batches"
      - "POST /_clock/set_current_utc"

  - name: DeploymentCoordinator
    description: "Owns adjuster supply, housing logistics and inspection scheduling. Cannot triage, pay or close claims."
    identity: opaque
    exclusive_operations:
      - "POST /adjusters"
      - "POST /adjusters/{adjusterId}/set-unavailable"
      - "POST /adjusters/{adjusterId}/set-available"
      - "POST /housing-blocks"
      - "POST /housing-blocks/{housingBlockId}/open"
      - "POST /housing-blocks/{housingBlockId}/release"
      - "POST /deployments"
      - "POST /deployments/{deploymentId}/confirm"
      - "POST /deployments/{deploymentId}/check-in"
      - "POST /deployments/{deploymentId}/demobilize"
      - "POST /deployments/{deploymentId}/cancel"
      - "POST /inspection-assignments"
      - "POST /inspection-assignments/{assignmentId}/cancel"
    shared_operations:
      - "GET /catastrophe-events, GET /catastrophe-events/{eventId}"
      - "GET /adjusters, GET /adjusters/{adjusterId}, GET /housing-blocks, GET /housing-blocks/{housingBlockId}"
      - "GET /deployments, GET /deployments/{deploymentId}, GET /inspection-assignments, GET /claims"
      - "POST /_clock/set_current_utc"

  - name: ClaimsExaminer
    description: "Owns claim handling: intake, cat-code assignment, triage, reserve movements, advance payments, vendor dispatch, closure and file transfer. Segregated from claim closure when the same user issued the advance, and from batch acceptance."
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{claimId}/assign-cat-code"
      - "POST /claims/{claimId}/triage"
      - "POST /claims/{claimId}/close"
      - "POST /claims/{claimId}/reopen"
      - "POST /claims/{claimId}/reserve-entries"
      - "POST /advance-payments"
      - "POST /advance-payments/{advanceId}/void"
      - "POST /vendor-assignments"
      - "POST /vendor-assignments/{vendorAssignmentId}/cancel"
      - "POST /file-transfer-batches"
      - "POST /file-transfer-batches/{batchId}/claims"
      - "POST /file-transfer-batches/{batchId}/submit"
      - "POST /file-transfer-batches/{batchId}/reopen-batch"
    shared_operations:
      - "GET /catastrophe-events, GET /catastrophe-events/{eventId}, GET /regulatory-bulletins"
      - "GET /adjusters, GET /adjusters/{adjusterId}, GET /claims, GET /claims/{claimId}"
      - "GET /reserve-entries, GET /inspection-assignments, GET /advance-payments"
      - "GET /vendor-firms, GET /vendor-assignments, GET /loss-estimates, GET /file-transfer-batches"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Owns regulatory bulletins and emergency licence waivers. Cannot declare events, pay claims or schedule work."
    identity: opaque
    exclusive_operations:
      - "POST /regulatory-bulletins"
      - "POST /regulatory-bulletins/{bulletinId}/activate"
      - "POST /regulatory-bulletins/{bulletinId}/withdraw"
      - "POST /adjusters/{adjusterId}/apply-license-waiver"
    shared_operations:
      - "GET /catastrophe-events, GET /catastrophe-events/{eventId}, GET /regulatory-bulletins"
      - "GET /adjusters, GET /adjusters/{adjusterId}, GET /claims, GET /claims/{claimId}"
      - "GET /reserve-entries, GET /advance-payments, GET /loss-estimates"
      - "POST /_clock/set_current_utc"

  - name: Adjuster
    description: "A field, desk or aerial adjuster acting on their own inspection assignments only. X-User-ID is the Adjuster row's id."
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /inspection-assignments/{assignmentId}/start"
      - "POST /inspection-assignments/{assignmentId}/complete"
      - "POST /inspection-assignments/{assignmentId}/report-no-access"
    shared_operations:
      - "GET /adjusters/{adjusterId}, GET /deployments, GET /deployments/{deploymentId}"
      - "GET /inspection-assignments, GET /claims/{claimId}"
      - "POST /_clock/set_current_utc"

  - name: VendorCoordinator
    description: "A mitigation or contractor firm acting on its own dispatched jobs, plus network registration and activation. X-User-ID is the VendorFirm row's id."
    identity: "entity_backed:VendorFirm"
    exclusive_operations:
      - "POST /vendor-firms"
      - "POST /vendor-firms/{vendorFirmId}/activate"
      - "POST /vendor-firms/{vendorFirmId}/suspend"
      - "POST /vendor-assignments/{vendorAssignmentId}/accept"
      - "POST /vendor-assignments/{vendorAssignmentId}/decline"
      - "POST /vendor-assignments/{vendorAssignmentId}/complete"
    shared_operations:
      - "GET /catastrophe-events, GET /catastrophe-events/{eventId}"
      - "GET /vendor-firms, GET /vendor-assignments, GET /claims/{claimId}"
      - "POST /_clock/set_current_utc"
