        claim_type: triggerability
        grounds:
          - "validations[priority=75, error_id=ERR_INSUFFICIENT_BOND]"
          - errors.ERR_INSUFFICIENT_BOND
        excluded_because:
          difficulty_instance: boundary_precision_check / bond_coverage_equality_closes_the_assignment
          rationale: |
            That §1.8 boundary_precision_check instance closes a transfer with bond_posted_cents
            exactly equal to bond_check_required_cents and then repeats the closing one cent short,
            asserting ERR_INSUFFICIENT_BOND (402), so both the boundary and the error are covered.

