              payload: { is_eligible: false, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${coord_id}"
              as: ProgramAdmin
          assert:
            - "Trigger 1: HTTP 200 with coordinator_id == the coordinator, active_case_count == 2, weighted_caseload_points == 3.00, max_weighted_caseload_points == 3.20"
            - "Trigger 1: utilization_ratio == 0.9375 (3.00 / 3.20 to 4 decimals), caseload_posture == \"NEAR_CAP\" and headroom_points == 0.20"
            - "Trigger 2: HTTP 200 with response.data.status == \"NOT_ELIGIBLE\" and case_weight_points == 0.00"
            - "Trigger 3: active_case_count == 1, weighted_caseload_points == 1.50, utilization_ratio == 0.4688 (1.50 / 3.20 = 0.46875 rounded half-up), caseload_posture == \"OPEN\" and headroom_points == 1.70"
            - "Trigger 4: the coordinator entity itself reports weighted_caseload_points == 1.50, active_case_count == 1 and utilization_ratio == 0.4688 — entity and summary never disagree"

