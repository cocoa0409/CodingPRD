# =============================================================================
# PRD Benchmark Scaffold — task_3332
# Affordable Housing Equity Syndication & Developer Underwriting
# =============================================================================

scenario: |
  Affordable Housing Equity Syndication & Developer Underwriting (Enterprise
  Community Partners): tax credit allocation awards secured by developers with
  equity raised through syndicated investment funds, investor fund formation
  with pricing per credit dollar, yield targets and closing timelines,
  developer and project underwriting on market study, construction budget,
  operating pro forma and sponsor experience, equity pay-in schedules tied to
  construction and lease-up milestones with adjusters for credit delivery
  shortfalls, asset management of the portfolio through the compliance period
  with watch list escalation, guarantee structures where the developer covers
  operating deficits and recapture risk, year fifteen exit planning with option
  and right of first refusal execution, investor reporting on credit delivery
  and compliance findings.

domain_name: affordable-housing-equity-syndication
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 10
  state_machine_count: 12
  calculation_count: 12
  validation_layer_count: 7
  endpoint_count: 32
  error_code_count: 43
  role_count: 7

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Developer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the sponsor/developer entity."
      - name: developer_type
        type: enum
        source: input
        description: "NONPROFIT | FOR_PROFIT | JOINT_VENTURE"
        constraints: "must be one of NONPROFIT, FOR_PROFIT, JOINT_VENTURE"
      - name: sponsor_experience_months
        type: integer
        source: input
        description: "Months of sponsor track record claimed at onboarding."
      - name: projects_completed
        type: integer
        source: input
        description: "Count of previously completed affordable housing projects."
      - name: net_worth_cents
        type: integer
        source: input
        description: "Sponsor net worth in cents, used for guarantee capacity tests."
      - name: liquid_assets_cents
        type: integer
        source: input
        description: "Sponsor liquid assets in cents, used for deficit coverage tests."
      - name: guarantee_exposure_cents
        type: integer
        source: computed
        description: "Sum of guaranteed_amount_cents over non-RELEASED Guarantee rows belonging to this Developer."
      - name: active_project_count
        type: integer
        source: computed
        description: "Count of Project rows for this Developer whose status is not EXITED."
      - name: status
        type: enum
        source: computed
        description: "ELIGIBLE | WATCH | SUSPENDED"
        constraints: "must be one of ELIGIBLE, WATCH, SUSPENDED"

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Institutional investor name."
      - name: investor_type
        type: enum
        source: input
        description: "BANK | INSURANCE | CORPORATE | FOUNDATION | PENSION"
        constraints: "must be one of BANK, INSURANCE, CORPORATE, FOUNDATION, PENSION"
      - name: committed_capacity_cents
        type: integer
        source: input
        description: "Maximum equity this investor will commit across all funds."
      - name: risk_tier
        type: enum
        source: input
        description: "TIER_1 | TIER_2 | TIER_3"
        constraints: "must be one of TIER_1, TIER_2, TIER_3"
      - name: outstanding_commitment_cents
        type: integer
        source: computed
        description: "Sum of committed_cents over FundSubscription rows of this Investor whose status is not DEFAULTED."
      - name: funded_cents
        type: integer
        source: computed
        description: "Sum of paid_in_cents over FundSubscription rows of this Investor."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE | SUSPENDED"
        constraints: "must be one of ACTIVE, SUSPENDED"

  - name: SyndicationFund
    parent: null
    common_fields: true
    fields:
      - name: fund_name
        type: string
        source: input
        description: "Fund marketing name."
      - name: target_equity_cents
        type: integer
        source: input
        description: "Target equity raise for the fund."
      - name: price_per_credit_dollar
        type: number
        source: input
        description: "Syndication price paid per one dollar of tax credit, expressed as a decimal."
      - name: target_yield_pct
        type: number
        source: input
        description: "Investor target net yield, expressed as a decimal fraction."
      - name: close_threshold_pct
        type: number
        source: input
        description: "Fraction of target_equity_cents that must be subscribed before the fund may close."
        default: 0.85
      - name: subscription_open_date
        type: datetime
        source: input
        description: "First instant at which subscriptions are accepted."
      - name: subscription_close_date
        type: datetime
        source: input
        description: "Last instant at which subscriptions are accepted."
      - name: status
        type: enum
        source: computed
        description: "FORMING | CLOSING | CLOSED | DEPLOYING | WOUND_DOWN | TERMINATED"
        constraints: "must be one of FORMING, CLOSING, CLOSED, DEPLOYING, WOUND_DOWN, TERMINATED"
      - name: posture
        type: enum
        source: computed
        description: "OPEN | WATCH | FROZEN — portfolio posture derived from the fund's projects."
        constraints: "must be one of OPEN, WATCH, FROZEN"
      - name: funded_equity_cents
        type: integer
        source: computed
        description: "Sum of paid_in_cents over FundSubscription rows whose fund_id equals this fund's id."
      - name: subscribed_equity_cents
        type: integer
        source: computed
        description: "Sum of committed_cents over FundSubscription rows whose status is not DEFAULTED."
      - name: awarded_credits_total_cents
        type: integer
        source: computed
        description: "Face value of awarded credit dollars across the fund's COMMITTED and CLOSED allocations."
      - name: delivered_credits_total_cents
        type: integer
        source: computed
        description: "Face value of delivered credit dollars across the fund's COMMITTED and CLOSED allocations."
      - name: priced_value_cents
        type: integer
        source: computed
        description: "Sum of per-allocation rounded awarded credit dollars times the fund price — the syndication purchase amount."
      - name: realized_value_cents
        type: integer
        source: computed
        description: "Sum of per-allocation rounded delivered credit dollars times the fund price."
      - name: priced_yield_pct
        type: number
        source: computed
        description: "Projected yield at the fund's current price_per_credit_dollar, over subscribed equity."
      - name: realized_yield_pct
        type: number
        source: computed
        description: "Yield recomputed from actually delivered credit dollars."
      - name: subscription_count
        type: integer
        source: computed
        description: "Count of FundSubscription rows under this fund."

  - name: FundSubscription
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> SyndicationFund.id; the fund being subscribed to."
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the subscribing investor."
      - name: committed_cents
        type: integer
        source: input
        description: "Equity the investor commits to this fund."
      - name: payin_schedule
        type: array
        source: input
        description: "Ordered array of {milestone, share_pct} objects; share_pct values must sum to 1.0."
      - name: executed_price_per_credit_dollar
        type: number
        source: computed
        description: "Fund price_per_credit_dollar pinned at the moment the subscription is created."
      - name: status
        type: enum
        source: computed
        description: "PLEDGED | SUBSCRIBED | PARTIALLY_FUNDED | FULLY_FUNDED | DEFAULTED"
        constraints: "must be one of PLEDGED, SUBSCRIBED, PARTIALLY_FUNDED, FULLY_FUNDED, DEFAULTED"
      - name: paid_in_cents
        type: integer
        source: computed
        description: "Equity actually paid in against this subscription."
      - name: unfunded_commitment_cents
        type: integer
        source: computed
        description: "committed_cents - paid_in_cents, never negative."
      - name: shortfall_cents
        type: integer
        source: computed
        description: "Sum of shortfall_cents over DEFICIENT CapitalCall rows attributed to this subscription's fund."

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the sponsor of the project."
      - name: fund_id
        type: string
        source: input
        description: "FK -> SyndicationFund.id; the fund that will hold the project's equity."
      - name: project_name
        type: string
        source: input
        description: "Project name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code where the project sits."
        constraints: "exactly two uppercase letters"
      - name: total_credit_dollars_cents
        type: integer
        source: input
        description: "Total tax credit dollars awarded to the project, in cents."
      - name: construction_budget_cents
        type: integer
        source: input
        description: "Underwritten construction budget, in cents."
      - name: construction_loan_cents
        type: integer
        source: input
        description: "Construction and permanent loan proceeds available to the project, in cents."
      - name: operating_pro_forma_noi_cents
        type: integer
        source: input
        description: "Underwritten annual net operating income at stabilization, in cents."
      - name: debt_service_cents
        type: integer
        source: input
        description: "Annual debt service, in cents."
      - name: market_study_absorption_score
        type: number
        source: input
        description: "Market study absorption score between 0 and 1 inclusive."
      - name: sponsor_experience_months
        type: integer
        source: input
        description: "Snapshot of the developer's track record months used in underwriting."
      - name: placed_in_service_deadline
        type: datetime
        source: input
        description: "Latest instant at which the project must be placed in service."
      - name: placed_in_service_at
        type: datetime
        source: computed
        description: "Instant the project was actually placed in service; null until the PLACED_IN_SERVICE milestone fires."
      - name: compliance_period_months
        type: integer
        source: input
        description: "Length of the tax credit compliance period in months."
        default: 180
      - name: status
        type: enum
        source: computed
        description: "UNDERWRITING | COMMITTED | CONSTRUCTION | LEASE_UP | STABILIZED | COMPLIANCE_PERIOD | EXIT_ELIGIBLE | EXITED | DISTRESSED"
        constraints: "must be one of UNDERWRITING, COMMITTED, CONSTRUCTION, LEASE_UP, STABILIZED, COMPLIANCE_PERIOD, EXIT_ELIGIBLE, EXITED, DISTRESSED"
      - name: underwriting_stage
        type: enum
        source: computed
        description: "PRELIMINARY | FINAL"
        constraints: "must be one of PRELIMINARY, FINAL"
      - name: preliminary_equity_cents
        type: integer
        source: computed
        description: "Equity implied by the preliminary underwriting variant."
      - name: final_equity_cents
        type: integer
        source: computed
        description: "Equity implied by the final underwriting variant; null until underwriting is finalized."
      - name: underwritten_equity_cents
        type: integer
        source: computed
        description: "Active underwriting result: final_equity_cents once finalized, otherwise preliminary_equity_cents."
      - name: dscr
        type: number
        source: computed
        description: "operating_pro_forma_noi_cents / debt_service_cents, 4 decimal places."
      - name: operating_deficit_cents
        type: integer
        source: computed
        description: "max(0, debt_service_cents - operating_pro_forma_noi_cents)."
      - name: committed_credit_dollars_cents
        type: integer
        source: computed
        description: "Sum of awarded_credit_dollars_cents over Allocation rows of this project in status COMMITTED or CLOSED."
      - name: delivered_credit_dollars_cents
        type: integer
        source: computed
        description: "Credit dollars actually delivered, reported by asset management."
      - name: compliance_failure_count
        type: integer
        source: computed
        description: "Count of PortfolioReview rows of this project whose status is NONCOMPLIANT."
      - name: underwritten_gap_cents
        type: integer
        source: computed
        description: "construction_budget_cents - construction_loan_cents - underwritten_equity_cents, never negative."

  - name: Allocation
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Parent project identifier (Project.id); nested under the project resource."
      - name: state_agency
        type: string
        source: input
        description: "Awarding housing finance agency code."
      - name: awarded_credit_dollars_cents
        type: integer
        source: input
        description: "Credit dollars awarded by the agency, in cents."
      - name: commitment_fee_pct
        type: number
        source: input
        description: "Agency commitment fee as a decimal fraction of awarded credit dollars."
      - name: awarded_date
        type: datetime
        source: input
        description: "Instant the award was granted."
      - name: placed_in_service_deadline
        type: datetime
        source: input
        description: "Latest instant the project may be placed in service under this award."
      - name: status
        type: enum
        source: computed
        description: "AWARDED | RESERVED | COMMITTED | CLOSED | RESCINDED"
        constraints: "must be one of AWARDED, RESERVED, COMMITTED, CLOSED, RESCINDED"
      - name: delivered_credit_dollars_cents
        type: integer
        source: computed
        description: "Credit dollars delivered against this allocation."
      - name: delivery_ratio
        type: number
        source: computed
        description: "delivered_credit_dollars_cents / awarded_credit_dollars_cents, 6 decimal places."

  - name: CapitalCall
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Parent project identifier (Project.id); nested under the project resource."
      - name: milestone
        type: enum
        source: input
        description: "CONSTRUCTION_START | CONSTRUCTION_50PCT | LEASE_UP_50PCT | LEASE_UP_STABILIZED | PLACED_IN_SERVICE"
        constraints: "must be one of CONSTRUCTION_START, CONSTRUCTION_50PCT, LEASE_UP_50PCT, LEASE_UP_STABILIZED, PLACED_IN_SERVICE"
      - name: scheduled_date
        type: datetime
        source: input
        description: "Instant the call is scheduled to be issued."
      - name: due_date
        type: datetime
        source: input
        description: "Instant by which the call must be funded."
      - name: base_call_cents
        type: integer
        source: input
        description: "Milestone share of committed equity before adjusters."
      - name: credit_delivery_adjuster_pct
        type: number
        source: input
        description: "Adjuster applied when delivered credit falls short of awarded credit, as a decimal fraction."
      - name: called_amount_cents
        type: integer
        source: computed
        description: "Adjusted amount actually called."
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "Amount actually funded when the call settles."
      - name: shortfall_cents
        type: integer
        source: computed
        description: "max(0, called_amount_cents - settled_amount_cents)."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED | ISSUED | PAID | DEFICIENT | ADJUSTED"
        constraints: "must be one of SCHEDULED, ISSUED, PAID, DEFICIENT, ADJUSTED"

  - name: Guarantee
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Parent project identifier (Project.id); nested under the project resource."
      - name: guarantee_type
        type: enum
        source: input
        description: "OPERATING_DEFICIT | RECAPTURE | COMPLETION"
        constraints: "must be one of OPERATING_DEFICIT, RECAPTURE, COMPLETION"
      - name: guaranteed_amount_cents
        type: integer
        source: input
        description: "Maximum amount the developer guarantees."
      - name: recapture_pct
        type: number
        source: input
        description: "Share of awarded credit dollars the developer must repay on recapture, as a decimal fraction."
      - name: coverage_start_date
        type: datetime
        source: input
        description: "First instant the guarantee covers."
      - name: coverage_end_date
        type: datetime
        source: input
        description: "Last instant the guarantee covers; must be strictly after coverage_start_date."
      - name: drawn_amount_cents
        type: integer
        source: computed
        description: "Amount drawn against the guarantee."
      - name: remaining_capacity_cents
        type: integer
        source: computed
        description: "guaranteed_amount_cents - drawn_amount_cents, never negative."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE | DRAWN | DISCHARGED | RELEASED"
        constraints: "must be one of ACTIVE, DRAWN, DISCHARGED, RELEASED"

  - name: PortfolioReview
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Parent project identifier (Project.id); nested under the project resource."
      - name: review_period_index
        type: integer
        source: input
        description: "Zero-based compliance period year index being reviewed."
      - name: review_period_end
        type: datetime
        source: input
        description: "Instant the reviewed compliance year closes; a NONCOMPLIANT finding is only recordable at or after this instant."
      - name: occupancy_pct
        type: number
        source: input
        description: "Observed occupancy as a decimal fraction."
      - name: dscr_observed
        type: number
        source: input
        description: "Observed debt service coverage ratio."
      - name: reserve_balance_cents
        type: integer
        source: input
        description: "Replacement reserve balance at review time."
      - name: corrected_reserve_balance_cents
        type: integer
        source: input
        description: "Replacement reserve balance recorded with a CURED resolve; null until a cure is recorded."
      - name: risk_score
        type: integer
        source: computed
        description: "Weighted watch-list risk score, floored at 0 and capped at 100."
      - name: status
        type: enum
        source: computed
        description: "PENDING | COMPLIANT | WATCH | ESCALATED | NONCOMPLIANT | CURED"
        constraints: "must be one of PENDING, COMPLIANT, WATCH, ESCALATED, NONCOMPLIANT, CURED"
      - name: escalated_at
        type: datetime
        source: computed
        description: "Instant the review was escalated; null until escalated."

  - name: ExitEvent
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Parent project identifier (Project.id); nested under the project resource."
      - name: exit_year
        type: integer
        source: input
        description: "Compliance year the exit is planned for."
      - name: rofr_notice_date
        type: datetime
        source: input
        description: "Instant the right-of-first-refusal notice is issued."
      - name: rofr_window_days
        type: integer
        source: input
        description: "Length of the right-of-first-refusal window in days."
        default: 90
      - name: exercise_deadline
        type: datetime
        source: input
        description: "Latest instant the option may be exercised."
      - name: option_price_cents
        type: integer
        source: computed
        description: "Year-fifteen option price under the pinned evaluation order."
      - name: rofr_expires_at
        type: datetime
        source: computed
        description: "rofr_notice_date plus rofr_window_days."
      - name: cumulative_distributions_cents
        type: integer
        source: computed
        description: "Investor distributions accumulated before the exit distribution."
      - name: status
        type: enum
        source: computed
        description: "PENDING | OPTION_NOTICE_ISSUED | ROFR_WINDOW | EXERCISED | DECLINED | CLOSED"
        constraints: "must be one of PENDING, OPTION_NOTICE_ISSUED, ROFR_WINDOW, EXERCISED, DECLINED, CLOSED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Developer
    field: status
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: WATCH
        trigger: "system (acting on POST /projects/{project_id}/reviews or POST /reviews/{review_id}/resolve)"
        actor: system
        preconditions:
          - "net_worth_cents / max(guarantee_exposure_cents, 1) < 2.0, OR at least one Project of this Developer has status == DISTRESSED, OR at least one PortfolioReview of this Developer's non-EXITED projects is in status ESCALATED"
        side_effects:
          - "Blocks POST /projects/{project_id}/commit for every Project of this Developer with error ERR_DEVELOPER_WATCH_BLOCKED"
          - "Recomputes SyndicationFund.posture for each fund holding one of this Developer's projects"
      - from: WATCH
        to: ELIGIBLE
        trigger: "system (re-derived when guarantee_exposure_cents falls to or below net_worth_cents and no Project of this Developer is DISTRESSED)"
        actor: system
        preconditions:
          - "net_worth_cents / max(guarantee_exposure_cents, 1) >= 2.0"
          - "No Project of this Developer has status == DISTRESSED"
          - "No PortfolioReview of this Developer's non-EXITED projects is in status ESCALATED"
        side_effects:
          - "Recomputes SyndicationFund.posture for each fund holding one of this Developer's projects"
      - from: [ELIGIBLE, WATCH]
        to: SUSPENDED
        trigger: "system (two or more PortfolioReview rows of this Developer's non-EXITED projects reach status ESCALATED while at least one of its Projects is DISTRESSED)"
        actor: system
        preconditions:
          - "count(PortfolioReview of this Developer's non-EXITED Projects where status == ESCALATED) >= 2"
          - "count(Project of this Developer where status == DISTRESSED) >= 1"
        side_effects:
          - "Every Project of this Developer transitions to DISTRESSED"
          - "Each affected SyndicationFund.posture becomes FROZEN (see fund_posture calculation)"
          - "Releases every ACTIVE or DRAWN Guarantee of this Developer's projects is NOT performed — guarantees stay ACTIVE/DRAWN"
      - from: SUSPENDED
        to: WATCH
        trigger: "system (all ESCALATED reviews of this Developer's projects are resolved to CURED)"
        actor: system
        preconditions:
          - "No PortfolioReview of this Developer's non-EXITED Projects has status == ESCALATED"
        side_effects:
          - "Guarantee exposure remains unchanged; Developer returns to WATCH pending the WATCH→ELIGIBLE re-derivation"

  - entity: Investor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (any FundSubscription of this Investor reaches status DEFAULTED)"
        actor: system
        preconditions:
          - "count(FundSubscription where investor_id == this Investor.id and status == DEFAULTED) >= 1"
        side_effects:
          - "The Investor is excluded from the credit_shortfall_waterfall bucket ordering; its existing DEFAULTED subscription keeps its shortfall_cents"
          - "No further FundSubscription may be created for this Investor: POST /funds/{fund_id}/subscriptions fails with ERR_INVESTOR_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (every DEFAULTED FundSubscription of this Investor is reinstated via POST /funds/{fund_id}/subscriptions)"
        actor: system
        preconditions:
          - "No FundSubscription of this Investor has status == DEFAULTED"
        side_effects: []

  - entity: SyndicationFund
    field: status
    initial_state: FORMING
    terminal_states: [TERMINATED]
    transitions:
      - from: FORMING
        to: CLOSING
        trigger: "system (POST /funds/{fund_id}/subscriptions pushes subscribed_equity_cents to close_threshold_pct * target_equity_cents or above)"
        actor: system
        preconditions:
          - "subscribed_equity_cents >= round_half_up(target_equity_cents * close_threshold_pct)"
        side_effects:
          - "Subscriptions may now be paid in; PLEDGED subscriptions stay PLEDGED until their first pay-in"
      - from: CLOSING
        to: FORMING
        trigger: "system (a FundSubscription of this fund is removed from the not-DEFAULTED set so subscribed_equity_cents falls below the threshold)"
        actor: system
        preconditions:
          - "subscribed_equity_cents < round_half_up(target_equity_cents * close_threshold_pct)"
        side_effects:
          - "Already-issued CapitalCall rows are untouched"
      - from: CLOSING
        to: CLOSED
        trigger: "system (logical clock crosses subscription_close_date via POST /_clock/set_current_utc and the threshold is met)"
        actor: system
        preconditions:
          - "logical clock >= subscription_close_date"
          - "subscribed_equity_cents >= round_half_up(target_equity_cents * close_threshold_pct)"
        side_effects:
          - "No further FundSubscription may be created: POST /funds/{fund_id}/subscriptions fails with ERR_FUND_NOT_FORMING"
      - from: [FORMING, CLOSING]
        to: TERMINATED
        trigger: "system (logical clock crosses subscription_close_date via POST /_clock/set_current_utc and the threshold is NOT met)"
        actor: system
        preconditions:
          - "logical clock >= subscription_close_date"
          - "subscribed_equity_cents < round_half_up(target_equity_cents * close_threshold_pct)"
        side_effects:
          - "Every FundSubscription of this fund becomes DEFAULTED"
          - "Every Investor holding one of those subscriptions becomes SUSPENDED"
          - "Every Project of this fund stays in UNDERWRITING; no new CapitalCall may be created (ERR_FUND_TERMINATED)"
      - from: CLOSED
        to: DEPLOYING
        trigger: "system (POST /projects/{project_id}/commit places the fund's first Allocation into status COMMITTED)"
        actor: system
        preconditions:
          - "At least one Allocation of a Project whose fund_id == this fund's id has status == COMMITTED"
        side_effects: []
      - from: DEPLOYING
        to: WOUND_DOWN
        trigger: "system (every Project of this fund reaches status EXITED)"
        actor: system
        preconditions:
          - "count(Project where fund_id == this fund's id and status != EXITED) == 0"
        side_effects:
          - "The fund stops accepting pay-ins: POST /subscriptions/{subscription_id}/payins fails with ERR_FUND_WOUND_DOWN"

  - entity: SyndicationFund
    field: posture
    initial_state: OPEN
    terminal_states: []
    note: "Posture is derived, not directly set; see the fund_posture calculation for the FROZEN > WATCH > OPEN precedence."
    transitions:
      - from: OPEN
        to: WATCH
        trigger: "system (recomputed on POST /projects/{project_id}/reviews, POST /reviews/{review_id}/resolve, POST /capital-calls/{call_id}/transitions, and POST /guarantees/{guarantee_id}/draw)"
        actor: system
        preconditions:
          - "At least one Project whose fund_id == this fund's id has status == DISTRESSED"
          - "No Project of this fund has compliance_failure_count >= 2"
        side_effects:
          - "POST /projects/{project_id}/commit still succeeds while the fund is WATCH"
      - from: [OPEN, WATCH]
        to: FROZEN
        trigger: "system (recomputed on the same triggers as OPEN→WATCH)"
        actor: system
        preconditions:
          - "At least two Projects of this fund have status == DISTRESSED, OR at least one Project of this fund has compliance_failure_count >= 2"
        side_effects:
          - "POST /projects/{project_id}/commit fails with ERR_FUND_POSTURE_FROZEN for every Project of this fund"
          - "POST /projects/{project_id}/capital-calls fails with ERR_FUND_POSTURE_FROZEN"
      - from: [WATCH, FROZEN]
        to: OPEN
        trigger: "system (recomputed when the underlying conditions clear)"
        actor: system
        preconditions:
          - "No Project of this fund has status == DISTRESSED"
          - "No Project of this fund has compliance_failure_count >= 2"
        side_effects: []

  - entity: FundSubscription
    field: status
    initial_state: PLEDGED
    terminal_states: [DEFAULTED]
    note: "Cyclic by design — ADJUSTED capital calls move FULLY_FUNDED subscriptions back to PARTIALLY_FUNDED, and later pay-ins re-advance them."
    transitions:
      - from: PLEDGED
        to: SUBSCRIBED
        trigger: "system (POST /funds/{fund_id}/close equivalent — the fund reaches CLOSED while this subscription is not-DEFAULTED) or POST /subscriptions/{subscription_id}/payins with a first pay-in"
        actor: "system or Investor"
        preconditions:
          - "Fund status IN {CLOSING, CLOSED} for the pay-in path"
        side_effects:
          - "executed_price_per_credit_dollar stays pinned at the value captured at creation"
      - from: [PLEDGED, SUBSCRIBED]
        to: PARTIALLY_FUNDED
        trigger: "POST /subscriptions/{subscription_id}/payins with 0 < amount_cents and paid_in_cents < committed_cents after the pay-in"
        actor: Investor
        preconditions:
          - "The pay-in does not push paid_in_cents above committed_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "Fund.funded_equity_cents increases by amount_cents"
          - "Investor.funded_cents increases by amount_cents"
          - "The subscription's unfunded_commitment_cents is recomputed"
      - from: [PLEDGED, PARTIALLY_FUNDED, SUBSCRIBED]
        to: FULLY_FUNDED
        trigger: "POST /subscriptions/{subscription_id}/payins that brings paid_in_cents to exactly committed_cents"
        actor: Investor
        preconditions:
          - "paid_in_cents after the pay-in == committed_cents"
        side_effects:
          - "Fund.funded_equity_cents increases by amount_cents"
          - "Investor.funded_cents increases by amount_cents"
      - from: FULLY_FUNDED
        to: PARTIALLY_FUNDED
        trigger: "system (POST /capital-calls/{call_id}/transitions with action=SETTLE and funded_amount_cents < called_amount_cents)"
        actor: system
        preconditions:
          - "The settling CapitalCall belongs to a Project funded by this subscription's fund"
          - "shortfall_cents for this subscription is strictly positive after the settle"
        side_effects:
          - "shortfall_cents increases by the call's shortfall_cents"
          - "if shortfall_cents > round_half_up(committed_cents * 0.20) the subscription becomes DEFAULTED instead of PARTIALLY_FUNDED"
      - from: [PLEDGED, SUBSCRIBED, PARTIALLY_FUNDED, FULLY_FUNDED]
        to: DEFAULTED
        trigger: "system (fund TERMINATED, or an ADJUSTED capital call pushing shortfall_cents above the 20 percent default band, or a CapitalCall ADJUSTED transition)"
        actor: system
        preconditions:
          - "shortfall_cents > round_half_up(committed_cents * 0.20), OR the subscription's fund reached TERMINATED"
        side_effects:
          - "Investor.status becomes SUSPENDED"
          - "The subscription leaves the Investor.outstanding_commitment_cents sum"
          - "DEFAULTED is terminal — no further pay-in is accepted (ERR_SUBSCRIPTION_DEFAULTED)"

  - entity: Project
    field: status
    initial_state: UNDERWRITING
    terminal_states: [EXITED]
    note: "Cyclic by design — a DISTRESSED project that is cured returns to the status it held before distress, and an EXIT_ELIGIBLE project may be pushed back to COMPLIANCE_PERIOD."
    transitions:
      - from: UNDERWRITING
        to: COMMITTED
        trigger: "POST /projects/{project_id}/commit"
        actor: Underwriter
        preconditions:
          - "Project.underwriting_stage == FINAL"
          - "fund.status IN {CLOSING, CLOSED, DEPLOYING} and fund.posture == OPEN"
          - "developer.status == ELIGIBLE"
          - "Project.allocations is non-empty with at least one Allocation in status RESERVED or AWARDED"
          - "dscr >= 1.15"
          - "market_study_absorption_score >= 0.60"
          - "logical clock <= placed_in_service_deadline"
        side_effects:
          - "Every RESERVED and AWARDED Allocation of this project becomes COMMITTED"
          - "fund.status becomes DEPLOYING when it was CLOSED"
          - "Recomputes the fund's subscribed_equity_cents, priced_yield_pct and realized_yield_pct"
      - from: COMMITTED
        to: CONSTRUCTION
        trigger: "POST /projects/{project_id}/milestones with milestone=CONSTRUCTION_START"
        actor: "AssetManager or Underwriter"
        preconditions:
          - "A CapitalCall with milestone=CONSTRUCTION_START exists for this project in status PAID"
        side_effects:
          - "Recomputes FundSubscription paid-in progress for every subscription of the project's fund"
      - from: CONSTRUCTION
        to: LEASE_UP
        trigger: "POST /projects/{project_id}/milestones with milestone=LEASE_UP_50PCT"
        actor: AssetManager
        preconditions:
          - "A CapitalCall with milestone=CONSTRUCTION_50PCT exists for this project in status PAID"
        side_effects: []
      - from: LEASE_UP
        to: STABILIZED
        trigger: "POST /projects/{project_id}/milestones with milestone=LEASE_UP_STABILIZED"
        actor: AssetManager
        preconditions:
          - "A CapitalCall with milestone=LEASE_UP_50PCT exists for this project in status PAID"
        side_effects:
          - "Recomputes debt_service coverage fields used by watch_list_risk_score"
      - from: STABILIZED
        to: COMPLIANCE_PERIOD
        trigger: "POST /projects/{project_id}/milestones with milestone=PLACED_IN_SERVICE"
        actor: AssetManager
        preconditions:
          - "logical clock <= placed_in_service_deadline (ERR_PLACED_IN_SERVICE_DEADLINE_PASSED)"
          - "A CapitalCall with milestone=LEASE_UP_STABILIZED exists for this project in status PAID"
        side_effects:
          - "compliance_period_started_at is stamped and the compliance end is derived as placed-in-service month + compliance_period_months"
      - from: COMPLIANCE_PERIOD
        to: EXIT_ELIGIBLE
        trigger: "system (logical clock reaches compliance_period_months after the placed-in-service stamp)"
        actor: system
        preconditions:
          - "logical clock >= placed_in_service_at + compliance_period_months months"
          - "compliance_failure_count == 0"
        side_effects:
          - "An ExitEvent may now be created for this project"
      - from: EXIT_ELIGIBLE
        to: COMPLIANCE_PERIOD
        trigger: "system (an ExitEvent of this project is DECLINED or the ROFR window expires with no exercise)"
        actor: system
        preconditions:
          - "The ExitEvent closed without EXERCISED"
        side_effects:
          - "A new ExitEvent may be created again for the following compliance year"
      - from: [COMMITTED, CONSTRUCTION, LEASE_UP, STABILIZED, COMPLIANCE_PERIOD, EXIT_ELIGIBLE]
        to: DISTRESSED
        trigger: "system (POST /reviews/{review_id}/resolve leaves a PortfolioReview in status ESCALATED, or a RECAPTURE Guarantee is drawn)"
        actor: system
        preconditions:
          - "At least one PortfolioReview of this project has status == ESCALATED, OR a Guarantee of type RECAPTURE for this project moved to DRAWN"
        side_effects:
          - "Recomputes the owning fund's posture (WATCH or FROZEN per fund_posture)"
          - "Recomputes the owning Developer.status"
      - from: DISTRESSED
        to: COMPLIANCE_PERIOD
        trigger: "system (every ESCALATED PortfolioReview of this project is resolved to CURED)"
        actor: system
        preconditions:
          - "count(PortfolioReview of this project in status ESCALATED) == 0"
          - "The project had reached COMPLIANCE_PERIOD before distress"
        side_effects:
          - "Recomputes the owning fund's posture back toward OPEN when no other project is distressed"
      - from: [COMPLIANCE_PERIOD, EXIT_ELIGIBLE]
        to: EXITED
        trigger: "system (an ExitEvent of this project reaches CLOSED with status EXERCISED)"
        actor: system
        preconditions:
          - "The ExitEvent's option was EXERCISED and then closed"
        side_effects:
          - "Recomputes the owning Developer.active_project_count"
          - "Recomputes the owning Developer.guarantee_exposure_cents"

  - entity: Project
    field: underwriting_stage
    initial_state: PRELIMINARY
    terminal_states: []
    note: "Parallel dimension on the same row as Project.status; independent of the status pipeline."
    transitions:
      - from: PRELIMINARY
        to: FINAL
        trigger: "PUT /projects/{project_id} with underwriting_action=FINALIZE"
        actor: Underwriter
        preconditions:
          - "market_study_absorption_score >= 0.60"
          - "construction_budget_cents > 0"
          - "operating_pro_forma_noi_cents > 0 and debt_service_cents > 0"
          - "sponsor_experience_months >= 24"
        side_effects:
          - "final_equity_cents is computed by the FINAL variant of underwriting_equity"
          - "underwritten_equity_cents switches from preliminary_equity_cents to final_equity_cents"
      - from: FINAL
        to: PRELIMINARY
        trigger: "PUT /projects/{project_id} with a change to any underwriting input field while status == UNDERWRITING"
        actor: Underwriter
        preconditions:
          - "Project.status == UNDERWRITING"
        side_effects:
          - "final_equity_cents is set to null and underwritten_equity_cents reverts to preliminary_equity_cents"

  - entity: Allocation
    field: status
    initial_state: AWARDED
    terminal_states: [CLOSED, RESCINDED]
    transitions:
      - from: AWARDED
        to: RESERVED
        trigger: "POST /projects/{project_id}/allocations carrying a superseding award for the same project and state_agency, or PUT /projects/{project_id} with allocation_action=RESERVE"
        actor: Underwriter
        preconditions:
          - "The allocation's interval [awarded_date, placed_in_service_deadline) does not overlap another AWARDED or RESERVED allocation of the same (project, state_agency) — adjacency where new.awarded_date == existing.placed_in_service_deadline is allowed"
        side_effects:
          - "Recomputes Project.committed_credit_dollars_cents only when the allocation later reaches COMMITTED"
      - from: RESERVED
        to: AWARDED
        trigger: "PUT /projects/{project_id} with allocation_action=RELEASE"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: [AWARDED, RESERVED]
        to: COMMITTED
        trigger: "system (POST /projects/{project_id}/commit)"
        actor: system
        preconditions:
          - "The owning Project reached status COMMITTED"
        side_effects:
          - "Recomputes Project.committed_credit_dollars_cents, Fund.subscribed_equity_cents and Fund.priced_yield_pct"
      - from: [COMMITTED]
        to: CLOSED
        trigger: "POST /projects/{project_id}/allocations with delivery_action=CLOSE"
        actor: AssetManager
        preconditions:
          - "delivered_credit_dollars_cents <= awarded_credit_dollars_cents"
        side_effects:
          - "Recomputes Project.delivered_credit_dollars_cents, Allocation.delivery_ratio, Fund.realized_yield_pct"
      - from: [AWARDED, RESERVED, COMMITTED]
        to: RESCINDED
        trigger: "POST /projects/{project_id}/allocations with delivery_action=RESCIND"
        actor: AssetManager
        preconditions:
          - "delivered_credit_dollars_cents < awarded_credit_dollars_cents"
        side_effects:
          - "Recomputes Project.committed_credit_dollars_cents (the allocation leaves the COMMITTED sum)"
          - "Recomputes Fund.subscribed_equity_cents and Fund.priced_yield_pct"

  - entity: CapitalCall
    field: status
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFICIENT]
    transitions:
      - from: SCHEDULED
        to: ISSUED
        trigger: "POST /capital-calls/{call_id}/transitions with action=ISSUE"
        actor: AssetManager
        preconditions:
          - "logical clock >= scheduled_date (ERR_CALL_NOT_DUE)"
          - "Buffer semantics: scheduled_date is at least 30 days after the due_date of the most recently PAID or DEFICIENT CapitalCall of the same project; with no such prior call the check passes vacuously"
          - "No other CapitalCall of this project carries the same milestone in any status (ERR_DUPLICATE_CALL_MILESTONE)"
        side_effects:
          - "called_amount_cents is computed by the capital_call_amount calculation"
      - from: ISSUED
        to: PAID
        trigger: "POST /capital-calls/{call_id}/transitions with action=SETTLE and funded_amount_cents == called_amount_cents"
        actor: Investor
        preconditions:
          - "funded_amount_cents == called_amount_cents"
        side_effects:
          - "settled_amount_cents is recorded and shortfall_cents stays 0"
          - "Recomputes FundSubscription.paid_in_cents for every subscription of the project's fund"
          - "Recomputes Project and Fund delivered credit fields"
      - from: ISSUED
        to: DEFICIENT
        trigger: "POST /capital-calls/{call_id}/transitions with action=SETTLE and funded_amount_cents < called_amount_cents"
        actor: Investor
        preconditions:
          - "funded_amount_cents < called_amount_cents"
        side_effects:
          - "shortfall_cents = called_amount_cents - funded_amount_cents"
          - "Every FundSubscription of the project's fund gains this shortfall_cents"
          - "A FundSubscription whose shortfall_cents exceeds 20 percent of committed_cents becomes DEFAULTED, suspending its Investor"
      - from: [ISSUED, PAID]
        to: ADJUSTED
        trigger: "POST /capital-calls/{call_id}/transitions with action=ADJUST re-pricing the call against a re-derived credit_delivery_adjuster_pct"
        actor: AssetManager
        preconditions:
          - "shortfall_band: the project's Allocation.delivery_ratio band selects a strictly larger adjuster than the adjuster currently on the call"
          - "The call is ISSUED or PAID; a DEFICIENT call is never adjusted"
        side_effects:
          - "credit_delivery_adjuster_pct is recomputed and called_amount_cents is recomputed"
          - "When the call was PAID, the delta new_called_amount_cents - settled_amount_cents is reclaimed from the project's fund: Fund.funded_equity_cents decreases by that delta"
          - "Every FundSubscription of the project's fund has paid_in_cents reduced by that delta, which moves every FULLY_FUNDED subscription back to PARTIALLY_FUNDED (the cyclic edge) and raises its unfunded_commitment_cents"
          - "Fund.realized_value_cents and Fund.realized_yield_pct are recomputed"
      - from: ADJUSTED
        to: ISSUED
        trigger: "POST /capital-calls/{call_id}/transitions with action=REISSUE"
        actor: AssetManager
        preconditions:
          - "The project's Allocation.delivery_ratio band matches the adjuster now pinned on the call"
        side_effects:
          - "The call is outstanding again and its interval participates in the 30-day buffer test"

  - entity: Guarantee
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: DRAWN
        trigger: "POST /guarantees/{guarantee_id}/draw"
        actor: AssetManager
        preconditions:
          - "drawn_amount_cents < guaranteed_amount_cents"
          - "For OPERATING_DEFICIT guarantees: the Project's operating_deficit_cents is strictly greater than 0 and the acting Developer.liquid_assets_cents is insufficient to cover it in full"
          - "For RECAPTURE guarantees: the Project has at least one PortfolioReview in status NONCOMPLIANT or ESCALATED"
          - "For COMPLETION guarantees: the Project has at least one PortfolioReview in status ESCALATED"
        side_effects:
          - "drawn_amount_cents increases by min(requested_amount_cents, remaining_capacity_cents)"
          - "Developer.guarantee_exposure_cents is recomputed from non-RELEASED guarantees"
          - "Developer.status is re-derived; a RECAPTURE draw pushes the Project to DISTRESSED"
      - from: DRAWN
        to: ACTIVE
        trigger: "POST /guarantees/{guarantee_id}/draw with requested_amount_cents == 0 (reinstatement)"
        actor: AssetManager
        preconditions:
          - "The draw_restore action is recorded: remaining_capacity_cents > 0 after the zero draw"
        side_effects:
          - "No change to drawn_amount_cents; the DRAWN→ACTIVE edge exists so a partially drawn guarantee can absorb a later call"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "system (POST /reviews/{review_id}/resolve moves the last relevant PortfolioReview to CURED while the draw is fully repaid)"
        actor: system
        preconditions:
          - "drawn_amount_cents == 0"
          - "The Project has no PortfolioReview in status ESCALATED or NONCOMPLIANT"
        side_effects:
          - "remaining_capacity_cents remains at guaranteed_amount_cents"
      - from: [ACTIVE, DRAWN, DISCHARGED]
        to: RELEASED
        trigger: "system (the owning Project reaches status EXITED)"
        actor: system
        preconditions:
          - "The Project's status == EXITED"
        side_effects:
          - "Developer.guarantee_exposure_cents drops by this guarantee's guaranteed_amount_cents"

  - entity: PortfolioReview
    field: status
    initial_state: PENDING
    terminal_states: [CURED, NONCOMPLIANT]
    note: "Cyclic by design — a NONCOMPLIANT review returns to WATCH/CURED only through the resolve action, and a CURED review for the next period starts a fresh PENDING row."
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "POST /reviews/{review_id}/resolve when risk_score < 70"
        actor: "AssetManager or ComplianceOfficer"
        preconditions:
          - "risk_score < 70"
        side_effects:
          - "Project.compliance_failure_count is unchanged"
      - from: PENDING
        to: WATCH
        trigger: "POST /reviews/{review_id}/resolve when 70 <= risk_score < 85"
        actor: "AssetManager or ComplianceOfficer"
        preconditions:
          - "70 <= risk_score < 85"
        side_effects:
          - "The review becomes visible on the watch list for the project"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /reviews/{review_id}/resolve when risk_score >= 85"
        actor: ComplianceOfficer
        preconditions:
          - "risk_score >= 85"
        side_effects:
          - "escalated_at is stamped with the logical clock"
          - "The owning Project transitions to DISTRESSED (an ESCALATED review is sufficient on its own)"
          - "The owning Developer.status and the owning fund's posture are recomputed"
          - "The owning fund's posture is recomputed when the project's compliance_failure_count reaches 2"
      - from: WATCH
        to: COMPLIANT
        trigger: "POST /reviews/{review_id}/resolve re-run on a WATCH review whose inputs are corrected"
        actor: AssetManager
        preconditions:
          - "risk_score < 70 after the correction"
        side_effects: []
      - from: WATCH
        to: ESCALATED
        trigger: "POST /reviews/{review_id}/resolve on a WATCH review whose inputs raise risk_score to 85 or above"
        actor: ComplianceOfficer
        preconditions:
          - "risk_score >= 85"
        side_effects:
          - "escalated_at is stamped with the logical clock"
          - "Developer.status is re-derived; a second ESCALATED review across the developer's projects suspends the developer"
      - from: ESCALATED
        to: NONCOMPLIANT
        trigger: "POST /reviews/{review_id}/resolve with outcome=NONCOMPLIANT"
        actor: ComplianceOfficer
        preconditions:
          - "The review is ESCALATED"
          - "logical clock >= review_period_end (the review period must have closed before a noncompliance finding is recorded)"
        side_effects:
          - "Project.compliance_failure_count increases by 1"
          - "If compliance_failure_count >= 2 the owning fund's posture becomes FROZEN"
          - "Recomputes Developer.status"
      - from: NONCOMPLIANT
        to: CURED
        trigger: "POST /reviews/{review_id}/resolve with outcome=CURED"
        actor: ComplianceOfficer
        preconditions:
          - "The complemented corrective action is recorded with corrected_reserve_balance_cents >= RESERVE_TARGET_CENTS of 50000000"
        side_effects:
          - "The review no longer counts toward the FROZEN condition; the owning fund's posture is recomputed"
          - "Recomputes Developer.status and, when it has no other ESCALATED review, returns the developer from SUSPENDED to WATCH"

  - entity: ExitEvent
    field: status
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: OPTION_NOTICE_ISSUED
        trigger: "POST /exit-events/{exit_event_id}/exercise with action=ISSUE_NOTICE"
        actor: "AssetManager or Underwriter"
        preconditions:
          - "The owning Project.status IN {COMPLIANCE_PERIOD, EXIT_ELIGIBLE}"
          - "exercise_deadline >= rofr_notice_date (ERR_EXIT_WINDOW_INVERTED)"
          - "rofr_expires_at <= exercise_deadline (ERR_ROFR_EXCEEDS_DEADLINE)"
        side_effects:
          - "rofr_expires_at is computed as rofr_notice_date + rofr_window_days"
          - "option_price_cents is computed by the exit_option_price calculation with its pinned evaluation order"
      - from: OPTION_NOTICE_ISSUED
        to: ROFR_WINDOW
        trigger: "POST /exit-events/{exit_event_id}/exercise with action=OPEN_ROFR"
        actor: AssetManager
        preconditions:
          - "The issuing date is stamped and the ROFR window has begun"
        side_effects:
          - "The window [rofr_notice_date, rofr_expires_at] is pinned; a second notice for the same project whose window overlaps an open window is rejected with ERR_ROFR_WINDOW_OVERLAP"
      - from: ROFR_WINDOW
        to: EXERCISED
        trigger: "POST /exit-events/{exit_event_id}/exercise with action=EXERCISE"
        actor: Underwriter
        preconditions:
          - "logical clock <= rofr_expires_at (ERR_ROFR_WINDOW_EXPIRED)"
          - "The acting Developer.status == ELIGIBLE (ERR_DEVELOPER_NOT_ELIGIBLE_FOR_EXIT)"
          - "The acting Developer has no Project in status DISTRESSED (ERR_DEVELOPER_NOT_ELIGIBLE_FOR_EXIT)"
        side_effects:
          - "cumulative_distributions_cents is recomputed from PAID capital calls"
          - "option_price_cents is recomputed with the same pinned evaluation order"
      - from: [OPTION_NOTICE_ISSUED, ROFR_WINDOW]
        to: DECLINED
        trigger: "POST /exit-events/{exit_event_id}/exercise with action=DECLINE, or system when the logical clock passes rofr_expires_at"
        actor: "Underwriter or system"
        preconditions:
          - "For the system path: logical clock > rofr_expires_at"
        side_effects:
          - "The owning Project returns to COMPLIANCE_PERIOD"
      - from: [EXERCISED, DECLINED]
        to: CLOSED
        trigger: "POST /exit-events/{exit_event_id}/exercise with action=CLOSE"
        actor: AssetManager
        preconditions:
          - "The exit distribution has been recorded"
        side_effects:
          - "When the exit event closed from EXERCISED the owning Project becomes EXITED"
          - "Every Guarantee of the project with status IN {ACTIVE, DRAWN, DISCHARGED} becomes RELEASED"
          - "The owning Developer.active_project_count and guarantee_exposure_cents are recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fund-subscription-stale-fund
    parent_entity: SyndicationFund
    write_endpoint: "POST /funds/{fund_id}/subscriptions"
    occ_field: "expected_fund_version"
    description: |
      Creating a FundSubscription against a SyndicationFund whose version has
      advanced since the client last observed it is rejected. The subscription
      legitimately supersedes pricing information the client is holding: any
      intervening change to the fund (a further subscription that moves the
      subscribed_equity_cents toward the close threshold, or a fund close or
      termination driven by the logical clock) makes the client's view of the
      fund stale, so the captured executed price can no longer be honoured.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: project-underwriting-stale-project
    parent_entity: Project
    write_endpoint: "PUT /projects/{project_id}"
    occ_field: "expected_project_version"
    description: |
      Editing a Project's underwriting inputs against a version the client has
      already seen superseded is rejected. The endpoint recomputes the
      preliminary equity figure from the full input set, so it legitimately
      supersedes any underwriting state a previous writer pinned; a stale
      expected_project_version means the losing writer would overwrite
      underwriting inputs it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: capital-call-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{project_id}/capital-calls"
    occ_field: "expected_project_version"
    description: |
      Creating a CapitalCall against a Project whose version has advanced is
      rejected. A new call is a legitimate supersession of the milestone
      funding plan the client observed, so two successive creates against the
      same observation point unambiguously leave the second caller writing
      against stale project state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: underwriting_equity
    trigger: "PUT /projects/{project_id} on any underwriting input change, and PUT /projects/{project_id} with underwriting_action=FINALIZE"
    algorithm: forward_looking
    input_set: "The Project row being underwritten. Preliminary variant reads input quality signals only; final variant reads the pinned inputs plus the fund's current price_per_credit_dollar."
    formula: |
      # PRELIMINARY variant (computed on create and on every input change)
      # Deliberately ignores total_credit_dollars_cents — this is the estimate
      # a developer circulates before the credit award is priced.
      prelim_base = construction_budget_cents - construction_loan_cents
      quality_uplift = round_half_up(prelim_base * (market_study_absorption_score * 0.10), 0)
      underwriting_equity.preliminary_equity_cents = prelim_base - quality_uplift

      # FINAL variant (computed only at FINALIZE)
      # Deliberately recomputes from the award rather than from the budget.
      credit_value = round_half_up(total_credit_dollars_cents * price_per_credit_dollar, 0)
      final_base = construction_budget_cents - construction_loan_cents
      sponsor_uplift = round_half_up(final_base * min(sponsor_experience_months, 120) / 10000.0, 0)
      underwriting_equity.final_equity_cents =
        min(final_base, credit_value) - sponsor_uplift
      underwriting_equity.underwritten_equity_cents =
        final_equity_cents if underwriting_stage == FINAL else preliminary_equity_cents
    constants:
      QUALITY_UPLIFT_RATE: 0.10
      SPONSOR_MONTHS_CAP: 120
      SPONSOR_UPLIFT_DIVISOR: 10000.0
    precision: "cents; round_half_up at each step; the two variants are rounded independently, never a shared intermediate"
    variants:
      - name: preliminary
        when: "Project.underwriting_stage == PRELIMINARY"
        difference: "Ignores the credit award entirely and prices equity off the budget gap; always the larger number when the credit award times price is below the budget gap."
      - name: final
        when: "Project.underwriting_stage == FINAL"
        difference: "Caps equity at the priced credit value and subtracts a capped sponsor-experience uplift, so a long-tenured sponsor underwrites to less equity than the preliminary variant."

  - name: capital_call_amount
    trigger: "POST /projects/{project_id}/capital-calls, POST /capital-calls/{call_id}/transitions with action=ISSUE or action=ADJUST"
    algorithm: threshold
    input_set: "The CapitalCall being created or transitioned, its owning Project, and every COMMITTED Allocation of that project."
    formula: |
      # Step 1 — select the credit-delivery band from every Allocation of the
      # project in status COMMITTED.
      awarded_sum = sum(a.awarded_credit_dollars_cents for a in COMMITTED allocations)
      delivered_sum = sum(a.delivered_credit_dollars_cents for a in COMMITTED allocations)
      delivery_ratio = delivered_sum / awarded_sum if awarded_sum > 0 else 1.0

      # Bands are half-open on the low side; the exact boundary belongs to the
      # LOWER adjuster band (a ratio of exactly 0.90 uses 0.00).
      adjuster_band =
        0.00  if delivery_ratio >= 0.99
        0.05  if delivery_ratio >= 0.95   and delivery_ratio < 0.99
        0.12  if delivery_ratio >= 0.90   and delivery_ratio < 0.95
        0.20  if delivery_ratio <  0.90

      # Step 2 — the call's adjuster is the MAXIMUM of the band value and the
      # adjuster currently pinned on the call (it ratchets up, never down).
      credit_delivery_adjuster_pct = max(adjuster_band, call.credit_delivery_adjuster_pct)

      # Step 3 — pinned evaluation order: the milestone share is rounded first,
      # the adjuster is applied to the ROUNDED share, and that product is
      # rounded again. Summing then rounding gives different cents.
      base_call_cents = round_half_up(underwritten_equity_cents * milestone_share, 0)
      called_amount_cents = round_half_up(base_call_cents * (1 + credit_delivery_adjuster_pct), 0)
    constants:
      BAND_FULL_DELIVERY: 0.99
      BAND_NEAR_FULL: 0.95
      BAND_PARTIAL: 0.90
      ADJUSTER_FULL_DELIVERY: 0.00
      ADJUSTER_NEAR_FULL: 0.05
      ADJUSTER_PARTIAL: 0.12
      ADJUSTER_SEVERE: 0.20
    precision: "cents; round_half_up twice, in the order show: milestone share first, then the adjuster product"
    variants:
      - name: issue_time
        when: "action=ISSUE, first issuance of the call"
        difference: "Uses the adjuster band as of issuance and stores it on the call."
      - name: adjust_time
        when: "action=ADJUST, re-issued against a re-derived delivery ratio"
        difference: "Ratchet rule applies: the recomputed adjuster can only be greater than or equal to the stored one, so a later credit recovery never reduces a call that was already adjusted upward."

  - name: fund_pricing_yield
    trigger: "POST /funds, PUT /funds/{fund_id}, POST /projects/{project_id}/commit, POST /projects/{project_id}/allocations"
    algorithm: weighted_scoring
    input_set: "The SyndicationFund row, its project's COMMITTED Allocation rows, and every Project of the fund whose status is not EXITED."
    formula: |
      # Priced yield — the naive, offer-time number the fund quotes to investors.
      # Rounding order: each project's contribution is rounded first, then the
      # rounded contributions are summed (per-project-then-sum, deliberately).
      # An investor's return is the face value of the tax credits it receives
      # against the equity it actually pays. Rounding order is PINNED: each
      # allocation is rounded independently and the rounded values are then
      # summed. Rounding the summed credit dollars once gives a different cent
      # total, and that variant is NOT used.
      awarded_credits_total = sum(a.awarded_credit_dollars_cents for a in COMMITTED and CLOSED allocations across the fund's non-EXITED projects)
      per_allocation_contribution(a) = round_half_up(a.awarded_credit_dollars_cents * price_per_credit_dollar, 0)
      priced_value_cents = sum(per_allocation_contribution(a) over those allocations)
      priced_yield_pct = (awarded_credits_total - subscribed_equity_cents) / subscribed_equity_cents  if subscribed_equity_cents > 0 else 0.0

      # Realized yield — the same construction computed from delivered credit
      # against equity actually funded.
      delivered_credits_total = sum(a.delivered_credit_dollars_cents for a in COMMITTED and CLOSED allocations across the fund's non-EXITED projects)
      per_allocation_realized(a) = round_half_up(a.delivered_credit_dollars_cents * price_per_credit_dollar, 0)
      realized_value_cents = sum(per_allocation_realized(a) over those allocations)
      realized_yield_pct = (delivered_credits_total - funded_equity_cents) / funded_equity_cents  if funded_equity_cents > 0 else 0.0
    constants:
      MIN_CREDITS_FOR_YIELD: 1
    precision: "yield as a decimal float rounded to 6 decimal places, round_half_up; money in cents"
    variants:
      - name: priced
        when: "evaluated against awarded credit dollars and subscribed equity"
        difference: "Face value of awarded credits over subscribed equity; the number shown to investors at closing."
      - name: realized
        when: "evaluated against delivered credit dollars and funded equity"
        difference: "Face value of delivered credits over equity actually funded, so a fund that under-delivers credit reports a realized yield far below its priced yield even at an unchanged price."

  - name: sponsor_eligibility
    trigger: "POST /developers, POST /projects/{project_id}/commit, POST /guarantees/{guarantee_id}/draw, POST /projects/{project_id}/reviews"
    algorithm: threshold
    input_set: "The Developer row and its non-EXITED Project rows."
    formula: |
      # Derived on read (never stored as an input).
      exposure = sum(g.guaranteed_amount_cents for g in this developer's guarantees where status != RELEASED)
      coverage_ratio = net_worth_cents / max(exposure, 1)
      deeply_experienced = sponsor_experience_months >= 120 and projects_completed >= 5
      eligible_by_coverage = coverage_ratio >= 2.0 or deeply_experienced

      escalated_count  = count(PortfolioReview in status ESCALATED across this developer's non-EXITED projects)
      distressed_count = count(Project of this developer with status == DISTRESSED and status != EXITED)

      status =
        SUSPENDED  if escalated_count >= 2 and distressed_count >= 1
        WATCH      if not eligible_by_coverage
                   or distressed_count >= 1
                   or escalated_count >= 1
        ELIGIBLE   otherwise
      # Note: exposure is measured against guarantees still on the books, so an
      # exposure of exactly 2x net worth is still ELIGIBLE (>= 2.0 passes).
      # SUSPENDED needs BOTH conditions: a developer with two escalated reviews
      # and no distressed project is only WATCH.
    constants:
      COVERAGE_MIN_RATIO: 2.0
      EXPERIENCE_MONTHS_MIN: 120
      PROJECTS_COMPLETED_MIN: 5
      SUSPENSION_ESCALATION_COUNT: 2
    precision: "ratio compared unrounded; status is an enum output"

  - name: fund_posture
    trigger: "POST /projects/{project_id}/reviews, POST /reviews/{review_id}/resolve, POST /projects/{project_id}/commit, POST /projects/{project_id}/milestones, POST /guarantees/{guarantee_id}/draw"
    algorithm: constraint_propagation
    input_set: "Every Project row whose fund_id equals the fund's id."
    formula: |
      # Precedence is strict and evaluated top-down; the first matching rule wins.
      FROZEN if count(projects of this fund with status == DISTRESSED) >= 2
             OR any project of this fund has compliance_failure_count >= 2
      WATCH  if count(projects of this fund with status == DISTRESSED) == 1
      OPEN   otherwise
      # FROZEN dominates WATCH: a fund with two distressed projects and one
      # compliance failure is FROZEN, never WATCH.
    constants:
      FROZEN_DISTRESSED_COUNT: 2
      FROZEN_FAILURE_COUNT: 2
      WATCH_DISTRESSED_COUNT: 1
    precision: "enum output; no rounding"

  - name: investor_allocation
    trigger: "POST /funds/{fund_id}/subscriptions"
    algorithm: waterfall_allocation
    input_set: "The subscribing Investor, the fund's subscribed_equity_cents, and every FundSubscription of the target fund."
    formula: |
      # Buckets are filled in strict priority order; a bucket's overflow spills
      # to the next bucket. remaining = target - subscribed_equity_cents before
      # this request.
      bucket_1 TIER_1 = min(remaining, TIER_1_CEILING)
        # each TIER_1 investor is capped at TIER_1_CAP per fund
      bucket_2 TIER_2 = min(remaining, TIER_2_CEILING)
        # each TIER_2 investor is capped at TIER_2_CAP per fund
      bucket_3 TIER_3 = remaining - bucket_1 - bucket_2
        # uncapped

      # The investor's own headroom is also a ceiling:
      investor_headroom = min(
          committed_capacity_cents - outstanding_commitment_cents,
          bucket_cap_for(investor.risk_tier))
      max_subscription_cents = min(remaining, investor_headroom)

      # If the request exceeds max_subscription_cents the request is rejected
      # with ERR_SUBSCRIPTION_EXCEEDS_CAPACITY; the endpoint does NOT partially accept.
    constants:
      TIER_1_CEILING: 800000000
      TIER_2_CEILING: 600000000
      TIER_1_CAP: 300000000
      TIER_2_CAP: 400000000
    precision: "cents; integer arithmetic, no rounding"
    variants:
      - name: headroom
        when: "used at subscription creation to bound the committed amount"
        difference: "Applies the investor's remaining capacity against the fund's remaining raise, whichever binds first."
      - name: waterfall_fill
        when: "used to describe how the fund's remaining raise is conceptually split across tiers"
        difference: "Splits the raise into tier buckets; a TIER_3 investor can absorb the whole remainder while a TIER_1 investor is capped 300000000 even with unlimited personal headroom."

  - name: credit_shortfall_waterfall
    trigger: "POST /funds/{fund_id}/allocations/{allocation_id}/distribute"
    algorithm: waterfall_allocation
    input_set: "The allocation's payable amount, and every FundSubscription of the allocation's fund whose status is not DEFAULTED."
    formula: |
      # Pinned order: subscriptions sorted by
      #   (1) Investor.risk_tier ASC where TIER_1 < TIER_2 < TIER_3,
      #   (2) Investor.created_at ASC,
      #   (3) FundSubscription.created_at ASC.
      # Random ids are never consulted.
      payable = min(delivered_credit_dollars_cents, allocation.awarded_credit_dollars_cents)
      shares = []
      for sub in ordered subscriptions:
        share = round_half_up(payable * sub.committed_cents / total_committed_of_ordered_subs, 0)
        shares.append(share)
      remainder = payable - sum(shares)
      # Remainder is distributed in the SAME pinned order, one cent per
      # subscription, until exhausted.
      for sub in ordered subscriptions:
        if remainder == 0: break
        shares[sub] += 1
        remainder -= 1
      # If the payable amount is smaller than the subscription count, the
      # earliest subscriptions in the pinned order receive the single cents.
    constants:
      TIER_ORDER: {TIER_1: 1, TIER_2: 2, TIER_3: 3}
    precision: "cents; round_half_up per share, then largest-remainder-in-pinned-order"

  - name: watch_list_risk_score
    trigger: "POST /projects/{project_id}/reviews"
    algorithm: weighted_scoring
    input_set: "The PortfolioReview row's input fields (occupancy_pct, dscr_observed, reserve_balance_cents) and the reviewed Project's constructed dates."
    formula: |
      occupancy_points = round_half_up(35 * occupancy_pct, 0)
      dscr_points      = round_half_up(30 * min(dscr_observed, 1.5) / 1.5, 0)
      reserve_points   = 20 if reserve_balance_cents < 50000000 else 0
      term_violations  = count of the following that hold:
                           logical clock > project.placed_in_service_deadline
                           review.review_period_end > logical clock
      term_points      = 15 * term_violations
      raw_score = occupancy_points + dscr_points + reserve_points + term_points
      risk_score = max(0, min(100, raw_score))
    constants:
      OCCUPANCY_WEIGHT: 35
      DSCR_WEIGHT: 30
      DSCR_CEILING: 1.5
      RESERVE_TARGET_CENTS: 50000000
      RESERVE_POINTS: 20
      TERM_POINTS: 15
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "integer points; round_half_up at each term before summing; clamped to [0, 100]"

  - name: operating_deficit_coverage
    trigger: "POST /projects/{project_id}/reviews, POST /guarantees/{guarantee_id}/draw"
    algorithm: aggregation
    input_set: "The Project's OPERATING_DEFICIT Guarantee rows and the acting Developer."
    formula: |
      monthly_deficit = round_half_up(max(0, debt_service_cents - operating_pro_forma_noi_cents) / 12.0, 0)
      annual_deficit  = round_half_up(max(0, debt_service_cents - operating_pro_forma_noi_cents), 0)
      coverage_months = liquid_assets_cents // max(monthly_deficit, 1)
      developer_covered = coverage_months >= 12
      # An OPERATING_DEFICIT draw is permitted only when the developer cannot
      # cover a full year from liquid assets, i.e. developer_covered == false
      # AND the guarantee still has remaining capacity.
    constants:
      MONTHS_DIVISOR: 12
      COVERAGE_MONTHS_MIN: 12
    precision: "cents; integer floor division for coverage_months"

  - name: exit_option_price
    trigger: "POST /exit-events/{exit_event_id}/exercise with action=ISSUE_NOTICE or action=EXERCISE"
    algorithm: chronological
    input_set: "The ExitEvent being priced, its Project, and every PAID CapitalCall of that project."
    formula: |
      # PINNED EVALUATION ORDER — the price is computed in exactly this order,
      # and each step sees the already-rounded value from the step above.
      cumulative_distributions_cents = sum(p.settled_amount_cents for PAID capital calls of this project)

      option_price_cents =
        round_half_up(
          round_half_up(
            round_half_up(underwritten_equity_cents * 1.05, 0)      # step 1: 5% equity step-up
            - cumulative_distributions_cents, 0)                    # step 2: subtract distributions
          * (1 + 0.01 * capital_call_shortfall_count), 0)           # step 3: shortfall surcharge
      # capital_call_shortfall_count = count of DEFICIENT or ADJUSTED calls of this project.
      # option_price_cents is floored at 0.
    constants:
      EQUITY_STEP_UP: 1.05
      SHORTFALL_SURCHARGE_PER_CALL: 0.01
    precision: "cents; three sequential round_half_up steps in the pinned order; different orders give different cents"

  - name: compensating_invariants
    trigger: "evaluated on every forward/compensating action pair: POST /projects/{project_id}/commit paired with POST /projects/{project_id}/allocations action=RESCIND, and POST /funds/{fund_id}/subscriptions paired with the DEFAULTED transition of that FundSubscription"
    algorithm: aggregation
    input_set: "The named conserved quantity's source rows before the forward action, after the forward action, and after the compensating action."
    formula: |
      # Invariant A — CREDIT DOLLARS.
      # Conserved quantity: the project's committed credit dollar total.
      # Forward action:       POST /projects/{project_id}/commit moves every
      #                       RESERVED or AWARDED Allocation -> COMMITTED.
      # Compensating action:  POST /projects/{project_id}/allocations with
      #                       action=RESCIND moves a COMMITTED Allocation ->
      #                       RESCINDED.
      # Invariant:            Project.committed_credit_dollars_cents after the
      #                       pair == its value immediately before the forward
      #                       action, to the cent. With one allocation awarded
      #                       A cents, the sequence 0 -> A -> 0 must be exact.
      # Quantity type: credit dollars.

      # Invariant B — EQUITY CENTS.
      # Conserved quantity: the fund's subscribed equity total.
      # Forward action:       POST /funds/{fund_id}/subscriptions creates a
      #                       FundSubscription with committed_cents == C, which
      #                       enters Fund.subscribed_equity_cents.
      # Compensating action:  that FundSubscription reaching status DEFAULTED
      #                       (via POST /capital-calls/{call_id}/transitions
      #                       action=SETTLE when the call settles short), which
      #                       leaves that sum.
      # Invariant:            after the pair,
      #                         Fund.subscribed_equity_cents
      #                         + sum(committed_cents over DEFAULTED subscriptions)
      #                       == sum(committed_cents over ALL subscriptions of
      #                          the fund), exactly, AND
      #                         Fund.subscribed_equity_cents has returned to its
      #                       pre-forward-action value to the cent.
      # Quantity type: equity cents.
    constants: {}
    precision: "cents; the invariant holds to the cent; drift of one cent is a failure"

  - name: portfolio_summary
    trigger: "GET /funds/{fund_id}/portfolio-summary"
    algorithm: aggregation
    input_set: "Every Project of the fund whose status is not EXITED, joined to its COMMITTED and CLOSED Allocations."
    formula: |
      project_count = count(projects of this fund with status != EXITED)
      distressed_count = count(projects of this fund with status == DISTRESSED)
      total_awarded_credit_dollars_cents = sum(awarded_credit_dollars_cents over COMMITTED and CLOSED allocations)
      total_delivered_credit_dollars_cents = sum(delivered_credit_dollars_cents over COMMITTED and CLOSED allocations)
      total_committed_equity_cents = sum(underwritten_equity_cents over non-EXITED projects)
      weighted_average_risk_score = round_half_up(
          sum(review.risk_score for the LATEST review of every non-EXITED project)
          / max(project_count, 1), 0)
    constants: {}
    precision: "integer cents; weighted_average_risk_score rounded to integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names one of the declared roles in §1.7; the sentinel role Anonymous is never accepted, and for entity_backed roles X-User-ID must be present."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles; entity_backed scope is not checked here (see priority 5)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request shape: every required input is present, every enum input is a declared member, every numeric input is non-negative, coverage_start_date is strictly before coverage_end_date, exercise_deadline is not before rofr_notice_date, and scheduled_date is not after due_date."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Every id in the path and body resolves; the specific error is selected by the segment — ERR_DEVELOPER_NOT_FOUND (developer_id), ERR_FUND_NOT_FOUND (fund_id), ERR_PROJECT_NOT_FOUND (project_id), ERR_ALLOCATION_NOT_FOUND (allocation_id), ERR_CAPITAL_CALL_NOT_FOUND (call_id), ERR_GUARANTEE_NOT_FOUND (guarantee_id), ERR_SUBSCRIPTION_NOT_FOUND (subscription_id), ERR_REVIEW_NOT_FOUND (review_id), ERR_EXIT_EVENT_NOT_FOUND (exit_event_id). Path segments are validated left-to-right and body references after them."
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: business_referential
    check: "Referential scope: an entity_backed actor may only act on resources its own entity owns (Developer acting on its own Project, Investor acting on its own FundSubscription); a nested child must belong to the path parent (Allocation, CapitalCall, Guarantee, PortfolioReview and ExitEvent must all carry the path project_id); the settling CapitalCall's project must be funded by the subscription's fund."
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all entity-scoped endpoints; GET /projects and GET /subscriptions filter by the acting entity instead of rejecting"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation — ERR_PROJECT_NOT_COMMITTABLE, ERR_INVALID_ALLOCATION_STATE, ERR_CALL_NOT_ISSUED, ERR_REVIEW_NOT_ESCALATED, ERR_EXIT_EVENT_NOT_PENDING, ERR_SUBSCRIPTION_TERMINAL."
    error_id: ERR_PROJECT_NOT_COMMITTABLE
    http_status: 409
    applies_to: "POST /projects/{project_id}/commit, POST /capital-calls/{call_id}/transitions, POST /reviews/{review_id}/resolve, POST /exit-events/{exit_event_id}/exercise, POST /subscriptions/{subscription_id}/payins, POST /guarantees/{guarantee_id}/draw, POST /projects/{project_id}/allocations, PUT /projects/{project_id}"

  - priority: 7
    category: business_safety
    check: "Sponsor and guarantee safeguard: the acting Developer must be ELIGIBLE for commit (ERR_DEVELOPER_WATCH_BLOCKED), must be ELIGIBLE with no DISTRESSED project for exit exercise (ERR_DEVELOPER_NOT_ELIGIBLE_FOR_EXIT), and a new guarantee may not push guarantee_exposure_cents above net_worth_cents (ERR_GUARANTEE_EXPOSURE_EXCEEDED)."
    error_id: ERR_DEVELOPER_WATCH_BLOCKED
    http_status: 422
    applies_to: "POST /projects/{project_id}/commit, POST /exit-events/{exit_event_id}/exercise, POST /projects/{project_id}/guarantees, POST /guarantees/{guarantee_id}/draw"

  - priority: 8
    category: business_constraint
    check: "Revision band and conflict constraints: expected version must still be current (ERR_STALE_VERSION); one ISSUED call per milestone per project (ERR_DUPLICATE_CALL_MILESTONE); an ISSUED call must start at least 30 days after the previous call's due date (ERR_CALL_BUFFER_TOO_SHORT); one non-DEFAULTED subscription per (fund, investor) (ERR_DUPLICATE_SUBSCRIPTION); one non-terminal Allocation per (project, state_agency) whose award interval overlaps (ERR_DUPLICATE_ALLOCATION_PERIOD); ROFR windows of the same project must not overlap (ERR_ROFR_WINDOW_OVERLAP); Guarantee coverage intervals of the same project and type must not overlap (ERR_COVERAGE_WINDOW_OVERLAP); a suspended Investor may not subscribe (ERR_INVESTOR_SUSPENDED); a FROZEN fund posture blocks commit and call creation (ERR_FUND_POSTURE_FROZEN); a fund must be CLOSING or CLOSED to accept subscriptions (ERR_FUND_NOT_FORMING)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /funds/{fund_id}/subscriptions, PUT /projects/{project_id}, PUT /funds/{fund_id}, POST /projects/{project_id}/capital-calls, POST /projects/{project_id}/allocations, POST /projects/{project_id}/guarantees, POST /projects/{project_id}/exit-events"

  - priority: 9
    category: business_fiscal
    check: "Equity buckets: a subscription may not exceed the fund's remaining raise nor the investor's remaining capacity against its tier cap (ERR_SUBSCRIPTION_EXCEEDS_CAPACITY); a pay-in may not push paid_in_cents above committed_cents (ERR_OVERPAYMENT); a distribution may not exceed the allocation's delivered credit dollars (ERR_DISTRIBUTION_EXCEEDS_DELIVERED); a draw is clamped to remaining_capacity_cents."
    error_id: ERR_SUBSCRIPTION_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /funds/{fund_id}/subscriptions, POST /subscriptions/{subscription_id}/payins, POST /projects/{project_id}/allocations"

  - priority: 10
    category: business_temporal
    check: "Logical-clock windows: subscription creation requires subscription_open_date <= clock <= subscription_close_date (ERR_SUBSCRIPTION_WINDOW_CLOSED); a call may only issue at or after scheduled_date (ERR_CALL_NOT_DUE); a NONCOMPLIANT finding requires clock >= review_period_end (ERR_REVIEW_PERIOD_OPEN); an exit exercise requires clock <= rofr_expires_at (ERR_ROFR_WINDOW_EXPIRED); the PLACED_IN_SERVICE milestone requires clock <= placed_in_service_deadline (ERR_PLACED_IN_SERVICE_DEADLINE_PASSED)."
    error_id: ERR_SUBSCRIPTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /funds/{fund_id}/subscriptions, POST /projects/{project_id}/capital-calls, POST /capital-calls/{call_id}/transitions, POST /reviews/{review_id}/resolve, POST /exit-events/{exit_event_id}/exercise, POST /projects/{project_id}/milestones"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- Developers ---
  - method: POST
    path: "/developers"
    description: "Onboard a sponsor/developer."
    roles: [PlatformAdmin]
    code: 201
    input: [name, developer_type, sponsor_experience_months, projects_completed, net_worth_cents, liquid_assets_cents]
    output: Developer
    side_effects: ["status is derived by the sponsor_eligibility calculation; guarantee_exposure_cents and active_project_count start at 0"]

  - method: GET
    path: "/developers/{developer_id}"
    description: "Read a developer, including the derived status and guarantee exposure."
    roles: [Developer, Underwriter, AssetManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Developer
    side_effects: []

  # --- Investors ---
  - method: POST
    path: "/investors"
    description: "Onboard an institutional investor."
    roles: [PlatformAdmin]
    code: 201
    input: [name, investor_type, committed_capacity_cents, risk_tier]
    output: Investor
    side_effects: ["status starts ACTIVE; outstanding_commitment_cents and funded_cents start at 0"]

  - method: GET
    path: "/investors/{investor_id}"
    description: "Read an investor, including outstanding commitment and funded equity."
    roles: [Investor, Underwriter, AssetManager, PlatformAdmin]
    code: 200
    input: []
    output: Investor
    side_effects: []

  # --- Funds ---
  - method: POST
    path: "/funds"
    description: "Form a syndication fund."
    roles: [Underwriter, PlatformAdmin]
    code: 201
    input: [fund_name, target_equity_cents, price_per_credit_dollar, target_yield_pct, "close_threshold_pct?", subscription_open_date, subscription_close_date]
    output: SyndicationFund
    side_effects: ["status=FORMING, posture=OPEN, funded_equity_cents=0, subscribed_equity_cents=0, subscription_count=0"]

  - method: GET
    path: "/funds/{fund_id}"
    description: "Read a fund with its derived posture, pricing, yields and portfolio summary counters."
    roles: [Underwriter, AssetManager, Investor, PlatformAdmin]
    code: 200
    input: []
    output: SyndicationFund
    side_effects: ["Recomputes awarded_credits_total_cents, delivered_credits_total_cents, priced_value_cents, realized_value_cents, priced_yield_pct, realized_yield_pct and the portfolio_summary counters on read"]

  - method: PUT
    path: "/funds/{fund_id}"
    description: "Reprice a fund or move its close threshold."
    roles: [Underwriter]
    code: 200
    input: ["price_per_credit_dollar?", "target_yield_pct?", "close_threshold_pct?", expected_fund_version]
    output: SyndicationFund
    side_effects: ["Recomputes priced_yield_pct and realized_yield_pct", "increments SyndicationFund.version by 1", "Already-created FundSubscription rows keep their pinned executed_price_per_credit_dollar"]

  - method: POST
    path: "/funds/{fund_id}/subscriptions"
    description: "Create an investor subscription against a fund."
    roles: [Investor, PlatformAdmin]
    code: 201
    input: [investor_id, committed_cents, payin_schedule, expected_fund_version]
    output: FundSubscription
    side_effects: ["status starts PLEDGED", "executed_price_per_credit_dollar is pinned from the fund", "Increments SyndicationFund.version by 1", "Recomputes fund.subscribed_equity_cents, fund.priced_yield_pct and fund.subscription_count", "May move fund.status FORMING→CLOSING or CLOSING→FORMING"]

  # --- Subscriptions ---
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, filterable by fund and investor."
    roles: [Investor, Underwriter, AssetManager, PlatformAdmin]
    code: 200
    input: ["fund_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: FundSubscription[]
    side_effects: []

  - method: GET
    path: "/subscriptions/{subscription_id}"
    description: "Read one subscription with its paid-in progress and shortfall."
    roles: [Investor, Underwriter, AssetManager, PlatformAdmin]
    code: 200
    input: []
    output: FundSubscription
    side_effects: []

  - method: POST
    path: "/subscriptions/{subscription_id}/payins"
    description: "Record an equity pay-in against a subscription."
    roles: [Investor, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: FundSubscription
    side_effects: ["Advances PLEDGED→SUBSCRIBED→PARTIALLY_FUNDED→FULLY_FUNDED", "Increments Fund.funded_equity_cents and Investor.funded_cents by amount_cents", "Recomputes unfunded_commitment_cents", "Recomputes fund.realized_yield_pct"]

  # --- Projects ---
  - method: POST
    path: "/projects"
    description: "Create a project under a developer and a fund."
    roles: [Underwriter]
    code: 201
    input: [developer_id, fund_id, project_name, state_code, total_credit_dollars_cents, construction_budget_cents, construction_loan_cents, operating_pro_forma_noi_cents, debt_service_cents, market_study_absorption_score, sponsor_experience_months, placed_in_service_deadline, "compliance_period_months?"]
    output: Project
    side_effects: ["status=UNDERWRITING, underwriting_stage=PRELIMINARY", "Computes preliminary_equity_cents and underwritten_equity_cents", "Computes dscr, operating_deficit_cents and underwritten_gap_cents"]

  - method: GET
    path: "/projects"
    description: "List projects, filterable by developer, fund and status."
    roles: [Underwriter, AssetManager, ComplianceOfficer, Developer, PlatformAdmin]
    code: 200
    input: ["developer_id?", "fund_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{project_id}"
    description: "Read a project with its derived underwriting, credit-delivery and compliance fields."
    roles: [Underwriter, AssetManager, ComplianceOfficer, Developer, Investor, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: PUT
    path: "/projects/{project_id}"
    description: "Edit underwriting inputs, finalize or reopen underwriting, or reserve/release an allocation."
    roles: [Underwriter]
    code: 200
    input: ["underwriting_action?", "allocation_action?", "allocation_id?", "construction_budget_cents?", "construction_loan_cents?", "operating_pro_forma_noi_cents?", "debt_service_cents?", "market_study_absorption_score?", "sponsor_experience_months?", "placed_in_service_deadline?", expected_project_version]
    output: Project
    side_effects: ["Recomputes preliminary_equity_cents on any input change", "underwriting_action=FINALIZE computes final_equity_cents and sets underwriting_stage=FINAL", "On any input change while status==UNDERWRITING: final_equity_cents=null and underwriting_stage reverts to PRELIMINARY", "allocation_action=RESERVE/RELEASE moves an Allocation AWARDED↔RESERVED", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{project_id}/commit"
    description: "Commit a fully underwritten project and its allocations to its fund."
    roles: [Underwriter]
    code: 200
    input: []
    output: Project
    side_effects: ["status UNDERWRITING→COMMITTED", "Every RESERVED and AWARDED Allocation of the project becomes COMMITTED", "fund.status CLOSED→DEPLOYING", "Recomputes Project.committed_credit_dollars_cents, fund.subscribed_equity_cents, fund.priced_yield_pct", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{project_id}/milestones"
    description: "Record a construction, lease-up or placed-in-service milestone."
    roles: [AssetManager, Underwriter]
    code: 200
    input: [milestone]
    output: Project
    side_effects: ["Advances Project.status along COMMITTED→CONSTRUCTION→LEASE_UP→STABILIZED→COMPLIANCE_PERIOD", "PLACED_IN_SERVICE stamps placed_in_service_at and starts the compliance clock", "Re-derives EXIT_ELIGIBLE when the compliance period has run and compliance_failure_count == 0", "increments Project.version by 1"]

  - method: GET
    path: "/projects/{project_id}/capital-calls"
    description: "List a project's capital calls, filterable by milestone and status."
    roles: [Investor, AssetManager, Underwriter, PlatformAdmin]
    code: 200
    input: ["milestone?", "status?", "limit?", "offset?"]
    output: CapitalCall[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/capital-calls"
    description: "Schedule an equity capital call against a milestone."
    roles: [AssetManager, Underwriter]
    code: 201
    input: [milestone, scheduled_date, due_date, milestone_share, expected_project_version]
    output: CapitalCall
    side_effects: ["status=SCHEDULED, credit_delivery_adjuster_pct=0.0, settled_amount_cents=0, shortfall_cents=0", "increments Project.version by 1"]

  - method: POST
    path: "/capital-calls/{call_id}/transitions"
    description: "Issue, settle, adjust or re-issue a capital call."
    roles: [Investor, AssetManager]
    code: 200
    input: [action, "funded_amount_cents?"]
    output: CapitalCall
    side_effects: ["action=ISSUE: SCHEDULED→ISSUED and computes called_amount_cents", "action=SETTLE: ISSUED→PAID when funded_amount_cents == called_amount_cents, ISSUED→DEFICIENT otherwise and records shortfall_cents", "action=ADJUST: ISSUED→ADJUSTED, recomputes the adjuster and called_amount_cents, and moves every FULLY_FUNDED subscription of the fund back to PARTIALLY_FUNDED", "action=REISSUE: ADJUSTED→ISSUED"]

  # --- Allocations ---
  - method: GET
    path: "/projects/{project_id}/allocations"
    description: "List a project's credit allocations, filterable by status."
    roles: [Underwriter, AssetManager, Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/allocations"
    description: "Create an allocation award, or close, rescind, record a delivery against, or distribute one."
    roles: [Underwriter, AssetManager]
    code: 201
    input: [action, "state_agency?", "awarded_credit_dollars_cents?", "commitment_fee_pct?", "awarded_date?", "placed_in_service_deadline?", "allocation_id?", "delivered_credit_dollars_cents?"]
    output: Allocation
    side_effects: ["action=CREATE: status starts AWARDED", "action=CLOSE: COMMITTED→CLOSED", "action=RESCIND: any non-terminal→RESCINDED and Project.committed_credit_dollars_cents is recomputed", "action=RECORD_DELIVERY: sets delivered_credit_dollars_cents and recomputes Allocation.delivery_ratio and Project.delivered_credit_dollars_cents", "action=DISTRIBUTE: runs the credit_shortfall_waterfall across the fund's non-DEFAULTED subscriptions"]

  # --- Guarantees ---
  - method: GET
    path: "/projects/{project_id}/guarantees"
    description: "List a project's guarantees, filterable by type and status."
    roles: [AssetManager, ComplianceOfficer, Underwriter, Investor, PlatformAdmin]
    code: 200
    input: ["guarantee_type?", "status?", "limit?", "offset?"]
    output: Guarantee[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/guarantees"
    description: "Record a developer guarantee covering a project."
    roles: [AssetManager, Underwriter]
    code: 201
    input: [guarantee_type, guaranteed_amount_cents, recapture_pct, coverage_start_date, coverage_end_date]
    output: Guarantee
    side_effects: ["status=ACTIVE, drawn_amount_cents=0, remaining_capacity_cents=guaranteed_amount_cents", "Recomputes Developer.guarantee_exposure_cents and Developer.status", "increments Project.version by 1"]

  - method: POST
    path: "/guarantees/{guarantee_id}/draw"
    description: "Draw against a guarantee, or reinstate a partially drawn one with a zero draw."
    roles: [AssetManager]
    code: 200
    input: [requested_amount_cents]
    output: Guarantee
    side_effects: ["ACTIVE→DRAWN when the draw is positive", "drawn_amount_cents increases by min(requested_amount_cents, remaining_capacity_cents)", "remaining_capacity_cents is recomputed", "A RECAPTURE draw moves the owning Project to DISTRESSED and recomputes the fund's posture", "Recomputes Developer.guarantee_exposure_cents and Developer.status"]

  # --- Reviews ---
  - method: GET
    path: "/projects/{project_id}/reviews"
    description: "List a project's compliance reviews, filterable by status and period."
    roles: [AssetManager, ComplianceOfficer, Investor, PlatformAdmin]
    code: 200
    input: ["status?", "review_period_index?", "limit?", "offset?"]
    output: PortfolioReview[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/reviews"
    description: "Open a compliance review for a period and score it."
    roles: [AssetManager, ComplianceOfficer]
    code: 201
    input: [review_period_index, review_period_end, occupancy_pct, dscr_observed, reserve_balance_cents]
    output: PortfolioReview
    side_effects: ["status starts PENDING", "Computes risk_score via watch_list_risk_score", "A review may not be opened for a period index already reviewed for this project (ERR_DUPLICATE_REVIEW_PERIOD)"]

  - method: POST
    path: "/reviews/{review_id}/resolve"
    description: "Resolve a compliance review into compliant, watch, escalated, noncompliant or cured."
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["outcome?", "corrected_reserve_balance_cents?"]
    output: PortfolioReview
    side_effects: ["Derives COMPLIANT / WATCH / ESCALATED from risk_score when outcome is omitted", "outcome=NONCOMPLIANT increments Project.compliance_failure_count", "status ESCALATED or a second NONCOMPLIANT moves the owning fund's posture toward FROZEN", "outcome=CURED recomputes Developer.status and lifts the FROZEN condition", "Recomputes Developer.status whenever an ESCALATED review appears or clears"]

  # --- Exit events ---
  - method: GET
    path: "/projects/{project_id}/exit-events"
    description: "List a project's year-fifteen exit events."
    roles: [Underwriter, AssetManager, Investor, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExitEvent[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/exit-events"
    description: "Plan a year-fifteen exit for a project."
    roles: [Underwriter, AssetManager]
    code: 201
    input: [exit_year, rofr_notice_date, "rofr_window_days?", exercise_deadline]
    output: ExitEvent
    side_effects: ["status=PENDING", "Computes rofr_expires_at", "A new exit event requires the project status to be COMPLIANCE_PERIOD or EXIT_ELIGIBLE (ERR_EXIT_NOT_ELIGIBLE)"]

  - method: POST
    path: "/exit-events/{exit_event_id}/exercise"
    description: "Issue the option notice, open the ROFR window, exercise, decline or close an exit."
    roles: [Underwriter, AssetManager]
    code: 200
    input: [action]
    output: ExitEvent
    side_effects: ["action=ISSUE_NOTICE: PENDING→OPTION_NOTICE_ISSUED and computes option_price_cents", "action=OPEN_ROFR: OPTION_NOTICE_ISSUED→ROFR_WINDOW and pins the ROFR window", "action=EXERCISE: ROFR_WINDOW→EXERCISED and recomputes option_price_cents", "action=DECLINE: →DECLINED and returns the project to COMPLIANCE_PERIOD", "action=CLOSE: EXERCISED/DECLINED→CLOSED; closing an EXERCISED exit moves the project to EXITED and releases every guarantee of the project"]

  # --- Logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that value and never real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "current_utc"
    side_effects: ["Drives every temporal window: fund close and termination, call issue eligibility, review period closure, ROFR expiry, placed-in-service deadline"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is absent or names a role that is not one of the six declared roles; X-User-ID is absent for an entity_backed role."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."

  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "The acting entity_backed actor does not own the target resource, or a nested child does not carry the path parent's project_id, or the settling capital call's project is not funded by the subscription's fund."

  # --- Request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input is missing, an enum input is not a declared member, a numeric input is negative, coverage_start_date is not strictly before coverage_end_date, or scheduled_date is after due_date."

  - id: ERR_EXIT_WINDOW_INVERTED
    http: 400
    condition: "exercise_deadline is before rofr_notice_date, or rofr_notice_date plus rofr_window_days lands after exercise_deadline."

  # --- Not found ---
  - id: ERR_DEVELOPER_NOT_FOUND
    http: 404
    condition: "No Developer carries the supplied developer_id."

  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "No SyndicationFund carries the supplied fund_id."

  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No Project carries the supplied project_id."

  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No Allocation carries the supplied allocation_id, or it belongs to a different project."

  - id: ERR_CAPITAL_CALL_NOT_FOUND
    http: 404
    condition: "No CapitalCall carries the supplied call_id."

  - id: ERR_GUARANTEE_NOT_FOUND
    http: 404
    condition: "No Guarantee carries the supplied guarantee_id."

  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "No FundSubscription carries the supplied subscription_id."

  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No PortfolioReview carries the supplied review_id."

  - id: ERR_EXIT_EVENT_NOT_FOUND
    http: 404
    condition: "No ExitEvent carries the supplied exit_event_id."

  # --- State ---
  - id: ERR_PROJECT_NOT_COMMITTABLE
    http: 409
    condition: "The project is not in a state that permits the requested transition — commit attempted with underwriting_stage == PRELIMINARY, with status != UNDERWRITING, with no Allocation in status RESERVED or AWARDED, with dscr below 1.15, with market_study_absorption_score below 0.60, or with sponsor_experience_months below 24; or a milestone recorded out of order."

  - id: ERR_INVALID_ALLOCATION_STATE
    http: 409
    condition: "The allocation is not in a state that permits the requested delivery action — CLOSE from a non-COMMITTED allocation, or RESCIND from CLOSED."

  - id: ERR_CALL_NOT_ISSUED
    http: 409
    condition: "SETTLE or ADJUST was requested on a CapitalCall that is not ISSUED (or ADJUSTED for a REISSUE)."

  - id: ERR_REVIEW_NOT_ESCALATED
    http: 409
    condition: "A NONCOMPLIANT or CURED outcome was requested on a PortfolioReview that never reached ESCALATED or NONCOMPLIANT."

  - id: ERR_EXIT_EVENT_NOT_PENDING
    http: 409
    condition: "An exit action was requested from a state that does not permit it — ISSUE_NOTICE from anything other than PENDING, EXERCISE from anything other than ROFR_WINDOW, CLOSE from anything other than EXERCISED or DECLINED."

  - id: ERR_SUBSCRIPTION_TERMINAL
    http: 409
    condition: "A pay-in or reinstatement was requested on a DEFAULTED FundSubscription."

  # --- Sponsor and guarantee safeguards ---
  - id: ERR_DEVELOPER_WATCH_BLOCKED
    http: 422
    condition: "The acting Developer is WATCH or SUSPENDED, so commit or exit exercise is blocked."

  - id: ERR_GUARANTEE_EXPOSURE_EXCEEDED
    http: 422
    condition: "Recording the guarantee would push Developer.guarantee_exposure_cents above Developer.net_worth_cents without eligibility from the sponsor_eligibility coverage test."

  - id: ERR_DEVELOPER_NOT_ELIGIBLE_FOR_EXIT
    http: 422
    condition: "The exercising Developer is not ELIGIBLE, or has at least one Project in status DISTRESSED."

  # --- Constraint and conflict ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version."

  - id: ERR_DUPLICATE_CALL_MILESTONE
    http: 409
    condition: "A CapitalCall already exists for the same project and milestone, in any status."

  - id: ERR_CALL_BUFFER_TOO_SHORT
    http: 409
    condition: "An ISSUED CapitalCall's scheduled_date is fewer than 30 days after the due_date of the most recently PAID or DEFICIENT call of the same project."

  - id: ERR_DUPLICATE_SUBSCRIPTION
    http: 409
    condition: "A non-DEFAULTED FundSubscription already exists for the same (fund, investor) pair."

  - id: ERR_DUPLICATE_ALLOCATION_PERIOD
    http: 409
    condition: "A non-terminal Allocation for the same (project, state_agency) has an award interval that overlaps the requested one; adjacency where the new awarded_date equals the existing placed_in_service_deadline is allowed."

  - id: ERR_ROFR_WINDOW_OVERLAP
    http: 409
    condition: "An ExitEvent of the same project already has an open ROFR window that overlaps the requested one."

  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "A non-RELEASED Guarantee of the same project and guarantee_type already covers an overlapping interval."

  - id: ERR_INVESTOR_SUSPENDED
    http: 403
    condition: "The subscribing Investor is SUSPENDED because one of its subscriptions defaulted."

  - id: ERR_FUND_POSTURE_FROZEN
    http: 409
    condition: "The fund's posture is FROZEN, blocking project commit and capital-call creation."

  - id: ERR_FUND_NOT_FORMING
    http: 409
    condition: "A subscription was attempted against a fund that is not FORMING or CLOSING, or an equity pay-in was attempted against a fund that has not reached CLOSING or CLOSED, or the fund was terminated before closing, or it is wound down."

  - id: ERR_DUPLICATE_REVIEW_PERIOD
    http: 409
    condition: "A PortfolioReview already exists for the same (project, review_period_index) pair."

  - id: ERR_EXIT_NOT_ELIGIBLE
    http: 409
    condition: "An ExitEvent was requested for a project that is not in COMPLIANCE_PERIOD or EXIT_ELIGIBLE, or whose compliance period has not yet run."

  # --- Fiscal ---
  - id: ERR_SUBSCRIPTION_EXCEEDS_CAPACITY
    http: 422
    condition: "committed_cents exceeds the fund's remaining raise, or exceeds the investor's remaining capacity against its risk-tier cap."

  - id: ERR_OVERPAYMENT
    http: 422
    condition: "The pay-in would push FundSubscription.paid_in_cents above its committed_cents."

  - id: ERR_DISTRIBUTION_EXCEEDS_DELIVERED
    http: 422
    condition: "The distribution amount exceeds the allocation's delivered_credit_dollars_cents."

  # --- Temporal ---
  - id: ERR_SUBSCRIPTION_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is outside [subscription_open_date, subscription_close_date]."

  - id: ERR_CALL_NOT_DUE
    http: 422
    condition: "The logical clock precedes the CapitalCall's scheduled_date."

  - id: ERR_REVIEW_PERIOD_OPEN
    http: 422
    condition: "A NONCOMPLIANT finding was recorded before the reviewed period's review_period_end."

  - id: ERR_ROFR_WINDOW_EXPIRED
    http: 422
    condition: "The logical clock is after the ExitEvent's rofr_expires_at."

  - id: ERR_PLACED_IN_SERVICE_DEADLINE_PASSED
    http: 422
    condition: "The logical clock is after Project.placed_in_service_deadline when the PLACED_IN_SERVICE milestone is recorded."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Developer
    description: "The sponsoring developer entity. Reads its own projects (including their capital calls, allocations, guarantees, reviews and exit events) and its own derived eligibility status. Cannot underwrite, cannot commit, cannot draw against its own guarantees."
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "GET /developers/{developer_id} — read own developer record when the id matches X-User-ID"
    shared_operations:
      - "GET /projects — own projects only, filtered by X-User-ID"
      - "GET /projects/{project_id} — own projects only"

  - name: Investor
    description: "The institutional investor entity. Subscribes to funds, pays in equity, settles capital calls against its own subscriptions, and reads its own commitments. Cannot resolve compliance findings, cannot draw guarantees."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /subscriptions/{subscription_id}/payins — only the Investor that owns the subscription"
      - "POST /capital-calls/{call_id}/transitions with action=SETTLE — only an Investor holding a subscription in the call's project's fund"
    shared_operations:
      - "POST /funds/{fund_id}/subscriptions"
      - "GET /subscriptions — own subscriptions only, filtered by X-User-ID"
      - "GET /subscriptions/{subscription_id}"
      - "GET /investors/{investor_id} — own record only"
      - "GET /funds/{fund_id}"
      - "GET /projects/{project_id} — only projects held by a fund it subscribes to"
      - "GET /projects/{project_id}/capital-calls, /allocations, /guarantees, /reviews, /exit-events"

  - name: Underwriter
    description: "Runs developer and project underwriting, forms funds, prices them, commits projects, and exercises exit options. Cannot resolve compliance findings and cannot record portfolio reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /funds"
      - "PUT /funds/{fund_id}"
      - "POST /projects"
      - "PUT /projects/{project_id}"
      - "POST /projects/{project_id}/commit"
      - "POST /exit-events/{exit_event_id}/exercise with action=EXERCISE or action=DECLINE"
    shared_operations:
      - "GET /funds/{fund_id}"
      - "GET /projects, GET /projects/{project_id}"
      - "GET /developers/{developer_id}"
      - "POST /projects/{project_id}/capital-calls"
      - "POST /projects/{project_id}/allocations"
      - "POST /projects/{project_id}/guarantees"
      - "POST /projects/{project_id}/exit-events"
      - "POST /projects/{project_id}/milestones"
      - "GET /projects/{project_id}/capital-calls, /allocations, /guarantees, /reviews, /exit-events"

  - name: AssetManager
    description: "Manages the portfolio through the compliance period: issues and adjusts capital calls, records deliverables and milestones, watches the portfolio, plans exits, and draws guarantees."
    identity: "opaque"
    exclusive_operations:
      - "POST /guarantees/{guarantee_id}/draw"
    shared_operations:
      - "POST /projects/{project_id}/capital-calls"
      - "POST /capital-calls/{call_id}/transitions with action=ISSUE, action=ADJUST or action=REISSUE"
      - "POST /projects/{project_id}/allocations"
      - "POST /projects/{project_id}/guarantees"
      - "POST /projects/{project_id}/milestones"
      - "POST /projects/{project_id}/reviews"
      - "POST /reviews/{review_id}/resolve with outcome IMPLIED or CURED"
      - "POST /projects/{project_id}/exit-events"
      - "POST /exit-events/{exit_event_id}/exercise with action=ISSUE_NOTICE, action=OPEN_ROFR or action=CLOSE"
      - "GET endpoints on funds, projects, subscriptions, reviews, guarantees, exit events"

  - name: ComplianceOfficer
    description: "Owns the compliance and watch-list surface. Opens reviews, records ESCALATED and NONCOMPLIANT findings, cures them, and reads everything. Cannot underwrite, cannot move money, cannot draw guarantees."
    identity: "opaque"
    exclusive_operations:
      - "POST /reviews/{review_id}/resolve with outcome=ESCALATED or outcome=NONCOMPLIANT"
    shared_operations:
      - "POST /projects/{project_id}/reviews"
      - "POST /reviews/{review_id}/resolve with outcome IMPLIED or CURED"
      - "GET endpoints on projects, allocations, guarantees, reviews and funds"

  - name: Anonymous
    description: "Sentinel for a caller that presents no usable role. It is never permitted on any endpoint; requests carrying it fail the priority 1 authentication check with ERR_UNAUTHENTICATED, which is the reachable path for verifying the 401 shape."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []

  - name: PlatformAdmin
    description: "Operational role for onboarding entities, forming funds on a developer's behalf, recording pay-ins on a client's behalf, and driving the logical clock. Not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /developers"
      - "POST /investors"
      - "POST /_clock/set_current_utc"
      - "POST /projects/{project_id}/commit is NOT available to PlatformAdmin"
    shared_operations:
      - "POST /funds"
      - "POST /funds/{fund_id}/subscriptions"
      - "POST /subscriptions/{subscription_id}/payins"
      - "GET endpoints on developers, investors, funds, projects and subscriptions"