          trigger:
            - call: "POST /appointments/${ap1}/reschedule"
              payload: { service_date: "2026-08-17", requested_start_minute: 540, booking_class: "ROUTINE", expected_appointment_version: "${ap1_v1}" }
              as: Scheduler
              captures: { e_stale: $.data.error_id }
            - call: "GET /appointments/${ap1}"
              payload: {}
              as: Scheduler
              captures: { ap1_vnow: $.data.version, ap1_status_mid: $.data.schedule_status }
