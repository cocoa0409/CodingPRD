  # ===========================================================================
  - section: calculations
    instances:
      - name: mileage_uses_rounded_distance_times_rate
        claim_type: Constants Applied
        grounds: [calculations.provisional_game_pay, entities.Assignment.fields.mileage_cents, entities.League.fields.mileage_rate_cents_per_mile]
        distinguishing_aspect: "With venue ~6.9 miles away and mileage_rate 100c/mi, mileage_cents == round(distance)=7 * 100 = 700; provisional includes that mileage added after game_pay. ROOKIE base 10000*1.0=10000, +700 = 10700."
        test_recipe:
          setup: ["League OPEN base 10000 mileage_rate 100; ROOKIE official home (40.0,-75.0), venue (40.10,-75.0) ~6.9mi within max_travel 50; wide availability."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 100 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0, max_travel_miles: 50 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.10, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
          trigger:
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id, mil: $.data.mileage_cents, prov: $.data.provisional_pay_cents }
          assert:
            - "Assignment.${asg}.mileage_cents == 700"
            - "Assignment.${asg}.provisional_pay_cents == 10700"

      - name: reliability_deduction_applied_at_settlement_threshold
        claim_type: Correct Result
        grounds: [calculations.finalized_settlement_pay, entities.Official.fields.penalty_points]
        distinguishing_aspect: "An official with penalty_points >= 10 forfeits 10% of game_pay at settlement: SENIOR base 15000 * 0.90 = 13500 (mileage 0). Demonstrates the RELIABILITY_DEDUCTION branch."
        test_recipe:
          setup:
            - "League OPEN base 10000 mileage 0; SENIOR official accrues penalty_points 11 via prior declines, then works a game to settlement."
            - "Two prior declines: a standard (96h out, escalation 0 => 1pt) and a late (2h out, prior=1 => 8+2=10pt) => total 11 >= 10."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "SENIOR", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            # Decline 1: clock far before start (96h) -> standard tier 1pt
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T14:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H1", away_team: "A1", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T14:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { g1: $.data.id }
            - call: "POST /games/${g1}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { s1: $.data.id }
            - call: "POST /games/${g1}/open"
              payload: {}
              as: Assignor
              captures: { g1v1: $.data.version }
            - call: "POST /crew-slots/${s1}/offer"
              payload: { official_id: "${off}", expected_game_version: "${g1v1}" }
              as: Assignor
              captures: { d1: $.data.id }
            - call: "POST /assignments/${d1}/decline"
              payload: {}
              as: Official
              as_user_id: "${off}"
            # Decline 2: clock 2h before start (late) prior=1 -> 8 + min(1,3)*2 = 10pt
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T16:00:00Z" }
              as: LeagueAdmin
