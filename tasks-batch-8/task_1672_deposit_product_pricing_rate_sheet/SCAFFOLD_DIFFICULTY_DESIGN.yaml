scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tiered_rate_marginal_vs_whole_balance
        grounds:
          - calculations.tiered_balance_rate
          - entities.DepositProduct.fields.tier_application
          - endpoints."GET /deposit-accounts/{id}/rate-quote"
        distinguishing_aspect: |
          Account-pricing domain: identical tiers and identical balance (7,500,000 cents) price
          differently under the two tiered_balance_rate variants — MARGINAL blends 163 bp while
          WHOLE_BALANCE returns 185 bp; the variant is selected by DepositProduct.tier_application.
        test_recipe:
          setup:
            - "P-MMA (MONEY_MARKET, term 0, MARGINAL, cap 500) and P-SAV (SAVINGS, term 0, WHOLE_BALANCE, cap 500) exist"
            - "Both have an EFFECTIVE sheet in US-WEST with tiers [0,2500000)@120, [2500000,10000000)@185, [10000000,unbounded)@240 (P-MMA effective 2026-08-15, P-SAV effective 2026-09-01 — staggered so each sheet's notices are sent inside its own lead window; lead 7, floor 0)"
            - "Account A-MMA holds 7,500,000 on P-MMA; account A-SAV holds 7,500,000 on P-SAV"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "MMA", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_mma: $.data.id } }
            - { call: "POST /deposit-products", payload: { product_code: "SAV", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_sav: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_mma}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 2500000, rate_bp: 120, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 2500000, upper_bound_cents: 10000000, rate_bp: 185, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 10000000, upper_bound_cents: -1, rate_bp: 240, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_mma: $.data.id } }
            - { call: "POST /rate-sheets/${s_mma}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_mma}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_mma}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_mma}" }, as: ChannelOperator, captures: { d_mma_0: "$.data[0].id", d_mma_1: "$.data[1].id", d_mma_2: "$.data[2].id", d_mma_3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d_mma_0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_mma_1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_mma_2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_mma_3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_mma}" }, as: ComplianceOfficer, captures: { n_mma_0: "$.data[0].id", n_mma_1: "$.data[1].id", n_mma_2: "$.data[2].id", n_mma_3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n_mma_0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_mma_1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_mma_2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_mma_3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_mma}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_sav}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 2500000, rate_bp: 120, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 2500000, upper_bound_cents: 10000000, rate_bp: 185, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 10000000, upper_bound_cents: -1, rate_bp: 240, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_sav: $.data.id } }
            - { call: "POST /rate-sheets/${s_sav}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_sav}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_sav}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_sav}" }, as: ChannelOperator, captures: { d_sav_0: "$.data[0].id", d_sav_1: "$.data[1].id", d_sav_2: "$.data[2].id", d_sav_3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d_sav_0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_sav_1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_sav_2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d_sav_3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_sav}" }, as: ComplianceOfficer, captures: { n_sav_0: "$.data[0].id", n_sav_1: "$.data[1].id", n_sav_2: "$.data[2].id", n_sav_3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n_sav_0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_sav_1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_sav_2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n_sav_3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_sav}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C1", product_id: "${p_mma}", market_code: "US-WEST", opening_balance_cents: 7500000, channel: "ONLINE" }, as: BranchBanker, captures: { a_mma: $.data.id } }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C2", product_id: "${p_sav}", market_code: "US-WEST", opening_balance_cents: 7500000, channel: "ONLINE" }, as: BranchBanker, captures: { a_sav: $.data.id } }
          trigger:
            - { call: "GET /deposit-accounts/${a_mma}/rate-quote", payload: {}, as: BranchBanker, captures: { q_mma_base: $.data.base_rate_bp, q_mma_cur: $.data.current_rate_bp } }
            - { call: "GET /deposit-accounts/${a_sav}/rate-quote", payload: {}, as: BranchBanker, captures: { q_sav_base: $.data.base_rate_bp, q_sav_cur: $.data.current_rate_bp } }
          assert:
            - "A-MMA quote base_rate_bp == 163 and current_rate_bp == 163 (MARGINAL blend of 120/185 over the 2,500,000/5,000,000 split)"
            - "A-SAV quote base_rate_bp == 185 and current_rate_bp == 185 (WHOLE_BALANCE tier 2)"
            - "The two variants diverge on identical inputs: 163 != 185"

      - name: competitor_benchmark_weighted_vs_simple
        grounds:
          - calculations.competitor_market_benchmark
          - entities.CompetitorRateScan.fields.benchmark_weighted_bp
        distinguishing_aspect: |
          Market-analytics domain (distinct from account pricing): the same scan entries produce
          benchmark_weighted_bp 270 (balance-weighted) vs benchmark_simple_bp 275 (unweighted mean);
          both are stored on the scan and the official benchmark is the weighted one.
        test_recipe:
          setup:
            - "A SUBMITTED scan for US-WEST with two MONEY_MARKET entries: Alpha 300 bp at 400,000,000 tier balance; Beta 250 bp at 600,000,000"
          setup_api_calls:
            - { call: "POST /competitor-rate-scans", payload: { market_code: "US-WEST", scan_date: "2026-08-01", source_name: "RateWatch", entries: [ { competitor_name: "Alpha", product_class: "MONEY_MARKET", rate_bp: 300, tier_balance_cents: 400000000 }, { competitor_name: "Beta", product_class: "MONEY_MARKET", rate_bp: 250, tier_balance_cents: 600000000 } ] }, as: PricingAnalyst, captures: { scan_id: $.data.id } }
          trigger:
            - { call: "POST /competitor-rate-scans/${scan_id}/analyze", payload: {}, as: PricingAnalyst, captures: { bw: $.data.benchmark_weighted_bp, bs: $.data.benchmark_simple_bp, st: $.data.status } }
          assert:
            - "benchmark_weighted_bp == 270 ( (300*400000000 + 250*600000000) / 1000000000 )"
            - "benchmark_simple_bp == 275 ( (300 + 250) / 2 )"
            - "270 != 275 — the two valid benchmark readings diverge on identical data"
            - "scan status == ANALYZED"

      - name: sheet_margin_forward_vs_realized_book
        grounds:
          - calculations.sheet_margin_analysis
          - calculations.funding_cost_at_term
          - endpoints."GET /rate-sheets/{id}/margin-analysis"
        distinguishing_aspect: |
          Profitability domain (third distinct domain): FORWARD_LOOKING uses the sheet's projected
          tier balances (weighted 148 bp, margin -62) while REALIZED_BOOK uses actual OPEN account
          balances at current rates (weighted 157 bp, margin -53) — same sheet, same clock, -62 != -53.
        test_recipe:
          setup:
            - "P-SAV2 (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE sheet in US-EAST: tiers [0,10000000)@110 proj 5,000,000,000 and [10000000,unbounded)@160 proj 15,000,000,000 (effective 2026-08-15, lead 7, floor 0)"
            - "FundingCurve dated 2026-08-01 with a single point (tenor 0 -> 210 bp)"
            - "Accounts: A1 1,000,000 (tier 1, 110 bp) and A2 15,000,000 (tier 2, 160 bp), both OPEN on the sheet"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "SAV2", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_sav2: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_sav2}", market_code: "US-EAST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 10000000, rate_bp: 110, projected_balance_cents: 5000000000 }, { tier_index: 1, lower_bound_cents: 10000000, upper_bound_cents: -1, rate_bp: 160, projected_balance_cents: 15000000000 } ] }, as: PricingAnalyst, captures: { s_east: $.data.id } }
            - { call: "POST /rate-sheets/${s_east}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_east}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_east}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_east}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_east}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_east}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /funding-curves", payload: { curve_date: "2026-08-01", points: [ { tenor_months: 0, cost_bp: 210 } ] }, as: TreasuryOfficer }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C1", product_id: "${p_sav2}", market_code: "US-EAST", opening_balance_cents: 1000000, channel: "BRANCH" }, as: BranchBanker }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C2", product_id: "${p_sav2}", market_code: "US-EAST", opening_balance_cents: 15000000, channel: "BRANCH" }, as: BranchBanker }
          trigger:
            - { call: "GET /rate-sheets/${s_east}/margin-analysis", payload: { variant: "FORWARD_LOOKING" }, as: TreasuryOfficer, captures: { fwd_margin: $.data.margin_bp, fwd_rate: $.data.weighted_rate_bp } }
            - { call: "GET /rate-sheets/${s_east}/margin-analysis", payload: { variant: "REALIZED_BOOK" }, as: TreasuryOfficer, captures: { real_margin: $.data.margin_bp, real_rate: $.data.weighted_rate_bp } }
          assert:
            - "FORWARD_LOOKING: weighted_rate_bp == 148 ( (110*5e9 + 160*15e9) / 2e10 ), funding_cost_bp == 210, margin_bp == -62"
            - "REALIZED_BOOK: weighted_rate_bp == 157 ( (110*1000000 + 160*15000000) / 16000000 ), funding_cost_bp == 210, margin_bp == -53"
            - "-62 != -53 — the two margin variants diverge on the same sheet at the same instant"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_rate_stacks_bundle_bonus_under_cap
        grounds:
          - calculations.effective_account_rate
          - entities.DepositAccount.fields.bundle_bonus_bp
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tiered_balance_rate(balance) +
          conditional bundle bonus (enrollment state, qualifying balance, product-class eligibility)
          clamped by min(product.rate_cap_bp=180, base+bonus=188) -> 180 with cap_applied true.
        test_recipe:
          setup:
            - "P-MMA (MONEY_MARKET, term 0, MARGINAL, cap 180) with EFFECTIVE sheet in US-WEST, tiers [0,2500000)@120, [2500000,10000000)@185, [10000000,unbounded)@240 (effective 2026-08-15, lead 7, floor 0)"
            - "P-SAV3 (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE single-tier sheet [0,unbounded)@100 in US-WEST (effective 2026-09-01 — staggered behind the MMA sheet so its notices send on time)"
            - "Customer C9 holds MMA account 7,500,000 and SAV account 5,000,000 (both OPEN)"
            - "Bundle B1: bonus 25 bp, min_combined_balance 10,000,000, required classes [MONEY_MARKET, SAVINGS], eligible classes [MONEY_MARKET]; C9 ENROLLED with qualifying balance 12,500,000"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "MMA9", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 180, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_mma: $.data.id } }
            - { call: "POST /deposit-products", payload: { product_code: "SAV3", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_sav: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_mma}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 2500000, rate_bp: 120, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 2500000, upper_bound_cents: 10000000, rate_bp: 185, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 10000000, upper_bound_cents: -1, rate_bp: 240, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_mma: $.data.id } }
            - { call: "POST /rate-sheets/${s_mma}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_mma}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_mma}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_mma}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_mma}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_mma}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_sav}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_sav: $.data.id } }
            - { call: "POST /rate-sheets/${s_sav}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_sav}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_sav}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_sav}" }, as: ChannelOperator, captures: { e0: "$.data[0].id", e1: "$.data[1].id", e2: "$.data[2].id", e3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${e0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${e3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_sav}" }, as: ComplianceOfficer, captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id", m3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${m0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${m3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_sav}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C9", product_id: "${p_mma}", market_code: "US-WEST", opening_balance_cents: 7500000, channel: "ONLINE" }, as: BranchBanker, captures: { a_mma: $.data.id } }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C9", product_id: "${p_sav}", market_code: "US-WEST", opening_balance_cents: 5000000, channel: "ONLINE" }, as: BranchBanker, captures: { a_sav: $.data.id } }
            - { call: "POST /relationship-bundles", payload: { bundle_code: "PREMIER", bonus_bp: 25, min_combined_balance_cents: 10000000, required_product_classes: ["MONEY_MARKET", "SAVINGS"], eligible_product_classes: ["MONEY_MARKET"] }, as: OperationsAdmin, captures: { b1: $.data.id } }
            - { call: "POST /bundle-enrollments", payload: { bundle_id: "${b1}", customer_ref: "C9" }, as: OperationsAdmin, captures: { enr: $.data.id, enr_qual: $.data.qualifying_balance_cents } }
          trigger:
            - { call: "GET /deposit-accounts/${a_mma}/rate-quote", payload: {}, as: BranchBanker, captures: { q_base: $.data.base_rate_bp, q_bonus: $.data.bundle_bonus_bp, q_cur: $.data.current_rate_bp, q_cap: $.data.cap_applied } }
            - { call: "GET /deposit-accounts/${a_sav}/rate-quote", payload: {}, as: BranchBanker, captures: { q_sav_bonus: $.data.bundle_bonus_bp } }
          assert:
            - "enrollment qualifying_balance_cents == 12500000 (7,500,000 + 5,000,000, OPEN accounts in required classes)"
            - "MMA quote: base_rate_bp == 163, bundle_bonus_bp == 25"
            - "MMA quote: current_rate_bp == 180 and cap_applied == true (min(180 cap, 163 + 25) clamps)"
            - "SAV quote: bundle_bonus_bp == 0 (SAVINGS not in eligible_product_classes)"

      - name: interest_posting_sum_then_round_order
        grounds:
          - calculations.interest_posting
          - entities.DepositAccount.fields.unposted_accrual_milli
        distinguishing_aspect: |
          Mode (b): nested rounding order — pinned sum-then-round posts 3,397 cents for balance
          1,000,069 at 400 bp over 31 days; the rejected round-each-day reading would post 3,410.
        test_recipe:
          setup:
