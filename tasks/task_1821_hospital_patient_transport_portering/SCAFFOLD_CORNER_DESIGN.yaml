      - name: eligibility_error_trio_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "validations[priority=10]", "errors[ERR_ISOLATION_CAPABILITY_MISMATCH]", "errors[ERR_TRANSPORTER_INELIGIBLE]", "errors[ERR_NO_ELIGIBLE_TRANSPORTER]"]
        distinguishing_aspect: "Three distinct dispatch-eligibility failures in one fixture: isolation trip to a non-certified transporter yields the safety error even though the transporter is also OFF_SHIFT (priority 7 beats 10); wheelchair trip to a transporter lacking the equipment cert yields ERR_TRANSPORTER_INELIGIBLE; auto-select with every transporter OFF_SHIFT yields ERR_NO_ELIGIBLE_TRANSPORTER."
        test_recipe:
          setup:
            - "T1 and T2 both registered, both OFF_SHIFT, neither with certifications"
            - "R_ISO (CONTACT, PORTER_ONLY), R_EQ (WHEELCHAIR), R_AUTO (PORTER_ONLY) all QUEUED; edges HUB->W4 and W4->IMG exist; asset WC-001 AVAILABLE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P-ISO", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", isolation_precaution: "CONTACT" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r_iso: $.data.id, r_iso_v: $.data.version } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P-EQ", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r_eq: $.data.id, r_eq_v: $.data.version } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P-AUTO", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r_auto: $.data.id, r_auto_v: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r_iso}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r_iso_v}" }, as: TransportDispatcher, captures: { err1: $.data.error_id } }
            - { call: "POST /transport/requests/${r_eq}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r_eq_v}" }, as: TransportDispatcher, captures: { err2: $.data.error_id } }
            - { call: "POST /transport/requests/${r_auto}/offers", payload: { expected_request_version: "${r_auto_v}" }, as: TransportDispatcher, captures: { err3: $.data.error_id } }
          assert:
            - "isolation mismatch: ${err1} == ERR_ISOLATION_CAPABILITY_MISMATCH (safety priority 7 fires before the OFF_SHIFT eligibility failure at priority 10)"
            - "missing equipment cert: ${err2} == ERR_TRANSPORTER_INELIGIBLE"
            - "auto-select with no ON_SHIFT transporter: ${err3} == ERR_NO_ELIGIBLE_TRANSPORTER"

