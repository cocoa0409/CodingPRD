      - name: oral_notification_at_exact_deadline_is_not_late
        grounds:
          - calculations.incident_notification_deadlines
          - state_machines.IncidentReport.OPEN_to_NOTIFIED
          - entities.IncidentReport.fields.notification_late
        distinguishing_aspect: |
          Strict-inequality boundary on a timestamp instead of a count: an oral notification recorded at
          exactly oral_notification_deadline_at (2026-08-11T06:00:00Z, discovered_at plus 24 h) sets
          notification_late == false, because the comparison is a strict greater-than.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with 300 head and one lagoon"
            - "Logical clock advanced to 2026-08-10T06:00:00Z so the discharge can be discovered without being future dated"
            - "One DISCHARGE incident discovered 2026-08-10T06:00:00Z that released 1500 gallons and reached water, so requires_oral_notification is true"
            - "Logical clock then advanced to exactly 2026-08-11T06:00:00Z, the oral notification deadline"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
