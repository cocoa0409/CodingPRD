    input: [project_id, kind, cost_cents, valid_from, valid_until]
    output: License
    side_effects: ["status=RESERVED; billable_cents computed"]
  - method: GET
    path: "/studios/{studioId}/licenses/{licenseId}"
    description: "Get a License"
    roles: [StudioOps, BillingOps]
    code: 200
    input: []
