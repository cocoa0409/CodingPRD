            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Ledger Holder One", email: "l1@funds.test", shares_held: 120000, nda_on_file: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { l1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Ledger Holder Two", email: "l2@funds.test", shares_held: 20000, nda_on_file: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { l2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Ledger Holder Three", email: "l3@funds.test", shares_held: 5000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
