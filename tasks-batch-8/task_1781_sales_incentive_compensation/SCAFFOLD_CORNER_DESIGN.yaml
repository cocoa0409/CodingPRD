        distinguishing_aspect: "Export requires EVERY statement of the period to be APPROVED: a DRAFT statement blocks the export with ERR_STATEMENTS_NOT_APPROVED."
        test_recipe:
          setup: ["period 1 closed; statement still DRAFT (not approved)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PU" }, as: CompAdmin, captures: { ppu: $.data.id, pv_pu: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${ppu}", name: "Plan PU", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_pu: $.data.id } }
