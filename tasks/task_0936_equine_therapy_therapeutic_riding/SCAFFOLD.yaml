scenario: "936. Equine Therapy & Therapeutic Riding (PATH): rider intake & assessment, horse-rider match & session, volunteer (leader/sidewalker) scheduling, instructor certification, scholarship/grant & billing, progress & goal, safety/incident, program reporting"
domain_name: "equine-therapy-therapeutic-riding"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: "beyond-Expert (18 entities / 75 endpoints / 40 error codes / 44 ladder rungs / 17 status axes / 29 calculations / 3 OCC rules / 5 conservation invariants / depth-5 cascade)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Datetime / rendering conventions (binding on every generator downstream)
# ---------------------------------------------------------------------------
datetime_conventions:
  system_stamped_format: "YYYY-MM-DDTHH:MM:SS.mmmZ - exactly three fractional-second digits, always trailing Z. Applies to created_at, updated_at, reported_at, finalized_at, evaluated_at, superseded_at, revoked_at."
  client_supplied_echo: "Any client-supplied instant (scheduled_start, occurred_at, to_iso8601, release_at) is stored and echoed back BYTE-FOR-BYTE as received. The server MUST NOT normalise, re-render, add or strip fractional digits, or convert the offset."
  derived_instant_format: "Any instant the server DERIVES by arithmetic on a client-supplied date/instant (scheduled_end, expires_at, next_due_at, stale_after, report_due_at, hold_release_at, suspended_until) is rendered in system_stamped_format."
  date_only_format: "YYYY-MM-DD. Applies to signed_on, performed_on, completed_on, renewed_on, signed_off_on, period_start, period_end, on_date, date_of_birth, last_retraining_on. Stored and echoed byte-for-byte as received."
  date_to_instant_promotion: "When a date-only value takes part in instant arithmetic it is promoted to that calendar date at 00:00:00.000Z."
  clock_source: "Every 'now' in this scaffold means the logical clock (see POST /_clock/set_current_utc). The server MUST NEVER read wall-clock time for any business decision."

# ---------------------------------------------------------------------------
# Declared constants - every ALL_CAPS identifier used anywhere in the three
# scaffold files resolves either here or to an enum member declared in §1.1.
# ---------------------------------------------------------------------------
constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  MINUTES_PER_HOUR: 60
  SECONDS_PER_HOUR: 3600
  MONEY_ROUNDING_MODE: "round_half_up"
  MONEY_ROUNDING_UNIT: "whole cents"
  HOURS_ROUNDING_DECIMALS: 2
  WEIGHT_ROUNDING_DECIMALS: 2
  WEEK_START_DAY: "MONDAY"

  RELEASE_VALIDITY_DAYS: 365
  REASSESSMENT_INTERVAL_DAYS: 365
  REASSESSMENT_DUE_WARNING_DAYS: 30

  MAX_HORSE_LOAD_FRACTION: 0.20
  BACKRIDER_WEIGHT_LB: 140.0
  HORSE_MAX_SESSIONS_PER_DAY: 3
  HORSE_MAX_MOUNTED_MINUTES_PER_DAY: 150
  HORSE_MAX_MOUNTED_MINUTES_PER_WEEK: 240
  HORSE_REST_INTERVAL_MINUTES: 15
  HORSE_POST_INCIDENT_REST_DAYS: 3

  SESSION_MIN_DURATION_MINUTES: 30
  SESSION_MAX_DURATION_MINUTES: 90

  SIDEWALKER_MIN_AGE: 14
  LEADER_MIN_AGE: 16
  BARN_MIN_AGE: 12
  QUALIFICATION_MIN_TRAINING_HOURS_SIDEWALKER: 6
  QUALIFICATION_MIN_TRAINING_HOURS_LEADER: 12
  QUALIFICATION_MIN_TRAINING_HOURS_BARN: 3
  QUALIFICATION_VALIDITY_DAYS: 365
  VOLUNTEER_RETRAINING_INTERVAL_DAYS: 365
  VOLUNTEER_SUSPENSION_DAYS_SEV_1: 30

  CERT_VALIDITY_DAYS: 730
  CERT_GRACE_DAYS: 60
  CERT_RENEWAL_CE_HOURS: 20

  LATE_CANCELLATION_WINDOW_HOURS: 24
  LATE_CANCELLATION_FEE_PCT: 0.50
  NO_SHOW_FEE_PCT: 1.00

  GOAL_MET_CONSECUTIVE_HITS: 2
  GOAL_STALE_AFTER_DAYS: 90
  GOAL_MIN_RATING: 1
  GOAL_MAX_RATING: 5

  SCHOLARSHIP_MAX_CAP_PCT: 0.90
  ASSESSMENT_MIN_SCORE: 0
  ASSESSMENT_MAX_SCORE: 10

  # --- declared lookup tables (each is a mapping constant, not prose) ---
  BASE_RATE_CENTS_PER_MINUTE:
    THERAPEUTIC_RIDING: 150
    HIPPOTHERAPY: 260
    EQUINE_LEARNING: 120
    VAULTING: 180

  SLIDING_SCALE_PCT:
    BAND_A: 0.60
    BAND_B: 0.40
    BAND_C: 0.20
    BAND_D: 0.00

  INSTRUCTOR_TIER_ORDINAL:
    IN_TRAINING: 0
    REGISTERED: 1
    ADVANCED: 2
    MASTER: 3

  INDEPENDENCE_LEVEL_BANDS:
    LEVEL_4: "combined_score >= 17"
    LEVEL_3: "12 <= combined_score <= 16"
    LEVEL_2: "7 <= combined_score <= 11"
    LEVEL_1: "combined_score <= 6"

  INDEPENDENCE_CREW_MATRIX:
    LEVEL_1: { required_sidewalker_count: 2, requires_leader: true, sidewalker_hold_type: "OVER_THE_THIGH" }
    LEVEL_2: { required_sidewalker_count: 2, requires_leader: true, sidewalker_hold_type: "THIGH_HOLD" }
    LEVEL_3: { required_sidewalker_count: 1, requires_leader: true, sidewalker_hold_type: "ARM_OVER_THIGH" }
    LEVEL_4: { required_sidewalker_count: 0, requires_leader: false, sidewalker_hold_type: "NO_CONTACT" }

  CREW_ROLE_MIN_AGE:
    LEADER: 16
    SIDEWALKER: 14
    BARN: 12

  CREW_ROLE_MIN_TRAINING_HOURS:
    LEADER: 12
    SIDEWALKER: 6
    BARN: 3

  INCIDENT_SEVERITY_MATRIX:
    - { incident_type: "FALL", injury_reported: true, severity: "SEV_1" }
    - { incident_type: "FALL", injury_reported: false, severity: "SEV_2" }
    - { incident_type: "MEDICAL_EVENT", injury_reported: true, severity: "SEV_1" }
    - { incident_type: "MEDICAL_EVENT", injury_reported: false, severity: "SEV_1" }
    - { incident_type: "LOOSE_HORSE", injury_reported: true, severity: "SEV_1" }
    - { incident_type: "LOOSE_HORSE", injury_reported: false, severity: "SEV_2" }
    - { incident_type: "EQUIPMENT_FAILURE", injury_reported: true, severity: "SEV_2" }
    - { incident_type: "EQUIPMENT_FAILURE", injury_reported: false, severity: "SEV_3" }
    - { incident_type: "NEAR_MISS", injury_reported: true, severity: "SEV_3" }
    - { incident_type: "NEAR_MISS", injury_reported: false, severity: "SEV_3" }

  INCIDENT_REPORT_DEADLINE_HOURS:
    SEV_1: 24
    SEV_2: 48
    SEV_3: 72

  INCIDENT_HOLD_MATRIX:
    SEV_1: { rider_medical_hold: true, horse_rest_hold: true, volunteer_suspension: true, instructor_suspension: true }
    SEV_2: { rider_medical_hold: false, horse_rest_hold: true, volunteer_suspension: true, instructor_suspension: false }
    SEV_3: { rider_medical_hold: false, horse_rest_hold: false, volunteer_suspension: false, instructor_suspension: false }

  FUNDING_WATERFALL_ORDER:
    - { sequence_index: 1, source_type: "GRANT" }
    - { sequence_index: 2, source_type: "SCHOLARSHIP" }
    - { sequence_index: 3, source_type: "SLIDING_SCALE" }
    - { sequence_index: 4, source_type: "PAYER" }
    - { sequence_index: 5, source_type: "PRIVATE_PAY" }

  FUNDING_SOURCES_BY_CHARGE_TYPE:
    SESSION_FEE: ["GRANT", "SCHOLARSHIP", "SLIDING_SCALE", "PAYER", "PRIVATE_PAY"]
    LATE_CANCELLATION_FEE: ["SLIDING_SCALE", "PAYER", "PRIVATE_PAY"]
    NO_SHOW_FEE: ["SLIDING_SCALE", "PAYER", "PRIVATE_PAY"]

  # Input-only enum member sets. These fields are named in ENUM_ERROR_FIELD_LIST
  # but their accepted INPUT members differ from the stored/derived member set,
  # so both are pinned here explicitly.
  CANCELLATION_REASON_INPUT_MEMBERS: ["RIDER_REQUEST", "WEATHER", "HORSE_PULLED", "PROGRAM_CLOSURE"]
  CANCELLATION_REASON_STORED_MEMBERS: ["EARLY_RIDER", "LATE_RIDER", "WEATHER", "HORSE_PULLED", "PROGRAM_CLOSURE", "RIDER_HOLD", "NO_SHOW"]

  HOLD_TYPE_MEMBERS_BY_ENDPOINT:
    "POST /horses/{horse_id}/hold": ["VET_HOLD", "FARRIER_HOLD"]
    "POST /sessions/{session_id}/crew-assignments": ["NO_CONTACT", "ARM_OVER_THIGH", "THIGH_HOLD", "OVER_THE_THIGH", "ANKLE_HOLD"]

  VARIANT_MEMBERS_BY_ENDPOINT:
    "GET /sessions/{session_id}/eligibility": ["current_declared", "at_assessment", "at_booking_instant", "at_ride_instant"]
    "GET /horses/{horse_id}/workload": ["committed", "delivered"]
    "GET /volunteers/{volunteer_id}/service-hours": ["scheduled", "delivered"]

  VARIANT_DEFAULTS_BY_ENDPOINT:
    "GET /sessions/{session_id}/eligibility": "current_declared"
    "GET /horses/{horse_id}/workload": "committed"
    "GET /volunteers/{volunteer_id}/service-hours": "no default - variant is a required input on this endpoint"

  LITERAL_REASON_STRINGS:
    HORSE_HOLD_REASON_INCIDENT: "INCIDENT_REST_HOLD"
    HORSE_HOLD_REASON_MANUAL: "MANUAL"
    CREW_RELEASE_REASON_CASCADE: "SESSION_CANCELLED"
    VOLUNTEER_SUSPENSION_REASON_SEV_1: "INCIDENT_SEV_1"
    VOLUNTEER_SUSPENSION_REASON_SEV_2: "INCIDENT_SEV_2"
    OPEN_ENDED_SUSPENSION_INSTANT: "9999-12-31T00:00:00.000Z"

  ENUM_ERROR_FIELD_LIST:
    - household_income_band
    - demographic_group
    - program_code
    - funding_mode
    - activity_type
    - assessment_type
    - tier
    - min_instructor_tier
    - certification_level
    - crew_role
    - hold_type
    - incident_type
    - cancellation_reason
    - domain
    - restricted_program_code
    - restricted_demographic
    - variant

# ---------------------------------------------------------------------------
# Ordered global write gates. Downstream generators MUST NOT reorder these.
# Each gate is individually observable with every earlier gate passing.
# ---------------------------------------------------------------------------
gate_precedence:
  - order: 1
    gate_id: incident_hold_gate
    ladder_priority: 14
    error_id: ERR_INCIDENT_HOLD_ACTIVE
    fires_when: "Any Rider / Horse / Volunteer / Instructor referenced by the write carries an active hold placed by an Incident whose status is OPEN or UNDER_REVIEW."
    observable_with_all_earlier_passing: "No earlier gate exists; reached with a SEV_1 incident open on the rider."
  - order: 2
    gate_id: finalized_period_gate
    ladder_priority: 15
    error_id: ERR_REPORT_FINALIZED
    fires_when: "The write would create or newly complete billable work whose session date falls inside the [period_start, period_end] of a PeriodReport with status FINALIZED, or would create a PeriodReport whose period overlaps a FINALIZED one."
    observable_with_all_earlier_passing: "No open incident; finalize a report covering 2026-05-01..2026-05-31 and then POST /sessions dated inside it."
  - order: 3
    gate_id: horse_operational_hold_gate
    ladder_priority: 16
    error_id: ERR_HORSE_ON_HOLD
    fires_when: "Horse.status is VET_HOLD, FARRIER_HOLD or REST_HOLD at the evaluation instant."
    observable_with_all_earlier_passing: "No incident, no finalized period; place a FARRIER_HOLD via POST /horses/{horse_id}/hold."
  - order: 4
    gate_id: instructor_certification_gate
    ladder_priority: 17
    error_id: ERR_INSTRUCTOR_CERT_LAPSED
    fires_when: "The instructor of record (or, when supervision is required, the supervising instructor) has certification_status LAPSED or SUSPENDED at the evaluation instant, or has GRACE on an endpoint that requires CURRENT."
    observable_with_all_earlier_passing: "Horse AVAILABLE, no incident, no finalized period; advance the clock past certification_expires_at + CERT_GRACE_DAYS."
  - order: 5
    gate_id: medical_release_gate
    ladder_priority: 18
    error_id: "ERR_RELEASE_MISSING | ERR_RELEASE_EXPIRED"
    fires_when: "The rider has no MedicalRelease with status ACTIVE at the evaluation instant (missing), or the most recent release has status EXPIRED / REVOKED (expired)."
    observable_with_all_earlier_passing: "Instructor CURRENT, horse AVAILABLE, no incident, no finalized period; advance the clock past signed_on + RELEASE_VALIDITY_DAYS while a fresh Assessment keeps assessment_status CURRENT."

# ===========================================================================
# 1.1 Entity-Relationship Table (18 entities)
# ===========================================================================
entities:
  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Participant name."
      - name: date_of_birth
        type: string
        source: input
        description: "Date-only, YYYY-MM-DD."
      - name: weight_lb
        type: number
        source: input
        description: "Currently declared rider weight in pounds; mutable via PATCH /riders/{rider_id}."
        constraints: "> 0 and <= 400"
      - name: household_income_band
        type: enum
        source: input
        description: "Sliding-scale band; keys SLIDING_SCALE_PCT."
        constraints: "one of BAND_A, BAND_B, BAND_C, BAND_D"
      - name: demographic_group
        type: enum
        source: input
        description: "Reported demographic; matched against Grant.restricted_demographic."
        constraints: "one of VETERAN, YOUTH, ADULT, SENIOR"
      - name: program_code
        type: enum
        source: input
        description: "Program the rider is enrolled in; matched against Grant.restricted_program_code."
        constraints: "one of THERAPEUTIC_RIDING, HIPPOTHERAPY, EQUINE_LEARNING, VAULTING"
      - name: funding_mode
        type: enum
        source: input
        description: "PRIVATE_PAY_ALLOWED lets an uncovered remainder land on the rider; FUNDED_ONLY forbids it and makes completion fail with ERR_FUNDS_EXHAUSTED."
        default: "PRIVATE_PAY_ALLOWED"
        constraints: "one of PRIVATE_PAY_ALLOWED, FUNDED_ONLY"
      - name: payer_rate_cents
        type: integer
        source: input
        description: "Per-charge insurance/payer contribution ceiling in cents; step 4 of the funding waterfall."
        default: 0
        constraints: ">= 0"
      - name: condition_codes
        type: array
        source: input
        description: "Array of diagnosis/condition code strings; each is looked up in ConditionPolicy together with the session activity_type."
      - name: status
        type: enum
        source: system
        description: "Lifecycle axis. Parallel to assessment_status."
        default: "INTAKE"
        constraints: "one of INTAKE, ACTIVE, MEDICAL_HOLD, WITHDRAWN"
      - name: medical_hold_incident_id
        type: string
        source: system
        description: "FK -> Incident.id; set when an incident places a rider medical hold, cleared on hold release. Null when no hold."
      - name: withdraw_reason
        type: string
        source: system
        description: "Reason captured by POST /riders/{rider_id}/withdraw; null otherwise."
      - name: independence_level
        type: enum
        source: computed
        description: "Copied from the latest Assessment with status RECORDED; null before the first assessment."
        constraints: "one of LEVEL_1, LEVEL_2, LEVEL_3, LEVEL_4"
      - name: required_sidewalker_count
        type: integer
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX[independence_level].required_sidewalker_count; null before the first assessment."
      - name: requires_leader
        type: boolean
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX[independence_level].requires_leader; null before the first assessment."
      - name: sidewalker_hold_type
        type: enum
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX[independence_level].sidewalker_hold_type."
        constraints: "one of NO_CONTACT, ARM_OVER_THIGH, THIGH_HOLD, OVER_THE_THIGH, ANKLE_HOLD"
      - name: backriding_required
        type: boolean
        source: computed
        description: "Copied from the latest RECORDED Assessment; adds BACKRIDER_WEIGHT_LB to effective load."
        default: false
      - name: assessment_next_due_at
        type: datetime
        source: computed
        description: "latest RECORDED Assessment.performed_on + REASSESSMENT_INTERVAL_DAYS; null before the first assessment."
      - name: assessment_status
        type: enum
        source: computed
        description: "Second, independent status axis derived from the logical clock vs assessment_next_due_at."
        constraints: "one of NEVER_ASSESSED, CURRENT, DUE, OVERDUE"
      - name: active_release_id
        type: string
        source: computed
        description: "FK -> MedicalRelease.id; the rider's most recent MedicalRelease whose derived status is ACTIVE at the logical clock, else null."
      - name: goals_met_count
        type: integer
        source: computed
        description: "Count of this rider's Goals with status MET."
        default: 0

  - name: ConditionPolicy
    parent: null
    common_fields: false
    fields:
      - name: condition_code
        type: string
        source: input
        description: "Diagnosis / condition code this row governs."
      - name: activity_type
        type: enum
        source: input
        description: "Activity the row governs; admissibility is a function of the PAIR, not of the code alone."
        constraints: "one of THERAPEUTIC_RIDING, HIPPOTHERAPY, EQUINE_LEARNING, VAULTING"
      - name: tier
        type: enum
        source: input
        description: "CONTRAINDICATION bars participation outright; PRECAUTION requires a physician clearance plus an instructor-tier escalation; CLEAR imposes nothing."
        constraints: "one of CONTRAINDICATION, PRECAUTION, CLEAR"
      - name: min_instructor_tier
        type: enum
        source: input
        description: "Minimum instructor certification level required to run this pair; compared through INSTRUCTOR_TIER_ORDINAL."
        default: "REGISTERED"
        constraints: "one of IN_TRAINING, REGISTERED, ADVANCED, MASTER"

  - name: MedicalRelease
    parent: Rider
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: system
        description: "FK -> Rider.id; taken from the path, never from the body."
      - name: signed_on
        type: string
        source: input
        description: "Date-only YYYY-MM-DD on which the physician signed."
      - name: physician_name
        type: string
        source: input
        description: "Signing physician."
      - name: cleared_condition_codes
        type: array
        source: input
        description: "Condition codes this release explicitly clears; a PRECAUTION-tier code participates only if listed here."
      - name: expires_at
        type: datetime
        source: computed
        description: "signed_on promoted to 00:00:00.000Z plus RELEASE_VALIDITY_DAYS days."
      - name: revoked_at
        type: datetime
        source: system
        description: "Set by POST /medical-releases/{release_id}/revoke; null otherwise."
      - name: superseded_at
        type: datetime
        source: system
        description: "Set when a later release is filed for the same rider; null otherwise."
      - name: status
        type: enum
        source: computed
        description: "Precedence, evaluated in this exact order: REVOKED if revoked_at is set; else SUPERSEDED if superseded_at is set; else EXPIRED if clock >= expires_at; else ACTIVE."
        constraints: "one of ACTIVE, EXPIRED, REVOKED, SUPERSEDED"

  - name: Assessment
    parent: Rider
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: system
        description: "FK -> Rider.id; taken from the path."
      - name: assessment_type
        type: enum
        source: input
        description: "INTAKE for the first assessment, ANNUAL_REASSESSMENT afterwards."
        constraints: "one of INTAKE, ANNUAL_REASSESSMENT"
      - name: performed_on
        type: string
        source: input
        description: "Date-only YYYY-MM-DD."
      - name: balance_score
        type: integer
        source: input
        description: "Seated-balance score."
        constraints: "ASSESSMENT_MIN_SCORE..ASSESSMENT_MAX_SCORE inclusive"
      - name: trunk_control_score
        type: integer
        source: input
        description: "Trunk-control score."
        constraints: "ASSESSMENT_MIN_SCORE..ASSESSMENT_MAX_SCORE inclusive"
      - name: rider_weight_lb
        type: number
        source: input
        description: "Rider weight measured AT the assessment; the at_assessment variant of effective load reads this field."
      - name: backriding_required
        type: boolean
        source: input
        description: "True when the rider needs a backrider, adding BACKRIDER_WEIGHT_LB to effective load."
      - name: combined_score
        type: integer
        source: computed
        description: "balance_score + trunk_control_score."
      - name: independence_level
        type: enum
        source: computed
        description: "INDEPENDENCE_LEVEL_BANDS applied to combined_score."
        constraints: "one of LEVEL_1, LEVEL_2, LEVEL_3, LEVEL_4"
      - name: required_sidewalker_count
        type: integer
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX lookup."
      - name: requires_leader
        type: boolean
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX lookup."
      - name: sidewalker_hold_type
        type: enum
        source: computed
        description: "INDEPENDENCE_CREW_MATRIX lookup."
        constraints: "one of NO_CONTACT, ARM_OVER_THIGH, THIGH_HOLD, OVER_THE_THIGH, ANKLE_HOLD"
      - name: next_due_at
        type: datetime
        source: computed
        description: "performed_on promoted to 00:00:00.000Z plus REASSESSMENT_INTERVAL_DAYS days."
      - name: status
        type: enum
        source: system
        description: "RECORDED until a later assessment for the same rider is filed, then SUPERSEDED."
        default: "RECORDED"
        constraints: "one of RECORDED, SUPERSEDED"

  - name: Horse
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Horse name."
      - name: body_weight_lb
        type: number
        source: input
        description: "Horse body weight in pounds."
        constraints: "> 0"
      - name: tack_weight_lb
        type: number
        source: input
        description: "Weight of the tack carried on every session, added to every effective-load computation."
        constraints: ">= 0"
      - name: max_load_lb
        type: number
        source: computed
        description: "round(body_weight_lb * MAX_HORSE_LOAD_FRACTION, WEIGHT_ROUNDING_DECIMALS)."
      - name: status
        type: enum
        source: system
        description: "Operational availability axis."
        default: "AVAILABLE"
        constraints: "one of AVAILABLE, VET_HOLD, FARRIER_HOLD, REST_HOLD"
      - name: hold_release_at
        type: datetime
        source: system
        description: "Instant at which the current hold may be released; null when status is AVAILABLE."
      - name: hold_reason
        type: string
        source: system
        description: "Free-text reason for the current hold; the incident cascade writes the literal string INCIDENT_REST_HOLD, a manual hold writes MANUAL. Null when status is AVAILABLE."
      - name: current_week_start_date
        type: string
        source: computed
        description: "Date-only YYYY-MM-DD of the WEEK_START_DAY on or before the logical clock date."
      - name: current_week_committed_minutes
        type: integer
        source: computed
        description: "committed variant of horse_workload_minutes over the week containing the logical clock date."
        default: 0
      - name: current_day_committed_minutes
        type: integer
        source: computed
        description: "committed variant of horse_workload_minutes over the logical clock date."
        default: 0
      - name: current_day_session_count
        type: integer
        source: computed
        description: "Count of this horse's Sessions with schedule_status in {CREW_PENDING, CONFIRMED, COMPLETED} whose scheduled_start date equals the logical clock date."
        default: 0

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer name."
      - name: date_of_birth
        type: string
        source: input
        description: "Date-only YYYY-MM-DD; drives age_years and the per-role minimum-age gate."
      - name: last_retraining_on
        type: string
        source: input
        description: "Date-only YYYY-MM-DD of the most recent annual re-training."
      - name: age_years
        type: integer
        source: computed
        description: "Whole completed years between date_of_birth and the logical clock date."
      - name: retraining_due_at
        type: datetime
        source: computed
        description: "last_retraining_on promoted to 00:00:00.000Z plus VOLUNTEER_RETRAINING_INTERVAL_DAYS days."
      - name: suspended_until
        type: datetime
        source: system
        description: "Instant until which the volunteer is suspended; null when never suspended or already lifted."
      - name: suspension_reason
        type: string
        source: system
        description: "INCIDENT_SEV_1, INCIDENT_SEV_2 or null."
      - name: status
        type: enum
        source: computed
        description: "Precedence, evaluated in this exact order: SUSPENDED if suspended_until is set and clock < suspended_until; else INACTIVE if clock >= retraining_due_at; else ACTIVE."
        constraints: "one of ACTIVE, SUSPENDED, INACTIVE"
      - name: open_assignment_count
        type: integer
        source: computed
        description: "Count of this volunteer's CrewAssignments with status ASSIGNED on Sessions whose schedule_status is CREW_PENDING or CONFIRMED."
        default: 0

  - name: VolunteerQualification
    parent: Volunteer
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: system
        description: "FK -> Volunteer.id; taken from the path."
      - name: crew_role
        type: enum
        source: input
        description: "Role this qualification grants. A SIDEWALKER qualification never authorises leading."
        constraints: "one of LEADER, SIDEWALKER, BARN"
      - name: training_hours
        type: number
        source: input
        description: "Logged training hours; must reach CREW_ROLE_MIN_TRAINING_HOURS[crew_role] before sign-off."
        constraints: ">= 0"
      - name: signed_off_on
        type: string
        source: system
        description: "Date-only YYYY-MM-DD of the competency sign-off; null while IN_TRAINING."
      - name: expires_at
        type: datetime
        source: computed
        description: "signed_off_on promoted to 00:00:00.000Z plus QUALIFICATION_VALIDITY_DAYS days; null while IN_TRAINING."
      - name: status
        type: enum
        source: computed
        description: "Precedence, evaluated in this exact order: SUSPENDED if the owning Volunteer.status is SUSPENDED; else IN_TRAINING if signed_off_on is null; else EXPIRED if clock >= expires_at; else QUALIFIED."
        constraints: "one of IN_TRAINING, QUALIFIED, EXPIRED, SUSPENDED"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Instructor name."
      - name: certification_level
        type: enum
        source: input
        description: "PATH certification tier; compared through INSTRUCTOR_TIER_ORDINAL against ConditionPolicy.min_instructor_tier."
        constraints: "one of IN_TRAINING, REGISTERED, ADVANCED, MASTER"
      - name: certification_expires_at
        type: datetime
        source: input
        description: "Client-supplied instant at which the current certification cycle ends; echoed byte-for-byte."
      - name: supervisor_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the supervising instructor for an IN_TRAINING instructor. Required when certification_level is IN_TRAINING, otherwise must be omitted or null."
      - name: ce_hours_accrued
        type: number
        source: system
        description: "Continuing-education hours accrued since the last renewal; reset to 0 on renewal."
        default: 0
      - name: suspended_until
        type: datetime
        source: system
        description: "Instant until which the instructor is suspended by an incident; null when not suspended."
      - name: certification_status
        type: enum
        source: computed
        description: "Precedence, evaluated in this exact order: SUSPENDED if suspended_until is set and clock < suspended_until; else CURRENT if clock < certification_expires_at; else GRACE if clock < certification_expires_at + CERT_GRACE_DAYS days; else LAPSED."
        constraints: "one of CURRENT, GRACE, LAPSED, SUSPENDED"

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK -> Rider.id"
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the instructor of record."
      - name: supervising_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; required when the instructor of record has certification_level IN_TRAINING, otherwise must be omitted or null."
      - name: activity_type
        type: enum
        source: input
        description: "Activity delivered; keys BASE_RATE_CENTS_PER_MINUTE and the ConditionPolicy lookup."
        constraints: "one of THERAPEUTIC_RIDING, HIPPOTHERAPY, EQUINE_LEARNING, VAULTING"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Client-supplied ride start instant; echoed byte-for-byte."
      - name: duration_minutes
        type: integer
        source: input
        description: "Scheduled duration; the committed workload variant and the quoted fee both read this field."
        constraints: "SESSION_MIN_DURATION_MINUTES..SESSION_MAX_DURATION_MINUTES inclusive"
      - name: scheduled_end
        type: datetime
        source: computed
        description: "scheduled_start plus duration_minutes, rendered in system_stamped_format."
      - name: mounted_minutes
        type: integer
        source: system
        description: "Actually-mounted minutes supplied at completion; null until COMPLETED."
      - name: schedule_status
        type: enum
        source: system
        description: "Scheduling axis, independent of billing_status."
        default: "CREW_PENDING"
        constraints: "one of CREW_PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW"
      - name: billing_status
        type: enum
        source: system
        description: "Billing axis, independent of schedule_status. Compound over this session's Charges."
        default: "UNBILLED"
        constraints: "one of UNBILLED, CHARGED, FUNDED, REVERSED"
      - name: cancellation_reason
        type: enum
        source: system
        description: "Reason class DERIVED at cancellation from the client-supplied reason and the notice window; null while not cancelled."
        constraints: "one of EARLY_RIDER, LATE_RIDER, WEATHER, HORSE_PULLED, PROGRAM_CLOSURE, RIDER_HOLD, NO_SHOW"
      - name: crew_satisfied
        type: boolean
        source: computed
        description: "True when the count of ASSIGNED SIDEWALKER CrewAssignments equals Rider.required_sidewalker_count AND the count of ASSIGNED LEADER CrewAssignments equals 1 if Rider.requires_leader else 0."
        default: false
      - name: effective_load_lb
        type: number
        source: computed
        description: "current_declared variant of effective_load_lb, recomputed on every read."
      - name: precaution_tier
        type: enum
        source: computed
        description: "Worst ConditionPolicy tier across Rider.condition_codes for this activity_type after removing codes cleared by the rider's ACTIVE MedicalRelease."
        constraints: "one of CLEAR, PRECAUTION, CONTRAINDICATION"
      - name: required_instructor_tier
        type: enum
        source: computed
        description: "Highest ConditionPolicy.min_instructor_tier across the rider's PRECAUTION-tier codes for this activity_type, floored at REGISTERED."
        constraints: "one of IN_TRAINING, REGISTERED, ADVANCED, MASTER"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "duration_minutes * BASE_RATE_CENTS_PER_MINUTE[activity_type]."
      - name: service_hours
        type: number
        source: computed
        description: "round(mounted_minutes / MINUTES_PER_HOUR, HOURS_ROUNDING_DECIMALS); 0 until COMPLETED."
        default: 0

  - name: CrewAssignment
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> Session.id; taken from the path."
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id"
      - name: crew_role
        type: enum
        source: input
        description: "Role served on this session. BARN is never a session crew role and is rejected here."
        constraints: "one of LEADER, SIDEWALKER"
      - name: hold_type
        type: enum
        source: input
        description: "Sidewalker hold; must equal Rider.sidewalker_hold_type. Must be omitted or null when crew_role is LEADER."
        constraints: "one of NO_CONTACT, ARM_OVER_THIGH, THIGH_HOLD, OVER_THE_THIGH, ANKLE_HOLD"
      - name: status
        type: enum
        source: system
        description: "ASSIGNED until released by the coordinator or by a cascade."
        default: "ASSIGNED"
        constraints: "one of ASSIGNED, RELEASED"
      - name: release_reason
        type: string
        source: system
        description: "Reason recorded at release; the cascade writes the literal string SESSION_CANCELLED."

  - name: Goal
    parent: Rider
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: system
        description: "FK -> Rider.id; taken from the path."
      - name: domain
        type: enum
        source: input
        description: "Goal domain."
        constraints: "one of PHYSICAL, COGNITIVE, SOCIAL_EMOTIONAL, BEHAVIORAL, EDUCATIONAL"
      - name: objective
        type: string
        source: input
        description: "Measurable objective statement."
      - name: baseline_rating
        type: integer
        source: input
        description: "Rating recorded at goal creation."
        constraints: "GOAL_MIN_RATING..GOAL_MAX_RATING inclusive"
      - name: target_rating
        type: integer
        source: input
        description: "Rating that counts as a hit; must be strictly greater than baseline_rating."
        constraints: "GOAL_MIN_RATING..GOAL_MAX_RATING inclusive"
      - name: current_rating
        type: integer
        source: system
        description: "Rating from the most recently FINALIZED ProgressNote that rated this goal; null until first rated."
      - name: consecutive_target_hits
        type: integer
        source: system
        description: "Incremented when a finalizing note rates this goal >= target_rating, reset to 0 when it rates below."
        default: 0
      - name: last_rated_at
        type: datetime
        source: system
        description: "Logical clock at the finalize of the most recent note rating this goal; null until first rated."
      - name: stale_after
        type: datetime
        source: computed
        description: "(last_rated_at if set else created_at) plus GOAL_STALE_AFTER_DAYS days."
      - name: status
        type: enum
        source: system
        description: "Persisted lifecycle. ACTIVE <-> MET and ACTIVE <-> STALE are both reversible; DISCONTINUED is terminal."
        default: "ACTIVE"
        constraints: "one of ACTIVE, MET, STALE, DISCONTINUED"
      - name: discontinue_reason
        type: string
        source: system
        description: "Reason captured at discontinue; null otherwise."

  - name: ProgressNote
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> Session.id; taken from the path."
      - name: rider_id
        type: string
        source: system
        description: "FK -> Rider.id; copied from the session at creation."
      - name: author_instructor_id
        type: string
        source: system
        description: "FK -> Instructor.id; the X-User-ID of the authoring Instructor. Only this instructor may finalize the note."
      - name: narrative
        type: string
        source: input
        description: "Free-text session narrative."
      - name: goal_ratings
        type: array
        source: input
        description: "Array of objects, each with keys goal_id (string) and rating (integer GOAL_MIN_RATING..GOAL_MAX_RATING). Every goal_id must belong to this session's rider and must not be DISCONTINUED."
      - name: status
        type: enum
        source: system
        description: "DRAFT until finalized; AMENDED when the covering PeriodReport was already FINALIZED at finalize time."
        default: "DRAFT"
        constraints: "one of DRAFT, FINALIZED, AMENDED"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical clock at finalize; null while DRAFT."
      - name: recorded_service_hours
        type: number
        source: computed
        description: "Copy of the parent Session.service_hours at finalize; 0 while DRAFT."
        default: 0

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - name: grant_name
        type: string
        source: input
        description: "Grant name."
      - name: funder_name
        type: string
        source: input
        description: "Funder name."
      - name: awarded_amount_cents
        type: integer
        source: input
        description: "Total restricted money awarded, in cents."
        constraints: "> 0"
      - name: restricted_program_code
        type: enum
        source: input
        description: "When set, only riders whose program_code equals this value may draw on the grant."
        default: null
        constraints: "null or one of THERAPEUTIC_RIDING, HIPPOTHERAPY, EQUINE_LEARNING, VAULTING"
      - name: restricted_demographic
        type: enum
        source: input
        description: "When set, only riders whose demographic_group equals this value may draw on the grant."
        default: null
        constraints: "null or one of VETERAN, YOUTH, ADULT, SENIOR"
      - name: period_start
        type: string
        source: input
        description: "Date-only YYYY-MM-DD; grant fiscal period start, inclusive."
      - name: period_end
        type: string
        source: input
        description: "Date-only YYYY-MM-DD; grant fiscal period end, inclusive."
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: "Sum of FundingAllocation.amount_cents for this grant with status ALLOCATED."
        default: 0
      - name: remaining_amount_cents
        type: integer
        source: computed
        description: "awarded_amount_cents - allocated_amount_cents."
      - name: status
        type: enum
        source: computed
        description: "EXHAUSTED when remaining_amount_cents == 0, else OPEN."
        constraints: "one of OPEN, EXHAUSTED"

  - name: ScholarshipAward
    parent: Rider
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: system
        description: "FK -> Rider.id; taken from the path."
      - name: cap_pct
        type: number
        source: input
        description: "Percentage-of-fee cap applied to the GROSS charge amount."
        constraints: "> 0 and <= SCHOLARSHIP_MAX_CAP_PCT"
      - name: period_cap_cents
        type: integer
        source: input
        description: "Absolute ceiling on scholarship spend inside the award period."
        constraints: "> 0"
      - name: period_start
        type: string
        source: input
        description: "Date-only YYYY-MM-DD, inclusive."
      - name: period_end
        type: string
        source: input
        description: "Date-only YYYY-MM-DD, inclusive."
      - name: period_used_cents
        type: integer
        source: computed
        description: "Sum of FundingAllocation.amount_cents for this award with status ALLOCATED."
        default: 0
      - name: superseded_at
        type: datetime
        source: system
        description: "Set when a later award is filed for the same rider with an overlapping period; null otherwise."
      - name: status
        type: enum
        source: computed
        description: "Precedence, evaluated in this exact order: SUPERSEDED if superseded_at is set; else EXHAUSTED if period_used_cents >= period_cap_cents; else ACTIVE."
        constraints: "one of ACTIVE, EXHAUSTED, SUPERSEDED"

  - name: Charge
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> Session.id; the session the charge arises from."
      - name: charge_type
        type: enum
        source: system
        description: "SESSION_FEE on completion, LATE_CANCELLATION_FEE on a late rider cancellation, NO_SHOW_FEE on a no-show."
        constraints: "one of SESSION_FEE, LATE_CANCELLATION_FEE, NO_SHOW_FEE"
      - name: amount_cents
        type: integer
        source: computed
        description: "Gross charge amount before any funding is applied."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of this charge's FundingAllocation.amount_cents with status ALLOCATED. Equals amount_cents while the charge is not REVERSED."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Amount on the PRIVATE_PAY allocation line; 0 when no remainder survives the waterfall, and 0 after reversal."
        default: 0
      - name: scholarship_excluded
        type: boolean
        source: computed
        description: "True when charge_type is not SESSION_FEE, meaning GRANT and SCHOLARSHIP were skipped by FUNDING_SOURCES_BY_CHARGE_TYPE."
        default: false
      - name: status
        type: enum
        source: computed
        description: "REVERSED once reversed_at is set; else FUNDED when balance_due_cents == 0; else PENDING."
        constraints: "one of PENDING, FUNDED, REVERSED"
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical clock at reversal; null otherwise."
      - name: reversal_reason
        type: string
        source: system
        description: "Reason captured at reversal; null otherwise."

  - name: FundingAllocation
    parent: Charge
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: system
        description: "FK -> Charge.id"
      - name: grant_id
        type: string
        source: system
        description: "FK -> Grant.id; set only when source_type is GRANT, else null."
      - name: scholarship_award_id
        type: string
        source: system
        description: "FK -> ScholarshipAward.id; set only when source_type is SCHOLARSHIP, else null."
      - name: source_type
        type: enum
        source: system
        description: "Waterfall bucket this line drew from."
        constraints: "one of GRANT, SCHOLARSHIP, SLIDING_SCALE, PAYER, PRIVATE_PAY"
      - name: sequence_index
        type: integer
        source: system
        description: "Position in FUNDING_WATERFALL_ORDER; lines are created in ascending sequence_index and, within GRANT, in the declared grant-selection order."
      - name: amount_cents
        type: integer
        source: computed
        description: "Cents drawn from this source; already rounded per MONEY_ROUNDING_MODE at line level."
      - name: status
        type: enum
        source: system
        description: "ALLOCATED until the owning charge is reversed."
        default: "ALLOCATED"
        constraints: "one of ALLOCATED, RELEASED"

  - name: Incident
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> Session.id; taken from the path."
      - name: implicated_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the volunteer implicated, when any. Null when no volunteer is implicated."
      - name: incident_type
        type: enum
        source: input
        description: "Incident class; keys INCIDENT_SEVERITY_MATRIX together with injury_reported."
        constraints: "one of FALL, LOOSE_HORSE, NEAR_MISS, EQUIPMENT_FAILURE, MEDICAL_EVENT"
      - name: injury_reported
        type: boolean
        source: input
        description: "Whether an injury was reported."
      - name: occurred_at
        type: datetime
        source: input
        description: "Client-supplied instant the incident occurred; echoed byte-for-byte."
      - name: narrative
        type: string
        source: input
        description: "Free-text description."
      - name: severity
        type: enum
        source: computed
        description: "INCIDENT_SEVERITY_MATRIX lookup on (incident_type, injury_reported)."
        constraints: "one of SEV_1, SEV_2, SEV_3"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical clock at creation."
      - name: report_due_at
        type: datetime
        source: computed
        description: "occurred_at plus INCIDENT_REPORT_DEADLINE_HOURS[severity] hours."
      - name: reported_late
        type: boolean
        source: computed
        description: "True when reported_at > report_due_at. Recorded, never rejected."
      - name: rider_hold_applied
        type: boolean
        source: computed
        description: "INCIDENT_HOLD_MATRIX[severity].rider_medical_hold."
      - name: horse_hold_applied
        type: boolean
        source: computed
        description: "INCIDENT_HOLD_MATRIX[severity].horse_rest_hold."
      - name: volunteer_suspension_applied
        type: boolean
        source: computed
        description: "INCIDENT_HOLD_MATRIX[severity].volunteer_suspension AND implicated_volunteer_id is not null."
      - name: instructor_suspension_applied
        type: boolean
        source: computed
        description: "INCIDENT_HOLD_MATRIX[severity].instructor_suspension."
      - name: cancelled_session_count
        type: integer
        source: system
        description: "Number of the rider's future sessions auto-cancelled by the hold cascade at creation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Review workflow axis."
        default: "OPEN"
        constraints: "one of OPEN, UNDER_REVIEW, CLOSED"
      - name: reviewer_notes
        type: string
        source: system
        description: "Notes captured at review; null until reviewed."
      - name: resolution
        type: string
        source: system
        description: "Resolution captured at close; null until closed."

  - name: PeriodReport
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: string
        source: input
        description: "Date-only YYYY-MM-DD, inclusive."
      - name: period_end
        type: string
        source: input
        description: "Date-only YYYY-MM-DD, inclusive; must be >= period_start."
      - name: status
        type: enum
        source: system
        description: "DRAFT recomputes live on read; FINALIZED freezes every aggregate."
        default: "DRAFT"
        constraints: "one of DRAFT, FINALIZED"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical clock at finalize; null while DRAFT."
      - name: total_service_hours
        type: number
        source: computed
        description: "Per-session round then sum; see calculation period_report_aggregation."
        default: 0
      - name: rider_count
        type: integer
        source: computed
        description: "Distinct riders with at least one COMPLETED session in the period."
        default: 0
      - name: veteran_rider_count
        type: integer
        source: computed
        description: "Of rider_count, those whose demographic_group is VETERAN."
        default: 0
      - name: volunteer_hours
        type: number
        source: computed
        description: "Delivered-variant crew hours across the period."
        default: 0
      - name: grant_utilization_cents
        type: integer
        source: computed
        description: "Sum of ALLOCATED GRANT allocation lines on in-period charges."
        default: 0
      - name: scholarship_spend_cents
        type: integer
        source: computed
        description: "Sum of ALLOCATED SCHOLARSHIP allocation lines on in-period charges."
        default: 0
      - name: private_pay_cents
        type: integer
        source: computed
        description: "Sum of ALLOCATED PRIVATE_PAY allocation lines on in-period charges."
        default: 0
      - name: total_charged_cents
        type: integer
        source: computed
        description: "Sum of Charge.amount_cents for non-REVERSED in-period charges."
        default: 0
      - name: amendment_count
        type: integer
        source: system
        description: "Number of post-finalization amendments routed to this report; always 0 while DRAFT."
        default: 0
      - name: amendment_net_cents
        type: integer
        source: system
        description: "Signed net money delta of post-finalization amendments; always 0 while DRAFT."
        default: 0

# ===========================================================================
# 1.2 State Machine Table (17 status axes on 13 entities; 13 non-linear:
# cycles, parallel axes on one entity, and branching fork/join)
# ===========================================================================
state_machines:
  - entity: Rider
    axis: status
    shape: "branching with revert (ACTIVE <-> MEDICAL_HOLD cycle)"
    initial_state: INTAKE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /riders/{rider_id}/activate"
        actor: IntakeCoordinator
        preconditions:
          - "Rider.status == INTAKE"
          - "At least one Assessment for this rider has status RECORDED"
          - "Rider.active_release_id is not null (a MedicalRelease with derived status ACTIVE exists at the logical clock)"
        side_effects:
          - "Rider.status := ACTIVE"
          - "increments Rider.version by 1"
      - from: ACTIVE
        to: MEDICAL_HOLD
        trigger: "system - side effect of POST /sessions/{session_id}/incidents when INCIDENT_HOLD_MATRIX[severity].rider_medical_hold is true"
        actor: system
        preconditions:
          - "Rider.status == ACTIVE"
        side_effects:
          - "Rider.status := MEDICAL_HOLD"
          - "Rider.medical_hold_incident_id := the new Incident.id"
          - "CASCADE HOP 2 of incident_hold_cascade: every Session of this rider with schedule_status in {CREW_PENDING, CONFIRMED} and scheduled_start > logical clock transitions to CANCELLED with cancellation_reason RIDER_HOLD and no fee"
          - "increments Rider.version by 1"
      - from: MEDICAL_HOLD
        to: ACTIVE
        trigger: "POST /riders/{rider_id}/medical-clearance"
        actor: ProgramAdmin
        preconditions:
          - "Rider.status == MEDICAL_HOLD"
          - "Rider.medical_hold_incident_id is null (the incident hold was released by POST /incidents/{incident_id}/close with release_rider_hold true)"
          - "The MedicalRelease named by medical_release_id belongs to this rider and has derived status ACTIVE"
        side_effects:
          - "Rider.status := ACTIVE"
          - "increments Rider.version by 1"
        note: "Closing the incident alone does NOT return the rider to ACTIVE; a fresh physician clearance is always required."
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /riders/{rider_id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Rider.status in {INTAKE, ACTIVE, MEDICAL_HOLD}"
          - "This rider has no Session with schedule_status in {CREW_PENDING, CONFIRMED}"
        side_effects:
          - "Rider.status := WITHDRAWN"
          - "Rider.withdraw_reason := reason"
          - "increments Rider.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /riders/{rider_id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Rider.status in {INTAKE, ACTIVE, MEDICAL_HOLD}"
          - "This rider has no Session with schedule_status in {CREW_PENDING, CONFIRMED}"
        side_effects:
          - "Rider.status := WITHDRAWN"
          - "Rider.withdraw_reason := reason"
          - "increments Rider.version by 1"
      - from: MEDICAL_HOLD
        to: WITHDRAWN
        trigger: "POST /riders/{rider_id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Rider.status in {INTAKE, ACTIVE, MEDICAL_HOLD}"
          - "This rider has no Session with schedule_status in {CREW_PENDING, CONFIRMED}"
        side_effects:
          - "Rider.status := WITHDRAWN"
          - "Rider.withdraw_reason := reason"
          - "increments Rider.version by 1"

  - entity: Rider
    axis: assessment_status
    shape: "parallel dimension - evolves independently of Rider.status; DERIVED, therefore deliberately non-monotone"
    initial_state: NEVER_ASSESSED
    terminal_states: []
    derived: true
    transitions:
      - from: NEVER_ASSESSED
        to: CURRENT
        trigger: "POST /riders/{rider_id}/assessments"
        actor: Instructor
        preconditions: ["Rider has no Assessment with status RECORDED yet"]
        side_effects:
          - "Rider.assessment_next_due_at := Assessment.next_due_at"
          - "Rider.independence_level, required_sidewalker_count, requires_leader, sidewalker_hold_type, backriding_required := the new assessment's values"
      - from: CURRENT
        to: DUE
        trigger: "system - logical clock reaches assessment_next_due_at minus REASSESSMENT_DUE_WARNING_DAYS days"
        actor: system
        preconditions: ["clock >= assessment_next_due_at - REASSESSMENT_DUE_WARNING_DAYS days AND clock < assessment_next_due_at"]
        side_effects: ["derived only - nothing persisted"]
      - from: DUE
        to: OVERDUE
        trigger: "system - logical clock reaches assessment_next_due_at"
        actor: system
        preconditions: ["clock >= assessment_next_due_at"]
        side_effects: ["derived only - nothing persisted; POST /sessions is now blocked with ERR_REASSESSMENT_OVERDUE"]
      - from: OVERDUE
        to: CURRENT
        trigger: "POST /riders/{rider_id}/assessments with assessment_type ANNUAL_REASSESSMENT"
        actor: Instructor
        preconditions: ["Rider has a prior Assessment with status RECORDED"]
        side_effects:
          - "prior Assessment.status := SUPERSEDED"
          - "Rider.assessment_next_due_at := new Assessment.next_due_at"
          - "Rider crew-requirement fields re-derived from the new assessment"
      - from: DUE
        to: CURRENT
        trigger: "POST /riders/{rider_id}/assessments with assessment_type ANNUAL_REASSESSMENT"
        actor: Instructor
        preconditions: ["Rider has a prior Assessment with status RECORDED"]
        side_effects:
          - "prior Assessment.status := SUPERSEDED"
          - "Rider.assessment_next_due_at := new Assessment.next_due_at"

  - entity: MedicalRelease
    axis: status
    shape: "branching - three divergent terminal outcomes from ACTIVE"
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    derived: true
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system - logical clock reaches expires_at"
        actor: system
        preconditions: ["clock >= expires_at AND revoked_at is null AND superseded_at is null"]
        side_effects: ["derived only; Rider.active_release_id becomes null unless a newer ACTIVE release exists"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /medical-releases/{release_id}/revoke"
        actor: ProgramAdmin
        preconditions: ["MedicalRelease.status == ACTIVE"]
        side_effects:
          - "MedicalRelease.revoked_at := logical clock"
          - "Rider.active_release_id re-derived"
          - "increments MedicalRelease.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system - side effect of POST /riders/{rider_id}/medical-releases filing a newer release for the same rider"
        actor: system
        preconditions: ["the prior release has status ACTIVE"]
        side_effects:
          - "prior MedicalRelease.superseded_at := logical clock"
          - "Rider.active_release_id := the new release id"

  - entity: Horse
    axis: status
    shape: "cyclic - AVAILABLE -> {VET_HOLD, FARRIER_HOLD, REST_HOLD} -> AVAILABLE"
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: VET_HOLD
        trigger: "POST /horses/{horse_id}/hold with hold_type VET_HOLD"
        actor: ProgramAdmin
        preconditions: ["Horse.status == AVAILABLE"]
        side_effects:
          - "Horse.status := VET_HOLD"
          - "Horse.hold_release_at := release_at"
          - "Horse.hold_reason := MANUAL"
          - "increments Horse.version by 1"
      - from: AVAILABLE
        to: FARRIER_HOLD
        trigger: "POST /horses/{horse_id}/hold with hold_type FARRIER_HOLD"
        actor: ProgramAdmin
        preconditions: ["Horse.status == AVAILABLE"]
        side_effects:
          - "Horse.status := FARRIER_HOLD"
          - "Horse.hold_release_at := release_at"
          - "Horse.hold_reason := MANUAL"
          - "increments Horse.version by 1"
      - from: AVAILABLE
        to: REST_HOLD
        trigger: "system - side effect of POST /sessions/{session_id}/incidents when INCIDENT_HOLD_MATRIX[severity].horse_rest_hold is true"
        actor: system
        preconditions: ["Horse.status == AVAILABLE"]
        side_effects:
          - "Horse.status := REST_HOLD"
          - "Horse.hold_release_at := Incident.occurred_at + HORSE_POST_INCIDENT_REST_DAYS days"
          - "Horse.hold_reason := INCIDENT_REST_HOLD"
          - "increments Horse.version by 1"
      - from: VET_HOLD
        to: AVAILABLE
        trigger: "POST /horses/{horse_id}/release-hold"
        actor: ProgramAdmin
        preconditions:
          - "Horse.status in {VET_HOLD, FARRIER_HOLD, REST_HOLD}"
          - "logical clock >= Horse.hold_release_at"
        side_effects:
          - "Horse.status := AVAILABLE"
          - "Horse.hold_release_at := null; Horse.hold_reason := null"
          - "increments Horse.version by 1"
      - from: FARRIER_HOLD
        to: AVAILABLE
        trigger: "POST /horses/{horse_id}/release-hold"
        actor: ProgramAdmin
        preconditions:
          - "Horse.status in {VET_HOLD, FARRIER_HOLD, REST_HOLD}"
          - "logical clock >= Horse.hold_release_at"
        side_effects:
          - "Horse.status := AVAILABLE"
          - "Horse.hold_release_at := null; Horse.hold_reason := null"
          - "increments Horse.version by 1"
      - from: REST_HOLD
        to: AVAILABLE
        trigger: "POST /incidents/{incident_id}/close with release_horse_hold true"
        actor: ProgramAdmin
        preconditions:
          - "Horse.status == REST_HOLD AND Horse.hold_reason == INCIDENT_REST_HOLD"
          - "Incident.status == UNDER_REVIEW"
        side_effects:
          - "Horse.status := AVAILABLE"
          - "Horse.hold_release_at := null; Horse.hold_reason := null"
          - "increments Horse.version by 1"
        note: "This is the only path that clears an incident rest hold before hold_release_at."

  - entity: Volunteer
    axis: status
    shape: "cyclic - ACTIVE <-> SUSPENDED and ACTIVE <-> INACTIVE"
    initial_state: ACTIVE
    terminal_states: []
    derived: true
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system - side effect of POST /sessions/{session_id}/incidents when INCIDENT_HOLD_MATRIX[severity].volunteer_suspension is true and implicated_volunteer_id is set"
        actor: system
        preconditions: ["Volunteer.status == ACTIVE"]
        side_effects:
          - "Volunteer.suspended_until := (Incident.occurred_at + VOLUNTEER_SUSPENSION_DAYS_SEV_1 days) when severity is SEV_1, else null-until-incident-close for SEV_2 (represented as suspended_until := 9999-12-31T00:00:00.000Z)"
          - "Volunteer.suspension_reason := INCIDENT_SEV_1 or INCIDENT_SEV_2"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /incidents/{incident_id}/close with release_volunteer_suspension true"
        actor: ProgramAdmin
        preconditions: ["Volunteer.status == SUSPENDED", "Incident.status == UNDER_REVIEW"]
        side_effects:
          - "Volunteer.suspended_until := null; Volunteer.suspension_reason := null"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "system - logical clock reaches retraining_due_at"
        actor: system
        preconditions: ["clock >= retraining_due_at AND suspended_until is null or clock >= suspended_until"]
        side_effects: ["derived only; every QUALIFIED VolunteerQualification of this volunteer is simultaneously EXPIRED by its own clock rule"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /volunteers/{volunteer_id}/retraining"
        actor: VolunteerCoordinator
        preconditions: ["Volunteer.status == INACTIVE"]
        side_effects:
          - "Volunteer.last_retraining_on := completed_on"
          - "Volunteer.retraining_due_at re-derived"
          - "increments Volunteer.version by 1"

  - entity: VolunteerQualification
    axis: status
    shape: "cyclic - IN_TRAINING -> QUALIFIED -> EXPIRED -> QUALIFIED, plus a SUSPENDED overlay"
    initial_state: IN_TRAINING
    terminal_states: []
    derived: true
    transitions:
      - from: IN_TRAINING
        to: QUALIFIED
        trigger: "POST /volunteer-qualifications/{qualification_id}/sign-off"
        actor: VolunteerCoordinator
        preconditions:
          - "VolunteerQualification.status == IN_TRAINING"
          - "training_hours >= CREW_ROLE_MIN_TRAINING_HOURS[crew_role]"
          - "the owning Volunteer.age_years >= CREW_ROLE_MIN_AGE[crew_role]"
        side_effects:
          - "signed_off_on := signed_off_on input"
          - "expires_at := signed_off_on + QUALIFICATION_VALIDITY_DAYS days"
          - "increments VolunteerQualification.version by 1"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system - logical clock reaches expires_at"
        actor: system
        preconditions: ["clock >= expires_at"]
        side_effects: ["derived only; crew assignment in this role now fails with ERR_VOLUNTEER_NOT_QUALIFIED"]
      - from: EXPIRED
        to: QUALIFIED
        trigger: "POST /volunteers/{volunteer_id}/retraining"
        actor: VolunteerCoordinator
        preconditions: ["at least one VolunteerQualification of this volunteer has status EXPIRED"]
        side_effects:
          - "every EXPIRED qualification of this volunteer gets signed_off_on := completed_on and expires_at := completed_on + QUALIFICATION_VALIDITY_DAYS days"
          - "increments each affected VolunteerQualification.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system - the owning Volunteer enters SUSPENDED"
        actor: system
        preconditions: ["owning Volunteer.status == SUSPENDED"]
        side_effects: ["derived only"]
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "system - the owning Volunteer leaves SUSPENDED"
        actor: system
        preconditions: ["owning Volunteer.status != SUSPENDED AND clock < expires_at"]
        side_effects: ["derived only"]

  - entity: Instructor
    axis: certification_status
    shape: "cyclic with a suspension overlay - CURRENT -> GRACE -> LAPSED -> CURRENT"
    initial_state: CURRENT
    terminal_states: []
    derived: true
    transitions:
      - from: CURRENT
        to: GRACE
        trigger: "system - logical clock reaches certification_expires_at"
        actor: system
        preconditions: ["clock >= certification_expires_at AND clock < certification_expires_at + CERT_GRACE_DAYS days"]
        side_effects: ["derived only; POST /sessions and POST /sessions/{session_id}/confirm now fail, POST /sessions/{session_id}/complete still succeeds"]
      - from: GRACE
        to: LAPSED
        trigger: "system - logical clock passes certification_expires_at + CERT_GRACE_DAYS days"
        actor: system
        preconditions: ["clock >= certification_expires_at + CERT_GRACE_DAYS days"]
        side_effects: ["derived only; every instructor-bearing write now fails with ERR_INSTRUCTOR_CERT_LAPSED"]
      - from: LAPSED
        to: CURRENT
        trigger: "POST /instructors/{instructor_id}/renew-certification"
        actor: ProgramAdmin
        preconditions:
          - "Instructor.certification_status in {GRACE, LAPSED}"
          - "Instructor.ce_hours_accrued >= CERT_RENEWAL_CE_HOURS"
        side_effects:
          - "certification_expires_at := renewed_on + CERT_VALIDITY_DAYS days"
          - "ce_hours_accrued := 0"
          - "increments Instructor.version by 1"
      - from: GRACE
        to: CURRENT
        trigger: "POST /instructors/{instructor_id}/renew-certification"
        actor: ProgramAdmin
        preconditions:
          - "Instructor.certification_status in {GRACE, LAPSED}"
          - "Instructor.ce_hours_accrued >= CERT_RENEWAL_CE_HOURS"
        side_effects:
          - "certification_expires_at := renewed_on + CERT_VALIDITY_DAYS days"
          - "ce_hours_accrued := 0"
          - "increments Instructor.version by 1"
      - from: CURRENT
        to: SUSPENDED
        trigger: "system - side effect of POST /sessions/{session_id}/incidents when INCIDENT_HOLD_MATRIX[severity].instructor_suspension is true"
        actor: system
        preconditions: ["Instructor.certification_status != SUSPENDED"]
        side_effects:
          - "Instructor.suspended_until := 9999-12-31T00:00:00.000Z (open-ended, cleared only at incident close)"
          - "increments Instructor.version by 1"
      - from: SUSPENDED
        to: CURRENT
        trigger: "POST /incidents/{incident_id}/close"
        actor: ProgramAdmin
        preconditions: ["Instructor.certification_status == SUSPENDED", "Incident.status == UNDER_REVIEW"]
        side_effects:
          - "Instructor.suspended_until := null"
          - "increments Instructor.version by 1"

  - entity: Session
    axis: schedule_status
    shape: "cyclic - CONFIRMED reverts to CREW_PENDING whenever crew drops below the requirement"
    initial_state: CREW_PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: CREW_PENDING
        to: CONFIRMED
        trigger: "POST /sessions/{session_id}/confirm"
        actor: Instructor
        preconditions:
          - "Session.schedule_status == CREW_PENDING"
          - "Session.crew_satisfied == true (for a LEVEL_4 rider this holds with zero CrewAssignments)"
          - "gate_precedence orders 1-5 all pass at the logical clock"
          - "Instructor.certification_status == CURRENT"
        side_effects:
          - "Session.schedule_status := CONFIRMED"
          - "increments Session.version by 1"
      - from: CONFIRMED
        to: CREW_PENDING
        trigger: "system - side effect of POST /crew-assignments/{assignment_id}/release when the release makes crew_satisfied false"
        actor: system
        preconditions:
          - "Session.schedule_status == CONFIRMED"
          - "after the release, Session.crew_satisfied == false"
        side_effects:
          - "Session.schedule_status := CREW_PENDING"
          - "increments Session.version by 1"
        note: "The reversible edge. A confirmed session drops back below crew minimum without any operator action on the session itself."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /sessions/{session_id}/complete"
        actor: Instructor
        preconditions:
          - "Session.schedule_status == CONFIRMED"
          - "X-User-ID equals Session.instructor_id"
          - "mounted_minutes >= 0 AND mounted_minutes <= duration_minutes"
          - "no FINALIZED PeriodReport covers the session date"
          - "Instructor.certification_status in {CURRENT, GRACE}"
          - "the rider has a MedicalRelease with derived status ACTIVE at the logical clock"
          - "the funding waterfall leaves no uncovered remainder when Rider.funding_mode is FUNDED_ONLY"
        side_effects:
          - "Session.schedule_status := COMPLETED; Session.mounted_minutes := mounted_minutes; Session.service_hours recomputed"
          - "creates a Charge with charge_type SESSION_FEE and amount_cents = billed_at_completion variant of session_fee_cents"
          - "runs funding_waterfall_allocation, creating FundingAllocation lines in FUNDING_WATERFALL_ORDER"
          - "Session.billing_status := FUNDED when the charge's balance_due_cents == 0, else CHARGED"
          - "increments Session.version by 1"
      - from: CREW_PENDING
        to: CANCELLED
        trigger: "POST /sessions/{session_id}/cancel"
        actor: Instructor
        preconditions: ["Session.schedule_status in {CREW_PENDING, CONFIRMED}"]
        side_effects:
          - "Session.cancellation_reason := derived reason class (see calculation cancellation_reason_derivation)"
          - "Session.schedule_status := CANCELLED"
          - "every ASSIGNED CrewAssignment of this session becomes RELEASED with release_reason SESSION_CANCELLED"
          - "the horse's committed workload for the session week and day drops by duration_minutes"
          - "when the derived reason is LATE_RIDER, creates a Charge with charge_type LATE_CANCELLATION_FEE and runs the waterfall; otherwise no charge is created"
          - "increments Session.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sessions/{session_id}/cancel"
        actor: Instructor
        preconditions: ["Session.schedule_status in {CREW_PENDING, CONFIRMED}"]
        side_effects:
          - "Session.cancellation_reason := derived reason class"
          - "Session.schedule_status := CANCELLED"
          - "every ASSIGNED CrewAssignment of this session becomes RELEASED with release_reason SESSION_CANCELLED"
          - "the horse's committed workload for the session week and day drops by duration_minutes"
          - "when the derived reason is LATE_RIDER, creates a Charge with charge_type LATE_CANCELLATION_FEE and runs the waterfall"
          - "increments Session.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system - CASCADE HOP 2 of incident_hold_cascade (rider medical hold)"
        actor: system
        preconditions: ["Session.schedule_status in {CREW_PENDING, CONFIRMED} AND Session.scheduled_start > logical clock"]
        side_effects:
          - "Session.cancellation_reason := RIDER_HOLD"
          - "Session.schedule_status := CANCELLED"
          - "no Charge is created regardless of the notice window"
          - "CASCADE HOP 3: every ASSIGNED CrewAssignment of this session becomes RELEASED with release_reason SESSION_CANCELLED"
          - "increments Session.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /sessions/{session_id}/no-show"
        actor: Instructor
        preconditions:
          - "Session.schedule_status == CONFIRMED"
          - "logical clock >= Session.scheduled_start"
        side_effects:
          - "Session.schedule_status := NO_SHOW; Session.cancellation_reason := NO_SHOW"
          - "creates a Charge with charge_type NO_SHOW_FEE and amount_cents = round_half_up(quoted_fee_cents * NO_SHOW_FEE_PCT)"
          - "runs the waterfall with GRANT and SCHOLARSHIP skipped per FUNDING_SOURCES_BY_CHARGE_TYPE"
          - "every ASSIGNED CrewAssignment of this session becomes RELEASED with release_reason SESSION_CANCELLED"
          - "increments Session.version by 1"

  - entity: Session
    axis: billing_status
    shape: "parallel dimension - evolves independently of schedule_status; compound over this session's Charges"
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: CHARGED
        trigger: "system - a Charge is created for this session and its balance_due_cents > 0"
        actor: system
        preconditions: ["at least one Charge exists for this session with status PENDING"]
        side_effects: ["Session.billing_status := CHARGED"]
      - from: UNBILLED
        to: FUNDED
        trigger: "system - a Charge is created for this session and its balance_due_cents == 0"
        actor: system
        preconditions: ["every Charge of this session has status FUNDED"]
        side_effects: ["Session.billing_status := FUNDED"]
      - from: CHARGED
        to: REVERSED
        trigger: "system - CASCADE HOP 4 of charge_reversal_cascade"
        actor: system
        preconditions:
          - "every Charge of this session has status REVERSED"
          - "every FundingAllocation of those charges has status RELEASED and every Grant / ScholarshipAward ledger touched by them has been restored (hop 3 complete)"
        side_effects:
          - "Session.billing_status := REVERSED"
          - "CASCADE HOP 5: the PeriodReport whose [period_start, period_end] contains the session date is amended or recomputed"
          - "increments Session.version by 1"
      - from: FUNDED
        to: REVERSED
        trigger: "system - CASCADE HOP 4 of charge_reversal_cascade"
        actor: system
        preconditions:
          - "every Charge of this session has status REVERSED"
          - "every FundingAllocation of those charges has status RELEASED and every Grant / ScholarshipAward ledger touched by them has been restored (hop 3 complete)"
        side_effects:
          - "Session.billing_status := REVERSED"
          - "CASCADE HOP 5: the PeriodReport whose [period_start, period_end] contains the session date is amended or recomputed"
          - "increments Session.version by 1"

  - entity: Charge
    axis: status
    shape: "linear with a compensating terminal"
    initial_state: PENDING
    terminal_states: [REVERSED]
    derived: true
    transitions:
      - from: PENDING
        to: REVERSED
        trigger: "POST /charges/{charge_id}/reverse - CASCADE HOP 1 of charge_reversal_cascade"
        actor: BillingClerk
        preconditions: ["Charge.status in {PENDING, FUNDED}"]
        side_effects:
          - "Charge.reversed_at := logical clock; Charge.reversal_reason := reason"
          - "Charge.allocated_cents := 0; Charge.balance_due_cents := 0"
          - "CASCADE HOP 2: every FundingAllocation of this charge with status ALLOCATED becomes RELEASED"
          - "increments Charge.version by 1"
      - from: FUNDED
        to: REVERSED
        trigger: "POST /charges/{charge_id}/reverse - CASCADE HOP 1 of charge_reversal_cascade"
        actor: BillingClerk
        preconditions: ["Charge.status in {PENDING, FUNDED}"]
        side_effects:
          - "Charge.reversed_at := logical clock; Charge.reversal_reason := reason"
          - "Charge.allocated_cents := 0; Charge.balance_due_cents := 0"
          - "CASCADE HOP 2: every FundingAllocation of this charge with status ALLOCATED becomes RELEASED"
          - "increments Charge.version by 1"

  - entity: FundingAllocation
    axis: status
    shape: "linear with a compensating terminal"
    initial_state: ALLOCATED
    terminal_states: [RELEASED]
    transitions:
      - from: ALLOCATED
        to: RELEASED
        trigger: "system - CASCADE HOP 2 of charge_reversal_cascade, caused by the owning Charge reaching REVERSED"
        actor: system
        preconditions: ["owning Charge.status == REVERSED"]
        side_effects:
          - "FundingAllocation.status := RELEASED"
          - "CASCADE HOP 3: when source_type is GRANT, Grant.allocated_amount_cents drops by amount_cents, Grant.remaining_amount_cents rises by the same amount and Grant.status flips EXHAUSTED -> OPEN when remaining becomes > 0"
          - "CASCADE HOP 3: when source_type is SCHOLARSHIP, ScholarshipAward.period_used_cents drops by amount_cents and status flips EXHAUSTED -> ACTIVE when used falls below period_cap_cents"
          - "increments FundingAllocation.version by 1"

  - entity: Grant
    axis: status
    shape: "cyclic - OPEN <-> EXHAUSTED, restored by allocation release"
    initial_state: OPEN
    terminal_states: []
    derived: true
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system - a GRANT allocation line drives remaining_amount_cents to 0"
        actor: system
        preconditions: ["remaining_amount_cents == 0"]
        side_effects: ["derived only; the grant is excluded from the candidate set of every later waterfall run"]
      - from: EXHAUSTED
        to: OPEN
        trigger: "system - CASCADE HOP 3 of charge_reversal_cascade releases a GRANT allocation line"
        actor: system
        preconditions: ["remaining_amount_cents > 0"]
        side_effects: ["derived only; the grant re-enters the candidate set"]

  - entity: ScholarshipAward
    axis: status
    shape: "cyclic with a supersede branch"
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    derived: true
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system - a SCHOLARSHIP allocation line drives period_used_cents to period_cap_cents or beyond"
        actor: system
        preconditions: ["period_used_cents >= period_cap_cents"]
        side_effects: ["derived only; step 2 of the waterfall contributes 0 for later charges"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system - CASCADE HOP 3 of charge_reversal_cascade releases a SCHOLARSHIP allocation line"
        actor: system
        preconditions: ["period_used_cents < period_cap_cents"]
        side_effects: ["derived only"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system - side effect of POST /riders/{rider_id}/scholarship-awards filing a later award whose period overlaps"
        actor: system
        preconditions: ["prior award status == ACTIVE AND periods overlap"]
        side_effects: ["prior ScholarshipAward.superseded_at := logical clock"]

  - entity: Goal
    axis: status
    shape: "cyclic - ACTIVE <-> MET and ACTIVE <-> STALE; DISCONTINUED terminal"
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: MET
        trigger: "system - side effect of POST /progress-notes/{note_id}/finalize when consecutive_target_hits reaches GOAL_MET_CONSECUTIVE_HITS"
        actor: system
        preconditions: ["Goal.status in {ACTIVE, STALE}", "consecutive_target_hits >= GOAL_MET_CONSECUTIVE_HITS"]
        side_effects:
          - "Goal.status := MET"
          - "Rider.goals_met_count recomputed"
          - "increments Goal.version by 1"
      - from: MET
        to: ACTIVE
        trigger: "POST /goals/{goal_id}/reopen"
        actor: Instructor
        preconditions: ["Goal.status == MET"]
        side_effects:
          - "Goal.status := ACTIVE; Goal.consecutive_target_hits := 0"
          - "Rider.goals_met_count recomputed"
          - "increments Goal.version by 1"
      - from: ACTIVE
        to: STALE
        trigger: "POST /_ops/goal-staleness-sweep"
        actor: ProgramAdmin
        preconditions: ["Goal.status == ACTIVE", "logical clock >= Goal.stale_after"]
        side_effects:
          - "Goal.status := STALE"
          - "increments Goal.version by 1"
        note: "MONOTONE BY CONSTRUCTION: the sweep only ever moves ACTIVE -> STALE. It never moves a goal back, and it never touches MET or DISCONTINUED goals. The only way out of STALE is an explicit new rating."
      - from: STALE
        to: ACTIVE
        trigger: "system - side effect of POST /progress-notes/{note_id}/finalize rating this goal"
        actor: system
        preconditions: ["Goal.status == STALE"]
        side_effects:
          - "Goal.status := ACTIVE; Goal.last_rated_at := logical clock; Goal.stale_after re-derived"
          - "increments Goal.version by 1"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /goals/{goal_id}/discontinue"
        actor: Instructor
        preconditions: ["Goal.status in {ACTIVE, MET, STALE}"]
        side_effects:
          - "Goal.status := DISCONTINUED; Goal.discontinue_reason := reason"
          - "Rider.goals_met_count recomputed"
          - "increments Goal.version by 1"
      - from: STALE
        to: DISCONTINUED
        trigger: "POST /goals/{goal_id}/discontinue"
        actor: Instructor
        preconditions: ["Goal.status in {ACTIVE, MET, STALE}"]
        side_effects:
          - "Goal.status := DISCONTINUED; Goal.discontinue_reason := reason"
          - "increments Goal.version by 1"
      - from: MET
        to: DISCONTINUED
        trigger: "POST /goals/{goal_id}/discontinue"
        actor: Instructor
        preconditions: ["Goal.status in {ACTIVE, MET, STALE}"]
        side_effects:
          - "Goal.status := DISCONTINUED; Goal.discontinue_reason := reason"
          - "Rider.goals_met_count recomputed"
          - "increments Goal.version by 1"

  - entity: ProgressNote
    axis: status
    shape: "branching - the destination depends on whether the covering PeriodReport is already FINALIZED"
    initial_state: DRAFT
    terminal_states: [FINALIZED, AMENDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /progress-notes/{note_id}/finalize"
        actor: Instructor
        preconditions:
          - "ProgressNote.status == DRAFT"
          - "X-User-ID equals ProgressNote.author_instructor_id"
          - "the parent Session.schedule_status == COMPLETED"
          - "no PeriodReport with status FINALIZED covers the session date"
        side_effects:
          - "ProgressNote.status := FINALIZED; finalized_at := logical clock; recorded_service_hours := Session.service_hours"
          - "for every entry of goal_ratings: Goal.current_rating := rating, Goal.last_rated_at := logical clock, Goal.consecutive_target_hits += 1 when rating >= target_rating else := 0"
          - "a STALE rated goal returns to ACTIVE; a goal whose consecutive_target_hits reaches GOAL_MET_CONSECUTIVE_HITS moves to MET"
          - "increments ProgressNote.version by 1"
      - from: DRAFT
        to: AMENDED
        trigger: "POST /progress-notes/{note_id}/finalize when a FINALIZED PeriodReport covers the session date"
        actor: Instructor
        preconditions:
          - "ProgressNote.status == DRAFT"
          - "X-User-ID equals ProgressNote.author_instructor_id"
          - "the parent Session.schedule_status == COMPLETED"
          - "a PeriodReport with status FINALIZED covers the session date"
        side_effects:
          - "ProgressNote.status := AMENDED; finalized_at := logical clock; the same goal side effects fire"
          - "PeriodReport.amendment_count += 1 and PeriodReport.amendment_net_cents is unchanged (a note carries no money)"
          - "the FINALIZED report's aggregates are NOT mutated"
          - "increments ProgressNote.version by 1"

  - entity: Incident
    axis: status
    shape: "linear review pipeline"
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /incidents/{incident_id}/review"
        actor: ProgramAdmin
        preconditions: ["Incident.status == OPEN"]
        side_effects:
          - "Incident.status := UNDER_REVIEW; reviewer_notes := reviewer_notes"
          - "all holds placed at creation remain in force"
          - "increments Incident.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /incidents/{incident_id}/close"
        actor: ProgramAdmin
        preconditions: ["Incident.status == UNDER_REVIEW"]
        side_effects:
          - "Incident.status := CLOSED; resolution := resolution"
          - "when release_rider_hold is true: Rider.medical_hold_incident_id := null (Rider.status stays MEDICAL_HOLD until POST /riders/{rider_id}/medical-clearance)"
          - "when release_horse_hold is true and the horse carries an INCIDENT_REST_HOLD: Horse.status := AVAILABLE"
          - "when release_volunteer_suspension is true: the implicated Volunteer's suspended_until := null"
          - "the suspended Instructor's suspended_until := null unconditionally"
          - "increments Incident.version by 1"

  - entity: PeriodReport
    axis: status
    shape: "linear with an immutable terminal"
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /period-reports/{report_id}/finalize"
        actor: ProgramAdmin
        preconditions: ["PeriodReport.status == DRAFT"]
        side_effects:
          - "every aggregate is recomputed once from live data and then frozen"
          - "PeriodReport.status := FINALIZED; finalized_at := logical clock"
          - "the finalized_period_gate now blocks POST /sessions and POST /sessions/{session_id}/complete for dates inside the period"
          - "increments PeriodReport.version by 1"

# ===========================================================================
# 1.2.1 Concurrency Rules - OCC on the parent entity's version only
# ===========================================================================
concurrency_rules:
  - rule_id: crew-assign-stale-session
    parent_entity: Session
    write_endpoint: "POST /sessions/{session_id}/crew-assignments"
    occ_field: "expected_session_version"
    description: |
      Adding a CrewAssignment to a Session whose version has advanced since the
      client last read it is rejected. Adding a second, different volunteer to
      the same session is legitimate under the product semantics, so the write
      cannot be resolved by a state precondition: the rejection exists purely to
      tell the coordinator that the session's crew composition, schedule_status
      or rider crew requirement moved underneath the view they were working from.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assessment-create-stale-rider
    parent_entity: Rider
    write_endpoint: "POST /riders/{rider_id}/assessments"
    occ_field: "expected_rider_version"
    description: |
      Filing an Assessment supersedes the rider's prior RECORDED assessment and
      rewrites the rider's independence level and crew requirement. A second
      filing against a stale rider version is rejected: the create-with-supersede
      is legitimate on its own terms, so only the stale version distinguishes a
      writer who saw the superseding assessment from one who did not.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: release-create-stale-rider
    parent_entity: Rider
    write_endpoint: "POST /riders/{rider_id}/medical-releases"
    occ_field: "expected_rider_version"
    description: |
      Filing a MedicalRelease supersedes the rider's prior ACTIVE release and
      re-points Rider.active_release_id. A filing that carries a rider version
      older than the stored one is rejected, because the client's view of which
      release is currently ACTIVE (and of which condition codes are cleared)
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table (29 rules; 7 of them dual-variant)
# ===========================================================================
calculations:
  - name: independence_level_derivation
    trigger: "POST /riders/{rider_id}/assessments"
    algorithm: threshold
    formula: |
      combined_score = balance_score + trunk_control_score
      if combined_score >= 17: LEVEL_4
      elif combined_score >= 12: LEVEL_3
      elif combined_score >= 7:  LEVEL_2
      else:                      LEVEL_1
    input_set: "The single assessment being filed. Scores are integers in ASSESSMENT_MIN_SCORE..ASSESSMENT_MAX_SCORE, so combined_score ranges 0..20 and every band is arithmetically reachable."
    constants:
      ASSESSMENT_MIN_SCORE: 0
      ASSESSMENT_MAX_SCORE: 10
    precision: "integer"

  - name: crew_requirement_derivation
    trigger: "POST /riders/{rider_id}/assessments; re-read on every Session and CrewAssignment write"
    algorithm: constraint_propagation
    formula: |
      row = INDEPENDENCE_CREW_MATRIX[independence_level]
      required_sidewalker_count = row.required_sidewalker_count
      requires_leader           = row.requires_leader
      sidewalker_hold_type      = row.sidewalker_hold_type
    input_set: "The rider's latest Assessment with status RECORDED. Riders with no RECORDED assessment have null crew requirements and cannot be activated."
    constants:
      INDEPENDENCE_CREW_MATRIX: "see constants block"
    precision: "exact table lookup"
    note: "ANKLE_HOLD is a legal CrewAssignment.hold_type value but is never produced by this matrix; it exists so that a hold-type mismatch can be provoked with a value that is enum-valid."

  - name: horse_max_load_lb
    trigger: "POST /horses and every read of Horse"
    algorithm: threshold
    formula: |
      max_load_lb = round_half_up(body_weight_lb * MAX_HORSE_LOAD_FRACTION, WEIGHT_ROUNDING_DECIMALS)
    input_set: "The horse's own body_weight_lb."
    constants:
      MAX_HORSE_LOAD_FRACTION: 0.20
      WEIGHT_ROUNDING_DECIMALS: 2
    precision: "2 decimal places, round_half_up"

  - name: effective_load_lb
    trigger: "POST /sessions (gate) and GET /sessions/{session_id}/eligibility (both variants reported)"
    algorithm: aggregation
    formula: |
      base_weight  = <rider weight per variant>
      backrider    = BACKRIDER_WEIGHT_LB if Rider.backriding_required else 0
      effective_load_lb = round_half_up(base_weight + Horse.tack_weight_lb + backrider,
                                        WEIGHT_ROUNDING_DECIMALS)
      GATE: effective_load_lb <= Horse.max_load_lb   (INCLUSIVE - equality passes)
    input_set: "One Rider, one Horse, and the rider's latest RECORDED Assessment."
    constants:
      BACKRIDER_WEIGHT_LB: 140.0
      WEIGHT_ROUNDING_DECIMALS: 2
    precision: "2 decimal places, round_half_up; the gate comparison is <= (inclusive)"
    variants:
      - name: current_declared
        when: "The scheduling gate on POST /sessions, and GET /sessions/{session_id}/eligibility with variant current_declared (the default)."
        difference: "base_weight = Rider.weight_lb, the value PATCH /riders/{rider_id} last wrote."
      - name: at_assessment
        when: "GET /sessions/{session_id}/eligibility with variant at_assessment."
        difference: "base_weight = the latest RECORDED Assessment.rider_weight_lb, i.e. the weight measured in the therapy room. Diverges from current_declared for every rider whose weight was PATCHed after the assessment."

  - name: session_fee_cents
    trigger: "GET /sessions/{session_id}/eligibility (quoted) and POST /sessions/{session_id}/complete (billed)"
    algorithm: tiered_pricing
    formula: |
      rate = BASE_RATE_CENTS_PER_MINUTE[Session.activity_type]
      fee_cents = <minutes per variant> * rate      # integer cents, no rounding needed
    input_set: "One Session."
    constants:
      BASE_RATE_CENTS_PER_MINUTE: "see constants block"
    precision: "whole cents (integer arithmetic)"
    variants:
      - name: quoted_at_scheduling
        when: "Session.quoted_fee_cents, the eligibility read, and the base of every cancellation / no-show fee."
        difference: "minutes = Session.duration_minutes (what was booked)."
      - name: billed_at_completion
        when: "Charge.amount_cents for charge_type SESSION_FEE."
        difference: "minutes = Session.mounted_minutes (what was actually ridden). A 60-minute THERAPEUTIC_RIDING booking ridden for 45 minutes quotes 9000 cents and bills 6750 cents from identical stored data."

  - name: cancellation_reason_derivation
    trigger: "POST /sessions/{session_id}/cancel"
    algorithm: threshold
    formula: |
      if cancellation_reason input in {WEATHER, HORSE_PULLED, PROGRAM_CLOSURE}:
          derived = that same value                       # never chargeable
      else:  # input is RIDER_REQUEST
          hours_notice = (Session.scheduled_start - logical_clock) / SECONDS_PER_HOUR
          derived = EARLY_RIDER if hours_notice >= LATE_CANCELLATION_WINDOW_HOURS else LATE_RIDER
    input_set: "One Session plus the logical clock. hours_notice is negative when the clock is already past scheduled_start, which lands on LATE_RIDER."
    constants:
      LATE_CANCELLATION_WINDOW_HOURS: 24
      SECONDS_PER_HOUR: 3600
    precision: "exact; the window comparison is >= (a cancellation exactly 24.0 hours ahead is EARLY_RIDER and free)"

  - name: cancellation_fee_cents
    trigger: "POST /sessions/{session_id}/cancel (LATE_RIDER only) and POST /sessions/{session_id}/no-show"
    algorithm: threshold
    formula: |
      base = quoted_at_scheduling variant of session_fee_cents
      if derived reason == LATE_RIDER: amount_cents = round_half_up(base * LATE_CANCELLATION_FEE_PCT)
      elif reason == NO_SHOW:          amount_cents = round_half_up(base * NO_SHOW_FEE_PCT)
      else:                            no Charge is created at all
    input_set: "One Session; the RIDER_HOLD cascade reason never produces a fee."
    constants:
      LATE_CANCELLATION_FEE_PCT: 0.50
      NO_SHOW_FEE_PCT: 1.00
    precision: "whole cents, round_half_up"

  - name: precaution_tier_evaluation
    trigger: "POST /sessions, POST /sessions/{session_id}/confirm, GET /sessions/{session_id}/eligibility"
    algorithm: aggregation
    formula: |
      cleared = Rider.active_release_id ? that release's cleared_condition_codes : []
      worst = CLEAR
      for code in Rider.condition_codes:
          policy = ConditionPolicy row with (condition_code == code AND activity_type == Session.activity_type)
          if policy is missing: raise ERR_CONDITION_POLICY_MISSING
          if policy.tier == CONTRAINDICATION: return CONTRAINDICATION      # short-circuit, worst possible
          if policy.tier == PRECAUTION and code not in cleared: worst = PRECAUTION
      return worst
    input_set: "Rider.condition_codes x the single Session.activity_type. A code that is PRECAUTION for THERAPEUTIC_RIDING and CONTRAINDICATION for VAULTING yields different answers for the same rider on the same day."
    constants: {}
    precision: "exact enum"
    note: "Codes listed in the ACTIVE release's cleared_condition_codes downgrade PRECAUTION to CLEAR but NEVER downgrade CONTRAINDICATION."

  - name: required_instructor_tier_evaluation
    trigger: "POST /sessions, POST /sessions/{session_id}/confirm, GET /sessions/{session_id}/eligibility"
    algorithm: aggregation
    formula: |
      tiers = [ INSTRUCTOR_TIER_ORDINAL[policy.min_instructor_tier]
                for each ConditionPolicy row matching (code in Rider.condition_codes,
                                                       Session.activity_type)
                where policy.tier == PRECAUTION ]
      required_ordinal = max(tiers + [ INSTRUCTOR_TIER_ORDINAL["REGISTERED"] ])
      GATE: INSTRUCTOR_TIER_ORDINAL[effective_instructor.certification_level] >= required_ordinal
      effective_instructor = supervising instructor when Session.supervising_instructor_id is set,
                             else the instructor of record
    input_set: "Every PRECAUTION-tier policy row for this rider and activity, including codes cleared by the release (clearing removes the participation bar, not the instructor-tier requirement)."
    constants:
      INSTRUCTOR_TIER_ORDINAL: "see constants block"
    precision: "exact ordinal comparison, >= (inclusive)"
    note: "The evaluation order is pinned: precaution_tier_evaluation runs FIRST (and may reject with ERR_CONDITION_CONTRAINDICATED or ERR_PRECAUTION_NOT_CLEARED); required_instructor_tier_evaluation runs only if that passed."

  - name: medical_release_validity_at_instant
    trigger: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete, GET /sessions/{session_id}/eligibility"
    algorithm: projection
    formula: |
      status_at(t) = REVOKED    if revoked_at is not null and revoked_at <= t
                     SUPERSEDED if superseded_at is not null and superseded_at <= t
                     EXPIRED    if t >= expires_at
                     ACTIVE     otherwise
      GATE on the write endpoints: status_at(logical_clock) must be ACTIVE for the
      rider's most recent release, else ERR_RELEASE_EXPIRED (a release exists but is
      not ACTIVE) or ERR_RELEASE_MISSING (the rider has no release at all).
    input_set: "The rider's most recent MedicalRelease by created_at DESC."
    constants:
      RELEASE_VALIDITY_DAYS: 365
    precision: "exact instant comparison; expiry is >= (a session at exactly expires_at is EXPIRED)"
    variants:
      - name: at_booking_instant
        when: "GET /sessions/{session_id}/eligibility with variant at_booking_instant, and every write gate."
        difference: "t = the logical clock at the moment of the call."
      - name: at_ride_instant
        when: "GET /sessions/{session_id}/eligibility with variant at_ride_instant."
        difference: "t = Session.scheduled_start. A session booked one week before expiry but scheduled two weeks after it reports ACTIVE at_booking_instant and EXPIRED at_ride_instant from identical stored data - and is accepted at POST /sessions, then rejected at POST /sessions/{session_id}/complete once the clock has moved."

  - name: instructor_certification_status_at_instant
    trigger: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete, GET /sessions/{session_id}/eligibility"
    algorithm: projection
    formula: |
      status_at(t) = SUSPENDED if suspended_until is not null and t < suspended_until
                     CURRENT   if t <  certification_expires_at
                     GRACE     if t <  certification_expires_at + CERT_GRACE_DAYS days
                     LAPSED    otherwise
      GATE on POST /sessions and POST /sessions/{session_id}/confirm: must be CURRENT.
      GATE on POST /sessions/{session_id}/complete:                  must be CURRENT or GRACE.
    input_set: "The instructor of record, and additionally the supervising instructor when one is set - both must pass."
    constants:
      CERT_GRACE_DAYS: 60
    precision: "exact instant comparison; each boundary is >= on the later state"
    variants:
      - name: at_booking_instant
        when: "GET /sessions/{session_id}/eligibility with variant at_booking_instant, and every write gate."
        difference: "t = the logical clock at the moment of the call."
      - name: at_ride_instant
        when: "GET /sessions/{session_id}/eligibility with variant at_ride_instant."
        difference: "t = Session.scheduled_start. An instructor whose certificate lapses between booking and ride reports CURRENT at_booking_instant and GRACE (or LAPSED) at_ride_instant."

  - name: assessment_status_derivation
    trigger: "Every read of Rider and the POST /sessions gate"
    algorithm: threshold
    formula: |
      if no RECORDED Assessment:                                          NEVER_ASSESSED
      elif logical_clock >= assessment_next_due_at:                       OVERDUE
      elif logical_clock >= assessment_next_due_at - REASSESSMENT_DUE_WARNING_DAYS days: DUE
      else:                                                               CURRENT
    input_set: "The rider's latest RECORDED Assessment."
    constants:
      REASSESSMENT_INTERVAL_DAYS: 365
      REASSESSMENT_DUE_WARNING_DAYS: 30
    precision: "exact instant comparison, >= on the later state"
    note: "This axis is DERIVED, so it is deliberately NOT monotone: filing a reassessment moves OVERDUE straight back to CURRENT. Because nothing is persisted, no carve-out keyed on it can go stale."

  - name: horse_workload_minutes
    trigger: "POST /sessions capacity gates, GET /horses/{horse_id}/workload, Horse computed fields"
    algorithm: aggregation
    formula: |
      week_start = the WEEK_START_DAY (MONDAY) on or before on_date, at 00:00:00.000Z
      week_window = [week_start, week_start + 7 days)          # half-open
      day_window  = [on_date 00:00:00.000Z, on_date + 1 day)   # half-open
      minutes(window, variant) = sum over this horse's Sessions whose scheduled_start
                                 falls inside window and whose schedule_status is in
                                 <variant status filter>, of <variant minutes field>
      order: none required (a sum), so no tie-break is needed
    input_set: "One Horse, one calendar date. Sessions with schedule_status CANCELLED or NO_SHOW are excluded from BOTH variants, which is what makes cancellation return capacity."
    constants:
      HORSE_MAX_MOUNTED_MINUTES_PER_DAY: 150
      HORSE_MAX_MOUNTED_MINUTES_PER_WEEK: 240
      HORSE_MAX_SESSIONS_PER_DAY: 3
      WEEK_START_DAY: "MONDAY"
    precision: "integer minutes"
    variants:
      - name: committed
        when: "The scheduling gates on POST /sessions and the default of GET /horses/{horse_id}/workload."
        difference: "status filter = {CREW_PENDING, CONFIRMED, COMPLETED}; minutes field = duration_minutes (what the horse is booked for)."
      - name: delivered
        when: "GET /horses/{horse_id}/workload with variant delivered."
        difference: "status filter = {COMPLETED}; minutes field = mounted_minutes (what the horse actually carried). Diverges whenever a session is booked but not yet completed, or completed with mounted_minutes < duration_minutes."

  - name: horse_capacity_gates
    trigger: "POST /sessions"
    algorithm: threshold
    formula: |
      day_after  = committed day minutes  for scheduled_start's date + new duration_minutes
      week_after = committed week minutes for scheduled_start's week + new duration_minutes
      count_after = committed day session count + 1
      if count_after > HORSE_MAX_SESSIONS_PER_DAY:          ERR_HORSE_DAILY_LIMIT_EXCEEDED
      if day_after  > HORSE_MAX_MOUNTED_MINUTES_PER_DAY:    ERR_HORSE_DAILY_LIMIT_EXCEEDED
      if week_after > HORSE_MAX_MOUNTED_MINUTES_PER_WEEK:   ERR_HORSE_WEEKLY_MINUTES_EXCEEDED
    input_set: "The committed variant of horse_workload_minutes plus the session being created."
    constants:
      HORSE_MAX_SESSIONS_PER_DAY: 3
      HORSE_MAX_MOUNTED_MINUTES_PER_DAY: 150
      HORSE_MAX_MOUNTED_MINUTES_PER_WEEK: 240
    precision: "integer; every comparison is strict > , so landing exactly ON a cap is allowed"
    note: "Arithmetic feasibility check: with SESSION_MIN_DURATION_MINUTES 30 and SESSION_MAX_DURATION_MINUTES 90, a day reaches exactly 150 with 90+60 (2 sessions) and a week reaches exactly 240 with 150 on Monday plus 90 on Tuesday; both caps are therefore reachable AND crossable inside the 3-sessions-per-day limit."

  - name: horse_interval_overlap
    trigger: "POST /sessions"
    algorithm: interval_merge
    formula: |
      new  = [scheduled_start, scheduled_start + duration_minutes)     # HALF-OPEN
      each = [other.scheduled_start, other.scheduled_end)             # HALF-OPEN
      conflict when new.start < each.end AND each.start < new.end
    input_set: "Sessions of the SAME horse with schedule_status in {CREW_PENDING, CONFIRMED, COMPLETED}."
    constants: {}
    precision: "half-open; a session starting exactly when another ends does NOT overlap"

  - name: horse_rest_interval
    trigger: "POST /sessions, evaluated only when horse_interval_overlap found no conflict"
    algorithm: interval_merge
    formula: |
      for each non-overlapping session of the same horse:
          gap_minutes = minutes between the earlier interval's end and the later interval's start
          if gap_minutes < HORSE_REST_INTERVAL_MINUTES: ERR_HORSE_REST_INTERVAL
    input_set: "Same status filter as horse_interval_overlap."
    constants:
      HORSE_REST_INTERVAL_MINUTES: 15
    precision: "a gap of exactly HORSE_REST_INTERVAL_MINUTES is ALLOWED (comparison is strict <)"
    note: "Together with horse_interval_overlap this implements a buffer-extended half-open occupancy on the Horse resource."

  - name: instructor_interval_overlap
    trigger: "POST /sessions"
    algorithm: interval_merge
    formula: |
      conflict when the new HALF-OPEN interval intersects the half-open interval of
      another Session (status in {CREW_PENDING, CONFIRMED, COMPLETED}) that names the
      same instructor_id OR the same supervising_instructor_id. NO buffer is applied.
    input_set: "Sessions naming the same instructor in either instructor slot."
    constants: {}
    precision: "half-open, zero buffer; back-to-back teaching is legal"

  - name: volunteer_interval_overlap
    trigger: "POST /sessions/{session_id}/crew-assignments"
    algorithm: interval_merge
    formula: |
      new  = [session.scheduled_start, session.scheduled_end]           # CLOSED
      each = [other.scheduled_start, other.scheduled_end]               # CLOSED
      conflict when new.start <= each.end AND each.start <= new.end
    input_set: "Sessions with schedule_status in {CREW_PENDING, CONFIRMED} that already carry an ASSIGNED CrewAssignment for the same volunteer."
    constants: {}
    precision: "CLOSED intervals with zero buffer; a volunteer touching endpoints (11:00 end / 11:00 start) DOES conflict, which is exactly where this rule diverges from the horse and instructor rules"

  - name: crew_satisfaction_evaluation
    trigger: "Every CrewAssignment write or release, and POST /sessions/{session_id}/confirm"
    algorithm: aggregation
    formula: |
      sidewalkers = count of this session's CrewAssignments with status ASSIGNED and crew_role SIDEWALKER
      leaders     = count of this session's CrewAssignments with status ASSIGNED and crew_role LEADER
      crew_satisfied = (sidewalkers == Rider.required_sidewalker_count)
                       AND (leaders == (1 if Rider.requires_leader else 0))
    input_set: "The session's ASSIGNED crew only; RELEASED assignments never count."
    constants: {}
    precision: "exact equality on both counts - over-assignment is as wrong as under-assignment"
    note: "For a LEVEL_4 rider the requirement is (0 sidewalkers, 0 leaders), so the EMPTY crew set satisfies it and POST /sessions/{session_id}/confirm succeeds with zero CrewAssignments."

  - name: grant_candidate_selection
    trigger: "Step 1 of funding_waterfall_allocation, SESSION_FEE charges only"
    algorithm: waterfall_allocation
    formula: |
      session_date = the calendar date of Session.scheduled_start
      eligibility filter (all must hold):
          Grant.status == OPEN
          Grant.period_start <= session_date <= Grant.period_end
          Grant.restricted_program_code is null OR == Rider.program_code
          Grant.restricted_demographic  is null OR == Rider.demographic_group
      ranking expression: period_end ASC, then remaining_amount_cents ASC,
                          then created_at ASC          # never id
      empty candidate set -> contribute 0 and move to step 2 (never an error)
    input_set: "Every Grant, filtered as above."
    constants: {}
    precision: "exact"
    note: "A grant whose restriction does not match is silently skipped during allocation. ERR_GRANT_RESTRICTION_VIOLATION is raised only by POST /grants when restricted_program_code and restricted_demographic are BOTH set and period_start > period_end, or when awarded_amount_cents <= 0 - see the error catalog for the exact condition."

  - name: funding_waterfall_allocation
    trigger: "POST /sessions/{session_id}/complete, POST /sessions/{session_id}/cancel (LATE_RIDER), POST /sessions/{session_id}/no-show"
    algorithm: waterfall_allocation
    formula: |
      # ---- PINNED EVALUATION ORDER (this is the whole difficulty of the rule) ----
      A         = Charge.amount_cents                        # the GROSS amount
      remaining = A
      allowed   = FUNDING_SOURCES_BY_CHARGE_TYPE[Charge.charge_type]

      # step 1 - GRANT (only when GRANT is in allowed)
      for g in grant_candidate_selection order, while remaining > 0:
          take = min(g.remaining_amount_cents, remaining)
          if take > 0: emit line(sequence_index=1, source_type=GRANT, grant_id=g.id, amount_cents=take)
          remaining -= take

      # step 2 - SCHOLARSHIP (only when SCHOLARSHIP is in allowed)
      award = the rider's ScholarshipAward with status ACTIVE whose
              period_start <= session_date <= period_end, ordered period_end ASC,
              then created_at ASC, first row
      if award exists:
          pct_cap     = round_half_up(A * award.cap_pct)      # PCT OF THE GROSS A, NOT of remaining
          period_room = award.period_cap_cents - award.period_used_cents
          take = min(pct_cap, period_room, remaining)
          if take > 0: emit line(sequence_index=2, source_type=SCHOLARSHIP,
                                 scholarship_award_id=award.id, amount_cents=take)
          remaining -= take

      # step 3 - SLIDING_SCALE
      pct  = SLIDING_SCALE_PCT[Rider.household_income_band]
      take = min(round_half_up(remaining * pct), remaining)   # PCT OF THE REMAINING, NOT of A
      if take > 0: emit line(sequence_index=3, source_type=SLIDING_SCALE, amount_cents=take)
      remaining -= take

      # step 4 - PAYER
      take = min(Rider.payer_rate_cents, remaining)
      if take > 0: emit line(sequence_index=4, source_type=PAYER, amount_cents=take)
      remaining -= take

      # step 5 - PRIVATE_PAY (ALWAYS emitted, even with amount_cents == 0)
      if Charge.charge_type == SESSION_FEE and Rider.funding_mode == FUNDED_ONLY and remaining > 0:
          reject the whole request with ERR_FUNDS_EXHAUSTED and persist nothing
      emit line(sequence_index=5, source_type=PRIVATE_PAY, amount_cents=remaining)
      Charge.balance_due_cents = remaining
      Charge.allocated_cents   = sum of every emitted line   # == A by construction
    input_set: "One Charge, its Session, that session's Rider, every OPEN Grant, and the rider's ACTIVE ScholarshipAward."
    constants:
      FUNDING_WATERFALL_ORDER: "see constants block"
      FUNDING_SOURCES_BY_CHARGE_TYPE: "see constants block"
      SLIDING_SCALE_PCT: "see constants block"
      MONEY_ROUNDING_MODE: "round_half_up"
    precision: "Each line is rounded to whole cents AT LINE LEVEL before being subtracted from remaining; there is never a sum-then-round step. Every take is additionally clamped by min(..., remaining), so the lines can never over-allocate."
    note: |
      Two traps live here and are deliberate.
      (1) The scholarship cap is a percentage of the GROSS A while the sliding-scale
          discount is a percentage of the REMAINING. A rider who holds a scholarship
          therefore reaches step 3 with a smaller base and receives a smaller absolute
          sliding-scale discount than an otherwise identical rider without one.
      (2) FUNDING_SOURCES_BY_CHARGE_TYPE excludes GRANT and SCHOLARSHIP from
          LATE_CANCELLATION_FEE and NO_SHOW_FEE. The same rider therefore pays far
          MORE out of pocket for a no-show fee than for the delivered session it
          replaced, because the scholarship that shielded the session fee cannot
          touch the no-show fee and the sliding-scale base is no longer shrunken.
      The FUNDED_ONLY rejection applies to SESSION_FEE charges only; a cancellation or
      no-show fee always lands on PRIVATE_PAY regardless of Rider.funding_mode.

  - name: session_service_hours
    trigger: "POST /sessions/{session_id}/complete"
    algorithm: aggregation
    formula: |
      service_hours = round_half_up(mounted_minutes / MINUTES_PER_HOUR, HOURS_ROUNDING_DECIMALS)
    input_set: "One COMPLETED Session."
    constants:
      MINUTES_PER_HOUR: 60
      HOURS_ROUNDING_DECIMALS: 2
    precision: "2 decimal places, round_half_up"
    note: "This is the explicit minutes-to-hours conversion every aggregate depends on; nothing may convert minutes to hours by any other route."

  - name: volunteer_service_hours
    trigger: "GET /volunteers/{volunteer_id}/service-hours and PeriodReport.volunteer_hours"
    algorithm: aggregation
    formula: |
      rows = this volunteer's CrewAssignments with status ASSIGNED whose Session's
             scheduled_start date falls in [period_start, period_end] (both inclusive)
             and whose Session.schedule_status is in <variant status filter>
      # ROUNDING ORDER IS PINNED: round EACH session's hours to
      # HOURS_ROUNDING_DECIMALS first, THEN sum. Never sum minutes and convert once.
      service_hours = round_half_up( sum over rows of
                          round_half_up(<variant minutes> / MINUTES_PER_HOUR,
                                        HOURS_ROUNDING_DECIMALS),
                          HOURS_ROUNDING_DECIMALS )
      session_count = len(rows)
    input_set: "CrewAssignments of one volunteer inside one closed date range."
    constants:
      MINUTES_PER_HOUR: 60
      HOURS_ROUNDING_DECIMALS: 2
    precision: "per-session round then sum. Three 50-minute sessions give 0.83+0.83+0.83 = 2.49, NOT 150/60 = 2.5 - the two orders differ and only the per-session order is correct."
    variants:
      - name: scheduled
        when: "GET /volunteers/{volunteer_id}/service-hours with variant scheduled."
        difference: "status filter = {CREW_PENDING, CONFIRMED, COMPLETED}; minutes = Session.duration_minutes."
      - name: delivered
        when: "GET /volunteers/{volunteer_id}/service-hours with variant delivered, and PeriodReport.volunteer_hours."
        difference: "status filter = {COMPLETED}; minutes = Session.mounted_minutes. Diverges from scheduled for every booked-but-not-yet-ridden session and for every session ridden short."

  - name: period_report_aggregation
    trigger: "POST /period-reports (compute), POST /period-reports/{report_id}/finalize (freeze), every GET of a DRAFT report"
    algorithm: aggregation
    formula: |
      in_period_sessions = Sessions whose scheduled_start date is in
                           [period_start, period_end] (both inclusive)
      total_service_hours   = round_half_up( sum over COMPLETED in_period_sessions of
                                  session_service_hours, HOURS_ROUNDING_DECIMALS )   # per-session round then sum
      rider_count           = count of DISTINCT rider_id over COMPLETED in_period_sessions
      veteran_rider_count   = of those distinct riders, those with demographic_group VETERAN
      volunteer_hours       = sum over volunteers of the delivered variant of
                              volunteer_service_hours for [period_start, period_end]
      in_period_charges     = Charges whose Session is in in_period_sessions
      grant_utilization_cents    = sum of amount_cents over ALLOCATED GRANT lines of in_period_charges
      scholarship_spend_cents    = sum of amount_cents over ALLOCATED SCHOLARSHIP lines of in_period_charges
      private_pay_cents          = sum of amount_cents over ALLOCATED PRIVATE_PAY lines of in_period_charges
      total_charged_cents        = sum of amount_cents over in_period_charges whose status != REVERSED
    input_set: "Every Session, Charge and FundingAllocation whose session date falls inside the closed period."
    constants:
      HOURS_ROUNDING_DECIMALS: 2
    precision: "money in whole cents; hours per-session-rounded then summed"
    variants:
      - name: draft_live_recompute
        when: "PeriodReport.status == DRAFT - every GET recomputes from live data."
        difference: "amendment_count and amendment_net_cents stay 0; a charge reversed after the report was created simply disappears from total_charged_cents."
      - name: finalized_snapshot_plus_amendments
        when: "PeriodReport.status == FINALIZED."
        difference: "Every aggregate is frozen at the value computed at finalize. A charge reversed afterwards does NOT change total_charged_cents; instead amendment_count increments by 1 and amendment_net_cents decreases by that charge's amount_cents. Reading the same period two ways therefore gives two different, both-correct answers, and the partition invariant frozen_total + amendment_net == live_total is what ties them together."

  - name: incident_severity_derivation
    trigger: "POST /sessions/{session_id}/incidents"
    algorithm: threshold
    formula: |
      severity = INCIDENT_SEVERITY_MATRIX row matching (incident_type, injury_reported)
    input_set: "The single incident being filed."
    constants:
      INCIDENT_SEVERITY_MATRIX: "see constants block"
    precision: "exact table lookup - all 10 (incident_type, injury_reported) pairs are enumerated"

  - name: incident_report_deadline
    trigger: "POST /sessions/{session_id}/incidents"
    algorithm: threshold
    formula: |
      report_due_at = occurred_at + INCIDENT_REPORT_DEADLINE_HOURS[severity] hours
      reported_at   = logical clock at creation
      reported_late = reported_at > report_due_at
    input_set: "The single incident being filed."
    constants:
      INCIDENT_REPORT_DEADLINE_HOURS: "see constants block"
    precision: "exact instant comparison, strict > (reporting exactly at the deadline is on time)"
    note: "A late report is RECORDED, never rejected - safety reporting is never suppressed by a deadline."

  - name: goal_progress_evaluation
    trigger: "POST /progress-notes/{note_id}/finalize"
    algorithm: chronological
    formula: |
      for each {goal_id, rating} in the note's goal_ratings, processed in the order
      the client supplied them (the array order is the pinned processing order):
          goal.current_rating = rating
          goal.last_rated_at  = logical clock
          if rating >= goal.target_rating: goal.consecutive_target_hits += 1
          else:                            goal.consecutive_target_hits  = 0
          if goal.status == STALE:         goal.status = ACTIVE
          if goal.consecutive_target_hits >= GOAL_MET_CONSECUTIVE_HITS: goal.status = MET
    input_set: "The goals named by one note. Goals with status DISCONTINUED are rejected up front with ERR_INVALID_STATE."
    constants:
      GOAL_MET_CONSECUTIVE_HITS: 2
      GOAL_MIN_RATING: 1
      GOAL_MAX_RATING: 5
    precision: "integers; the target comparison is >= (a rating exactly equal to target_rating is a hit)"

  - name: goal_staleness_evaluation
    trigger: "POST /_ops/goal-staleness-sweep"
    algorithm: decay_function
    formula: |
      stale_after = (last_rated_at if not null else created_at) + GOAL_STALE_AFTER_DAYS days
      swept = every Goal with status == ACTIVE and logical_clock >= stale_after
      each swept goal moves ACTIVE -> STALE
      processing order: created_at ASC (never id) - the order is observable only in
      the returned stale_goal_ids array
    input_set: "Goals with status ACTIVE only. MET, STALE and DISCONTINUED goals are never touched by the sweep."
    constants:
      GOAL_STALE_AFTER_DAYS: 90
    precision: "exact instant comparison, >= (a goal exactly at stale_after is swept)"
    note: "MONOTONICITY: the sweep is one-directional. Because STALE is a persisted state that only an explicit rating can leave, the status can never silently re-enter ACTIVE when the clock moves, and no carve-out keyed on STALE can misfire."

  - name: age_years
    trigger: "POST /volunteers, POST /volunteer-qualifications/{qualification_id}/sign-off, POST /sessions/{session_id}/crew-assignments"
    algorithm: threshold
    formula: |
      age_years = whole completed years from date_of_birth to the logical clock date
                  (i.e. clock_year - dob_year, minus 1 when (clock_month, clock_day)
                  is strictly before (dob_month, dob_day))
      GATE: age_years >= CREW_ROLE_MIN_AGE[crew_role]
    input_set: "One Volunteer and the logical clock."
    constants:
      CREW_ROLE_MIN_AGE: "see constants block"
      LEADER_MIN_AGE: 16
      SIDEWALKER_MIN_AGE: 14
      BARN_MIN_AGE: 12
    precision: "integer years; the gate is >= (a volunteer on their 14th birthday may sidewalk)"

# ===========================================================================
# Conservation invariants (compensating-action pairs)
# ===========================================================================
conservation_invariants:
  - invariant_id: charge_money_conservation
    conserved_quantity: "money on a single Charge"
    formula: "Charge.amount_cents == sum(FundingAllocation.amount_cents WHERE charge_id == Charge.id AND status == ALLOCATED) for every Charge whose status is PENDING or FUNDED; and == 0 == Charge.allocated_cents == Charge.balance_due_cents once status is REVERSED."
    forward_action: "POST /sessions/{session_id}/complete"
    compensating_action: "POST /charges/{charge_id}/reverse"
    drift_check: "After forward+compensating, every allocation of the charge is RELEASED, Charge.allocated_cents == 0 and Charge.balance_due_cents == 0."
  - invariant_id: grant_balance_partition
    conserved_quantity: "restricted grant money"
    formula: "Grant.awarded_amount_cents == Grant.remaining_amount_cents + sum(FundingAllocation.amount_cents WHERE grant_id == Grant.id AND status == ALLOCATED), at every observable instant."
    forward_action: "POST /sessions/{session_id}/complete drawing on the grant"
    compensating_action: "POST /charges/{charge_id}/reverse"
    drift_check: "Grant.remaining_amount_cents returns to exactly its pre-charge value and Grant.status returns to OPEN."
  - invariant_id: horse_capacity_conservation
    conserved_quantity: "horse committed mounted minutes in a week"
    formula: "Horse.current_week_committed_minutes == sum(Session.duration_minutes WHERE horse_id == Horse.id AND schedule_status IN {CREW_PENDING, CONFIRMED, COMPLETED} AND scheduled_start IN [week_start, week_start + 7 days))."
    forward_action: "POST /sessions"
    compensating_action: "POST /sessions/{session_id}/cancel"
    drift_check: "Cancelling returns exactly duration_minutes of weekly and daily capacity - no more, no less - so a session that was rejected for weekly overflow succeeds after one cancellation of equal duration."
  - invariant_id: report_period_partition
    conserved_quantity: "charged money attributed to a reporting period"
    formula: "For a FINALIZED PeriodReport: total_charged_cents + amendment_net_cents == the draft_live_recompute value of total_charged_cents for the same [period_start, period_end] at the current instant."
    forward_action: "POST /period-reports/{report_id}/finalize"
    compensating_action: "POST /charges/{charge_id}/reverse on an in-period charge"
    drift_check: "The frozen aggregate never moves; the whole delta lands in amendment_net_cents and amendment_count."
  - invariant_id: scholarship_award_partition
    conserved_quantity: "scholarship award period spend"
    formula: "ScholarshipAward.period_used_cents == sum(FundingAllocation.amount_cents WHERE scholarship_award_id == ScholarshipAward.id AND status == ALLOCATED), and period_used_cents <= period_cap_cents at every observable instant."
    forward_action: "POST /sessions/{session_id}/complete drawing on the award"
    compensating_action: "POST /charges/{charge_id}/reverse"
    drift_check: "period_used_cents returns to its pre-charge value and status returns to ACTIVE."

# ===========================================================================
# Declared cascades (each hop caused by the previous hop, not by the trigger)
# ===========================================================================
cascades:
  - cascade_id: charge_reversal_cascade
    depth: 5
    trigger: "POST /charges/{charge_id}/reverse"
    chain:
      - "HOP 1 - Charge.status PENDING|FUNDED -> REVERSED (allocated_cents and balance_due_cents zeroed)."
      - "HOP 2 - caused by HOP 1: every FundingAllocation of that charge moves ALLOCATED -> RELEASED."
      - "HOP 3 - caused by HOP 2: each released line restores its source ledger - Grant.allocated_amount_cents falls and Grant.status flips EXHAUSTED -> OPEN; ScholarshipAward.period_used_cents falls and status flips EXHAUSTED -> ACTIVE."
      - "HOP 4 - caused by HOP 3: with every charge of the session REVERSED and every source ledger restored, Session.billing_status CHARGED|FUNDED -> REVERSED."
      - "HOP 5 - caused by HOP 4: the PeriodReport covering the session date reacts - FINALIZED reports take amendment_count += 1 and amendment_net_cents -= amount_cents with aggregates untouched; DRAFT reports simply recompute live."
  - cascade_id: incident_hold_cascade
    depth: 4
    trigger: "POST /sessions/{session_id}/incidents with a SEV_1 severity"
    chain:
      - "HOP 1 - Incident created OPEN; Rider.status ACTIVE -> MEDICAL_HOLD and Rider.medical_hold_incident_id set."
      - "HOP 2 - caused by HOP 1: every future Session of that rider with schedule_status CREW_PENDING or CONFIRMED moves to CANCELLED with cancellation_reason RIDER_HOLD and no fee."
      - "HOP 3 - caused by HOP 2: every ASSIGNED CrewAssignment on each of those cancelled sessions moves to RELEASED with release_reason SESSION_CANCELLED."
      - "HOP 4 - caused by HOP 3: each affected Volunteer.open_assignment_count is recomputed downward."

# ===========================================================================
# 1.4 Validation Rules Table - ONE ordered ladder, 44 rungs, spanning every
# endpoint. Rungs 14-18 are the ordered global write gates of gate_precedence.
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role is listed in the called endpoint's roles set."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "Ownership: POST /sessions/{session_id}/complete requires X-User-ID == Session.instructor_id; POST /progress-notes/{note_id}/finalize requires X-User-ID == ProgressNote.author_instructor_id. Segregation of duties: neither may be performed by any other Instructor."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /sessions/{session_id}/complete, POST /progress-notes/{note_id}/finalize"
  - priority: 5
    category: business_constraint
    check: "Pagination: limit is an integer in [1, 100] and offset is an integer >= 0 when supplied."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every GET returning a list"
  - priority: 6
    category: business_constraint
    check: "The request body is a JSON object and every field required by the endpoint's input schema is present and non-null."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every POST / PATCH"
  - priority: 7
    category: business_constraint
    check: "Field types and numeric / string ranges hold: weight_lb > 0 and <= 400; duration_minutes in [SESSION_MIN_DURATION_MINUTES, SESSION_MAX_DURATION_MINUTES]; balance_score and trunk_control_score in [ASSESSMENT_MIN_SCORE, ASSESSMENT_MAX_SCORE]; baseline_rating and target_rating in [GOAL_MIN_RATING, GOAL_MAX_RATING] with target_rating > baseline_rating; every goal_ratings rating in [GOAL_MIN_RATING, GOAL_MAX_RATING]; cap_pct > 0 and <= SCHOLARSHIP_MAX_CAP_PCT; period_cap_cents > 0; awarded_amount_cents > 0; payer_rate_cents >= 0; body_weight_lb > 0; tack_weight_lb >= 0; training_hours >= 0; hours > 0; mounted_minutes >= 0 and <= Session.duration_minutes; period_end >= period_start; every date-only field matches YYYY-MM-DD; every instant field parses as ISO 8601."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every POST / PATCH"
  - priority: 8
    category: business_constraint
    check: "Enum membership, CLOSED LIST. A request BODY field whose name appears in ENUM_ERROR_FIELD_LIST carrying a value outside its declared member set returns ERR_INVALID_ENUM. NO OTHER FIELD ROUTES HERE: every other invalid value - including an out-of-range enum supplied as a QUERY PARAMETER, an unknown status filter, or a malformed id - returns ERR_VALIDATION from rung 7 or the relevant not-found rung instead."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "every POST / PATCH"
  - priority: 9
    category: existence
    check: "A {rider_id} path segment resolves to an existing Rider."
    error_id: ERR_RIDER_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {rider_id}"
  - priority: 10
    category: existence
    check: "A {session_id} path segment resolves to an existing Session."
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {session_id}"
  - priority: 11
    category: existence
    check: "A {horse_id} path segment resolves to an existing Horse."
    error_id: ERR_HORSE_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {horse_id}"
  - priority: 12
    category: existence
    check: "Every other path id ({release_id}, {assessment_id}, {volunteer_id}, {qualification_id}, {instructor_id}, {assignment_id}, {goal_id}, {note_id}, {grant_id}, {award_id}, {charge_id}, {allocation_id}, {incident_id}, {report_id}) resolves, validated LEFT TO RIGHT."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every path with a non-rider, non-session, non-horse id segment"
  - priority: 13
    category: existence
    check: "Body foreign keys resolve, validated in the field order rider_id, horse_id, instructor_id, supervising_instructor_id, volunteer_id, medical_release_id, preferred_grant_id, and every goal_id inside goal_ratings. rider_id -> ERR_RIDER_NOT_FOUND; horse_id -> ERR_HORSE_NOT_FOUND; all others -> ERR_RESOURCE_NOT_FOUND."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sessions, POST /sessions/{session_id}/crew-assignments, POST /riders/{rider_id}/medical-clearance, POST /sessions/{session_id}/complete, POST /sessions/{session_id}/progress-notes, POST /sessions/{session_id}/incidents, POST /instructors"
  - priority: 14
    category: business_safety
    check: "GATE 1 of gate_precedence - incident hold. The write is rejected when any subject it touches carries a hold from an Incident whose status is OPEN or UNDER_REVIEW: Rider.medical_hold_incident_id is not null; Horse.status is REST_HOLD with hold_reason INCIDENT_REST_HOLD; the named Volunteer.status is SUSPENDED; the effective Instructor.certification_status is SUSPENDED."
    error_id: ERR_INCIDENT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete, POST /sessions/{session_id}/crew-assignments"
  - priority: 15
    category: business_temporal
    check: "GATE 2 of gate_precedence - finalized reporting period. POST /sessions and POST /sessions/{session_id}/complete are rejected when the session date falls inside the closed [period_start, period_end] of a PeriodReport with status FINALIZED. POST /period-reports is rejected when the requested period overlaps a FINALIZED report's period. POST /period-reports/{report_id}/finalize is rejected when the target is already FINALIZED."
    error_id: ERR_REPORT_FINALIZED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{session_id}/complete, POST /period-reports, POST /period-reports/{report_id}/finalize"
  - priority: 16
    category: business_safety
    check: "GATE 3 of gate_precedence - horse operational hold. Horse.status must be AVAILABLE."
    error_id: ERR_HORSE_ON_HOLD
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete"
  - priority: 17
    category: business_safety
    check: "GATE 4 of gate_precedence - instructor certification. Evaluated on the instructor of record AND on the supervising instructor when one is set. POST /sessions and POST /sessions/{session_id}/confirm require CURRENT; POST /sessions/{session_id}/complete accepts CURRENT or GRACE; LAPSED and SUSPENDED are rejected everywhere."
    error_id: ERR_INSTRUCTOR_CERT_LAPSED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete"
  - priority: 18
    category: business_safety
    check: "GATE 5 of gate_precedence - medical release. The rider's most recent MedicalRelease must have derived status ACTIVE at the logical clock. No release at all -> ERR_RELEASE_MISSING; a release in EXPIRED, REVOKED or SUPERSEDED -> ERR_RELEASE_EXPIRED."
    error_id: ERR_RELEASE_EXPIRED
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete, POST /riders/{rider_id}/activate"
  - priority: 19
    category: state
    check: "The target resource is in a from-state the requested transition declares in §1.2. Covers every action endpoint: a second confirm, a cancel of a CANCELLED session, a no-show on a CREW_PENDING session, a reverse of a REVERSED charge, a sign-off on a QUALIFIED qualification, a review of an UNDER_REVIEW incident, a close of an OPEN incident, a finalize of a FINALIZED note, a discontinue of a DISCONTINUED goal, a reopen of an ACTIVE goal, a rating of a DISCONTINUED goal, a release-hold before hold_release_at, a withdraw of a rider holding live sessions."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 20
    category: state
    check: "Rider.status must be ACTIVE."
    error_id: ERR_RIDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 21
    category: state
    check: "Rider.assessment_status must not be OVERDUE or NEVER_ASSESSED."
    error_id: ERR_REASSESSMENT_OVERDUE
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 22
    category: business_safety
    check: "Every code in Rider.condition_codes has a ConditionPolicy row for the session's activity_type."
    error_id: ERR_CONDITION_POLICY_MISSING
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 23
    category: business_safety
    check: "precaution_tier_evaluation must not return CONTRAINDICATION. A physician clearance NEVER lifts a contraindication."
    error_id: ERR_CONDITION_CONTRAINDICATED
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 24
    category: business_safety
    check: "Every PRECAUTION-tier code of the rider for this activity appears in the ACTIVE MedicalRelease's cleared_condition_codes."
    error_id: ERR_PRECAUTION_NOT_CLEARED
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 25
    category: business_referential
    check: "An instructor of record whose certification_level is IN_TRAINING requires a supervising_instructor_id, and the supervisor's INSTRUCTOR_TIER_ORDINAL must be strictly greater than the trainee's. Conversely, supervising_instructor_id must be omitted or null when the instructor of record is not IN_TRAINING."
    error_id: ERR_SUPERVISOR_REQUIRED
    http_status: 422
    applies_to: "POST /sessions"
  - priority: 26
    category: business_safety
    check: "required_instructor_tier_evaluation passes: INSTRUCTOR_TIER_ORDINAL of the effective instructor >= the required ordinal."
    error_id: ERR_INSTRUCTOR_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{session_id}/confirm"
  - priority: 27
    category: business_safety
    check: "effective_load_lb (current_declared variant) <= Horse.max_load_lb. The comparison is INCLUSIVE - equality passes."
    error_id: ERR_HORSE_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /sessions"
  - priority: 28
    category: business_temporal
    check: "horse_interval_overlap finds no half-open intersection with another live session of the same horse."
    error_id: ERR_HORSE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 29
    category: business_temporal
    check: "horse_rest_interval: the gap to every adjacent live session of the same horse is >= HORSE_REST_INTERVAL_MINUTES."
    error_id: ERR_HORSE_REST_INTERVAL
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 30
    category: business_constraint
    check: "horse_capacity_gates day limbs: committed day session count + 1 <= HORSE_MAX_SESSIONS_PER_DAY AND committed day minutes + duration_minutes <= HORSE_MAX_MOUNTED_MINUTES_PER_DAY."
    error_id: ERR_HORSE_DAILY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /sessions"
  - priority: 31
    category: business_constraint
    check: "horse_capacity_gates week limb: committed week minutes + duration_minutes <= HORSE_MAX_MOUNTED_MINUTES_PER_WEEK."
    error_id: ERR_HORSE_WEEKLY_MINUTES_EXCEEDED
    http_status: 422
    applies_to: "POST /sessions"
  - priority: 32
    category: business_temporal
    check: "instructor_interval_overlap finds no half-open intersection with another live session naming the same instructor in either the instructor_id or supervising_instructor_id slot."
    error_id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /sessions"
  - priority: 33
    category: business_referential
    check: "crew_role must be one the rider actually needs: a SIDEWALKER assignment requires Rider.required_sidewalker_count > 0 and the count of ASSIGNED sidewalkers must still be below it; a LEADER assignment requires Rider.requires_leader true and no ASSIGNED leader yet."
    error_id: ERR_CREW_ROLE_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /sessions/{session_id}/crew-assignments"
  - priority: 34
    category: business_constraint
    check: "The same volunteer is not already ASSIGNED to this session in any role."
    error_id: ERR_DUPLICATE_CREW_ASSIGNMENT
    http_status: 409
    applies_to: "POST /sessions/{session_id}/crew-assignments"
  - priority: 35
    category: business_temporal
    check: "volunteer_interval_overlap finds no CLOSED-interval intersection with another live session this volunteer is already ASSIGNED to."
    error_id: ERR_VOLUNTEER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /sessions/{session_id}/crew-assignments"
  - priority: 36
    category: state
    check: "Volunteer.status must be ACTIVE (SUSPENDED or INACTIVE is rejected)."
    error_id: ERR_VOLUNTEER_SUSPENDED
    http_status: 409
    applies_to: "POST /sessions/{session_id}/crew-assignments"
  - priority: 37
    category: business_safety
    check: "Volunteer.age_years >= CREW_ROLE_MIN_AGE[crew_role]. Leaders must be older than sidewalkers, so a 15-year-old may sidewalk but not lead."
    error_id: ERR_VOLUNTEER_UNDER_AGE
    http_status: 422
    applies_to: "POST /sessions/{session_id}/crew-assignments, POST /volunteer-qualifications/{qualification_id}/sign-off"
  - priority: 38
    category: business_safety
    check: "The volunteer holds a VolunteerQualification for exactly this crew_role with derived status QUALIFIED. IN_TRAINING, EXPIRED and SUSPENDED all fail, and a SIDEWALKER qualification never authorises LEADER. Also covers POST /volunteer-qualifications/{qualification_id}/sign-off when training_hours < CREW_ROLE_MIN_TRAINING_HOURS[crew_role]."
    error_id: ERR_VOLUNTEER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /sessions/{session_id}/crew-assignments, POST /volunteer-qualifications/{qualification_id}/sign-off"
  - priority: 39
    category: business_safety
    check: "For crew_role SIDEWALKER, hold_type is required and must equal Rider.sidewalker_hold_type. For crew_role LEADER, hold_type must be omitted or null."
    error_id: ERR_HOLD_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /sessions/{session_id}/crew-assignments"
  - priority: 40
    category: business_constraint
    check: "Session.crew_satisfied must be true (exact counts on both limbs)."
    error_id: ERR_CREW_INCOMPLETE
    http_status: 409
    applies_to: "POST /sessions/{session_id}/confirm"
  - priority: 41
    category: business_fiscal
    check: "When preferred_grant_id is supplied it must pass grant_candidate_selection's eligibility filter for this rider and session date: status OPEN, period covering the session date, and both restrictions satisfied."
    error_id: ERR_GRANT_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /sessions/{session_id}/complete"
  - priority: 42
    category: business_fiscal
    check: "For a SESSION_FEE charge on a rider whose funding_mode is FUNDED_ONLY, the waterfall must leave zero remainder before the PRIVATE_PAY line."
    error_id: ERR_FUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /sessions/{session_id}/complete"
  - priority: 43
    category: business_fiscal
    check: "Instructor.ce_hours_accrued >= CERT_RENEWAL_CE_HOURS."
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /instructors/{instructor_id}/renew-certification"
  - priority: 44
    category: business_constraint
    check: "OCC - the supplied expected_<parent>_version equals the stored parent version. Evaluated LAST, so every other rung must already pass before a stale version can be observed."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sessions/{session_id}/crew-assignments, POST /riders/{rider_id}/assessments, POST /riders/{rider_id}/medical-releases"

# ===========================================================================
# 1.5 API Endpoint Table (75 endpoints)
# ===========================================================================
endpoints:
  # --- logical clock (test-driving surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly LOGICAL_CLOCK_DEFAULT_UTC = 2026-05-01T00:00:00Z, and it MUST NOT fall back to real wall-clock time at any point."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every derived status (release, certification, qualification, volunteer, assessment, grant, award) is re-evaluated on the next read"]

  # --- condition policy catalogue ---
  - method: POST
    path: "/condition-policies"
    description: "Declare the admissibility tier of one (condition_code, activity_type) pair."
    roles: [ProgramAdmin]
    code: 201
    input: [condition_code, activity_type, tier, "min_instructor_tier?"]
    output: ConditionPolicy
    side_effects: ["the pair becomes resolvable by precaution_tier_evaluation"]
  - method: GET
    path: "/condition-policies"
    description: "List condition policies."
    roles: [ProgramAdmin, Instructor, IntakeCoordinator]
    code: 200
    input: ["condition_code?", "activity_type?", "limit?", "offset?"]
    output: ConditionPolicy[]
    side_effects: []

  # --- riders ---
  - method: POST
    path: "/riders"
    description: "Register a rider in INTAKE."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [full_name, date_of_birth, weight_lb, household_income_band, demographic_group, program_code, condition_codes, "funding_mode?", "payer_rate_cents?"]
    output: Rider
    side_effects: ["Rider.status := INTAKE; assessment_status := NEVER_ASSESSED"]
  - method: GET
    path: "/riders/{rider_id}"
    description: "Read one rider with every derived field re-evaluated at the logical clock."
    roles: [IntakeCoordinator, ProgramAdmin, Instructor, BillingClerk]
    code: 200
    input: []
    output: Rider
    side_effects: []
  - method: GET
    path: "/riders"
    description: "List riders. Also the reverse-reachability channel for Rider.medical_hold_incident_id and Rider.active_release_id."
    roles: [IntakeCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: ["status?", "program_code?", "assessment_status?", "medical_hold_incident_id?", "active_release_id?", "limit?", "offset?"]
    output: Rider[]
    side_effects: []
  - method: PATCH
    path: "/riders/{rider_id}"
    description: "Update the mutable intake facts. Changing weight_lb is what makes the current_declared and at_assessment load variants diverge."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: ["weight_lb?", "household_income_band?", "condition_codes?", "funding_mode?", "payer_rate_cents?"]
    output: Rider
    side_effects: ["increments Rider.version by 1", "effective_load_lb and precaution_tier of every live session of this rider are re-derived on next read"]
  - method: POST
    path: "/riders/{rider_id}/activate"
    description: "Move a rider from INTAKE to ACTIVE."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Rider
    side_effects: ["Rider.status := ACTIVE", "increments Rider.version by 1"]
  - method: POST
    path: "/riders/{rider_id}/withdraw"
    description: "Withdraw a rider permanently."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: [reason]
    output: Rider
    side_effects: ["Rider.status := WITHDRAWN", "increments Rider.version by 1"]
  - method: POST
    path: "/riders/{rider_id}/medical-clearance"
    description: "Return a rider from MEDICAL_HOLD to ACTIVE against a named physician release."
    roles: [ProgramAdmin]
    code: 200
    input: [medical_release_id, note]
    output: Rider
    side_effects: ["Rider.status := ACTIVE", "increments Rider.version by 1"]

  # --- medical releases ---
  - method: POST
    path: "/riders/{rider_id}/medical-releases"
    description: "File a physician release. OCC parent is the Rider; filing supersedes the prior ACTIVE release."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [signed_on, physician_name, cleared_condition_codes, expected_rider_version]
    output: MedicalRelease
    side_effects: ["prior ACTIVE release gets superseded_at := logical clock", "Rider.active_release_id := the new release", "increments Rider.version by 1"]
  - method: GET
    path: "/medical-releases"
    description: "List releases; reverse-reachability channel for MedicalRelease.rider_id."
    roles: [IntakeCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: ["rider_id?", "status?", "limit?", "offset?"]
    output: MedicalRelease[]
    side_effects: []
  - method: GET
    path: "/medical-releases/{release_id}"
    description: "Read one release with status derived at the logical clock."
    roles: [IntakeCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: []
    output: MedicalRelease
    side_effects: []
  - method: POST
    path: "/medical-releases/{release_id}/revoke"
    description: "Revoke a release."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: MedicalRelease
    side_effects: ["revoked_at := logical clock", "Rider.active_release_id re-derived", "increments MedicalRelease.version by 1"]

  # --- assessments ---
  - method: POST
    path: "/riders/{rider_id}/assessments"
    description: "File an intake or annual reassessment. OCC parent is the Rider; filing supersedes the prior RECORDED assessment and rewrites the rider's crew requirement."
    roles: [Instructor, ProgramAdmin]
    code: 201
    input: [assessment_type, performed_on, balance_score, trunk_control_score, rider_weight_lb, backriding_required, expected_rider_version]
    output: Assessment
    side_effects: ["prior RECORDED assessment := SUPERSEDED", "Rider independence_level / crew requirement / backriding_required / assessment_next_due_at rewritten", "increments Rider.version by 1"]
  - method: GET
    path: "/assessments"
    description: "List assessments; reverse-reachability channel for Assessment.rider_id."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: ["rider_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/assessments/{assessment_id}"
    description: "Read one assessment."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  # --- horses ---
  - method: POST
    path: "/horses"
    description: "Register a horse; max_load_lb is derived immediately."
    roles: [ProgramAdmin]
    code: 201
    input: [name, body_weight_lb, tack_weight_lb]
    output: Horse
    side_effects: ["Horse.status := AVAILABLE", "max_load_lb := round(body_weight_lb * MAX_HORSE_LOAD_FRACTION, 2)"]
  - method: GET
    path: "/horses/{horse_id}"
    description: "Read one horse including its live workload counters."
    roles: [ProgramAdmin, Instructor, VolunteerCoordinator]
    code: 200
    input: []
    output: Horse
    side_effects: []
  - method: POST
    path: "/horses/{horse_id}/hold"
    description: "Place a manual vet or farrier hold."
    roles: [ProgramAdmin]
    code: 200
    input: [hold_type, release_at]
    output: Horse
    side_effects: ["Horse.status := hold_type", "hold_release_at := release_at", "hold_reason := MANUAL", "increments Horse.version by 1"]
  - method: POST
    path: "/horses/{horse_id}/release-hold"
    description: "Release a hold once the logical clock has reached hold_release_at."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Horse
    side_effects: ["Horse.status := AVAILABLE", "increments Horse.version by 1"]
  - method: GET
    path: "/horses/{horse_id}/workload"
    description: "Computed read of the horse work-load ledger for one date, in either the committed or the delivered variant."
    roles: [ProgramAdmin, Instructor]
    code: 200
    input: [on_date, "variant?"]
    output: { horse_id: string, on_date: string, week_start_date: string, variant: string, day_session_count: integer, day_minutes: integer, week_minutes: integer, week_remaining_minutes: integer, day_remaining_minutes: integer }
    side_effects: []

  # --- volunteers ---
  - method: POST
    path: "/volunteers"
    description: "Register a volunteer."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 201
    input: [full_name, date_of_birth, last_retraining_on]
    output: Volunteer
    side_effects: ["age_years and retraining_due_at derived"]
  - method: GET
    path: "/volunteers/{volunteer_id}"
    description: "Read one volunteer with status derived at the logical clock."
    roles: [VolunteerCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/volunteers/{volunteer_id}/qualifications"
    description: "Open a role qualification in IN_TRAINING."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 201
    input: [crew_role, training_hours]
    output: VolunteerQualification
    side_effects: ["VolunteerQualification.status := IN_TRAINING"]
  - method: GET
    path: "/volunteer-qualifications"
    description: "List qualifications; reverse-reachability channel for VolunteerQualification.volunteer_id."
    roles: [VolunteerCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: ["volunteer_id?", "crew_role?", "status?", "limit?", "offset?"]
    output: VolunteerQualification[]
    side_effects: []
  - method: GET
    path: "/volunteer-qualifications/{qualification_id}"
    description: "Read one qualification."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: VolunteerQualification
    side_effects: []
  - method: POST
    path: "/volunteer-qualifications/{qualification_id}/sign-off"
    description: "Competency sign-off moving IN_TRAINING to QUALIFIED."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 200
    input: [signed_off_on]
    output: VolunteerQualification
    side_effects: ["signed_off_on and expires_at set", "increments VolunteerQualification.version by 1"]
  - method: POST
    path: "/volunteers/{volunteer_id}/retraining"
    description: "Record the annual re-training; renews the volunteer and every EXPIRED qualification."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 200
    input: [completed_on]
    output: Volunteer
    side_effects: ["last_retraining_on and retraining_due_at updated", "every EXPIRED VolunteerQualification is re-signed with expires_at := completed_on + QUALIFICATION_VALIDITY_DAYS days", "increments Volunteer.version by 1"]
  - method: GET
    path: "/volunteers/{volunteer_id}/service-hours"
    description: "Computed read of volunteer service hours over a closed date range, in either the scheduled or the delivered variant."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 200
    input: [period_start, period_end, variant]
    output: { volunteer_id: string, period_start: string, period_end: string, variant: string, service_hours: number, session_count: integer }
    side_effects: []

  # --- instructors ---
  - method: POST
    path: "/instructors"
    description: "Register an instructor at a PATH certification tier."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, certification_level, certification_expires_at, "supervisor_instructor_id?"]
    output: Instructor
    side_effects: ["certification_status derived at the logical clock"]
  - method: GET
    path: "/instructors/{instructor_id}"
    description: "Read one instructor with certification_status derived at the logical clock."
    roles: [ProgramAdmin, Instructor, VolunteerCoordinator]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors"
    description: "List instructors; reverse-reachability channel for the self-referential Instructor.supervisor_instructor_id."
    roles: [ProgramAdmin, Instructor]
    code: 200
    input: ["certification_status?", "certification_level?", "supervisor_instructor_id?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []
  - method: POST
    path: "/instructors/{instructor_id}/ce-hours"
    description: "Accrue continuing-education hours toward the renewal requirement."
    roles: [ProgramAdmin]
    code: 200
    input: [hours, completed_on]
    output: Instructor
    side_effects: ["ce_hours_accrued += hours", "increments Instructor.version by 1"]
  - method: POST
    path: "/instructors/{instructor_id}/renew-certification"
    description: "Renew a GRACE or LAPSED certification once CERT_RENEWAL_CE_HOURS have been accrued."
    roles: [ProgramAdmin]
    code: 200
    input: [renewed_on]
    output: Instructor
    side_effects: ["certification_expires_at := renewed_on + CERT_VALIDITY_DAYS days", "ce_hours_accrued := 0", "increments Instructor.version by 1"]

  # --- sessions ---
  - method: POST
    path: "/sessions"
    description: "Book a horse-rider match. Runs gate_precedence 1-5 and ladder rungs 19-32."
    roles: [Instructor, ProgramAdmin]
    code: 201
    input: [rider_id, horse_id, instructor_id, activity_type, scheduled_start, duration_minutes, "supervising_instructor_id?"]
    output: Session
    side_effects: ["Session.schedule_status := CREW_PENDING; billing_status := UNBILLED", "the horse's committed day and week minutes rise by duration_minutes", "quoted_fee_cents, effective_load_lb, precaution_tier, required_instructor_tier derived"]
  - method: GET
    path: "/sessions/{session_id}"
    description: "Read one session with both status axes and every derived field."
    roles: [Instructor, ProgramAdmin, VolunteerCoordinator, BillingClerk, IntakeCoordinator]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: GET
    path: "/sessions"
    description: "List sessions; reverse-reachability channel for rider_id, horse_id, instructor_id and supervising_instructor_id."
    roles: [Instructor, ProgramAdmin, VolunteerCoordinator, BillingClerk]
    code: 200
    input: ["rider_id?", "horse_id?", "instructor_id?", "supervising_instructor_id?", "schedule_status?", "billing_status?", "on_date?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: GET
    path: "/sessions/{session_id}/eligibility"
    description: "Computed read of the whole admissibility picture. variant selects which instant the release and certification clocks are evaluated at and which rider weight the load uses; allowed values are current_declared, at_assessment, at_booking_instant and at_ride_instant, defaulting to current_declared."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: ["variant?"]
    output: { session_id: string, variant: string, admissible: boolean, blocking_gate: string, precaution_tier: string, required_instructor_tier: string, instructor_certification_status: string, release_status: string, effective_load_lb: number, horse_max_load_lb: number, crew_satisfied: boolean, required_sidewalker_count: integer, requires_leader: boolean, sidewalker_hold_type: string, quoted_fee_cents: integer }
    side_effects: []
  - method: POST
    path: "/sessions/{session_id}/crew-assignments"
    description: "Assign a leader or sidewalker. OCC parent is the Session."
    roles: [VolunteerCoordinator, ProgramAdmin, Instructor]
    code: 201
    input: [volunteer_id, crew_role, expected_session_version, "hold_type?"]
    output: CrewAssignment
    side_effects: ["CrewAssignment.status := ASSIGNED", "Session.crew_satisfied re-derived", "Volunteer.open_assignment_count re-derived", "increments Session.version by 1"]
  - method: GET
    path: "/crew-assignments"
    description: "List crew assignments; reverse-reachability channel for session_id and volunteer_id."
    roles: [VolunteerCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: ["session_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/crew-assignments/{assignment_id}"
    description: "Read one crew assignment."
    roles: [VolunteerCoordinator, ProgramAdmin, Instructor]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/crew-assignments/{assignment_id}/release"
    description: "Release a volunteer from a session. When the release drops the session below crew minimum a CONFIRMED session reverts to CREW_PENDING."
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 200
    input: [reason]
    output: CrewAssignment
    side_effects: ["CrewAssignment.status := RELEASED", "Session.crew_satisfied re-derived", "Session.schedule_status CONFIRMED -> CREW_PENDING when crew_satisfied becomes false", "Volunteer.open_assignment_count re-derived", "increments CrewAssignment.version by 1"]
  - method: POST
    path: "/sessions/{session_id}/confirm"
    description: "Confirm a fully crewed session."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["Session.schedule_status := CONFIRMED", "increments Session.version by 1"]
  - method: POST
    path: "/sessions/{session_id}/complete"
    description: "Complete a ridden session, create the SESSION_FEE charge and run the funding waterfall. Must be called by the session's own instructor."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: [mounted_minutes, "preferred_grant_id?"]
    output: Session
    side_effects: ["Session.schedule_status := COMPLETED; mounted_minutes and service_hours set", "creates one Charge with charge_type SESSION_FEE", "creates FundingAllocation lines in FUNDING_WATERFALL_ORDER", "Grant.allocated_amount_cents and ScholarshipAward.period_used_cents rise", "Session.billing_status := FUNDED or CHARGED", "increments Session.version by 1"]
  - method: POST
    path: "/sessions/{session_id}/cancel"
    description: "Cancel a session. cancellation_reason accepts RIDER_REQUEST, WEATHER, HORSE_PULLED or PROGRAM_CLOSURE; the stored reason class is DERIVED from it and the notice window."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: [cancellation_reason]
    output: Session
    side_effects: ["Session.schedule_status := CANCELLED and cancellation_reason := the derived class", "every ASSIGNED CrewAssignment becomes RELEASED", "horse committed capacity released", "a LATE_CANCELLATION_FEE Charge is created only for the derived class LATE_RIDER", "increments Session.version by 1"]
  - method: POST
    path: "/sessions/{session_id}/no-show"
    description: "Record a rider no-show once the clock has reached scheduled_start."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["Session.schedule_status := NO_SHOW", "creates a NO_SHOW_FEE Charge funded WITHOUT grant or scholarship", "every ASSIGNED CrewAssignment becomes RELEASED", "increments Session.version by 1"]

  # --- goals and progress ---
  - method: POST
    path: "/riders/{rider_id}/goals"
    description: "Open a measurable goal in a domain."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 201
    input: [domain, objective, baseline_rating, target_rating]
    output: Goal
    side_effects: ["Goal.status := ACTIVE; stale_after := created_at + GOAL_STALE_AFTER_DAYS days"]
  - method: GET
    path: "/goals"
    description: "List goals; reverse-reachability channel for Goal.rider_id."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: ["rider_id?", "status?", "domain?", "limit?", "offset?"]
    output: Goal[]
    side_effects: []
  - method: GET
    path: "/goals/{goal_id}"
    description: "Read one goal."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: []
    output: Goal
    side_effects: []
  - method: POST
    path: "/goals/{goal_id}/discontinue"
    description: "Discontinue a goal permanently."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: [reason]
    output: Goal
    side_effects: ["Goal.status := DISCONTINUED", "Rider.goals_met_count re-derived", "increments Goal.version by 1"]
  - method: POST
    path: "/goals/{goal_id}/reopen"
    description: "Reopen a MET goal, clearing its consecutive hit counter."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: [reason]
    output: Goal
    side_effects: ["Goal.status := ACTIVE; consecutive_target_hits := 0", "Rider.goals_met_count re-derived", "increments Goal.version by 1"]
  - method: POST
    path: "/sessions/{session_id}/progress-notes"
    description: "Draft a progress note against a completed session. author_instructor_id is taken from X-User-ID."
    roles: [Instructor]
    code: 201
    input: [narrative, goal_ratings]
    output: ProgressNote
    side_effects: ["ProgressNote.status := DRAFT; rider_id and author_instructor_id copied"]
  - method: GET
    path: "/progress-notes"
    description: "List notes; reverse-reachability channel for session_id, rider_id and author_instructor_id."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: ["session_id?", "rider_id?", "author_instructor_id?", "status?", "limit?", "offset?"]
    output: ProgressNote[]
    side_effects: []
  - method: GET
    path: "/progress-notes/{note_id}"
    description: "Read one progress note."
    roles: [Instructor, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: []
    output: ProgressNote
    side_effects: []
  - method: POST
    path: "/progress-notes/{note_id}/finalize"
    description: "Finalize a note, applying every goal rating. Routes to AMENDED instead of FINALIZED when a FINALIZED PeriodReport already covers the session date."
    roles: [Instructor]
    code: 200
    input: []
    output: ProgressNote
    side_effects: ["ProgressNote.status := FINALIZED or AMENDED", "every rated Goal has current_rating, last_rated_at, consecutive_target_hits updated", "STALE goals return to ACTIVE; goals reaching GOAL_MET_CONSECUTIVE_HITS move to MET", "Rider.goals_met_count re-derived", "PeriodReport.amendment_count += 1 on the AMENDED branch", "increments ProgressNote.version by 1"]
  - method: POST
    path: "/_ops/goal-staleness-sweep"
    description: "Ops-run checkpoint: move every ACTIVE goal whose stale_after has been reached to STALE. One-directional by construction."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { swept_count: integer, stale_goal_ids: array, evaluated_at: string }
    side_effects: ["each swept Goal.status := STALE and its version increments by 1"]

  # --- funding ---
  - method: POST
    path: "/grants"
    description: "Register a restricted grant with a fiscal period and optional program / demographic restrictions."
    roles: [ProgramAdmin]
    code: 201
    input: [grant_name, funder_name, awarded_amount_cents, period_start, period_end, "restricted_program_code?", "restricted_demographic?"]
    output: Grant
    side_effects: ["remaining_amount_cents := awarded_amount_cents; status := OPEN"]
  - method: GET
    path: "/grants/{grant_id}"
    description: "Read one grant with its live ledger."
    roles: [ProgramAdmin, BillingClerk]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: POST
    path: "/riders/{rider_id}/scholarship-awards"
    description: "Award a rider a percentage-of-fee scholarship with an absolute per-period cap. Filing supersedes any overlapping ACTIVE award."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [cap_pct, period_cap_cents, period_start, period_end]
    output: ScholarshipAward
    side_effects: ["prior overlapping ACTIVE award gets superseded_at := logical clock", "period_used_cents := 0; status := ACTIVE"]
  - method: GET
    path: "/scholarship-awards"
    description: "List awards; reverse-reachability channel for ScholarshipAward.rider_id."
    roles: [IntakeCoordinator, ProgramAdmin, BillingClerk]
    code: 200
    input: ["rider_id?", "status?", "limit?", "offset?"]
    output: ScholarshipAward[]
    side_effects: []
  - method: GET
    path: "/scholarship-awards/{award_id}"
    description: "Read one award with its live period ledger."
    roles: [IntakeCoordinator, ProgramAdmin, BillingClerk]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects: []
  - method: GET
    path: "/charges"
    description: "List charges; reverse-reachability channel for Charge.session_id."
    roles: [BillingClerk, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: ["session_id?", "status?", "charge_type?", "limit?", "offset?"]
    output: Charge[]
    side_effects: []
  - method: GET
    path: "/charges/{charge_id}"
    description: "Read one charge with its live allocation ledger."
    roles: [BillingClerk, ProgramAdmin, IntakeCoordinator]
    code: 200
    input: []
    output: Charge
    side_effects: []
  - method: POST
    path: "/charges/{charge_id}/reverse"
    description: "Reverse a charge. Hop 1 of charge_reversal_cascade."
    roles: [BillingClerk, ProgramAdmin]
    code: 200
    input: [reason]
    output: Charge
    side_effects: ["Charge.status := REVERSED and its ledger zeroed", "every FundingAllocation of the charge becomes RELEASED", "Grant and ScholarshipAward ledgers restored", "Session.billing_status := REVERSED", "the covering PeriodReport is amended or recomputed", "increments Charge.version by 1"]
  - method: GET
    path: "/funding-allocations"
    description: "List allocation lines; reverse-reachability channel for charge_id, grant_id and scholarship_award_id."
    roles: [BillingClerk, ProgramAdmin]
    code: 200
    input: ["charge_id?", "grant_id?", "scholarship_award_id?", "source_type?", "status?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []
  - method: GET
    path: "/funding-allocations/{allocation_id}"
    description: "Read one allocation line."
    roles: [BillingClerk, ProgramAdmin]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []

  # --- incidents ---
  - method: POST
    path: "/sessions/{session_id}/incidents"
    description: "File a safety incident. Severity, reporting deadline and every hold are derived; hop 1 of incident_hold_cascade."
    roles: [Instructor, ProgramAdmin]
    code: 201
    input: [incident_type, injury_reported, occurred_at, narrative, "implicated_volunteer_id?"]
    output: Incident
    side_effects: ["Incident.status := OPEN; severity, report_due_at, reported_late derived", "INCIDENT_HOLD_MATRIX holds applied to rider, horse, volunteer and instructor", "the rider's future live sessions are cancelled with reason RIDER_HOLD and their crew released", "increments Rider / Horse / Volunteer / Instructor versions by 1 where a hold landed"]
  - method: GET
    path: "/incidents"
    description: "List incidents; reverse-reachability channel for session_id and implicated_volunteer_id."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: ["session_id?", "implicated_volunteer_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/incidents/{incident_id}"
    description: "Read one incident."
    roles: [Instructor, ProgramAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/incidents/{incident_id}/review"
    description: "Open the review workflow. Every hold stays in force."
    roles: [ProgramAdmin]
    code: 200
    input: [reviewer_notes]
    output: Incident
    side_effects: ["Incident.status := UNDER_REVIEW", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{incident_id}/close"
    description: "Close the review and selectively lift the holds it placed."
    roles: [ProgramAdmin]
    code: 200
    input: [resolution, release_rider_hold, release_horse_hold, release_volunteer_suspension]
    output: Incident
    side_effects: ["Incident.status := CLOSED", "Rider.medical_hold_incident_id cleared when release_rider_hold is true - the rider stays MEDICAL_HOLD until POST /riders/{rider_id}/medical-clearance", "Horse.status := AVAILABLE when release_horse_hold is true", "Volunteer.suspended_until := null when release_volunteer_suspension is true", "the suspended Instructor is always released", "increments Incident.version by 1"]

  # --- reporting ---
  - method: POST
    path: "/period-reports"
    description: "Compute a DRAFT center period report over a closed date range."
    roles: [ProgramAdmin]
    code: 201
    input: [period_start, period_end]
    output: PeriodReport
    side_effects: ["every aggregate computed by the draft_live_recompute variant", "status := DRAFT"]
  - method: GET
    path: "/period-reports/{report_id}"
    description: "Read one report. A DRAFT recomputes live on every read; a FINALIZED one returns the frozen snapshot plus its amendment ledger."
    roles: [ProgramAdmin, BillingClerk]
    code: 200
    input: []
    output: PeriodReport
    side_effects: []
  - method: POST
    path: "/period-reports/{report_id}/finalize"
    description: "Freeze the report. Afterwards the finalized_period_gate blocks new work in the period and every late-arriving money change routes to the amendment ledger."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PeriodReport
    side_effects: ["every aggregate recomputed once and frozen", "status := FINALIZED; finalized_at := logical clock", "increments PeriodReport.version by 1"]

# ===========================================================================
# 1.6 Error Code Catalog (40 codes; every one reachable from §1.5)
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the RBAC matrix."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The role is not in the endpoint's roles set, or an Instructor other than Session.instructor_id calls POST /sessions/{session_id}/complete, or an Instructor other than ProgressNote.author_instructor_id calls POST /progress-notes/{note_id}/finalize."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is missing, a type or numeric range is violated, a date-only field is not YYYY-MM-DD, an instant does not parse, period_end < period_start, target_rating <= baseline_rating, mounted_minutes > duration_minutes, or a pagination parameter is out of [1,100] / negative. Also every invalid QUERY-parameter enum value."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "A request BODY field named in ENUM_ERROR_FIELD_LIST carries a value outside its declared member set. This is a CLOSED list - no other field routes here."
  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "A {rider_id} path segment or a rider_id body field names no Rider."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "A {session_id} path segment names no Session."
  - id: ERR_HORSE_NOT_FOUND
    http: 404
    condition: "A {horse_id} path segment or a horse_id body field names no Horse."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Any other path or body identifier - release, assessment, volunteer, qualification, instructor, supervising instructor, assignment, goal, note, grant, award, charge, allocation, incident, report - names nothing."
  - id: ERR_INCIDENT_HOLD_ACTIVE
    http: 409
    condition: "GATE 1. A rider, horse, volunteer or instructor touched by the write carries a hold from an Incident whose status is OPEN or UNDER_REVIEW."
  - id: ERR_REPORT_FINALIZED
    http: 409
    condition: "GATE 2. New or newly-completed work would land inside a FINALIZED PeriodReport's period, a new report's period would overlap a FINALIZED one, or an already FINALIZED report is finalized again."
  - id: ERR_HORSE_ON_HOLD
    http: 409
    condition: "GATE 3. Horse.status is VET_HOLD, FARRIER_HOLD or REST_HOLD."
  - id: ERR_INSTRUCTOR_CERT_LAPSED
    http: 409
    condition: "GATE 4. The instructor of record or the supervising instructor is LAPSED or SUSPENDED, or is in GRACE on an endpoint that demands CURRENT."
  - id: ERR_RELEASE_MISSING
    http: 422
    condition: "GATE 5, missing limb. The rider has no MedicalRelease at all."
  - id: ERR_RELEASE_EXPIRED
    http: 422
    condition: "GATE 5, stale limb. The rider's most recent MedicalRelease is EXPIRED, REVOKED or SUPERSEDED at the logical clock."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a from-state that the requested transition declares - includes a second confirm, cancelling a CANCELLED session, a no-show before scheduled_start or on a non-CONFIRMED session, reversing a REVERSED charge, signing off a QUALIFIED qualification, reviewing an UNDER_REVIEW incident, closing an OPEN incident, finalizing a FINALIZED note, discontinuing a DISCONTINUED goal, reopening a non-MET goal, rating a DISCONTINUED goal, releasing a hold before hold_release_at, and withdrawing a rider who still holds CREW_PENDING or CONFIRMED sessions."
  - id: ERR_RIDER_NOT_ACTIVE
    http: 409
    condition: "Rider.status is INTAKE, MEDICAL_HOLD or WITHDRAWN on an endpoint that requires ACTIVE."
  - id: ERR_REASSESSMENT_OVERDUE
    http: 422
    condition: "Rider.assessment_status is OVERDUE or NEVER_ASSESSED when a session is booked or confirmed."
  - id: ERR_CONDITION_POLICY_MISSING
    http: 422
    condition: "A code in Rider.condition_codes has no ConditionPolicy row for the session's activity_type."
  - id: ERR_CONDITION_CONTRAINDICATED
    http: 422
    condition: "A code in Rider.condition_codes is CONTRAINDICATION-tier for this activity_type. Physician clearance never lifts it."
  - id: ERR_PRECAUTION_NOT_CLEARED
    http: 422
    condition: "A PRECAUTION-tier code for this activity_type is absent from the ACTIVE release's cleared_condition_codes."
  - id: ERR_SUPERVISOR_REQUIRED
    http: 422
    condition: "An IN_TRAINING instructor of record has no supervising_instructor_id, the named supervisor's tier ordinal is not strictly greater than the trainee's, or a supervising_instructor_id was supplied for a non-IN_TRAINING instructor."
  - id: ERR_INSTRUCTOR_TIER_INSUFFICIENT
    http: 422
    condition: "The effective instructor's INSTRUCTOR_TIER_ORDINAL is below the maximum min_instructor_tier demanded by the rider's PRECAUTION-tier codes for this activity."
  - id: ERR_HORSE_LOAD_EXCEEDED
    http: 422
    condition: "effective_load_lb is strictly greater than Horse.max_load_lb. Equality passes."
  - id: ERR_HORSE_SCHEDULE_CONFLICT
    http: 409
    condition: "The new half-open interval intersects another live session of the same horse."
  - id: ERR_HORSE_REST_INTERVAL
    http: 409
    condition: "The new session does not overlap but leaves a gap of strictly less than HORSE_REST_INTERVAL_MINUTES to an adjacent session of the same horse."
  - id: ERR_HORSE_DAILY_LIMIT_EXCEEDED
    http: 422
    condition: "The horse would exceed HORSE_MAX_SESSIONS_PER_DAY sessions or HORSE_MAX_MOUNTED_MINUTES_PER_DAY committed minutes on the session date."
  - id: ERR_HORSE_WEEKLY_MINUTES_EXCEEDED
    http: 422
    condition: "The horse would exceed HORSE_MAX_MOUNTED_MINUTES_PER_WEEK committed minutes in the MONDAY-based week containing the session date."
  - id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "The new half-open interval intersects another live session naming the same instructor in either instructor slot."
  - id: ERR_CREW_ROLE_NOT_REQUIRED
    http: 422
    condition: "The requested crew_role is not needed by the rider, or the required count for that role is already filled by ASSIGNED crew."
  - id: ERR_DUPLICATE_CREW_ASSIGNMENT
    http: 409
    condition: "The volunteer already holds an ASSIGNED CrewAssignment on this session."
  - id: ERR_VOLUNTEER_SCHEDULE_CONFLICT
    http: 409
    condition: "The volunteer's closed session interval touches or overlaps another live session they are already ASSIGNED to."
  - id: ERR_VOLUNTEER_SUSPENDED
    http: 409
    condition: "Volunteer.status is SUSPENDED or INACTIVE. REACHABILITY NOTE: a volunteer whose SUSPENDED state was placed by an OPEN or UNDER_REVIEW Incident is caught earlier by GATE 1 and yields ERR_INCIDENT_HOLD_ACTIVE instead; this error is therefore observed through the INACTIVE limb (retraining_due_at reached) or through a SUSPENDED volunteer whose incident has already been CLOSED without lifting the suspension."
  - id: ERR_VOLUNTEER_UNDER_AGE
    http: 422
    condition: "Volunteer.age_years is below CREW_ROLE_MIN_AGE[crew_role]."
  - id: ERR_VOLUNTEER_NOT_QUALIFIED
    http: 422
    condition: "The volunteer holds no QUALIFIED VolunteerQualification for exactly this crew_role (missing, IN_TRAINING, EXPIRED or SUSPENDED), or a sign-off is attempted below CREW_ROLE_MIN_TRAINING_HOURS[crew_role]."
  - id: ERR_HOLD_TYPE_MISMATCH
    http: 422
    condition: "A SIDEWALKER assignment omits hold_type or supplies one that differs from Rider.sidewalker_hold_type, or a LEADER assignment supplies a hold_type."
  - id: ERR_CREW_INCOMPLETE
    http: 409
    condition: "Confirm was attempted while Session.crew_satisfied is false."
  - id: ERR_GRANT_RESTRICTION_VIOLATION
    http: 422
    condition: "preferred_grant_id names a grant that fails the eligibility filter for this rider and session date - EXHAUSTED, period not covering the date, or a program / demographic restriction the rider does not match."
  - id: ERR_FUNDS_EXHAUSTED
    http: 422
    condition: "A SESSION_FEE charge for a FUNDED_ONLY rider leaves a non-zero remainder after GRANT, SCHOLARSHIP, SLIDING_SCALE and PAYER."
  - id: ERR_CE_HOURS_INSUFFICIENT
    http: 422
    condition: "Renewal attempted with ce_hours_accrued below CERT_RENEWAL_CE_HOURS."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_session_version or expected_rider_version differs from the stored parent version."

# ===========================================================================
# 1.7 RBAC Matrix (segregation of duties)
# ===========================================================================
roles:
  - name: ProgramAdmin
    description: "Center operations lead. Owns the barn, the certification register, the money register and the reporting period. The only role that may review or close an incident, and the only role that may finalize a period report."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /condition-policies"
      - "POST /horses"
      - "POST /horses/{horse_id}/hold"
      - "POST /horses/{horse_id}/release-hold"
      - "POST /instructors"
      - "POST /instructors/{instructor_id}/ce-hours"
      - "POST /instructors/{instructor_id}/renew-certification"
      - "POST /grants"
      - "POST /medical-releases/{release_id}/revoke"
      - "POST /riders/{rider_id}/medical-clearance"
      - "POST /incidents/{incident_id}/review"
      - "POST /incidents/{incident_id}/close"
      - "POST /period-reports"
      - "POST /period-reports/{report_id}/finalize"
      - "POST /_ops/goal-staleness-sweep"
    shared_operations:
      - "every rider, assessment, release, volunteer, qualification, session, crew, goal, note, funding and reporting read"
      - "POST /riders, PATCH /riders/{rider_id}, POST /riders/{rider_id}/activate, POST /riders/{rider_id}/withdraw"
      - "POST /riders/{rider_id}/medical-releases, POST /riders/{rider_id}/assessments"
      - "POST /volunteers, POST /volunteers/{volunteer_id}/qualifications, POST /volunteer-qualifications/{qualification_id}/sign-off, POST /volunteers/{volunteer_id}/retraining"
      - "POST /sessions and every session action"
      - "POST /sessions/{session_id}/crew-assignments, POST /crew-assignments/{assignment_id}/release"
      - "POST /riders/{rider_id}/goals, POST /goals/{goal_id}/discontinue, POST /goals/{goal_id}/reopen"
      - "POST /riders/{rider_id}/scholarship-awards, POST /charges/{charge_id}/reverse"
      - "POST /sessions/{session_id}/incidents"
  - name: Instructor
    description: "PATH-certified instructor. Books and runs sessions, files assessments, opens and finalizes progress notes, files incidents. X-User-ID identifies the acting Instructor row and is compared against Session.instructor_id and ProgressNote.author_instructor_id."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /sessions/{session_id}/progress-notes"
      - "POST /progress-notes/{note_id}/finalize"
    shared_operations:
      - "POST /riders/{rider_id}/assessments"
      - "POST /sessions, POST /sessions/{session_id}/confirm, POST /sessions/{session_id}/complete, POST /sessions/{session_id}/cancel, POST /sessions/{session_id}/no-show"
      - "POST /sessions/{session_id}/crew-assignments"
      - "POST /riders/{rider_id}/goals, POST /goals/{goal_id}/discontinue, POST /goals/{goal_id}/reopen"
      - "POST /sessions/{session_id}/incidents"
      - "session, rider, horse, volunteer, instructor, goal, note and eligibility reads"
  - name: VolunteerCoordinator
    description: "Owns the volunteer roster, the qualification matrix and session crewing. Cannot book, confirm, complete or cancel a session."
    identity: opaque
    exclusive_operations:
      - "POST /crew-assignments/{assignment_id}/release"
      - "POST /volunteers/{volunteer_id}/retraining"
      - "GET /volunteers/{volunteer_id}/service-hours"
    shared_operations:
      - "POST /volunteers, POST /volunteers/{volunteer_id}/qualifications, POST /volunteer-qualifications/{qualification_id}/sign-off"
      - "POST /sessions/{session_id}/crew-assignments"
      - "volunteer, qualification, crew, horse, instructor and session reads"
  - name: IntakeCoordinator
    description: "Owns rider intake, physician releases, goals and scholarship awards. Cannot touch the barn, certification register or incident review."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /riders, PATCH /riders/{rider_id}, POST /riders/{rider_id}/activate, POST /riders/{rider_id}/withdraw"
      - "POST /riders/{rider_id}/medical-releases"
      - "POST /riders/{rider_id}/goals"
      - "POST /riders/{rider_id}/scholarship-awards"
      - "POST /sessions/{session_id}/cancel"
      - "rider, release, assessment, goal, note, condition-policy, session, charge and award reads"
  - name: BillingClerk
    description: "Owns the money register. Reverses charges and reads every funding artefact. Segregation of duties: the clerk may never create, complete or cancel the session whose charge they reverse."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /charges/{charge_id}/reverse"
      - "charge, allocation, grant, award, session, rider and period-report reads"
