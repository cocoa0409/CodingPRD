- section: endpoints
  instances:
  - name: response_envelope_success_and_error_shape
    claim_type: envelope_shape
    grounds:
    - response_envelope
    distinguishing_aspect: Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type object/array
      and data; error responses carry response_type error with data.error_id and data.message.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: ENV
        as: PeopleOpsAdmin
        captures:
          rid: $.data.id
      - call: GET /api/jurisdiction-rules/11111111-2222-4333-8444-555555555555
        payload: {}
        as: PeopleOpsAdmin
        captures:
          err: $.data.error_id
      assert:
      - 'Success envelope: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == object, data.id
        == ${rid}'
      - List endpoints use response_type == array with pagination fields limit/offset/total_count/has_more and defaults limit
        10, offset 0
      - 'Error envelope: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty'
  - name: suggested_allocation_computed_read
    claim_type: computed_read
    grounds:
    - endpoints GET /api/remediation-plans/{planId}/suggested-allocation
    excluded_because:
      difficulty_instance: allocation_strategy_variants_diverge
      rationale: Computed read exercised and asserted to the cent there.
- section: errors
  instances:
  - name: error_catalog_triggerability_sweep
    claim_type: violation_to_error
    grounds:
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    - errors[ERR_STALE_PLAN_VERSION]
    - errors[ERR_BUDGET_EXCEEDED]
    - errors[ERR_RANGE_DISCLOSURE_REQUIRED]
    distinguishing_aspect: Coverage map asserting every catalog error_id has at least one triggering test across §1.8 and
      §1.9; no orphan error codes.
    test_recipe:
      setup:
      - Pure audit instance — the mapping below is the claim; no API chain required beyond referencing the owning instances
      setup_api_calls: []
      trigger:
      - call: GET /api/pay-equity-studies
        payload: {}
        as: CompAnalyst
      assert:
      - 'Auth/existence/input: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (missing_auth_headers_rejected), ERR_INSUFFICIENT_PERMISSIONS
        (rbac_*), ERR_NOT_FOUND (study_get_unknown_id_returns_not_found), ERR_INVALID_REQUEST (study_create_missing_required_name_rejected),
        ERR_INVALID_WINDOW/ERR_INVALID_DUE_DATE (cycle_guards_and_full_flow_to_study_close), ERR_INVALID_INCREASE (adjustment_invalid_increase_rejected),
        ERR_INVALID_PIPELINE_RECORD (pipeline_invalid_record_rejected), ERR_RATIONALE_REQUIRED (finding_disposition_guards)'
      - 'OCC: ERR_STALE_GROUP_VERSION (model_run_create_occ_beats_state), ERR_STALE_PLAN_VERSION (occ_stale_plan_version_returns_412)'
      - 'State: ERR_STUDY_INVALID_STATE (study_close_from_draft_rejected), ERR_SNAPSHOT_LOCKED (snapshot_create_after_advance_locked),
        ERR_STUDY_NOT_MODELING (group_lock_requires_study_modeling), ERR_STUDY_NOT_IN_REMEDIATION (plan_creation_and_submit_guards),
        ERR_STUDY_NOT_MONITORING (cycle_create_requires_monitoring_study), ERR_STUDY_NOT_REPORTABLE (filing_late_submission_flag_boundary),
        ERR_NO_QUALIFYING_GROUPS (advance_without_qualifying_group_rejected), ERR_UNANALYZED_GROUPS (submit_legal_review_with_unanalyzed_group_rejected),
        ERR_GAPS_NOT_RESOLVED / ERR_PLAN_NOT_COMMITTED (begin_monitoring_guards), ERR_GAPS_NOT_CLOSED (close_privileged_study_with_actionable_gaps_rejected),
        ERR_GROUP_INVALID_STATE (group_lock_twice_rejected, run_create_on_draft_group_rejected, assign_to_locked_group_rejected),
        ERR_RUN_INVALID_STATE (run_finalize_and_supersede_guards), ERR_FINDING_INVALID_STATE (finding_disposition_guards),
        ERR_PLAN_INVALID_STATE / ERR_ADJUSTMENT_INVALID_STATE (occ_stale_plan_version_returns_412), ERR_PLAN_NOT_APPROVED
        (adjustment_decision_state_beats_budget, adjustment_decision_requires_plan_approved), ERR_FILING_INVALID_STATE (filing_lifecycle_terminal_lockdown_and_reopen_recompile),
        ERR_POSTING_INVALID_STATE (posting_close_min_duration_boundary), ERR_CYCLE_INVALID_STATE (cycle_guards_and_full_flow_to_study_close)'
      - 'Safety/temporal/constraint/fiscal: ERR_SELF_DECISION_FORBIDDEN and ERR_BUDGET_EXCEEDED (budget_exceeded_and_segregation_guards),
        ERR_RANGE_DISCLOSURE_REQUIRED / ERR_INVALID_SALARY_RANGE / ERR_RANGE_SPREAD_EXCEEDED (posting_publish_validation_ladder),
        ERR_EFFECTIVE_DATE_IN_PAST (adjustment_effective_date_in_past_rejected), ERR_MIN_POSTING_DURATION_NOT_MET (posting_close_min_duration_boundary),
        ERR_STUDY_PERIOD_OVERLAP (study_period_closed_interval_boundary_conflicts), ERR_MONITOR_WINDOW_OVERLAP (monitor_window_half_open_touching_allowed),
        ERR_DUPLICATE_* (snapshot_duplicate_employee_ref_rejected, group_duplicate_name_rejected, filing_late_submission_flag_boundary,
        jurisdiction_duplicate_code_rejected, posting_duplicate_ref_rejected), ERR_ACTIVE_PLAN_EXISTS / ERR_PLAN_EMPTY (plan_creation_and_submit_guards),
        ERR_CROSS_STUDY_REFERENCE (assign_cross_study_group_rejected), ERR_GROUP_CRITERIA_MISMATCH (assign_criteria_mismatch_rejected),
        ERR_GROUP_BELOW_MIN_SIZE (group_lock_below_min_size_rejected), ERR_FINDING_NOT_ACTIONABLE (finding_disposition_guards)'
