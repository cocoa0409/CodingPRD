              as_user_id: "eng-4001"
            - call: "POST /interference-coordinations/${coord_id}/revisions"
              payload: { proposed_channel_center_mhz: 3555.0, proposed_channel_width_mhz: 10.0, proposed_eirp_dbm: 41.0, guard_band_mhz: 2.0 }
              as: NetworkEngineer
              as_user_id: "eng-3001"
            - call: "POST /interference-coordinations/${coord_id}/responses"
              payload: { decision: "REQUEST_REVISION", revised_eirp_dbm: 40.0, note: "Still one dB too hot" }
