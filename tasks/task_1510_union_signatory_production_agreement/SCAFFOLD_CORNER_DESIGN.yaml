      - name: tier_never_downgrades_on_budget_decrease
        claim_type: conditional_validation
        grounds:
          - "calculations.budget_tier_selection"
          - "entities.Production.fields.agreement_tier"
        distinguishing_aspect: "After upgrading to MODIFIED_LOW_BUDGET (budget 40000000), revising back down to 10000000 keeps the tier MODIFIED_LOW_BUDGET and the bond requirement at 5000000 — tier ratchets up only."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING, bond POSTED 2500000; upgraded to MODIFIED_LOW_BUDGET via budget 40000000 (bond UNDERFUNDED)"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Cinquefoil LLC", fein: "20-0000028" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Cinq Foils", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 40000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v2: $.data.version } }
          trigger:
