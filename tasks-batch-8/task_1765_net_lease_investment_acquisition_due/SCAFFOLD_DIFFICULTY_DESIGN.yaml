  - rule_id: resource_temporal_overlap
    instances:
      - name: proration_period_half_open_interval_split_at_closing_date
        grounds:
          - calculations.proration_line
          - entities.Proration.fields.period_start
          - entities.Proration.fields.period_end
        distinguishing_aspect: |
          Interval semantics #1 — HALF-OPEN split on the Proration resource:
          [period_start, period_end) is split at closing_date with the closing
          day itself assigned to the BUYER (seller_days counts days strictly
          before closing). A BASE_RENT period [2026-09-01, 2026-10-01) with
          closing 2026-09-15 yields seller_days == 14 and buyer_days == 16;
          moving closing to 2026-09-01 yields seller_days == 0 (zero-width
          seller interval — empty-set edge) and buyer_days == 30.
