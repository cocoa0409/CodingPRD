              as: VolunteerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${hours_at_cap} == 8.0, exactly the VOLUNTEER_WEEKLY_HOUR_CAP and therefore admissible"
            - "VolunteerAssignment.${a1_id}.hours == 4.0 and VolunteerAssignment.${a2_id}.hours == 4.0"
            - "the response status is 409"
            - "${err_id} == \"ERR_VOLUNTEER_HOUR_CAP_EXCEEDED\""
            - "${err_id} != \"ERR_VOLUNTEER_TIME_CONFLICT\", the three sessions being on three different days"
            - "Volunteer.${vol_id}.scheduled_hours_week == 8.0, unchanged by the refusal"
            - "GET /recreation/volunteer-assignments?volunteer_id=${vol_id} returns total_count 2"
      - name: council_adoption_below_quorum_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_44_ERR_COUNCIL_QUORUM_NOT_MET
        distinguishing_aspect: "The quorum of 5 binds only the ADOPTED decision: a request with vote_count 4 cannot be adopted, yet the very same request is DEFERRED without complaint, and no program weight moves."
        test_recipe:
          setup:
