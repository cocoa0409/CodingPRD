      - name: validation_supersede_target_must_be_expired_and_outranks_the_active_listing_rule
        claim_type: priority_ordering
        grounds:
          - "validations.priority 34"
          - "validations.priority 35"
          - "errors[ERR_INVALID_SUPERSEDE_TARGET]"
          - "errors[ERR_LISTING_ALREADY_ACTIVE]"
          - "entities.ResaleListing.fields.supersedes_listing_id"
          - "endpoints.POST /resale-listings"
        distinguishing_aspect: >-
          With one LISTED listing on the unit, a POST that names it as supersedes_listing_id violates priority 34
          (the target is not EXPIRED) AND priority 35 (an active listing exists), and the lower number must win:
          422 ERR_INVALID_SUPERSEDE_TARGET, not 409 ERR_LISTING_ALREADY_ACTIVE. Dropping supersedes_listing_id
          from the very same body then leaves only priority 35 violated and flips the answer to 409, which proves
          the ordering rather than a fixed preference.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 and one grade-A size-M unit AUR-GOWN-001 retired with retirement_reason PLANNED_REFRESH"
            - "an OUTLET listing on that unit in state LISTED, created on 2026-08-03, at markdown_step 0"
            - "the unit's current version is re-read after the listing exists so the OCC token is fresh"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { unit1_v: "$.data.version" }
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_v}", channel: "OUTLET" }
              as: InventoryPlanner
              captures: { listing1_id: "$.data.id" }
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { unit1_v2: "$.data.version" }
          trigger:
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_v2}", channel: "PARTNER_RESALE", supersedes_listing_id: "${listing1_id}" }
              as: InventoryPlanner
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_v2}", channel: "PARTNER_RESALE" }
              as: InventoryPlanner
          assert:
            - "with supersedes_listing_id: HTTP 422 with error_id == ERR_INVALID_SUPERSEDE_TARGET"
            - "without supersedes_listing_id: HTTP 409 with error_id == ERR_LISTING_ALREADY_ACTIVE"
            - "GET /resale-listings?rental_unit_id=${unit1_id} returns total_count == 1"
            - "the surviving listing still reports state == LISTED and channel == OUTLET"
      - name: validation_second_outbound_shipment_for_one_reservation_is_refused
