              as: Player
              as_user_id: "${po1_id}"
              captures: { e3: $.data.error_id }
            - call: "GET /players/${po1_id}/pacing"
              payload: { variant: "REALIZED" }
              as: Player
              as_user_id: "${po1_id}"
            - call: "POST /purchases"
              payload: { player_id: "${po1_id}", offer_id: "${offer_id}", expected_offer_version: "${offer_v1}" }
