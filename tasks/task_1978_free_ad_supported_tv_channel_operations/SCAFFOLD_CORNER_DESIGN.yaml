            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { b1: $.data.id, b1_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { b2: $.data.id, b2_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 100000, daily_budget_cents: 500, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /v1/ad-breaks/${b1}/decision-runs", payload: { expected_break_version: "${b1_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${b2}/decision-runs", payload: { expected_break_version: "${b2_v}" }, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "b1 run creates exactly 1 DIRECT decision (slot 0; slot 1 would exceed the daily cap: 500+500 > 500)"
            - "b2 run creates 0 decision rows (daily spend 500 == cap 500: exact fit allowed only up to equality)"
            - "AdBreak.${b2}.break_status == DECIDED and slate_seconds == 60"

      - name: peak_concurrent_viewers_chronological_replay
        claim_type: correct_result
        grounds: ["calculations.peak_concurrent_viewers"]
        distinguishing_aspect: "Session replay is ordered by occurred_at_utc, not insertion order: posting the two SESSION_END rows BEFORE the five SESSION_START rows still yields peak 5."
        test_recipe:
          setup: ["Channel ch; platform p1; no loops needed (capacity 0 day)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch PK", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_END", viewer_session_id: "e1", occurred_at_utc: "2026-09-01T00:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_END", viewer_session_id: "e2", occurred_at_utc: "2026-09-01T00:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "v1", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "v2", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "v3", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "v4", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "v5", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
