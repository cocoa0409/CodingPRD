  # ------------------------------------------------- site inventory writes ---
  - method: POST
    path: "/jda/sites"
    description: "Add an agency-owned parcel to the joint development site inventory. The site starts in INVENTORIED with a null readiness score and a federal interest basis of 0."
    roles: [RealEstateOfficer]
    input: ["site_code", "name", "address_line", "parcel_area_sqft", "acquisition_funding_source", "federal_interest_pct", "transit_facility_present?"]  # types: { site_code: string, name: string, address_line: string, parcel_area_sqft: integer, acquisition_funding_source: enum, federal_interest_pct: number, transit_facility_present?: boolean }
    output: "AgencySite"
    side_effects:
      - "Create AgencySite with status = INVENTORIED, readiness_composite_score = null, readiness_tier = null, federal_interest_basis_cents = 0, federal_interest_encumbered_cents = 0, federal_interest_unencumbered_cents = 0, version = 1"
  - method: POST
    path: "/jda/sites/{id}/assessments"
    description: "Record a development readiness assessment against a site. The composite score is computed with the PRELIMINARY variant while the assessment is a DRAFT."
    roles: [RealEstateOfficer]
    input: ["environmental_score", "utility_score", "access_score", "entitlement_score", "encumbrance_count", "assessment_notes?"]  # types: { environmental_score: integer, utility_score: integer, access_score: integer, entitlement_score: integer, encumbrance_count: integer, assessment_notes?: string }
    output: "ReadinessAssessment"
    side_effects:
      - "Create ReadinessAssessment with status = DRAFT, variant_applied = PRELIMINARY, composite_score and tier per calculations.readiness_composite_score"
      - "Bump AgencySite.version by 1"
  - method: POST
    path: "/jda/assessments/{id}/certify"
    description: "Certify a draft readiness assessment. Recomputing under the CERTIFIED variant applies the federal-interest deduction, so the composite score and tier can move down at certification."
    roles: [RealEstateOfficer]
    input: []
    output: "ReadinessAssessment"
    side_effects:
      - "Recompute composite_score and tier with variant_applied = CERTIFIED (federal-interest deduction applied)"
      - "Set ReadinessAssessment.status = CERTIFIED and certified_at = current logical clock"
      - "Copy composite_score and tier onto AgencySite.readiness_composite_score and AgencySite.readiness_tier"
      - "Set AgencySite.status = ASSESSED when it was INVENTORIED"
      - "Bump AgencySite.version by 1"
  - method: POST
    path: "/jda/sites/{id}/release-for-solicitation"
    description: "Release an assessed site for solicitation. Requires readiness_tier == READY, i.e. a certified composite score of at least 70.00."
    roles: [RealEstateOfficer]
    input: []
    output: "AgencySite"
    side_effects:
      - "Set AgencySite.status = SOLICITATION_READY"
      - "Bump AgencySite.version by 1"
  - method: POST
    path: "/jda/sites/{id}/reopen-inventory"
    description: "Return a site to INVENTORIED so a fresh assessment can be taken. Clears the copied readiness fields; refused when an ISSUED solicitation exists on the site."
    roles: [RealEstateOfficer]
    input: ["reason"]  # types: { reason: string }
    output: "AgencySite"
    side_effects:
      - "Set AgencySite.status = INVENTORIED, readiness_composite_score = null, readiness_tier = null"
      - "Set every CERTIFIED ReadinessAssessment of the site to SUPERSEDED"
      - "Set every DRAFT Solicitation of the site to CANCELLED"
      - "Bump AgencySite.version by 1"

  # ------------------------------------------------------- developer write ---
  - method: POST
    path: "/jda/developers"
    description: "Register a development partner. Prequalification and debarment status are recorded once at registration and are not editable."
    roles: [RealEstateOfficer]
    input: ["legal_name", "contact_email", "prequalified?", "debarment_status?"]  # types: { legal_name: string, contact_email: string, prequalified?: boolean, debarment_status?: enum }
    output: "Developer"
    side_effects:
      - "Create Developer with version = 1"

  # ----------------------------------------------------- solicitation flow ---
  - method: POST
    path: "/jda/sites/{id}/solicitations"
    description: "Draft a solicitation for a site that is ready for solicitation."
    roles: [RealEstateOfficer]
    input: ["solicitation_type", "response_deadline", "benchmark_value_cents", "affordable_housing_min_pct", "min_proposals_required?", "joint_use_required?"]  # types: { solicitation_type: enum, response_deadline: datetime, benchmark_value_cents: integer, affordable_housing_min_pct: number, min_proposals_required?: integer, joint_use_required?: boolean }
    output: "Solicitation"
    side_effects:
      - "Create Solicitation with status = DRAFT, issued_at = null, responsive_proposal_count = 0"
  - method: POST
    path: "/jda/solicitations/{id}/issue"
    description: "Issue a drafted solicitation to the market. Requires the site to be SOLICITATION_READY and the response deadline to be in the future relative to the logical clock."
    roles: [RealEstateOfficer]
    input: []
    output: "Solicitation"
    side_effects:
      - "Set Solicitation.status = ISSUED and issued_at = current logical clock"
  - method: POST
    path: "/jda/solicitations/{id}/close"
    description: "Close an issued solicitation to further proposals. Refused with ERR_NO_RESPONSIVE_PROPOSALS when the count of SUBMITTED-or-SHORTLISTED proposals is strictly below min_proposals_required."
    roles: [RealEstateOfficer]
    input: []
    output: "Solicitation"
    side_effects:
      - "Recompute responsive_proposal_count as the number of proposals in status SUBMITTED or SHORTLISTED"
      - "Set Solicitation.status = CLOSED"
      - "Compute the evaluation score of every responsive proposal and assign rank per calculations.proposal_ranking"
  - method: POST
    path: "/jda/proposals/{id}/shortlist"
    description: "Move a submitted proposal onto the shortlist."
    roles: [RealEstateOfficer]
    input: []
    output: "Proposal"
    side_effects:
      - "Set Proposal.status = SHORTLISTED"
  - method: POST
    path: "/jda/solicitations/{id}/award"
    description: "Award a closed solicitation to one proposal and open the negotiated exclusive dealing period in a single act. Awarding anything other than rank 1 requires a deviation_justification."
    roles: [RealEstateOfficer]
    input: ["proposal_id", "negotiation_start_date", "negotiation_end_date", "deviation_justification?"]  # types: { proposal_id: string, negotiation_start_date: string, negotiation_end_date: string, deviation_justification?: string }
    output: "Solicitation"
    side_effects:
      - "Set Solicitation.status = AWARDED"
      - "Set the awarded Proposal.status = SELECTED"
      - "Set every other proposal of this solicitation whose status is SUBMITTED or SHORTLISTED to REJECTED"
      - "Create an ExclusiveNegotiationPeriod for (site, awarded proposal) with status = ACTIVE, extension_count = 0, start_date = negotiation_start_date, end_date = negotiation_end_date"
      - "Set AgencySite.status = UNDER_AGREEMENT and bump AgencySite.version by 1"
      - "Cascade: set every other Solicitation of the same site whose status is DRAFT or ISSUED to CANCELLED, and set every SUBMITTED or SHORTLISTED proposal of those cancelled solicitations to REJECTED"
  - method: POST
    path: "/jda/solicitations/{id}/proposals"
    description: "Submit a proposal to an issued solicitation. The caller must hold the Developer role and the body developer_id must equal X-User-ID."
    roles: [Developer]
    input: ["developer_id", "proposed_structure", "proposed_annual_rent_cents?", "proposed_purchase_price_cents?", "affordable_units", "total_units", "transit_ridership_uplift", "design_compliance_score", "joint_use_committed?"]  # types: { developer_id: string, proposed_structure: enum, proposed_annual_rent_cents?: integer, proposed_purchase_price_cents?: integer, affordable_units: integer, total_units: integer, transit_ridership_uplift: integer, design_compliance_score: integer, joint_use_committed?: boolean }
    output: "Proposal"
    side_effects:
      - "Create Proposal with status = SUBMITTED, rank = null, affordable_pct and evaluation_score per calculations.proposal_evaluation_score"
      - "Increment Solicitation.responsive_proposal_count by 1"

  # -------------------------------------------- exclusive dealing period ---
  - method: POST
    path: "/jda/sites/{id}/negotiation-periods"
    description: "Open an exclusive negotiation period directly against a site for an eligible proposal, used for sole-source and unsolicited-proposal paths that do not run through an award. Closed-closed overlap with any other ACTIVE or EXTENDED period on the same site is refused."
    roles: [RealEstateOfficer]
    input: ["proposal_id", "start_date", "end_date"]  # types: { proposal_id: string, start_date: string, end_date: string }
    output: "ExclusiveNegotiationPeriod"
    side_effects:
      - "Create ExclusiveNegotiationPeriod with status = ACTIVE and extension_count = 0"
      - "Set AgencySite.status = UNDER_AGREEMENT when it was SOLICITATION_READY, and bump AgencySite.version by 1"
  - method: POST
    path: "/jda/negotiation-periods/{id}/extend"
    description: "Extend an active exclusive negotiation period to a later end date. At most MAX_NEGOTIATION_EXTENSIONS (2) extensions are permitted, and the extended interval must still not collide closed-closed with another period on the same site."
    roles: [RealEstateOfficer]
    input: ["new_end_date"]  # types: { new_end_date: string }
    output: "ExclusiveNegotiationPeriod"
    side_effects:
      - "Set ExclusiveNegotiationPeriod.end_date = new_end_date"
      - "Increment ExclusiveNegotiationPeriod.extension_count by 1"
      - "Set ExclusiveNegotiationPeriod.status = EXTENDED"
  - method: POST
    path: "/jda/negotiation-periods/{id}/terminate"
    description: "Terminate an exclusive negotiation period before it expires, releasing the site back to the market."
    roles: [RealEstateOfficer]
    input: ["termination_reason"]  # types: { termination_reason: string }
    output: "ExclusiveNegotiationPeriod"
    side_effects:
      - "Set ExclusiveNegotiationPeriod.status = TERMINATED and termination_reason = the supplied reason"
      - "Set the associated Proposal.status = REJECTED when it was SELECTED"
      - "Set AgencySite.status = SOLICITATION_READY when no other ACTIVE or EXTENDED period remains on the site and the site has no agreement whose negotiation_status is EXECUTED, and bump AgencySite.version by 1"

  # ------------------------------------------------------------ valuation ---
  - method: POST
    path: "/jda/sites/{id}/valuations"
    description: "Record a fair market value determination for a site and derive the permissible transfer floor. Optimistically concurrent on the site: expected_site_version must equal the site's current version, else ERR_STALE_SITE_VERSION (412)."
    roles: [ValuationOfficer]
    input: ["method", "appraised_value_cents", "transit_supportive_use_pct", "affordable_units_pct", "transfer_basis", "effective_date", "expected_site_version"]  # types: { method: enum, appraised_value_cents: integer, transit_supportive_use_pct: number, affordable_units_pct: number, transfer_basis: enum, effective_date: string, expected_site_version: integer }
    output: "ValuationDetermination"
    side_effects:
      - "Create ValuationDetermination with status = DRAFT and transit_supportive_credit_cents, federal_interest_floor_cents and permissible_floor_cents per calculations.permissible_transfer_floor"
      - "Set AgencySite.federal_interest_basis_cents = round_half_up(appraised_value_cents * federal_interest_pct / 100) and AgencySite.federal_interest_unencumbered_cents = federal_interest_basis_cents - federal_interest_encumbered_cents"
      - "Bump AgencySite.version by 1"
  - method: POST
    path: "/jda/valuations/{id}/certify"
    description: "Certify a draft valuation so it can back an agreement. Only a CERTIFIED valuation may support an agreement submitted for review."
    roles: [ValuationOfficer]
    input: []
    output: "ValuationDetermination"
    side_effects:
      - "Set ValuationDetermination.status = CERTIFIED and certified_at = current logical clock"
      - "Set every other CERTIFIED valuation of the same site to SUPERSEDED"

  # --------------------------------------------------- agreement lifecycle ---
  - method: POST
    path: "/jda/agreements"
    description: "Draft a joint development agreement joining a site, a developer, the selected proposal and a valuation. Revenue to the agency and the consideration value are computed at draft time from the chosen structure."
    roles: [RealEstateOfficer]
    input: ["site_id", "developer_id", "proposal_id", "valuation_id", "structure", "term_years", "base_rent_cents?", "purchase_price_cents?", "revenue_share_pct", "projected_gross_revenue_cents", "affordable_units_committed", "total_units", "site_area_share_pct", "joint_use_committed?"]  # types: { site_id: string, developer_id: string, proposal_id: string, valuation_id: string, structure: enum, term_years: integer, base_rent_cents?: integer, purchase_price_cents?: integer, revenue_share_pct: number, projected_gross_revenue_cents: integer, affordable_units_committed: integer, total_units: integer, site_area_share_pct: number, joint_use_committed?: boolean }
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Create JointDevelopmentAgreement with negotiation_status = DRAFTING"
      - "Set federal_approval_status = NOT_REQUIRED when the site's federal_interest_pct == 0, else NOT_SUBMITTED"
      - "Compute capital_credit_cents and annual_revenue_to_agency_cents per calculations.annual_revenue_to_agency and consideration_value_cents per calculations.consideration_value"
  - method: PATCH
    path: "/jda/agreements/{id}"
    description: "Revise a drafting or revision-requested agreement. Every supplied field is re-run through the revenue and consideration calculations, and a rejected federal filing state is reset so the corrected agreement can be refiled."
    roles: [RealEstateOfficer]
    input: ["term_years?", "base_rent_cents?", "purchase_price_cents?", "revenue_share_pct?", "projected_gross_revenue_cents?", "affordable_units_committed?", "site_area_share_pct?"]  # types: { term_years?: integer, base_rent_cents?: integer, purchase_price_cents?: integer, revenue_share_pct?: number, projected_gross_revenue_cents?: integer, affordable_units_committed?: integer, site_area_share_pct?: number }
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Apply the supplied fields and recompute capital_credit_cents, annual_revenue_to_agency_cents and consideration_value_cents"
      - "Set negotiation_status = DRAFTING when it was REVISION_REQUESTED"
      - "Set federal_approval_status = NOT_SUBMITTED when it was FTA_REJECTED"
  - method: POST
    path: "/jda/agreements/{id}/submit-for-review"
    description: "Submit a drafting agreement for agency review. This is the gate that enforces the certified-valuation, affordable-commitment and permissible-floor tests, and it records the submitting operator identity for later segregation-of-duties enforcement."
    roles: [RealEstateOfficer]
    input: []
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Recompute capital_credit_cents, annual_revenue_to_agency_cents and consideration_value_cents from the stored inputs before the fiscal checks run (idempotent when nothing changed)"
      - "Set negotiation_status = AGENCY_REVIEW"
      - "Set submitted_by_user_id = the X-User-ID of the caller"
      - "Clear revision_notes"
  - method: POST
    path: "/jda/agreements/{id}/request-revision"
    description: "Send an agreement under agency review back to the real estate office for revision."
    roles: [BoardSecretary]
    input: ["revision_notes"]  # types: { revision_notes: string }
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Set negotiation_status = REVISION_REQUESTED and revision_notes = the supplied notes"
  - method: POST
    path: "/jda/agreements/{id}/board-approve"
    description: "Record board approval of an agreement under agency review. Refused when the approving operator identity equals the identity that submitted it (ERR_SEGREGATION_OF_DUTIES, 403)."
    roles: [BoardSecretary]
    input: ["resolution_number"]  # types: { resolution_number: string }
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Set negotiation_status = BOARD_APPROVED and board_resolution_number = the supplied resolution number"
  - method: POST
    path: "/jda/agreements/{id}/execute"
    description: "Execute a board-approved agreement. Requires the federal dimension to be NOT_REQUIRED or FTA_APPROVED and every transit facility replacement to be in place; the site outcome branches on structure."
    roles: [RealEstateOfficer]
    input: ["execution_date"]  # types: { execution_date: string }
    output: "JointDevelopmentAgreement"
    side_effects:
      - "Set negotiation_status = EXECUTED and execution_date = the supplied date"
      - "When structure == FEE_DISPOSITION: set AgencySite.status = CONVEYED"
      - "When structure == GROUND_LEASE: leave AgencySite.status = UNDER_AGREEMENT"
      - "Set the governing ExclusiveNegotiationPeriod.status = CONVERTED"
      - "Bump AgencySite.version by 1"

  # ------------------------------------------ federal grant compliance ---
  - method: POST
    path: "/jda/agreements/{id}/disposition-requests"
    description: "File a federal disposition request for an agreement over federally assisted property. Filing encumbers the site's remaining federal interest by the computed amount; the site must have enough unencumbered federal interest left."
    roles: [GrantsComplianceOfficer]
    input: ["narrative"]  # types: { narrative: string }
    output: "FederalDispositionRequest"
    side_effects:
      - "Create FederalDispositionRequest with determination = PENDING and federal_interest_amount_cents per calculations.federal_interest_amount"
      - "Set JointDevelopmentAgreement.federal_approval_status = SUBMITTED"
      - "Increase AgencySite.federal_interest_encumbered_cents by federal_interest_amount_cents and decrease AgencySite.federal_interest_unencumbered_cents by the same amount"
      - "Bump AgencySite.version by 1"
  - method: POST
    path: "/jda/disposition-requests/{id}/determination"
    description: "Record the federal grantor's determination on a pending disposition request. A REJECTED determination runs the compliance-reversal cascade: the agreement drops back to revision, its certified valuation is superseded, every approved staging window is suspended and its bays are returned to the shared facility, and the site's federal interest encumbrance is released."
    roles: [GrantsComplianceOfficer]
    input: ["determination", "condition_notes?"]  # types: { determination: enum, condition_notes?: string }
    output: "FederalDispositionRequest"
    side_effects:
      - "Set FederalDispositionRequest.determination and determined_at = current logical clock, and condition_notes when supplied"
      - "On APPROVED or APPROVED_WITH_CONDITIONS: set JointDevelopmentAgreement.federal_approval_status = FTA_APPROVED and leave the site encumbrance in place"
      - "On REJECTED, hop 2: set JointDevelopmentAgreement.federal_approval_status = FTA_REJECTED, and set negotiation_status = REVISION_REQUESTED when it was BOARD_APPROVED"
      - "On REJECTED, hop 3a: set the agreement's referenced ValuationDetermination.status = SUPERSEDED when it was CERTIFIED"
      - "On REJECTED, hop 3b: set every StagingWindow of the agreement whose status is APPROVED to SUSPENDED and capacity_released = true"
      - "On REJECTED, hop 4: recompute SharedFacility.available_bay_capacity for every facility touched by a suspended window and bump that facility's version by 1"
      - "On REJECTED, hop 5: decrease AgencySite.federal_interest_encumbered_cents by this request's federal_interest_amount_cents, increase AgencySite.federal_interest_unencumbered_cents by the same amount, and bump AgencySite.version by 1"
  - method: POST
    path: "/jda/disposition-requests/{id}/withdraw"
    description: "Withdraw a pending federal disposition request. The encumbrance the filing placed on the site's federal interest is released exactly, restoring the pre-filing ledger."
    roles: [GrantsComplianceOfficer]
    input: ["withdraw_reason"]  # types: { withdraw_reason: string }
    output: "FederalDispositionRequest"
    side_effects:
      - "Set FederalDispositionRequest.determination = WITHDRAWN, condition_notes = withdraw_reason and determined_at = current logical clock"
      - "Set JointDevelopmentAgreement.federal_approval_status = NOT_SUBMITTED"
      - "Decrease AgencySite.federal_interest_encumbered_cents by this request's federal_interest_amount_cents and increase AgencySite.federal_interest_unencumbered_cents by the same amount"
      - "Bump AgencySite.version by 1"

  # ------------------------------------------- transit facility replacement ---
  - method: POST
    path: "/jda/agreements/{id}/facility-replacements"
    description: "Commit to replacing a transit facility displaced by the development. The capacity deficit is derived at creation."
    roles: [TransitOperationsManager]
    input: ["facility_type", "original_capacity", "replacement_capacity", "interim_capacity", "milestone_date"]  # types: { facility_type: enum, original_capacity: integer, replacement_capacity: integer, interim_capacity: integer, milestone_date: string }
    output: "TransitFacilityReplacement"
    side_effects:
      - "Create TransitFacilityReplacement with status = PLANNED and capacity_deficit = max(0, original_capacity - replacement_capacity)"
  - method: POST
    path: "/jda/facility-replacements/{id}/status"
    description: "Advance a facility replacement. Reporting COMPLETE lands on COMPLETE only when capacity_deficit == 0; otherwise it lands on DEFICIENT, which blocks execution until the deficit is cured."
    roles: [TransitOperationsManager]
    input: ["status", "interim_capacity?", "replacement_capacity?"]  # types: { status: enum, interim_capacity?: integer, replacement_capacity?: integer }
    output: "TransitFacilityReplacement"
    side_effects:
      - "Apply interim_capacity and replacement_capacity when supplied and recompute capacity_deficit = max(0, original_capacity - replacement_capacity)"
      - "Set status = INTERIM_IN_PLACE, COMPLETE or DEFICIENT per the state machine (a COMPLETE report with capacity_deficit > 0 lands on DEFICIENT)"

  # ---------------------------------------- shared facilities and staging ---
  - method: POST
    path: "/jda/sites/{id}/shared-facilities"
    description: "Register a facility on the site that the agency and the developer will share, with the bay capacity available for construction staging and the maintenance cost responsibility."
    roles: [TransitOperationsManager]
    input: ["facility_type", "total_bay_capacity", "maintenance_responsibility", "cost_share_pct_developer?"]  # types: { facility_type: enum, total_bay_capacity: integer, maintenance_responsibility: enum, cost_share_pct_developer?: number }
    output: "SharedFacility"
    side_effects:
      - "Create SharedFacility with available_bay_capacity = total_bay_capacity and version = 1"
  - method: POST
    path: "/jda/staging-windows"
    description: "Request a construction staging window on a shared facility. Optimistically concurrent on the facility: expected_facility_version must equal the facility's current version, else ERR_STALE_FACILITY_VERSION (412). The interval is half-open [start_at, end_at), so a window that starts exactly when another ends never conflicts."
    roles: [Developer]
    input: ["jda_id", "shared_facility_id", "start_at", "end_at", "bays_occupied", "purpose", "expected_facility_version"]  # types: { jda_id: string, shared_facility_id: string, start_at: datetime, end_at: datetime, bays_occupied: integer, purpose: string, expected_facility_version: integer }
    output: "StagingWindow"
    side_effects:
      - "Create StagingWindow with status = REQUESTED and capacity_released = false"
      - "Bump SharedFacility.version by 1"
  - method: POST
    path: "/jda/staging-windows/{id}/decision"
    description: "Approve or reject a requested staging window. Approval re-checks half-open aggregate bay capacity against the already-approved windows and consumes the requested bays; rejection consumes nothing."
    roles: [TransitOperationsManager]
    input: ["decision", "rejection_reason?"]  # types: { decision: enum, rejection_reason?: string }
    output: "StagingWindow"
    side_effects:
      - "On APPROVE: set StagingWindow.status = APPROVED, recompute SharedFacility.available_bay_capacity per calculations.staging_capacity_availability and bump the facility's version by 1"
      - "On REJECT: set StagingWindow.status = REJECTED and rejection_reason = the supplied reason, and leave SharedFacility.available_bay_capacity and version untouched"
  - method: POST
    path: "/jda/staging-windows/{id}/close"
    description: "Close an approved or suspended staging window once staging is finished, returning its bays to the shared facility exactly once."
    roles: [TransitOperationsManager]
    input: []
    output: "StagingWindow"
    side_effects:
      - "Set StagingWindow.status = CLOSED and capacity_released = true"
      - "Recompute SharedFacility.available_bay_capacity per calculations.staging_capacity_availability and bump the facility's version by 1 only when capacity_released was false before this call"
  - method: POST
    path: "/jda/shared-facilities/{id}/maintenance-charges"
    description: "Post a maintenance charge period against a shared facility and allocate it between the developer and the agency. MaintenanceCharge is an immutable event record: it has no update endpoint and no version field."
    roles: [TransitOperationsManager]
    input: ["jda_id", "period_start", "period_end", "line_items"]  # types: { jda_id: string, period_start: string, period_end: string, line_items: array }
    output: "MaintenanceCharge"
    side_effects:
      - "Create MaintenanceCharge with effective_share_applied, total_cost_cents, developer_share_cents and agency_share_cents per calculations.maintenance_cost_allocation"

  # ------------------------------------------------------- logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the service's logical current UTC instant. The logical clock defaults to 2026-08-01T00:00:00Z before this endpoint is ever called, and every deadline, expiry and *_at timestamp is derived from it. Advancing the clock past an ExclusiveNegotiationPeriod's end_date expires that period and cascades to its proposal and site."
    roles: [SystemAdmin]
    input: ["to_iso8601"]  # types: { to_iso8601: datetime }
    output: "{ current_utc: datetime, expired_negotiation_period_ids: string[] }"
    side_effects:
      - "Set the logical current UTC instant to to_iso8601"
      - "Set every ExclusiveNegotiationPeriod whose status is ACTIVE or EXTENDED and whose end_date is strictly before date(to_iso8601) to EXPIRED"
      - "Set the SELECTED proposal of each newly expired period to REJECTED"
      - "Set AgencySite.status = SOLICITATION_READY and bump its version by 1 for each site left with no ACTIVE or EXTENDED period and no EXECUTED agreement"

# ============================================================================
# §1.6 Error Catalog
# ============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    message_template: "Authentication headers are missing or invalid"
    trigger: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven declared roles"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: auth
    message_template: "Role {role} may not perform this operation"
    trigger: "The caller's role is not listed on the endpoint"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    category: auth
    message_template: "Developer {user_id} is not the owner of this resource"
    trigger: "A Developer-role caller submits a proposal for another developer_id, reads another developer's proposal, or requests a staging window on an agreement it does not hold"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: auth
    message_template: "Operator {user_id} submitted this agreement and may not also board-approve it"
    trigger: "POST /jda/agreements/{id}/board-approve where X-User-ID equals submitted_by_user_id"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: business_constraint
    message_template: "Request is not well formed: {detail}"
    trigger: "Missing required field, wrong type, enum value outside the declared set, numeric range violated, federal_interest_pct non-zero on a LOCAL_ONLY site, structure-specific money field missing, illegal facility-replacement status pair, or pagination limit outside 1..100"

  - error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Agency site {id} not found"
    trigger: "Unknown site id in the path or in a body site_id"
  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Readiness assessment {id} not found"
    trigger: "Unknown assessment id in the path"
  - error_id: ERR_SOLICITATION_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Solicitation {id} not found"
    trigger: "Unknown solicitation id in the path"
  - error_id: ERR_DEVELOPER_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Developer {id} not found"
    trigger: "Unknown developer id in the path or in a body developer_id"
  - error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Proposal {id} not found"
    trigger: "Unknown proposal id in the path or in a body proposal_id"
  - error_id: ERR_NEGOTIATION_PERIOD_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Exclusive negotiation period {id} not found"
    trigger: "Unknown negotiation period id in the path"
  - error_id: ERR_VALUATION_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Valuation determination {id} not found"
    trigger: "Unknown valuation id in the path or in a body valuation_id"
  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Joint development agreement {id} not found"
    trigger: "Unknown agreement id in the path or in a body jda_id"
  - error_id: ERR_DISPOSITION_REQUEST_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Federal disposition request {id} not found"
    trigger: "Unknown disposition request id in the path"
  - error_id: ERR_FACILITY_REPLACEMENT_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Transit facility replacement {id} not found"
    trigger: "Unknown facility replacement id in the path"
  - error_id: ERR_SHARED_FACILITY_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Shared facility {id} not found"
    trigger: "Unknown shared facility id in the path or in a body shared_facility_id"
  - error_id: ERR_STAGING_WINDOW_NOT_FOUND
    http_status: 404
    category: existence
    message_template: "Staging window {id} not found"
    trigger: "Unknown staging window id in the path"

  - error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    category: state
    message_template: "Site version {expected} does not match current version {actual}"
    trigger: "POST /jda/sites/{id}/valuations with expected_site_version != AgencySite.version"
  - error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    category: state
    message_template: "Shared facility version {expected} does not match current version {actual}"
    trigger: "POST /jda/staging-windows with expected_facility_version != SharedFacility.version"

  - error_id: ERR_INVALID_SITE_STATE
    http_status: 409
    category: state
    message_template: "Site is in status {status}, which does not permit this operation"
    trigger: "Release, reopen, solicitation issue, assessment certification, valuation certification or direct negotiation-period creation attempted from a site status the operation does not allow"
  - error_id: ERR_SITE_NOT_READY
    http_status: 409
    category: state
    message_template: "Site readiness tier is {tier}; READY is required to release for solicitation"
    trigger: "POST /jda/sites/{id}/release-for-solicitation on a site whose certified composite score is below 70.00"
  - error_id: ERR_SITE_NOT_UNDER_AGREEMENT
    http_status: 409
    category: state
    message_template: "Site must be UNDER_AGREEMENT before an agreement can be drafted"
    trigger: "POST /jda/agreements naming a site whose status is not UNDER_AGREEMENT"
  - error_id: ERR_ASSESSMENT_NOT_DRAFT
    http_status: 409
    category: state
    message_template: "Assessment is in status {status}; only a DRAFT assessment can be certified"
    trigger: "POST /jda/assessments/{id}/certify on an already certified or superseded assessment"
  - error_id: ERR_SOLICITATION_NOT_ISSUED
    http_status: 409
    category: state
    message_template: "Solicitation is in status {status}, which does not permit this operation"
    trigger: "Issue attempted on a non-DRAFT solicitation, close attempted on a non-ISSUED solicitation, proposal submitted to a solicitation that is not ISSUED, or shortlist attempted outside ISSUED/CLOSED"
  - error_id: ERR_SOLICITATION_NOT_CLOSED
    http_status: 409
    category: state
    message_template: "Solicitation must be CLOSED before it can be awarded"
    trigger: "POST /jda/solicitations/{id}/award on a solicitation that is not CLOSED"
  - error_id: ERR_PROPOSAL_NOT_ELIGIBLE
    http_status: 409
    category: state
    message_template: "Proposal {id} is in status {status} or does not belong to this solicitation"
    trigger: "Shortlist, award or direct negotiation-period creation naming a proposal that is not SUBMITTED/SHORTLISTED or belongs elsewhere"
  - error_id: ERR_NEGOTIATION_PERIOD_NOT_ACTIVE
    http_status: 409
    category: state
    message_template: "Negotiation period is in status {status}; ACTIVE or EXTENDED is required"
    trigger: "Extend or terminate attempted on an EXPIRED, TERMINATED or CONVERTED period"
  - error_id: ERR_AGREEMENT_NOT_DRAFTING
    http_status: 409
    category: state
    message_template: "Agreement is in negotiation_status {status}; DRAFTING is required"
    trigger: "Submit-for-review outside DRAFTING, or PATCH outside DRAFTING/REVISION_REQUESTED"
  - error_id: ERR_AGREEMENT_NOT_IN_REVIEW
    http_status: 409
    category: state
    message_template: "Agreement is in negotiation_status {status}; AGENCY_REVIEW is required"
    trigger: "Request-revision or board-approve outside AGENCY_REVIEW, or a disposition request filed outside AGENCY_REVIEW/BOARD_APPROVED"
  - error_id: ERR_AGREEMENT_NOT_BOARD_APPROVED
    http_status: 409
    category: state
    message_template: "Agreement is in negotiation_status {status}; BOARD_APPROVED is required"
    trigger: "Execute or staging-window approval attempted while the agreement is not BOARD_APPROVED"
  - error_id: ERR_FEDERAL_APPROVAL_PENDING
    http_status: 409
    category: state
    message_template: "Agreement federal_approval_status is {status}, which blocks this operation"
    trigger: "A second disposition request filed while one is already SUBMITTED, or execution attempted while the federal dimension is not NOT_REQUIRED or FTA_APPROVED"
  - error_id: ERR_DISPOSITION_ALREADY_DETERMINED
    http_status: 409
    category: state
