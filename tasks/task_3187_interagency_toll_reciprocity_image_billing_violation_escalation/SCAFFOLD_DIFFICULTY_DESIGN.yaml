  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: toll_post_to_replenishment_to_suspension (depth 3)
        grounds:
          - calculations.replenishment_decision
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - entities.Account.fields.replenishment_fail_count
        distinguishing_aspect: |
          Depth-3 cascade: toll posting (A) debits the balance crossing the
          threshold (B), which triggers an automatic replenishment attempt
          whose failure bumps replenishment_fail_count (C); the third such
          posting drives the count to 3 and suspends the account, which in
          turn blocks further transponder postings (D, observable as
          ERR_ACCOUNT_SUSPENDED on the next trip).
        test_recipe:
          setup:
            - "Agencies HOME/AWAY ACTIVE; AWAY CLASS_2 schedule base 1200, axle 1.0, peak 1.0; plan discount 0."
            - "Account: opening balance 1600, threshold 1000, replenishment amount 2500; TAG-R ACTIVE."
            - "Automatic replenishment for this account is configured to FAIL (test harness uses the replenishments endpoint with outcome=FAILED to model the auto attempt; here the cascade is driven by three toll posts each followed by a failed auto-replenishment)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P4", vehicle_class: "CLASS_2", base_rate_cents: 1200, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Hank Lowbal", holder_email: "hank@example.com", discount_plan_id: "${plan_id}", low_balance_threshold_cents: 1000, replenishment_amount_cents: 2500, opening_balance_cents: 1600 }
              as: AgencyOperations
              captures: { acct: "$.data.id", v0: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-R", vehicle_class: "CLASS_2", plate_number: "LOW100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-R", away_agency_id: "${away_id}", plaza_code: "P4", trip_timestamp: "2026-09-06T08:00:00Z", is_peak: false, idempotency_key: "r1" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { v1: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${v1}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { v2: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${v2}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { v3: "$.data.version" }
          trigger:
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${v3}" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-R", away_agency_id: "${away_id}", plaza_code: "P4", trip_timestamp: "2026-09-06T09:00:00Z", is_peak: false, idempotency_key: "r2" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "Account.${acct}.replenishment_fail_count == 3"
            - "Account.${acct}.status == SUSPENDED and suspended_reason == REPLENISHMENT_FAILED"
            - "the final trip post is rejected with ERR_ACCOUNT_SUSPENDED (depth-3 cascade terminus blocks child operations)"
            - "Account.${acct}.balance_cents == 400 (1600 - 1200; failed replenishments never credit)"

      - name: upheld_classification_dispute_repricing_cascade (depth 2)
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHOLD
          - state_machines.TollTransaction.DISPUTED_to_POSTED
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Depth-2 cascade on a different trigger: upholding a
          VEHICLE_CLASSIFICATION dispute (A) re-prices the transaction from
          CLASS_5 (1188) to CLASS_2 (300) and flips it DISPUTED->POSTED (B),
          which credits the account balance by the 888-cent delta (C) — the
          credit is caused by the repricing, not by the uphold directly.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY; AWAY plaza P3 schedules CLASS_5 (base 475, axle 2.5) and CLASS_2 (base 300, axle 1.0); plan discount 0."
            - "Account balance 100000 with TAG-X declared CLASS_5; one trip charged 1188 (balance 98812)."
            - "Classification dispute claiming CLASS_2 is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P3", vehicle_class: "CLASS_5", base_rate_cents: 475, axle_multiplier: 2.5, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P3", vehicle_class: "CLASS_2", base_rate_cents: 300, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ida Class", holder_email: "ida@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct_id: "$.data.id" }
            - call: "POST /toll/accounts/${acct_id}/transponders"
              payload: { tag_number: "TAG-X", vehicle_class: "CLASS_5", plate_number: "CLS200", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-X", away_agency_id: "${away_id}", plaza_code: "P3", trip_timestamp: "2026-09-07T09:00:00Z", is_peak: false, idempotency_key: "x1" }
              as: AgencyOperations
              captures: { txn: "$.data.id" }
            - call: "POST /toll/disputes"
              payload: { account_id: "${acct_id}", dispute_type: "VEHICLE_CLASSIFICATION", toll_transaction_id: "${txn}", claimed_vehicle_class: "CLASS_2" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { disp: "$.data.id" }
            - call: "POST /toll/disputes/${disp}/begin_review"
              payload: {}
              as: ViolationsOfficer
          trigger:
            - call: "POST /toll/disputes/${disp}/uphold"
              payload: {}
              as: ViolationsOfficer
          assert:
            - "Dispute.${disp}.status == UPHOLD"
            - "TollTransaction.${txn}.status == POSTED and billed_vehicle_class == CLASS_2"
            - "TollTransaction.${txn}.charged_amount_cents == 300"
            - "Account.${acct_id}.balance_cents == 99700 (98812 + 888 delta credit)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_referential_on_toll_post
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_ACCOUNT_SUSPENDED
          - errors.ERR_RATE_NOT_FOUND
        distinguishing_aspect: |
          Category pair state vs business_referential: a toll post whose
          account is SUSPENDED AND whose plaza+class has no covering rate
          schedule fails priority 5 (business_safety/state group) with
          ERR_ACCOUNT_SUSPENDED, never reaching the rate lookup — proving
          state beats referential regardless of both being violated.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY ACTIVE. AWAY has NO schedule for plaza PX."
            - "Account SUSPENDED (via three failed replenishments), TAG-S ACTIVE on it."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
