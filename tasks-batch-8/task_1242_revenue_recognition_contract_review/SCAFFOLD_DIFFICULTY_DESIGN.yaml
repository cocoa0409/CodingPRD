  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dependency_recognition_requires_open_period
        grounds:
          - state_machines.PerformanceObligation (recognize side effects)
          - state_machines.AccountingPeriod.OPEN_to_CLOSED
          - errors[ERR_PERIOD_CLOSED]
        distinguishing_aspect: |
          Pair RevenueEntry <-> AccountingPeriod: a recognize run whose target has
          advanced must post into the period containing the clock date; when that
          period is CLOSED the operation is rejected with ERR_PERIOD_CLOSED and no
          entry is created — recognition state depends on a different entity's state.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSP SVC/US 100000; customer"
            - "contract fixed 100000 ACTIVE, one STRAIGHT_LINE POB 2026-06-01..2026-07-01, allocated 100000"
            - "recognize at 06-15 -> recognized 46667; clock advanced to 2026-06-20 (target would be 63333); June then CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "SVC", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Gate Co", external_ref: "GATE-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-GATE", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "SVC", region: "US", recognition_pattern: "OVER_TIME_STRAIGHT_LINE", service_start_date: "2026-06-01", service_end_date: "2026-07-01" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_id}/recognize"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods/${per_id}/close"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /revrec/pobs/${pob_id}/recognize"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
            - call: "GET /revrec/pobs/${pob_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { rec_after: $.data.recognized_revenue_cents }
          assert:
            - "error_id == ERR_PERIOD_CLOSED (clock date 2026-06-20 falls in CLOSED period)"
            - "POB recognized_revenue_cents still == 46667 — no entry posted into the closed period"

      - name: dependency_contract_approve_requires_decided_review_tasks
        grounds:
          - state_machines.Contract.IN_REVIEW_to_APPROVED
          - state_machines.ReviewTask.RECOMMENDED_to_DECIDED
          - errors[ERR_REVIEW_OUTSTANDING]
        distinguishing_aspect: |
          Pair Contract <-> ReviewTask (different pair than RevenueEntry <->
          AccountingPeriod): contract approval is gated on the review tasks of its
          clauses being DECIDED; while the task is ASSIGNED the approve fails with
          ERR_REVIEW_OUTSTANDING, and only after the task loop completes does the
          same call succeed.
        test_recipe:
          setup:
            - "clock 2026-06-15; customer; contract fixed 100000 with one POINT_IN_TIME POB and one non-standard clause; submitted -> IN_REVIEW with one ASSIGNED task"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
