            - "${m1_filled_0} == 0 on a new meet and ${m1_required} == 2"
            - "${a1_credit} == 2 == JOB_CREDIT_VALUES[SCORER] and ${a1_status} == ASSIGNED, so a brand-new assignment counts immediately"
