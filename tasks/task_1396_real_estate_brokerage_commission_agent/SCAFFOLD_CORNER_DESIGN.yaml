            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "GET /brokerage/trust-ledger"
              payload: {}
              as: Auditor
              captures: { held_pre: $.data.held_cents }
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/void"
              payload: {}
              as: TransactionCoordinator
              captures: { st: $.data.status, tr: $.data.trust_received_cents }
            - call: "GET /brokerage/trust-ledger"
              payload: {}
              as: Auditor
              captures: { held_post: $.data.held_cents, rel_post: $.data.released_cents }
            - call: "GET /brokerage/trust-transactions?deal_id=${deal_id}"
              payload: {}
              as: Auditor
              captures: { k0: "$.data[0].kind", a0: "$.data[0].amount_cents", k1: "$.data[1].kind", a1: "$.data[1].amount_cents" }
          assert:
            - "after close: ${held_pre} == 1000000"
            - "after void: ${st} == VOIDED, ${tr} == 0, ${held_post} == 0 and ${rel_post} == 0"
            - "trust journal: ${k0} == RECEIPT (${a0} == 1000000) then ${k1} == RECEIPT_REVERSAL (${a1} == -1000000)"

