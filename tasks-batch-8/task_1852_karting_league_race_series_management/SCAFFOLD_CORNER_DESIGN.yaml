  # ===========================================================================
  - section: endpoints
    instances:
      - name: karts_list_pagination_and_status_filter
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more in the envelope; status filter narrows the result set."
        test_recipe:
          setup: ["Three karts created; one patched to IN_MAINTENANCE"]
          setup_api_calls:
            - { call: "POST /karting/karts", payload: { fleet_number: "P-1", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_1: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "P-2", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_2: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "P-3", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_3: $.data.id } }
            - { call: "PATCH /karting/karts/${k_3}", payload: { status: "IN_MAINTENANCE" }, as: LeagueAdmin }
          trigger:
            - { call: "GET /karting/karts", payload: { limit: 2, offset: 0 }, as: LeagueAdmin }
            - { call: "GET /karting/karts", payload: { status: "IN_MAINTENANCE" }, as: LeagueAdmin }
          assert:
            - "first page: response_type == array, 2 items, total_count == 3, has_more == true"
            - "filtered list: total_count == 1 and the only row is ${k_3}"

      - name: error_envelope_shape_on_not_found
        claim_type: creation
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type 'error' with data.error_id and data.message, plus meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /karting/incidents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == 'error'; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp present"

