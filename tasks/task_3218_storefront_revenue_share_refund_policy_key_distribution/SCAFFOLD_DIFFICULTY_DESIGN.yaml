          assert:
            - "Exactly one ReviewBombWindow exists for the title (no overlapping second window)"
            - "ReviewBombWindow.end_at == 2026-09-12T12:00:00Z (extended by second trigger at 2026-09-05T12:00:00Z + 7 days)"
            - "ReviewBombWindow.status == ACTIVE"

      - name: key_redemption_velocity_account_window
        grounds:
          - validations[priority=17]
        distinguishing_aspect: |
          Aggregate-count interval semantics on the ActivationKey resource pool,
          different from ReviewBombWindow merge: the trailing-60-minute account
          redemption count is a sliding occupancy — the 3rd redemption in the
          window succeeds (2 < 3 prior), and the 4th is rejected with
          ERR_REDEEM_VELOCITY; after the clock moves 61 minutes forward the same
          account redeems again successfully.
        test_recipe:
          setup:
            - "RELEASED title; APPROVED batch of 10 keys; redeeming account with 0 prior redemptions; clock at 2026-09-06T00:00:00Z"
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Key Studio", contact_email: "key@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Key Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/key-batches"
              payload: { title_id: "${t_id}", requested_quantity: 10, free_keys_in_batch: 0 }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { kb_id: $.data.id }
            - call: "POST /storefront/key-batches/${kb_id}/approve"
              payload: {}
              as: PlatformOps
            - call: "GET /storefront/key-batches/${kb_id}/keys"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { k0: $.data.0.key_code, k1: $.data.1.key_code, k2: $.data.2.key_code, k3: $.data.3.key_code, k4: $.data.4.key_code }
            - call: "POST /storefront/user-accounts"
              payload: { email: "kr@players.example" }
              as: PlatformOps
              captures: { u_id: $.data.id }
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k0}" }
              as: User
              as_user_id: "${u_id}"
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k1}" }
              as: User
              as_user_id: "${u_id}"
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k2}" }
              as: User
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k3}" }
              as: User
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T01:01:00Z" }
              as: PlatformOps
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k4}" }
              as: User
              as_user_id: "${u_id}"
              captures: { k4_status: $.data.status }
          assert:
            - "4th redemption within 60 minutes rejected with ERR_REDEEM_VELOCITY"
            - "Key ${k3} remains UNUSED after rejection"
            - "After clock +61 min the 5th redemption succeeds: captured status == REDEEMED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: recognized_revenue_conservation_under_refund
        grounds:
          - calculations.recognized_revenue_ledger
          - state_machines.Purchase.COMPLETED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity (money, Title.lifetime_recognized_revenue_usd_cents):
          for any purchase P completed then fully refunded,
          ledger == ledger_before_P — the +usd_recognized at completion is exactly
          cancelled by the -refund at approval, with zero drift, even though the
          tier re-evaluates twice in between.
        test_recipe:
          setup:
            - "RELEASED title; one completed 1000-cent purchase already on the ledger (baseline 1000); second buyer about to purchase and refund"
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Cons Studio", contact_email: "cons@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Cons Game", base_price_usd_cents: 1000, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "c1@players.example" }
              as: PlatformOps
              captures: { u1: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "c2@players.example" }
              as: PlatformOps
              captures: { u2: $.data.id }
