# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3385_voter_guide_production_candidate_questionnaire_administration
# Depth probe: 2 instances per each of the nine §0.5 Difficulty Rules.
# Every instance is reachable from empty-DB via its setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: word_count_strict_vs_lenient_same_answer
        grounds:
          - calculations.response_word_count
          - entities.Contest.fields.word_count_policy
          - entities.CandidateResponse.fields.per_answer_word_counts
        distinguishing_aspect: |
          Dual-variant counting on the CandidateResponse domain: the identical 7-token
          answer text scores 8 under STRICT (hyphenated compounds split into parts, the URL
          token counts 0) and 7 under LENIENT (hyphenated compounds and URLs each count 1),
          so with a 7-word limit the STRICT contest lands OVER_LIMIT_RETURNED while the
          LENIENT contest lands SUBMITTED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One OPEN cycle with one jurisdiction; two CANDIDATE_RACE contests (word_count_policy STRICT and LENIENT, questionnaire_word_limit 7 each), each with one VERIFIED filing, a one-question questionnaire ISSUED, clock advanced past filing deadline but before due_at."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z", questionnaire_word_limit: 7, word_count_policy: "STRICT" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { cts_id: "$.data.id" } }
            - { call: "POST /contests/${cts_id}/filings", payload: { candidate_name: "Ana Strict", party_label: "Nonpartisan", filing_reference: "F-S-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { fs_id: "$.data.id" } }
            - { call: "POST /filings/${fs_id}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "City Clerk", filing_deadline: "2026-09-15T17:00:00Z", questionnaire_word_limit: 7, word_count_policy: "LENIENT" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ctl_id: "$.data.id" } }
            - { call: "POST /contests/${ctl_id}/filings", payload: { candidate_name: "Len Eient", party_label: "Nonpartisan", filing_reference: "F-L-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { fl_id: "$.data.id" } }
            - { call: "POST /filings/${fl_id}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${cts_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { cts_ver: "$.data.version" } }
            - { call: "POST /contests/${cts_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${cts_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /contests/${ctl_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ctl_ver: "$.data.version" } }
            - { call: "POST /contests/${ctl_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ctl_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${cts_id}/questionnaire", payload: { due_at: "2026-10-01T17:00:00Z", questions: [{ position_index: 1, prompt_text: "Why are you running?" }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { qs_id: "$.data.id" } }
            - { call: "POST /questionnaires/${qs_id}/issue", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /contests/${ctl_id}/questionnaire", payload: { due_at: "2026-10-01T17:00:00Z", questions: [{ position_index: 1, prompt_text: "Why are you running?" }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { ql_id: "$.data.id" } }
            - { call: "POST /questionnaires/${ql_id}/issue", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
          trigger:
            - { call: "POST /questionnaires/${qs_id}/responses", payload: { answers: [{ position_index: 1, text: "My pro-tenant, anti-sprawl record: https://x.org/123 proves it." }] }, as: Candidate, as_user_id: "${fs_id}" }
            - { call: "POST /questionnaires/${ql_id}/responses", payload: { answers: [{ position_index: 1, text: "My pro-tenant, anti-sprawl record: https://x.org/123 proves it." }] }, as: Candidate, as_user_id: "${fl_id}" }
          assert:
            - "STRICT contest response: status == OVER_LIMIT_RETURNED, per_answer_word_counts == [8], over_limit_positions == [1]"
            - "LENIENT contest response: status == SUBMITTED, per_answer_word_counts == [7], over_limit_positions == []"
            - "Identical answer text yields counts 8 vs 7 driven only by contest.word_count_policy"

      - name: reading_grade_fk_passes_smog_fails_same_text
        grounds:
          - calculations.reading_grade_level
          - entities.Jurisdiction.fields.reading_level_metric
          - entities.BallotMeasure.fields.grade_fk
          - entities.BallotMeasure.fields.grade_smog
        distinguishing_aspect: |
          Dual-variant readability scoring on the BallotMeasure/GuideEdition domain (distinct
          from word counting on CandidateResponse): the same explanation text grades 2.65 under
          FLESCH_KINCAID and 8.84 under SMOG, so a LARGE_PRINT edition READYs in a
          FLESCH_KINCAID jurisdiction but is rejected in a SMOG jurisdiction.
        test_recipe:
          setup:
            - "Two independent cycles, each with one jurisdiction whose reading_level_metric differs (A: FLESCH_KINCAID, B: SMOG). Each cycle: one BALLOT_MEASURE contest carrying the identical explanation text 'Cats run fast with dogs on soft brown mats near banana.' (11 words, 13 syllables, 1 polysyllable, 1 sentence), PRO+CON arguments accepted, two NEUTRAL reviews by two distinct non-drafter reviewers, measure APPROVED_FOR_GUIDE, contest LOCKED. Editor and reviewer are distinct attested volunteers."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Rhea Reviewer", chapter_code: "CH2", roles: ["REVIEWER"] }, as: LeagueAdmin, captures: { rev_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Ray ReviewerTwo", chapter_code: "CH3", roles: ["REVIEWER"] }, as: LeagueAdmin, captures: { rev2_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "Cycle FK", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_a: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_a}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_a}/jurisdictions", payload: { jurisdiction_name: "Fk County", fips_code: "06011", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_a: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_a}/contests", payload: { kind: "BALLOT_MEASURE", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${ct_a}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_a_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_a}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_a_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_a}/measure", payload: { measure_title: "Measure A", official_text: "Official text A", explanation_text: "Cats run fast with dogs on soft brown mats near banana." }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { m_a: "$.data.id" } }
            - { call: "POST /measures/${m_a}/arguments", payload: { side: "PRO", argument_text: "one two three four five six seven eight nine ten", author_credit: "Committee for A" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_a}/arguments", payload: { side: "CON", argument_text: "one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty twentyone twentytwo twentythree twentyfour twentyfive twentysix twentyseven twentyeight twentynine thirty", author_credit: "Committee against A" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_a}/submit-for-review", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_a}/reviews", payload: { verdict: "NEUTRAL", notes: "Balanced and plain." }, as: NeutralityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /measures/${m_a}/reviews", payload: { verdict: "NEUTRAL", notes: "Second independent approval." }, as: NeutralityReviewer, as_user_id: "${rev2_id}" }
            - { call: "GET /contests/${ct_a}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_a_ver2: "$.data.version" } }
            - { call: "POST /contests/${ct_a}/transitions", payload: { to: "GUIDE_READY", expected_contest_version: "${ct_a_ver2}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /contests/${ct_a}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_a_ver3: "$.data.version" } }
            - { call: "POST /contests/${ct_a}/transitions", payload: { to: "LOCKED", expected_contest_version: "${ct_a_ver3}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /election-cycles", payload: { cycle_name: "Cycle SMOG", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_b: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_b}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_b}/jurisdictions", payload: { jurisdiction_name: "Smog County", fips_code: "06012", supported_language_codes: ["EN"], reading_level_metric: "SMOG" }, as: LeagueAdmin, captures: { jur_b: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_b}/contests", payload: { kind: "BALLOT_MEASURE", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_b: "$.data.id" } }
            - { call: "GET /contests/${ct_b}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_b_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_b}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_b_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_b}/measure", payload: { measure_title: "Measure B", official_text: "Official text B", explanation_text: "Cats run fast with dogs on soft brown mats near banana." }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { m_b: "$.data.id" } }
            - { call: "POST /measures/${m_b}/arguments", payload: { side: "PRO", argument_text: "one two three four five six seven eight nine ten", author_credit: "Committee for B" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_b}/arguments", payload: { side: "CON", argument_text: "one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty twentyone twentytwo twentythree twentyfour twentyfive twentysix twentyseven twentyeight twentynine thirty", author_credit: "Committee against B" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_b}/submit-for-review", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_b}/reviews", payload: { verdict: "NEUTRAL", notes: "Balanced and plain." }, as: NeutralityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /measures/${m_b}/reviews", payload: { verdict: "NEUTRAL", notes: "Second independent approval." }, as: NeutralityReviewer, as_user_id: "${rev2_id}" }
            - { call: "GET /contests/${ct_b}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_b_ver2: "$.data.version" } }
            - { call: "POST /contests/${ct_b}/transitions", payload: { to: "GUIDE_READY", expected_contest_version: "${ct_b_ver2}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /contests/${ct_b}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_b_ver3: "$.data.version" } }
            - { call: "POST /contests/${ct_b}/transitions", payload: { to: "LOCKED", expected_contest_version: "${ct_b_ver3}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /election-cycles/${cyc_a}/guide-editions", payload: { language_code: "EN", channel: "PRINT", accessibility_format: "LARGE_PRINT" }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { ed_a: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_b}/guide-editions", payload: { language_code: "EN", channel: "PRINT", accessibility_format: "LARGE_PRINT" }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { ed_b: "$.data.id" } }
          trigger:
            - { call: "POST /guide-editions/${ed_a}/transitions", payload: { to: "READY" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /guide-editions/${ed_b}/transitions", payload: { to: "READY" }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { err_b: "$.data.error_id" } }
          assert:
            - "Measure ${m_a}.grade_fk == 2.65 and grade_smog == 8.84 (same text, two algorithms)"
            - "Cycle A edition ${ed_a}: status == READY (FLESCH_KINCAID 2.65 <= 8.0 passes the accessibility gate)"
            - "Cycle B edition ${ed_b}: READY rejected with error_id == ERR_ACCESSIBILITY_GRADE_EXCEEDED (SMOG 8.84 > 8.0), status stays ASSEMBLING"
            - "Identical explanation text produces opposite gate outcomes driven only by jurisdiction.reading_level_metric"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: print_allocation_tier_waterfall_tiebreak
        grounds:
          - calculations.print_copy_allocation
          - entities.GuideEdition.fields.allocations
          - entities.GuideEdition.fields.unallocated_copies
        distinguishing_aspect: |
          Mode (a) combinatorial formula: allocation is a function of three interacting inputs
          (print_run_total, per-channel requested, priority_tier) with non-linear tier gating
          and a within-tier order (requested DESC, channel_code ASC) that decides who starves:
          tied 600/600 tier-1 channels split 600/400 because ALPHA sorts before BETA.
        test_recipe:
          setup:
            - "One OPEN cycle, one jurisdiction, one CANDIDATE_RACE contest carried to LOCKED with an issued-then-pinned questionnaire (zero filings, zero shells). One PRINT/STANDARD/EN edition in ASSEMBLING then READY."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/questionnaire", payload: { due_at: "2026-10-01T17:00:00Z", questions: [{ position_index: 1, prompt_text: "Why are you running?" }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { q_id: "$.data.id" } }
            - { call: "POST /questionnaires/${q_id}/issue", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-02T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /questionnaires/${q_id}/close", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /questionnaires/${q_id}/pin", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver2: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "GUIDE_READY", expected_contest_version: "${ct_ver2}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver3: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "LOCKED", expected_contest_version: "${ct_ver3}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /election-cycles/${cyc_id}/guide-editions", payload: { language_code: "EN", channel: "PRINT", accessibility_format: "STANDARD" }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { ed_id2: "$.data.id" } }
            - { call: "POST /guide-editions/${ed_id2}/transitions", payload: { to: "READY" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
          trigger:
            - { call: "POST /guide-editions/${ed_id2}/distribute", payload: { print_run_total: 1000, channel_requests: [{ channel_code: "ALPHA", requested: 600, priority_tier: 1 }, { channel_code: "BETA", requested: 600, priority_tier: 1 }, { channel_code: "GAMMA", requested: 300, priority_tier: 2 }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
          assert:
            - "Edition ${ed_id2}.status == DISTRIBUTED"
            - "allocations: ALPHA.allocated == 600, BETA.allocated == 400, GAMMA.allocated == 0 (tier 1 drains the run; requested-tie broken by channel_code ASC so ALPHA is served before BETA)"
            - "unallocated_copies == 0 and sum(allocated) + unallocated_copies == 1000 == print_run_total"

      - name: page_estimate_per_contest_roundup_then_sum
        grounds:
          - calculations.guide_page_estimate
          - entities.GuideEdition.fields.estimated_page_count
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding with a pinned order — ceil per
          contest, then sum — provably differs from sum-then-ceil on the same content:
          two contests of 21 words each yield 6 pages under the pinned order but would
          yield 5 under the unpinned order.
        test_recipe:
          setup:
            - "One OPEN cycle, one jurisdiction, two CANDIDATE_RACE contests, each with one VERIFIED filing whose single answer is exactly 21 words (STRICT policy, default limit 100), questionnaires PINNED, both contests LOCKED. Edition WEB/STANDARD/EN created."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct1: "$.data.id" } }
            - { call: "POST /contests/${ct1}/filings", payload: { candidate_name: "Ana One", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f1: "$.data.id" } }
            - { call: "POST /filings/${f1}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Clerk", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct2: "$.data.id" } }
            - { call: "POST /contests/${ct2}/filings", payload: { candidate_name: "Bob Two", party_label: "Nonpartisan", filing_reference: "F-2" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f2: "$.data.id" } }
            - { call: "POST /filings/${f2}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
