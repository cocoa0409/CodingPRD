            - "DamageClaim.${clm_cl1}.review_round == 2 (incremented on DISPUTED -> UNDER_REVIEW)"

  # =========================================================================
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers.
  # Instance 1 depth >= 3: lien record -> account LIEN_DEFAULT -> order
  # confirm blocked. Instance 2 depth >= 2: surge close -> allocations expire
  # -> pool released.
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lien_record_cascades_to_account_and_blocks_order
        grounds:
          - state_machines.JobAccount.NOTICE_FILED_to_LIEN_RECORDED
          - state_machines.ContractorAccount.ACTIVE_to_LIEN_DEFAULT
          - validations[priority=12]
        distinguishing_aspect: |
          Depth-3 cascade: record-lien on a JobAccount mutates
          ContractorAccount.status to LIEN_DEFAULT, and that status change
          itself causes a subsequent order confirm to fail with
          ERR_LIEN_BLOCKS_ORDER — the order rejection is caused by the
          account change, not directly by the lien call.
        test_recipe:
          setup:
            - "Contractor with one JobAccount carrying a positive job_balance from an invoiced delivered order"
            - "lien notice filed for 50000 (<= job_balance); clock advanced 11 days past notice"
            - "A second QUOTED order exists awaiting confirmation"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-L1", name: "Lien", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_l1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-L1", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_l1: $.data.id }
            - call: "POST /roofing/branches/${br_l1}/inventory-lots"
              payload: { product_id: "${prod_l1}", lot_code: "LOT-L", on_hand_bundles: 500 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Lien Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_l1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_l1}/job-accounts"
              payload: { job_name: "Job L1", site_address: "6 Hickory St" }
              as: CreditAnalyst
              captures: { ja_l1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_l1}/takeoffs"
              payload: { product_id: "${prod_l1}", roof_squares: 20.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_l1a: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_l1a}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_l1a}/convert"
              payload: { branch_id: "${br_l1}" }
              as: Contractor
              as_user_id: "${ca_l1}"
              captures: { ord_l1a: $.data.id }
            - call: "POST /roofing/branches/${br_l1}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 5 }
              as: Dispatcher
              captures: { slot_l1: $.data.id }
            - call: "POST /roofing/orders/${ord_l1a}/deliveries"
