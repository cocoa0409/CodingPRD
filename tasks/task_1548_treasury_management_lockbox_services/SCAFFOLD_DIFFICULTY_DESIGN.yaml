              as_user_id: "lock-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items"
              payload: { check_number: "1", payer_routing_number: "0710002880", amount_cents: 10000, payee_name: "C" }
              as: LockboxOperator
              captures: { i1: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items"
              payload: { check_number: "2", payer_routing_number: "0710002880", amount_cents: 10000, payee_name: "C" }
              as: LockboxOperator
              captures: { i2: $.data.id }
