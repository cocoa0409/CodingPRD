      - name: the_credit_workflow_refuses_every_out_of_sequence_call
        claim_type: violation_to_error
        grounds:
          - state_machines.Episode.credit_status
          - state_machines.CreditArbitration
          - errors.ERR_SUBMISSION_WINDOW_CLOSED
          - errors.ERR_ARBITRATION_NOT_AVAILABLE
          - errors.ERR_ARBITRATION_ALREADY_EXISTS
          - errors.ERR_ARBITER_IS_PARTICIPANT
          - errors.ERR_PANEL_INCOMPLETE
        distinguishing_aspect: |
          The credit workflow has exactly one legal order (submit -> close -> convene -> three ballots ->
          determine) and every deviation has its own code: convening before the close is
          ERR_ARBITRATION_NOT_AVAILABLE, submitting after it is ERR_SUBMISSION_WINDOW_CLOSED, convening
          twice is ERR_ARBITRATION_ALREADY_EXISTS, seating a claimant as arbiter is a 422
          ERR_ARBITER_IS_PARTICIPANT, and determining on two ballots is ERR_PANEL_INCOMPLETE. The 422 is
          the only one of the five that is not a 409, because it is about the payload rather than the state.
        test_recipe:
          setup:
            - "EP1 has A1 (W1) and A2 (W2) both APPROVED, so both writers are eligible claimants; AR1, AR2, AR3 are unrelated writers."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
            - *C_MLIST2
            - *C_D2A
            - *C_APP2
            - *C_SUB1
            - *C_SUB2
            - *C_AR1
            - *C_AR2
            - *C_AR3
          trigger:
            - call: "POST /episodes/${ep1}/credit-arbitration"
              payload: { arbiter_writer_ids: ["${ar1}", "${ar2}", "${ar3}"] }
              as: GuildAdministrator
            - *C_CLOSE
            - call: "POST /episodes/${ep1}/credit-submissions"
              payload: { writer_id: "${sr}", claim_basis: "STORY_BY", claimed_contribution_pct: 10 }
              as: Writer
              as_user_id: "${sr}"
            - call: "POST /episodes/${ep1}/credit-arbitration"
              payload: { arbiter_writer_ids: ["${ar1}", "${w1}", "${ar3}"] }
              as: GuildAdministrator
            - *C_ARBIT
            - call: "POST /episodes/${ep1}/credit-arbitration"
              payload: { arbiter_writer_ids: ["${ar1}", "${ar2}", "${ar3}"] }
              as: GuildAdministrator
            - *C_V1
            - *C_V2
            - call: "POST /credit-arbitrations/${arb}/determine"
              payload: {}
              as: GuildAdministrator
          assert:
            - "Trigger call 1 returns 409 ERR_ARBITRATION_NOT_AVAILABLE: Episode.${ep1}.credit_status is SUBMISSIONS_OPEN, not SUBMISSIONS_CLOSED"
            - "Trigger call 3 returns 409 ERR_SUBMISSION_WINDOW_CLOSED and GET /credit-submissions?episode_id=${ep1} still returns total_count == 2"
            - "Trigger call 4 returns 422 ERR_ARBITER_IS_PARTICIPANT (${w1} holds APPROVED assignment ${a1} and submission ${sb1}) and no CreditArbitration row is created"
            - "Trigger call 6 returns 409 ERR_ARBITRATION_ALREADY_EXISTS and GET /credit-arbitrations?episode_id=${ep1} returns total_count == 1"
            - "Trigger call 9 returns 409 ERR_PANEL_INCOMPLETE: votes_cast_count == 2 of the 3 seated arbiters"
            - "After trigger call 9: CreditArbitration.${arb}.status is still PANEL_VOTING, outcome == NONE, determined_credit_string == null and Episode.${ep1}.credit_status == IN_ARBITRATION"

      - name: a_reassigned_script_refuses_delivery_and_an_unready_episode_refuses_the_lock
        claim_type: violation_to_error
        grounds:
          - state_machines.Milestone.PENDING_to_DELIVERED
          - state_machines.Episode.script_readiness
          - errors.ERR_ASSIGNMENT_NOT_DRAFTING
          - errors.ERR_MILESTONE_NOT_DELIVERABLE
          - errors.ERR_EPISODE_NOT_READY
          - errors.ERR_EPISODE_ALREADY_LOCKED
        distinguishing_aspect: |
          Delivery has two independent 409 gates evaluated in a fixed order - the milestone's own status
          first (ERR_MILESTONE_NOT_DELIVERABLE), the parent assignment's status second
          (ERR_ASSIGNMENT_NOT_DRAFTING) - so redelivering an already-delivered milestone of a
          REASSIGNMENT_PENDING assignment reports the milestone code even though both gates are shut. The
          episode's own readiness gate is a third, separate code, and once the lock lands it converts every
          later write on that episode into ERR_EPISODE_ALREADY_LOCKED.
        test_recipe:
          setup:
            - "RM is ACTIVE with S1 CONFIRMED; A1 (TELEPLAY, W1) has M1 DELIVERED and M2, M3 still PENDING; the seat is then released so the assignment falls to REASSIGNMENT_PENDING."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - call: "POST /room-seats/${s1}/release"
              payload: { reason: "Writer moved to another show." }
              as: StudioExecutive
          trigger:
            - call: "POST /milestones/${m2}/deliver"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /milestones/${m1}/deliver"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /episodes/${ep1}/lock-for-production"
              payload: {}
              as: StudioExecutive
            - call: "POST /script-assignments/${a1}/void"
              payload: { reason: "Seat gone; reassigning the script." }
              as: StudioExecutive
          assert:
            - "After the release: ScriptAssignment.${a1}.status == REASSIGNMENT_PENDING, RoomSeat.${s1}.status == RELEASED and Milestone.${m2}.status is still PENDING with its original due_date 2026-10-05T23:59:59.999Z"
            - "Trigger call 1 returns 409 ERR_ASSIGNMENT_NOT_DRAFTING: the milestone gate passes (PENDING) and the parent gate fails (REASSIGNMENT_PENDING is outside {DRAFTING, IN_NOTES})"
            - "Trigger call 2 returns 409 ERR_MILESTONE_NOT_DELIVERABLE, not ERR_ASSIGNMENT_NOT_DRAFTING: ${m1} is already DELIVERED and the milestone gate is evaluated first"
            - "Trigger call 3 returns 409 ERR_EPISODE_NOT_READY: Episode.${ep1}.script_readiness == IN_PROGRESS after CASCADE B link 2"
            - "Trigger call 4 returns 200 with ScriptAssignment.${a1}.status == VOID, payable_fee_cents == 0 and Episode.${ep1}.script_readiness == NOT_STARTED (every assignment of the episode is VOID)"
            - "A repeat of trigger call 1 after trigger call 4 still returns 409 ERR_ASSIGNMENT_NOT_DRAFTING (VOID is also outside the deliverable set), and Milestone.${m2}.status is PENDING throughout"

      - name: the_script_fee_budget_stops_the_assignment_that_would_cross_it
        claim_type: violation_to_error
        grounds:
          - validations.priority_76_business_fiscal
          - errors.ERR_SCRIPT_FEE_BUDGET_EXCEEDED
          - calculations.season_script_fee_commitment
          - calculations.guarantee_settlement
        distinguishing_aspect: |
          The gate is checked against payable_fee_cents - the figure AFTER the guarantee offset - not
          against the gross fee, so a 3500000 TELEPLAY fits inside a 3000000 budget (payable 1750000) while
          a 1500000 STORY afterwards does not (1750000 + 1500000 > 3000000). The refusal leaves the ledger
          at three entries and the episode version unconsumed, and the same STORY succeeds once the
          TELEPLAY is voided and its reversal drives the commitment back to 0.
