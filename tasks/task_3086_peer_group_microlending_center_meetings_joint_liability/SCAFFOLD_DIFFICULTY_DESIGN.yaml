            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            - *d_mt1
            - *d_mt1o
            - *d_att_p1
            - *d_att_p2
            - *d_att_p3
            - *d_att_p4
            - *d_att_m1
            - call: "POST /center-meetings/${mt1}/collections"
              payload: { member_id: "${m1}", loan_id: "${loan1}", amount_cents: 4801 }
              as: CenterManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /center-meetings/${mt1}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt1}/reconcile"
              payload: { declared_cash_cents: 4801 }
              as: BranchManager
              as_user_id: "bm-reconciler-1"
          assert:
            - "after close: CenterMeeting.${mt1}.status == CLOSED and settlement_status == POSTED (close moves both, but they are distinct fields)"
            - "after reconcile: status still == CLOSED (unchanged) while settlement_status == RECONCILED — the settle dimension moved without touching the lifecycle dimension"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: delinquency_contagion_loan_group_sibling_applications
        grounds:
          - state_machines.Loan.ACTIVE_to_DELINQUENT
          - state_machines.PeerGroup.ACTIVE_to_RESTRICTED
          - state_machines.LoanApplication.VOTING_to_EXPIRED
          - calculations.delinquency_evaluation
        distinguishing_aspect: |
          Depth-3 chain from the delinquency sweep: clock move -> Loan of M1
          flips DELINQUENT (hop 1); that loan transition increments the
          group's delinquent_loan_count to 1 and flips PeerGroup ACTIVE ->
          RESTRICTED (hop 2, caused by hop 1, not by the clock); the group
          restriction then EXPIRES peer M2's VOTING application and freezes
          sibling ladders (hop 3, caused by hop 2). Each hop is triggered by
          the previous mutation, not by the original clock call.
        test_recipe:
          setup:
            - "Group G1 ACTIVE with members M1, P1..P4; M1 holds an ACTIVE cycle-1 loan (first due 2026-09-08); P1 has a VOTING application submitted at logical 2026-09-12 (deadline 2026-09-19T00:00:00Z, 2 of 4 APPROVE votes cast); no other group loans."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            # --- move clock to 2026-09-12 (loan not yet delinquent: 4 days past
            #     first due < 8), so P1's application deadline 2026-09-19 lands
            #     AFTER the trigger sweep date 2026-09-16 — isolating contagion
            #     as the sole cause of EXPIRED ---
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: ProgramAdmin
            # --- P1's own application, still mid-vote ---
            - call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${p1}", requested_amount_cents: 50000 }
              as: FieldOfficer
              captures: { app_p1: $.data.id }
            - call: "POST /loan-applications/${app_p1}/submit"
              payload: {}
              as: FieldOfficer
            - call: "POST /loan-applications/${app_p1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /loan-applications/${app_p1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p2}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: ProgramAdmin
              captures: { sweep_out: $.data }
          assert:
            - "at 2026-09-16 the first due (2026-09-08) is 8 days past: Loan.${loan1}.status == DELINQUENT with installments_missed == 1"
            - "PeerGroup.${g1_id}.status == RESTRICTED and delinquent_loan_count == 1 (hop 2)"
            - "LoanApplication.${app_p1}.status == EXPIRED even though its voting_deadline 2026-09-19 is AFTER the sweep date 2026-09-16 — the deadline sweep cannot have fired it; the group-RESTRICTED cascade (hop 3) is the only possible cause"
            - "Member.${m1}.status == DELINQUENT and Member.${p1}.status remains ELIGIBLE (delinquency does not blacklist by itself)"

      - name: meeting_close_absence_strike_cascade_rejects_voting_application
        grounds:
          - state_machines.CenterMeeting.OPEN_to_CLOSED
          - state_machines.LoanApplication.VOTING_to_REJECTED
          - entities.Member.fields.consecutive_absence_streak
          - entities.Member.fields.attendance_strikes
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (meeting close, not the
          clock): close -> auto-mark ABSENT (hop 1) -> applicant's
          consecutive_absence_streak reaches exactly 2, firing
          attendance_strikes += 1 and a credit-score recompute (hop 2) ->
          the applicant's own VOTING application is auto-REJECTED (hop 3).
          Originates from POST .../close, a different triggering transition
          than the delinquency sweep.
        test_recipe:
          setup:
            - "Group ACTIVE; member P1 has a VOTING application (2 APPROVE votes in). P1 was auto-marked ABSENT at the 2026-09-08 meeting (streak 1). A second meeting on 2026-09-15 is OPEN with only M1..P4 marked present (P1 unmarked)."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            # --- P1's application goes VOTING first (streak 0 at submit) ---
            - call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${p1}", requested_amount_cents: 50000 }
              as: FieldOfficer
              captures: { app_p1b: $.data.id }
            - call: "POST /loan-applications/${app_p1b}/submit"
              payload: {}
              as: FieldOfficer
            - call: "POST /loan-applications/${app_p1b}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /loan-applications/${app_p1b}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p2}"
            # --- first meeting: P1 unmarked -> auto ABSENT at close (streak 1) ---
            - *d_mt1
            - *d_mt1o
            - *d_att_m1
            - *d_att_p2
            - *d_att_p3
            - *d_att_p4
            - *d_mt1c
            # --- second meeting: P1 unmarked again ---
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt_b: $.data.id }
            - call: "POST /center-meetings/${mt_b}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_b}/attendance"
              payload: { member_id: "${m1}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_b}/attendance"
              payload: { member_id: "${p2}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_b}/attendance"
              payload: { member_id: "${p3}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_b}/attendance"
              payload: { member_id: "${p4}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /center-meetings/${mt_b}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
          assert:
            - "Member.${p1}.consecutive_absence_streak == 2 and attendance_strikes == 1 (hop 2)"
            - "LoanApplication.${app_p1b}.status == REJECTED (hop 3 — strike during VOTING auto-rejects)"
            - "Member.${p1}.credit_score == 600 (no loans exist and the no-loan base rule reads 600; the strike feeds eligibility and future provisional/final scores, not the no-loan reading)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

