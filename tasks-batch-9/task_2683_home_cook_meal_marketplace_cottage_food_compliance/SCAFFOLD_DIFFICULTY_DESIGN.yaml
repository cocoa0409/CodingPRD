  - rule_id: resource_temporal_overlap
    instances:
      - name: cook_window_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=34]
          - errors.ERR_WINDOW_OVERLAP
          - entities.ProductionWindow.fields.handoff_start_at
          - entities.ProductionWindow.fields.handoff_end_at
        distinguishing_aspect: |
          The cook-level handoff interval is HALF-OPEN, so window B starting at the exact instant
          window A ends is legal, while a window that straddles the shared endpoint is not. Three
          creations on one cook pin the semantics: [16:00,18:00) admits, [18:00,20:00) admits
          (touching endpoints do NOT collide), and [17:00,19:00) is rejected 409 ERR_WINDOW_OVERLAP
          because it overlaps both of them.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Rui is ACTIVE and CLEAR with weekly_capacity_meals 5."
            - "No production windows exist for Rui yet; the clock is at the default 2026-08-01T00:00:00Z."
