  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_scheduling_depends_on_proctor_registration_state
        grounds:
          - validations[priority=20]
          - errors.ERR_PROCTOR_NOT_REGISTERED
          - state_machines.Proctor.PENDING_to_REGISTERED
          - state_machines.Proctor.UNDER_AUDIT_to_SUSPENDED
          - state_machines.ExamSession.ASSIGNED_to_PENDING_REPROCTOR
        distinguishing_aspect: |
          Entity pair ExamSession -> Proctor. The ExamSession creation transition is legal only while the
          referenced Proctor sits in REGISTERED: with the proctor still PENDING the create is rejected
          with ERR_PROCTOR_NOT_REGISTERED (409), the identical request succeeds the moment the
          registration decision lands, and when the proctor later leaves REGISTERED (audit closed with
          SUSPEND) the already-SCHEDULED sitting is pushed ASSIGNED -> PENDING_REPROCTOR and the
          proctor's reserved_minutes is given back. The dependency is therefore proved in both
          directions on the same pair.
        test_recipe:
          setup:
            - "Baseline jurisdiction / provider (500000) / EN form / 2-seat site / candidate / 1-unit EXAM_ONLY batch (3762) with its code assigned."
            - "One proctor created but NOT yet decided, so registration_status == PENDING and reserved_minutes == 0."
