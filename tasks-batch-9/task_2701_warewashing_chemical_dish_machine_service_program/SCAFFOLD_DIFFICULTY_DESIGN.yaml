            - call: "POST /warewashing/investigation-cases/${case_id}/review"
              payload: { decision: "SUBSTANTIATE", remediation: "CHARGEBACK", finding_note: "6100 ml unaccounted" }
              as: QualityAuditor
              as_user_id: "auditor-3"
              captures: { case_status_4: $.data.case_status, chargeback: $.data.chargeback_cents }
          assert:
