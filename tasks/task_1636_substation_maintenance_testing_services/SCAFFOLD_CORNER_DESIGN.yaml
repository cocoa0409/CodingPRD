              payload: { substation_id: "${sub_id}", asset_class: "CIRCUIT_BREAKER", voltage_kv: 34.5, install_date: "2020-03-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "GET /assets"
              payload: { asset_class: "CIRCUIT_BREAKER" }
              as: OperationsManager
          assert:
            - "filtered list total_count == 1 and every returned row has asset_class == CIRCUIT_BREAKER"
