      - name: enroll_window_inclusive_close_boundary
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.AcademicTerm.fields.enroll_close
          - errors[ERR_OUTSIDE_ENROLL_WINDOW]
        distinguishing_aspect: |
          The enrollment window [enroll_open, enroll_close] is a CLOSED interval
          on the AcademicTerm resource: activation with clock exactly at
          enroll_close (2026-09-30) is ACCEPTED, but one day past
          (2026-10-01) is rejected ERR_OUTSIDE_ENROLL_WINDOW. Adjacency at the
          closed right endpoint is the interval semantic under test.
        test_recipe:
          setup:
            - "Institution INST_O clock set to exactly enroll_close 2026-09-30; Term FALL2026 OPEN (enroll_close 2026-09-30); Student S15; Template 4PAY; Enrollment PENDING charges 500000."
