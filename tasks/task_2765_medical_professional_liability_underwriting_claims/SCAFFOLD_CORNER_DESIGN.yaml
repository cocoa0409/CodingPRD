      # Codes already triggered by §1.8 instances - no duplicate corner test.
      - name: stale_policy_version_on_a_term_write_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STALE_POLICY_VERSION]
          - concurrency_rules.term-create-stale-policy
        excluded_because:
          difficulty_instance: stale_policy_version_on_overlapping_term_returns_412_not_overlap_conflict
          rationale: "That instance already carries a stale expected_policy_version into a term write and asserts the 412 with ERR_STALE_POLICY_VERSION ahead of the overlap conflict the same call would also have raised."
      - name: negotiation_state_gate_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEGOTIATION_STATE_INVALID]
          - validations[priority=41]
        excluded_because:
          difficulty_instance: replayed_payment_on_paid_negotiation_rejected_for_state_not_aggregate_limit
          rationale: "That instance replays a payment on a PAID negotiation and asserts ERR_NEGOTIATION_STATE_INVALID, proving the state gate answers ahead of the limit gates."
      - name: credentialing_gate_at_issuance_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREDENTIALING_NOT_VALID_FOR_TERM]
          - validations[priority=51]
        excluded_because:
          difficulty_instance: term_issuance_hinges_on_the_insureds_credentialing_axis_status_and_expiry
          rationale: "That instance asserts the 409 twice - once for a PENDING credentialing axis and once for an expiry inside the term - then the issuance that succeeds once the verdict is refreshed."
      - name: duty_to_defend_gate_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COVERAGE_DENIED_NO_DEFENSE]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: counsel_request_on_denied_claim_rejected_for_coverage_not_empty_panel
          rationale: "That instance asserts ERR_COVERAGE_DENIED_NO_DEFENSE on a DENIED claim and proves the code is not about an empty panel, which is the confusion worth testing."
      - name: ddr_eligibility_bounds_are_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DDR_NOT_ELIGIBLE]
          - validations[priority=71]
        excluded_because:
          difficulty_instance: ddr_free_tail_allowed_at_exactly_five_years_and_step_year_five_bounds
          rationale: "That instance walks both inclusive bounds of priority 71 and asserts the 422 below either one, which no additional corner test would sharpen."
      - name: term_period_overlap_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TERM_PERIOD_OVERLAP]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: adjacent_term_periods_pass_while_a_straddling_third_term_conflicts
          rationale: "That instance accepts two adjacent term periods sharing an endpoint and asserts ERR_TERM_PERIOD_OVERLAP only for a third term that straddles them, which is the whole content of the half-open-interval rule."
      - name: tail_window_overlap_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TAIL_WINDOW_OVERLAP]
          - validations[priority=68]
        excluded_because:
          difficulty_instance: tail_reporting_windows_are_closed_intervals_so_touching_endpoints_conflict
          rationale: "That instance asserts ERR_TAIL_WINDOW_OVERLAP for a second tail whose window touches an ISSUED one at a single endpoint, and the acceptance of a third quote starting the day after that window closes."
