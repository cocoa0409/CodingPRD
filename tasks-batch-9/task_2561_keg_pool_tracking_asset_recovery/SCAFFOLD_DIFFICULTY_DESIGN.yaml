      - name: upheld_chargeback_crosses_balance_threshold_and_suspends_the_float
        grounds:
          - state_machines.LossAssessment.chargeback_status.NONE_to_ISSUED
          - calculations.chargeback_ledger_conserved
          - calculations.float_posture
          - calculations.brewer_loss_rate_bp
          - entities.Brewer.fields.status_reason
          - validations.priority_15_ERR_FLOAT_SUSPENDED
        distinguishing_aspect: |
          Depth 5 and a completely different triggering transition from instance (i):
          POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD.
          assessment UPHELD -> chargeback_status ISSUED -> brewer.chargeback_balance_cents
          recomputed to 28200 -> brewer.status PROBATION (status_reason
          CHARGEBACK_BALANCE_THRESHOLD) -> every ACTIVE agreement of that brewer flips
          float_posture to SUSPENDED -> the next allocate is refused with ERR_FLOAT_SUSPENDED.
          The seven fills are sized so the TRAILING_90D loss rate is 1429 bp, strictly below
          PROBATION_LOSS_RATE_BP 1500: the probation is therefore attributable to the balance
          gate alone and the two probation causes cannot be confused.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z for the whole instance; all sub-timestamps are earlier the same day."
            - "Pool with replacement_cost_cents 28200 and ten kegs, so one REPLACEMENT_COST assessment at 10000 bp liability lands the balance at 28200, above PROBATION_BALANCE_THRESHOLD_CENTS 25000 in a single step."
            - "Seven kegs allocated on one order, dispatched and filled the same day: no dwell surcharge, and the billed ladder runs 2200, 2200, 2167, 2167, 2134, 2134, 2134 for a total of 15136."
            - "Three kegs stay IN_FLOAT so available_pct is 30.00 and the pool stays OPEN even after the loss: the suspension must come from the brewer, not from the pool."
            - "float_size_kegs 10 with replenishment_threshold_pct 20 gives tight_ceiling 2, so with seven kegs at the brewer the posture is HEALTHY before the uphold."
            - "credit_limit_cents 400000 keeps priority 50 out of the way throughout."
            - "Two analyst user ids because validation 26 forbids the creator of an assessment from resolving it."
            - "A second single-keg order io2 is created BEFORE the uphold, so its later allocate is not blocked by anything except the suspended float."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
