      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 ERR_MISSING_AUTH_HEADER before any role, existence, or state check."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { err: $.data.error_id } }
