            - "LINK 1 — ${dm_status} == SETTLED, ${dm_alae} == 1607143 (round_half_up(13,392,857 * 0.12)), ${dm_total} == 15000000, NegotiationRound.${nr_id}.outcome == ACCEPTED"
            - "LINK 2 — ${cl_handling} == SETTLEMENT_COMPLETE, ${cl_indemnity} == 13392857, ${cl_alae} == 1607143, ${cl_out} == 5000000, ${cl_exposure} == 20000000 (unchanged)"
            - "LINK 2 — Claim.${cl_id}.layer_allocations has exactly two entries: { policy_layer_id: ${pl_sir_id}, allocated_cents: 10000000 } then { policy_layer_id: ${pl_pri_id}, allocated_cents: 5000000 }; sir_eroded_cents == 10000000 and insured_paid_cents == 5000000"
            - "LINK 3 — ${sub_status_after} == READY_TO_PURSUE"
            - "LINK 3 — ${sub_base_after} == 15000000, read from the indemnity_paid_cents + alae_paid_cents that link 2 wrote in the same request"
            - "LINK 3 — ${sub_max_after} == 6000000 (round_half_up(15,000,000 * 40 / 100))"
            - "${cl_incurred} == 20000000 (13,392,857 + 1,607,143 + 5,000,000 - 0), so no recovery has been booked yet"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: settle_settled_demand_state_beats_fiscal_coverage
        grounds:
          - validations[priority=20]
          - validations[priority=70]
          - validations[priority=72]
          - state_machines.Demand.OFFER_OUTSTANDING_to_SETTLED
          - calculations.settlement_layer_waterfall
          - entities.PolicyLayer.fields.limit_cents
        distinguishing_aspect: |
          Error-category pair: state (priority 20, ERR_DEMAND_STATE_INVALID)
          against business_fiscal (priority 70, ERR_COVERAGE_EXHAUSTED). The
          second settle attempt violates both — the demand is already SETTLED
          and the tower has exactly 0 cents of capacity left — and the response
          MUST be the state error, proving the ladder is walked in priority order
          rather than in the order the checks are cheapest to evaluate.
        test_recipe:
          setup:
            - "One Terminal, one Driver, one MODERATE crash on 2026-07-30 (program year 2026)."
            - "A well-formed two-layer 2026 tower whose total capacity is exactly 15,000,000: layer_index 1 SIR attachment 0 limit 10,000,000, layer_index 2 PRIMARY attachment 10,000,000 limit 5,000,000."
            - "One Claim with a single THIRD_PARTY_PROPERTY Demand of 20,000,000 and a DEMAND_BASED revision that set outstanding_reserve_cents to 20,000,000."
            - "That demand already SETTLED at an offer of 13,392,857 for a settlement_total_cents of exactly 15,000,000, so remaining tower capacity is 0 and Claim.outstanding_reserve_cents is 5,000,000."
            - "Clock left at 2026-08-01T00:00:00Z, still inside the rescission window (nothing is rescinded)."
