    roles: [AccessServicesOfficer]
    code: 200
    input: []
    output: AccessRequest
    side_effects:
      - "state_machines.AccessRequest SUBMITTED -> SCREENING or REVALIDATION_REQUIRED -> SCREENING"

  - method: POST
    path: "/access-requests/{id}/revise"
    description: "Requester answers a CHANGES_REQUESTED screening with a narrowed item set, re-entering screening and re-running the PRELIM variant."
    roles: [Requester]
    code: 200
    input: ["requested_item_ids", "purpose?"]
    output: AccessRequest
    side_effects:
      - "state_machines.AccessRequest CHANGES_REQUESTED -> SCREENING; increments revision_round by 1"
      - "re-runs calculations.confidentiality_risk_score variant PRELIM and recomputes requested_page_count"
      - "any OPEN ConfidentialityScreening on the request moves to SUPERSEDED with superseded_reason REQUESTER_REVISION"

  - method: POST
    path: "/access-requests/{id}/approve"
    description: "Grant access at FULL or REDACTED scope; enforces segregation of duties against the screener, the legal-hold gate, finding-aid publication and the redaction threshold, and stamps the service fee."
    roles: [AccessServicesOfficer]
    code: 200
    input: [approval_scope]
    output: AccessRequest
    side_effects:
      - "state_machines.AccessRequest SCREENING -> APPROVED (FULL) or SCREENING -> PARTIALLY_APPROVED (REDACTED)"
      - "runs calculations.access_service_fee into service_fee_cents; stamps decided_by from X-User-ID"

  - method: POST
    path: "/access-requests/{id}/deny"
    description: "Deny a screened request."
    roles: [AccessServicesOfficer]
    code: 200
    input: [deny_reason]
    output: AccessRequest
    side_effects:
      - "state_machines.AccessRequest SCREENING -> DENIED; stamps decided_by and deny_reason; no fee is charged"

  - method: POST
    path: "/access-requests/{id}/close"
    description: "Close out a decided request."
    roles: [AccessServicesOfficer]
    code: 200
    input: []
    output: AccessRequest
    side_effects:
      - "state_machines.AccessRequest APPROVED / PARTIALLY_APPROVED / DENIED -> CLOSED (terminal)"

  # ------------------------------------------------ confidentiality screenings
  - method: POST
    path: "/confidentiality-screenings"
    description: "Open a confidentiality screening over a request under screening. Carries the OCC token expected_access_request_version per §1.2.1 screening-create-stale-request; a stale value is rejected with ERR_STALE_ACCESS_REQUEST_VERSION (412)."
    roles: [AccessServicesOfficer]
    code: 201
    input: [access_request_id, expected_access_request_version]
    output: ConfidentialityScreening
    side_effects:
      - "stamps screened_by from X-User-ID and max_item_sensitivity from the request's item set; status OPEN"
      - "any prior OPEN screening on the request moves to SUPERSEDED with superseded_reason NEW_SCREENING"
      - "sets AccessRequest.current_screening_id to the new row and increments AccessRequest.version by 1"

  - method: GET
    path: "/confidentiality-screenings"
    description: "List screenings, optionally filtered by the request under screening."
    roles: [ArchivesDirector, AccessServicesOfficer, LegalCounsel]
    code: 200
    input: ["access_request_id?", "status?", "limit?", "offset?"]
    output: ConfidentialityScreening[]
    side_effects: []

  - method: GET
    path: "/confidentiality-screenings/{id}"
    description: "Fetch one screening."
    roles: [ArchivesDirector, AccessServicesOfficer, LegalCounsel]
    code: 200
    input: []
    output: ConfidentialityScreening
    side_effects: []

  - method: POST
    path: "/confidentiality-screenings/{id}/complete"
    description: "Record the screening decision; runs the POST_SCREEN risk variant onto the parent request."
    roles: [AccessServicesOfficer]
    code: 200
    input: ["decision", "redaction_required?", "screening_note?"]
    output: ConfidentialityScreening
    side_effects:
      - "state_machines.ConfidentialityScreening OPEN -> COMPLETED; stamps completed_at"
      - "runs calculations.confidentiality_risk_score variant POST_SCREEN into AccessRequest.post_screen_risk_score"
      - "a CHANGES_REQUESTED decision moves the request SCREENING -> CHANGES_REQUESTED"

