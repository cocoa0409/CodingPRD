  - section: errors
    instances:
      - name: missing_or_unknown_role_header_returns_4XX_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority 1].ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error_shape
        distinguishing_aspect: "The priority-1 header check runs before role authorisation, existence and body validation, so an omitted X-User-ID and an X-User-Role outside the five declared roles both return 401 ERR_UNAUTHENTICATED rather than 403 or 404."
        test_recipe:
          setup:
            - "One client exists so that a legitimate request would otherwise succeed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/clients"
              payload: { full_name: "Ines Rivera", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "(omitted — the X-User-ID header is absent)"
              captures: { err_no_id: $.data.error_id }
            - call: "GET /care/clients/${cli}"
              as: "AUDITOR (not one of the five declared roles)"
              as_user_id: "(any value)"
              captures: { err_bad_role: $.data.error_id }
          assert:
            - "With X-User-Role present but X-User-ID absent: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "With X-User-Role == \"AUDITOR\": HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\", not 403 ERR_UNAUTHORIZED"
            - "Both responses carry the declared error envelope: data.error_id and data.message are present and data holds no client payload"

      - name: not_found_sweep_returns_4XX_for_every_entity_path
        claim_type: error_triggerable
        grounds:
          - validations[priority 10..21]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
        distinguishing_aspect: "Each of the twelve entity read paths maps an unknown id to its own 404 code, so no two entities share a not-found error_id and none of them falls back to a generic 404."
        test_recipe:
          setup:
            - "An empty store apart from the logical clock; every id used below is absent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T09:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "GET /care/clients/00000000-0000-4000-8000-00000000000a"
              as: PracticeAdmin
              captures: { e_client: $.data.error_id }
            - call: "GET /care/care-managers/00000000-0000-4000-8000-00000000000b"
              as: PracticeAdmin
              captures: { e_cm: $.data.error_id }
            - call: "GET /care/vendors/00000000-0000-4000-8000-00000000000c"
              as: PracticeAdmin
              captures: { e_vendor: $.data.error_id }
            - call: "GET /care/family-contacts/00000000-0000-4000-8000-00000000000d"
              as: PracticeAdmin
              captures: { e_contact: $.data.error_id }
            - call: "GET /care/assessments/00000000-0000-4000-8000-00000000000e"
              as: PracticeAdmin
              captures: { e_asm: $.data.error_id }
            - call: "GET /care/care-plans/00000000-0000-4000-8000-00000000000f"
              as: PracticeAdmin
              captures: { e_plan: $.data.error_id }
            - call: "GET /care/service-authorizations/00000000-0000-4000-8000-000000000010"
              as: PracticeAdmin
              captures: { e_auth: $.data.error_id }
            - call: "GET /care/family-conferences/00000000-0000-4000-8000-000000000011"
              as: PracticeAdmin
              captures: { e_conf: $.data.error_id }
            - call: "GET /care/conference-decisions/00000000-0000-4000-8000-000000000012"
              as: PracticeAdmin
              captures: { e_dec: $.data.error_id }
            - call: "GET /care/crisis-episodes/00000000-0000-4000-8000-000000000013"
              as: PracticeAdmin
              captures: { e_ep: $.data.error_id }
            - call: "GET /care/time-entries/00000000-0000-4000-8000-000000000014"
              as: PracticeAdmin
              captures: { e_te: $.data.error_id }
            - call: "GET /care/invoices/00000000-0000-4000-8000-000000000015"
              as: PracticeAdmin
              captures: { e_inv: $.data.error_id }
          assert:
            - "All twelve calls return HTTP 404"
            - "The error_ids are exactly ERR_CLIENT_NOT_FOUND, ERR_CARE_MANAGER_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CARE_PLAN_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_CONFERENCE_NOT_FOUND, ERR_DECISION_NOT_FOUND, ERR_CRISIS_EPISODE_NOT_FOUND, ERR_TIME_ENTRY_NOT_FOUND and ERR_INVOICE_NOT_FOUND, in that order"
            - "Each response carries data.error_id and data.message; no two paths return the same error_id"

