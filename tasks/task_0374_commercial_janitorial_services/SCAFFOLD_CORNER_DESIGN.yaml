            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
              captures: { actual: $.data.actual_labor_min }
          assert:
            - "HTTP status == 200"
            - "Visit.${visit_id}.actual_labor_min == 60 (VOIDED entry excluded)"

      - name: periodic_charge_no_overage_straight_rate_only
        claim_type: Correct Result
        grounds:
          - calculations.periodic_charge_cents
          - entities.BillingPeriod.fields.periodic_cents
          - entities.ServiceContract.fields.hourly_rate_cents
        distinguishing_aspect: "When actual (120 min) <= quoted (120 min) the overage tier is empty: periodic_charge_cents = round(120 * 6000/60) = 12000 with no 1.5x surcharge — the tiered_pricing lower boundary, distinct from §1.8's overage case (24000)."
