# =============================================================================
# §1.9 Scaffold Corner Design — Commissary & Exchange Retail Operations
# =============================================================================
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked section-by-section against
# references/claim-extraction-guide.md. `section:` values and `claim_type:`
# values are taken only from that guide. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs naming the
# covering §1.8 instance.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_store_created_with_all_optional_fields_returns_derived_fund_state
        claim_type: creation
        grounds:
          - endpoints[POST /stores]
          - entities.Store.fields.fund_posture
          - entities.Store.fields.period_close_index
        distinguishing_aspect: |
          A create that supplies every optional input returns 201 with those
          inputs echoed verbatim and all five derived fields seeded: the four
          fund totals at 0 and fund_posture FROZEN, because surcharge_available
          starts at 0 which is below the CONSTRAINED floor of 100000.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Ramstein Exchange", channel: "EXCHANGE", region: "OVERSEAS", surcharge_rate_bp: 400, exchange_markup_bp: 750, shelf_block_capacity_facings: 30 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Store.${store_id}.name == Ramstein Exchange, channel == EXCHANGE, region == OVERSEAS"
            - "Store.${store_id}.surcharge_rate_bp == 400, exchange_markup_bp == 750, shelf_block_capacity_facings == 30"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0, surcharge_obligated_cents == 0, dividend_fund_balance_cents == 0, shipping_allowance_committed_cents == 0"
            - "Store.${store_id}.fund_posture == FROZEN and period_close_index == 0"
            - "Store.${store_id}.version == 1"

      - name: corner_get_patron_returns_stored_enrollment_record
        claim_type: retrieval
        grounds:
          - endpoints[GET /patrons/{id}]
          - entities.Patron.fields.id_card_class
        distinguishing_aspect: |
          A read-back of an enrolled patron returns the same id_card_class and
          full_name that were posted, plus both risk scores at 0 and both state
          dimensions at their initial values, and does not bump version.
        test_recipe:
          setup:
            - "One RETIREE patron enrolled by the compliance officer."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "MSG (Ret) D Whitlock", id_card_class: "RETIREE" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id, patron_v0: $.data.version }
          trigger:
            - call: "GET /patrons/${patron_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "Patron.${patron_id}.full_name == MSG (Ret) D Whitlock and id_card_class == RETIREE"
            - "Patron.${patron_id}.card_status == VALID, suspension_reason == null, resale_watch_status == CLEAR"
            - "Patron.${patron_id}.resale_risk_score == 0, recent_sales_risk_score == 0, restricted_units_30d == 0, flagged_sale_count_30d == 0, manual_strike_count == 0"
            - "Patron.${patron_id}.sponsor_patron_id == null and version == ${patron_v0}"

      - name: corner_products_list_second_page_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /products]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three products stored, GET /products?limit=2&offset=0 returns
          exactly 2 rows with total_count 3 and has_more true, and offset=2
          returns 1 row with has_more false — total_count counts the whole
          filtered set, not the page.
        test_recipe:
          setup:
            - "Three products created in a known order."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SKU-PAG-001", name: "Canned Corn", category: "GROCERY_STAPLE", unit_cost_cents: 120 }
              as: AssortmentPlanner
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-PAG-002", name: "Canned Peas", category: "GROCERY_STAPLE", unit_cost_cents: 130 }
              as: AssortmentPlanner
              captures: { p2_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-PAG-003", name: "Canned Beans", category: "GROCERY_STAPLE", unit_cost_cents: 140 }
              as: AssortmentPlanner
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /products"
              payload: { limit: 2, offset: 2 }
              as: AssortmentPlanner
          assert:
            - "HTTP status == 200 and response_type == array"
            - "meta/pagination reports total_count == 3, limit == 2, offset == 2, has_more == false"
            - "exactly 1 row is returned and data[0].id == ${p3_id}"
            - "A second read with limit 2 and offset 0 returns 2 rows, total_count == 3 and has_more == true"

      - name: corner_get_special_order_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /special-orders/{id}]
          - errors[ERR_SPECIAL_ORDER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no SpecialOrder returns 404
          ERR_SPECIAL_ORDER_NOT_FOUND — the collection-specific code, not a
          generic not-found.
        test_recipe:
          setup:
            - "Empty database (no special orders exist)."
          setup_api_calls: []
          trigger:
            - call: "GET /special-orders/6f0a1d3c-8b52-4e77-9a10-0d4c5e2b7f31"
              payload: {}
              as: StoreCashier
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_SPECIAL_ORDER_NOT_FOUND"
            - "data.message is a non-empty string and response_type == error"

      - name: corner_get_sale_line_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /sale-lines/{id}]
          - errors[ERR_SALE_LINE_NOT_FOUND]
        distinguishing_aspect: |
          The child collection has its own 404 code: an unknown sale-line id
          returns ERR_SALE_LINE_NOT_FOUND, never ERR_SALE_NOT_FOUND, even though
          SaleLine's parent is Sale.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /sale-lines/2c9d47ab-5f31-4c08-b6de-71a9c3f0e824"
              payload: {}
              as: StoreCashier
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_SALE_LINE_NOT_FOUND"

      - name: corner_create_assortment_missing_facings_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /assortments]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: |
          facings has no default in §1.1, so omitting it is a schema failure:
          422 ERR_INVALID_REQUEST is returned before any capacity, OCC or
          referential check runs, and no Assortment row is created.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one product."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Riley Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-REQ-010", name: "Whole Milk Gallon", category: "GROCERY_STAPLE", unit_cost_cents: 380 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "A1", supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /assortments with store_id == ${store_id} returns total_count == 0"
            - "Store.${store_id}.version == ${store_v0} — a rejected create does not bump the OCC parent"

      - name: corner_store_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Store.fields.surcharge_rate_bp
          - entities.Store.fields.exchange_markup_bp
          - entities.Store.fields.shelf_block_capacity_facings
        distinguishing_aspect: |
          Omitting all three optional inputs yields exactly the §1.1 defaults —
          surcharge_rate_bp 500, exchange_markup_bp 0, shelf_block_capacity_facings
          24 — not nulls and not zeros across the board.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Fort Stewart Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Store.${store_id}.surcharge_rate_bp == 500"
            - "Store.${store_id}.exchange_markup_bp == 0"
            - "Store.${store_id}.shelf_block_capacity_facings == 24"

      - name: corner_product_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Product.fields.unit_weight_grams
          - entities.Product.fields.resale_restricted
          - entities.Product.fields.quantity_limit_per_visit
        distinguishing_aspect: |
          A different entity's default set, including a null default that must
          stay null rather than becoming 0: unit_weight_grams 500,
          resale_restricted false, quantity_limit_per_visit null (unlimited).
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-DEF-050", name: "Paper Towels 6pk", category: "GENERAL_MERCHANDISE", unit_cost_cents: 640 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Product.${product_id}.unit_weight_grams == 500"
            - "Product.${product_id}.resale_restricted == false"
            - "Product.${product_id}.quantity_limit_per_visit == null"

      - name: corner_exchange_sale_line_computes_markup_rounded_per_unit
        claim_type: computed_fields
        grounds:
          - calculations.line_retail_price
          - entities.SaleLine.fields.unit_price_cents
          - entities.SaleLine.fields.line_markup_cents
          - entities.SaleLine.fields.line_surcharge_cents
        distinguishing_aspect: |
          Every SaleLine money field is computed from Product.unit_cost_cents and
          the Store's rates, never supplied: at cost 333 and exchange_markup_bp
          750 the markup is rounded once per UNIT to 25, giving unit_price 358,
          extended 1432 at quantity 4, line_markup 100 and line_surcharge 72.
          Rounding the markup after multiplying by quantity would give 1431/99.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store with exchange_markup_bp 750 and surcharge_rate_bp 500."
            - "One GENERAL_MERCHANDISE product at unit_cost_cents 333."
            - "One ACTIVE WAREHOUSE assortment covering 2026-08-01 through 2026-08-31."
            - "One OPEN sale at business_date 2026-08-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Campbell Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500, exchange_markup_bp: 750 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-EXC-333", name: "Desk Lamp", category: "GENERAL_MERCHANDISE", unit_cost_cents: 333 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "B2", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT B Ferro", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 4 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          assert:
            - "SaleLine.${line_id}.unit_price_cents == 358"
            - "SaleLine.${line_id}.extended_cents == 1432"
            - "SaleLine.${line_id}.line_markup_cents == 100"
            - "SaleLine.${line_id}.line_surcharge_cents == 72"
            - "SaleLine.${line_id}.line_shipping_allowance_cents == 0 and restricted_units == 0"
            - "Sale.${sale_id}.merchandise_cents == 1432, markup_total_cents == 100, surcharge_total_cents == 72, tax_cents == 0, total_due_cents == 1504"

      - name: corner_patron_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Patron.fields.card_status
          - entities.Patron.fields.resale_watch_status
          - endpoints[POST /patrons]
        distinguishing_aspect: |
          POST /patrons accepts only full_name, id_card_class and
          sponsor_patron_id; id, created_at, updated_at, version, card_status and
          resale_watch_status are all minted by the server, with version starting
          at exactly 1 and card_status at VALID.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { full_name: "SPC C Nakamura", id_card_class: "GUARD_RESERVE" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id, created: $.data.created_at, patron_v0: $.data.version }
          assert:
            - "HTTP status == 201"
            - "data.id is a bare UUID with no type prefix"
            - "data.created_at and data.updated_at are ISO 8601 UTC instants with three fractional digits"
            - "Patron.${patron_id}.version == 1"
            - "Patron.${patron_id}.card_status == VALID and resale_watch_status == CLEAR"

      - name: corner_store_with_illegal_channel_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Store.fields.channel
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          channel is constrained to COMMISSARY | EXCHANGE, so the value
          "PX_ANNEX" is a 422 ERR_INVALID_REQUEST and no Store row is written —
          the enum is closed, not free text.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Bogus Site", channel: "PX_ANNEX", region: "CONUS" }
              as: SurchargeFundController
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /stores returns total_count == 0"

      - name: corner_delegation_with_valid_to_equal_to_valid_from_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ShopperDelegation.fields.valid_to
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: |
          valid_to carries the constraint "> valid_from", so an empty window with
          both bounds at 2026-08-05T00:00:00Z is a 422 schema failure caught at
          priority 5 — before the priority-37 overlap check and before the
          priority-12 OCC check.
        test_recipe:
          setup:
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "SFC E Marchetti", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "F Marchetti", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
          trigger:
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-05T00:00:00Z", valid_to: "2026-08-05T00:00:00Z", per_sale_spend_cap_cents: 25000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /shopper-delegations with delegate_patron_id == ${delegate_id} returns total_count == 0"
            - "Patron.${delegate_id}.version == ${delegate_v0}"

      - name: corner_sale_line_carries_no_version_and_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.SaleLine
          - endpoints[GET /sale-lines/{id}]
        distinguishing_aspect: |
          SaleLine is declared common_fields: false, so its representation
          carries id and created_at but no updated_at and no version, and §1.5
          exposes no PATCH/PUT/DELETE for /sale-lines/{id} — a line is corrected
          by voiding the sale, never by editing the row.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, one product, one ACTIVE assortment, one OPEN sale carrying one line of quantity 1."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Knox Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-IMM-100", name: "Bread Loaf", category: "GROCERY_STAPLE", unit_cost_cents: 200 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "C3", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "CPL G Ibarra", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /sale-lines/${line_id}"
              payload: {}
              as: StoreCashier
          assert:
            - "HTTP status == 200"
            - "data contains id and created_at but no version field and no updated_at field"
            - "SaleLine.${line_id}.sale_id == ${sale_id}, unit_price_cents == 200, extended_cents == 200, line_surcharge_cents == 10"
            - "No PATCH, PUT or DELETE route exists for /sale-lines/{id} in §1.5"

      - name: corner_fund_ledger_entries_are_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.FundLedgerEntry
          - endpoints[GET /stores/{id}/fund-ledger]
          - entities.FundLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          FundLedgerEntry is common_fields: false and write-only through side
          effects: there is no POST /fund-ledger, entries carry id and created_at
          only, and a reversal is expressed as a NEW entry so the collection
          count grows from 1 to 2 rather than the original entry changing.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with surcharge_rate_bp 500."
            - "One product at unit_cost_cents 200 with an ACTIVE assortment."
            - "One TENDERED sale of quantity 1, producing a single SURCHARGE_COLLECTION entry of 10."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Sill Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-LED-200", name: "Rice Cakes", category: "GROCERY_STAPLE", unit_cost_cents: 200 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "D4", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SSG H Delacroix", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          trigger:
            - call: "GET /stores/${store_id}/fund-ledger"
              payload: { fund: "SURCHARGE" }
              as: SurchargeFundController
          assert:
            - "HTTP status == 200 and total_count == 1"
            - "data[0].entry_type == SURCHARGE_COLLECTION, data[0].amount_cents == 10, data[0].balance_after_cents == 10"
            - "data[0].source_ref_kind == SALE and data[0].source_ref_id == ${sale_id}"
            - "data[0].period_close_index == 0"
            - "each row carries id and created_at but no version and no updated_at field"
            - "§1.5 exposes no POST, PATCH, PUT or DELETE route on any fund-ledger path"

      - name: corner_dependent_patron_without_sponsor_returns_sponsor_required
        claim_type: parent_relationships
        grounds:
          - entities.Patron.fields.sponsor_patron_id
          - errors[ERR_SPONSOR_REQUIRED]
          - validations[priority=7]
        distinguishing_aspect: |
          The self-referential sponsor link is mandatory exactly when
          id_card_class == DEPENDENT: omitting it yields 422 ERR_SPONSOR_REQUIRED
          at priority 7, distinct from the generic priority-5 schema failure.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { full_name: "K Orlowski", id_card_class: "DEPENDENT" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_SPONSOR_REQUIRED"
            - "GET /patrons returns total_count == 0"

      - name: corner_assortment_referencing_unknown_product_returns_product_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Assortment.fields.product_id
          - errors[ERR_PRODUCT_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          Assortment is the store x product junction of the graph topology, so
          both foreign keys are resolved at priority 6: a real store id with an
          unknown product id returns 404 ERR_PRODUCT_NOT_FOUND, and the
          priority-11 OCC check never runs.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and no products."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Carson Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "b41f7d20-6c9e-4a5b-8f13-2e7a90c4d658", shelf_block: "E5", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_PRODUCT_NOT_FOUND"
            - "Store.${store_id}.version == ${store_v0}"
            - "GET /assortments with store_id == ${store_id} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_new_capital_project_starts_in_draft_state
        claim_type: initial_state
        grounds:
          - state_machines.CapitalProject.initial_state
          - entities.CapitalProject.fields.state
          - entities.CapitalProject.fields.revision_count
        distinguishing_aspect: |
          A freshly drafted project is in state DRAFT with revision_count 0 and
          all three user stamps null, and its obligation is already computed at
          creation — the contingency is not deferred to approval.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Benning Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Deli case replacement", requested_amount_cents: 40000 }
              as: SurchargeFundController
              as_user_id: "sfc-100"
              captures: { project_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CapitalProject.${project_id}.state == DRAFT and revision_count == 0"
            - "CapitalProject.${project_id}.submitted_by_user_id == null, decided_by_user_id == null, closed_by_user_id == null"
            - "CapitalProject.${project_id}.contingency_bp == 1000, contingency_cents == 4000, obligation_cents == 44000"
            - "CapitalProject.${project_id}.outlay_cents == null"
            - "Store.${store_id}.surcharge_obligated_cents == 0 — a DRAFT project obligates nothing"

      - name: corner_submit_draft_project_moves_to_submitted_and_stamps_user
        claim_type: valid_transition
        grounds:
          - state_machines.CapitalProject.DRAFT_to_SUBMITTED
          - entities.CapitalProject.fields.submitted_by_user_id
        distinguishing_aspect: |
          Submitting from DRAFT lands in SUBMITTED, records the caller's opaque
          X-User-ID in submitted_by_user_id, and leaves revision_count at 0
          because the increment fires only on re-submission from
          RETURNED_FOR_REVISION.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with one DRAFT capital project of requested_amount_cents 40000."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bragg Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Bakery oven", requested_amount_cents: 40000 }
              as: SurchargeFundController
              as_user_id: "sfc-101"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-101"
          assert:
            - "HTTP status == 200"
            - "CapitalProject.${project_id}.state == SUBMITTED"
            - "CapitalProject.${project_id}.submitted_by_user_id == sfc-101"
            - "CapitalProject.${project_id}.revision_count == 0"
            - "CapitalProject.${project_id}.obligation_cents == 44000 — submission does not re-run the contingency calculation"

      - name: corner_decision_on_draft_project_returns_project_not_submitted
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CapitalProject.SUBMITTED_to_APPROVED
          - errors[ERR_PROJECT_NOT_SUBMITTED]
          - validations[priority=22]
        distinguishing_aspect: |
          The board cannot decide a project that was never submitted: a DRAFT
          project returns 409 ERR_PROJECT_NOT_SUBMITTED and decided_by_user_id
          stays null, so the approval chain cannot be short-circuited.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with one DRAFT capital project."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Gordon Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Cart corral", requested_amount_cents: 20000 }
              as: SurchargeFundController
              as_user_id: "sfc-102"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-102"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_PROJECT_NOT_SUBMITTED"
            - "CapitalProject.${project_id}.state == DRAFT and decided_by_user_id == null"
            - "Store.${store_id}.surcharge_obligated_cents == 0"

      - name: corner_second_revoke_of_delegation_returns_delegation_not_active
        claim_type: idempotency
        grounds:
          - state_machines.ShopperDelegation.ACTIVE_to_REVOKED
          - errors[ERR_DELEGATION_NOT_ACTIVE]
          - validations[priority=23]
        distinguishing_aspect: |
          Revoke is not idempotent: the first call returns 200 and REVOKED, the
          second returns 409 ERR_DELEGATION_NOT_ACTIVE because REVOKED is a
          terminal status, and the delegation's version does not advance twice.
        test_recipe:
          setup:
            - "One sponsor patron, one DEPENDENT delegate patron, and one delegation already REVOKED."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "MSG P Vandermeer", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Q Vandermeer", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 30000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /shopper-delegations/${delegation_id}/revoke"
              payload: { reason: "PRIVILEGE_WITHDRAWN" }
              as: ComplianceOfficer
              captures: { revoked_version: $.data.version }
          trigger:
            - call: "POST /shopper-delegations/${delegation_id}/revoke"
              payload: { reason: "PRIVILEGE_WITHDRAWN" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_DELEGATION_NOT_ACTIVE"
            - "ShopperDelegation.${delegation_id}.status == REVOKED"
            - "ShopperDelegation.${delegation_id}.version == ${revoked_version} — the rejected second revoke bumped nothing"

      - name: corner_submit_of_rejected_project_returns_project_not_draft
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CapitalProject.SUBMITTED_to_REJECTED
          - state_machines.CapitalProject.terminal_states
          - errors[ERR_PROJECT_NOT_DRAFT]
        distinguishing_aspect: |
          REJECTED is terminal: re-submitting a rejected project returns 409
          ERR_PROJECT_NOT_DRAFT and the state stays REJECTED, so a rejected
          request cannot be resurrected by resubmission — only a RETURN decision
          reopens the cycle.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with one capital project the board has REJECTED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Hood Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Parking lot resurfacing", requested_amount_cents: 60000 }
              as: SurchargeFundController
              as_user_id: "sfc-103"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-103"
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "REJECT", note: "Out of scope for the surcharge fund" }
              as: MwrBoardOfficer
              as_user_id: "mwr-103"
          trigger:
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-103"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_PROJECT_NOT_DRAFT"
            - "CapitalProject.${project_id}.state == REJECTED and revision_count == 0"
            - "CapitalProject.${project_id}.decided_by_user_id == mwr-103"

      - name: corner_card_revocation_revokes_all_delegations_and_freezes_watch_axis
        claim_type: side_effect_execution
        grounds:
          - state_machines.Patron.SUSPENDED_to_REVOKED
          - entities.ShopperDelegation.fields.status
          - entities.Patron.fields.resale_watch_status
        distinguishing_aspect: |
          REVOKE sweeps every delegation where the patron is sponsor OR delegate
          and whose status is ACTIVE or SUSPENDED_BY_SPONSOR into REVOKED, leaves
          suspension_reason at the value the earlier suspension wrote, and freezes
          the resale_watch_status axis instead of re-deriving it.
        test_recipe:
          setup:
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron sponsored by them."
            - "One ACTIVE delegation of the sponsor to the delegate."
            - "The sponsor's card has been SUSPENDED by admin action, which cascaded the delegate's card to SUSPENDED/SPONSOR_SUSPENDED and the delegation to SUSPENDED_BY_SPONSOR."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "CW3 R Sanjuan", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "S Sanjuan", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 30000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "SUSPEND", reason: "ADMIN_ACTION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "REVOKE" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "Patron.${sponsor_id}.card_status == REVOKED and suspension_reason == ADMIN_ACTION"
            - "Patron.${sponsor_id}.resale_watch_status == CLEAR and resale_risk_score == 0 — the watch axis is frozen, not recomputed"
            - "ShopperDelegation.${delegation_id}.status == REVOKED"
            - "Patron.${delegate_id}.card_status == SUSPENDED and suspension_reason == SPONSOR_SUSPENDED — revocation of the sponsor does not revoke the dependent's card"

      - name: corner_reinstatement_compensates_three_hop_suspension_end_to_end
        claim_type: compensation
        grounds:
          - state_machines.Patron.SUSPENDED_to_VALID
          - state_machines.ShopperDelegation.SUSPENDED_BY_SPONSOR_to_ACTIVE
          - state_machines.Sale.FLAGGED_to_CLEARED
        distinguishing_aspect: |
          REINSTATE undoes all three suspension hops with no drift: the dependent
          returns to VALID with suspension_reason null, the delegation returns to
          ACTIVE, and the OPEN sale's compliance_state returns to CLEARED so the
          sale becomes tenderable again — while the money fields it accumulated
          before the suspension are untouched.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, and one product at unit_cost_cents 500 with an ACTIVE assortment."
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron, with an ACTIVE delegation between them."
            - "One OPEN sale at business_date 2026-08-02T00:00:00Z citing the delegation, carrying one line of quantity 2 (merchandise 1000, surcharge 50)."
            - "The sponsor's card has been SUSPENDED, cascading the dependent to SUSPENDED, the delegation to SUSPENDED_BY_SPONSOR and the sale to FLAGGED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Belvoir Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-CMP-500", name: "Ground Coffee 12oz", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "F6", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "1SG T Abernathy", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "U Abernathy", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 30000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${sponsor_id}", acting_delegation_id: "${delegation_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "SUSPEND", reason: "ADMIN_ACTION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "Patron.${sponsor_id}.card_status == VALID and suspension_reason == null"
            - "Patron.${delegate_id}.card_status == VALID and suspension_reason == null"
            - "ShopperDelegation.${delegation_id}.status == ACTIVE"
            - "Sale.${sale_id}.compliance_state == CLEARED and tender_state == OPEN"
            - "Sale.${sale_id}.merchandise_cents == 1000, surcharge_total_cents == 50, total_due_cents == 1050 — compensation restores states, never money"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0"

      - name: corner_close_period_expires_lapsed_delegation_and_fulfils_pending_order
        claim_type: conditional_cascade
        grounds:
          - state_machines.ShopperDelegation.ACTIVE_to_EXPIRED
          - state_machines.SpecialOrder.LOCAL_FILL_PENDING_to_FULFILLED
          - endpoints[POST /stores/{id}/close-period]
          - entities.Store.fields.period_close_index
        distinguishing_aspect: |
          The checkpoint sweep is conditional per row: a delegation whose
          valid_to (2026-08-05) is at or before the clock (2026-08-06) becomes
          EXPIRED while a LOCAL_FILL_PENDING order of the same store becomes
          FULFILLED with its zero commitment untouched, and period_close_index
          advances from 0 to exactly 1.
        test_recipe:
          setup:
            - "One COMMISSARY / OVERSEAS store and one product with an ACTIVE assortment covering 2026-08-01 through 2026-08-31."
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron with an ACTIVE delegation over [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z)."
            - "One SpecialOrder of the sponsor routed LOCAL_FILL, so it sits in LOCAL_FILL_PENDING with shipping_allowance_cents 0."
            - "The logical clock has advanced to 2026-08-06T00:00:00Z, past the delegation's valid_to."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Vicenza Commissary", channel: "COMMISSARY", region: "OVERSEAS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-SWP-700", name: "Olive Oil 1L", category: "GROCERY_STAPLE", unit_cost_cents: 700, unit_weight_grams: 1000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "G7", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "MAJ V Castellano", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "W Castellano", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-05T00:00:00Z", per_sale_spend_cap_cents: 30000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${sponsor_id}", product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { order_id: $.data.id }
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "LOCAL_FILL" }
              as: StoreCashier
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
          assert:
            - "HTTP status == 200"
            - "ShopperDelegation.${delegation_id}.status == EXPIRED and superseded_by_delegation_id == null"
            - "SpecialOrder.${order_id}.state == FULFILLED and route == LOCAL_FILL"
            - "SpecialOrder.${order_id}.gross_ship_cents == 0, patron_share_cents == 0, shipping_allowance_cents == 0"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0"
            - "Store.${store_id}.period_close_index == 1 and fund_posture == FROZEN"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

      - name: corner_delegation_from_different_sponsor_supersedes_overlapping_grant
        claim_type: cross_entity
        grounds:
          - state_machines.ShopperDelegation.ACTIVE_to_SUPERSEDED
          - entities.ShopperDelegation.fields.superseded_by_delegation_id
          - state_machines.Sale.CLEARED_to_FLAGGED
        distinguishing_aspect: |
          A second grant for the SAME delegate from a DIFFERENT sponsor is
          accepted rather than rejected: the incumbent delegation becomes
          SUPERSEDED with superseded_by_delegation_id pointing at the winner, and
          the incumbent's OPEN sale is flagged — the opposite outcome to the
