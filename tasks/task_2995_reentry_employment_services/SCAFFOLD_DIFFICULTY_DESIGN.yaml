      - SupportRequest.${sr1_id}.admin_fee_cents == 600 (rate ADMIN_FEE_RATE_T2 0.03 chosen from requested_cents)
      - SupportRequest.${sr1_id}.admin_fee_cents != 1030 (the rate ADMIN_FEE_RATE_T3 0.05 that total_charge_cents
        would select)
