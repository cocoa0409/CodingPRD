# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2410 Professional Certification Body
# Depth test index. Nine §0.5 difficulty rules × 2 instances = 18 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Logical clock DEFAULTS to 2026-08-01T00:00:00Z (POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: item_statistics_pooled_vs_operational_only_diverge_on_identical_accumulators
        grounds:
          - calculations.item_statistics
          - calculations.item_flag_evaluation
          - calculations.blueprint_posture
          - entities.CertificationProgram.fields.psychometric_stat_basis
          - entities.Item.fields.stat_basis_applied
          - entities.Item.fields.p_value
          - entities.Item.fields.discrimination_index
          - state_machines.Item.PRETEST_to_OPERATIONAL
        distinguishing_aspect: |
          Two Items carrying byte-identical pretest and operational accumulators land in
          different states and different statistics purely because their owning programs
          differ on psychometric_stat_basis: POOLED reaches R=40 and computes
          p_value 0.7000 / discrimination_index 0.4545 and promotes PRETEST -> OPERATIONAL,
          while OPERATIONAL_ONLY sees only R=20 < min_responses_for_stats 30, writes
          stat_basis_applied INSUFFICIENT_DATA with p_value null, and the item stays PRETEST.
        test_recipe:
          setup:
            - "Two ACTIVE programs, identical except psychometric_stat_basis (CPX = POOLED, CPY = OPERATIONAL_ONLY); both have domain_specs [{D1, 100, min_operational_items 1}], form_length 1, min_responses_for_stats at its default 30."
            - "One APPROVED Item per program in domain D1, authored by isp-author and approved by isp-rev-1 and isp-rev-2; all twelve response accumulators still 0."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Certified Practitioner X", credential_code: "CPX", jta_version: "JTA-2026.1", domain_specs: [{ domain_code: "D1", weight_pct: 100, min_operational_items: 1 }], form_length: 1, accepted_education_credentials: ["BACHELOR"], psychometric_stat_basis: "POOLED" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { progA_id: $.data.id }
            - call: "POST /programs/${progA_id}/activate"
              payload: { activation_note: "POOLED basis programme" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /programs"
              payload: { name: "Certified Practitioner Y", credential_code: "CPY", jta_version: "JTA-2026.1", domain_specs: [{ domain_code: "D1", weight_pct: 100, min_operational_items: 1 }], form_length: 1, accepted_education_credentials: ["BACHELOR"], psychometric_stat_basis: "OPERATIONAL_ONLY" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { progB_id: $.data.id }
            - call: "POST /programs/${progB_id}/activate"
              payload: { activation_note: "OPERATIONAL_ONLY basis programme" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: { program_id: "${progA_id}", domain_code: "D1", cognitive_level: "APPLICATION", stem: "Pooled-basis anchor item" }
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemA_id: $.data.id }
            - call: "POST /items/${itemA_id}/submit-for-review"
              payload: { revision_note: "first submission" }
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemA_id}/review"
              payload: { decision: "APPROVE", review_note: "content sound" }
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemA_id}/review"
              payload: { decision: "APPROVE", review_note: "second approval" }
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items"
              payload: { program_id: "${progB_id}", domain_code: "D1", cognitive_level: "APPLICATION", stem: "Operational-only anchor item" }
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemB_id: $.data.id }
            - call: "POST /items/${itemB_id}/submit-for-review"
              payload: { revision_note: "first submission" }
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemB_id}/review"
              payload: { decision: "APPROVE", review_note: "content sound" }
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemB_id}/review"
              payload: { decision: "APPROVE", review_note: "second approval" }
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          trigger:
            - call: "POST /items/${itemA_id}/response-batches"
              payload: { is_pretest: true, response_count: 20, correct_count: 18, upper_n: 6, upper_correct: 6, lower_n: 6, lower_correct: 5 }
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /items/${itemA_id}/response-batches"
              payload: { is_pretest: false, response_count: 20, correct_count: 10, upper_n: 5, upper_correct: 5, lower_n: 5, lower_correct: 1 }
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /items/${itemB_id}/response-batches"
              payload: { is_pretest: true, response_count: 20, correct_count: 18, upper_n: 6, upper_correct: 6, lower_n: 6, lower_correct: 5 }
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /items/${itemB_id}/response-batches"
              payload: { is_pretest: false, response_count: 20, correct_count: 10, upper_n: 5, upper_correct: 5, lower_n: 5, lower_correct: 1 }
              as: Psychometrician
              as_user_id: "psy-1"
          assert:
            - "Item.${itemA_id}.pretest_response_count == 20 and Item.${itemA_id}.operational_response_count == 20"
            - "Item.${itemB_id}.pretest_response_count == 20 and Item.${itemB_id}.operational_response_count == 20"
            - "Item.${itemA_id}.stat_basis_applied == POOLED"
            - "Item.${itemA_id}.p_value == 0.7000"
            - "Item.${itemA_id}.discrimination_index == 0.4545"
            - "Item.${itemA_id}.flag_reason == null"
            - "Item.${itemA_id}.status == OPERATIONAL"
            - "Item.${itemB_id}.stat_basis_applied == INSUFFICIENT_DATA"
            - "Item.${itemB_id}.p_value == null"
            - "Item.${itemB_id}.discrimination_index == null"
            - "Item.${itemB_id}.status == PRETEST"
            - "CertificationProgram.${progA_id}.operational_item_count == 1 and CertificationProgram.${progA_id}.blueprint_posture == COMPLETE and CertificationProgram.${progA_id}.deficient_domain_codes == []"
            - "CertificationProgram.${progB_id}.operational_item_count == 0 and CertificationProgram.${progB_id}.blueprint_posture == DEFICIENT and CertificationProgram.${progB_id}.deficient_domain_codes == [\"D1\"]"

      - name: ceu_credit_accrual_carryover_lookback_counts_where_strict_cycle_bars_the_same_activity
        grounds:
          - calculations.ceu_credit_accrual
          - calculations.cycle_credit_reconciliation
          - validations[priority=33]
          - entities.CertificationProgram.fields.ceu_credit_accrual_basis
          - entities.RecertificationCycle.fields.accrual_basis_snapshot
          - entities.RecertificationCycle.fields.credits_applied
          - state_machines.RecertificationCycle.OPEN_to_SATISFIED
        distinguishing_aspect: |
          One and the same CEU claim (activity_date 2026-07-15, LIVE_INSTRUCTION, 12.0
          contact hours) against two cycles that opened on the same day 2026-08-10 is
          accepted and counted for 12.00 credits under accrual_basis_snapshot
          CARRYOVER_ALLOWED (window starts 90 days early at 2026-05-12, cycle bubbles
          OPEN -> SATISFIED) and refused outright with ERR_ACTIVITY_OUTSIDE_CYCLE (422)
          under STRICT_CYCLE (window starts exactly at 2026-08-10), leaving that cycle's
          credits_applied at 0.00 and status OPEN.
        test_recipe:
          setup:
            - "Two ACTIVE single-item programmes identical except ceu_credit_accrual_basis: CPX = CARRYOVER_ALLOWED, CPY = STRICT_CYCLE. Both use cycle_length_months 12, required_ceu_credits 12, min_panelists 1, panel_trim_count 0, audit_every_nth 7, psychometric_stat_basis POOLED, form_length 1, domain_specs [{D1, 100, min_operational_items 1}]."
            - "Each programme has one OPERATIONAL item and one PUBLISHED single-position form whose raw_cut_score computed to 0 (trimmed_mean 0.6, sem 0.0, adjusted 0.6, raw 1, clamped by ceil_cut floor(0.90*1) = 0)."
            - "One APPROVED application per programme (BACHELOR 2020, 36 months experience, audit_sequence_number 1, 1 % 7 != 0 so not audit-sampled)."
            - "One TEST_CENTER session C1/R1 on 2026-08-10T00:00:00Z–04:00:00Z, seat_capacity 5, holding both candidates."
            - "Both candidates sat, scored raw_score 1 -> scaled_score 800 -> PASS, and had their scores reported at clock 2026-08-10T00:00:00Z, minting certificate numbers CPX-2026-00001 and CPY-2026-00001 with cycle 1 OPEN, starts_on 2026-08-10, ends_on 2027-08-10, grace_ends_on 2027-11-08."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Certified Practitioner X", credential_code: "CPX", jta_version: "JTA-2026.1", domain_specs: [{ domain_code: "D1", weight_pct: 100, min_operational_items: 1 }], form_length: 1, accepted_education_credentials: ["BACHELOR"], psychometric_stat_basis: "POOLED", min_panelists: 1, panel_trim_count: 0, audit_every_nth: 7, cycle_length_months: 12, required_ceu_credits: 12, ceu_credit_accrual_basis: "CARRYOVER_ALLOWED" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { progA_id: $.data.id }
            - call: "POST /programs/${progA_id}/activate"
              payload: { activation_note: "carryover programme" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: { program_id: "${progA_id}", domain_code: "D1", cognitive_level: "APPLICATION", stem: "CPX operational item" }
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemA_id: $.data.id }
            - call: "POST /items/${itemA_id}/submit-for-review"
              payload: { revision_note: "first submission" }
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemA_id}/review"
              payload: { decision: "APPROVE" }
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemA_id}/review"
              payload: { decision: "APPROVE" }
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${itemA_id}/response-batches"
              payload: { is_pretest: true, response_count: 40, correct_count: 24, upper_n: 10, upper_correct: 9, lower_n: 10, lower_correct: 3 }
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: { program_id: "${progA_id}", form_code: "FA1", item_ids: ["${itemA_id}"], panelist_user_ids: ["pan-1"], panel_method: "MODIFIED_ANGOFF" }
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { formA_id: $.data.id }
            - call: "POST /forms/${formA_id}/panel-ratings"
