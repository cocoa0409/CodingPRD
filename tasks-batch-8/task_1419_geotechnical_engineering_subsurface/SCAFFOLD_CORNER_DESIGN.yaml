scaffold_corner_design:
  - section: entities
    instances:
      - name: create_client_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Client.fields.contact_email
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required contact_email on client creation fails with ERR_VALIDATION (400); no Client row is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /geo/clients", payload: { name: "No Contact LLC" }, as: FirmAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_VALIDATION"
      - name: project_computed_posture_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.posture
        distinguishing_aspect: "Client-supplied posture=FROZEN on creation is ignored; the computed posture of a fresh project is OPEN."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10, posture: "FROZEN" }, as: FirmAdmin, captures: { p_post: "$.data.posture" } }
          assert:
            - "captured p_post == OPEN (computed field; client input ignored)"
      - name: clearance_defaults_valid_days_14
        claim_type: defaults
        grounds:
          - entities.UtilityClearance.fields.valid_days
          - calculations.clearance_expiry
        distinguishing_aspect: "Omitting valid_days applies the default 14, so a ticket issued 2026-08-01T00:00:00Z expires exactly 2026-08-15T00:00:00Z."
        test_recipe:
          setup: ["Project DRAFT with APPROVED plan and boring B-1"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z" }, as: StaffEngineer, captures: { cl_days: "$.data.valid_days", cl_exp: "$.data.expires_on", cl_st: "$.data.status" } }
          assert:
            - "captured cl_days == 14 (default applied)"
            - "captured cl_exp == 2026-08-15T00:00:00Z"
            - "captured cl_st == FILED (initial state)"
      - name: get_project_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Fetching a never-created project id returns ERR_RESOURCE_NOT_FOUND (404) with the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /geo/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProjectManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_RESOURCE_NOT_FOUND"
      - name: lab_test_result_append_only
        claim_type: immutability
        grounds:
          - entities.LabTestResult
        distinguishing_aspect: "LabTestResult rows are append-only: after a reject/rerun cycle the order owns two result submissions, both discoverable via the filtered list."
        test_recipe:
          setup:
            - "Project FIELDWORK, sample LAB_RECEIVED, MOISTURE_CONTENT order RESULT_SUBMITTED then REJECTED then rerun IN_TEST with a second result submitted"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/samples", payload: { depth_top_ft: 10, depth_bottom_ft: 11.5, sampler_type: "SPT", recovery_pct: 80 }, as: FieldGeologist, captures: { sm_id: "$.data.id" } }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "IN_TRANSIT" }, as: FieldGeologist }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "LAB_RECEIVED" }, as: LabTechnician }
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "MOISTURE_CONTENT", priority: "STANDARD" }, as: LabManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "AUTHORIZED" }, as: LabManager }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "IN_TEST" }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/results", payload: { moisture_content_pct: 22.5 }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "REJECTED" }, as: LabManager }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "IN_TEST" }, as: LabTechnician }
          trigger:
            - { call: "POST /geo/lab-test-orders/${o_id}/results", payload: { moisture_content_pct: 22.7 }, as: LabTechnician }
            - { call: "GET /geo/lab-test-results", payload: { lab_test_order_id: "${o_id}" }, as: LabManager, captures: { r0_ord: "$.data[0].lab_test_order_id", r1_ord: "$.data[1].lab_test_order_id" } }
          assert:
            - "captured r0_ord == ${o_id} and r1_ord == ${o_id} (two immutable submissions retained, none overwritten)"

  - section: state_machines
    instances:
      - name: plan_approve_rejected_when_plan_already_active
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BoringPlan.SUBMITTED_to_APPROVED
          - errors[ERR_PLAN_ALREADY_ACTIVE]
        distinguishing_aspect: "Approving a second SUBMITTED plan while the first is APPROVED fails with ERR_PLAN_ALREADY_ACTIVE; the first plan stays APPROVED."
        test_recipe:
          setup: ["Project DRAFT with plan PL-1 APPROVED and plan PL-2 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl1_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl1_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl1_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: ProjectManager, captures: { p_v2: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 2, planned_total_footage_ft: 60, expected_project_version: "${p_v2}" }, as: StaffEngineer, captures: { pl2_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl2_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
          trigger:
            - { call: "POST /geo/boring-plans/${pl2_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_PLAN_ALREADY_ACTIVE"
      - name: locked_plan_rejects_direct_boring_create
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=5]
          - errors[ERR_PLAN_NOT_EDITABLE]
        distinguishing_aspect: "Once the first drill locks the plan, direct boring creation fails with ERR_PLAN_NOT_EDITABLE; offsets are the only channel."
        test_recipe:
          setup: ["Project FIELDWORK, boring B-1 DRILLED (plan now LOCKED)"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "GET /geo/boring-plans/${pl_id}", payload: {}, as: StaffEngineer, captures: { pl_st: "$.data.status" } }
          trigger:
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-2", planned_depth_ft: 25 }, as: StaffEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "captured pl_st == LOCKED (system side effect of first drill)"
            - "captured err == ERR_PLAN_NOT_EDITABLE"
      - name: offset_create_from_non_refused_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFSET_PARENT_NOT_REFUSED]
          - entities.Boring.fields.offset_of_boring_id
        distinguishing_aspect: "The offset parent must be REFUSED; creating an offset from a DRILLED boring fails with ERR_OFFSET_PARENT_NOT_REFUSED (422, referential)."
        test_recipe:
          setup: ["Project FIELDWORK, boring B-1 DRILLED (not REFUSED)"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /geo/borings/${b_id}/offsets", payload: { boring_no: "B-1A", planned_depth_ft: 30 }, as: StaffEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_OFFSET_PARENT_NOT_REFUSED"
      - name: offset_consumes_authorization_then_exhausts
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExplorationAuthorization.APPROVED_to_EXHAUSTED
          - errors[ERR_EXTRA_BORINGS_EXHAUSTED]
        distinguishing_aspect: "An over-plan offset consumes the single authorized extra boring (consumed_boring_count 0 -> 1, authorization APPROVED -> EXHAUSTED); a second over-plan offset fails with ERR_EXTRA_BORINGS_EXHAUSTED."
        test_recipe:
          setup: ["Project FIELDWORK, plan planned_boring_count=1, boring B-1 REFUSED at 18 ft, APPROVED authorization with extra_boring_count=1"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 18, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "REFUSED", refusal_depth_ft: 18 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/projects/${p_id}/exploration-authorizations", payload: { authorized_amount_cents: 100000, extra_boring_count: 1 }, as: ProjectManager, captures: { au_id: "$.data.id" } }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: ProjectManager, captures: { pv1: "$.data.version" } }
            - { call: "POST /geo/exploration-authorizations/${au_id}/transition", payload: { to: "APPROVED", expected_project_version: "${pv1}" }, as: ClientRep, as_user_id: "${c_id}" }
