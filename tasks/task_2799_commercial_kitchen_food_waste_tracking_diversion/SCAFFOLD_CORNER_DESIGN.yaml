              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 3000, loss_reason: "PLATE_WASTE", captured_at: "2026-08-01T10:30:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "HTTP 422 with data.error_id == \"ERR_LOSS_REASON_STATION_MISMATCH\" — PLATE_WASTE is only accepted at a DISH_RETURN station"
            - "GET /shifts/${shift_id} still reads shift_waste_grams == 1000 and waste_intensity_kg_per_1k_meals == 4.000"
            - "GET /sites/${site_id} still reads total_captured_weight_grams == 1000, valued_waste_cost_cents == 640 and version == ${site_v_before}"
            - "GET /waste-entries?shift_id=${shift_id} returns total_count == 1"
