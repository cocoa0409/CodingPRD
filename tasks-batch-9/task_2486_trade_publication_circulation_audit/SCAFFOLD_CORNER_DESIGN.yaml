          - entities.Publication.fields.undeliverable_restrict_pct
        distinguishing_aspect: "Two posture clauses fire at once (undeliverable 16.67 percent >= 5.00 would say RESTRICTED; an open CRITICAL finding says FROZEN) and the pinned clause order must return FROZEN — the strictly stronger posture — not the last clause evaluated."
        test_recipe:
          setup:
            - "publication with default thresholds and two CONTROLLED recipients: 500 copies and 100 copies"
            - "a FILED statement for [2026-05-01, 2026-08-01) under audit with sample_size 2 (engagement stays in fieldwork)"
