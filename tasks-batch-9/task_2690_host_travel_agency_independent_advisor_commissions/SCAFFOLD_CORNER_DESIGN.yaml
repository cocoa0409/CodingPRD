        grounds:
          - validations[priority=60]
          - validations[priority=68]
          - validations[priority=96]
          - errors[ERR_CREDENTIAL_FIELDS_INCOHERENT]
          - errors[ERR_INVALID_DATE_RANGE]
          - errors[ERR_CLOCK_REWIND_FORBIDDEN]
        distinguishing_aspect: "Polymorphic credential shape (422), non-positive date ranges on two different entities (422) and a backwards logical clock (422) are three separate rules on three separate endpoints, each returning its own error_id."
        test_recipe:
          setup:
            - "One DRAFT advisor in NY and one supplier; nothing needs to be ACTIVE because all three rules fire before any state gate on their endpoints."
            - "The logical clock is first advanced to 2026-08-15T00:00:00Z so that a rewind target exists."
          setup_api_calls:
            - call: "POST /host-agency/suppliers"
              payload: { name: "Meridian Air", accreditation_scheme: "ARC", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 9000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: HostOperations
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-77001", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000, jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { err_shape_eo: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-77002", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { err_shape_sot: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-77003", effective_on: "2026-06-01", expires_on: "2026-06-01" }
              as: HostOperations
              captures: { err_dates_cred: $.data.error_id }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T23:59:59Z" }
              as: HostOperations
              captures: { err_rewind: $.data.error_id }
            - call: "POST /host-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: HostOperations
              captures: { same_instant_clock: $.data.current_utc }
          assert:
            - "EO CARRYING A STATE: HTTP 422 and err_shape_eo == ERR_CREDENTIAL_FIELDS_INCOHERENT"
            - "SOT WITHOUT A STATE: HTTP 422 and err_shape_sot == ERR_CREDENTIAL_FIELDS_INCOHERENT"
            - "EMPTY CREDENTIAL INTERVAL: HTTP 422 and err_dates_cred == ERR_INVALID_DATE_RANGE because expires_on must be strictly greater than effective_on"
            - "CLOCK REWIND: HTTP 422 and err_rewind == ERR_CLOCK_REWIND_FORBIDDEN"
            - "EQUAL INSTANT IS LEGAL: same_instant_clock == \"2026-08-15T00:00:00Z\" — the rule only forbids moving backwards"
            - "no ComplianceCredential row exists for ${adv_id} after the three rejections"

