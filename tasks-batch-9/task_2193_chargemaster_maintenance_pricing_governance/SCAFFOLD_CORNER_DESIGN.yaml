            - call: "GET /chargemaster/payer-contracts/${ct_a}"
              payload: {}
              as: ContractManager
              captures: { a_after: $.data.status }
            - call: "GET /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { act0: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /chargemaster/payer-contracts/${ct_a}"
              payload: {}
              as: ContractManager
              captures: { a_rewound: $.data.status }
          assert:
