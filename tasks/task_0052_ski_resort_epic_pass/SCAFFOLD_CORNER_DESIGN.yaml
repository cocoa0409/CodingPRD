              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Immed Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-13" }
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { rem: $.data.buddy_tickets_remaining }
          assert:
            - "Pass.${pass_id}.buddy_tickets_remaining == 1"
