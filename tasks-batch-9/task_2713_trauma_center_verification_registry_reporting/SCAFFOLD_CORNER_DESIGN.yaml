          - entities.ActivationCriteriaTier.fields.tier_code
          - entities.TraumaCenter.fields.registry_excluded_case_count
        distinguishing_aspect: "The BELOW_INJURY_THRESHOLD branch requires both effective_iss < 4 and tier_code TIER_3_CONSULT: an ISS 3 consult case is EXCLUDED on creation while an ISS 3 case on the TIER_1_FULL tier is INCLUDED, so the exclusion is conjunctive, not ISS-only."
        test_recipe:
          setup:
            - "one trauma center carrying both a TIER_3_CONSULT tier and a TIER_1_FULL tier"
            - "no cases exist yet, so both cohort counters start at 0"
          setup_api_calls:
