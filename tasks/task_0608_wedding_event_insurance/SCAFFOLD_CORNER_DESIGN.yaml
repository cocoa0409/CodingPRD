# =============================================================================
# Task 0608 — Wedding & Special-Event Insurance
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 Coverage Index for Non-Difficulty Tests)
#
# Breadth probe. Uses the same canonical fixture conventions as
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Default logical clock = 2026-01-01T00:00:00Z.
# excluded_because: stubs cite §1.8 instances by name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_initial_states
        claim_type: Creation
        grounds:
          - entities.Policy.fields.lifecycle_status
          - entities.Policy.fields.billing_status
          - endpoints
        distinguishing_aspect: "POST /policies with policy_form=SINGLE_EVENT returns 201; lifecycle_status==QUOTED, billing_status==UNPAID, total_premium_cents==0, policyholder_id set from X-User-ID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
          assert:
            - "http_status == 201"
            - "Policy.${policy_id}.lifecycle_status == QUOTED"
            - "Policy.${policy_id}.billing_status == UNPAID"
            - "Policy.${policy_id}.total_premium_cents == 0"
            - "Policy.${policy_id}.policyholder_id == ph-1"

      - name: create_policy_default_free_look_days_applied
        claim_type: Defaults
        grounds:
          - entities.Policy.fields.free_look_days
        distinguishing_aspect: "Omitting free_look_days defaults to 15 on the created policy."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policy_form: "ANNUAL" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
          assert:
            - "Policy.${policy_id}.free_look_days == 15"
            - "Policy.${policy_id}.serves_alcohol == false"

      - name: create_policy_missing_policy_form_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Policy.fields.policy_form
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Missing required field policy_form → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { serves_alcohol: true }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: create_policy_invalid_enum_policy_form_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Policy.fields.policy_form
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "policy_form not in {SINGLE_EVENT, ANNUAL} → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policy_form: "MONTHLY" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: get_policy_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /policies/{id} with a random UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: coverage_rated_premium_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Coverage.fields.rated_premium_cents
          - calculations.rated_coverage_premium
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: "rated_premium_cents is server-computed at bind: a single CANCELLATION coverage at attendance 150 yields rated_premium_cents==65000 regardless of any client value."
        test_recipe:
          setup: ["Quoted SINGLE_EVENT policy with one CANCELLATION coverage and one event profile (attendance 150)."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { canc_cov_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          assert:
            - "Coverage.${canc_cov_id}.rated_premium_cents == 65000"
            - "Coverage.${canc_cov_id}.status == ACTIVE"

      - name: rider_premium_clamp_ceiling_on_high_value
        claim_type: Computed Fields
        grounds:
          - entities.Rider.fields.rider_premium_cents
          - calculations.rider_premium
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: "A GIFTS rider scheduled at 5000000 yields raw 75000 clamped DOWN to RIDER_MAX_PREMIUM 50000 at bind."
        test_recipe:
          setup: ["Quoted policy with one CANCELLATION coverage, one event profile, and one GIFTS rider scheduled 5000000."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/riders"
              payload: { rider_type: "GIFTS", scheduled_value_cents: 5000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          assert:
            - "Rider.${rider_id}.rider_premium_cents == 50000"
            - "Rider.${rider_id}.status == ACTIVE"

      - name: list_policies_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /policies returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One created policy."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policy_form: "ANNUAL" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "GET /policies"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array"
            - "response.meta.total_count >= 1"
            - "response.meta.has_more in {true,false}"

      - name: event_profile_invalid_window_end_before_start
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_EVENT_WINDOW]
        distinguishing_aspect: "event_end_at not strictly after event_start_at → ERR_INVALID_EVENT_WINDOW (422)."
        test_recipe:
          setup: ["A quoted policy and a VENUE vendor."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Bad Window", venue_vendor_id: "${venue_id}", expected_attendance: 100, event_start_at: "2026-08-01T23:00:00Z", event_end_at: "2026-08-01T18:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_EVENT_WINDOW"
            - "http_status == 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: bind_policy_with_no_coverage_selected_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - errors[ERR_NO_COVERAGE_SELECTED]
        distinguishing_aspect: "Binding a policy that has an event profile but zero SELECTED coverages → ERR_NO_COVERAGE_SELECTED (422); policy stays QUOTED."
        test_recipe:
          setup: ["Quoted SINGLE_EVENT policy with one event profile and no coverages."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NO_COVERAGE_SELECTED"
            - "http_status == 422"
            - "Policy.${policy_id}.lifecycle_status == QUOTED"

      - name: bind_policy_with_no_event_profile_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - errors[ERR_NO_EVENT_PROFILE]
        distinguishing_aspect: "Binding a policy with a SELECTED coverage but no event profile → ERR_NO_EVENT_PROFILE (422)."
        test_recipe:
          setup: ["Quoted policy with one CANCELLATION coverage and no event profile."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NO_EVENT_PROFILE"
            - "http_status == 422"

      - name: activate_coverage_before_payment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.BOUND_to_IN_FORCE
          - errors[ERR_PREMIUM_UNPAID]
        distinguishing_aspect: "activate-coverage on a BOUND but UNPAID policy → ERR_PREMIUM_UNPAID (409); lifecycle stays BOUND."
        test_recipe:
          setup: ["A bound, UNPAID policy with one CANCELLATION coverage."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          trigger:
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PREMIUM_UNPAID"
            - "http_status == 409"
            - "Policy.${policy_id}.lifecycle_status == BOUND"

      - name: bind_already_bound_policy_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - errors[ERR_POLICY_NOT_QUOTED]
        distinguishing_aspect: "A second bind on an already-BOUND policy → ERR_POLICY_NOT_QUOTED (409) (idempotency / invalid-from)."
        test_recipe:
          setup: ["A bound policy with one CANCELLATION coverage and an event profile."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
          trigger:
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_POLICY_NOT_QUOTED"
            - "http_status == 409"

      - name: approve_claim_in_denied_terminal_state_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - errors[ERR_CLAIM_NOT_SUBMITTED]
        distinguishing_aspect: "After a claim is DENIED (terminal), approve is rejected with ERR_CLAIM_NOT_SUBMITTED (409); no side effects fire."
        test_recipe:
          setup: ["In-force policy with ACTIVE CANCELLATION coverage; a claim SUBMITTED with one document, then DENIED."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { canc_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${canc_cov_id}", claim_type: "CANCELLATION", claimed_amount_cents: 1000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "INVOICE", file_uri: "s3://docs/inv.pdf" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/claims/${claim_id}/deny"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CLAIM_NOT_SUBMITTED"
            - "http_status == 409"
            - "Claim.${claim_id}.status == DENIED"

      - name: resubmit_without_new_documentation_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Claim.INFO_REQUESTED_to_SUBMITTED
          - validations[priority=19]
          - errors[ERR_NO_NEW_DOCUMENTATION]
        distinguishing_aspect: "Resubmit while in INFO_REQUESTED with no document added since entering INFO_REQUESTED → ERR_NO_NEW_DOCUMENTATION (422)."
        test_recipe:
          setup: ["In-force policy with ACTIVE CANCELLATION coverage; a claim with one original document, requested-info, no new document."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { canc_cov_id: $.data.id }
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/claims"
              payload: { coverage_id: "${canc_cov_id}", claim_type: "CANCELLATION", claimed_amount_cents: 1000000 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { claim_id: $.data.id }
            - call: "POST /policies/${policy_id}/claims/${claim_id}/documents"
              payload: { doc_type: "INVOICE", file_uri: "s3://docs/inv.pdf" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/claims/${claim_id}/request-info"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /policies/${policy_id}/claims/${claim_id}/resubmit"
              payload: {}
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NO_NEW_DOCUMENTATION"
            - "http_status == 422"
