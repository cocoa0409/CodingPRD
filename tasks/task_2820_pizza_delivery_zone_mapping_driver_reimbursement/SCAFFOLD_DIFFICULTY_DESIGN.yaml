      - name: delivery_charge_tier_then_waiver_ordering_yields_275
        grounds:
          - calculations.customer_delivery_charge
          - calculations.zone_state_classification
          - entities.Order.fields.delivery_fee_cents
          - entities.Order.fields.base_delivery_fee_cents
          - entities.Order.fields.fee_waiver_pct
          - entities.Order.fields.total_charge_cents
        distinguishing_aspect: |
          customer_delivery_charge composes four independent steps whose order is
          pinned: classify the drive-time tier, add the tier surcharge to the
          store base fee, apply the food-subtotal waiver percentage to that
          COMBINED base, and only then total the order. A MID-tier order
          (drive 25 minutes) with a 2000 cent food subtotal gives
          (399 + 150) * 50% = 274.5 -> 275 charged. Applying the waiver to the
          store fee alone gives 200, applying the waiver before the surcharge
          gives 350, and applying the waiver to the food subtotal instead gives
          549. Only the pinned composition gives 275 and a 2275 total.
        test_recipe:
          setup:
            - "A store with base delivery_fee_cents 399 and the ceiling-40 zone model."
            - "One IN_ZONE address at grid 6.33 miles, which classifies as drive 25 minutes and therefore the MID surcharge tier of 150 cents."
            - "The clock is off-peak so no peak surcharge minutes apply."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
