            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p2: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
