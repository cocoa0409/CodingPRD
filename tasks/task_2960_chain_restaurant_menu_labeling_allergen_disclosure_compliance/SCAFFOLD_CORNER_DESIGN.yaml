  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_writes
        claim_type: exclusive_operations
        grounds:
          - rbac.PlatformAdmin.exclusive_operations
          - rbac.BrandComplianceOfficer.exclusive_operations
          - rbac.NutritionAnalyst.exclusive_operations
          - rbac.MenuboardPublisher.exclusive_operations
          - rbac.StateRegulator.exclusive_operations
        distinguishing_aspect: "One walk touches at least one exclusive write of all five roles - brand and clock (PlatformAdmin), menu item and variance filing (BrandComplianceOfficer), recipe and certification (NutritionAnalyst), board and listing (MenuboardPublisher), variance decision and citation (StateRegulator) - and every one of them succeeds when issued by its owner."
        test_recipe:
          setup:
            - "Nothing pre-existing; the walk builds the estate as it goes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "NY-VAR", name: "New York", preemption_mode: "VARIANCE_ALLOWED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 20, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "NY-B" }
              as: PlatformAdmin
              captures: { est: $.data.first_created_establishment_id }
          trigger:
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Sandwich as served", role: "BASE", grams: 100, calories_per_100g: 100, sodium_mg_per_100g: 200, added_sugar_g_per_100g: 0, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Database values verified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "PRIMARY_MENU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { board: $.data.id }
            - call: "POST /menu-boards/${board}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /variance-requests"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", requirement_code: "SUCCINCT_STATEMENT", justification: "Signage vendor delay", requested_start_date: "2026-09-01", requested_end_date: "2026-09-30" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { vr: $.data.id }
            - call: "POST /variance-requests/${vr}/decision"
              payload: { decision: "OPEN_REVIEW", decision_note: "Docketed" }
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "POST /enforcement-actions"
              payload: { establishment_id: "${est}", citation_code: "CALORIES_NOT_DECLARED", inspection_note: "Routine inspection" }
              as: StateRegulator
              as_user_id: "${juris}"
              captures: { action: $.data.id }
          assert:
            - "every trigger returns its endpoint's declared success_code (201 for creations, 200 for decisions and transitions) and no trigger returns 401, 403 or 409"
            - "MenuItem.${item}.labeling_status == DECLARED after trigger[4] - the analyst pair completed certification"
            - "MenuBoard.${board}.listing_count == 1 after trigger[6]"
            - "VarianceRequest.${vr}.status == UNDER_REVIEW after trigger[8]"
            - "EnforcementAction.${action}.status == OPEN with citation_code == CALORIES_NOT_DECLARED after trigger[9]"

      - name: shared_writes_accept_both_owners_and_reads_accept_every_role
        claim_type: shared_operations
        grounds:
          - rbac.PlatformAdmin.shared_operations
          - rbac.BrandComplianceOfficer.shared_operations
          - endpoints[POST /establishments]
          - endpoints[POST /establishments/{id}/status-changes]
        distinguishing_aspect: "The two shared write surfaces accept either owner interchangeably - PlatformAdmin registers one unit and the brand's own officer registers the next, then each moves a unit's status - while GET /brands/{id} answers for all five roles because reads are never ownership-scoped."
        test_recipe:
          setup:
            - "One jurisdiction, one brand, and one unit registered by PlatformAdmin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0002", unit_status: "OPERATING", operates_under_brand_name: true }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { e2: $.data.id }
            - call: "POST /establishments/${e1}/status-changes"
              payload: { new_unit_status: "TEMPORARILY_CLOSED", effective_note: "Remodel" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /establishments/${e2}/status-changes"
              payload: { new_unit_status: "TEMPORARILY_CLOSED", effective_note: "Remodel" }
              as: PlatformAdmin
            - call: "GET /brands/${brand}"
              payload: {}
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "GET /brands/${brand}"
              payload: {}
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "GET /brands/${brand}"
              payload: {}
              as: MenuboardPublisher
              as_user_id: "${e1}"
          assert:
            - "trigger[0] response HTTP status == 201 - the brand's own officer may register a unit, exactly as PlatformAdmin did in setup"
            - "trigger[1] and trigger[2] both return HTTP status == 200 with data.unit_status == TEMPORARILY_CLOSED - the shared transition works from either side"
            - "trigger[3], trigger[4] and trigger[5] all return HTTP status == 200 with data.id == ${brand} - a regulator, an analyst and a publisher of an unrelated scope may all read the brand"
            - "Brand.${brand}.counted_unit_count == 0 after trigger[2] - the OPERATING_ONLY basis excludes both closed units"

      - name: missing_x_user_id_unknown_role_wrong_role_and_foreign_scope_are_each_rejected
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_MISSING_AUTH]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: "The four auth layers answer in strict order on the same endpoint: an absent X-User-ID yields ERR_MISSING_AUTH (401) even with a valid role, an unknown role string yields ERR_INVALID_ROLE (401) and never ERR_UNAUTHORIZED, a valid but unauthorised role yields ERR_UNAUTHORIZED (403) even when the target belongs to someone else, and only a role that clears RBAC can reach the ownership check and receive ERR_FORBIDDEN_SCOPE (403)."
        test_recipe:
          setup:
            - "Two brands with one unit each, so a foreign-scope target exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand_a: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Silver Spoon Group LLC", doing_business_as: "Silver Spoon" }
              as: PlatformAdmin
              captures: { brand_b: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand_a}", jurisdiction_id: "${juris}", unit_label: "ID-A-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est_a: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand_b}", jurisdiction_id: "${juris}", unit_label: "ID-B-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est_b: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { brand_id: "${brand_a}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: ""
              captures: { e_auth: $.data.error_id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand_a}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: WarehouseClerk
              as_user_id: "${brand_a}"
              captures: { e_role: $.data.error_id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand_b}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: MenuboardPublisher
              as_user_id: "${est_a}"
              captures: { e_unauth: $.data.error_id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand_b}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand_a}"
              captures: { e_scope: $.data.error_id }
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est_b}", board_type: "PRIMARY_MENU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est_a}"
              captures: { e_scope_board: $.data.error_id }
            - call: "GET /brands/${brand_b}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand_a}"
          assert:
            - "trigger[0] is sent with a valid X-User-Role and an empty X-User-ID and returns HTTP status == 401 with data.error_id == ERR_MISSING_AUTH"
            - "trigger[1] is sent with the unknown role string WarehouseClerk and returns HTTP status == 401 with data.error_id == ERR_INVALID_ROLE, not ERR_UNAUTHORIZED"
            - "trigger[2] response HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED - RBAC is checked before ownership even though the target brand is also foreign"
            - "trigger[3] response HTTP status == 403 and data.error_id == ERR_FORBIDDEN_SCOPE - the role is right, the acting brand is not"
            - "trigger[4] response HTTP status == 403 and data.error_id == ERR_FORBIDDEN_SCOPE - a publisher may only create boards for its own unit"
            - "trigger[5] response HTTP status == 200 - reads are open to every known role and are never ownership-scoped"
            - "Brand.${brand_a}.standard_item_count == 0 and Brand.${brand_b}.standard_item_count == 0 - no rejected write left a row behind"

      - name: the_submitting_analyst_cannot_certify_but_may_reject
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=18]
          - errors[ERR_SAME_USER_CERTIFICATION]
          - rbac.NutritionAnalyst.segregation_of_duties
        distinguishing_aspect: "Separation is decision-specific rather than blanket: analyst-1 who submitted the analysis is refused a CERTIFY with ERR_SAME_USER_CERTIFICATION (403) but is allowed to REJECT the very same analysis, and a second analyst may then certify the resubmitted recipe."
        test_recipe:
          setup:
            - "One brand with one STANDARD item whose first recipe carries a base component and is submitted by analyst-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
