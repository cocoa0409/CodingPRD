            - "?phase=POST on AHU-1 returns an empty array with total_count == 0"
            - "${t_status} == ACCEPTED, ${norm25} == 300.00 and ${per100} == 15.00 (300.00 / 2000 sqft * 100)"
            - "Project.${proj_id}.duct_system_count == 2 and eligible_duct_system_count == 1 after the exclusion"

      - name: combustion_test_list_filters_on_the_computed_verdict
        claim_type: computed_read
        grounds:
