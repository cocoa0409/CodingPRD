            - { call: "POST /iz-compliance/projects/${pb_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-2", captures: { pb_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pa_id}", basis: "FULL", expected_project_version: "${pa_v}" }, as: ProgramAdministrator, captures: { fa_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pb_id}", basis: "FULL", expected_project_version: "${pb_v}" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { fb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-02T00:00:00Z" }, as: Resident, as_user_id: "${h1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-03T00:00:00Z" }, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Rejected Registrant", household_size: 2, gross_annual_income_cents: 5000000 }, as: Developer, as_user_id: "dev-1", captures: { e1: $.data.error_id } }
            - { call: "POST /iz-compliance/projects/${pa_id}/screen", payload: {}, as: Resident, as_user_id: "${h1_id}", captures: { e2: $.data.error_id } }
          assert:
            - "screening by HousingComplianceOfficer and by ProgramAdministrator return identical derived outputs: both 200 with applicability SUBJECT, required_affordable_units 2, fractional_obligation_bps 0, total_obligation_bps 20000 and screen_count 1"
            - "household registration by either permitted role returns 201 with state REGISTERED, and both households are visible to the other role's list read"
            - "fee assessment by ProgramAdministrator and by HousingComplianceOfficer both return 201 with assessed_amount_cents 48934800, unit_equivalent_bps 20000 and due_date 2026-09-15 — the assessing role does not enter the arithmetic"
            - "the clock accepts Resident (X-User-ID is the household id ${h1_id}) and FundAuditor alike, each returning 200 with the new current_utc; the read-only role may still move the clock because that endpoint is shared by all five roles"
            - "a Developer registering a household returns 403 ERR_UNAUTHORIZED and a Resident screening a project returns 403 ERR_UNAUTHORIZED — the sharing is between exactly the two named roles, not open to all"
            - "the refused calls change nothing: the household list total_count is 2 and Project.${pa_id}.screen_count is still 1"

  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers (Table 8): one row per active
  # layer declared in §1.0.3. The optimistic_concurrency layer is covered here
  # because both OCC guards have error ids no other section triggers; the other
  # three layers are already exhausted by §1.8 and are recorded as exclusions.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_project_view_is_refused_before_the_project_state_is_even_considered
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fee-assess-stale-project
          - errors[ERR_STALE_PROJECT_VERSION]
          - validations.priority_8
        distinguishing_aspect: |
          The OCC guard exists because assessing a fee SUPERSEDES the project's open assessment, so
          a writer holding a stale view could silently retire an assessment it never saw. The guard
          therefore has to reject the second assessment that quotes the version read before the
          first assessment landed, and the retry with the re-read version must both succeed AND
          perform the supersession. Its priority-8 seat is observable on a second project: a DRAFT
          project with no elected path quoting a stale version yields 412 ERR_STALE_PROJECT_VERSION
          rather than the 409 ERR_INVALID_PROJECT_STATE that a priority-9-first implementation
          would return.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project PA (R-2, 20 units, dev-1) screened SUBJECT and IN_LIEU_FEE elected; the version returned by elect-path is captured as the client's view."
            - "Project PB (R-2, 20 units, dev-2) left in DRAFT with no screening and no elected path; its create version is captured."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Stale View A", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { pa_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${pa_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${pa_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1", captures: { pa_v0: $.data.version } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Stale View B", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-2", captures: { pb_id: $.data.id, pb_v0: $.data.version } }
          trigger:
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pa_id}", basis: "FULL", expected_project_version: "${pa_v0}" }, as: ProgramAdministrator, captures: { f1_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pa_id}", basis: "FULL", expected_project_version: "${pa_v0}" }, as: ProgramAdministrator, captures: { e1: $.data.error_id } }
            - { call: "GET /iz-compliance/projects/${pa_id}", payload: {}, as: ProgramAdministrator, captures: { pa_v1: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pa_id}", basis: "FULL", expected_project_version: "${pa_v1}" }, as: ProgramAdministrator, captures: { f2_id: $.data.id } }
            - { call: "GET /iz-compliance/in-lieu-fees/${f1_id}", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "PATCH /iz-compliance/projects/${pb_id}", payload: { name: "Stale View B renamed" }, as: Developer, as_user_id: "dev-2" }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pb_id}", basis: "FULL", expected_project_version: "${pb_v0}" }, as: ProgramAdministrator, captures: { e2: $.data.error_id } }
          assert:
            - "the first assessment succeeds with 201, assessed_amount_cents 48934800 and unit_equivalent_bps 20000, and it advances Project.${pa_id}.version so ${pa_v1} > ${pa_v0}"
            - "the second assessment quoting the pre-assessment version returns 412 ERR_STALE_PROJECT_VERSION"
            - "the rejected assessment created nothing and superseded nothing: the fee list for ${pa_id} has total_count 1 and ${f1_id} is still in its assessed state with superseded_by_fee_id null"
            - "the retry quoting the re-read ${pa_v1} returns 201 as ${f2_id}, and the audit read of ${f1_id} now shows state SUPERSEDED with superseded_by_fee_id ${f2_id} — the supersession only happens on the fresh-version write"
            - "for the DRAFT project the stale-version assessment returns 412 ERR_STALE_PROJECT_VERSION, NOT 409 ERR_INVALID_PROJECT_STATE, even though a DRAFT project with no elected path could never be assessed — priority 8 precedes priority 9"
            - "Project.${pb_id} is still in DRAFT with compliance_path null and no fee row exists for it"

      - name: a_stale_unit_view_is_refused_before_the_enforcement_safety_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.resale-create-stale-unit
          - errors[ERR_STALE_UNIT_VERSION]
          - validations.priority_8
        distinguishing_aspect: |
          The unit guard protects the same supersession hazard on a different parent, and it is the
          only place ERR_STALE_UNIT_VERSION is reachable. The monitoring cascade is what makes the
          ordering claim sharp: issuing a finding bumps the unit version as a SIDE EFFECT of a
          write to another entity, so a resale client that read the unit before the review holds a
          stale version through no fault of its own — and on a unit escalated all the way to
          OUT_OF_COMPLIANCE it must still see 412 ERR_STALE_UNIT_VERSION rather than the
          priority-22 422, which only surfaces once the version is refreshed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
