          trigger:
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              captures: { err: $.data.error_id }
          assert:
            - "The trigger carries no identity headers at all"
            - "HTTP 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "GET /standards (as AccessibilityLead) returns total_count == 0"

      - name: corner_publish_with_unvalidated_category_returns_coverage_gap
        claim_type: violation_to_error
        grounds:
