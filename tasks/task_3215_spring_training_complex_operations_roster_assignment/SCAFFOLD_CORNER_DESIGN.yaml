            - "the second confirm returns status 412 with error_id ERR_STALE_VERSION"
            - "GameSchedule.${gm}.version == ${gm_fresh} + 1 after the first confirm"
            - "GameParticipation.${g2}.participation_status is still SCHEDULED"

