            - "CensusBatch.${batch_id} status after re-posting participants == UPLOADED (revision loop re-entry)"
            - "CensusBatch.${batch_id}.participant_count == 3 after correction post"
            - "Final CensusBatch.${batch_id}.status == LOCKED after second screening (VALIDATED) then lock"

      - name: pbgc_filing_amend_cycle
        grounds:
          - state_machines.PBGCFiling.transitions.DRAFT_to_FILED
          - state_machines.PBGCFiling.transitions.FILED_to_AMENDED
          - state_machines.PBGCFiling.transitions.AMENDED_to_FILED
        distinguishing_aspect: |
          PBGCFiling runs a DRAFT -> FILED -> AMENDED -> FILED amend cycle
          driven by a superseding certification — a non-linear loop on a third
          entity, distinct from assumption-set and census cycles.
        test_recipe:
