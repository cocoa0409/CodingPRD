            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-S03", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "NEXT_OF_KIN", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Aunt Mirela" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == \"ERR_DONOR_STATE_INVALID\""
            - "Donor.${donor_id}.consent_scope == \"NONE\" and Donor.${donor_id}.status == \"REFERRED\" and Donor.${donor_id}.version == 1"

      - name: a_second_consent_on_a_consented_donor_yields_err_donor_state_invalid
        claim_type: idempotency
        grounds:
          - state_machines.Donor.SCREENING_to_CONSENT_OBTAINED
          - validations.priority_11
          - "errors[ERR_DONOR_STATE_INVALID]"
        distinguishing_aspect: |
          Re-running the same consent trigger from CONSENT_OBTAINED is refused 409 rather than
          silently re-stamping consent_obtained_at: the second call must not overwrite
          authorizing_party_name and must not bump the donor's version past 3.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in CONSENT_OBTAINED, consent_scope TRANSPLANT_ONLY, authorizing party 'Aunt Mirela', version 3"
          setup_api_calls:
